      output: "# Reviewer Output — Redis fixed-TTL silent expiry of interview runtime\
        \ state\n\nReviewer: Database Engineer / Code Reviewer\nScope: `InterviewStateStore.java`\
        \ + `InterviewService.java` (interview state machine) vs `interview_session`\
        \ table\n\n## TL;DR\n\nThe premise is half-right and the current code is more\
        \ resilient than it looks. Because the DB row (`interview_session.status /\
        \ question_count / current_question_id`) mirrors the Redis state, bare TTL\
        \ expiry on an *idle* session mostly **self-heals** via the fallback in `InterviewService.requireAsking()`\
        \ (`:382-389`). The real continuity breaks come from the **dual-source-of-truth\
        \ design + fixed absolute TTL**, which tear Redis and DB apart *silently*.\
        \ The single-authority claim in `InterviewStateStore` (`:15`) is false and\
        \ is the root defect.\n\n## Root cause\n\n1. **Fixed, absolute TTL, not sliding.**\
        \ `InterviewStateStore.write()` always issues `set(json, TTL_HOURS, HOURS)`\
        \ with `TTL_HOURS = 24` (`:25, :51`). It refreshes only when a caller *writes*.\
        \ There is **no TTL reset on read** and **no idle-refresh latch**, so any\
        \ in-progress session idle > 24 h between writes loses its hot key.\n\n2.\
        \ **Two independent sources of truth.** Redis holds `SessionState(status,\
        \ questionCount, currentQuestionId)`; the DB holds the same fields. The state\
        \ machine advances by **two non-atomic writes** in `answer`/`answerStream`:\n\
        \   - `sessionMapper.updateById(session)` commits the new transition to DB,\n\
        \   - then `stateStore.write(...)` sets Redis **with a brand-new TTL**.\n\
        \   A crash/exception between the two, or Redis-after-DB, leaves them divergent\
        \ with *different* expiry clocks.\n\n## When continuation actually breaks\
        \ (and why)\n\nThe `answer`/`answerStream` guard is `requireAsking()`, whose\
        \ null branch rehydrates from DB and re-writes Redis (`:382-389`). So expiry\
        \ alone does **not** block continuation in the happy path — this is the important\
        \ correction to the reported bug. Continuation genuinely fails in these cases:\n\
        \n- **(A) Divergence-then-expiry (silent progress rollback).** If the DB update\
        \ commits but the subsequent Redis `write` throws (`:48-56`) or is lost, Redis\
        \ still holds the *prior* transition, now stale. Because Redis is the \"authority\"\
        , a later read consumes the stale `questionCount`/`currentQuestionId` as if\
        \ true, then increments off it and **overwrites DB** (`:179, 186-189`). Expiry\
        \ of that stale key is what finally forces a rehydrate — but only after wrong\
        \ state may already have been served. Result: duplicate questions, wrong counter,\
        \ resurrected/moved cursor.\n\n- **(B) State-session boundaries with no DB\
        \ committed -> unrecoverable.** `create()` seeds Redis with `START` (`:91-92`)\
        \ *before* deciding if a question exists. If a later `pickQuestion`/message\
        \ insert fails and the `START` key expires, DB is `START` with no messages;\
        \ `requireAsking` rehydrates `START` and `answer` treats it as enterable (`:394-397`)\
        \ — an empty session can be continued into an invalid state machine because\
        \ the guard data is gone.\n\n- **(C) Multi-day sessions.** Real interviews\
        \ that legitimately exceed the fixed 24 h gap lose hot state even though the\
        \ DB (and the user's answers) remain perfectly valid. Recovery depends entirely\
        \ on the fallback DB read; any deployment that later promises \"Redis is authoritative\"\
        \ breaks here.\n\n- **(D) The misleading rehydration.** `InterviewStateStore.read()`\
        \ returns `null` for **both** expired and JSON-corrupt keys (`:37-45`), and\
        \ `requireAsking` cannot distinguish \"never existed / expired / persisted\"\
        \ from a live-but-stale entry — so it fabricates a *fresh* 24 h TTL from a\
        \ DB snapshot that may be older than what the session controller last saw.\n\
        \n## Why the DB \"remains valid\" but you can't always continue\n\nThe DB\
        \ is durable and complete (messages, results, and session columns), so it\
        \ never loses the interview. Continuation breaks only because the **runtime\
        \ gate** (`SessionState`) is cached with a fixed TTL and the code trusts that\
        \ cache first: on divergence, Redis serves stale truth; on silent expiry,\
        \ Redis forces a DB-backed rehydrate whose correctness is *silent*, not guaranteed\
        \ atomic with the DB write that follows it.\n\n## Recommendations\n\n**1.\
        \ Treat the DB as the single source of truth; demote Redis to a fast cache\
        \ that is always rebuildable and always validated.** Change the class contract:\
        \ Redis may be behind, never authoritative.\n\n**2. Use a sliding TTL on real\
        \ interaction, plus a per-session activity heartbeat.** Minimal change to\
        \ `InterviewStateStore`:\n\n```java\n// sliding: refresh on touch; key auto-expires\
        \ only after 24h of inactivity\npublic void touch(Long sessionId, Instant\
        \ now) {\n    redissonClient.getBucket(key(sessionId)).expire(ttl, TimeUnit.MINUTES);\n\
        }\n```\nApply `touch()` in `requireAsking()` (any successful read/write) so\
        \ an active-ongoing session never expires mid-interview. Keep an explicit,\
        \ longer grace TTL for idle-but-in-progress sessions.\n\n**3. Enforce a strictly\
        \ ordered, LLWW commit** so Redis can't advance ahead of DB: **write DB first,\
        \ then update Redis, and treat Redis update failure as non-fatal** (log +\
        \ continue), made safe by (1). Never derive the next transition solely from\
        \ the stale cache — re-validate against `questionCount` read from DB inside\
        \ the lock.\n\n**4. Distinguish `null` (not found) from corrupt (expired).**\
        \ Have `read()` throw/signal on parse failure instead of returning `null`,\
        \ so `requireAsking` can log a rehydration and reconcile rather than silently\
        \ masking divergence:\n```java\n} catch (Exception e) {\n    log.warn(\"session\
        \ state parse failed, falling back to DB: {}\", sessionId, e);\n    return\
        \ Symbol.CORRUPT; // distinct from MISSING\n}\n```\n\n**5. Reconciliation/GC.**\
        \ Add a scheduled task comparing `interview_session.status` to the Redis key;\
        \ prune `FINISHED` keys and heal `ASKING` keys that are missing. Use `MAX_QUESTIONS`/state\
        \ versioning (monotonic `version` field bumped per transition) to reject stale\
