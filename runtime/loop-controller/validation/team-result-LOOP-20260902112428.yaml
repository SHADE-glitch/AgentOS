        \ TTL：读时按需续期**（最省事、直击问题）。\n```java\nprivate static final long REFRESH_IF_REMAIN_MS\
        \ = 6L * 60 * 60 * 1000; // 剩 6h 内续\n\npublic SessionState read(Long id) {\n\
