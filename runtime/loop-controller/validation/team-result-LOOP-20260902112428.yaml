        \ DB 回填逻辑**不会触发**,于是用旧状态继续推进,导致重复计数/倒退、或对已结束会话放行。\n3. **会话直接中止**——若 Redis\
        \ 状态残留为 `FINISHED` 而 DB 仍是 `ASKING`,续答会被 `INTERVIEW_FINISHED` 直接拦下,用户无法继续。\n\
        \n证据:代码里已经用 `requireAsking()` 的 DB 兜底(`InterviewService.java:380-399`)承认\"\
        Redis 可能静默过期\"这一现实,但仍把 Redis 当作**唯一权威源**(`InterviewStateStore.java:15` 注释)并硬依赖写入,这两者自相矛盾,正是隐患根源。\n\
        \n---\n\n## 一、目标 / 约束 / 成功标准\n\n- **业务目标**:面试进行中(DB 状态合法)时,续答必须稳定可用;已结束的会话不得被重复续答。\n\
        - **当前约束**:\n  - Redis 作为运行时状态(`status/questionCount/currentQuestionId`),`InterviewStateStore`\
        \ TTL 固定 24h、每次 `write()` 刷新。\n  - `answer()`(同步)与 `answerStream()`(SSE/虚拟线程)双入口各维护一套状态推进逻辑。\n\
        \  - 每会话一把 Redisson 分布式锁 `interview:lock:{sessionId}`。\n  - DB `interview_session`\
        \ 表持久保存 `status/questionCount/currentQuestionId`。\n- **成功标准**:Redis key 过期(无论主动或被\
        \ LRU 驱逐)时,续答要么从 DB 无缝恢复,要么给出**确定且语义正确**的错误,绝不使用与 DB 冲突的残留状态继续推进。\n\n---\n\
        \n## 二、问题判断(时间轴与根因)\n\nTTL 被每次 `write()` 刷新,所以**只有\"超过 24h 无任何写操作\"才会到期**。典型触发窗口:\n\
