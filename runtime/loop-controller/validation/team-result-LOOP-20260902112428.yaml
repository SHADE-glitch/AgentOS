        \ verify `answer()` still continues and re-writes with fresh TTL.\n- Load:\
        \ measure DB hits during a miss-storm after mass expiry; confirm no thundering\
        \ herd (add an application-level lock or rely on the existing `interview:lock:*`\
        \ mutex during re-hydration)."
