        \ void write(Long sessionId, SessionState state) {\n    redissonClient.getBucket(key(sessionId))\n\
        \        .set(json, TTL_HOURS, TimeUnit.HOURS);  // fixed 24h, TTL_hours=25:1\n\
        }\n```\n\nKey property: **TTL is fixed (`24h`) and only reset on `write()`**.\
        \ It is *not* sliding — it is not refreshed on read/activity/heartbeat.\n\n\
        ## When and why continuation breaks\n\n### 1. The single hard-break path:\
        \ reads that bypass `requireAsking`'s fallback\n`requireAsking` (`InterviewService.java:380-399`)\
        \ is the *only* guard that re-hydrates from DB when Redis returns `null`.\
        \ Any consumer reading Redis directly treats expiry as \"session gone\":\n\
        \n- **SSE/resume/reconnect handling.** `SseEmitter(300_000L)` (`InterviewService.java:198`)\
        \ — the frontend reconnects on stream timeout/network drop. If a reconnect\
        \ handler queries Redis state (or a gateway/worker does), a key expired during\
        \ idle → `null` → session treated as `INTERVIEW_NOT_FOUND`, and the user cannot\
        \ continue even though the DB row is valid `ASKING`.\n- **Any worker/async\
        \ consumer** modeled on the existing pattern but reading only the state bucket.\n\
        \n### 2. Idle-but-active sessions are silently killed after 24h\nA user pauses\
        \ (thinks >24h, or leaves a tab open) → key expires. Redis \"authority\" is\
        \ gone. Only the sync `requireAsking` fallback eventually re-covers it, but:\n\
        - It is **undocumented and untested**, so its protective behavior is accidental,\
        \ not contractual.\n- Any path that expects the *collection* of state (not\
        \ just status) breaks in the interim.\n\n### 3. Divergence makes expiry ambiguous\
        \ rather than benign (the real WHY)\nDB and Redis are written in **two separate,\
        \ non-atomic operations** on every transition:\n\n```java\n// InterviewService.java:111-119\
        \ (create), 183-189 (answer)\nsessionMapper.updateById(session);   // 1) DB\
        \ committed (separate tx)\nstateStore.write(sessionId, state);  // 2) Redis\
        \ set + TTL\n```\n\nIf step 2 fails (Redis timeout) or the process dies between\
        \ 1 and 2, the DB says `ASKING questionCount=3` while Redis still holds the\
        \ *previous* state with its old TTL. Now:\n- While the stale key is alive,\
        \ `requireAsking` reads **stale non-null** state → **no DB re-hydration happens**\
        \ → wrong `questionCount` (e.g. re-asks an already-answered question), a data-consistency\
        \ break.\n- Only when that stale key's TTL *also* expires does it degrade\
        \ to `null` → DB re-hydration → self-heals.\n\nSo **expiry \"fixes\" divergence\
        \ and \"breaks\" availability at the same time**, and which outcome a user\
        \ gets depends on a clock, not a design decision.\n\n### 4. Fixed vs sliding\
        \ TTL for genuinely long interviews\n`write()` is called on each transition,\
        \ so an *actively* continuing interview keeps refreshing TTL and never expires.\
        \ The problem is entirely about **idle intervals ≥ 24h**, not long total duration.\n\
        \n## Recommendation\n\nTreat the DB as the authoritative state; make Redis\
        \ a write-through cache with a **sliding** TTL, and make the fallback explicit\
        \ and universal.\n\n### A. Sliding TTL — refresh on every read\nChange `read()`\
        \ to bump TTL so genuine activity (even non-mutating) keeps the session alive:\n\
        \n```java\npublic SessionState read(Long sessionId) {\n    String key = key(sessionId);\n\
        \    RBucket<String> bucket = redissonClient.getBucket(key);\n    String json\
        \ = bucket.get();\n    if (json == null) return null;\n    // sliding window:\
        \ any observed activity prolongs the session\n    bucket.expire(TTL_HOURS,\
        \ TimeUnit.HOURS);\n    try {\n        return objectMapper.readValue(json,\
        \ SessionState.class);\n    } catch (Exception e) {\n        log.warn(\"parse\
        \ session state failed, sessionId={}: {}\", sessionId, e.getMessage());\n\
        \        return null;\n    }\n}\n```\n\n### B. Make DB the truth; make fallback\
        \ explicit & universal\nCentralize the \"Redis may be empty → fall back to\
        \ DB\" logic so *every* reader gets it (not just `requireAsking`):\n\n```java\n\
        // InterviewStateStore\npublic SessionState readOrLoad(Long sessionId, Supplier<SessionState>\
        \ dbLoader) {\n    SessionState cached = read(sessionId);\n    if (cached\
        \ != null) return cached;\n    SessionState fromDb = dbLoader.get();\n   \
        \ if (fromDb != null) write(sessionId, fromDb);  // re-propagate + new TTL\n\
        \    return fromDb;\n}\n```\n\n`InterviewService.answer()` / `answerStream`\
        \ switch `requireAsking(...)` to `readOrLoad(sessionId, this::loadFromDb)`,\
        \ and `loadFromDb` builds `SessionState` from the `InterviewSession` row (the\
        \ pattern already in `requireAsking:387-388`).\n\n### C. Reduce the write\
        \ divergence window\nWrap the DB+Redis transition in a single transaction\
        \ so a Redis failure rolls back the DB change, or at least compensate:\n\n\
        ```java\n@Transactional\npublic MessageVO submitQuestion(User u, Long sessionId,\
        \ ...) {\n    // ...compute next state...\n    sessionMapper.updateById(session);\
        \          // in tx\n    try {\n        stateStore.write(sessionId, state);\
        \     // same tx: failure => DB rolls back\n    } catch (RuntimeException\
        \ e) {\n        throw new BizException(ResultCode.INTERNAL_ERROR, \"会话状态写入失败\"\
        );\n    }\n}\n```\n\n### D. Observability\nAdd signals so expiry/divergence\
        \ becomes visible instead of silent:\n\n```java\nprivate final MetricCounter\
        \ cacheHits, cacheMisses;  // or Micrometer meters\n// in read(): hits++;\
        \ on null: misses++ (then DB re-hydration)\n// alert when miss(DbResolver)\
        \ rate climbs OR state.status != db.status after readOrLoad\n```\n\n## Trade-offs\
        \ / risks\n- **Option A (sliding TTL)** — Strengths: minimal change, preserves\
        \ Redis-first reads. Weaknesses: expired sessions still rely on DB re-hydration\
        \ for the first read. Recommended combined with B.\n- **Option B (DB-as-truth\
        \ + readOrLoad)** — Strengths: removes the single-source-of-truth contradiction,\
        \ continuation survives expiry by construction. Weaknesses: DB hit on first\
        \ miss (acceptable; 1 query). Recommended.\n- **Option C (atomic write)**\
        \ — Strengths: eliminates stale-state divergence. Weaknesses: couples write\
        \ latency to Redis; need Redis failure to not block `create()`. Adopt as it\
        \ doesn't regress the happy path.\n\n**Final recommendation:** B + D are the\
        \ hard requirements (correctness + operability). A removes the 24h-idle cliff\
        \ for pauses. C closes the stale-state window. Together they make TTL expiry\
        \ affect only *cache performance*, never *correctness of continuation*.\n\n\
