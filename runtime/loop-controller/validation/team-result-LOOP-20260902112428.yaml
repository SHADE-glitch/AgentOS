        \ 根因：**双写但非原子的「两个真相源」**。DB 与 Redis 各自独立持久化同一业务状态，且 Redis 用固定 TTL 表达「时效」。任何使\
        \ DB 与 Redis 分叉的事件，都会让后续读到已过期的 Redis 值（或读不到 Redis 而反推/误判 DB），从而续传失败或产生脏续传。\n\
        - 关键假设：会话是「短生命内高频交互」的活动态；24h 无交互即视为「闲置过期」在领域上是有意义的时间窗。\n- 已知限制：当前 `read ->\
        \ null` 的 DB 反推只覆盖「Redis 键缺失」这一种症状；对「Redis 存在但值陈旧」这一更危险的方向无任何检测。\n\n### 何时会「静默过期而\
        \ DB 仍有效」\n1. **闲置超 TTL**：固定 24h 是「自上次写入起算」的滑窗（每次问答都重置）。用户离开 ≥24h 后再回来 → 键被\
