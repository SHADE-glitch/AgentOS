        \ 的 DB 重建抽成 `loadOrReconstruct(id)`，所有读路径复用，杜绝\"只有答案路径能自愈\"的断点 A。重建时注意用 `SESSION\
        \ 唯一` 字段做乐观校验，防止旧值遮蔽（对 `null` 与\"预期陈旧\"分别处理）。\n\n4. **数据一致性（DB/Redis 原子化）**：无法两段式事务时，统一顺序为\
