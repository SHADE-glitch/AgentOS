    output: "# Lead Analysis — Redis Fixed-TTL Internet Session State vs. Durable\
      \ DB\n\n**Team:** team-18087af2 · **Roles consulted:** Database Engineer (lead),\
      \ Backend Architect, Code Reviewer, Security Engineer (support lenses)\n\n---\n\
      \n## 1. Diagnosis (conclusion first)\n\n**Root cause.** Continuation depends\
      \ on Redis as the *source of truth* for interview runtime state, but Redis is\
      \ configured with a fixed, time-based TTL that is decoupled from both the DB\
      \ record's validity and the user's actual activity. The DB row for the interview\
      \ survives, but the ephemeral runtime key — current step, in-flight answer,\
      \ timer start, resume cursor — is silently dropped (`MISS`) when the TTL expires\
      \ or the key is evicted. Any continue/resume path that reads Redis first then\
      \ sees `nil`.\n\nThe two layers disagree: **DB = \"interview exists / is valid\"\
      ** while **Redis = \"exact execution position + transient draft\"**. Because\
      \ TTL is oblivious to the DB's validity, the moment the runtime key vanishes\
      \ you have a *valid* interview (from the DB's perspective) with *no way to resume*\
      \ (from the runtime state's perspective). This is the classic \"authoritative\
      \ durable data + non-durable correlated cache/state\" mismatch.\n\n---\n\n##\
      \ 2. When it breaks (the specific conditions)\n\nExpiry is **not** driven by\
      \ logical progress — only by elapsed wall-clock time from the last TTL-set write.\
      \ Breakage occurs when any of these hold:\n\n| Condition | Why it breaks |\n\
      |---|---|\n| **Idle gap between writes > TTL.** | TTL is refreshed only on writes.\
      \ If the current step produces no writes (user reads a long prompt, watches\
      \ a video, drafts offline, browser tab sits open) for longer than TTL, the key\
      \ expires even though the session is legitimately still \"open\" in the DB.\
      \ |\n| **Interview length / single-step dwell > TTL.** | A fixed TTL chosen\
      \ for the *typical* step is smaller than the *worst-case* step or total session\
      \ length. |\n| **Sliding vs. fixed confusion.** | Fixed TTL = `SET key val EX\
      \ N` at write time. There is no per-*access* idle refresh, so a user who remains\
      \ engaged but performant (many *reads*, few *writes*) still expires. |\n| **Memory\
      \ pressure + eviction policy.** | Even below TTL, Redis may evict the key early\
      \ if `maxmemory-policy` is `allkeys-lru`, `volatile-lru`, or `volatile-ttl`\
      \ and the instance is under memory pressure. Expiry is then *non-deterministic*,\
      \ not \"fixed.\" |\n| **Environment churn.** | `FLUSHDB`, instance restarts,\
      \ deployment cache-busting, or moving to a shard the user isn't routed to (if\
      \ keys are not guaranteed co-located per session) removes the key while the\
      \ DB record remains. |\n| **Cache-aside treated as authoritative.** | If the\
      \ miss handler treats a Redis miss as a definitive \"session not found\" (returns\
      \ 404 / shows *expired*) rather than reconciling with the DB, continuation breaks\
      \ even when the DB is fully valid. |\n\n**The most common production scenario:**\
      \ a candidate or interviewer pauses longer than the TTL (leaves the tab, lets\
      \ a question hang, takes > TTL on a single step). Redis deletes the key quietly.\
      \ The user returns, the app's \"Continue\" reads Redis → `MISS` → either a hard\
      \ *Session expired / Not found*, or a partial DB fallback that cannot reconstruct\
      \ the transient in-progress answers and cursor — so the \"valid\" interview\
      \ in the DB cannot actually be resumed to the correct step.\n\n---\n\n## 3.\
      \ Why continuation breaks (the mechanism)\n\nThe `continue`/`resume` handler\
      \ typically does:\n\n```text\nstate = REDIS.GET(\"session:runtime:{id}\")  \
      \ # source of truth for continuation\nif state is nil:\n    → MISS path\n```\n\
      \nThere are only two MISS paths, and both are defective here:\n\n1. **Hard fail**\
      \ (404 / \"session expired\") — falsely contradicts the DB, which still says\
      \ the interview is valid.\n2. **DB fallback** — reconstructs from `interviews`\
      \ table, but the DB only stores *durable/finalized* fields (`interview_id`,\
      \ candidate, question set, status, timestamps). It does **not** store the *transient*\
      \ fields the continuation cursor needs: current step / question index, in-flight\
      \ answer buffer, timer start time, attempt nonce, partial submission. So reconstruction\
      \ returns *a* valid interview, but not *the same execution position* — answers\
      \ mid-typing are lost, the timer restarts, the cursor resets. Continuation \"\
      works\" but silently corrupts/resets the user's progress.\n\nThe reason it breaks\
      \ is architectural, not a bug: **a TTL guarantees nothing about logical validity\
      \ of the underlying record, yet the code treats Redis presence as the gate for\
      \ continuation.** The DB remains valid precisely because nothing in the write\
      \ path ties DB validity to Redis liveness.\n\n---\n\n## 4. Decision framework\
      \ / design options\n\n```text\nOption A — Sliding (activity-based) TTL\n  Strengths:\
      \  Simple; key survives as long as the user is engaged; no DB changes.\n  Weaknesses:\
      \ Still loses state if the user is legitimately idle > TTL; TTL still arbitrary\n\
      \              with respect to session length; renew-on-read can turn a cache\
      \ into an\n              unlimited session if not capped.\n  Best for:   Short\
      \ sessions where idleness implies abandonment, and no durable\n            \
      \  resume requirement.\n\nOption B — DB as source of truth + Redis only as cache\
      \ (cache-aside with rehydration)\n  Strengths:  Continuation never depends on\
      \ Redis liveness; a MISS transparently\n              rehydrates from the DB;\
      \ correct, durable, recoverable.\n  Weaknesses: Requires persisting enough runtime\
      \ state in DB (row or blob); more\n              writes; slightly more latency\
      \ on the cold path.\n  Best for:   Interviews where losing in-progress answers\
      \ is unacceptable.\n\nOption C — Fixed TTL kept, but semantics changed to \"\
      abandonment window\", with\n           graceful reconciliation on miss\n  Strengths:\
      \  Minimal change; keeps Redis as the fast store; miss triggers a\n        \
      \      documented \"resume best-effort\" path (e.g., reprompt for unsaved\n\
      \              answer) instead of a hard failure.\n  Weaknesses: Still accepts\
      \ transient loss; needs explicit UX for partial loss.\n\nDecision\n  Recommended:\
      \ B as the target architecture, with A/Sliding used as a stopgap and C\n   \
      \            as the safety net during migration.\n  Why:  The DB is already\
      \ the valid authority — continue to make it the *resume*\n        authority.\
      \ Redis stays for hot reads, never as the continuation gate.\n  Risks & mitigations:\
      \ Moving transient fields to the DB raises write volume → use a\n        JSON/blob\
      \ `session_runtime` column updated on meaningful progress events\n        (not\
      \ every keystroke), and keep the fine-grained in-memory buffer in Redis\n  \
      \      with a sliding TTL as a *bonus* layer, not the source of truth.\n```\n\
      \n---\n\n## 5. Concrete implementation guidance\n\n### 5.1 Sliding-TTL stopgap\
      \ (Option A) — atomic refresh on read\n\n```lua\n-- GETREFRESH.lua : fetch and\
      \ idle-refresh atomically\nlocal v = redis.call('GET', KEYS[1])\nif v then\n\
      \  redis.call('EXPIRE', KEYS[1], ARGV[1])   -- extend on access\n  return v\n\
      end\nreturn nil\n```\n\nClient (e.g. ioredis / redis-py):\n\n```python\ndef\
      \ get_runtime(session_id: str, idle_ttl: int = 3600):\n    state = redis.eval(GETREFRESH,\
      \ 1, f\"session:runtime:{session_id}\", idle_ttl)\n    if state is None:\n \
      \       return None\n    return json.loads(state)\n```\n\n> Caution: renewing\
      \ on read converts every visit into an \"alive\" signal. Combine renew-on-write\
      \ + a hard **absolute** cap (`PERSIST` disable) so a forgotten tab can't pin\
      \ a session forever.\n\n### 5.2 Correct continue path — DB authoritative, Redis\
      \ cache (Option B)\n\n```python\ndef continue_interview(interview_id: str, user_id:\
      \ str):\n    # 1) Durable authority\n    row = db.fetch_one(\n        \"SELECT\
      \ runtime_state, updated_at FROM interviews \"\n        \"WHERE id = %s AND\
      \ candidate_id = %s AND status = 'in_progress'\",\n        (interview_id, user_id)\n\
      \    )\n    if row is None:\n        # DB says not resumable -> this is the\
      \ true terminal condition\n        return session_ended()\n\n    # 2) Hot cache\
      \ only if present (never authoritative)\n    cached = redis.get(f\"session:runtime:{interview_id}\"\
      )\n    runtime = json.loads(cached) if cached else json.loads(row[\"runtime_state\"\
      ])\n\n    # 3) Rehydrate heat + reconcile\n    redis.setex(f\"session:runtime:{interview_id}\"\
      , CACHE_TTL, json.dumps(runtime))\n\n    # 4) If transient draft (unsaved answer\
      \ buffer) is gone, surface, don't fail\n    if cached is None and runtime.get(\"\
      has_unsaved_draft\"):\n        return render(resume_interview=runtime, warn=\"\
      saved_up_to_here\")\n    return render(interview=runtime)\n```\n\n**Key rule:**\
      \ Redis liveness may reduce the resume path to \"fast,\" but it must **never**\
      \ decide *whether* the interview is resumable. That decision belongs to the\
      \ DB (`status='in_progress'`).\n\n### 5.3 Persist only on meaningful progress,\
      \ not keypresses\n\n```sql\n-- keep durable runtime small / coarse\nALTER TABLE\
      \ interviews ADD COLUMN runtime_state JSONB NULL,\n                      ADD\
      \ COLUMN runtime_updated_at TIMESTAMPTZ NULL;\n\nUPDATE interviews\n   SET runtime_state\
      \ = $1, runtime_updated_at = now()\n WHERE id = $2;   -- on step-complete /\
      \ savepoint / submit, debounced\n```\n\nThe fine-grained keystroke buffer stays\
      \ in Redis with a sliding TTL; on a miss you restore to the last durable savepoint\
      \ and tell the user \"progress saved up to question N.\"\n\n### 5.4 Operational\
      \ hardening\n\n- **Eviction policy:** don't let `maxmemory-policy` silently\
      \ drop live sessions. Pin live session keys to a dedicated Redis handle with\
      \ `noeviction`, or size/alert instead of evict. Keep volatile keys in a DB that\
      \ allows safe eviction only if a miss is harmless.\n- **MTTR/alerting:** track\
      \ `keyspace_hits` / `keyspace_misses` and expiry-rate for the session namespace;\
      \ alert on abnormal miss ratios that star–suddenly spike after a deploy (`awk`\
      \ on `INFO keyspace` or redis_exporter metrics).\n- **Deterministic TTL config:**\
      \ make the value an explicit, reviewed constant with a comment tying it to the\
      \ max *acceptable idle* (business decision), not a magic number.\n- **Test the\
      \ expiry path** in CI: set a 1s TTL, wait, and assert the continue handler rehydrates\
      \ from DB rather than returning 404.\n\n---\n\n## 6. Support-domain notes\n\n\
      **Backend Architect:** eliminate the hidden coupling — Redis liveness was implicitly\
      \ assuming \"cache key exists ⇒ DB record valid AND resumable.\" Introduce an\
      \ explicit contract: DB owns *can-resume*, Redis owns *fast-path position*.\
      \ Redis `MISS` is an expected state, not an error.\n\n**Code Reviewer:** the\
      \ original bug ships as a review miss because the code reviews the *happy path*\
      \ (Redis hit) and the miss path is untested/untyped. Add: explicit schema docs\
      \ for what each layer stores, `nil`-handling that reconciles, and a test enumerating\
      \ TTL = {0, small, large} × memory pressure.\n\n**Security Engineer:** reconfirm\
      \ identity/authorization before rehydrating from DB — a Redis miss must not\
      \ let an untrusted reconstruct path imply consent. Expiry also acts as a revocation\
      \ control; when rehydrating, revalidate the session token against the DB (don't\
      \ resurrect expired auth as a side effect of a \"valid\" interview). Don't persist\
      \ raw secrets in `runtime_state`; store references/encrypted blobs only.\n\n\
      ---\n\n## 7. Summary\n\n- **Breaks when:** the gap between TTL-refreshing writes\
      \ exceeds a fixed TTL (idle/dwell > TTL), Redis evicts under memory pressure\
      \ before TTL, or the environment wipes the key — while the DB interview row\
      \ stays `in_progress`.\n- **Why continuation breaks:** the code makes Redis\
      \ presence the gate for resume; on `MISS` it either hard-fails (contradicting\
      \ a valid DB row) or falls back to the DB, which lacks the *transient* runtime\
      \ fields (cursor, in-progress answer, timer) needed to resume to the exact position.\n\
      - **Fix:** make the **DB the source of truth for resumability**, keep Redis\
      \ solely as a fast, sliding-TTL, rehydratable cache; on miss, rebuild from the\
      \ durable savepoint and surface any lost unsaved draft instead of failing."
