        \ 越长在 `volatile-ttl` 下越靠后，但 `volatile-lru` 可能提前）。\n4. **运维/ABL 变更、键被重命名或清理脚本误删**。\n\
        \n### 为何「续传」会断 —— 分两种方向\n- A. Redis 过期缺失（DB 正确）→ 走 `requireAsking`：读到 `null`，从\
        \ DB 反推 `(status, count, curQ)` 回填。**此路径今天能自愈**（三字段镜像完整）。但它掩盖了根因，且自愈本身是脆弱的（见风险\
