        的决策，其安全性依赖持有权威的上一状态。** TTL 静默抹去上一状态，续接即断。\n\n### 断点 A — 过期后没有 DB 重建的读路径（最直接）\n\
        TTL 只被 `requireAsking` 一条路径兜底。它的语义是 **\"读空才回源\"**。凡是**不经过 `requireAsking`、却直接决策状态**的路径，Redis\
        \ 一过期就拿到 `null`：\n- `answer`/`answerStream` 走 `requireAsking`，能自愈（`InterviewService.java:129,204,381`）。\n\
