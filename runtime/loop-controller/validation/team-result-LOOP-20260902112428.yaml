        \n## Diagnosis\n\nThe interview runtime state has **two persistent sources\
        \ that are updated non-atomically**, yet the code comments and design claim\
        \ Redis is the *single source of truth* (`InterviewStateStore.java:16`). This\
        \ contradiction is exactly why TTL expiry is dangerous.\n\nConcrete mechanics\
