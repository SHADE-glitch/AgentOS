        \ `INTERVIEW_FINISHED`(`InterviewService.java:391-393`),用户被错误地判定\"已结束\"。\n\
        \n### 安全视角(我的职责域)\n- **状态机完整性 / 权限级联**:横跨\"DB 权威\"与\"Redis 权威\"两套来源,存在 TOCTOU\
        \ 与状态混淆面。攻击者/并发请求可能在会话已结束时仍推进状态(过期前的 FINISHED 残留 + 过期后的 DB 回填,随时切换权威源)。\n\
