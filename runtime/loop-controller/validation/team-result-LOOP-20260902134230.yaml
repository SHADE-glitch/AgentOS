        Below is my analysis grounded in the current implementation.


        ---


        ## 1. Root cause — Redis is the state machine''s source of tru'
      output: "Role: Database Engineer (supporting the Runtime-State/Lifecycle issue).\
        \ Below is my analysis grounded in the current implementation.\n\n---\n\n\
        ## 1. Root cause — Redis is the state machine's source of truth, TTL silently\
        \ nullifies it\n\n`InterviewStateStore.java:25` fixes TTL to `24h`, applied\
        \ on **every** `write` (`:51` `set(json, TTL_HOURS, HOURS)`). So expiration\
        \ is *sliding-per-write*, not a hard wall-clock deadline: the key lives 24h\
        \ from the **last write**, not from session creation. Consequences:\n\n- A\
        \ session gets a new 24h life on every state transition / answer submission\
        \ (`InterviewService` calls `stateStore.write` at :91, :116, :188, :263, :345).\n\
        - A session that goes **quiet for >24h** (candidate paused, LLM tool-call\
        \ loop stalled, page abandoned) has its key silently evicted by Redis's active/inactive\
        \ expiration — no error, no log.\n\nThe comment at `:16` says Redis is the\
        \ *single authoritative source* of the state machine. But the durable `interview_session`\
        \ row (DB) never expires and still holds `status`, `question_count`, `current_question_id`.\
        \ This creates a **divergence**: DB says the interview is valid; Redis no\
        \ longer carries the runtime state. That asymmetry is exactly the reported\
        \ failure mode.\n\n## 2. When it breaks vs. when it self-heals\n\nCrucially,\
        \ `requireAsking` (`InterviewService.java:380-389`) **already has a recovery\
        \ path**:\n\n```java\nInterviewStateStore.SessionState state = stateStore.read(sessionId);\n\
        if (state == null) {                 // Redis key expired -> fall back to\
        \ DB\n    InterviewSession s = sessionMapper.selectById(sessionId);\n    if\
        \ (s == null) throw ...;\n    state = new SessionState(s.getStatus(), s.getQuestionCount(),\
        \ s.getCurrentQuestionId());\n    stateStore.write(sessionId, state);   //\
        \ re-cache, new 24h\n}\n```\n\nSo continuation does **not** hard-fail on the\
        \ path that reconstructs purely from `status/questionCount/currentQuestionId`.\
        \ It breaks only when **reconstruction is lossy** — i.e. when state that exists\
        \ **only in Redis**, and is not derivable from DB columns, is required to\
        \ resume. Concrete breakage cases:\n\n| Scenario | Redis expired? | Why continuation\
        \ breaks |\n|---|---|---|\n| Reconstructible fields suffice (pure ASKING resume)\
        \ | yes | self-heals via :387-389; OK |\n| LLM tool-call loop / conversation\
        \ context held in Redis | yes | conversation/agent state gone → resume can't\
        \ reproduce prior context |\n| `currentQuestionId` resolution | yes | DB column\
        \ may be stale/NULL if it's only advanced in Redis then lazily flushed |\n\
        | Race between expiry and a concurrent writer | yes | check-and-rehydrate\
        \ is not atomic with the write → lost update under distributed lock window\
        \ |\n| `ASKNEXT` vs `ASKING` **eventual** mismatch | partial | DB status lags\
        \ Redis status; rehydrated state re-uses stale DB status, so a transition\
        \ already applied in Redis is rolled back |\n\n**Time gap ambiguity**: because\
        \ TTL slides on every write, a key can expire mid-request. Between the `read`\
        \ returning `null` and the DB `selectById`, the candidate may actually have\
        \ had active state — the DB row's `updated_at`/status is the only cross-check,\
        \ and it is not consulted for freshness here.\n\n## 3. The deeper design smell\
        \ for lead\n\n1. **Two sources of truth with no reconciliation.** Comment\
        \ claims Redis is authoritative while DB is the persistent copy of the same\
        \ three fields. On TTL expiry they *must* agree, but there is no version/fencing\
        \ counter to detect that the DB copy is stale relative to the departed Redis\
        \ copy.\n2. **TTL is a cache lifetime misused as a session lifetime.** A fixed\
        \ 24h is neither an inactivity timeout (too long) nor a hard conversation\
        \ limit (too short for slow interviews). It models \"how long can nobody touch\
        \ the state\" with a value tuned for neither.\n3. **Lossy rehydration.** The\
        \ recovery path only rebuilds 3 scalars. Anything else (LLM turn context,\
        \ pending tool-call continuation) is not in this `SessionState` record, so\
        \ if it lives in Redis it is unrecoverable by design.\n\n## 4. Concrete recommendations\n\
        \n**A. Make expiry observable, not silent** — log and gate on rehydration:\n\
        ```java\nif (state == null) {\n    // tombstone/signal the divergence\n  \
        \  log.warn(\"session state expired from Redis, rehydrating from DB, sessionId={}\"\
        , sessionId);\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
