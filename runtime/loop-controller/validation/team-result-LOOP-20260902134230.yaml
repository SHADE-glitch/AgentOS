        \ Nothing in the code prevents the next consumer from trusting the expired\
        \ key.\n\n**2. Dead keys linger 24h and mask reality.**\n`delete()` (`InterviewStateStore.java:58`)\
        \ is **never wired** to any termination path. Every finished/superseded session\
        \ keeps a live Redis key for 24h, so Redis frequently holds state that *differs*\
        \ from DB (or exists while DB moved on). Any logic polling or \"reading current\
        \ key\" instead of DB can take a **stale branch**.\n\n**3. Crash-gap divergence\
