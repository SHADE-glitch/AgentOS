        \ C — Full inversion with version reconciliation.**\n  Store a `version`/`updatedAt`\
        \ alongside status; on expiry compare DB vs Redis, log divergence, prefer\
        \ newer.\n  - Strengths: correct authority, auditable divergence.\n  - Weaknesses:\
        \ most work.\n\n## 最终建议\nDo **A** (rename/reframe the authority + instrument\
        \ the fallback) **+ B** (sliding TTL, short terminal TTL). Combine both is\
        \ small and closes the real windows.\n\n### 具体修改点 / Concrete steps\n\n1. `InterviewStateStore`:\
