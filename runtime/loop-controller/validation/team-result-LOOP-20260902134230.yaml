        \ \"continuation breaks\" is: **the fallback is incidental, single-call-site,\
        \ and undocumented — not the contract — so the wrong branch recurs wherever\
        \ the contract was believed.**\n\n### 方案设计 / Options\n\n- **Option A — Make\
        \ TTL the only short-lived thing: Redis-as-cache, DB-as-truth.**\n  Flip the\
        \ claim. Redis caches state for the hot path; DB is authoritative; any null/expired\
        \ read returns DB truth by design. Keep rehydration but *instrument* it.\n\
        \  - Strengths: matches reality, smallest change, removes the inverted-contract\
        \ hazard.\n  - Weaknesses: surfaces DB load on cold resumes (negligible here).\n\
        - **Option B — Sliding TTL via read-touch + per-status TTL.**\n  `expire`\
        \ on read; `FINISHED`/terminal keys shortened to minutes.\n  - Strengths:\
        \ keys never die during active use; terminal garbage reclaimed fast.\n  -\
