      output: "## Code Review: Redis Session-State `TTL=24h` Silent Expiry vs. DB-Valid\
        \ Interview\n\nScope: `InterviewStateStore` (authority claim), `InterviewService.requireAsking/create/answer/answerStream/finishSession`,\
        \ `Interview.vue`.\n\n### 根因 / Root cause\n\nThe architecture *inverts* truth\
        \ and lifetime:\n\n- `InterviewStateStore.java:15` declares Redis the **\"\
        单一权威来源\" (single source of truth)** for the state machine, but the key lives\
        \ only **`TTL_HOURS = 24`** (`:25`, set fixed at `:51`) — it dies by clock.\n\
        - The **DB `interview_session` row is permanent** and holds the *same* fields\
        \ (`status`, `questionCount`, `currentQuestionId`). That is the record that\
        \ actually survives.\n\nSo the system trusts the one store that vanishes and\
        \ keeps as secondary the one store that never does. That is the design defect;\
        \ expiry is just its symptom.\n\n### When / why continuation breaks\n\nThe\
        \ primary \"resume an in-progress interview\" path is `answer()` / `answerStream()`,\
        \ both gated on `requireAsking()` (`InterviewService.java:380-399`). Crucially,\
        \ that method **already contains a DB fallback**:\n\n```java\nstate = stateStore.read(sessionId);\n\
        if (state == null) {\n    InterviewSession s = sessionMapper.selectById(sessionId);\
        \ // rehydrate from DB\n    if (s == null) throw ...INTERVIEW_NOT_FOUND;\n\
        \    state = new SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId());\n\
        \    stateStore.write(sessionId, state); // fresh 24h TTL\n}\n```\n\nSo the\
        \ naive case — user idles >24h mid-interview, resumes — is **rescued**: Redis\
        \ is null, the code rebuilds ASKING state from the DB, and `newCount = state.questionCount()+1`\
