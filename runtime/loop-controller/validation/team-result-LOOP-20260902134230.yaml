      summary: '# Redis TTL Session Expiry vs. Durable DB — Continuation-Break Analysis


        ## 1. Verdict


        A **fixed TTL** on interview runtime state is a *time-based* expiry, but the
        interview lifecycle is not time-det'
      output: "# Redis TTL Session Expiry vs. Durable DB — Continuation-Break Analysis\n\
        \n## 1. Verdict\n\nA **fixed TTL** on interview runtime state is a *time-based*\
        \ expiry, but the interview lifecycle is not time-deterministic (candidates\
        \ vary in speed, pause, network drops, resume later). This creates a split-brain:\
        \ **Redis says \"session gone\"; DB says \"interview active.\"** Continuation\
        \ breaks silently because cache misses are indistinguishable from \"never\
        \ existed,\" and no rehydration path exists from the DB (source of truth).\n\
        \nFlag severity: **High** — silent data loss of in-progress answer/runtime\
        \ context with no error surfaced and no automatic recovery.\n\n---\n\n## 2.\
        \ Why it breaks — the mechanism\n\nRedis implements TTL by lazily deleting\
        \ the key at `GET` time (plus periodic active expiry). The failure chain:\n\
        \n1. Fixed TTL set at session start: `module_ttl=1800s` (example).\n2. Candidate\
        \ sits idle / thinks longer than 1800s, or a tab is suspended and resumed\
        \ past TTL.\n3. Any `GET`/`EXISTS` on the runtime key returns `nil`/`0` —\
        \ **no exception, no error.** Redis does not tell you whether the key was\
        \ never written or timed out (`TYPE/OBJECT` can reveal nothing once gone).\n\
        4. Application treats `nil` as \"no active session\" → 404/redirect/new-interview,\
        \ while the DB row still shows `status='in_progress'` with collected answers.\n\
        5. Result: user cannot resume; runtime state (current index, partial answer,\
        \ timer, anti-cheat markers) is gone even though the interview is durably\
        \ valid.\n\nThe DB stays valid because it's write-backed on commits; Redis\
        \ only holds derived/fast-access state whose expiry was tuned for *cache*,\
        \ not *business lifecycle*.\n\n---\n\n## 3. When continuation concretely breaks\n\
        \n| Scenario | Why TTL fires | DB state |\n|---|---|---|\n| Slow candidate\
        \ exceeds fixed TTL mid-question | idle timer = answer thinking time | `in_progress`,\
        \ partial answer saved |\n| Paused/resumed interview (lunch, reconnect) |\
        \ wall-clock expiry, no keepalive | `in_progress` |\n| Mobile tab backgrounded\
        \ (no heartbeat) | OS suspends timers; client silent | `in_progress` |\n|\
        \ Multi-tab: tab A expired, tab B valid | per-tab runtime state inconsistency\
        \ | `in_progress` |\n| Batch/job (auto-grading, anti-cheat) re-claims key\
        \ | `WATCH`/`GETDEL` returns nil | answers exist in DB |\n\nFixed TTL is only\
        \ safe when **TTL ≥ worst-case session duration + buffer** — essentially never\
        \ true for real interviews.\n\n---\n\n## 4. Why it fails *silently* (the dangerous\
        \ part)\n\n```python\n# Redis client path (broken-silently)\ndef load_runtime(session_id):\n\
        \    key = f\"interview:runtime:{session_id}\"\n    val = r.get(key)     \
        \            # None on expiry OR never-existed: indistinguishable\n    if\
        \ val is None:\n        raise SessionNotFoundException()   # ← hard fail,\
        \ no DB fallback\n    return json.loads(val)\n```\n\nKey design flaw: **cache-miss\
        \ is treated as authoritative no-record**, rather than as a \"rehydrate from\
        \ DB\" signal. No monitoring distinguishes `never_expired/ttl` from `expired/ttl`.\n\
        \n---\n\n## 5. Recommended fixes (engineer-grade)\n\n### 5.1 Make Redis reconstructible\
        \ — DB is source of truth, Redis is a cache\nNever store state in Redis that\
        \ cannot be rebuilt from the DB. Store cursors (last answered index), not\
        \ opaque blobs:\n\n```python\ndef load_runtime_or_rehydrate(session_id, db,\
        \ r):\n    key = f\"interview:runtime:{session_id}\"\n    cached = r.get(key)\n\
        \    if cached is not None:\n        return json.loads(cached)\n    # Cache\
        \ miss → rehydrate from durable DB, then refresh-extend\n    row = db.fetch_interview(session_id)\
        \          # durable\n    if row is None or row[\"status\"] == \"completed\"\
        :\n        raise NotResumable(session_id)            # genuinely absent/completed\
        \ — real 404\n    if row[\"status\"] != \"in_progress\":\n        raise NotInProgress(session_id)\
        \           # recoverable, finite-state\n    runtime = build_runtime_from_row(row)\
        \         # derived state\n    r.setex(key, ttl=TTL_SLIDING, value=json.dumps(runtime))\n\
        \    return runtime\n```\n\nThis converts a silent cache-miss into either\
        \ a **correct resume** or a **finite-state error** (never a silent loss).\n\
        \n### 5.2 Sliding-window TTL (refresh on activity), not fixed\n```python\n\
        def touch(session_id, r):\n    r.expire(f\"interview:runtime:{session_id}\"\
        , TTL_SLIDING)  # reset on each interaction\n```\nKeep the key alive for `TTL_SLIDING`\
        \ **after the last activity**, matching the natural interruptible lifecycle.\
        \ Optionally refresh via `GETEX` (`EX`) to avoid a race between read and expire.\n\
        \n### 5.3 Client heartbeat / explicit resume\n- Client sends heartbeat while\
        \ a tab is active; server refreshes TTL.\n- Add a **resume** endpoint: `POST\
        \ /interview/:id/resume` that validates DB `in_progress` then re-seeds Redis.\
        \ The recovery path is the contract, not an afterthought.\n\n### 5.4 Bound\
        \ the risk — hard lower bound on TTL\nEven for a cache, set `TTL >= conservative(mean_session\
        \ * outliers_factor)`, then monitor misses. Treat every TTL-derived miss as\
        \ a surfacing event.\n\n### 5.5 Keyspace notification for graceful teardown\n\
        Not required if rehydration works, but if you must react:\n```redis\nCONFIG\
        \ SET notify-keyspace-events Ex\n```\nSubscribe to `__keyevent@0__:expired`\
        \ to archive/alert and avoid mid-request expiry surprises.\n\n### 5.6 Monitoring\
        \ / alerting (detect the silent failure)\nTrack per session:\n- `cache_miss_count\
        \ / rehydrate_count` → delta = genuinely-lost count\n- `expired_vs_never_written`\
        \ via a sentinel: write a tiny `marker` on creation, and on miss, compare\
        \ DB existence.\n\n---\n\n## 6. Resolving the contradiction — my role security-engineer,\
        \ on the DB side\n\nTwo consistency guarantees, one question each:\n\n**Q.\
        \ Guarded with `MARK_AS_SEEN`?** No. The DB is valid; Redis prematurely dropped\
        \ runtime.\n\n**Q. Atomicity?** Include `status='in_progress'` in the resume\
        \ guard:\n\n```sql\nUPDATE interview\nSET status = 'in_progress', resumed_at\
        \ = now()\nWHERE id = :sid\n  AND status IN ('in_progress','paused')   --\
        \ correct flag-check\nRETURNING id;                              -- 0 rows\
        \ ⇒ a genuine 404, not silent expiry\n```\n\nAssert the update reflects the\
        \ DB state before repopulating Redis; only then `SETEX`. This is account-scoped\
        \ data on the DB side — validated against the correct `status` flag, and the\
        \ 404 falls back to DB semantics rather than the misleading cache-nil interpretation.\n\
        \n---\n\n## 7. Security-relevant flag (for the security-engineer side)\n\n\
        The silent-expiry pattern has security implications beyond availability: a\
        \ token held in Redis that dies *earlier* than the DB can cause a **false-negative\
        \ authorization** (locked-out/interrupted-by-design) and, worse, lead developers\
        \ to *increase TTLs or skip cache*, weakening revocation. The fix should preserve\
        \ **revocation via DB `status`/`revoked` fields** while adding rehydration\
        \ — do not embed policy solely in TTL.\n\n---\n\n## 8. For lead review — recommendations\
        \ ranked\n\n1. **Refactor Redis as reconstructible cache; DB `status` is the\
        \ single authority for \"resumable.\"** (blocks the silent-loss class)\n2.\
        \ **Sliding-window TTL** refreshed on any activity, not fixed at creation.\n\
        3. **Explicit `/resume` rehydration path** with atomic `UPDATE ... WHERE status\
        \ IN (...) RETURNING`.\n4. **Monitor** `rehydrate_count` and TTL-miss deltas;\
        \ alert on any gap = true lost runtime.\n5. Optional: keyspace-expiry notifications\
        \ only if rehydration proves insufficient.\n\nAcceptance criteria for a follow-up\
        \ test: given a paused interview beyond TTL, `GET /interview/:id/resume` must\
        \ reconstruct runtime from DB and continue without data loss — and a completed/void\
        \ interview must return a clean 404/410, never a bogus resume."
