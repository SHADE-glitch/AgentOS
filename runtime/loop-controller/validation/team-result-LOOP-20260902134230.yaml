    output: "## Diagnosis\n\n**Root cause:** `InterviewStateStore.write()` (`InterviewStateStore.java:51`)\
      \ applies a **fixed 24h TTL measured from the last *state transition* write**,\
      \ not from the last *access/activity*:\n\n```java\nprivate static final long\
      \ TTL_HOURS = 24;\n...\nredissonClient.getBucket(key(sessionId)).set(json, TTL_HOURS,\
      \ TimeUnit.HOURS);\n```\n\nThe TTL is recomputed only inside `create/answer/answerStream/finishSession`,\
      \ i.e. only when a write happens. **Reads, SSE pings, and idle spans never `EXPIRE`\
      \ the key.** Redis semantics are therefore tied to *last mutable-write time*,\
      \ while the session's resumability is tied to *last-activity time*. Those two\
      \ clocks diverge, so the authority state silently vanishes while the DB row\
      \ stays valid.\n\n## When continuation breaks\n\n1. **An in-progress (`ASKING`/`START`)\
      \ interview becomes idle ≥ 24h.** The user answers Q3, the AI asks Q4, then\
      \ the user closes the tab, thinks, or pauses — no transition fires. Redis expires\
      \ at `lastWrite + 24h`. MySQL still holds `status='ASKING'`, `question_count=N`,\
      \ and every message.\n2. **The user resumes** by calling `answer`/`answer/stream`.\
      \ `requireAsking` (`InterviewService.java:380`) does `stateStore.read(sessionId)`\
      \ → `null`.\n\nFrom there, what happens is the crux:\n\n- `requireAsking` **does**\
      \ rehydrate from DB (`InterviewService.java:382-390`) — so the simple resume\
      \ path is *partially* masked. This is the trap: the current code looks self-healing,\
      \ but the invariant \"Redis 是单一权威来源\" has already been violated, and **any continuation\
      \ that does not route through this hydration guard breaks**.\n- `detail()` (`InterviewService.java:291`)\
      \ and `listByUser()` read DB only — fine today, but any future \"resume / continue\
      \ interview\" button or dashboard flow that checks `stateStore.read(...) !=\
      \ null` to decide resumability would, after expiry, tell the user *\"no active\
      \ session\"* or reset to a fresh state machine even though DB says it's resumable.\n\
      \n## Why continuation breaks (mechanisms)\n\n**A. Non-atomic dual write = divergence\
      \ window.** DB and Redis are written at *different points* inside the handler.\
      \ E.g. in `answer()` the DB row is updated at lines 183–186 and Redis at 188;\
      \ in `create()` the DB insert (87) happens *before* Redis write (91) and the\
      \ DB update (114) *after* it. There is no transaction spanning both stores.\
      \ A Redis expiry (or a crash) inside that window leaves the hot store stale\
      \ relative to DB.\n\n**B. Rehydration reconstructs a possibly-wrong state.**\
      \ On miss, `requireAsking` rebuilds from MySQL `status/questionCount/currentQuestionId`.\
      \ But `currentQuestionId` in DB is the *last persisted* question; an in-flight\
      \ question that was served from Redis but whose DB write hadn't committed yet\
      \ is lost on rehydration. The next `answer` then increments from a stale `questionCount()`,\
      \ recycling an already-answered question or double-counting progress — a silent,\
      \ user-invisible skip/repeat.\n\n**C. Rehydration-per-actor under concurrency.**\
      \ After expiry, each actor independently rebuilds state. The per-session distributed\
      \ lock serializes the *write*, but the rehydrated snapshot is as fresh as the\
      \ last DB txn — so a burst of resumed calls right after expiry can re-derive\
      \ the same `questionCount` and advance it from a stale base.\n\n**The one-line\
      \ why:** a fixed **write-time** TTL makes durability conditional on *being touched\
      \ again before TTL*, but a paused-but-valid session is never touched. The cache\
      \ is allowed to claim \"expired,\" so the authoritative state is dropped even\
      \ though the underlying (durable) session is healthy and resumable — and every\
      \ continuation path that assumes the key exists (or that rehydrates from a lagging\
      \ DB snapshot) now behaves incorrectly. Continuation \"works\" only by accident\
      \ of the hydration fallback, and breaks for any reader that doesn't fall back.\n\
      \n## Recommended fix\n\nTreat Redis as a **cache**, not the single source of\
      \ truth, and use a **sliding TTL**:\n\n1. **Sliding TTL on access** — refresh\
      \ on reads too:\n```java\npublic SessionState read(Long sessionId) {\n    String\
      \ key = key(sessionId);\n    RBucket<String> bucket = redissonClient.getBucket(key);\n\
      \    String json = bucket.get();\n    if (json != null) bucket.expire(TTL_HOURS,\
      \ TimeUnit.HOURS); // keep-alive on read\n    ...\n}\n```\n2. **Always hydrate\
      \ on miss from DB (authoritative), never treat `null` as \"no session\":** make\
      \ `requireAsking`'s fallback the *only* way to read state, and centralize it\
      \ so every continuation path (including any future resume endpoint) re-derives\
      \ state from MySQL on a missing key instead of hard-failing.\n3. **Make the\
      \ DB update and the state write one atomic step** (persist state first, treat\
      \ Redis as derived), or drop the \"single authority\" claim: write authoritative\
      \ status only to MySQL, and use Redis purely as a short-lived cache.\n4. **TTL\
      \ floor:** for a session-state key, prefer a TTL larger than any realistic interview,\
      \ or no TTL with an explicit cleanup job for abandoned `ASKING` rows — a *cache*\
      \ TTL of minutes (not hours) + mandatory hydration is safer than a 24h authority\
      \ TTL.\n5. **Explicit `delete` on `finishSession` (already done at line 345→delete\
      \ in store):** keep this so finished sessions never linger — but don't **rely**\
      \ on TTL for correctness in the active case.\n\n### Validation\n- Test: create\
      \ a session, artificially set Redis TTL to a few seconds (or `DEL` key directly),\
      \ leave DB `ASKING`; then call `answer`. Assert it hydrates, resumes from DB\
      \ `questionCount`, and does **not** re-ask the last answered question.\n- Test:\
      \ repeat a read-only `detail()` beyond a reduced TTL; assert key didn't vanish\
      \ under a sliding-TTL build.\n- Load/race: fire N concurrent resumes right after\
      \ expiry under the session lock; assert `questionCount` advances once, monotonically.\n\
      \n## Decision\n\n- **Recommended:** sliding TTL + authoritative DB hydration\
      \ + atomic/ordered persistence, Redis as pure cache.\n- **Accepted trade-off:**\
      \ slightly more DB reads on miss; cache warming on first touch.\n- **Remaining\
      \ risk/mitigation:** a tell-tale hazard is any code path reading Redis without\
      \ the hydration fallback — enforce the fallback as the single read entry point\
      \ and add a regression test that deletes the key before resume."
