      output: "# Database Engineer Contribution — Redis Session TTL vs. Durable DB\
        \ State\n\n## 1. Root cause: fixed TTL is a write-time fence, not an activity\
        \ fence\n\n`InterviewStateStore.java:25,51` applies a **fixed 24 h TTL only\
        \ on `write()`**; `read()` (`:37-39`) does **not** refresh it:\n\n```java\n\
        private static final long TTL_HOURS = 24;\n...\nredissonClient.getBucket(key(sessionId)).set(json,\
        \ TTL_HOURS, TimeUnit.HOURS);\npublic SessionState read(Long sessionId) {\n\
        \    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \    String json = bucket.get();          // no expire() / touch() refresh\n\
        ```\n\nImplications, in order of importance:\n\n- **Silent expiry on idle\
        \ (by design).** Every in-flight turn *ends* with a `write` (`InterviewService.java:188,263,345`),\
        \ so an actively-used session continually re-arms the fence and the 24 h never\
        \ trips mid-conversation. The key first expires when the user is **idle >\
        \ 24 h**. There is no heartbeat/touch on read, so the *intent* \"this DB session\
        \ is still valid/interview in progress\" is decoupled from the cache-lifetime\
        \ guarantee.\n- **Eviction expiry (operational).** Without `noeviction` and\
        \ enough memory, Redis LRU can evict `interview:session:*` keys *before* the\
        \ TTL trips. Same silent loss, zero warning.\n- **TTL is absolute, not last-accessed.**\
        \ \"24 h since *last write/request*\" vs. \"24 h since *last message*\" are\
        \ different contracts; the latter is what continuation actually needs.\n\n\
        ## 2. When and why continuation actually breaks\n\nThe DB row persists (`interview_session`\
        \ with `status/questionCount/currentQuestionId`), and `requireAsking()` (`:380-399`)\
        \ has a **repair path** that reads the DB and re-arms the key when `read()`\
        \ returns null. So a plain idle-expiry does **not** hard-fail the next `answer()`\
        \ — it silently reconstructs. That is the danger: it resumes on a **possibly\
        \ stale/desynced** snapshot.\n\nThe real breaks are three:\n\n**(a) Non-atomic\
        \ dual-write → desynced reconstruction.** DB and Redis are updated in two\
        \ separate statements (`InterviewService.java:183-189`):\n```java\nsession.setStatus(ASKING);\
        \ session.setCurrentQuestionId(msg.getId());\nsession.setQuestionCount(newCount);\n\
        sessionMapper.updateById(session);          // DB committed\nstateStore.write(sessionId,\
        \ newState);       // Redis written afterwards\n```\nIf the process/VM crashes,\
        \ the exception is thrown, or the request times out **between these two lines**,\
        \ DER survives with the *new* state while Redis still holds the *old* state\
        \ (or, if the Redis key already expired, DB is the only survivor). After a\
        \ later silent expiry, reconstruction from DB returns `questionCount`/`currentQuestionId`\
        \ that may be **ahead of what the user was actually shown** — continue double-counts\
        \ or auto-answers a question never delivered.\n\n**(b) Reconstruct in the\
        \ SSE path (async).** `answerStream` (`:197`) re-arms the lock inside a **virtual\
        \ thread** (`:199-203`). If the session key had expired, the reconstruction\
        \ reads DB and rewrites 24 h TTL under the lock — fine — but the SSE turn\
        \ can last up to 300 s (`:198`); if the TTL is short and many concurrent streams\
        \ run, a second virtual thread can read freshly-garbage-collected state. The\
        \ repair is correct *only if it's the single holder of `interview:lock:{id}`,\
        \ which it is* — so this is a latent risk more than today's bug.\n\n**(c)\
        \ Authoritative-source inversion.** `InterviewStateStore`'s own comment declares\
        \ Redis \"单一权威来源\" (single authoritative source), yet the DB is the durable\
        \ truth. Basing the state machine on an ephemeral TTL'd cache means a **cache\
        \ loss silently degrades an in-progress interview** to a best-effort DB reconstruction,\
        \ and that repair exists in only that one call site — there is no universal\
        \ reconciliation, versioning, or drift detection.\n\n## 3. Recommended fixes\
        \ (DBE standpoint)\n\n**R1 — Sliding expiry on read (smallest, correct fix).**\
        \ Freshen the TTL whenever the key is found, so an actively-used key can never\
        \ expire mid-interview and idle-expiry keeps reasonable semantics:\n```java\n\
        public SessionState read(Long sessionId) {\n    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \    String json = bucket.get();\n    if (json == null) return null;\n   \
        \ if (bucket.expire(TTL_HOURS, TimeUnit.HOURS)) {\n        log.debug(\"refreshed\
        \ session TTL sessionId={}\", sessionId);\n    }\n    ...\n}\n```\n(Use `expire`/`expireAsync`,\
        \ not re-`set`, to avoid re-serializing; Redisson `RBucket.expire` is O(1)\
        \ and value-preserving.)\n\n**R2 — Make DB the source of truth; make Redis\
        \ a pure cache (architectural).** Flip the contract: on every hot path, reconstruct\
        \ deterministically from DB as the authority and treat Redis only as a read-through\
        \ performance layer. Then a missing/evicted/expired key is **harmless by construction**\
        \ — there is nothing to silently desync. This removes the crash-window risk\
        \ in (a) entirely.\n\n**R3 — Versioned, idempotent writes to narrow the crash\
        \ window (if keeping Redis authoritative).** Add a monotonic `version`/`questionSeq`\
        \ to `SessionState` and write Redis **first**, then DB, with reconstruction\
        \ comparing the two and reconciling drift. Never auto-resume on a reconstructed\
        \ state whose `currentQuestionId` isn't the message the user actually received.\n\
        \n**R4 — Distinguish \"recovered\" from \"normal\".** When `read()` is null\
        \ but DB is ASKING, return a distinct signal (e.g. `SESSION_STATE_RECOVERED`)\
        \ so the client can re-sync its own view instead of silently continuing and\
        \ double-asking.\n\n**R5 — Operational guardrails.**\n- Set `maxmemory-policy\
        \ noeviction` and size Redis so session keys are never LRU-evicted; make the\
        \ session-key memory predictable (bounded by session count, small payloads).\n\
        - Alert on `expired_keys` / `evicted_keys` deltas for `interview:session:*`\
        \ (or simply global `INFO` counters) — expiry of active ASKING sessions is\
        \ the anomaly to watch.\n- Keep `interview:lock:{id}` lock TTL (`30s` watch-lock\
        \ default) >> the max turn duration, and confirm the compatibility between\
        \ the session/cache TTL and the lock TTL so a lock can never outlive/out-fence\
        \ a reconstructed key.\n\n## 4. Bottom line\n\nThe DB never lies — the bug\
        \ is that an **ephemeral, fixed-TTL cache was made the authoritative state\
        \ machine**. The DB \"remaining valid\" is exactly what makes the expiry *silent*:\
        \ instead of a hard `SESSION_STALE` error, the system transparently reconstructs\
        \ from a DB row that may be several turns ahead/behind the last Redis snapshot,\
        \ so continuation resumes on inconsistent state. Fix is (a) slide the TTL\
        \ on read to stop silent idle-expiry, and (b), preferably, demote Redis to\
        \ a cache of an authoritative DB so continuation is always reconstructible\
        \ and never dependent on cache lifetime."
