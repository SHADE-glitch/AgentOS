      summary: '# 面试会话运行时状态 Redis TTL 静默过期问题分析


        ## 1. 诊断结论


        **核心问题**：Redis 中保存的面试会话「运行时状态」（进行到哪一题、已作答内容、计时进度、当前阶段）被一个**固定 TTL** 绑定。当 Redis
        key 过期时，会话持久化层（DB）仍然是 `IN_PROGRESS` 且有效，但所有与该 key 相关的"续期/恢复"路径都会失效——导致**用户点击"'
      output: "# 面试会话运行时状态 Redis TTL 静默过期问题分析\n\n## 1. 诊断结论\n\n**核心问题**：Redis 中保存的面试会话「运行时状态」（进行到哪一题、已作答内容、计时进度、当前阶段）被一个**固定\
        \ TTL** 绑定。当 Redis key 过期时，会话持久化层（DB）仍然是 `IN_PROGRESS` 且有效，但所有与该 key 相关的\"\
        续期/恢复\"路径都会失效——导致**用户点击\"继续面试\"时无法恢复，或恢复后状态错乱**。\n\n这是一个典型的 **\"caching layer\
        \ 生命周期与 source-of-truth 生命周期不一致\"** 的架构缺陷，不是单纯的缓存失效问题。\n\n## 2. 何时会出问题（触发条件矩阵）\n\
        \n固定 TTL 只有在「会话活动持续时长 < TTL」时才算安全。以下场景必然触发：\n\n| 场景 | 根因 | 表现 |\n|---|---|---|\n\
        | 长会话（> TTL） | 面试总时长超出固定 TTL | 用户答着答着 Redis 过期（用户大多在 TTL 前后恰好在思考，公平性也受害） |\n\
        | 长时间暂停/离开 | 用户思考 3 分钟、去查资料、中断 | 无「活跃续期」机制，key 到期即失效 |\n| 断线重连 / 刷新页面 | 前端持有的\
        \ sessionToken 失效，新连接重建不出状态 | 「继续面试」直接失败或回到陌生状态 |\n| 多设备并发恢复 | 仅最后写 key 的实例刷新\
        \ TTL，另一次的续期丢失 | 时间线 / 已做进度丢失 |\n| 后台任务操作用 TTL key | 判题协程/异步任务读到的 key 已被淘汰\
        \ | 静默 `null`，表现为\"自动判题消失\" |\n\n## 3. 为什么\"DB 有效但 continuation 仍断开\"\n\n\
        有三层独立原因，单看 DB 状态永远判断不出问题：\n\n1. **身份层断裂**：恢复会话的入口依赖 Redis 里的 `sessionToken\
        \ → sessionId` 映射或活动会话注册表。这个注册表 key 过期后，`GET /resume` 找不到映射 → 直接 404/空。\n\
        2. **状态机层断裂**：Redis 中的\"当前位置/已答/计时\"是**增量内存态**，DB 只存了**汇总/目目标**（如 session\
        \ 行 + questions 表，但没有\"进行到第 N 题\"）。即使能找回 sessionId，也无法重建进行中的精确位置。\n   - 关键：**只要「运行时状态」只存在于\
        \ Redis，它的 TTL 就是整个 session 的 TTL。** DB 的合法性只是\"还能打开这个面试\"，不等于\"能续到刚才那一步\"\
        。\n3. **一致性/时序断裂**：固定 TTL 独立于活动性，导致\"Redis 认为结束、DB 认为进行中\"的**中间态窗口**。恢复逻辑通常优先查\
        \ Redis，命中空 → 回退 DB → 但带着错误的分支（判定超时/放弃），把本应 `IN_PROGRESS` 的会话**错误终结**。这是最隐蔽的\
        \ bug。\n\n一句话：**TTL 把\"软状态\"变成了\"硬生命周期\"，而业务期望的是\"随活动续期、随结束清除\"。**\n\n## 4.\
        \ 修复方案对比\n\n### 方案 A：滑动续期（Sliding TTL / Rolling TTL）——推荐\n把固定 TTL 改为**每次活动都能续期的滑动\
        \ TTL**，TTL 表示\"空闲上限\"而非\"总时长上限\"。\n\n```\nTTL = 会话最大空闲时间（如 30 分钟），每次用户交互（答题、心跳、输入节流心跳）时\
        \ refresh\n```\n\n```java\n// RedisTemplate 或 command\nString key = \"sess:runtime:%s\"\
        .formatted(sessionId);\n\n// 每次用户活动时续期\nboolean bumped = redis.opsForValue().setIfPresent(key,\
        \ snapshot, SESSION_IDLE_TIMEOUT, TimeUnit.MINUTES);\nif (BOOLEAN.TRUE.equals(bumped))\
        \ {\n    log.debug(\"session {} slid-forward by activity\", sessionId);\n\
        }\n\n// 心跳（前端 30s 一次）也走同一接口，保证\"活动中不断\"\n```\n\n```js\n// 前端维持心跳与续期（与后端一致）\n\
        setInterval(() => {\n  fetch(`/api/sessions/${sessionId}/heartbeat`, { method:\
        \ 'POST', keepalive: true });\n}, 30_000);\n```\n\n保证：\n- 总时长可超过初始 TTL（活动续期）。\n\
        - 空闲超过阈值才真正过期——此时**合理地**允许将会话标记为暂停/超时。\n\n### 方案 B：无用 Redis 状态，DB 即 truth，Redis\
        \ 仅缓存\n把运行态**落库为可恢复结构**（`runtime_state` 表字段 / JSONB），Redis 只做加速读；丢失后可从 DB\
        \ 全量重建。TTL 退化为\"缓存 TTL\"，可随意短，不影响正确性。\n\n```\n读路径：GET cache → miss → 从 DB\
        \ 重建 → 回填 cache（带 TTL）\n写路径：先写 DB（source of truth）→ 再更新 cache\n```\n\n配合：\n\
        - `session_question` 记录已到达的 question_id + 已作答草稿。\n- `updated_at` 作为恢复点；计时可\
        \ `resume = now - accumulated` 重算。\n\n### 方案 C：显式生命周期 + 结束事件\n不用 TTL 管理会话是否存在，而用**明确的\
        \ start / finish / abort** 语义。TTL 仅作为「异常兜底」，配合 `readyForState` 判断是否仍 `IN_PROGRESS`。\n\
        \n```java\nif (session.status() == IN_PROGRESS && cacheMiss) {\n    // 正常活动应续期；到了这里说明\
        \ 兜底过期/异常，允许重建：\n    SessionRuntime rebuilt = rebuildFromDb(session);\n  \
        \  cache.save(rebuilt, SESSION_IDLE_TIMEOUT);\n}\n```\n这样 DB 的合法性被显式尊重，TTL\
        \ 只兜\"没人用又没结束\"的孤儿。\n\n## 5. 最终推荐与风险\n\n**推荐：方案 A（滑动续期）为主，叠加方案 C 的『DB 状态判定兜底』。**\n\
        \n- 为什么：改动最小、对现有读写路径侵入最低，直接消除\"活动中被静默过期\"这一根因，且保留 Redis 做热状态的能力。\n- 接受权衡：需要前端加心跳；空闲超时仍是硬阈值，可能仍有极小窗口（用户单纯发呆超过空闲上限）。\n\
        - 关键风险：`setIfPresent` 在 key 恰好过期时的竞态 → 需由 C 的 `IN_PROGRESS 兜底`吸收；多实例续期需保证\
        \ `refresh + write` 原子或用 Lua。\n- 缓解：续期与写状态用同一原子命令（Lua 或 `MULTI`）避免\"续了期但没写上\
        \ / 写了没续上\"。\n\n```lua\n-- session_slide.lua：原子续期+落值\nif redis.call('EXISTS',\
        \ KEYS[1]) == 1 then\n  redis.call('SET', KEYS[1], ARGV[1], 'PX', ARGV[2])\n\
        \  return 1\nend\nreturn 0\n```\n\n## 6. 可观测性（必须补齐）\n\n否则下次又\"静默\"。建议监控：\n\
        - `redis_ttl_expiry_rate` 中按 `sess:runtime:*` 前缀的过期计数 → 过期而非删除即告警。\n- 恢复路径的\
        \ `cache_miss_but_db_inprogress` 指标（命中不平滑时抓现场）。\n- 会话续期次数 / 平均空闲时间分布。\n\n\
        ## 7. 判定清单（评审自查）\n\n- [ ] 会话总时长可 > 固定 TTL 吗？→ 若\"是\"则此 bug 必现，必须滑动续期。\n- [\
        \ ] 恢复会话是否需要 Redis 先命中？→ 若\"是\"则须降级到 DB 重建。\n- [ ] Redis 状态与 DB 存在任何时序不一致窗口吗？→\
        \ 若\"是\"补齐终态判定。\n- [ ] 有按 TTL 过期的丢状态告警吗？→ 若无则\"静默\"无法被发现。\n\n---\n以上为 backend-architect\
        \ / database-engineer 侧贡献，供 lead 评审。核心主张：**用滑动续期表达\"活动即存在\"，并让 DB 的有效性作为恢复兜底，把\
        \ TTL 从硬生命周期降级为兜底阈值。**"
