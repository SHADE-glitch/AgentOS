      output: "# Interview Runtime State: Redis fixed-TTL silent expiry vs. durable\
        \ DB\n\n## 1. Where state lives (architecture)\n\n| Layer | Store | Key/Table\
        \ | Authority claim |\n|---|---|---|---|\n| Session record | MySQL `interview_session`\
        \ | row per session; `status`, `questionCount`, `currentQuestionId` | Durable\
        \ |\n| Transcript | MySQL `interview_message` | all AI/answer messages | Durable,\
        \ append-only |\n| **Runtime state machine** | **Redis** (Redisson bucket)\
        \ | `interview:session:{id}` → JSON `SessionState(status, questionCount, currentQuestionId)`\
        \ | Comment says **\"单一权威来源\" (sole authoritative source)** — `InterviewStateStore.java:15`\
        \ |\n| Scoring | MySQL `interview_result` + RabbitMQ | duplicate/result |\
        \ Durable |\n| Dashboard cache | Redis | separate key, 10min TTL | throwaway\
        \ cache |\n\nThe tension: the codebase *declares* Redis the source of truth,\
        \ but the schema already stores every field the state machine needs in MySQL.\
        \ Redis is effectively a redundant cache that happens to be treated as authoritative.\n\
        \n## 2. Root cause\n\n`InterviewStateStore.write()` applies a **fixed, absolute\
        \ 24-hour TTL** on every write:\n\n```java\nprivate static final long TTL_HOURS\
        \ = 24;                              // line 25\nredissonClient.getBucket(key(sessionId)).set(json,\
        \ TTL_HOURS, TimeUnit.HOURS); // line 51\n```\n\n- It is **not a sliding (idle)\
        \ TTL** — it is 24h counted from the *last write*. During active back-and-forth\
        \ each write resets it to a fresh 24h, so active interviews never expire.\n\
        - The moment the user **pauses**, the clock freezes at \"24h from last write\"\
        . There is no freshness/difference between \"absolute\" and \"idle\" — it\
        \ *behaves* like an idle timeout but with one hard discontinuity: **no heartbeat/refresh\
        \ on read**, so a session idle >24h loses its Redis copy even though the MySQL\
        \ row is perfectly valid `ASKING`.\n- Nothing in this store looks at `startedAt`/`updatedAt`\
        \ of the DB record. Redis is allowed to die independently of DB truth.\n\n\
        ## 3. When & why continuation breaks\n\n### 3.1 The intended guard: DB-fallback\
        \ rebuild\n\n`requireAsking()` already anticipates expiry (`InterviewService.java:380-398`):\n\
        \n```java\nInterviewStateStore.SessionState state = stateStore.read(sessionId);\n\
        if (state == null) {\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
        \    ...\n    state = new SessionState(s.getStatus(), s.getQuestionCount(),\
        \ s.getCurrentQuestionId());\n    stateStore.write(sessionId, state);   //\
        \ re-hydrates Redis\n}\n```\n\nSo for the simple \"idle >24h then `POST /answer`\"\
        \ case, continuation is **actually self-healed** — the DB fallback rebuilds\
        \ `(status, questionCount, currentQuestionId)` and resumes. **This is the\
        \ key point the premise must be sharpened against: mere absence is handled.**\n\
        \n### 3.2 Genuinely broken case A — stale-but-present Redis silently beats\
        \ valid DB\n\nThe fallback only reacts to `state == null` (absence). It cannot\
        \ detect **staleness**. Because Redis is treated as authoritative whenever\
        \ the key exists, we get the dangerous sibling of expiry:\n\n- `answer()`/`answerStream()`\
        \ **update DB first, then Redis** (`InterviewService.java:183-189`, `:258-263`).\n\
        - If the Redis `write()` fails (Redisson throws → `BizException` per `InterviewStateStore.java:52-54`),\
        \ the request errors out **after** DB has already advanced.\n- User retries:\
        \ Redis still holds the **old, non-null** state → `requireAsking` reads it,\
        \ treats it as truth, advances `questionCount` again from the wrong base →\
        \ **duplicate question / double-count**, while DB is ahead. Continuation silently\
        \ diverges and no error is raised. This is a real, silent break — and a missing\
        \ write is far more likely under Redis load than a clean TTL expiry.\n\n###\
        \ 3.3 Genuinely broken case B — RAG runtime context is not in DB\n\nMy domain\
        \ focus (RAG): the durable rebuild only restores the 3 scalar fields. If the\
        \ interview's **retrieval/LLM runtime context** (retrieved document windows,\
        \ `RagService`/`KnowledgeMapService` scratch, current in-flight generation,\
        \ guardrail/tool state) is kept only in the Redis runtime state and is **not\
        \ restorable from `interview_message`/knowledge_point**, then after expiry:\n\
        \n- `requireAsking` rebuild succeeds → **request \"continues\"** but the RAG\
        \ pipeline has lost the retrieval/context window → the LLM effectively forgets\
        \ what question was active, what docs were shown, the QA-to-prompt context\
        \ → continuation *looks* fine at the API level but produces a stale/wrong\
        \ next question. That is the most insidious variant: **no error, wrong behavior.**\n\
        \n### 3.4 Genuinely broken case C — `read()` conflates \"absent\" with \"\
        broken\"\n\n```java\nString json = bucket.get();\nif (json == null) return\
        \ null;                 // expired OR never written\n...\ntry { return objectMapper.readValue(json,\
        \ ...); }\ncatch (Exception e) { log.warn(...); return null; }  // parse error\
        \ ALSO -> null\n```\n\nA deserialization corruption is indistinguishable from\
        \ clean expiry — both silently trigger a DB rebuild, masking corruption and\
        \ hiding the count.\n\n### 3.5 Case D — dual-clock divergence after partial\
        \ updates\n\n`create()` inserts the DB row (`:87`) and only later writes Redis\
        \ (`:91`,`:116`). Any crash between them yields DB-valid/Redis-empty; the\
        \ fallback repairs. But the reverse ordering (Redis newer than DB after `answer`),\
        \ combined with 3.2, leaves the two stores permanently on different versions\
        \ with no reconciliation.\n\n## 4. Why the fixed-TTL design is the wrong primitive\
        \ here\n\n- **Redis is used as a state machine, but a TTL is a cache knob.**\
        \ A cache must be rebuildable from the cache *source* (DB). Here Redis is\
        \ declared authoritative, so its eviction policy is arbitrary relative to\
        \ business truth.\n- **Fixed (not sliding) TTL punishes idle, not stale.**\
        \ Idle is the *one* state where cache recreation is harmless; the design protects\
        \ it poorly while leaving stale-but-present (the harmful state) unprotected.\n\
        - **No reconciliation/heartbeat.** Nothing compares Redis state against DB\
        \ `updatedAt`, and Redis TTL is never extended on read, so long-lived-but-active\
        \ multi-day interviews with sparse interaction can still expire mid-thought.\n\
        \n## 5. Recommendations\n\n### 5.1 Make MySQL the authority; Redis a disposable,\
        \ always-rebuildable cache\nReverse the documented assumption. `requireAsking`\
        \ already rebuilds from DB — make that the *only* path:\n- Treat Redis as\
        \ an accelerator; on any miss or corruption, always rebuild from DB (never\
        \ trust a partial read).\n- Persist any RAG runtime context (retrieval window,\
        \ current prompt scaffold) or make it deterministically reproducible from\
        \ `interview_message` rows so rebuild is *complete*.\n\n### 5.2 Sliding idle\
        \ TTL + heartbeat on access\nReset TTL on every successful read so the window\
        \ tracks idleness, not last write:\n\n```java\npublic SessionState read(Long\
        \ sessionId) {\n    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \    String json = bucket.get();\n    if (json != null) {\n        bucket.set(json,\
        \ TTL_HOURS, TimeUnit.HOURS); // refresh on access\n        return parse(json);\n\
        \    }\n    return null;\n}\n```\n(For correctness under concurrency prefer\
        \ a multi-key form; a batched refresh in the state store is fine.)\n\n###\
        \ 5.3 Make TTL configurable, not hard-coded\n```yaml\naiview:\n  interview:\n\
        \    state-ttl: 24h      # read from @Value/@ConfigurationProperties\n```\n\
        and align with your JWT/session re-auth policy so \"state still valid\" and\
        \ \"user still authenticated\" agree.\n\n### 5.4 Distinguish expiry from corruption\n\
        Return a tri-state (absent / valid / corrupt) or raise/log distinctly on parse\
        \ failure instead of collapsing both to `null`, so silent data loss becomes\
        \ observable.\n\n### 5.5 Ordering + atomicity (fixes the *real* break)\nWrite\
        \ **DB first, Redis second; never fail the request because the cache failed.**\
        \ On Redis write failure, treat it as a cache miss, not a fatal error — DB\
        \ is truth — so stale-but-present never becomes the authority:\n\n```java\n\
        sessionMapper.updateById(session);          // 1. durable truth\ntry {\n \
        \   stateStore.write(sessionId, state);      // 2. best-effort cache\n} catch\
        \ (Exception e) {\n    log.error(\"cache write failed, will rebuild from DB\
        \ on next read\", e);\n    // do NOT throw\n}\n```\nOptionally store `updatedAt`\
        \ in state and verify on read (reconcile when DB is newer).\n\n### 5.6 Observability\n\
        Emit a distinct metric/warn log whenever the DB-rebuild fallback fires (currently\
        \ fully silent), so \"silent expiry\" becomes a counted, alerted event rather\
        \ than an invisible repair.\n\n## 6. Bottom line\n\nExpired-but-DB-valid does\
        \ **not** reliably break the trivial resume path — the null-key fallback rebuilds\
        \ state from MySQL. The genuine, silent breaks are: (a) **stale-but-present\
        \ Redis** winning over newer DB (ordering bug 3.2), (b) **RAG runtime context**\
        \ that isn't reconstructible from DB (3.3), and (c) **corruption indistinguishable\
        \ from expiry** (3.4). Fix by demoting Redis to an always-rebuildable cache,\
        \ switching to a sliding/access-refreshed TTL, making the TTL configurable,\
        \ and never throwing on cache-write failure.\n\n*Deliverable produced for\
        \ lead review, role: rag-engineer, based on inspection of `InterviewStateStore.java`,\
        \ `InterviewService.java`, `.env`, and `docker-compose.yml` in `/home/shade/Public/test`.*"
