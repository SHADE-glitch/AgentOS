      summary: '## 面试会话状态：Redis 固定 TTL 静默过期导致续接中断 —— 根因与架构分析


        ### 目标

        - **业务目标**：面试会话运行态（进度、当前题、答案草稿、计时器）在 Redis 中缓存，任务/试卷持久化于 DB。当用户中途刷新、重连或断网后回来时，应能无缝续接。

        - **当前限制**：Redis 键设置固定 TTL（如 `SETEX session:{id} 900 ...`），与 '
      output: "## 面试会话状态：Redis 固定 TTL 静默过期导致续接中断 —— 根因与架构分析\n\n### 目标\n- **业务目标**：面试会话运行态（进度、当前题、答案草稿、计时器）在\
        \ Redis 中缓存，任务/试卷持久化于 DB。当用户中途刷新、重连或断网后回来时，应能无缝续接。\n- **当前限制**：Redis 键设置固定\
        \ TTL（如 `SETEX session:{id} 900 ...`），与 DB 中任务的有效期**不共享生命周期**。\n- **成功标准**：只要\
        \ DB 中任务仍有效，会话就必须可恢复；静默丢失可被探测并自愈，而非报错。\n\n---\n\n### 问题判断\n**核心问题**：Redis\
        \ 是**易失缓存**，DB 是**权威事实源**。两者生命周期独立，TTL 一到 Redis 键被驱逐，但 DB 记录毫发无损——二者进入\"DB\
        \ 有效、缓存失联\"的不一致分叉状态。续接逻辑若**盲读 Redis 且把缓存当唯一真相**，就会在续接点直接失败。\n\n**关键触发场景（何时续接会断）**：\n\
        1. **长会话短 TTL**：面试 > 15 分钟，TTL 设为 15 分钟，中途任何空闲续接点都撞墙。\n2. **滚动作业 vs 固定 TTL**：DB\
        \ 是无过期、可续期的任务，缓存到期固定值，生命周期错配。\n3. **续接窗口无探活**：续接入口 `GET /resume` 直接 `GET session:{id}`，未命中\
        \ `null` → 抛\"会话不存在\"，用户被踢出或丢失草稿。\n4. **冷启动/部署重启**：Redis 重启、flushdb、或 cache-aside\
        \ 缓存线程回收，键瞬时全丢。\n5. **TTL 刷新失败**：依赖被动刷新（每次续接 `EXPIRE`）但刷新代码有 bug 或超时保护漏掉。\n\
        \n**为什么续接断（机制链）**：\n```\n续接请求 → Redis 未命中 (key 已驱逐)\n   ↓ 命中\"缓存优先\"分支\n返回\
        \ 404 / 抛异常 / 重置回第一题\n   ↓ 带副作用\n丢弃客户端本地草稿 + 用户必须重复操作\n```\n\n**主要风险**：\n\
        - 数据丢失（草稿、计时器、已答状态）。\n- 用户状态回退（跳回第一题、重开任务）。\n- 缓存穿透 / 击穿（续接风暴打到 DB）。\n- 恢复逻辑若依赖内存执行体引用（`ConcurrentHashMap`\
        \ 持有 handler），进程重启后连重建都做不到。\n\n---\n\n### 架构建议\n\n#### 方案 A：DB 作为唯一真相源，Redis\
        \ 仅作加速层（缓存降级）**推荐**\n- 续接只在 DB 读权威状态；Redis 只是 fast-path，未命中则回源 DB 重建缓存。\n\
