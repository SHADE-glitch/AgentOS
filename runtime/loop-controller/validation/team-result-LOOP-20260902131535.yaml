        Redis 过期/丢失而 DB 仍有效、续接却悄悄坏掉\"的核心。**\n\n**③ DB 回填不覆盖非列化状态**\n`SessionState`\
        \ 仅 3 个字段，恰好等于 DB 冗余列 → 重建信息等价。但若后续给状态机加任何新运行态(如待评分任务标记、AI 上下文缓冲、SSE 会话句柄)，**只进\
