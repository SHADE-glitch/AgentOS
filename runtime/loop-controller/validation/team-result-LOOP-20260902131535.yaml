    summary: '# Lead Analysis: Redis Fixed-TTL Runtime State vs. Durable DB Session
      — When & Why Continuation Breaks


      ## 问题判断 (TL;DR)

      - **根因**: session runtime state 用 **固定 TTL** 绑定在 Redis key 上，而 TTL 是**写时**属性、只在写'
    output: "# Lead Analysis: Redis Fixed-TTL Runtime State vs. Durable DB Session\
      \ — When & Why Continuation Breaks\n\n## 问题判断 (TL;DR)\n- **根因**: session runtime\
      \ state 用 **固定 TTL** 绑定在 Redis key 上，而 TTL 是**写时**属性、只在写入时重置；同 session 的 DB\
      \ 行**永不过期**，是 canonical truth。两者生命周期时钟脱节，Redis 侧一到点就“静默蒸发”，而 DB 仍认为该 interview\
      \ 完全有效。\n- **关键假设**: Redis = 运行时/热状态，DB = 可续接的权威记录；二者本应互补，却被错误耦合——代码把 Redis\
      \ 的固定 TTL **当作 canonical 状态**而非“缓存租约”。\n- **已知限制**: Redis 过期无应用回调、无异常；`GET →\
      \ nil` 与“从未存在”不可区分，除非显式回查 DB。\n\n---\n\n## 什么时候碎，为什么碎（分两层）\n\n### 1. Redis 层面（机制）\n\
      Redis 用**懒过期 + 后台 ~100ms 采样周期**删除过期的 key，两者都不通知应用：\n- **第一次访问已过期的 key**（懒过期）：当场删掉，`GET`\
      \ 返回 `(nil)`——一个普通 miss，而非错误。调用方永远看不出“曾存在刚过期”。\n- **后台过期循环**：`~100ms` 周期，采样一批带\
      \ TTL 的 key，过期比例 >25% 则反复采样尽快回收内存，但**不保证精确时刻**。\n\nTTL 在**写时一次性绑定**：\n```\n\
      SET session:42 \"<json>\" EX 3600      # 固定：t_w + 3600\nEXPIRE session:42 3600\
      \               # 固定，从 now 算一次\n```\n`EXAT/PXAT` 同理只记一个绝对时刻。它们都**不会因读取而顺延**。真正做“读取即顺延”的是\
      \ sliding TTL（见方案）。\n\n而 DB 行：**无 TTL、永久有效**。Redis 过期只是删掉一份“派生副本”，`session:42`\
      \ 在 DB 里照样 `ASKING`、`updated_at` 全新。\n\n### 2. 应用层面（何时碎、为何碎）\n固定 TTL = “**距最近一次状态写入**\
      \ 24h”，写入仅发生在：创建、每次答题回合**结束时**。而 session 的真实生命周期以**浏览器会话 / 真实活跃度**为准。两者一旦漂移，就是失败窗口。最典型时刻：\n\
      \n```\nt0         创建      Redis 写入，TTL = t0+24h\nt1         答题#1    消息/问题写到\
      \ DB\nt1+n*Δ     user 只 detail()/list()   ← 只读，绝不重置 TTL，时钟继续倒计时\nt2 = t0+24h3m\
      \      Redis key “静默”过期（距最后写入而非最后读取）\nt3         user 点“继续/答下一题”\n         \
      \  续接路径 GET → nil → (取决于实现) 中断\n```\n\n**两种极端都碎**：\n- **短轻会话**: 24h 太 ——垃圾残留。\n\
      - **活跃长会话**: 用户开着 tab 跨天、中途长时间“思考/流式生成/组织长答案而暂未提交”，这段时间 reads 不重置 TTL → healthy-pause\
      \ 被当死会话杀掉。**没有任何一个固定 TTL 值能同时接受健康停顿又拒绝真死会话**——二者对写时时钟不可区分。\n\n**续接时的典型症状**（取决于\
      \ fallback）：\n- 只信 Redis（无 DB 兜底）→ `nil` 被当成“session 不存在/过期/ resume token 无效”，即使用户看到\
      \ DB 里该 interview 完好 → **直接被打回起点**。这是“碎了”的最直接形态。\n- 有懒重建兜底 → 能续，但**丢 Redis-only\
      \ 状态**（进行中的 assistant turn、SSE buffer、上下文窗口、tool-call 草稿），语义降级；若 DB `status=FINISHED`\
      \ 会误抛结束。\n- 更隐蔽的**流中段过期**：`answerStream` 300s emitter 超时、答案在虚拟线程流式生成、写入集中在流**结尾**——一条真正卡住/超长\
      \ turn 可让 key 在活跃对话中途蒸发，产锁状态丢失 → 重复问题/丢答案。\n\n---\n\n## 方案设计对比（Decision Table）\n\
      \n| 方案 | 机制 | 优点 | 缺点 | 适配 |\n|---|---|---|---|---|\n| **A Sliding TTL** | 每次访问\
      \ `GETEX key EX n` / `EXPIRE` 顺延 | 简单，活跃即保活，自动清不活跃 | 写放大(hot-key)；并发 renew 是\
      \ read-modify-write 竞态；**“永不过期 ghost”**：只要后台还在碰它就不死 | 仅用于**瞬时、低价值**缓冲；对可续接记录❌\
      \ |\n| **B 无 TTL + 显式生命周期删** | 不设过期，`finishSession`/abort 显式 `DEL`，另配 reaper\
      \ | 无“过期而DB仍valid”失败；确定性 | 任一完成路径漏 `DEL`(崩溃在DB commit与DEL之间)即**静默泄漏**；需孤儿清扫器；锁若无独立TTL会**僵死锁**\
      \ | 单独用❌（换一种故障） |\n| **C DB 为 single source，Redis 仅可重建缓存** | miss→查DB→重建并写穿\
      \ | **从架构上消灭本 bug 类**，固定TTL也安全 | 重建必须完整：session/current/全量消息/计数/token/status/updated_at\
      \ 都要落DB；首次凉访问有延迟 | ✅ **地基方案** |\n| **E Redlock/托管租约+watchdog** | 锁lease由存活客户端续租\
      \ | 支持跨实例超长活会话 | 重、Redlock 正确性坑 | 仅多实例严格 exactly-once 才需 |\n\n### 最终建议（分层的，非同一种）\n\
      1. **立即（本 bug 等级）**：`read()` 时 renew（方案 A，用 `GETEX`/Lua 保原子），或迁移到 B 的删-on-finish——直接消掉“读取不续期\
      \ + 流式间隔”两个坑。\n2. **始终**：形式化 **C**——加 `last_updated`，miss 时集中到一个私有方法**rebuild-on-miss\
      \ + log-and-heal**，每次修复都告警可观测，把 recompute 数压向 0。\n3. **结构**：向 C 演进。此 DB 已存全量\
      \ `InterviewMessage`，“resume”永远可从 DB 重建；让 Redis 只做速度层，**从不把正确性决策路由到 Redis**。配\
      \ B 的显式删，避免一切残留 key “仍存活”。**分布式锁要有独立于此 key 的 TTL/heartbeat**（别把缓存TTL与锁TTL混成一个）。\n\
      \n### Decision\n- **推荐**: Hybrid —— `DB authoritative + Redis 作为(可带TTL的)快速缓存\
      \ + 访问时 sliding-renew + 完成时显式 DEL + miss时懒重建 + updated_at 不一致检测`。\n- **为何契合**:\
      \ 每个故障模式都有专属防线：过期-而-DB有效→rebuild-on-miss 杀死；ghost/泄漏→TTL 与显式 DEL 双重约束；不一致→updated_at\
      \ 检测；僵锁→独立锁 TTL。TTL 从此是**资源策略**而非**正确性策略**，可增量落进现有“Redis 状态 + 分布式锁”形态。\n- **残余风险与缓解**:\
      \ 四机制交织复杂度高——每项都要代码路径+测试+监控；`updated_at` 差异的**处置**（重建/调和/仅记日志）要在分布式锁内做以免覆盖并发写入；miss-rebuild\
      \ 落在热路径，冷访问首包延迟上升（可用 write-through 缓解）。\n\n---\n\n## 运维与监控（把“静默”变“可见”）\n- 开\
      \ `CONFIG SET notify-keyspace-events Ex`，订阅 `__keyevent@0__:expired`；任何 `interview:session:*`\
      \ 过期但 DB `status=ASKING && updated_at<24h` → **P1**（正是本 bug 签名）。\n- 按 key 前缀统计**过期速率**，>Nσ\
      \ 基线则告警（P2/P3），提示“活跃却被删/应删未删”。\n- 对每次 heal/rebuild 打桩、按天统计（**驱动的领先指标，应趋近 0**）。\n\
      - 监控 `maxmemory`/LRU：TTL 值**不能用来当内存上限的药**（那会重新引入过早过期）；内存问题靠方案 D（历史不进 Redis）+\
      \ B 解决。\n- B 的 reaper 用 DB `updated_at` 索引做 range 扫描，杜绝全表扫。\n- 容量：`峰值并发会话 ×\
      \ 单会话状态字节`；流式期间锁lease须大于流时长（多实例横向扩展时方案 E 才必要）。\n\n## 一个架构反模式要做测试锁定\n> **绝不让一个写路径默默依赖另一个的\
      \ TTL** —— 隐式时间耦合是此类 bug 总根源。\n\n三条硬规则：\n1. Redis 过期**永非正确性信号**——只有 DB 决定 session\
      \ “存在/活跃”；Redis 缺失一律走 **rebuild 或 new**，绝不走 “broken”。\n2. **一 key 一 owner 一生命周期**：TTL\
      \ 变更只在唯一 funnel（`touch`/`expire`/`del`）一处。\n3. 在 key 定义旁与 session-state 模块里**写清\
      \ TTL 契约**（谁续期、谁删除、谁重建），并加一条集成测试：**“DB row valid + Redis expired ⇒ 经 rebuild\
      \ 续接成功”**——这正是整套设计要防的负面断言。\n\n如果你能定位到具体的 `InterviewStateStore`/service 代码，我可以帮你把\
      \ renew-on-access、rebuild-on-miss 和 lock TTL 分离直接落成可上线的补丁。"
