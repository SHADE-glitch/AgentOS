        |---|---|---|---|\n| 运行时状态机 | Redis `interview:session:{id}` | `SessionState(status,\
        \ questionCount, currentQuestionId)` | **固定滑动 TTL = 24h**，每次 `write` 重置(`InterviewStateStore.java:51`)\
        \ |\n| 持久权威 | MySQL `interview_session` | status / question_count / current_question_id\
        \ 冗余列 | 永久，无超时 |\n| 事实历史 | MySQL `interview_message` | 全部问答(`askedQuestionIds`、QA\
        \ 对由此推导) | 永久 |\n\n关键写入顺序是安全的：`answer()`/`answerStream()` 都是**先写 DB(186)、后写\
        \ Redis(188)**，DB 永远不比 Redis 旧，因此 DB 回填在单实例下能重建一致快照。\n\n---\n\n### 2. 会\"\
        静默中断\"的四类场景\n\n**① Redis `maxmemory` 淘汰(最隐蔽，早于 TTL)**\n固定 TTL 只是失效的一种。若 `maxmemory`\
        \ 策略为 `allkeys-lru/random`，容量压力下 key 可能在 24h 前就被逐出。由于 `requireAsking` 把 `null`\
