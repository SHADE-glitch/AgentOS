      output: "# Database Engineer — Domain Review: Redis Interview-State Fixed-TTL\
        \ Silent Expiry\n\n## Conclusion (start here)\n\nThe 24-hour **fixed** TTL\
        \ does not, by itself, silently break the interactive path for the current\
        \ code — because every state transition *resets* it (a rolling TTL in effect),\
        \ and `requireAsking()` has a DB-fallback for a **null** key. The real, silent\
        \ breakage lives in two places:\n\n1. **Stale, not missing, keys.** The DB-fallback\
        \ only covers `read() == null`. Any time the Redis value exists but is *older*\
        \ than the DB (which is exactly what the DB→Redis write ordering guarantees\
        \ under a partial failure), continuation resumes from wrong state and corrupts\
        \ `questionCount`/`currentQuestionId`. This is masked by the fallback design\
        \ and is the most dangerous failure mode.\n2. **The DB-fallback undercuts\
        \ Redis as the \"single authoritative state machine source\"** and only reconstructs\
        \ 3 scalar fields in one code path — a fragile recovery that will silently\
        \ lose any future non-DB-derivable state.\n\nSo: when silent expiry breaks\
        \ continuation is precisely when the key is **missing but no recovery exists**,\
        \ or **present-but-stale** (the more common case). Evidence and fixes below.\n\
        \n---\n\n## Why \"fixed TTL\" behaves oddly here\n\n`InterviewStateStore.write()`\
        \ (`InterviewStateStore.java:51`): `set(key, json, TTL_HOURS, HOURS)` with\
        \ `TTL_HOURS = 24` (`:25`).\n\nBecause `write()` is invoked on **every** transition\
        \ — `create` (`:91`,`:116`), each `answer` (`:188`), `answerStream` (`:263`),\
        \ and `finishSession` (`:345`) — each call **replaces** the value and **resets**\
        \ the 24h clock. Semantically this is a *trellis/sliding* TTL during active\
        \ use, not a hard 24h-from-creation. So \"continuing to answer every ≤24h\"\
        \ never expires. Silent expiry only bites on:\n\n- Idle gap **> 24h** between\
        \ writes, or\n- Key **evicted** early by a Redis `maxmemory`/`eviction` policy\
        \ under pressure, or\n- Key deleted by an operator/tool, or\n- A write that\
        \ is **silently skipped** (see stale-key scenario).\n\nThere is no consumer\
        \ that refreshes the TTL via `TTL`/`EXPIRE` — it's all-or-nothing per write,\
        \ and there is no idle-session reaper keyed on Redis TTL.\n\n---\n\n## When\
        \ and why continuation breaks\n\n### Scenario 1 — Stale key (the true break,\
        \ and the one the fallback doesn't catch)\n\nWrite ordering in `answer()`\
        \ is **DB first, Redis second** (non-atomic):\n- `:183-186` — DB `session`\
        \ updated to `ASKING`, `questionCount+1`, new `currentQuestionId`.\n- `:188-189`\
        \ — `stateStore.write()`.\n\nIf the Redis write fails (e.g. network blip,\
        \ `BizException` thrown at `:54` \"会话状态写入失败\"), the DB already advanced but\
        \ Redis still holds the **previous** `SessionState`. On the next answer:\n\
        \n- `requireAsking()` → `read()` returns a **non-null, stale** value → **no\
        \ DB fallback triggers** (`:382` guard).\n- Line `:179` `int newCount = state.questionCount()\
        \ + 1;` uses the stale count → **wrong `questionCount`**, duplicated `currentQuestionId`,\
        \ descriptors out of sync with DB → continuation silently continues on corrupt\
        \ state.\n\nThe DB-fallback (`:382-390`) only heals **null** keys; it is blind\
        \ to **stale** keys. Whenever they diverge, the system proceeds on whichever\
        \ it read first (Redis), which is the opposite of the DB \"truth\" it later\
        \ writes into. This is the concrete, silent continuation break.\n\n### Scenario\
        \ 2 — Idle session > 24h (recoverable today, fragile)\n\nSession stays `ASKING`\
        \ in DB; Redis key expires silently (no event/log). On return, `requireAsking()`\
        \ gets `null`, reconstructs from DB (`:387-389`), rewrites with fresh TTL.\
        \ Continuation technically resumes — **but**:\n\n- Recovery is hard-coded\
        \ to 3 fields and only exists in the `answer`/`answerStream` path. Any other\
        \ consumer that reads the state bucket without this fallback (a future `status()`,\
        \ admin resume, or scoring check) will treat the session as absent → hard\
        \ failure/\"not found\".\n- The whole point of `InterviewStateStore`'s \"\
        *single authoritative source*\" (`:15`) is silently abandoned; you fall back\
        \ to best-effort DB heuristics, not a guarantee.\n\n### Scenario 3 — Expiry/eviction\
        \ mid-lifecycle + authority inversion\n\n`finishSession` also writes DB-then-Redis\
        \ (`:341-346`). If expiry deletes the `FINISHED` marker before the async scoring\
        \ consumer observes it, a producer path that relied on Redis would see a null/ASKING\
        \ and could re-process, or display an in-progress session for a session the\
        \ DB already finalized. Equally, the TTL conflates two unrelated purposes\
        \ — *idle-GC* and *state-authority* — so it can never be right for both.\n\
        \n### Why the authority inversion exists at all\n\n`InterviewService:380-399`\
        \ reconstructs from DB, i.e. **DB is the de-facto authority**. But all transitions\
        \ *write* DB first and read Redis as the gate. The system is split: **writes**\
        \ assume Redis is authoritative (freshly written last), **reads on miss**\
        \ assume DB is authoritative, and **reads on hit** assume Redis is authoritative\
        \ even when it's the slow/stale side. Three different truth sources with no\
        \ versioning is the root design defect.\n\n---\n\n## Recommended fixes (in\
        \ order of leverage)\n\n### Fix 1 — Version/check the state so stale ≠ valid\
        \ (lowest risk, addresses Scenario 1)\n\nMake the state capacity-aware so\
        \ a stale write cannot be accepted. Add a monotonic `version` incremented\
        \ each transition, reject/overwrite on conflict. Store fields so DB and Redis\
        \ reconcile instead of trusting whichever is read first.\n\n```java\npublic\
        \ record SessionState(long version, String status, int questionCount, Long\
        \ currentQuestionId) {}\n\n// in write(): bump version before persisting DB\
        \ & Redis under one logical tx\n// compare-and-set on Redis to detect interleaving\
        \ writers\nRAtomicLong seq = redissonClient.getAtomicLong(key(sessionId) +\
        \ \":ver\");\nSequenceResCr es = redissonClient.getBucket(key(sessionId)).trySetAndGet(...);\
        \ // compare&set\n```\n\n### Fix 2 — Make DB the source of truth; Redis a\
        \ write-through cache only\n\nKeep Redis purely as a **cache/acceleration**\
        \ of the DB row, not an authoritative gate. Then silent expiry is harmless\
        \ (next request just re-reads DB), which eliminates Scenario 2/3 entirely\
        \ and makes Fix 3 trivial.\n\n```yaml\n# Align semantics explicitly: Redis\
        \ = cache; TTL = safe-to-render-latency, not correctness gate\n```\n\n###\
        \ Fix 3 — Add a reconciliation guard on the null path\n\nMake `requireAsking()`\
        \ fallback correct under concurrency by re-checking under the already-held\
        \ lock and only when the bucket is *absent*, and compare reconstructed state\
        \ *against* the current Redis version (never blindly overwrite) (see `InterviewService:387-389`):\n\
        \n```java\nif (state == null) {\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
        \    // do not trust DB status blindly; if Redis is missing, staleness is\
        \ unknown\n    // -> read-scaling: compare s.questionCount vs expected, prefer\
        \ max(), reject if s already finished\n}\n```\n\n### Fix 4 — Reconcile DB↔Redis\
        \ ordering (atomicity)\n\nEither write Redis **first** then DB (so a failed\
        \ DB write leaves Redis ahead and the next read reconciles down), or wrap\
        \ both in a compensating task that periodically diffs DB vs Redis state and\
        \ fixes the straggler (a `@Scheduled` reconciliation job). A staleness heartbeat\
        \ (`EXPIRE` refresh on every read, not just write) also keeps hot sessions\
        \ alive without depending on write cadence.\n\n### Decision summary\n\n| Option\
        \ | Strengths | Weaknesses | Best for |\n|---|---|---|---|\n| A. Add `version`\
        \ + CAS | Cheap, closes stale-key bug | Still two sources of truth | Immediate\
        \ hotfix |\n| B. DB authoritative, Redis cache | Eliminates whole class, simplest\
        \ mental model | Need to re-read DB on hot path | Correct long-term |\n| C.\
        \ Reconciliation job | Corrects drift automatically | Adds async lag, more\
        \ moving parts | Alongside A/B belt-and-braces |\n\n**Recommended:** B (flip\
        \ authority to DB) + A (version field) as the guard while migrating. Accept\
        \ remaining risk: any transient divergence window is now bounded and self-healing\
        \ via the DB, not silently served.\n\n---\n\n## Verification\n\n- Unit/integration\
        \ test: force a Redis (state) write failure after a DB update, then resume\
        \ → assert `questionCount`/`currentQuestionId` remain consistent (currently\
        \ fails — captures Scenario 1).\n- Test idle > TTL by setting `TTL_HOURS`\
        \ low (or mocking clock): assert continuation either resumes from DB truth\
        \ or hard-fails explicitly — never silently corrupts.\n- Fault-injection:\
        \ `EXPIRE` the key mid-SSE/flows and assert compensated handling.\n- Load\
        \ test with short TTL to prove eviction no longer flakes the state gate.\n\
        \n## Follow-ups\n- Log/monitor missing-vs-stale Redis reads (they're currently\
        \ silent): add a counter/metrics on the `read() == null` branch.\n- Remove\
        \ the TTL's dual meaning: if idle-GC is a product requirement, implement it\
        \ against **DB** `updated_at`, not Redis TTL, so the \"authority\" and \"\
        cleanup\" concerns stop colliding."
