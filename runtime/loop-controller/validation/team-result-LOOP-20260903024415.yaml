      output: "### [SUPPORT] Redis Runtime State TTL Expiry — Continuation Break Analysis\n\
        \n**Team:** `team-18087af2` | **Role:** Database Engineer (Security-Engineer\
        \ lens) | **Files Inspected:** `InterviewStateStore.java:15,25,34-60` , `InterviewService.java:125-265,380-399`\
        \ , `schema.sql:46-60` , `InterviewSession.java:31`\n\n#### 1. Executive Summary\n\
        \n`InterviewStateStore` is declared as **单一权威来源** (`InterviewStateStore.java:15`)\
        \ but writes `interview:session:{id}` with a fixed `TTL_HOURS=24` (`InterviewStateStore.java:25,51`).\
        \ After 24h of **silence since last `write()`**, `RBucket.get()` returns `null`\
        \ and `read()` returns `null` (`InterviewStateStore.java:37-38`; `42-44` also\
        \ on corrupt JSON). DB row in `interview_session` (`schema.sql:46`) remains\
        \ valid indefinitely (no TTL, `deleted` soft-delete only). `InterviewService.requireAsking()`\
        \ (`InterviewService.java:380`) silently rehydrates from DB and re-caches\
        \ for another 24h without freshness/drift checks. Continuation in `answer()`\
        \ (`InterviewService.java:129,179-189`) and `answerStream()` (`InterviewService.java:204,254-264`)\
        \ then derives `newCount = state.questionCount()+1` from potentially stale\
        \ state. This is **authority inversion**: ephemeral cache treated as truth.\n\
        \n**Core Principle (validated):** *Redis-backed runtime state is not authoritative\
        \ after TTL expiry; validate freshness against DB truth before continuing\
        \ a session.*\n\n#### 2. When Does Expiry Happen?\n\n| Condition | Evidence\
        \ |\n|-----------|----------|\n| **Idle >24h** since last `write()` | `write()`\
        \ at `InterviewService.java:91,116,188,263,345` each does `set(json, 24, HOURS)`.\
        \ TTL is **reset only on write**, not on read. 24h of inactivity = expiry.\
        \ Not 24h since `create()`. |\n| **Redis eviction / restart / `FLUSHDB` /\
        \ memory pressure** | Any `bucket.get()==null` triggers same path. No distinction\
        \ between TTL and infra loss. |\n| **Corrupt JSON** | `objectMapper.readValue`\
        \ catch at `InterviewStateStore.java:43-44` `return null` — indistinguishable\
        \ from expiry. Swallowed `log.warn` masks tampering. |\n| **Dual-write failure**\
        \ | `sessionMapper.updateById()` succeeds then `stateStore.write()` throws\
        \ `BizException` (`InterviewStateStore.java:54`) or network partition — DB\
        \ committed, Redis missing → next `requireAsking()` hits fallback. |\n\nDB\
        \ remains valid because `interview_session` has `started_at`/`finished_at`\
        \ only, no expiry (`schema.sql:56-57`), and `InterviewSession.java:31` has\
        \ no `updated_at`/`version`.\n\n#### 3. Why Continuation Breaks — 5 Root Causes\
        \ (G1-G5 Validated)\n\n**G1 — Fixed TTL on authoritative state:** `InterviewStateStore.java:25,51`\
        \ `TTL_HOURS=24` authoritative only while unexpired. Silent `null` on `read()`\
        \ (`InterviewStateStore.java:37`). No `PTTL` check or existence probe before\
        \ use.\n\n**G2 — No freshness validation on fallback/rehydrate:**\n```java\n\
        // InterviewService.java:380-389 — current (vulnerable)\nSessionState state\
        \ = stateStore.read(sessionId);\nif (state == null) {\n    InterviewSession\
        \ s = sessionMapper.selectById(sessionId); // no recency check\n    state\
        \ = new SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId());\n\
        \    stateStore.write(sessionId, state); // blind rehydrate, resets TTL\n\
        }\n```\nNo check of: `DB.questionCount` vs `SELECT COUNT(*) FROM interview_message\
        \ WHERE session_id=? AND kind='question'`; `currentQuestionId` existence;\
        \ `finished_at` recency; or logical version. `schema.sql:46` has no `updated_at`\
        \ to compare — DB itself cannot convey staleness.\n\n**G3 — Fallback masks\
        \ drift:** Blind rehydrate + `write()` hides divergence instead of detecting\
        \ it. If `interview_message` rows were inserted after last Redis write (or\
        \ questionCount incremented via another path), DB `questionCount` may lag\
        \ `message` table. Rehydrated state inherits lag, then `answer()` increments\
