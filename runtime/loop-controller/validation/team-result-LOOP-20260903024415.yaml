    output: "**Lead Report — team-18087af2 | Redis TTL state-drift (Interview session\
      \ continuation break)**\n\n*Database Engineer (lead) + Security / Code Reviewer\
      \ / Backend Architect.*\n\n> Verified against working-tree grounding (`InterviewStateStore.java:25,34-51`\
      \ , `InterviewService.java:380-399,129,204,179` , `schema.sql:46-60`). Hypotheses\
      \ `H-467/H-023..027` are **UNVALIDATED** (`success_rate 0.5 low`) — validated\
      \ below by direct code read.\n\n### 1. Authority inversion\n\n```java\n// InterviewStateStore.java:15\
      \ comment + impl\n// \"单一权威来源\" — Redis is treated as authoritative\nTTL_HOURS\
      \ = 24 // InterviewStateStore.java:25\nRBucket.set(json, TTL_HOURS, HOURS) //\
      \ :51  every write resets to 24h\nRBucket.get() == null -> return null // :37-38\
      \  + parse fail :43-44 -> null\n```\n\n`InterviewService.requireAsking():380`\
      \ is gate for `answer():129` and `answerStream():204`:\n\n```java\n// InterviewService.java:380-399\n\
      SessionState state = stateStore.read(sessionId); // :381\nif(state==null){ \
      \                              // :382 miss = expiry/corruption\n  InterviewSession\
      \ s = sessionMapper.selectById(sessionId); // :383 DB fallback\n  state = new\
      \ SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId());\
      \ // :387-388\n  stateStore.write(sessionId, state); // :389 blind rehydrate\
      \ + fresh 24h TTL\n}\nif(FINISHED.equals(state.status())) throw FINISHED; //:391\n\
      if(!ASKING && !START) throw STATE_ERROR; //:394\nreturn state; // caller does\
      \ newCount = state.questionCount()+1 :179,254\n```\n\nDB (`interview_session`)\
      \ is durable, Redis is volatile/TTL. Code inverts this.\n\n### 2. When it breaks\
      \ — fixed 24h since *last write*, not since creation\n\n`write()` called only\
      \ on: `create() START:91, ASKING:116`, `answer() ASKING:188`, `finishSession()\
      \ FINISHED:345`. So expiry = `lastStateTransition + 24h` of silence.\n\n| Trigger\
      \ | Timeline | Observable |\n|---|---|---|\n| Normal long pause | T0 `ASKING/qCount=N`\
      \ written. User idle 24h+ (overnight/multi-day interview, abandon). T0+24h Redis\
      \ `interview:session:{id}` expires. DB still `ASKING, qCount=N, status=ASKING`\
      \ | Next `POST /answer` hits `read()==null` → DB fallback. Appears to succeed\
      \ but resumes on stale counters |\n| Redis failover/flush/eviction | `FLUSHDB`,\
      \ node restart, maxmemory eviction, key migration | Same null → fallback, even\
      \ within 24h |\n| Corrupt payload | `ObjectMapper.readValue` throws → `catch\
      \ -> null` `:43-44` | Treated as expiry |\n\n**Not** wall-clock 24h from creation.\
      \ Extending TTL only widens window, does not fix class.\n\n### 3. Why continuation\
      \ breaks — 5 gold issues\n\n**G1 — Silent `null` on authoritative state.** Redis\
      \ TTL expiry is indistinguishable from never-created. No log/metric on `:37`\
      \ null telling expiry vs corruption. *Code Reviewer finding:* silent failure\
      \ path violates fail-open principle.\n\n**G2 — No freshness validation.** `requireAsking`\
      \ rehydrates without checking:\n- DB `interview_session` has no `updated_at`\
      \ (`schema.sql:56-57` only `started_at/finished_at`). Cannot tell staleness.\n\
      - No `SELECT MAX(id) FROM interview_message WHERE session_id=?` count check\
      \ vs `s.getQuestionCount()`\n- No status-transition legality (e.g., `START->ASKING`\
      \ skip due to lost `currentQuestionId`).\n\nBlind rehydrate `SessionState(s.getStatus(),\
      \ s.getQuestionCount(), s.getCurrentQuestionId())` fed directly to `newCount\
      \ = state.questionCount()+1`.\n\n**G3 — Fallback masks drift.** Should `detect`\
      \ divergence but instead `resets 24h TTL` (`:389`) and hides it. Second call\
      \ now sees \"fresh\" Redis state that is actually DB-stale. If DB was updated\
      \ without Redis (see G5), drift becomes permanent and cached for next 24h.\n\
      \n**G4 — Continuation depends on drifted counter.** `answer():179` `int newCount\
      \ = state.questionCount()+1;` → `session.setQuestionCount(newCount); sessionMapper.updateById();\
      \ stateStore.write(...,newCount,)`. If state was stale (DB count `3` but 2 messages\
      \ already lost/pending), newCount becomes `4` while message history says `5`,\
      \ or duplicates question `pickQuestion` exclusion list diverges → repeated or\
      \ skipped questions, `MAX_QUESTIONS=6` finish boundary misfires.\n\n*DB + Backend\
      \ Architect trace:* `askedQuestionIds` derived from `messageMapper` (`:135-144`)\
      \ but counter from Redis/DB — two truths.\n\n**G5 — Dual-write non-transactional.**\n\
      ```\nsessionMapper.updateById(session); // DB\nstateStore.write(sessionId, state);\
      \ // Redis :seen 116,188,263,345\n```\nNo TX/XA. Crash between writes → divergence.\
      \ `redissonClient.getLock(\"interview:lock:\"+sessionId):362` only guards concurrent\
      \ threads, not cross-system atomicity. `lockFor` `LOCK_WAIT=5s` does not cover\
      \ DB-commit→Redis-set window.\n\n**Security Engineer note:** Rehydrate does\
      \ re-check `requireOwnedSession(userId,sessionId):401` ownership before `requireAsking`,\
      \ so TTL expiry does not enable hijack. But replay: expired FINISHED session\
      \ rehydrated as FINISHED correctly rejects (`:391`), no privilege escalation\
      \ — drift is correctness/availability, not auth bypass.\n\n### 4. Repro matrix\
      \ (Testing Engineer)\n\n```java\n// TTL-expiry reproduction — no sleep, inject\
      \ mocks\nwhen(redissonClient.getBucket(\"interview:session:42\").get()).thenReturn(null);\
      \ // expiry\nwhen(sessionMapper.selectById(42L)).thenReturn(askingSession(qCount=2));\n\
      SessionState s = interviewService.requireAsking(42L); // blind rehydrate\nassert\
      \ s.questionCount()==2 && verify(stateStore).write(eq(42L), any()); // G3\n\
      // drift case: DB qCount 2 but messages size 3 => assert shouldFinish() disagreement\n\
      ```\nCover: `F1` exact 24h+1ms idle, `F2` redis flush mid-session, `F3` corrupt\
      \ JSON, `F4` DB=FINISHED + redis expired, `F5` DB update succeeds / redis write\
      \ throws `BizException: INTERNAL_ERROR :54`.\n\n### 5. Fix — DB parity before\
      \ accepting fallback (lesson vector prioritizes this over raising TTL)\n\n**Recommended\
      \ `requireAsking` patch** (`InterviewService.java:380`):\n\n```java\nprivate\
      \ SessionState requireAsking(Long sessionId){\n  SessionState cached = stateStore.read(sessionId);\n\
      \  InterviewSession s = sessionMapper.selectById(sessionId);\n  if(s==null)\
      \ throw new BizException(INTERVIEW_NOT_FOUND);\n  if(FINISHED.name().equals(s.getStatus()))\
      \ throw new BizException(INTERVIEW_FINISHED);\n  if(cached==null){\n    // freshness\
      \ check: compare DB counter vs ground truth message count\n    long msgQuestionCount\
      \ = messageMapper.selectCount(\n      new LambdaQueryWrapper<InterviewMessage>()\n\
      \        .eq(InterviewMessage::getSessionId, sessionId)\n        .eq(InterviewMessage::getKind,\"\
      question\"));\n    if(!Objects.equals(s.getQuestionCount(), (int)msgQuestionCount)){\n\
      \      log.warn(\"drift detected session={} dbCount={} msgCount={}\", sessionId,\
      \ s.getQuestionCount(), msgQuestionCount);\n      s.setQuestionCount((int)msgQuestionCount);\
      \ // heal DB or throw STATE_ERROR\n      sessionMapper.updateById(s);\n    }\n\
      \    cached = new SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId());\n\
      \    stateStore.write(sessionId, cached);\n    log.info(\"rehydrated after TTL\
      \ expiry session={} status={}\", sessionId, s.getStatus());\n  } else if(!Objects.equals(cached.status(),\
      \ s.getStatus()) \n          || cached.questionCount()!=s.getQuestionCount()){\n\
      \    log.warn(\"cache/DB divergence session={} cache={} db={}\", sessionId,\
      \ cached, s);\n    // trust DB: invalidate and rehydrate\n    stateStore.delete(sessionId);\n\
      \    return requireAsking(sessionId);\n  }\n  // ... existing status guard\n\
      \  return cached;\n}\n```\n\n**Config / schema:** \n- Do **not** just `TTL_HOURS=72`.\
      \ Keep 24h but add `interview_session.updated_at DATETIME ON UPDATE` (`schema.sql`)\
      \ + version column for optimistic check.\n- Treat Redis as cache not source-of-truth\
      \ (update comment `:15`). Alternatively use `RBucket.setIfAbsent` + explicit\
      \ expiry touch on read (`expire(24,HOURS)`) for sliding window, with metrics.\n\
      - Add dashboard pattern reference: `DashboardService.java:81-91` `evict()` now\
      \ present on all 4 write paths — proves fix class is `eviction/freshness stamp`,\
      \ not TTL extension.\n\n**Operational:** alert on `read()==null && DB ASKING`\
      \ rate; distinguish expiry vs parse-failure; make dual-write idempotent (write\
      \ Redis first with short TTL, then DB, then extend; or use outbox).\n\n*Verification:*\
      \ after patch, blind rehydrate eliminated; continuation either heals via DB\
      \ truth or fails fast with `INTERVIEW_STATE_ERROR` instead of silent stale `ASKING`\
      \ continuation.\n"
