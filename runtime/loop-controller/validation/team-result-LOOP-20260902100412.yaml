        the consumer cannot correlate the payload to a recovered `questionCount` —
        it must rely purely on DB message history (which it already does via `InterviewMessage`),
        reinforcing recommendation #1: **persist all state-machine fields in the DB
        and treat Redis only as a TTL-managed, reconcilable cache.**'
