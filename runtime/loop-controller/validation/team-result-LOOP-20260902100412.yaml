        a TTL-minted key under memory pressure **well before 24h**, silently and while
        DB still holds the session.


        ### Why it breaks (root cause)

        Two sources of truth with *different lifetimes*: the runtime copy can die
        (TTL/eviction) while the durable copy lives on, and the advertised “Redis
        is authoritative” (`:15`) is contradicted by the fallback (`:380-399`), which
        actually treats DB as authoritative. The system is really *cache-with-fallback*,
        and continuation breaks exactly when the cache empties and the fallback is
        incomplete, absent, or racing the expiry.


        ### Recommendations for lead review

        - **Convert to a sliding TTL / activity-driven lifetime.** Refresh on read
        or heartbeat a `lastActivityAt` probe so active sessions never expire while
        idle ones reclaim memory — removes case 1 and part of case 5.

        - **Drop Redis as source of truth.** State is already fully mirrored in DB;
        treat Redis as a pure rebuildable cache keyed by a version/`updated_at` fingerprint,
        and re-hydrate atomically under the existing distributed lock (`lockFor`)
        — this is already where `requireAsking` runs.

        - **Add staleness detection.** Store a monotonic sequence or `updated_at`
        in BOTH places; on fallback, detect if the DB snapshot is newer than what
        the request assumed and fail/reject rather than silently continue on stale
        state.

        - **Extend the fallback to every state-forwarding entry point**, not just
        `answer`/`answerStream`, and keep the DB-before-Redis write ordering (case
