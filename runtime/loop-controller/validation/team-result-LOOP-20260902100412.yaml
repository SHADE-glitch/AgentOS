      output: '## Code Review Contribution — Redis TTL vs DB Validity for Interview
        Session State


        **Focus files:**

        - `InterviewStateStore.java` — the TTL leak (line 25, 51)

        - `InterviewService.java` — `requireAsking()` reduces the impact (lines 380–399),
        only reader

        - `RedissonConfig.java` — no eviction policy configured (silent eviction risk)

        - `InterviewStatus.java` / `schema.sql` — FSM + durable columns


        ### 1. What is actually happening under the hood


        `InterviewStateStore.write()` performs `bucket.set(json, 24, HOURS)` (line
        51). Redisson''s `.set(value, ttl, unit)` writes a Redis key with that exact
        TTL. Two consequences:


        1. **Any write resets TTL to a full 24h.** Active sessions (create → answer
        → … → finish) each refresh it, so they never expire — expiry is *only* a function
        of idle time.

        2. **The TTL is completely detached from DB validity.** The `interview_session`
        row is durable and remains `status=ASKING` forever; the Redis key is silently
        dropped ~24h after the *last write*.


        The comment at line 15 declares Redis the "单一权威来源" (single authoritative source)
        of the state machine — while it is actually the *volatile* projection. That
        inverted durability model is the root defect.


        ### 2. When continuation breaks


        The concrete trigger is:


        > **Any session that stays in `ASKING` (or `START`) without an `answer`/`finish`
        for ≥ 24 h.**


        The DB keeps the row valid (`ASKING`, `current_question_id`, `question_count`
        intact, no `finished_at`). Redis evicts the key. From the user''s/business''s
        view the interview is live; from the cache''s view it no longer exists.


        Note the *reads do not refresh TTL*. `detail()`, `listByUser()`, `result()`
        (InterviewService lines 283–323) touch **only the DB**, never Redis. So a
        user can effectively keep the interview "alive" across days via reads, but
        Redis silently expires with zero write activity.


        Add the second silent path: Redis with default `maxmemory-policy noeviction`,
        under memory pressure, only expires on access — but if an operator sets `allkeys-lru`,
        an idle session can be evicted **well before** the 24h TTL, worsening the
        silent loss.


        ### 3. Why continuation breaks (and why the current interactive path merely
        *looks* safe)


        Crucially: `requireAsking()` (line 381) is the **only** `stateStore.read()`
        caller, and it does a DB rehydrate on `null` (lines 383–390), then rewrites.
        So today, the interactive `/answer` path self-heals and continues.


        That healing is **accidental correctness, not designed correctness**, and
        it fails the moment you leave this one code path:


        - **Rehydration only reconstructs the 3 persisted scalar fields** (`status`,
        `questionCount`, `currentQuestionId` — all present in `interview_session`).
        Anything transient stored only in Redis (RAG retrieval context, per-round
        cursor, token budget, streaming position) is silently lost → the interview
        resumes at the wrong round or repeats a question, *still* looking "valid".

        - **Every other prospective reader is fragile.** Any new consumer — a timeout-janitor
        job, a resume/notification worker, a multi-instance node — that calls `stateStore.read()`
        directly and treats `null` as "absent/invalid" will silently treat a live
        interview (per DB) as expired/abandoned, throwing `INTERVIEW_STATE_ERROR`
        or wrongly finalizing it.

        - **Rehydration resurrects DB zombies.** It rebuilds from `s.getStatus()`
        regardless of how old it is, so an abandoned session gets revived rather than
        a clean child-resume.


        ### 4. Recommendations (DB engineer priority order)


        1. **Make the DB the source of truth for *lifecycle*; treat Redis as a write-through
        cache.** Fix the line-15 comment/documentation and the design intent. Validate
        state transitions against the DB row (with an optimistic `updated_at` version
        or `status` guard held under the existing `interview:lock:{id}`), not against
        the volatile key.


        2. **Sliding TTL, refreshed on read — not just on write.** Either call `bucket.expire(ttl,
        unit)` inside `read()`, or derive TTL from DB validity (`max_life = deadline
        – started_at`) instead of a global constant. Replace the fixed `TTL_HOURS`
        with a value tied to the actual interview deadline so "DB valid" and "cache
        valid" stay in phase.


        3. **Make rehydration the designed, centralized recovery — not an inline fallback.**
        Replace the ad-hoc `null` branch in `requireAsking` with a single `loadOrHydrate(sessionId)`
        that every consumer shares and that records `recovered-from-db` provenance
        (log + metric). Never return raw `null` to callers.


        4. **Guarantee state is fully reconstructible.** Ensure every `SessionState`
        field is duplicated into `interview_session` (it is today) so a hydrated state
        is bit-identical to the cached one. Add `updated_at`; on read, prefer DB if
        Redis is missing *or* stale.


        5. **Configure and de-risk eviction.** Set a deliberate `maxmemory-policy`
        (e.g. `allkeys-lru`) **and** depend on it — design so any eviction is a DB-rehydrate
        event, never a break.


        6. **Observe the silent repair.** Log/count the "Redis miss → DB hit → rehydrate"
        path in `requireAsking`. A rising rate is the early warning that sessions
        are being dropped and continuation is being *masked* rather than avoided;
        alert on it.


        **Net:** the TTL doesn''t crash the current single `answer` path because `requireAsking`
        rehydrates — but that is one reader-dependent accident, the TTL is unlinked
        from DB validity, and the fixed-24h/sliding-on-write modeling silently drops
        any session idle > a day from every non-rehydrating consumer and any future
        transient state. Fix by inverting authority (DB owns lifecycle) and replacing
        fixed TTL with read-refreshed, DB-derived TTL.'
