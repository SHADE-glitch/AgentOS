        ### 1. Ground truth: what lives where

        Redis is declared the "single source of truth" for the state machine (`InterviewStateStore.java:15`),
        holding only `(status, questionCount, currentQuestionId)`. The DB (`interview_session`,
        `interview_message`) holds the **durable** truth but these same three fields
        also exist on `InterviewSession`. Critically **all three Redis fields are
        a byte-for-byte copy of DB columns that are written together under the same
        Redis lock** (`InterviewService.java:183-189`). So Redis is not actually storing
        anything the DB lacks — yet the runtime treats Redis absence as authoritative.


        This is the core design hazard: a cache holding *derived* state is treated
        as the source of truth, but it is the one component with an imposed lifetime.


        ### 2. Why it can silently expire

        `write()` always re-applies a **fixed** absolute TTL (`InterviewStateStore.java:51`).
        The TTL is:

        - reset from the **last write**, not from creation and not activity-monotonic,

        - **never refreshed on `read()`** (interaction that triggers reads but no
        writes doesn''t extend life),

        - **not correlated with any DB deadline** (e.g. `asked_at`/`updated_at`),

        - **not keyed to the session lifecycle** (the same constant applies to `START`,
        `ASKING`, and `FINISHED` states alike).


        There is **no** keyspace-notification listener, no tombstone/expiry marker,
        and no reconciliation job (grep across `*.java` for `onExpired|Expired|KeyExpired`
        returns nothing). So the key simply vanishes at `last_write + 24h` with no
        side effect and no alert.


        ### 3. When continuation actually breaks (scenarios)

        An attempt to *continue* is served by `answer()`/`answerStream()` → `requireAsking()`.
        That path **does** have a DB fallback (lines 381–390). So plain "answer the
        next question" is resilient. The breakage appears in these concrete windows:


