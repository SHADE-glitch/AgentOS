        - **Instrument & alert**: log every fallback re-hydration for a session still
        `ASKING` and every missing-key read, so silent expiry becomes an observable
        signal rather than an opaque resume failure.


        Net: continuation breaks the moment Redis loses the runtime truth and the
        durable DB can’t (or isn’t asked to) reconstruct it; the fix is to stop treating
        the TTL-capped Redis key as authoritative and make recovery complete, ordered,
        and version-checked.'
