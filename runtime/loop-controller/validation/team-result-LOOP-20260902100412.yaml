        "works" but the reconstruction is indistinguishable from a fresh pause — the
        system cannot tell "paused, resumable" from "expired, lost transient context."

        - **S-2 — Read-only monitors/pollers let the key die mid-flight.** SSE `answerStream`
        holds a 300s emitter but TTL is only touched by `write`. A status poller or
        a long-running SSE that spans a 24h boundary leaves the key to expire even
        though the session is active; the fallback reconstruct may race a real concurrent
