      output: "# Security Review: Redis Fixed-TTL Session State vs. Persistent DB\
        \ Validity\n\nFocus: **security engineering**. I'll explain the mechanics\
        \ of *when/why* continuation breaks, then frame the risks and hardening as\
        \ security controls.\n\n## 1. When it silently breaks\n\nA fixed TTL (set\
        \ once, tied to *creation*, not *activity*) causes the split-brain:\n\n| Condition\
        \ | Redis runtime state | DB session record | Result |\n|---|---|---|---|\n\
        | Session shorter than TTL | Alive | Valid | OK |\n| Session idle/active **longer**\
        \ than TTL | **Evicted silently** | Still Valid | **Fixation → broken/privileged\
        \ continuation** |\n| Redis key reused after expiry (key collision) | New/NULL\
        \ | Valid | Contamination |\n| TTL refresh done at start only | Stale on long\
        \ sessions | Valid | Break |\n\nThe key failure modes (why it breaks):\n-\
        \ **Fixed, not sliding, TTL** — validity is bounded by *creation time*, so\
        \ any real session where the candidate takes longer than the TTL loses its\
        \ runtime state even while the DB still considers the interview valid.\n-\
        \ **No invalidation signal** — eviction is silent; nothing informs the DB\
        \ layer or the client that state was dropped. The system now holds two contradictory\
        \ truths — a classic **split-brain / inconsistency**.\n- **7-hour vs 24-hour\
        \ patterns** — if TTL is set e.g. 4h but DB record is 48h, long pauses (research,\
        \ compile, writing answers) cross the expiry boundary mid-activity.\n\n##\
        \ 2. Specific security risks (my domain focus)\n\n1. **TOCTOU / authz split.**\
        \ DB says the principal is a valid session holder; Redis (which may carry\
        \ authz details, progression, tokens) is gone. Code that validates against\
        \ the DB then reads missing Redis state must fail — or it may fall back to\
        \ a default, which is a **privilege/decision bug**. Falling back to *more*\
        \ permissive or re-issuing credentials on Redis absence is the highest-risk\
        \ branch.\n2. **Session fixation.** If the client token survives, but server-side\
        \ state was evicted while `sessionId` stays the same, an attacker who captured\
        \ the ID during the gap can reuse it against freshly-created state.\n3. **Key\
        \ collision / cross-session contamination.** A fixed key (e.g. `session:{id}`)\
        \ whose Redis entry expires, then a *new* session reuses the same numeric\
        \ id → the new session may read **another user's cached runtime state** (cache\
        \ poisoning). This can leak interview data or splice answers across candidates.\n\
        4. **Silent expiry is unobservable.** No WARNING-level event, no DB reconciliation\
        \ → drift goes undetected; incident response has no log trail for *why* a\
        \ submission was rejected or accepted.\n\n## 3. Why the DB-on-its-own is insufficient\
        \ (as you asked: DB remains valid)\n\nThe DB is the **source of truth for\
        \ persistence**, but the runtime session carries **ephemeral, high-frequency\
        \ state** (live progress, tokens, throttles, in-progress answers). \"DB still\
        \ valid\" only guarantees *identity/persistence*; it does **not** guarantee\
        \ *continuity of runtime context* or *freshness of authorization grants*.\
        \ Continuation requires the runtime state to exist atomically when the resume\
        \ request lands — and a fixed TTL breaks that atomicity at the moment of latency.\n\
        \n## 4. Recommendations / countermeasures\n\n- **Sliding (idle) TTL instead\
        \ of fixed**: refresh on every request (write to live progress), expiry only\
        \ on true inactivity, not on elapsed wall-clock.\n- **TTL >= max possible\
