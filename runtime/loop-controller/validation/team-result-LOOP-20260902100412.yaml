      # Redis Fixed-TTL Sessi'
    output: "Based on my review of the actual codebase (`InterviewStateStore.java`,\
      \ `InterviewService.java`, `RedissonConfig.java`), here is my consolidated analysis\
      \ as lead engineer.\n\n---\n\n# Redis Fixed-TTL Session Expiry: When & Why Continuation\
      \ Breaks\n\n## 1. The mechanism in this codebase\n\nThe runtime state machine\
      \ lives in Redis as a single blob key, fixed 24h TTL:\n\n- `InterviewStateStore.key()`\
      \ → `interview:session:{sessionId}` (`InterviewStateStore.java:30`)\n- `write()`\
      \ → `bucket.set(json, TTL_HOURS, HOURS)` (`InterviewStateStore.java:51`) — **each\
      \ write resets the TTL to a full 24h** from that moment\n- `read()` (`InterviewStateStore.java:34-46`)\
      \ — **does NOT refresh the TTL**. A pure read leaves the key's remaining lifetime\
      \ untouched.\n- `TTL_HOURS = 24` hard-coded at `InterviewStateStore.java:25`.\n\
      \nSo the TTL is **idle-based** (refreshed only on mutation), not *active-window*\
      \ and not *read-sliding*.\n\nMeanwhile the durable record (`interview_session`\
      \ + `interview_message` rows in MySQL) is unchanged and always valid. That asymmetry\
      \ is the root of the problem: **Redis decides \"can you continue,\" MySQL decides\
      \ \"does the session still exist.\"**\n\n---\n\n## 2. When it breaks (concrete\
      \ enumeration)\n\nContinuation = answering the next question (`answer()` / `answerStream()`),\
      \ the only path gated on Redis (`requireAsking()`, `InterviewService.java:380-399`).\
      \ It dies when a key is gone while the DB session is still `ASKING`/`START`.\
      \ The realistic trigger buckets:\n\n1. **Dominant case — abandoned/paused in-progress\
      \ session (idle expiry).** User starts an interview, answers Q1–Q2, leaves;\
      \ DB row stays `ASKING`, messages persist. No mutation for 24h → the last `write()`\
      \ was >24h ago → key expires. On resume, `stateStore.read()` returns `null`.\n\
      \n2. **Slow-turn/LLM-hung sessions.** Not the practical TTL case (>24h between\
      \ *writes*) but conceptually: here TTL is keyed to mutation, so even an actively\
      \ *viewed* session dies if it stops producing writes.\n\n3. **Non-TTL state\
      \ loss of the same class:**\n   - Redis **eviction** (`maxmemory-policy`, `allkeys-lru`,\
      \ etc.) drops keys regardless of TTL/DB validity.\n   - Redis **restart without\
      \ persistence / `FLUSHALL`** → cold store, DB untouched.\n   - **Schema drift\
      \ on the state blob:** `SessionState` is a `record(status, questionCount, currentQuestionId)`\
      \ (`InterviewStateStore.java:27`). Adding/renaming a field makes `objectMapper.readValue`\
      \ fail; `read()` swallows the exception and returns `null` (`:41-45`) — **physically\
      \ present key behaves as expired** while the DB is valid. This is a silent-expiry\
      \ that has nothing to do with wall-clock time and is easy to ship inadvertently.\n\
      \n---\n\n## 3. Why continuation breaks (root causes)\n\n**a) Redis is the state-machine's\
      \ single source of truth, but it is ephemeral by design.** The comment at `InterviewStateStore.java:15`\
      \ says exactly this (\"单一权威来源\"). Continuing requires a *transition* decision\
      \ (ASKING→next ASKING, or →FINISHED), and that decision is made by reading `SessionState`.\
      \ When the authority is empty, the gate has nothing to evaluate, so the caller\
      \ must pick one of three behaviors:\n\n- **Reject** → user is unblocked; session\
      \ can no longer be continued (hard break), even though DB says it's mid-interview.\n\
      - **Rehydrate from DB** → works, but introduces the mismatch risks in (b)/(c).\n\
      - **Restart** → silently wipes the user's in-progress answers (worst).\n\nIf\
      \ a naive implementation treats `null` as \"create new session\" or \"session\
      \ finished,\" you get wrong transitions (double questions, losing the state\
      \ machine) precisely when the DB record is healthy.\n\n**b) Dual-write is not\
      \ transactional → divergence is masked until expiry.** Each mutation does `sessionMapper.updateById(...)`\
      \ *then* `stateStore.write(...)` (e.g. `:110-117`). These are two independent\
      \ stores with no commit boundary. If the Redis write fails/returns late, or\
      \ DB and Redis TTL skew, the two sources disagree. Redis expiry is then the\
      \ moment the divergence becomes visible: the emergency source (DB) suddenly\
      \ becomes the *only* source, and its values were possibly already out of sync\
      \ with the last transition the state machine thought it made.\n\n**c) Lazy rehydration\
      \ is not race-safe against async completion.** `requireAsking()` rehydrates\
      \ `null` → DB (`:383-389`, creating a fresh `SessionState` from the row, then\
      \ writes it back). The Redis fallback is restored here, so *this* code does\
      \ NOT hard-break on idle expiry — good. But the fallback is a **read-modify-write\
      \ that can resurrect volatile state**. `finishSession()` triggers async scoring\
      \ via RabbitMQ (`:352-357`) *after* writing FINISHED+evicting the dashboards.\
      \ If a session's Redis expired and a concurrent `answer` rehydration writes\
      \ back an `ASKING` copy (stale DB, or scoring still in-flight), you can re-open\
      \ a session that logic *chose* to finish → duplicate answers/results or a user\
      \ submitting into a finishing session.\n\n**d) `detail()`/`result()` bypass\
      \ Redis (`:291-323`) → uneven liveness.** These read MySQL directly and succeed\
      \ after expiry, so the UI \"looks\" fine and resumable; only the answer path\
      \ fails. The inconsistency between \"I can see my session and my Q1\" (DB ok)\
      \ and \"I can't answer Q2\" (Redis gone) is exactly the \"silent\" part users\
      \ experience as a bug with no error pointing at a cause.\n\n---\n\n## 4. Code-level\
      \ walkthrough (where it bites)\n\n- `requireAsking()` (`InterviewService.java:380`):\
      \ `stateStore.read()` → `null` → fallback. **Already recovers** — so in *this*\
      \ repo, idle expiry degrades gracefully instead of throwing. Verify this is\
      \ intentional; if you *want* hard-stop, remove `:383-389`.\n- `answer()`/`answerStream()`\
      \ (`:129`, `:204`): both are the only Redis-gated continuation paths.\n- `write()`\
      \ (`:51`) swallows failures to a log line and throws a generic `BizException(INTERNAL_ERROR)`;\
      \ a `null` rehydration write can therefore silently persist a reconstructed\
      \ state.\n\n**Net:** in this codebase the hard break is mitigated; the residual\
      \ risks are (c) resurrection races, (d) liveness asymmetry, and (1)/(3) eviction\
      \ + schema drift.\n\n---\n\n## 5. Recommended fixes & configuration\n\n1. **Choose\
      \ the single authority explicitly and stick to it.**\n   - If Redis is a **cache**\
      \ → keep rehydration but write-through and make DB authoritative; then TTL is\
      \ only a perf knob and expiry is harmless.\n   - If Redis is the **authority**\
      \ (current design) → a missing key for a DB-`ASKING`/`START` row must **fail\
      \ loudly** with clear observability, not silently rehydrate/restart.\n\n2. **Make\
      \ liveness match usage.**\n   - **Sliding TTL:** refresh on read too, so an\
      \ actively-interacting session never idles out. E.g. re-`write()` in `read()`\
      \ when remaining TTL is low, or use a read-with-PEXPIRE.\n   - Or **extend via\
      \ activity heartbeat:** bump TTL (not overwrite state) on any user action.\n\
      \n3. **Guard rehydration atomically under the session lock.** `requireAsking()`\
      \ already runs inside `lockFor(sessionId)` — extend that guarantee to the async/scheduled\
      \ paths so a rehydrated `ASKING` cannot race a concurrent/nearby FINISH.\n\n\
      4. **Persist a `statusExhaustedAt`/`updatedAt` in the state and schedule a sweeper**\
      \ that rescans long-lived DB `ASKING` rows past a threshold and proactively\
      \ re-mirrors them into Redis (fixes the \"key gone, nobody notices until user\
      \ returns\" latency).\n\n5. **Schema-version the state blob** (e.g., `{\"v\"\
      :1,...}`) and redesign so unknown versions force a rehydrate from DB rather\
      \ than a silent `null`. Prefer storing the DB's `status/questionCount/currentQuestionId`\
      \ as the durable parts to derive state.\n\n6. **Harden the Redis deployment**\
      \ for the non-TTL loss class: enable **AOF** persistence, set a sensible `maxmemory-policy`\
      \ (avoid `allkeys-*` that can evict session keys under pressure), and configure\
      \ Sentinel/Cluster for availability.\n\nRedis config (docker-compose-side) example:\n\
      ```yaml\nredis:\n  command: >\n    redis-server\n    --appendonly yes\n    --maxmemory\
      \ 512mb\n    --maxmemory-policy noeviction   # never silently drop live session\
      \ keys\n```\n\n`InterviewStateStore` sliding-TTL sketch:\n```java\npublic SessionState\
      \ readWithSlidingTtl(Long sessionId) {\n    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
      \    String json = bucket.get();\n    if (json == null) return null;\n    if\
      \ (bucket.remainTimeToLive() < SLIDING_REFRESH_THRESHOLD_MS) {\n        bucket.set(json,\
      \ TTL_HOURS, TimeUnit.HOURS); // refresh w/o mutating state\n    }\n    return\
      \ decode(json); // decode returns null on version/parse failure ONLY if caller\
      \ rehydrates\n}\n```\n\n---\n\n## Summary\nRedis fixed-TTL breaks continuation\
      \ when a key expires (idle ≥24h, eviction, restart, or schema drift) while the\
      \ DB `interview_session` stays `ASKING`/`START`, because Redis is the state-machine\
      \ gate and is never refreshed on read. In *this* repo a lazy rehydration fallback\
      \ (`requireAsking`) prevents the hard stop; the remaining real dangers are rehydration\
      \ races against async FINISH/scoring, the DB/Redis write asymmetry, the `detail()`-vs-`answer()`\
      \ liveness gap, and non-TTL state loss. Fix by picking one authority, sliding\
      \ the TTL or heartbeating, versioning the blob, guarding rehydration under the\
      \ lock, and avoiding eviction policies that drop live keys."
