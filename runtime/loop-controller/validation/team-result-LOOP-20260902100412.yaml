        write in `requireAsking` at line 389 competes for the same lock).

        - **S-3 — Divergence via non-atomic DB/Redis write** (`InterviewService.java:186`
        DB update then `:188` Redis write, not in one transaction). If the process
        dies between the two, or Redis is briefly unavailable, Redis can hold `questionCount-1`/`currentQuestionId`
