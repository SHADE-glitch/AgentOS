        this — but nothing detects or logs it, so QA/continuity regressions are invisible.

        - **S-4 — Status that only exists legitimately as "in-progress with transient
        state."** `START`/`ASKING`/`WAITING_ANSWER`/`EVALUATING` are mirror-true in
        DB, but any *in-flight* RAG context (retrieved chunks, current tool call mid-evaluation)
        parked only in Redis/queue is dropped. `requireAsking` accepts `START` or
        `ASKING` (line 394–397) and resurrects an `ASKING` from DB — silently promoting
        a session that, by design (a "fixed" deadline), should arguably have been
        finalized.


        ### 4. Why termination of continuation is *silent*

        Three compounding reasons:

        1. **`read()` collapses two different conditions into one `null`** (`InterviewStateStore.java:37-39`):
        "never existed," "already deleted via `delete()`," and "TTL-expired" all return
        `null`. Callers cannot distinguish expiry from absence.

        2. **Fallback suppresses the signal.** `requireAsking` treats `null` as a
        recoverable event and quietly rebuilds from DB (`:387-389`), so there is no
        path for the system to notice the TTL ever fired.

        3. **DB carries a conflicting "still valid" appearance.** `listByUser`/`detail`
        read only the DB (`InterviewService.java:283-299`), which still shows `status=ASKING`
        with full message history — so the UI advertises a resumable session right
        up until the moment a submit hits `requireAsking`, and then only a `null`-reconstruct
        masks it (or a legit `INTERVIEW_STATE_ERROR`/`INTERVIEW_FINISHED` surfaces
        for the non-ASKING cases). The user-facing "continue" button never reflects
        the hard Redis deadline.


        ### 5. Concrete recommendations


        1. **Stop treating Redis as the state machine''s source of truth.** The three
        fields are already DB columns written under the same lock. Make the DB authoritative
        for durable `(status, questionCount, currentQuestionId)`; demote Redis to
        a fast cache with a well-defined miss policy (`cache-aside`): on miss, read
        DB, and only cache when the DB row is genuinely `ASKING`.

        2. **Align TTL with the session lifecycle rather than a magic constant.**
        Refresh a **sliding** TTL (Redis `expire`/`touch` on every interacting call,
        read *and* write) while `status == ASKING`; on `FINISHED`, delete the key
        immediately (already done via `finishSession` → `write`) and don''t re-cache.

        3. **Encode the deadline in the value and reconcile.** Store `updatedAt`/`askedAt`
        inside `SessionState`. On reconstruct, compare against DB `updated_at` and
        against a business "max pause duration"; if the pause exceeds it, **finalize**
        the session (write a FINISHED row + score) instead of silently resurrecting
        an open `ASKING`.

        4. **Make expiry observable.** Either enable Redisson/keyspace notifications
        for `expired` events and log/finalize on the hotkey, or add a periodic reconciliation
        that scans `interview_session WHERE status IN (...) AND updated_at < now()-TTL`
        and enforces the deadline at the DB layer (authoritative, survives any Redis
        event gap).

        5. **Make DB/Redis writes atomic-with-signal.** Move the `sessionMapper.updateById`
        + `stateStore.write` into a single transaction boundary (or write-through),
        and log any path where `read()` returns `null` for a known session ID — turning
        silent expiry into an auditable event rather than a magic `null`.


        This also matters for the RAG/queue side (my domain): the `EVALUATING`/scoring
