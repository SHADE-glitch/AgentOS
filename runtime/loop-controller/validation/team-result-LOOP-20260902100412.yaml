        written together but age/survive differently.


        ### When continuation breaks

        A session is “continuable” only while the Redis key is present and *authoritative*.
        It silently disappears (while the DB row stays `ASKING`, intact) in these
        cases:


        1. **Idle gap ≥ 24h wall-clock (the canonical case).** The last `write` sets
        the clock; reads/`detail`/`result` never refresh it. A user who answers a
        question, then pauses >24h mid-interview, returns to a session whose state
        key is gone even though their transcript and status live on in the DB.

        2. **Redis-only transient state loss.** The fallback (case 3) can only rebuild
        the 3 columns DB holds (`status/questionCount/currentQuestionId`). Any runtime-only
        field the machine tracks (e.g. working flag, per-question retry count, last
        SSE cursor) is silently lost on expiry — today it maps 1:1, but the design
        claim of “single authority” makes this a latent trap.

        3. **Recovery only exists at some entry points.** Only `answer`/`answerStream`
        call `requireAsking`. That is actually why, today, `answer` usually *masks*
        the expiry via re-hydration — the discontinuation is masked at the answer
        endpoint but any other path that consults the state key still sees it empty.

        4. **Ordering‑dependent correctness on expiry.** Correct recovery at the expiry
        boundary is *only* correct because the DB is written before Redis. If a transition’s
        Redis write is what resets the TTL, an expiry landing exactly mid-transition
        resurrects the older DB snapshot — which happens to be the newer state here.
        Reverse the DB/Redis write order and an expired key would resurrect stale
        state and overwrite newer DB state (duplicate question / wrong status).

        5. **Eviction ≠ TTL (early expiry while DB is valid).** `RedissonConfig.java:22-28`
