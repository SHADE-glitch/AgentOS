      \ vs Redis `interview:session:{id}` parity | `schema.sql:46` , `InterviewSession.java:14`,\
      \ `InterviewService.java:381-389` |\n| **security-agent** | Stale transition\
      \ / IDOR risk via `sessionId`-only `requireAsking` | `InterviewService.java:380,401`\
      \ |\n| **testing-agent** | TTL expiry reproduction matrix | see §6 |\n| **reviewer-agent**\
      \ | Root cause confirmation & drift matrix | this report §2-7 |\n\n## 2. Root\
      \ Cause\n\n> `InterviewStateStore` stores authoritative runtime state in Redis\
      \ with fixed `24h` TTL and no freshness validation before use.\n\nComment in\
      \ code declares intent explicitly `InterviewStateStore.java:15`:\n```java\n\
      // 面试会话运行时状态，存于 Redis，作为状态机的单一权威来源。\n```\nAuthority contradicts implementation:\
      \ DB `interview_session` is durable truth, but `answer()/answerStream()` gate\
      \ on Redis first.\n\n### 2.1 Single Authoritative Cache Anti-Pattern\n\n* **Write**\
      \ `InterviewStateStore.java:25,48-51`:\n```java\nprivate static final long TTL_HOURS\
      \ = 24;\npublic void write(Long sessionId, SessionState state){\n  String json\
      \ = objectMapper.writeValueAsString(state);\n  redissonClient.getBucket(key(sessionId)).set(json,\
      \ TTL_HOURS, TimeUnit.HOURS); // fixed TTL, reset only on write\n}\npublic record\
      \ SessionState(String status, int questionCount, Long currentQuestionId){}\n\
      private String key(Long sessionId){ return \"interview:session:\" + sessionId;\
      \ } // InterviewStateStore.java:30\n```\n\n* **Read** `InterviewStateStore.java:34-44`:\n\
      ```java\npublic SessionState read(Long sessionId){\n  RBucket<String> bucket\
      \ = redissonClient.getBucket(key(sessionId));\n  String json = bucket.get();\
      \ // null on: TTL expiry, eviction, Redis restart/failover, manual delete\n\
      \  if(json==null) return null;\n  try{ return objectMapper.readValue(json, SessionState.class);\
      \ }\n  catch(Exception e){ log.warn(...); return null; } // parse failure also\
      \ → null, indistinguishable from expiry\n}\n```\n\n* **Gating** `InterviewService.java:125,197`:\n\
      ```java\n// answer()\nInterviewStateStore.SessionState state = requireAsking(sessionId);\
      \ // InterviewService.java:129\nif(evaluationService.shouldFinish(qaPairs, MAX_QUESTIONS))\
      \ ...\nint newCount = state.questionCount() + 1; // trusts Redis count\n// answerStream()\
      \ identical\nInterviewStateStore.SessionState state = requireAsking(sessionId);\
      \ // InterviewService.java:204\n```\n\n* **Fallback without validation** `InterviewService.java:380-399`:\n\
      ```java\nprivate InterviewStateStore.SessionState requireAsking(Long sessionId){\n\
      \  InterviewStateStore.SessionState state = stateStore.read(sessionId);\n  if(state\
      \ == null){\n    InterviewSession s = sessionMapper.selectById(sessionId); //\
      \ InterviewService.java:383\n    if(s==null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
      \    state = new InterviewStateStore.SessionState(s.getStatus(), s.getQuestionCount(),\
      \ s.getCurrentQuestionId());\n    stateStore.write(sessionId, state); // InterviewService.java:389\
      \ re-hydrate with fresh 24h TTL, masks expiry\n  }\n  if(InterviewStatus.FINISHED.name().equals(state.status()))\
      \ throw new BizException(ResultCode.INTERVIEW_FINISHED);\n  if(!InterviewStatus.ASKING.name().equals(state.status())\
      \ && !InterviewStatus.START.name().equals(state.status()))\n    throw new BizException(ResultCode.INTERVIEW_STATE_ERROR,\
      \ \"当前状态不允许提交答案\");\n  return state;\n}\n```\n\n**Three masking behaviors:**\n\
      1. `null` is treated as harmless cache miss, not as `state-lost` signal.\n2.\
      \ Re-hydration immediately `write()`s DB snapshot back to Redis with new TTL\
      \ → silently heals drift and hides that TTL was breached.\n3. No freshness checks:\
      \ `startedAt`, `finishedAt`, `updated` timestamp, version, or `interview_message`\
      \ max ID are not compared. `InterviewStatus.java:7` defines `START → ASKING\
      \ → FINISHED` but `WAITING_ANSWER/FOLLOW_UP/EVALUATING` exist as reserved states\
      \ never validated.\n\n## 3. DB vs Redis Divergence — Where Drift Emerges\n\n\
      **DB schema** `schema.sql:46-60` / `InterviewSession.java:15-44`:\n```sql\n\
      CREATE TABLE interview_session(\n  status VARCHAR(20) DEFAULT 'START', -- START/ASKING/.../FINISHED\n\
      \  current_question_id BIGINT,\n  questionCount INT DEFAULT 0,\n  started_at\
      \ DATETIME DEFAULT CURRENT_TIMESTAMP,\n  finished_at DATETIME\n);\n```\n\n|\
      \ Dimension | DB (`interview_session`) | Redis (`interview:session:{id}` JSON)\
      \ |\n|---|---|---|\n| Lifetime | durable, no TTL | 24h fixed `TTL_HOURS` |\n\
      | Consistency | MyBatis `updateById` per transition | `set(json,24,HOURS)` per\
      \ transition |\n| Authority claim | implicit source of truth | explicit `单一权威来源`\
      \ |\n| Sync model | dual-write, non-transactional (no `@Transactional` in `InterviewService.java:80,125,197,340`)\
      \ | same |\n\n### Dual-Write Non-Atomicity\n\n`create()` `InterviewService.java:80-122`:\n\
      ```java\nsessionMapper.insert(session); // DB START\nstateStore.write(... START\
      \ ...) // Redis START\n...\nsession.setStatus(ASKING); sessionMapper.updateById(session);\
      \ // DB ASKING\nstateStore.write(... ASKING ...) // Redis ASKING\n```\n`answer()`\
      \ `InterviewService.java:183-189` / `finishSession()` `InterviewService.java:340-346`:\n\
      ```java\nsession.setStatus(ASKING); sessionMapper.updateById(session);\nstateStore.write(sessionId,\
      \ new SessionState(ASKING, newCount, msg.getId())); // second write\n// finishSession\n\
      session.setStatus(FINISHED); sessionMapper.updateById(session);\nstateStore.write(...\
      \ FINISHED ...)\n```\n\nIf either DB or Redis write fails → split-brain persists\
      \ until next `requireAsking` re-hydration, which blindly copies whichever store\
      \ survived.\n\n**Frontend-observable drift:** `toVO()` `InterviewService.java:430-439`\
      \ filters `messages` by `currentQuestionId`. If `currentQuestionId` from Redis\
      \ drifted from DB `currentQuestionId` or from `interview_message` latest `question`\
      \ row, UI `currentQuestion` renders `null` or stale question → appears to revert.\n\
      \n## 4. Stale Transitions Checked\n\n| Transition | Expected | Actual after\
      \ TTL |\n|---|---|---|\n| `ASKING → answer → ASKING` | increments `questionCount`\
      \ | `newCount = state.questionCount()+1` `InterviewService.java:179,254` uses\
      \ stale count if re-hydrated from lagging DB |\n| `ASKING → FINISHED` | 6 questions\
      \ or `shouldFinish()` | `shouldFinish()` reads `interview_message` truth, but\
      \ gate `requireAsking` may have allowed `START` to answer (START accepted `InterviewService.java:394`)\
      \ → double-count |\n| `FINISHED → answer` | reject `INTERVIEW_FINISHED` | Correct\
      \ only if DB `FINISHED` survived; if DB write lost but Redis `ASKING` remained,\
      \ allows answer on finished interview until Redis TTL |\n| `START` re-entry\
      \ | should be one-time | `START` accepted in `requireAsking` `InterviewService.java:394-395`\
      \ → ancient `START` session (24h+) re-hydrated and treated as valid, no `startedAt\
      \ + maxDuration` check |\n\n**No invalidation / no sliding window:** TTL resets\
      \ only on `write()`, not on `read()`. Idle 24h+ session expires even though\
      \ DB `status=ASKING` still valid → \"impossible to continue\" vs \"appears to\
      \ revert\" depends on whether `selectById` fallback succeeds. Both violate UX\
      \ expectation: valid DB session should remain continuable with consistent state.\n\
      \n## 5. Why \"Impossible to Continue\" AND \"Revert to Wrong State\" Both Occur\n\
      \n* **Impossible:** If DB row was meanwhile logically cleaned or `shouldFinish`\
      \ triggers, re-hydrated `FINISHED` correctly rejects `answer()` with `INTERVIEW_FINISHED`\
      \ `InterviewService.java:391` → user sees session unusable despite 24h ago it\
      \ was `ASKING`.\n* **Revert:** If dual-write diverged (e.g., `questionCount`\
      \ 2 in DB, 3 in Redis before expiry), fallback restores `2` → next `answer()`\
      \ computes `newCount=3` instead of `4` → dashboard `totalQuestions` undercounts,\
      \ question repeats or is skipped (`askedQuestionIds` from `interview_message`\
      \ mitigates but count mismatch persists).\n\n## 6. Reproduction — TTL Expiry\
      \ Scenario (Analysis-Only, No Code Change)\n\n**Prerequisites:** Mock `RedissonClient`\
      \ or use testcontainer Redis; insert `interview_session` `status=ASKING, questionCount=2`.\n\
      \n```java\n// Step 1: seed DB truth\nInterviewSession s = new InterviewSession();\
      \ s.setUserId(1L); s.setStatus(\"ASKING\"); s.setQuestionCount(2);\nsessionMapper.insert(s);\n\
      stateStore.write(s.getId(), new SessionState(\"ASKING\",2, 100L));\n// Step\
      \ 2: simulate 24h inactivity — expiry = delete\nredissonClient.getBucket(\"\
      interview:session:\"+s.getId()).delete(); // or await TTL\nassert stateStore.read(s.getId())\
      \ == null; // InterviewStateStore.java:37\n\n// Step 3: fallback path\nSessionState\
      \ recovered = interviewService.requireAsking(s.getId()); // via reflection /\
      \ test hook\n// Observe: recovered = SessionState(ASKING,2,100) copied from\
      \ DB, then re-written with fresh TTL\n// No check of: s.getStartedAt() age,\
      \ message table max id, version\n\n// Step 4: divergence injection — update\
      \ DB without Redis\nsessionMapper.updateById( s.setQuestionCount(3) ); // simulate\
      \ concurrent answer that lost Redis write\nredissonClient.getBucket(\"interview:session:\"\
      +s.getId()).delete();\nSessionState stale = interviewService.requireAsking(s.getId());\n\
      assert stale.questionCount()==3; // DB truth but violates expected 2 → drift\
      \ visible\n```\n\n**Full Test Matrix (testing-agent):**\n\n| ID | Condition\
      \ | Expected (Correct) | Actual (Current) | Drift |\n|---|---|---|---|---|\n\
      | F1 | Redis miss, DB `ASKING` | Re-hydrate + validate freshness vs `interview_message`\
      \ count & `startedAt` | Blind copy + re-write `InterviewService.java:387-389`\
      \ | No validation |\n| F2 | Redis miss, DB `FINISHED` | Reject | Reject `FINISHED`\
      \ (correct) but without `finishedAt` audit | OK but opaque |\n| F3 | Redis miss,\
      \ DB `START` with existing `question` messages | Detect inconsistency | Accepts\
      \ `START` → `answer()` allowed | Revert |\n| F4 | Redis parse error (`bucket.get()`\
      \ corrupt JSON) | `null` → error metric | Same as TTL `null` `InterviewStateStore.java:44`\
      \ | Silent |\n| F5 | Concurrent `answer()` with lock `interview:lock:{id}` `InterviewService.java:361`\
      \ | Serial | Serial (5s wait) but TTL expiry between lock acquires still drifts\
      \ | Race |\n| F6 | Redis available, DB write failed earlier | Should reconcile\
      \ from messages | Trusts Redis `questionCount` | Split-brain |\n| F7 | 24h+\
      \ idle, frontend `GET /interview/{id}` | Should show timeout/expire UI | Shows\
      \ `ASKING` again after fallback | UX revert |\n\n## 7. Impact Classification\n\
      \n* **User:** Valid session appears broken after 1-day inactivity; or resumes\
      \ with off-by-one question, causing scoring `EvaluationService.java:102` to\
      \ miscount.\n* **Data:** `interview_result` aggregates drift from `questionCount`.\n\
      * **Security:** `requireAsking(Long sessionId)` `InterviewService.java:380`\
      \ lacks `userId`; ownership enforced only by caller `requireOwnedSession` `InterviewService.java:401`\
      \ — fallback itself is not user-scoped; if called elsewhere, cross-user state\
      \ fetch risk.\n* **Architectural class:** Same as `DashboardService.java:38,52-66`\
      \ `CACHE_TTL_MINUTES=10` `dashboard:user:{id}` with then-no-invalidation; Run\
      \ 1 (session state) and Run 2 (dashboard cache) share `TTL authority → stale\
      \ read` pattern (benchmark §2).\n\n## 8. Recommendations (Not Applied — Analysis\
      \ Only)\n\n1. **DB is truth, Redis is cache.** Invert comment `InterviewStateStore.java:15`:\
      \ validate Redis against DB + `interview_message` on every `requireAsking`.\
      \ Reject if `startedAt + MAX_SESSION_AGE` exceeded (e.g., 48h).\n2. **Freshness\
      \ validation example (proposed, not committed):**\n```java\n// proposed requireAsking\
      \ fix sketch\nInterviewSession s = sessionMapper.selectById(sessionId);\nint\
      \ msgQuestionCount = messageMapper.countQuestions(sessionId);\nif(s.getQuestionCount()\
      \ != msgQuestionCount) s.setQuestionCount(msgQuestionCount); // reconcile\n\
      if(Duration.between(s.getStartedAt(), LocalDateTime.now()).toHours() > 48) throw\
      \ SESSION_EXPIRED;\nif(!Objects.equals(s.getCurrentQuestionId(), state.currentQuestionId()))\
      \ log.warn(\"drift currentQuestionId\");\n```\n3. **Transactional dual-write:**\
      \ Wrap `sessionMapper.updateById` + `stateStore.write` in `@Transactional` +\
      \ outbox or `RBatch`; or make Redis write best-effort with fallback reconciliation,\
      \ not authority.\n4. **Sliding TTL or no TTL for `ASKING`:** Use `30m` sliding\
      \ `expire` on read, or remove TTL and rely on explicit `delete()` on `FINISHED`\
      \ `InterviewStateStore.java:58` plus scheduled cleaner for abandoned `START`.\n\
      5. **Version/ETag:** Add `version INT` to `interview_session`, include in `SessionState`,\
      \ enforce optimistic lock.\n6. **Observability:** Meter `stateStore.read==null`\
      \ as `session_state_miss_total{reason=\"ttl|parse|missing\"}`.\n7. **Frontend:**\
      \ On `INTERVIEW_STATE_ERROR`/`SESSION_EXPIRED`, show \"Session expired, restart\
      \ interview\" instead of silent revert; do not trust `currentQuestionId` from\
      \ cache alone — always fetch `interview_message` list.\n\n---\n**Files inspected:**\
      \ `InterviewStateStore.java:25,34,48`, `InterviewService.java:80,125,197,340,380`,\
      \ `InterviewStatus.java:7`, `InterviewSession.java:14`, `schema.sql:46`, `DashboardService.java:38`,\
      \ `RedissonConfig.java:21` — all paths verified, no modifications made per task\
      \ constraint.\n"
