      output: "# Run 1 Analysis: Redis Session TTL Causes Runtime State Drift — Backend-Architect\
        \ Report\n\n**Team:** `team-576c9378` | **Role:** `backend-architect` | **Mode:**\
        \ Analysis only (no file modification) | **Date:** 2026-09-02\n\n**Files Inspected:**\n\
        - `backend/src/main/java/com/aiview/interview/service/InterviewStateStore.java:25,34,48`\n\
        - `backend/src/main/java/com/aiview/interview/service/InterviewService.java:80-123,125-195,197-281,340-359,380-399`\n\
        - `backend/src/main/java/com/aiview/interview/service/InterviewStatus.java:7`\n\
        - `backend/src/main/java/com/aiview/interview/entity/InterviewSession.java:14-44`\n\
        - `backend/src/main/resources/db/schema.sql:46-60` (`interview_session`)\n\
        - Cross-check: `DashboardService.java:38,52-91` (same bug family, already\
        \ patched with `evict()`), `RedissonConfig.java:22-28`\n\n---\n\n### 1. Executive\
        \ Summary\n\nA valid `interview_session` row in MySQL remains indefinitely\
        \ (no DB TTL), while its authoritative runtime state in Redis (`interview:session:{id}`)\
        \ is written with a fixed `TTL_HOURS=24` (`InterviewStateStore.java:51`).\
        \ `InterviewStateStore.read():34-44` returns `null` on bucket miss. `InterviewService.requireAsking():380-399`\
        \ silently rehydrates from DB (`selectById` → `new SessionState(status,questionCount,currentQuestionId)`)\
        \ and re-writes to Redis, **without freshness validation** against `interview_message`,\
        \ `updatedAt`, or monotonic version. `answer():129` and `answerStream():204`\
        \ gate all user input on this stale-reconstructable state. After >24h inactivity\
        \ (or Redis eviction / failover / `FLUSHDB`), the session **either appears\
        \ to revert to a wrong `questionCount/currentQuestionId`** or becomes impossible\
        \ to continue due to inconsistent count/message-history divergence.\n\nThis\
        \ is **runtime state drift**, not a DB corruption. Dual-write (MySQL + Redis)\
        \ is non-transactional; Redis is documented as *\"单一权威来源\"* (`InterviewStateStore.java:15`)\
        \ but TTL breaks that guarantee.\n\n### 2. Root Cause Chain\n\n```\nInterviewService.create()\
        \ ──write──▶ Redis.set(json, 24, HOURS)  [51]  ──┐\nInterviewService.answer()\
        \ ─write──▶ Redis.set(json, 24, HOURS)  [188]  ├── TTL not slid on read; only\
        \ on write\nfinishSession()          ──write──▶ Redis.set(FINISHED, 24,HOURS)[345]\
        \ ──┘\n\nInterviewStateStore.read() [34-46]:\n  bucket.get() == null  → return\
        \ null          // TTL expiry, LRU eviction, restart, manual DELETE\n  json\
        \ parse failure    → return null + warn   // also masks corruption as \"missing\"\
        \n\nInterviewService.requireAsking() [380-399]:\n  if (state == null) {\n\
        \    s = sessionMapper.selectById(sessionId)     // fallback to DB truth\n\
        \    state = new SessionState(s.status, s.questionCount, s.currentQuestionId)\
        \ // [387-388]\n    stateStore.write(sessionId, state)          // [389] re-cache\
        \ stale snapshot as \"truth\"\n  }\n  if (FINISHED) throw INTERVIEW_FINISHED\
        \        // [391-392] correct\n  if (!ASKING && !START) throw STATE_ERROR\
        \      // [394-395]    // allows stale ASKING through\n```\n\n**Core defect:**\
        \ Fallback-to-DB is treated as equivalent to validated runtime state. There\
        \ is **no**:\n- `startedAt/finishedAt` freshness window check,\n- `interview_message`\
        \ count vs `questionCount` parity check,\n- `currentQuestionId` existence\
        \ check (`selectById` on message table),\n- version/timestamp monotonicity\
        \ guard,\n- sliding TTL refresh (`get` does not `expire`).\n\n### 3. Detailed\
        \ Code Walkthrough\n\n**3.1 Write path — authoritative but expiring** `InterviewStateStore.java:48-56`\n\
        ```java\npublic void write(Long sessionId, SessionState state) {\n  String\
        \ json = objectMapper.writeValueAsString(state); // {status, questionCount,\
        \ currentQuestionId}\n  redissonClient.getBucket(key(sessionId)).set(json,\
        \ TTL_HOURS, TimeUnit.HOURS); // 24h fixed\n}\n```\n- `key()` = `interview:session:{id}`\
        \ (`:30-32`), no user scoping, no version suffix.\n- Every mutation (`create`:92,\
        \ `answer`:188, `answerStream`:263, `finishSession`:345) overwrites with fresh\
        \ 24h TTL, but **read path never extends TTL**, so idle sessions strictly\
        \ die at `lastWrite + 24h`.\n- Failure mode: `write` throws `BizException(INTERNAL_ERROR)`\
        \ on Jackson/Redis error, but caller already mutated DB (`sessionMapper.updateById`\
        \ at `InterviewService.java:114,186,261`). Partial commit → DB ahead of cache.\n\
        \n**3.2 Read path — silent null** `InterviewStateStore.java:34-46`\n```java\n\
        public SessionState read(Long sessionId) {\n  RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \  String json = bucket.get(); // null if expired/evicted\n  if (json == null)\
        \ return null;\n  try { return objectMapper.readValue(json, SessionState.class);\
        \ }\n  catch (Exception e) { log.warn(...); return null; } // parse error\
        \ → same as expiry\n}\n```\nIndistinguishable signals for *expired*, *never-written*,\
        \ *evicted*, *corrupt*. Caller cannot differentiate and thus cannot decide\
        \ to fail vs. rehydrate.\n\n**3.3 Fallback path — unvalidated rehydration**\
        \ `InterviewService.java:380-399`\n```java\nprivate SessionState requireAsking(Long\
        \ sessionId) {\n  SessionState state = stateStore.read(sessionId);\n  if (state\
        \ == null) {\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
        \    if (s == null) throw new BizException(INTERVIEW_NOT_FOUND);\n    state\
        \ = new SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId());\n\
        \    stateStore.write(sessionId, state); // re-cache immediately, resets TTL\
        \ to 24h\n  }\n  if (FINISHED.equals(state.status())) throw INTERVIEW_FINISHED;\n\
        \  if (!ASKING.equals(state.status()) && !START.equals(state.status()))\n\
        \    throw new BizException(INTERVIEW_STATE_ERROR, \"当前状态不允许提交答案\");\n  return\
        \ state;\n}\n```\nIssues:\n1. `s.getStatus()` is trusted verbatim. If DB is\
        \ `ASKING` with `questionCount=3` but `interview_message` has only 2 questions\
        \ (e.g., write failed after DB update but before Redis, or manual DB edit),\
        \ drift is re-cached.\n2. No check that `currentQuestionId` points to an existing\
        \ `interview_message` with `kind=question, role=AI`. Stale FK → later `newCount\
        \ = state.questionCount()+1` (`:179,254`) compounds off-by-one.\n3. `START`\
        \ is allowed to submit answer, though `create()` immediately transitions to\
        \ `ASKING` (`:111`). A reconstructed `START` after TTL expiry would accept\
        \ an answer without a pending question.\n4. Re-write at `:389` makes the drift\
        \ **sticky**: subsequent reads will hit this stale cache for another 24h,\
        \ not DB.\n\n**3.4 Consumption path — drift amplified** `InterviewService.java:125-195,197-281`\n\
        \nBoth `answer()` and `answerStream()`:\n- Acquire `RLock interview:lock:{id}`\
        \ (`:361-372`, `LOCK_WAIT_SECONDS=5`) — protects against concurrent answer\
        \ but **not** against expired snapshot.\n- `requireOwnedSession()` checks\
        \ `userId` match (`:401-407`) — authz OK.\n- `requireAsking()` as above →\
        \ then `saveUserMessage()`, `extractQAPairs()`, `shouldFinish()`, then `newCount\
        \ = state.questionCount()+1` and `sessionMapper.updateById(session)` with\
        \ new count.\n\nIf fallback count is stale (e.g., 1 instead of 3), next question\
        \ increments to 2, DB becomes `2` while history actually has 4 messages. Subsequent\
        \ `shouldFinish(MAX_QUESTIONS=6)` uses `qaPairs` derived from `interview_message`\
        \ (correct) but `questionCount` in DB/Redis diverges — visible in `detail()`\
        \ / `listByUser()` aggregates.\n\n### 4. DB `interview_session` vs Redis Runtime\
        \ Divergence Matrix\n\n| Scenario | DB Row (`schema.sql:46`) | Redis `SessionState`\
        \ | Drift Symptom |\n|---|---|---|---|\n| **F1: Normal active** | `status=ASKING,\
        \ questionCount=3, currentQuestionId=102` | `ASKING,3,102` | None |\n| **F2:\
        \ TTL expired, DB still ASKING** | `ASKING,3,102` (row persists) | `null`\
        \ → rehydrated to `ASKING,3,102` + re-cached | Appears to work but **hides**\
        \ that `interview_message` may have 4 rows if last write race occurred; count\
        \ may be behind. Reverts to last DB checkpoint, losing in-flight Redis-only\
        \ increments if DB write had failed. |\n| **F3: DB updated but Redis write\
        \ failed** | `ASKING,4,105` | old `ASKING,3,102` (TTL not yet expired) | Next\
        \ answer uses `3+1=4` → DB becomes `4` but correct should be `5`; message\
        \ history vs count mismatch; user may see duplicate question or skip. |\n\
        | **F4: Session finished, cache expired** | `FINISHED,6,110, finishedAt=...`\
        \ | `null` → rehydrated `FINISHED` | `requireAsking` correctly throws `INTERVIEW_FINISHED`\
        \ (`:391`), but only by accident; if DB had `FINISHED` but Redis had stale\
        \ `ASKING` (F3 inverse), answer would be incorrectly accepted before expiry.\
        \ |\n| **F5: Redis evicted / `FLUSHALL` / failover** | Valid `ASKING` | `null`\
        \ for many keys simultaneously | Mass fallback storm: N rehydrations → N `set(...,24h)`\
        \ → Redis pressure spike; all sessions appear to \"revert\" to DB snapshot.\
        \ |\n\n**Key insight:** `interview_message` is the true event log, but `questionCount`/`currentQuestionId`\
        \ are **denormalized counters** that drift from it. No reconciliation query\
        \ (`SELECT COUNT(*) WHERE kind='question'`) is performed.\n\n### 5. Stale\
        \ Transitions & Security Analysis\n\n- **Unauthorized transition:** An attacker\
        \ who knows `sessionId` could attempt `answer` after TTL expiry when `requireAsking`\
        \ reconstructs stale `START` → `ASKING` bypasses question existence check.\
        \ Rate-limiting via `RLock` (`:361`) mitigates burst but not logic error.\n\
        - **State regression:** User leaves session for 25h, returns, submits answer.\
        \ UI `detail()` (`:291-299`) shows DB state (`ASKING, q3`), but `answer()`\
        \ rehydrates same count, increments to 4, writes new question. From user POV,\
        \ it worked, but if DB count was ahead, they see a repeated or out-of-order\
        \ question — perceived as \"reverted to wrong state\".\n- **Impossible-continue:**\
        \ If `currentQuestionId` points to a message that was logically deleted (soft\
        \ `TableLogic deleted` on session but not message), fallback state is `ASKING`\
        \ but no pending question exists; `extractQAPairs` will treat last AI message\
        \ as pending, but UI `toVO(currentQuestionId)` (`:430-439`) will `findFirst`\
        \ null → `currentQuestion:null` → frontend shows no question but backend still\
        \ allows answer.\n- **Non-transactional dual-write:** `sessionMapper.updateById`\
        \ + `stateStore.write` are not atomic. Crash between them = drift. No `@Transactional`\
        \ visible on `answer()`; only lock.\n\n### 6. Reproduction Scenario (TTL Expiry\
        \ — No Code Change Required)\n\n**Prerequisites:** Running MySQL + Redis (via\
        \ `RedissonConfig.java:22`), one user, `question` table seeded.\n\n1. **Create\
        \ session**\n   ```bash\n   POST /api/interview/sessions {topic:\"Java\",\
        \ level:\"中级\"} \n   # → 201, sessionId=42, status=ASKING, questionCount=1,\
        \ currentQuestionId=100, Redis TTL=24h (TTL 86400)\n   # Verify: redis-cli\
        \ GET \"interview:session:42\" → {\"status\":\"ASKING\",\"questionCount\"\
        :1,\"currentQuestionId\":100}\n   # Verify: SELECT status,question_count,current_question_id\
        \ FROM interview_session WHERE id=42;\n   ```\n\n2. **Simulate 24h inactivity\
        \ without waiting** (choose one):\n   - `redis-cli DEL \"interview:session:42\"\
        `\n   - `redis-cli EXPIRE \"interview:session:42\" 1` + `sleep 2`\n   - Or\
        \ restart Redis / `FLUSHDB`\n\n3. **Verify divergence**\n   ```bash\n   redis-cli\
        \ GET \"interview:session:42\"  # → (nil)\n   # DB still: SELECT * FROM interview_session\
        \ WHERE id=42; → ASKING,1,100, not finished\n   ```\n\n4. **Attempt continuation**\
        \ (should expose fallback)\n   ```bash\n   POST /api/interview/sessions/42/answer\
        \ {\"answer\":\"my answer\"}\n   # or POST /api/interview/sessions/42/answer/stream\n\
        \   # Observe logs: InterviewStateStore.read returns null (warn if parse),\
        \ requireAsking selectById, stateStore.write\n   # Result: 200 with next question,\
        \ but state was reconstructed from DB\n   # Check Redis: GET \"interview:session:42\"\
        \ → {\"status\":\"ASKING\",\"questionCount\":2,\"currentQuestionId\":101}\
        \ (new TTL)\n   ```\n\n5. **Drift variant — stale count**\n   - Manually set\
        \ DB ahead: `UPDATE interview_session SET question_count=5 WHERE id=42;`\n\
        \   - Delete Redis key again, re-POST answer → service rehydrates `5`, increments\
        \ to `6`, forces `shouldFinish=true` and finishes prematurely despite only\
        \ 2 messages existing. Compare `SELECT COUNT(*) FROM interview_message WHERE\
        \ session_id=42 AND kind='question'` (=2) vs `question_count=6`.\n\n6. **Impossible-continue\
        \ variant**\n   - `UPDATE interview_session SET status='FINISHED' WHERE id=42;`\
        \ + `DEL` Redis key + `POST answer` → correctly throws `INTERVIEW_FINISHED`\
        \ (2003). Now revert: `UPDATE interview_session SET status='ASKING' WHERE\
        \ id=42; DEL` Redis key but manually set Redis to stale `{\"status\":\"ASKING\"\
        ,\"questionCount\":0,\"currentQuestionId\":null}` before expiry test → answer\
        \ accepted though history shows session should be at q3.\n\n**Automated test\
        \ matrix to add** (testing-engineer handoff, analysis only):\n- `TC-TTL-1`:\
        \ missing bucket → fallback succeeds with ASKING\n- `TC-TTL-2`: missing bucket\
        \ + DB FINISHED → throws 2003\n- `TC-TTL-3`: corrupt JSON → returns null +\
        \ fallback\n- `TC-TTL-4`: count mismatch (DB 5 vs messages 2) → assert parity\
        \ check fails\n- `TC-TTL-5`: currentQuestionId FK missing → assert error\n\
        - `TC-TTL-6`: concurrent DEL + 2 parallel answers → lock ensures serialization\
        \ but final count must match message rows\n- `TC-TTL-7`: sliding TTL not refreshed\
        \ on read → assert TTL unchanged after `read` without `write`\n\n### 7. Impact\
        \ Assessment\n\n- **User:** After ~1 day idle, interview appears to lose progress\
        \ or jumps back/forward; second answer may trigger premature `FINISHED` or\
        \ duplicate question. \"Database still recording session\" creates confusion.\n\
        - **Data:** `questionCount` drifts from `interview_message` truth; dashboard/billing/analytics\
        \ that rely on `questionCount` become unreliable (same family as `DashboardService.java:38`\
        \ 10m cache drift, now patched via `evict()`).\n- **Ops:** No alert on TTL\
        \ miss rate; `log.warn` only on parse failure, not on `null` fallback. Hard\
        \ to detect drift without `DB vs Redis` comparison query.\n\n### 8. Recommendations\
        \ (Analysis Only — No Modification per Task)\n\nFor lead review / approval\
        \ before implementation:\n\n1. **Freshness validation in `requireAsking`**\
        \ — before accepting fallback, verify:\n   ```java\n   // pseudo, not implemented\
        \ per task constraint\n   int actualQuestionCount = messageMapper.selectCount(W.eq(kind,\
        \ \"question\"));\n   Long actualLastQuestionId = messageMapper.selectOne(...\
        \ orderByDesc id limit1).getId();\n   if (s.getQuestionCount() != actualQuestionCount\
        \ || !Objects.equals(s.getCurrentQuestionId(), actualLastQuestionId))\n  \
        \     // reconcile or throw INTERVIEW_STATE_ERROR with repair\n   ```\n  \
        \ Also check `finishedAt` window (e.g., reject answer if `startedAt + 48h`\
        \ exceeded).\n\n2. **TTL strategy** — Options:\n   - **Sliding TTL**: `read()`\
        \ does `bucket.expire(TTL_HOURS, HOURS)` or `getAndExpire` to keep active\
        \ sessions alive; idle sessions still expire.\n   - **No TTL for ASKING, TTL\
        \ for FINISHED**: Keep runtime state until explicitly `delete()` on finish,\
        \ then cache finished marker with TTL for idempotency.\n   - **Versioned key**:\
        \ `interview:session:{id}:v{version}` with DB `version` column, reject stale\
        \ write via Lua compare-and-set.\n\n3. **Single source of truth** — Make `interview_message`\
        \ authoritative, derive `SessionState` on demand or store `questionCount`\
