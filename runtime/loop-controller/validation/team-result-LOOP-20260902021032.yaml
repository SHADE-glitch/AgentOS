        \n4. **Atomicity** — Wrap `sessionMapper.updateById` + `stateStore.write`\
        \ in `@Transactional` + compensating Redis write, or write Redis first then\
        \ DB, or use outbox pattern.\n\n5. **Observability** — Add counter `interview_state_redis_miss_total`\
