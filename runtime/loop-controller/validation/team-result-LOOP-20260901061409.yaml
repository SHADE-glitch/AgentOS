      output: "---\n\n# Security Analysis: AI Interview Platform — Auth Module\n\n\
        ## Executive Summary\n\nThe auth module has **5 Critical**, **4 High**, and\
        \ **4 Medium** severity findings. The most impactful gaps are: hand-rolled\
        \ JWT with timing-vulnerable signature comparison, no refresh token mechanism,\
        \ no token revocation, secrets committed to version control, and no brute-force\
        \ protection.\n\n---\n\n## CRITICAL Findings\n\n### C-1: Timing-Vulnerable\
        \ JWT Signature Verification\n\n**File:** `backend/.../auth/AuthTokenService.java:46`\n\
        \n```java\nif (!sign(content).equals(parts[2])) {  // String.equals() — NOT\
        \ constant-time\n```\n\n`String.equals()` short-circuits on the first differing\
        \ byte, leaking information about the signature via response timing. This\
        \ is a textbook timing oracle that could allow an attacker to forge valid\
        \ signatures byte-by-byte.\n\n**Fix:** Use constant-time comparison already\
        \ available in the codebase — `MessageDigest.isEqual()`:\n\n```java\nimport\
        \ java.security.MessageDigest;\n\n// AuthTokenService.java:46\nbyte[] expected\
        \ = signBytes(content);  // new method returning byte[]\nbyte[] actual = URL_DECODER.decode(parts[2]);\n\
        if (!MessageDigest.isEqual(expected, actual)) {\n    throw new BusinessException(ErrorCode.AUTH_INVALID,\
        \ \"token签名校验失败\");\n}\n```\n\n---\n\n### C-2: Real Secrets Committed to Version\
        \ Control\n\n**File:** `.env:35-46`\n\n```env\nAUTH_TOKEN_SECRET=a927d424bacef249735b93fbf9bb965378db8374bcc3d3a24d8536a174025f02\n\
        AI_DASHSCOPE_API_KEY=sk-a028f00209ca4af4ba18051b95df94ef\nAUTH_DEMO_ADMIN_PASSWORD=admin123\n\
        ```\n\nJWT signing key, AI API key, and admin credentials are all committed\
        \ in plaintext. Anyone with repo access can mint arbitrary JWT tokens or consume\
        \ AI API quota.\n\n**Fix:** Remove `.env` from git history (`git filter-branch`\
        \ or `BFG Repo-Cer`), add `.env` to `.gitignore`, and use `.env.example` with\
        \ placeholder values only. Rotate all exposed keys immediately.\n\n---\n\n\
        ### C-3: Hardcoded Default JWT Secret in Source\n\n**File:** `backend/.../auth/AuthProperties.java:63`\n\
        \n```java\nprivate String secret = \"interview-copilot-dev-secret-change-me\"\
        ;\n```\n\nIf `AUTH_TOKEN_SECRET` env var is not set in any deployment, this\
        \ default is used. It's a guessable string in the source code, making token\
        \ forgery trivial.\n\n**Fix:** Fail-fast at startup if the secret is the default\
        \ value:\n\n```java\n@PostConstruct\npublic void validate() {\n    if (\"\
        interview-copilot-dev-secret-change-me\".equals(token.secret)) {\n       \
        \ throw new IllegalStateException(\n            \"auth.token.secret must be\
        \ overridden in production. \" +\n            \"Set AUTH_TOKEN_SECRET environment\
        \ variable.\");\n    }\n}\n```\n\n---\n\n### C-4: No Token Revocation / Logout\
        \ Mechanism\n\n**Files:** `AuthTokenService.java`, `AuthController.java` (absent),\
        \ `AuthInterceptor.java`\n\nThere is no `jti` (JWT ID) claim, no Redis blacklist,\
        \ no revoked-token table, and no `/logout` endpoint. Once a token is issued,\
        \ it remains valid for the full 2-hour window regardless of:\n- User logout\n\
        - Password change\n- Account compromise\n- Admin disabling a user (only soft-delete\
        \ `is_deleted` is checked in `AuthInterceptor.java:76`, not explicit revocation)\n\
        \n**Fix — Minimal:** Add `jti` claim to tokens and implement Redis-based blacklist:\n\
        \n```java\n// AuthTokenService.java — generateToken()\nString jti = UUID.randomUUID().toString();\n\
        Map<String, Object> claims = Map.of(\n    \"sub\", user.getId(),\n    \"exp\"\
        , exp,\n    \"jti\", jti\n);\n```\n\n```java\n// AuthInterceptor.java — preHandle()\n\
        String jti = payload.jti();\nif (redisTemplate.hasKey(\"token:blacklist:\"\
        \ + jti)) {\n    writeError(response, HttpStatus.UNAUTHORIZED, ErrorCode.AUTH_INVALID,\
        \ \"令牌已失效\");\n    return false;\n}\n```\n\n```java\n// New logout endpoint\n\
        @PostMapping(\"/logout\")\npublic Result<Void> logout(@AuthUser AuthUser user,\
        \ @RequestHeader(\"Authorization\") String auth) {\n    String token = auth.substring(7);\n\
        \    AuthTokenService.AuthTokenPayload payload = authTokenService.parseToken(token);\n\
        \    long ttl = payload.exp() - Instant.now().getEpochSecond();\n    if (ttl\
        \ > 0) {\n        redisTemplate.opsForValue().set(\"token:blacklist:\" + payload.jti(),\
        \ \"1\", ttl, TimeUnit.SECONDS);\n    }\n    return Result.ok();\n}\n```\n\
        \n---\n\n### C-5: No Refresh Token — Single-Token Architecture\n\n**Files:**\
        \ `AuthServiceImpl.java`, `LoginResponse.java`, `session.ts`\n\nThe system\
        \ issues a single access token with a 2-hour expiry. There is no refresh token\
        \ endpoint or flow. Consequences:\n- Users must re-login every 2 hours\n-\
        \ If the token is stolen, the attacker has full access for 2 hours with no\
        \ way to invalidate it\n- Shortening token lifetime to improve security would\
        \ degrade UX\n\n**Fix — Recommended flow:**\n\n```\nPOST /auth/login → { accessToken\
        \ (15min), refreshToken (7d) }\nPOST /auth/refresh → validates refresh token,\
        \ issues new pair, rotates refresh token\nPOST /auth/logout → revokes both\
        \ tokens\n```\n\n```sql\n-- New table\nCREATE TABLE refresh_token (\n    id\
        \ BIGINT PRIMARY KEY AUTO_INCREMENT,\n    token_hash VARCHAR(64) NOT NULL\
        \ UNIQUE,\n    user_id BIGINT NOT NULL,\n    expires_at TIMESTAMP NOT NULL,\n\
        \    revoked BOOLEAN DEFAULT FALSE,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n\
        );\n```\n\n---\n\n## HIGH Findings\n\n### H-1: No Login Rate Limiting or Account\
        \ Lockout\n\n**File:** `backend/.../auth/AuthServiceImpl.java:56-68`\n\nNo\
        \ protection against brute-force attacks. An attacker can attempt unlimited\
        \ password guesses.\n\n**Fix:** Use Redis to track failed attempts:\n\n```java\n\
        // AuthServiceImpl.java — login()\nString lockKey = \"auth:lockout:\" + request.username();\n\
        Long failures = redisTemplate.opsForValue().increment(lockKey);\nif (failures\
        \ != null && failures > 5) {\n    throw new BusinessException(ErrorCode.AUTH_INVALID,\
        \ \"账户已锁定，请30分钟后重试\");\n}\nif (failures != null && failures == 1) {\n    redisTemplate.expire(lockKey,\
        \ 30, TimeUnit.MINUTES);\n}\n\n// On successful login:\nredisTemplate.delete(lockKey);\n\
        ```\n\n---\n\n### H-2: Frontend Token Stored in localStorage (XSS Risk)\n\n\
        **File:** `frontend/src/stores/session.ts:67`\n\n```typescript\nlocalStorage.setItem(STORAGE_KEY,\
        \ JSON.stringify(sessionSnapshot))\n```\n\n`localStorage` is accessible to\
        \ any JavaScript on the page. An XSS vulnerability would expose the JWT token.\n\
        \n**Fix:** Store tokens in `httpOnly` cookies set by the server, or use a\
        \ BFF (Backend-For-Frontend) pattern. At minimum, add a CSP header and sanitize\
        \ all user input.\n\n---\n\n### H-3: Static Admin Invite Code with No Expiry\n\
        \n**File:** `backend/.../auth/AuthProperties.java:205`, `AuthServiceImpl.java:89`\n\
        \n```java\nprivate String adminInviteCode = \"interview-admin-2026\";\n```\n\
        \nThe invite code is a static string that never expires and has no usage limit.\
        \ Anyone who discovers it can register as ADMIN.\n\n**Fix:** Use single-use,\
        \ time-limited invite tokens stored in the database:\n\n```sql\nCREATE TABLE\
        \ admin_invite (\n    id BIGINT PRIMARY KEY AUTO_INCREMENT,\n    token_hash\
        \ VARCHAR(64) NOT NULL UNIQUE,\n    expires_at TIMESTAMP NOT NULL,\n    used_by\
        \ BIGINT NULL,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n);\n```\n\
        \n---\n\n### H-4: Demo Accounts Seeded with Weak Passwords\n\n**File:** `backend/.../auth/AuthProperties.java:116,124`,\
        \ `.env:41,43`\n\n```env\nAUTH_DEMO_USER_PASSWORD=demo123\nAUTH_DEMO_ADMIN_PASSWORD=admin123\n\
        ```\n\nDemo accounts with weak passwords are auto-created on every startup.\
        \ If this runs in any non-isolated environment, these accounts are trivially\
        \ guessable.\n\n**Fix:** Disable seed in production (`AUTH_DEMO_USERS_SEED_ENABLED=false`),\
        \ or enforce minimum password complexity.\n\n---\n\n## MEDIUM Findings\n\n\
        ### M-1: SecurityConfig Permits All `/api/v1/**` Paths\n\n**File:** `config/SecurityConfig.java:32-33`\n\
        \n```java\n.requestMatchers(\"/api/v1/**\").permitAll()\n```\n\nSpring Security's\
        \ filter chain permits all API paths. Authentication is enforced only by `AuthInterceptor`\
        \ (a Spring MVC interceptor, not a servlet filter). This means:\n- Non-Spring-MVC\
        \ endpoints (e.g., WebSocket upgrades, error handlers) bypass auth\n- Any\
        \ misconfiguration in `WebMvcConfig` leaves all API endpoints unprotected\n\
        \n**Fix:** Move auth enforcement into the Spring Security filter chain:\n\n\
        ```java\n.authorizeHttpRequests(registry -> registry\n    .requestMatchers(\"\
        /api/v1/auth/login\", \"/api/v1/auth/register\").permitAll()\n    .requestMatchers(\"\
        /swagger-ui/**\", \"/v3/api-docs/**\").permitAll()\n    .requestMatchers(\"\
        /actuator/health\", \"/actuator/info\", \"/actuator/prometheus\").permitAll()\n\
        \    .anyRequest().authenticated()\n)\n.addFilterBefore(jwtAuthFilter, UsernamePasswordAuthenticationFilter.class)\n\
        ```\n\n---\n\n### M-2: No CORS Configuration Visible in Backend\n\n**Files:**\
        \ `SecurityConfig.java`, `WebMvcConfig.java`\n\nNo `@CrossOrigin` annotations,\
        \ no `CorsConfigurationSource` bean, and no `Access-Control-Allow-Origin`\
        \ headers. CORS is presumably handled at the nginx/proxy level, but any misconfiguration\
        \ at that layer would expose the API to cross-origin attacks.\n\n**Fix:**\
        \ Add explicit CORS configuration in `SecurityConfig`:\n\n```java\n@Bean\n\
        CorsConfigurationSource corsConfigurationSource() {\n    CorsConfiguration\
        \ config = new CorsConfiguration();\n    config.setAllowedOrigins(List.of(\"\
        https://yourdomain.com\"));\n    config.setAllowedMethods(List.of(\"GET\"\
        , \"POST\", \"PUT\", \"DELETE\"));\n    config.setAllowedHeaders(List.of(\"\
        Authorization\", \"Content-Type\"));\n    config.setAllowCredentials(true);\n\
        \    UrlBasedCorsConfigurationSource source = new UrlBasedCorsConfigurationSource();\n\
        \    source.registerCorsConfiguration(\"/**\", config);\n    return source;\n\
        }\n```\n\n---\n\n### M-3: Token Payload Contains Only `sub` and `exp`\n\n\
        **File:** `AuthTokenService.java:34`\n\n```java\nMap.of(\"sub\", user.getId(),\
        \ \"exp\", exp)\n```\n\nNo `iat` (issued-at), `jti` (token ID), or `role`\
        \ claim. This means:\n- Cannot determine when a token was issued\n- Cannot\
        \ revoke individual tokens\n- Role checks require a database query on every\
        \ request (`AuthInterceptor.java:75`)\n\n**Fix:** Add `iat`, `jti`, and `role`\
        \ to the token payload:\n\n```java\nMap.of(\"sub\", user.getId(), \"exp\"\
        , exp, \"iat\", Instant.now().getEpochSecond(),\n       \"jti\", UUID.randomUUID().toString(),\
        \ \"role\", user.getRole())\n```\n\n---\n\n### M-4: No Security Headers\n\n\
        No `X-Content-Type-Options`, `X-Frame-Options`, `Strict-Transport-Security`,\
        \ or `Content-Security-Policy` headers are configured.\n\n**Fix:** Add via\
        \ Spring Security:\n\n```java\n.headers(headers -> headers\n    .contentTypeOptions(Customizer.withDefaults())\n\
        \    .frameOptions(frame -> frame.deny())\n    .httpStrictTransportSecurity(hsts\
        \ -> hsts\n        .includeSubDomains(true)\n        .maxAgeInSeconds(31536000))\n\
        \    .contentSecurityPolicy(csp -> csp.policyDirectives(\"default-src 'self'\"\
        )))\n```\n\n---\n\n## Risk Matrix\n\n| ID | Severity | Finding | Effort |\
        \ Impact |\n|----|----------|---------|--------|--------|\n| C-1 | CRITICAL\
        \ | Timing-vulnerable JWT signature | Low | Token forgery |\n| C-2 | CRITICAL\
        \ | Secrets committed to VCS | Medium | Full system compromise |\n| C-3 |\
        \ CRITICAL | Hardcoded default JWT secret | Low | Token forgery |\n| C-4 |\
        \ CRITICAL | No token revocation | High | Stolen tokens unrevocable |\n| C-5\
        \ | CRITICAL | No refresh token mechanism | High | UX + security gap |\n|\
        \ H-1 | HIGH | No brute-force protection | Medium | Account takeover |\n|\
        \ H-2 | HIGH | Token in localStorage | Medium | XSS token theft |\n| H-3 |\
        \ HIGH | Static admin invite code | Low | Privilege escalation |\n| H-4 |\
        \ HIGH | Weak demo account passwords | Low | Unauthorized access |\n| M-1\
        \ | MEDIUM | SecurityConfig permits all API | Medium | Auth bypass risk |\n\
        | M-2 | MEDIUM | No CORS in backend | Medium | Cross-origin attacks |\n| M-3\
        \ | MEDIUM | Minimal token claims | Low | Extra DB queries, no revocation\
        \ |\n| M-4 | MEDIUM | No security headers | Low | Clickjacking, MIME sniffing\
        \ |\n\n---\n\n## Recommended Remediation Priority\n\n1. **Immediately** —\
        \ Rotate all exposed secrets (C-2), remove `.env` from git\n2. **Before next\
        \ deploy** — Fix timing-vulnerable signature (C-1), add startup secret validation\
        \ (C-3)\n3. **This sprint** — Add rate limiting (H-1), implement token revocation\
        \ with `jti` (C-4), add security headers (M-4)\n4. **Next sprint** — Implement\
        \ refresh token flow (C-5), migrate auth to Spring Security filter chain (M-1),\
        \ move token to httpOnly cookies (H-2)\n5. **Ongoing** — Replace static invite\
        \ codes (H-3), disable demo seeding in prod (H-4), add CORS config (M-2)"
