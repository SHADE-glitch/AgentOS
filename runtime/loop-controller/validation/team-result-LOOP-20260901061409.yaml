        \ |\n| 7 | No server-side logout | **HIGH** | Low | AuthService + Controller\
        \ |\n| 8 | No rate limiting on auth endpoints | **HIGH** | Medium | Filter/Config\
        \ |\n| 9 | CSRF disabled without documentation | **HIGH** | Low | SecurityConfig\
