        \n### Executive Summary\n\nThe auth module implements a standard JWT dual-token\
        \ (access + refresh) architecture with Spring Security. However, there are\
        \ **6 critical**, **4 high**, and **3 medium** severity findings across JWT\
        \ refresh mechanism, token revocation, and SecurityConfig.\n\n---\n\n### 1.\
        \ JWT Token Refresh Mechanism\n\n#### CRITICAL: No Token Type Discrimination\n\
        **File:** `JwtUtil.java:30-36`\n\nAccess and refresh tokens use identical\
        \ structure — same signing key, same claims, only the `exp` differs. There\
        \ is no `type` or `scope` claim to distinguish them.\n\n```java\n// Both createToken()\
        \ calls produce indistinguishable tokens\npublic String createAccessToken(Long\
        \ userId, String username) {\n    return createToken(userId, username, accessExpireSeconds);\
        \  // no \"type\" claim\n}\npublic String createRefreshToken(Long userId,\
        \ String username) {\n    return createToken(userId, username, refreshExpireSeconds);\
        \ // no \"type\" claim\n}\n```\n\n**Impact:** A refresh token (7-day expiry)\
        \ can be used to access protected resources since `JwtAuthenticationFilter`\
        \ accepts any valid JWT. An attacker who steals a refresh token gains full\
        \ API access for 7 days.\n\n**Fix:**\n```java\nprivate String createToken(Long\
        \ userId, String username, long expireSeconds, String type) {\n    return\
        \ Jwts.builder()\n            .subject(username)\n            .claim(\"uid\"\
        , userId)\n            .claim(\"scope\", type)  // \"access\" or \"refresh\"\
        \n            .issuedAt(now)\n            .expiration(new Date(now.getTime()\
        \ + expireSeconds * 1000))\n            .signWith(key)\n            .compact();\n\
        }\n```\n\nThen validate `scope` in `JwtAuthenticationFilter`.\n\n#### CRITICAL:\
        \ Refresh Token Endpoint Accepts Bearer Header via Refresh Token\n**File:**\
        \ `AuthController.java:37-41`\n\nThe `/api/auth/refresh` endpoint reads the\
        \ refresh token from the `Authorization: Bearer` header. But this endpoint\
        \ is under `/api/auth/**` which is **`permitAll()`** in SecurityConfig, meaning\
        \ no JWT validation occurs. The controller manually extracts the token.\n\n\
        **Impact:** Confusing API design — the same `Authorization` header carries\
        \ access tokens for API calls and refresh tokens for token renewal. A client\
        \ accidentally sending an access token to `/refresh` will cause the access\
        \ token to be \"refreshed\" and a new token pair issued, extending the token's\
        \ lifetime without proper rotation.\n\n**Fix:** Accept refresh token from\
        \ request body or dedicated header:\n```java\n@PostMapping(\"/refresh\")\n\
        public Result<AuthResponse> refresh(@RequestBody RefreshRequest request) {\n\
        \    return Result.ok(authService.refresh(request.getRefreshToken()));\n}\n\
        ```\n\n#### HIGH: No Refresh Token Rotation\n**File:** `AuthService.java:65-79`\n\
        \nEach `refresh()` call issues a **new** access + refresh token pair, but\
        \ the old refresh token is never invalidated. The old refresh token remains\
        \ valid until its 7-day expiry.\n\n**Impact:** If an attacker obtains a refresh\
        \ token, they can generate unlimited new token pairs. Even if the legitimate\
        \ user logs out, the attacker's refresh token continues working.\n\n**Fix:**\
        \ Implement single-use refresh tokens — store active refresh token hash in\
        \ DB/Redis, invalidate old on use.\n\n---\n\n### 2. Refresh Token Revocation\n\
        \n#### CRITICAL: No Token Revocation Mechanism\n**Files:** `AuthService.java`,\
        \ `JwtAuthenticationFilter.java`\n\nRedis (Redisson) is configured but **completely\
        \ unused** for auth. There is no blacklist, no revocation list, no token store.\
        \ A compromised token is valid until natural expiry.\n\n```\nImpact Summary:\n\
        - Access token: valid for 2 hours (7200s) with no revocation\n- Refresh token:\
        \ valid for 7 days (604800s) with no revocation\n- Logout: client-side only\
        \ (clears localStorage), tokens remain valid server-side\n```\n\n**Impact:**\
        \ User logout is cosmetic. Server has no mechanism to invalidate tokens. If\
        \ a user's tokens are stolen, they remain valid for the full expiry window.\n\
        \n**Fix — Redis-based token blacklist:**\n```java\n@Service\n@RequiredArgsConstructor\n\
        public class TokenRevocationService {\n\n    private final RedissonClient\
        \ redisson;\n\n    public void revokeAccessToken(String jti, long expiryMs)\
        \ {\n        RBucket<Boolean> bucket = redisson.getBucket(\"revoked:access:\"\
        \ + jti);\n        bucket.set(true, expiryMs, TimeUnit.MILLISECONDS);\n  \
        \  }\n\n    public void revokeRefreshToken(String jti) {\n        RBucket<Boolean>\
        \ bucket = redisson.getBucket(\"revoked:refresh:\" + jti);\n        bucket.set(true,\
        \ 7, TimeUnit.DAYS);\n    }\n\n    public boolean isRevoked(String jti, String\
        \ tokenType) {\n        RBucket<Boolean> bucket = redisson.getBucket(\"revoked:\"\
        \ + tokenType + \":\" + jti);\n        return bucket.isExists();\n    }\n\
        }\n```\n\nAdd `jti` (JWT ID) claim to all tokens, check revocation in `JwtAuthenticationFilter`.\n\
        \n#### HIGH: No Server-Side Logout\n**File:** `frontend/src/stores/auth.ts:34-38`\n\
