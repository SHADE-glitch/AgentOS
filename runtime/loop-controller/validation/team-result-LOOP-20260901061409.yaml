        ```\n```\nJWT_SECRET=aiview-interview-platform-secret-key-please-change-in-production\n\
        ```\n\nThe `.env` value is a hardcoded, human-readable string — not cryptographically\
        \ random. HMAC-SHA requires at least 256 bits (32 bytes) of entropy for HS256.\n\
        \n**Impact:** If the `.env` file is leaked (repo accidentally made public,\
        \ server compromise), all tokens are trivially forgeable.\n\n**Fix:**\n```bash\n\
        # Generate proper secret\nopenssl rand -base64 64\n```\nValidate minimum length\
        \ at startup:\n```java\npublic JwtUtil(@Value(\"${app.jwt.secret}\") String\
        \ secret) {\n    if (secret.length() < 32) {\n        throw new IllegalStateException(\"\
        JWT secret must be at least 32 characters\");\n    }\n    this.key = Keys.hmacShaKeyFor(secret.getBytes(StandardCharsets.UTF_8));\n\
        }\n```\n\n#### HIGH: CSRF Disabled Without Alternative Protection\n**File:**\
        \ `SecurityConfig.java:34`\n\n```java\n.csrf(csrf -> csrf.disable())\n```\n\
        \nCSRF is disabled because the app uses stateless JWT. However, the `/api/auth/refresh`\
        \ endpoint is under `permitAll()` and uses the `Authorization` header — this\
        \ is safe. But if any endpoint ever accepts cookies or form data, CSRF would\
        \ be exploitable.\n\n**Recommendation:** Document the CSRF disable rationale.\
        \ If session cookies are ever introduced, re-enable CSRF with a `CsrfTokenRequestAttributeHandler`.\n\
        \n#### MEDIUM: Asynchronous Dispatcher PermitAll\n**File:** `SecurityConfig.java:37-38`\n\
        \n```java\n.dispatcherTypeMatchers(DispatcherType.ASYNC, DispatcherType.ERROR,\
        \ DispatcherType.FORWARD)\n.permitAll()\n```\n\nPermitting `ERROR` and `FORWARD`\
        \ dispatcher types could allow error pages or forwarded requests to bypass\
        \ security checks in edge cases.\n\n**Fix:** Restrict to only needed dispatcher\
        \ types or add authentication checks in error handlers.\n\n---\n\n### 4. Additional\
        \ Findings\n\n#### HIGH: No Rate Limiting on Auth Endpoints\n**Files:** `AuthController.java:27-35`\n\
        \nNo rate limiting on `/api/auth/login` or `/api/auth/register`. An attacker\
        \ can brute-force credentials or create mass accounts.\n\n**Fix:** Add rate\
        \ limiting via Redis (bucket4j, Resilience4j) or a servlet filter:\n```java\n\
        // Example: 5 login attempts per minute per IP\nRateLimiter rateLimiter =\
        \ RateLimiter.builder()\n    .limit(5)\n    .period(Duration.ofMinutes(1))\n\
        \    .build();\n```\n\n#### MEDIUM: Login Response Leaks User Existence\n\
        **File:** `AuthService.java:54-63`\n\nThe `LOGIN_FAILED` error is thrown for\
        \ both \"user not found\" and \"wrong password\" — this is correct. However,\
        \ the error message should be generic and identical for both cases to prevent\
        \ username enumeration.\n\n#### MEDIUM: No Token in HTTP-Only Cookies\n**File:**\
        \ `frontend/src/api/client.ts:1-2`\n\nTokens stored in `localStorage` — vulnerable\
        \ to XSS attacks. If any XSS vulnerability exists in the frontend, all tokens\
        \ are accessible via `localStorage.getItem()`.\n\n**Fix:** Consider httpOnly\
        \ cookies for token storage, or at minimum add CSP headers and sanitize user\
        \ inputs.\n\n---\n\n### Priority Remediation Matrix\n\n| # | Finding | Severity\
        \ | Effort | Component |\n|---|---------|----------|--------|-----------|\n\
        | 1 | No token revocation mechanism | **CRITICAL** | Medium | Backend |\n\
