        \n---\n\n## 1. InterviewStateStore.java:34 — Redis 过期后 DB 回退逻辑\n\n### 1.1\
        \ 现状代码证据\n\n`InterviewStateStore.java:34-46`:\n```java\npublic SessionState\
        \ read(Long sessionId) { //:34\n  RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \  String json = bucket.get(); // null = 不存在/已过期\n  if (json==null) return\
        \ null;\n  try{ return objectMapper.readValue(json, SessionState.class); }\n\
        \  catch(Exception e){ log.warn(...); return null; } //:44 污染==过期\n}\npublic\
        \ void write(Long s, SessionState st){ //:48\n  redissonClient.getBucket(key(s)).set(json,\
        \ TTL_HOURS, TimeUnit.HOURS); //:51 TTL=24h 固定\n}\n```\n\n`InterviewService.java:372-391`:\n\
        ```java\nprivate SessionState requireAsking(Long sessionId){ //:372\n  SessionState\
        \ state = stateStore.read(sessionId); //:373\n  if(state==null){ //:374 Fallback\n\
        \    InterviewSession s = sessionMapper.selectById(sessionId); //:375\n  \
        \  if(s==null) throw NOT_FOUND;\n    state = new SessionState(s.getStatus(),\
        \ s.getQuestionCount(), s.getCurrentQuestionId()); //:379\n    stateStore.write(sessionId,\
        \ state); //:381 回写缓存\n  }\n  if(FINISHED.equals(state.status())) throw FINISHED;\
        \ //:383\n  if(!ASKING && !START) throw STATE_ERROR; //:386\n  return state;\n\
        }\n```\n\n注释 `InterviewStateStore.java:15` 宣称 *\"作为状态机的单一权威来源\"* — 实际是双写非事务。\n\
        \n### 1.2 5 类缺陷（按风险排序）\n\n| # | 风险 | 现象 | 根因 |\n|---|------|------|------|\n\
        | **R1** | \U0001F534 High | **写后读不一致导致 questionCount 漂移** | `answer():183`\
        \ 先 `sessionMapper.updateById` 后 `stateStore.write`，无 `@Transactional`，崩溃/异常间隙\
        \ `Redis` 留存旧值。下一次 `read` 命中旧值**不走 fallback**，`newCount=old+1` 越算越偏。 |\n|\
        \ **R2** | \U0001F534 High | **过期≠损坏混淆** | `read:44` 对 JSON 解析异常也 `return\
        \ null`，触发 DB 回退并 `write` 覆盖。攻击者或脏数据可注入 `\"{bad}\"` 强制复活/篡改状态，且无 `TTL` 区分日志。\
        \ |\n| **R3** | \U0001F7E1 Medium | **TTL 语义缺失** | `TTL_HOURS=24` 硬编码，仅 `write`\
        \ 刷新。冷会话 24h 后自动回退复活，无 `finishedAt` 过期校验，`FINISHED` 会话过期后仍重建 `FINISHED` 状态并重置\
