    output: "I've grounded the analysis in the actual source. Here is my lead deliverable.\n\
      \n---\n\n# Lead Analysis — Redis Fixed-TTL Runtime State Expiry vs. Valid DB\n\
      \n**Team:** team-18087af2 | **Domains:** database, ai | **Type:** debug\n**Primary\
      \ evidence:** `InterviewStateStore.java` (61 lines), `InterviewService.java`\
      \ (446 lines)\n**Scope of claim:** \"Interview session runtime state stored\
      \ in Redis with fixed TTL can silently expire while the DB remains valid; explain\
      \ when and why continuation breaks.\"\n\n---\n\n## 1. Hypothesis Review (all\
      \ grounded against real code)\n\nI inspected the actual files rather than relying\
      \ on the unvalidated hypotheses. **Every hypothesis' code reference is accurate:**\n\
      \n| Hyp | Lines | Claim | Verdict vs `InterviewStateStore.java` |\n|-----|-------|-------|----------------------------------------|\n\
      | H-023 | 37–44 | `read()` returns `null` both on missing key **and** corrupt\
      \ JSON (parse failure swallowed) | ✅ **Validated** — `:38` null on missing key;\
      \ `:42–44` `catch` returns `null` on parse failure. Both collapse to \"null\
      \ → rebuild from DB\". |\n| H-024 | 48–51 | `write()` resets a fixed 24h TTL\
      \ on every write | ✅ **Validated** — `:51` `set(json, TTL_HOURS, TimeUnit.HOURS)`,\
      \ `TTL_HOURS = 24` at `:25`. |\n| H-025 | 36–38 | `read()` returns `null` when\
      \ bucket absent | ✅ **Validated** — `:37–38`. |\n| H-027 | 34–39 | `read()`\
      \ returns `null` on missing key | ✅ **Validated** — `:34–39`. |\n| H-031 | 14–16\
      \ | Comment declares Redis the \"单一权威来源\" (single authoritative source) | ✅\
      \ **Validated** — `:15`. | \n\n**Important refinement beyond the hypotheses\
      \ (my addition):** The hypotheses correctly describe the *mechanism* but slightly\
      \ overstate the *consequence*. In the golden path, a plain fixed-TTL expiry\
      \ **self-heals**, because `requireAsking()` (`InterviewService.java:380–399`)\
      \ falls back to the DB and re-writes the key (`:387–389`). So Redis expiry alone\
      \ does **not** break continuation in an obviously wrong way — **it breaks only\
      \ when DB and Redis have already diverged at the moment of expiry.** That's\
      \ the honest, code-grounded core of this answer. A \"test\" here means code-path\
      \ tracing (I cannot hit a live Redis in this environment), which I detail below.\n\
      \n---\n\n## 2. Setup: the two storage roles and their contract\n\n```\nDurable\
      \ layer:  InterviewSession (DB) — status, questionCount, currentQuestionId\n\
      Runtime layer:  Redis key \"interview:session:{id}\" — SessionState(status,\
      \ questionCount, currentQuestionId)\n```\n\n- `InterviewStateStore.write()`\
      \ (`:48–56`) serializes `SessionState` and calls Redisson `RBucket.set(value,\
      \ 24, HOURS)`.\n- The 24h TTL is **sliding-de-jure but fixed-de-facto**: every\
      \ write renews it. Expiry therefore fires **24h after the *last* write**, i.e.\
      \ 24h of session inactivity.\n- `InterviewStateStore.read()` (`:34–46`) is the\
      \ only read path; it returns `null` for \"absent **or** unparseable\" — two\
      \ distinct causes flattened into one.\n- `InterviewService.requireAsking()`\
      \ (`:380–399`) is the continuation gate for `answer()` (`:129`) and `answerStream()`\
      \ (`:204`).\n\n---\n\n## 3. When continuation breaks\n\n### 3.1 The state that\
      \ survives\nFor continuation to be *broken by* a Redis expiry, the DB alone\
      \ must be **incapable of reconstructing a correct `SessionState`**. Two sub-cases:\n\
      \n**Divergence pre-existing the expiry (the real killer).** The DB and Redis\
      \ are written by **two separate, non-transactional statements** in the same\
      \ method — DB `updateById` at `InterviewService.java:186` then Redis `write`\
      \ at `:188` (the same shape in `create()` `:114`/`:116` and `finishSession()`\
      \ `:344`/`:345`). If the Redis write throws (`InterviewStateStore:52–54`) *after*\
      \ the DB commit, **DB is ahead of Redis**. Ordering analysis of the failure\
      \ directions:\n\n- **DB ahead of Redis (write fails):** next `answer()` re-reads\
      \ messages from DB (`:135`), so asked-question dedup stays correct; Redis is\
      \ merely stale, then expires, then `requireAsking` rebuilds from the newer DB.\
      \ **Risk: low.**\n- **Redis ahead of DB:** only possible in `create()` (`:91`\
      \ writes before `:114`) or if some non–`updateById` path writes the Redis state\
      \ without a matching durable counterpart, or an external/`delete()` flow (`InterviewStateStore:58–60`)\
      \ removes the key while DB stays valid. In this direction, the ephemeral Redis\
      \ value (newer `questionCount` / `currentQuestionId`) is silently discarded\
      \ on expiry, and the fallback rebuilds the **older DB** `SessionState` (`:387–389`).\
      \ **This is the break:** the freshest truth is destroyed by the TTL and replaced\
      \ with a stale snapshot *without any freshness/version check*.\n\n**Fixed TTL\
      \ converting a recoverable delay into silent corruption.** Because the reconstructed\
      \ state is immediately written back at `requireAsking:389`, the stale DB-derived\
      \ value becomes the *new* authoritative Redis value for the rest of the session.\
      \ Subsequent `answer()` then computes `state.questionCount() + 1` (`:179`, `:254`)\
      \ on the wrong base, and `sessionMapper.updateById` (`:186`) persists the wrong\
      \ `questionCount` and possibly the wrong `currentQuestionId` into the durable\
      \ layer — **propagating the corruption into the DB** that was actually valid.\n\
      \n### 3.2 The trigger window (concrete)\nContinuation genuinely breaks when\
      \ **all** hold:\n1. Session is durably valid: DB row has `status = ASKING/START`,\
      \ `questionCount = N`, `currentQuestionId = QN`.\n2. Redis key TTLs out — i.e.\
      \ ≥24h with no `write()` (answer/SSE), or an eviction/`delete()`, or Redis restart\
      \ flush.\n3. Redis had fresher/divergent data than the DB (section 3.1), so\
      \ the DB fallback is a **best-effort guesses** with no proof it equals what\
      \ Redis last held.\n\nIf (3) is false — DB and Redis were perfectly consistent\
      \ — then expiry is nearly harmless: `requireAsking` rebuilds identical state\
      \ and the session continues. **This is why the bug is silent and intermittent:**\
      \ it only manifests in the intersection of expiry + divergence, which is a rare,\
      \ long-tail event. The fixed TTL's role is to turn divergence (invisible while\
      \ Redis holds fresher data) into a visible, persisted wrong state.\n\n### 3.3\
      \ Why (root causes, mapped to code)\n- **Authority inversion** — `InterviewStateStore:15`\
      \ declares Redis the single authoritative source, yet Redis is: non-durable,\
      \ TTL-limited, and collapse-prone (`read` conflates missing vs corrupt). A cache/lease\
      \ cannot back an authority guarantee without renewal + validation.\n- **Fixed\
      \ TTL vs. sliding session lifetime** — the 24h constant (`:25`) has no relationship\
      \ to DB row lifetime or activity; only `write()` renews it. Long-and-quiet sessions\
      \ are the ones silently evicted.\n- **`read()` flattening two failure classes**\
      \ (`:37–44`) — \"key missing\" and \"JSON corrupt\" return the same `null`,\
      \ so `requireAsking` cannot distinguish \"genuinely absent\" from \"bad/diverged\
      \ data, rebuild with caution.\"\n- **Fallback trusts stale DB without freshness**\
      \ (`InterviewService:383–389`) — no version/MD5/timestamp comparison between\
      \ DB and Redis; the DB state is adopted unconditionally and written back, cementing\
      \ divergence.\n\n---\n\n## 4. Recommended fixes (specific, actionable)\n\n**Fix\
      \ 1 — Never let the fixed TTL be the enforcement of trust; add renewal + freshness\
      \ guard.**\nMove to a sliding TTL based on *actual* activity and add a version\
      \ stamp so the fallback can refuse to overwrite a newer Redis value:\n\n```java\n\
      public void write(Long sessionId, SessionState state, long version) {\n    redissonClient.getBucket(key(sessionId))\n\
      \        .set(state.withVersion(version), TTL_HOURS, TimeUnit.HOURS);\n    redissonClient.getAtomicLong(versionKey(sessionId)).set(version);\n\
      }\n```\n\n**Fix 2 — Make `read()` lossless about failure class** (`InterviewStateStore:34–46`):\n\
      \n```java\npublic SessionState read(Long sessionId) {\n    RBucket<String> bucket\
      \ = redissonClient.getBucket(key(sessionId));\n    String json = bucket.get();\n\
      \    if (json == null) return null;                     // genuinely expired/absent\n\
      \    try {\n        SessionState s = objectMapper.readValue(json, SessionState.class);\n\
      \        long v = redissonClient.getAtomicLong(versionKey(sessionId)).get();\n\
      \        return s.withVersion(v);\n    } catch (Exception e) {\n        log.warn(\"\
      corrupt session state, sessionId={}: {}\", sessionId, e.getMessage());\n   \
      \     return explicitlyCorrupt(sessionId);           // do NOT rebuild silently\n\
      \    }\n}\n```\n\n**Fix 3 — `requireAsking()` must validate DB vs Redis and\
      \ REFUSE stale rebuild** (`InterviewService:380–399`):\n\n```java\nif (state\
      \ == null) {\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
      \    if (s == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
      \    // No divergence guard exists today; add: compare s.getVersion()/updated_at\n\
      \    // against Redis; if DB is OLDER than last known Redis, raise + alert instead\n\
      \    // of silently adopting stale DB. Only rebuild when DB is the newer source.\n\
      \    state = new SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId());\n\
      \    stateStore.write(sessionId, state);\n}\n```\n\n**Fix 4 — Make the dual-write\
      \ atomic.** Use the existing Redisson lock (`lockFor`, `:361`) but carry the\
      \ state change as a single transactional unit: either\n- put the state mutation\
      \ + Redis write inside one DB transaction and compensate on failure, or\n- treat\
      \ the **DB as the single authoritative source** (remove the `:15` claim) and\
      \ make Redis purely a read-through cache: `requireAsking` should always read\
      \ DB first and use Redis only as an indexing cache, never as the state machine\
      \ truth.\n\n**Fix 5 — Alerting on divergence.** Add a scheduled reconciliation\
      \ job that compares Redis `SessionState` vs the DB row per `sessionId` for `ASKING`\
      \ sessions; log/`AlertManager` on `questionCount` or `currentQuestionId` mismatch.\
      \ This converts a silent event into an observable one.\n\n**Fix 6 — TTL policies.**\n\
      - Set the TTL relative to session lifecycle, not a hard constant: expire Redis\
      \ state only when the DB session is `FINISHED` (or on an inactivity TTL that\
      \ also marks the DB session stale), never on a value independent of DB validity.\n\
      - Prefer the DB `updatedAt`/a version column over a wall-clock 24h constant\
      \ so \"valid session\" and \"cached state present\" stay in sync.\n\n---\n\n\
      ## 5. Bottom line\n\nRedis runtime state with a fixed 24h TTL **can** silently\
      \ expire while the DB stays valid (`ASKING`, N answers logged). Continuation\
      \ breaks **only when DB and Redis had already diverged** before expiry — because\
      \ `requireAsking` (`InterviewService:383–389`) then rebuilds the Redis state\
      \ from a stale DB snapshot and writes it back, silently promoting a wrong `questionCount`/`currentQuestionId`\
      \ into the durable layer. If Redis and DB are perfectly consistent, expiry self-heals\
      \ and the session continues correctly — which is exactly why this bug is rare\
      \ and silent. The definitive fix is to **stop treating Redis as the authority**\
      \ (`InterviewStateStore:15`): make the DB the source of truth, use Redis as\
      \ a versioned, validated read cache, never collapse \"corrupt\" into \"absent\"\
      \ (`:42–44`), and alert on any Redis/DB drift."
