      output: '# Contribution — Redis TTL expiry vs durable DB: when/why interview
        continuation breaks


        **Role focus:** Database Engineer · reported for **lead review** · grounded
        in `InterviewStateStore.java` and `InterviewService.java`.


        ## 1. Mechanism inventory (verified in code)


        Three facts create the failure, on top of a latent architectural contradiction.


        **F1 — Redis is declared authoritative but is TTL''d (contradiction).**

        `InterviewStateStore.java:15` documents Redis as *“单一权威来源”* (single authoritative
        source), yet `write()` (`:48-56`, `:51`) stamps every key with a **fixed `TTL_HOURS
        = 24`** (`:25`). Redis is non-durable + expiring by design. An authoritative
        state store must not expire; an expiring store is a cache. The design claims
        both.


        **F2 — `read()` silently degrades on expiry/corruption.**

        `read()` (`:34-46`) returns `null` in two distinct hidden cases:

        - `bucket.get() == null` → **TTL expiry eviction** (`:37-38`)

        - JSON parse failure → **corrupt payload** is logged then returns `null` (`:42-44`)


        Both collapse to the same `null`, with no signal distinguishing “never written”
        from “expired” from “corrupted”. This is the silent-exit point.


        **F3 — the DB fallback re-hydrates without any freshness check.**

        `requireAsking()` (`InterviewService.java:380-399`): on `null` it does `sessionMapper.selectById`
        and rebuilds a `SessionState(status, questionCount, currentQuestionId)` from
        the DB row, then `stateStore.write()` **re-seeds Redis** (`:389`). There is
        no comparison of DB `updatedAt` vs Redis TTL/`createdAt`, and no version field
        anywhere.


        ## 2. When it breaks


        Silent expiry fires only after the key goes **≥24h without a `write()`** (see
        §3 for the precise trigger). Concretely:


        | Trigger | Result |

        |---|---|

        | **Idle interruption.** Session left open/paused, no answer-next call for
        ≥24h. | Redis evicts; no request hits it until user resumes. |

        | **Long-running sessions.** Any interview spanning >24h wall-clock with a
        gap >24h between transition writes. |

        | **Redis eviction/restart.** `maxmemory` policy (`allkeys-*`) or server flush
        evicts keys far sooner than 24h even with activity. |

        | **Corruption.** A bad/partial payload makes `read()` return `null` immediately,
        before any TTL. |

        | **`delete()`** (`:58-60`) — manual removal, again surfaced as plain `null`.
        |


        Notably, *active* interviews self-reset TTL on every transition (each `write()`
        restarts the 24h clock), so the break is not “elapsed 24h since start” but
        **“24h since the last state write”** — i.e., it hits exactly the long-pause
        / resumed-session case.


        ## 3. Why continuation breaks (the substantive part)


        The break is a **reconciliation failure of two counters and two truth sources**,
        specifically:


        **(a) Two non-atomic copied counters.** Every transition does:

        ```java

        session.setQuestionCount(newCount); sessionMapper.updateById(session);   //
        DB  (186, 260, 114)

        stateStore.write(sessionId, new SessionState(ASKING, newCount, msgId));  //
        Redis (188, 263, 116)

        ```

        These are **separate non-transactional writes**. When Redis expires mid-interview,
        the DB row is the survivor, but:

        - DB `status` was persisted as `ASKING`/`START` (`:111,183,258`), not the
        transitional truth a user expects.

        - DB `questionCount` is authoritative only for what survived `updateById`;
        if a Redis write (`:188`) **failed** after a DB write (`:186`) succeeded,
        the row is ahead of Redis. Then the *next* transition reads stale-but-present
        Redis (`state.questionCount()` at `:179/254`) and produces a **duplicate/renumbered
        question** or an off-by-one into `pickQuestion(..., askedQuestionIds, ...)`,
        which can re-ask or wedge.


        **(b) Redis-present-but-stale beats DB-fresh.** `requireAsking()` trusts whatever
        `read()` returns unconditionally (`:381-390`). Expiry is not required for
        drift — a **failed/out-of-order Redis write** while DB advances yields a *present,
        stale* Redis state, and continuation silently uses it. Expiry merely makes
        the divergence *visible* as a DB re-seed; the latent inconsistency exists
        in every dual-write.


        **(c) Expiry can resurrect or truncate sessions.**

        - *Resurrection:* if Redis held `FINISHED` progressive state but the DB row
        still says `ASKING` (DB write ordering), expiry drops the finished marker
        → the session **reopens as answerable** (`:396` check passes) → user continues
        a finished interview.

        - *Truncation:* reconstructing `questionCount` from DB ignores any transient
        increment that only landed in Redis, so a resumed session **re-indexes from
        a stale point**, replaying the last question.


        **(d) The “authoritative” claim inverts silently.** The system treats Redis
        as the machine, DB as the resume record. On TTL expiry, the machine is discarded
        and DB *becomes* the truth — with zero signal to the caller. Any caller that
        bypasses `requireAsking()` (e.g., the `answerStream` virtual thread at `:197-269`,
        and completion/finish paths) and consumes `currentQuestionId` gets inconsistent
        behavior depending only on luck of Redis ordering.


        ## 4. Recommendation (domain stance)


        Resolve the contradiction — an expiring store cannot be a fact store.


        1. **Make the DB the authoritative state; demote Redis to a cache** (matches
        existing fallback at `:383-389`). Add a `version`/`updatedAt` column to the
        session; on read, if Redis is missing or older than DB, rebuild and **write
        Redis with a sliding TTL** (re-armed on every read, not just every transition),
        e.g. `set(..., 24, HOURS)` re-issued in reads.

        2. **Stop collapsing expiry, corruption, and absence into one `null`.** Return
        a typed result (`MISSING` / `CORRUPT` / `OK`) or at least distinguish parse
        failure from key absence so corruption is logged/alarmed instead of silently
        falling back.

        3. **Make the dual write atomic or DB-first.** Since DB is durable, write
        DB then Redis; treat a Redis write failure as recoverable (fallback rehydrates).
        Never let a post-DB Redis failure silently go stale.

        4. **Reorder/fix the sequencing risk** at `:186→:188` (and `260→263`, `114→116`)
        by ensuring the Redis write either succeeds-with-retry or is visibly skipped,
        so a later transition never trusts a stale bucket.

        5. **NF: no finite TTL on authoritative state.** If Redis must remain authoritative,
        drop the fixed 24h and gate eviction by general `maxmemory` pressure + keep
        the DB write as a durable checkpoint for restart recovery.


        ## 5. Hypothesis cross-check (for lead)


        All five provided hypotheses are consistent with `InterviewStateStore.java`
        source:

        - **H-023 [:37-44]** `read()` returns `null` on missing/corrupt JSON — **confirmed
        by code** (`:37-38`, `:42-44`).

        - **H-024 [:48-51]** `write()` resets TTL, wraps errors → ~ confirmed (`:51`,
        `:52-55`).

        - **H-031 [:14-16]** Redis-as-single-authority comment — **confirmed** (`:15`).

        - **H-025/H-027 [:36-38, :34-39]** bucket-missing null + lossy fallback —
        consistent.


        All remain **UNVALIDATED at runtime** per the harness; recommend an integration
        test that (1) writes state, `delete()`s the key, and asserts the DB-fallback
        re-seeds Redis with matching `currentQuestionId`, and (2) simulates the failed-second-write
        ordering (DB updated, Redis stale) to confirm the off-by-one re-ask. Ready
        for lead review.'
