        27). All three fields exist on the DB entity `InterviewSession` (`status`
        String, `questionCount` Integer, `currentQuestionId` Long), so the DB copy
        is *complete* — nothing in the Redis state is structurally irreconstructible.

        - `requireAsking` (InterviewService.java:380-399): on `stateStore.read(sessionId)
        == null` it does **not** throw — it loads `sessionMapper.selectById`, rebuilds
        `SessionState` from DB, **rewrites it with a fresh 24h TTL (line 389)**, then
        validates status.


        Consequences that contradict common assumptions:


        1. A plain TTL expiry is **invisible and self-healing**. Next `answer`/`answerStream`
        hits a cache miss → rehydrates from DB → rewrites the key with a new 24h window
        → control flow continues as if nothing happened. No log, no alert. This is
        precisely the "**silent**" part of the report.

        2. So expiry itself never *breaks* continuation in the healthy case — the
        DB fallback absorbs it.


        Therefore "when and why continuation breaks" is not about the TTL *existing*;
        it''s about the TTL expiring at a moment when **DB and Redis have diverged**.
        All real breakages below trace to that.


