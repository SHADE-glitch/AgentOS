        ## Verified ground truth in code


        `InterviewStateStore.java`:


        - `TTL_HOURS = 24`; every write is `var.set(json, TTL_HOURS, TimeUnit.HOURS)`
        (line 51). Because **every** write calls `set(key, value, ttl)`, Redis **resets
        the timer on each write** — this is a *sliding* 24h idle window, **not** a
        "24h from creation" fixed lifetime.

