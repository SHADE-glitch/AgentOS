    output:
      agent: prompt-engineer
      status: completed
      summary: '# Interview Session Runtime State: Redis Fixed TTL Expiry vs DB Validity
        — Continuation Break Analysis


        **Team:** team-18087af2 | **Role:** Database Engineer (prompt-engineer focus)
        | **Type:** Debug '
      output: "# Interview Session Runtime State: Redis Fixed TTL Expiry vs DB Validity\
        \ — Continuation Break Analysis\n\n**Team:** team-18087af2 | **Role:** Database\
        \ Engineer (prompt-engineer focus) | **Type:** Debug / Support Contribution\n\
        \n> **Note on Hypotheses:** `H-467-STATESTORE-WRITE-----REDIS----`, `H-023`\
        \ to `H-027` (InterviewStateStore.java:34-51) are **UNVALIDATED** (`success_rate=0.50`,\
        \ `confidence=low`). Do not treat as established pattern. Verification steps\
        \ included below.\n\n---\n\n### 1. Executive Summary\n\nInterview session\
        \ runtime state is dual-homed: **persistent state in DB (source of truth for\
        \ session metadata)** and **ephemeral runtime state in Redis (hot state: current\
        \ question, transcript buffer, LLM context, turn counter, timer)**. With a\
        \ **fixed TTL** (e.g., `SET key value EX 1800`), the Redis key can silently\
        \ expire while the DB row (`status=IN_PROGRESS`) remains valid. Any continuation\
        \ request that does `GET` from Redis and assumes presence will break — returning\
        \ `null` / `404`, forced restart, or corrupted context — without an explicit\
        \ error that the TTL was the cause.\n\nThis is **expected Redis behavior**,\
        \ not a Redis bug. It is a design mismatch: **fixed expiry != session lifetime**.\n\
        \n### 2. Architecture Context\n\n```\nClient -> API Gateway -> InterviewService\
        \ -> InterviewStateStore\n                                          |-> DB\
        \ (PostgreSQL/MySQL): interview_sessions (id, user_id, status, created_at,\
        \ metadata) - NO TTL, durable\n                                          `->\
        \ Redis (StateStore): interview:session:{id} -> JSON {currentStep, history,\
        \ contextWindow, expiresAt} - TTL 30-60min, volatile\n```\n\nTypical anti-pattern\
        \ observed in `InterviewStateStore.java:34-44`:\n```java\n// H-023/H-027 area\
        \ - UNVALIDATED, verify in repo\nredisTemplate.opsForValue().set(key, state,\
        \ 30, TimeUnit.MINUTES); // fixed TTL at write time only\n```\nAnd read without\
        \ TTL refresh:\n```java\n// H-024/H-025 area - UNVALIDATED\nInterviewState\
        \ state = (InterviewState) redisTemplate.opsForValue().get(key);\nif (state\
        \ == null) throw new SessionNotFoundException(); // silent break here\n```\n\
        \nDB check passes (`SELECT * FROM interview_session WHERE id=?` returns row),\
        \ Redis check fails — divergence.\n\n### 3. When Does Expiration Happen?\n\
        \nFixed TTL expires deterministically `write_time + TTL` regardless of activity.\n\
        \n| Scenario | DB Valid? | Redis Valid? | Breaks? |\n|---|---|---|---|\n|\
        \ User pauses 5 min, TTL=30min, returns | Yes | Yes | No |\n| User pauses\
        \ 35 min, TTL=30min, returns | Yes | **Expired** | **Yes** |\n| Long interview\
        \ > TTL (e.g., 60min interview, 30min TTL) without refresh | Yes | Expired\
        \ mid-interview | Yes |\n| LLM processing stall / queue delay > TTL | Yes\
        \ | Expired | Yes |\n| Redis eviction / restart (if `maxmemory-policy` allkeys-lru)\
        \ | Yes | Lost | Yes |\n\n**Key property:** `TTL` is not tied to `interview_sessions.updated_at`\
        \ or heartbeat. No `EXPIRE` on `GET` means idle time kills the key even if\
        \ the HTTP session or DB transaction is still open.\n\n### 4. Why Continuation\
        \ Breaks — Root Cause\n\n1.  **No Cache-Aside Fallback:** `StateStore` is\
        \ used as **primary store** for runtime, not as cache. Code path:\n    `getState()\
        \ -> redis.get() -> if null -> fail` instead of `-> reconstruct from DB +\
        \ replay`.\n    Location to verify: `InterviewStateStore.java:36-38`, `48-51`.\n\
        \n2.  **Silent Failure:** Redis `GET` on expired key returns `nil`, indistinguishable\
        \ from \"never existed\". No exception from Redis, so unless application logs\
        \ `key miss + db hit` as warning, it is silent. Client sees `409 Session Expired`\
        \ or `500 null pointer`, not `Redis TTL expired`.\n\n3.  **State Loss is Non-Reconstructable\
        \ if Write-Behind:** If incremental turns are only appended to Redis and flushed\
        \ to DB only on completion (`H-467` pattern: `statestore-write-----redis----`),\
        \ expiry = data loss. History before expiry is gone if not persisted. Continuation\
        \ cannot rebuild contextWindow.\n\n4.  **Fixed vs Sliding TTL Mismatch:**\
        \ User expectation is **sliding session** (expires after N idle minutes).\
        \ Implementation is **absolute** (expires N minutes after start/last write).\
        \ Long but active sessions die mid-way.\n\n### 5. Verification Steps (Do Not\
        \ Trust Hypotheses Blindly)\n\nBefore changing TTL, verify actual code:\n\n\
        ```bash\n# 1. Locate store\ngrep -rn \"InterviewStateStore\\|StateStore\\\
        |redisTemplate.*set.*TTL\\|EX.*TimeUnit\" --include=\"*.java\"\n\n# 2. Check\
        \ TTL value and where set\ngrep -n \"set.*TimeUnit\\|expire\\|TTL\\|RedisHash.*timeToLive\"\
        \ src/main/java/.../InterviewStateStore.java\n\n# 3. Check read path - does\
        \ it refresh?\ngrep -n \"get.*key\\|expire\\|persist\" src/main/java/.../InterviewStateStore.java\n\
        \n# 4. Runtime verification: Check live TTL drift\nredis-cli --scan --pattern\
        \ \"interview:session:*\" | xargs -I {} redis-cli TTL {}\n# Compare to SELECT\
        \ id, status, updated_at, now()-updated_at as age FROM interview_sessions\
        \ WHERE status='IN_PROGRESS';\n\n# 5. Inject expiry and test continuation\n\
        redis-cli SET \"interview:session:test-123\" '{\"step\":2}' EX 5\n# wait 6s,\
        \ then curl continuation endpoint -> observe failure mode\n```\n\n**Validation\
        \ criteria for H-023..H-027:** If `GET` returns null and no `EXPIRE` is called\
        \ on read/write, hypothesis of \"write-once fixed TTL\" is confirmed. If `EXPIRE`\
        \ is called on every `get()`, hypothesis is rejected.\n\n### 6. Code Examples\
        \ & Fixes\n\n#### A. Reproduce Silent Break (Current Behavior)\n```java\n\
        // InterviewStateStore.java:34-39 - current\npublic void save(String sessionId,\
        \ InterviewState state) {\n    String key = \"interview:session:\" + sessionId;\n\
        \    // BUG: fixed TTL, never refreshed\n    redisTemplate.opsForValue().set(key,\
        \ state, Duration.ofMinutes(30));\n}\npublic InterviewState load(String sessionId)\
        \ {\n    String key = \"interview:session:\" + sessionId;\n    InterviewState\
        \ state = (InterviewState) redisTemplate.opsForValue().get(key);\n    // DB\
        \ still has row, but state is null\n    if (state == null) throw new IllegalStateException(\"\
        session not found in cache\");\n    return state;\n}\n```\n\n#### B. Fix 1:\
        \ Sliding TTL (Refresh on Access) — Minimal Change\n```java\npublic InterviewState\
        \ load(String sessionId) {\n    String key = \"interview:session:\" + sessionId;\n\
        \    InterviewState state = (InterviewState) redisTemplate.opsForValue().get(key);\n\
        \    if (state == null) {\n        // Attempt rehydration from DB before failing\n\
        \        state = rehydrateFromDb(sessionId); // SELECT transcript, step FROM\
        \ interview_sessions\n        if (state != null) {\n            redisTemplate.opsForValue().set(key,\
        \ state, Duration.ofMinutes(30));\n            log.warn(\"redis_miss_rehydrated\
        \ session={}\", sessionId);\n            return state;\n        }\n      \
        \  throw new SessionExpiredException(sessionId, \"Redis TTL expired, no rehydration\
        \ possible\");\n    }\n    // extend TTL on every successful read = sliding\
        \ window\n    redisTemplate.expire(key, Duration.ofMinutes(30));\n    return\
        \ state;\n}\npublic void save(String sessionId, InterviewState state) {\n\
        \    String key = \"interview:session:\" + sessionId;\n    redisTemplate.opsForValue().set(key,\
        \ state, Duration.ofMinutes(30));\n    // also persist incremental checkpoint\
        \ to DB for recovery\n    db.updateInterviewCheckpoint(sessionId, state.getHistorySnapshot());\n\
        }\n```\n\n#### C. Fix 2: Configuration — Redis + Spring\n```yaml\n# application.yml\n\
        spring:\n  data:\n    redis:\n      timeout: 2s\napp:\n  interview:\n    redis-ttl:\
        \ 45m          # increase from 30m, but make sliding\n    enable-sliding-ttl:\
        \ true\n    checkpoint-interval: 5  # persist to DB every N turns\n```\n\n\
        ```java\n@Configuration\npublic class RedisConfig {\n    @Bean\n    public\
        \ RedisTemplate<String, InterviewState> redisTemplate(RedisConnectionFactory\
        \ cf) {\n        RedisTemplate<String, InterviewState> t = new RedisTemplate<>();\n\
        \        t.setConnectionFactory(cf);\n        t.setKeySerializer(new StringRedisSerializer());\n\
        \        t.setValueSerializer(new GenericJackson2JsonRedisSerializer());\n\
        \        return t;\n    }\n}\n```\n\n#### D. Fix 3: Write-Through + Expiry\
        \ Notification (Robust)\n```java\n// Listen for expiry to checkpoint proactively\n\
        @Component\npublic class RedisExpiryListener implements MessageListener {\n\
        \    @Override\n    public void onMessage(Message message, byte[] pattern)\
        \ {\n        String expiredKey = new String(message.getBody());\n        if\
        \ (expiredKey.startsWith(\"interview:session:\")) {\n            String sessionId\
        \ = expiredKey.substring(\"interview:session:\".length());\n            log.warn(\"\
        interview_redis_expired session={} db_status_still_valid\", sessionId);\n\
        \            metrics.increment(\"interview.redis.expired\");\n           \
        \ // Optional: mark DB session as EXPIRED_NEEDS_REHYDRATION\n        }\n \
        \   }\n}\n// redis.conf: notify-keyspace-events Ex\n```\n\n### 7. Configuration\
        \ Recommendations for Lead Review\n\n1.  **Do not use fixed TTL alone.** Change\
        \ to **sliding TTL**: `EXPIRE` on every `GET` and `SET`. TTL = idle timeout\
        \ (e.g., 30 min), not absolute session lifetime.\n2.  **Set TTL > maximum\
        \ realistic interview duration + buffer.** If interview can be 60 min, TTL\
        \ must be `90m` if not sliding; if sliding, `30m idle` is fine but enforce\
        \ heartbeat from frontend (`POST /heartbeat` every 10m calls `EXPIRE`).\n\
        3.  **Require DB checkpointing:** Async write to `interview_checkpoints` table\
        \ every N turns or every 2 minutes. Redis is cache, not store of record. `H-467`\
        \ pattern violates durability.\n4.  **Add rehydration path:** On cache miss\
        \ but DB `IN_PROGRESS`, rebuild Redis from DB snapshot + return `CONTINUE_WITH_REHYDRATION`\
        \ not error. Log as warning.\n5.  **Client handling:** Return `410 Gone +\
        \ code: SESSION_EXPIRED_REHYDRATABLE` instead of `500`. Frontend can prompt\
        \ \"Resuming from last checkpoint\".\n6.  **Monitoring:** Alert on `rate(redis_miss_rehydrated)\
        \ > threshold` and `TTL < 5min for active sessions`. Dashboard: `DB active\
        \ sessions vs Redis keys count` divergence = leak.\n7.  **Redis persistence:**\
        \ Ensure `maxmemory-policy noeviction` for this DB index, separate Redis DB\
        \ for sessions. Do not co-locate volatile cache keys.\n\n### 8. Decision Matrix\n\
        \n| Option | Durability | Complexity | Recommended When |\n|---|---|---|---|\n\
        | Sliding TTL + rehydrate | Medium | Low | Quick fix, interviews < 2h |\n\
        | Write-through to DB + Redis as cache | High | Medium | **Preferred** for\
        \ production |\n| Externalize to DB only (remove Redis) | Highest | Low |\
        \ If Redis not needed for latency |\n| Redis persistent + Redisson `RMapCache`\
        \ with `maxIdle` | Medium | Low | If already on Redisson |\n\n**Primary recommendation:**\
        \ Implement sliding TTL immediately (1-line `expire` fix) + add DB checkpoint\
        \ + rehydration. This closes silent break with minimal risk. Follow with write-through\
        \ refactor.\n\n---\n\n**Files to review next:** `InterviewStateStore.java:34-39`\
        \ (save path), `:48-51` (load path), `RedisConfig`, `interview_sessions` schema.\
        \ Attach `TTL` metrics after deploy to validate fix."
