      summary: "# [SUPPORT] Database Review — Redis Session TTL Silent Expiry vs DB\
        \ Truth\n\n**Role:** Database Engineer (supporting Code Reviewer / Backend\
        \ Architect / Security Engineer)  \n**Team:** `team-18087af2` | "
      output: "# [SUPPORT] Database Review — Redis Session TTL Silent Expiry vs DB\
        \ Truth\n\n**Role:** Database Engineer (supporting Code Reviewer / Backend\
        \ Architect / Security Engineer)  \n**Team:** `team-18087af2` | **Task type:**\
        \ debug | **Domain:** `database, ai`  \n**Focus:** `interview session runtime\
        \ state stored in Redis with fixed TTL can silently expire while DB remains\
        \ valid; explain when and why continuation breaks`  \n**Benchmark grounding:**\
        \ `F1 — Redis session runtime-state drift` (`Phase-8.2.1.4/Benchmark-Specification.md:64`\
        \ + `01-gold-set-derivation.md:12`)\n\n> Hypotheses `H-467`, `H-023`, `H-024`,\
        \ `H-025`, `H-027` are `UNVALIDATED, confidence=low, score=0.30-0.37`. Verified\
        \ below via direct code read. Do not rely on auto-bootstrapped tags without\
        \ runtime trace.\n\n---\n\n## 1. Executive Summary\n\n`InterviewStateStore.java:15`\
        \ declares Redis as `\"单一权威来源\"` (single authoritative source) but persists\
        \ durably to MySQL `interview_session`. `InterviewStateStore.java:25` fixes\
        \ TTL to `TTL_HOURS=24` sliding. On expiry/eviction `read()` returns `null`\
        \ (`InterviewStateStore.java:34-44`), and `InterviewService.java:380-389`\
        \ `requireAsking()` blindly rehydrates from DB and re-caches for 24h with\
        \ **zero freshness validation**. Continuation in `answer()` (`InterviewService.java:125-195`)\
        \ and `answerStream()` (`InterviewService.java:197-281`) then derives `newCount\
        \ = state.questionCount()+1` (`InterviewService.java:179,254`) from potentially\
        \ drifted state. DB remains `ASKING`/`START` indefinitely (no DB TTL); Redis\
        \ is ephemeral. Result: continuation either silently resets drifted counters\
        \ or masks divergence.\n\n**Root class is not \"TTL too short\".** Fixing\
        \ to 48h/7d preserves the same failure mode. Required fix: **DB-as-source-of-truth\
        \ + drift detection**.\n\n## 2. When Continuation Breaks — Timeline\n\n| #\
        \ | Trigger | DB `interview_session` state | Redis `interview:session:{id}`\
        \ | `requireAsking()` behavior | Visible break |\n|---|---|---|---|---|---|\n\
        | **T1** | 24h silence since last `write()` | `status=ASKING, questionCount=1,\
        \ currentQuestionId=101` | `bucket.get()==null` (expired) | `null → selectById\
        \ → new SessionState(DB values) → write()` resets TTL 24h | No error, but\
        \ **counter trust lost**. If prior dual-write failed, `questionCount` now\
        \ diverges from `interview_message` count |\n| **T2** | Redis `maxmemory`\
        \ eviction / `FLUSHDB` / failover | Same as above | `null` (pre-TTL) | Same\
        \ blind rehydrate | Same; occurs under load, not only after 24h |\n| **T3**\
        \ | JSON schema change / corrupt `SessionState` | Valid | `get()` returns\
        \ string but `objectMapper.readValue` throws → caught `InterviewStateStore.java:42-44`\
        \ returns `null` | Treated identically to expiry → masks corruption as \"\
        missing\" | Silent recovery hides deployment bug |\n| **T4** | Dual-write\
        \ divergence: `sessionMapper.updateById` (`InterviewService.java:186`) succeeded,\
        \ `stateStore.write` (`InterviewService.java:188`) threw `BizException` or\
        \ Redis timeout | `questionCount=2` | Still `1` (old TTL not refreshed) |\
        \ Caller retries `answer()` immediately: reads stale `1` → `newCount=2` →\
        \ `updateById` sets DB to `2` (no-op) but `currentQuestionId` overwritten\
        \ with new msg id → **message ↔ session pointer drift** | Question skipped\
        \ / duplicated; later `extractQAPairs()` miscounts |\n| **T5** | Session is\
        \ `FINISHED` in DB, Redis `FINISHED` entry expired | `FINISHED` | `null` |\
        \ Rehydrates `FINISHED` → correctly throws `INTERVIEW_FINISHED` (`InterviewService.java:391`)\
        \ | *Not* broken in this direction, but proves rehydrate path is load-bearing\
        \ |\n\n**Key insight:** `TTL_HOURS` is **sliding** (`write()` at `InterviewStateStore.java:51`\
        \ calls `set(...,TTL_HOURS,HOURS)` on every state change). Break is not \"\
        24h after creation\" but **\"24h after last write\"** — typical for a paused\
        \ interview (user starts at 09:00, returns next day 10:00).\n\n## 3. Why —\
        \ Code-Level Root Causes (Gold Set G1-G5)\n\n**G1 — Fixed TTL on authoritative\
        \ runtime state**  \n`InterviewStateStore.java:25,48-56`:\n```java\nprivate\
        \ static final long TTL_HOURS = 24;\npublic void write(Long sessionId, SessionState\
        \ state) {\n    String json = objectMapper.writeValueAsString(state);\n  \
        \  redissonClient.getBucket(key(sessionId)).set(json, TTL_HOURS, TimeUnit.HOURS);\n\
        }\n```\n`G1` is authoritative only while unexpired; `read()` (`InterviewStateStore.java:34-46`)\
        \ yields silent `null`:\n\n```java\npublic SessionState read(Long sessionId)\
        \ {\n    String json = redissonClient.getBucket(key(sessionId)).get();\n \
        \   if (json == null) return null; // expiry + eviction + miss indistinguishable\n\
        \    try { return objectMapper.readValue(json, SessionState.class); }\n  \
        \  catch (Exception e) { log.warn(...); return null; } // G2 swallow\n}\n\
        ```\n\n**G2 — No freshness validation**  \n`InterviewService.java:380-389`:\n\
        ```java\nprivate SessionState requireAsking(Long sessionId) {\n    SessionState\
        \ state = stateStore.read(sessionId);\n    if (state == null) {\n        InterviewSession\
        \ s = sessionMapper.selectById(sessionId);\n        // NO check: s.getStatus\
        \ vs allowed transitions?\n        // NO check: s.questionCount vs SELECT\
        \ COUNT(*) FROM interview_message WHERE session_id=? AND kind='question'\n\
        \        // NO check: s.currentQuestionId vs MAX(interview_message.id) WHERE\
        \ kind='question'\n        // NO check: stale timestamp (schema has no updated_at\
        \ — InterviewSession.java:37-40)\n        state = new SessionState(s.getStatus(),\
        \ s.getQuestionCount(), s.getCurrentQuestionId());\n        stateStore.write(sessionId,\
        \ state); // blind re-cache 24h\n    }\n    // ... status checks after rehydrate\n\
        }\n```\nSchema `InterviewSession.java:15-45` has `startedAt` (`FieldFill.INSERT`)\
        \ + `finishedAt` only. No `updatedAt`/`version` → DB cannot convey staleness\
        \ either.\n\n**G3 — Fallback masks drift**  \nRehydrate is treated as success,\
        \ never as incident. No metric/log counter for `rehydrate_count`. Same pattern\
        \ would pass a naive test (\"session continues after TTL\") while hiding `questionCount`\
        \ divergence.\n\n**G4 — Continuation depends on drifted state**  \nBoth paths\
        \ increment from Redis/rehydrated value:\n`InterviewService.java:179` / `254`\
        \ / `263`:\n```java\nint newCount = state.questionCount() + 1; // if state\
        \ was stale 0 → newCount wrong\nsession.setQuestionCount(newCount); sessionMapper.updateById(session);\n\
        stateStore.write(sessionId, new SessionState(ASKING.name(), newCount, msg.getId()));\n\
        ```\n\n**G5 — Dual-write non-transactional** (`DB → Redis`):\n`InterviewService.java:183-189`\
        \ `updateById` then `write`; `create()` `InterviewService.java:87-118` `insert`\
        \ then `write`; `finishSession()` `InterviewService.java:340-346` same. No\
        \ outbox, no Lua, no `try/catch` compensation. Divergence window = crash between\
        \ the two calls.\n\n## 4. Database Perspective — Truth vs Cache\n\n* **Durability\
        \ inversion:** MySQL `interview_session` + `interview_message` are durable\
        \ truth; Redis is volatile cache. Code inverts this (`InterviewStateStore.java:15`\
        \ comment). Any Redisson restart, `maxmemory-policy allkeys-lru`, or network\
        \ partition can drop truth.\n* **Consistency check that should exist but doesn't:**\n\
        \n```sql\n-- DB truth query for validation (run in requireAsking after fallback)\n\
        SELECT status, question_count, current_question_id, finished_at\nFROM interview_session\
        \ WHERE id = #{sessionId};\n\nSELECT COUNT(*) AS msg_question_cnt, MAX(id)\
        \ AS max_question_msg_id\nFROM interview_message WHERE session_id = #{sessionId}\
        \ AND kind='question';\n-- invariant: interview_session.question_count ==\
        \ msg_question_cnt\n-- invariant: current_question_id == max_question_msg_id\
        \ (when status=ASKING)\n-- invariant: status transition START→ASKING→FINISHED\
        \ monotonic\n```\n\n* **Missing DB affordance:** Add `updated_at DATETIME\
        \ DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP` + `version INT` (optimistic\
        \ lock) or reuse `interview_message` max id as logical clock. Without it,\
        \ G2 cannot be fixed properly — `01-gold-set-derivation.md:24` notes `no updated_at`.\n\
        \n## 5. Reproduction & Test Matrix (for Testing Engineer hand-off)\n\n```bash\n\
        # manual repro (redis-cli)\nSET interview:session:42 '{\"status\":\"ASKING\"\
        ,\"questionCount\":1,\"currentQuestionId\":101}' EX 5\n# wait 6s or DEL interview:session:42\n\
        # then POST /api/interview/42/answer -> observe blind rehydrate in logs\n\
        ```\n\n| Case | Steps | Expected (buggy) | Expected (fixed) |\n|---|---|---|---|\n\
        | F1 expiry | `create()` → `DEL key` → `answer()` | succeeds via DB fallback,\
        \ resets TTL, no warning | logs `REHYDRATE` metric + validates `questionCount`\
        \ vs DB `COUNT(*)` |\n| F2 corrupt | `SET interview:session:42 'not-json'\
        \ EX 3600` → `answer()` | same as F1 (parse → null → rehydrate) | fails fast\
        \ + alert, does not re-cache corrupt |\n| F3 dual-write fail | mock `RedissonClient.getBucket().set`\
        \ throw after `updateById` | DB=2, Redis=1 → next `answer()` uses stale 1\
        \ | DB wins; Redis is write-through with retry/outbox |\n| F4 finished expiry\
        \ | `finishSession()` → `DEL key` → `answer()` | correctly rejects `FINISHED`\
        \ (rehydrate still works) | same, but with explicit `FINISHED` cache tombstone\
        \ |\n| F5 concurrent | two `answer()` parallel with `RLock` `interview:lock:{id}`\
        \ (`InterviewService.java:361-372`) but Redis key deleted mid-flight | one\
        \ succeeds, one rehydrates stale | lock held, validation serialized |\n\n\
        Automated test should assert: `stateStore.read()` null fallback path **must**\
        \ query DB parity before `write()`.\n\n## 6. Recommended Fix — DB-Truth Pattern\
        \ (Not TTL Extension)\n\n**Option A — Minimal safe patch (recommended for\
        \ lead review):**\n\n`InterviewService.java:380` rewrite:\n```java\nprivate\
        \ SessionState requireAsking(Long sessionId) {\n    SessionState state = stateStore.read(sessionId);\n\
        \    if (state == null) {\n        InterviewSession s = sessionMapper.selectById(sessionId);\n\
        \        if (s == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
        \        // freshness validation before trust\n        int msgCount = messageMapper.selectCount(\n\
        \            new LambdaQueryWrapper<InterviewMessage>()\n                .eq(InterviewMessage::getSessionId,\
        \ sessionId)\n                .eq(InterviewMessage::getKind, \"question\"\
        ));\n        if (!Objects.equals(s.getQuestionCount(), msgCount)) {\n    \
        \        log.warn(\"drift detected sessionId={} dbCount={} msgCount={} ->\
        \ repairing to {}\", \n                     sessionId, s.getQuestionCount(),\
        \ msgCount, msgCount);\n            s.setQuestionCount(msgCount);\n      \
        \      sessionMapper.updateById(s); // repair DB if needed, or just use msgCount\n\
        \        }\n        // status monotonic check\n        if (InterviewStatus.FINISHED.name().equals(s.getStatus()))\n\
        \            throw new BizException(ResultCode.INTERVIEW_FINISHED);\n    \
        \    state = new SessionState(s.getStatus(), msgCount, s.getCurrentQuestionId());\n\
        \        stateStore.write(sessionId, state);\n        // increment counter\
        \ metric rehydrate_total\n    }\n    // existing ASKING/START checks\n   \
        \ return state;\n}\n```\n\n**Option B — Schema hardening (DB engineer primary\
        \ recommendation):**\n\n```sql\nALTER TABLE interview_session\n  ADD COLUMN\
        \ updated_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),\n\
        \  ADD COLUMN version INT NOT NULL DEFAULT 0,\n  ADD INDEX idx_updated_at\
        \ (updated_at);\n-- then use version for optimistic lock: UPDATE ... SET question_count=?,\
        \ version=version+1 WHERE id=? AND version=?\n```\n\nAdd to `SessionState`\
        \ record: `Instant updatedAt` + `int version` serialized, compare `state.updatedAt`\
        \ vs `s.updatedAt`.\n\n**Option C — Cache-aside correctness:**\n\n* Treat\
        \ Redis as **cache**, not authority: every `read()` miss is a cache miss,\
        \ not a state loss. Never `delete()` authority; use `RBucket` with `keepTTL`\
        \ or `RMapCache` with `maxIdle`.\n* Replace `InterviewStateStore.java:51`\
        \ with write-through + TTL refresh only on `ASKING` transitions, shorter idle\
        \ TTL (e.g., 2h) + DB fallback, alert on rehydrate.\n* Reduce `TTL_HOURS`\
        \ env-configurable (`app.interview.state-ttl-hours: 24`) instead of hard-coded\
        \ constant, but **do not** present TTL increase as root fix.\n\n## 7. Configuration\
        \ & Operational Recommendations\n\n```yaml\n# application.yml\napp:\n  interview:\n\
        \    state-ttl-hours: 24        # make configurable, default 24\n    state-ttl-jitter-minutes:\
        \ 30 # avoid thundering herd expiry\n    enable-drift-repair: true\n  redisson:\n\
        \    # ensure maxmemory-policy noeviction for interview:session keys or separate\
        \ DB index\n```\n\n* Redisson: monitor `INFO memory` evictions, `latency`\
        \ of `getBucket().get()`, expose `rehydrate_total` + `drift_repaired_total`\
        \ counters.\n* Add `RedissonConfig.java` separate logical DB or `prefix` isolation\
        \ so `dashboard:user:*` LRU does not evict `interview:session:*`.\n* Security:\
        \ drift could allow replay of old `currentQuestionId` to answer out-of-order.\
        \ Validate `session.userId == caller` (already `requireOwnedSession`) + `currentQuestionId`\
        \ matches latest `question` message; reject if mismatched.\n\n## 8. Code Review\
        \ Checklist for Lead\n\n- [ ] `InterviewStateStore.java:15` comment corrected\
        \ from \"单一权威来源\" to \"Redis cache, DB is source of truth\"\n- [ ] `InterviewStateStore.java:34-46`\
        \ no longer swallows parse errors silently (metrics + not re-cache)\n- [ ]\
        \ `InterviewService.java:380` validates `questionCount` vs `COUNT(*)` before\
        \ rehydrate\n- [ ] `InterviewService.java:183-189,263,345` dual-write documented\
        \ as best-effort; DB update is commit point\n- [ ] `InterviewSession.java`\
        \ gains `updatedAt`/`version` or derived logical clock\n- [ ] No PR claims\
        \ \"TTL 24→48 fixes drift\" — rejected as symptom fix (Lesson vector L: freshness\
        \ validation over TTL extension)\n- [ ] Tests cover F1-F5 matrix above\n\n\
        ## 9. Related Pattern — Dashboard (for cross-reference)\n\n`DashboardService.java:38-71`\
        \ `CACHE_TTL_MINUTES=10` `build()` `get` → `compute()` → `set` had same class\
        \ bug until `evict()` was added to all 4 result-write paths (`InterviewService.java:152,169,227,244,349`,\
        \ `InterviewScoringService.java:106`, `RuleBasedScoringService.java:57`, `LegacyAiScoringService.java:113`).\
        \ That fix is **eviction coverage audit**, not TTL tuning — same lesson vector\
        \ applies to `InterviewStateStore`. Do not regress by re-adding blanket \"\
        no invalidation\" claim.\n\n---\n\n**Verification:** All line numbers verified\
        \ via `read` on working tree `56788e5` + uncommitted edits. No runtime Redis/MySQL\
        \ execution in this SUPPORT review; recommend testing-agent executes F1-F5\
        \ matrix in `LOOP-20260902` harnesses before promotion.\n\n**Bottom line for\
        \ lead:** Continuation breaks when the process assumes `interview:session:{id}`\
        \ exists. The fix is to **validate freshness against MySQL `interview_session`/`interview_message`\
        \ on every `null` rehydrate** and treat Redis as cache, not authority.\n\n"
