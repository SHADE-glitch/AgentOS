        # Database Engineer Review — Redis TTL Session State Drift & Continuation
        Break


        **Scope:** `InterviewStateStore.java` + `InterviewService.java` (answer/answerStream/requireAsking)
        + Redis deployment config.

        **Verdict:** The hypotheses (authority inversion, `read()`→null on miss, fixed
        24h TTL refreshed only on write) are **confirmed by source**. The single-request
        continuation is *masked* by the DB read-repair, so the failure is genuinely
        **silent** and only manifests under specific concurrency/eviction/timing windows.
        Full detail below.


        ## 1. When does Redis expire while the DB remains valid?


        The DB never expires — `interview_session` is a durable MySQL row (created
        at `InterviewService.java:87`). Redis can drop the key under exactly these
        conditions:


        | # | Vector | Trigger | Code / Config |

        |---|--------|---------|----------------|

        | A | **Fixed-TTL idle expiry** | `read()` **never** refreshes TTL; only `write()`
        resets it to 24h (`InterviewStateStore.java:48-51`). So expiry happens **exactly
        at 24h of *inactivity*** (no `answer`/`answerStream`/`create` write). | `InterviewStateStore.java:25`
        `TTL_HOURS=24`; `:51` `.set(..., TTL_HOURS, HOURS)`; `:34-39` read → null
        |

        | B | **Eviction under memory pressure** | If an operator sets `maxmemory`
        + `allkeys-lru`/`allkeys-random` (not set today, docker-compose.yml:24-35
        has no policy), a *still-active* session key can be evicted **silently at
        any time**, long before 24h. | n/a (default `noeviction`, `maxmemory 0`) —
        a latent config risk |

        | C | **Unreadable value** | Corrupt/undeserializable JSON is swallowed and
        returned as `null` (`:42-44`), indistinguishable from expiry. | `read()` conflates
        "missing", "corrupt", "never-existed" |

        | D | **Redis restart/RDB loss** | If persistence is off/none (stock `redis:7-alpine`,
        no `appendonly` in compose), a restart wipes state while MySQL holds the row.
        | docker-compose.yml:24-35 |


        ## 2. Why continuation breaks — the mechanics


        The root cause is a **durable/volatile authority inversion** declared at `InterviewStateStore.java:15`:
        Redis is the "单一权威来源" (single authoritative source) of the runtime state machine,
        while the durable DB is demoted to a fallback. Continuation therefore depends
        on a volatile artifact.


        **Step-by-step continuation path** (`answer()` → `requireAsking()`):

        1. `requireAsking(sessionId)` reads Redis (line 381).

        2. On `null`, it **silently read-repairs**: `selectById(sessionId)` from DB
        and re-writes Redis — **without any log, freshness check, or branch on *why*
        it was null** (lines 380-399).

        3. The caller then advances `questionCount = state.questionCount() + 1` and
        writes DB **first** (lines 186, 261, 344), Redis **last** (188, 263, 345)
        — a **non-transactional dual-write**.


        Continuation genuinely breaks because of the combination of:


        **Break 1 — Lost-update / state-regression on the re-seed (no versioning).**

        `SessionState(status, questionCount, currentQuestionId)` carries **no epoch/version/timestamp**.
        The read-repair is therefore *last-writer-wins across two independent stores
        with no ordering guarantee*. If DB row and Redis diverged (dual-write is not
        atomic; a crash between line 186 and 188 leaves DB ahead, or a stale re-seed
        can overwrite a newer Redis value), the re-seed deterministically regresses
        `questionCount`/`status` → skipped/repeated question, or an `ASKING` state
        re-animated over a `FINISHED` one → user answers a finished interview.


        **Break 2 — Multi-replica: the lock lives in the same volatile store (strongest
        case).**

        The distributing lock `interview:lock:{id}` (`InterviewService.java:362`)
        uses the **same `RedissonClient`** as the state bucket (line 54). Under vector
        B/D both the state *and* the lock key vanish together. Two replicas that both
        see a miss will both re-seed **and both acquire the (now-free) lock**, then
        both increment `questionCount` from the same base → a **double answer / skipped
        question**, or an illegal transition — with **no way for the state machine
        to reject it**, because nothing compares-and-sets.


        **Break 3 — "Corrupt == null" collides with "expired == null".**

        Because `read()` collapses three distinct conditions to `null` (lines 37-38,
        42-44), the system cannot distinguish *recoverable expiry* (safe to re-seed)
        from *durable corruption* (should alert). Both re-seed, so a valid-but-newer
        Redis value may be forcibly overwritten by an older DB snapshot — producing
        the silent drift the task describes.


        **Why it is "silent":** the re-seed at lines 382-390 compiles to `WARN`-level
        nothing; no metric, no distinct log, no caller-visible signal. The interview
        "continues" from DB truth on the happy path (that''s *why* it''s easy to miss),
        but every re-seed is an unreported divergence checkpoint where the bugs above
        can enter.


        ## 3. Direct answers


        - **When?** (1) guaranteed miss at **>24h inactivity** (TTL refreshed only
        on write, never on read); (2) **any time** under an evicting `maxmemory-policy`
        or after a non-persistent Redis restart, even for active sessions; (3) on
        a corrupt value treated as null. In all cases the MySQL row survives — the
        store "looks valid," but the runtime state is gone.

        - **Why continuation breaks?** Continuation read first from a volatile source
        declared authoritative; the fallback is a **silent, unversioned, non-compare-and-set
        read-repair** over a **non-transactional dual-write**, and the serializing
        lock shares the same evictable store — so expiry can (a) race it, causing
        `questionCount`/status lost-updates and state regression, and (b) let two
        replicas run concurrently for a true session corruption.


        ## 4. Recommendations


        1. **Invert authority — DB is truth, Redis is a disposable cache.** Kill the
        "单一权威来源" comment; derive the transition from the DB row (status/questionCount/currentQuestionId
        already mirrored there) and recompute runtime state from the `interview_message`
        history, which is the true Q&A source.

        2. **Refresh TTL on read (`touch`) or drop idle-expiry.** Use `RBucket.expire`/`touch`
        inside `read()` so active sessions never idle-expire; keep a TTL only as an
        upper bound for abandoned sessions.

        3. **Add a version/epoch to `SessionState`** (e.g. `revision` bumped on each
        write into both stores). On re-seed, use a compare-and-set (`SET key val NX`
        / Redisson `trySet` or CAS) so a repair **never overwrites a fresher concurrent
        write**, and reject stale re-seeds.

        4. **Make `read()` distinguish outcomes:** return `Optional`/tri-state (MISS
        vs CORRUPT vs OK) instead of `null` for both; log distinct `WARN "…expired
        (re-seeded from DB)"` vs `ERROR "…corrupt"` and expose a drift metric so the
        failure is observable, not silent.

        5. **Separate the lock from the evictable state store**, or pin the Redis
        config to `noeviction` while sizing `maxmemory`, and enable persistence (`appendonly
        yes`) — so the serialization guarantee cannot silently disappear with the
        state keys.

        6. **Make the dual-write atomic**, or update DB and Redis inside a single
        transaction boundary with the versioned CAS, so the two stores cannot diverge
        between line 186 and 188.


        Reference: `backend/src/main/java/com/aiview/interview/service/InterviewStateStore.java:15,25,37-44,48-51`
        and `InterviewService.java:179,186-188,254,344-346,380-399`.'
