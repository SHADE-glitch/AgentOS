    output: "## Lead Agent Report — Redis Fixed-TTL Session-State Expiry vs Durable\
      \ DB\n\n**Verified against source.** I read `InterviewStateStore.java`, `InterviewService.java`\
      \ (incl. `requireAsking`/`finishSession`), `InterviewStatus.java`, `RedissonConfig.java`,\
      \ `docker-compose.yml`.\n\n### 1. The mechanism (the defect in the code)\n\n\
      The state is stored with an **absolute, write-refreshed TTL** and is declared\
      \ the authority:\n\n`backend/.../interview/service/InterviewStateStore.java:15`\n\
      ```java\n/** 面试会话运行时状态，存于 Redis，作为状态机的单一权威来源。 */\nprivate static final long\
      \ TTL_HOURS = 24;          // line 25\n...\nredissonClient.getBucket(key(sessionId)).set(json,\
      \ TTL_HOURS, TimeUnit.HOURS); // line 51\n```\n\nKey facts from the actual implementation:\n\
      - **TTL is refreshed only on `write()`, never on `read()`.** `read()` (lines\
      \ 34–46) just does `bucket.get()` — a pure lookup. So expiry is driven by `lastWrite\
      \ + 24h`, NOT by activity. This is **fixed-timeout semantics, not idle/sliding\
      \ semantics**.\n- **Redis is called the \"single source of truth\"** (line 15),\
      \ but it is evictable (TTL, restart, flush) while the matching `interview_session`\
      \ row in MySQL persists indefinitely.\n- **Dual write is non-atomic.** In `answer()`/`answerStream()`\
      \ the DB is updated first, Redis second (`InterviewService.java:186` `sessionMapper.updateById`,\
      \ then `:188` `stateStore.write`). There is no transaction spanning both.\n\
      - **`read()` conflates \"expired\" with \"corrupt\":** a JSON parse failure\
      \ returns `null` (lines 41–45), which triggers the same recovery path as an\
      \ expired key, silently discarding corrupt data.\n\n### 2. When the state silently\
      \ expires while the DB stays valid\n\nA session's Redis key vanishes in any\
      \ of these cases, yet `interview_session` still reads non-`FINISHED`:\n\n1.\
      \ **Idle longer than the remaining TTL** — user opens an interview, pauses >\
      \ (24h − time since last write), returns. Redis key is gone; DB still `ASKING`.\n\
      2. **Redis process restart or flush** — `docker-compose` (lines 24–37) runs\
      \ `redis:7-alpine` with a `redis-data` volume; container restart/failover or\
      \ `FLUSHALL` drops every key; DB unaffected. (Redis 7 default `maxmemory-policy=noeviction`,\
      \ so eviction won't drop keys under pressure, but restart/flush/failover still\
      \ will.)\n3. **Mid-interview non-atomic write gap** — process crash or Redis\
      \ write throws after the DB `updateById` but before `stateStore.write` (gap\
      \ between `:186` and `:188`): Redis now holds a *stale* value while DB is ahead.\
      \ Key may or may not be expired, but authority and DB diverge.\n\n### 3. Why\
      \ continuation breaks — genuine failure paths despite a valid DB\n\nThe design\
      \ has a mitigation: `requireAsking()` (lines 380–399) rehydrates from the DB\
      \ when Redis returns `null`. So a **bare** TTL expiry usually self-heals. The\
      \ real breaks come from the interaction of that fail-open fallback with the\
      \ authority split:\n\n**A. Terminal-state guard trusts Redis, not DB (incorrect\
      \ continuation of a finished interview).**\n`requireAsking` only rejects `FINISHED`\
      \ by reading **Redis** (`:391`). If `finishSession` wrote `FINISHED` to the\
      \ DB (line 344) but the paired Redis write (line 345) was lost — crash between\
      \ the two, or earlier Redis write failed while its key is still `ASKING` (non-null)\
      \ — then `requireAsking` sees non-null `ASKING`, the expiry fallback is skipped,\
      \ and the user keeps answering a **DB-valid `FINISHED`** session. Continuation\
      \ proceeds where it must be blocked. This is the clearest \"DB valid, continuation\
      \ breaks\" case.\n\n**B. Divergence from the non-atomic dual write is never\
      \ reconciled.**\nThe fallback fires **only when `state == null`**, never when\
      \ Redis holds a *stale-but-present* value. So if Redis lags the DB (the `:186`–`:188`\
      \ window, or a failed Redis write that left an older JSON), `answer()` does\
      \ `newCount = state.questionCount() + 1` (`:179`, `:254`) off the *stale* counter,\
      \ double-stepping the state machine vs the DB. Since `questionCount` drives\
      \ `shouldFinish` against `MAX_QUESTIONS=6` (`:148`), the interview now **finishes\
      \ early or extends past the real count**, and `currentQuestionId` points at\
      \ an already-asked question. A valid DB does not repair this because there is\
      \ no divergence check.\n\n**C. Fail-open rehydration is lossy and resurrects\
      \ stale authority.**\nOn expiry (`state == null`) the fallback snapshots only\
      \ `(status, questionCount, currentQuestionId)` from the DB and **re-writes it\
      \ as authority** (`:387–389`). If the DB itself was already stale from a prior\
      \ gap (case B), the rehydrated key re-legalizes wrong counts. Any richer runtime\
      \ state that lived only in Redis (in-flight evaluation, pending follow-up) is\
      \ dropped. It fixes visibility, not correctness.\n\n**D. `read()` treats corruption\
      \ as \"missing\"** (`:43–44`), so a malformed value silently triggers rehydration\
      \ instead of surfacing an error — masking the root cause of any of the above.\n\
      \n**Summary — when:** a session that is idle past its TTL, or a Redis restart/flush,\
      \ or a non-atomic DB↔Redis write gap, occurring on a not-yet-`FINISHED` session.\
      \ **Why:** Redis is designated the state-machine authority but is evictable,\
      \ its TTL is refreshed only on write (not on read), and the single recovery\
      \ path (`requireAsking`) only triggers on `null`, is fail-open, trusts Redis\
      \ (not DB) for the terminal check, and reconciles a lossy DB snapshot instead\
      \ of detecting divergence.\n\n### 4. Recommended fixes (concrete)\n\n1. **Make\
      \ the DB the source of truth; Redis = rebuildable cache.** Reverse the comment's\
      \ claim (line 15). With `requireAsking` already reconstructing from DB, the\
      \ \"authority\" framing is fiction. Drop Redis from terminal-state decisions.\n\
      \n2. **Guard the terminal status from the DB, not Redis** — closes break A:\n\
      ```java\nInterviewSession s = sessionMapper.selectById(sessionId);\nif (s !=\
      \ null && InterviewStatus.FINISHED.name().equals(s.getStatus())) {\n    throw\
      \ new BizException(ResultCode.INTERVIEW_FINISHED);\n}\n```\n\n3. **Refresh TTL\
      \ on read (sliding TTL)** — closes break for case 1/2, cheap under the existing\
      \ lock:\n```java\npublic SessionState read(Long sessionId) {\n    RBucket<String>\
      \ bucket = redissonClient.getBucket(key(sessionId));\n    String json = bucket.get();\n\
      \    if (json == null) return null;\n    bucket.expire(Duration.ofHours(TTL_HOURS));\
      \      // refresh-on-activity\n    ...\n}\n```\n\n4. **Reconcile from DB on\
      \ every `answer`, not just on `null`.** Compute `questionCount`/`currentQuestionId`\
      \ deterministically from the DB under the lock (from `askedQuestionIds`, like\
      \ `MAX_QUESTIONS` logic already does), rather than `state.questionCount() +\
      \ 1`, so a stale Redis value can't double-step.\n\n5. **Atomicity / write ordering.**\
      \ Write DB then Redis, and make Redis best-effort: on Redis write failure don't\
      \ throw and block the DB commit — let the read path reconcile from DB. Add an\
      \ optimistic version/token field to `SessionState` and a compare-and-set so\
      \ stale writes can't clobber newer state.\n\n6. **Make expiry a real idle deadline\
      \ with an Ops contract.** Configure TTL via `@Value` (not a hard `=24`), set\
      \ it > max expected interview duration, add a `last_activity_at` column and\
      \ a scheduled sweeper (or Redis keyspace-notification handler) to `FINISH` stale\
      \ sessions so DB and cache state agree instead of silently diverging.\n\n7.\
      \ **Surface corruption instead of failing open** — on a JSON parse failure in\
      \ `read()`, log `WARN` *and* delete/rekey so recovery is explicit, and alert\
      \ rather than silently rehydrating.\n\n**Bottom line:** with the current fallback,\
      \ a plain TTL expiry is mostly self-healing — the breakage is real only where\
      \ Redis and DB diverge and Redis is trusted over DB (terminal check), or where\
      \ a stale-but-present key survives the null-only fallback (double counting).\
      \ The fix is to demote Redis to a cache, guard terminal state from the DB, refresh\
      \ TTL on read, and derive counters from the DB under the lock.\n\n*Support roles\
      \ referenced: backend-architect (authority/atomicity review), code-reviewer\
      \ (null-only fallback + parse-as-miss), security-engineer (none directly; no\
      \ credential handling involved).*"
