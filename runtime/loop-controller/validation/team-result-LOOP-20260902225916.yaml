      output: 'I have a complete picture. Here is my Database Engineer / code-review
        analysis for lead review.


        ---


        ## Finding: Fixed-TTL Redis session state can silently expire while the DB
        row remains valid


        **Scope / artifacts reviewed**

        - `InterviewStateStore.java` — Redis TTL store (single authoritative source
        per its javadoc, line 15)

        - `InterviewService.java` — state-machine orchestration, locking, DB write
        order, recovery path (`requireAsking`)


        ### 1. The mechanism (why "fixed TTL" is the culprit)


        `InterviewStateStore.java:25` hardcodes `TTL_HOURS = 24`, and **every** write
        refreshes it:


        ```java

        private static final long TTL_HOURS = 24;                 // line 25

        // line 51

        redissonClient.getBucket(key(sessionId)).set(json, TTL_HOURS, TimeUnit.HOURS);

        ```


        This is a **sliding/refresh-on-write TTL, not an absolute deadline tied to
        session creation or DB row**. Semantics: *the key expires 24h after the last
        successful `write()`, not 24h after the session started.* The DB session row
        in MySQL is never touched by expiration — it persists indefinitely. So any
        real-time gap of **>24h between two consecutive `write()` calls** silently
        removes the key while the DB `status=ASKING`/`questionCount=N` remains valid.


        Note: Redis here runs default config (`docker-compose.yml` — no `maxmemory-policy`),
        default is `noeviction`, so the expiry is purely the TTL, not memory-pressure
        eviction. (If the cluster later sets `allkeys-lru` to cap memory, keys can
        also be evicted earlier than TTL — worth guarding against, but not the current
        failure.)


        ### 2. When continuation breaks


        The store self-heals in simple cases via the fallback in `InterviewService.requireAsking`
        (`InterviewService.java:380-399`): on a null read it re-hydrates from the
        DB and writes back. So **status-only checks usually survive expiry**. Continuation
        genuinely breaks in these cases:


        **(a) Resume after >24h idle (the primary case).** User creates the session,
        answers Q1 (last Redis write at t=0), then returns at t=25h:

        - `requireAsking` → `read()` returns null → falls back to DB. This **reconstructs**
        state but with **DB values only**: `new SessionState(s.getStatus(), s.getQuestionCount(),
        s.getCurrentQuestionId())`.

        - Any runtime-progress info that was only ever in Redis (not persisted to
        DB) is lost. Today Redis state = `{status, questionCount, currentQuestionId}`
        and these **are** mirrored to DB, so the lookup itself is recoverable — but
        only because the DB happens to carry the same 3 fields. The design intent
        (Redis as "single authoritative source", line 15) is silently violated: after
        expiry the real authority is the DB, and the two are no longer provably in
        sync.


        **(b) Expiry between DB update and Redis write — mid-transaction inconsistency.**
        `finishSession` (`InterviewService.java:340-346`) and `answer` (`:183-189`)
        update DB first, then Redis:

        ```java

        sessionMapper.updateById(session);                 // DB  -> FINISHED

        stateStore.write(... FINISHED ...);                // Redis

        ```

        The Redis key has a 24h TTL from its previous write. If that key crosses its
        TTL **between** the DB update and the Redis `write` (e.g., a slow/stalled
        write, a Redisson error, or a process restart), the DB becomes `FINISHED`
        while Redis still holds the pre-expiry/old ASKING value. The next `answer`
        then passes `requireAsking`''s status guard and processes a finished session
        (duplicate scoring/feedback). Expiry plus non-atomic two-store write is what
        turns a benign cleanup into a continuation logic error.


        **(c) Mis-sequencing on fallback when DB is ahead.** Because the fallback
        trusts DB `questionCount`, and `answer` computes `newCount = state.questionCount()
        + 1` (`:179`), any divergence between the last Redis `questionCount` and the
        DB value (e.g., a previous crash before the final Redis write) silently bases
        sequencing on whatever the DB shows — the "live" in-flight count is not preserved.


        **(d) Expiry exposing a FINISHED session incorrectly.** If the key expires
        **after** finish, recovery is fine (DB=FINISHED → `INTERVIEW_FINISHED`, correct).
        But the opposite ordering in (b) is where it actively misbehaves.


        ### 3. Concrete fixes (recommendations)


        **R1 — Use a deterministic absolute expiry derived from the DB, not a refreshed
        write-TTL.** Call `write` with the remaining time to a fixed session deadline,
        or set TTL = time until session stale threshold computed from persisted DB
        timestamps (`startedAt`), rather than constant 24h:

        ```java

        long ttlHours = Duration.between(session.getStartedAt(), sessionDeadline).toHours();

        stateStore.write(sessionId, state, ttlHours); // overload accepting explicit
        TTL

        ```


        **R2 — Do not treat Redis as "single authoritative source" (matches line 15
        comment).** Keep the DB as the state machine''s authority and Redis strictly
        as a fast-path cache. Lock the sequence so DB and Redis are committed atomically
        in intent: persist DB first, then best-effort `write` with **re-computed remaining
        TTL**; on any Redis write failure, log and continue (the DB is the fallback
        truth). This removes (b).


        **R3 — Add an explicit resume/reconcile endpoint** that re-syncs Redis from
        DB on `detail`/session-open, so an expired key is rebuilt eagerly rather than
        only on first `answer`.


        **R4 — Guard against eviction policies.** Explicit `config set maxmemory-policy
        volatile-lru` (or `noeviction`) so that only TTL''d keys are ever evicted,
        protecting non-expiring keys; or namespace-protect session keys.


        **R5 — Wrap the DB fallback with the distributed lock & a version field.**
        `requireAsking` currently re-writes outside any freshness check; add `updatedAt`/version
        to the DB session and TTL-annotate the Redis value so a stale fallback is
        rejected rather than blindly trusted:

        ```java

        state = new SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId(),
        s.getUpdatedAt());

        // only accept if Redis is absent or older than the DB row

        ```


        **Ordering fix (immediate minor):** in `finishSession`/`answer`, perform the
        Redis `write` *before* any chance the key can expire mid-call isn''t enough
        — the real requirement is that the Redis TTL always covers the DB update.
        Using R1 (remaining-until-deadline TTL) guarantees the key predates the DB
        row and thus can''t expire in the gap.


        ### 4. Verdict


        Confirmed failure mode. Severity: **medium-high**, triggered by: (a) sessions
        idle >24h, and (b) any Redis write failure/expiry in the DB→Redis commit window.
        Low-frequency but silent and produces user-visible inconsistent resumption
        or duplicate finish. Highest-value, lowest-risk fixes: **R1 (deadline-based
        TTL) + R2 (DB as authority, Redis best-effort) + R5 (version-guarded fallback)**.
        Recommend addressing before the session store gains more state fields (interleaving
        progress), which would magnify the data-loss surface on expiry.


        Note: the provided hypotheses (H-023/024/025/027/031) are flagged `UNVALIDATED`/low-confidence;
        my analysis confirms the *TTL-expiry mechanism* but I did **not** rely on
        their line-range claims — the above is grounded directly in `InterviewStateStore.java:25,51`
        and `InterviewService.java:380-399`.'
