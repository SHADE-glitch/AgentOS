      output: '# DB Engineer — Contribution: Redis Runtime State TTL Silent Expiry
        vs Durable DB


        ## 1. Verdict


        The hypotheses are confirmed by inspection. `InterviewStateStore.java` stores
        the entire runtime state machine (status / questionCount / currentQuestionId)
        in a Redis bucket with a **fixed 24h TTL** and treats Redis as the "单一权威来源"
        (`InterviewStateStore.java:15`). The DB row (`interview_session`) is durable
        but is treated as a cold fallback. Because TTL expiry returns `null`, and
        `null` is also the signal for "not written yet" and for "corrupt JSON", the
        store cannot distinguish **expired / evicted / crashed / corrupt** — so continuation
        either silently rebuilds or breaks, and the operator is never told which.


        ## 2. When the key actually disappears (not just TTL)


        All four produce an identical symptom: `read()` → `bucket.get()` returns null
        (`InterviewStateStore.java:37-38`) or parse fails (`43-44`) → **null**.


        | # | Trigger | Evidence / config |

        |---|---------|-------------------|

        | 1 | **Idle > 24h fixed TTL** — TTL is reset only on `write()` (`InterviewStateStore.java:51`).
        A user who pauses >24h between turns loses the bucket. | `TTL_HOURS=24` |

        | 2 | **Memory-pressure eviction** — Redis is `redis:7-alpine` with **no `maxmemory`
        policy configured** (`docker-compose.yml:24-32`). Under pressure default behavior
        refuses writes, but if operators later add `allkeys-lru`/`volatile-lru`, the
        bucket is evicted *before* TTL. | compose file |

        | 3 | **Redis restart / failover data loss** — no AOF (`appendfsync` unset),
        persistence relies on RDB snapshots. A restart drops keys changed since the
        last save, regardless of TTL. | compose file |

        | 4 | **Corrupt JSON** — parse failure swallowed, logs at `warn`, returns
        `null` (`InterviewStateStore.java:43-44`). Indistinguishable from expiry.
        | `read()` impl |


        ## 3. Why continuation breaks (the trust-inversion root cause)


        The design inverts persistence authority:


        - `InterviewService` treats **Redis as authoritative** (`InterviewStateStore.java:15`),
        but Redis is ephemeral.

        - Every mutation is a **non-transactional dual-write: DB first, Redis second**
        — `answer()` `sessionMapper.updateById` at `InterviewService.java:186` then
        `stateStore.write` at `188`; `create()` at `114→116`; `finishSession()` at
        `344→345`.

        - There is **no freshness/version validation** between the two stores. `requireAsking()`
        (`:380-398`) is the *only* recovery path and it blindly trusts whichever store
        it reads.


        Consequence — the exact breakage cases:


        1. **Self-healing (works only if user resumes through `requireAsking`).**
        If Redis is null, `requireAsking()` rebuilds state from the DB row and re-writes
        with a fresh 24h TTL (`:387-389`). Because DB is written *before* Redis, the
        rebuilt Redis state is never older than DB — count stays correct.


        2. **Continuation breaks → hard error.** When the rebuilt DB row is not ASKING/START
        (e.g. `FINISHED`, or a terminal/intermediate state), `requireAsking()` throws
        `INTERVIEW_FINISHED` (`:391-393`) or `INTERVIEW_STATE_ERROR` (`:394-397`).
        The user cannot resume; the error message does not tell them *why* (expired
        cache vs. truly finished). A session that legitimately completed during the
        idle gap is surfaced as an opaque failure rather than a clean "already finished"
        resume.


        3. **Silent count drift (the nastiest breakage).** `answer()`/`answerStream()`
        compute the next question as `state.questionCount() + 1` (`:179`, `:254`)
        from the Redis `state` returned by `requireAsking()`. If the DB row and Redis
        disagree because of a **crash between the dual-write steps** (DB advanced,
        Redis not yet written), then on the next turn Redis is *fresh* (not expired)
        and returns the stale count → increment runs from the old value → **questionCount
        drifts and a question can be repeats** — there is no dedup/keypoint guard
        during the count increment; dedup only happens after re-reading all messages.


        4. **`read()` null is ambiguous, so expiry is silent.** The corrupt-JSON path
        (`:43-44`) is folded into the same `null` as genuine expiry (`:38`), so a
        parse corruption triggers a silent DB rebuild + overwrite of the corrupt value,
        with only a `warn` log and no metric/alert. Operations cannot distinguish
        "expired", "evicted", "crashed", or "corrupt" — all silently heal or silently
        fail.


        ## 4. Recommended fixes (ordered by impact)


        1. **Make the DB the single authoritative source; Redis = invalidatable cache.**
        Keep the durable truth in `interview_session` and treat Redis purely as a
        cache keyed by a version. Map a `question_count`/`current_question_id`/`updated_at`
        version column so reads can compare Redis version vs DB version and drop the
        stale bucket. This removes the authority inversion at `InterviewStateStore.java:15`.


        2. **Sliding TTL instead of fixed, or refresh-on-read.** If the intent is
        "keep me while progressing", either (a) refresh TTL on every `read()` so active
        interviews never hit the 24h wall mid-pause, or (b) align TTL with JWT session
        lifetime and detect expiry explicitly rather than via `null`.


        3. **Distinguish the null causes.** Split the store API so expiry ≠ not-found
        ≠ corrupt. Return a sealed result (e.g. `Optional`/enum: `MISSING` vs `CORRUPT`)
        and **alert on `CORRUPT`** (currently it''s only `log.warn`, `InterviewStateStore.java:43`).
        Let `requireAsking()` handle expiry-lazily but raise on corrupt.


        4. **Harden the dual write.** Write Redis *after* durable commit is confirmed,
        and on failure do not throw a user-facing `BizException` mid-flow for a cache
        write (`InterviewStateStore.java:52-55` throws `INTERNAL_ERROR` even though
        Redis is merely a cache) — log + fall back to DB path so the interview continues.


        5. **Cheap guard for count integrity.** Since dedup already requires full
        message re-read (`:141-143`), derive `newCount` from the message history /
        DB `questionCount` (authoritative) instead of the possibly-stale Redis `state.questionCount()`.
        That single change removes the silent drift in case 3.


        ## 5. Files & exact anchor points


        - `backend/src/main/java/com/aiview/interview/service/InterviewStateStore.java:15`
        (authority comment), `:25` (`TTL_HOURS=24`), `:37-38` (null on missing), `:43-44`
        (null on corrupt), `:51` (TTL set only on write), `:58-60` (`delete()` exists,
        **zero callers** — sessions are never actively deleted, so stale keys only
        die via TTL).

        - `backend/src/main/java/com/aiview/interview/service/InterviewService.java:186/188`
        and `:344/345` (non-transactional DB→Redis dual writes), `:179/254` (count
        from possibly-stale Redis state), `:380-398` (`requireAsking` fallback, only
        recovery path, throws `INTERVIEW_FINISHED`/`INTERVIEW_STATE_ERROR`).

        - `docker-compose.yml:24-32` (Redis 7-alpine, no eviction/AOF config → eviction
        & restart loss risks).


        All five hypotheses (H-023, H-024, H-025, H-027, H-031) are corroborated;
        they are valid against this code. The single most important conclusion for
        lead: **the dual-write + authority inversion, not the TTL value itself, is
        what makes Redis-vs-DB drift and continuation breakage possible; the 24h TTL
        merely makes the window deterministic.**'
