      output: "# Security / DB Engineering Review — Redis RT-state TTL vs durable\
        \ DB (interview continuation)\n\nScope: `InterviewStateStore` (`InterviewStateStore.java`)\
        \ + `InterviewService` (`InterviewService.java:125-195,197-281,340-399`) +\
        \ `RedissonConfig.java`.\n\n## 1. What the current design actually does (ground\
        \ truth)\n\n`InterviewStateStore.write()` applies a **fixed** TTL reset on\
        \ every write:\n\n```java\nprivate static final long TTL_HOURS = 24;\n...\n\
        redissonClient.getBucket(key(sessionId)).set(json, TTL_HOURS, TimeUnit.HOURS);\
        \ // line 51\n```\n\nKey properties:\n- Every `answer` / `create` / `finishSession`\
        \ calls `write()`, so an **actively-used** session never expires; expiry only\
        \ fires on **≥24h of total idle** since the last write.\n- All three `SessionState`\
        \ fields (`status`, `questionCount`, `currentQuestionId`) are **mirrored in\
        \ MySQL** (`interview_session.status/question_count/current_question_id`)\
        \ and the write order is always **DB-first, Redis-second** (`InterviewService.java:186→188`,\
        \ `261→263`). Redis therefore never leads the DB; it lags or equals it.\n\
        - `requireAsking()` (`InterviewService.java:380-399`) has a **DB-rehydration\
        \ fallback** that reconstructs state when `read()` returns `null`.\n\n## 2.\
        \ Directly answering \"when and why continuation breaks\"\n\nThe framing \"\
        fixed TTL silently expires while the DB stays valid → continuation breaks\"\
        \ is only **partially** correct. Pure TTL expiry of this 1:1-cached, all-state-mirrored\
        \ record is **masked** by `requireAsking` rehydration (`InterviewService.java:382-390`)\
        \ — the next `answer` self-heals from MySQL. So the naive failure story (key\
        \ gone → stuck) does **not** reproduce here. The genuinely-breaking conditions\
        \ are narrower:\n\n### (a) Redis **connection/CLI** failure at read — the\
        \ real, hidden break\n`read()` only degrades to `null` on a graceful miss\
        \ or a *parse* exception (`InterviewStateStore.java:37-45`). But `RBucket.get()`\
        \ **throws** on Redis connectivity / `org.redisson` client errors, and that\
        \ exception is **not caught**. It propagates out of `requireAsking` → the\
        \ `answer`/`answerStream` API returns 500, even though MySQL holds the full\
        \ valid state. The DB fallback is never reached because it only triggers on\
        \ `null`, not on exception.\n\nThis is the precise \"DB valid but continuation\
        \ breaks\" case: **Redis becomes a hard, single-point dependency for the continuation\
        \ path**, and Redisson `Config` has **no timeout tuning** (`RedissonConfig.java:22-29`\
        \ — default connect/response timeouts are high, default retry heavy), so under\
        \ a Redis pause or partial network partition the user is blocked for the connection\
        \ timeout with an opaque 500.\n\n### (b) Fixed TTL on *runtime/resumable*\
        \ sessions is semantically wrong\nFixed 24h assumes \"idle = dead.\" For a\
        \ resume-later interview model, a user who pauses near the 24h boundary, or\
        \ resumes on day 2+, hits the expiry path. Today that path is *handled only\
        \ because every field is in the DB*. If any transient field (turn metadata,\
        \ SSE `currentQuestionId` divergence, streaming cursor) is ever kept Redis-only,\
        \ expiry becomes a **silent, durable data loss** — the exact class of bug\
        \ the `@doc` \"单一权威来源 (single authoritative source)\" implies but does not\
        \ guarantee.\n\n### (c) Pre-TTL eviction (memory policy) — silent early expiry\n\
        Nothing in `RedissonConfig` or `docker-compose` pins an eviction policy. Under\
        \ `maxmemory->allkeys-lru`/`allkeys-random` (common in shared/limited-memory\
        \ Redis), the session key can be evicted *before* TTL. Same masking applies\
        \ (works today only because of the DB mirror), but it is invisible: there\
        \ is **zero logging/monitoring on the rehydration path** (`InterviewService.java:383-389`\
        \ writes silently), so you cannot tell normal expiry from pathological churn.\n\
        \n### (d) DB-write-succeeds / Redis-write-fails ordering hazard (adjacent\
        \ to TTL, still a consistency risk)\nBecause writes are DB-then-Redis and\
        \ `write()` rethrows (`InterviewStateStore.java:52-55`), a Redis failure after\
        \ a successful DB insert leaves Redis **behind** the DB. A subsequent `answer`\
        \ reads the stale Redis `questionCount`, advances from it, and re-writes —\
        \ a subtle re-entrant drift risk that rehydration from the source-of-truth\
        \ DB would avoid.\n\n## 3. Recommendations\n\n1. **Treat MySQL as the authority;\
        \ degrade Redis to a pure coordinator/cache.** In `read()`, catch the Redisson\
        \ exception and return `null` so `requireAsking` always has a DB recovery\
        \ path:\n```java\npublic SessionState read(Long sessionId) {\n    try { RBucket<String>\
        \ bucket = redissonClient.getBucket(key(sessionId));\n          String json\
        \ = bucket.get();\n          if (json == null) return null;\n          return\
        \ objectMapper.readValue(json, SessionState.class);\n    } catch (Exception\
        \ e) {                       // includes RedisConnectionException\n      \
        \  log.warn(\"read session state degraded, sessionId={}: {}\", sessionId,\
        \ e.getMessage());\n        return null;\n    }\n}\n```\n2. **Make TTL sliding,\
        \ not fixed, and configurable.** Refresh on a shorter per-request lease (e.g.\
        \ `@Value(\"${interview.session.ttlMinutes}\")`) and call `bucket.set(json,\
        \ ttl, MINUTES)` (as today) so idle sessions expire “naturally” but active\
        \ ones never do; remove the hardcoded `TTL_HOURS=24`.\n3. **Log/alert on every\
        \ rehydration** (`InterviewService.java:382-390`) so silent expiry / eviction\
        \ / degrade becomes observable: warn with `sessionId`, source (`DB::rehydrate`),\
        \ and reason. Consider a counter for `redis-state-miss` vs `redis-state-connection-error`.\n\
