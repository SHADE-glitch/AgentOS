      output: "# F1 — Redis Session Runtime-State Drift: When and Why Continuation\
        \ Breaks\n\n**Team:** `team-18087af2` | **Role:** `security-engineer` (database\
        \ + AI) | **Classification:** `SUPPORT — contributes to lead review, not primary\
        \ owner`\n**Grounding revision:** working tree HEAD `56788e5` — verified by\
        \ direct read\n\n---\n\n## 1. Executive Summary (Security View)\n\n`InterviewStateStore`\
        \ is documented as *“单一权威来源”* (`backend/src/main/java/com/aiview/interview/service/InterviewStateStore.java:15`)\
        \ but is implemented as a **volatile cache**: `TTL_HOURS=24` with `RBucket.set(json,\
        \ 24, HOURS)`. The durable source of truth (`interview_session` in MySQL `backend/src/main/resources/db/schema.sql:46-60`)\
        \ has **no `updated_at`**, no version, no freshness signal.\n\nResult: **authority\
        \ inversion**. Availability of Redis determines correctness of the state machine.\
        \ After ~24h of *silence since last `write()`* the bucket silently returns\
        \ `null` (`InterviewStateStore.java:37-39`), MySQL still shows `ASKING`/`START`,\
        \ and `InterviewService.requireAsking()` (`InterviewService.java:380-399`)\
        \ *masks* the expiry by blind rehydration — resetting the 24h TTL and continuing\
        \ as if no gap occurred. From a security/reliability perspective this is **silent\
        \ state loss + non-detectable drift**, not a loud failure.\n\n---\n\n## 2.\
        \ Grounded Evidence\n\n| Artifact | Lines | Fact |\n|---|---|---|\n| `InterviewStateStore.java:25`\
        \ | `private static final long TTL_HOURS = 24;` | **G1** fixed TTL on authoritative\
        \ state |\n| `InterviewStateStore.java:34-46` | `read()` → `bucket.get()==null\
        \ → return null`; `catch→return null` | Expiry *and* corrupt JSON are indistinguishable\
        \ silent `null` |\n| `InterviewStateStore.java:48-52` | `getBucket(key).set(json,\
        \ TTL_HOURS, HOURS)` | Every `write()` resets TTL to 24h — TTL is *since last\
        \ write*, not since session creation |\n| `InterviewStateStore.java:58-60`\
        \ | `delete()` | Exists but not audited on error paths |\n| `InterviewService.java:380-390`\
        \ | `stateStore.read(); if(null){ s=selectById; new SessionState(s.status,...);\
        \ write(); }` | **G2/G3** no freshness validation, blind rehydrate |\n| `InterviewService.java:129,204`\
        \ | `requireAsking(sessionId)` in `answer()`/`answerStream()` | **G4** continuation\
        \ gate depends on volatile state |\n| `InterviewService.java:179,254` | `int\
        \ newCount = state.questionCount()+1` | Counter derives from potentially stale\
        \ `SessionState` |\n| `InterviewService.java:110-117` vs `186-189` | `sessionMapper.updateById(session)`\
        \ then `stateStore.write(...)` | **G5** non-transactional dual-write |\n|\
        \ `schema.sql:46-60` | `interview_session(started_at, finished_at)` no `updated_at/version`\
        \ | DB cannot prove staleness |\n| `InterviewService.java:91,116` | `create()`\
        \ does `insert` → `write(START,0)` → `pickQuestion` → `updateById` → `write(ASKING,1)`\
        \ | Two writes widen race window |\n\n---\n\n## 3. When Does It Break? — Exact\
        \ Timeline\n\n```\nT0 create(sessionId=123)  DB: status=ASKING, questionCount=1,\
        \ currentQuestionId=msg42\n                            Redis: interview:session:123\
        \ = {ASKING,1,42} TTL=24h\n\nT0+23h user idle but session still DB-valid (ASKING).\
        \ Redis TTL ~1h left.\n\nT0+24h+1s Redis key expires (or Redis restart / eviction\
        \ / `FLUSHDB` / memory pressure).\n          bucket.get() == null.\n\nT0+24h+10s\
        \ user submits answer -> InterviewService.java:129 requireAsking(123)\n  \
        \         stateStore.read()==null -> fallback selectById -> {ASKING,1,42}\n\
        \           blind rehydrate: write({ASKING,1,42}, TTL 24h)  // looks recovered\n\
        \nT0+24h+11s newCount = 1+1=2 -> insert question msg43 -> DB update questionCount=2\n\
        \           write({ASKING,2,msg43})\n```\n\n**Breaks observable when:**\n\n\
        1. **Long-lived / paused interviews** — user starts interview, pauses >24h\
        \ since last server write (e.g., overnight, weekend). Next `answer()` triggers\
        \ rehydration path.\n2. **Any Redis loss** — not just TTL: `RedissonConfig.java:22-28`\
        \ single-server, no persistence guaranteed; restart, failover, `maxmemory`\
        \ eviction, manual `DEL interview:session:*` all produce identical `null`.\n\
        3. **Concurrent `answer()` / `answerStream()`** after expiry: both threads\
        \ see `null`, both reconstruct from same DB snapshot, both compute `newCount\
        \ = oldCount+1` → lost update (questionCount drift).\n4. **Finished vs Asking\
        \ confusion**: if DB was `FINISHED` but Redis had `ASKING` before expiry,\
        \ the rehydrated `FINISHED` correctly blocks (`InterviewService.java:391-393`),\
        \ but if the *DB already finished* and Redis expired *before* the client polled,\
        \ the user sees a silent re-allow → `InterviewStatus.FINISHED.name().equals(state.status())`\
        \ check depends on which copy wins the race.\n\n**User impact:** silent continuation\
        \ with wrong `questionCount`/`currentQuestionId`, duplicate questions (`QuestionBank.pickQuestion`\
        \ uses `askedQuestionIds` from `interview_message`, not `state`, so off-by-one\
        \ still progresses), or spurious `INTERVIEW_FINISHED` / `INTERVIEW_STATE_ERROR`\
        \ after rehydrate.\n\n---\n\n## 4. Why It Breaks — 5 Gold Issues (G1..G5)\n\
        \n**G1 Fixed 24h TTL on authoritative runtime state.** TTL is hard-coded,\
        \ not configurable, not sliding on read. `write()` resets but `read()` does\
        \ not. The threat is *time-based availability loss* masquerading as data loss.\n\
        \n**G2 No freshness validation.** `requireAsking()` never checks:\n- `session.updatedAt`\
        \ (does not exist),\n- `max(interview_message.id)` for this `sessionId`,\n\
        - `message.created_at` vs `state` age.\nSo `read()==null` is treated as *“cache\
        \ miss, rebuild”* not *“integrity event”*.\n\n**G3 DB fallback masks drift.**\
        \ The fallback does `new SessionState(s.status, s.questionCount, s.currentQuestionId)`\
        \ then `write(state)` (`InterviewService.java:387-389`). This *hides* the\
        \ expiry, resets the 24h clock, and logs nothing at `WARN`. An attacker or\
        \ a fault that drops Redis can force repeated silent rehydrations without\
        \ detection. Contrast with fail-closed: log, metric, and require client reconfirmation.\n\
        \n**G4 Continuation depends on missing state.** `answer()`/`answerStream()`\
        \ derive `newCount` from `state.questionCount()` not `COUNT(*) FROM interview_message\
        \ WHERE kind='question'`. If state was stale, count drifts from DB truth.\
        \ `sessionMapper.updateById` then persists drifted count.\n\n**G5 Dual-write\
        \ non-transactional.** Sequence is `DB updateById` → `Redis set`. No XA, no\
        \ outbox, no Lua atomicity.\n- Crash after DB but before Redis → DB ahead,\
        \ next read reconstructs old value → rollback semantics lost.\n- Crash after\
        \ Redis but before DB commit → Redis ahead.\n- No `deleted` handling: `InterviewSession`\
        \ has `@TableLogic deleted` but `InterviewStateStore.delete()` is never called\
        \ on logical delete.\n\n**Security lens:** This is CWE-664 *Improper Control\
        \ of a Resource Through its Lifetime* + CWE-362 race, plus availability issue\
        \ that violates *secure-by-default*: system should **fail safe (deny continuation\
        \ until validated)** rather than **fail open (assume DB copy is fresh)**.\n\
        \n---\n\n## 5. Security & Data-Integrity Impact\n\n- **Integrity:** `questionCount`\
        \ / `currentQuestionId` can diverge between DB and Redis, then be persisted.\
        \ Downstream `EvaluationService.shouldFinish()` and `ReportService` rely on\
        \ `MAX_QUESTIONS=6` and `questionCount`; drift can prematurely finish or never\
        \ finish.\n- **Availability:** Forced Redis expiration (TTL exhaustion or\
        \ manual `DEL`) is a cheap DoS on session continuity without touching DB —\
        \ no auth needed beyond Redis network access.\n- **Auditability:** No event\
        \ emitted on `read()==null` rehydration; `log.warn` only on parse failure\
        \ (`InterviewStateStore.java:43`). Drift is invisible to monitoring.\n- **State-machine\
        \ bypass:** `InterviewStatus` enum (`InterviewStatus.java:7-22`) defines `START\
        \ → ASKING → FINISHED` but `requireAsking()` only checks `state.status()`\
        \ post-rehydrate; an expired `FINISHED` rehydrated as `FINISHED` correctly\
        \ blocks, but an expired `ASKING` with DB still `START` (if `create()` crashed\
        \ between writes) rehydrates as `START` and passes the `START|ASKING` gate\
        \ (`InterviewService.java:394-396`) — inconsistent lifecycle.\n\n---\n\n##\
        \ 6. How to Reproduce (Deterministic)\n\n```java\n// 1. create session\nInterviewSessionVO\
        \ vo = interviewService.create(userId, req); // id=123\nLong sid = vo.getId();\n\
        \n// 2. prove TTL is 24h\n// InterviewStateStore.java:25,51 — or redis-cli:\n\
        \ // TTL interview:session:123  -> 86400\n\n// 3. force expiry without touching\
        \ DB\nredissonClient.getBucket(\"interview:session:\"+sid).delete();\n// or\
        \ expireAsync(1, SECONDS) and sleep\n\n// 4. DB still valid\nInterviewSession\
        \ db = sessionMapper.selectById(sid);\nassert db.getStatus().equals(\"ASKING\"\
        );\n\n// 5. continuation with silent rehydrate\nMessageVO next = interviewService.answer(userId,\
        \ sid, \"my answer\");\n// Passes, but check logs: no WARN, and\nSessionState\
        \ after = stateStore.read(sid);\nassert after.questionCount() == db.getQuestionCount()\
        \ + 1; // may already drift if concurrent\n```\n\n**Test matrix** (what benchmark\
        \ expects):\n- F1: TTL expiry → `read null`\n- F2: DB fallback without freshness\
        \ → blind rehydrate\n- F3: `newCount` derived from stale state\n- F4: dual-write\
        \ kill after `updateById` before `write` → divergence\n- F5: corrupt JSON\
        \ (`bucket.set(\"not-json\",24,HOURS)`) → `read` returns `null` identically\
        \ to expiry (`InterviewStateStore.java:42-44`)\n\n---\n\n## 7. Fix Options\
        \ — Prioritize Freshness Validation Over TTL Tuning\n\n### Anti-pattern (do\
        \ NOT only do this)\n```java\nprivate static final long TTL_HOURS = 72; //\
        \ raising TTL just widens silent window\n```\n\n### Recommended Remediation\
        \ (Defense-in-Depth)\n\n**A. Make DB source of truth, Redis a cache (authority\
        \ correction)**\n\n```java\n// InterviewStateStore.java — rename intent, add\
        \ optional TTL only for GC\npublic void write(Long sessionId, SessionState\
        \ state, Duration ttl) {\n  // ttl is cache GC hint, not authority boundary\n\
        \  bucket.set(json, ttl.toHours(), TimeUnit.HOURS);\n}\npublic SessionState\
        \ read(Long sessionId) { /* as before, but caller must validate */ }\n```\n\
        \n**B. Add freshness validation in `requireAsking()` (G2/G3 fix)**\n\n```java\n\
        // InterviewService.java:380\nprivate SessionState requireAsking(Long sessionId)\
        \ {\n  SessionState cached = stateStore.read(sessionId);\n  InterviewSession\
        \ db = sessionMapper.selectById(sessionId);\n  if (db == null) throw new BizException(INTERVIEW_NOT_FOUND);\n\
        \n  if (cached == null) {\n    log.warn(\"session state cache miss sessionId={}\
        \ status={} qCount={}\", \n             sessionId, db.getStatus(), db.getQuestionCount());\n\
        \    metrics.counter(\"interview.state.rehydrate\").increment();\n    // freshness\
        \ check: count actual question messages\n    long msgCount = messageMapper.selectCount(\n\
        \      new LambdaQueryWrapper<InterviewMessage>()\n        .eq(InterviewMessage::getSessionId,\
        \ sessionId)\n        .eq(InterviewMessage::getKind, \"question\"));\n   \
        \ if (msgCount != db.getQuestionCount()) {\n      log.error(\"drift detected\
        \ sessionId={} dbCount={} msgCount={}\", sessionId, db.getQuestionCount(),\
        \ msgCount);\n      // fail-safe: reconcile DB to message truth or reject\
        \ continuation\n      db.setQuestionCount((int) msgCount);\n      sessionMapper.updateById(db);\n\
        \    }\n    cached = new SessionState(db.getStatus(), db.getQuestionCount(),\
        \ db.getCurrentQuestionId());\n    stateStore.write(sessionId, cached); //\
        \ re-cache after validation\n  } else {\n    // parity check even on hit —\
        \ detects dual-write divergence (G5)\n    if (!cached.status().equals(db.getStatus())\
        \ || cached.questionCount()!=db.getQuestionCount()) {\n      log.warn(\"cache/db\
        \ divergence sessionId={} cache={} db={}\", sessionId, cached, db);\n    \
        \  cached = new SessionState(db.getStatus(), db.getQuestionCount(), db.getCurrentQuestionId());\n\
        \      stateStore.write(sessionId, cached);\n    }\n  }\n  if (FINISHED.name().equals(cached.status()))\
        \ throw new BizException(INTERVIEW_FINISHED);\n  if (!ASKING.name().equals(cached.status())\
        \ && !START.name().equals(cached.status())) \n    throw new BizException(INTERVIEW_STATE_ERROR,\
        \ \"当前状态不允许提交答案\");\n  return cached;\n}\n```\n\n**C. Schema: add `updated_at`\
        \ + version for parity**\n\n```sql\n-- db/schema.sql\nALTER TABLE interview_session\n\
        \  ADD COLUMN updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE\
        \ CURRENT_TIMESTAMP,\n  ADD COLUMN version INT NOT NULL DEFAULT 0;\nCREATE\
        \ INDEX idx_session_updated ON interview_session(updated_at);\n```\nThen store\
        \ `updatedAt` in `SessionState` (`record SessionState(String status, int questionCount,\
        \ Long currentQuestionId, LocalDateTime updatedAt)`) and reject if `cached.updatedAt\
        \ < db.updatedAt`.\n\n**D. Make dual-write safer (G5)**\n\n- Order: **DB first,\
        \ then Redis**, with reconciliation job (outbox or `ON DUPLICATE` checker).\
        \ Or use Redisson transaction / Lua:\n\n```java\n// atomic DB+Redis via application-level\
        \ lock already exists: lockFor(sessionId) does RLock\n// Keep lockFor() held\
        \ across DB+Redis (already does — InterviewService.java:89,126)\n// Add expiry\
        \ of lock and TTL renewal on read:\nbucket.expire(24, TimeUnit.HOURS); //\
        \ slide on successful read validation\n```\n\n- Consider `redissonClient.getBucket(key).setAndKeepTTL()`\
        \ vs full reset to avoid *TTL extension attacks* (repeated reads extending\
        \ indefinitely).\n\n**E. Configuration**\n\n```yaml\n# application.yml\napp:\n\
        \  interview:\n    state-ttl: 24h        # make configurable, not hardcoded\n\
        \    cache-slide-on-read: true\n    reconcile-interval: 5m\nspring:\n  data:\n\
        \    redis:\n      timeout: 2s\n      # enable keyspace notifications for\
        \ expiry auditing (optional):\n      # notify-keyspace-events: Ex\n```\n\n\
        ```conf\n# redis.conf\nmaxmemory-policy noeviction  # never evict interview:session:*;\
        \ fail writes instead\n# plus: rename-command FLUSHDB \"\"  / ACL for interview\
        \ keys\n```\n\n**F. Observability (security requirement)**\n\n- Counter `interview_state_cache_miss_total`,\
