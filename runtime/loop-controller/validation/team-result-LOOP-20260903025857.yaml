    output: "# Redis TTL Runtime State Drift — Interview Session Continuation Failure\n\
      \n**Lead:** Database Engineer | **Support:** Security Engineer, Code Reviewer,\
      \ Backend Architect | **Team:** `team-18087af2` | **Domain:** `database, ai`\n\
      \n## 1. Executive Summary\n\n`InterviewStateStore.java:15` declares Redis as\
      \ `\"单一权威来源\" (single authoritative source)` for the interview state machine,\
      \ but `InterviewStateStore.java:25` stores it with a **fixed `TTL_HOURS=24`**\
      \ via `InterviewStateStore.java:51` `set(json, TTL_HOURS, HOURS)`. MySQL `interview_session`\
      \ is durable and has no TTL. After 24h of silence since the *last* `write()`,\
      \ `InterviewStateStore.java:36-37` `bucket.get()==null` returns `null` indistinguishable\
      \ from a missing session. `InterviewService.java:380-390` `requireAsking()`\
      \ silently rehydrates from DB and re-caches for another 24h with **zero freshness/counter\
      \ validation**. `answer()`/`answerStream()` then compute `newCount = state.questionCount()+1`\
      \ on potentially drifted state. The DB remains valid while continuation is broken/stale.\n\
      \n> **Seed truth:** *Redis-backed runtime state is not authoritative after TTL\
      \ expiry; validate freshness against DB truth before continuing.*\n\n## 2. Dual-Store\
      \ Architecture\n\n| Store | Key / Table | Authority Claimed | Authority Actual\
      \ | Expiry | Source of Truth |\n|-------|-------------|-------------------|------------------|--------|-----------------|\n\
      | Redis | `interview:session:{id}` `InterviewStateStore.java:31` | `InterviewStateStore.java:15`\
      \ authoritative | ephemeral, TTL-bound | `24h` reset on every `write()` `InterviewStateStore.java:51`\
      \ | No |\n| MySQL | `interview_session` `InterviewSession.java:15` | fallback\
      \ in `requireAsking()` | durable, no `updated_at` only `startedAt/finishedAt`\
      \ `InterviewSession.java:37-40` | never | Yes |\n\nCode paths that dual-write\
      \ (non-transactional):\n\n```\ncreate()            DB insert + stateStore.write(START)\
      \ + DB updateById + write(ASKING) InterviewService.java:87-117\nanswer()   \
      \         DB updateById  + write(ASKING) InterviewService.java:186-189\nanswerStream()\
      \      DB updateById  + write(ASKING) InterviewService.java:258-264\nfinishSession()\
      \     DB updateById(FINISHED) + write(FINISHED) InterviewService.java:341-346\n\
      ```\n\nNo transaction, no Lua, no `updated_at` version to detect drift.\n\n\
      ## 3. When Continuation Breaks — Timeline\n\n```\nT0 create()        -> Redis\
      \ TTL=24h, DB status=ASKING, questionCount=1\nT0+23h answer()    -> write()\
      \ resets TTL to T0+47h (sliding, not absolute)\nT0+47h +1ms        -> Redis\
      \ bucket expires -> read() == null\nT0+47h+ request answer(sessionId):\n  requireAsking()\
      \ InterviewService.java:381 read()==null\n                   -> selectById(sessionId)\
      \ InterviewService.java:383 DB still ASKING\n                   -> new SessionState(s.status,\
      \ s.questionCount, s.currentQuestionId) InterviewService.java:387-388\n    \
      \               -> write() re-cache 24h InterviewService.java:389\n  -> continues\
      \ with s.questionCount (DB) OR drifted Redis value before expiry\n```\n\n**Trigger\
      \ conditions:**\n\n1.  Any `ASKING`/`START` session idle >24h since last `write()`\
      \ — common: user pauses, returns next day, tab resume, mobile background.\n\
      2.  Redis eviction / restart / failover / `FLUSHDB` — same `null` path.\n3.\
      \  Corrupt JSON — `InterviewStateStore.java:42-44` `catch Exception -> log.warn\
      \ + return null` — indistinguishable from expiry, forces same blind rehydrate.\n\
      4.  `delete()` called without caller audit `InterviewStateStore.java:58-60`\
      \ — never called today but unguarded.\n\n## 4. Gold Root Causes (G1-G5)\n\n\
      ### G1 — Fixed 24h TTL on Authoritative Runtime State\n`InterviewStateStore.java:25,48-52`:\n\
      ```java\nprivate static final long TTL_HOURS = 24; // not configurable\npublic\
      \ void write(Long sessionId, SessionState state) {\n    redissonClient.getBucket(key(sessionId)).set(json,\
      \ TTL_HOURS, TimeUnit.HOURS);\n}\n```\n* Database review: TTL is **fixed, not\
      \ sliding per business SLA**, not externalized to `application.yml`, no keepalive.\
      \ 24h of *inactivity* silently invalidates an otherwise valid `ASKING` session.\n\
      * Code review: comment `InterviewStateStore.java:15` inverts authority — cache\
      \ outranks DB.\n\n### G2 — No Freshness Validation Before Use/Rehydrate\n`InterviewService.java:380-399`\
      \ `requireAsking()`:\n```java\nSessionState state = stateStore.read(sessionId);\
      \ // InterviewStateStore.java:34-46 null on miss OR parse fail\nif (state ==\
      \ null) {\n    InterviewSession s = sessionMapper.selectById(sessionId);\n \
      \   state = new SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId());\n\
      \    stateStore.write(sessionId, state); // blind rehydrate, reset 24h, no checks\n\
      }\nif (FINISHED.equals(state.status())) throw INTERVIEW_FINISHED;\nif (!ASKING\
      \ && !START) throw INTERVIEW_STATE_ERROR;\n```\nMissing: no `updatedAt`/`version`/`messageMaxId`\
      \ comparison, no `status` transition legality (`FINISHED -> ASKING` should be\
      \ impossible but would be re-allowed if DB was incorrectly ASKING), no `questionCount`\
      \ vs `SELECT COUNT(*) FROM interview_message WHERE sessionId=? AND kind='question'`\
      \ parity check. `schema.sql` has no `updated_at` — DB itself cannot convey staleness.\n\
      \n### G3 — DB Fallback Masks Drift Instead of Detecting It\nFallback does `selectById`\
      \ then **immediately re-caches for 24h** without verifying `s.questionCount\
      \ == count(messages)` or `s.currentQuestionId == max(message.id)`. If DB `questionCount`\
      \ lagged a prior failed dual-write, the rehydrated state re-introduces the lag\
      \ and extends it. Observability gap: no metric/log for `rehydration_count` vs\
      \ `cache_hit`.\n\n### G4 — Continuation Depends on State That Can Be Missing/Stale\n\
      `InterviewService.java:179,254`:\n```java\nint newCount = state.questionCount()\
      \ + 1; // answer() and answerStream()\nsession.setQuestionCount(newCount);\n\
      stateStore.write(sessionId, new SessionState(ASKING.name(), newCount, msg.getId()));\n\
      ```\nIf `state` was rehydrated stale, `newCount` diverges from DB truth. Next\
      \ `shouldFinish(qaPairs, MAX_QUESTIONS=6)` uses `InterviewMessage` list (correct)\
      \ but persisted `questionCount` and Redis `questionCount` diverge — scoring/reporting\
      \ drift and `MAX_QUESTIONS` boundary off-by-one.\n\n### G5 — Redis/DB Dual-Write\
      \ Is Non-Transactional\n`DB updateById` then `Redis set` — no `RTransaction`,\
      \ no outbox, crash between them leaves divergence window. `answerStream()` on\
      \ virtual thread `InterviewService.java:199` compounds race with `RLock` `InterviewService.java:361-372`\
      \ but lock does not cover DB+Redis atomicity.\n\n## 5. Support Agent Findings\n\
      \n**Code Reviewer:** `read()` swallows *both* expiry and deserialization error\
      \ as `null` — caller cannot distinguish transient expiry (recoverable) from\
      \ corruption (needs alert). `write()` failure throws `BizException(INTERNAL_ERROR)`\
      \ but prior DB commit already succeeded — leaves DB ahead. No `delete()` lifecycle\
      \ tied to `FINISHED`.\n\n**Security Engineer:**\n*   **Availability:** Forcing\
      \ TTL expiry (slow-request, Redis `EXPIRE interview:session:{id} 1`) downgrades\
      \ to DB path — amplifies DB load, potential DoS.\n*   **Integrity:** Rehydrated\
      \ state inherits whatever DB holds; if DB `status` was manually edited or lagged,\
      \ attacker can resume a `FINISHED` session as `ASKING` if DB still says `ASKING`\
      \ (no immutability guard).\n*   **Confidentiality:** No per-tenant isolation\
      \ beyond `key(sessionId)` — predictable keys.\n\n**Backend Architect:** Pattern\
      \ repeats in `DashboardService.java:38,52-70` — 10m TTL cache without freshness\
      \ stamp, fixed by `evict()` on 4 write paths `InterviewService.java:152,169,227,244,349`,\
      \ `InterviewScoringService.java:106,111`, `RuleBasedScoringService.java:57,66`,\
      \ `LegacyAiScoringService.java:113,118`. Lesson: fix authority, not just TTL.\n\
      \n## 6. Concrete Reproduction / Verification Steps\n\n```sql\n-- 1. Create session,\
      \ note Redis TTL\n-- backend sets interview:session:123 -> {\"status\":\"ASKING\"\
      ,\"questionCount\":1,...} EXPIRE 86400\nTTL interview:session:123 -- 86400\n\
      \n-- 2. Simulate expiry or flush\nDEL interview:session:123  -- or DEBUG EXPIRE\
      \ 1\n\n-- 3. Call POST /interview/{123}/answer\n-- observable: requireAsking\
      \ rehydrates, next questionCount = DB count +1 but may diverge\n\n-- 4. Drift\
      \ matrix to test:\n-- F1: TTL expiry -> null fallback\n-- F2: corrupt JSON ->\
      \ null fallback\n-- F3: DB questionCount != Redis questionCount -> which wins?\n\
      -- F4: DB FINISHED but Redis ASKING (stale cache before delete) -> wrong allow?\n\
      -- F5: concurrent answer() b/w DB commit and Redis set\n```\n\nAdd observability:\n\
      ```java\n// InterviewStateStore.java:34\nif (json == null) { metrics.increment(\"\
      interview.state.miss\"); log.info(\"rehydrate sessionId={}\", sessionId); }\n\
      ```\n\n## 7. Recommended Fix (Prioritized — Freshness Validation Over TTL Extension)\n\
      \n### P0 — Make DB Authoritative, Redis a Cache (requires freshness check)\n\
      \n```java\n// InterviewStateStore.java:27 — add versioning\npublic record SessionState(String\
      \ status, int questionCount, Long currentQuestionId,\n                     \
      \      long version, Instant updatedAt) {}\n\nprivate InterviewStateStore.SessionState\
      \ requireAsking(Long sessionId) {\n    SessionState cached = stateStore.read(sessionId);\n\
      \    InterviewSession s = sessionMapper.selectById(sessionId); // always read\
      \ DB truth\n    if (s == null) throw new BizException(INTERVIEW_NOT_FOUND);\n\
      \    if (InterviewStatus.FINISHED.name().equals(s.getStatus())) throw new BizException(INTERVIEW_FINISHED);\n\
      \n    // freshness / drift detection\n    if (cached == null) {\n        metrics.increment(\"\
      interview_state_rehydrated\");\n        // validate DB counters against messages\
      \ before re-cache\n        long msgCount = messageMapper.selectCount(Wrappers.lambdaQuery(InterviewMessage.class)\n\
      \            .eq(InterviewMessage::getSessionId, sessionId).eq(InterviewMessage::getKind,\"\
      question\"));\n        if (s.getQuestionCount() != msgCount) {\n           \
      \ log.warn(\"drift detected sessionId={} dbCount={} msgCount={}\", sessionId,\
      \ s.getQuestionCount(), msgCount);\n            s.setQuestionCount((int)msgCount);\
      \ // repair or reject — policy choice\n            sessionMapper.updateById(s);\n\
      \        }\n        cached = new SessionState(s.getStatus(), s.getQuestionCount(),\
      \ s.getCurrentQuestionId(), s.getVersion(), Instant.now());\n        stateStore.write(sessionId,\
      \ cached); // re-cache only after validation\n    } else {\n        // parity\
      \ check even on cache hit — detects G5 dual-write divergence\n        if (!cached.status().equals(s.getStatus())\
      \ || cached.questionCount() != s.getQuestionCount()) {\n            log.warn(\"\
      cache/db divergence sessionId={} cached={} db={}\", sessionId, cached, s);\n\
      \            cached = new SessionState(s.getStatus(), s.getQuestionCount(),\
      \ s.getCurrentQuestionId(), s.getVersion(), Instant.now());\n            stateStore.write(sessionId,\
      \ cached);\n        }\n    }\n    // existing status gate on validated state\n\
      \    if (!ASKING.name().equals(cached.status()) && !START.name().equals(cached.status()))\n\
      \        throw new BizException(INTERVIEW_STATE_ERROR);\n    return cached;\n\
      }\n```\n\nDB change: add `version INT DEFAULT 0`, `updated_at DATETIME DEFAULT\
      \ CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP` to `interview_session` or optimistic\
      \ `@Version`.\n\n### P1 — Fix TTL Semantics\n\nExternalize, extend, and add\
      \ explicit lifecycle:\n\n```yaml\n# application.yml\napp:\n  interview:\n  \
      \  state-ttl-hours: 168 # 7 days, matches business max session lifetime, not\
      \ 24h\n    state-refresh-on-read: true\n```\n```java\n// InterviewStateStore.java:25\n\
      @Value(\"${app.interview.state-ttl-hours:168}\") private long ttlHours;\npublic\
      \ void touch(Long sessionId) { redissonClient.getBucket(key(sessionId)).expire(ttlHours,\
      \ TimeUnit.HOURS); }\npublic void delete(Long sessionId) { redissonClient.getBucket(key(sessionId)).delete();\
      \ } // call on FINISHED only\n```\nOptionally remove TTL entirely for `FINISHED`\
      \ terminal state (persist until TTL naturally vs explicit delete after `30d`).\n\
      \n### P2 — Make Dual-Write Safer\n\n*   Order: `write Redis` first? No — DB\
      \ is truth, so commit DB then best-effort Redis with `try/catch` not `throw`\
      \ that masks DB success. Or use Transactional Outbox + async Redis sync.\n*\
      \   Redisson `RBatch` is not XA — do not pretend atomic; add reconciliation\
      \ job: `SELECT * FROM interview_session WHERE status='ASKING' AND finishedAt\
      \ IS NULL` vs `SCAN interview:session:*`.\n*   For `answer()` keep `RLock interview:lock:{id}`\
      \ but extend to cover `selectById -> validate -> insert message -> updateById\
      \ -> write cache` as one critical section (already does `InterviewService.java:361`).\n\
      \n### P3 — Distinguish Null Causes\n\n```java\n// InterviewStateStore.java:34\n\
      public Optional<SessionState> read(Long sessionId) { ... }\npublic enum ReadResult\
      \ { HIT, MISS_EXPIRED, CORRUPT }\n```\nLog `CORRUPT` as error with alert, `MISS_EXPIRED`\
      \ as info+rehydrate metric.\n\n### P4 — Dashboard Parity (already fixed, verify)\n\
      \nEnsure `DashboardService.java:81 evict()` remains on **all** `InterviewResult`\
      \ insert/update paths — audit grep `evict` in CI gate. Add `build()` freshness\
      \ header `X-Cache: HIT/MISS` and `computedAt` in `DashboardVO` to expose staleness.\n\
      \n## 8. Decision Flow After Fix\n\n```\nread() == null ?\n  yes -> load DB (authoritative)\
      \ -> validate questionCount vs message count\n                     -> if FINISHED\
      \ -> reject (InterviewStateStore.java:391)\n                     -> if drift\
      \ -> repair/alert -> write validated state (re-cache)\n                    \
      \ -> return validated state\n  no  -> load DB -> compare cached vs DB (G5 check)\
      \ -> if diverge -> repair -> return DB truth\n```\n\n**Rule:** `Redis-backed\
      \ runtime state is not authoritative after TTL expiry; validate freshness against\
      \ DB truth before continuing.` Never `raise TTL` alone — that only postpones\
      \ G2-G5.\n\n"
