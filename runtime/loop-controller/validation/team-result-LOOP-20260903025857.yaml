        \ after expiry, dual-write crash window\n- [ ] Metrics/logs prove rehydration\
        \ is no longer silent\n- [ ] `InterviewStateStore.java:15` authority inversion\
        \ documented as fixed; lesson vector **“validate freshness against DB truth\
        \ before continuing”** is now code, not just runbook\n\n**Residual risk if\
        \ only TTL raised:** window shrinks but *class* remains — any Redis loss still\
        \ silently rehydrates with possible drift. Only freshness validation + DB-as-truth\
        \ eliminates it.\n\n---"
