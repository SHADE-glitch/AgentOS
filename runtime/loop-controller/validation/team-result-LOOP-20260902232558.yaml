      output: "**Team lead review contribution — Domain: database | Role: database-engineer\
        \ | Task: debug (Redis TTL silent expiry vs valid DB)**\n\nI validated the\
        \ hypotheses against `backend/src/main/java/com/aiview/interview/service/InterviewStateStore.java`\
        \ and `InterviewService.java`. The mechanism is confirmed by the code (line\
        \ refs below). Here is the structured analysis.\n\n## 1. Architecture under\
        \ review (two stores, two roles)\n\n| Store | Holds | Persistence | Role documented\
        \ in code |\n|---|---|---|---|\n| Redis (`interview:session:{id}`) | `SessionState(status,\
        \ questionCount, currentQuestionId)` | Volatile, `TTL_HOURS=24` fixed | \"\
        状态机的单一权威来源\" / **single authoritative source** for the state machine (InterviewStateStore.java:15)\
        \ |\n| MySQL (`interview_session`, `interview_message`, `interview_result`)\
        \ | Durable rows | Persistent | Effective fallback / audit / aggregation source\
        \ |\n\n`InterviewStateStore`:\n- `write()` → `set(json, 24, HOURS)` — **TTL\
        \ reset to 24h on every write** (line 51)\n- `read()` → `bucket.get()` — **no\
        \ touch / no TTL refresh** (line 36)\n- `InterviewService.requireAsking()`\
        \ re-hydrates a null Redis state from the DB row and rewrites it (lines 380–399)\n\
        \n## 2. Root cause: the TTL is a non-renewable wall-clock budget, not activity-based\n\
        \nThe expiry clock is **reset only on `write()`, never extended on `read()`**\
        \ (Redis `GET` does not refresh TTL). Therefore the key has a strict **absolute\
        \ lifetime of 24h measured from the last state transition** — not 24h from\
        \ creation, not renewed on access. This is the heart of \"singhtly expires\
        \ while DB stays valid\": DB rows persist indefinitely; the Redis snapshot\
        \ is a time-bomb that self-destructs at the 24h mark after the most recent\
        \ transition.\n\n**When it fires:**\n- **Idle / paused interview ≥24h between\
        \ state transitions** (rare per-request, but real for long, take-home, or\
        \ resumable interviews). The natural per-question cadence is minutes/hours,\
        \ so *actively-used* sessions keep renewing — which is exactly why the bug\
        \ hides in testing and only surfaces in production on slow or resumed sessions.\n\
        - **Question held open across a day boundary:** question N posed, user is\
        \ interrupted, returns after the final `write()` (which was when question\
        \ N was stored) has aged past 24h → the authoritative snapshot for the currently-asked\
        \ question is gone.\n- **No renewal-at-access:** even a session that a user\
        \ *polls every hour* will still die if it has not *transitioned* in 24h, because\
        \ polling reads do not extend the lease. A user actively reviewing but not\
        \ answering loses state — the classic silent-expiry trap.\n\n## 3. Why continuation\
        \ \"breaks\" — including the case that self-heals\n\nCritical nuance validated\
        \ in code: the **normal answer path does NOT hard-fail** on expiry, because\
        \ `requireAsking()` detects `read()==null` and re-hydrates from the DB row\
        \ (InterviewService.java:382-389). It reconstructs `SessionState(status, questionCount,\
        \ currentQuestionId)` from `interview_session` and rewrites Redis. So a single\
        \ expiry in `answer()`/`answerStream()` recovers.\n\nThe break is therefore\
        \ threefold and mostly *latent / degenerate*:\n\n1. **Invariant violation\
        \ without a signal.** The documented contract is \"Redis = single authoritative\
        \ source\" (InterviewStateStore.java:15). On expiry the code silently degrades\
        \ to a DB-derived reconstruction — **with no log, no metric, no explicit reconciliation,\
        \ and no recovery of any Redis-only state.** Rehydration is fully silent (there\
        \ is no `log.info/warn` in the rehydration branch). Any present or future\
        \ consumer that calls `stateStore.read()` directly (expecting the authoritative\
        \ snapshot) gets `null`. Continuation *works only because* the only current\
        \ caller happens to have a defensive fallback — a coupling, not a guarantee.\n\
        \n2. **The rehydrated snapshot is a *snapshot at last DB commit*, not truth-at-expiry.**\
        \ `interview_session.question_count/status/current_question_id` are denormalized\
        \ columns updated during transitions, not a durable event log. If a transition\
        \ is partially completed when the flow dies (see §4 divergence window), the\
        \ DB column may be *ahead of or behind* the true machine state, and TTL expiry\
        \ is what turns that divergence into *silent loss of the newer/authoritative\
        \ copy*.\n\n3. **Unrecoverable cases do exist** (see §4): direct readers of\
        \ Redis, plus any path relying on Redis presence for correctness, hard-break\
        \ without the DB fallback. And with volatile eviction (§5) the key can vanish\
        \ *in the middle of active use*, not just after 24h idle.\n\n## 4. The divergence\
        \ window (DB-valid + Redis-stale) — the real danger compound\n\nWrites to\
        \ DB and Redis are **ordered, not atomic**:\n\n```\nSessionService.answer():\
        \  sessionMapper.updateById(session)  (DB)   \U0001F852 line 186\n       \
        \                   stateStore.write(...)               (Redis) \U0001F852\
        \ line 188\n```\n\nBoth sit under a per-session Redisson lock, so there is\
        \ no concurrent-writer race. But they are **two separate commits with a failure\
        \ gap**, and ability to lose the authoritative copy depends on which side\
        \ is newest when TTL fires:\n\n- **Redis write throws (OOM / Redis down /\
        \ network):** DB advances to `count=N`, Redis stays at `count=N-1` until TTL.\
        \ The BizException hits the user. On retry, `requireAsking` finds Redis present\
        \ (not expired, `count=N-1`), re-derives `newCount=(N-1)+1 = N`, and inserts\
        \ a **duplicate question** while advancing DB to `N+1`. → A Redis/DB divergence\
        \ induced by dual-write, made worse by the fixed TTL.\n- **Redis key expires\
        \ between `updateById` and the next `read`:** `requireAsking` then rehydrates\
        \ from DB `count=N` → `newCount=N+1`, which is actually consistent — i.e.\
        \ the TTL self-heal is *more* correct than the stale-but-present case. This\
        \ asymmetry is worth surfacing to the team: **presence-with-stale-data is\
        \ riskier than absence-then-rehydrate.**\n\n**Bottom line for continuation:**\
