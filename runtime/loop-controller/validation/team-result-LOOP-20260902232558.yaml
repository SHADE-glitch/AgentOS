      output: 'I analyzed `InterviewStateStore.java`, its consumer `InterviewService.java`,
        and the eviction/consistency semantics. Findings and full analysis below.


        ## Verdict on the supporting hypotheses


        The line ranges cited are all consistent with the defect and mutually reinforcing.
        As Database Engineer I confirm their *mechanism*; the runtime validation part
        (success_rate 0.50) I could only partially verify by static review — the code
        both self-heals and self-masks, so the real "break" is narrower than "idle
        24h ⇒ gone". Details below.


        ## 1. The mechanism (what the TTL actually does)


        `InterviewStateStore.java:51` writes with a **fixed, rolling TTL**, not a
        session lifetime:


        ```java

        redissonClient.getBucket(key(sessionId)).set(json, TTL_HOURS, TimeUnit.HOURS);
        // 24h from this write

        ```


        - Every `stateStore.write(...)` **restarts** the 24h clock (`set` overwrites
        TTL). `InterviewService` writes on `create`, on each `answer`/`answerStream`,
        and on `finishSession`.

        - So TTL is a **sliding inactivity window**, not an absolute durability bound.
        An actively-used session never expires; an idle mid-interview session silently
        expires after 24h of *no writes*.

        - Redis expires the key **silently** (lazy + periodic `activeExpireCycle`
        sampling) with no callback. `read()` at `InterviewStateStore.java:36-38` just
        sees `null` — there is no way to distinguish "never existed", "expired", or
        "evicted for memory."


        ## 2. When continuation breaks (and why)


        ### Case A — The masking path: idle >24h → self-heals (NOT a hard break)

        `requireAsking` (`InterviewService.java:380-399`) explicitly handles the null
        case by rebuilding `SessionState` from the DB:


        ```java

        state = new InterviewStateStore.SessionState(s.getStatus(), s.getQuestionCount(),
        s.getCurrentQuestionId());

        stateStore.write(sessionId, state);

        ```


        So for a plain idle expiry where DB is `ASKING`, continuation **works** —
        but it is fragile (see the mask consequences below).


        ### Case B — The real contamination: DB/Redis divergence is undetectable (HARD
        break)

        This is the strongest "why." Because `.set()` rewrites the whole JSON blob
        with **no version/generation counter**, and because there is a window where
        DB and Redis are not mutually up-to-date, there is no way to tell which source
        is newer:


        - In `answer()` the order is best-effort and not atomic across stores: DB
        update at `InterviewService.java:186` then Redis write at `:188`.

        - If a crash/pod-kill lands between the two, **DB is newer, Redis is stale-but-present**
        → `read()` returns non-null stale state → `newCount = state.questionCount()+1`
        at `:179/:254` **double-counts** and `currentQuestionId` is stale → user sees
        a duplicated/wrong question and count drift. The fixed TTL makes this permanently
        unrecoverable: neither store carries a revision to reconcile the dispute.


        ### Case C — Shared eviction pool: lock + state evicted together (HARD break,
        multi-node)

        The per-session lock lives in the same Redis namespace: `interview:lock:<id>`
        (`InterviewService.java:362`). Two failure sub-modes:


        1. **`maxmemory-policy=allkeys-lru`**: the *oldest-idle* keys — exactly the
        idle session''s state key **and** its lock key — are evicted together under
        memory pressure, so `tryLock(LOCK_WAIT_SECONDS)` at `:364` succeeds on two
        nodes simultaneously → concurrent `answer()` on the same session → duplicate
        questions and count corruption.

        2. **`volatile-lru` + TTL expiry**: when the state TTL lapses the lock''s
        own watchdog/lease also lapses on reboot, so the "serialized single-writer"
        guarantee vanishes exactly at the moment the state is least durable.


        ### Case D — TTL-restart masking semantics

        The fallback at `:389` rewrites Redis with a fresh 24h window. This means
        a **stagnant session can be kept alive indefinitely by a single probe**, hiding
        the fact that the intended "24h lifetime" invariant is meaningless. It''s
        a correctness-instrument, not a fix.


        ## 3. Why the current design is structurally unsafe


        The class comment (`InterviewStateStore.java:14-16`) declares Redis "单一权威来源
        / as the single source of truth." That claim is violated when:

        - TTL is fixed while DB is durable (DB outlives the SOT).

        - No generation/version field enables stale-reader detection.

        - State read/rebuild at `:389` is **non-atomic** with the lock acquisition
        (rebuild happens *inside* the lock in this code path, but nothing pins the
        DB row to the same logical revision as the evicted Redis value).

        - Eviction policy is not aligned with the namespace''s correctness requirements
        (locks should never share LRU pool with durable state buckets).


        ## 4. Recommendations (DBA orientation)


        1. **Reframe the source of truth.** Persist the full, authoritative `status/questionCount/currentQuestionId`
        in the DB `interview_session` row (already mostly there) and treat Redis as
        a **cache**, keyed by a DB `updatedAt`/`version` column. `requireAsking` should
        always reconcile against the DB revision, never trust Redis blindly.

        2. **Version, don''t blind-replace.** Add a `long version` to `SessionState`;
        write with a **Lua compare-and-set** (`version` must match else re-read) at
        `InterviewStateStore.java:48-51`, so a stale/divergent writer is rejected
        instead of silently overwriting.

        3. **Read-refresh with a cumulative cap.** Refresh TTL on *read* (not only
        write) to make it a true period-of-inactivity, but cap total lifetime so it
        cannot be indefinitely extended (Case D), or better: let DB `updatedAt` drive
        expiry.

        4. **Decouple lock durability.** Give `interview:lock:*` its own TTL/eviction
        safety (watchdog renew, non-LRU-protected, or move to a separate Redis logical
        DB / small dedicated instance) so memory pressure can''t remove the serialization
        guarantee (Case C).

        5. **Make expiry observable.** Use `keyspace notification`/`expired` events
        or a slow TTL-monitor (`pttl`) to alert when session state keys age; log a
        warning in `read()` when `json == null` and the DB row is `ASKING` so silent
        re-hydration is auditable.

        6. **Kill the crash hole (Case B).** Wrap DB update + Redis write in a single
        flow where the Redis write carries the DB''s `version`; if unsupported, at
        minimum flush/delete Redis before any "advance" so a crash leaves Redis empty
        (forces the DB fallback) rather than stale-valid.


        **Single root-cause sentence:** a *fixed, write-ordinated TTL* combined with
        *Redis-as-source-of-truth* and *versionless writes* silently evicts runtime
        state the durable DB still holds, and because staleness is indistinguishable
        from absence, continuation either self-heals via a non-atomic DB rebuild or
        hard-corrupts when the lock key shares the same eviction pool — so the real
        fix is to make the DB the revision source of truth and give Redis writes a
        versioned compare-and-set.'
