        \ before result delivery | `finishSession()` L340-359 |\n| 6 | Cross-source\
        \ counter: termination from messages, new count from Redis | `answer()`/`answerStream`\
        \ |\n\n---\n\n## 5. Recommending concrete fixes (ordered by leverage)\n\n\
        **Fix 1 — Sliding TTL (idle-based), not fixed.** The interview semantics are\
        \ *idle timeout*, so expiry should follow inactivity. In Redisson, refresh\
