        \ count. A retried/lost answer at the expiry boundary (client resends; the\
        \ previous response never committed) gets counted as answering the *next*\
        \ question — silence again, user \"continues\" one question ahead of their\
        \ own answers.\n\n---\n\n## 4. Root causes (design, not implementation typos)\n\
