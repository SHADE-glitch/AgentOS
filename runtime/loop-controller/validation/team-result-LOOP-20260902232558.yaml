        }\n```\n\nThis removes the \"re-open page after 24h\" shock entirely and shrinks\
        \ the silent gap. Add `lockWatchdogTimeout`/`idleSessionTimeout` awareness\
        \ so a 2h idle kill is actually *desired* if you later add a reaper.\n\n**Fix\
