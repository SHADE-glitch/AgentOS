    summary: '## Database Engineer — Lead Analysis: Redis fixed-TTL expiry vs. durable
      DB in `InterviewStateStore`


      ### Root cause at a glance


      `InterviewStateStore` holds the interview state machine in Redis under'
    output: "## Database Engineer — Lead Analysis: Redis fixed-TTL expiry vs. durable\
      \ DB in `InterviewStateStore`\n\n### Root cause at a glance\n\n`InterviewStateStore`\
      \ holds the interview state machine in Redis under key `interview:session:<id>`,\
      \ written with a **fixed, non-sliding TTL of 24h** every time `write()` runs\
      \ (`InterviewStateStore.java:25,51`):\n\n- **`read()` never touches the key's\
      \ TTL** — Redis TTL only refreshes *on write*, not on access. So an idle-but-still-open\
      \ session **can expire even while the DB row says `status=ASKING`**.\n- The\
      \ class Javadoc declares Redis the **\"单一权威来源\" (single source of truth)** (`InterviewStateStore.java:15`),\
      \ while the actual durable truth lives in `interview_session` (`status`, `question_count`,\
      \ `current_question_id` — all mirrored in `schema.sql:51-53`).\n- A Redis expiry\
      \ is **invisible to any component** (`read()` returns `null`, no error — `InterviewStateStore.java:36-39`).\
      \ Nothing knows the runtime state was lost.\n\nSo the mechanism is: **durable\
      \ DB remains valid, ephemeral runtime state silently vanishes, and every actor\
      \ that trusts the Redis key as authority diverges from DB reality.**\n\n###\
      \ The critical nuance: why continuation usually *doesn't* break\n\nThe code\
      \ contains a **lazy auto-rehabilitator** in `requireAsking()` (`InterviewService.java:380-398`):\n\
      \n```\nstate = stateStore.read(sessionId)\nif (state == null) {            \
      \     // ← Redis expired\n    s = sessionMapper.selectById(id)\n    state =\
      \ new SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId())\n\
      \    stateStore.write(sessionId, state)   // rehydrates from DB truth\n}\n```\n\
      \nBecause the three `SessionState` fields are **exactly mirrored** in the DB\
      \ and the DB is kept up to date on every `answer`/`finish` (`InterviewService.java:183-186,\
      \ 258-261, 341-344`), a clean 24h-expiry of an open `ASKING`/`START` session\
      \ is **self-healed**: the next `answer()` calls `requireAsking`, sees `null`,\
      \ rehydrates from a valid DB row, and continuation proceeds. `FINISHED` sessions\
      \ are also still blocked correctly (bootstrap reads `FINISHED` from DB → `INTERVIEW_FINISHED`).\n\
      \nA pure TTL expiry with a valid DB row is therefore **not** the breakage in\
      \ *this* codebase today. The real, demonstrable breaks come from the **ordering\
      \ and consistency windows** the fixed TTL exposes. Those are below.\n\n### When\
      \ and why continuation actually breaks — the concrete cases\n\n**1. Stale-unexpired\
      \ divergence (crash / pause window — the worst one, non-recovered).**\nEvery\
      \ mutable path does DB-update **then** Redis-write:\n- `answer`: DB update at\
      \ `InterviewService.java:186` → Redis write at `:188`\n- `finish`: DB update\
      \ at `:344` → Redis write at `:345`\n- `create`: DB insert→Redis→DB→Redis (`:87,91,114,116`)\n\
      \nIf the process dies (or a write throws) **between the DB update and the Redis\
      \ write**, the Redis key still holds the *previous* state and is **non-null**,\
      \ so `requireAsking` will **not** rehydrate. It returns a stale `questionCount`,\
      \ and line 254 computes `newCount = stale + 1`, drifting from the real DB-derived\
      \ history. This is a *silent, non-recovered* corruption — worse than expiry,\
      \ because the safety net is bypassed by a key that is alive-but-wrong. `write()`\
      \ re-wraps failures into `BizException` (`InterviewStateStore.java:52-55`),\
      \ but it does **not delete/invalidate** the stale Redis key, so the next attempt\
      \ keeps reading the stale value.\n\n**2. Fixed TTL + idle continuation (the\
      \ canonical break, latent here, fatal as the schema grows).**\nThe 24h TTL is\
      \ **not reset by reads** and is **absolute from the last write**. A user who\
      \ opens an interview and returns ~24h+ later (valid per the DB, which has no\
      \ idleness deadline) loses their runtime state. Today the mirror-in-DB masks\
      \ it; but the design's *contract* — Redis as source of truth (`:15`) — means\
      \ **any runtime-only field added to `SessionState` without a DB column silently\
      \ disappears on expiry**, and state-machine logic then computes on missing data\
      \ with no signal. Expiry + DB-valid is exactly the \"silent\" case: no exception,\
      \ no log, just a state jump.\n\n**3. `write()` failure silences nothing but\
      \ reintroduces stale reads.**\n`write()` logs and rethrows (`:52-55`). In `answer()`,\
      \ the Redis write is terminal; if it throws after the DB commit (`:186`), the\
      \ method aborts with `BizException` *after* DB state advanced — leaving the\
      \ DB and Redis inconsistent (case 1). The user retries, reads stale state, continues\
      \ on wrong data.\n\n### Verification of the supplied hypotheses (tested against\
      \ real code)\n\nAll five auto-bootstrapped hypotheses describe real, present\
      \ patterns in `InterviewStateStore.java`. They are **structure-valid but pattern-valid,\
      \ not the actual failure vector** — the TTL breakage is masked by the rehydration\
      \ path until the windows above:\n\n| Hypothesis | Code evidence | Assessment\
      \ |\n|---|---|---|\n| H-023 (−37-44) | `read()` JSON parse + null-warn fallback\
      \ | Valid pattern, *not* the break |\n| H-024 (−48-51) | `write()` try/catch\
      \ → log + rethrow BizException | **Feeds case 1** (leaves stale key) |\n| H-025\
      \ (−36-38) | `read()` `get()` null → return null | **This is the expiry symptom**\
      \ |\n| H-027 (−34-39) | `read()` full method (null/exception → null) | Valid\
      \ |\n| H-031 (−14-16) | \"single source of truth\" doc on Redis | **Core design\
      \ smell** — states Redis as authority over ephemeral store |\n\n### Recommendations\
      \ (Database Engineer)\n\n1. **Demote Redis to a fast-path cache; make the DB\
      \ the single source of truth.** Invert the doc at `InterviewStateStore.java:15`\
      \ and make rehydration from DB the *guaranteed* path, not a fallback. Do not\
      \ add runtime-only fields to `SessionState` without a DB column.\n\n2. **Slide\
      \ the TTL on read** as well as write. In `read()`, on a non-null hit, `bucket.set(json,\
      \ TTL_HOURS, TimeUnit.HOURS)` (or `expire()`). This makes the TTL a true *idle*\
      \ lease rather than an absolute deadline, directly fixing the canonical expiry\
      \ case.\n\n3. **Kill the stale key on write failure.** In `write()`'s catch,\
      \ `redissonClient.getBucket(key(sessionId)).delete()` before rethrowing, so\
      \ the next `requireAsking()` is forced to rehydrate from DB instead of reading\
      \ the stale-unexpired value (fixes case 1).\n\n4. **Make the transition atomic\
      \ / correctly ordered.** Options:\n   - Do the Redis write **first**, then the\
      \ DB update; on DB failure, delete the key so nothing reads the newer-but-uncommitted\
      \ state; **or**\n   - Put the Redis write inside the same `@Transactional` boundary\
      \ and delete-then-write in one unit so a crash can't leave DB-ahead-of-Redis.\n\
      \n5. **Derive `questionCount` from DB message history, not from runtime state.**\
      \ `askedQuestionIds` is already computed from `messageMapper` (`InterviewService.java:141-144`);\
      \ compute the count the same way so a stale `SessionState.questionCount` can\
      \ never shift `newCount`/`currentQuestionId` — removes the corruption surface\
      \ in case 1 entirely.\n\n6. **Guard Redis writes with a version/handle.** Store\
      \ `updatedAt` (from DB) inside `SessionState` and, in `write()`, **skip or fail\
      \ if the incoming version is older than the stored one** (compare-and-swap),\
      \ so a rehydrated-but-stale writer can't overwrite newer state and lengthen\
      \ the TTL on bad data.\n\n7. **Reconsider fixed TTL semantics** for async/streaming\
      \ continuation: either set TTL ≥ the allowed idle window (here `answerStream`\
      \ holds the socket 300s but the state survives *between* interactions), or use\
      \ a lease/heartbeat so long-running interviews never expire while the DB says\
      \ they're live.\n\n### Net conclusion\n\nThe fixed 24h TTL can silently expire\
      \ while the DB is valid, and because `read()` returns `null` on expiry the runtime\
      \ is silently dropped. In the *current* symmetric schema the break is mostly\
      \ masked by `requireAsking()`'s lazy DB rehydration — **so the proven breaks\
      \ are the crash/stale-window divergence (case 1) and any future Redis-only state\
      \ field (case 2), plus the general non-sliding TTL for idle sessions**. Long-term\
      \ fix is to stop treating an ephemeral key as the source of truth, slide the\
      \ lease on read, and make DB rehydration authoritative."
