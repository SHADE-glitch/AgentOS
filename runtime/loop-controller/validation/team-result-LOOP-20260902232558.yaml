        \ a consistent, non-terminal state.\n\n**Fix 5 — Guard reconstruction with\
        \ a version/comparison.** Add `updatedAt` to `SessionState`, or use Redisson\
        \ compare-and-set (`.compareAndSet`) so a rebuild can't clobber a newer state,\
        \ and assert `state.getQuestionCount() == messages-based count` before advancing\
