        \ to bound scoring fan-out hot reads.\n\n**Fix 3 — Stop the silent self-heal:\
        \ log + metric it.** Any `null` that triggers a rebuild must be a `WARN` and\
        \ a counter (`counter.increment(\"interview.state.rebuild\", ...`). Add a\
        \ `null`-with-existing-DB log in `requireAsking`. Silent expiry then becomes\
        \ visible in dashboards instead of undiagnosable.\n\n**Fix 4 — Ordering invariant:\
        \ never let Redis reach the terminal state before the durable payload exists.**\
        \ Reorder `finishSession` to persist `InterviewResult` (or enqueue via a **transactional\
