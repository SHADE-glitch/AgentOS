    output: "I'll address this as a Database/Cache Engineer. Let me diagnose the root\
      \ cause and failure modes precisely.\n\n## 目标\n\n- **业务目标**: Interview session\
      \ runtime state (current question, timer, answers in progress, turnstate) must\
      \ survive any user action that reads/writes it, and continuation must not silently\
      \ break mid-session.\n- **当前约束**: Runtime state lives in Redis with a fixed\
      \ TTL; authoritative candidate/to-database records live in the DB and outlive\
      \ the TTL.\n- **成功标准**: A session that is still logically active never loses\
      \ its runtime state; TTL expiry either cannot occur for active sessions or is\
      \ handled gracefully (recovery, not silent reset).\n\n## 问题判断\n\n### 根因\n\n\
      The root cause is a **state-lifetime mismatch**: two tiers holding related state\
      \ now have different lifespans.\n\n- **DB layer**: session row exists with `status\
      \ = 'in_progress'`, persists indefinitely until explicitly completed/cancelled.\n\
      - **Runtime layer (Redis)**: interview progress key has a **fixed, non-refreshing\
      \ TTL** (e.g. `SETEX session:1234 <payload> 3600`), so it self-destructs on\
      \ a wall-clock deadline regardless of activity.\n\nContinuation breaks when\
      \ **the Redis key expires while the DB session is still valid and the user's\
      \ next action requires the runtime payload**.\n\n### When it breaks — two concrete\
      \ scenarios\n\n**Scenario A — Long session outlives the fixed TTL (the most\
      \ common)**\nA coding/design interview runs longer than `TTL`. The candidate\
      \ answers Q3, the timer runs, the interviewer adds notes — total elapsed time\
      \ since session start exceeds the fixed TTL. Redis silently drops the key at\
      \ `start + TTL`. The DB still shows `in_progress`. The very next `getSessionRuntime(sessionId)`\
      \ returns `null`:\n- The user's next action (submit answer to Q4, end interview)\
      \ hits a \"session not found / expired\" path.\n- **Result**: user cannot continue\
      \ — progress lost, resumability broken. This looks like a bug because the DB\
      \ says the session is alive, but the runtime is gone.\n\n**Scenario B — TTL\
      \ shorter than the inactive gap between human actions**\nEven a moderate TTL\
      \ silently expires if the interviewer leaves the page open with no requests\
      \ for longer than the TTL (meeting, research, a long problem-reading gap). Redis\
      \ has no notion of the session being \"logically open\" in the DB — it only\
      \ knows the fixed wall-clock deadline. When the user returns and the callback\
      \ fires, the runtime state is gone.\n\n### Why it breaks (mechanism)\n\n1. **TTL\
      \ is fixed, not sliding.** The timer never resets on access (no read/write refresh).\
      \ Activity does not postpone expiry.\n2. **No heartbeat / renewal loop.** Nothing\
      \ calls `EXPIRE`/`PEXPIRE` to keep an *active* session alive.\n3. **Silent eviction.**\
      \ Redis does not notify the writer; `GET` of an expired key simply returns `null`.\
      \ The caller can't distinguish \"deprecated key\" from \"session never existed\"\
      \ unless it checks the DB.\n4. **Eviction policies compound it.** If memory\
      \ pressure triggers `noeviction`/`volatile-lru`/`volatile-ttl`, a volatile key\
      \ may be evicted even *before* its TTL — the DB session is still fully valid.\n\
      5. **DB and cache are not consistent.** The DB is authoritative for \"session\
      \ exists\", the cache is authoritative for \"runtime state\". Their lifespans\
      \ are not synchronized, so they drift apart. There is no tombstone, last-access\
      \ timestamp handshake, or expiry-aware read path that would reconcile them.\n\
      \n## 方案设计\n\n| 方案 | 机制 | 优点 | 缺点 |\n|---|---|---|---|\n| A. **Sliding/rolling\
      \ TTL (refresh on access)** | On every read/write of the runtime key, call `PEXPIRE`\
      \ to reset a window (e.g. 30min inactivity). | No background service; active\
      \ sessions effectively never expire; simple; matches \"session is open while\
      \ being used\". | A user who *pauses* but hasn't finished still loses state\
      \ after inactivity window (e.g. 1h gap → still breaks). Relies on every road\
      \ to touch the key hitting the refresh path. |\n| B. **Background heartbeat\
      \ / renewal** | A scheduler (cron, worker, in-process loop) periodically `PEXPIRE`s\
      \ the key while the DB session is `in_progress`. | Lifecycle truly driven by\
      \ DB state, not luck; survives inactivity; decouples \"active\" from \"recently-looked-at\"\
      . | Adds a service/loop and latency on state changes; must be consistent with\
      \ page close; more moving parts. |\n| C. **Lazy rehydration from DB** | On `null`\
      \ runtime, fetch authoritative progress from DB and rebuild Redis state; store\
      \ last-known runtime in DB on each milestone. | Self-healing — no silent break;\
      \ user always continues. | Requires runtime state to be persisted (or reconstructable)\
      \ in DB; more writes; more latency on first access after expiry. |\n| D. **Unified\
      \ record with TTL + last_activity column**, DB treated as the sole source of\
      \ truth. | Keep Redis as pure cache; expiration is harmless because DB rebuilds.\
      \ | Robust, simplest mental model. | Requires DB write path that is already\
      \ needed for audit anyway. |\n\n**Decision**: For an interview product, the\
      \ correct pattern is **B, or B+A combined**, with **C/D as the safety net**\
      \ — never bare fixed TTL (current state).\n\n- **Recommended: Sliding TTL (A)\
      \ + lazy rehydration (C), and treat TTL as an inactivity timeout, not a session\
      \ lifetime.**\n- Why: it matches the product semantics — \"a session is open\
      \ while it's being interacted with.\" Active interviews never break (each interaction\
      \ keeps the window alive). Inactivity is *supposed* to end a session eventually,\
      \ but expiry must be graceful, not a silent reset.\n- For hard \"keep-alive\
      \ regardless of human gap\" guarantees, add B (heartbeat keyed on DB `in_progress`).\n\
      - Risks: if you only do A, an active-but-idle-beyond-window session still breaks;\
      \ **mitigate by C** so a null read rehydrates from DB instead of failing.\n\n\
      ## 实施方案\n\n### 1. Store `last_access`/expiry semantics properly\n\nPrefer **sliding\
      \ TTL**: on every access, extend the window. Reserve the key an inactivity timeout,\
      \ not an absolute lifetime.\n\n```python\n# runtime_store.py\nSESSION_RUNTIME_INACTIVITY_TTL\
      \ = 30 * 60  # 30 min of inactivity, NOT hard lifetime\n\ndef touch(redis, session_id:\
      \ str) -> None:\n    \"\"\"Refresh the inactivity window. Call on every state\
      \ read/write.\"\"\"\n    redis.pexpire(_key(session_id), SESSION_RUNTIME_INACTIVITY_TTL\
      \ * 1000)\n\ndef read_runtime(redis, session_id: str) -> dict | None:\n    raw\
      \ = redis.get(_key(session_id))\n    if raw is not None:\n        touch(redis,\
      \ session_id)  # sliding window — active session stays alive\n    return json.loads(raw)\
      \ if raw else None\n```\n\nEnsure **all** runtime state transitions go through\
      \ a single touch-point (middleware / repository wrapper), so you can't-write\
      \ a code path that forgets the refresh.\n\n### 2. Never treat a cache miss as\
      \ a hard failure — rehydrate lazily from the DB\n\n```python\ndef get_session_runtime(session_id:\
      \ str) -> SessionRuntime:\n    cached = read_runtime(r, session_id)\n    if\
      \ cached is not None:\n        return SessionRuntime.from_dict(cached)\n\n \
      \   # Cache miss (expired or evicted). Session may still be valid in the DB.\n\
      \    row = db.get_active_session(session_id)  # SELECT ... WHERE id=? AND status='in_progress'\n\
      \    if row is None:\n        raise SessionNotActive()          # genuinely\
      \ gone → fail loudly\n\n    state = rebuild_runtime_from_db(row)   # last question,\
      \ answers, elapsed, etc.\n    write_runtime(r, session_id, state)    # repopulate\
      \ with a fresh window\n    return state\n```\n\nThis is the key fix: **expiry\
      \ becomes invisible to the user** because the DB is the source of truth and\
      \ the cache is disposable.\n\n### 3. (Optional, strongest) Heartbeat that keys\
      \ on DB state\n\nA scheduled job keeps the runtime alive *as long as the DB\
      \ says the session is active*, ignoring human gaps:\n\n```python\n# worker:\
      \ heartbeat.js (roughly every TTL/2)\nwhile (true) {\n  const active = await\
      \ db.query(\n    `SELECT id FROM interviews\n      WHERE status = 'in_progress'\n\
      \        AND updated_at > NOW() - INTERVAL '1 day'`);\n  for (const { id } of\
      \ active.rows) {\n    await redis.persist(`session:${id}`);   // or pexpire\
      \ long well beyond human gap\n    // Or better: await redis.pexpire(`session:${id}`,\
      \ VERY_LONG);\n  }\n  await sleep(heartbeatInterval);\n}\n```\n\n- **Concurrency\
      \ note**: recommend a **persistent type / key without aggressive expiry** plus\
      \ DB-driven lifecycle, i.e. run `EXPIRE` removal on explicit `close_session`,\
      \ so a \"completed\" interview frees memory deterministically instead of waiting\
      \ for TTL.\n\n### 4. Description of the TTL value\n\n- Rename mentally from\
      \ \"session lifetime\" → **\"inactivity window\"**. \n- A single hard TTL should\
      \ only bound the case \"nobody looked and we must reclaim.\" Even then deep\
      \ coupling to `in_progress` status should drive it.\n\n## 验证方式\n\n1. **Long-session\
      \ test**: open an interview, interact past the old fixed TTL (e.g. 45 min with\
      \ TTL 30). Expect older code: runtime lost. After fix: still alive, or (with\
      \ C) transparently rehydrated with identical progress.\n2. **Gap test** (Scenario\
      \ B): idle > TTL, then act. Expect null miss → DB rehydrate, no error page.\n\
      3. **Eviction test**: run Redis under memory pressure with `volatile-lru`; confirm\
      \ active sessions survive via sliding touch + DB rehydration; verify `maxmemory-policy`.\n\
      4. **Consistency test**: assert a cache miss never results in a *different*\
      \ resume point than the DB claims; assert no dangling `in_progress` with empty\
      \ runtime without a recovery log line.\n5. **Monitoring**: alert/error.log whenever\
      \ a runtime lookup goes DB-recovery path (count > 0 signals excessive expirations\
      \ → tuning signal for TTL). Log each rehydration with reason `expired|evicted`.\n\
      \n## 复盘建议\n\n- Fully fixed TTL is an anti-pattern here because it conflates\
      \ \"reclaim idle memory\" (a cache/policy concern) with \"is the session logically\
      \ complete\" (a business/DB concern). Separate them.\n- The DB must remain the\
      \ source of truth; Redis is a fast, **disposable** cache of runtime state.\n\
      - Make expiry observable: silently dropping state is the actual defect. Even\
      \ the correct answer should *log*, never silently reset.\n- Follow-ups: add\
      \ `last_activity` column for analytics/unfinished-session handling, and a cleanup\
      \ job that closes `in_progress` rows whose `last_activity` is very old, restoring\
      \ one source of truth.\n\n**Bottom line**: continuity breaks because the fixed\
      \ TTL measures *erapsed wall-clock time*, while \"valid\" is defined by *DB\
      \ lifecycle*. An active or merely-paused-but-unfinished session outlives that\
      \ clock, Redis silently drops its runtime key, and the next action misses. Fix\
      \ by turning TTL into a sliding inactivity window and making expiry a harmless,\
      \ logged rehydration path from the DB — with a heartbeat option whenever a session\
      \ must survive arbitrary inactivity."
