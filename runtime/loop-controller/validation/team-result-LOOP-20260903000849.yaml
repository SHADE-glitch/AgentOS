      output: "## Deliverable — lead review: Redis fixed-TTL silent expiry vs. durable\
        \ DB state\n\n### Source-of-truth contradiction (the core defect)\n\n`InterviewStateStore.java:27`\
        \ declares a fixed 24-hour TTL on **every** write:\n\n```java\nprivate static\
        \ final long TTL_HOURS = 24;\n...\nredissonClient.getBucket(key(sessionId)).set(json,\
        \ TTL_HOURS, TimeUnit.HOURS);\n```\n\nThe class comment (`InterviewStateStore.java:15`)\
        \ calls Redis *\"状态机的单一权威来源\"* (the single authoritative source for the state\
        \ machine). But the DB row in `interview_session`, plus the `interview_message`\
        \ rows, are permanent. So you have **two sources of truth with different,\
        \ un-related lifetimes**: the Redis key dies on a wall-clock deadline, the\
        \ DB does not. They can never be guaranteed in sync.\n\n### When the TTL fires\
        \ while the DB is still valid\n\n- It is a **fixed, non-renewing TTL** — it\
        \ counts from the *last state write*, not from *last user access*. It is **not**\
        \ a sliding/idle TTL (`read()` at `InterviewStateStore.java:34` never touches/extends\
        \ the key).\n- Any session opened more than 24h ago resetting nowhere later\
        \ (user paused, tab closed, SSE socket lost, research/reading between questions)\
        \ loses its Redis state, yet the DB row is still `status=ASKING`, `questionCount=2`,\
        \ `currentQuestionId=..., and all messages are intact.\n- Because every `answer()`/`create()`\
        \ call does reset the 24h, this is precisely a **long-idle-but-continuable**\
        \ session, plus any Redis eviction/memory-pressure/restart that drops keys\
        \ sooner than the TTL.\n\n### Why continuation breaks (concrete in this code)\n\
        \n`requireAsking()` (`InterviewService.java:380`) looks like it self-heals\
        \ — on a Redis miss it falls back to the DB, rebuilds `SessionState`, and\
        \ rewrites. That fallback masks the problem but does **not** remove it:\n\n\
        1. **`questionCount` for the *next* question is computed from Redis, not DB.**\n\
        \   `InterviewService.java:179` and `:254`:\n   ```java\n   int newCount =\
        \ state.questionCount() + 1;\n   ```\n   So the flow makes Redis state authoritative\
        \ for the continuation step. When the key expires, the fallback re-reads the\
        \ DB columns, which are a **lossy, non-atomic mirror**.\n\n2. **Redis and\
        \ DB writes are not atomic, so expiry can expose an older DB snapshot.**\n\
        \   In `answer()` the ordering is DB-first-then-Redis (`:186` update DB, `:188`\
        \ write Redis). If the process drops between the two (or anything fails),\
        \ the DB is stale relative to the latest transition that only ever existed\
        \ in Redis. Once the 24h TTL then expires the key, the fallback resurrects\
        \ the **old** `currentQuestionId`/`questionCount`. The user is shown/re-serves\
        \ a question that was already answered → **duplicate question**, drifting\
        \ numbering, and a continuation that no longer matches what actually happened.\n\
        \n3. **Runtime-only status is stored nowhere in the DB.**\n   `interview_session`\
        \ only carries `status / question_count / current_question_id`. The reserved\
        \ transient statuses in `InterviewStatus` (`WAITING_ANSWER`, `EVALUATING`,\
        \ `FOLLOW_UP`) plus any in-flight SSE/scoring state live purely in Redis or\
        \ in the virtual thread (`answerStream()`, `:197`). After expiry these cannot\
        \ be reconstructed from the DB, so a mid-transition continuation corrupts.\n\
        \n4. **The lock is Redis too.**\n   `lockFor()` uses `redissonClient.getLock(...)`\
        \ (`:362`). If the Redis key *or key space* is evicted/restarted, the serialization\
        \ guard is lost as well — two concurrent `answer()` calls can both pass `requireAsking`,\
        \ both compute `newCount`, and produce duplicated questions / double scoring.\n\
        \nMitigating factor worth stating: the finish decision (`shouldFinish`) is\
        \ computed from actual `interview_message` QA pairs (`:147`, `extractQAPairs`),\
        \ not from Redis — so the *termination boundary* is DB-truth-tolerant. The\
        \ breakage is concentrated in **continuation** (next-question selection, numbering,\
        \ `currentQuestionId`, transient status), not termination.\n\n### Recommendations\n\
        \n**Option A — Make Redis a pure cache of the authoritative DB, rebuild on\
        \ miss (cheap, robust).**\n- Remove reliance on Redis-only quantities. Derive\
