        \ in `read()` — return a sentinel (or throw) on parse failure instead of `null`,\
        \ so expiry (safe to reconstruct) is never conflated with data corruption\
        \ (must alert, do not overwrite silently).\n5. **Align lifecycles with a scheduled\
        \ job** (`@EnableScheduling`): expire `interview_session` rows stuck in non-terminal\
        \ state after a business timeout (e.g., 24h), and concurrently `stateStore.delete()`\
        \ unfinished keys. This reconciles DB and Redis TTL and stops ASKING-row accumulation.\n\
