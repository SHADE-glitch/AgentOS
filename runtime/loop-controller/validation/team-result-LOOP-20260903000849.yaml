        - `docker-compose.yml:24-37` — `redis:7-alpine`, no `requirepass`, no `maxmemory`/eviction\
        \ policy, default RDB snapshot persistence only.\n\n---\n\n## 1. Abstract\
        \ (the TL;DR for lead)\n\nRedis state is **not** the de-facto authority —\
        \ the DB is, because of the fallback in `requireAsking()`. So *plain idle\
        \ expiry does NOT break continuation*. The real failure is subtler and is\
        \ a **dual-source-of-truth** problem:\n\n> The fallback only runs when Redis\
        \ returns **null**. The moment Redis holds a **present-but-stale** value —\
        \ from a partial DB-write/Redis-write failure, eviction-then-lazy-rebuild\
        \ races, or a wrong trust decision on a non-null key — the fallback is skipped\
        \ and a **stale non-null value silently overrides valid DB state**.\n\nThat\
        \ is exactly the \"silently expires/diverges while the DB remains valid\"\
        \ class of bug. The fixed 24h TTL **worsens** it because it creates a long-lived\
        \ stale window in which no read ever self-corrects.\n\n---\n\n## 2. When continuation\
        \ breaks\n\n| Scenario | Redis | DB (still valid) | Effect on continuation\
        \ |\n|---|---|---|---|\n| **A. Idle >24h mid-question** | expired key | `ASKING`,\
        \ count=N, curQ=X | ✅ **OK** — `requireAsking` falls back to DB, rebuilds\
        \ |\n| **B. Partial write failure (DB ok, Redis write failed)** | **present\
        \ but STALE** (old count/Q) | `ASKING`, count=N+1, curQ=Y | ❌ **BREAKS — silent**\
        \ — fallback skipped (non-null), stale counter/currentQuestionId used, permanent\
        \ drift until 24h expiry. May even reject a valid transition. |\n| **C. Redis\
        \ eviction (memory pressure) or restart flush** | key gone | still valid |\
        \ ⚠️ Degraded but recoverable via fallback — unless fallback is removed or\
        \ DB row was the intermediate one |\n| **D. Stale `FINISHED` in Redis vs.\
        \ `ASKING` in DB** | `FINISHED` | `ASKING` | ❌ **BREAKS** — `requireAsking`\
        \ throws `INTERVIEW_FINISHED`, user cannot continue even though DB says still\
        \ in-progress |\n\n**The concrete \"when\":**\n- **B** — whenever `stateStore.write()`\
        \ fails *after* `sessionMapper.updateById()` succeeded, and the previous Redis\
        \ value is still present (not expired). Because `read()` returns non-null,\
        \ the `null`-only fallback is never invoked.\n- **C** — Redis restarted without\
        \ persistence, or `maxmemory` eviction with an eviction policy that can target\
        \ volatile keys before their TTL.\n- **A→damage amplifier** — The 24h fixed\
        \ TTL does not alone break things (fallback), but it determines **how long\
        \ a stale value from B stays \"truthy\"**. 24h of silent divergence is the\
        \ real availability/integrity cost.\n\n---\n\n## 3. Why it happens (root cause\
        \ chain)\n\n1. **Fixed *absolute* TTL, refreshed only on transitions.** `write()`\
        \ sets `expire=now+24h`. `read()` never resets it. So the runtime state of\
        \ a session that pauses (reading a question) expires 24h after the *last*\
        \ transition, not on resumption.\n\n2. **DB updated first, Redis second, non-atomically.**\
        \ Every `answer()`/`answerStream()` pipeline is: `updateById(DB)` → `stateStore.write(Redis)`.\
        \ If Redis throws, the DB advances and Redis lags — with a *present* stale\
        \ value.\n\n3. **Fallback is keyed on `== null` only.** `InterviewService.java:382`\
        \ `if (state == null)` rehydrates from DB. It cannot detect \"non-null but\
        \ stale\". Stale wins.\n\n4. **Documented single authority is false.** `InterviewStateStore.java:14-15`\
        \ claims Redis is \"单一权威来源\" (single authoritative source). In reality, anything\
        \ with Redis access can `DEL`/`FLUSHDB` a key and the app silently re-reads\
        \ from DB — and conversely a stale key overrides DB. So Redis is neither a\
        \ strong cache nor a strong authority; it's a **weak, occasionally-wrong cache**\
        \ propped up by a DB read path.\n\n5. **Redis lifecycle is not hardened**\
        \ (deployment): no `requirepass`, no `maxmemory-policy`, only default RDB\
        \ snapshots. A container restart (or eviction) widens the expiry window and\
        \ re-routes traffic through the fallback — surfacing any latency and any B-style\
        \ staleness.\n\n---\n\n## 4. Recommendations\n\n### 4.1 Core fix — eliminate\
        \ the stale-presence hazard (highest priority)\n\nOn Redis **write failure,\
        \ delete the key** so the next read is forced to rebuild from DB, instead\
        \ of leaving a stale value that beats the DB:\n\n```java\npublic void write(Long\
        \ sessionId, SessionState state) {\n    try {\n        redissonClient.getBucket(key(sessionId)).set(json,\
        \ TTL_HOURS, TimeUnit.HOURS);\n    } catch (Exception e) {\n        log.error(\"\
        write session state failed, sessionId={}: {}\", sessionId, e.getMessage());\n\
        \        try { redissonClient.getBucket(key(sessionId)).delete(); } catch\
        \ (Exception ignored) {}\n        throw new BizException(ResultCode.INTERNAL_ERROR,\
        \ \"会话状态写入失败\");\n    }\n}\n```\n\n### 4.2 Make DB the authority; treat Redis\
        \ as a strictly-volatile fast-path cache\n\nAdd validation so a non-null Redis\
        \ value is only trusted when it matches DB; otherwise rebuild from DB and\
        \ rewrite:\n\n```java\nprivate InterviewStateStore.SessionState requireAsking(Long\
        \ sessionId) {\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
        \    if (s == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
        \n    InterviewStateStore.SessionState state = stateStore.read(sessionId);\n\
        \    InterviewStateStore.SessionState dbState =\n        new InterviewStateStore.SessionState(s.getStatus(),\
        \ s.getQuestionCount(), s.getCurrentQuestionId());\n\n    // Rebuild-on-miss\
        \ OR detect stale non-null value that diverges from DB truth.\n    if (state\
        \ == null || !state.status().equals(s.getStatus())\n            || state.questionCount()\
        \ != s.getQuestionCount()\n            || !equalIds(state.currentQuestionId(),\
        \ s.getCurrentQuestionId())) {\n        state = dbState;\n        stateStore.write(sessionId,\
        \ state);\n    }\n    // ... unchanged status guards\n}\n```\n\nThis converts\
        \ Redis from \"authority\" to \"authority is DB, cache is disposable\" — the\
        \ only consistent model given the existing fallback.\n\n### 4.3 Cross-check\
        \ `FINISHED` against DB before rejecting continuation\n\nA stale `FINISHED`\
        \ in Redis must not permanently lock a user out of an in-progress session.\
        \ When the read returns `FINISHED` and the DB row says otherwise, rebuild\
        \ and continue:\n\n```java\nif (InterviewStatus.FINISHED.name().equals(state.status()))\
        \ {\n    if (InterviewStatus.FINISHED.name().equals(s.getStatus())) {\n  \
        \      throw new BizException(ResultCode.INTERVIEW_FINISHED);\n    }\n   \
        \ stateStore.delete(sessionId);          // stale FINISHED; force rebuild\n\
        \    return requireAsking(sessionId);\n}\n```\n\n### 4.4 Shorten and slide\
        \ the TTL\n\n24h is far too long for a *runtime continuation token* that is\
        \ fully recoverable from DB. A short sliding TTL makes self-correction fast\
        \ and bounds the stale window (Scenario B is only \"silent\" for as long as\
        \ the stale value lives):\n\n```java\n// TTL refreshed whenever we read-and-rebuild\
        \ is clean; use a short absolute TTL\nprivate static final long TTL_MINUTES\
        \ = 30;\nset(json, TTL_MINUTES, TimeUnit.MINUTES);   // in write()\n// optional:\
        \ on a trusted read(), PEXPIRE to slide it\n```\n\n30 minutes is reflexive\
        \ for an in-flight interview while still tolerant of long pauses (because\
        \ 4.2 rebuilds cleanly).\n\n### 4.5 Harden Redis lifecycle (availability +\
        \ integrity)\n\n`docker-compose.yml` → `services.redis`:\n```yaml\ncommand:\n\
        \  - redis-server\n  - --requirepass\n  - ${REDIS_PASSWORD}\n  - --maxmemory\n\
        \  - 512mb\n  - --maxmemory-policy\n  - volatile-lru        # prefer evicting\
        \ keys with TTL (our session state) BEFORE no-TTL data\n  - --appendonly\n\
        \  - \"yes\"\n```\n- `appendonly yes` → a restart doesn't wipe in-flight runtime\
        \ state (removes Scenario C worst case).\n- `volatile-lru` → genuinely volatile\
        \ keys are evicted first; protects long-lived non-session keys.\n- `requirepass`\
        \ + no public port exposure → prevents any Redis-side `DEL`/`FLUSHDB` from\
        \ forcing mass silent reconstruction (an integrity/availability boundary).\n\
        - Wire password into the Redisson client config / `.env`; never commit it.\n\
        \n### 4.6 Observability (fail loud, don't fail silent)\n\nMake the silent\
        \ path visible:\n- Count fallback rebuilds: `read()==null && db valid` or\
        \ the divergence branch in 4.2 → log + metric.\n- Alert when rebuild/divergence\
        \ rate rises — it is the primary signal that Redis is decaying (evictions,\
        \ restarts, write failures).\n- Expose drift: sessions where `db.questionCount\
        \ != redis.questionCount` while non-expired.\n\n---\n\n## 5. Decision summary\
        \ (for lead)\n\n- **Single-source model:** DB is authoritative; Redis is a\
        \ disposable fast-path cache rebuilt on any miss **or** any mismatch (4.2).\
        \ This is the only model consistent with the existing `null`-fallback and\
        \ it eliminates stale-overrides-DB.\n- **Accepted trade-offs:** every request\
        \ now touches DB (`selectById`). For a single-user interview this is negligible;\
        \ if scale demands it, cache the DB row with its own short TTL rather than\
        \ trusting Redis blindly.\n- **Risks remaining:**\n  - Redis total outage\
        \ ⇒ all writes/rebuilds fail at `stateStore.write`; requests error out (degraded\
        \ availability, not silent corrupt). Mitigate with 4.1 delete-on-failure +\
        \ 4.5 durability + retry.\n  - The 4.2 rebuild read+write on every request\
        \ adds DB + Redis round-trips; acceptable here.\n  - `FINISHED` freshness\
        \ is authoritatively DB after 4.3, so double-answer after a genuine finish\
        \ is still guarded by the DB `status` check.\n\n**Bottom line for the bug\
        \ report:** the bug isn't \"TTL expires → lose continuation\" (the fallback\
        \ already prevents that). It's *\"a stale, non-null Redis value silently overrides\
        \ valid DB state, and the fixed long TTL keeps that stale value authoritative\
        \ for up to 24h.\"* Fix by deleting key on write-failure, validating Redis\
        \ against DB before trust, short sliding TTL, DB cross-check before `FINISHED`\
        \ rejection, and Redis lifecycle/durability hardening."
