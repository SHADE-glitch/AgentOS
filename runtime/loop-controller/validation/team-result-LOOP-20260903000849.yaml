      output: "# Interview Session Redis TTL: Silent Expiry vs. DB Validity\n\n##\
        \ 1. Roles of the two stores (evidence from code)\n\n| Concern | Redis (`InterviewStateStore.java`)\
        \ | MySQL (DB) |\n|---|---|---|\n| What's stored | `SessionState(status, questionCount,\
        \ currentQuestionId)` — flow memento `interview:session:<id>` | `interview_session`\
        \ row + append-only `interview_message` log + `interview_result` |\n| TTL\
        \ | **Fixed 24 h**, re-set on every `write()` (`InterviewStateStore.java:51`)\
        \ | None (persistent) — author of truth |\n| Authority in code | Comment claims\
        \ \"单一权威来源\" (single authoritative source), `InterviewStateStore.java:16`\
        \ | Only a fallback used when the key is missing (`InterviewService.java:380-389`)\
        \ |\n\nThe three memento fields all *do* have mirrored columns in `interview_session`\
        \ (`status`, `currentQuestionId`, `questionCount`), so the fallback *can*\
        \ theoretically reconstruct the aggregate — but nothing more. That is the\
        \ heart of the bug class below.\n\n---\n\n## 2. When does the key expire while\
        \ the DB stays valid?\n\n`stateStore.write()` re-arms TTL to 24 h on **every**\
        \ write. So a fixed TTL only expires if Redis state is *not rewritten* for\
        \ 24 h. Concrete triggers:\n\n1. **Genuine inactivity >24 h** — a candidate\
        \ pauses mid-`ASKING` and returns later. DB row is still live and valid; the\
        \ Redis memento is gone.\n2. **Server eviction** — the client sets no `maxmemory-policy`\
        \ (`RedissonConfig.java`); if the Redis server runs `volatile-lru`/`allkeys-lru`/`volatile-ttl`,\
        \ any key can be evicted under memory pressure well before 24 h regardless\
        \ of business validity (`AllKeysLRU` even evicts *persisted* keys). This is\
        \ the classic \"silently while DB is valid\" case.\n3. **Redis restart / `FLUSHDB`\
        \ / failover to empty slave** — all mementos vanish; DB untouched.\n4. **Write-path\
        \ failure after the DB write** — the commit window below.\n\nCritical detail:\
        \ because TTL is **absolute, not sliding**, reads never refresh it. The sole\
        \ refresh point is `stateStore.write()` inside `answer()`/`create()`/`finishSession()`.\
        \ Any consumer that only *reads* state (detail view, re-render) does not extend\
        \ life.\n\n---\n\n## 3. Why continuation breaks (the mechanism)\n\n### 3.1\
        \ The fallback only heals when the key is *missing*, not when it's *stale*\n\
        \n`requireAsking()` (`InterviewService.java:380-389`) triggers DB reconstruction\
        \ **only** when `stateStore.read(id) == null`, i.e. expiry. If the key is\
        \ *present but outdated*, the stale memento is used as if authoritative. So\
        \ the DB-true position can be ignored silently.\n\n### 3.2 Non-atomic dual-write\
        \ → a one-message divergence window\n\nIn `answer()` the DB and Redis are\
        \ written in two separate, non-atomic steps:\n\n```\nsaveUserMessage(DB) \
        \                // insert answer\nsaveAiMessage(DB)                   //\
        \ insert next question   <- DB advanced\nsessionMapper.updateById(DB)    \
        \    // questionCount=+1, currentQuestionId=new\nstateStore.write(Redis, ASKING)\
        \     // <- Redis advanced (same values)\n```\n\nA crash/exception between\
        \ the DB commit and the Redis `write` (e.g. Redisson `set` throwing) leaves:\n\
        - **DB**: question inserted, `question_count` = N+1, `current_question_id`\
        \ = new id.\n- **Redis**: still `questionCount=N`, `currentQuestionId=old`,\
        \ **key present**.\n\nBecause the key has not expired, the `state == null`\
        \ fallback never runs. The next `answer()` continues from the *stale* memento\
        \ (`state.questionCount()+1` → `InterviewService.java:179`), and `currentQuestionId`\
        \ points at the previous question. The UI shows a wrong/duplicate \"current\
        \ question\", scoring can double-count a question, and `shouldFinish(qaPairs)`\
        \ no longer matches the memento count — **continuation silently breaks**.\n\
        \n### 3.3 Expiry + partial mirroring yields an incomplete state, not a full\
        \ one\n\nWhen the key genuinely expires, the fallback rebuilds `SessionState`\
        \ from the DB aggregate columns. Those columns are **denormalized copies written\
        \ in the same non-atomic window** (3.2). They are therefore a *lagging duplicate*,\
        \ not a full source of truth. The only authoritative, append-only truth is\
        \ `interview_message`, which the fallback ignores. Consequences:\n\n- Any\
        \ in-Redis-only memento (e.g. a `WAITING_ANSWER`/`EVALUATING` in-flight sub-step\
        \ that the DB row never persisted) is silently lost on expiry, so the state\
        \ machine \"skips\" back to whatever the aggregate says.\n- `currentQuestionId`\
        \ recovered from the DB column can be stale relative to the latest message\
        \ in the log if step `updateById` hadn't run.\n\n### 3.4 Atomicity mismatch\
        \ with the lock, not with the TTL\n\nThe `interview:lock:<id>` Redisson lock\
        \ guards *concurrency within the pod* but is a **lock on the log**, not on\
        \ expiry. Expiry/eviction is driven by Redis server memory/time, independent\
        \ of whether the lock is held. So a long-lived `answerStream` (SSE, 5 min)\
        \ is not what expires the key — but it is exactly the kind of slow live session\
        \ that a 24 h *absolute* TTL can mis-handle when combined with gaps.\n\n---\n\
        \n## 4. Concrete \"when → breaks\" matrix\n\n| Scenario | Redis state | DB\
        \ state | Continuation behavior |\n|---|---|---|---|\n| Inactive >24 h, DB\
        \ `ASKING` | expired (null) | valid `ASKING`, mirrored | self-heals via fallback\
        \ — OK *only if* mirror is accurate |\n| Redis evicted under memory pressure\
        \ | expired | valid | same as above; but note `allkeys-lru` also evicts *unexpired*\
        \ keys, shortening the window |\n| Redis restart/flush | all expired | valid\
        \ | recovers from DB, but **loses any Redis-only flow sub-state** |\n| Crash\
        \ between DB commit and Redis write | **present but stale** | one message\
        \ ahead | **silently wrong** — no fallback, continues from stale memento |\n\
        | Redis write throws (Redis down on write) | stale/absent | valid | broken\
        \ or partial; SDK may not throw, amplifying 3.2 |\n\nThe most insidious row\
        \ is the second-to-last: it breaks *without* expiry, because the design equates\
        \ \"key exists\" with \"key is true.\"\n\n---\n\n## 5. Recommendations\n\n\
        ### A. Make DB the source of truth; make Redis a pure read-through cache\n\
        - `answer()` should compute the next state from DB (`interview_message`) under\
        \ the lock, **then** write Redis as a cache, not as the authority. Drop the\
        \ comment at `InterviewStateStore.java:16`.\n- `requireAsking()` should be\
        \ renamed/logged as a **read-through/reconstruction** (cache miss → DB), and\
        \ should log every reconstruction with a WARN so silent healings are observable:\
        \ `SessionState cached = ...; if (cached==null) log.warn(\"state cache miss\
        \ session={}, reconstructing from DB\", id)`.\n\n### B. Persist the full memento,\
        \ atomically with the session row\nPut the JSON memento into the DB so the\
        \ fallback is complete and single-sourced:\n\n```sql\nALTER TABLE interview_session\
        \ ADD COLUMN state_json JSON NULL;\n```\n\nWrite `state_json`, `question_count`,\
        \ `current_question_id`, `status` in the **same MyBatis `updateById`** that\
        \ `answer()` already performs, then update Redis. This makes DB the atomic\
        \ commit point; Redis becomes disposable. Redis write becomes `try/catch +\
        \ log` (no longer throws `INTERNAL_ERROR` on cache failure — `InterviewStateStore.java:53-55`\
        \ is over-strict for a cache).\n\n### C. If Redis must remain authoritative,\
        \ fix the two defects\n1. **Detect staleness, not just absence** — store a\
        \ monotonically increasing `version` in the memento and in the DB row; in\
        \ `requireAsking()`, if `redis.version < db.version` (or a `updatedAt` logic-clock\
        \ mismatch), rebuild from DB. This closes the 3.2 window.\n2. **Prefer sliding\
        \ renewal** instead of (or in addition to) the absolute TTL — e.g. refresh\
        \ on any touch of the session so a live-but-idle interview does not die at\
        \ the 24 h wall:\n   ```java\n   RBucket<String> b = redissonClient.getBucket(key(id));\n\
        \   b.set(json, 24, TimeUnit.HOURS);          // write-through\n   // and\
        \ on reads, optionally: b.expireAsync(24, TimeUnit.HOURS)  // sliding refresh\n\
        \   ```\n\n### D. Configuration\n- Set an explicit eviction policy that does\
        \ not treat business data as disposable: `maxmemory-policy volatile-ttl` or\
        \ `allkeys-lru`, and size Redis so interview keys are never evicted. Better:\
        \ keep only cache keys volatile and persist the memento (B) so no key is business-critical.\n\
        - Move the 24 h constant to configurable property (`interview.session.ttl`)\
        \ so expiry is a reviewed decision, not a magic constant.\n- Add observability:\
        \ `INFO` on cache-miss-with-DB-ASKING (count as \"expired-but-recoverable\"\
        ); `WARN` on version-drift (data corruption signal). These are the metric\
        \ that tells you how often silent expiry actually bites in production.\n\n\
        ---\n\n## 6. Bottom line\nWith the current fixed 24 h TTL and DB-only-as-fallback\
        \ design, **continuation breaks in two distinct ways**: (1) genuinely active\
        \ sessions are silently mis-continued when the key is evicted/flushed and\
        \ real state existed only in the Redis memento; and (2) more dangerously,\
        \ a non-expired-but-stale key from the non-atomic DB→Redis write window is\
        \ trusted as truth, so the interview continues from a wrong `questionCount`/`currentQuestionId`\
        \ while the DB and message log are valid. The robust fix is to invert the\
        \ dependency — DB row + `interview_message` as the atomic source of truth\
        \ (optionally with a persisted `state_json` column), Redis demoted to an expendable,\
        \ logging, read-through cache — plus version-based staleness detection rather\
        \ than presence-based."
