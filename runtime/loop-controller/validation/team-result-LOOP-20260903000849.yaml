        \ the DB write it mirrored) is trusted over the fresher DB. If DB moved to\
        \ `FINISHED` but the still-alive Redis key says `ASKING`, `requireAsking`\
        \ will **accept an answer on a finished session** and re-run scoring → duplicate\
        \ `interview_result` rows, double MQ scoring messages, inconsistent dashboard.\
