        \ the divergence — i.e., **correctness depends on Redis TTL timing**, not\
        \ on data.\n- A **corrupt (not expired)** value is silently treated as \"\
        expired\", discarded, and overwritten with the DB reconstruction — the only\
        \ record of divergence is a `log.warn`, no metric, no alert.\n\nThis is the\
        \ concrete \"when it breaks\": not at steady-state idle expiry (guarded by\
        \ the fallback), but in the **divergence window** between a DB-first write\
        \ and its mirrored Redis write, and in the corrupt-state case.\n\n## Finding\
        \ 3 — Lifecycle divergence / missing reconciliation\n- DB: no session timeout,\
        \ no cleanup job (`grep` for `@Scheduled`/`@EnableScheduling` → **none**).\
        \ `interview_session` rows stay `ASKING` forever; nothing ever expires them.\n\
        - Redis: hard 24h cap, refreshed only on `write()`.\n\nResult: over time the\
        \ same session row exists in an eternal `ASKING` DB state while its Redis\
        \ mirror is repeatedly evicted. The system depends on the fallback at every\
        \ future resume, and DB garbage (orphaned `ASKING` rows) accumulates. There\
        \ is no alignment between the two lifecycle managers, so \"DB valid / Redis\
        \ expired\" is the *permanent* steady state of every idle session, not an\
        \ edge case.\n\n## Finding 4 — TTL strategy is fixed-from-last-write, not\
        \ sliding\n`InterviewStateStore.java:51`:\n```java\nredissonClient.getBucket(key).set(json,\
