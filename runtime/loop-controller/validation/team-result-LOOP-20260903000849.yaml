      summary: '# Database Engineer — Review: Redis Runtime State Silent Expiry During
        a Valid DB Session


        ## 1. Verdict


        The expiry doesn''t cleanly "break" the happy path **today**, because `InterviewStateStore.read'
      output: "# Database Engineer — Review: Redis Runtime State Silent Expiry During\
        \ a Valid DB Session\n\n## 1. Verdict\n\nThe expiry doesn't cleanly \"break\"\
        \ the happy path **today**, because `InterviewStateStore.read()` returning\
        \ `null` is already handled by a DB rehydration fallback in `InterviewService.requireAsking()`\
        \ (InterviewService.java:380-399). **But** the design is fragile by construction\
        \ and actually *will* break continuation in several real conditions because:\n\
        \n- Redis is declared the **single authoritative source** for the state machine\
        \ (InterviewStateStore.java:15) while being given a **short, fixed, non-sliding\
        \ TTL** with no durability contract.\n- The fallback only rehydrates a *lossy\
        \ mirror* (`status, questionCount, currentQuestionId`). Any runtime state\
        \ wider than those three fields is silently destroyed.\n- `maxmemory` eviction\
        \ and the 24h fixed window make expiry timing **nondeterministic**, so a session\
        \ that \"just answered an hour ago\" can still be gone — the fallback masks\
        \ it, which is itself a product bug (silent rewind/reset).\n\nThe core problem\
        \ is **ownership mismatch**: durable truth (DB) is volitionally durable; volatile\
        \ truth (Redis) is authoritative. You cannot be authoritative and ephemeral\
        \ at the same time without a strict rebuild contract.\n\n---\n\n## 2. Current\
        \ Implementation Facts\n\n| Aspect | Where | Implication |\n|---|---|---|\n\
        | Fixed TTL | `InterviewStateStore.WriteStateStore.java:25,51` — `TTL_HOURS=24`,\
        \ `set(json, 24, HOURS)` | Every write resets to **now + 24h**; this is last-write\
        \ + 24h, *not* sliding, *not* lifecycle-driven |\n| Authoritative claim |\
        \ InterviewStateStore.java:15 | Redis treated as source of truth |\n| DB write\
        \ **before** Redis | InterviewService.java:114→116, 186→188, 341→345 | DB\
        \ is always ≥ Redis in durability; divergence = dropped transition, never\
        \ an extra one |\n| Fallback rebuild | InterviewService.java:381-389 | On\
        \ `null`, rehydrates from `InterviewSession` row and **rewrites with a fresh\
        \ 24h TTL** |\n| Distributed lock | InterviewService.java:361-372 | Serializes\
        \ per-session, so the fallback+rewrite is race-safe today |\n\nBecause each\
        \ transition does `sessionMapper.updateById` **then** `stateStore.write`,\
        \ a missing Redis key resolves to the DB row — so the fallback is currently\
        \ self-healing for the three mirrored fields.\n\n---\n\n## 3. When Continuation\
        \ Breaks (and Why)\n\n### A. Runtime state is wider than the DB mirror — **hard\
        \ break today**\n`SessionState` (InterviewStateStore.java:27) holds only `status`,\
        \ `questionCount`, `currentQuestionId`. The state machine enum (InterviewStatus.java)\
        \ already defines `WAITING_ANSWER`, `EVALUATING`, `FOLLOW_UP` — the moment\
        \ any such transient context (in-flight tool call, pending follow-up prompt,\
        \ candidate's last partial answer, chosen difficulty drift) is stored in Redis\
        \ and **not** in `InterviewSession`, TTL expiry irreversibly deletes it. The\
        \ fallback rebuilds a stale-but-\"valid\" state, and continuation continues\
        \ from the wrong point **silently**.\n\nThis is the canonical \"Redis expired,\
        \ DB valid, continuation broke\" case: the DB says *ASKING*, but the interview-resume\
        \ cursor context that existed in Redis is unrecoverable.\n\n### B. Expiry\
        \ is not aligned with a \"continuation window\" — **unpredictable timing**\n\
        Fixed `24h` last-write TTL is far too long to be a *session* budget and far\
        \ too short to imply *durability*. Two failure shapes:\n\n- A user pauses\
        \ an interview (opens it, leaves it) and returns after >24h → key gone even\
        \ though DB is mid-`ASKING`. Rebuild masks it (extra DB read) but any observer\
        \ relying on Redis presence (`health`, tracing, cross-node routing) sees a\
        \ phantom \"not running\" session.\n- Redis keeps being refreshed only because\
        \ every answer re-writes it — that's **incidental refresh, not designed sliding\
        \ TTL**. If an answer takes >24h (long-form/candidate copy-paste), or the\
        \ TTL constant is later lowered, the interview dies mid-answer.\n\n### C.\
        \ `maxmemory` eviction — **the true \"silent\" killer**\nThis is the one that\
        \ breaks the happy path in production without ever reaching TTL. If Redis\
        \ is configured with a volatile eviction policy (`allkeys-lru`, `volatile-lru`,\
        \ `allkeys-random`) and memory pressure rises, the `interview:session:*` key\
        \ is evicted **before** 24h, on a nondeterministic schedule, with no log at\
        \ the Redis layer. The fallback rehydrates, but because eviction is opaque,\
        \ capacity problems hide until a session that should be resumable is not.\n\
        \n### D. Redis restart / FLUSHDB / failover\nA restart or `FLUSHALL` deletes\
        \ keys *unconditionally* — no TTL math at all. DB rows remain valid and listable\
        \ via `listByUser` (InterviewService.java:283-289), so the UI shows a live/in-progress\
        \ interview whose runtime state is gone. Continuation then depends entirely\
        \ on the fallback's rebuild fidelity (See A).\n\n### E. Divergence is currently\
        \ masked, not fixed\nWhen the fallback fires (InterviewService.java:388-389)\
        \ it rewrites the key with a fresh fixed 24h TTL. This does not correct the\
        \ *root cause*; it just re-synchronizes the three mirrored fields and resets\
        \ the expiration clock. Crucially, **the fallback does not re-snapshot DB\
        \ after Redis `write` fails** — a Redis failure inside `stateStore.write`\
        \ throws `INTERNAL_ERROR` (InterviewStateStore.java:53-55) *after* the DB\
        \ row was already advanced, so the in-flight request fails even though the\
        \ DB is perfectly consistent. That's a continuation break that isn't about\
        \ TTL at all, but is the same class of DB-valid / runtime-gone divergence.\n\
        \n---\n\n## 4. Recommendations\n\n### R1. Demote Redis to a pure cache; DB\
        \ owns durable truth\nThe comment at InterviewStateStore.java:15 (\"单一权威来源\"\
        ) is the bug's seed. Make the semantics explicit: **Redis is a volatile, rebuildable\
        \ acceleration layer; DB is the authoritative, durable state**. Document it\
        \ and make the fallback the designed first-class recovery path, not an afterthought.\n\
        \n### R2. Make TTL sliding and lifecycle-driven, not fixed\nRefresh on every\
        \ meaningful transition and bound it to the actual continuation window:\n\n\
        ```java\n// InterviewStateStore.java\nprivate static final long IDLE_TTL_MINUTES\
        \ = 30;   // a resumable session budget\nprivate static final long POST_FINISH_RETENTION_SECONDS\
        \ = 60;\n\npublic void write(Long sessionId, SessionState state) {\n    RBucket<String>\
        \ b = redissonClient.getBucket(key(sessionId));\n    String json = toJson(state);\n\
        \    if (InterviewStatus.FINISHED.name().equals(state.status())) {\n     \
        \   b.set(json, POST_FINISH_RETENTION_SECONDS, TimeUnit.SECONDS); // short\
        \ retention, then gone\n    } else {\n        b.set(json, IDLE_TTL_MINUTES,\
        \ TimeUnit.MINUTES);              // sliding on each answer\n    }\n}\n```\n\
        \n- **On FINISH**: drop retention to seconds and let the key vanish *by design*;\
        \ `detail`/`result` no longer need Redis.\n- **During ASKING**: keep the TTL\
        \ short and sliding so Redis presence == \"actively resumable now\", never\
        \ longer than a plausible break.\n- Add `expire` refresh in `requireAsking`\
        \ so a rebuild also slides the window.\n\n### R3. Make the fallback lossless\
        \ — every Redis field must have a DB mirror\nExtend the mirror so rehydration\
        \ is faithful, not lossy:\n\n```java\npublic record SessionState(String status,\
        \ int questionCount, Long currentQuestionId,\n                           String\
        \ pendingKind, String pendingRef) { }\n```\n\n…and persist `pendingKind/pendingRef`\
        \ on `InterviewSession` via `sessionMapper.updateById` at the same transition.\
        \ Then `requireAsking`'s rebuild (InterviewService.java:383-389) restores\
        \ *everything*, and TTL expiry becomes fully (not partially) transparent.\n\
        \n### R4. Add a version/divergence check instead of blind rebuild\nStore a\
        \ monotonic transition counter in both DB and Redis; on read, if Redis is\
        \ behind DB, **fail fast / flag** rather than silently continuing from stale\
        \ state:\n\n```java\n// fallback in requireAsking\nlong dbVersion = s.getStateVersion();\n\
        String redisVersion = bucket.get('...:ver');\nif (dbVersion > redisVersion)\
        \ {\n    // Redis is a stale cache; do NOT trust it — rebuild from DB and\
        \ rewrite.\n}\n```\n\nThis converts a silent divergence into a detected, logged,\
        \ recoverable event.\n\n### R5. Guard against eviction (Config/DevOps)\n-\
        \ Set `maxmemory-policy noeviction` (default) and size the Redis instance\
        \ so session keys never evict.\n- Or isolate session state on a dedicated\
        \ Redis DB/shard with ample headroom.\n- Verify `.env`/`docker-compose.yml`:\
        \ the `RedissonConfig.java:23-29` single-server setup has no `maxmemory` awareness\
        \ — the policy lives in `redis.conf`, which is your real control surface here.\n\
        \n### R6. Make rehydration observable (log + metric)\nSilent fallback hides\
        \ both TTL expiry and capacity pressure. Log every rebuild with reason (null\
        \ read) and count per session; add a metric like `interview.session.rehydrated`.\
        \ Today the fallback (InterviewService.java:381-389) is undocumented and unobservable,\
        \ which is why these breakages go undetected in prod.\n\n### R7. Decouple\
        \ the write path so a Redis failure never fails a valid DB transition\nIn\
        \ `create`/`answer`/`finishSession` the DB row is already advanced before\
        \ `stateStore.write`. On Redis failure the request currently errors (stateStore\
        \ throws). Since DB is authoritative (R1), **log the Redis failure and proceed**\
        \ — the fallback on the next read is functionally correct:\n\n```java\ntry\
        \ { stateStore.write(id, state); }\ncatch (Exception e) { log.warn(\"state\
        \ cache write failed; DB remains authoritative, id={}\", id, e); }\n```\n\n\
        ---\n\n## 5. Summary Table\n\n| Trigger | DB | Redis | Outcome today | Continuation\
        \ |\n|---|---|---|---|---|\n| Fixed TTL reached (idle >24h), mirror-only fields\
        \ | valid | absent | silent rebuild (InterviewService.java:381-389) | ✅ works\
        \ (extra DB read) |\n| Runtime state not mirrored in DB | valid | absent |\
        \ rebuild to **stale** cursor | ❌ **breaks silently** |\n| `maxmemory` eviction\
        \ | valid | absent before TTL | silent rebuild, hides capacity issue | ❌ unpredictable,\
        \ undetected |\n| Redis restart / FLUSHALL | valid | absent | relies on rebuild\
        \ fidelity | ❌ unless R3 |\n| Redis write fails post-DB-update | valid (ahead)\
        \ | stale/missing | request throws (stateStore.java:53) | ❌ **breaks, no TTL\
