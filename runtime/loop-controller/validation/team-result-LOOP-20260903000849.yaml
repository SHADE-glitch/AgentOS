        \ long session and a session idle since yesterday are treated the same;\n\
        - `FINISHED`/`START` junk lingers for a full day.\n\n## Recommendations (DB-engineer\
        \ priority)\n1. **Make the DB the authority; demote Redis to a hot cache.**\
        \ Remove the \"single authoritative source\" doc (`InterviewStateStore.java:15`)\
        \ or make mirroring an explicit, tested invariant. In `requireAsking`, reconcile\
        \ the already-loaded fresh `session` against `state` rather than trusting\
