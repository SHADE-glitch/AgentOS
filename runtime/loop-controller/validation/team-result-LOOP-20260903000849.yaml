        \  // old value overwritten\nbucket.expire(sliding, TimeUnit.MINUTES);   \
        \    // refreshed on access\n```\nand keep an absolute max so abandoned sessions\
        \ are still reclaimed.\n3. **Add a version/staleness guard**, not guessing.\
        \ Store `status_rev`/`updated_at` in both Redis and DB; on write++rev. On\
