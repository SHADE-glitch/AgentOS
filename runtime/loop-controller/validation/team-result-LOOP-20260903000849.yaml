        \ may hold the lock for the whole SSE stream (5 min) → lock auto-releases\
        \ mid-stream → concurrent answer double-processes the same question and double-writes\
        \ state/result. Pass an explicit `leaseTime` covering the expected stream\
        \ duration.\n\n## Bottom line for the lead\nContinuation does **not** hard-break\
        \ on a plain idle TTL expiry today because `requireAsking`'s DB-fallback (`InterviewService.java:380-399`)\
