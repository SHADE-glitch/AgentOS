      output: "I now have a complete picture. Here is my database-focused performance\
        \ review.\n\n---\n\n# Database Performance Review — aiview-backend\n\n## Scope\n\
        Database query efficiency, schema index coverage, in-memory data processing,\
        \ and caching opportunities across the **interview** and **rag** modules.\n\
        \n---\n\n## CRITICAL Issues\n\n### 1. SQL Injection in RAG Search — `RagService.java:126-128`\n\
        \n```java\n.inSql(KnowledgeChunk::getKbId,\n    \"SELECT id FROM knowledge_base\
        \ WHERE user_id = \" + userId + \" AND deleted = 0\")\n```\n\nString concatenation\
        \ of `userId` into a raw SQL subquery. Although `userId` comes from JWT (low\
        \ direct risk), this pattern is fragile and violates parameterization best\
        \ practice. **Replace with two safe queries or a `LEFT JOIN`.**\n\n### 2.\
        \ Full-Table Vector Scan — `RagService.java:124-148`, `LegacyAiRagService.java:130-154`\n\
        \nEvery `search()` call:\n1. Loads **all** `knowledge_chunk` rows for all\
        \ user KBs into JVM memory\n2. Parses JSON embedding column → `float[]` for\
        \ **every** chunk\n3. Computes cosine similarity **in Java** against the query\
        \ vector\n\nThis is O(N) over the entire chunk collection. With even 1000\
        \ chunks (50KB each), this means ~50MB payload + full vector math per query.\
        \ **This is the single biggest performance bottleneck.**\n\n**Recommendation:**\
        \ For MySQL-only deployments, add a proper index and limit the scan scope.\
        \ For production, migrate to a vector store (pgvector, Milvus) or at minimum:\n\
        - Cache embeddings in an LRU structure keyed by chunk ID\n- Add a `knowledge_chunk`\
        \ index on `(kb_id, id)` to speed the subquery\n- Consider pre-filtering by\
        \ `kb_id` list rather than the subquery\n\n### 3. N+1 Queries in Interview\
        \ Flow — `InterviewService.java:138-141`, `QuestionBank.java:41-63`\n\nEvery\
        \ `answer()` call executes:\n\n| Query | Location |\n|-------|----------|\n\
        | SELECT all messages for session | `InterviewService:138` |\n| SELECT all\
        \ questions by kpIds | `QuestionBank:63` |\n| UPDATE question usage_count\
        \ | `QuestionBank:85` |\n| UPDATE session | `InterviewService:187` |\n\nPlus\
        \ `answerStream()` at `InterviewService:211` duplicates the same message query.\
        \ The `QuestionBank.pickQuestion` method also re-queries knowledge points\
        \ every invocation (`QuestionBank:41-47`) — this is static reference data\
        \ that should be cached.\n\n---\n\n## HIGH Issues\n\n### 4. Missing Composite\
        \ Indexes\n\nCurrent schema has only FK constraints (which create single-column\
        \ indexes). These critical query patterns lack composite index support:\n\n\
        ```sql\n-- RAG search: user_id + deleted filter\nALTER TABLE knowledge_base\
        \ ADD INDEX idx_kb_user_deleted (user_id, deleted);\n\n-- QuestionBank: topic-based\
        \ knowledge point lookup\nALTER TABLE knowledge_point ADD INDEX idx_kp_topic\
        \ (topic, id);\n\n-- QuestionBank: difficulty + kp lookup\nALTER TABLE question\
        \ ADD INDEX idx_question_kp_diff (knowledge_point_id, difficulty);\n\n-- Interview\
        \ messages: session + kind + role (used in QA extraction)\nALTER TABLE interview_message\
        \ ADD INDEX idx_msg_session_kind_role (session_id, kind, role);\n\n-- Dashboard:\
        \ user + status + score\nALTER TABLE interview_session ADD INDEX idx_session_user_status_score\
        \ \n    (user_id, status, total_score, finished_at);\n\n-- RAG: chunk lookup\
        \ by kb_id\nALTER TABLE knowledge_chunk ADD INDEX idx_chunk_kb_id (kb_id);\n\
        ```\n\n### 5. No Pagination on Any List Endpoint\n\n| Endpoint | Query | Risk\
        \ |\n|----------|-------|------|\n| `listByUser()` | All sessions for user\
        \ | Unbounded as user takes more interviews |\n| `listKbs()` | All KBs for\
        \ user | Moderate |\n| `listChunks()` | All chunks in KB | **High** — can\
        \ be thousands |\n| `DashboardService.compute()` | All results + all sessions\
        \ | Aggregation over unbounded set |\n\n`listByUser()` at `InterviewService:283`\
        \ is especially dangerous — it returns full `InterviewSessionVO` objects (including\
        \ all messages) for **every** session.\n\n**Recommendation:** Add MyBatis-Plus\
        \ `Page<T>` pagination. The `PaginationInnerInterceptor` is already configured\
        \ in `MybatisPlusConfig.java:15` but never used.\n\n### 6. Row-by-Row INSERT\
        \ in addContent — `RagService.java:86-95`\n\n```java\nfor (int i = 0; i <\
        \ pieces.size(); i++) {\n    // ...\n    chunkMapper.insert(chunk);  // N\
        \ individual INSERTs\n}\n```\n\nEach chunk insert is a separate round-trip.\
        \ For a 20-chunk document, that's 20 DB round-trips.\n\n**Fix:** Use MyBatis-Plus\
        \ batch insert:\n```java\nchunkMapper.insertBatch(pieces);  // single round-trip\n\
        ```\n\n---\n\n## MEDIUM Issues\n\n### 7. DashboardService — Full In-Memory\
        \ Aggregation — `DashboardService.java:70-77`\n\nLoads **all** `InterviewResult`\
        \ rows and **all** finished `InterviewSession` rows per user, then aggregates\
        \ in Java. With 100+ interviews, this is significant.\n\n**Recommendation:**\
        \ Push aggregation to SQL:\n```sql\nSELECT \n    AVG(CAST(JSON_EXTRACT(dimensions,\
        \ '$.knowledge.score') AS UNSIGNED)) as avg_knowledge,\n    COUNT(*) as cnt\n\
        FROM interview_result \nWHERE user_id = ?\nGROUP BY user_id\n```\n\nAlso,\
        \ the dashboard already has Redis caching (`CACHE_TTL_MINUTES = 10`), but\
        \ the cache key `\"dashboard:user:\" + userId` is invalidated by score updates.\
        \ Consider adding a cache-bust signal on scoring completion.\n\n### 8. QuestionBank\
        \ Static Data Reloaded Every Call — `QuestionBank.java:41-47`\n\n`knowledgePointMapper.selectList(...)`\
        \ is called every time `pickQuestion()` runs. Knowledge points are essentially\
        \ static reference data.\n\n**Recommendation:** Cache with `@Cacheable(\"\
        knowledgePoints\")` or load once at startup:\n```java\n@Cacheable(value =\
        \ \"kpByTopic\", key = \"#topic\")\npublic List<Long> getKpIdsByTopic(String\
        \ topic) { ... }\n```\n\n### 9. Duplicate `extractQAPairs` Logic\n\n`InterviewService.extractQAPairs()`\
        \ (line 324) and `EvaluationService.extractQAPairs()` (line 117) are identical\
        \ implementations. This is a code quality issue — both should delegate to\
        \ a shared utility, and the `EvaluationService` version is called from `score()`\
        \ while `InterviewService` also calls its own copy for `shouldFinish()`.\n\
        \n### 10. MyBatis StdOut Logging in All Environments — `application.yml:22`\n\
        \n```yaml\nlog-impl: org.apache.ibatis.logging.stdout.StdOutImpl\n```\n\n\
        This logs every SQL statement to stdout with no conditional. In production\
        \ this is pure I/O waste.\n\n**Fix:** Use environment-specific profiles:\n\
        ```yaml\n# application.yml\nmybatis-plus:\n  configuration:\n    log-impl:\
        \ org.apache.ibatis.logging.noop.NoOpLoggingImpl\n\n# application-local.yml\
        \  \nmybatis-plus:\n  configuration:\n    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl\n\
        ```\n\n---\n\n## Caching Opportunities\n\n| Data | Current | Recommendation\
        \ |\n|------|---------|----------------|\n| Knowledge points (by topic) |\
        \ DB query every call | `@Cacheable` with Redis, TTL 1h |\n| Dashboard result\
        \ | Redis 10min TTL ✓ | Good, but needs invalidation on new score |\n| Interview\
        \ session state | Redis 24h TTL ✓ | Good |\n| RAG embeddings in search | None\
        \ — full reload | LRU cache in JVM, or move to vector DB |\n| Question list\
        \ by topic+difficulty | None | `@Cacheable`, invalidate on question CRUD |\n\
        | User profile (`user_profile`) | No reads found | Profile JSON not used in\
        \ hot path — OK |\n\n---\n\n## Summary — Priority Order\n\n| Priority | Issue\
        \ | Impact | Effort |\n|----------|-------|--------|--------|\n| P0 | SQL\
        \ injection in RAG search | Security | Low |\n| P0 | Full vector scan in RAG\
        \ search | Latency/Scalability | High |\n| P1 | Missing composite indexes\
        \ | Query speed | Low |\n| P1 | N+1 queries in interview flow | Latency |\
        \ Medium |\n| P1 | No pagination | Memory/Scalability | Low |\n| P2 | Row-by-row\
        \ INSERT in addContent | Write throughput | Low |\n| P2 | Dashboard full in-memory\
        \ aggregation | CPU | Medium |\n| P2 | QuestionBank static data caching |\
        \ Latency | Low |\n| P3 | Duplicate `extractQAPairs` | Code quality | Low\
        \ |\n| P3 | StdOut logging in production | I/O waste | Trivial |"
