      output: "I now have a complete picture of the codebase. Here is my structured\
        \ performance review.\n\n---\n\n# Backend Performance Review: aiview-backend\n\
        \n## Executive Summary\n\nThe project is an AI interview coaching platform\
        \ with RAG, interview, and dashboard modules. I identified **14 performance\
        \ issues** across database queries, caching, and API design, with 3 critical\
        \ items.\n\n---\n\n## 1. CRITICAL: RAG Search Full Table Scan with In-Memory\
        \ Cosine\n\n**Location:** `RagService.java:124-148`\n\nThe `search()` method\
        \ loads **every chunk** from the user's knowledge bases into application memory,\
        \ then computes cosine similarity in a Java loop:\n\n```java\n// Loads ALL\
        \ chunks - O(N) where N = total chunks across all user KBs\nList<KnowledgeChunk>\
        \ chunks = chunkMapper.selectList(\n    new LambdaQueryWrapper<KnowledgeChunk>()\n\
        \        .inSql(KnowledgeChunk::getKbId,\n            \"SELECT id FROM knowledge_base\
        \ WHERE user_id = \" + userId\n                + \" AND deleted = 0\"));\n\
        // ... then loops through ALL chunks in Java\nfor (KnowledgeChunk chunk :\
        \ chunks) {\n    float[] vec = parseVector(chunk.getEmbedding());  // JSON\
        \ parse per chunk\n    double score = cosine(queryVec, vec);             \
        \ // O(dim) per chunk\n}\n```\n\n**Impact:** With 10K chunks and 1536-dim\
        \ embeddings, this is ~15M float operations per search + JSON deserialization\
        \ overhead. Memory consumption is ~50MB+ per search (embedding JSON strings).\n\
        \n**Recommendation:** Two options by priority:\n1. **Short-term:** Add a MySQL\
        \ index, filter by `kb_id` scope instead of loading all, and add a hard limit.\
        \ Use a vector search library (e.g., MySQL `pgvector` equivalent or dedicated\
        \ vector DB like Milvus/Qdrant).\n2. **Medium-term:** Offload vector search\
        \ to a dedicated vector store. The JSON-in-MySQL approach cannot scale.\n\n\
        ---\n\n## 2. HIGH: SQL Injection Vulnerability in RAG Search\n\n**Location:**\
        \ `RagService.java:127` and `LegacyAiRagService.java:133`\n\n```java\n\"SELECT\
        \ id FROM knowledge_base WHERE user_id = \" + userId + \" AND deleted = 0\"\
        \n```\n\n`userId` is concatenated directly into SQL. Even though it's a `Long`\
        \ from the security context, this is a code smell and potential risk if the\
        \ type changes.\n\n**Fix:** Use parameterized query:\n```java\n.inSql(KnowledgeChunk::getKbId,\n\
        \    \"SELECT id FROM knowledge_base WHERE user_id = ? AND deleted = 0\",\
        \ userId)\n```\n\n---\n\n## 3. HIGH: N+1 Inserts in RAG addContent\n\n**Location:**\
        \ `RagService.java:87-95` and `LegacyAiRagService.java:93-101`\n\nEach chunk\
        \ is inserted individually:\n```java\nfor (int i = 0; i < pieces.size(); i++)\
        \ {\n    chunkMapper.insert(chunk);  // N separate INSERT statements\n}\n\
        ```\n\n**Fix:** Use MyBatis-Plus batch insert:\n```java\n// Use saveBatch\
        \ or manual batch insert\nchunkMapper.insert(pieces.stream().map(piece ->\
        \ {\n    KnowledgeChunk chunk = new KnowledgeChunk();\n    chunk.setKbId(kbId);\n\
        \    chunk.setTitle(title);\n    chunk.setContent(piece);\n    chunk.setEmbedding(toJson(vectors.get(i)));\n\
        \    return chunk;\n}).toList());\n```\n\n---\n\n## 4. HIGH: Missing Database\
        \ Indexes\n\n**Location:** `schema.sql`\n\nThe following indexes are missing,\
        \ causing full table scans on common query patterns:\n\n```sql\n-- interview_session:\
        \ queries filter by user_id\nCREATE INDEX idx_session_user ON interview_session(user_id);\n\
        CREATE INDEX idx_session_user_status ON interview_session(user_id, status);\n\
        \n-- interview_message: always queried by session_id\nCREATE INDEX idx_msg_session\
        \ ON interview_message(session_id);\n\n-- knowledge_chunk: filtered by kb_id\
        \ in listChunks and search\nCREATE INDEX idx_chunk_kb ON knowledge_chunk(kb_id);\n\
        \n-- question: filtered by knowledge_point_id and difficulty\nCREATE INDEX\
        \ idx_question_kp_difficulty ON question(knowledge_point_id, difficulty);\n\
        \n-- interview_result: queried by user_id in dashboard\nCREATE INDEX idx_result_user\
        \ ON interview_result(user_id);\n```\n\n---\n\n## 5. MEDIUM: Embedding Client\
        \ Creates RestClient Per Request\n\n**Location:** `OpenAiCompatibleEmbeddingClient.java:64-73`\n\
        \n```java\nRestClient client = restClientBuilder\n    .baseUrl(url)\n    .defaultHeader(\"\
        Content-Type\", \"application/json\")\n    // ... rebuilds client every call\n\
        \    .build();\n```\n\n**Fix:** Build the `RestClient` once in the constructor\
        \ and reuse it. The `RestClient.Builder` is mutable and should be configured\
        \ once.\n\n---\n\n## 6. MEDIUM: No Pagination on List Endpoints\n\n| Endpoint\
        \ | Location | Issue |\n|---|---|---|\n| `GET /api/interviews` | `InterviewService.java:282`\
        \ | Loads all sessions for user |\n| `GET /api/knowledge-bases` | `RagService.java:36`\
        \ | Loads all KBs for user |\n| `GET /api/knowledge-bases/{id}/chunks` | `RagService.java:66`\
        \ | Loads all chunks |\n\n**Fix:** Add MyBatis-Plus `Page` parameter. The\
        \ pagination interceptor is already configured in `MybatisPlusConfig.java`.\n\
        \n---\n\n## 7. MEDIUM: QuestionBank Executes 2-3 DB Queries Per Question Pick\n\
        \n**Location:** `QuestionBank.java:37-88`\n\n```java\n// Query 1: get knowledge\
        \ point IDs\nList<Long> kpIds = knowledgePointMapper.selectList(...)\n// Query\
        \ 2: get matching questions\nList<Question> questions = questionMapper.selectList(wrapper);\n\
        // Query 3 (conditional): fallback without difficulty filter\nquestions =\
        \ questionMapper.selectList(wrapper);\n// Query 4: update usage count\nquestionMapper.updateById(picked);\n\
        ```\n\n**Fix:** Cache knowledge point IDs per topic (they rarely change).\
        \ Use `SELECT ... ORDER BY RAND() LIMIT 1` to pick in DB, eliminating the\
        \ need to load all questions.\n\n---\n\n## 8. MEDIUM: topics List Not Cached\n\
        \n**Location:** `InterviewService.java:66-77`\n\n`listTopics()` hits DB on\
        \ every call, but knowledge points are static seed data.\n\n**Fix:** Cache\
        \ with `@Cacheable`:\n```java\n@Cacheable(value = \"topics\", key = \"'all'\"\
        , unless = \"#result.isEmpty()\")\npublic List<TopicVO> listTopics() { ...\
        \ }\n```\n\n---\n\n## 9. LOW: SQL StdOut Logging Enabled\n\n**Location:**\
