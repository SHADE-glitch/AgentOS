        \ optimization opportunities**. The most severe issue is in the RAG module\
        \ where vector similarity search is performed in-memory on all chunks.\n\n\
        ---\n\n### CRITICAL ISSUES\n\n#### 1. RAG Search Loads All Chunks into Memory\
        \ (CRITICAL)\n\n**File:** `RagService.java:124-148`\n\n```java\n// Current:\
        \ Loads ALL chunks for user, computes cosine in Java\nList<KnowledgeChunk>\
        \ chunks = chunkMapper.selectList(\n    new LambdaQueryWrapper<KnowledgeChunk>()\n\
        \        .inSql(KnowledgeChunk::getKbId,\n            \"SELECT id FROM knowledge_base\
        \ WHERE user_id = \" + userId + \" AND deleted = 0\"));\n```\n\n**Impact:**\
        \ O(n) memory and CPU for every search query. With 10K+ chunks, this will\
        \ cause OOM or >5s latency.\n\n**Recommendation:**\n- Use pgvector or Milvus\
        \ for vector search\n- At minimum, add a LIMIT clause and filter by top-N\
        \ candidates\n- Consider pre-filtering by knowledge_base before loading embeddings\n\
        \n---\n\n#### 2. Interview Answer Endpoint Loads All Messages (HIGH)\n\n**File:**\
        \ `InterviewService.java:134-137`\n\n```java\n// Current: Loads entire message\
        \ history on every answer\nList<InterviewMessage> messages = messageMapper.selectList(\n\
        \    new LambdaQueryWrapper<InterviewMessage>()\n        .eq(InterviewMessage::getSessionId,\
        \ sessionId)\n        .orderByAsc(InterviewMessage::getId));\n```\n\n**Impact:**\
        \ With 6 questions + 6 answers + feedback, this is 13+ rows loaded 6 times\
        \ per interview.\n\n**Recommendation:**\n- Cache messages in Redis during\
        \ session (InterviewStateStore already exists)\n- Use a incremental approach:\
        \ only load new messages since last question\n\n---\n\n#### 3. QuestionBank\
        \ Queries Knowledge Points Every Call (HIGH)\n\n**File:** `QuestionBank.java:42-48`\n\
        \n```java\n// Current: Fetches knowledge point IDs on every pickQuestion call\n\
        List<Long> kpIds = knowledgePointMapper.selectList(\n    new LambdaQueryWrapper<KnowledgePoint>()\n\
        \        .eq(KnowledgePoint::getTopic, topic)\n        .select(KnowledgePoint::getId))\n\
        \    .stream().map(KnowledgePoint::getId).toList();\n```\n\n**Impact:** 2\
        \ DB queries per question pick (kpIds + questions). With 6 questions per interview\
        \ = 12 extra queries.\n\n**Recommendation:** Cache topic→kpIds mapping in\
        \ Redis with TTL.\n\n---\n\n### MEDIUM ISSUES\n\n#### 4. Missing Database\
        \ Indexes\n\n**File:** `schema.sql`\n\nMissing indexes:\n```sql\n-- interview_message\
        \ needs index for session queries\nCREATE INDEX idx_msg_session_id ON interview_message(session_id);\n\
        \n-- For DashboardService queries\nCREATE INDEX idx_result_user_session ON\
        \ interview_result(user_id, session_id);\n```\n\n#### 5. DashboardService\
        \ Loads All Results\n\n**File:** `DashboardService.java:70-77`\n\n```java\n\
        // Current: Loads ALL results and sessions for aggregation\nList<InterviewResult>\
        \ results = resultMapper.selectList(...);\nList<InterviewSession> sessions\
        \ = sessionMapper.selectList(...);\n```\n\n**Recommendation:** Use SQL aggregation\
        \ (AVG, COUNT, SUM) instead of loading all rows into Java.\n\n#### 6. No Pagination\
        \ on List Endpoints\n\n**Files:** `InterviewService.listByUser()`, `RagService.listKbs()`,\
        \ `RagService.listChunks()`\n\nAll return unbounded result sets. Add `Page<T>`\
        \ from MyBatis-Plus.\n\n---\n\n### CACHING OPPORTUNITIES\n\n| Data | Cache\
        \ Key | TTL | Priority |\n|------|-----------|-----|----------|\n| Topic knowledge\
        \ points | `kp:topic:{topic}` | 1h | HIGH |\n| Question bank per topic | `qbank:{topic}:{difficulty}`\
        \ | 30min | HIGH |\n| Dashboard aggregation | `dashboard:user:{userId}` |\
        \ 10min | EXISTS |\n| RAG embeddings per chunk | `embed:{chunkId}` | 24h |\
        \ MEDIUM |\n\n---\n\n### CODE FIXES\n\n#### Fix 1: Add Missing Indexes\n\n\
        ```sql\n-- Add to schema.sql\nCREATE INDEX IF NOT EXISTS idx_msg_session_id\
        \ ON interview_message(session_id);\nCREATE INDEX IF NOT EXISTS idx_msg_session_kind\
        \ ON interview_message(session_id, kind);\n```\n\n#### Fix 2: Cache Knowledge\
        \ Points in QuestionBank\n\n```java\n@Service\n@RequiredArgsConstructor\n\
        public class QuestionBank {\n    private final RedissonClient redissonClient;\n\
        \    \n    public List<Long> getKpIdsByTopic(String topic) {\n        String\
        \ cacheKey = \"kp:topic:\" + topic;\n        RBucket<List<Long>> bucket =\
        \ redissonClient.getBucket(cacheKey);\n        List<Long> cached = bucket.get();\n\
        \        if (cached != null) return cached;\n        \n        List<Long>\
        \ kpIds = knowledgePointMapper.selectList(\n            new LambdaQueryWrapper<KnowledgePoint>()\n\
        \                .eq(KnowledgePoint::getTopic, topic)\n                .select(KnowledgePoint::getId))\n\
        \            .stream().map(KnowledgePoint::getId).toList();\n        \n  \
        \      bucket.set(kpIds, 1, TimeUnit.HOURS);\n        return kpIds;\n    }\n\
        }\n```\n\n#### Fix 3: Optimize RAG Search with Early Termination\n\n```java\n\
        public List<RagDtos.SearchHitVO> search(Long userId, RagDtos.SearchRequest\
        \ req) {\n    // Add LIMIT to reduce memory usage\n    List<KnowledgeChunk>\
        \ chunks = chunkMapper.selectList(\n        new LambdaQueryWrapper<KnowledgeChunk>()\n\
        \            .inSql(KnowledgeChunk::getKbId,\n                \"SELECT id\
        \ FROM knowledge_base WHERE user_id = \" + userId \n                + \" AND\
        \ deleted = 0\")\n            .last(\"LIMIT 1000\"));  // Cap at 1000 chunks\n\
        \    \n    // ... rest of search logic\n}\n```\n\n#### Fix 4: Use SQL Aggregation\
        \ for Dashboard\n\n```java\n// Replace compute() with SQL-based aggregation\n\
        @Select(\"SELECT AVG(total_score) as avgScore, MAX(total_score) as maxScore\
        \ \" +\n        \"FROM interview_session WHERE user_id = #{userId} AND status\
        \ = 'FINISHED'\")\nDashboardStats getStats(Long userId);\n```\n\n---\n\n###\
        \ PERFORMANCE IMPACT SUMMARY\n\n| Issue | Current Latency | Optimized | Improvement\
        \ |\n|-------|----------------|-----------|-------------|\n| RAG Search (10K\
