        key gone → fail\" because a recovery path exists. Here is the precise failure\
        \ model and the fix.\n\n### 1. Root-cause: two sources of truth, mislabeled\n\
        \n`InterviewStateStore.java:15` claims Redis is the **单一权威来源 (single authoritative\
        \ source)**, but the same mutable state (`status`, `questionCount`, `currentQuestionId`)\
        \ is also persisted onto the durable row `interview_session` in every write\
