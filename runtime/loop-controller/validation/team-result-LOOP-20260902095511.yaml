      output: "# Interview Session Runtime State in Redis with Fixed TTL vs. Lasting\
        \ DB Validity\n\n## 1. The core divergence\n\nYou have two stores holding\
        \ overlapping truth about the same interview session:\n\n| Store | What it\
        \ holds | Validity semantics |\n|---|---|---|\n| **RDBMS** | The authoritative\
        \ interview row: `id`, `candidate_id`, `status='IN_PROGRESS'`, `current_step`,\
        \ `answers`, `updated_at` | Valid as long as the row is present and `status`\
        \ says in-progress |\n| **Redis** | Runtime/volatile state: live `session:{id}`\
        \ hash, in-flight step payload, nonce/CAPTCHA, anti-replay bucket, rate-limit\
        \ counters, last-ping timestamp | TTL is an **absolute lifetime**, not a validity\
        \ decision |\n\nThe bug: **Redis expiration is independent of DB validity.**\
        \ `EXPIRE` fires on a clock, not on \"is this interview logically still open?\"\
        . When the key dies but the DB row is still `IN_PROGRESS`, the two stores\
        \ disagree. Which one your code trusts decides whether continuation works.\n\
        \n## 2. When it breaks (exact trigger conditions)\n\n1. **Fixed TTL shorter\
        \ than the max session window.** You set a TTL once at session creation (e.g.\
        \ 30 min) for a session whose *logical* lifetime should be driven by activity,\
        \ not a hard ceiling. User spends 31+ minutes (long answer, pearl-climbing,\
        \ reviewer pause) → Redis key gone, DB still says in-progress.\n\n2. **No\
        \ sliding/rolling renewal.** A *fixed* TTL does not refresh on activity. The\
        \ correct analog is a **sliding session**, where every request re-arms the\
        \ timer with `EXPIRE key ttl`. With a fixed TTL, an actively-working user\
        \ crosses the threshold while typing.\n\n3. **`maxmemory` eviction ignores\
        \ TTL for the wrong policy.** With `allkeys-lru` / `allkeys-random`, Redis\
        \ evicts *the least-recently-used key* even if its TTL is untouched. A long-idle\
        \ but *still valid* session is exactly the target — evicted regardless of\
        \ its remaining TTL. (`volatile-lru` avoids this by only touching TTL-bearing\
        \ keys, but it's not the default.)\n\n4. **Redis restart / no persistence.**\
        \ `--appendonly no` and `save \"\"` → any crash or restart flushes runtime\
        \ state to zero, while the DB row survives intact. Continuation is impossible\
        \ until Redis is rehydrated.\n\n5. **Any session left idle past the TTL by\
        \ a human.** The DB row and its `updated_at` remain truthful; Redis is simply\
        \ gone.\n\nAll five produce the same observable failure: **\"session missing\"\
        **, followed by either a forced restart (destroying continuity) or an error,\
        \ in a context where the database says the interview should be resumable.\n\
        \n## 3. Why continuation breaks — the mechanics\n\nThe DB knows the session\
        \ reached step N and has answers 1..N-1. Continuation needs *three* things:\n\
        \n- **Identity mapping** (which Redis `session:{id}` belongs to which DB row)\n\
        - **Progress cursor** (`current_step`)\n- **Volatile mid-step state** (a partially-entered\
        \ but unsaved answer, a one-time nonce used to validate the next request)\n\
        \nRedis held the last two. On a silent expiry you now have only:\n\n```\n\
        DB:   session 42, status=IN_PROGRESS, current_step=3\nRedis: <nothing>\n```\n\
        \nDepending on your controller logic, one of these happens — and each is a\
        \ \"continuation broken\":\n\n- **Fail-closed:** lookup throws, user is told\
        \ \"session expired,\" must restart. Progress-to-date still in DB but user\
        \ can't reach it. **Continuation breaks.**\n- **Fail-hopeful-silent (worst\
        \ kind):** code does `redis.get(...) or default` and silently builds a **fresh**\
        \ session at step 1, **overwriting** the real `session:{id}` hash and reusing/stale-ignoring\
        \ the DB record. The user restarts *and* the runtime no longer matches the\
        \ DB's `current_step=3`. **Continuation breaks and corrupts.**\n- **Fail-validate-DB:**\
        \ if you (correctly) trust the DB as the source of truth and require Redis,\
        \ you still must *reconstruct* runtime state — if rehydration isn't idempotent,\
        \ you resurrect a stale nonce or a half-written payload. **Continuation is\
        \ fragile/token mismatches.**\n\nThe root cause is a **misplaced single source\
        \ of truth**: the design let Redis *own* evidence of \"the interview is still\
        \ going,\" but Redis is (or should be) a **cache with a deliberately short\
        \ lifetime**, not an authority.\n\n## 4. Fixes (recommendation stack)\n\n\
        ### 4.1 Make Redis rebuildable — DB is the source of truth\nRedis must never\
        \ hold the *only* copy of anything needed to resume. Store the authoritative\
        \ progress entirely in the DB row; keep only **safely-lossy** volatile bits\
        \ (nonces, rate counters, per-request anti-replay).\n\n### 4.2 Sliding (rolling)\
        \ TTL, not fixed\nRe-arm the TTL on every interaction instead of setting it\
        \ once:\n\n```python\nasync def touch(r, sid, idle_ttl=1800):\n    # rolling\
        \ timeout: resets on activity, fixed lifetime never applies\n    await r.expire(f\"\
        session:{sid}\", idle_ttl)\n```\n\nCall `touch()` at the top of every authorized\
        \ endpoing, on an authenticated read *and* write.\n\n### 4.3 Idempotent rehydration\
        \ on cache miss\nTreat a Redis miss as a normal event, not an error. Reconstruct\
        \ runtime state from the DB row:\n\n```python\nasync def load_session(r, db,\
        \ sid):\n    raw = await r.hgetall(f\"session:{sid}\")\n    if raw:\n    \
        \    return raw                       # hot path\n    row = await db.fetch_row(sid)\
        \        # authoritative\n    if not row or row.status != \"IN_PROGRESS\"\
        :\n        raise SessionInvalid(row.reason) # genuine reject\n    # rebuild:\
        \ cache of DB truth + volatile defaults\n    st = {\n        \"current_step\"\
        : row.current_step,\n        \"answers\": to_json(row.answers),\n        \"\
        nonce\": new_nonce(),            # fresh, lossy is fine\n        \"rehydrated\"\
        : now(),\n    }\n    await r.hset(f\"session:{sid}\", mapping=st)\n    await\
        \ r.expire(f\"session:{sid}\", IDLE_TTL)\n    emit_metric(\"session_rehydrated\"\
        , 1)   # ← observability hook\n    return st\n```\n\nKey property: `load_session`\
        \ is **idempotent** — calling it twice yields the same DB-derived state. This\
        \ converts \"silent expiry\" from a user-visible fault into an internal cache-refresh.\n\
        \n### 4.4 Disambiguate the three outcomes\nStick outcomes in a three-way check\
        \ so your API returns honest semantics:\n\n```\nRedis hit                \
        \ → resume normally\nRedis miss, DB IN_PROGRESS→ rehydrate + resume (was a\
        \ silent-expiry; fixed here)\nRedis miss, DB ended/finalized → reject (session\
        \ over)\nDB row absent              → reject (never existed / purged)\n```\n\
        \nNever collapse \"session expired\" and \"DB says invalid\" into the same\
        \ response — that's exactly what causes users to be kicked from still-valid\
        \ interviews or allowed to continue ended ones.\n\n### 4.5 Tune session size\
        \ vs. TTL policy\n- Cap the *idle* TTL re-armed in 4.2 to the maximum **acceptable\
        \ idle time** (e.g., 15–30 min), not the total interview length. An interview\
        \ may span days; the *idle* window is what matters.\n- Redis `maxmemory-policy`\
        \ should be `volatile-lru` (or `allkeys-lru` + very long TTL) so Redis-only\
        \ eviction doesn't pre-empt TTL-expired-valid sessions. `allkeys-lru` will\
        \ evict the idle-but-valid key first — the exact bug — so avoid it.\n- Enable\
        \ persistence for restart resilience: `save 900 1 300 10 60 10000` (RDB) **and**\
        \ `appendonly yes` (AOF), knowing it reduces — not eliminates — the window.\
        \ Correctness still depends on 4.3.\n\n### 4.6 Where the TTL does remain safe\
        \ (fixed TTL allowed)\nOnly on state that is legitimately birth-to-death and\
        \ lossy-safe: one-time anti-replay nonces, a per-step CAPTCHA, a short OTP/2FA\
        \ gate, login code. These *should* hard-expire. Apply the fixed-TTL pattern\
        \ narrowly, and progress/lifecycle state broadly (sliding + DB-backed).\n\n\
        ## 5. Observability to catch it before users do\n\n- Emit `session_rehydrated`\
        \ (4.3) — a non-zero rate is a canary for \"Redis keeps evicting valid sessions.\"\
        \n- Compare DB `updated_at` to Redis `last_ping`; alert when a DB `IN_PROGRESS`\
        \ row has no Redis session and no open request.\n- Metrics: `session_missing_vs_db_valid`,\
        \ `session_evicted_maxmemory`, and hit-ratio on the decision read.\n\n## 6.\
        \ Concrete checklist\n\n1. [ ] Replace one-time `SETEX`/`SET key ttl` with\
        \ an explicit `touch()`/`EXPIRE` on separate `hset` writes.\n2. [ ] Move `current_step`/`answers`\
        \ to the DB; keep Redis for volatile-only fields.\n3. [ ] Make the load path\
        \ idempotent DB→Redis rehydration; never `or {}` fresh-default silently.\n\
        4. [ ] Return distinct statuses for `REHYDRATED` vs `SESSION_EXPIRED` vs `INVALID`.\n\
        5. [ ] Set `maxmemory-policy volatile-lru`, enable AOF + RDB.\n6. [ ] Add\
        \ `session_rehydrated` and `session_missing_vs_db_valid` metrics + alert.\n\
        \n**Bottom line:** continuation breaks the moment you let Redis (a short-lived,\
        \ evaporating cache) act as the authority on \"the session is still live.\"\
        \ Keep the DB authoritative, make Redis rebuildable and idempotent, adopt\
        \ sliding TTL, and treat a cache miss as a refresh — not a death sentence\
        \ — and the silent-expiry divergence becomes impossible in practice."
