        \ :340-346` same dual write\n\nSo the DB is the actual durable truth and Redis\
        \ is a **volatile, arbitrarily-TTL'd snapshot**. Two writable copies of the\
        \ same fields is the definition of a divergence risk. TTL adds unilateral,\
        \ epoch-driven mutation of only one copy.\n\n### 2. When and why continuation\
        \ breaks\n\n`requireAsking()` (`InterviewService.java:380-399`) has a null-recovery:\
        \ if Redis key is missing it rebuilds from the DB row and re-writes. That\
        \ masks pure expiry *only on this read path*, and only when Redis returns\
        \ `null`. Continuation breaks in these concrete cases:\n\n**(a) Expired-but-stale\
        \ value seats the stale state (most dangerous).**\nThe recovery in `:382-389`\
        \ only triggers on `state == null`. If the key has **not** expired but holds\
        \ an older snapshot — i.e. a prior DB commit succeeded (`:186`) but the corresponding\
        \ Redis write failed on `:188` (partition, Redis restart before AOF/RDB flush,\
        \ Redisson client error surfaces as `BizException` at `:53-54`) — then Redis\
