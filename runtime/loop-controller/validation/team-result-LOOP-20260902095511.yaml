    output: "# When and Why Interview Session Continuation Breaks with Redis TTL\n\
      \n## Core Problem\n\nThe classic failure mode is **split-brain between two sources\
      \ of truth with different lifecycle policies**:\n\n- **Redis** holds the *runtime*\
      \ session state (in-progress answers, timer, current question index, partial\
      \ drafts) with a **fixed TTL** (e.g. `ttl: 60*60` = 1 hour).\n- **Postgres/DB**\
      \ holds the *authoritative* session record (who the candidate is, interview\
      \ definition, scheduled slot, final submitted data) which **persists indefinitely**.\n\
      \nThe TTL is a pure **expiry/eviction** mechanism, not a **lifecycle** mechanism.\
      \ Nothing that writes to Redis is watching the DB, and nothing that lives in\
      \ the DB invalidates the Redis key. So the two clocks drift.\n\n---\n\n## When\
      \ Continuation Breaks\n\nBreakage happens at the exact moment `now >= key_created_at\
      \ + TTL` **while the DB row is still valid and open**. Concretely:\n\n1. **Interview\
      \ interrupted mid-session** (candidate refresh, network drop, tab close, backend\
      \ restart, panel split) after the Redis key was written but before the session\
      \ was finished and persisted to the DB.\n2. **The wall-clock idle period reaches\
      \ the fixed TTL.** The `expire` fires regardless of session state.\n3. Candidate\
      \ returns (or the UX resumes via \"continue interview\") → app reads Redis →\
      \ `GET` returns **nil / missing key** → token/reference no longer de-references\
      \ to runtime state.\n4. The resumption path, believing there's nothing to restore,\
      \ either:\n   - starts a **fresh session** (candidate loses their place and\
      \ partial answers), or\n   - errors out with \"session expired / invalid session\
      \ token\", forcing a restart.\n\nThe DB still has a valid, open session row\
      \ — but no runtime object exists to hydrate it. **The session is orphaned, not\
      \ closed.**\n\n### If Redis is used as a cache with a DB write-through\n`GET\
      \ redisKey` returns `nil` on TTL expiry. A naive cache-aside read then falls\
      \ back to the DB — but if the DB row's status is still `started`/`in_progress`\
      \ (not `completed`), the fallback produces either a hole (no runtime state)\
      \ or an artificial resume-as-new. Continuation is broken because **the fallback\
      \ cannot reconstruct in-memory state that only ever existed in Redis** (partial\
      \ answers, leaves not yet flushed, timer offset).\n\n---\n\n## Why It Breaks\
      \ (Root Causes)\n\n| Cause | Explanation |\n|-------|-------------|\n| **Fixed\
      \ TTL, not sliding** | A fixed TTL counts from creation. A candidate idle for\
      \ 55 min on an hour TTL loses the session, even though they're actively mid-interview\
      \ and the DB session is valid. A **sliding TTL** (re-`expire` on every access)\
      \ would reset the clock and only evict truly-stale sessions. |\n| **Eviction\
      \ ≠ lifecycle** | TTL is a memory-management/cache semantic, not a \"this interview\
      \ is officially over\" semantic. Nothing ties eviction to the DB row's `status`\
      \ (`completed`, `expired`, `cancelled`). |\n| **Two clocks / no orchestration**\
      \ | The writer doesn't refresh TTL on activity; the DB status transitions don't\
      \ emit an invalidation (`DEL`) to Redis. The two systems never reconcile. |\n\
      | **Orphaned transactions** | Session state accumulated in Redis (multi-step\
      \ form progress) is never atomically persisted to the DB at a checkpoint, so\
      \ on Redis loss the progress is gone permanently — the DB has no coarse snapshot.\
      \ |\n| **Token-bound lookup** | The continuation token strongly implies \"this\
      \ runtime exists.\" When it silently returns nil after TTL, the app logic classifies\
      \ the token as invalid/expired rather than \"exists-but-cold — reload from DB.\"\
      \ |\n\n---\n\n## Fixes / Recommendations\n\n### 1. Sliding TTL (cheapest, most\
      \ impactful)\nRefresh the expiry on every activity access:\n\n```bash\n# on\
      \ write\nSETEX interview:{id}:runtime ... 3600\n# on every access during active\
      \ session\nEXPIRE interview:{id}:runtime 3600\n```\n\nIn code (Redis + Node\
      \ example):\n```ts\nconst ttl = 60 * 60;\nawait redis.set(`interview:${id}:runtime`,\
      \ json, 'EX', ttl);\n// every time candidate interacts:\nawait redis.expire(`interview:${id}:runtime`,\
      \ ttl);\n```\n\n### 2. Fallback hydration from the DB (make resumption possible\
      \ even after eviction)\nStore a coarse **checkpoint snapshot** in the DB on\
      \ every phase boundary (question change, submit, heartbeat). On Redis miss,\
      \ rebuild runtime state from the snapshot:\n\n```ts\nconst cached = await redis.get(key);\n\
      if (cached) return JSON.parse(cached);\n\n// Redis evicted (TTL) -> hydrate\
      \ from authoritative DB snapshot\nconst snap = await db.interviewSnapshot({\
      \ id });\nif (snap && snap.status === 'in_progress') {\n  const runtime = await\
      \ rebuildRuntime(snap);   // timer, question idx, partials\n  await redis.set(key,\
      \ JSON.stringify(runtime), 'EX', ttl);\n  return runtime;\n}\n// snap completed\
      \ / cancelled -> genuinely ended; 404, not \"start over\"\nif (snap && snap.status\
      \ !== 'started') return terminalState(snap);\n```\n\nTreat \"no Redis + in-progress\
      \ DB\" as **cold start/rehydrate**, never as \"invalid session.\" Only treat\
      \ \"DB completed/cancelled\" as truly expired.\n\n### 3. Tie Redis lifecycle\
      \ to DB status — invalidate on state change\nAnywhere the interview is finalized\
      \ in the DB (`COMPLETED`, `CANCELLED`, `GRADED`, admin force-close), emit `DEL`:\n\
      \n```ts\nawait db.updateStatus(id, 'completed');\nawait redis.del(`interview:${id}:runtime`);\
      \   // and invalidate token\n```\nSame for its inverse: only mark the DB row\
      \ `started` together with the Redis write (single logical transaction or idempotent\
      \ write), so no window exists where DB is open but Redis was never created.\n\
      \n### 4. Enforce a session budget, not a blind TTL\nDerive the TTL from the\
      \ interview's max duration / candidate's allotted window and validate against\
      \ the scheduled slot:\n\n```ts\nconst deadline = slotEndTime - now;\nconst ttl\
      \ = clamp(deadline - safetyMargin, MIN, MAX);\nawait redis.expire(key, ttl);\n\
      ```\nContinuation now fails only when the interview is *actually* out of time,\
      \ which is the correct reason to break — and should surface that reason explicitly.\n\
      \n### 5. Distinguish the error the client sees\nMap eviction to a distinct outcome\
      \ so a fres may be applied:\n- Redis miss + DB in-progress → **resume** (`READY\
      \ to restore`)\n- Redis miss + DB completed/cancelled → **404 / session ended**\n\
      Never return the same \"session expired\" for both, or continuation will look\
      \ broken even when it isn't.\n\n---\n\n## Verification / Test Checklist\n\n\
      1. Start session → let TTL lapse (or run `FLUSHDB`) while DB row is `started`\
      \ → verify resumption *rebuilds* instead of restarting.\n2. Complete interview\
      \ (DB `completed`) → verify Redis key is `DEL`eted and continuation returns\
      \ \"ended,\" not a new session.\n3. Interact mid-session → verify `EXPIRE` refreshes\
      \ (sliding works) and the session survives expected idle gaps.\n4. Restart the\
      \ backend mid-session → verify Redis state or DB checkpoint can rehydrate the\
      \ timer without double-start.\n\n---\n\n**Summary:** Continuation breaks whenever\
      \ a fixed Redis TTL fires while the DB session is still authoritative and open,\
      \ because eviction is confused with session lifecycle. The fix is a sliding\
      \ TTL plus DB-snapshot rehydration on cache miss, and explicit DB↔Redis invalidation\
      \ so eviction and status always agree.\n\nResult delivered as lead for **team-18087af2**\
      \ (database, ai)."
