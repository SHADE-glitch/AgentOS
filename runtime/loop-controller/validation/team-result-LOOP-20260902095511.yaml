        \ fixed TTL**, which becomes a real defect the moment an active session outlives\
        \ it or an eviction policy is introduced (c).\n\n### 4. Recommendation (DB-authoritative)\n\
        \nMake **MySQL the single source of truth**; treat Redis as a pure read cache.\
