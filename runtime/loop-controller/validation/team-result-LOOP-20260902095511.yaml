        \ for the lead.\n\n## Review: Redis TTL session-state expiry vs. DB-backing\
        \ store\n\n### Executive finding\n\nThe premise that TTL expiry hard-breaks\
        \ continuation is **only partially true today, and the near-miss is the real\
        \ problem**. `InterviewStateStore` (backend/src/main/java/com/aiview/interview/service/InterviewStateStore.java:25,51)\
