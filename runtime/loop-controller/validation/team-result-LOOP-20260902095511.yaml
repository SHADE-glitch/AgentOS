      output: "# Redis TTL Session Expiry — When & Why Continuation Breaks\n\n## 1.\
        \ Data role split (DB vs Redis)\n\n- **DB = source of truth (authoritative).**\
        \ Interview *session record* (id, user, status `in_progress`, question progress,\
        \ answers, timestamps). No natural expiry — row survives until explicitly\
        \ completed/cancelled.\n- **Redis = runtime/cache (transient).** Active-session\
        \ backing: in-memory conversation context, mid-question state, throttling/rate\
        \ counters, per-user locks, ingestion cursors.\n\nThis split means the two\
        \ stores can disagree: Redis silently drops state while the DB still reports\
        \ a valid, active session.\n\n## 2. Core mechanism: fixed vs sliding TTL\n\
        \nThe failure is almost always because the TTL is **fixed (absolute)** — set\
        \ once at write, never refreshed on access — rather than **sliding (refresh-on-touch)**.\n\
        \n```redis\n# FIXED: absolute lifetime from the SET moment, NOT refreshed\
        \ on use\n> SET session:abc '{\"q\":5,\"rev\":2}' EX 1800        # dies 30\
        \ min after set, period\n\n# SLIDING: refresh lifetime on every touch\n> SET\
        \ session:abc '{\"q\":5,\"rev\":2}' EX 1800\n> EXPIRE session:abc 1800   \
        \                       # must re-run on each access\n```\n\nWith a fixed\
        \ TTL the key expires at an absolute wall-clock point regardless of recent\
        \ activity. That is the root cause of \"silent\" expiry.\n\n## 3. When continuation\
        \ breaks (concrete scenarios)\n\n**S1 — Idle resume (most common).** Fixed\
        \ TTL, e.g. 30 min, set while active. User pauses mid-interview, returns *after*\
        \ the TTL window but DB still says `status=in_progress`. On resume:\n\n```\n\
        RESUME session:abc\n  -> Redis GET session:abc  => nil (expired)\n  -> DB\
        \ SELECT ... WHERE status='in_progress'  => row present (still valid)\n  ->\
        \ COINCIDENCE FAIL => continuation broken\n```\n\n**S2 — Long-running active\
        \ session.** Even with *no* idle time, an interview spanning longer than the\
        \ fixed TTL loses state while the user is actively engaged, because a fixed\
        \ TTL is not refreshed by read/write traffic.\n\n**S3 — Time-of-write semantics\
        \ / skew.** TTL counts from the *last SET/EXPIRE*. If multiple keys hold one\
        \ session (context + cursor + lock) written at different times, they expire\
        \ at different moments → **partial expiry** → inconsistent read (e.g. context\
        \ still present, cursor gone).\n\n**S4 — Redis eviction under memory pressure.**\
        \ With `maxmemory-policy volatile-ttl`/`volatile-lru`, TTL'd keys are evicted\
        \ early when memory is constrained — expiry happens *before* the TTL.\n\n\
        **S5 — Redis restart, no/failed persistence.** Without AOF/RDB, all keys vanish\
        \ on restart; with a stale RDB, keys reappear inconsistently. DB rows are\
        \ untouched.\n\n## 4. Why the DB stays valid\n\nDB rows have **no TTL** and\
        \ are deleted only on explicit terminal action (`complete`, `cancel`). So\
        \ the DB keeps representing a live interview even after every runtime artifact\
        \ has been destroyed. The stores desynchronize by design.\n\n## 5. Continuation-visible\
        \ symptoms\n\n- Resume returns a **new empty state** → interviewer sees \"\
        start over\", losing partial progress, despite DB showing the session mid-flow.\n\
        - **Data-integrity divergence**: DB records answers up to Q5; runtime rebuilds\
        \ from Q1 → duplicate/corrupt writes, optimistic-lock (`rev`/`version`) mismatches\
        \ and lost updates.\n- **Lock-session loss** → stale concurrent writes, double-submission.\n\
        - DB session becomes **permanently stuck** in `in_progress` with no process\
        \ to roll it back (no reconciliation job).\n\n## 6. Recommendations\n\n**R1\
        \ (correct the model): source-of-truth discipline — never hold the *only*\
        \ copy of critical session state in Redis.** Treat Redis as a cache. On miss,\
        \ rebuild from DB (cache-aside):\n\n```python\n# pseudo: never hard-fail on\
        \ redis miss for authoritative state\ndef load_session(sid, db, cache):\n\
        \    sess = cache.get(f\"session:{sid}\")            # runtime snapshot\n\
        \    if sess is None:\n        sess, answers = db.load_full(sid)         \
        \ # reconstruct from DB\n        cache.set(f\"session:{sid}\", sess, sliding=True)\n\
        \    return sess\n```\n\n**R2 — Use sliding TTL for any state that must survive\
        \ activity**, and re-arm `EXPIRE` on every read/write in a single Lua script\
        \ to keep it atomic:\n\n```lua\n-- refresh.lua : GET-or-rebuild + reset TTL\
        \ atomically\nlocal k = KEYS[1]\nlocal ttl = ARGV[1]\nlocal v = redis.call('GET',\
        \ k)\nif v then redis.call('EXPIRE', k, ttl) end\nreturn v\n```\n\n**R3 —\
        \ Size the TTL deliberately.** Set lifetime ≥ maximum realistic interview\
        \ duration *plus* an idle allowance (e.g. `idle_timeout` for pause-and-resume),\
        \ not an arbitrary short value. Never let active traffic exceed TTL (S2).\n\
        \n**R4 — Single-key per session.** Store context, cursor, and rev in one hash/key\
        \ (or use a Lua multi-key transactional refresh) so partial multi-key expiry\
        \ (S3) is impossible.\n\n**R5 — Operational hardening for S4/S5.**\n- `maxmemory-policy\
        \ noeviction` for correctness-critical keys, or use a separate namespace so\
        \ eviction can't kill session state.\n- Enable **AOF** (or RDB) persistence\
        \ so restart isn't data-loss.\n- Monitor `INFO keyspace` expiry and `EVICTEDKEYS`;\
        \ alert on spikes.\n\n**R6 — Graceful degradation on miss.** Distinguish *authoritative*\
        \ (rebuild from DB) from *ephemeral* (rate counters/locks — safe to lose).\
        \ Only ephhemeral items may 500/retry; authoritative must fall back to the\
        \ DB.\n\n**R7 — Reconciliation / expiry sweep.** A background job finds DB\
        \ sessions with `status='in_progress'` but `last_activity > timeout` and either\
        \ rebuilds them or transitions them to `abandoned` — closing the \"stuck in_progress\"\
        \ leak.\n\n## 7. Bottom line\n\nContinuation breaks silently because **fixed\
        \ TTL expires Redis runtime state on wall-clock age, not on activity**, while\
        \ the authoritative DB row never expires. Any actively-used TTL should be\
        \ *sliding*, any authoritative state should be *reconstructible from the DB*,\
        \ and TTL/eviction/persistence must be tuned so Redis never becomes the single\
        \ point of truth for a still-valid session."
