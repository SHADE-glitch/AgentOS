        \ (InterviewService.java:380-399) treats Redis as the state authority. But\
        \ because `requireAsking` also contains a **DB-reconstruction fallback on\
        \ cache-miss (`state == null` → rebuild from `InterviewSession` and rewrite\
        \ to Redis)**, an ordinary expired key self-heals. So continuation breaks\
        \ **only in specific conditions** — and the code's \"single authoritative\
        \ source\" documentation is actively misleading.\n\n### When TTL expiry occurs\n\
        \n- TTL is refreshed **only on `write()`** calls, i.e. on state-transition\
        \ events (create, next-question, finish) — not on `read()`.\n- A session that\
        \ is **idle > 24 h** (candidate reads/answers, returns to an OPEN in-progress\
        \ session, then submits an answer) has its Redis state silently dropped while\
        \ the DB row remains `ASKING`/current.\n\n### Why continuation actually breaks\
        \ — concrete scenarios\n\n**B1. Genuine hard break: no DB fallback in read-only\
        \ consumers.** Today the only `stateStore.read()` call is inside `requireAsking`,\
        \ which has the fallback. Any future path that reads state directly (session\
        \ resume endpoint, idle-timeout check, SSE reconnection logic) will inherit\
        \ `null` after TTL and, without the same fallback, reject/abort continuation.\
        \ This is the latent break: the store's Javadoc calls Redis \"单一权威来源\" (single\
        \ source of truth), but the implementation makes the DB co-authoritative.\
        \ The doc and the code disagree.\n\n**B2. The self-healing fallback is itself\
        \ the fragile seam.** When a cache-miss occurs, `requireAsking` reconstructs\
        \ from DB and calls `stateStore.write(...)` (InterviewService.java:389). If\
        \ Redis is currently unavailable or the write fails, `write()` throws `BizException(INTERNAL_ERROR,\
        \ \"会话状态写入失败\")` (InterviewStateStore.java:48-55) — the method aborts **even\
        \ though the DB is fully valid** and continuation is possible. So TTL expiry\
        \ + transient Redis failure = real break that the DB alone cannot pull through.\n\
        \n**B3. Write-ordering divergence (state can be lost or double-processed without\
        \ TTL).** Every transition updates DB first, then Redis:\n`answer()`: `sessionMapper.updateById`\
        \ (line 186) → `stateStore.write` (line 188). If the DB commit succeeds but\
        \ the Redis write throws, the API surfaces an error although the message row\
        \ and the session row were already committed. The user retries; the lock serializes,\
        \ but `requireAsking` reads a *newer or reconstructed* state and can re-advance\
        \ `questionCount`/re-emit the same next-question the user already saw — corrupting\
        \ continuation. TTL turns a design defensible only when Redis is genuinely\
        \ fast/authoritative into an occasionally-silent failure.\n\n**B4. Pure-identity\
        \ time semantics.** `TTL_HOURS = 24` is a fixed duration, not a sliding/activity\
        \ TTL. There is no config knob (`application.yml`), so an architecture that\
        \ must preserve hour-scale continuity for a legitimately long interview is\
        \ mis-served by a magic constant.\n\n### Severity\n\n- In-flight answer continuation:\
        \ **Low** (fallback masks it) — do not claim a hard break here.\n- Robustness\
        \ / silent state loss / doc-vs-behavior divergence: **Medium**.\n- Future\
        \ read-only consumers of `stateStore.read()`: **High** latent risk if TTL\
        \ is kept.\n\n### Recommendations (concrete)\n\n1. **Make DB the authoritative\
        \ state and treat Redis purely as a cache**, or **remove the fallback** —\
        \ but not both. Prefer the former; it already (mostly) works and is the correct\
        \ long-term model. Then the 24 h TTL becomes hygiene, not correctness.\n\n\
        2. **If Redis is to remain authoritative, decouple correctness from TTL:**\n\
        \   - Redis-down should not abort an answer that DB can satisfy — `requireAsking`\
        \ should swallow a write-back failure and continue on the reconstructed DB\
        \ state (log a warning). Preserve only the correctness check (FINISHED / ASKING)\
        \ from the DB row.\n   - Or make the lock lease / distributed lock the only\
        \ thing Redis must guarantee, and drop state authority from Redis entirely.\n\
        \n3. **Fix `write()` swallowing + eager abort:** `create()` (InterviewService.java:91)\
        \ writes Redis inside the lock and propagates failure, rolling back nothing\
        \ at DB level → a failed Redis write leaves a committed empty session and\
        \ likely duplicate sessions on client retry. Reorder to persist DB first and\
        \ treat Redis as best-effort.\n\n4. **Make TTL a configurable, larger, and\
        \ preferably sliding value** if Redis stays authoritative. E.g. configurable\
        \ `app.interview.session-ttl`; current == DB-lifetime if you want resume-after-idle.\
