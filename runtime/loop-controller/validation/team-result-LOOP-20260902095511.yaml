        \ so the DB `currentQuestionId`/`status` and the in-memory session VO diverge;\
        \ `toVO` at `:435` won't find the real current question.\n\n**(b) Write-ordering\
        \ asymmetry.** All paths commit DB **before** Redis. A failure between the\
        \ two leaves DB ahead. Because recovery is only on `null`, a *stale non-null*\
        \ value is silently trusted. This is the classic cache-coherence hole: the\
        \ cache is never invalidated on DB advance.\n\n**(c) TTL is a magic number,\
        \ not a domain bound.** `TTL_HOURS = 24` (`:25`) has no relation to \"relevant-until\"\
        . Any session active or resumed **> 24h** loses its runtime snapshot. With\
        \ default `noeviction` and no `maxmemory`/`maxmemory-policy` set (confirmed:\
        \ `docker-compose.yml` Redis 7 runs stock), `EVICT` isn't the risk, but the\
        \ arbitrary TTL is. Under memory pressure (if `maxmemory-policy` is later\
