        \ a polling client keeps a zombie session alive indefinitely with no activity\
        \ backstop on the DB side.\n\n### 3. Verdict\nWith the current 24h TTL, pure\
        \ idle-expiry continuation breakage is masked by the `null`-recovery. The\
        \ real continuation breakers are:\n1. **Stale-but-non-null** Redis state after\
