      output: "## Interview Session Runtime State in Redis with Fixed TTL — Expiry\
        \ vs. DB Validity\n\n### 1. Problem Statement\n\nAn interview session has\
        \ two storage planes with **independent lifecycles**:\n\n- **Redis** — holds\
        \ *hot runtime state* (current question pointer, live transcript buffer, answer-in-progress,\
        \ ownership/lock token, rate-limit counters, dedup cursors). Governed by a\
        \ `TTL` set once and never touched again.\n- **RDBMS (DB)** — holds the *authoritative/durable*\
        \ record (`interview_sessions` row, status `active`, `updated_at`). Persisted\
        \ for the lifetime of the interview, regardless of wall-clock time.\n\nA **fixed**\
        \ (non-sliding) TTL means Redis evicts the key at an absolute point in time,\
        \ **even while the session is actively being used and the DB row is perfectly\
        \ valid**. The eviction is silent — no error, no code path notified. The next\
        \ access simply gets a miss.\n\nThis is the core database-engineering issue:\
        \ **two sources of truth with decoupled eviction/lifecycle policies**, and\
        \ the cache (Redis) is treated as authoritative for continuity when it is\
        \ only a volatile projection.\n\n---\n\n### 2. When Continuation Breaks (precise\
        \ breakdown)\n\nContinuation breaks exactly when **a Redis key that a later\
        \ request depends on is evicted by its fixed TTL, and the code has no correct\
        \ path to recover that state from the DB**.\n\nConcrete timing condition:\n\
        \n```\nt0      session created          SET interview:session:<id> ... EX\
        \ 1800   (30-min fixed TTL)\nt0+29m  user still answering ... key still alive\n\
        t0+30m  TTL expires, Redis deletes key (lazy or active eviction)\nt0+31m \
        \ user sends next turn → GET returns nil → session \"lost\"\n        DB row:\
        \ status='active', updated_at=t0+31m  → DB is fine, Redis is gone\n```\n\n\
        Continuation breaks in these sub-cases:\n\n| Trigger | What breaks |\n|---|---|\n\
        | Rebuild-on-miss absent | If code does `GET key` and, on null, returns an\
        \ error or resets to default state, the in-progress turn is lost. |\n| Read-modify-write\
        \ (RMW) | `INCR`, `RPUSH`, `Lua script`, `MULTI/EXEC` operate on prior Redis\
        \ state. After eviction they start from 0/empty → duplicate counts, lost turns,\
        \ off-by-one question pointers. |\n| Optimistic concurrency / locking | CAS\
        \ (`WATCH`), lease tokens, and mutex keys disappear → two instances can concurrently\
        \ grab the \"free\" lock → duplicated LLM calls, duplicate DB writes, double-charging.\
        \ |\n| No in-memory TTL-cancel | Other workers mutated a stale snapshot; only\
        \ one key exists and it's gone; no shared epoch/version to reconcile. |\n\
        | Token/continuation tied to Redis-only IDs | Client-supplied continuation\
        \ token maps to Redis ref → 401/404 despite a healthy DB session. |\n\n---\n\
        \n### 3. Why It Happens (the \"why\")\n\n**A. Fixed vs. sliding TTL is the\
        \ root defect.**\nA fixed TTL (`SET ... EX 1800`) commits to a single absolute\
        \ deadline. Active users are **not** shielded — the key dies at 30 minutes\
        \ whether the last interaction was 29 minutes ago or 5 seconds ago. A *sliding*\
        \ (renew-on-access) TTL re-arms the counter on every read/write, which is\
        \ the correct semantics for \"abandoned session cleanup.\"\n\n**B. Redis expiration\
        \ is asynchronous and opportunistic.**\nRedis evicts expired keys **lazily**\
        \ (on access) and **actively** (a background cycle samples keys periodically).\
        \ So expiry is not deterministic at the exact UTC instant; but the practical\
        \ effect is the same — the data is gone without any hook firing. There is\
        \ **no callback/event** your app receives.\n\n**C. Architectural mismatch:\
        \ cache treated as system-of-record.**\nThe DB survives because a DB row is\
        \ only deleted by *business logic* (cancel/complete), never by time. Redis\
        \ keys are deleted by *policy*. When you store the **only** copy of mutable\
        \ runtime state in a time-bounded store, you've coupled correctness to a clock.\
        \ The DB is valid but **cannot regenerate** derived state unless you've explicitly\
        \ written a reconstruction path.\n\n**D. Thundering rewrite / non-idempotent\
        \ writes.**\nEven if the app keeps a `last_synced_epoch`, a missing Redis\
        \ key combined with a fully valid DB row still loses the *delta* that happened\
        \ after the last DB flush. If the design flushes to DB only every N seconds\
        \ (batch), the TTL gap loses the un-flushed tail.\n\n**E. Read replica / multi-instance\
        \ skew.**\nOn a cluster, in-flight requests on instance B may still \"see\"\
        \ the session in its cache while the shared key is gone from the instance\
        \ that served the write — worsening the split-brain.\n\n---\n\n### 4. Configuration\
        \ / Code-Level Diagnosis\n\n**What to check first in the code base:**\n\n\
        ```python\n# ANTIPATTERN 1: fixed TTL + hard miss → error/silent reset\nr.set(f\"\
        interview:session:{sid}\", state_json, ex=1800)   # fixed, never renewed\n\
        \ndef next_turn(sid, user_input):\n    state = r.get(f\"interview:session:{sid}\"\
        )   # may be None after TTL\n    if state is None:\n        # DB row is ACTIVE,\
        \ but we bail:\n        raise SessionExpiredError  # or worse: fall through\
        \ with default state -> duplicates\n    ...\n```\n\n**Check 1 — is the TTL\
        \ ever renewed on access?** Grep for anything resembling renewal. If the code\
        \ only ever does `SET ... EX` once at creation and never `EXPIRE key <sec>`\
        \ on read/write, you have a fixed TTL.\n\n**Check 2 — is there a rebuild-from-DB\
        \ path on miss?** Look for a function that, given a miss, reconstructs state\
        \ from `interview_sessions` + `interview_turns`. If the null branch does not\
        \ do this and also guarded by an unlock/error, continuation is broken.\n\n\
        **Check 3 — are RMW ops present?** Counters/lists on the session key (dedup,\
        \ token buckets, transcript append) are the highest-risk to silently reset.\n\
        \n---\n\n### 5. Recommended Fixes (database-engineer recommendations)\n\n\
        **Fix A — Use sliding (rolling) TTL for liveness semantics.**\n```python\n\
        r.setex(f\"interview:session:{sid}\", INACTIVITY_TIMEOUT, json.dumps(state))\n\
        # on EVERY access:\nr.expire(f\"interview:session:{sid}\", INACTIVITY_TIMEOUT)\n\
        ```\nNow the key only dies after *inactivity* — the correct cleanup trigger\
        \ — and active interviews never silently expire. This alone eliminates most\
        \ continuation breaks.\n\n**Fix B — Make Redis a cache, DB the source of truth;\
        \ implement reconstruction on miss.**\n```python\ndef load_session_state(sid):\n\
        \    raw = r.get(f\"interview:session:{sid}\")\n    if raw is not None:\n\
        \        return json.loads(raw)              # fast path\n    row = db.query(InterviewSession).get(sid)\n\
        \    if row is None:\n        raise NotFound                      # genuinely\
        \ gone\n    # rebuild derived/transient state from durable rows:\n    state\
        \ = rebuild_from_db(sid, row)       # replay turns, recompute pointer\n  \
        \  r.setex(f\"interview:session:{sid}\", INACTIVITY_TIMEOUT, json.dumps(state))\n\
        \    return state\n```\nThe miss becomes a *re-hydration* point, not a failure\
        \ point.\n\n**Fix C — Align TTL with the durability/SLA contract; don't let\
        \ TTL undercut DB validity.**\nSet Redis TTL ≥ (DB entity lifetime + margin)\
        \ OR drop TTL entirely and drive eviction from a scheduled job (`ZADD` by\
        \ last-access, delete with a sliding window). Never let the cache outlive/underlive\
        \ the DB inconsistently — it should be ≥ the DB's persistence window for any\
        \ key that is the sole copy.\n\n**Fix D — Make RMW idempotent so a post-expiry\
        \ retry cannot corrupt state.**\nFor counters/list ops, either store a monotonic\
        \ `client_epoch` and reject stale deltas, or re-base counters on DB aggregates\
        \ after a miss:\n```python\nr.setex(f\"tokens:{sid}\", 60, token_bucket_from_db(sid))\
        \  # reconstruct, don't continue from 0\n```\n\n**Fix E — Add observability\
        \ for expiries.**\nUse `MONITOR`, or a keyspace notification (`notify-keyspace-events\
        \ Ex`) subscribed in your app to log/alert when `interview:*` keys are evicted\
        \ while the corresponding DB row is `active`. This surfaces the silent expiry\
        \ instead of hiding it.\n\n**Fix F — Fast-fail vs. recover as an explicit\
        \ product decision.**\nIf you cannot guarantee idempotent re-hydration, fail\
        \ *loudly and early* (`412 Precondition Failed` / retryable error) and ask\
        \ the client to retry with the DB-backed session — but never silently return\
        \ a default state.\n\n---\n\n### 6. Verdict\n\n| Question | Answer |\n|---|---|\n\
        | Does Redis expire silently while DB stays valid? | **Yes**, by design —\
        \ fixed TTL is autonomous, silent, async, and uncoupled from DB lifecycle.\
        \ |\n| When does continuation break? | On any request **after** a fixed-TTL\
        \ key's absolute deadline, when code lacks a DB-rebuild path, uses RMW/atomic\
        \ ops, or treats the LRU/eviction as authoritative. |\n| Why? | Fixed (non-sliding)\
        \ TTL does not track activity, Redis gives no expiration hook, and the runtime\
        \ state is stored as the sole copy in a time-bounded store while the DB (which\
        \ survives) was never wired to regenerate it. |\n\n**Primary recommendation:**\
        \ switch session keys to **sliding TTL + re-hydration from the DB on miss**,\
        \ and add keyspace-expiration monitoring. That converts silent, catastrophic\
        \ expiry into two modeling decisions — inactivity threshold and idempotent\
        \ rebuild — and makes the DB's enduring validity actually usable for continuity."
