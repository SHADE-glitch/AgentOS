        Scope: `InterviewStateStore.java` (fixed `TTL_HOURS = 24`, absolute expiry)
        + `InterviewService.java` (dual-'
      output: "## Redux/Redis — InterviewSession runtime-state TTL expiry: when &\
        \ why continuation breaks\n\nScope: `InterviewStateStore.java` (fixed `TTL_HOURS\
        \ = 24`, absolute expiry) + `InterviewService.java` (dual-write Redis↔DB,\
        \ `requireAsking` rehydration). Security-engineer review of the failure mode.\n\
        \n### 1. The core defect (root cause)\n\n`InterviewStateStore.write()` uses\
        \ an **absolute expiry stamp, not a sliding refresh**:\n\n```java\nredissonClient.getBucket(key(sessionId)).set(json,\
        \ TTL_HOURS, TimeUnit.HOURS);\n```\n\n- The 24h window is measured from the\
        \ **last write**, and every write *resets* it to a full 24h. So the real lifetime\
        \ = \"24h of *absolute wall-clock after the most recent state write*\", not\
        \ \"24h since session creation\".\n- The **DB row has no `expires_at` and\
        \ never expires** — `interview_session` stays `ASKING` indefinitely.\n- The\
        \ class doc claims Redis is the *\"单一权威来源\"* (single authoritative source),\
        \ yet the service maintains a **second, independent copy in the DB**. That\
        \ contradiction (authoritative cache + unexpiring truth) is the mismatch:\
        \ Redis can vanish while DB \"remains valid\" (not expired, not deleted).\n\
        \n### 2. When continuation breaks\n\n| Trigger | Mechanism | Continuation\
        \ impact |\n|---|---|---|\n| Candidate idle >24h of inactivity | Key evicted\
        \ by TTL between two `write()` calls | Next `answer`/`answerStream` hits null\
        \ state |\n| Long-lived active session (pauses on Q_n, resumes after 24h)\
        \ | Absolute TTL from last write expires even though session is legitimately\
        \ ongoing | Same as above |\n| Redis `maxmemory` eviction (`allkeys-lru` etc.)\
        \ fires before TTL | Key silently dropped under memory pressure | Same — and\
        \ *indefinitely* recoverable-looking but actually gone |\n| Redis restart\
        \ / cluster failover with persistence (`appendonly no` or unflushed) | Key\
        \ lost; DB intact | Same |\n| Clock skew / NTP step on app or Redis host |\
        \ Early/late expiry beats intent | Premature or delayed expiry |\n\nBecause\
        \ only the **DB** survives, and the *logic that decides \"can I continue\"\
        * lives in the **perishable** Redis key, the app's ability to know `status/questionCount/currentQuestionId`\
        \ deterministically disappears.\n\n### 3. Why it manifests as a *security*\
        \ and *state-integrity* problem here\n\n`requireAsking()` performs **fail-open\
        \ rehydration**:\n\n```java\nInterviewStateStore.SessionState state = stateStore.read(sessionId);\n\
        if (state == null) {\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
        \    ...\n    state = new InterviewStateStore.SessionState(s.getStatus(),\
        \ s.getQuestionCount(), s.getCurrentQuestionId());\n    stateStore.write(sessionId,\
        \ state);   // resurrects from DB\n}\n```\n\nThree concrete failure modes:\n\
        \n1. **`read()` conflates \"expired\" with \"parse failure\", both → null**\
        \ (`InterviewStateStore` lines 37–45). A poisoned/mutated Redis payload (tampering\
        \ should race → surfaced) silently degrades to the DB copy instead of alerting.\
        \ `INTERVIEW_NOT_FOUND` vs `REHYDRATE` vs `PARSE_FAIL` are indistinguishable\
        \ to the lead — bad observability of an integrity event.\n\n2. **Non-atomic\
        \ dual-write ⇒ DB may be the *less* authoritative copy.** In `finishSession()`\
        \ the DB is updated, then Redis is written, then the RabbitMQ scoring task\
        \ is dispatched. A crash between those steps leaves Redis stale (says `ASKING`)\
        \ while DB says `FINISHED`. Because rehydration only fires on `state == null`,\
        \ the stale **non-null** `ASKING` is trusted → user can keep submitting answers\
        \ to a *finished* session → duplicate scoring, duplicate result rows, message\
        \ replay. (This is a divergence bug, but TTL expiry *exacerbates* it: after\
        \ expiry the resurrected DB status is re-trusted even though an `interview_result`\
        \ row may already exist.)\n\n3. **Rehydration trusts DB blindly, enabling\
        \ state rollback.** If DB `status` is `ASKING`/`START` (no TTL, no tombstone)\
        \ but an `interview_result` exists, `requireAsking` resurrects an `ASKING`\
        \ state → a terminal state is silently rolled back to an in-progress state,\
        \ bypassing the `InterviewStatus.FINISHED` guard. This is the clean \"FINISHED\\\
        →ASKING\" resurrection attack/incident.\n\n### 4. Recommendations\n\n**Correct\
        \ the TTL semantics / lifetime alignment**\n- Add a session lifetime to the\
        \ DB (e.g. `expires_at`) and derive the Redis TTL from `min(now+TTL, expires_at-now)`.\
        \ The DB and cache then expire **together by policy**, removing the mismatch\
        \ that is the root cause.\n- If active sessions may legitimately exceed 24h,\
        \ use a **sliding TTL** refreshed on each read/access, with an upper bound\
        \ (absolute cap) so an abandoned session still reaps.\n\n**Treat DB as the\
        \ single source of truth; demote Redis to a cache with strong hygiene**\n\
        - On cache miss, rebuild from DB **and validate** rather than blindly trust:\n\
        ```java\nboolean hasResult = resultMapper.exists(sessionId);\nString status\
        \ = hasResult ? InterviewStatus.FINISHED.name()\n                        \
        \  : s.getStatus();          // never resurrect terminal state\nstate = new\
        \ SessionState(status, s.getQuestionCount(), s.getCurrentQuestionId());\n\
        ```\n- Add a **distinct error enum** so \"expired\", \"not found\", and \"\
        parse failure\" are distinguishable for alerting: `ResultCode.INTERVIEW_STATE_EXPIRED`\
        \ vs `INTERVIEW_NOT_FOUND` vs `INTERVIEW_STATE_CORRUPT`.\n\n**Detect / alert\
        \ instead of failing silent**\n- Subscribe to Redis `keyspace@0__:expired`\
        \ / `__:del` events for `interview:session:*`; log a metric and increment\
        \ a dashboard counter on unexpected expiry.\n- Log a WARN in `read()` on expiry\
        \ + rehydration (parity with DB) so silent resurrects are visible.\n\n**Secure\
        \ the resume window**\n- On continuation after rehydration, re-validate that\
        \ the reconstruct barriers hold (question history count ≤ MAX_QUESTIONS, no\
        \ existing result), and treat a resurrected session as a fresh auth/authorization\
        \ context (re-verify `requireOwnedSession`).\n- Keep the per-session Redisson\
        \ lock, but hold it **across the DB-read + Redis-write rehydration** (already\
        \ inside `lockFor`), so two concurrent read misses can't both resurrect.\n\
        \n**Redis config hygiene**\n- Set `maxmemory-policy volatile-ttl` so eviction\
        \ favors soon-to-expire keys over active sessions; monitor `evicted_keys`/`expired_keys`.\
        \ Avoid `allkeys-lru` which can evict active session keys early.\n\n### Bottom\
        \ line\nContinuation breaks **whenever the Redis key outlives its 24h absolute\
        \ TTL (idle, clock, eviction, or loss) while the DB session row remains `ASKING`**\
        \ — and it breaks *silently* because `requireAsking` fail-opens to the DB,\
        \ which can **roll a finished session back to in-progress** (duplicate scoring\
        \ / replay). Fix by aligning DB lifetime with the TTL (add `expires_at`),\
        \ demoting Redis to a validated cache (never resurrect terminal state), and\
        \ making expiry/parse-failure observable and distinct at the error-code layer."
