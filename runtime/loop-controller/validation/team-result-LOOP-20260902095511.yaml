        \ only.\n\n5. **Align the Javadoc** (InterviewStateStore.java:14) with reality;\
        \ document the DB fallback explicitly so future contributors don't add Redis-only\
        \ consumers (B1).\n\n### Minimal code change to stop the B2/B3 break in `requireAsking`\n\
        \n```java\nprivate InterviewStateStore.SessionState requireAsking(Long sessionId)\
        \ {\n    InterviewStateStore.SessionState state = stateStore.read(sessionId);\n\
