    summary: '# Interview Session Redis 状态静默过期 — 何时及为何续程会中断


      ## 目标

      - 业务目标:用户在中断/中途离开后面试可继续（续程），且运行时状态机(Redis)与持久态(DB)一致。

      - 当前约束:Redis 被注释声明为"单一权威来源"(`InterviewStateStore.java:15`);存在已接入的 DB 兜底逻辑;`interview_session`'
    output: "# Interview Session Redis 状态静默过期 — 何时及为何续程会中断\n\n## 目标\n- 业务目标:用户在中断/中途离开后面试可继续（续程），且运行时状态机(Redis)与持久态(DB)一致。\n\
      - 当前约束:Redis 被注释声明为\"单一权威来源\"(`InterviewStateStore.java:15`);存在已接入的 DB 兜底逻辑;`interview_session`\
      \ 表**没有 `updated_at`**，无法表达陈旧度。\n- 成功标准:精确定位静默过期发生的时间窗口、续程在哪条路径断裂、以及为什么现有\"\
      兜底\"是在掩盖漂移而非修复根因。\n\n## 问题判断\n\n### 何时过期(时间窗口)\n`InterviewStateStore.write()`\
      \ 每次写都调用 `bucket.set(json, 24, TimeUnit.HOURS)`(`:51`)，即**固定 TTL 且每次写入重置为 now+24h**。\n\
      \n- 活跃面试:每次 `create` 和每次 `answer`/`answerStream` 都会 `write`，持续推进则永不过期。\n- **危险窗口**:一次面试中途暂停\
      \ >24h。用户在\"已回答一道、看到下一题\"后离开超过 24h，期间无任何写入 → 键在 `lastWrite+24h` 被 Redis 主动驱逐。此时\
      \ `interview_session` 行**仍是 `ASKING`、`questionCount`、`currentQuestionId` 均有效**——DB\
      \ 看起来完全可续。\n- 结束后:仅写入一次 `FINISHED`，24h 后过期(对已结束会话无害;且 `delete()` 无任何调用方，见下)。\n\
      \n关键:TTL 是\"相对最后一次写入\"的静默期，而会话的真实生命周期由 DB 决定。两者解耦，故产生\"DB 有效但 Redis 权威已蒸发\"\
      。\n\n### 为何续程断裂(根因链,对应金标准 G1–G5)\n尽管 `requireAsking()`(`InterviewService.java:380-399`)在\
      \ Redis `null` 时做了 DB 兜底,续程并没有真正安全,断裂体现在下列四点:\n\n**G1 — 权威性倒置 + 静默 null。** Redis\
      \ 被当作状态机唯一依据,但读不到时 `read()` 吞掉所有异常并返回 `null`(`:37-45`)。整个系统无法区分\"会话真不存在/未开始/已过期/JSON\
      \ 损坏\",只能盲判。\n\n**G2 — 兜底不做新鲜度校验。** expiry 后 `requireAsking` 直接用 DB 灌出状态并**盲写回\
      \ Redis 并重置 24h TTL**(`:387-389`)。没有任何 `updated_at`/message 最大 id/状态迁移合法性校验(DB\
      \ 表本就无 `updated_at`,`:24`),无法判定\"这行 DB 是不是已经是被处理过/已结束但缓存丢失\"。\n\n**G3 — 兜底掩盖漂移,而非检测漂移。**\
      \ 盲 rehydrate + 重新缓存 24h,把\"Redis 丢了\"变成\"静默自愈\",日志、监控、告警全部看不到。下一次续程拿到的 `state`\
      \ 与用户实际作答进度可能不同。\n\n**G4 — 续程依赖已可缺失/过期的运行时状态。** `answer`/`answerStream` 的计数推进都来自\
      \ `newCount = state.questionCount() + 1`(`:179`,`:254`)。若 DB 的 `questionCount`\
      \ 落后(例如并发窗口或 DB 先写/Redis 后败),续程会推进出错误的问题序号,甚至重复/跳过题目。\n\n**G5 — Redis/DB 双写非事务。**\
      \ DB `updateById` 与 Redis `set` 分离(`:186-189`),两者之间崩溃或 Redis 写失败即出现不一致(master/slave、Redis\
      \ 抖动时尤其)。这在下一个 24h 窗口中放大成不可恢复的漂移。另注意 `delete()`(`:58-60`)在此代码库**零调用方**——已结束会话的键会一直残留到\
      \ TTL,增加误读与内存占用面。\n\n### 已知限制\n- 决策路径里\"续程按钮\"由 `/api/interviews/{id}`(纯 DB\
      \ 读取)驱动,所以 UI 永远显示\"可续\",把断裂藏到了提交答案那一刻。\n- 现有兜底只能救 `answer`/`answerStream` 这一条被\
      \ `requireAsking` 保护的路径;凡绕过它直接读 Redis 的调用方(如未来加的状态查询/SSE 续传心跳)都会硬断裂。\n\n## 方案设计\n\
      \n**方案 A — 延长 TTL / 滑动刷新**\n- 优点:改动最小。\n- 缺点:治标;长时间(多日学习)会话仍会过期;只推迟而非消除\"权威源失效\"\
      ;且使 Redis 承担本不该承担的持久语义。\n- 最佳:临时止血,不推荐作为正解。\n\n**方案 B — DB 为真相源 + 新鲜度/漂移检测(推荐)**\n\
      - 优点:复用已存在的 DB 投影;一致性由 ACID 事务保障;权威性回到可持久的事实源;残留缓冲只是 LRU 加速层。\n- 缺点:状态读取路径从\"\
      一次 Redis get\"变成\"读 Redis→miss 时才查 DB\";需加性迁移。\n\n**方案 C — 事务化双写 + TTL 语义化**\n\
      - 优点:与方案 B 可叠加,消除 G5 的窗口。\n- 缺点:事务跨 MySQL+Redis 需 Outbox/补偿,复杂度高,非本阶段必需。\n\n\
      **决策:**\n采用 **B + C 的轻量版**。理由:最小有效改动即把\"DB 为 truth、Redis 为可重建加速\"落地,并给会话状态加一个可比较的\"\
      版本/新鲜度\"字段,使兜底从\"盲灌\"变成\"校验后灌\"。残余风险:未来新增 runtime-only 字段(计时器、评分游标等)必须同步入 DB\
      \ 投影,否则仍旧会丢——以设计约束文档+单测固化。\n\n## 实施方案\n\n修改位置:`InterviewStateStore.java`、`InterviewService.java`、`schema.sql`。\n\
      \n1. **给运行态加版本/诸如性标记**(最小):`SessionState` 增 `lastMessageId + writtenAt`,并把\"\
      DB 侧最新 `interview_message.max(id)`\"作为续程对齐基准。\n\n2. **兜底改为\"校验后灌\"**(替换 `requireAsking`\
      \ 盲 rehydrate):\n```java\nSessionState st = stateStore.read(sessionId);\nif\
      \ (st == null) {\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
      \    if (s == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
      \    Long maxMsg = messageMapper.selectMaxId(sessionId);   // 真实性对齐基准\n    if\
      \ (s.getCurrentQuestionId() == null || !s.getCurrentQuestionId().equals(maxMsg))\
      \ {\n        log.warn(\"state drift: session={} currentQuestion={} maxMsg={}\"\
      , sessionId,\n                 s.getCurrentQuestionId(), maxMsg);         //\
      \ 检测而非静默\n    }\n    st = new InterviewStateStore.SessionState(s.getStatus(),\
      \ s.getQuestionCount(),\n                                              s.getCurrentQuestionId());\n\
      \    stateStore.write(sessionId, st);\n}\n```\n> 重点:加日志/指标,让\"自愈\"可见;并核对 DB\
      \ `questionCount` 与 `message` 实际条数是否一致,不一致就给 `stateCountError` 事件,而不是直接 +1。\n\
      \n3. **计数推进改从 DB 派生,而非运行时状态**(消除 G4):\n```java\nlong answered = messageMapper.countByKind(sessionId,\
      \ \"answer\");\nlong asked    = messageMapper.countByKind(sessionId, \"question\"\
      );\nint newCount  = (int) (asked + 1);            // 由持久态推导\n```\n\n4. **让 TTL\
      \ 只是缓存语义**:TTL 可保留(作为 LRU),但所有决策必须能在\"Redis miss 后纯净重建 DB\"得到相同结果——用上面的基准字段保证。\n\
      \n5. **补齐 `delete()` 调用**:`finishSession` 结束后(`:345`)对已结束会话调用 `stateStore.delete(sessionId)`,减少残留键与误读面。\n\
      \n风险点与处理:\n- 引入 `max(id)` 查询会增加一次 DB 读:仅发生在 Redis miss 的续程路径,可接受并注明。\n- 若将来加\
      \ runtime-only 状态,必须进 DB 投影,否则照丢:在 `SessionState` 注释与单测中固化。\n- 兼容性:新增字段用 Jackson\
      \ 默认值,旧缓存反序列化不破坏(测试覆盖)。\n\n## 验证方式\n- 单元/集成测试:\n  1. 写入状态 → `SET` 永不设置的短 TTL(`1s`)+\
      \ 等待 → 断言 `requireAsking` 走 DB 重建且 `questionCount` 与 `message` 条数一致。\n  2. 制造\
      \ DB/Redis `questionCount` 不一致 → 断言触发 `drift` 告警而非静默 +1。\n  3. 状态 TTL 内正常 `answer`\
      \ → `newCount` 与 DB 推导一致。\n  4. `finishSession` 后断言 `delete()` 被调用、键被清。\n- 预期结果:TTL\
      \ 过期后续程不依赖残留状态,全程由 DB 推导,任何漂移均被记录。\n- 复盘建议:上线后在 Dashboard/日志加\"state-miss 自愈次数、drift\
      \ 次数\"指标,作为权威源健康度的可观测信号;若未来接入超长时段(>24h)重启续传,再评估用 DB 事件表替代固定 TTL。\n\n## 结论(给团队的一句话)\n\
      续程断裂的根因不是\"TTL 太短\",而是**把本应休眠重建的加速层(Redis)当成了权威状态机**,且兜底逻辑\"盲灌+刷新 TTL\"掩盖了漂移。修正方向:DB\
      \ 为唯一事实源、Redis 纯缓存、续程计数从 DB(message 条数)推导,并在兜底路径加新鲜度/一致性校验与可见日志——而不是简单调大 TTL。"
