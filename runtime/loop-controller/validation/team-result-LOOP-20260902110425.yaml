      output: "## Root-cause & continuation-break analysis — Interview session state\
        \ in Redis with fixed TTL\n\n**Target:** `InterviewStateStore` (backend/.../interview/service/InterviewStateStore.java)\
        \ + `InterviewService.requireAsking()` (InterviewService.java:380).\n\nState\
        \ machine authority is Redis (`InterviewStateStore`, 24h fixed TTL, line 25/51),\
        \ durability is the `interview_session` row. Redis and DB are written **sequentially,\
        \ not atomically** (`answer` at InterviewService.java:186 → 188; `create`\
        \ at 114 → 116). Recovery on a cache miss already exists (`requireAsking`,\
        \ line 382→389 rebuilds from DB and rewrites Redis).\n\n### When and why continuation\
        \ breaks\n\n**1. Stale-but-present key after a non-atomic update crash (the\
        \ real bug).**\n`sessionMapper.updateById` (DB, committed) → `stateStore.write`\
        \ (Redis). If an exception/crash lands between them, DB holds newer state\
        \ while Redis keeps the *previous* snapshot. Because `requireAsking` recovers\
        \ **only when the key is absent** (line 382 `state == null`), a key that is\
        \ present-but-stale is served as authoritative — the DB is silently ignored.\
        \ Consequences: `answer` continues from `state.questionCount()+1` (line 179)\
        \ → double-counted / duplicated question selection; possibly re-picks an already-asked\
        \ question. The fixed 24h TTL makes this corruption last **up to 24h** instead\
        \ of self-healing. Symptom matches the report: DB valid, Redis wrong, continuation\
        \ misbehaves.\n\n**2. Session paused longer than TTL (legitimately).**\nA\
        \ live session idle >24h drops the key. Here `requireAsking` *does* repair\
        \ (DB-backed rebuild + re-write with fresh TTL). So the plain \"TTL expired,\
        \ DB valid, then user answers\" path is recovered — **but only because every\
        \ read goes through `requireAsking` and only because the DB row is a faithful\
        \ mirror at rest.** It works *by accident of the recovery path*, not by design.\n\
        \n**3. Loss of runtime-only state on rebuild.**\nRecovery reconstructs only\
        \ `{status, questionCount, currentQuestionId}` from DB. If the design ever\
        \ keeps e.g. transient \"asked-this-round,\" cooldown, or per-lock lease info\
        \ only in Redis, a TTL-miss rebuild silently discards it; continuation proceeds\
        \ semantically wrong (or a duplicate is possible via the DB `askedQuestionIds`\
        \ filter). Currently harmless; fragile for extensions.\n\n**4. Reb repair\
        \ path itself mutates on a read path** (`requireAsking` writes to Redis).\
        \ Under the per-session lock this is safe today, but any future lock-free\
        \ read (e.g. a GET for polling) that touches it creates a write race and a\
        \ second clock (TTL vs row) to reason about.\n\n### Root cause (single statement)\n\
        Two authoritative stores (Redis = \"single source of truth\" commented in\
        \ InterviewStateStore.java:15, DB = durable record) kept in sync **non-atomically**,\
        \ reconciled **lazily and only on key-absence**. Fixed 24h TTL then becomes\
        \ a second clock that invalidates state on *time* while the DB still looks\
        \ valid — and the reconciliation logic can't distinguish \"expired (safe to\
        \ rebuild from DB)\" from \"present-but-stale (unsafe).\"\n\n### Decision\
        \ framework\n\n**Option A — DB as source of truth, Redis as cache (read-through\
        \ / validate on every read).**\n- Strengths: TTL becomes harmless; crash window\
        \ disappears; DB already authoritative for `detail`/`list`/`result`.\n- Weaknesses:\
        \ extra read of the row per answer (cheap, index + one row); changes the \"\
        state machine in Redis\" architecture.\n- Best for: long-lived, resumable\
        \ sessions; robustness-focused.\n\n**Option B — Keep Redis as authority; refresh\
        \ TTL on read (sliding) + tombstone/version.**\n- Strengths: minimal change;\
        \ keeps hot-state in Redis.\n- Weaknesses: still two clocks; staleness-undetected\
        \ problem persists (need version column to detect); more complexity than it\
        \ fixes.\n- Best for: hot-path performance where a DB read per op is unacceptable.\n\
        \n**Option C — Make the write atomic-ish: DB in a tx, then Redis write; on\
        \ any Redis failure, fall back to a DB-read-through flag.**\n- Strengths:\
        \ directly fixes the crash window; minimal read overhead (only on failure/miss).\n\
        - Weaknesses: partial; still needs the validate-on-read from A unless combined.\n\
        \n**Recommended: A + C (combination).**\nDB is the single durable truth; extend\
        \ the existing recovery in `requireAsking` (which is already a correct DB-read-through\
        \ on miss) to also run when the key is present: compare Redis state to the\
        \ row (`status`/`questionCount`/`currentQuestionId`), and on mismatch trust\
        \ the row and rewrite. Gate writes under the existing lock. This makes fixed\
        \ TTL a non-issue entirely (expiry == harmless cache miss) and removes the\
        \ staleness window.\n\n### Concrete recommendations (config + code)\n\n1.\
        \ **Validate on every state read**, not only on absence (`requireAsking`):\n\
        \n```java\nprivate SessionState requireAsking(Long sessionId) {\n    SessionState\
        \ cached = stateStore.read(sessionId);\n    // DB is the durable authority;\
        \ reconcile any time the row is ahead.\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
        \    if (s == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
        \    SessionState fromDb = new SessionState(s.getStatus(), s.getQuestionCount(),\
        \ s.getCurrentQuestionId());\n    if (cached == null || !cached.equals(fromDb))\
        \ {\n        stateStore.write(sessionId, fromDb);   // TTL refresh doubles\
        \ as sliding TTL\n        cached = fromDb;\n    }\n    if (InterviewStatus.FINISHED.name().equals(cached.status()))\
        \ throw new BizException(ResultCode.INTERVIEW_FINISHED);\n    if (!InterviewStatus.ASKING.name().equals(cached.status())\n\
        \            && !InterviewStatus.START.name().equals(cached.status()))\n \
        \       throw new BizException(ResultCode.INTERVIEW_STATE_ERROR, \"当前状态不允许提交答案\"\
