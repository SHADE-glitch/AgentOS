      output: "# Database Engineer Contribution — Redis TTL Expiry vs. DB-Validity\
        \ Continuation\n\n## 结论（TL;DR）\n\nThe TTL is a **fixed 24h**, reset on every\
        \ write — i.e. a *sliding idle window* of 24h of no state-machine activity.\
        \ It fires **only after an interview sits idle for 24 consecutive hours**\
        \ while the DB row stays alive.\n\nA naive design (Redis is the sole state-machine\
        \ authority, no fallback) **hard-breaks continuation** on expiry. This codebase\
        \ actually has a DB-rehydration fallback in `requireAsking()` (`InterviewService.java:380`),\
        \ so a *pure idle-TTL expiry is silently masked*, not hard-breaking. **But**\
        \ that masking is itself the security-relevant \"silent\" bug: it can resurrect\
        \ the session from a peeked DB view, reintroduce stale/regressive state after\
        \ a failed dual-write, and mislead operators about durability. The genuinely\
        \ breaking scenarios are listed in §3.\n\n---\n\n## 1. When the expiry actually\
        \ fires (mechanics in this repo)\n\n`InterviewStateStore.write()` (`InterviewStateStore.java:48-56`):\n\
        \n```java\nredissonClient.getBucket(key(sessionId)).set(json, TTL_HOURS, TimeUnit.HOURS);\
        \ // TTL_HOURS = 24\n```\n\n- `TTL_HOURS = 24` is a **fixed** value applied\
        \ at every write → effective **sliding window** (24h of inactivity to expire).\n\
        - Fires when a session is **silent ≥ 24h** and the value is *never* re-written.\
        \ E.g. an interview abandoned overnight / over a weekend: the durable `interview_session`\
        \ row (DB) still says `status=ASKING`, `question_count=3`, `current_question_id`,\
        \ but the runtime key `interview:session:{id}` is gone.\n\n| Property | Value\
        \ in this repo | Meaning |\n|---|---|---|\n| TTL | fixed 24h, reset per write\
        \ | sliding idle window |\n| Authority | javadoc claims Redis is \"状态机的单一权威来源\"\
        \ (`InterviewStateStore.java:15`) | but fallback exists in caller |\n| DB\
        \ mirror | `status/question_count/current_question_id` updated per transition\
        \ | partial, non-atomic twin |\n\n---\n\n## 2. Why naive continuation breaks\
        \ (the core pattern, DB-valid but Redis-expired)\n\nRedis is a **snapshot\
        \ cache**, not an authoritative store for a **finite state machine whose correctness\
        \ depends on ordering and monotonic progress**. When the key expires while\
        \ the DB is still valid:\n\n- **Progress loss:** `questionCount` / `currentQuestionId`\
        \ vanish; the machine cannot know \"ask #4\" or \"finish now\".\n- **Ordering\
        \ lost:** nothing records *which* questions are exhausted; a resume risks\
        \ re-asking an already-asked question or re-scoring an answered pair.\n- **Read-time\
        \ null is not \"not found\":** `read()` returns null (`InterviewStateStore.java:38`)\
        \ which collides with \"session never existed\" → UI sees 404/`INTERVIEW_NOT_FOUND`\
        \ on a perfectly valid DB session, or worse triggers a **duplicate `create()`**.\n\
        - **No graceful signal:** Redis gives no \"expired, please rehydrate\" — only\
        \ silent absence, so the failure is invisible in logs and dashboards.\n\n\
        This is precisely why \"Redis always wins for runtime, then expires on a wall-clock\
        \ TTL\" is a footgun: **the cache is the only thing holding progress, but\
        \ its lifetime is decoupled from the DB's truth.**\n\n---\n\n## 3. What actually\
        \ breaks *in this codebase*, and when\n\nBecause `requireAsking()` already\
        \ rehydrates from DB when Redis is null, we must be precise — the honest findings:\n\
        \n**3a. Pure idle-TTL expiry → masked, not clean, but currently recoverable\
        \ for ASKING.**\n`requireAsking()` (`InterviewService.java:381-390`) reads\
        \ Redis → null → loads DB row → rebuilds `SessionState` → writes back. So\
        \ an ASKING session resumes correctly. **This works only because the DB columns\
        \ are a faithful one-field-per-column mirror and rehydration is lossless for\
        \ those 3 scalars.** That coupling is fragile and undocumented.\n\n**3b. TRUE\
        \ break — dual-write skew / partial failure (DB ahead, Redis stale-live).**\n\
        Every transition writes DB *first*, Redis *second* (`InterviewService.java:186-189`\
        \ etc.), outside any transaction, serialized only by the Redisson lock. If\
        \ the Redis write throws, `stateStore.write()` → `BizException`, the request\
        \ aborts, but the **DB commit already applied**. Now Redis holds the *previous*\
        \ snapshot — still alive (no expiry), so `requireAsking` **reads the stale\
        \ value and does not fall back** → the machine regresses (wrong `questionCount`/`currentQuestionId`)\
        \ while DB is the real truth. This is a *silent* divergence with the same\
        \ symptom the task describes, and TTL absolutely makes it worse (adds late-null\
        \ on top of stale-live).\n\n**3c. TRUE break — corrupted/partial value treated\
        \ as \"expired\".** `read()` returns null on **any** JSON parse failure (`InterviewStateStore.java:42-45`)\
        \ — a truncated write, a server-upgrade schema change, or memory-pressure\
        \ partial eviction all collapse into the same \"null\" branch and silently\
        \ rehydrate from DB, losing whatever the Redis snapshot uniquely held.\n\n\
        **3d. FINISHED visibility asymmetry.** If Redis is rebuilt from DB for a FINISHED\
        \ row via `requireAsking` (`InterviewService.java:391-393`) it correctly throws\
        \ `INTERVIEW_FINISHED`. Good. But any reader path that does **not** go through\
        \ `requireAsking` (e.g. `detail()`, `result()` at lines 291, 301) reads DB\
        \ truth directly, so the \"authority\" of Redis is inconsistent across controllers\
        \ — a latent consistency contract violation.\n\nNet for lead/review: **with\
        \ TTL alone, continuation is masked by a lossy, silent, none-atomic fallback;\
        \ the code-hard breaks are the dual-write skew and the parse-failure collapse.**\
        \ All share the root cause: **two overlapping sources of truth, none of them\
        \ reconciled.**\n\n---\n\n## 4. Recommendations (concrete)\n\nEstablish **one\
        \ write path, monotonic versioning, and reconciliation** instead of \"TTL\
        \ + hope\".\n\n**R1 — Make TTL generous & keyed to inactivity, never the authority\
        \ boundary.** Raise to e.g. 72–168h and/or add `EXPIRE` on successful *read*\
        \ (sliding idle rather than wall-clock): `redisTemplate.expire(key, ...)`\
        \ inside `read()`.\n\n**R2 — Versioned immutable snapshots to detect stale-vs-current.**\
        \ Add a monotonically increasing `version` (read from DB) into `SessionState`,\
        \ and on rehydration *write-back only if the DB version is ≥ the snapshot's\
        \ version* — this destroys 3b (stale-live regression). Redisson supports this\
        \ natively via `RBucket.compareAndSet`:\n\n```java\nString newJson = objectMapper.writeValueAsString(new\
        \ SessionState(\n    state.status(), state.version()+1, state.questionCount(),\
        \ state.currentQuestionId()));\n// only overwrite if we're not clobbering\
        \ a newer writer; TTL refreshes on CAS success\nbucket.trySet(json, TTL_HOURS,\
        \ TimeUnit.HOURS);\n```\n\n**R3 — Make the DB row the single source of truth;\
        \ Redis purely a read-cache.** Drop the \"single authority\" javadoc claim\
        \ (`InterviewStateStore.java:15`). Derive the state machine's input from DB\
        \ (`interview_session` + `interview_message`), and treat Redis hit as an optional\
        \ fast path; rehydration should be the *default*, a Redis miss never an error\
        \ nor a silent regression.\n\n**R4 — Reconciliation job (already have `DashboardService`/R2-backed\
        \ data).** A low-frequency sweeper (e.g. every hour) scans sessions where\
        \ `status != FINISHED` and `updated_at < now() - 24h`; if Redis key absent\
        \ but DB valid, rebuild the snapshot and log an `expiry-recovered` metric.\
        \ This converts a silent event into an observable one.\n\n**R5 — Observability\
        \ on the null branch.** Log at warning/`DEBUG` with reason tag (`absent` vs\
        \ `parse_failed`) in `read()`, and count both in metrics — so the \"silent\"\
        \ period is surfaced.\n\n**R6 — Fix the dual-write ordering.** Since DB must\
        \ be authoritative (R3), do the Redis write first, then DB; on DB failure,\
        \ clear the tentative key. Under the existing per-session lock this removes\
        \ the DB-ahead/Redis-stale window.\n\n---\n\n## 5. Verification\n\n- **Unit:**\
        \ `InterviewStateStore` — write → expire → `read()` returns null; **fallback**\
        \ path yields DB-consistent state and re-writes; **stale** path with CAS refuses\
        \ old version.\n- **Failure injection:** kill Redis (`docker stop aiview-redis`\
        \ in `docker-compose.yml`) mid-`answer` → confirm DB stays coherent and next\
        \ call rehydrates rather than erroring.\n- **Clock/TTL test:** set `TTL_HOURS`\
        \ low (e.g. `1`), hold session idle past TTL, resume → assert correct `questionCount`/`currentQuestionId`\
        \ and **no re-ask of PQ**.\n- **Concurrency skew test:** force `stateStore.write`\
        \ to throw after DB commit → assert the rehydrated version `<` DB version\
        \ triggers re-read, `> ` stale-live is rejected.\n- **Expected:** continuation\
        \ either resumes from DB truth or fails loudly; never silently returns wrong\
        \ progress; and a metric/log appears on every expiry-recovery.\n\n**Risk note:**\
        \ R3 semantic change touches all readers (state is Duck-typed `SessionState.status()/questionCount()/currentQuestionId()`),\
        \ so keep the record shape stable and route any refactor through `InterviewStateStore`\
        \ so both authority and fallback live in one place."
