      output: "# Code Review — Redis Fixed-TTL Session Expiry (Database Engineer /\
        \ Code Reviewer)\n\n**Verdict: approve-with-changes.** The design intent (Redis\
        \ as \"single authoritative source\" of the state machine) is internally inconsistent\
        \ with an ephemeral TTL'd cache, and the expiry path is silently masked by\
        \ a lossy DB fallback. Continuation does not hard-fail — it degrades invisibly,\
        \ which is worse for an AI interview session.\n\n## 1. Where the TTL lives\n\
        \n- `InterviewStateStore.java:25` — `TTL_HOURS = 24`, a **fixed absolute**\
        \ TTL.\n- `InterviewStateStore.java:51` — `bucket.set(json, TTL_HOURS, HOURS)`,\
        \ applied on every `write()` cross the START → ASKING → FINISHED state machine.\n\
        - `InterviewStateStore.java:34-46` — `read()` returns `null` for *both* \"\
        key missing\" and \"JSON corrupt\".\n- `InterviewService.java:15` comment\
        \ — \"作为状态机的单一权威来源\" (single authoritative source).\n- `InterviewService.java:380-399`\
        \ — `requireAsking()` silently re-hydrates from the DB when Redis returns\
        \ `null`.\n\n## 2. When and why continuation breaks\n\nBecause `requireAsking()`\
        \ has a DB fallback, the key won't hard-fail — it **silently drops the authoritative\
        \ in-memory state and rebuilds a coarser version**. Concretely:\n\n**Scenario\
        \ A — idle interview > TTL.** User starts an interview, mirrors this in Redis,\
        \ then resumes 25h later. The `interview:session:{id}` bucket is gone while\
        \ the DB row is still `status=ASKING`. `requireAsking()` reconstructs from\
        \ `InterviewSession` (status/questionCount/currentQuestionId). For `create()/answer()`\
        \ these DB fields were kept in sync, so it usually recovers — but only because\
        \ Redis is *not* actually load-bearing, which contradicts line 15's invariant.\
        \ Any divergence between the two stores is now silently resolved in favor\
        \ of the DB with **no log, no metric, no reconciliation**.\n\n**Scenario B\
        \ — in-flight expiry during long operations.** `answerStream()` (a virtual-thread/SSE\
        \ flow) reads the state under the distributed lock, but the lock does **not**\
        \ renew the TTL — it holds only the lock lease and is unrelated to key lifetime.\
        \ A long AI generation, a Redis restart, or an eviction can remove the bucket\
        \ mid-transaction; reconstruction then races the already-committed DB writes.\n\
        \n**Scenario C — Redis eviction / restart (not TTL-dependent).** Neither `RedissonConfig.java`\
        \ nor `docker-compose.yml` sets `maxmemory-policy`. Redis 7 defaults to `noeviction`,\
        \ but if an operator/managed instance sets `allkeys-lru`/`volatile-lru` (common),\
        \ every state key is silently evictable **before** its 24h TTL. The DB row\
        \ stays valid forever; the authoritative state vanishes with no error path\
        \ — `read()` returns `null` and is masked.\n\n**Scenario D — corrupt state\
        \ treated as expired.** `read()` maps a `JsonParseException` to `null` (line\
        \ 42-45), so corruption is indistinguishable from expiry and silently re-hydrates.\n\
        \n**Root causes (DB-engineer framing):**\n1. **Authority inversion.** Durable\
        \ truth (the `interview_session` row) is treated as fallback, while an evictable/expiring\
        \ cache is treated as \"single source\". Any actor that changes only one store\
        \ produces drift with no detection.\n2. **Absolute vs. sliding TTL.** `set(key,\
        \ v, 24h)` is not renewed on `read()`; there is no `expire(` refresh, so an\
        \ *active-in-idle* session (user thinking >24h, or an interview spanning calendar\
        \ days) is treated identically to an abandoned one.\n3. **`questionCount`\
        \ is Redis-derived.** `answer()` increments `state.questionCount() + 1` (`:179`,\
        \ `:254`) — the counter source of truth is the volatile key, not the DB. The\
        \ DB only stores the *result* of that increment, so after expiry the increment\
        \ chain restarts from whatever the DB last committed, silently resetting progression\
        \ if the DB commit ever lags the cache write.\n\n## 3. Recommended fixes\n\
        \n**R1 — Make the DB the single source of truth; demote Redis to a read-through\
        \ cache (primary).**\nThe state machine should be authoritative in `interview_session`;\
        \ Redis is only a fast-path. Then expiry is harmless by construction because\
        \ the cache's missing value always means \"re-read DB\" — which is exactly\
        \ what `requireAsking()` already does.\n\n```java\nprivate SessionState requireAsking(Long\
        \ sessionId) {\n    // DB is the system of record; cache is best-effort only\n\
        \    InterviewSession s = sessionMapper.selectById(sessionId);\n    if (s\
        \ == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n    SessionState\
        \ state = stateStore.read(sessionId);\n    if (state == null || !matches(s,\
        \ state)) {\n        state = new SessionState(s.getStatus(), s.getQuestionCount(),\
        \ s.getCurrentQuestionId());\n        stateStore.write(sessionId, state);\
        \           // rehydrate + renew TTL\n        log.warn(\"session state rehydrated\
        \ from DB, sessionId={} (silent expiry recovered)\", sessionId);\n    }\n\
        \    ...status checks...\n}\n```\n\n**R2 — Sliding expiration with a hard\
        \ cap, if Redis must carry authority.** Renew on read so an active session\
        \ never expires, while still bounding abandoned ones:\n```java\npublic SessionState\
        \ read(Long sessionId) {\n    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \    String json = bucket.get();\n    if (json == null) return null;\n   \
        \ bucket.expire(TTL_HOURS, TimeUnit.HOURS);          // refresh on access\n\
        \    ...\n}\n```\nBut prefer R1 over this — sliding TTL still leaves glitch-window\
        \ divergence on restart/eviction.\n\n**R3 — Align TTL with DB lifecycle; delete\
        \ the key on FINISHED.** A session whose DB row is `FINISHED` is durable;\
        \ the cache key no longer needs a TTL at all — delete it, then the FINISHED\
        \ check reads from DB only:\n```java\npublic void finishSession(...) {\n \
        \   ...\n    stateStore.write(session.getId(), new SessionState(FINISHED,\
        \ ...)); // no TTL, or short TTL\n    stateStore.setNoExpiry(session.getId(),\
        \ ...); // or delete when result is written\n}\n```\n\n**R4 — Make silent\
        \ divergence observable.** Never collapse \"missing\" and \"corrupt\" into\
        \ one `null` (R1's `!matches` handles it). Log + counter on every fallback\
        \ so the lead can see expiry counts in the runtime benchmark (`Phase-8.2.1.2/Runtime-Validation`).\n\
        \n**R5 — Guard Redis config (ops harness fix), DB-engineer side:**\n- Set\
        \ persistence: `redis:7` with `redis-data:/data` → enable `appendonly yes`\
        \ and a yes/no save policy so restarts don't wipe session keys.\n- Pin eviction\
        \ for the state namespace: set `maxmemory-policy noeviction` and/or route\
        \ session keys with `volatile-ttl` if you rely on bound lifetime.\n- Bound\
        \ TTL to **maximum session duration** + margin, not a magic 24h — derive from\
        \ `InterviewSession.startedAt` if a per-session cap is wanted.\n\n## 4. Summary\
        \ for the lead\n- The flaw is **architectural, not just a TTL value**: declaring\
        \ an ephemeral cache the authoritative state machine while leaving the durable\
        \ DB row un-timed makes silent expiry a guarantee, not an edge case.\n- Continuation\
        \ breaks in the **invisible** sense: no client error, no active-session crash,\
        \ just an unlogged re-hydration that can (a) reset Redis-derived `questionCount`\
        \ progression, (b) race in-flight SSE/streamed operations, and (c) diverge\
        \ if the DB commit ever lags the cache write.\n- Fix priority: **R1 (DB as\
        \ source of truth)** > **R3 (lifecycle-bound TTL/delete-on-finish)** > **R4\
        \ (observability of fallback)** > R5 (ops/eviction hardening). R2 only if\
        \ the team insists on cache-authority."
