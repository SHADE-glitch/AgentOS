      summary: '## 诊断结论


        Interview 会话在 Redis 中以固定 TTL 存储运转态（running state），而**持久事实（enrolled candidates、answered
        questions、scores）落在 MySQL/PG**。当 Redis key 因 TTL 超时静默淘汰时，服务继续从 DB 读到"会话仍有效"，导致
        continuation 从**中间状态**而非*'
      output: "## 诊断结论\n\nInterview 会话在 Redis 中以固定 TTL 存储运转态（running state），而**持久事实（enrolled\
        \ candidates、answered questions、scores）落在 MySQL/PG**。当 Redis key 因 TTL 超时静默淘汰时，服务继续从\
        \ DB 读到\"会话仍有效\"，导致 continuation 从**中间状态**而非**最后运转位**恢复。核心矛盾：**TTL 绑定错了对象**——把\"\
        运转态（transient）\"和\"会话实体（durable）\"混为同一个存储键生命周期。\n\n---\n\n## 问题判断\n\n**根因分类**（三选一或叠加）:\n\
        \n1. **单一 TTL 绑定时间过短** — 活生生的、用户仍在答题的会话其 Redis 态先于 DB 逻辑结束前被淘汰（如 TTL=30min\
        \ 但用户答题 45min）。\n2. **轮询区间 > TTL 剩余** — 前端每 5 分钟续写一次（`touch`），但服务器重启/容器重建后，`last_seen`\
        \ 从 DB 重建，错过了 Redis 中的 `IN_PROGRESS` 位，导致方向性丢失。\n3. **续写（sliding） vs 固定（fixed\
        \ TTL）** — 固定 TTL 不区分\"空闲\"与\"进行中\"，空闲不过期、进行中也过期，语义错误。\n\n**continuation 何时/为何断**:\n\
        - `GET /interview/{id}/continue` 时 application 从 Redis 读游标（当前题号、已选答案草稿、计时器），key\
        \ 已失效 → `MISS` → 降级到 DB 读取 → DB 只有在**上一步已提交/持久化**的进度 → 丢失最后 N 次未落库的推进（草稿、最后一题作答、倒计时）。\n\
        - 结果：用户被\"回拨\"到较早阶段，或 session 被判定继续但状态被错误重置，表现为**静默丢进度、无任何错误提示**——这是最难排查的一类故障。\n\
        \n---\n\n## 架构建议\n\n### 方案 A — Sliding TTL + 服务端续写（最小改动，推荐先做）\n- Redisson/RestTemplate\
        \ 用 `EXPIRE key <ttl> XX`（只在存在时续期）做每收到一方 heartbeat 续写。\n- 保存时存**剩余 TTL**到\
        \ DB 侧字段，DB 结构上增加 `last_activity_at` 与 `session_token`。\n- 优点：改动小、兼容现有读路径。缺点：TTL\
        \ 兜底逻辑仍在应用层。\n\n### 方案 B — 分离 durable session 与 transient runtime（数据归属分离，推荐）\n\
        一个 key 一个生命周期，严禁混用：\n\n| 存储 | 内容 | 生命周期 |\n|------|------|----------|\n| DB（source\
        \ of truth） | 会话实体、已提交作答、分数、参与者 | 与业务一致（不随空闲淘汰） |\n| Redis（cache/transient）\
        \ | 当前游标、倒计时、草稿、inflight 作答 | TTL = **空闲超时**，非总时长 |\n\n**判定 continuation 的规则**：\n\
        ```\nif redis.exist(token):            # 有运转态 → 无缝续\n    resume from redis\n\
        elif db.session_status == ACTIVE:  # DB 有效但 redis 无态 → 损坏/过期\n    reconcile:\
        \ rollback 未提交事务 → 从最后持久化点续\nelse:\n    fresh/abandoned\n```\n\n### 方案 C —\
        \ 不依赖 Redis 的续写，直接用 DB(秒级) \n若会话 QPS 低（无高并发热读），可去掉 Redis 全程，只做 DB。Redis 沦为纯缓存、可随意淘汰。\n\
        \n---\n\n## 实施要点\n\n**关键模块**：`SessionLock`（续写防抖）、`SessionCoordinator`、`ActivityHeartbeatFilter`。\n\
        \n**数据流**（推荐方案 B）：\n```\nclient action ──> filter: touch(redis, ttl=IDLE_TIMEOUT,\
