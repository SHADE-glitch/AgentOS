    output:
      agent: security-engineer
      status: completed
      summary: '## Security Engineer Review — Redis Session-State Expiry vs. Valid
        DB


        **Subject file:** `backend/src/main/java/com/aiview/interview/service/InterviewStateStore.java`
        + `InterviewService.java:125-399`'
      output: '## Security Engineer Review — Redis Session-State Expiry vs. Valid
        DB


        **Subject file:** `backend/src/main/java/com/aiview/interview/service/InterviewStateStore.java`
        + `InterviewService.java:125-399`


        ### 1. The architecture that causes this


        There are **two non-transactional mirrors** of the same state machine:


        - **Redis** `interview:session:<id>` = `SessionState(status, questionCount,
        currentQuestionId)` — commented as the *single source of truth*, written on
        every transition via `stateStore.write(...)`, keyed with a **fixed 24 h TTL**
        (`TTL_HOURS = 24`, `InterviewStateStore.java:25,51`).

        - **DB** `interview_session` — durable mirror with the same three columns
        (`schema.sql:51-53`): `status`, `current_question_id`, `question_count`.


        Every transition updates DB **first**, then Redis (`InterviewService.java:183-189`,
        `258-264`). Ordering matters. And `requireAsking()` (`:380-399`) has a **silent
        recovery path**: on a Redis miss it rehydrates from the DB row and **re-writes
        Redis with a fresh 24 h TTL**.


        That last line is the crux of the bug: the fallback *masks* expiry, so the
        failure only manifests in the cases below where rehydration is wrong or impossible.


        ### 2. When and why continuation silently breaks


        **(a) TTL fires after ≥24 h idle — state diverges, fallback re-anchors the
        poison.**

        `write()` renews TTL to 24 h from the *last write*, so it is a fixed window
        of *inactivity*. If the DB write succeeded but the Redis `write` then threw
        (`"会话状态写入失败"`, `:53-54`), the DB has advanced while Redis keeps the **older
        state with a freshly renewed 24 h TTL**. Because the stale key is *present*
        (`read()` returns non-null), `requireAsking` never runs the DB fallback —
        the stale Redis state wins for up to 24 h. Visible result: `questionCount`
        off-by-one, or the wrong `status`, so `answer()` continues/terminates incorrectly.
        Silent, persistent.


        **(b) The DB''s "validity" is what makes the fix dangerous.**

        The fallback (`:382-389`) assumes DB is a perfect mirror. It is not — it is
        updated non-atomically with Redis. A crash/exception *between* DB update and
        Redis write, or a Redis failure, makes the two diverge. Once divergent, rehydration
        can resurrect either stale counts (early/late termination via `shouldFinish`,
        `:148`) or re-enable a session that DB already marked `FINISHED` — violating
        the `INTERVIEW_FINISHED` invariant. Functionally the interview is "continuable"
        (DB valid) but the continuation is semantically wrong.


        **(c) Eviction beats TTL entirely.**

        `docker-compose.yml:24-32` runs stock `redis:7-alpine` with **no `maxmemory`/policy**
        set, so under a default it is `noeviction`/unlimited — but if an operator
        adds `maxmemory` with `allkeys-lru`/`allkeys-random` (the typical shared-cache
        config), Redis drops the key **regardless of TTL, at arbitrary times, even
        mid-answer-stream between writes**. This is the true "silent expire" — the
        24 h TTL is a false guarantee. The fallback rehydrates and re-anchors, and
        here re-anchoring is actively harmful: every resume silently restarts the
        24 h window, so **abandoned sessions are never reclaimed**; under a memory
        cap this hoards until the policy evicts the very sessions being rehydrated
        → cascading thrashes.


        **(d) Genuinely unrecoverable breaks — rehydration cannot save these:**

        1. **Lock-key volatility / concurrent continuation.** The distributed lock
        also lives in Redis (`interview:lock:<id>`, `:362`). If keys are flushed/evicted
        while `answerStream` holds the lock, the lock is silently released; a concurrent
        `answer` re-acquires and runs in parallel with the in-flight stream → duplicate
        `saveUserMessage`, double scoring, two `FINISHED` writes. No DB rehydration
        repairs a concurrency violation.

        2. **In-flight stream abort mid-transition.** `answerStream` writes DB then
        Redis; a failure between them leaves DB with the next question and Redis missing/stale.
        Retry re-enters and **re-saves the user answer again** (`saveUserMessage`,
        `:207`) — no idempotency → duplicated QA pair → `extractQAPairs`/`shouldFinish`
        miscount → interview ends early/late. A true data break that rehydration cannot
        dedupe.

        3. **Non-mirrored state is lost wholesale.** Today all three fields are mirrored,
        so the lossy surface is only ordering/consistency. The moment the state grows
        (in-flight AI/LLM context, partial answer buffer, SSE cursor), Redis-only
        state is wiped by TTL with **zero DB recovery -> continuation fully breaks**.
        This codebase already has SSE (`answerStream`) — the vector is live.


        ### 3. Recommended fixes


        **Config (Redis):**

        - Do not run session-state on an evictable instance. Set `maxmemory` + `maxmemory-policy
        noeviction` for this instance, or isolate session state onto its own Redis
        DB index / instance away from purgeable caches.

        - Enable durability that matters at TTL scale: `appendonly yes`, `appendfsync
        everysec`, plus RDB, so a restart restores state within the window instead
        of silently dropping in-flight sessions.


        **Code:**

        - Make **DB the single source of truth**; treat Redis strictly as a read-through
        cache. On a miss, derive from DB but **do not re-anchor the TTL on every read**
        — only re-fetch, keep re-anchor out of the read path (or cap it), so abandoned
        sessions are actually reclaimed and the memory-accumulation loop in (c) stops.

        - Make the update **versioned/deterministic**: add a monotonic `version` to
        `SessionState` and to `interview_session`, compare on read; a stale-but-present
        Redis key then fails closed instead of silently winning (fixes (a), (b)) —
        or take the count for termination from the DB `interview_message` list, not
        from Redis `questionCount`.

        - **Idempotent writes**: key user answers/replies by a per-`answer` idempotency
        key so a retried `answer`/`answerStream` cannot insert a duplicate message
        (fixes (d)2). Consider `id`/`(session_id, kind, order)` unique constraint
        or a client-supplied `requestId`.

        - **Lock fencing**: scope the lock and add a fencing/epoch check so a lock
        released by Redis churn cannot admit a second concurrent answer (fixes (d)1).

        - **Failure handling**: order writes so a Redis failure cannot leave DB ahead
        of Redis *with a stale-but-fresh key* — e.g., write Redis first then DB, or
        on Redis-write failure force-invalidate the key so the next read rehydrates
        from DB instead of serving stale state (fixes (a)).


        **Observability:**

        - Alert on `INFO` metrics: `evicted_keys` deltas and the live count of `interview:session:*`
        / `interview:lock:*` keys; wrap `read()` to log any rehydration event tied
        to the DB-vs-Redis `version`/`questionCount` divergence. A state that only
        survives via the fallback is an incident in progress.


        ### 4. Bottom line

        For this exact code, simple TTL expiry is **masked by the DB-rehydrate fallback**,
        so the open-source failures are ordering races, eviction under memory pressure,
        and Redis-churn concurrency — all silent, all avoid the rehydrate check because
        the stale/missing key either never triggers it or triggers it on divergent
        data. Treat Redis as a voluntary cache over the DB, never as the authority,
        and add versioning + idempotency + lock fencing so continuation depends only
        on the durable, valid DB.'
