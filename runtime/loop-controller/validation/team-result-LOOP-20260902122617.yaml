      output: '# Redis-TTL vs DB: 面试会话延续静默失效分析


        **角色**: RAG Engineer 视角（会话运行时状态、状态机权威源、延续语义）。已核对仓库真实实现。


        ## 现状（代码事实）


        - `InterviewStateStore.java:25` 定义固定的 `TTL_HOURS = 24`，每次写入 `.set(json, 24h)`（`InterviewStateStore.java:51`）。

        - 注释明确声称 Redis 是状态机的「单一权威来源」(single source of truth)：`InterviewStateStore.java:15`。

        - 但持久化的 `InterviewSession`（DB）独立存活，无 TTL，`answer` 每次都会先 DB 更新再写 Redis（`InterviewService.java:186-189`）。

        - 关键：`requireAsking()` 已有**从 DB 重建的回退路径**（`InterviewService.java:380-399`）——Redis
        读为空时用 DB 行重建并回写。


        ## 什么时候、为什么「延续会断」


        TTL 本质是「最近一次写入后的绝对存活期」，它**只在写时刷新，不在读时刷新**。DB 会一直保持 `ASKING` 有效，Redis 会在静态
        24h 后静默消失 → 关键就是 DB 与运行时状态两套真相发生分歧。真正触发断裂的形态如下：


        1. **固定 TTL 不随读取滑动 + 用户暂停 > TTL 时长**。候选人 24h 内不动（写路径不触发），key 静默过期，而 DB 仍是
        `ASKING`。此后任何只靠读 Redis 的入口就会断——本仓库只有 `requireAsking` 有 DB 回退，`detail()`/`list`
        走 DB、`create`/`finishSession` 等其它消费点并不统一走重建。


        2. **DB 与 Redis 写入非原子、且顺序为「先 DB 后 Redis」**（`InterviewService.java:186`→`188`）。若
        DB 已提交但 `stateStore.write` 抛异常（`InterviewStateStore.java:54` 会抛 `INTERNAL_ERROR`），用户收到
        500、DB 却已前进一步。TTL 边界正好落在 `answer` 的读→写间隙时，刚推进的状态可能被随后的过期清掉——尽管有锁，但锁不防止「写入后、读写窗口内」过期。


        3. **只有 `requireAsking` 有重建保护**。任何运行时状态（计时器、已发题 token、去重计数、streak）若只存 Redis
        而 DB 无对应列，过期即静默归零——这类**不可重建的运行时语义**才是真正的延续断裂：DB「有效」不代表运行时上下文可恢复。


        4. **重建回退依赖 DB 行自身的及时性**。重建后的 `status/questionCount/currentQuestionId` 来自
        DB 最后提交值；若某路径漏了 `updateById`（例如提前 return），重建会得到过期的计数，`state.questionCount()+1`（`InterviewService.java:179`）随之错位，导致问过的题被重复抽或题数虚增——不抛错、静默错。


        ## 现在为何「看起来没事」


        回退路径（`InterviewService.java:382-389`）把「Redis 空 = 缓存未命中」当成 resume，用 DB 重建。所以本仓库多数主路径被它兜住了。**这是偶然的缓解，不是设计保证**——单一权威源（Redis）和持久源（DB）两套真相并存，重建逻辑只藏在
        `requireAsking` 里，是典型的「DB 兜底隐藏了失效」的脆弱点。


        ## 建议（按收益排序）


        1. **统一「读 = 缓存未命中即 DB 重建」**：把 `requireAsking` 里的重建逻辑抽成 `loadOrRebuild(sessionId)`，让
        `create/answer/answerStream/finish` 等所有状态消费点都走它，杜绝「有的入口会断、有的不会」。


        2. **明确权威源为 DB，Redis 降级为纯缓存**：删除/弱化「Redis 是唯一权威」的注释假设。任何**不可从 DB 重建**的运行时状态（计时/token/去重）要么落到
        DB 列，要么接受「过期即重置」并加显式 resume。


        3. **加 `resume(sessionId)` 端点**：无条件从 DB 重建并回写 Redis、返回规范状态。让前端在移动端切后台/刷新/空闲后显式恢复，把「静默
        500」变成「明确续接」。


        4. **修正「先 DB 后 Redis」的原子性**：以 DB 提交为 commit 点；Redis 写失败落入 `loadOrRebuild`
        兜底并记录日志，而不是向上抛 500（用户侧看不到的静默分歧）。


        5. **让 TTL 有界且可观测**：若保留 TTL，将其作为「会话上限」并**略大于一次完整面试时长**；开启 Redis `notify-keyspace-events
        Ex`，对「key 过期但 DB 仍 ASKING」发告警/自动触发 resume 任务，消除静默性。


        6. **显式失败优于静默错位**：重建分支若发现 DB 状态与预期不符（计数小于 Redis 预期），宁可抛 `INTERVIEW_STATE_ERROR`
        走 resume，也不要带着错位计数继续 `+1`。


        ## 结论


        静态 24h TTL 本身不会「必然」断——本仓库靠 `requireAsking` 的 DB 回退掩盖了它。但「Redis 作唯一权威却带 TTL、DB
        又独立有效」是根因；断裂发生在 ①非 `requireAsking` 的读取路径、②不可重建的运行时状态、③DB/Redis 非原子边界。修复要点：**DB
        为权威、Redis 为可重建缓存、统一 `loadOrRebuild`、显式 resume + 过期告警**。'
