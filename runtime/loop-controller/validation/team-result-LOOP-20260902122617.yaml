      output: "# Database Engineer Report — Interview Session State: Redis Fixed-TTL\
        \ Silent Expiry vs. Persistent DB\n\n## 1. Architecture context (dual-store\
        \ pattern)\n\nInterview sessions typically use a **hot/cold store split**:\n\
        \n- **Redis** = *session runtime state* (current question pointer, per-question\
        \ answers-in-progress, countdown timer, transcript buffer, anti-cheat heuristics).\
        \ Written frequently, read on every interaction, bounded by a single interview.\n\
        - **DB** = *session source of truth* (session row, completed submissions,\
        \ timestamps, final answers). Written on commit / persist points.\n\nThe runtime\
        \ layer is keyed by `interview:{sessionId}` with a fixed TTL:\n```\nSET interview:{sid}\
        \ '{\"q\":3,\"timer\":452,\"progress\":{...}}' EX 3600\n```\nBecause the DB\
        \ row persists, Resume checks the DB, finds the session \"valid,\" and attempts\
        \ to continue — but the Redis payload is gone.\n\n## 2. Root cause taxonomy\
        \ of silent expiry\n\n### A. Fixed (non-rolling) TTL vs. longer-than-interview\
        \ activity\nFixed TTL is set once at creation and **never refreshed**. Any\
        \ interview that has *gaps* between interactions (user rethinking, idle, World/IPsec\
        \ disconnect, rescheduling) that sum to > TTL will lose runtime state even\
        \ though the session legitimately continues.\n- Breaks because continuation\
        \ depends on current `question`/`timer`, which live *only* in Redis.\n\n###\
        \ B. Eviction-before-expiry (not TTL at all)\nUnder `maxmemory-policy allkeys-lru\
        \ / volatile-*` / `noeviction` fallbacks, Redis can evict the key **before**\
        \ its TTL elapses under memory pressure. The key \"expires early\" — silently.\
        \ Largest hidden failure mode; TTL tuning won't fix it.\n\n### C. Refreshed-on-write,\
        \ not on-read\nSessions updated frequently (progress writes) may have TTL\
        \ refreshed by a *writer* codepath while *read-only* continuations (e.g.,\
        \ poll for remaining time) don't refresh. TTL still lapses despite active\
        \ reads.\n\n### D. TTL-reassignment drift\nTwo service paths write the key\
        \ with **different TTLs** (e.g., `createSession` sets 5h, a later `touch`\
        \ sets 15min). A resume after 20 min of valid activity hits the 15-min window\
        \ and dies.\n\n### E. Redis lifecycle events\n- **Restart / failover / AOF\
        \ rewrite failure** → all volatile keys lost, DB intact.\n- **`FLUSHDB` /\
        \ misconfigured flush** by an ops job.\n- **Cluster rebalance**: reads routed\
        \ to a replica/shard that lacks the key (masked by reads against stale replica).\n\
        \n### F. Partial-write window (most damaging for continuation)\nRuntime state\
        \ is buffered in Redis and only flushed to DB at **commit/persist points**.\
        \ If Redis expires *between* buffer write and DB flush, that **delta is permanently\
        \ lost** — DB is valid but stale, so continuation resumes from a *previous\
        \ consistent point*, silently replaying/duplicating work (repeat questions,\
        \ resubmission).\n\n## 3. Why the DB stays \"valid\"\n\n- DB is durable and\
        \ has no TTL; the session row survives.\n- **Precondition mismatch**: code\
        \ treats DB presence as \"valid session\" and skips re-init, never verifying\
        \ the Redis layer. This is the *specific bug* — validity is checked against\
        \ one store but runtime is in another, so continuation logic assumes what\
        \ doesn't exist.\n\n## 4. When continuation actually breaks (decision logic)\n\
        \nGiven `resume(sessionId)`:\n```\nIF session in DB:\n    IF session.status\
        \ == 'finalized':  → show result         (OK — DB-sufficient)\n    ELSE IF\
        \ Redis has interview:{sid}:\n        IF Redis TTL ok → restore runtime state\
        \              (OK)\n    # fall-through (both false / expired Redis):\n  \
        \      → re-init from DB snapshot (recover partial)  OR  → treat as new attempt\n\
        ```\nContinuation *fails to preserve* precisely when:\n1. state between last\
        \ DB flush and expiry is non-empty (**uncommitted delta exists**), and\n2.\
        \ runtime fields (`question`, `timer`, in-progress answer buffer) are not\
        \ reconstructible from the DB snapshot.\n\nIf all meaningful state is already\
        \ in the DB (post commit), expiry is harmless — so the break is **correlated\
        \ with dirty / in-flight state**, not with session validity.\n\n## 5. Recommendations\n\
        \n### Rolling/sliding TTL (slide-on-use)\nRefresh TTL on **every** successful\
        \ read OR write for an active session, bounded by max-inactivity:\n```\n#\
        \ on any interaction\nMULTI\n  SETEX interview:{sid} <json> 1800\n  EXPIRE\
        \ interview:{sid} 1800\nEXEC\n```\nGuard the refresh so pure `GET` of finalized\
        \ sessions doesn't pin them forever.\n\n### Make DB the fallback source of\
        \ truth, not silently drop\nOn resume, if Redis is missing but DB says live,\
        \ **reconstruct** runtime state from the DB snapshot and *log the divergence*\
        \ (metric: `session.redis_reconstruct`). Don't just restart the interview.\n\
        \n### Detect expiry explicitly\nSet a separate lower-TTL \"keepalive\" marker\
        \ with a watcher, or use a **lock/lease** around the session so a resumed\
        \ writer doesn't clobber a concurrently-reconstructed copy.\n\n### Fix eviction\
        \ policy\n- Confirm `maxmemory-policy` is `volatile-ttl` (or `noeviction`)\
        \ and that `maxmemory` is sized so runtime keys are never evicted under normal\
        \ load.\n- Better: separate the high-frequency runtime store into its own\
        \ Redis instance/logical DB so chatty sessions don't compete with cache for\
        \ memory.\n\n### Align all writers on a single TTL constant\nCentralize TTL\
        \ in one config (`SESSION_RUNTIME_TTL = 1800s`), read by every codepath; add\
        \ a lint/test that asserts no path hardcodes a different `EX`.\n\n### Kill\
        \ the dirty-window\nReduce reliance on \"Redis-only, flush-later\" for anything\
        \ the user can lose:\n- Flush deltas to DB on **every** discrete action (rate-limited),\
        \ or\n- Write through a **WAL-like append**: DB log of `{timestamp, question,\
        \ delta}` so expiry loses only seconds.\n\n### Recovery semantics / idempotency\n\
        Make resumption idempotent — if a user already submitted answer for q3 and\
        \ it replays, dedupe by `sessionId + questionId + revision` in DB to avoid\
        \ double-submit.\n\n### Health/continuity check on resume\n```\nif not redis.exists(f\"\
        interview:{sid}\"):\n    if db_session.status is live and db_session.updated_at\
        \ < now - TTL:\n        log(\"silent-expiry-risk\")        # fired detection,\
        \ enables alerting\n    reconstruct(sid, snapshot=db_session)\n```\n\n## 6.\
        \ Core response\n\nRedis runtime with a **fixed TTL** silently expires when\
        \ any session gaps (inactivity between interactions) or Redis eviction/restart\
        \ outlives the TTL. The DB stays valid because it is durable and lacks a TTL.\
        \ Continuation breaks whenever the lost Redis payload holds **uncommitted\
        \ in-flight state** (question pointer, answer buffer, timer) that the DB hasn't\
        \ absorbed yet — the resume path validates against the DB alone, so it tries\
        \ to continue with state that no longer exists, producing either a silent\
        \ restart or an idempotency-violating replay. The fix is a **sliding TTL +\
        \ DB-snapshot reconstruction + explicit expiry detection + eviction-policy\
        \ hardening + idempotent resume**.\n\n---\n\n*Prepared for lead review. Open\
        \ question for the team: what is the worst acceptable loss window between\
        \ Redis buffer and DB flush — this determines whether WAL-style appends are\
        \ required.*"
