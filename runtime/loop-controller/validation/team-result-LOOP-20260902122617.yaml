      output: "# Interview Session Continuation: Silent Redis TTL Expiry vs. Valid\
        \ DB\n\n## 1. The core architectural problem\n\nYou have two stores holding\
        \ different *flavors* of the same interview session:\n\n| Store | Role | Lifetime\
        \ | Data |\n|---|---|---|---|\n| **DB** (Postgres/MySQL) | Source of truth\
        \ — canonical interview record | Indefinite | interview_id, candidate_id,\
        \ question list, answers, scores, timestamps |\n| **Redis** | Hot runtime/transient\
        \ state | Bounded by fixed TTL | current question cursor, elapsed/remaining\
        \ timer, live websocket mapping, in-progress answer draft, heartbeat, ephemeral\
        \ tokens |\n\nThe trap: the DB is `VALID` (row exists, not deleted), so the\
        \ resume code trusts it. But the Redis keys — which hold the *exact point-in-time*\
        \ the interview can be picked up from — are **gone**. Because nothing in the\
        \ DB records the expiration, the failure is **silent**: no error surfaces\
        \ until the exact moment runtime state is actually read.\n\nContinuation breaks\
        \ precisely **at `key.created_at + TTL`**, independent of whether anyone used\
        \ the session in between.\n\n---\n\n## 2. When it breaks (the concrete scenarios)\n\
        \n### 2.1 Fixed TTL is never refreshed → expires mid-use\n```bash\nSET interview:34:cursor\
        \ \"q5\" EX 3600   # fixed: lives exactly 1h from NOW\n```\nWith **fixed**\
        \ TTL, an interview that is actively being worked on 61 minutes in silently\
        \ loses `cursor`. Only a **sliding** TTL (re-set `EXPIRE` on every interaction/heartbeat)\
        \ tracks *idle time* instead of *absolute age*.\n\n### 2.2 Non-persisted runtime\
        \ fields are unrecoverable\nThe worst case. These fields exist **only** in\
        \ Redis and are *not* derivable from the DB:\n- `where is the candidate` (cursor\
        \ / current question index)\n- remaining time on the timer\n- an unsaved in-progress\
        \ answer draft / partial validation state\n- the live websocket/RT channel\
        \ mapping\n- anti-cheat heartbeat timestamps\n\nWhen these expire, `resume`\
        \ cannot reconstruct them → continuation **semantically wrong or impossible**.\n\
        \n### 2.3 Eventually-consistent writes are lost\nIf the app buffers mutations\
        \ (WSM writes, question progress) and flushes to the DB only on *completion*\
        \ or on a coarse interval, a Redis expiry in between discards buffered state\
        \ that **never reached the DB**. Resume rebuilds a **stale snapshot** — answers\
        \ \"revert\", timer resets.\n\n### 2.4 Auth/session token shares the same\
        \ fixed TTL\n```bash\nSET session:abc:token <jwt> EX 3600   # session_id +\
        \ nonce also keyed to same TTL\n```\nDB row still present; client now fails\
        \ **auth** with \"session expired\" on `continue` — a second, independent\
        \ breakage layered on the data loss.\n\n### 2.5 TTL skew across multiple keys\n\
        One interview = several Redis keys (cursor, timer, draft, heartbeat). Fixed\
        \ TTLs that don't align expire **out of phase**, leaving a *partially valid*\
        \ session → inconsistent reconstruction (timer present, cursor missing).\n\
        \n### 2.6 Candidate pause longer than the TTL\nFixed TTL is often sized to\
        \ \"expected session length\". A candidate who pauses longer (even legitimately\
        \ — async interview mode) exceeds it. Resume restores default/garbage state\
        \ (timer reset or force-end), losing the real elapsed time.\n\n### 2.7 Why\
        \ it's *silent*\nThe only thing that would mark the session expired is a **DB\
        \ write**, and none happens. The resume path:\n1. reads DB → interview is\
        \ valid → **no rebuild is triggered**;\n2. reads runtime state from Redis\
        \ → key missing → either throws a confusing late `RESUME_FAILED`, or worse,\
        \ **silently falls back to defaults**.\n\nThat silent-default fallback is\
        \ the dangerous one — it produces a *wrong-looking but valid-looking* session.\n\
        \n---\n\n## 3. Why the DB \"staying valid\" is misleading\n\n```\nDB:  interview(id=34)\
        \  -> status=IN_PROGRESS, started_at, last_activity_at   [VALID forever]\n\
        Redis: interview:34:cursor, :timer, :draft                               \
        \    [gone at TTL]\n```\n\nThe DB records the interview **exists and is in-progress**,\
        \ but records **none of the ephemeral position/speed** needed to resume. The\
        \ DB's validity is the *invariant*; Redis provides the *variable*. Continuation\
        \ requires both. A DB-only check is necessary but not sufficient — this is\
        \ the classic **cache-warm dependency** inverted: the durable store looks\
        \ authoritative while the volatile store carries the resume-critical payload.\n\
        \n---\n\n## 4. Recommended design changes\n\n### 4.1 Rule: \"If you cannot\
        \ afford to lose it, it lives in the DB.\"\nRedis should only hold **reconstructible**\
        \ data. All resume-critical values are persisted on every meaningful event\
        \ (or a baseline + computed delta).\n\n### 4.2 Timer: store a baseline, not\
        \ a countdown\nNever store *remaining seconds* (it can only die in Redis).\
        \ Store the start moment in the DB and compute elapsed from the wall clock:\n\
        \n```sql\nALTER TABLE interview\n  ADD COLUMN started_at        timestamptz\
        \ NOT NULL DEFAULT now(),\n  ADD COLUMN total_seconds     int         NOT\
        \ NULL,\n  ADD COLUMN last_activity_at  timestamptz NOT NULL DEFAULT now();\n\
        \n-- remaining = total_seconds - (now() - started_at), computed server-side\n\
        ```\nA timer derived from `now()` **cannot** be lost to Redis expiry.\n\n\
        ### 4.3 Durable cursor/progress watermark + checkpoint flushes\nPersist a\
        \ low-rate watermark to the DB so resume has a true \"last confirmed position\"\
        , and use Redis only as the hot mirror:\n\n```python\ndef on_answer(iv_id,\
        \ q_no, q_size):\n    db.update_watermark(iv_id, q_no, answered_count=q_size)\
        \  # durable, cheap\n    redis.set(f\"interview:{iv_id}:cursor\", q_no, ex=SLIDING)\
        \  # hot copy\n\ndef resume(iv_id):\n    row = db.get_interview(iv_id)   \
        \               # authoritative\n    cur = redis.get(f\"interview:{iv_id}:cursor\"\
        )   # may be gone -> silent expiry\n    if cur is None:\n        cur = row[\"\
        cursor_watermark\"]              # reconstruct from DB\n        log_event(\"\
        SESSION_RECONSTRUCTED\", iv_id)  # make it NON-silent\n    business_logic(row,\
        \ cur)\n```\n\n### 4.4 Use sliding TTL, re-armed on activity\n```bash\n# on\
        \ each heartbeat / interaction:\nEXPIRE interview:34:cursor 3600   # reset\
        \ the clock on activity\n```\nSliding TTL aligns Redis lifetime with *real\
        \ idleness*. Add a hard max so a truly abandoned session still reaps. Optionally\
        \ align with Redisson / session libraries that do sliding expiration out of\
        \ the box.\n\n### 4.5 Align DB and Redis expiry sources\nTrack `last_activity_at`\
        \ in the DB and refresh it on each interaction, so a durable `expires_at =\
        \ last_activity_at + idle_limit` can drive both a DB-side \"expired\" flag\
        \ *and* the Redis TTL. Now both stores agree on *when* the session lapses\
        \ — no divergence, no silent gap.\n\n### 4.6 On z) unavailability → degraded\
        \ mode\nFeature-flag reads to fall back to the DB watermark when Redis is\
        \ down/missing, instead of failing or defaulting silently.\n\n### 4.7 Make\
        \ reconstruction observable\nAny time a resume is backed by DB reconstruction\
        \ (vs. Redis hit), emit `SESSION_RECONSTRUCTED`/`SESSION_DELAYED_EXPIRY` metrics\
        \ + logs. The fix's core deliverable is that the failure is **no longer silent**.\n\
        \n---\n\n## 5. Summary\n\n> Continuation breaks when **resume-critical runtime\
        \ state lives only in Redis with a fixed (non-sliding) TTL**, while the interview\
        \ record persists in the DB. Because the DB never records the expiry, nothing\
        \ triggers a rebuild, and the runtime is missing exactly at `created_at +\
