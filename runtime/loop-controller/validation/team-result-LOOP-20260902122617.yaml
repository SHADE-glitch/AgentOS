      output: "# Redis TTL vs DB-Valid Persistence: When & Why Interview Continuation\
        \ Breaks\n\n## 1. The core architectural flaw\n\nYou have two stores with\
        \ **asymmetric availability**:\n\n- **Redis** holds *runtime/interview session\
        \ state* (current question index, question timer, per-step answers in progress,\
        \ navigation cursor, remaining time), each key stamped with a **fixed TTL**.\n\
        - **DB** holds *authoritative, durable* records (final answers, session metadata)\
        \ that remain valid for as long as the interview record exists.\n\nContinuation\
        \ (`/resume`, `continueInterview`, retry-after-refresh) reads primarily from\
        \ Redis. The moment a Redis key's TTL elapses, the runtime state vanishes\
        \ **without an error** — Redis returns `nil`/empty, never a hard failure.\
        \ The app then cannot reconstruct *\"where the candidate was,\"* even though\
        \ the DB still says the interview is live.\n\n## 2. When continuation breaks\n\
        \n| Trigger | Mechanism | Breakage visibility |\n|---|---|---|\n| **Fixed\
        \ (non-sliding) TTL overruns the live interview** | TTL set once at creation;\
        \ an active multi-hour/`paused`-then-resumed interview simply outlives it.\
        \ | Silent — next read is `nil` |\n| **TTL shorter than idle window** | Candidate\
        \ pauses >TTL (e.g. TTL=30m, pauses 40m). | Silent |\n| **TTL longer than\
        \ eviction live window** | Redis `maxmemory-policy` evicts the key *before*\
        \ TTL under memory pressure. | Silent |\n| **Partial-key expiry** | Different\
        \ sub-keys (`timer`, `progress`, `q:5:scratch`) get different TTLs → set already\
        \ expired while others remain → corrupted/partial state. | Semi-silent (wrong\
        \ data, not missing) |\n| **Restart / failover** | RDB snapshot too old or\
        \ `yes`-eviction after restart; replica lacks the not-yet-replicated/reissued\
        \ key. | Silent |\n| **Wrong reconstruction trust** | App treats missing Redis\
        \ key as \"new session\" instead of \"rehydrate from DB.\" | Silent + re-initializes\
        \ wrongly |\n\n## 3. Why it breaks *silently* (the dangerous part)\n\nRedis\
        \ expiration is **not an error path** — it is the defined behavior of the\
        \ key. Consequences:\n\n1. `GET session:abc:progress` returns `nil`, not an\
        \ exception. Code that does `.get(...)` and immediately uses the result gets\
        \ a `NullPointer`/`undefined` or, worse, falls through a fallback branch written\
        \ for *new* sessions.\n2. Because DB is still valid, the **signal of failure\
        \ is hidden**: health checks, exception monitors, and p99 latency all look\
        \ healthy. The DB row says `status='in_progress'`, so nobody is alerted.\n\
        3. The continuation code path rarely distinguishes *three different missing-key\
        \ causes*:\n   - **Never existed** (new/valid request)\n   - **Expired by\
        \ TTL** (should rehydrate from DB)\n   - **Evicted by memory policy** (should\
        \ warn + rehydrate)\n   All three collapse into one indistinguishable `nil`.\n\
        \n```redis\n# indistinguishable states after TTL expiry or eviction\nGET interview:session:42:progress\
        \          → (nil)   # TTL expired\nGET interview:session:42:timer       \
        \      → (nil)   # evicted earlier\n```\n\n## 4. Why DB-validity does not\
        \ help by default\n\nDB holds the **destination** (final answers, session\
        \ row), but continuation needs the **intermediate cursor** (which question/step,\
        \ active timer value, uncommitted partial input). That intermediate state\
        \ is only in Redis. Unless the DB is written on *every* checkpoint, there\
        \ is nothing to reconstruct from — so \"DB still valid\" is a false comfort.\n\
        \n## 5. Recommended fixes\n\n### 5.1 Sliding TTL (the minimal fix)\nRenew\
        \ on every access so active sessions never expire while idle ones still do:\n\
        \n```redis\n# on every read/write touch, refresh\nEXPIRE interview:session:42:progress\
        \ 3600\n# or atomically with the write:\nSET interview:session:42:progress\
        \ '{\"q\":7}' EX 3600\n```\n\nIn app code, renewal must be **atomic** with\
        \ the read, or you reintroduce a race:\n\n```python\n# atomic read-and-renew\
        \ to avoid TOCTOU expiry\nval = pipeline.read_and_touch(key, ttl=3600)\n```\n\
        \n### 5.2 DB as the single source of truth for resume\nPersist a small **checkpoint\
        \ row** on Redis writes (or on key changes/debounced), so rehydration is possible:\n\
        \n```sql\nALTER TABLE interview_sessions\n  ADD COLUMN runtime_checkpoint\
        \ JSONB NULL,   -- {q, timer, cursor}\n  ADD COLUMN checkpoint_updated_at\
        \ TIMESTAMPTZ;\n```\n\nCleanup the stale Redis key after DB flush; resume\
        \ path becomes:\n\n1. Try Redis → hit → continue.\n2. Miss → load `runtime_checkpoint`\
        \ from DB → repopulate Redis (fresh sliding TTL) → continue.\n3. Checkpoint\
        \ also missing/stale → treat as expired session with a clear, explicit message\
        \ **and** log the cause.\n\n### 5.3 Key namespace + explicit collision avoidance\n\
        Key state by a versioned, namespaced scheme and record the *intended* TTL\
        \ in the value so you can detect truncation:\n\n```\ninterview:{sessionId}:v2:progress\n\
        ```\n\n### 5.4 Config: never let memory pressure silently evict session keys\n\
        ```conf\nmaxmemory-policy noeviction        # writes fail loudly instead of\
        \ key disappearing\n```\nTrade-off: under pressure, `SET` fails → that failure\
        \ is visible/surfacable, unlike expiry. Use `volatile-ttl` only if you separate\
        \ critical keys into a non-volatile space.\n\n### 5.5 Persistence to survive\
        \ restart/failover collision\n```conf\nsave 900 1          # snapshot cadence\
        \ tuned below negative-eviction RPO\nappendonly yes      # AOF so a restart\
        \ does not silently drop live keys\nmaxmemory-policy noeviction\n```\nVerify\
        \ replica/failover doesn't return stale reads for these keys (read from primary\
        \ for continuation, or `WAIT`).\n\n### 5.6 Instrumentation to expose the silent\
        \ failure\n- Log a distinct signal for \"Redis miss on a DB-valid in_progress\
        \ session.\"\n- Track **rehydration rate** (miss→checkpoint→recover) as the\
