      output: '# Code Review: Redis Session State TTL vs DB Continuation


        ## Verdict

        In this codebase the described failure is **partially mitigated but not eliminated**.
        `requireAsking()` in `InterviewService.java:380-399` already implements a
        DB-fallback (when Redis returns `null`, it rehydrates from the `interview_session`
        row and re-writes Redis). So a True Positive failure ("session hard-fails
        after TTL") does **not** occur here. However, the fixed-24h TTL still produces
        the precise divergence symptoms below, and two other latent defects (parse-failure
        masking + finished-key retention) make the contract weaker than intended.


        ---


        ## 1. When continuation actually breaks (the mechanism)


        **The single-authority mismatch.** `InterviewStateStore.java:14-15` claims
        Redis is "单一权威来源" (single source of truth), but the durable truth is the DB
        row, whose lifetime is **unbounded** (no expiry, `InterviewSession` persists
        `ASKING` forever). The Redis key has an independent, bounded lifetime (`TTL_HOURS
        = 24`, `InterviewStateStore.java:25,51`). Two timelines diverge:


        ```

        DB:   ─── ASKING ▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬── (valid forever)

        Redis: ─── ASKING ▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬  X expires at idle-24h

        ```


        A fixed TTL that is **not** refreshed while the session is idle expires at
        `lastWrite + 24h` regardless of DB validity. In this code the TTL is reset
        on every `write()` (each answer calls `stateStore.write`), so it behaves as
        *sliding-while-active* and *absolute-idle-cap*. The break window is:


        - **Idle > 24h between answers** → Redis key gone. Continuation survives *only*
        because of the DB fallback.

        - **Redis eviction under memory pressure (`volatile-lru`/`allkeys-lru`)**
        → key dropped before TTL, indistinguishable from expiry in `read()`.

        - **Redis flush/restart** → all session state gone while DB is intact.


        **Where continuation genuinely breaks (the general pattern, and the reason
        this design is risky):** any state-machine whose Redis read is *authoritative*
        (throws `NOT_FOUND`/state-error when the key is absent) will hard-fail the
        resume. Division of responsibility here — DB holds `status/questionCount/currentQuestionId`,
        Redis holds the same coarse tuple — means the rehydration is *coarse*: fine-grained
        conversational context (asked-question dedup set, in-flight question semantics)
        exists only in the message history, and the recovery trusts the DB row implicitly
        (see Issue 1).


        ---


        ## 2. Concrete findings in this code


        **Finding 1 — `read()` conflates "expired", "missing", and "corrupt" into
        `null`, and implicitly trusts DB state.**

        `InterviewStateStore.java:42-44` returns `null` on Jackson parse failure.
        That poisoned value then triggers the DB rehydrate path in `requireAsking()`
        (`InterviewService.java:382-389`), which **overwrites** Redis with the DB
        row. If Redis held *newer* state than the DB row (e.g. the DB update committed
        but a crash occurred before the Redis write, or vice-versa), the rehydrate
        can regress the state. Weakest legacy point in the continuation contract.


        **Finding 2 — Recovery trusts `status` from DB but validates against Redis-derived
        enums.**

        `InterviewService.java:391-397`: rehydrated state is checked for `FINISHED`/`ASKING`/`START`.
        A DB row still `ASKING` after Redis expiry resumes correctly — good — but
        a DB row that was transitioned to `FINISHED` *only* in Redis (dual-write is
        not atomic) and already expired will rehydrate to `START`/`ASKING` and allow
        an answer to a finished session.


        **Finding 3 — Fixed TTL pins finished sessions for 24h of garbage.**

        `write()` always applies `TTL_HOURS` even for `FINISHED` (`InterviewService.java:345-346`).
        A finished session keeps a hot Redis key for a day, needlessly occupying capacity
        and masking true live-session count.


        **Finding 4 — No idle-timeout / lifecycle transition.**

        There is no mechanism to turn an abandoned `ASKING` session into a terminal
        state. DB stays durably "valid/in-progress" forever, which is exactly the
        setup where "Redis expired but DB valid" is *visible to users* (it reappears
        as in-progress in `listByUser`, `InterviewService.java:283-289`, yet resumes
        cold).


        **Finding 5 — Long-running stream vs lock/TTL lifetimes.**

        `answerStream` holds the session lock for up to `300_000ms` (`InterviewService.java:198`)
        and holds a single Redis TTL. If TTL were lowered toward the stream window,
        an in-flight SSE would expire mid-response. Not reachable at 24h, but it ties
        continuation latency to the lock lease (lock is held the whole stream; a concurrent
        answer times out at `LOCK_WAIT_SECONDS = 5`, `InterviewService.java:64`).


        ---


        ## 3. Recommendations


        1. **DB is the source of truth; Redis is a cache with a recovery path — formalize
        it** and stop calling Redis authoritative. On `state == null`, rehydrate **and
        verify** against DB `updated_at`/`status`, logging a `WARN` (currently only
        parse failures log). Never overwrite Redis silently from a corrupt read —
        distinguish "missing" from "unparseable".


        2. **Make TTL physical, not logical**: keep the sliding-on-write reset, but
        add *heuristic rehydration equality* — include a lightweight `version`/`updatedAt`
        field in `SessionState` and compare before overwriting on the rehydrate path.


        3. **Refactor `read()`** to return a tri-state (missing / present / corrupt)
        instead of collapsing to `null`, so corrupt-state and expiry are handled differently.


        4. **Add an idle/abandon timeout**: schedule DB transition of long-idle `ASKING
        → FINISHED`(or a dedicated `TIMED_OUT`), plus Redis delete + user notify,
        so the DB no longer stays "validly in-progress" past the idle cap. This directly
        removes the "DB valid but Redis gone" window.


        5. **For long SSE/streaming**, refresh the TTL at operation start and via
        heartbeat while the stream is open, and bound the lock lease below `LOCK_WAIT_SECONDS`
        so continuation never waits on a stalled writer.


        6. **Make TTL configuration-driven** (`@Value("${interview.state.ttl-hours:24}")`)
        and align it with the max expected session length + an alert metric on expiry/rehydration
        events.


        Accepting recommendation 4 makes this system robust to the exact "Redis expired
        by fixed TTL while DB valid" scenario; implementing 1+3 closes the subtle
        data-loss path in the existing fallback.'
