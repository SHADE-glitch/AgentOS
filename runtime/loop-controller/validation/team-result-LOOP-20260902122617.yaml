      (Phase 5–8 interview system) rather than generic Redis theory, since the failure
      mode is precisely a codec/config artifact o
    output: "Below is the lead-engineered analysis. I grounded it in the actual codebase\
      \ (Phase 5–8 interview system) rather than generic Redis theory, since the failure\
      \ mode is precisely a codec/config artifact of `InterviewStateStore`.\n\n##\
      \ Diagnosis\n\n### The root flaw: Redis is declared the *sole* authoritative\
      \ source, but it is an ephemeral cache\n\n`InterviewStateStore.java:14–15` documents\
      \ the design intent:\n\n> 面试会话运行时状态，存于 Redis，作为状态机的单一权威来源 (\"…stored in Redis,\
      \ as the single authoritative source of the state machine\")\n\nand sets **`TTL_HOURS\
      \ = 24`** reset only on write (`InterviewStateStore.java:25, 51`):\n\n```java\n\
      private void write(Long sessionId, SessionState state) {\n    String json =\
      \ objectMapper.writeValueAsString(state);\n    redissonClient.getBucket(key(sessionId)).set(json,\
      \ TTL_HOURS, TimeUnit.HOURS); // fixed, write-only reset\n}\n```\n\nMeanwhile\
      \ the durable truth, `interview_session` (status / question_count / current_question_id),\
      \ has **no TTL** — it survives forever. So you have two sources of truth with\
      \ **different lifecycles**: one vanishes silently after 24h, the other never\
      \ expires. Because `get()` on a missing key returns `null`, the loss is **indistinguishable\
      \ from \"never existed\"** — hence *silent*.\n\n### Why \"fixed\" TTL vs \"\
      sliding\" matters — and when writes reset it\n\n- The TTL is set **only inside\
      \ `write()`**. `read()` (`InterviewStateStore.java:34–46`) does **not** call\
      \ `expire()`, so the clock is *not* refreshed on activity.\n- It is not a true\
      \ *idle* timeout either — it's a fixed total lifetime measured from the last\
      \ write.\n- Result: **any session gap > 24h loses its runtime state**, even\
      \ if the interview is objectively still open in the DB (status `ASKING`, `current_question_id`\
      \ set). A user who answers every 24h never expires; a user who returns after\
      \ 36h silently loses state.\n\n## When continuation breaks\n\nContinuation =\
      \ `answer()` / `answerStream()` (SSE) re-entering the state machine for a still-open\
      \ interview. It breaks when the key is gone but the interview is *not* finished.\
      \ Concrete cases, most dangerous first:\n\n**1. Redis eviction under memory\
      \ pressure — affects actively-used sessions.**\nIf Redis runs with an eviction\
      \ policy at capacity (e.g. `allkeys-lru`, `allkeys-lfu`, or even `volatile-*`),\
      \ Redis evicts the LRU keys **regardless of recent use**. An interview the user\
      \ is answering *right now* can be evicted mid-flow. TTL never saves you; the\
      \ \"single authoritative source\" just evaporates.\n\n**2. Idle gap > 24h (the\
      \ nominal TTL).**\nReturning to an open session after a day loses `questionCount`\
      \ and `currentQuestionId` from the cache. `requireAsking()` (`InterviewService.java:380–399`)\
      \ partially hides this by rehydrating from DB:\n\n```java\nstate = stateStore.read(sessionId);\n\
      if (state == null) {\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
      \    ...\n    state = new InterviewStateStore.SessionState(s.getStatus(), s.getQuestionCount(),\
      \ s.getCurrentQuestionId());\n    stateStore.write(sessionId, state);\n}\n```\n\
      \nThis works *only if the DB row mirrors the cache*. When the DB lags (case\
      \ 3/4) it silently rehydrates **stale or wrong state** and the user rejoins\
      \ at the wrong question.\n\n**3. Non-atomic dual-write → DB is stale relative\
      \ to Redis (or vice-versa).**\nThe DB update and Redis write are separate transactions.\
      \ In `answer()` the DB is updated at `InterviewService.java:186` and Redis at\
      \ `:188`. If the Redis write fails, `write()` throws a `BizException` (`InterviewStateStore.java:53–54`)\
      \ *after* the DB move, leaving DB at the new question but Redis (surviving copy)\
      \ at the old one. The next continuation reads **stale Redis** and the stream\
      \ continues from the previous question. Conversely a DB write failure leaves\
      \ Redis ahead of DB. There is no reconciliation, so whichever survives desyncs\
      \ the other.\n\n**4. Async scoring window (RabbitMQ in flight).**\n`finishSession()`\
      \ (`InterviewService.java:340–358`) updates the DB to `FINISHED`, writes Redis,\
      \ then **pushes the scoring job asynchronously**. Between the DB-set-to-FINISHED\
      \ and the score being materialized there is a window where Redis (if it expired)\
      \ rebuilds from a DB that may still be `ASKING` during a prior step — a user\
      \ can submit more answers while scoring is queued, producing double/mutated\
      \ results. The runtime state that was \"the real state\" existed only in a TTL'd\
      \ key.\n\n**5. Redis restart / persistence loss.**\nWithout AOF (`appendonly\
      \ yes`) or recent RDB snapshots, a Redis restart drops every `interview:session:*`\
      \ key. Every open interview loses runtime state at once — silent, total, hard\
      \ to correlate with app logs.\n\n### The \"why\" in one sentence\n\nThe design\
      \ inverted cache and source-of-truth: an **ephemeral, TTL'd, evictable, possibly-unpersisted**\
      \ cache was made authoritative, while the durable DB was demoted to a best-effort\
      \ mirror. Fixed TTL + read-without-refresh + per-write-only reset + no eviction/durability\
      \ guarantee guarantees the runtime state disappears long before the interview\
      \ does.\n\n## Fixes (ranked)\n\n**1. Make DB the single source of truth; Redis\
      \ is recomputable cache only.**\nThe codebase already tolerates this in `requireAsking`.\
      \ Extend it everywhere: never *branch* on Redis state for correctness decisions\
      \ — only use it to short-circuit. Reconcile on every miss and log a metric for\
      \ misses (they are your drift canary).\n\n**2. Replace fixed TTL with an idle/sliding\
      \ TTL refreshed on read too.**\nIf you keep cache-based state, refresh on every\
      \ `read()`:\n\n```java\npublic SessionState read(Long sessionId) {\n    RExpirable\
      \ key = redissonClient.getBucket(key(sessionId));\n    String json = (String)\
      \ ((RBucket<?>) key).get();\n    if (json == null) return null;\n    key.expire(SESSION_IDLE_TIMEOUT,\
      \ TimeUnit.MINUTES); // rolling, activity-gated\n    ...\n}\n```\nThis prevents\
      \ *active* sessions from expiring and turns the TTL into a true idle timeout.\
      \ Note it still can't survive eviction (fix #1 is the real answer).\n\n**3.\
      \ Transactionally persist state with the messages.**\n`questionCount` and `currentQuestionId`\
      \ are already derivable from `interview_message` (question kind + order). Reconstruct\
      \ state from DB messages on any miss instead of trusting cached copies:\n\n\
      ```java\n// on rehydrate: rebuild questionCount/currentQuestionId from messageMapper,\n\
      // not from a desynced session row\n```\n\n**4. Make transitions atomic** —\
      \ e.g. a `@Transactional` service boundary for `updateById(session)` + insert\
      \ of the new question message **before** any cache write, so a cache failure\
      \ can never strand a half-advanced interview. Treat cache write as best-effort\
      \ (`try/catch`, swallow + metric), never as a correctness gate.\n\n**5. Durability/monitoring\
      \ for the residual risk.**\n- Enable AOF (`appendonly yes`) so startup loss\
      \ disappears.\n- Set a bounded, non-destructive eviction policy (`noeviction`\
      \ or reserve headroom) and size the instance so live sessions fit.\n- Add alerting\
      \ on the miss→DB-rebuild path; a rising rebuild ratio is the early-warning signal\
      \ for TTL/eviction drift.\n\n### Concrete config deltas (docker-compose/redis)\n\
      - `appendonly yes`\n- `maxmemory-policy noeviction` (or a large enough `maxmemory`\
      \ + `volatile-lru` once TTL is converted to idle-based)\n- Keep the 24h only\
      \ as a *floor* safety net behind idle expiration, so an abandoned session still\
      \ reaps naturally.\n\n## Bottom line\n\nContinuation breaks **silently and specifically\
      \ when the ephemeral state key disappears while the durable interview row remains\
      \ resumable** — i.e., on (a) TTL-elapsing after an idle gap > 24h, (b) cache\
      \ eviction of an active session under memory pressure, and (c) Redis restart\
      \ without persistence. The DB is never wrong, which is exactly why it feels\
      \ like a bug on your side: the source of truth was placed in the one component\
      \ designed to forget. Promote the DB to authority, demote Redis to a recomputable\
      \ accelerator (optionally idle-TTL'd), and reconcile/alert on every cache miss.\
      \ That eliminates the entire class of failure rather than chasing each expiry."
