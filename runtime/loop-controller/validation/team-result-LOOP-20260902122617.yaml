      output: "# Security Review: Redis Session State Silent Expiry Breaks Interview\
        \ Continuation\n\n**Reviewer:** security-engineer · **Scope:** `InterviewStateStore`/`InterviewService`\
        \ — interview session continuation\n\n## 1. Grounding in the actual code\n\
        \n- `backend/.../interview/service/InterviewStateStore.java:25` — `TTL_HOURS\
        \ = 24`, a **fixed** expiry applied on every write via `getBucket(key).set(json,\
        \ TTL_HOURS, HOURS)` (`:51`).\n- `InterviewStateStore.java:36` — `read()`\
        \ returns `null` on a missing key and returns `null` on a **parse failure**\
        \ too (`:44`). Both are indistinguishable silent misses.\n- `InterviewService.requireAsking(...)`\
        \ (`:380-399`) — the recovery path: on `state == null` it re-reads the `InterviewSession`\
        \ row from MySQL, rebuilds a `SessionState`, and **rewrites it to Redis with\
        \ a fresh 24 h TTL** (`:389`).\n- Class contract: \"Redis 作为状态机的单一权威来源\" (Redis\
        \ as the single source of truth) — `InterviewStateStore.java:14`.\n\n## 2.\
        \ When the Redis state can expire while the DB stays valid\n\n| Trigger |\
        \ Mechanism | Silent? |\n|---|---|---|\n| **Idle gap > 24 h** | Fixed TTL\
        \ counts from *last write*. No read renews it. A candidate who pauses crosses\
        \ the 24 h mark and the key simply vanishes from Redis; MySQL `InterviewSession.status`\
        \ stays `ASKING`. | Yes |\n| **maxmemory eviction** | Redis `maxmemory-policy:\
        \ allkeys-lru` can evict this key *before* TTL under memory pressure. Non-deterministic,\
        \ not controlled by TTL. | Yes |\n| **Redis restart/flush** | No persistence\
        \ guarantee (RDB/AOF off) ⇒ `FLUSHALL`/restart wipes all session keys; DB\
        \ untouched. | Yes |\n| **Key write ordering crash** | Transaction updates\
        \ MySQL then runs `stateStore.write` (`:114`→`116`). Crash between the two\
        \ leaves MySQL ahead of Redis; expiry later exposes the older/absent Redis\
        \ copy. | Partially |\n\nContinuation **alone is not fatally broken** in the\
        \ ideal case: `requireAsking` self-heals by reconstructing from MySQL. So\
        \ the real risk is the *silent* divergence it masks.\n\n## 3. Why continuation\
        \ breaks (the real reasons)\n\nThe apparent recovery is where the security\
        \ consequences hide:\n\n1. **Silent authority swap.** The class comment names\
        \ Redis the authoritative state machine, but on miss the app silently trusts\
        \ MySQL — *with no log line, metric, or event*. An operator cannot tell the\
        \ difference between \"key legitimately missing\" and \"state actually evicted/lost\"\
        \ (`read()` conflates TTL expiry and JSON parse failure at `:44`).\n\n2. **Unverified\
        \ write-back of a stale snapshot.** On miss it rewrites `(s.getStatus(), s.getQuestionCount(),\
        \ s.getCurrentQuestionId())` back to Redis `:387-389` **without** reconciling\
        \ them against the durable `InterviewMessage` rows. A stale `questionCount`\
        \ / `currentQuestionId` becomes the new authoritative truth for another 24\
        \ h.\n\n3. **Divergence surfaces at the wrong place.** The flow derives \"\
        asked questions\" from `InterviewMessage` rows (`:141-144`), while `questionCount`/`currentQuestionId`\
        \ come from the state snapshot. Two independent sources that can disagree\
        \ ⇒ **off-by-one: a question already answered gets re-asked**, or the resume\
        \ endpoint returns the wrong `currentQuestion`.\n\n4. **Workflow bypass /\
        \ replay / extra AI cost.** Fixed TTL means the server expires far later than\
        \ the transient runtime state is needed, so a still-valid auth token + silently-reset\
        \ server state lets a user *re-enter* and send another `answer` against a\
        \ session the product meant to be complete → duplicate `evaluationService.score`\
        \ → extra model/`ReportService` spend (`:150`, `:167`, `:225`). No start-attempt\
        \ replay guard is tied to this expiry because it is silent.\n\n5. **No integrity\
        \ check before trusting the fallback.** `requireAsking` trusts arbitrary DB\
        \ row content on miss; nothing cryptographically binds the Redis snapshot\
        \ to the DB row (no version/`updatedAt` check, no `COUNT(messages)` assertion).\n\
        \n## 4. Recommended hardenings\n\n**A. Make expiry sliding, with a hard cap\
        \ (top fix).**\nRenew TTL on *read*, not only write, so an active-but-idle-on-write\
        \ session does not expire mid-thought:\n```java\npublic SessionState read(Long\
        \ sessionId) {\n    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \    String json = bucket.get();\n    if (json != null) {\n        bucket.expire(TTL_HOURS,\
        \ TimeUnit.HOURS); // refresh so active sessions survive\n    }\n    ...\n\
        }\n```\nPair with the fixed 24 h as the *maximum* session length so a paused\
        \ interview still eventually tears down.\n\n**B. Make the miss observable\
        \ and reconciled, never blind.**\n```java\nprivate InterviewStateStore.SessionState\
        \ requireAsking(Long sessionId) {\n    InterviewStateStore.SessionState state\
        \ = stateStore.read(sessionId);\n    if (state == null) {\n        // 1) emit\
        \ metric/log: redis.session.miss so expiry is no longer silent\n        log.warn(\"\
        Redis session state missing (expired/evicted), recovering from DB. sessionId={}\"\
        , sessionId);\n        InterviewSession s = sessionMapper.selectById(sessionId);\n\
        \        if (s == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
        \        // 2) cross-check snapshot against durable messages before trusting\
        \ it\n        long msgCount = messageMapper.selectCount(\n            new\
        \ LambdaQueryWrapper<InterviewMessage>()\n                .eq(InterviewMessage::getSessionId,\
        \ sessionId)\n                .eq(InterviewMessage::getKind, \"question\"\
        ));\n        if (s.getQuestionCount() != msgCount) {\n            log.error(\"\
        State divergence: DB questionCount={} vs messages={}. sessionId={}\",\n  \
        \                    s.getQuestionCount(), msgCount, sessionId);\n       \
        \     // decide: repair from messages, or refuse continuation\n        }\n\
        \        state = new InterviewStateStore.SessionState(...);\n        stateStore.write(sessionId,\
        \ state);\n    }\n    ...\n}\n```\n\n**C. Redis production settings** (compose/config,\
        \ applies cluster-wide):\n- `maxmemory-policy noeviction` (or `volatile-ttl`\
        \ with hard monitoring) — never silently evict session keys via LRU.\n- Enable\
        \ RDB **and** AOF `appendfsync everysec` so `FLUSHALL`/restart does not flash\
        \ all runtime sessions.\n- Add a low-priority background job (or CloudWatch/Prometheus\
        \ alert) for `redis_session_miss` count per session so expiry is visible to\
