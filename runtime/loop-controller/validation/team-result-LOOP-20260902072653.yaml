        \ score, sequence/generation number, in-flight-LLM state) is **silently dropped\
        \ on every expiry** with no log. The expiry itself is also **unlogged** —\
        \ see C3.\n\n### C2. Fixed TTL < the legitimate interview lifetime\n\n**Break:**\
        \ 24h is an arbitrary SLA, not derived from a real session lifecycle bound.\
        \ A take-home / staggered interview spanning >24h **cannot exist by design**\
        \ — Redis forcibly evicts the key regardless of whether the interview is legitimately\
        \ still open. The DB happily allows it; the runtime state does not. Time-of-day\
        \ and weekday boundaries matter (a session created Friday 10:00 that the user\
        \ continues Monday 11:00 expires ~1h before resume).\n\n### C3. Expiry is\
        \ indistinguishable from \"never existed\" (observability gap)\n\n**Break:**\
        \ `read()` returns `null` both for \"key expired\" and \"key never created.\"\
        \ `requireAsking` cannot tell the difference without a DB probe (it does probe\
        \ — but silently). Consequences:\n- No metric/log distinguishes **hot-key\
        \ eviction** (a reliability signal) from a fresh read.\n- Operators cannot\
        \ see that a large fraction of active sessions are being quietly dropped by\
        \ maxmemory/LRU.\n\n### C4. DB-committed / Redis-write-failed divergence (same\
        \ class, write side)\n\n**Break:** ordering is DB-first, Redis-second, not\
        \ transactional. In `answer()` the DB `updateById` + `saveAiMessage` commit\
        \ first (lines 183–186); the subsequent `stateStore.write` (line 188) can\
        \ throw → `BizException` to the user **even though the DB moved forward**.\
        \ Retry triggers the self-heal, but the user saw a spurious error and any\
        \ compensating logic is absent. With `create()` (lines 87–117) it's worse:\
        \ DB insert + first question commit, then Redis `write` fails → `create()`\
        \ returns an error while a **live orphan session row exists** in the DB; a\
        \ frontend retry spawns a second session.\n\n### C5. In-flight SSE continuation\
        \ across the expiry boundary\n\n`answerStream` acquires the Redisson lock\
        \ for the whole streaming duration and writes Redis at the end. A gap of >remaining-TTL\
        \ between the guard read (`requireAsking`) and the terminal `stateStore.write`\
        \ (lines 263–264) means the intermediate TTL window is not refreshed by the\
        \ streaming itself — only by the wraps/completion. Under a long/backed-up\
        \ LLM streaming turn near the TTL boundary, the next turn sees a cold key.\n\
        \n### C6. Read-only / display paths are not guarded (UI continuity divergence)\n\
        \n`listByUser()` (lines 283–289) and `detail()` (lines 291–299) read **only\
        \ the DB** — they never enter `requireAsking` and never rehydrate Redis. So\
        \ while the *API* still shows a valid in-progress session, the **Redis copy\
        \ of the same session's runtime pointer is gone**, meaning any component that\
        \ reads `stateStore` directly (SSE-reconnect/resume logic checking Redis for\
        \ a FINISHED marker) will conclude a **finished interview is still in-progress\
        \ or vice-versa** — the FINISHED tombstone written at `finishSession` (lines\
        \ 345–346, also 24h TTL) silently vanishes, and Redis can no longer veto a\
        \ stale resume.\n\n## 3. Why the current design makes this a latent bug, not\
        \ a cosmetic one\n\n1. **The claimed authority is not the authority.** Comment\
        \ line 14–15 calls Redis \"单一权威来源,\" but the DB is the only durable authority\
        \ and the async scorers write DB-only fields (`totalScore`/`report`) that\
        \ `SessionState` never holds. The two stores hold **disjoint+overlapping truth**,\
        \ so \"expired Redis\" and \"valid DB\" are a *normal, expected* state — exactly\
        \ what the task describes.\n2. **Self-heal hides the symptom without recording\
        \ it.** C3/C4 mean every expiration looks like a normal `null`. No warning,\
        \ no reconciliation — flaky-continuation bugs surface only in QA/user reports.\n\
        3. **TTL is not refreshed by reads**, so \"activity extends lifetime\" is\
        \ false; only state *transitions* extend it.\n\n## 4. Concrete fixes\n\n###\
        \ 4.1 Make TTL a sliding window, refreshed on read (smallest fix)\n```java\n\
        public SessionState read(Long sessionId) {\n    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \    String json = bucket.get();\n    if (json == null) {\n        return\
        \ null; // caller (requireAsking) rehydrates from DB\n    }\n    // sliding\
        \ renewal ONLY for still-active states\n    try {\n        SessionState s\
        \ = objectMapper.readValue(json, SessionState.class);\n        if (!InterviewStatus.FINISHED.name().equals(s.status()))\
        \ {\n            bucket.expire(TTL_HOURS, TimeUnit.HOURS);\n        }\n  \
        \      return s;\n    } catch (Exception e) {\n        log.warn(\"parse session\
        \ state failed, sessionId={}: {}\", sessionId, e.getMessage());\n        return\
        \ null;\n    }\n}\n```\nRename the constant to reflect that it's now an **idle\
        \ timeout**, not a hard lifetime: `IDLE_TTL_HOURS = 72` (leave headroom over\
        \ real session length; reads refresh it).\n\n### 4.2 Log and classify expiry\
        \ on the self-heal path (fixes C3)\n```java\nprivate InterviewStateStore.SessionState\
        \ requireAsking(Long sessionId) {\n    InterviewStateStore.SessionState state\
        \ = stateStore.read(sessionId);\n    if (state == null) {\n        InterviewSession\
        \ s = sessionMapper.selectById(sessionId);\n        if (s == null) {\n   \
        \         throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n      \
        \  }\n        lastNullWas(sessionId, s);          // record: EXPIRED vs NEVER_CREATED,\
        \ status at probe\n        log.warn(\"session state cold-miss, sessionId={}\
        \ status={} count={} — rehydrated from DB\",\n                 sessionId,\
        \ s.getStatus(), s.getQuestionCount());\n        state = new InterviewStateStore.SessionState(\n\
        \                s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId());\n\
        \        stateStore.write(sessionId, state);\n    }\n    ...\n}\n```\n`lastNullWas`\
        \ can push a counter metric per `sessionId` so eviction vs. absence is observable.\n\
        \n### 4.3 Remove the `create()` orphan window (fixes C4)\nCommit Redis first\
        \ or make failure non-fatal on first-write; on subsequent steps treat Redis\
        \ as best-effort cache rather than authority:\n```java\n// after DB insert\
        \ + first question message commit\ntry {\n    stateStore.write(session.getId(),\
        \ new InterviewStateStore.SessionState(ASKING.name(), 1, msg.getId()));\n\
        } catch (Exception e) {\n    // do NOT throw: DB is authoritative; Redis is\
        \ a rehydratable cache.\n    // first subsequent requireAsking() will rebuild\
        \ the key.\n    log.warn(\"redis write degraded, session={}: {}\", session.getId(),\
        \ e.getMessage());\n}\n```\nThis converts C4 from \"user-facing error + orphan\
        \ row\" into \"resumable via the existing self-heal.\"\n\n### 4.4 Encode monotonic\
        \ versioning in the DB so rehydrated state cannot regress vs. async scoring\
        \ (fixes C5/C6)\nAdd `version INT` (or use `updatedAt`) to `interview_session`;\
        \ treat it as a fence token. Reconstituted Redis state must not overwrite\
        \ a DB row the async scorer has since advanced:\n```java\n// in requireAsking\
        \ rehydration, only accept DB state if it is the newest generation\nif (s.getVersion()\
        \ < expected) { /* stale — recompute from DB, do not overwrite */ }\n```\n\
        \n### 4.5 Design-level recommendation\nReframe Redis from \"single source\
        \ of truth\" → **\"hot working-set cache with TTL,\" rehydratable from the\
        \ DB** through exactly one choke point (`requireAsking`). Route `detail()`/`listByUser()`\
        \ reads through the DB (they already do) and reserve Redis for the *concurrency*\
        \ and *rate* guarantees (the Redisson lock). Add an acceptance test:\n\n-\
        \ Create session → write state → manually `DELETE interview:session:{id}`\
        \ → call `answer()` → assert it resumes at `questionCount+1` from the DB truth\
        \ with no duplicate question (this is the exact C1/C6 contract, and today\
        \ it only passes implicitly via `requireAsking`).\n\n## 5. Bottom line for\
        \ the lead\n\nContinuation does **not** hard-fail for the simple case because\
        \ `requireAsking()` rehydrates from the DB. It silently breaks/degrades in\
        \ these real scenarios: (C1) idle resume past the fixed 24h TTL, (C2) any\
        \ session longer than the arbitrary TTL, (C3) expiry indistinguishable from\
        \ absence → zero observability, (C4) DB-before-Redis ordering producing user-facing\
        \ errors and orphan sessions, (C5) expiry mid-streaming near the boundary,\
        \ and (C6) unguarded display/SQL paths diverging from the Redis pointer, with\
        \ the FINISHED tombstone vanishing so stale resumes aren't vetoed. The root\
        \ cause is putting authoritative, long-lived state in a TTL-bound volatile\
        \ store with **write-only TTL renewal and silent cold misses**. Fix priority:\
        \ **4.1 (sliding, read-refreshed TTL) → 4.3 (Redis as rehydratable cache,\
        \ no throw on write) → 4.2 (log/classify cold misses) → 4.5 (regression test)\
        \ → 4.4 (version fence)**."
