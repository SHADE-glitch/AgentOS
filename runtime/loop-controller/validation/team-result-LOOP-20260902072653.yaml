      ## TL;DR Diagnosis


      The Redis key `interview'
    output: "Codebase confirmed. Here's the analysis of the concrete instance (`InterviewStateStore`\
      \ + `InterviewService`), grounded in the actual implementation.\n\n---\n\n##\
      \ TL;DR Diagnosis\n\nThe Redis key `interview:session:{id}` stores the **state-machine\
      \ runtime state** (`status`, `questionCount`, `currentQuestionId`) with a **fixed\
      \ 24h TTL** that is set **only on `write()`** (`InterviewStateStore.java:25,51`)\
      \ and **never renewed on `read()`** (`InterviewStateStore.java:34-46`).\n\n\
      - **When it expires silently:** any in-progress session that crosses the 24h\
      \ TTL boundary *without further writes* — it does not matter that the MySQL\
      \ row still says `ASKING`, or that the candidate is \"still mid-interview.\"\
      \ The TTL is last-write based, not activity based.\n- **When it breaks continuation:**\
      \ the runtime state is the authority the state machine pivots on. When the key\
      \ is gone, Redis just returns `null` — the app cannot distinguish \"expired\"\
      \ from \"never existed\" from \"evicted.\" In this codebase a lazy fallback\
      \ in `requireAsking()` (`InterviewService.java:380-399`) rebuilds from the DB\
      \ row, so a **single low-concurrency flow survives** — but that mitigation is\
      \ implicit, partial, and creates its own silent-regression window.\n\n---\n\n\
      ## 1. When does silent expiry happen?\n\n`TTL_HOURS = 24` is stamped on every\
      \ write and counts down continuously. Nothing resets it on read. So:\n\n| Scenario\
      \ | Redis expires? | MySQL still valid? |\n|---|---|---|\n| Candidate pauses\
      \ >24h mid-interview (slow/long interview, natural pause) | **Yes** | Yes (`ASKING`)\
      \ |\n| Fixed TTL too short for genuinely long-running sessions | **Yes** | Yes\
      \ |\n| Redis driven by an eviction policy (`allkeys-lru`, `volatile-lru`, `noeviction`\
      \ under OOM) drops the key early | **Yes** | Yes |\n| Not an expiry, but key\
      \ manually deleted / flushed | **Effectively yes** | Yes |\n\nThe defining property\
      \ of \"silent\": Redis returns a plain `null` for a missing key. There is no\
      \ error, no sentinel, no marker — the caller must *guess* whether that means\
      \ \"expired,\" \"aborted,\" or \"just not created.\" The `null` in `read()`\
      \ is indistinguishable across those three (line 38).\n\n---\n\n## 2. Why does\
      \ continuation break?\n\nThe runtime state is the singular pivot the state machine\
      \ uses to decide what happens next:\n\n- `requireAsking()` reads it to validate\
      \ the transition (`InterviewService.java:380-399`).\n- `answer()` derives the\
      \ **next question index** from it: `int newCount = state.questionCount() + 1`\
      \ (`InterviewService.java:179`).\n- It carries the **current question pointer**\
      \ so the UI can render where the candidate is.\n- It is written as the authority\
      \ *after* the DB updates (e.g. `InterviewService.java:114-117`,`186-189`).\n\
      \nGeneric failure (no fallback): `read` → `null` → handler throws `INTERVIEW_STATE_ERROR`\
      \ \"当前状态不允许提交答案\", or worse, treats the session as fresh and silently **restarts**\
      \ the interview — the candidate loses position, duplicates questions, or cannot\
      \ submit at all *while the DB still holds the valid record*.\n\nThat mismatch\
      \ is the whole point: **the durable, correct record (MySQL) and the runtime\
      \ record (Redis) have different lifetimes**, and the state machine is (incorrectly)\
      \ coupled to the short-lived one.\n\n---\n\n## 3. This repo specifically — where\
      \ it still breaks despite the fallback\n\n`requireAsking()` has a recovery path\
      \ (`InterviewService.java:382-390`): if the key is `null`, it rebuilds the state\
      \ from the `interview_session` row and **re-writes Redis with a fresh 24h TTL**.\
      \ So the hard \"session disappeared\" failure is masked in the happy path. But\
      \ that mitigation is fragile in three concrete ways:\n\n**A. The recovery only\
      \ covers DB-side fields — any runtime data not on the row is silently lost.**\
      \ The rebuild copies only `status`, `questionCount`, `currentQuestionId` from\
      \ the table. Any supplementary runtime state (queued follow-up list, streaming/SSE\
      \ cursor, retry/attempt counters, cooldown) would be dropped on recovery with\
      \ no signal, so the flow continues *as if it never existed* — a silent state\
      \ regression rather than a clean stop.\n\n**B. The recovery is a read-*and-write*,\
      \ so it smells like a sliding window but is not.** It refreshes the TTL only\
      \ on the *fallback path*, not on every read. A long session still expires every\
      \ interval and never gets closer to self-healing during active reads — it only\
      \ \"heals\" on the one call that happens to hit `null`.\n\n**C. The DB row can\
      \ be stale relative to the true runtime in exactly the window that matters.**\
      \ The TTL keeps MySQL and Redis \"eventually\" in sync only because the 3 fields\
      \ are coincidentally duplicated. If the write ordering or another writer breaks\
      \ that invariant, the fallback blindly rehydrates the **stale** row, and `questionCount\
      \ + 1` then re-asks/dedupes incorrectly. The fallback is optimistic about DB\
      \ being authoritative — but it was never introduced as the authoritative store.\n\
      \nSo the honest verdict for this codebase: **simple single-threaded continuation\
      \ survives the 24h expiry** only *because* of the implicit DB fallback; **anything\
      \ beyond those 3 fields, or any divergence between Redis and the row, silently\
      \ breaks continuation while MySQL remains perfectly valid.**\n\n---\n\n## 4.\
      \ Concrete fixes\n\n**Option A — Sliding TTL (smallest change).** Renew TTLOVERS\
      \ on *every read*, not just write. Turns wall-clock expiry into idle-expiry:\
      \ an actively-continuing session never dies.\n\n```java\npublic SessionState\
      \ read(Long sessionId) {\n    String key = key(sessionId);\n    RBucket<String>\
      \ bucket = redissonClient.getBucket(key);\n    String json = bucket.get();\n\
      \    if (json == null) {\n        return null;\n    }\n    // renew on read:\
      \ TTL now measures idle time, not absolute age\n    bucket.expire(Duration.ofHours(TTL_HOURS));\n\
      \    try {\n        return objectMapper.readValue(json, SessionState.class);\n\
      \    } catch (Exception e) {\n        log.warn(\"parse session state failed,\
      \ sessionId={}\", sessionId, e.getMessage());\n        return null;\n    }\n\
      }\n```\n\n**Option B — Make MySQL the single authority; treat Redis as a pure\
      \ read-through cache.** Drop the \"single authoritative source\" coupling. `requireAsking`\
      \ / the transition checks read the DB row; Redis is an explicit convenience\
      \ cache whose absence is a L1-2 cache miss, not a state error:\n\n```java\n\
      private InterviewStateStore.SessionState requireAsking(Long sessionId) {\n \
      \   InterviewSession s = requireOwnedSession(stateHolderUserId(), sessionId);\
      \ // DB always\n    if (InterviewStatus.FINISHED.equalsIgnoreCase(s.getStatus()))\
      \ throw ...FINISHED;\n    if (!ASKING/START) throw ...STATE_ERROR;\n    // Redis\
      \ is optional perf cache only:\n    stateStore.write(sessionId, new SessionState(s.getStatus(),\
      \ s.getQuestionCount(), s.getCurrentQuestionId()));\n    return state;\n}\n\
      ```\n\n**Option C — Version/tombstone sentinel.** Store a monotonically increasing\
      \ version (`INCR interview:ver:{id}` on each write). On recovery, compare the\
      \ reconstructed `questionCount`/`currentQuestionId` against the last DB-written\
      \ values and reconcile / raise a flag if they regress, so divergence is loud\
      \ instead of silent.\n\n## 5. Trade-offs\n- **A:** simplest, keeps existing\
      \ read path; accepted cost = one extra `EXPIRE` per read and idle sessions can\
      \ still linger if the process never re-reads (they expire, which is arguably\
      \ desired).\n- **B:** most robust and removes the semantic lie in the `InterviewStateStore`\
      \ comment (\"单一权威来源\"); cost = slightly more DB traffic for state checks, and\
      \ the lock (`interview:lock:{id}`) now guards DB reads too.\n- **C:** best observability;\
      \ cost = added counter management and reconcile logic, overkill unless divergence\
      \ is actually observed.\n\n**Recommended:** A+B combined — MySQL as the single\
      \ source of truth, Redis as an idle-TTL read-through cache. That eliminates\
      \ the silent-expiry *class* of bugs rather than patching one instance.\n\n---\n\
      ## 6. Validation\n- **Idle test:** create a session, wait past TTL without answering\
      \ → confirm the fallback (B) correctly rebuilds and the next `answer` succeeds\
      \ and shows the *same* `currentQuestionId`, no duplicate question.\n- **Active\
      \ test (for A):** create session, make periodic reads/answers spaced under TTL\
      \ → confirm `TTL` keeps resetting and the key never drops.\n- **Divergence test\
      \ (for C):** force a manual DB `UPDATE` to `questionCount`/`currentQuestionId`\
      \ without a Redis write, then answer → confirm a visible reconciler/alert rather\
      \ than silently re-asking.\n- **Negatives:** no `NullPointerException` on recovery,\
      \ no `INTERVIEW_STATE_ERROR` for a valid `ASKING` session solely because Redis\
      \ expired, and a FINISHED row still correctly rejects answers even after expiry."
