      output: "# Redis 固定 TTL 会话状态静默过期 —— 数据库工程师分析报告\n\n## 目标\n- 业务目标：定位「Redis 会话状态在固定\
        \ TTL 后静默消失、但 DB 数据仍旧有效」的场景，解释续接（continuation）为何、何时断裂。\n- 成功标准：明确触发条件、根因、影响面，并给出可落地的配置/架构建议。\n\
        \n## 问题判断\n\n### 根因\n会话状态被放在 **仅由 TTL 决定生命周期的 Redis key**，而持久层（DB）里的业务数据未声明该生命周期。二者生命周期来源不同步，导致：\n\
        1. Redis key 到期被主动删除（惰性删除或过期扫描）；\n2. 应用下次读取该 key 时 miss；\n3. 应用按「miss=新会话」处理，状态丢失\
        \ —— 即使 DB 中的会话/用户/草稿记录依然存在且仍应可续接。\n\n### 关键假设\n- Redis 被当作「会话存储」而非纯缓存（读时回源\
        \ DB 并重建）；\n- key 用固定 TTL（如 `SET key val EX 3600`），非滑动 TTL；\n- 续接逻辑依赖 Redis\
        \ 命中率来判断「会话是否有效」。\n\n### 关键限制 / 会触发断裂的时间点\n| 场景 | 发生时间 | 为何断裂 |\n|------|---------|---------|\n\
        | **固定 TTL 到期** | TTL 到达后、下次访问前 | key 被删，miss → 新会话 |\n| **活跃用户被过期**（不动会续期）|\
        \ 无论用户有多活跃，只要固定 TTL 到期即失效 | 固定 TTL 不随访问刷新 |\n| **惰性删除窗口** | 到期后首次访问 | `GET`\
        \ 返回 nil |\n| **过期扫描批量重删** | 每 100ms 左右扫描，随机抽样 | `activeExpireCycle` 可能延迟删除，期间含额外竞争窗口\
        \ |\n| **内存压力近 maxmemory** | 任意时刻 | 尝试淘汰，与业务数据不一致 |\n| **持久化/故障切换** | AOF/RDB\
        \ 与 Replica 时间差 | 副本上的 key 过期处理由主库驱动，主库删了副本才删，中间窗口不一致 |\n\n### 为什么“DB 仍有效”是个隐患\n\
        续接逻辑常写成：\n- Redis hit → 恢复上下文\n- Redis miss → 判定会话过期/需重新开始\n\n这是**两者含义被混为一谈**：miss\
        \ 只能说明「Redis 里没这个临时态」，不能证明「业务会话已终止」。当 DB（如 `sessions` 表、`drafts` 表、`interview_attempts`\
        \ 表）里的行还存在时，用户期望能续接，但应用因 Redis miss 直接中断。\n\n---\n\n## 方案设计\n\n### 方案 A：滑动\
        \ TTL（续期）—— 最小改动\n每次访问命中即刷新 TTL。\n```redis\nSET session:{id} {json} \nEXPIRE\
        \ session:{id} 3600   -- 访问命中后调用\n```\n- 优点：活跃会话永不过期；改动小。\n- 缺点：活跃会话可无限存活（热会话永驻内存）；仍会被内存淘汰打断；固定\
        \ TTL 场景治标不治本。\n\n### 方案 B：Redis 只存缓存/临时态，来源以 DB 为准 —— 推荐\n把 Redis miss 从「会话终止」降级为「可重建缓存」：\n\
        1. 续接决策以 DB 记录为准；DB 记录仍在 → 用 DB 语义重建会话状态。\n2. Redis 仅缓存已计算出的会话断言，miss 时回源\
        \ DB 重建。\n3. 显式区分：\n   - 真正的「已终止」由 DB 状态字段表达（如 `status = completed/cancelled/expired`）；\n\
        \   - 而非由 Redis TTL 隐式表达。\n\n伪代码：\n```python\ndef get_session(sid):\n    cached\
        \ = redis.get(f\"session:{sid}\")\n    if cached is not None:\n        return\
        \ Session(**json.loads(cached))          # 命中\n    row = db.query(\"SELECT\
        \ * FROM sessions WHERE id=%s\", sid)\n    if row is None or row.status not\
        \ in ACTIVE_STATES:\n        return None                                 \
        \   # 真正终止：DB 说了算\n    sess = rebuild_session(row)                       \
        \ # 重建\n    redis.setex(f\"session:{sid}\", TTL_SLIDING, sess.json())\n  \
        \  return sess\n```\n\n### 方案 C：DB 侧续接 token + 双写写入\n- DB 表加 `updated_at`\
        \ 用于滑动语义与审计；\n- 续接不依赖 Redis，直接查 DB；\n- Redis 写失败或过期不影响主流程，仅性能损失。\n\n---\n\n\
        ## 实施方案（推荐 B + 必要项沉淀）\n\n### 1. 明确状态所有权\n- **真实会话生命周期 → DB**（唯一事实来源）；\n- **Redis\
        \ → 仅存加速用的派生缓存**，TTL 只是缓存有效期，不是业务过期。\n\n### 2. 若必须用 Redis 作授权边界，统一过期策略\n-\
        \ 对授权类会话用**滑动 TTL** 并按角色设上限（如 idle=15min，absolute max=12h 用 DB 兜底）；\n- 对一次性状态（验证码、OAuth\
        \ code）用固定短 TTL 合理。\n\n### 3. 区分 miss 的两种含义\n实现成枚举，避免把「缓存 miss」误判为「会话失效」：\n\
        ```python\nclass Resumption:\n    RESUMED      # redis 命中\n    REBUILT   \
        \   # DB 有效，重建缓存\n    TERMINATED   # DB 明确结束\n```\n\n### 4. 兜底与兜底监控\n- 开启\
        \ Redis 监控：expired_keys / evicted_keys 指标告警；\n- 对 `GET` 返回 nil 的命中率下降做报警；\n\
        - 网络抖动下用 Redis cluster 或加副本，避免单点过期。\n\n### 风险点与处理\n- **热会话永远驻留**：滑动 TTL 下给\
        \ DB 侧 `updated_at` + absolute 上限兜底（详见验证）。\n- **DB 与 Redis 短暂不一致**：可接受，因为\
        \ Redis 可重建；DB→Redis 写失败时降级为每次回源（仅性能损失，无正确性损失）。\n- **竞态（并发重建）**：对重建加 NX 写入或接受幂等覆盖，影响小。\n\
        \n---\n\n## 验证方式\n1. 单测「缓存 miss + DB 行有效」→ 断言返回 REBUILT，状态不丢。\n2. 单测「DB `status=completed`」→\
        \ 断言返回 TERMINATED，即使 Redis 仍有缓存值（以 DB 为准优先）。\n3. 集成：固定 TTL 到期前/后各访问一次，确认活跃态不因固定\
        \ TTL 中断（改用滑动 TTL 后）。\n4. 压测/混沌：注入 Redis flushall / cluster epoch 切换，验证续接成功率不为\
        \ 0（DB 兜底生效）。\n5. 指标验证：`expired_keys`、`evicted_keys`、续接成功率（RESUMED/REBUILT/TERMINATED\
        \ 分布）看板。\n\n### 预期结果\n- 活跃会话续接率 ~100%（不再受固定 TTL 影响）；\n- 仅真正终止（DB 状态结束）的会话才无法续接；\n\
        - cache miss 不再等价于 session 失效。\n\n### 复盘建议\n- 把「生命周期所有权」写进会话存储的架构决策记录，避免后续用\
        \ Redis TTL 当授权边界的回归；\n- 固定 TTL 遗留代码若有内部依赖「TTL=过期」的语义，需逐一审读迁移。\n\n---\n\n\
        ## 给 lead 的结论（一句话）\n续接断裂的根本原因是**用 Redis TTL 隐式表达了业务会话生命周期，而 DB 名存实亡造成语义冲突**；根治方案是「DB\
        \ 为唯一事实来源、Redis 仅作可重建缓存」，并在决策点显式区分 RESUMED / REBUILT / TERMINATED 三种续接路径。\n\
        \n可选的后续产出：为团队补充一个 `redis-ttl-as-semantic-lifecycle` 反模式清单与迁移 checklist，供 code-reviewer\
        \ 与 backend-architect 复核时对齐。"
