      output: "## 判断结论（TL;DR）\n\n`InterviewStateStore`（`InterviewStateStore.java:25,51`）用**固定\
        \ 24h TTL**（每次 `write` 用 `set(key, json, 24h)` 重置），而 DB 是持久化的。因为状态只在**状态迁移时写一次**、`read()`\
        \ 不刷新 TTL 且**吞掉解析错误把它等同于\"过期\"**——所以\"静默过期\"是真实存在的；当前之所以多数时候\"看起来能续上\"，只是被\
