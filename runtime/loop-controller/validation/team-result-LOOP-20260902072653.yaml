        \ 固定 TTL + 读写不对称\"**这三者的组合。下面展开。\n\n---\n\n## 问题判断\n\n### 根因\n\n1. **固定 TTL\
        \ 是从\"最后一次写\"起算，不是从会话创建起算。**`write()` 每次都重置为满 24h（`set(json, TTL_HOURS, HOURS)`），所以只有\"\
        两次写之间空闲 >24h\"才会过期。对一个进行中的面试这不是主要矛盾。\n2. **TTL 不是滑动的**：`read()`（`InterviewStateStore.java:34-46`）只\
        \ `bucket.get()`，**不 touch/延长 TTL**。用户\"暂停后回来查看/续答\"，如果中间隔着长空闲期且只看不写，key 照旧过期。\n\
        3. **真正可控的\"提前静默过期\"是 Redis 内存淘汰**：若实例开了 `maxmemory` 并配 `allkeys-lru`/`allkeys-random`/`volatile-random`（`volatile-lru`\
        \ 也会在 TTL 未到时就淘汰带 TTL 的 key），key 会**在 TTL 到期前就被逐出**，完全脱离应用控制、且日志无痕。\n4. **`read()`\
        \ 把\"解析失败\"与\"过期\"都折叠成 `null`**（`:38, 43-45`），与过期不可区分，统一进入 DB 兜底。\n\n### 什么时候静默过期（给出可复现条件）\n\
        \n- 会话暂停，两次 `write`（回答）之间空闲 **> 24h**：key 到期，DB 仍为 `ASKING`、消息完整。\n- 或 Redis\
        \ 命中 `maxmemory`（`volatile-lru`/`allkeys-*`）：**TTL 未到就被逐出**，DB 仍有效，且无告警。\n\
        - 或 Redis 节点重启且未开 AOF/RDB：内存 key 全丢（AOF `appendfsync=always/everysec` 或 RDB\
        \ snapshot 可缓解，但没有则静默丢）。\n\n### 为什么\"续接会断\"——核心\n\n续接流程是 `answer()/answerStream()`\
        \ → `requireAsking()`（`InterviewService.java:380-399`）。它确实有 DB 兜底：\n\n```\n\
        state = stateStore.read(id);         // 过期 → null\nif (state == null) {\n\
        \    s = sessionMapper.selectById(id);  // DB 有效\n    state = 从 DB 重建 {status,\
        \ questionCount, currentQuestionId}\n    stateStore.write(id, state);    \
        \   // 回写，再次续 24h\n}\n```\n\n但这套兜底**只能在\"状态恰好 1:1 镜像到 DB\"时才无损**。断链/出错发生在以下情况：\n\
        \n| 场景 | 是否断 | 原因 |\n|---|---|---|\n| 进行中面试，回答间隔 <24h | 不断（每次写续期） | 每写重置 TTL\
        \ |\n| 暂停 >24h 后续答 | **依赖 DB 兜底，当前恰好能续** | 状态三字段都在 DB |\n| **未来状态字段没落 DB**（LLM\
        \ 上下文指针、知识域游标、中间 partial） | **断+数据丢失** | 兜底只从 DB 重建，非 DB 运行时字段没了 |\n| **TTL\
        \ 内被淘汰 / 重启无持久化** | **断（客户端视角）** | 静默消失，DB 兜底掩盖了\"静默\" |\n| 兜底重建后**状态回归**\
        \ | 断+语义错误 | 客户端已按新 `questionCount` 渲染，DB 兜底重建出旧值，`answer()` 内 `state.questionCount()+1`\
        \ 可能与客户端已看到的题号不一致，造成**重复走 $++ / 跳题** |\n| `read()` 解析 JSON 失败（升级改了结构/脏数据）\
        \ | 被当作过期→兜底重建，**可能把已 FINISHED 或被并发刚写过的新状态回退** | 折叠语义 |\n\n**一句话总结断链原因**：`InterviewStateStore`\
        \ 把自己注释为\"单一权威来源\"（`:14-15`），但实际寿命由 24h 固定 TTL 决定、且只随写刷新；当 TTL 静默过期时，权威源被清空，续接被迫回退到\"\
        从 DB 反推 + 回写\"。只要\"Redis 里的状态 ⊇ DB 字段\"（现在只是恰好相等），回退即是**有损**的；而 `read()` 吞解析错误又把\"\
        脏数据\"与\"过期\"混淆，放大了回退污染。\n\n---\n\n## 方案设计（Decision Framework）\n\n**Option\
        \ A — 滑动 TTL（read 时 touch）**\n- 强：实现最小，`read()` 里 `bucket.expire` 即可；活跃会话不会被长空闲期单次读到就断。\n\
        - 弱：只能撑住\"用户持续访问\"；无法防淘汰/重启；TTL 依然是固定上限。\n- 最适合：快速止血。\n\n**Option B — 基于\"\
        最近活动时间\"刷新 + DB 校验**\n- 强：根本对齐\"会话寿命≠固定 24h\"，用 DB `startedAt`/`updatedAt`/会话级\
        \ `lastActivityAt` 决定 TTL 上限，续期只对有真实活动（非仅读）的会话；过期与淘汰可区分。\n- 弱：需要额外落库/心跳字段，改动面稍大。\n\
        - 最适合：根治的方向（推荐）。\n\n**Option C — 关闭固定 TTL + Redis 持久化，DB 才是权威，Redis 只管并发与短期事务**\n\
        - 强：语义最干净——把\"权威源\"从 Redis 挪回 DB，Redis 只做锁 + 短期提示。\n- 弱：重构大，`requireAsking`\
        \ 兜底要去掉\"回写续命\"逻辑。\n- 最适合：系统演进中期。\n\n### 决定\n- **当前代码最小改动：选 A（滑动 / 明确续期）+\
        \ 启用 `noeviction` 或 `volatile-lru` 并监控，杜绝 TTL 未到先被逐出；同时排查所给 TTL 是否足够一场面试的\"\
        真实空闲上限\"。**\n- **架构上：选 B 作为跟进**，把固定 24h 换成\"会话有效 TTL = max(24h, DB 最近活动 +\
        \ 容忍窗口)\"，刷新只发生在真实写活动。\n- **放弃的表达**：不要靠\"把 TTL 调很大\"逃避——固定 TTL 的本职是回收泄漏，调大只是推迟问题。\n\
        \n---\n\n## 实施方案（核心代码）\n\n### 1. 让 `read()` 滑动续期（止血，配合更长的会话存活窗口）\n\n```java\n\
        public SessionState read(Long sessionId) {\n    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \    bucket.expire(TTL_HOURS, TimeUnit.HOURS); // touch：读也续期，避免仅读过程过期\n  \
        \  String json = bucket.get();\n    if (json == null) return null;\n    try\
        \ {\n        return objectMapper.readValue(json, SessionState.class);\n  \
        \  } catch (Exception e) {\n        log.warn(\"parse session state failed,\
        \ sessionId={}\", sessionId);\n        return null;\n    }\n}\n```\n> 注意 touch\
        \ 与 get 非原子，读窗口极小可接受；若要求严格，用 Lua/`EXPIRE..GET` 近似。\n\n### 2. 区分\"过期\"与\"脏数据\"\
        ，避免兜底污染（更稳妥）\n\n给 state 加版本/写入时间，`read()` 返回时区分 `EXPIRED` 与 `CORRUPT`：\n\n\
        ```java\npublic record SessionState(String status, int questionCount,\n  \
        \                         Long currentQuestionId, long writtenAt) {}\npublic\
        \ enum ReadResult { NOT_FOUND, EXPIRED, OK }\n\n// NOT_FOUND -> DB 兜底重建（可接受）\n\
        // CORRUPT   -> 抛错/告警，而不是静默当过期去覆盖\n```\n\n### 3. 防止\"未到 TTL 被淘汰\"——运维侧（配置建议）\n\
        \n```yaml\n# docker-compose / redis.conf\nmaxmemory-policy noeviction   #\
        \ 或 volatile-lru + 预留内存；严禁 allkeys-*\nappendonly yes\nappendfsync everysec\n\
        save 900 1\nsave 300 10\n```\n并加监控告警：`redis-cli info evicted_keys` 增量、`maxmemory`\
        \ 水位。\n\n### 4. DB 兜底重建改为\"失败封闭\"，不默默回写（容器化正确性）\n\n`requireAsking()` 当前的\"\
        重建+回写\"（`InterviewService.java:387-389`）会把一次静默过期变成**静默写覆盖**。建议回写前做 CAS/版本校验，或至少打\
        \ `warn` 日志 + 把重建结果映射到 `INTERVIEW_STATE_ERROR` 而非静默通过，让续接失败可观测而不是\"看起来成功实则状态回退\"\
        。\n\n---\n\n## 验证方式\n\n- 压测/测试：\n  1. 写状态 → `redis-cli PTTL` 确认还剩 24h；`read()`\
        \ 后 `PTTL` 刷新（验证滑动）；`write()` 后再次刷新。\n  2. 设置极小 TTL（如 5s）模拟，`sleep 6s` 后调用\
        \ `answer()`，断言走 DB 兜底续接，且 `questionCount` 不回归。\n  3. 触发 `maxmemory`，断言 `noeviction`\
        \ 下写失败可见、或 `volatile-lru` 下淘汰有 `evicted_keys` 增量与告警。\n  4. 注入坏 JSON 到 key，断言进入\
        \ CORRUPT 分支而非静默当过期重建覆盖。\n- 预期结果：活跃/兜底续接成功；过期与脏数据区分无覆盖；淘汰有告警；Redis 重启不\"静默\"\
        丢活跃会话。\n- 复盘建议：把\"Redis 权威 vs DB 权威\"从 doc 注释层面落到实现——要么只做一个权威，要么让两者可对账（版本号）并明确\
        \ TTL 语义为\"会话有效窗\"而非\"固定 24h\"。\n\n---\n\n供 lead 评审。核心观点：**断链既不是因为 TTL \"\
        短\"，也不是 DB 失效，而是固定 TTL + 只写续期 + read 吞错 + 权威源注释相矛盾共同导致\"静默清空权威源、续接被迫做有损回退\"\
