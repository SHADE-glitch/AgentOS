      output: "I have full context on the Redis/DB state handling. Here is my analysis\
        \ and recommendation deliverable.\n\n---\n\n# Interview Session State: Redis\
        \ TTL Expiry vs. DB Validity\n\n## 1. Where the state actually lives\n\n|\
        \ Concern | Redis (authoritative, ephemeral) | MySQL (persistent projection)\
        \ |\n|---|---|---|\n| Store | `InterviewStateStore` (`InterviewStateStore.java:34-60`)\
        \ | `interview_session` (`schema.sql:46-60`) |\n| Fields | `SessionState{status,\
        \ questionCount, currentQuestionId}` | `status`, `current_question_id`, `question_count`,\
        \ + `finished_at` |\n| TTL | **24h sliding** — `write()` re-arms on every\
        \ transition (`InterviewStateStore.java:51`) | none; `started_at` only, **no\
        \ `updated_at`/`last_activity`** |\n| Reads w/ fallback | only `requireAsking()`\
        \ (`InterviewService.java:380-399`) | `detail()`, `list()`, `result()` read\
        \ DB only |\n\nClaimed design: the class comment declares Redis as the state\
        \ machine's **single authoritative source** (`InterviewStateStore.java:15`),\
        \ yet its lifetime is governed by a TTL against a DB that persists indefinitely.\
        \ That dual-authority is the root of the problem.\n\n> Correction to the task\
        \ premise: the current `write()` re-arms `24h` on every state transition (`InterviewStateStore.java:51`),\
        \ so the TTL is **sliding**, not fixed/absolute. A *truly fixed* TTL (set\
        \ once at create) would kill in-flight sessions mid-interview. Sliding TTL\
        \ only bites **idle sessions**. I flag both below.\n\n## 2. When Redis expires\
        \ while the DB stays valid\n\nA key only disappears under these conditions\
        \ for an in-progress (`ASKING`) session:\n\n- **Idle > 24h** between state\
        \ transitions — the sliding lease lapses mid-pause. The DB row remains `status=ASKING`,\
        \ question history intact, so DB is \"valid\" but the authority key is gone.\n\
        - **Redis restart / no persistence** (`appendonly no`, default) → all session\
        \ keys vanish; DB untouched.\n- **Memory eviction** — if `maxmemory-policy`\
        \ is `allkeys-lru`/`volatile-lru`/`volatile-ttl`, low-value keys get silently\
        \ evicted well before TTL; no notification.\n- **Write-path interruption**\
        \ (`InterviewStateStore.java:52-55` throws `INTERNAL_ERROR` after the DB `updateById`\
        \ already committed) → Redis holds stale state, not null.\n\nThe consequence\
        \ is a **divergent history**: DB says \"in progress q2 of 6\", Redis says\
        \ \"missing\" (or stale). That is silent — nothing logs at warn/error, no\
        \ metric, no client-visible signal.\n\n## 3. Why continuation breaks — and\
        \ where it *doesn't*\n\n`requireAsking()` (`InterviewService.java:380-399`)\
        \ is the only Redis consumer and it ships a **DB re-hydration fallback**:\
        \ on `read == null` it rebuilds `SessionState` from the `interview_session`\
        \ row and re-writes it. So for the *plain idle-expiry* case, **continuation\
        \ is actually recovered on the next `answer`/`answerStream`**. The genuine\
        \ break points are the less obvious ones:\n\n**(a) Silent resurrection masks\
        \ a \"zombie\" session.** Redis-as-authority is meant to gate whether interview\
        \ X is truly in-progress. Because the DB has **no freshness/TTL on `ASKING`\
        \ rows**, an idle session is treated as resumable *indefinitely*; the fallback\
        \ quietly re-creates a fresh 24h lease from a DB row that may be months old.\
        \ Nothing prevents continuing a session the operator believed abandoned. This\
        \ is exactly \"DB remains valid\" being a bug, not a feature.\n\n**(b) The\
        \ only hard `continuation` break is the stale non-null case.** Re-hydration\
        \ fires only when Redis returns `null`. After a **write failure** (`answer()`\
        \ DB commits q2, `stateStore.write` throws, path aborts at `InterviewService.java:186-189`),\
        \ Redis is *not* null — it still holds q1's state. Next `answer()` reads stale\
        \ `questionCount` and does `newCount = stale+1` (`InterviewService.java:179`),\
        \ so the counter silently misaligns with the DB's `question_count` and appended\
        \ messages. `detail()` then highlights the wrong current question (`toVO`\
        \ filter, `InterviewService.java:435`). Continuation proceeds but **with corrupted\
        \ count/cursor** — a worse outcome than a clean resume.\n\n**(c) Divergence\
        \ never reconciles the reverse direction.** Re-hydration only snapshots DB→Redis.\
        \ The state machine's authoritative transitions flow Redis-side; because both\
        \ are written together, any partial write (ahead-of-time split-brain) leaves\
        \ no reconciler to detect \"Redis says X, DB says Y\".\n\n**(d) If it ever\
        \ becomes a fixed TTL** (or someone lowers it below the session ceiling, or\
        \ the answer/SSE gap exceeds it), the expiry lands **between two dependent\
        \ writes** — e.g., between `saveAiMessage` and `stateStore.write` — creating\
        \ tombstones: a persisted question with a dead session key and no re-arm until\
        \ the *next* request.\n\n## 4. Projected impact (if unaddressed)\n\n- Wrong\
        \ question count/cursor rendered to user on partial-write sessions (**integrity**,\
        \ accessibility concern).\n- Indefinitely-resumable sessions → stale `ASKING`\
        \ rows accumulate; reporting/dashboard aggregation (`DashboardService`) may\
        \ double-count or mis-timestamp finished-vs-stale.\n- Unbounded Redis keys\
        \ if `delete()` never runs on finished-abandoned sessions; memory pressure\
        \ → eviction → the very silence above.\n\n## 5. Recommendations (database\
        \ + security)\n\n**A. Make one store authoritative; stop treating Redis as\
        \ sole truth.** Keep DB `interview_session` + `interview_message` as the system\
        \ of record and derive `SessionState` from it; treat Redis as a **cache +\
