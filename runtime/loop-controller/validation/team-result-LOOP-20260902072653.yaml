      output: "## Output for lead review — Interview session runtime state expiry\
        \ (backend-architect contribution)\n\n---\n\n## 1. Diagnosis: root cause\n\
        \nThe failure is an **architectural mismatch between two separately-managed\
        \ lifetimes**. The DB row models *logical session state* (\"this interview\
        \ exists and is active\"); the Redis key models *process-runtime locality*\
        \ (\"this interview has materials loaded in memory\"). A **fixed, absolute\
        \ TTL** binds Redis' lifetime to a *constant set at creation*, which cannot\
        \ track the session's *actual* activity. When the constant expires first,\
        \ Redis drops the runtime state while the DB still reports a valid session\
        \ — producing the silent divergence where \"DB valid, continuation broken\"\
        .\n\nThe core defect is not \"TTL too short\". It is that **read-path failure\
        \ semantics are wrong**: the code treats a Redis miss as terminal (\"session\
        \ expired\") instead of as a *cold cache* that must be rebuilt from the authoritative\
        \ store.\n\n---\n\n## 2. When continuation breaks — concrete triggers\n\n\
        | # | Condition | Why it breaks | Severity |\n|---|-----------|---------------|----------|\n\
        | C1 | Session is actively used but lasts longer than the fixed TTL | TTL\
        \ is absolute, never refreshed; even *attentive* users hit it | High |\n|\
        \ C2 | User idles past TTL then resumes | Idle exceeds expiry; no sliding\
        \ window | High |\n| C3 | Async step (e.g. final grading, upload, LLM call)\
        \ runs longer than TTL with no Redis touch | No mutation → no refresh → key\
        \ dies mid-operation | High |\n| C4 | Many small keys, each with its own TTL\
        \ | Partial expiry — half the state is gone, DB row intact | Medium |\n| C5\
        \ | TTL set from wall-clock constant vs DB `expires_at` column | Two sources\
        \ of truth drift; clock skew miscomputes remaining time | Medium |\n| C6 |\
        \ Distributed lock TTL < update duration (related but distinct) | State written\
        \ by a \"stale\" node after it lost the lock | Medium |\n\nIn every case the\
        \ division is the same: **`ttl <= activity window` fails**, and **no recovery\
        \ path exists** to rebuild from the DB.\n\n---\n\n## 3. Why the current design\
        \ is wrong\n\n- **Fixed TTL does not model idle-vs-absolute.** Real sessions\
        \ have two constraints: a hard upper bound (interview deadline) *and* an idle\
        \ timeout (abandonment). A single fixed constant models neither correctly.\n\
        - **Redis hit/miss is conflated with session validity.** A Redis miss must\
        \ mean \"state not materialized\", *not* \"interview over\". Whether the interview\
        \ is over is a database fact.\n- **No single authority for liveness.** Two\
        \ stores hold overlapping truth without a defined precedence → silent drift\
        \ by construction.\n- **No observability on the resume path**, so divergence\
        \ accumulates unnoticed until a user reports a broken continuation.\n\n---\n\
        \n## 4. Architect recommended: DB is source of truth, Redis is a refreshable\
        \ cache\n\n### 4.1 Single source of truth for liveness\nPut authoritative\
        \ liveness in the DB:\n\n```\ninterview_session(\n  id,            -- PK\n\
        \  status,        -- ACTIVE | PAUSED | COMPLETED | EXPIRED | ABORTED\n  expires_at,\
        \    -- absolute hard deadline (immutable)\n  idle_until,    -- sliding idle\
        \ deadline (updated on activity)\n  state_json     -- authoritative runtime\
        \ state (the true record)\n)\n```\n\nRedis stores only the *materialized*\
        \ copy for low-latency resume. Its TTL is always derived from DB fields, never\
        \ an unscoped constant.\n\n### 4.2 Sliding + bounded TTL\nRefresh the Redis\
        \ TTL on **every** interaction, but cap it so idle still terminates:\n\n-\
        \ `ttl = min(remaining_to_absolute, idle_window)`\n- After every read/write\
        \ mutation: `EXPIRE key ttl` (idempotent, cheap).\n- A background/async step\
        \ that touches no key still must update `idle_until` in DB, or hold the cache\
        \ warm on a pulse.\n\n### 4.3 Read path: lazy rebuild (pessimistic-correct,\
        \ no data loss)\nThe critical fix — **on Redis miss, fall back to DB before\
        \ declaring failure**:\n\n```\nresume(sessionId):\n    state = redis.get(sessionId)\
        \              # TTL may have silently expired\n    if state == null:    \
        \                      # COLD — not terminal\n        row = db.find(sessionId)\n\
        \        if row == null or row.status == EXPIRED/COMPLETED/ABORTED:\n    \
        \        return 410 Gone                    # real termination, from DB\n\
        \        if row.status == ACTIVE and row.expires_at > now:\n            state\
        \ = materialize(sessionId, row)   # rebuild from authoritative store\n   \
        \         redis.setex(sessionId,\n                        computeTtl(row),\
        \          # min(expires_at-now, idle_window)\n                        state)\n\
        \        # write path: serialize mutations, extend idle_until in DB\n    return\
        \ continue(state)\n```\n\nKey implications:\n- **A Redis miss is only a rebuild\
        \ event, never a dead-end.** Continuation breaks *only* when the DB itself\
        \ says the session ended.\n- Rebuild cost (one DB read + state shape) is acceptable;\
        \ if it recurs, promote with a second-level cache — do **not** raise the TTL\
        \ to mask it.\n- Guard write-back with a short distributed lock + version\
        \ (`updated_at`/`version`) to avoid the stale-writer race (C6).\n\n### 4.4\
        \ Expiration that DB agrees on\nActually-mark expiration: when idle/absolute\
        \ is breached, flip `status = EXPIRED` and **publish an eviction** (delete\
        \ Redis key) so the cache and DB never disagree by accident. Proactive eviction\
        \ > silent decay.\n\n### 4.5 Reconciliation (belt-and-suspenders)\nA low-frequency\
        \ sweep updates Redis TTL for sessions whose DB `expires_at` is still in the\
        \ future, shrinking the divergence window even if a refresh was missed.\n\n\
        ---\n\n## 5. Option comparison\n\n```\nOption A — Sliding + bounded TTL, lazy\
        \ rebuild (recommended)\n  Strengths:  no data loss for active sessions; correct\
        \ semantics; low complexity\n  Weaknesses: one extra DB read on cold resume;\
        \ needs rebuild logic\n  Best for:   active/interactive sessions\n\nOption\
        \ B — Keep fixed TTL, just raise it\n  Strengths:  one-line fix\n  Weaknesses:\
        \ moves the cliff, doesn't remove it; still breaks long/idle sessions; masks\
        \ problem\n  Best for:   (not acceptable as a real fix)\n\nOption C — No Redis,\
        \ all from DB\n  Strengths:  single store, zero drift\n  Weaknesses: loses\
        \ latency/cost benefits; not why we added Redis\n  Best for:   very low-read-traffic\
        \ sessions\n```\n\n**Recommended: Option A.** It fixes the reported symptom\
        \ (continuation breaks) *and* removes the class of failure (silent divergence),\
        \ at the cost of a small rebuild routine.\n\n---\n\n## 6. Implementation guidance\n\
        \n### Redis config (single key per session, not many)\nUse one key (`interview:{id}`)\
        \ holding the full runtime state (JSON/HASH) so you never get partial expiry\
        \ (C4). Many-but-partial keys are the next divergence source even after the\
        \ TTL fix.\n\n### TTL computation\n```\nttl = min(row.expires_at - now, idle_window)\
        \   // SECONDS\nredis.setex(KEY, ttl, state)\n```\n\n### Observability hooks\
        \ (name them in review / metrics)\n- `resume.cache_hit` vs `resume.cache_miss_rebuild`\n\
        - `resume.rebuild_success` / `resume.rebuild_failure`\n- `cache_ttl_remaining`\
        \ and `cache_miss_reason=cold` — alert on *chronic* rebuilds (they signal\
        \ TTL budget or dataset issue)\n- Alert on `db_says_active_but_key_missing`\
        \ frequency\n\n### Failure semantics contract\n- Redis miss + DB active →\
        \ **200 continue**, rebuild.\n- Redis miss + DB terminal → **401/410**, consistent\
        \ message.\n- Write conflict (version mismatch) → retry once, else 409.\n\n\
        ---\n\n## 7. Validation\n\n- Unit: TTL computation at idle/absolute boundaries;\
        \ rebuild path; termination path.\n- Integration: simulate a session that\
        \ exceeds fixed TTL (active, idle > TTL, async step > TTL). Assert resume\
        \ *continues* when DB active; *fails* only when DB terminal.\n- Inject clock\
        \ skew in tests to prove `expires_at`-derived TTL is skew-tolerant.\n- Load\
        \ test the cold-resume path to quantify the rebuild DB read cost.\n\n---\n\
        \n## 8. Primary risks / mitigations\n\n- Rebuild storms after bulk expiry\
        \ → rate-limit/coalesce rebuilds; reconcile job avoids synchronous bursts.\n\
        - Stale-writer writes after idle-expiry → version field + lock; check `idle_until`/`status`\
        \ in write path.\n- New complexity in rebuild/materialize → keep it a thin\
        \ wrapper over authoritative `state_json`; do not re-introduce partial caches.\n\
        \n---\n\n## Summary for lead\n\n- **Root cause:** fixed absolute TTL binds\
        \ Redis lifetime to creation, not activity; Redis miss is wrongly treated\
        \ as terminal while DB remains authoritative-valid.\n- **Fix (recommended):**\
        \ make the DB the liveness authority, derive Redis TTL as `min(absolute_remaining,\
        \ idle_window)`, **extend on every interaction**, and **turn Redis miss into\
        \ a lazy rebuild** from DB — failing only when the DB itself says the session\
        \ ended. Add proactive eviction + reconciliation and resume-path observability.\n\
        - **Duration/cost:** one extra DB read per cold resume; a small rebuild routine;\
        \ no data loss, correct continuation semantics."
