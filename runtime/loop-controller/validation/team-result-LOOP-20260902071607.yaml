      output: "# 面试会话运行态 Redis 固定 TTL 静默过期分析 — 贡献给 Lead 评审\n\n## 目标\n- 业务目标: 面试会话可在中断后**续接（continuation）**，运行态不丢失、不与持久态脱节。\n\
        - 当前约束: 运行态(Runtime State)存 Redis，带固定 TTL；持久态(Session/Transcript)存 DB，长期有效。\n\
        - 成功标准: 明确\"何时/为何续接失败\"，给出可落地的状态生命周期与恢复策略，可观测、可回放。\n\n## 问题判断\n### 核心问题（一句话）\n\
        Redis key 过期是**时间驱动的数据判死**，DB 里那条会话记录却仍在——两者生命周期不一致，续接逻辑读取不到运行态 → 表现为\"会话还在但续接失败/数据错乱\"\
        。\n\n### 关键假设（需与 Lead 确认）\n1. Redis 里存的是**不可从 DB 重建的增量状态**（如当前问题指针、已命中的分支、回答草稿、计时基线、多轮上下文窗口、打分中间值）。\n\
        2. TTL 是**写入时设定的固定值**（`SET key val EX ttl` / 设置后不刷新），而非续接时刷新的滑动 TTL。\n3. 续接操作**假设运行态必然存在**（读\
        \ Redis 直接反序列化，未做 missing 分支/降级）。\n4. DB 里的 session 状态字段不记录\"运行态已过期\"的事实，也无版本/心跳信息来探测它。\n\
        \n### 主要风险\n- **静默性**: 过期不是显式失败，续接点可能读到旧快照、空态或直接 NPE，比显式报错更难排查。\n- **固定 TTL\
        \ 的“活埋”**: 长会话（面试可 >1h）在 TTL 前未续接即过期，恰逢用户回来续接时触发。\n- **Overflow 反向问题**: TTL\
        \ 过小 → 正常慢操作被误杀；TTL 过大 → 僵尸 key 占内存且恢复时读到陈旧数据。\n- **与 DB 事务并发**: 写 Redis 成功但\
        \ DB commit 延迟/失败时，Redis 里存在无主 FSM 的孤儿状态。\n\n## 何时续接会断裂（W: When）\n按触发条件归纳，请\
        \ Lead 在评审时勾选适用的几个:\n\n| 场景 | 触发条件 | 后果 | 是否可规避(现设计) |\n|---|---|---|---|\n\
        | 慢速超时 | 会话停留 > TTL 后回来点“继续” | Redis missing → 续接失败/重置 | 否 |\n| 跨节点续接 | 换浏览器/设备，忙碌期超过\
        \ TTL | 无法从 DB 重建运行态 | 否 |\n| 主动状态设定后立即读 | 写 key 后 DB 写慢提交，先读 Redis | 读到 DB\
        \ 未确认的中间态 | 部分 |\n| 长会话中途无操作 | 用户思考久，计时器在 Redis 未续期 | 剩余时间/指针丢 | 否 |\n| 恢复刚过期窗口\
        \ | 与驱逐(内存淘汰/keyspace)竞态 | 偶发 missing | 否 |\n\n## 为何断裂（W: Why — 根因）\n1. **存的是“运行时派生状态”却被当“二级持久化”**：把本可重建的\
        \ FSM/上下文放 Redis，等价于把 ephemeral 当 durable 用。\n2. **固定 TTL ≠ 业务会话生命周期**：TTL\
        \ 按墙钟计时，业务生命周期按“活跃度”计时；二者错位即出现\"DB 活着、Redis 已死\"的窗口。\n3. **缺少续期的触达点**：所有读/写续接动作都应\
        \ Refresh，若只有写时 SET，则\"只读不做任何写入\"的续接不会续命。\n4. **缺少缺失时的降级/重建协议**：读方没有\"miss\
        \ → 回源 DB → 重建运行态\"的兜底路径。\n5. **过期事件被忽略**：未订阅 `keyspace@*__:expired`，未把\"\
        运行态过期\"登记回 DB 的 `runtime_expired_at`。\n\n## 架构建议（对比后给出推荐）\n\n### 方案 A — 滑动\
        \ TTL（续接即续命）\n- 每次有效读时 `EXPIRE key ttl`（用 LUA 原子化\"存在才续期\"，防误延长孤儿 key）。\n\
        - 优势: 实现小、保住运行态存活于真实活跃期。\n- 劣势: 仍不解决\"遗失数据可重建\"；极端活跃用户 key 永不回收需兜底上限。\n\n\
        ### 方案 B — DB 为准 + 运行态可重建（推荐）\n- 把 FSM 等**必须跨重启的状态持久化到 DB**；Redis 只存**易失协∋（计时/临时缓存）**。\n\
        - 续接协议: 读 Redis → miss 时回源 DB → 重建运行态 → 回写 Redis。\n- 用 `runtime_rev` 版本号做乐观并发校验，防止重建后覆盖更新中的数据。\n\
        - 优势: 根治\"DB 有效但续接失败\"；符合\"持久态存的必须是可重建/权威\"原则。\n- 劣势: 需实现重建函数与版本校验，复杂度高于 A。\n\
        \n### 方案 C — 固定 TTL + 显式过期标记 + 事件通知\n- 订阅过期事件，把 `runtime_expired` 写回 DB；续接时读到该标记\
        \ → 走重建或清晰提示。\n- 优势: 消除\"静默\"；劣势: 事件订阅有竞态/丢失窗口，仅作为补强。\n\n### 最终推荐\n**组合: B\
        \ 为主 + A 的续期 + C 的显式标记**。分两级:\n1. 权威状态(须续接) → DB, 带 `runtime_rev`。\n2. 纯易失(计时/提示)\
        \ → Redis 滑动 TTL。\n3. Redis miss 或 DB 标记 expired → 触发重建路径，绝不静默失败。\n\n## 实施要点\n\
        \n### 关键模块（建议改动位置）\n- 会话服务: 统一 `ResumeSession(sessionId)` 入口，替代多头读 Redis。\n\
        - 状态仓库: 新增 `RuntimeSnapshot`(DB 列: `runtime_rev, runtime_ttl_until, runtime_expired_at`)。\n\
        - 缓存层: 封装 `readRuntime & miss→reconstruct & write` 的单一方法。\n\n### 服务边界 / 数据流\n\
        ```\nClient ──Resume──> SessionSvc\n   │ 读Redis(miss?)──>miss──> 回源DB(校验rev)\n\
        \   │                                    └─reconstruct runtime──>写Redis(续期)\n\
        \   │ 命中──>滑动续期(EXPIRE, LUA存在才续)\n   └─更新状态/回答──>事务: 写DB(rev+1) → 写Redis\n\
        ```\n\n### 失败处理\n- Redis miss: 不抛异常，走重建分支；无 DB 记录则视为会话真的不存在(显式 404)。\n- DB\
