    output: "## Lead Report — Redis Session State TTL: When & Why Continuation Breaks\n\
      \n**Team** `team-18087af2` · Domains: database, ai · Task: debug.\n**System\
      \ under test:** Phase-5 面试状态机 (`INTERVIEW_STATE_MACHINE`). Runtime state `SessionState(status,\
      \ questionCount, currentQuestionId)` lives in Redis (`InterviewStateStore.java:27`),\
      \ written with a **fixed 24h TTL**, reset on every write (`InterviewStateStore.java:51`).\
      \ The persisted DB (`InterviewSession` + `InterviewMessage`) is never amended\
      \ on expiry.\n\n---\n\n### 1. The failure mechanism\n\nThe killer is not \"\
      the key disappears\" — it's that **expiry is a silent, DB-invisible event in\
      \ a store the code labels the single authority**.\n\n- On every transition the\
      \ code writes **DB-then-Redis** (`InterviewService.java:114→116, 186→188, 261→263,\
      \ 344→345`).\n- The DB is durable and has **no TTL**. Redis, by configuration,\
      \ drops the row after a fixed 24h window.\n- The state machine's guard path\
      \ `requireAsking()` (`:380-399`) treats Redis as authoritative **and only consults\
      \ the DB when Redis returns `null`** (`:381-382`).\n\nA \"fixed TTL reset on\
      \ each write\" is a **sliding/gorge TTL**: the key dies after 24h **of no writes**.\
      \ So the canonical trigger is:\n\n> A `START`/`ASKING` interview that the user\
      \ **pauses and abandons for 24h+**. Redis evicts the key silently. The DB still\
      \ holds a valid, owned, `ASKING` session with the full message history. From\
      \ the DB's perspective the interview is live and resumable; from Redis the state\
      \ is gone.\n\n**Why continuation breaks (the classic / intended answer):** if\
      \ Redis is the *only* authority and there is **no fallback**, the next `answer()`\
      \ `read()`s `null` and either throws a state error (\"会话已过期 / 状态不允许\") or, worse,\
      \ treats the session as new. The user's in-progress interview — still fully\
      \ recoverable from the DB — is frozen/invalidated. The DB was \"valid\" all\
      \ along; only the runtime layer silently forgot it. Detail pages (`detail`,\
      \ `listByUser`, `result`) read DB-only and keep working, which makes the failure\
      \ feel even more random: **the session looks fine until you try to continue\
      \ it.**\n\n---\n\n### 2. Codebase-specific nuance (important)\n\nOur support\
      \ code-review confirmed: in **this** codebase the pure-expiry case is **mostly\
      \ masked** because `requireAsking()` falls back to the DB and reconstructs field-equivalent\
      \ state (`:383-389`). The DB fallback is correct **only when Redis is `null`.**\n\
      \nThe real leak here is a *different, worse* divergence — **stale-but-present\
      \ Redis overriding newer DB**:\n\n- Writes are DB→Redis, sequenced. If `stateStore.write()`\
      \ throws after the DB advanced (`InterviewStateStore.java:54`, **no retry /\
      \ compensation / `@Transactional`**), Redis holds an **old** `questionCount`/`currentQuestionId`.\
      \ Because Redis is non-null, the fallback at `:382` does **not** trigger.\n\
      - Next `answer()` computes `newCount = staleCount + 1` from stale Redis → duplicated\
      \ question counts / wrong `currentQuestionId` (`:179,254`).\n- `finishSession()`\
      \ (`:340-359`): a Redis write failure (**after** the DB marked FINISHED) aborts\
      \ before RabbitMQ scoring and dashboard eviction → a logically-finished session\
      \ that never gets scored if the code path swallowed the error (SSE variant swallows,\
      \ `answer()` throws).\n\nSo: expiry alone is recoverable here, but it's **fragile**\
      \ — it relies on Redis being exactly `null`. Any non-null stale/evicted/parse-failed\
      \ state (`read()` returns `null` on JSON corruption too, `:42-45`) escapes the\
      \ fallback and silently corrupts continuation.\n\n---\n\n### 3. Trigger conditions\
      \ / when it bites\n\n1. **Idle-then-resume** (>24h pause in an active session)\
      \ — the designed TTL scenario; breaks if no fallback exists.\n2. **Redis restart\
      \ / `FLUSHALL` / maxmemory eviction** — `docker-compose.yml` uses `redis:7-alpine`\
      \ with **no `maxmemory-policy`** (default `noeviction`), no keyspace notifications.\
      \ Any deployed policy such as `allkeys-lru`/`volatile-ttl` silently drops these\
      \ keys → same \"null\" miss, DB unaffected.\n3. **Write-failure divergence**\
      \ (above) — Redis present-but-stale; unhandled by the `null`-only fallback.\
      \ Highest risk in this codebase.\n4. **Keyspace-notification absence** — nothing\
      \ in the app subscribes to `EXPIRE` events, so expiry is invisible and uncorrected\
      \ at runtime.\n\n---\n\n### 4. Recommended fix (decision)\n\n**Option A — DB\
      \ = single truth; Redis = pure hot cache, rebuild-on-miss (recommended)**\n\
      - Fixes a) TTL, b) restart/eviction, c) atomicity gap, d) correctness. `InterviewStateStore`\
      \ comment \"单一权威来源\" is architecturally wrong for this data shape and should\
      \ be corrected.\n- Trade-offs: +1 DB read per transition (negligible at interview\
      \ QPS); requires removing any Redis-authority logic.\n\n**Option B — Absolute\
      \ (non-sliding) TTL ≈ session lifetime**\n- Predictable expiry; trade-off: silently\
      \ abandons legitimately-long sessions.\n\n**Option C — No TTL + DB `updated_at`\
      \ sweep for cleanup**\n- Removes Redis-side expiry entirely, kills the problem\
      \ at the root; trade-off: must run/trust a background sweep.\n\n**Recommended\
      \ decision:** **A**, plus a bounded absolute TTL purely to cap Redis memory,\
      \ plus:\n- **Harden the fallback to trigger on stale, not just null** — e.g.\
      \ rehydrate from DB whenever Redis state is empty OR older than the DB (compare\
      \ `updated_at`, not just presence).\n- **Add atomicity**: wrap the DB+Redis\
      \ transition in `@Transactional` (or an outbox) so a failed Redis write can't\
      \ strand `FINISHED`/scoring.\n- **Keep the FINISHED guard as a hard invariant**;\
      \ move it to the service layer (not just `requireAsking`) so the forward path\
      \ and the SSE path share the same protection.\n\n#### Illustrative hardening\
      \ (pattern, not a drop-in patch)\n```java\n// InterviewStateStore / requireAsking\n\
      // Trigger rehydrate on stale, not just null\nString json = bucket.get();\n\
      if (json == null) {\n    return rebuildFromDb(sessionId);          // existing\
      \ fallback\n}\nSessionState cached = parse(json);\nInterviewSession row = sessionMapper.selectById(sessionId);\n\
      if (row != null && cached.questionCount() < row.getQuestionCount()) {\n    return\
      \ rebuildFromDb(sessionId);          // stale Redis must not win\n}\nreturn\
      \ cached;\n```\n```yaml\n# config — bounded cap instead of unbounded allkeys\n\
      maxmemory-policy: volatile-ttl\nnotify-keyspace-events: Ex      # subscribe\
      \ to detect/mitigate expiry\n```\n\n---\n\n### 5. Validation plan\n- Unit-test\
      \ `requireAsking` for: Redis null + DB ASKING (recovers), Redis stale `count\
      \ < DB count` (recovers — new assertion), Redis stale `== DB` (no rehydrate),\
      \ DB FINISHED (throws).\n- Fault-inject `stateStore.write` failure → assert\
      \ no duplicated question increments, and that `finishSession` still delivers\
      \ scoring/evict.\n- Ops test: run a real session 1min, `FLUSHALL`, resume —\
      \ must continue seamlessly.\n\n**Support inputs incorporated:** code-review\
      \ (write-divergence leak, fallback-vs-null gap, SSE/async paths) and architecture/security\
      \ (eviction-policy risk, FINISHED-guard invariant, trade-off table). No user-data\
      \ exposure risk — ownership is enforced via DB (`requireOwnedSession`), so expiry\
      \ is a **continuity** bug, not a security/privacy bug."
