      output: "# Database Engineer — Design Review\n\n## MEMO: Interview Session Continuation\
        \ vs Redis Fixed-TTL Expiry\n\n### 1. The architectural pattern in question\n\
        \nA typical interview-session stack splits state across two stores with different\
        \ lifetime semantics:\n\n| Layer | Store | What it holds | Lifetime model\
        \ |\n|-------|-------|---------------|----------------|\n| Runtime/hot state\
        \ | Redis | current question index, live LLM conversation context, accumulated\
        \ partial answers, timer, ephemeral flags | TTL-capped (ephemeral) |\n| Durable/authoritative\
        \ | Primary DB | session row (`status=in_progress`), user, interview config,\
        \ final/committed answers | Persistent (valid until explicitly closed) |\n\
        \nThe contract is: **DB says \"this session is still open\", Redis says \"\
        this session is live right now\".** Continuation works only while both agree.\
        \ The bug is that they can silently diverge.\n\n---\n\n### 2. The failure\
        \ mode\n\nA fixed TTL is applied to the Redis key (commonly at session creation,\
        \ or on each write with `EXPIRE` resetting to the same constant). When the\
        \ TTL elapses, Redis **auto-deletes the key** — no error, no event, no DB\
        \ write. The DB row is untouched and still `in_progress`.\n\nNothing tells\
        \ the application the cache died. So the next resume attempt (page refresh,\
        \ retry, client reconnect, re-hydration mid-interview) hits a **cache miss**\
        \ for a session the DB still considers valid.\n\n```\nrequest: resume session\
        \ S\n  1. Redis GETSESS S            → (nil)  ← silently expired\n  2. DB\
        \ SELECT session S        → status=in_progress  (+1 valid)\n  3. runtime state\
        \ unavailable → KeyNotFound\n```\nResult: throw/500, dropped conversation\
        \ context, or a fresh-empty session wrapper — i.e. **continuation breaks**\
        \ even though the durable record is fine.\n\n---\n\n### 3. When it breaks\
        \ (specific trigger conditions)\n\n- **Fixed TTL < actual session length.**\
        \ A fixed TTL is set at creation (say 20 min) but the interview genuinely\
        \ runs longer — user thinks for extended periods, multi-stage interview, slow\
        \ human typing. It expires mid-session.\n- **No sliding renewal.** If the\
        \ TTL is only set once (not refreshed on each activity), a *still-active*\
        \ user can expire simply because no write happened in the last window (e.g.\
        \ the candidate paused while composing a long answer).\n- **Session `in_progress`\
        \ but client idle > TTL.** The DB keeps the session open by policy, but the\
        \ runtime copy already vanished during the idle window.\n- **Time-triggered\
        \ eviction / worker cleanup.** Redis `maxmemory`/`volatile-lru` eviction or\
        \ a sweeper can remove hot keys under memory pressure — again silent.\n- **Clock/context\
        \ mismatch between fix and reality** — a \"renew on write\" that only renews\
        \ when answers are committed, but conversation context lives in the same key\
        \ and the user only reads between steps.\n\nSo it is *specifically* the combination\
        \ of **fixed absolute TTL** and **no reliable cache-miss recovery path** that\
        \ turns a normal cache discipline gap into a hard continuation failure.\n\n\
        ---\n\n### 4. Why continuation breaks (root-cause reasoning)\n\n1. **Elasticity\
        \ ≠ durability.** The DB row is authoritative about *session state*, but the\
        \ *in-flight conversation* is not stored there. Losing Redis loses the conversational\
        \ runtime — and it is not reconstructible from a `status` column.\n2. **Silent\
        \ eviction is indistinguishable from \"does not exist\".** No signal travels\
        \ to the application → developers code for a key that \"always exists\" →\
        \ every read assumes present (no `if missing` branch).\n3. **A two-source-of-truth\
        \ belief.** The application implicitly trusts Redis for *continuity* and the\
        \ DB only for *existence*; when the two disagree, there is no reconciliation\
        \ because the code never modeled divergence.\n4. **Errors surface at consume\
        \ time, not expire time.** The expiry happens in the background; the exception\
        \ surfaces on the next user action — the hardest moment to recover gracefully.\n\
        \n---\n\n### 5. Recommendations\n\n#### A. Prefer a **sliding** TTL (renew\
        \ on activity) over a fixed TTL\n```python\n# on every meaningful interaction\
        \ (answer, step advance, heartbeat)\nREDIS.setex(sess_key, serialized_state,\
        \ ttl=REFRESH_SECONDS)  # resets expiry\n```\nWith sliding expiry the still-active\
        \ interviewer never expires. Make `REFRESH_SECONDS` comfortably larger than\
        \ the longest inter-action gap (e.g. 30–60 min), and still run a session-level\
        \ max to force eventual cleanup of truly abandoned sessions.\n\n#### B. Make\
        \ Redis strictly a cache, not a source of truth — rehydrate on miss\n```python\n\
        def load_session(session_id):\n    data = REDIS.get(session_id)\n    if data\
        \ is not None:\n        return deserialize(data)\n    # --- cache miss: reconstruct\
        \ from DB, then warm the cache ---\n    db = DB.get_session(session_id)\n\
        \    if not db or db.status == \"closed\":\n        raise SessionClosed(...)\n\
        \    runtime = rebuild_runtime_from_db(db, replay_log(db, session_id))  #\
        \ see C\n    REDIS.setex(session_id, serialize(runtime), REFRESH_SECONDS)\n\
        \    return runtime\n```\nThe key property: **continuation must not depend\
        \ on Redis having the key.** A miss becomes a *recovery path*, not a crash.\n\
        \n#### C. Persist a commit log / state snapshot so state is rebuildable\n\
        If the DB only holds `status`, it cannot rebuild the in-flight LLM conversation.\
        \ Either:\n- Persist **idempotent ordered snapshots** of the interview (every\
        \ step → `session_step` table row), and replay on miss to rebuild live context;\
        \ and/or\n- Persist the serialized runtime once (≥ every step) to the DB so\
        \ a miss is a single-row read, not a replay.\n\n#### D. Guard the \"open\"\
        \ contract with explicit reconciliation\n```python\n# validation step on resume\n\
        if redis_missing(session_id) and DB_status_in_progress(session_id):\n    metrics.incr(\"\
        session.cache_expiry_recovery\")\n    log.warn(\"runtime state expired beneath\
        \ open session\")  # observability\n```\nThis converts a silent event into\
        \ an alertable signal.\n\n#### E. End-to-end hygiene\n- **Fixed max absolute\
        \ TTL** for abandoned-session garbage collection (upper bound), refreshed\
        \ on activity — combine sliding refresh with a hard stale cap.\n- **Memory/eviction\
        \ policy**: set `maxmemory-policy noeviction` for session keyspace (or an\
        \ LRU that only touches non-session keys), so `volatile-*` doesn't evict live\
        \ sessions.\n- **Monitoring/alerting**: TTL distribution, cache-miss rate,\
        \ session duration percentiles, and \"open-in-DB but missing-in-Redis\" counter.\n\
        - **Idempotent resume endpoint**: refreshes must tolerate repeat/subsequent\
        \ calls without double-advancing.\n\n---\n\n### 6. Summary\n\nContinuation\
        \ breaks **when an open session's runtime key in Redis expires under a fixed\
        \ TTL (or idle window) while the durable DB row remains valid, and the code\
        \ lacks a cache-miss recovery path.** The DB \"opened\" signal and the runtime\
        \ \"live\" signal are inconsistent, silently. Fix the semantics (sliding TTL),\
        \ and — more fundamentally — stop treating Redis as a source of truth for\
        \ continuation by making misses reconstruct from the DB (persist snapshots/commit\
        \ log) and logging every recovery so expiry is observable.\n\n- Design-prepared\
        \ for **Code Reviewer / Security Engineer** follow-ups: Yours to own next\
        \ are (a) hardening the rebuild path against replay/latency and (b) validating\
        \ eviction policy under memory pressure."
