      output: "Analysis complete. I've traced the full state lifecycle in `InterviewService`\
        \ / `InterviewStateStore` / `RuleBasedScoringService`. Here is my report for\
        \ lead review.\n\n---\n\n# 面试会话 Redis 固定 TTL 静默过期 → 会话续接失效分析\n\n## 1. 目标 /\
        \ 现状基线\n\n- 业务目标：面试会话`answer`/`answerStream`（`InterviewService.java:125/197`）能跨请求正确续接，且不因\
        \ Redis 旧化/过期而中断。\n- 当前多源状态结构（两个“真相”副本，非原子同步）：\n  - **DB 权威态** `interview_session(status,\
        \ question_count, current_question_id)`，持久、永不过期。所有路径都是**先写 DB，后写 Redis**（`InterviewService.java:114→116`、`183→188`、`258→263`、`342→345`）。\n\
        \  - **Redis 运行时态** `interview:session:{sessionId}`，`InterviewStateStore.write()`\
        \ 用 Redisson `bucket.set(json, 24, HOURS)` 写入（`InterviewStateStore.java:51`），**每次写都固定重置为\
        \ 24h TTL**。\n- 续接收敛逻辑只有一个兜底：`requireAsking()`（`InterviewService.java:380-399`）——**仅在\
        \ Redis `read()` 返回 `null` 时**才回源 DB 重建并回写。\n- 异步评分消费端 `RuleBasedScoringService.score()`（`RuleBasedScoringService.java:38-73`）**只改\
        \ DB**（totalScore/report），不碰 Redis state。\n\n## 2. 问题判断\n\n### 关键结论\nRedis\
        \ 是“状态机的单一权威来源”（`InterviewStateStore.java:15` 注释），但它是一个**可被任意在任意时刻静默驱逐的易失层**；生命周期与\
        \ DB 控制会话真正生命周期**完全解耦**。续接是否“断裂”，取决于过期/失效发生时**兜底回源是否会被触发**，以及 Redis 里的副本**是「缺失(null)」还是「存在但旧化」**——这两种情况处理方式完全不同，后者才是真正的漏网之鱼。\n\
        \n### 已知限制 / 设计缺陷\n1. **读不续期**：Redis TTL 只在 `write` 时刷新，`detail`/`listByUser`/dashboard\
        \ 等纯读接口不刷新 TTL，也不会触碰 Redis state。\n2. **兜底单向且只认 null**：`requireAsking` 只在\
        \ `state == null` 时回源 DB；对“存在但旧化”的 Redis 副本**不做一致性校验**。\n3. **DB→Redis 更新非原子**：每个\
        \ write 步骤都存在“DB 已提交、Redis 未写入”的崩溃/异常窗口。\n4. **固定 TTL 等同于“24h 无写入即失效”**，与\
        \ Redis 自主驱逐（maxmemory 策略）叠加，失效时间其实不可预期。\n\n## 3. 何时、为何续接断裂（WHEN & WHY）\n\n\
        ### 场景 A：闲置 >24h + 纯读取空转（TTL 静默过期）\n- 触发：用户打开面试页长时间停留（拉 `detail` 看题、等下一题思考超过\
        \ 24h），期间只有读取。Redis key 的 24h 不被读取刷新，随后过期被 `bucket.get()` 返回 `null`。\n- 结果：**该路径可以被\
        \ `requireAsking` 兜底救回**（回源 DB 重建）。这是“设计上已被掩盖”的情形，但掩盖本身有代价（见风险 1）。\n\n###\
        \ 场景 B：Redis 副本「存在但旧化」—— 真正的静默断裂点（最大风险）\n- 触发：在 `answer`/`answerStream`/`create`\
        \ 内，**DB `updateById`（114/183/258/342）已执行、但后续 `stateStore.write()`（116/188/263/345）因\
        \ Redis 集群抖动、网络闪断、OOM 驱逐或进程崩溃而失败/丢失**。DB 是**新态**，Redis 里留着**旧态**（`questionCount=2`\
        \ 而非 `5`，或 `status=FINISHED` 旧值）。\n- 断裂后果（**DB 有效却无法续接**）：\n  - `requireAsking`\
        \ 读到非 null 旧态 → **不会回源 DB** → 继续用旧 `questionCount`，`newCount = oldState.questionCount()+1`（`InterviewService.java:179`）让计数倒退；\n\
        \  - 若旧态是 `FINISHED` → 抛 `INTERVIEW_FINISHED`，**直接阻断合法续接**，即使 DB 仍是 `ASKING`；\n\
        \  - 若旧态 `currentQuestionId` 指向上个问题，前端“当前题”错位。\n- 为什么兜底救不了：**兜底触发条件是 `null`，不是“过旧”**。TTL\
        \ 未到期时 key 一直存在，旧态会长期生效直至被下一次写覆盖。\n\n### 场景 C：Redis 自主驱逐 / 内存压力提前淘汰\n- 触发：Redis\
        \ `maxmemory` 且 `allkeys-lru` 等策略下，key 可在 TTL 到期**之前**被 LRU 淘汰；或节点 failover\
        \ / 手动 `FLUSHDB`。DB 完全无感知。\n- 断裂结果：同场景 A 表现（`null`→可兜底），但**淘汰是批量且瞬时的**，若恰好发生在多会话并发的高峰，多个会话同时进入重放窗口，放大“DB/Redis\
        \ 双写窗口”的竞态。\n\n### 场景 D：多日/跨周面试（生命周期 > 单次 TTL）\n- 触发：长 N 天面试中两次作答间隔 >24h，但中间无人拉全量写；每次\
        \ `write` 重置 TTL 掩盖了这一点，用户在“等待续接”的心态下过期。\n- 断裂结果：同 A，靠兜底续接；但兜底只恢复粗粒度 `SessionState`，任何未来**只存放在\
        \ Redis 的会话内瞬态上下文**（如尚未落库的候选提示、临时打分阶段标记）将丢失——当前 code 恰好只有 SessionState，故未被暴露，属“被实现细节掩盖的隐患”。\n\
        \n## 4. 方案对比\n\n**方案 A：维持现状 + 兜底**\n- 强度：改动最小；纯过期由 `requireAsking` 自愈。\n-\
        \ 弱点：只对 `null` 生效；场景 B（旧态）完全漏网；每次请求都要读 Redis 仍可能读到次期数据。\n- 适用：接受“过期即重放 DB、但旧态不可检测”的短期。\n\
        \n**方案 B：滑动续期（read/每交互 refresh TTL）+ 淘汰策略约束**\n- 将“固定 TTL”改为“**无操作超时**”：读/写都在\
        \ pipeline 里 `GET + EXPIRE(sessionId, 24h)`，或存 `lastActiveAt` 由后台 reaper 处理。\n\
        - 配合 `maxmemory-policy volatile-lru` 并保证所有 key 都带 TTL，避免 `allkeys` 提前淘汰。\n\
        - 弱点：仍需把 DB 当真相，否则只是延长又旧化的时间窗。\n\n**方案 C：DB 为唯一真相，Redis 降级为缓存/锁 + 校验后再续接（推荐）**\n\
        - 每次 `answer` 进来，用**乐观版本号/字段比对**校验 Redis 副本与 DB 是否一致（而非只判 null）；不一致 → 以 DB\
        \ 重建覆盖 Redis。\n- 或更彻底：去除“Redis 是权威源”的定位，`SessionState` 每次从 DB 实时构造，Redis 仅用于分布式锁与热缓存；消除双源非原子同步这一整类问题。\n\
        - 弱点：需要少量重构落库/读写路径。\n\n## 5. 实施方案（最小改动，先堵场景 B）\n\n修改点 `InterviewService.requireAsking()`（`InterviewService.java:380-399`）：**把“仅\
        \ null 回源”改为“null 或与 DB 不一致都回源”，并做一致性校验**。\n\n```java\nprivate InterviewStateStore.SessionState\
        \ requireAsking(Long sessionId) {\n    InterviewSession s = sessionMapper.selectById(sessionId);\
        \   // DB 永远可查，作为真相对照\n    if (s == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
        \n    InterviewStateStore.SessionState cache = stateStore.read(sessionId);\n\
        \    // 直接用 DB 现状兜底/校正 Redis（DB 在全部路径中先于 Redis 更新，故 DB 为更新方）\n    InterviewStateStore.SessionState\
        \ authoritative = new InterviewStateStore.SessionState(\n            s.getStatus(),\
        \ s.getQuestionCount(), s.getCurrentQuestionId());\n\n    if (cache == null\
        \ || !cache.equals(authoritative)) {\n        // Redis 缺失或旧化：以 DB 为准重建，覆盖旧副本\n\
        \        stateStore.write(sessionId, authoritative);\n    }\n\n    if (InterviewStatus.FINISHED.name().equals(authoritative.status()))\n\
        \        throw new BizException(ResultCode.INTERVIEW_FINISHED);\n    if (!InterviewStatus.ASKING.name().equals(authoritative.status())\n\
        \            && !InterviewStatus.START.name().equals(authoritative.status()))\n\
        \        throw new BizException(ResultCode.INTERVIEW_STATE_ERROR, \"当前状态不允许提交答案\"\
        );\n    return authoritative;\n}\n```\n\n配套（可选）：\n- `InterviewStateStore`\
        \ 增加可见性：记录 `lastWriteAt`/`writtenAts`，便于监控“DB 已更新但 Redis 未落”的窗口（告警）。\n- 配置\
        \ `maxmemory-policy volatile-lru`（见 docker-compose/redis 配置），仅淘汰带 TTL 的 key，保留后续兜底随机性。\n\
        - 后台 `@Scheduled` 任务周期回源 DB → 重写 Redis，防长期闲置的 key 在指数级饥饿下退化。\n\n风险点与处理：一致性校验会引入每次\
        \ `answer` 多一次 DB 查询（`selectById` 已有，成本极低）；需保证 `answerStream` 虚拟线程内同样走该校验（`InterviewService.java:204`）。\n\
        \n## 6. 验证方式\n- 单测/手动用例：构造“Redis 旧态 + DB 新态”，调用 `answer` 应恢复至 DB 计数且不抛 `INTERVIEW_FINISHED`。\n\
