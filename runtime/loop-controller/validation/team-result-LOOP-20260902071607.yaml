      summary: '# Redis TTL Expiry vs. Persistent DB State — Analysis


        ## Problem Statement


        Interview session **runtime state** (progress, answers, current question index,
        timers, per-step votes) lives in Redis with'
      output: "# Redis TTL Expiry vs. Persistent DB State — Analysis\n\n## Problem\
        \ Statement\n\nInterview session **runtime state** (progress, answers, current\
        \ question index, timers, per-step votes) lives in Redis with a fixed TTL.\
        \ Meanwhile, the **authoritative DB** (submitted steps, final answers, results)\
        \ does not expire. When Redis evicts the runtime state, **continuation breaks**\
        \ even though the DB looks perfectly valid to the user's next request.\n\n\
        ## Root Cause — Two Views of One Session\n\nYou have two stores with **fundamentally\
        \ different lifecycles**:\n\n| Concern | Store | Lifecycle | What it holds\
        \ |\n|---|---|---|---|\n| **Entity/domain data** | DB (persistent) | Durable\
        \ until explicitly deleted | Interview definition, submitted answers, grade\
        \ results |\n| **Ephemeral runtime** | Redis (TTL) | Volatile, auto-evicted\
        \ | `current_index`, `elapsed_time`, `visited_steps`, `lock`, `draft` |\n\n\
        The user perceives one session. The system models it as two views. When the\
        \ TTL expires, **the runtime view silently vanishes** while the durable view\
        \ remains.\n\n## When Continuation Breaks (Trigger Scenarios)\n\n1. **Idle\
        \ gap exceeds TTL** — user opens the interview, reads a long question, or\
        \ steps away. No write to Redis for >TTL → key evicted on `EXPIRE`-less idle\
        \ (if using `EXPIRE`/`SETEX` with an absolute TTL, expiry starts at last *write*).\n\
        2. **TTL started at session *creation*** (not refreshed on each access). A\
        \ single stale absolute TTL kills the session at a fixed wall-clock time regardless\
        \ of activity.\n3. **Key-per-fragment TTL drift** — you set TTL on `session:`\
        \ but not on `session:step:answers`, so a partial set expires while the parent\
        \ remains, or vice-versa — **partial/ghost state**.\n4. **Cluster eviction\
        \ on memory pressure** (`allkeys-lru`) — evicts *any* key even if its TTL\
        \ hasn't hit, unrelated to time.\n5. **Restart / failover** — Redis loses\
        \ everything; DB survives.\n\n## Why It Breaks — The Failure Path\n\n```\n\
        User resumes interview ──▶ GET session:{id}\n        ──▶ Redis MISS (TTL expired)\
        \ ──▶ returns null\n        ──▶ code assumes session is reset/invalid\n  \
        \      ──▶ redirects to start OR overwrites\n```\n\nTwo downstream failure\
        \ classes:\n\n- **Lost progress (silent data loss):** the user's in-flight\
        \ draft/answers in Redis are gone; DB only holds what was already committed.\
        \ Continuation shows a partially-filled session.\n- **State inconsistency:**\
        \ DB says interview \"in progress / has partial results\" while Redis has\
        \ no runtime handle → UI can't render the same session → errors or a forced\
        \ reset that then **contradicts the DB**.\n\n## Fixes (in order of durability)\n\
        \n### 1. Refresh TTL on every access (sliding window)\n```python\ndef touch_session(r:\
        \ redis.Redis, sid: str, ttl: int = 3600):\n    r.expire(f\"session:{sid}\"\
        , ttl)   # slide TTL forward on each read/interaction\n```\n**Key distinction:**\
        \ sliding TTL only resets on *activity*, so an idle 1h gap still expires.\
        \ If the concern is long read-time, extend TTL or use a heartbeat.\n\n###\
        \ 2. Source of truth = DB, Redis = pure cache / rebuildable\nTreat Redis state\
        \ as **reconstructable from the DB**. On Redis MISS, rehydrate:\n```python\n\
        def get_runtime(sid):\n    key = f\"session:{sid}\"\n    data = r.get(key)\n\
        \    if data is None:\n        data = rebuild_from_db(sid)   # load progress\
        \ from the authoritative store\n        r.setex(key, TTL, json.dumps(data))\n\
        \    return data\n```\n`rebuild_from_db` recomputes `current_index`, elapsed\
        \ time, visited steps from committed rows. Continuation then never depends\
        \ on Redis being alive — it's an acceleration layer, not a dependency.\n\n\
        ### 3. Reconcile on write (don't hold the only copy in Redis)\nCommit critical\
        \ progression to the DB **immediately**, not on session end:\n```python\n\
        def advance_step(sid, answer):\n    # persist authoritative fact first\n \
        \   db.insert(\"step_attempt\", sid=sid, step=step, answer=answer)\n    #\
        \ then update cache\n    r.hset(f\"session:{sid}\", \"current_index\", step\
        \ + 1)\n    r.expire(f\"session:{sid}\", TTL)\n```\nSo even if Redis dies,\
        \ \"where the user left off\" is in the DB.\n\n### 4. Bind/orphan timestamps\n\
        Handle the **dual-state** case explicitly: if Redis expires but DB says session\
        \ is complete/results submitted, return the completed result rather than a\
        \ half-initialized resume.\n\n### 5. Cluster eviction protection\nIf using\
        \ Redis Cluster and storage pressure is a real risk, keep TTL but also set\
        \ Redis `maxmemory-policy maxmemory-policy noeviction` **or** use a dedicated\
        \ Redis instance / separate DB number for session state so LRU on other keys\
        \ can't evict it.\n\n## Configuration Recommendations\n\n- **Graduated TTL**\
        \ — short TTL (minutes) + sliding refresh; cap at a hard maximum so abandoned\
        \ sessions still reclaim memory but active users never lose state.\n- **`volatile-lru`/`volatile-ttl`**\
        \ eviction policy (only evict keys *with* a TTL) — never evict a key that\
        \ was meant to persist.\n- **Monitor** `info keyspace` + `evicted_keys` +\
        \ hit-rate alerts so silent expiry is visible.\n\n## Summary\n\nContinuation\
        \ breaks because the session is modeled as **one logical entity across two\
        \ stores with mismatched lifecycles** — Redis treats it as transient, the\
        \ DB as durable. The robust design: **DB is the source of truth**, Redis TTL\
        \ state is a *rebuildable cache*, slides its TTL on activity, and commits\
        \ checkpoints to the DB so that an eviction degrades to \"slightly slower\
        \ resume,\" never \"lost session.\""
