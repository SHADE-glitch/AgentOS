      output: "## Diagnosis\n\n`InterviewStateStore` applies a **fixed (absolute)\
        \ 24h TTL on every write** (`InterviewStateStore.java:51` → `bucket.set(json,\
        \ TTL_HOURS, HOURS)`). Redis keeps the DB-backed session valid forever; Redis\
        \ drops the runtime state purely on a wall-clock timer. Continuation only\
        \ *appears* to survive because `requireAsking()` (`InterviewService.java:380-399`)\
        \ silently self-heals from the DB on a read miss — but that self-heal is partial\
        \ and unlogged, so the expiry is invisible and can corrupt continuation in\
        \ specific states.\n\n### Evidence mapping\n| Concern | Location |\n|---|---|\n\
        | Absolute TTL re-armed on every write | `InterviewStateStore.write` L48-56\
        \ (`set` = SET with absolute EX, **not sliding**) |\n| Redis claimed as \"\
        唯一权威来源\" (sole authority) | `InterviewStateStore` class javadoc L15 |\n| Self-heal\
        \ fallback DB→Redis on miss | `requireAsking` L380-399 (reads DB, rewrites\
        \ Redis, logs nothing) |\n| Runtime-only statuses that Redis may carry but\
        \ DB never will | `InterviewStatus` — `WAITING_ANSWER`, `EVALUATING`, `FOLLOW_UP`\
        \ all marked 预留 (reserved) |\n| Redis default no-eviction | `docker-compose.yml`\
        \ redis:7, default `maxmemory-policy noeviction` |\n\n## When continuation\
        \ breaks\n\n**Case A — resumed live interview, mostly OK but not guaranteed.**\
        \ User starts, status=ASKING, Redis TTL = now+24h. User returns >24h later\
        \ → key expired → `requireAsking` reconstructs from the `interview_session`\
        \ row it *can* recover: `status`, `questionCount`, `currentQuestionId`, and\
        \ reconstructs the asked-set from the message log (`askedQuestionIds`, L141-144).\
        \ This recovers *everything the DB row currently happens to back*, so today\
        \ it usually resumes correctly — **this is why the bug is \"silent.\"**\n\n\
        **Case B — genuine continuation break (the real risk).** The moment any **transient\
        \ runtime state exists only in Redis** — precisely the three reserved statuses\
        \ `WAITING_ANSWER` / `EVALUATING` / `FOLLOW_UP` — the DB row still holds the\
        \ *last durable* status (`ASKING`). A 24h gap between requests (user idle,\
        \ or an async evaluation/agent step >24h) with no write re-arming the TTL\
        \ expires the true machine node. Self-heal then reconstructs from the stale\
        \ DB status and **resumes at the wrong node** → a question is re-asked, an\
        \ answer lands twice, or scoring is re-triggered. The DB is \"valid\" but\
        \ is a *coarser*, different truth than the Redis state it replaced.\n\n**Case\
        \ C — the sub-24h silent window hiding corruption.** Because `write()` always\
        \ re-arms a full 24h, expiry is never observed in fast happy-path interviews.\
        \ It is triggered precisely by **wall-clock idleness anywhere in the state\
        \ machine > 24h** (abandoned mid-ASKING session, a paused SSE round, a long-running\
        \ async scoring step that doesn't touch the state bucket). And it leaves a\
        \ permanent DB row in `ASKING` — no DB-side expiry/closure — so an abandoned\
        \ session can be re-entered indefinitely, defeating any intended liveness/closure\
        \ semantics.\n\n**Case D — operational eviction (latent).** TTL is the only\
        \ controller today, but if an operator later sets `maxmemory` with a volatile/global\
        \ LRU policy, the state buckets can be evicted *earlier* than 24h under pressure\
        \ — same silent-expiry class, now with no deterministic schedule.\n\n## Why\
        \ it breaks (root cause)\n\n1. **Design contradiction**: the javadoc declares\
        \ Redis authoritative (\"单一权威来源\"), but `requireAsking` makes the *DB* authoritative\
        \ on every miss. Both cannot be authoritative, and the chosen mechanism —\
        \ fixed-TTL cache plus DB fallback — forces the system onto whichever is *stale*,\
        \ not whichever is *right*. When Redis holds runtime facts the DB never persisted,\
        \ Redis is the only correct source, and its fixed TTL destroys it.\n2. **Fixed\
        \ (not sliding) TTL**: liveness is measured on a calendar, not on activity.\
        \ An interactive session is a *recency*-based context; a fixed TTL is the\
        \ wrong expiry model.\n3. **No recovery audit**: `requireAsking` fires, reconstructs,\
        \ rewrites, and returns — with **zero logging and no distinguishing \"recovered-from-expiry\"\
        \ signal**. In production no one can tell when expiry happened or what was\
        \ lost, which is precisely the \"silent\" failure.\n\n## Security implications\
        \ (assigned lens)\n\n- **Silent state-reset = replay/desync vector**: after\
        \ expiry, self-heal re-materializes the machine from DB. Any runtime nonce/anti-duplication/generation\
        \ marker only held in the Redis bucket is lost, so a client can re-drive a\
        \ request that the machine already consumed — re-answering, double-scoring,\
        \ or re-dispatching the RabbitMQ scoring task (`finishSession` L352-358).\n\
        - **No bound on session liveness**: abandoned `ASKING` rows persist in DB\
        \ forever (no cleanup/expiry). Combined with self-heal, a session continues\
        \ past any intended window; an owner who knows the sessionId can resume from\
        \ a long-dead transcript.\n- **Silent recovery defeats integrity monitoring**:\
        \ since recovery is unlogged, response-injection/replay from a \"restored\"\
        \ state is indistinguishable from a normal continuation (L380-399, no audit\
        \ trail).\n\n## Recommendations (code)\n\n**1. Convert fixed TTL to activity-based\
        \ (sliding) — minimal fix.** Refresh TTL on each read that legitimately marks\
        \ \"in use,\" so idle time, not wall-clock, drives expiry:\n\n```java\npublic\
        \ SessionState read(Long sessionId) {\n    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \    String json = bucket.getAndExpire(Duration.ofHours(TTL_HOURS)); // Redisson:\
        \ RSETEX-like, sliding\n    return json == null ? null : parse(json);\n}\n\
        ```\nKeep `write` at the same 24h, but now any active interaction keeps the\
        \ node alive; only genuinely abandoned sessions expire.\n\n**2. Log and label\
        \ every recovery** so expiry stops being silent:\n\n```java\n// requireAsking()\n\
        SessionState state = stateStore.read(sessionId);\nif (state == null) {\n \
        \   // distinguish \"expired/evicted\" from \"never written\" -> surface instead\
        \ of swallowing\n    log.warn(\"session state MISS, recovering from DB: sessionId={}\"\
        , sessionId);\n    Metric.counter(\"interview.state.redis_miss\").inc(); \
        \      // or micrometer counter\n    // existing reconstruction...\n}\n```\n\
        \n**3. Persist any runtime-only fact to the DB before it can be lost.** Never\
        \ let a machine node live solely in a TTL'd bucket. Either persist transient\
        \ status into the session row, or carry it in the message log; a bounded async\
        \ task should re-arm TTL on a cadence less than its own runtime.\n\n**4. Enforce\
        \ DB-side liveness** so abandoned sessions can't live forever and re-open\
        \ indefinitely:\n\n```sql\n-- migrate: track last touch on the authoritative\
        \ row\nALTER TABLE interview_session ADD COLUMN last_activity_at DATETIME\
        \ NULL;\n-- policy/job: close sessions idle > N (align idle timeout to the\
        \ Redis TTL)\nUPDATE interview_session\n   SET status = 'FINISHED', finished_at\
        \ = COALESCE(finished_at, NOW())\n WHERE status = 'ASKING' AND last_activity_at\
        \ < NOW() - INTERVAL 24 HOUR;\n```\n\n**5. Operationally**, confirm Redis\
        \ policy stays `noeviction` (or if you enable `maxmemory`, use `volatile-ttl`/`allkeys-lru`\
        \ consciously and set the session TTL low enough that eviction is not relied\
        \ on for correctness).\n\n### Decision summary\n- **Recommended:** sliding\
        \ TTL on read + recovery logging (fixes the silent class cheaply) and persist\
        \ every runtime-only fact to DB (fixes the true breakage in *reserved* states).\n\
        - **Accepted trade-off:** sliding TTL keeps idle-but-open sessions slightly\
