        \ | Interview resumes after Redis TTL, DB row still `active` | ✅ | Resume\
        \ token or hydrate call hits a missing/rendered-null Redis key; DB still advertises\
        \ a live session |\n| 2 | User stays active *within* TTL window (touching\
        \ keys) | ❌ | Key still present — *unless* TTL is fixed, see #3 |\n| 3 | User\
        \ is active but TTL is **fixed** (not sliding/extended on access) | ✅ | Even\
        \ healthy, in-flight users expire if session duration > TTL. Access does not\
        \ refresh the deadline. |\n| 4 | Long-running interview (1h+) with short TTL\
        \ (e.g. 15 min) | ✅ | Guaranteed expiry mid-interview regardless of activity\
        \ |\n| 5 | Token has `issued_at`/`exp` validated against **Redis** state |\
        \ ✅ | Token parse succeeds, Redis lookup 404s → 401/410 semantics mismatch\
        \ |\n| 6 | Token validated only against **DB** (JWT alone) | ⚠️ | Auth \"\
        succeeds\" but next state read fails → confusing mid-request 500 rather than\
        \ clean 401 |\n\nThe subtlest case is **#3**: a *fixed* (non-sliding) TTL\
        \ means a perfectly healthy user doing continuous work still gets evicted.\
        \ That's the \"silent\" part — no error surfaces at expiry time, only on the\
        \ *next* continuation attempt.\n\n---\n\n### 2. Why Continuation Breaks (Mechanism)\n\
        \n**1. Redis has a pure time-based eviction policy.** With default `volatile-lru`/`volatile-ttl`/`allkeys-*`\
        \ — or even a simple `EXPIRE` — Redis *lazily* evicts on access (`expireIfNeeded`\
        \ runs at lookup) and *actively* via the 10Hz timer. Unless a **sliding TTL**\
        \ script (`GET` + `EXPIRE` under a single atomic op) is used, reads do **not**\
        \ extend the deadline. A vanilla `SETEX key val 3600` is a dead-man's line:\
        \ immutable from creation.\n\n**2. Redis is a *cache*, DB is the *system of\
        \ record*.** They diverge by design. Explainability rule to quote in review:\n\
        > *\"A key missing from Redis is indistinguishable from 'expired', 'evicted\
        \ for memory', 'node restarted', or 'never written'. None of these are queryable\
        \ back to the caller.\"*\n\n**3. The DB read path masks recursion.** Typical\
        \ continuation flow:\n```\nrequest → load session(id) from DB (valid) \n \
        \       → check runtime state in Redis (GONE)\n        → 500 / state-required\
        \ error\n```\nBecause the DB check *succeeds first*, the failure is deferred\
        \ and re-thrown *every* retry — each retry re-validates DB then misses Redis.\
        \ Horrible retry/backoff behavior, and the error is ambiguous (DB-valid, cache-miss).\
        \ This is the exact \"silently expire while DB remains valid\" symptom.\n\n\
        **4. Split-brain from TTL ≠ DB lifecycle.** If DB row is cleared on a *different*\
        \ trigger (explicit `DELETE` on completion, scheduled cleanup job) than Redis\
        \ TTL, the two clocks drift. Any gap = a read-only window where DB advertises\
        \ existence Redis denies.\n\n---\n\n### 3. Root-Cause Classification (for\
        \ the lead)\n\n- **P0 – TTL set incorrectly**: fixed TTL shorter than max\
        \ expected interview span.\n- **P0 – No renewal on active use**: session should\
        \ be sliding, not absolute.\n- **P1 – No expiry callback/cleanup**: nothing\
        \ reconciles Redis expiry with the DB row → orphaned \"valid\" DB rows.\n\
        - **P1 – No distinguishability of expiry**: no tombstone, no `expired` flag\
        \ persisted, so the client can't tell \"session over\" from \"transient cache\
        \ miss.\"\n- **P2 – Token/state coupling**: token lifetime and cache lifetime\
        \ not coordinated.\n\n---\n\n### 4. Recommended Fixes & Configuration\n\n\
        #### 4a. Sliding TTL (renew on access) — atomic\n\nThe single highest-value\
        \ fix. Use Lua so the read+extend is atomic (avoids a thread renewing an *expired*\
        \ key):\n\n```lua\n-- redis eval script: get_session\nif redis.call(\"EXISTS\"\
        , KEYS[1]) == 0 then\n  return nil\nend\nredis.call(\"EXPIRE\", KEYS[1], ARGV[1])\
        \   -- slide the deadline\nreturn redis.call(\"GET\", KEYS[1])\n```\n\nAlso\
        \ set an **inactivity ceiling** so an id idle-but-open interview *does* eventually\
        \ die — sliding alone leaks state forever if no absolute cap:\n\n```lua\n\
        -- wrap in the same script: cap absolute age\nlocal now = redis.call(\"TIME\"\
        )[1]\nlocal born = tonumber(redis.call(\"HGET\", KEYS[1], \"born_at\") or\
        \ now)\nif (now - born) > tonumber(ARGV[2]) then\n  redis.call(\"DEL\", KEYS[1]);\
        \ return nil\nend\nredis.call(\"EXPIRE\", KEYS[1], ARGV[1])\n```\n\n#### 4b.\
        \ Tune Redis eviction + add second TTL field\n\n```conf\nmaxmemory-policy\
        \ noeviction   # or volatile-ttl; NEVER allkeys-lru for authoritative session\
        \ state\n```\nAdd `volatile-ttl` on the *session* shard or keep session keys\
        \ under a dedicated DB namespace so eviction for memory pressure can't silently\
        \ drop active interviews. Prefer Redis **7.0 RDB/AOF persistence** (`appendonly\
        \ yes`, `appendfsync everysec`) so a node restart doesn't compound the problem.\n\
        \n#### 4c. Reconcile the two tiers — expiry callback / tombstone\n\nDo NOT\
        \ rely on TTL alone. Persist a soft-delete marker in the DB so the DB stops\
        \ advertising valid-but-expired sessions:\n\n```\non Redis expiration (keyspace\
        \ notification `expired`):\n    UPDATE sessions SET status='expired' WHERE\
        \ id=:id AND status='active'\n```\nUse **keyspace notifications** (notifications-keyspace-events\
        \ via config `notify-keyspace-events Ex` — note: `E` for keyevent). Subscribe\
        \ on `__keyevent@<db>__:expired`, mark the DB row. This closes the read-only\
        \ window and makes continuation fail *fast and cleanly* with a 410 `GONE`,\
        \ not an ambiguous 500.\n\n```conf\nnotify-keyspace-events Ex\n```\n\n####\
        \ 4d. Coordinate token lifetime with cache lifetime\n\nNever mint a resume\
        \ token that outlives the Redis state it references. Derive `exp` from the\
        \ session's refresh boundary:\n\n```go\n// token.ttl = min(sessionTTL, absoluteSessionCap)\n\
        ```\n\n#### 4e. Decide the authoritative clock\n\nPick **one** master: either\
        \ Redis TTL drives DB cleanup, or the DB row expiry drives Redis DEL. Recommendation:\
        \ **Redis TTL = runtime availability**; **DB shares the same TTL value**,\
        \ and the keyspace-notification handler deletes the DB session on expiry.\
        \ Single source of truth = one expiry value stored once, propagated to both\
        \ tiers.\n\n---\n\n### 5. Concrete Redis CLI Verification\n\nTest the silent-expiry\
        \ hypothesis directly:\n\n```bash\n# reproduce\nredis-cli SETEX session:d5a31f\
        \ 30 '{\"q\":3,\"score\":12}'\nredis-cli TTL session:d5a31f        # 30\n\
        sleep 35\nredis-cli GET session:d5a31f        # (nil)  <- silent; DB still\
        \ says active\n\n# fix: sliding via lua eval\nredis-cli --eval /tmp/get_session.lua\
        \ session:d5a31f , 60\nredis-cli TTL session:d5a31f        # should be ~60\
        \ again after each read\n```\n\n---\n\n### 6. Deliverables for Lead Review\n\
        \n1. **Fix primary bug**: convert fixed TTL → sliding TTL with absolute inactivity\
        \ cap (**4a**).\n2. **Close the divergence gap**: keyspace-notification expiry\
        \ handler to reconcile DB row (**4c**).\n3. **Bound token lifetime** to cache\
        \ lifetime (**4d**).\n4. **Make failure explicit**: return 410 `GONE` (not\
        \ 500) once DB knows the runtime state expired, so retries stop hammering.\n\
        5. **Add observability**: metric on `cache_miss_but_db_valid` frequency —\
        \ this is the canary for the whole class of bug.\n6. **Future guard**: add\
        \ a Redis↔DB consistency test (set TTL=1s, assert DB row flips to `expired`,\
        \ assert resume returns 410).\n\n**Bottom line for the lead:** *\"Continuation\
        \ breaks the moment the client's request boundary crosses it was TTL deadline\
        \ while the DB clock still says 'alive.' It's not a Redis bug or a DB bug\
        \ — it's a missing reconciliation layer between two clocks that were never\
        \ synchronized.\"*"
