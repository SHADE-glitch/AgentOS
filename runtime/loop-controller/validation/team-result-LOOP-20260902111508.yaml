      output: "# Redis Session TTL vs Persistent DB: Silent Expiry & Continuation\
        \ Breaks\n\n## 1. Problem Summary\n\nAn interview session has two logical\
        \ parts:\n\n| Layer | Where stored | Lifecycle |\n|-------|-------------|-----------|\n\
        | **Runtime/transient state** (active Q&A, current question index, timer,\
        \ in-progress user responses, lock, dedup keys) | Redis, fixed TTL (e.g. `EXPIRE\
        \ 1800`) | Volatile, meant to be short-lived |\n| **Canonical/persistent state**\
        \ (session record, completed answers, scores, audit log) | PostgreSQL / MySQL\
        \ / Mongo | Survives restarts, considered \"source of truth\" |\n\nThe flaw:\
        \ `TTL + fixed` is a **write-once assumption**. The key gets `SETEX`/`SET\
        \ EX`/`EXPIRE` when created, but the TTL is **not renewed** by subsequent\
        \ activity. Meanwhile the DB row for that session stays valid (its own validity\
        \ is derived from DB timestamps/logic, not the Redis TTL).\n\n> Redis silently\
        \ expires the runtime state → a continuation request reloads the session from\
        \ the DB → runtime state is gone/partial; the DB looks \"valid\" so the system\
        \ tries to continue, but runtime context is missing → broken continuation.\n\
        \n## 2. When It Breaks (Trigger Conditions)\n\nContinuation breaks when **DB\
        \ validity outlives the Redis TTL**. Concretely:\n\n1. **Long active sessions.**\
        \ A slow interview / review that stays \"in progress\" past the TTL window.\
        \ User keeps working, continuously hitting Redis-backed keys, but TTL counts\
        \ from creation only → keys vanish mid-session.\n2. **Idle-but-not-ended sessions.**\
        \ User pauses think > TTL, returns to \"resume\". DB session is still `status='in_progress'`\
        \ (valid), Redis state expired. This is the most common break.\n3. **Long-running/async\
        \ interview steps.** Async agent steps (LLM scoring, proctoring checks) that\
        \ exceed TTL between writes.\n4. **Fixed TTL < realistic session length.**\
        \ e.g. TTL=15min on a 60-min interview → uniform expiry independent of actual\
        \ usage.\n5. **Only runtime data in Redis.** If user's \"current position\"\
        \ or \"answered question ids\" live only in Redis and are not mirrored to\
        \ DB, expiry = irretrievable data loss.\n\n## 3. Why It Breaks (Root Causes)\n\
        \n- **Fixed (creation-based) TTL is not usage-based.** Correct sliding expiry\
        \ would call `EXPIRE <key> <ttl>` on *every* interaction. With fixed TTL there\
        \ is no refresh, so the lifetime is bounded by wall-clock from creation regardless\
        \ of activity.\n\n- **Dual-source-of-truth mismatch.** The DB says \"session\
        \ active\"; Redis (which held the granular position) says \"gone\". Continuation\
        \ loading logic only checks DB validity, so it *thinks* it can resume and\
        \ proceeds with empty/degraded runtime state.\n\n- **Silent failure.** Redis\
        \ `GET` on an expired key returns `nil`, not an error. Code that does `redis.get(key)`\
        \ and treats `nil` as \"not done yet / first time\" reconstructs a **fresh/blank\
        \ state** instead of failing loudly → misroutes to a new-question flow or\
        \ returns 200 with wrong content.\n\n- **Race with the DB source-of-truth.**\
        \ The DB row is updated at *different frequencies* (only on question boundaries\
        \ or completion) than Redis keys (per-tick). So between DB writes, Redis is\
        \ the only detailed state; its expiry leaves a gap the DB cannot fill.\n\n\
        ## 4. Specific Failure Modes (Debug Cases)\n\n| Symptom | Likely cause | Fatality\
        \ |\n|---------|-------------|----------|\n| Resume returns empty form / starts\
        \ new question | Session position key expired, `nil` treated as \"start\"\
        \ | High |\n| 200 OK but wrong content (blank \"current question\") | Position\
        \ in Redis, content only from DB on boundary | High |\n| Duplicate answer\
        \ submission after resume | `idempotency/dedup` key expired client-side retry\
        \ path | Medium |\n| Lock expired mid-write → concurrent double-processing\
        \ | `SET NX PX` lock TTL < operation time | Medium |\n| No error, silent reset,\
        \ user confused | Trusting DB validity alone, no Redis staleness check | High\
        \ |\n\n## 5. Recommendations (Configuration & Code)\n\n### 5.1 Split TTL policy:\
        \ sliding vs fixed\nUse **sliding expiration** for runtime state (renewed\
        \ on each access/interaction) and a **hard cap** as an upper bound:\n\n```python\n\
        # Every touch renews the window; session cannot die while user is active.\n\
        def touch_runtime(session_id: str, ttl: int = 1800):\n    key = runtime_key(session_id)\n\
        \    r.set(key, ..., ex=ttl)          # reset on write\n    r.expire(key,\
        \ ttl)                # also renew TTL on read-touch\n\n# Optional Lua/atomic:\
        \ get-and-refresh\nTOUCH = \"\"\"\nlocal k = redis.call('GET', KEYS[1])\n\
        if k then redis.call('EXPIRE', KEYS[1], ARGV[1]) end\nreturn k\n\"\"\"\n```\n\
        \nThe hard cap (e.g. 4h) prevents zombie sessions from never being cleaned.\n\
        \n### 5.2 Validate Redis against DB on \"resume\" — fail loudly, not silently\n\
        \nNever assume `nil` == \"new session\". Distinguish three cases:\n\n```python\n\
        def resume(session_id):\n    db = load_session_from_db(session_id)   # authoritative\
        \ existence\n    rt = redis.get(runtime_key(session_id))\n\n    if db is None:\n\
        \        return 404                           # truly new\n    if rt is None:\n\
        \        # DB valid but runtime gone -> explicit recover path\n        rebuild_runtime_from_db(session_id)\
        \  # or return 409 \"needs reset\"\n        # never silently treat as a fresh\
        \ session\n```\n\nExplicitly query remaining TTL to detect imminent expiry\
        \ proactively:\n\n```rust\n// Rust/redis-rs or via TTL command generally\n\
        let ttl: i64 = conn.ttl(&key)?;   // <0 ==> expired/missing\nif ttl != -1\
        \ && ttl < 60 { log::warn!(target:key, \"session near expiry\") }\n```\n\n\
        ### 5.3 Mirror minimal runtime state to DB (data of record)\nAt least persist\
        \ to the DB on question boundaries:\n- `current_question_index`, `remaining_question_ids`,\
        \ `answered_ids`, `updated_at`.\n\nThen Redis is a **cache**, fully reconstructible:\n\
        \n```\nDB:  [session_id, current_index, answered[], status, heartbeat_ts]\n\
        Redis: [live encodings, cooldowns, locks, transient UI state]  <-- expirable\
        \ safely\n```\n\n### 5.4 Lock discipline for idempotency\nUse `SET key val\
        \ NX PX <ttl>` and set TTL comfortably above max operation time; if TTL is\
        \ too short the lock expires mid-operation → double execution. Prefer task-scoped\
        \ TTLs derived from the operation, not a global constant.\n\n### 5.5 Keep\
        \ a `heartbeat` / re-validate gate\nMaintain DB-side `last_activity_at`. On\
        \ resume, if `now - last_activity_at > GAP_THRESHOLD` while Redis is empty,\
        \ treat as **expired-interrupted** and route to a clearly-labeled recovery\
        \ (do not silently replay).\n\n### 5.6 Monitoring / alerting\n```\nExpired-while-DB-valid\
        \ counter (metric on the nil-from-valid-DB branch)\nRedis keyspace TTL distribution\
        \ for session keys (confirm sliding works)\nDB heartbeat staleness alert\n\
        ```\n\n## 6. Bottom Line\n\n- **Breaks when** the Redis TTL is *creation-fixed*\
        \ and outlived by actual session activity or idle-but-open sessions, while\
        \ the DB still flags the session valid.\n- **Breaks because** (1) fixed TTL\
        \ isn't renewed, (2) Redis holds granular runtime state that never reaches\
        \ the DB, and (3) `nil` from Redis is silently treated as \"new\" instead\
        \ of \"expired/stale\", so continuation proceeds with missing context and\
        \ returns broken/noisy behavior.\n\nFix = **sliding TTL** + **persist minimal\
        \ position to DB** + **explicit nil-vs-new branching** + **heartbeat-aware\
        \ resume gate**."
