      output: "# Code Review — Redis TTL 静默过期 vs DB 有效时\"续答\"断裂\n\n**审查对象:** `InterviewStateStore`（固定\
        \ TTL）与 `InterviewService.answer/answerStream/requireAsking` 的续答（continuation）语义。\n\
        **结论先行:** 当前实现因 `requireAsking()` 存在 DB 回退重建，**简单过期不会立刻硬崩**——这恰恰是危险所在：它把一次\"\
        权威状态过期\"静默降级为\"回读 DB 重建\"，掩盖了根因。断裂与否取决于一个未定的隐含契约：DB 快照是否永远是运行时状态的真超集。今天恰好是，明天只要往\
        \ `SessionState` 加一个不镜像到 `interview_session` 的字段，就会从\"静默恢复\"变成\"静默数据丢失\"。\n\
        \n---\n\n## 1. 根因与关键问题\n\n### 1.1 权威契约是反的（最根本问题）\n`InterviewStateStore` 类注释声明\
        \ Redis 是\"状态机的单一权威来源\"，但实现里 DB 才是真正持久层，Redis 只是带 TTL 的可变运行时缓存。`requireAsking`\
        \ 的 fallback 明确证明：**Redis 丢了，系统靠 DB 兜底。** 契约未定会导致两类 bug 交替出现：\n- 相信 DB → 不处理过期\
        \ → 续答静默丢运行时位点。\n- 相信 Redis → 该写时只写 Redis → DB 永不落库。\n\n针对性结论见 §3 方案。\n\n\
        ### 1.2 \"固定 TTL\"的真实语义是\"每次写即续期 24h\"\n`InterviewStateStore.java:51`：\n```java\n\
        redissonClient.getBucket(key(sessionId)).set(json, TTL_HOURS, TimeUnit.HOURS);\n\
        ```\nRedisson `set(key, val, ttl)` 每次调用都**从当前时刻重新计算完整 24h**；而 `read()`（:34-46）**不续期**。因此\
        \ key 生命周期 = \"距最近一次 `write` 之后 24h\"，不是\"自会话开始 24h\"。结果：\n- 活跃会话（一直答）会被每次\
        \ `write` 无限续期，Redis 永不释放；\n- 闲置会话在**最后一次交互 24h 后**静默消失，与业务预期（\"我的面试还存着\"\
        ）不符。\n\n### 1.3 过期检测被\"读取/解析失败\"两个条件混为一谈\n`read()` 在 `json == null` 和 `JSON\
        \ 解析异常` 时都返回 `null`（:37-45）。这导致 `requireAsking` 无法区分\"过期/LRU 淘汰\"与\"数据损坏/版本不兼容\"\
        ，二者都触发同一个 DB 回退重建路径——损坏数据也被当成过期静默重写，掩盖真正的坏值。\n\n### 1.4 DB 与 Redis 之间没有跨存储事务\n\
        `InterviewService` 里总是先后执行 `sessionMapper.updateById(session)` 再 `stateStore.write(...)`（如\
        \ :183-189）。两步之间若 Redis 写失败（`InterviewStateStore.write` 抛 `BizException`），或\
        \ TTL 恰好在间隙触发，则 Redis 保留 **24h 前的旧位点**，与 DB 分裂。下一次续答在锁内重读，多数时候能查到 null 走 fallback，但存在短暂、不确定的\"\
        读到旧镜像\"窗口。\n\n---\n\n## 2. 何时/为何续答断裂（分场景判定）\n\n### 场景 A —— 空闲 > TTL，返回续答【当前不会断裂，靠\
        \ fallback 兜住】\n最后一次 `answer` 写后 24h → key 过期。用户返回 `/answer`：\n```java\n//\
        \ requireAsking, InterviewService.java:380-399\nstate = stateStore.read(sessionId);\
        \      // null\nif (state == null) {\n    sessionMapper.selectById(sessionId)\
        \      // DB 仍有效，ASKING\n    state = new SessionState(s.getStatus(), s.getQuestionCount(),\
        \ s.getCurrentQuestionId());\n    stateStore.write(sessionId, state);    \
        \  // 重建 + 重置 24h\n}\n```\n**结论：今天不硬断**，因为 DB 三字段恰好是全量重建源。但它静默地完成了\"权威切换 Redis→DB\"\
        。危险在于：这段重建**无日志、无指标、无告警**，过期事件对运维不可见。\n\n### 场景 B —— 续答断裂的\"真\"引爆点：运行时状态超出\
        \ DB 字段\n只要演进中给 `SessionState`（`:27`）增加 **DB 没有镜像**的运行时字段——例如跟进提问序号、`questionSequences`、`lastAskedKnowledgePointSequence`、剩余题目游标——过期后\
        \ fallback 只能重建出 `(status, questionCount, currentQuestionId)`，那些字段被静默归零/丢弃，**后续\
        \ `pickQuestion` 的去重与游标全部错乱**，用户看到重复题目或跳过。这是本场景真正的断裂期。\n\n### 场景 C —— 读侧用户交互与\"\
        权威丢失\"不一致\n`detail()`/`listByUser()`（:283-299）**完全不读 Redis**，直接用 DB 渲染。同一个会话，Redis\
        \ 过期与否不影响列表\"看起来有效\"（DB 有效），用户自然认为可继续——与 Redis 里运行时位点已消失形成反差。这正是任务里\"DB 仍有效、Redis\
        \ 已过期\"的静默与困惑来源。\n\n### 场景 D —— `answerStream` 持有旧引用跨越 TTL\n`answerStream`（:197）在流开始时\
        \ `requireAsking` 读一次 state，随后为整段 300s SSE **复用 JVM 内 `state` 对象**（:254 `state.questionCount()+1`）不再重读\
        \ Redis。若 TTL 恰在此流执行期间到期，写侧仍在结束用 `set(...,24h)` 续期——多数情况一致，但又一次把\"续期正确性\"\
        寄托在与 TTL 时序的隐性耦合上。\n\n### 统一定性\n续答断不断，**完全取决于 DB 快照是否为运行时状态的超集**。今天\"是\"，表现为静默切源；将来\"\
        不是\"，就表现为数据静默丢失。把正确性押在\"恰好字段相等\"上，是教科书式的脆弱耦合。\n\n---\n\n## 3. 方案对比与建议\n\n\
        ```text\n方案 A：把 Redis 真正当作纯缓存，DB 为唯一权威\n- 强度：契约清晰；过期只代表\"缓存未命中\"，天然可重算；跨存储一致性问题归零\n\
        - 弱点：需保证 DB 表字段覆盖全部运行时位点；每答多一次 DB 读\n- 适合：会话延迟敏感度中等的单机部署\n\n方案 B：Redis 做权威，TTL\
        \ 只在显式结束/终态时清理\n- 强度：吞吐最高，swap-in/TTL 不丢位点\n- 弱点：废弃会话需 TTL 清理；终态必须删 key；分配回收需兜底扫描\n\
        - 适合：纯运行时状态、DB 仅归档消息/报告的架构\n\n方案 C：采用滑动续期（key 非 24h 固定，读写都续期）+ 记录 lastHeartbeatAt\n\
        - 强度：过期只发生在真正闲置；心跳字段让\"何时过期\"可观测、可审计\n- 弱点：仍是双写；仍需 DB 兜底校验\n\n## 决策（对当前代码库）\n\
        推荐 A + 3 处最小加固，理由：改造成本最低、与现有 fallback 一致、立即终结\"权威不明\"。\n```\n\n### 具体落地（最小改动）\n\
        \n**① 把 Redis 降级为缓存，明示非权威**\n- 改类注释：去掉\"单一权威来源\"表述，改成\"运行时缓存，DB 为唯一事实来源\"\
        。\n- 给 `InterviewStateStore` 加 `key()`/重建逻辑独立化，`requireAsking` 的 fallback\
        \ 抽出并补日志：\n\n```java\n// InterviewStateStore 增加可观测重建\npublic SessionState\
        \ readOrRecover(Long sessionId, Function<Long, SessionState> fromDb) {\n \
        \   SessionState cached = read(sessionId);\n    if (cached != null) return\
        \ cached;\n    SessionState rebuilt = fromDb.apply(sessionId);\n    if (rebuilt\
        \ == null) return null;\n    log.info(\"session state expired/corrupt, rebuilt\
        \ from DB: sessionId={}\", sessionId);\n    write(sessionId, rebuilt);\n \
        \   return rebuilt;\n}\n```\n\n**② `read()` 区分\"过期\"与\"损坏\"**\n```java\npublic\
        \ SessionState read(Long sessionId) {\n    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \    String json = bucket.get();\n    if (json == null) return null;     \
        \            // 未命中/已过期\n    try {\n        return objectMapper.readValue(json,\
