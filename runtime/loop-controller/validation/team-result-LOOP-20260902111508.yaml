      output: "# Redis Session State TTL vs DB Validity — Continuation Break Analysis\n\
        \n**Role:** Database Engineer (security-engineering focus) · **Team:** team-18087af2\
        \ · **Output:** for lead review\n\n## 1. Problem Statement\n\nThe interview\
        \ runtime keeps transient state in Redis (session phase, tool-calling decision\
        \ context, distributed lock tokens) under a **fixed TTL**, while the authoritative\
        \ record (interview, answers, score state) lives in the DB. When the Redis\
        \ TTL fires but the DB row is still `ACTIVE`/valid, the running client's in-band\
        \ state disappears. Continuation then **breaks in a specific way**: the app\
        \ still recognizes the interview (DB says valid) but has lost the runtime\
        \ context it needs to resume the tool-calling state machine.\n\n---\n\n##\
        \ 2. When Breakage Actually Occurs (Threat Model)\n\nContinuation breaks only\
        \ when the missing Redis state is **irrecoverable** and **required**, not\
        \ merely cached. Classify every Redis key by recovery cost:\n\n| Key class\
        \ | Example | Rebuildable from DB? | TTL expiry impact |\n|---|---|---|---|\n\
        | **Session / phase pointer** | `ivt:{id}:phase`, step index | Yes — replay\
        \ deterministic steps | Degraded: can recompute |\n| **Verification inputs**\
        \ | user answers, question set refs, **nonces / anti-replay tokens** | **No**\
        \ for the nonce/token | **Fails safely** (must fail) |\n| **Tool-calling decision\
        \ context** | partial tool args, choice state, LLM call idempotency key |\
        \ **No** | **Breaks mid-flight** |\n| **Distributed lock token** | `lock:ivt:{id}`\
        \ + token | No — lease semantics lost | **Data-consistency risk** if stale\
        \ holder continues |\n| **Ephemeral challenge / MFA** | short-lived auth nonce\
        \ | No (by design) | Fails safely |\n\n**The dangerous breakpoint is the tool-calling\
        \ / decision context combined with the lock.** The state machine has already\
        \ issued partial tool calls (e.g., \"score current answer\" → LLM → store\
        \ result). If the TTL dies between \"LLM called\" and \"result persisted\"\
        , you have an **un-recorded partial write** and a **lost continuation point**.\n\
        \n---\n\n## 3. Why TTL Expiry Late-Fires and Is Non-Deterministic (Security\
        \ View)\n\nFixed-TTL expiry is **neither crash-consistent nor atomic** with\
        \ the DB transaction that keeps the interview valid:\n\n1. **Two-clock problem.**\
        \ Redis `EXPIRE` uses absolute wall clock on the Redis server + per-key lazy/active\
        \ expiry sampling. The DB validity uses application logical state. The clocks\
        \ are not synchronized → the Redis key can die at any offset from the DB transition.\n\
        2. **Lazy expiry sampling** (`activeExpireCycle`) — expired keys are only\
        \ reclaimed by `expireIfNeeded` on access, so a *naive read* may still return\
        \ a technically-moribund key (fails on the *next* operation). This yields\
        \ **non-deterministic continuation**: sometimes it works, sometimes it 500s.\n\
        3. **Write-then-expire ordering.** If an application DTO carries its own `createdAt`/`expiresAt`\
        \ and the code checks Redis-first but validates staleness from the *stored\
        \ timestamp*, slow request queues can present a value past its window — a\
        \ classic **TOCTOU (time-of-check-to-time-of-use)** race.\n4. **No atomicity\
        \ with the DB commit.** Redis SET-with-TTL and the SQL COMMIT are separate\
        \ steps. Between \"DB committed = interview valid\" and \"Redis SETEX issued,\"\
        \ a crash produces **DB-valid, Redis-absent** — exactly the \"valid DB, no\
        \ runtime state\" state you're describing.\n\n---\n\n## 4. Concrete Failure\
        \ Paths (with code)\n\n### 4.1 Mid-tool-call continuation break\n\n```python\n\
        # NON-ATOMIC pattern — BAD\nredis.setex(f\"ivt:{id}:toolctx\", ttl=600, value=json.dumps(ctx))\n\
        invoke_llm(ctx)                    # slow, >TTL window in pathological case\n\
        result = await llm.complete(ctx)   # expires can happen BETWEEN these lines\n\
        redis.setex(f\"ivt:{id}:toolctx\", ttl=600, value=json.dumps(result))\n```\n\
        Between the two writes the TTL fires with a fixed `600s`. The *second* SETEX\
        \ re-creates the key with a **new** identity — any distributed-lock token\
        \ bound to the old key value no longer matches → **someone else can now acquire\
        \ the lock** → double-eval / corruption.\n\n### 4.2 Lock token orphaned\n\n\
        ```python\ntoken = uuid4()\ngot = redis.set(f\"lock:ivt:{id}\", token, nx=True,\
        \ ex=600)\n# ... long operation ...\n# TTL fires -> key deleted -> DB still\
        \ says in-progress\nok = redis.get(f\"lock:ivt:{id}\") == token   # -> None,\
        \ fails\n# A concurrent worker acquires with its OWN token and proceeds\n\
        ```\n\nSecurity impact: **lost mutual exclusion** → the same interview's score/answer\
        \ rows get written by two workers → torn/corrupted DB records, or a stale\
        \ holder resuming with orphaned context.\n\n### 4.3 Verification nonce expired\
        \ (desired fail)\n\n```python\n# Correct behavior: MUST fail closed\nnonce\
        \ = redis.get(f\"ivt:{id}:answer_vote\")   # expired -> None\nif nonce is\
        \ None and expected is not None:\n    audit.error(\"anti-replay nonce expired\
        \ mid-session\", ref_id=id)\n    return 409 / 428   # never auto-continue\n\
        ```\n\n---\n\n## 5. Recommendations (ranked)\n\n### 5.1 Make TTL contract\
        \ explicit and DB-coupled (primary fix)\nStore `expires_at` **in the DB row**\
        \ alongside status; let expiry be derived, not duplicated:\n- Add column `runtime_expires_at\
        \ timestamptz NOT NULL`.\n- Logic resolves validity from the **DB value only**;\
        \ Redis is treated as a **pure cache** that may always be absent.\n- On any\
        \ Redis miss, **re-entrantly rebuild** from DB for deterministic steps; **fail\
        \ closed** for nonce/lock.\n\n### 5.2 Sliding window, not fixed TTL\nFixed\
        \ TTL is the root cause. Use **sliding expiry** refreshed on every heartbeat/admissible\
        \ interaction:\n\n```python\nPIPELINE:\n  WATCH session-key\n  if exists:\
        \  redis.expire(key, SLIDING_TTL)   # touch on activity\n  else:       rehydrate_or_fail(session-key)\n\
        ```\n\n### 5.3 Atomic expiry + lock = lease model\nNever let lock lifetime\
        \ equal the *operation* lifetime. Use a **short lease** with periodic renewal\
        \ in the same atomic scripts:\n\n```lua\n-- renew.lua\nif redis.call(\"get\"\
        , KEYS[1]) == ARGV[1] then\n    return redis.call(\"expire\", KEYS[1], ARGV[2])\n\
        end\nreturn 0\n```\nWorker renews every `RENEW_INTERVAL < LEASE_TTL`; if a\
        \ renewal is missed, the lease is released **and the DB transaction must be\
        \ rolled back or tombstoned** so no orphan continues.\n\n### 5.4 Heartbeat\
        \ + graceful continuation\n- Client/worker sends heartbeat `PING ivt:{id}`\
        \ every `t <= TTL/4`; on TTL expiry detected (no heartbeat), set DB status\
        \ to `INTERRUPTED` and provide a **resume token** stored in the DB (recoverable),\
        \ rather than a silent loss.\n- Expose continuation as explicit `POST /interviews/{id}/resume`\
        \ that rehydrates context **idempotently**, never auto.\n\n### 5.5 Visibility\
        \ + alerting (security ops)\n- `INFO keyspace` / scan to count active session\
        \ keys vs. DB ACTIVE rows; alert on **divergence** (Redis keys < DB actives)\
        \ — this is your canary for silent expiry.\n- Log the expiry event with the\
        \ **identity** (interview id) and whether it failed-open/closed, for audit.\n\
        \n### 5.6 Security defaults — fail closed by data class\n| Data | On expiry\
        \ | Rationale |\n|---|---|---|\n| answers, nonce, partial tool args | **fail\
        \ closed** (428/409, require restate) | anti-replay, no torn state |\n| phase\
        \ pointer, progress | **rebuild from DB** | deterministic, cheap |\n\n---\n\
        \n## 6. Summary — Bottom Line for Lead\n\n- **Fixed TTL + separate DB is the\
        \ bug.** It decouples liveness from logical validity and makes continuation\
        \ non-deterministic.\n- **Continuation breaks exactly when** (a) the DB row\
        \ is `ACTIVE` but (b) irrecoverable runtime state (lock token, partial tool\
        \ call, nonce) was Redis-only — you get \"still valid, cannot resume.\"\n\
        - **Fix hierarchy:** derive expiry from the DB → sliding TTL + heartbeat →\
        \ lease-based distributed lock → classify keys as *rebuildable* vs *fail-closed*\
        \ and never silently continue on the latter.\n- **Must actions:** atomic lock-renewal\
        \ Lua, fail-closed on nonce/partial state, divergence alerting, audit logging\
        \ of every expiry.\n\nReviewed for security correctness. Ready for lead review\
        \ and DB/backend slot reconciliation."
