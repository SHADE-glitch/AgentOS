    output: "# Interview Session Continuation — Redis TTL vs DB Validity\n\n## TL;DR\
      \ (诊断结论)\n\nContinuation breaks whenever the **runtime/transient state** required\
      \ to resume the session lives *only* in Redis and its key disappears, while\
      \ the **durable row** in the DB still says the session is valid/in-progress.\
      \ Redis saying \"gone\" and the DB saying \"alive\" are **two valid, contradictory\
      \ truths**; the app has no correct resume path, so it either errors, silently\
      \ restarts the session, or leaks partially-done progress. This is not a bug\
      \ in isolation — it's a **durability-of-ephemeral-state** design gap.\n\n---\n\
      \n## 1. Root Cause (根因)\n\nYou have two sources of truth with different lifetimes:\n\
      \n| Store | What it holds | Lifetime | Semantics |\n|---|---|---|---|\n| **DB**\
      \ | Committed session metadata: `session_id`, user, `status=in_progress`, timestamps,\
      \ score, final answers | Persistent | Durable, source of truth for *committed*\
      \ facts |\n| **Redis** | Runtime/transient state: current question index, cursor,\
      \ elapsed timer, partial answer buffer, locked tokens/quota, socket/queue refs,\
      \ token budget | Ephemeral, fixed TTL | Only the *live execution context* |\n\
      \nThe failure is that **resume depends on Redis, but validity is judged by the\
      \ DB**. When the Redis key is evicted/expired while the DB row is still `in_progress`,\
      \ the system faces a contradiction: *\"the session legally exists, but I have\
      \ nothing to resume it with.\"* Every code path that assumed \"Redis present\
      \ ⟺ can continue\" now breaks.\n\n---\n\n## 2. When It Breaks (构造完整时序)\n\n###\
      \ 2.1 Fixed TTL expires during a legitimately long/active session\nAn interview\
      \ that runs longer than `ttl_seconds`. Session is active, user is mid-question,\
      \ Redis key dies at `now >= set_at + ttl`. DB row untouched.\n\n```\nt0    \
      \    t_ttl                     \n |────────|──────────────►\n Redis:   alive\
      \       EXPIRED\n DB:      in_progress  in_progress   ← still valid\n Continue:\
      \ OK          BROKEN        ← nothing to resume\n```\n\n### 2.2 Idle-but-not-terminated\
      \ session (most common)\nAbsolute/fixed TTL (set once, never refreshed) vs *sliding*\
      \ TTL. User pauses 25 min to research; TTL is 15 min. Key expires. `status`\
      \ stays `in_progress` because \"idle\" was never treated as \"abandon\".\n\n\
      ### 2.3 TTL only refreshed on specific events\nSliding renewal wired to \"next-question\"\
      \ but not to \"heartbeat/mouse/keyboard/timer-tick\". A long dwell time on a\
      \ single answer silently exhausts TTL.\n\n### 2.4 Redis eviction before TTL\
      \ (memory-pressure)\n`maxmemory-policy` (e.g. `allkeys-lru`, `allkeys-random`,\
      \ `volatile-*` variants) can **evict keys early**, before their TTL is reached.\
      \ TTL is an upper bound, not a guarantee, under pressure.\n\n### 2.5 Redis restart\
      \ / failover / data loss\nIf persistence is misconfigured (`save \"\"`, `appendonly\
      \ no`) or the node is lost without replication catching up, the whole keyspace\
      \ vanishes instantaneously regardless of TTL. DB untouched and still valid →\
      \ mass breakage.\n\n### 2.6 Non-deterministic TTL at write time\nUse of `SET\
      \ ... EX` with a per-session random/derived TTL means expiry moment is unpredictable;\
      \ the DB doesn't carry the TTL, so you can't even predict *when* the resume\
      \ will fail.\n\n### 2.7 Host/language time skew (edge)\nIf the Redis client/driver\
      \ sets TTL using a wrong system clock, keys may expire earlier than intended\
      \ relative to DB timestamps.\n\n### 2.8 Multi-key (pipeline) tear\nState split\
      \ across several Redis keys with *staggered* TTLs → partial expiry leaves a\
      \ half-resumable session (e.g. `session:cursor` gone but `session:answers` present)\
      \ → inconsistent mid-flight state.\n\n---\n\n## 3. Why Continuation Breaks (机理)\n\
      \nEven though the DB row is intact, the **resume payload is non-committal data\
      \ that was never durable**. Specifically:\n\n1. **The DB doesn't hold transient\
      \ context.** Resuming requires the *position* in the flow (current question,\
      \ sub-state, partial typed answers, remaining time, token budget). These are\
      \ only in Redis. No Redis = no resume.\n\n2. **No reconstruction path (or an\
      \ inadequate one).** The app either:\n   - returns an error (`SESSION_NOT_FOUND`\
      \ / `RESUME_FAILED`), or\n   - **silently restarts** at question 1, discarding\
      \ partial progress — the \"silent\" bug is worst because the DB *still* claims\
      \ validity, so the user is never told anything was lost; or\n   - misreads staleness\
      \ as an active session fault and corrupts the DB row.\n\n3. **State-machine\
      \ ambiguity.** The system cannot distinguish:\n   - *\"expired but session legitimately\
      \ continues\"* → should rebuild from DB\n   - *\"truly abandoned\"* → should\
      \ mark `expired`\n   Without an explicit marker, it guesses, and all guesses\
      \ are wrong for at least one user class.\n\n> The core defect is **assuming\
      \ Redis lifetime ≥ session lifetime**, which is never guaranteed. TTL is a cache-hygiene\
      \ mechanism, not a session-lifetime contract.\n\n---\n\n## 4. Design Comparison\
      \ & Decision\n\n```text\nOption A — Reconstruct from DB on miss (Read-through\
      \ / Refresh)\n- Strengths: No state duplication grows unbounded; DB remains\
      \ single source of truth.\n- Weaknesses: Requires DB to hold enough to rebuild;\
      \ adds a rebuild path + latency; must handle partial state.\n- Best for: Sessions\
      \ that can be deterministically rebuilt from committed DB facts.\n\nOption B\
      \ — Singular source of truth in DB, Redis as optional cache\n- Strengths: Eliminates\
      \ the contradiction entirely; Redis helps only for hot reads.\n- Weaknesses:\
      \ More DB writes for every cursor/timer tick; higher write load; may need a\
      \ \"current position\" column.\n- Best for: Correctness-critical, slow-changing\
      \ sessions (few updates per minute).\n\nOption C — Sliding Renewal + Continued-lambda\
      \ (renew-on-access) in Redis\n- Strengths: Robust against idle expiry during\
      \ legitimate use; simple to implement; keeps hot state in Redis.\n- Weaknesses:\
      \ Still breaks under eviction/restart/failover; idle-abandon detection still\
      \ needed.\n- Best for: Short-lived, high-frequency sessions where Redis uptime\
      \ is tolerable.\n\nOption D — Flow-Token / State-Machine Handoff\n- Strengths:\
      \ Designative: every PATCH writes both DB state and a resume token; resume fetches\
      \ token + rehydrates Redis.\n- Weaknesses: More writes; more code; requires\
      \ idempotent resume semantics.\n\nDecision — Recommended: Hybrid (C + A + heartbeat\
      \ + explicit terminal state)\n- Keep hot runtime in Redis BUT always renew on\
      \ access (sliding TTL), set a generous floor, and\n  treat Redis as recoverable:\
      \ on miss, rebuild from DB (Option A) before declaring failure.\n- Why it fits:\
      \ interviews are slow-state (a cursor + timer), so DB rebuild cost is low; rebuild\
      \ fixes\n  eviction, restart, and long-idle cases at once.\n- Risks & mitigations:\n\
      \  * DB write amplification → only persist the *cursor + committed answers*,\
      \ not every tick.\n  * Rebuild ambiguity → record explicit session terminal\
      \ states (COMPLETED/EXPIRED/ABANDONED) in DB.\n```\n\n---\n\n## 5. Implementation\
      \ (实施方案)\n\n### 5.1 Sliding renewal — always renew on *any* touch, not only\
      \ on \"next\"\n```python\n# Redis: exclusive set with sliding TTL on every resume/touch\n\
      def touch_session(session_id: str, ttl: int = 1800):\n    r.extend.ex(invalidate=False)\n\
      \    return r.set(f\"session:{session_id}:runtime\", single_run_blob, kwargs={\"\
      EX\": ttl, \"XX\": False})\n    # key detail: use a write that REFRESHES EX\
      \ on each access\n```\nBetter: use `SET key val EX ttl` on every `GET` touch\
      \ (or Lua), so idle-but-alive sessions never expire:\n```lua\n-- renew_if_exists.lua\n\
      if redis.call('EXISTS', KEYS[1]) == 1 then\n    redis.call('EXPIRE', KEYS[1],\
      \ ARGV[1], 'NX')  -- only bump when key exists\n    return redis.call('GET',\
      \ KEYS[1])\nend\nreturn false\n```\n\n### 5.2 Rebuild on miss — never hard-fail\
      \ on Redis absence\n```python\ndef load_session(session_id: str) -> Session:\n\
      \    ctx = _redis_get(f\"session:{session_id}:runtime\")\n    if ctx is not\
      \ None:\n        return ctx\n    return _rebuild_from_db(session_id)   # fall\
      \ back to durable row\n\ndef _rebuild_from_db(session_id: str) -> Session:\n\
      \    row = db.fetchone(\"SELECT * FROM session WHERE id=%s\", session_id)\n\
      \    if row is None or row.status in (\"COMPLETED\", \"ABANDONED\", \"EXPIRED\"\
      ):\n        raise SessionNotFound(session_id)          # genuinely gone / terminal\n\
      \    # Rehydrate runtime from durable columns only\n    return Session(question_idx=row.current_question,\n\
      \                   answers=row.committed_answers,\n                   started_at=row.started_at,\n\
      \                   remaining=row.time_budget)\n```\n\n### 5.3 Persist enough\
      \ in DB to rebuild (schema contract)\n```sql\nCREATE TABLE session (\n  id \
      \           UUID PRIMARY KEY,\n  user_id       UUID NOT NULL,\n  status    \
      \    TEXT NOT NULL DEFAULT 'IN_PROGRESS' CHECK (status IN\n                \
      \                 ('IN_PROGRESS','PAUSED','COMPLETED','ABANDONED','EXPIRED')),\n\
      \  current_question INT NOT NULL DEFAULT 1,      -- resumable cursor\n  committed_answers\
      \ JSONB NOT NULL DEFAULT '{}', -- durable partial answers\n  time_budget   INTERVAL\
      \ NOT NULL,\n  started_at    TIMESTAMPTZ NOT NULL DEFAULT now(),\n  updated_at\
      \    TIMESTAMPTZ NOT NULL DEFAULT now()\n);\n-- Redis holds only: remaining_time,\
      \ in-progress buffer, locks, token budget.\n-- Anything that must survive a\
      \ restart lives in the DB above.\n```\n\n### 5.4 Guard against eviction & restart\n\
      ```yaml\n# redis.conf — hardening so TTL isn't bypassed by contention/persist\
      \ gaps\nmaxmemory-policy      volatile-ttl   # prefer evicting soonest-expiring\
      \ keys;\n                                     # NOT allkeys-lru which nukes\
      \ active sessions\nsave 900 1\nappendonly  yes                      # survive\
      \ restart\nappendfsync  everysec                # balance durability vs perf\n\
      ```\nSet a **minimum TTL floor** and alert when close:\n```python\nMIN_TTL_SECS\
      \ = 300\nif ttl_secs < MIN_TTL_SECS:\n    metrics.incr(\"session.ttl.floor.violation\"\
      , tags={\"session_id\": session_id})\n    ttl_secs = MIN_TTL_SECS\n```\n\n###\
      \ 5.5 Explicit terminal states — remove ambiguity\nWhen user closes/times-out/abandons,\
      \ **write a DB terminal status before/atomically with removing Redis**:\n```python\n\
      def end_session(session_id, status):   # e.g. status='COMPLETED'|'ABANDONED'|'EXPIRED'\n\
      \    tx(db):\n        db.execute(\"UPDATE session SET status=%s, updated_at=now()\
      \ WHERE id=%s\", status, session_id)\n        # then allow Redis key to be dropped\
      \ / reject further resume\n    redis.delete(f\"session:{session_id}:runtime\"\
      )\n```\nNow on Redis miss, the DB answer is unambiguous:\n\n- DB `status IN\
      \ (COMPLETED, ABANDONED, EXPIRED)` → **reject resume** (correct).\n- DB `status\
      \ = IN_PROGRESS` → **rebuild from DB** (correct).\n\n### 5.6 Heartbeat / idle-abandon\
      \ detection\nA background job marks abandoned sessions: candidate = `IN_PROGRESS`\
      \ AND `updated_at < now() - IDLE_LIMIT`. This converts \"looks alive but Redis\
      \ is gone\" into a definitive DB state, so resume-rebuild and cleanup share\
      \ one rule:\n```sql\nUPDATE session SET status='ABANDONED', updated_at=now()\n\
      WHERE status='IN_PROGRESS' AND updated_at < now() - INTERVAL '30 minutes';\n\
      ```\n\n---\n\n## 6. Verification (验证方式)\n\n- **TTL-expiry simulation:** insert\
      \ a session, set TTL=5s, wait, attempt resume → assert it **rebuilds from DB**,\
      \ no error, cursor preserved.\n- **Eviction simulation:** `maxmemory 1mb` +\
      \ batch activity → assert active key not preferentially dropped (or that rebuild\
      \ works).\n- **Restart simulation:** stop Redis → resume → assert rebuild path\
      \ triggers, not `SessionNotFound`.\n- **Idle abandonment:** no touch for `IDLE_LIMIT`\
      \ → assert DB flips to `ABANDONED`, resume rejected.\n- **Multi-key tear:**\
      \ set a 1s and a 60s TTL on the two runtime keys → assert resume still consistent.\n\
      \n**Expected:** All paths above yield *either* a clean resume (state preserved)\
      \ *or* a clean, labeled rejection — never a silent restart or a mid-flight corruption.\n\
      \n---\n\n## 7. Follow-up Optimizations (后续优化)\n\n- Make Redis a true footer\
      \ with **watchdog metrics** (`redis-key-hit-rate`, `rebuild_rate`) and alert\
      \ when `rebuild_rate` spikes.\n- Add an `expires_at` column to the DB row so\
      \ resume can reject with *why* (duration vs idle).\n- For in-progress partial\
      \ answers larger than a JSONB cell, snapshot to blob storage with the same atomic-terminal\
      \ pattern.\n- Add `resume_token` (HMAC of session+state) for tamper/mid-air-fight\
      \ protection on resume.\n\n**Bottom line:** don't fight TTL with a bigger TTL\
      \ — make Redis **recoverable** (sliding renewal + DB rebuild) and make the DB\
      \ the only citation for whether a session is valid. Then the two stores can\
      \ never silently contradict."
