      output: "## Database Engineer — Contribution: Redis Fixed-TTL vs DB-Validity\
        \ Session Expiry\n\n### Diagnosis (grounded in this codebase)\n\nTwo stores\
        \ coexist for the same logical session:\n\n- **DB (`interview_session`)**\
        \ — permanent, durable truth for `status`, `question_count`, `current_question_id`.\n\
        - **Redis (`interview:session:{id}`)** — a `SessionState` record via `InterviewStateStore`,\
        \ documented as \"单一权威来源\" (single source of truth) — `InterviewStateStore.java:15`.\n\
        \n```java\nprivate static final long TTL_HOURS = 24;                     \
        \  // :25\nredissonClient.getBucket(key(sessionId))\n        .set(json, TTL_HOURS,\
        \ TimeUnit.HOURS);                  // :51 every write\n```\n\n**Key facts\
        \ about the TTL behavior:**\n1. The TTL is **fixed (24h)** and only **re-armed\
        \ on `write()`**. `write()` runs on *state transitions only* — `create()`\
        \ (`:91`, `:116`), `answer()` (`:188`), `finishSession()` (`:345`). There\
        \ is **no refresh on read**, and no activity-based sliding window.\n2. Therefore\
        \ the key expires at `last_write_time + 24h` regardless of continued use.\
        \ A user who returns to a non-FINISHED session (DB fully valid) after an idle\
        \ gap > 24h hits a Redis miss.\n\n**Important nuance:** this codebase has\
        \ a self-healing fallback in `requireAsking()` (`InterviewService.java:380-399`):\n\
        \n```java\nif (state == null) {\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
        \    state = new SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId());\n\
        \    stateStore.write(sessionId, state);   // re-arms 24h, resumes silently\n\
        }\n```\n\nBecause the three `SessionState` fields are **fully mirrored in\
        \ the DB**, rehydration mostly reconstructs the cursor and the hard break\
        \ is *masked* for the common single-action resume.\n\n### When and why continuation\
        \ actually breaks\n\n**Break 1 — Silent expiry between two answers of a slow,\
        \ ongoing conversation (the headline case).**\nSince TTL is fixed at 24h and\
        \ re-armed only on writes, an active-but-slow session (e.g., user answers\
        \ every 20–30h) expires *between answers*. The `requireAsking` fallback rehydrates\
        \ it — so this specific codebase **masks** it. The problem is the fallback\
        \ is an *incidental* behavior, not a designed contract: it silently continues\
        \ with **zero observability**. \"Silent expiration\" still happens; the app\
        \ just hides it. There is no log, no metric, no distinction between \"fresh\
        \ state\" and \"reconstructed from DB.\"\n\n**Break 2 — Divergence is frozen\
        \ and resurrected on expiry (rewind).**\nThe dual-write is non-atomic (`stateStore.write`\
        \ + `sessionMapper.updateById` in separate calls, e.g. `:111-117`, `:183-189`).\
        \ If a transition updates Redis but the DB update lags/fails (or the MQ scoring\
        \ path at `:353-354` reorders), then on expiry the rehydration **loads whatever\
        \ the DB row last committed** — rolling the state machine backward to an older\
        \ `status/question_count`. The expired Redis value is discarded and an older\
        \ DB snapshot becomes the new truth, silently.\n\n**Break 3 — True hard break\
        \ once any Redis-only field is added.**\nToday `SessionState` (`status, questionCount,\
        \ currentQuestionId`) is a strict DB mirror, so rehydration works. But the\
        \ model is labeled \"single source of truth\" and *invites* Redis-only runtime\
        \ fields (LLM tool-call context, in-flight AI cursor, follow-up pointer, streaming\
        \ flags). The moment such a field exists, expiry drops it with **no DB column\
        \ to rehydrate from** — continuation genuinely breaks with no exception path;\
        \ the interviewer continues as if that context never existed.\n\n**Break 4\
        \ — State-machine error inversion from stale TTL freshness.**\n`requireAsking`\
        \ derives its decisions from the **Redis** state when present (`:391-397`:\
        \ FINISHED→`INTERVIEW_FINISHED`, ELSE non-ASKING→`INTERVIEW_STATE_ERROR`).\
        \ Redis may hold a *stale* value within its 24h window while the DB has moved\
        \ on (or vice-versa), producing a spurious `INTERVIEW_FINISHED` / `INTERVIEW_STATE_ERROR`\
        \ even though the DB says the session is resumable. Fixed TTL makes the freshness\
        \ of the authoritative cursor unpredictable.\n\n### Design options\n\n```\n\
        Option A — Sliding TTL (refresh on read)\n- Strengths: minimal change; active\
        \ sessions never expire mid-conversation; preserves Redis-first model.\n-\
        \ Weaknesses: Redis remains a source of truth → Break 2/4 (divergence/write-failure)\
        \ still unhandled; still hides expiry.\n- Best for: quick fix if you want\
        \ to keep the current architecture and just eliminate idle-cut deaths.\n\n\
        Option B — DB is truth, Redis is cache (formalize the existing fallback)\n\
        - Strengths: matches the reality that DB already mirrors all fields; kills\
        \ Break 3 structurally (no state exists only in Redis); expiry becomes recoverable-by-design,\
        \ not coincidence.\n- Weaknesses: needs discipline to never add Redis-only\
        \ authoritative fields; small rehydration cost on miss.\n- Best for: long-term\
        \ correctness; aligns with the existing `interview_session` columns + distributed\
        \ lock.\n\nOption C — Hybrid (recommended)\n- Strengths: sliding refresh +\
        \ cache-then-rehydrate + explicit logging; covers Break 1 (no idle cut), Break\
        \ 3 (no Redis-only truth), Break 4 (decide from DB truth) and adds observability.\n\
        - Weaknesses: slightly more code; must keep RBucket + lock usage coherent.\n\
        - Best for: this project given it already has both stores and a per-session\
        \ Redisson lock.\n```\n\n### Recommended implementation (Option C / grounded)\n\
        \n**1. Make the fallback explicit and always decide from DB truth** (`InterviewService.requireAsking`,\
        \ keep as-is but log the miss so \"silent\" expiry becomes visible):\n\n```java\n\
        if (state == null) {\n    log.warn(\"interview:{} state missing in Redis (likely\
        \ TTL expiry) - rehydrating from DB\", sessionId);\n    InterviewSession s\
        \ = sessionMapper.selectById(sessionId);\n    if (s == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
        \    state = new InterviewStateStore.SessionState(s.getStatus(), s.getQuestionCount(),\
        \ s.getCurrentQuestionId());\n    stateStore.write(sessionId, state);\n}\n\
        ```\n\n**2. Convert fixed TTL to sliding refresh on read** so active conversations\
        \ survive long idle gaps (`InterviewStateStore`):\n\n```java\npublic SessionState\
        \ read(Long sessionId) {\n    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \    String json = bucket.get();\n    if (json == null) return null;\n   \
        \ bucket.expire(Duration.ofHours(TTL_HOURS)); // sliding: refresh on every\
        \ read\n    // ... parse\n}\n```\n\n```java\n// make TTL configurable, not\
        \ a hardcoded 24h\n@Value(\"${interview.state-ttl-hours:24}\") long ttlHours;\n\
        ```\n\n**3. Prevent the \"rewind\" (Break 2) by making the transition single-writer\
        \ — it already is** via `lockFor(sessionId)` (`:361`). Add a **DB-powered\
        \ truth check inside the lock**: on rehydration, if DB status is `FINISHED`,\
        \ raise `INTERVIEW_FINISHED` (current code already does this). Do **not**\
        \ add Redis-only authoritative fields without a corresponding DB column.\n\
        \n**4. Observability + config:**\n```yaml\ninterview:\n  state-ttl-hours:\
        \ 24        # sliding, refreshed on read\n  rehydrate-on-miss: true    # fail-closed\
        \ vs self-heal; log warnings\n```\nAdd a Redisson key event / a simple metric\
        \ counting `rehydrate-on-miss` occurrences so silent expirations surface in\
        \ monitoring instead of being invisible.\n\n### Risks & mitigations\n- **Risk:**\
        \ sliding refresh on every read increases Redis writes slightly. *Mitigation:*\
        \ `expire` is a cheap single command; negligible for session-count workloads.\n\
        - **Risk:** if you choose a non-sliding long TTL, an idle-but-resumable session\
        \ still dies at the fixed mark. *Mitigation:* use sliding (Option A) or rely\
        \ on DB rehydration (Option B) — never cold-fixed TTL for an authoritative\
        \ live cursor.\n- **Risk:** JSON parse failure silently returns `null` (`InterviewStateStore.java:43-45`)\
        \ and now triggers a **rehydration** — treating corrupt data as \"expired\"\
        . *Mitigation:* log the corruption separately from a true miss, and consider\
        \ deleting the corrupted key rather than silently overwriting good DB truth.\n\
        \n### Bottom line for the lead\nWith the current mirrored schema the hard\
        \ break is *latent and masked by the `requireAsking` fallback*, not a guaranteed\
        \ fault. The genuine defects are: (1) no activity-sliding → guaranteed expiry\
        \ for sessions idle >24h; (2) the fallback is incidental → no logging/metrics,\
        \ so \"silent expiration\" is real but invisible; (3) the architecture invites\
        \ Redis-only state that would make continuation hard-break the moment it's\
        \ added. Fix by making DB the source of truth, turning TTL into a sliding\
        \ refresh, and adding explicit, observable rehydration — minimal change to\
        \ `InterviewStateStore.java:29-46,51` and one log line in `InterviewService.java:382-389`."
