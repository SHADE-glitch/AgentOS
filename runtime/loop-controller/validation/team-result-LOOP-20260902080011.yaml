      # Lead Agent — Final Result

      **Task:** Explain *when* and *why* continuation breaks when interview runtime
      state lives in Redis with a fixed TTL while the DB row stays valid.


      ## TL;DR

      Continuation breaks at the exact moment the Redis key disappears (TTL, restart,
      eviction) **and** the resume path treats Redis as the authority. It is a **dual-source-of-truth
      / liveness-mismatch** bug, not a TTL-value bug. Longer TTL only postpones it.


      ---


      ## 1. First, correct the TTL mental model


      In this codebase the write path is `bucket.set(key, json, TTL_HOURS=24, HOURS)`
      **on every write** (`InterviewStateStore.java:51`). That is a `SET k v EX 86400`
      **equivalent that resets the absolute expiry to "24h from now" on each write**
      — it is *not* "24h from session creation."


      Consequences:

      - An **actively written** session never expires.

      - A **paused** session dies silently after 24h of no writes.

      - `read()` does **no** sliding renewal (`EXPIRE`) — freshness is never bumped
      on read alone.


      The DB row `interview_session` (written via MyBatis, has `updated_at`, **no
      TTL**) and the Redis key have **two different liveness models over the same
      logical session**. That mismatch is the root cause.


      ## 2. When continuation breaks (concrete)


      | # | Trigger | Redis | DB | Continuation |

      |---|---------|-------|----|--------------|

      | A | **>24h inactivity** on an `ASKING` session, user resumes later | key expired
      (missing) | row valid, status `ASKING` | breaks unless a DB rebuild path exists
      |

      | B | **Redis restart / `FLUSHALL`** (single node, `appendonly no`) | all runtime
      keys gone | rows valid | mass null-fallback rebuild (reconstruction storm) |

      | C | **Memory eviction** under a `volatile-*` / `allkeys-*` policy | key evicted
      *early*, non-deterministically | rows valid | flaky, hits **even active** sessions
      |

      | D | **DB commit succeeded, Redis `write()` threw** (`:54`, no retry/compensation)
      | stale-but-present (older) | newer/advanced | `null`-fallback **not** triggered
      → duplicated `questionCount`, wrong `currentQuestionId` |

      | E | **`read()` returns `null` on JSON corruption** (`:42-45`) | present but
      unparsable | valid rows | treated as `null`; recoverable *only if* corruption
      is handled like missing |


      Deployment nuance: `docker-compose.yml` runs Redis `7-alpine` with **default
      `maxmemory-policy noeviction`**. So under the shipped config Redis OOMs on write
      rather than silently evicting — making **A** (idle TTL) and **B** (restart/flush)
      the real silent paths *today*. C only becomes live the moment anyone deploys
      an LRU/LFU policy.


      ## 3. Why it breaks — the authoritative-source contradiction


      `requireAsking()` (`:380-399`) reads Redis as authoritative and only consults
      the DB when Redis is **exactly `null`** (`:381-382`). The classdoc (`:15`) asserts
      "单一权威来源" (Redis). Three structural reasons this fails:


      1. **A lossless truth can''t be volatile.** The durable source is the DB; Redis
      is *permitted* (by its own TTL/volatility) to forget state the DB still owns.
      Declaring a layer authoritative while letting it silently drop data is a contract
      violation.


      2. **The fallback is correct today only by accident.** On `null` it reconstructs
      `currentQuestionId`/`questionCount` from `sessionMapper.selectById`. That is
      lossless **only because** the DB happens to be kept step-consistent right now.
      Any runtime-only state stored in Redis but not mirrored to DB (in-flight turns,
      unresolved question sets, streaming payloads) is unrecoverable — resume silently
      jumps to a mis-versioned point.


      3. **It checks presence, not freshness.** Missing ≠ stale. Case **D** slips
      through exactly because Redis is *present but old* — the DB has advanced past
      it, yet no null-guard fires.


      Framing for the DB engineer: this is a **dual-write consistency** problem dressed
      as a TTL problem. The DB is the only transactional, versioned truth; Redis is
      a hot projection. It is only safe if Redis is a **rebuildable cache**, never
      the **control-flow authority**.


      ## 4. Why the DB is the actual fix


      - The DB is the **only lossless reconstruction source**, but it is compared
      on *presence only*. There is no `version`/`updated_at` column checked, so **"DB
      advanced past Redis" is undetectable**. The fallback must trigger on *stale*,
      not just `null` (compare `redisVersion/updatedAt` vs `db.updated_at`).

      - The **dual write is non-atomic**: DB commit (`:186`) and Redis write (`:188`)
      are not one transaction. A Redis write failure after DB commit strands a stale
      key. Need a **compensation delete** on Redis-write failure (so the next read
      rebuilds fresh) or an **outbox / `@TransactionalEventListener(AFTER_COMMIT)`**
      handoff binding the Redis write to the DB transaction''s fate.

      - **Session-liveness truth belongs in the DB**, not in Redis eviction. "Abandoned
      sessions are closed" should be a DB sweep on `updated_at < now - maxIdle`, not
      a silently dropped Redis key. That gives one source of truth for liveness and
      makes the TTL purely a **memory cap**.


      ## 5. Recommendations (final decision)


      **DB = single source of truth; Redis = pure read-through cache (rebuild-on-miss).**
      Then TTL expiry, restart, flush, and eviction can only cost a cache miss — never
      correctness.


      1. Rewrite the `:15` contract: "Redis authoritative" → "DB authoritative; Redis
      cache."

      2. **Stale-aware fallback (the core fix).** Add `version`/`updated_at` to `interview_session`;
      rehydrate from DB whenever Redis is missing **or** `redisVersion < dbVersion`
      / `redisUpdatedAt < db.updatedAt`.

      3. **Sliding renewal** if Redis must remain a hot read: renew TTL on `read()`
      (`bucket.expire`) so an in-use session can''t die mid-question; keep a bounded
      absolute TTL purely to cap memory.

      4. **Atomicity/compensation:** keep DB→Redis ordering; on Redis write failure
      delete the now-stale key (next read rebuilds), and/or move the write behind
      an `AFTER_COMMIT` listener so a failed Redis write can''t strand `FINISHED`/scoring.

      5. **Ops hygiene:** choose `maxmemory-policy` explicitly (protect session keys
      rather than blanket LRU), alert on `expired_keys`/`evicted_keys`/low `keyspace_hits`,
      and **watch for reconstruction storms** — after a `FLUSHALL`/restart every active
      session rehits the DB fallback simultaneously (case B): a DB load spike to know
      about, not discover.


      ## 6. Validation plan

      - Unit: `requireAsking` with (a) Redis null + DB `ASKING` → recovers; (b) Redis
      **stale** (`count < DB`) → new assertion, recovers; (c) Redis == DB → no rehydrate;
      (d) DB `FINISHED` while Redis `ASKING` → DB wins; (e) Redis present but JSON-corrupt
      → recovers, no misread.

      - Ops: run a live session, `FLUSHALL`, resume → must continue seamlessly; simulate
      a Redis `write()` failure after DB commit → next read rebuilds without duplicated
      `questionCount`.


      **Bottom line:** the fixed 24h-on-write TTL expires after 24h of inactivity
      (or is wiped by restart/flush, or evicted early under a volatile policy) while
      the DB row stays valid. Synchronous answer/resume mostly self-heals today only
      because the `null`-fallback accidentally rebuilds from a DB that is step-consistent
      *right now*. The durable fix is **DB-as-truth + Redis-as-read-through with a
      stale-aware (`version`/`updated_at`) DB fallback** — not a longer TTL.'
