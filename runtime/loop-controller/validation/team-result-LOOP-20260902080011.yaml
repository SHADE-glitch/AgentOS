      output: "# Interview Session Continuation Breakage: Redis TTL vs. DB Validity\n\
        \n## 1. Problem Statement\n\nAn interview session's **runtime state** (current\
        \ step, partial answers, elapsed timers, token budget, in-flight transcript,\
        \ etc.) lives in Redis behind a **fixed TTL** (e.g. `SETEX session:<id> 1800\
        \ ...`). The **authoritative session record** lives in the relational DB and\
        \ is *not* time-limited the same way (e.g. `sessions` row + `answers`/`responses`\
        \ tables).\n\nBecause the DB row persists, the UI and API still *see* a valid\
        \ session. But the Redis key silently vanishes after the TTL. Any read path\
        \ that depends on Redis to reconstruct \"where the user was\" now falls back\
        \ to a stale or `MISS` state → continuation breaks.\n\n---\n\n## 2. When It\
        \ Breaks\n\nContinuation breaks when the read/write path assumes Redis is\
        \ the single source of truth for **runtime/progress**, and:\n\n- **State is\
        \ mutated only in Redis** and *not* persisted to the DB. Progress made after\
        \ the last DB flush (comments, partial drafts, current question index, UNSAFE-token\
        \ health) is lost. The user resumes at an old checkpoint or the start.\n-\
        \ **Redis returns `MISS` but the app does not gracefully degrade.** A `NULL`/error\
        \ bubbles up instead of falling back to the DB-derived baseline → 500, blank\
        \ screen, or \"session expired\".\n- **The expiry window is fixed per session**\
        \ but real sessions outlive it. Interviews with long thinking time, or paused/resumed\
        \ across the TTL, hit expiry mid-session *while the interview is still active\
        \ in the DB*.\n- **No sliding refresh.** A fixed TTL (not refreshed on access)\
        \ expires even for an actively-used session.\n\n### Concrete sequence\n```\n\
        t=0    start interview → DB row created + redis session:<id> set TTL=1800s\n\
        t=1500 user submits partial answer L1  → Redis updated  (DB NOT yet flushed)\n\
        t=1800 Redis key expires (fixed TTL, no touch)          → silent MISS\nt=1801\
        \ user hits \"resume\" → DB says session=ACTIVE,\n        but Redis state\
        \ (L1 partial) gone → resume falls back → data loss / error\n```\n\n---\n\n\
        ## 3. Why It Breaks (Root Causes)\n\n| Cause | Explanation |\n|---|---|\n\
        | **Fixed (absolute) TTL, not sliding** | No `touch`/refresh on each operation,\
        \ so an actively used session expires. |\n| **Redis holds the *only* copy\
        \ of runtime state** | Anything written only to Redis since the last DB sync\
        \ is lost; DB \"validity\" is misleading because it lags. |\n| **Two sources\
        \ of truth drift** | Redis = fresh runtime state; DB = authoritative but possibly\
        \ stale baseline. After expiry they diverge and the resume logic trusts the\
        \ wrong one. |\n| **No expiry notification** | App is not aware the key vanished;\
        \ key-space notifications absent, so no rehydration trigger. |\n| **TTL chosen\
        \ globally, not per-session** | A single constant can't match variable session\
        \ durations. |\n\n---\n\n## 4. Recommendations\n\n### 4.1 Make the TTL sliding\
        \ (cheapest, highest impact)\nRefresh on every access/write so active sessions\
        \ never expire, while idle ones still do.\n\n```python\n# Redis 6.2+\nredis.call(\"\
        SET\", key, value, \"KEEPTTL\")   # don't clobber TTL on write\n# refresh\
        \ sliding window on each use:\nredis.expire(KEY, SESSION_TTL_SECONDS)\n\n\
        # atomic form (Lua) on every read/write:\nlua = \"\"\"\nredis.call('SET',\
        \ KEYS[1], ARGV[1], 'EX', ARGV[2])\nreturn 1\n\"\"\"\n```\n\n### 4.2 Store\
        \ only *transient* state in Redis; persist the baseline to DB\nShift progress-critical\
        \ fields (current question, submitted answer) into the DB transactionally,\
        \ and treat Redis strictly as ephemeral cache/timing data.\n\n### 4.3 Cheap\
        \ Read-Through Baseline Pattern\n```\nsession:<id>  = <runtime snapshot> \
        \         (TTL-managed)\nsession:<id>:q = <question index>           (short-lived,\
        \ refreshable)\n```\nOn `MISS`, rehydrate from the DB row rather than erroring:\n\
        \n```python\nstate = redis.get(f\"session:{sid}\")\nif state is None:\n  \
        \  row = db.fetch(\"SELECT progress, current_q, answers FROM sessions WHERE\
        \ id=%s\", sid)\n    if not row:\n        return brand_new_session       \
        \   # truly new\n    return rehydrate_from_db(row)         # continue-from-baseline\
        \ (graceful)\n```\n\n### 4.4 Keyspace notifications to log/repair silent expiry\n\
        ```bash\nCONFIG SET notify-keyspace-events Ex\n```\nSubscribe to `__keyevent@0__:expired`\
        \ to detect expiry and either alert or lazily rehydrate on next touch.\n\n\
        ### 4.5 Choose TTL per session\n```python\nttl = max(SESSION_TTL, ITEM_TIMEOUT\
        \ + BUFFER)  # align to longest expected step\n```\nUse an idle/sliding TTL\
        \ that exceeds the max plausible gap between user actions, not a fixed absolute\
        \ one.\n\n### 4.6 Log a \"session expired\" signal\nExplicitly expire with\
        \ a sentinel value (`:expired`) so the app can distinguish \"never existed\"\
        \ vs \"expired with DB baseline\" — this is the key fix for *silent* breakage.\n\
        \n---\n\n## 5. Verification Plan\n1. Create a session; write Redis state;\
        \ **do not** persist; wait past TTL → confirm `MISS`.\n2. With 4.1, repeatedly\
        \ touch every ~30s past original TTL → confirm it survives (sliding works).\n\
        3. With 4.3, expire the key then resume → confirm graceful DB rehydrate, no\
        \ error.\n4. Confirm a genuinely idle session still expires (resource cleanup\
        \ preserved).\n\n**Bottom line:** continuation breaks whenever runtime state\
        \ is *exclusively* in Redis behind an absolute TTL, because DB validity and\
        \ Redis liveness diverge. Fix = sliding TTL + flushed baseline (DB) + read-through\
        \ rehydration on `MISS`."
