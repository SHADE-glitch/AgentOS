      output: "# Redis TTL vs. DB State: Interview Session Continuation Failure Analysis\n\
        \n**Role:** Database Engineer (supporting cross-domain focus: prompt-engineer)\n\
        **Deliverable:** For lead review — `team-18087af2`\n\n---\n\n## 1. Architecture\
        \ Context (two-tier session tiering)\n\nAn interview session has **two independent\
        \ stores** that must stay coherent:\n\n| Tier | Store | Content | Lifecycle\
        \ |\n|------|-------|---------|-----------|\n| **Fast path (runtime state)**\
        \ | Redis | current question index, in-flight answer buffer, per-question\
        \ checkpoint, distributed lock/lease, anti-double-submit token, throttle counters\
        \ | Ephemeral — governed by TTL |\n| **Source of truth (durable)** | RDBMS\
        \ (Postgres/etc.) | session row, status, aggregate answers, scoring, audit\
        \ trail | Permanent — valid until explicitly closed |\n\nThe design intent:\
        \ Redis is a **cache/working set**, the DB is the **durable record**. Continuation\
        \ depends on Redis still holding the runtime state. The moment Redis silently\
        \ drops it, the two tiers diverge.\n\n---\n\n## 2. When Continuation Breaks\n\
        \nContinuation breaks under the following conditions. All assume the DB row\
        \ is still `valid_until` / status `in_progress`.\n\n**A. Fixed absolute TTL\
        \ < realistic session duration (most common)**\nA fixed TTL (e.g. `EXPIRE\
        \ key 1800`) is **absolute-not-sliding** for the initial set unless refreshed.\
        \ If the interview legitimately runs longer than the TTL (long answers, a\
        \ paused break, media latency), Redis expires the state **while the user is\
        \ still actively working**.\n\n**B. Idle window shorter than user's pause**\n\
        Even a sliding/rolling TTL breaks if the fixed idle window (e.g. 20 min with\
        \ no key touch) is shorter than a user genuinely pauses (research, compose\
        \ long essay answer). The state silently expires during an otherwise-valid\
        \ session.\n\n**C. RB / memory-pressure eviction before TTL**\n`maxmemory-policy\
        \ allkeys-lru` / `allkeys-random` can evict the key **well before its TTL**\
        \ under contention — the key disappears with no expiration event you control.\n\
        \n**D. Absolute TTL + no sliding refresh after a long-running background operation**\n\
        If a server-side step (LLM scoring call, upload) holds the key open and never\
        \ refreshes the TTL, the key tunnels through zero.\n\n**E. Multi-node / same-session\
        \ access after failover**\nIf continuation logic requires a per-node in-memory\
        \ handle (e.g., a cached deserialized state object) plus Redis, a Redis failover\
        \ or re-election invalidates the handle while DB is fine.\n\n---\n\n## 3.\
        \ Why It Breaks (root cause)\n\nThe core defect is **assuming cache presence\
        \ == session existence**, and **treating \"key not found\" as \"session never\
        \ existed\"** instead of *\"session may exist but runtime state was lost.\"\
        *\n\nConcretely, the naïve read path:\n\n```\nGET session:{id}:runtime\n \
        \ → nil         (Redis) \nDB.SELECT session WHERE id = ?\n  → row exists,\
        \ status = 'in_progress'\n```\n\nAt this point the two facts conflict. The\
        \ code's typical — and catastrophic — default is to serve the Redis `nil`\
        \ as authority, returning `404 SessionNotFound`, discarding valid DB state.\
        \ Even when the code *does* check the DB, the loss of lock being released\
        \ causes:\n\n- **Lock/lease expiry** → two concurrent writes both pass the\
        \ guard → duplicated submission / partial writes to DB.\n- **Loss of cursor/checkpoint**\
        \ → restart at wrong question, or silent data loss of the in-flight answer\
        \ buffer that was **only** in Redis.\n- **Anti-double-submit token gone**\
        \ → duplicate requests accepted → duplicate DB records.\n\nSilent, because:\
        \ expiration raises no event, DB shows a healthy row, logs show nothing, and\
        \ the *first* user-visible signal is a confusing mid-session \"session expired\
        \ / not found.\"\n\n---\n\n## 4. Recommended Fixes (config + code)\n\n###\
        \ 4.1 Make TTL **sliding by default** and **lump-sum on business events**\n\
        Refresh on every meaningful touch (answer save, progress change, keepalive),\
        \ not a fixed absolute timer.\n\n```python\n# keepalive middleware — refresh\
        \ sliding TTL on verified session activity\ndef refresh_session(session_id:\
        \ str, ttl_s: int = 3600):\n    redis.expire(f\"session:{session_id}:runtime\"\
        , ttl_s)   # sliding, resets on use\n    redis.expire(f\"session:{session_id}:lock\"\
        ,    ttl_s)\n```\n\n### 4.2 Add an explicit **heartbeat / keepalive** from\
        \ the client\nThe client should (on a short timer far below TTL, e.g. 1/3\
        \ of TTL) ping the session endpoint so a *genuinely long* active session never\
        \ idles out.\n\n```\nclientHeartbeat --(every 90s)--> POST /api/interview/{sid}/heartbeat\n\
        \                                --> redis.expire(key, 3600)\n```\n\n### 4.3\
        \ Reconstruct-on-miss: distinguish *NotFound* from *Expired*\nNever return\
        \ 404 from Redis miss alone. Check DB: if DB row is `in_progress`, **rebuild\
        \ the runtime key idempotently** from DB snapshot and continue (resume), not\
        \ restart.\n\n```python\ndef load_session(session_id):\n    cached = redis.get(f\"\
        session:{session_id}:runtime\")\n    if cached:\n        return deserialize(cached)\n\
        \n    row = db.fetch_one(\"SELECT * FROM interview_session WHERE id=%s\",\
        \ session_id)\n    if not row:\n        raise NotFound(\"no such session\"\
        )          # true negative — 404 correct\n    if row.status != \"in_progress\"\
        :\n        raise SessionClosed(\"already submitted\")   # DB said done — do\
        \ not rebuild\n    # ---- HARD: DB valid but Redis empty -> RECONSTRUCT ----\n\
        \    state = rebuild_state_from_db(row)             # re-derive cursor, reset\
        \ lock with new token\n    redis.setex(f\"session:{session_id}:runtime\",\
        \ TTL, serialize(state))\n    redis.setex(f\"session:{session_id}:lock\",\
        \ TTL, fresh_token())\n    return state\n```\n\nKey correctness points in\
        \ reconstruction:\n- **Idempotent** — repeated rebuilds after repeated cache\
        \ drops must converge (store checkpoint in DB, `replayable_buffer`, `state_version`).\n\
        - **Always mint a fresh lock token + bump `state_version`** on rebuild so\
        \ any stale in-flight writer is rejected (optimistic concurrency).\n- **Surface\
        \ a soft \"resuming session\" notice** to the UI instead of pretending nothing\
        \ happened.\n\n### 4.4 Persist the *replayable* subset to DB, not only Redis\n\
        Anything that must survive a cache drop belongs in DB. Keep in Redis only\
        \ the **derivable/cheap** state. Persist to DB on every checkpoint (question\
        \ cursor, answer draft, submit guard). Redis becomes a pure perf layer; continuity\
        \ no longer depends on it.\n\n### 4.5 Locking: never let a lock TTL outlive\
        \ the operation it guards\nIf you must rely on Redis locks, make TTL generous,\
        \ add watchdog renewal, and make the DB write **idempotent** (unique key /\
        \ `WHERE status='in_progress'` guard) so a stale lock cannot corrupt data.\n\
        \n### 4.6 Eviction safety (config)\n```\nmaxmemory-policy noeviction     \
        \   # or volatile-ttl: never evict live session keys\nmaxmemory-samples high\n\
        ```\nSo active session keys are never silently evicted by memory pressure.\n\
        \n---\n\n## 5. Diagnostics to observe in production (for the incident root-cause)\n\
        \n- Redis `INFO stats`: `evicted_keys`, `expired_keys` — rising expired/evicted\
        \ counts correlated with session-drop complaints.\n- Redis `MAXMEMORY`/`maxmemory-policy`\
        \ audit.\n- `db.command((\"object\",\"idletime\",key))` / `ttl key` — confirm\
        \ whether keys are dying by eviction vs idle-expire.\n- Log ordering: check\
        \ whether Redis miss precedes any DB `in_progress` read (== silent-divergence\
        \ window).\n- Add an alert on the **divergence event** — DB says `in_progress`,\
        \ Redis says no key → healthy sessions being silently dropped.\n\n---\n\n\
        ## 6. Summary Decision Table\n\n| Trigger | Fix Ownership |\n|---------|---------------|\n\
        | Absolute TTL < long session | DB/Backend: sliding TTL + keepalive (4.1,\
        \ 4.2) |\n| Idle window vs. pause | DB/Backend: sensible idle + client keepalive\
        \ (4.2) |\n| Memory-priority eviction | Infra/DB: `noeviction`/`volatile-ttl`\
        \ (4.6) |\n| Redis miss + DB valid | Backend: reconstruct, separate NotFound\
        \ vs expired (4.3) |\n| Stale-lock corruption | DB: idempotent writes + fresh\
        \ lock on rebuild (4.4, 4.5) |\n\n**Bottom line:** continuation breaks because\
        \ Redis's fixed TTL lets the *runtime working set* silently drop while the\
        \ DB still owns a valid session, and the read path conflates *\"cache is empty\"\
        * with *\"session is gone.\"* Fix = sliding TTL + keepalive + idempotent DB-backed\
        \ reconstruction on miss + eviction-safe config.\n\n---\n\n*Awaiting lead\
        \ review; can produce schema DDL, idempotency keys, or lock/lease pseudo-code\
        \ for any subsection if desired.*"
