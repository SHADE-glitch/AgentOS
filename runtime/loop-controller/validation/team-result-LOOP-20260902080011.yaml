      output: 'Response for lead review written to `contribution-security-engineer.md`.
        Summary of the security engineering contribution:


        **Core security finding:** This isn''t just a consistency bug — it''s an **authorization
        state-confusion hazard**. `requireAsking()` uses Redis as control-flow authority
        (`:15` contract), while Redis is simultaneously permitted to silently lose
        state the DB still owns.


        **When it breaks (security view):**

        - On any path where an authz/integrity decision is read from Redis alone (A:
        TTL idle, B: restart/`FLUSHALL`, C: eviction mid-operand, D: stale-but-present,
        E: corrupt key).


        **Why it breaks:**

        1. Cache-miss semantics ("memory cap reached") are mistaken for authz semantics
        ("session over / re-authorize").

        2. Fallback keys on **presence (`null`), not freshness** → cannot distinguish
        *forgotten* from *forged/old*.

        3. **TOCTOU** between the Redis check and the DB commit → double-submit /
        detached authorization.

        4. Nonces/CSRF/anti-replay and abuse (rate-limit) counters share the session
        TTL → **fails-open** on replay, and expiry silently resets brute-force budgets.

        5. **Audit trail loss** — the evidence needed to reconstruct a replayed/double-submitted
        action vanishes with the key.


        **Recommendations:** DB authorizes, Redis only caches → every cache miss is
        **fail-closed re-validate-then-rehydrate**; separate TTL classes by security
        role (nonce = fail-closed; throttles not reset by expiry; session projection
        = sliding renewal); idle-reap via **documented, audited DB sweep** rather
        than silent expiry; stampede protection on rehydration; monitoring `expired_keys`/`evicted_keys`
        as security signals. I disagree with "just a longer TTL" for a rationale stated
        in code and config examples.


        Needs review for a design decision: on a stale-write conflict (D), the team
        must choose **raise vs. re-run-authz** — I recommend re-run-authz since auto-raise
        breaks long legitimate sessions.'
