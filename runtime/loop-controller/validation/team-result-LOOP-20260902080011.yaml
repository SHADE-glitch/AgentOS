      output: "## Database Engineer — Code Review: Redis Fixed-TTL Session State vs.\
        \ DB Validity\n\n### 1. Root Cause (why it breaks)\n\nThe failure is a **divergent-lifetime\
        \ problem** between two stores that are treated as one logical session:\n\n\
        - **Redis** holds *runtime/transient* interview state: current question index,\
        \ elapsed timer, tentative answers, step locks, in-flight tokens. It has a\
        \ **fixed TTL** (`EXPIRE` set once).\n- **DB** holds *authoritative/persistent*\
        \ state: the session row, interview definition, final/submitted results. It\
        \ has **no expiry** (or a far longer business TTL).\n\nNothing enforces that\
        \ `TTL_redis ≤ lifetime_db`. So the system silently moves into a state where\
        \ Redis evicts the key while the DB still reports the session as valid and\
        \ continue-able. Redis eviction is **silent**: there is no eviction callback\
        \ the DB layer sees, and a Redis `MISS` is indistinguishable from \"never\
        \ existed\" unless you code for it.\n\n### 2. When continuation breaks (trigger\
        \ conditions)\n\n| # | Condition | Mechanism |\n|---|-----------|-----------|\n\
        | 1 | **Fixed (non-sliding) TTL** | TTL is applied once (`EXPIRE key n`) and\
        \ never refreshed. Even an *active* user hits a hard wall-clock expiry. |\n\
        | 2 | **TTL < max session duration** | Interview is genuinely long (e.g.,\
        \ 30-min design/panel) but TTL is 10–15 min for memory hygiene. |\n| 3 | **Inactivity\
        \ gap at a boundary** | User is idle between questions (reading, taking notes)\
        \ longer than TTL. They return → key gone, DB still says \"in progress\".\
        \ |\n| 4 | **Client restart / tab close / network** | Client reconnects with\
        \ a saved `sessionId`. DB lookup succeeds (row exists), Redis lookup misses.\
        \ The resume/continuation path reads empty state. |\n| 5 | **Backend restart\
        \ / rebalancing** | If runtime state lives *only* in Redis and isn't rebuildable\
        \ from DB, any eviction or restart = irretrievable loss. |\n| 6 | **Multi-key\
        \ session partially evicts** | Related keys set with different TTLs (or background\
        \ eviction under `maxmemory`) — one key dies while siblings survive, leaving\
        \ an inconsistent snapshot. |\n\n### 3. The DB-engineer verdict on the state\
        \ model\n\nThe real defect: **Redis keys were made authoritative for state\
        \ they cannot guarantee**. Redis is a cache; session-continuation must tolerate\
        \ a cache miss as a normal event, not a failure. Two acceptable models:\n\n\
        - **(A) Redis = fully-rebuildable cache** of DB-sourced state (recommended).\
        \ A miss is a non-event: hydrate from DB, recommit. Redis TTL is then just\
        \ a hygiene knob, not a correctness contract.\n- **(B) Redis = source of truth\
        \ for transient state** — then you must *slide* the TTL and make the DB row\
        \ *wait* on the Redis-backed state, or persist a heartbeat/last-activity to\
        \ the DB and reconcile.\n\n### 4. Specific remediation steps\n\n**Step 1 —\
        \ Sliding TTL (refreshed on every access), not fixed.** Use `GETEX` (atomically\
        \ reads + resets TTL) or re-`EXPIRE` on each hit:\n\n```bash\n# write/hydrate\n\
        SET session:{id}:rt '{state}' EX <ttl>\n\n# on every read that must keep the\
        \ session alive: atomic get + reset\nGETEX session:{id}:rt EX <ttl>\n# or,\
        \ if you need to also mutate, use a Lua script so read+refresh+write is atomic\n\
        ```\n\nMaster/slave note: `GETEX` was added in Redis 6.2 — check your min\
        \ version; otherwise `GET` + `EXPIRE` is fine for a single-node/mutex-guarded\
        \ path.\n\n**Step 2 — Recommend a TTL bound that is provably safe.** Make\
        \ TTL a configuration derived from the *maximum* session length + grace:\n\
        \n```\nttl = max_allowed_session_duration + inactivity_grace\n```\n\nand document\
        \ the ordering constraint `ttl_redis ≥ max_session_lifetime` so DB rows never\
        \ outlive their runtime state.\n\n**Step 3 — Distinguish MISS from EXPIRED,\
        \ and reconcile against DB.** On miss, decide \"expired\" vs \"never-existed\"\
        \ by checking the DB row **before** deciding the session is dead:\n\n```\n\
        lookup(sessionId):\n  rt = redis.GETEX(key, EX=ttl)\n  if rt is null:\n  \
        \   row = db.sessions.fetch(sessionId)          # authoritative validity\n\
        \     if row is null or row.status == 'finished':\n         return 404 / 'session\
        \ ended'\n     rt = hydrate_from_db(row)                   # rebuild + re-write\
        \ to Redis\n     redis.SET(key, rt, EX=ttl)                  # re-arm lease\n\
        \     notify(observability)                       # count 'cache_rehydrations'\n\
        ```\n\nThis turns eviction into a normal recovery path, not a break.\n\n**Step\
        \ 4 — Make the transient state rebuildable (design constraint).** Any state\
        \ written only to Redis must be reconstructible from the DB (store the *last\
        \ checkpoint* / input pointer in the DB row). If a step-lock or in-flight\
        \ answer is truly ephemeral, push a checkpoint to a DB column or an outbox/append\
        \ log so `hydrate_from_db` can resume to the last durable point. This guarantees\
        \ continuity even after expiry *and* after restart.\n\n**Step 5 — Atomicity\
        \ / race safety.** If a background job or multi-step flow refreshes TTL while\
        \ a writer updates state, wrap in a Lua script so refresh+write is atomic\
        \ and no key is refreshed to a stale TTL or written to an evicted key:\n\n\
        ```lua\n-- KEYS[1]=session key, ARGV[1]=state, ARGV[2]=ttl\n-- read-refresh-guard:\
