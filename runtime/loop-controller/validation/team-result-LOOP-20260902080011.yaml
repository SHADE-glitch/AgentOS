        \n## 1. 目标 / Problem Framing\n\n- **Business goal:** Allow an in-progress\
        \ interview session to be resumed/continued after a pause, without losing\
        \ runtime state (current question, elapsed time, active test-case set, scoring\
        \ snapshot, LLM context, etc.).\n- **Current constraint:** Runtime state lives\
        \ in Redis with a **fixed TTL**; durable/authoritative data lives in the DB\
        \ and remains valid indefinitely.\n- **Failure symptom:** Session appears\
        \ resumable (DB row = `in_progress`) but actually cannot continue — Redis\
        \ key is `MISS`. The system either silently restarts the interview or errors\
        \ on the first read.\n- **Success criteria:** A deterministic, observable\
        \ boundary between \"resumable\" and \"not resumable\" that respects both\
        \ the Redis expiry and the DB truth.\n\n## 2. 问题判断 / Diagnosis\n\n**Root cause:**\
        \ There is a single, fixed TTL — an absolute `EXPIRE` at write time — that\
        \ governs Redis state. TTL semantics and DB semantics disagree, so the two\
        \ stores naturally drift apart. The DB says \"valid\" while Redis says \"\
        gone.\"\n\nKey properties of the fixed-TTL read/write model that cause this:\n\
        \n1. **Absolute expiry, not idle-based.** A fixed `EXPIRE` counts down from\
        \ the moment the key is *written/updated*. If the user pauses for a long time\
        \ but the key was written recently, Redis is still alive. If the user is actively\
        \ using the app but nothing touches this particular key (e.g., only the DB\
        \ row is updated on each event), Redis expires **in the middle of an active\
        \ session**.\n\n2. **No read/touch renewal.** Reads (`GET`/`HGET`) do **not**\
        \ extend the TTL (`redis-cli) — a read does not slide `ttl`). Only an explicit\
        \ write or `EXPIRE` refreshes it. So a \"keep reading the key to stay alive\"\
        \ assumption is wrong.\n\n3. **Silent deletion.** `key does not exist` returns\
        \ empty/`null`, indistinguishable from \"empty value.\" If code treats missing\
        \ as \"empty\" or falls back to defaults, the session silently degrades instead\
        \ of erroring.\n\n4. **App-level lock / active-session flag in DB is separate.**\
        \ The DB row stays `in_progress` because nothing deletes it when Redis expires.\
        \ The two stores are never reconciled.\n\n### When continuation breaks (deterministic\
        \ cases)\n\nLet `T_write` = last write, `TTL` = fixed lifetime, `now` = current\
        \ time.\n\n- **Hard break (guaranteed missing):** `now - T_write >= TTL`.\
        \ The key is gone, period. Any resume attempt fails.\n- **Break mid-session\
        \ despite recent activity:** Redis key was written once (or on a coarse cadence)\
        \ but the user's real activity only updates the DB. `now - T_write >= TTL`\
        \ while the DB says active → **unexpected** break during active use.\n- **Break\
        \ after long idle pause:** `now - T_write >= TTL` while the DB still says\
        \ `in_progress` → the \"expected\" case, but still silently broken because\
        \ nothing transitions the DB state.\n- **Race at the boundary:** a resume\
        \ `GET` just before expiry vs a background cleanup / GC thread → inconsistent\
        \ behavior.\n\n### Why it breaks (the mechanism)\n\n| Store | Validity model\
        \ | Consequence |\n|-------|----------------|-------------|\n| DB  | **Stateful**,\
        \ survives until explicitly changed | Says `in_progress` forever |\n| Redis\
        \ with fixed TTL | **Ephemeral**, absolute time-to-live from last write |\
        \ Vanishes on its own schedule |\n\nNothing coordinates the two. The resume\
        \ path trusts the DB (`if session.status == in_progress => resume`), then\
        \ finds no runtime state in Redis, and has no handling defined.\n\n## 3. 方案设计\
        \ / Design Options\n\n**Option A — Sliding (idle-based) TTL with touch-on-read**\n\
        Renew `EXPIRE` on every read AND write of the session key. TTL now means \"\
        idle timeout,\" matching the \"user paused too long\" mental model instead\
        \ of wall-clock age.\n- Strengths: matches user/model semantics; simple; active\
        \ sessions never unexpectedly die mid-use.\n- Weaknesses: every resume read\
        \ needs a `TOUCH`/`PEXPIRE` (round-trip and correct semantics); a long-running-but-quiet\
        \ session (e.g., waiting for an LLM to stream) still dies if it emits no key\
        \ activity.\n\n**Option B — Dual-write heartbeat: keep DB as source of truth,\
        \ Redis as disposable cache**\nStore only cheap/reconstructable data in Redis;\
        \ platform-valid state (question_id, timer_start, score) persists to the DB.\
        \ On resume, if Redis is `MISS`, **rehydrate** from DB instead of erroring.\n\
        - Strengths: Redis expiry never breaks continuation — it's a cache miss, not\
        \ a failure; DB is authoritative.\n- Weaknesses: must define a rehydration\
        \ mapping; a genuinely versioned runtime blob must be reconstructable from\
        \ DB rows.\n\n**Option C — Session-state machine with explicit transitions\
        \ (recommended)**\nIntroduce an explicit `session_status` lifecycle and make\
        \ Redis TTL the *driver* of the DB transition, not an independent clock.\n\
        \n```text\nin_progress --(idle > TTL)--> expired     --(user returns)--> in_progress\
        \ (rehydrate)\n                  |                                       \
        \ or  aborted\nin_progress --(completed/canceled)--> done/canceled\n```\n\n\
        The resume check becomes a **three-way decision**:\n\n```python\nstatus_db\
        \ = db.get_session_status(session_id)      # authoritative intent\nttl_redis\
        \ = redis.pttl(session_key)                 # ephemeral runtime state\n\n\
        if status_db in (\"in_progress\",):\n    if ttl_redis > 0:\n        # 1) healthy:\
        \ refresh sliding TTL and continue\n        redis.pexpire(session_key, SLIDING_TTL_MS)\n\
        \        runtime = redis.hgetall(session_key)\n        return runtime\n  \
        \  else:\n        # 2) Redis expired but DB still valid -> rehydrate or explicitly\
        \ abort\n        try:\n            runtime = rehydrate_from_db(session_id)\
        \         # Option B\n            redis.hset(session_key, mapping=runtime)\n\
        \            redis.pexpire(session_key, SLIDING_TTL_MS)\n            return\
        \ runtime\n        except NotRehydratable:\n            db.transition(session_id,\
        \ \"from\", \"in_progress\", \"to\", \"aborted\")\n            raise SessionExpired(session_id)\n\
        elif status_db in (\"done\", \"canceled\", \"aborted\"):\n    raise SessionFinished(session_id)\
        \ / return_past_result\n```\n\n**Decision — Recommended:** **Option C, hybrid\
        \ with B.**\n\nWhy it fits the constraints:\n- The DB remains the single source\
        \ of truth for *intent* (what should happen), while Redis stores *fast runtime*\
        \ state whose loss is recoverable.\n- It reconciles the two clocks by **piggybacking**\
        \ the Redis expiry onto a DB state transition — the expiry is no longer silent.\n\
        - Works whether or not full rehydration is possible: rehydrate when you can,\
        \ mark `aborted` when you can't, and surface a deterministic `SessionExpired`\
        \ instead of a silent reset.\n\nTrade-offs accepted / risks & mitigations:\n\
        \n| Risk | Mitigation |\n|------|-----------|\n| Rehydration of complex runtime\
        \ blob is lossy | Persist reconstructable fields (question_id, started_at,\
        \ elapsed_ms, answers, LLM context_id) at each milestone; treat non-reconstructable\
        \ blobs (scoring cache) as recomputable |\n| Sliding TTL needs a write on\
        \ each relevant action | Use `PEXPIRE` on every event that should refresh\
        \ the session (question answer, progress save); a background \"touch\" for\
        \ streaming wait times if needed |\n| Two sources could still drift if `pexpire`\
        \ and DB txn aren't atomic | Make the DB transition the single mutation driver;\
        \ do Redis refresh immediately *after* successful DB write (write-through),\
        \ and accept a short window resolved on next read |\n| Concurrent resumes\
        \ racing on rehydrate | Idempotent `SET key ... NX` on rehydrate, or a per-session\
        \ lock in redis/DB |\n\n## 4. 实施方案 / Concrete Implementation\n\n**Config (.env\
        \ / config):**\n```yaml\n# yaml\nsession:\n  redis_ttl_seconds: 1800     \
        \   # idle timeout = 30 min of no activity\n  sliding: true              \
        \    # touch/pexpire on read+write\n  rehydrate_on_expiry: true\n  abort_if_not_rehydratable:\
        \ true\n```\n\n**Redis write helper (atomic write + TTL in one call to avoid\
        \ a window):**\n```python\ndef save_session_state(session_id: str, data: dict)\
        \ -> None:\n    pipe = redis.pipeline()\n    pipe.delete(session_key(session_id))\
        \            # or hset on a hash to merge\n    pipe.hset(session_key(session_id),\
        \ mapping=data)\n    pipe.pexpire(session_key(session_id), SLIDING_TTL_MS)\n\
        \    pipe.execute()\n```\n\n**Resume path (see pseudocode in Option C above).**\
        \ Key detail: always `PEXPIRE` on a successful read (sliding semantics), and\
        \ never resolve `MISS` to a default empty runtime.\n\n**DB transition on terminal\
        \ read:**\n```python\n# idempotent state change, versioned/cas to avoid lost\
        \ updates\nrows = db.execute(\n    \"UPDATE interview_session SET status='aborted',\
        \ updated_at=now() \"\n    \"WHERE session_id=:sid AND status='in_progress'\"\
        ,\n    {\"sid\": session_id},\n)\n```\n\n**Monitoring / observability:** expose\
        \ a metric `session_resume{outcome=healthy|rehydrated|aborted|missing_unexpected}`\
        \ and alert on `aborted`/`missing_unexpected` spikes — that surfaces the previously-silent\
        \ breakages.\n\n## 5. 验证方式 / Validation\n\n- **Unit tests:** fixed-TTL vs\
        \ sliding-TTL boundary; resume read at `pttl == 0`; rehydrate path; non-rehydratable\
        \ → `aborted` transition.\n- **Clock-controlled integration test:** inject\
        \ a fake clock / use short TTLs (e.g., 2s), simulate \"idle past TTL,\" assert\
        \ the resume returns `SessionExpired` (or rehydrates) rather than silently\
        \ starting over.\n- **Race test:** concurrent resume requests → exactly one\
        \ rehydrate proceeds (idempotent `NX`), rest get consistent runtime.\n- **Expected\
        \ results:** no silent session restarts; DB state always transitions to `aborted`\
        \ when Redis is unrecoverable; at least one observable metric per resume outcome.\n\
        - **复盘建议:** add a periodic reconciliation job (scan `in_progress` sessions\
        \ whose last-mod is older than TTL and mark `expired/aborted`) so the DB never\
        \ permanently claims a resumable session that Redis has already dropped.\n\
        \n## TL;DR\n\nContinuation breaks because Redis uses an **absolute fixed TTL**\
        \ (silent, ephemeral clock) while the DB uses a **stateful valid-until-changed**\
        \ model, and nothing reconciles them. It breaks both on long idle pauses and\
        \ — worse — unpredictably **mid-session** if only the DB row is updated. Fix:\
        \ make the Redis TTL mean *idle timeout* (sliding, touch-on-read), make the\
        \ DB the source of truth for intent, and explicitly rehydrate from DB on expiry\
        \ or transition `in_progress → aborted`. Never treat a Redis `MISS` as an\
        \ empty session."
