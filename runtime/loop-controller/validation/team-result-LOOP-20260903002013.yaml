        ---


        ## Contribution — Redis session TTL expiry vs. durable DB: when and why continuation
        breaks


        ### TL;DR

        `stateStore.write()` (InterviewStateStore.java:56) does an **absolute** 24h
        TTL on every write:

        ```java

        redissonClient.getBucket(key(sessionId)).set(json, TTL_HOURS, TimeUnit.HOURS);

        ```

        TTL is refreshed **only on write, never on read**, so any session that goes
        idle ≥24h has its key evicted even though `interview_session` (durable Postgres)
        still shows `ASKING`. Because the state machine treats Redis as its "单一权威来源",
        Redis eviction and DB validity are driven by **two independent clocks with
        no aligned invariant**, so the two can silently diverge.


        ### Why the DB stays valid while Redis dies

        - `interview_session` / `interview_message` / `interview_result` are committed
        durably and never auto-purged; a row has no time-based killer.

        - Redis keys are **volatile** and subject to both your declared `EXPIRE` **and**
        the server''s `maxmemory-policy`. Under pressure, eviction can drop the session
        **before** the 24h TTL.

        - Result: you end up with a live, `ASKING` session in Postgres whose authoritative
        runtime state is deleted. "Continuation breaks" = the `answer()`/`answerStream()`
        paths have no runtime state to advance from.


        ### When continuation actually breaks (grounded in this code)

        1. **Idle drift past absolute TTL (primary).** Redis POV: key gone. DB POV:
        session alive, mid-interview. The user resumes, Redis gives `null`.

        2. **Eviction before TTL.** With a `volatile-lru`/`allkeys-lru` maxmemory
        policy, an active session can be evicted early `evicted_keys > 0`. Only `volatile-ttl`
        honors your setting.

        3. **Any reader that is not `requireAsking`.** Today every consumer funnels
        through `requireAsking`, and it **does** self-heal (InterviewService.java:341–349):
        on `read() == null` it reconstructs from DB and rewrites. So continuation
        survives *in this exact call path*. The break is **latent**: any future resume/list-job
        that calls `stateStore.read()` directly (as `detail()`-style flows or a scoring/resume
        daemon would) gets `null` and has no rebuild → NPE or a spurious "session
        not found", silently killing continuation.

        4. **Streaming (`answerStream`) holds the lock while the authoritative state
        may be gone.** The virtual thread''s `requireAsking` self-heals, but the reconstructed
        `questionCount`/`currentQuestionId` come from DB copies that are themselves
        written in a *different* (non-distributed) step than the Redis write — so
        there''s a narrow window where DB is stale and reconstruction duplicates a
        question. (Today `pickQuestion` dedups on `askedQuestionIds`, masking it.)


        ### Why "silent"

        - Redis `del` on TTL is atomic and indistinguishable from "never written"
        → no event, no log, no tombstone. The UI happily polls `detail()` against
        the durable DB and shows the interview as live, while the authoritative state
        is gone. Nothing screams.


        ### Recommendations


        **1. Sliding idle TTL instead of absolute TTL (core fix).** Use Redisson `RBucket.getAndExpire(...)`
        to atomically refresh on every read, so active sessions never expire and only
        genuinely idle ones do. If you need access + idle based expiry, move the state
        to an `RMapCache` which natively supports `maxIdleTime`:

        ```java

        // sliding: survives as long as it is read/written, expires only after maxIdle
        continuous idle

        RBucket<String> bucket = redissonClient.getBucket(key(sessionId));

        String json = bucket.getAndExpire(Duration.ofHours(24)); // 3.17+

        ```

        Keep the absolute write spring as a safety so a *never-read-again* session
        still frees memory.


        **2. Flip the authority: DB = system of record, Redis = cache/projection.**
        Change the comment''s claim: make the state machine read/write through DB
        as truth and treat Redis as an accelerator. Then TTL expiry is just a *cache
        miss → refill*, never a break — exactly the code already in `requireAsking`,
        promoted from "recovery path" to "default path". Have `readOrRecover()` be
        the *only* entry point all consumers use.


        **3. Tombstone/log expiry.** On the null path, log at WARN with sessionId
        and reconstitution provenance so "silent" becomes visible in metrics/dashboards
        (`interview.session.reconstituted`).


        **4. Redis server config.** Set `maxmemory-policy volatile-ttl`, keep `maxmemory`
        headroom, and monitor `INFO keyspace` `expired_keys`/`evicted_keys`. Add a
        `KEYSPACE`/`notify-keyspace-events Ex` hook so expiry of `interview:session:*`
        can trigger a lazy reconciliation job.


        **5. Version/updatedAt stamp to detect divergence.** Store `updatedAt` (or
        a monotonic `version`) in both Redis and DB; on reconstruct, compare and reject
        stale reconstruction rather than resurrecting a session that actually finished.
        This also closes the DB-vs-Redis non-distributed-write window.


        **6. Scanner job to keep in-progress sessions alive.** A scheduled sweeper
        that refreshes TTL for `interview_session.status IN (''START'',''ASKING'')`
        younger than the TTL keeps long, real human interviews moving even with light
        writes.


        **7. Tests (prove the fix, not just the hope).**

        - Parameterize `TTL_HOURS` (inject small TTL), sleep past it, assert `answer()`
        continues with no duplicate question.

        - Assert `FINISHED` stays terminal across expiry (reconstruction must not
        resurrect to `ASKING`).

        - Simulate eviction (`DEBUG OBJECT`/`RANDOMKEY` pressure) and assert read-after-expiry
        self-heals.

        - Test the direct-`stateStore.read()` consumer so a future resume endpoint
        can''t reintroduce the latent break.


        **Net:** the current implementation self-heals *only* inside `requireAsking`;
        the absolute TTL + volatile store means the system holds to a coincidental
        recoverability, not a designed one. Across the DB (durable truth) and Redis
        (volatile working set) you need a single salvageable authority, sliding TTL,
        and a documented reconstitution path used by every consumer.'
