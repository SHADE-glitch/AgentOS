      output: "## 1. 目标 / Problem framing\n\n**业务目标:** 面试会话的运行时状态（`status`、`questionCount`、`currentQuestionId`）稳定地支撑状态机在多次请求间连续推进；过期策略应可预期且不产生\"\
        会话看起来有效却无法继续\"的静默失效。\n\n**关键事实（来自代码）：**\n- `InterviewStateStore.write()` 每次写入都用\
        \ `set(json, 24h)` → 这是**滑动/idle TTL**，不是绝对 TTL。只要会话有活动（每次 `start`/`answer`\
        \ 都会写一次 Redis），TTL 会被反复重置，活跃会话永远不会过期。\n- 只有 3 处触发写 Redis：`start()` 初始写、`answer()`/`answerStream()`\
        \ 的\"下一题\"分支。用户处于中间（如读题未答题）时不会刷新 TTL。\n- `requireAsking()` 已内置**兜底恢复**：当 `stateStore.read()\
        \ == null` 时，回退读 MySQL `interview_session` 行重建 `SessionState` 并写回 Redis。\n\
        - Redis 与 MySQL 是**镜像双写**：`SessionState` 的 3 个字段全部存在 `interview_session` 表中（`status/question_count/current_question_id`）。\n\
        \n---\n\n## 2. 问题判断 / When & why continuation \"breaks\"\n\n### 核心结论\nRedis\
        \ TTL 过期**不是\"续接中断\"的直接原因**——因为有恢复路径，真正的 break 分三种，性质不同：\n\n| 场景 | 发生时机 |\
        \ 后果 |\n|---|---|---|\n| A. 静默复活 / 策略失效 | idle > 24h 后用户继续答题 | 恢复路径会用 DB 重建状态并**无限制续命**。24h\
        \ \"超时\"策略**从未实际生效**。 |\n| B. 陈旧恢复 / 数据分叉 | TTL 恰好落在同一次 `answer()` 的 `updateById`(186)\
        \ 与 `stateStore.write`(188) 之间（崩溃窗口） | DB `questionCount=N+1` 而 Redis `=N`\
        \ 或 Redis 已删 → 下次 `newCount` 重复/错位，继续时题目/计数漂移。 |\n| C. 真实中断（无恢复覆盖的读路径） | 任何不经\
        \ `requireAsking` 的读取 | 会话在\"详情/历史\"里仍显示有效，交互与展示不一致——“静默”。 |\n\n关键澄清：`requireAsking`\
        \ 的恢复路径把 `state == null` 视作\"可重建\"，从而使 **Redis TTL 变成纯缓存而非强制执行策略**。若产品预期是\"\
        超过 24h 会话自动失效/终止\"，当前实现**不满足**，且**无任何日志/告警**——这就是\"silent\"。\n\n### 根因\n1.\
        \ 真正的会话有效性判定来自 **MySQL（无 TTL、无 lastActivity）**，Redis TTL 只是缓存的惰性超时，二者职责错位。\n\
        2. `requireAsking` 的熔断条件只承认 `FINISHED`，不识别\"因超时过期\"——过期被当成\"缓存未命中\"而非\"会话终止事件\"\
        。\n3. 过期自我修复是**非幂等恢复**：恢复后立即 `write()` 重新设定 24h TTL，掩盖过期事实。\n\n---\n\n## 3.\
        \ 方案设计\n\n**方案 A — 由 DB 充当权威超时源（推荐）**\n给 `interview_session` 增加 `last_activity_at`（或复用\
        \ `updated_at`），校验/终止都以 DB 为准；Redis 过期只作为性能缓存。\n\n- 优点：单一权威、策略真正可执行、恢复动作幂等、天然覆盖多实例。\n\
        - 缺点：需一次迁移；空转查询仍打一次 DB。\n\n**方案 B — 把 Redis 过期视为\"终止事件\"**\n把 `state == null`\
        \ 且 DB 为 `ASKING/START` 且超 idle 阈值 → 视为会话超时，走 `finishSession` 并写一条超时日志，而不是静默重建。\n\
        \n- 优点：保留 Redis 单点加速；策略被强制执行。\n- 缺点：恢复语义被改写，需与\"进程重启缓存丢失\"区分——难区分两者。\n\n**方案\
        \ C — 仅强化监控（最小投入）**\n保留现状，只补：Redis 逐出（`evicted_keys`/`allkeys-lru`）、`expired_keys`、`state==null`\
        \ 命中率、恢复路径日志与告警。\n\n- 优点：零迁移。\n- 缺点：策略依旧不被强制执行，只能暴露问题不能修复。\n\n### 决策\n**推荐\
        \ A（短期）合并 C 的监控。** 理由：Redis 状态本就是 DB 的投影，把有效性判定放在有持久化的 DB 上才正确；恢复路径保留但改为\"\
        先比对 lastActivity，超时则按业务终止/报错\"。风险与缓解：\n- 空转查询 +1 次 DB → 用 `last_activity_at`\
        \ 上的索引 + 只在 `requireAsking` 的一处做，可接受。\n- 双写窗口仍可能瞬时不一致 → 见下实施步骤中的原子化建议。\n\n\
        ---\n\n## 4. 实施方案\n\n### 4.1 最小修复（消除 B：双写窗口 + 陈旧恢复）\n把 Redis 写挪到\"以 DB 提交成功为准\"\
        ，并让恢复基于 DB 快照原子构造：\n\n```java\n// InterviewStateStore: TTL 语义明确为 idle-based，而非\
        \ fixed\n/** 会话处于不活跃超过该时长即视为可终止（非强制，见 Service） */\npublic static final long\
        \ MAX_IDLE_HOURS = 24;\n```\n\n在 `answer()` 中保证追问来源一致 —— 恢复路径已通过 `sessionMapper`\
        \ 回源，问题只在崩溃窗口。建议在 `write` 失败时不抛出阻塞，而是降级为\"仅 DB 有效\"，让下次 `requireAsking` 恢复（幂等重建）：\n\
        \n```java\npublic void writeIfAbsentOrRenew(Long sessionId, SessionState state)\
        \ {\n    // 每次写都滑动 TTL，同时写 DB 由调用方负责\n}\n```\n\n实质要点：**保持\"Redis 可丢、DB 是真相\"\
        的不变量**，任何一处读状态都必须能通过 DB 重建。当前 `requireAsking` 已满足。\n\n### 4.2 强制执行超时（方案 A\
        \ 核心）\n在 `requireAsking` 恢复分支加入 DB 超时判定：\n\n```java\nprivate static final\
        \ long MAX_IDLE_HOURS = 24;\n\nprivate InterviewStateStore.SessionState requireAsking(Long\
        \ sessionId) {\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
        \    if (s == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
        \    InterviewStateStore.SessionState state = stateStore.read(sessionId);\n\
        \    if (state == null) {\n        state = new InterviewStateStore.SessionState(\n\
        \                s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId());\n\
        \        stateStore.write(sessionId, state); // 早点写，减小竞态面\n    }\n    if (isExpired(s))\
        \ {                       // 新增：DB 权威超时\n        log.warn(\"session idle expired,\
        \ sessionId={}\", sessionId);\n        finishSession(s, s.getStatus());  \
        \     // 或抛 INTERVIEW_FINISHED\n        throw new BizException(ResultCode.INTERVIEW_STATE_ERROR,\n\
        \            \"会话已超过允许的不活跃时限，请重新开始\");\n    }\n    // 后续状态校验同原文\n    ...\n\
        }\n```\n\n配套加 `last_activity_at` 到写路径（`start()` 与 `answer()` 内 `updateById`\
        \ 前刷新）。若不想迁移，可先用 `updated_at` 临时判定并把 `MAX_IDLE_HOURS` 与 Redis TTL 对齐。\n\n\
        ### 4.3 数据一致性（防 B）\n- `answer()` 中 186 与 188 之间崩溃 → 下个请求 `requireAsking` 读到\
        \ `state==null` 会按 DB 重建（DB 值正确），**前提是新问题未导致终态**。需确认终态分支（148/152/157 `finishSession`）不依赖\
        \ Redis 计数。\n- 建议统一 `questionCount/currentQuestionId` 的可信来源为 DB；恢复时**重新从 `message`\
        \ 表 count**，而不是信任可能陈旧的列：\n\n```java\n// 恢复时以消息表为准，消除镜像字段漂移\nselect count(*)\
        \ where session_id=? and kind='question';\n```\n\n---\n\n## 5. 验证方式\n\n| 检查\
        \ | 方法 | 预期 |\n|---|---|---|\n| idle 超时被终止 | Redis `flushdb` 后，idle>24h 的\
        \ ASKING 会话调 `answer()` | 返回超时业务错误/进入终态，而非静默续答 |\n| 无静默续命 | 上述场景打印 `idle expired`\
