        \ 不再漂移 |\n| 策略有效 | Redis 设小 TTL 压测活跃会话连答 | 活跃会话不触发超时 |\n| 监控 | 启 `allkeys-lru`/`maxmemory`\
        \ 后观察 `evicted_keys` | 告警覆盖，非静默 |\n\n**复盘建议**\n- 明确产品意图：以 Redis 过期为准（B）还是以\
