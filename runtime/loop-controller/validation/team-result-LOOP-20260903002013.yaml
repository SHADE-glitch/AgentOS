    output: "# Interview Continuation Breakdown: Redis Fixed-TTL Runtime State vs.\
      \ Durable DB\n\nAs lead on `team-18087af2` (domains: database, ai), I've synthesized\
      \ the backend/database analysis and folded in the security and code-review angles\
      \ (dependency/external-input risk, atomicity, observability). Full deliverable\
      \ below.\n\n---\n\n## TL;DR — Diagnosis\n\n**Continuation breaks when a wall-clock\
      \ (fixed) TTL on the Redis runtime-state key outlives the *real* lifetime of\
      \ an in-progress interview session, while the DB record still correctly reports\
      \ the session as valid.** Because Redis is being treated as the *authoritative*\
      \ source of the in-progress view rather than a rebuildable cache of the DB,\
      \ a missing/expired key is indistinguishable from \"session never started.\"\
      \ The app silently starts a new (or broken) session, no error is raised, and\
      \ nothing reconciles against the DB that still says the interview is valid.\
      \ This is a **lifecycle-strategy mismatch plus a source-of-truth misplacement**,\
      \ not a bug in Redis.\n\n---\n\n## 1. When continuation breaks (concrete scenarios)\n\
      \nAssumed model: an `interview` row in Postgres/MySQL holds durable truth (`id`,\
      \ `candidate_id`, `status='running'|'submitted'`, `valid_until` = long, e.g.\
      \ 7 days). Redis holds the *ephemeral runtime* view: current question index,\
      \ in-flight partial answers, timer/heartbeat, LLM conversation context, taken\
      \ keyed e.g. `session:{id}:runtime` with `EXPIRE ... 1800` (fixed 30 min).\n\
      \n| # | Scenario | Mechanism | Breaks? |\n|---|----------|-----------|---------|\n\
      | 1 | **Interview exceeds fixed TTL.** Take-home / long-answer interview legitimately\
      \ lasts > 30 min. Fixed TTL's absolute deadline passes while DB `status='running'`,\
      \ `valid_until` far away. | Fixed TTL is wall-clock from `SET`; DB lifecycle\
      \ is data-driven. | ✅ |\n| 2 | **No rolling refresh on all events.** TTL only\
      \ refreshed on \"submit answer,\" not on \"left editor open,\" \"pasted text,\"\
      \ \"paused timer.\" Candidate thinks for 40 min in one step → expires even though\
      \ DB is fine. | Refresh gap — activity doesn't restart deadline. | ✅ |\n| 3\
      \ | **Async/scheduled steps exceed TTL.** State advanced by a background/LLM\
      \ job that takes > TTL; when it finishes and the resume path runs, key is gone.\
      \ | Long-running async gap longer than TTL. | ✅ |\n| 4 | **Valid long idle.**\
      \ Session has a 2-hour no-time-limit window; 30-min fixed TTL kills it mid-window.\
      \ | TTL not derived from business (allowed-idle) rules. | ✅ |\n| 5 | **Multi-key\
      \ sessions.** Runtime split across several keys (`:state`, `:context`, `:timer`),\
      \ only one refreshed → partial expiry → inconsistent resume. | Uneven refresh\
      \ coverage. | ✅ |\n\nIn every case the durable row is untouched and valid —\
      \ hence \"silently expire while the DB remains valid.\"\n\n---\n\n## 2. Why\
      \ it breaks — the mechanism\n\n### 2.1 Fixed TTL does not roll\nWith `SETEX`\
      \ / `SET ... EX 1800`, the deadline is **creation time + 1800s**, period. If\
      \ nothing explicitly calls `EXPIRE` again, activity does not extend it. A *sliding*\
      \ TTL refreshes on every access; a *fixed* TTL does not. Contracting \"fixed\
      \ TTL\" while assuming activity keeps the session alive is the core logical\
      \ error.\n\n### 2.2 Redis is treated as source of truth (the real bug)\nThe\
      \ authoritative record is the DB, but the resume code path reads **Redis first\
      \ and returns whatever it finds**, never cross-checking the DB. So:\n\n```\n\
      GET session:{id}:runtime\n   → nil   (expired OR never existed — Redis can't\
      \ tell the difference)\n```\nLazy expiration means the key is only physically\
      \ removed on access; either way the read returns *absent*. The app has no way\
      \ to distinguish \"user never started\" from \"state expired,\" so it silently\
      \ re-inits or errors.\n\n### 2.3 Silent = observability gap\nNo metrics/logs\
      \ on cache miss for a DB-valid session; no keyspace-event hook; no reconciliation\
      \ job. Redis expiry is by design invisible to callers.\n\n### 2.4 Divergent\
      \ lifecycles\n- **Redis**: fixed wall-clock TTL (time-driven).\n- **DB**: `status`\
      \ + `valid_until` (business/data-driven).\nThese are two *different notions\
      \ of validity* that never get compared at resume time.\n\n---\n\n## 3. The fix:\
      \ Redis as a rebuildable overlay, DB as source of truth\n\n### Core principle\n\
      Continuation must never depend on Redis surviving. Redis may **accelerate**\
      \ the session view; it may not **decide** that a session died. If Redis misses\
      \ and the DB says the session is valid, **rebuild Redis from the DB** and continue.\n\
      \n### 3.1 Resilient resolver (Node / ioredis)\n\n```ts\n// OLD / broken pattern:\n\
      async function resumeRaw(sessionId) {\n  const state = await redis.get(`session:${sessionId}:runtime`);\
      \ // returns nil silently\n  if (!state) throw new SessionNotFoundError(); //\
      \ WRONG: treats expiry as \"never existed\"\n  return hydrate(JSON.parse(state));\n\
      }\n\n// NEW / resilient pattern:\nasync function resume(sessionId) {\n  const\
      \ cached = await redis.get(`session:${sessionId}:runtime`);\n  if (cached) return\
      \ hydrate(JSON.parse(cached));\n\n  // Cache miss. Ask the source of truth before\
      \ declaring death.\n  const row = await db.session.findUnique({ where: { id:\
      \ sessionId } });\n  if (!row || row.status === 'submitted' || row.valid_until\
      \ < new Date()) {\n    const log = { sessionId, miss: 'expired_or_unknown',\
      \ dbState: row?.status };\n    logger.warn('session unavailable', log);    \
      \        // observability!!\n    metrics.inc('session.cache_miss_for_message',\
      \ { recon: true });\n    throw new SessionUnavailableError(log);\n  }\n\n  //\
      \ DB says running → REBUILD the view from durable facts, then continue.\n  const\
      \ state = recomputeRuntime(row); // from answers/answers_progress/question_seq\n\
      \  await writeRuntime(sessionId, state, TTL); // re-warm cache\n  metrics.inc('session.rebuilt_from_db');\n\
      \  return hydrate(state);\n}\n```\n\n### 3.2 Aligned TTL policy — choose sliding\
      \ + business cap\n\n```ts\nasync function onUserActivity(sessionId) {\n  const\
      \ pipe = redis.multi();\n  pipe.set(`session:${sessionId}:ticks`, Date.now());\n\
      \  // Sliding refresh: activity restarts the deadline.\n  pipe.expire(`session:${sessionId}:runtime`,\
      \ SLIDING_IDLE_TTL); // e.g. 30 min idle\n  pipe.expire(`session:${sessionId}:ticks`,\
      \ SLIDING_IDLE_TTL);\n  await pipe.exec();\n}\n```\n- If you truly need \"no-time-limit,\"\
      \ **do not** give active sessions a small TTL. Use a **long idle-based TTL**\
      \ only for garbage collection (e.g. 30 days no activity → delete), not for validity.\n\
      - Do the refresh via a **Lua script or transaction/MULTI** so the read-modify-expire\
      \ is atomic (avoids two clients racing to expire/refresh).\n\n### 3.3 Expiry\
      \ observability (optional, non-critical)\nForward, not handling-critical — use\
      \ for metrics/alerts only:\n```\nCONFIG SET notify-keyspace-events Ex    # 'E'\
      \ keyevent, 'x' expired\n```\nSubscribe to `__keyevent@0__:expired` → log session\
      \ that expired while DB valid → alert divergence. **Never** put recovery logic\
      \ in this callback (delivery is not guaranteed).\n\n---\n\n## 4. Trade-off /\
      \ decision framework\n\n```text\nOption A  Rebuild runtime from DB on cache\
      \ miss (recommended)\n  Strengths: continuation is crash-proof vs. Redis; Redis\
      \ stays a cache; single source of truth.\n  Weaknesses: DB is on the hot resume\
      \ path on miss; need replayable durable state.\n  Best for: correctness-first\
      \ interview products, long/hybrid sessions.\n\nOption B  Sliding TTL only, no\
      \ rebuild\n  Strengths: simplest, least code.\n  Weaknesses: Redis still authoritative-ish;\
      \ a crash/eviction still breaks; no true durability.\n  Best for: low-stakes\
      \ ephemeral sessions with short, hard time limits.\n\nOption C  All in-progress\
      \ state fully in DB; Redis purely for hot read\n  Strengths: strongest durability;\
      \ simplest mental model.\n  Weaknesses: higher DB write volume on every keystroke/core-scene\
      \ save.\n  Best for: small scale, or where replay isn't feasible in Redis.\n\
      \nDecision\n  Recommended: A (rebase recovery) with an idle-derived TTL (B)\
      \ as the cleanup policy — i.e. A + B combined.\n  Why: removes source-of-truth\
      \ misplacement (root cause) while keeping Redis a fast overlay.\n  Risks/mitigations:\
      \ DB peak on missed session → add per-session rebuild budget + metrics;\n  large\
      \ runtime payloads → store partials in DB blob, keep only small index in Redis.\n\
      ```\n\n---\n\n## 5. Security / review considerations (from support review)\n\
      \n- **Never put candidate answers or PII in the Redis key name / log payload.**\
      \ Key = `session:{uuid}` only; hydrate from DB, don't log full state.\n- Validate\
      \ that a cache miss path **cannot bypass authorization**: the resolver re-checks\
      \ DB status/ownership before rebuilding (we do).\n- Guard the `expired` keyevent\
      \ path — it's untrusted/pubsub; use it only for telemetry, never to mutate.\n\
      - Review the Lua refresh script for injection; pass keys/args properly (`KEYS/ARGV`),\
      \ never string-concatenate ids into script body.\n\n---\n\n## 6. Validation\n\
      \n1. **Unit:** mock Redis returning `null` for a DB `status='running'` row →\
      \ assert rebuild path runs and session resumes (regression test for this exact\
      \ bug).\n2. **Integration (time-based):** set a 5 s TTL, simulate idle > TTL,\
      \ then a mutate event → assert `EXPIRE` refreshed; simulate the async-job gap\
      \ → assert rebuild.\n3. **Chaos:** flush Redis (`FLUSHALL`) mid-session → resume\
      \ must succeed by rebuilding from DB.\n4. **Metrics:** confirm `session.rebuilt_from_db`\
      \ increments and no `SessionNotFoundError` reaches users.\n5. **Alert:** wire\
      \ a warning when a key expires whose DB row is still `running`.\n\n---\n\n##\
      \ 7. Bottom line\n\nContinuation breaks whenever **a fixed wall-clock TTL outlives\
      \ the genuine lifetime of the interview while the durable DB row stays valid**\
      \ — the common triggers are sessions longer than the TTL, idle time longer than\
      \ the TTL, and async steps spanning the TTL. The reason it fails *silently*\
      \ is that Redis is (incorrectly) the authority for \"am I mid-session,\" and\
      \ an expired read is handled identically to \"never started.\" **Root-cause\
      \ fix: demote Redis to a rebuildable cache, drive the resume path from the DB,\
      \ and use a sliding idle-based TTL purely for cleanup** — so the answer key\
      \ can be gone at any moment and continuation still works."
