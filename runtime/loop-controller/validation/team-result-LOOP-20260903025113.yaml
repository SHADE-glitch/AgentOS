        \ breaks **iff** `T_answer - T_lastWrite > 24h` (or Redis loss/corruption)\
        \ **and** the code treats `read()==null` as harmless cache miss. The DB fallback\
        \ without `message-count/age/version` validation **masks** the expiry, re-arms\
        \ TTL, and propagates drift to `newCount`. Fix by **validating DB parity before\
        \ accepting fallback** (count vs `interview_message`, age vs `startedAt`,\
        \ status transition), **making DB the truth + adding `updated_at/version`**,\
        \ and **making dual-write atomic/invalidated** — not by raising TTL.\n\n"
