    output: "# Redis TTL Expiry vs DB Truth — Interview Session Continuation Break\
      \ (DB Lead Analysis)\n\n**Team: team-18087af2 | Domains: database, ai | Support:\
      \ Security Engineer, Code Reviewer, Backend Architect**\n\n## 1. Executive Summary\n\
      \n`InterviewStateStore` is the interview state machine's *declared single authoritative\
      \ source* (`InterviewStateStore.java:15` comment: `单一权威来源`) but is backed by\
      \ **volatile Redis with `TTL_HOURS=24` fixed** (`InterviewStateStore.java:25`).\
      \ The durable MySQL `interview_session` row has **no TTL and no `updated_at`**\
      \ (`schema.sql:46-60`). After 24h of inactivity—or Redis eviction/crash—the\
      \ cache silently `null`s while the DB remains `ASKING`/`START` valid. `InterviewService.requireAsking()`\
      \ (`InterviewService.java:380-399`) **masks the drift by blind rehydration**\
      \ and continuation (`answer()`/`answerStream()`) derives `questionCount` from\
      \ the potentially stale rehydrated state. This is not a hypothetical cache-miss:\
      \ it is a **silent authority inversion**.\n\n## 2. Grounding Evidence\n\n| File\
      \ | Line | Pattern |\n|---|---|---|\n| `InterviewStateStore.java` | `15` | `Redis\
      \ is单一权威来源` — inversion: ephemeral store declared authoritative over durable\
      \ DB |\n| `InterviewStateStore.java` | `25` | `TTL_HOURS=24` fixed constant\
      \ |\n| `InterviewStateStore.java` | `34-46` | `read()` returns `null` if `bucket.get()==null`\
      \ *or* `objectMapper.readValue` throws ( `43-44` `log.warn` + `return null`\
      \ — parse corruption swallowed as miss) |\n| `InterviewStateStore.java` | `48-51`\
      \ | `write()` → `set(json, TTL_HOURS, HOURS)` — TTL reset on every write, no\
      \ version/timestamp stored in payload |\n| `InterviewStateStore.java` | `58-60`\
      \ | `delete()` exists, no TTL-awareness caller audit |\n| `InterviewService.java`\
      \ | `380-399` | `requireAsking()` fallback: `read()==null` → `selectById` →\
      \ `new SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId())`\
      \ → `stateStore.write()` blind re-cache 24h |\n| `InterviewService.java` | `129,204`\
      \ | `answer()`+`answerStream()` gate on `requireAsking()` |\n| `InterviewService.java`\
      \ | `179,254` | `int newCount = state.questionCount()+1` — continuation counter\
      \ derived from runtime state |\n| `InterviewService.java` | `188-189,263-264,345-346`\
      \ | Non-transactional dual-write: `sessionMapper.updateById(session)` then `stateStore.write()`\
      \ |\n| `InterviewSession.java` / `schema.sql` | `37-41` / `56-57` | Only `started_at`\
      \ + `finishedAt`, **no `updated_at`** — DB cannot assert freshness recency |\n\
      | `InterviewService.java` | `80-123` | `create()` dual-initial-write: DB insert\
      \ then 2x Redis writes (`START` then `ASKING` 1) — first TTL wasted |\n\nVerified\
      \ via direct read; no edits between arms per `benchmark-8.2.1.4/01-gold-set-derivation.md`.\n\
      \n## 3. When It Breaks — Timeline\n\n```\nT0 create(): DB row status=ASKING\
      \ question_count=1, Redis interview:session:{id}={ASKING,1,msgId} TTL=24h\n\
      T0+... each answer(): DB count++, Redis count++ + TTL reset to 24h\nT_n    \
      \  user pauses (e.g., leaves tab, mobile sleep, long interview)\nT_n+24h  Redis\
      \ RBucket expires → get() == null  [no event, no log above DEBUG, indistinguishable\
      \ from never-created]\nT_n+24h+ε user calls POST /answer or SSE answerStream():\n\
      \           requireAsking(): read()->null\n           → DB fallback load → status\
      \ still ASKING, count=N (durable)\n           → blind new SessionState(DB values)\
      \ → write() → re-arm 24h TTL\n           → if DB count already drifted from\
      \ Redis count (see §4.5) continuation uses wrong N\nT_n+...   if DB status had\
      \ moved to FINISHED by async scorer but Redis was ASKING, rehydrated ASKING\
      \ would be stale (inverse case)\n```\n\n**Trigger conditions:**\n1. **Normal\
      \ expiry:** No `write()` for 24h. Realistic: user starts interview day 1 evening,\
      \ returns day 2 evening + 1min → expired.\n2. **Redis LRU/eviction or restart/flush**:\
      \ volatile-lru or `maxmemory` or maintenance — faster than 24h.\n3. **Corrupt\
      \ JSON:** `objectMapper.writeValueAsString` succeeds once, later `readValue`\
      \ fails after model field rename → `catch→return null` indistinguishable from\
      \ expiry.\n4. **Concurrent dual-write divergence:** crash between `updateById`\
      \ and `set` leaves DB=N+1 vs Redis=N until TTL hides it, then rehydration copies\
      \ stale N back to Redis as truth.\n\n## 4. Why Continuation Breaks — 5 Root\
      \ Causes\n\n### G1 — Fixed TTL authoritative only while unexpired, expiry is\
      \ silent\n\n```java\n// InterviewStateStore.java:34-46\npublic SessionState\
      \ read(Long sessionId){\n  RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
      \  String json = bucket.get();\n  if(json==null) return null; // TTL expiry,\
      \ eviction, delete all collapse to null\n  try { return objectMapper.readValue(json,\
      \ SessionState.class); }\n  catch(Exception e){ log.warn(\"parse...\"); return\
      \ null; } // same null\n}\n```\nNo `remainTimeToLive`, no `isExists` distinction,\
      \ no metric. Caller cannot tell expired vs never-existed vs corrupt. `24h` is\
      \ not sliding-aware of DB validity: DB session lives indefinitely (no TTL, `deleted`\
      \ soft-delete only).\n\n**Code Reviewer flag:** Error branch swallows exception\
      \ as cache-miss — violates fail-loud principle; should emit `counter interview_state_parse_failures`.\n\
      \n### G2 — No freshness validation before use/rehydration\n\n`requireAsking()`:\n\
      ```java\n// InterviewService.java:380-399 (current)\nprivate SessionState requireAsking(Long\
      \ sessionId){\n  SessionState state = stateStore.read(sessionId);\n  if(state==null){\n\
      \    InterviewSession s = sessionMapper.selectById(sessionId);\n    if(s==null)\
      \ throw NOT_FOUND;\n    state = new SessionState(s.getStatus(), s.getQuestionCount(),\
      \ s.getCurrentQuestionId());\n    stateStore.write(sessionId, state); // blind\
      \ rehydrate + re-arm TTL\n  }\n  if(FINISHED.equals(state.status())) throw FINISHED;\n\
      \  if(!ASKING.equals(state.status()) && !START.equals(state.status())) throw\
      \ STATE_ERROR;\n  return state;\n}\n```\nChecks existence and coarse status\
      \ allowlist, but **no**:\n* `DB updated_at` vs `Redis write time` freshness,\n\
      * `SELECT COUNT(*) FROM interview_message WHERE session_id=? AND kind='question'`\
      \ vs `state.questionCount()` parity,\n* `currentQuestionId` existence in `interview_message.id`,\n\
      * session ownership already checked upstream but status transition validation\
      \ (`ASKING→FINISHED` monotonic) not re-asserted.\n\nBlind re-cache propagates\
      \ any DB drift for another 24h.\n\n**Security Engineer flag:** Silent rehydration\
      \ is an unauthenticated state reconstruction vector if `sessionId` is guessable;\
      \ no `started_at` recency check allows resurrection of days-old abandoned sessions\
      \ that UI considers expired.\n\n### G3 — DB fallback masks drift instead of\
      \ detecting it\n\nRehydration **resets TTL to 24h** (`write()` resets) and returns\
      \ success to caller. The system treats expiry recovery as harmless, so:\n* Drift\
      \ `questionCount` divergence is never logged as `WARN drift_detected`.\n* Subsequent\
      \ `answer()` proceeds with `state.questionCount()` that may be behind DB's `interview_message`\
      \ count or ahead (if Redis incremented but DB update lost).\n\nCorrect pattern:\
      \ fallback must **validate parity and either reconcile from DB truth or fail\
      \ with `INTERVIEW_STATE_EXPIRED` requiring explicit resume**.\n\n### G4 — Continuation\
      \ depends on potentially stale `questionCount`\n\n```java\n// InterviewService.java:179\
      \ (sync) & 254 (stream)\nint newCount = state.questionCount() + 1;\n...\nsession.setQuestionCount(newCount);\n\
      sessionMapper.updateById(session);\nstateStore.write(sessionId, new SessionState(ASKING.name(),\
      \ newCount, msg.getId()));\n```\n* If `state.questionCount()` was rehydrated\
      \ from stale DB snapshot (non-serializable read, or prior dual-write loss),\
      \ `newCount` is off-by-1, breaking `shouldFinish(qaPairs, MAX_QUESTIONS=6)`\
      \ gating — interview may run 7 questions or end at 5.\n* Ground-truth is `interview_message`\
      \ count, not either store's counter. Recommended: derive `newCount` from `messageMapper.countQuestion(sessionId)+1`\
      \ within the `interview:lock:{id}` (`lockFor()` already held).\n\n**Backend\
      \ Architect flag:** This is classic dual-counter drift; status is state machine,\
      \ `questionCount` must be derived, not stored redundantly.\n\n### G5 — Redis/DB\
      \ dual-write is non-transactional\n\nEvery state transition does:\n```\n1. sessionMapper.updateById(session)\
      \  // MySQL\n2. stateStore.write(sessionId, SessionState) // Redis set + TTL\n\
      ```\nNo `Transactional` covering both, no outbox. Failure between (1) and (2)\
      \ → DB says `questionCount=3` Redis says `2` until next `write()` or TTL expiry.\
      \ Under `RedissonClient` `RBucket.set` network partition, caller gets `BizException(\"\
      会话状态写入失败\")` after DB already committed — DB leads, cache lags.\n\nFailure window\
      \ is amplified because `write()` also arms TTL; a partial write prolongs stale\
      \ Redis as authoritative for 24h.\n\n## 5. Impact Matrix (drift modes)\n\n|\
      \ Drift | How induced | User-visible break |\n|---|---|---|\n| `questionCount`\
      \ -1 | DB update lost, Redis expired, rehydrate copies stale DB | Extra question\
      \ asked, `shouldFinish` off |\n| `questionCount` +1 | Redis write incremented\
      \ but DB rollback (lock timeout after Redis write) | Premature `FINISHED` |\n\
      | `currentQuestionId` stale | Rehydrate after message GC race | `detail()` shows\
      \ wrong active question, `extractQAPairs` mismatches |\n| `status` ASKING→FINISHED\
      \ missed | Async `RuleBasedScoringService` finished DB but Redis still ASKING\
      \ (not evicted) | User can re-answer finished session until Redis TTL or next\
      \ `requireAsking` rehydrates FINISHED (non-deterministic) |\n| Both null | Session\
      \ created >24h ago, user never started | `requireAsking` recreates ASKING from\
      \ DB START incorrectly |\n\n## 6. How to Reproduce / Detect\n\n1. **Unit:**\
      \ Mock `RedissonClient.getBucket().get()` → `null` after `set` with TTL, assert\
      \ `requireAsking` rehydrates without freshness check.\n2. **Integration:** `create()`\
      \ → `answer()` x1 → manually `redisson.getBucket(\"interview:session:\"+id).delete()`\
      \ → `answer()` → observe `stateStore.read==null` path, no drift warning.\n3.\
      \ **TTL force:** Set `TTL_HOURS=1` in test profile, `Thread.sleep(TTL)` or `expire(1,\
      \ SECONDS)`, re-call.\n4. **Monitoring:** Add `counter interview_state_fallback_total{reason=\"\
      miss|parse_fail\"}` on null-path, alert if >1% of `answer` calls.\n5. **Audit\
      \ query:** `SELECT s.id, s.question_count, (SELECT COUNT(*) FROM interview_message\
      \ m WHERE m.session_id=s.id AND m.kind='question') AS msg_cnt FROM interview_session\
      \ s WHERE s.question_count != msg_cnt;` non-zero = drift.\n\n## 7. Recommended\
      \ Fix (Coordinated)\n\n### DB (primary)\n\n* **Add `updated_at DATETIME NOT\
      \ NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP` to `interview_session`**\
      \ (`schema.sql:56-58` lacks it; `app_user`/`user_profile` already have it).\
      \ Freshness vector.\n* **Add `SessionState(updatedAt, messageMaxId)` or store\
      \ `RBucket.remainTimeToLive` check**: never trust cache without comparing `session.updated_at`.\n\
      \n```java\n// InterviewStateStore.java — payload carries wall-time\npublic record\
      \ SessionState(String status,int questionCount,Long currentQuestionId,Instant\
      \ updatedAt){}\npublic void write(...){ \n  String json=objectMapper.writeValueAsString(state);\n\
      \  bucket.set(json, TTL_HOURS, HOURS); \n}\n```\n\n```java\n// InterviewService.java\
      \ — validated rehydration\nprivate SessionState requireAsking(Long sessionId){\n\
      \  SessionState cached = stateStore.read(sessionId);\n  InterviewSession db\
      \ = sessionMapper.selectById(sessionId); // always load truth first\n  if(db==null)\
      \ throw NOT_FOUND;\n  if(FINISHED.name().equals(db.getStatus())) throw FINISHED;\
      \ // DB truth wins\n  if(cached==null){\n    log.warn(\"session_state_miss_rehydrate\
      \ session={} dbStatus={} dbCount={}\", sessionId, db.getStatus(), db.getQuestionCount());\n\
      \    // Reconcile: derive count from messages, not stale DB counter\n    int\
      \ trueCount = messageMapper.selectCount(Wrappers.<InterviewMessage>lambdaQuery()\n\
      \        .eq(InterviewMessage::getSessionId, sessionId).eq(InterviewMessage::getKind,\"\
      question\"));\n    if(trueCount != db.getQuestionCount()){\n      log.warn(\"\
      drift_reconcile session={} dbCount={} msgCount={}\", sessionId, db.getQuestionCount(),\
      \ trueCount);\n      db.setQuestionCount(trueCount); sessionMapper.updateById(db);\n\
      \    }\n    cached = new SessionState(db.getStatus(), trueCount, db.getCurrentQuestionId(),\
      \ Instant.now());\n    stateStore.write(sessionId, cached);\n    metrics.counter(\"\
      interview_state_fallback\",\"rehydrated\").increment();\n  } else {\n    //\
      \ Parity check even on hit\n    if(!cached.status().equals(db.getStatus()) ||\
      \ cached.questionCount()!=db.getQuestionCount()){\n      log.warn(\"drift_detected\
      \ session={} cache={} db={}\", sessionId, cached, db);\n      // Prefer DB truth,\
      \ overwrite cache\n      cached = new SessionState(db.getStatus(), db.getQuestionCount(),\
      \ db.getCurrentQuestionId(), Instant.now());\n      stateStore.write(sessionId,\
      \ cached);\n    }\n  }\n  // status gate on reconciled state\n  if(!ASKING.name().equals(cached.status())\
      \ && !START.name().equals(cached.status())) throw STATE_ERROR;\n  return cached;\n\
      }\n```\n\n* Derive `newCount` from DB truth within `interview:lock:{id}` (`LOCK_WAIT_SECONDS=5`\
      \ already protects):\n```java\nint newCount = messageMapper.selectCount(...\
      \ kind=question) + 1; // instead of state.questionCount()+1\n```\n\n### Redis\
      \ / Config\n\n* **Treat Redis as cache, not authoritative source.** Update comment\
      \ `InterviewStateStore.java:15`. Authority = DB + `interview_message` aggregate.\n\
      * **Keep 24h TTL but make it sliding validated TTL**: only `write()` after DB\
      \ commit succeeded; on `catch` log `CRITICAL` and don't swallow `BizException`\
      \ without DB rollback (consider `@Transactional` around `answer()` DB ops, Redis\
      \ write outside transaction but conditional).\n* **Enable TTL observability:**\
      \ `redisson.getBucket(k).remainTimeToLive()` metric, `notify-keyspace-events\
      \ Ex` if you need expiry callbacks for `interview:session:*`.\n* **Fix swallowed\
      \ parse failure:** `read()` should return special `CORRUPT` result and increment\
      \ failure counter, not `null`:\n```java\ncatch(Exception e){ log.error(\"parse...\"\
      ); metrics.counter(\"interview_state_parse_fail\").increment(); return null;\
      \ }\n```\nCorroborated by Code Reviewer: silent `null` conflates 3 failure modes.\n\
      \n### Backend Architect — Dual-write hardening\n\n* Wrap `sessionMapper` + `messageMapper`\
      \ updates in `@Transactional`; Redis write after commit (`TransactionSynchronization.afterCommit`).\n\
      * Alternative: outbox table + async reconciler for Redis; or use `RBucket.set`\
      \ with `try-catch` and on failure `stateStore.delete` to force fallback next\
      \ call rather than leave stale.\n\n### Operational\n\n* Dashboard `DashboardService.build()`\
      \ (`CACHE_TTL_MINUTES=10`) already fixed with `evict()` coverage on all 4 write\
      \ paths — keep that pattern as template for session state: **every write path\
      \ must `write()`/`evict()` and every read path must validate freshness**.\n\
      * Alert: `interview_state_fallback_rate > 5%` or `drift_detected >0`.\n\n##\
      \ 8. Summary for Benchmark\n\n* **Fixed 24h TTL + `read()->null` + swallowed\
      \ parse error** → silent expiry.\n* **`requireAsking` blind DB fallback + re-cache\
      \ 24h** → masks drift instead of detecting it (no `updated_at`/message-count\
      \ freshness).\n* **`answer`/`answerStream` `questionCount+1` derived from runtime\
      \ state** → continuation breaks on drift (off-by-one, wrong finish).\n* **Non-transactional\
      \ DB→Redis write** → divergence window prolonged by TTL.\n* **No `updated_at`\
      \ in DDL** → DB cannot prove recency.\n* **Redis-backed runtime state is not\
      \ authoritative after TTL expiry; validate freshness against DB truth before\
      \ continuing a session** (lesson vector). Fix = DB-as-truth with parity check,\
      \ derived count, transactional commit + post-commit cache write, observability.\n\
      \n**References:** `InterviewStateStore.java:15,25,34-46,48-56`; `InterviewService.java:125-194,197-281,380-399`;\
      \ `InterviewSession.java:37-41`; `schema.sql:46-60`; `backend/src/main/resources/application.yml:34-35`\
      \ (token TTL context shows similar expiry design but with refresh token — contrast\
      \ no refresh for interview state).\n\n"
