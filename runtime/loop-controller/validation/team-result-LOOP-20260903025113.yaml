      output: "# [SUPPORT] Redis Session Runtime-State Drift — Database Engineer Analysis\n\
        \n**Team:** `team-18087af2` | **Role:** Database Engineer (support: Security\
        \ Engineer, Code Reviewer, Backend Architect) | **Domain:** `database, ai`\
        \ **Task Type:** `debug`\n\n> **Scope:** `interview session runtime state\
        \ stored in Redis with fixed TTL can silently expire while DB remains valid;\
        \ explain when and why continuation breaks.` Verified against pinned working\
        \ tree `56788e5 + working edits`.\n\n---\n\n### 1. Executive Summary\n\n`InterviewStateStore.java:14-15`\
