        \ it, but `read()` fallback path does not surface soft-deleted sessions explicitly;\
        \ add check.\n*   **Correctness:** `InterviewStatus` has `WAITING_ANSWER/EVALUATING`\
        \ in `schema.sql:51` comment but `SessionState` only allows `ASKING/START/FINISHED`\
