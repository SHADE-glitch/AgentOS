        \ for another 24h without freshness/drift checks. `InterviewService.java:179,254`\
        \ `answer()/answerStream()` then derive `newCount = state.questionCount()+1`\
        \ from the (potentially drifted) state.\n\n**Result:** Redis is ephemeral\
        \ authority; MySQL `interview_session` is durable but incomplete (no `updated_at`).\
        \ After **24h of silence since last `write()`**, Redis vanishes, DB survives,\
        \ continuation either **resurrects a zombie**, **propagates stale `questionCount`/`status`**,\
        \ or **diverges via non-transactional dual-write**. Extending TTL treats the\
        \ symptom — the fix is **freshness validation + drift detection + DB-as-truth**\
        \ (`L` vector: verify DB parity before accepting fallback).\n\n> All hypotheses\
        \ `H-467`, `H-023/024/025/027` cited in the task are **UNVALIDATED (confidence=low,\
        \ 0.50)** — treated as suggestions, not rules. Findings below are derived\
        \ from direct `Read` of the working tree.\n\n### 2. Verified Grounding (no\
        \ hallucination)\n\n| Artifact | Evidence | Verdict |\n|---|---|---|\n| `backend/src/main/java/com/aiview/interview/service/InterviewStateStore.java:25`\
        \ | `private static final long TTL_HOURS = 24;` | Fixed TTL, reset on every\
        \ `write()` |\n| `InterviewStateStore.java:30-32` | `key() = \"interview:session:\"\
        +sessionId` | Per-session bucket |\n| `InterviewStateStore.java:34-46` | `bucket.get()\
        \ == null -> null`; `catch Exception -> log.warn + return null` | Silent expiry\
        \ + swallowed corrupt JSON |\n| `InterviewStateStore.java:48-56` | `getBucket(key).set(json,\
        \ TTL_HOURS, TimeUnit.HOURS)` | Sliding window, not absolute lifetime |\n\
        | `InterviewStateStore.java:58-60` | `delete()` exists | Must audit callers\
        \ — not used in `requireAsking` path |\n| `InterviewService.java:380-399`\
        \ | `read() null -> selectById -> new SessionState(status,questionCount,currentQuestionId)\
        \ -> write()` | Blind rehydrate, no validation, resets TTL |\n| `InterviewService.java:125-129,197-204,179,254`\
        \ | `requireAsking()` gates both `answer()` and `answerStream()`; `newCount`\
        \ derived from state | Continuation **depends** on volatile state |\n| `backend/src/main/java/com/aiview/interview/entity/InterviewSession.java:37-40`\
        \ | Only `startedAt`, `finishedAt` — **no `updated_at`**, no `version` | DB\
        \ cannot convey staleness (confirmed `backend/src/main/resources/db/schema.sql:46-60`)\
        \ |\n| `InterviewService.java:114,186,261,344` | `sessionMapper.updateById(session);\
        \ stateStore.write(...)` | **Dual-write non-transactional** (MySQL then Redis)\
        \ |\n\n**Contradiction fixed:** `schema.sql:8,20` has `updated_at` for `app_user`/`user_profile`,\
        \ but **`interview_session:46-60` has none** — prior reports that assumed\
        \ `updated_at` existence are false (`benchmark-8.2.1.4/Phase-8.2.1.4-Benchmark-Report.md:47`\
        \ warns of this hallucination). Do **not** recommend `WHERE updated_at > now-24h`\
        \ without a migration.\n\n### 3. When Continuation Breaks — Timeline\n\n```\n\
        T0    InterviewService.create(): DB insert status=ASKING count=1, Redis write\
        \ ASKING/1 TTL=24h\nT0+1h answer() #1: DB update count=2, Redis write ASKING/2\
        \ TTL reset -> 24h\nT0+25h No activity for 24h since last write -> Redis key\
        \ interview:session:{id} EXPIRES (silent, no event)\nT0+25h+ε User calls POST\
        \ /interview/{id}/answer :\n        requireAsking() -> read() == null (expiry)\n\
        \                       -> selectById() -> DB still ASKING/2 (valid, not expired)\n\
        \                       -> blind new SessionState(ASKING,2,msgId) -> write()\
        \ TTL=24h (resurrection)\n        -> proceeds, newCount = 2+1 =3 (looks correct,\
        \ but drift masked)\n```\n\n**Naive mental model vs reality:** TTL is not\
        \ \"24h after creation\" nor \"session timeout = 24h\". It is **24h of silence\
        \ since last `write()`**. Any inactivity window >24h triggers the path, regardless\
        \ of business timeout. Under load the bug is invisible; under **abandoned/paused\
        \ sessions, Redis eviction/memory pressure, rolling deploy (Redisson reconnect),\
        \ or `FLUSHDB`** it is 100% reproducible.\n\n**3 distinct break windows:**\n\
        \n1.  **Silent Expiry Window (most common):** User pauses overnight (e.g.,\
        \ `startedAt=Day1 22:00`, returns `Day3 08:00` = 34h gap). DB still `ASKING`,\
        \ Redis `null`. Fallback resurrects indefinitely → zombie session, business\
        \ timeout never enforced.\n2.  **Corrupt JSON Window:** `read() catch -> return\
        \ null` treats **poisoned cache** same as expiry → identical blind fallback,\
        \ no alert.\n3.  **Dual-Write Divergence Window:** `updateById` succeeds,\
        \ `set(bucket)` fails (Redis timeout, `BizException` swallowed at `InterviewStateStore.java:53-55`?\
        \ Actually rethrows, but `finishSession` continues). DB `count=3`, Redis still\
        \ `count=2` for up to 24h → `newCount` off-by-one, `currentQuestionId` stale,\
        \ user sees wrong question or `ASKING` after `FINISHED`.\n\n### 4. Why Continuation\
        \ Breaks — Gold Issues G1-G5\n\n**G1 — Fixed 24h TTL is authoritative only\
        \ while unexpired.** `write()` is sole TTL setter; reads never extend TTL.\
        \ Expiry yields silent `null`, not an exception. No `EXPIRE` notification\
        \ handling, no `RedissonConfig.java:22-28` persistence guarantee. Redis treated\
        \ as CP authority while actually AP/ephemeral.\n\n**G2 — No freshness validation\
        \ before use/rehydration.** `requireAsking():387-389` rehydrates from `sessionMapper.selectById`\
        \ without checking:\n*   `startedAt` age vs business SLA (e.g., max 48h interview,\
        \ should be `FINISHED`/`EXPIRED` not resurrected)\n*   `questionCount` vs\
        \ ground truth `SELECT COUNT(*) FROM interview_message WHERE session_id=?\
        \ AND kind='question'` (drift if dual-write lost)\n*   `currentQuestionId`\
        \ vs `MAX(id) FROM interview_message` (can point to deleted/old message)\n\
        *   No `version`/`updated_at`/`hash` comparison. DB has no column to compare,\
        \ so check is impossible without migration + message-table parity check.\n\
        \n**G3 — DB fallback masks drift instead of detecting it.** Blind `write(sessionId,\
        \ stateFromDB)` at `InterviewService.java:389` **re-arms expiry for another\
        \ 24h** and silences the incident. Correct behavior for drift detection would\
        \ be: `if (expired) { validateParity(); if (stale) throw INTERVIEW_STATE_ERROR\
        \ + audit; else rehydrateWithVersion }`. Current code **chooses availability\
        \ over consistency** with no log metric.\n\n**G4 — Continuation depends on\
        \ stale-load-bearing state.** `answer():179` and `answerStream():254` both\
        \ do `int newCount = state.questionCount()+1` then `session.setQuestionCount(newCount);\
        \ updateById; write(newCount)`. If `state` was drifted (G2/G3), `newCount`\
        \ is wrong, `MAX_QUESTIONS=6` gate (`evaluationService.shouldFinish`) may\
        \ never trigger or trigger early, and subsequent `pickQuestion` deduplication\
        \ (`askedQuestionIds` from messages) contradicts count.\n\n**G5 — Redis/DB\
        \ dual-write is non-transactional / no atomicity.** `create():114-117`, `answer():186-189`,\
        \ `finishSession():344-346` all do `DB update` → `Redis set` with no `@Transactional`\
        \ covering Redis, no Lua script, no outbox, no `RLock` covering the gap (lock\
        \ is per `answer()` call only, not across `requireAsking` read + fallback\
        \ write). Crash between DB commit and Redis set leaves window until fallback\
        \ next read.\n\n### 5. Database-Engineer Diagnosis\n\n**Schema gap:** `interview_session`\
        \ has `started_at`/`finished_at` only. With no `updated_at` or `optimistic_version`,\
        \ DB cannot answer \"is this DB row fresher than the expired cache?\" — fallback\
        \ is forced to trust stale row. `interview_message.created_at` is the only\
        \ monotonic clock, but `requireAsking` never queries it.\n\n**Freshness signal\
        \ missing:** Ideal invariant: `Redis state.version == DB version` or `Redis\
        \ state.messageCount == COUNT(messages)`. Currently `SessionState` is `(status,\
        \ questionCount, currentQuestionId)` — **no timestamp, no hash, no message\
        \ watermark**. Cannot detect drift.\n\n**Authority inversion:** Comment `InterviewStateStore.java:15`\
        \ says Redis is single authority while `InterviewService.requireOwnedSession`\
        \ and `sessionMapper` are durable. Security/consistency review: ephemeral\
        \ store must be **cache-aside**, not source of truth. Accept. DB parity check\
        \ is mandatory.\n\n### 6. Structured Verification Steps (for lead to reproduce)\n\
        \n```bash\n# 1. Static evidence (already verified via Read)\ngrep -n \"TTL_HOURS\\\
        |getBucket.*set\\|read()\" backend/src/main/java/com/aiview/interview/service/InterviewStateStore.java\n\
        grep -n \"requireAsking\\|questionCount()\" backend/src/main/java/com/aiview/interview/service/InterviewService.java\n\
        grep -n \"started_at\\|finished_at\\|updated_at\" backend/src/main/resources/db/schema.sql\n\
        \n# 2. Runtime drift matrix (testing-engineer handoff)\n# Case A: TTL expiry\
        \ -> fallback resurrects\n#   a) create session, answer once (count=1, TTL=24h)\n\
        #   b) redis-cli EXPIRE interview:session:{id} 1  OR debug DEL key\n#   c)\
        \ POST /interview/{id}/answer -> observe 200 with newCount=2 (should have\
        \ been 409/expired if business timeout)\n# Case B: Dual-write divergence\n\
        #   a) mock RedissonClient.getBucket().set() to throw after DB update\n# \
        \  b) answer() -> DB count=2, Redis count=1, subsequent read from Redis returns\
        \ stale 1\n# Case C: Corrupt JSON\n#   a) redis-cli SET interview:session:{id}\
        \ \"not-json\"\n#   b) answer() -> read() returns null (warn log), falls back,\
        \ no error metric\n\n# 3. Freshness audit query (DB truth)\nSELECT s.id, s.status,\
        \ s.question_count, s.current_question_id,\n       (SELECT COUNT(*) FROM interview_message\
        \ m WHERE m.session_id=s.id AND m.kind='question') AS msg_q_cnt,\n       (SELECT\
        \ MAX(id) FROM interview_message m WHERE m.session_id=s.id) AS max_msg_id,\n\
        \       TIMESTAMPDIFF(HOUR, s.started_at, NOW()) AS age_hours\nFROM interview_session\
        \ s WHERE s.id = ?;\n# If s.question_count != msg_q_cnt OR s.current_question_id\
        \ != max_msg_id -> drift.\n```\n\n### 7. Prioritized Recommendations (fix\
        \ root, not symptom)\n\n**P0 — Do NOT \"increase TTL to 72h/7d\".** That hides\
        \ expiry but preserves G2-G5 and expands zombie window. Lesson vector `L`\
        \ is freshness + drift detection.\n\n**P1 — Make DB source of truth, Redis\
        \ cache-aside with validation (inclusive of `G2+G3`):**\n\n```java\n// InterviewService.java:380\
        \ — replace blind fallback\nprivate SessionState requireAsking(Long sessionId)\
        \ {\n    SessionState cached = stateStore.read(sessionId);\n    if (cached\
        \ != null) {\n        // Optional: validate watermark before trusting cache\n\
        \        if (!isFresh(cached, sessionId)) { // check COUNT(*) parity, see\
        \ below\n            cached = null; // treat as miss, fall through to DB validation\n\
        \            log.warn(\"redis state stale sessionId={} cached={}\", sessionId,\
        \ cached);\n        } else return requireAskingStatusCheck(cached);\n    }\n\
        \    // Cache miss / stale — validate against DB truth before rehydrating\n\
        \    InterviewSession s = sessionMapper.selectById(sessionId);\n    if (s\
        \ == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n    //\
        \ --- freshness/drift detection ---\n    int actualQCount = messageMapper.selectCount(\n\
        \        new LambdaQueryWrapper<InterviewMessage>().eq(InterviewMessage::getSessionId,\
        \ sessionId)\n            .eq(InterviewMessage::getKind, \"question\"));\n\
        \    if (s.getQuestionCount() != actualQCount) {\n        log.error(\"drift\
        \ detected sessionId={} dbCount={} msgCount={}\", sessionId, s.getQuestionCount(),\
        \ actualQCount);\n        s.setQuestionCount(actualQCount); // reconcile to\
        \ durable truth, don't trust cached count\n        sessionMapper.updateById(s);\n\
        \    }\n    if (Duration.between(s.getStartedAt(), LocalDateTime.now()).toHours()\
        \ > 48) { // business SLA\n        s.setStatus(InterviewStatus.FINISHED.name());\
        \ // or EXPIRED\n        sessionMapper.updateById(s);\n        stateStore.delete(sessionId);\n\
        \        throw new BizException(ResultCode.INTERVIEW_FINISHED, \"会话已超时，请重新创建\"\
        );\n    }\n    SessionState rehydrated = new SessionState(s.getStatus(), s.getQuestionCount(),\
        \ s.getCurrentQuestionId());\n    // Optional: only re-cache if DB status\
        \ is still ASKING/START\n    if (InterviewStatus.ASKING.name().equals(s.getStatus()))\
        \ stateStore.write(sessionId, rehydrated);\n    return requireAskingStatusCheck(rehydrated);\n\
        }\n```\n\n**P2 — Schema migration (add staleness signal) — Database Engineer\
        \ core:**\n\n```sql\nALTER TABLE interview_session\n  ADD COLUMN updated_at\
        \ DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,\n\
        \  ADD COLUMN version BIGINT NOT NULL DEFAULT 0,\n  ADD INDEX idx_session_updated\
        \ (updated_at);\n-- Backfill: UPDATE interview_session SET updated_at = COALESCE(finished_at,\
        \ started_at)\n```\n\nThen `SessionState` adds `long version` / `Instant updatedAt`\
        \ and `write()` uses `SET ... NX` or Lua `if redisVersion < dbVersion then\
        \ set`.\n\n**P3 — Atomic dual-write (Backend Architect):** Wrap `sessionMapper.updateById\
        \ + stateStore.write` in transactional outbox or at minimum `RLock` + try/finally\
        \ with **DB-first, Redis-second, and on Redis failure delete cache** (cache-aside\
        \ invalidation) rather than leaving stale cache for 24h. Prefer:\n\n```java\n\
        sessionMapper.updateById(session);\ntry { stateStore.write(sessionId, state);\
        \ }\ncatch (Exception e) { redissonClient.getBucket(key(sessionId)).deleteAsync();\
        \ throw e; }\n```\n\nOr Lua: `EVAL \"if redis.call('get',KEYS[1])==ARGV[1]\
        \ then redis.call('set',KEYS[1],ARGV[2],'EX',86400) end\"`\n\n**P4 — TTL strategy\
        \ fix:** Keep 24h as **idle timeout** (sliding) + add **absolute max lifetime**\
        \ (e.g., 48h since `startedAt` enforced in DB, not Redis). Do not encode business\
        \ timeout in Redis TTL alone. Add Redis keyspace notification `notify-keyspace-events\
        \ Ex` only for observability, not for correctness.\n\n**P5 — Observability\
        \ & invalidation:** `read() catch` must not return `null` silently — emit\
        \ `interview_state_parse_failed_total` counter. Add `interview_state_redis_miss_total{reason=\"\
        expired|corrupt\"}` on `read()==null` path, and `drift_detected_total` on\
        \ parity mismatch.\n\n### 8. Configuration Recommendations\n\n*   `RedissonConfig.java:22-28`\
        \ — ensure `singleServerConfig` has `retryAttempts`, not `keepAlive` masking\
        \ expiry; document that Redis is **cache, not durable**.\n*   `application.yml`:\
        \ `app.interview.max-idle-hours: 24` (maps to Redis TTL) and `app.interview.max-session-hours:\
        \ 48` (maps to DB `startedAt` check) — separate concerns.\n*   Do not enable\
        \ `spring.cache` generic TTL for `interview:session:*`; keep explicit `TTL_HOURS`\
        \ constant co-located with `SessionState` schema.\n\n### 9. Code-Reviewer\
        \ / Security Notes\n\n*   **Threat:** Resurrected `ASKING` session after 24h+\
        \ allows replay of `answer()` with stale `questionCount`, bypassing `MAX_QUESTIONS`\
        \ guard. Not exploitable for privilege escalation but violates interview integrity.\n\
