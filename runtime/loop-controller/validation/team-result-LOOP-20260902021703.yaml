      output: "# Analysis: Redis Session TTL Runtime State Drift — Database Engineer\
        \ Report\n\n**Team:** team-576c9378 | **Role:** database-engineer | **Type:**\
        \ SUPPORT / analysis-only (no file modifications)\n**Scope:** Run 1 — `InterviewStateStore`\
        \ 24h TTL -> `InterviewService.requireAsking` DB fallback without freshness\
        \ validation\n\n## 1. Executive Summary\n\nConfirmed **state drift family**.\
        \ `interview_session` (MySQL/MyBatis, durable truth, no expiry) and `interview:session:{id}`\
        \ (Redis/Redisson `RBucket` with `TTL_HOURS=24`) diverge after TTL expiry.\
        \ The service treats Redis as authoritative state machine (`InterviewStateStore.java:15-16`)\
        \ but `InterviewStateStore.read()` returns `null` on miss (`34-39`) and `requireAsking()`\
        \ rehydrates silently from DB (`380-389`) with **zero freshness validation**,\
        \ then immediately re-caches the stale DB snapshot for another 24h. Result:\
        \ a valid `ASKING` session can either (a) be reanimated after 25h inactivity\
        \ and continue from a semantically stale point, or (b) revert to an older\
        \ `status/questionCount/currentQuestionId` if the last DB write failed while\
        \ Redis had advanced — appearing to “revert to wrong state”.\n\nNo data loss\
        \ observed; risk is **stale-continuation and counter/pointer drift**.\n\n\
        ## 2. Files Inspected (evidence-anchored)\n\n| Artifact | Location & Key Lines\
        \ | Finding |\n|---|---|---|\n| Runtime store | `backend/src/main/java/com/aiview/interview/service/InterviewStateStore.java:25,34-51`\
        \ | `TTL_HOURS=24` hard-coded; `write()` is `set(json,TTL, HOURS)` sliding\
        \ expiry; `read()` returns `null` on missing bucket or JSON parse failure;\
        \ no version/timestamp. |\n| Service state gate | `backend/src/main/java/com/aiview/interview/service/InterviewService.java:380-399`\
        \ | `requireAsking()` read+fallback+rehydrate pattern; `answer():129` and\
        \ `answerStream():204` both gate on it before accepting user answer. |\n|\
        \ Session lifecycle | `InterviewService.java:80-123 create()`, `125-195 answer()`,\
        \ `197-281 answerStream()`, `340-359 finishSession()` | Dual-write DB+Redis\
        \ non-atomic; `create()` writes START→ASKING; `answer()` increments `newCount\
        \ = state.questionCount()+1` (`179`, `254`) trusted from Redis. |\n| Status\
        \ enum | `backend/src/main/java/com/aiview/interview/service/InterviewStatus.java:7-22`\
        \ | 7 states (`START,SELECT_TOPIC,ASKING,WAITING_ANSWER,EVALUATING,FOLLOW_UP,FINISHED`);\
        \ only `START/ASKING` allowed to answer (`394-395`). |\n| DB truth | `backend/src/main/java/com/aiview/interview/entity/InterviewSession.java:14-44`\
        \ + `backend/src/main/resources/db/schema.sql:46-60` | `interview_session.status\
        \ VARCHAR(20) DEFAULT 'START'`, `current_question_id BIGINT`, `question_count\
        \ INT DEFAULT 0`, `started_at/finished_at DATETIME`. No `updated_at`, no `expires_at`,\
        \ no `version`. Index `idx_session_user_status(user_id,status)`. |\n\n## 3.\
        \ Architecture — Two Sources of Truth\n\n```\ninterview_session (MySQL)  \
        \              interview:session:{id} (Redis)\n  durable, never expires (deleted=logic)\
        \    ephemeral RBucket JSON, TTL 24h\n  updated via sessionMapper.updateById()\
        \    written via stateStore.write()\n  ┌─────────────────────────────────┐\
        \      ┌──────────────────────────┐\n  │ status/questionCount/currentQId │\
        \ <--- │ SessionState(status,      │\n  │ + interview_message history    \
        \ │ DB   │  questionCount,           │ rehydrated\n  │  (append-only)    \
        \              │ fallback │  currentQuestionId)  │ on miss\n  └─────────────────────────────────┘\
        \      └──────────────────────────┘\n         ▲                          \
        \                  │\n         └──────── answer()/finishSession ────────────┘\
        \ dual-write, no XA\n```\n\n`InterviewStateStore` comment (`15-16`) declares\
        \ Redis as “单一权威来源” — directly conflicts with DB being durable truth used\
        \ by fallback and dashboard aggregation. This authority inversion is the root\
        \ cause class (shared with `DashboardService.java:38,52-67` 10min dashboard\
        \ cache — different service, same family).\n\n## 4. Deep Dive — `requireAsking()`\
        \ Fallback Without Freshness Validation\n\n```java\n// InterviewService.java:380-399\n\
        private InterviewStateStore.SessionState requireAsking(Long sessionId) {\n\
        \    InterviewStateStore.SessionState state = stateStore.read(sessionId);\
        \ // InterviewStateStore.java:34\n    if (state == null) {\n        InterviewSession\
        \ s = sessionMapper.selectById(sessionId);       // DB fallback\n        if\
        \ (s == null) throw new BizException(INTERVIEW_NOT_FOUND);\n        state\
        \ = new SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId());\n\
        \        stateStore.write(sessionId, state);                             \
        \ // re-cache for +24h\n    }\n    if (FINISHED.equals(state.status())) throw\
        \ INTERVIEW_FINISHED;\n    if (!ASKING.equals(state.status()) && !START.equals(state.status()))\n\
        \        throw INTERVIEW_STATE_ERROR;\n    return state;\n}\n```\n\nDefects\
        \ from DB perspective:\n\n1.  **No temporal check.** Does not compare `s.getStartedAt()/finishedAt`\
        \ vs now, nor `interview_message.max(created_at)` vs TTL. A session `ASKING`\
        \ from 30 days ago is reanimated identically to one from 5 minutes ago.\n\
        2.  **No version/ordering check.** `questionCount` and `currentQuestionId`\
        \ are copied blindly. If the last DB `updateById` failed but Redis had advanced\
        \ (see §5), the fallback **reverts** Redis to the older DB values and extends\
        \ that stale snapshot another 24h.\n3.  **Lossy rehydration.** Redis JSON\
        \ parse failure (`InterviewStateStore.java:42-44`) also returns `null` → same\
        \ fallback path, masking corruption as “miss”.\n4.  **Status allowlist fragility.**\
        \ Only `START/ASKING` pass; any legacy/future status (`SELECT_TOPIC`, etc.)\
        \ in DB causes `INTERVIEW_STATE_ERROR` after TTL expiry even though Redis\
        \ previously allowed progress — “impossible to continue despite DB still recording\
        \ session”.\n\nBoth `answer():129` and `answerStream():204` rely exclusively\
        \ on this `state` for the critical `newCount = state.questionCount()+1` and\
        \ subsequent `questionCount/currentQuestionId` increments. `state` drift propagates\
        \ directly into next DB write (`183-189`, `258-264`).\n\n## 5. Dual-Write\
        \ Non-Atomicity — DB vs Redis Divergence Window\n\nAll mutations follow pattern:\n\
        \n```java\nsession.setStatus(ASKING); session.setCurrentQuestionId(msg.getId());\
        \ session.setQuestionCount(newCount);\nsessionMapper.updateById(session);\
        \               // DB\nstateStore.write(sessionId, new SessionState(...));\
        \ // Redis TTL 24h\n```\n\nNo transaction, no outbox, no compare-and-set.\
        \ Observed windows:\n\n* **T1:** `create()` inserts `START/0`, writes Redis\
        \ `START/0` (`91-92`), inserts `interview_message` question, updates DB to\
        \ `ASKING/1` (`111-114`), writes Redis `ASKING/1` (`116-117`). Crash between\
        \ DB update and second Redis write → **DB=ASKING/1, Redis=START/0** until\
        \ TTL expiry or next `requireAsking` read.\n* **T2:** `answer()` / `answerStream()`\
        \ → `saveUserMessage` (INSERT) → `updateById` → `write`. If DB update fails\
        \ (constraint, deadlock, transient) but Redis write succeeds, **Redis leads\
        \ DB by +1**. Next request before expiry uses Redis-lead state correctly;\
        \ after expiry it reverts to DB lagging value → duplicate `questionCount`,\
        \ skipped pointer, or “revert to wrong state”.\n* **T3:** `finishSession()`\
        \ DB `FINISHED` + Redis `FINISHED` (`340-346`). If DB succeeds but Redis evicted\
        \ early (Redis memory pressure, manual `DEL`), fallback correctly reconstructs\
        \ `FINISHED` and blocks answer — safe. Inversion (DB fail + Redis FINISHED)\
        \ is the dangerous case: user sees finished locally but DB still `ASKING`.\n\
        \nRedis `TTL_HOURS=24` is **sliding on every write** (`51`), not fixed since\
        \ creation, not extended on read. Quiet sessions expire deterministically\
        \ at `lastWrite + 24h`.\n\n`InterviewSession` has no `updated_at` column (`schema.sql:56-58`\
        \ only `started_at/finished_at`), so fallback cannot compute `staleness =\
        \ now - lastTransition` from session row alone — must join `interview_message`.\n\
        \n## 6. Failure Matrix (DB Engineer View)\n\n| # | Scenario | DB (`interview_session`)\
        \ | Redis (`interview:session:{id}`) | `requireAsking` Outcome | User-Visible\
        \ Symptom |\n|---|---|---|---|---|---|\n| **F1** | Idle >24h, normal sync\
        \ N | `ASKING N, currentQId=101` | **expired → null** | Rehydrates N/101,\
        \ re-caches +24h, allows answer | **Stale continuation** after 1 day; user\
        \ reappears to old question. `questionCount` correct but semantic session\
        \ should have timed out. |\n| **F2** | Last answer DB update failed, Redis\
        \ ok | `ASKING 3, QId=100` | `ASKING 4, QId=101` (lead) | Before expiry: uses\
        \ 4 (correct by Redis). After expiry: rehydrates 3/100 → **reverts**. Next\
        \ `newCount=4` reuses count, `currentQuestionId` points to prior message.\
        \ | Appears to revert to wrong state / duplicate question number. |\n| **F3**\
        \ | Manual/admin status or legacy status in DB | `SELECT_TOPIC` | `ASKING`\
        \ (pre-expiry) | Before expiry: passes. After expiry: rehydrates `SELECT_TOPIC`\
        \ → `INTERVIEW_STATE_ERROR` | **Impossible to continue** despite DB row existing.\
        \ |\n| **F4** | Corrupt Redis JSON (serialization change) | `ASKING 5` | `json={bad}`\
        \ → `read()==null` | Same as expired → rehydrate 5, mask corruption | Silent\
        \ recovery hides data issue; extends stale snapshot. |\n| **F5** | Finished\
        \ but Redis expired | `FINISHED, finishedAt=T` | `null` | Rehydrates `FINISHED`\
        \ → throws `INTERVIEW_FINISHED` | Correct — only safe case. Demonstrates fallback\
        \ accidentally correct for terminal state. |\n\nF1 is the benchmark’s primary\
        \ “First Unknown”; F2 is the “revert” variant; F3 mirrors real enum evolution\
        \ (`InterviewStatus.java:9-16` reserved states).\n\n## 7. Reproduction — TTL\
        \ Expiry Scenario (Steps for Verification)\n\nNo code change needed; reproduce\
        \ via Redis deletion simulating `TTL_HOURS` expiry:\n\n```bash\n# 1. Start\
        \ interview (API) -> capture sessionId\ncurl -X POST /api/interviews -d '{\"\
        topic\":\"Java\",\"level\":\"中级\"}' # -> {id:42, status:ASKING, questionCount:1,\
        \ currentQuestionId: 501}\n\n# 2. Verify DB truth\nmysql> SELECT id,status,question_count,current_question_id,started_at,finished_at\
        \ FROM interview_session WHERE id=42;\n# -> 42 | ASKING | 1 | 501 | 2026-09-02\
        \ 10:00:00 | NULL\nmysql> SELECT id,role,kind,knowledge_point_id FROM interview_message\
        \ WHERE session_id=42 ORDER BY id;\n# -> 501 | AI | question | 12\n\n# 3.\
        \ Verify Redis runtime\nredis-cli GET \"interview:session:42\"\n# -> {\"status\"\
        :\"ASKING\",\"questionCount\":1,\"currentQuestionId\":501}\nredis-cli TTL\
        \ \"interview:session:42\"\n# -> 86012  (~24h)\n\n# 4. Simulate TTL expiry\
        \ (or wait 24h / set short TTL in test)\nredis-cli DEL \"interview:session:42\"\
        \nredis-cli GET \"interview:session:42\"  # (nil)\n\n# 5a. Continue after\
        \ \"inactivity\" - should rehydrate from DB\ncurl -X POST /api/interviews/42/answer\
        \ -d '{\"answer\":\"my answer\"}'\n# Observed: 200 OK, new questionCount=2,\
        \ new QId=503 - session reanimated after 25h gap (F1) - no freshness error\n\
        # Expected with validation: 410 Gone / 400 \"session expired after inactivity\"\
        \ or require re-start.\n\n# 5b. Drift demo - inject DB lag to simulate dual-write\
        \ failure\nmysql> UPDATE interview_session SET question_count=1 WHERE id=42;\
        \ # simulate missed DB increment\nredis-cli SET \"interview:session:42\" '{\"\
        status\":\"ASKING\",\"questionCount\":2,\"currentQuestionId\":502}' EX 86400\n\
        redis-cli DEL \"interview:session:42\" # expire Redis lead\ncurl -X POST /api/interviews/42/answer\
        \ -d '{\"answer\":\"x\"}'\n# Observed: rehydrates questionCount=1 (DB lag)\
        \ -> next questionCount becomes 2 again (duplicate), currentQuestionId jumps\
        \ back\n# Compare: SELECT MAX(id) FROM interview_message WHERE session_id=42\
        \ => 502, but Redis now points to 501 stale\n```\n\n**Test matrix for testing-agent**\
        \ should include: `TTL miss → DB fallback`, `DB=FINISHED vs Redis=null`, `DB\
        \ update fail + Redis advance → expiry revert`, `corrupt JSON → fallback`,\
        \ `concurrent answer() with lock expiry vs TTL expiry`.\n\nInstrumentation:\
        \ log `stateStore.read()==null` fallback count metric; add `SELECT interview_session\
        \ + COUNT(interview_message WHERE kind='question')` parity check on rehydration.\n\
        \n## 8. Configuration & Schema Recommendations (analysis-only, not applied)\n\
        \n* **Make DB the authority, Redis a cache with validation:** On rehydrate,\
        \ enforce `if (Duration.between(session.getStartedAt(), now).toHours() > 24\
        \ || Duration.between(lastMessageTime, now).toHours() > 24) throw SESSION_EXPIRED`\
        \ rather than blindly re-caching. Add `interview_session.updated_at DATETIME\
        \ ON UPDATE CURRENT_TIMESTAMP` (currently only `app_user.updated_at` and `user_profile.updated_at`\
        \ have it) to compute `staleness = now - updated_at`.\n* **Persist `expires_at`\
        \ or `last_active_at` in `interview_session`** and set it on every transition;\
        \ align Redis TTL to `expires_at - now` instead of fixed 24h sliding. Allows\
        \ configurable per-phase TTL and DB-grounded expiry queries for cleanup jobs.\n\
        * **Add optimistic locking:** `version INT DEFAULT 0` + `UPDATE ... WHERE\
        \ version=?` + retry; write Redis only after DB success, or use transactional\
        \ outbox + CDC to Redis. Remove authority inversion comment (`InterviewStateStore.java:15`).\n\
        * **Atomic rehydrate:** On miss, rehydrate from `MAX(interview_message)` truth\
        \ not just `interview_session` counters: `SELECT COUNT(*) FROM interview_message\
        \ WHERE session_id=? AND kind='question'` and `SELECT id FROM interview_message\
