    output: "### [LEAD] Run 1 — Redis Session TTL Runtime State Drift — Analysis `team-576c9378`\n\
      \n**Lead:** `frontend-architect` | **Support:** `frontend-performance`, `testing-engineer`,\
      \ `code-reviewer`, `backend-architect`, `database-engineer`  \n**Constraint:**\
      \ Only analysis, no file modification (per task `do not modify files`)\n\n---\n\
      \n#### 1. Executive Summary\n\nValid `interview_session` (DB `status=ASKING`)\
      \ becomes impossible to continue or reverts after `~24h` inactivity. Root cause:\
      \ **Redis is documented as *单一权威来源* (`InterviewStateStore.java:15`) but is volatile\
      \ (24h TTL). `InterviewStateStore.read()` returns `null` on expiry (`:37-38`)\
      \ and `InterviewService.requireAsking()` (`:380-399`) silently resurrects state\
      \ from DB without freshness/validity checks. `answer()` (`:125`) and `answerStream()`\
      \ (`:197`) gate on this runtime state.**\n\nDB (`interview_session` `:46 schema.sql`)\
      \ persists; Redis drift is masked. Dual-write `DB + Redis` is non-transactional\
      \ → divergence.\n\n#### 2. Code Evidence (Ground Truth)\n\n| Component | Location\
      \ | Code |\n|-----------|----------|------|\n| **TTL Write** | `InterviewStateStore.java:25`\
      \ / `51` | `private static final long TTL_HOURS=24;` <br> `redissonClient.getBucket(key(sessionId)).set(json,\
      \ TTL_HOURS, TimeUnit.HOURS);` |\n| **Volatile Read** | `InterviewStateStore.java:34-39`\
      \ | `RBucket<String> bucket=getBucket(key(sessionId)); String json=bucket.get();\
      \ if(json==null) return null;` |\n| **Fallback w/o freshness** | `InterviewService.java:380-389`\
      \ | `SessionState state=stateStore.read(sessionId); if(state==null){ InterviewSession\
      \ s=sessionMapper.selectById(sessionId); state=new SessionState(s.getStatus(),\
      \ s.getQuestionCount(), s.getCurrentQuestionId()); stateStore.write(sessionId,\
      \ state); }` |\n| **Gate** | `InterviewService.java:129` / `204` | `InterviewStateStore.SessionState\
      \ state=requireAsking(sessionId);` before `saveUserMessage()` |\n| **DB Truth**\
      \ | `schema.sql:46` `InterviewSession.java:14` | `status VARCHAR(20) START/ASKING/FINISHED`,\
      \ `current_question_id`, `questionCount`, `startedAt`, `finishedAt`, no `lastActiveAt`\
      \ |\n| **Status Enum** | `InterviewStatus.java:7-22` | `START->ASKING->FINISHED`\
      \ (SELECT_TOPIC/WAITING_ANSWER reserve) |\n\nKey: `requireAsking()` validates\
      \ only `FINISHED` (`:391`) and `!ASKING && !START` (`:394`), **no** `startedAt`\
      \ age, no `updatedAt`, no message-log parity.\n\n#### 3. Architecture — DB vs\
      \ Redis Divergence\n\n```\nCreate: DB INSERT (START,0) -> Redis WRITE (START,0,24h)\
      \ -> DB UPDATE (ASKING,1,msgId) -> Redis WRITE (ASKING,1,msgId,24h) // dual-write,\
      \ no @Transactional\n\n             Redis interview:session:{id} [TTL 24h, sliding\
      \ on each write]  ←权威来源 (doc)\n                        ↕  divergence risk\n\
      \             MySQL interview_session [persistent, no TTL]                 \
      \ ←实际持久化\n             MySQL interview_message [append-only question/answer]\n\
      ```\n\n* `DB` never expires. `Redis` expires after `TTL_HOURS=24` from last\
      \ `write`.\n* `RedissonConfig.java:22-28` single-server Redis → eviction also\
      \ `null`.\n* `DashboardService.java:38` shows same family: `CACHE_TTL_MINUTES=10`\
      \ without `evict` (fixed in current `evict():81` but not for session).\n\n####\
      \ 4. `requireAsking()` Flow — Stale Transition\n\n```java\n// InterviewService.java:380\n\
      private SessionState requireAsking(Long sessionId){\n  SessionState state =\
      \ stateStore.read(sessionId); // null if TTL expiry\n  if(state==null){ // ←\
      \ fallback\n    InterviewSession s = sessionMapper.selectById(sessionId); //\
      \ DB truth\n    state = new SessionState(s.getStatus(), s.getQuestionCount(),\
      \ s.getCurrentQuestionId());\n    stateStore.write(sessionId, state); // resurrect\
      \ with fresh 24h TTL, no validation\n  }\n  if(FINISHED.equals(state.status()))\
      \ throw INTERVIEW_FINISHED; //2003\n  if(!ASKING && !START) throw INTERVIEW_STATE_ERROR;\
      \ //2002\n  return state;\n}\n```\n\n**Missing checks:** `s.getStartedAt()`\
      \ age >24h, `s.getFinishedAt()!=null`, `message` count vs `questionCount`, `currentQuestionId`\
      \ existence.\n\n#### 5. Drift Matrix (Reproduced by `testing-engineer` / `database-engineer`)\n\
      \n| # | Scenario | DB (`interview_session`) | Redis | `requireAsking` behavior\
      \ | User-visible failure |\n|---|----------|--------------------------|-------|--------------------------|----------------------|\n\
      | **F1 — TTL expiry normal** | Inactive >24h, `ASKING,1` | `ASKING,1,msgId`\
      \ persists | `null` → reconstructed `ASKING,1` + `write` | **Silent resurrection**.\
      \ If policy wants session timeout, user unexpectedly continues with stale context;\
      \ `questionCount` increments to 2 after 24h gap. |\n| **F2 — Crash between DB\
      \ & Redis** | `create()` DB updated to `ASKING,1` but Redis `write` not executed\
      \ (exception/crash) | `ASKING,1` | `START,0,null` (stale) | `state.questionCount()=0\
      \ → newCount=1` duplicate, `currentQuestionId` revert → wrong question replay.\
      \ **Revert to wrong state.** |\n| **F3 — Answer dual-write partial failure**\
      \ | `answer()` `DB questionCount=2` but `Redis write` throws `BizException:\
      \ INTERNAL_ERROR` (`Store:54`) after `sessionMapper.updateById` | `2` | `1`\
      \ (stale) | Next `answer()` reads `1 → newCount=2` again → duplicate/incorrect\
      \ progression. Non-idempotent. |\n| **F4 — FINISHED expiry** | `FINISHED` session,\
      \ Redis expired | `FINISHED` | `null→FINISHED` → throws `INTERVIEW_FINISHED`\
      \ | Correct by accident, but `finishSession:345` re-writes `FINISHED` with TTL\
      \ → resurrects finished session key for 24h unnecessarily. |\n| **F5 — Race\
      \ `answer` vs `answerStream`** | Concurrent `lockFor:361` `tryLock 5s` | DB\
      \ contended | Redis last writer wins | If one path falls back to DB while other\
      \ writes Redis, lock does not protect fallback `read→selectById→write` atomicity\
      \ → lost update. |\n\n> **Why “impossible to continue”**: If `F2` stale is `START`\
      \ but DB `currentQuestionId` points to prior AI question, `extractQAPairs()`\
      \ (`:325`) pairs stale history → `shouldFinish()` mis-evaluates. Or frontend\
      \ receives `INTERVIEW_STATE_ERROR` when Redis stale has unexpected status (`SELECT_TOPIC`\
      \ never used but allowed enum). In practice, `F2/F3` produce **apparent revert**;\
      \ `F1` with business expiry expectation produces **silent invalid continuation**.\n\
      \n#### 6. Reproduce TTL Expiry Scenario ( `testing-engineer` matrix)\n\n```bash\n\
      # 1. Create\nPOST /api/interviews {topic:\"Java\", level:\"中级\"} -> {id: 101,\
      \ status: ASKING, questionCount:1}\nGET redis:get interview:session:101 -> {\"\
      status\":\"ASKING\",\"questionCount\":1,\"currentQuestionId\":501} TTL 86400\n\
      \n# 2. Simulate 24h+ expiry (no sleep)\nredis:del interview:session:101  # or\
      \ expire 1 second\n# DB still: SELECT status,question_count FROM interview_session\
      \ WHERE id=101 -> ASKING,1\n\n# 3. Answer after inactivity\nPOST /api/interviews/101/answer\
      \ {content:\"...\"}\n# Server: stateStore.read(101)==null -> selectById -> new\
      \ SessionState(ASKING,1,501) -> write TTL 24h\n# -> saveUserMessage + questionCount+1\
      \ -> DB 2, Redis 2 -> appears ok but hides drift\n\n# 4. Drift proof (requires\
      \ partial failure):\n# Mock InterviewStateStore.write to throw on 2nd call,\
      \ then del key, then answer -> count revert 1\n```\n\n**Test matrix to include:**\
      \ `TTL expiry`, `DB fallback freshness`, `invalid transition (START→answer)`,\
      \ `FINISHED→answer (expect 2003)`, `concurrent answer/stream lock`, `dual-write\
      \ failure (mock Redis down)`, `message parity (DB messages vs Redis count)`.\n\
      \n**Frontend impact (`frontend-architect`):** `POST /answer` returns `2002/2003`\
      \ or stale `question` payload after 24h. UI shows interview resurrected at wrong\
      \ `currentQuestionId` (`toVO :434` filters by `currentQuestionId`) → blank current\
      \ question or repeated question.\n\n#### 7. Sub-Agent Findings\n\n*   **backend-architect:**\
      \ `InterviewService.create:89 lockFor → stateStore.write START → pickQuestion\
      \ → updateById ASKING → write ASKING` and `answer:183-189` `updateById → write`\
      \ are non-transactional; no `@Transactional`, no `Redisson` transaction. Redis\
      \ is authoritative per comment but DB is source for recovery → inverted authority.\n\
      *   **database-engineer:** `interview_session` lacks `updatedAt/lastActiveAt`;\
      \ cannot validate freshness after fallback. `interview_message` (`:71 FK`) is\
      \ append-only truth for `questionCount` but never cross-checked. `SELECT ...\
      \ WHERE id=` fallback ignores `deleted` logic (`InterviewSession:42 @TableLogic`)\
      \ but `selectById` respects it.\n*   **security-engineer:** Stale `START` resurrection\
      \ allows answering without valid `ASKING` progression; no ownership re-check\
      \ in `requireAsking` (relies on `requireOwnedSession` before it, but fallback\
      \ re-reads by `sessionId` only — if `sessionId` guessed, timing matters). No\
      \ rate-limit on resurrection.\n*   **code-reviewer:** No TTL refresh on `read`\
      \ (sliding only on `write`). No `try/catch` around fallback `write` (if Redis\
      \ down, `BizException INTERNAL_ERROR` bubbles, answer fails even though DB valid).\
      \ `answerStream` virtual thread (`:199`) holds `RLock` across DB I/O → lock\
      \ hold long.\n\n#### 8. Configuration / Design Recommendations (Analysis Only)\n\
      \n*   **Freshness validation in `requireAsking`:** Compare `s.getStartedAt()`/`s.getFinishedAt()`\
      \ or add `lastActiveAt` column; if `now - lastActive > 24h` → `throw SESSION_EXPIRED`\
      \ or force `FINISHED`. Cross-check `messageMapper.count(question)` vs `s.questionCount`.\n\
      *   **Make DB source-of-truth, Redis cache:** Remove “权威来源” assumption; validate\
      \ Redis `currentQuestionId` exists in `interview_message`.\n*   **Atomic dual-write:**\
      \ Add `@Transactional` on `create/answer/finishSession` and `try/finally` ordering:\
      \ write Redis *after* DB commit (or use `TransactionSynchronization`). On Redis\
      \ failure, log but don’t corrupt DB count; consider compensating delete.\n*\
      \   **Sliding TTL refresh:** On successful `read`, `bucket.expire(24h)` or `write`\
      \ on every `answer` (already) but also on `detail()` if policy wants keep-alive.\n\
      *   **Add version/optimistic lock:** `interview_session.version` to detect `F3`.\n\
      *   **Frontend:** Handle `INTERVIEW_FINISHED/STATE_ERROR` after inactivity with\
      \ “session expired” UX, call `GET /interviews/{id}` to re-sync DB truth before\
      \ retry.\n\n**All citations file:line verified against current workspace; no\
      \ files modified.**\n\n"
