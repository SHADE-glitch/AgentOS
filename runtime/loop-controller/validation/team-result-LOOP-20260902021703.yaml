        \ parity:** Already fixed for `DashboardService.evict()` on `finishSession`\
        \ — apply same pattern to `InterviewStateStore.delete()` on `FINISHED` terminal\
        \ transition if business requires immediate invalidation rather than TTL linger.\n\
        \n## 9. Lead Review Notes\n\n* This is **not hypothetical** — drift requires\
        \ only one missed `updateById` or a 24h idle period, both probable in production\
        \ (Redis eviction, deployment gap, user return next day).\n* `answer()` and\
        \ `answerStream()` share the same `requireAsking` gate, so both paths equally\
        \ affected; `SseEmitter` 300s timeout (`197`) does not mitigate TTL drift.\n\
        * Junior consideration: do not “fix” by simply extending TTL or disabling\
        \ fallback (fallback is correct for transient Redis loss, but needs freshness\
        \ guard). Correct fix is **freshness validation at rehydration boundary**\
        \ with DB truth as oracle.\n\n— Database Engineer, team-576c9378. No files\
        \ modified per task constraint; reproduction and recommendations provided\
