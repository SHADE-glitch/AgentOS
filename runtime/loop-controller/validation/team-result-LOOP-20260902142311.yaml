      output: "## 目标\n- **业务目标**: 面试会话即使长时间停顿后，用户回来继续作答，也能无缝续接；Redis 冷启动/过期/重启不导致\"\
        继续面试\"返回错误或语义错乱。\n- **当前约束**: `InterviewStateStore`（`backend/.../InterviewStateStore.java:25,51`）用**固定\
        \ 24h TTL** 写 Redis，注释声明 Redis 是\"状态机单一权威来源\"（`src:15`）；DB `interview_session`\
        \ 同时持久化了 **status / questionCount / currentQuestionId**，与 Redis 冗余。\n- **成功标准**:\
        \ 明确界定\"何时、为何会静默过期并打断续接\";给出使其在 Redis 丢失时不产生错误或语义丢失的落地方案。\n\n## 问题判断\n\n###\
        \ 1) 何时会静默过期\n`write()` 每次都是 `set(json, 24, HOURS)`——**只有\"有写入活动\"时 TTL 才会重置**。因此过期不是\"\
        从最后一次写再加 24h\"，而是\"距上次发生写操作超过 24h\"。触发静默消失的场景有：\n\n| 场景 | 是否影响 DB | Redis\
        \ 结果 |\n|---|---|---|\n| 会话停顿（无 answer/流式提交）超过 24h | 不，行仍有效 | key 静默过期 |\n\
        | Redis 重启（`docker-compose` 中 AOF 未开，仅 RDB `/data`，存在 RDB 间隔丢失） | 不 | key\
        \ 可能丢失 |\n| 内存压力/淘汰策略（当前 `noeviction`，但若改 LRU 则会被逐出）| 不 | key 被逐出 |\n| `FLUSHALL`/运维误操作\
        \ | 不 | key 全清 |\n| 应用进程在 DB 更新后、Redis 写出前崩溃（窗口极窄）| DB 更新成功 | key 停在旧值 |\n\
        \n任何一种情况下 **DB 会话行依旧有效**,这就是\"Redis 过期但 DB 仍合法\"的不对称窗口。\n\n### 2) 关键:继续为什么会\"\
        断\"\n先给结论:**当前代码单用户快乐路径实际能续接**——因为 `requireAsking()`（`InterviewService.java:380-399`）在\
        \ `stateStore.read()` 返回 `null` 时，会用 DB 重建并回写。所以这并非\"100% 必崩\"，而是\"部分场景崩 +\
        \ 架构脆弱的隐患\"。真正会导致续接失败的场景是：\n\n**场景 A——\"运行时独有状态\"一旦存在即失效（本轮的核心风险,也是该类设计的通病）**\n\
        `SessionState` 现有 3 字段都冗余在 DB，能重建。但一旦你给状态机加任何**只在 Redis 里、DB 不存**的运行时字段（如\
        \ `askedQuestionSet` 去重集合、`streamCursor` 流指针、`modelContext`/上下文 token、`retryCount`、当前问题快照文本），那么\
        \ key 过期后 DB fallback **无法重建**这些字段。续接时状态机从 DB 拿到的是\"阉割状态\"→ 表现为重复出题、上下文丢失、跳题，**语义层面续接已坏**。这就是\"\
        权威源（Redis）+ 固定 TTL + 只做部分镜像的 DB\"组合的必然结局。\n\n**场景 B——Redis 重启/逐出后,`read()`\
        \ 的\"宽松失败\"掩盖不一致**\n`read()`（`InterviewStateStore.java:37-45`)对解析失败只 `warn`\
        \ 并返回 `null`,混同为\"无状态\"。若 Redis 里残留**旧版本/解析失败**的 json,会被当成 key 不存在,掩盖了真正的脏数据。\n\
        \n**场景 C——DB 与 Redis 的角色自相矛盾**\n注释称 Redis 是\"单一权威来源\",但同样字段又持久化 DB 且把 DB 当日志/报表真值（`finishSession`\
