      summary: '# Contribution — Redis TTL Expiry vs. DB-Validity Continuation Break


        ## Summary


        The "silent expiry" bug is a **cache-aside / dual-write split-brain** problem.
        Because Redis is treated as the *runtim'
      output: "# Contribution — Redis TTL Expiry vs. DB-Validity Continuation Break\n\
        \n## Summary\n\nThe \"silent expiry\" bug is a **cache-aside / dual-write\
        \ split-brain** problem. Because Redis is treated as the *runtime authority*\
        \ (holds ephemeral session state) while the DB is the *persistence authority*\
        \ (holds the durable interview record), a fixed TTL lets Redis reclaim its\
        \ copy even though the DB still says \"session active.\" Continuation then\
        \ breaks because the code path that resumes the interview depends on state\
        \ that no longer exists in Redis — and the failure surfaces as a generic \"\
        lost context\" error, not a clean session-ended signal.\n\n---\n\n## 1. Why\
        \ the DB stays valid but Redis expires\n\nThese are two stores with different\
        \ lifecycles:\n\n| Layer | Contents | Invalidation trigger |\n|---|---|---|\n\
        | **DB** | Interview record: candidate id, job id, status, timestamps, canonical\
        \ answers | Explicit state transition (e.g. `completed`, `cancelled`) |\n\
        | **Redis** | Runtime buffer: conversation context, current question index,\
        \ token/LLM budget, candidate activity cooldown, optimistic lock version |\
        \ Fixed `TTL` regardless of activity |\n\nThe DB row's validity is driven\
        \ by **business state**. The Redis key's validity is driven by **wall-clock\
        \ TTL**. Nothing links the two. So `EXPIRE key 3600` reclaims the key at t=3600\
        \ even when `interview.status='active'` in Postgres.\n\n## 2. When continuation\
        \ breaks (failure modes)\n\nDefining \"continuation\" as *resuming an interview\
        \ whose DB status is still `active`*:\n\n1. **Context/resume restore fails**\
        \ — the resume handler reads the Redis key, gets nothing, and either (a) crashes,\
        \ (b) silently starts a *fresh* session (losing prior answers), or (c) returns\
        \ a misleading error.\n2. **Mid-question state loss** — current question index\
        \ and partial answer buffer were only in Redis; user loses an in-progress\
        \ answer.\n3. **Thundering restart / duplicate submit** — without the Redis\
        \ lock/version field, re-submission replays or double-commits.\n4. **Wrong-identity\
        \ continuation** — session token/handle maps to expired Redis key but valid\
        \ DB row; the app resumes the *wrong* candidate's context or a stale one.\n\
        5. **Missing update to DB TTL policy hits**: if your DB uses a parallel `last_activity`\
        \ check and something keeps `Redis` reset but not DB (or vice versa), the\
        \ two stores drift over time.\n\n## 3. Why it fails *silently*\n\n- `GET key`\
        \ on an expired key returns `nil` — **no error**. Code written as `if val\
        \ == nil { fallback }` treats it as \"no state yet,\" indistinguishable from\
        \ \"never existed.\"\n- No notification is emitted on expiry. You get no hook\
        \ unless you use `keyspace notifications` (`notify-keyspace-events`), and\
        \ those are off by default.\n- The `redis.io` `TTL`/`EXPIRE` path is async;\
        \ a key can look like it's there (replica lag or no active connection check)\
        \ then vanish.\n\n## 4. Root-cause logic (the \"and why\")\n\n```\nDB  : status='active'\
        \          → business says resume OK\nRedis: <key expired>           → runtime\
        \ says nothing here\nresume(key):\n  cached = GET session:{id}\n  if cached\
        \ == nil:\n      // Silent branching point\n      if RECORD_IS_ACTIVE:   \
        \   # split-brain path\n          fallback_unplanned()  # wrong continuation\n\
        \      else:                     # normal path\n          clean_logout()\n\
        ```\n\nThe `RECORD_IS_ACTIVE == true` + `cached == nil` combination is the\
        \ encoding of the bug: **availability authority and durability authority disagree**,\
        \ and the code was never written to treat that mismatch as an explicit error\
        \ branch.\n\n---\n\n## 5. Concrete recommendations\n\n### A. Make TTL a sliding\
        \ (activity) lease, not a fixed wall-clock expiry\nThe chief flaw is **fixed\
        \ TTL**. Use a sliding TTL so active sessions never expire but idle ones do:\n\
        \n```\n# on every interaction (refresh the lease):\nMULTI\n  SET session:{id}\
        \ <serialized-state>\n  EXPIRE session:{id} 1800     # 30 min idle\nEXEC\n\
        ```\n\n### B. Store a synchronized business-status + version in Redis, don't\
        \ trust DB `status` alone\nWrite `{\"status\":\"active\",\"resumeAt\":...,\"\
        questionIndex\":3}` into Redis at session creation and keep it authoritative\
        \ for the resume path. On DB-side cancellation, do a deliberate `DEL` + publish\
        \ so both stores are torn down together:\n\n```\nDEFINE active session head:\n\
        \  MULTI\n    SET session:{id} <state> \n    EXPIRE session:{id} <idle>\n\
        \    // DB side updated in same write tx by orchestrator\n  EXEC\n\n// teardown\
        \ (single source of truth push):\nDEL session:{id}\nHSET durable:session:{id}\
        \ status 'completed'\n```\n\n### C. Add an explicit \"expired-but-active\"\
        \ reconciliation branch (the actual fix)\nStop letting `nil` mean \"fresh.\"\
        \ Distinguish three states:\n\n```python\nval = redis.get(f\"session:{id}\"\
        )\nif val is None:\n    db = repo.get_interview(id)\n    if db and db.status\
        \ == \"active\":\n        raise SessionExpiredWhileActive(id)   # NOT silent\
        \ fallback\n    # else: genuine no-session → clean logout\n    return clean_logout()\n\
        ```\n\nRaising/logging (or a dead-letter) there is what converts *silent*\
        \ breakage into an observable, restartable path.\n\n### D. Enable expiry notifications\
        \ for observability\n```\nCONFIG SET notify-keyspace-events Ex\t# key-event\
        \ for expired, per-db\n```\nSubscribe in the resume service to emit `session_expired`\
        \ metrics/alerts and reconcile with DB before user reconnects.\n\n### E. Decouple\
        \ \"interactive\" vs \"paused\" lifecycles\n- Interactive active session:\
        \ sliding lease in Redis.\n- Paused/queued interview: flush compact checkpoint\
        \ state to the DB (or durable table), so `Redis` loss only loses ephemeral\
        \ context, never the resumable answer log.\n\n### F. Align TTL with DB idle\
        \ policy\nWhatever TTL/duration you choose, derive it from the same `last_activity`\
        \ config used by the DB cleanup job (`DEFAULT_INTERVIEW_IDLE = 30min`). One\
        \ constant, two consumers — prevents drift.\n\n---\n\n## 6. What NOT to do\n\
        \n6. **Don't** extend TTL by \"touch every key\" blindly — use `EXPIRE` on\
        \ interaction only, matched to the DB idle clock.\n7. **Don't** treat Redis\
        \ loss as fatal for the whole interview — it should recover the answer log\
        \ from DB and only rebuild volatile context.\n8. **Don't** rely solely on\
        \ DB `status` for resume authorization once Redis is gone — that's the exact\
        \ split-brain that caused this.\n\n---\n\n## 7. Specific deliverables for\
        \ the lead\n\n- Add the `SessionExpiredWhileActive` reconciliation branch\
        \ in the resume handler (Section 5C).\n- Convert TTL from `SETEX`/`EXPIRE`\
        \ fixed to **sliding lease** on every interaction (5A) with DB idle-derived\
        \ constant (5F).\n- Add checkpoint write-to-DB on activity pause (5E).\n-\
        \ Enable `notify-keyspace-events Ex` + expiry metric/alarm (5D).\n- Add a\
        \ test: *simulate key expiry while DB `status='active'`, assert resume raises/recovers\
        \ rather than silently restarting.*\n\n**Bottom line:** continuation breaks\
        \ in this design because a TTL-driven runtime store and a state-driven durable\
        \ store can disagree, and the code path silently treats the disagreement as\
        \ \"no prior state\" instead of \"valid session missing volatile state.\"\
        \ The fix is a sliding lease plus an explicit expired-but-active reconciliation\
        \ branch."
