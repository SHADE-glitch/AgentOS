      output: "I explored the actual implementation to ground the analysis. Findings\
        \ below.\n\n## Interview session state: Redis-vs-DB architecture (grounded)\n\
        \nTwo stores hold the same session, at different consistency points:\n\n-\
        \ **Redis (runtime authority)** — `InterviewStateStore.write/read`, key `interview:session:{id}`,\
        \ fixed 24h TTL reset on every write (`InterviewStateStore.java:51`). Comment\
        \ on the class states it is the \"单一权威来源\" (single source of truth).\n- **DB\
        \ (`interview_session` row + `interview_message` rows)** — the durable mirror.\
        \ The row is updated only at explicit state transitions (`create`, `answer`,\
        \ `answerStream`, `finishSession`): `status`, `current_question_id`, `question_count`.\
        \ Never silently deleted; it \"remains valid\" indefinitely.\n\nThe state\
        \ machine lives in Redis; the DB is a last-committed-transition snapshot.\n\
        \n## When silent expiry actually occurs here\n\nBecause the TTL is a **fixed\
        \ 24h that is fully reset on every `write()`** (line 51), expiry is *not*\
        \ sliding-deferrable: it only fires for **idle sessions** — an interview the\
        \ user pauses and resumes >24h later, or a long-running idle interview. It\
        \ does *not* fire for actively-used sessions (each Q&A reset of TTL keeps\
        \ it alive). So \"silent expire while DB stays ASKING\" = an **idle-but-technically-in-progress**\
        \ session.\n\n## Why continuation breaks — three distinct failure classes\n\
        \n### 1. Self-heal exists but is partial (`requireAsking`, `InterviewService.java:380`)\n\
        When Redis is `null`, the code rebuilds from the DB row and re-writes Redis.\
        \ If DB at last transition == Redis at last transition, this is safe. **The\
        \ break is everything the DB snapshot does NOT carry:**\n\n- The DB row is\
        \ updated *after* the message is appended and only at the transition; it does\
        \ **not** persist the in-flight answer. A fallback rebuild advances the loop\
        \ using DB's `count`/`current_question_id`, which is consistent *only if the\
        \ last transition fully committed*.\n- `read()` treats a **parse failure as\
        \ `null`** (`InterviewStateStore.java:44`) → silently forces a DB rebuild,\
        \ losing any un-mirrored runtime nuance.\n\n### 2. Null vs. stale divergence\
        \ — the true \"silent\" hazard\nThe worst case is **not** a `null` key. The\
        \ non-atomic write order is `DB update → Redis write` (`InterviewService.java:183-189`,\
        \ and again at 258-264):\n\n| Crash / Redis-write-failure point | DB | Redis\
        \ |\n|---|---|---|\n| Before DB update | ASKING q=n-1 | q=n-1 (consistent)\
        \ |\n| After DB update, before Redis write | **ASKING q=n** | **q=n-1 (stale,\
        \ non-null)** |\n\n- If Redis still holds the **stale q=n-1** (TTL not yet\
        \ fired), no guard exists — `requireAsking` only checks `null`, so the loop\
        \ continues from `state.questionCount()+1 = n` → the next question is computed\
        \ against a count that DB already crossed → skipped/duplicated question, inconsistent\
        \ `currentQuestionId`.\n- If the key **expires**, the rebuild re-reads DB;\
        \ but the same crash window means the DB may itself be ahead of the last successful\
        \ Redis write — the fallback re-consumes a question that was already answered.\n\
        \nThis is the core \"Redis silently expires while DB is valid\": the DB is\
        \ *valid* but it is a **lagging transition mirror, not an authoritative runtime\
        \ replica**, and the code only reconciles on `null`, never on *stale*.\n\n\
        ### 3. Retry/replay after expiry → duplicate answers (correctness + security)\n\
        Nothing gives an `answer` an idempotency key. After the key vanishes, a client\
        \ network retry (or a replayed/re-submitted SSE attempt) passes `requireAsking`\
        \ (rebuilt state says still `ASKING`), then `saveUserMessage` (`InterviewService.java:420`)\
        \ inserts a **new duplicate answer row**. Consequences:\n- `extractQAPairs`\
        \ + `shouldFinish` see inflated QA history → premature `FINISHED` or wrong\
        \ `question_count`.\n- `askedQuestionIds` grows → the next question changes.\n\
        - **Security:** a captured/replayed request is *accepted as a fresh answer*\
        \ against a re-opened session rather than rejected → the state machine silently\
        \ mutates the interview the user \"already answered.\"\n\n## Recommendations\n\
        \n1. **Make DB the authority for durable facts; Redis only an ephemeral accelerator.**\
        \ Version the runtime state (`stateVersion` / `updatedAt`) in both stores\
        \ and, on any read, treat Redis as valid only if `redis.version >= db.updatedAt`;\
        \ otherwise reload from DB. This closes the *stale* gap (class 2), not just\
        \ `null`.\n\n2. **Replace silent-drop TTL with an explicit lifecycle.** Keep\
        \ a TTL for garbage collection, but on expiry don't just `null`-fallback —\
        \ a reconcile/scan job should flip in-progress rows older than the window\
        \ to an explicit `EXPIRED`/`ABANDONED` DB status. Then the app can *distinguish*\
        \ \"safe to resume\" from \"terminated,\" instead of silently continuing a\
        \ session whose Redis context is gone. (This is also a security control —\
        \ see below.)\n\n3. **Idempotency key on `answer`** to kill duplicate-replay\
        \ (class 3). E.g., bind the save to the current question:\n```java\npublic\
        \ MessageVO answer(Long userId, Long sessionId, String answer, String idempotencyKey)\
        \ {\n    if (messageMapper.exists(q -> q.eq(\"session_id\", sessionId)\n \
        \           .eq(\"idempotency_key\", idempotencyKey))) {\n        return alreadyAnswered;\
        \ // idempotent no-op, not a new insert\n    }\n    // ... persist, set key\
        \ ...\n}\n```\n4. **Make the DB→Redis write order safe (class 2).** Either\
        \ (a) write Redis *first* then DB inside the same transaction with compensation,\
        \ (b) use an outbox/pending flag so a crash leaves DB marked \"pending Redis\
        \ sync\" that the reconcile job closes, or (c) at minimum, if `write()` throws,\
        \ roll back / flag the DB row rather than returning success to the caller.\n\
        \n5. **Log the self-heal path for forensics (security-engineer support domain).**\
        \ The fallback in `requireAsking` should emit a structured audit event (`session\
        \ {id} recovered from DB, prior runtime state absent/stale`). Silent expiry\
        \ + silent recovery is exactly the class of invisible state transition that\
        \ complicates incident analysis and session-boundary enforcement.\n\n## Config\
        \ example (sliding-slosh / reconciled TTL, Redisson)\n\nKeep a short hard\
        \ GC TTL, and refresh it on every *read* as well as write so active-but-slow\
        \ sessions aren't dropped (avoids class-1 idle misfires without losing stale\
        \ detection):\n```yaml\n# application.yml (illustrative)\naiview:\n  session:\n\
        \    redis-ttl: PT24H       # absolute GC ceiling, hard reset on any state\
        \ transition\n    db-stale-sweep: PT1H   # reconcile job cadence: flag in-progress\
        \ rows beyond window as EXPIRED\n```\n```java\nRBucket<String> bucket = redissonClient.getBucket(key);\n\
        String json = bucket.get();\nif (json == null) return null;\nbucket.expire(TTL_HOURS,\
        \ TimeUnit.HOURS);          // refresh on read\nnew StateEnvelope(updatedAt,\
        \ version, state)        // + DB updatedAt guard in read path\n```\nReconcile\
        \ the DB state rather than silently re-writing Redis, so the \"DB remains\
        \ valid\" property becomes an explicit, auditable contract instead of an implicit\
        \ accidental one.\n\n**Bottom line for the breakdown:** continuation breaks\
        \ when the Redis runtime state expires *and* (a) the DB mirror is merely a\
        \ lagging transition snapshot the code trusts only on `null`, (b) stale non-null\
        \ keys are never guarded, and (c) retries replay duplicate answers. Fix =\
        \ DB-as-authority + version guard + explicit expiry status + idempotent `answer`\
        \ + audited recovery."
