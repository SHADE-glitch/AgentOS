    summary: '## 诊断：Redis 会话 TTL 静默过期导致"续接中断"


      ### 核心结论

      当会话运行时状态只存于 Redis 且设了固定 TTL，但业务数据仍在 DB 中有效时，`TTL 到期 → Redis 键被删除 → 续接所需的运行时状态丢失`，而读取时若无鉴权校验或容错退化，会**静默**返回失效/报错。**续接是否中断**取决于"续接"依赖
      Redis 中哪些数据，以及客户端如何处理缺失键。

      '
    output: "## 诊断：Redis 会话 TTL 静默过期导致\"续接中断\"\n\n### 核心结论\n当会话运行时状态只存于 Redis 且设了固定\
      \ TTL，但业务数据仍在 DB 中有效时，`TTL 到期 → Redis 键被删除 → 续接所需的运行时状态丢失`，而读取时若无鉴权校验或容错退化，会**静默**返回失效/报错。**续接是否中断**取决于\"\
      续接\"依赖 Redis 中哪些数据，以及客户端如何处理缺失键。\n\n---\n\n## 1. \"续接\"到底断在哪：运行时状态面 vs 持久状态面\n\
      \n把状态分成两层，续接逻辑通常依赖前者：\n\n| 状态层 | 存储 | 特征 |\n|---|---|---|\n| 持久状态 | DB | 有效（TTL\
      \ 不作用于 DB），`completed steps`、`answers`、`transcript` |\n| 运行时状态 | Redis | TTL\
      \ 到期即消失：`cursor`、`in-flight step`、`lock`、`last activity time`、`partial buffer`、`rate/retry\
      \ counters` |\n\n续接类的读路径（resume/continue）几乎都先用 Redis 定位\"断在哪一步\"，再回 DB 取数据。**Redis\
      \ 空 → 无法定位断点 → 续接不存在**。\n\n---\n\n## 2. 何时触发静默过期（When）\n\n按风险从高到低：\n\n1. **会话进入空闲**——用户暂停/离开，无操作，固定\
      \ TTL 持续倒计时。这是最常见的触发点（`idle-waiter`）。\n2. **长操作的窗口大于 TTL**——TTL 设 10~15min，一个慢步骤/思考/长答复接近或超过该值，任务还未写完，键先没了（`long-window`）。\n\
      3. **相对滑窗误用为绝对 TTL**——用 `EXPIRE = now + N`（固定），而非对每个操作 `touch` 续约，导致活跃用户也在会话中途被过期（`mis-set`）。\n\
      4. **多实例/多线程不同步续约**——只有主连接续约，副本/其他 worker 不刷新，落后于 TTL（`multiplex`）。\n5. **时钟倾斜**——TTL\
      \ 基于本地时间计算，节点间时间差可造成提前过期（`clock-drift`，低概率）。\n\n判断口诀：**只要\"两次写操作之间的真实间隔\"可能超过固定\
      \ TTL，就存在静默过期的风险。**\n\n---\n\n## 3. 续接为何中断（Why)——三种破坏模式\n\n**模式 A：硬性 404 ——\
      \ 续接入口直接失效**\n续接接口先用 Redis 校验会话存在。\n\n```python\n# resume step\nif not client.get(f\"\
      sess:{sid}\"):\n    return 404, {\"error\": \"session expired, start over\"\
      }\n```\n→ TTL 到期后，客户端拿到明确失败，不\"静默\"，但用户**被迫重启会话**，DB 中已完成成果不可复用。这是\"续接可控但业务损失\"\
      。\n\n**模式 B：静默降级 / 错位续接（真正危险的\"静默\"）**\n续接时不查 Redis，直接读 DB（DB 有效），于是进入\"半续接\"\
      ：\n- 游标/断点已丢 → 从 DB 读出的是**上一个持久化的 snapshot** → 回退到旧位置，用户以为继续，实际重复/跳步。\n- 或 DB\
      \ 无从得知进度 → 显示为\"从头开始\"，但用户记得已完成 → 自我矛盾、体验错乱。\n这种**看起来正常、实际是错误的续接**最难排查。\n\n\
      **模式 C：共享键被下一个会话复用续接**\nTTL 键名 `sess:{sid}` 由新会话复用 → 新会话读到上位会话残留的 cursor/中间态\
      \ → **串会话**，属并发/数据污染型中断。\n\n---\n\n## 4. 关键根因清单（为什么\"DB 有效\"反而掩盖了问题）\n\n1. **单一事实来源分离**：进度/断点只在\
      \ Redis，DB 只存\"已验证的完成结果\"，两者无原子同步——TTL 使 Redis 先消失，造成逻辑分裂。\n2. **固定 TTL 使用绝对化**：没有\
      \ idle-session 续约机制，活跃会话也被斩杀。\n3. **续接路径缺乏幂等与一致性校验**：不验证 Redis 中 `version`/`ETag`\
      \ 与 DB 快照是否一致。\n4. **错误处理不区分\"从未创建\"与\"已过期\"**：把过期当\"一开始就不存在\"处理。\n\n---\n\n\
      ## 5. 方案设计（含 trade-off）\n\n**方案 A：滑窗自动续约（首选，成本低）**\n写时 `touch`/按操作滑动 TTL，空闲才过期。强结论最快修复活跃会话误过期。\n\
      \n**方案 B：DB 持久化断点，Redis 仅缓存（根治）**\n定时/关键步骤把 `cursor` 落 DB，Redis 只加速读取；Redis\
      \ 失效时回退 DB：续接绝不中断，只是性能降级。\n\n**方案 C：延长 TTL + 明显恢复入口（保底）**\n足够长的 TTL + 过期后返回\"\
      恢复会话\"而不是\"新建\"，从 DB 恢复断点。\n\n### Decision\n> 推荐 **方案 B + A 组合**：核心断点持久化到 DB（消除单点失效），Redis\
      \ 用滑窗 TTL + `touch` 续约（提升实时性并避免活跃误杀）。方案 C 作为 UX 保底。\n\n理由：\n- B 把\"续接正确性\"绑定在可靠的\
      \ DB 上，与现有\"DB 有效\"前提协同；\n- A 消除\"活跃却过期\"这一最隐蔽问题；\n- 同时保留 Redis 的性能特性。\n风险与缓解：\n\
      - DB 写放大 → 采用**异步/snapshot 打点**而非每步同步写；\n- 一致性 → 写入用 `version` 乐观锁防串会话覆盖。\n\n\
      ---\n\n## 6. 实施方案（TTS = touch on touch）\n\n```python\n# 1) 滑窗续约（写时 touch）\n\
      def update(conn, sid, cfg):\n    key = f\"sess:{sid}\"\n    pipe = conn.pipeline()\n\
      \    pipe.set(key, serialize(state(model._in_flight)))\n    pipe.expire(key,\
      \ cfg.idle_ttl)      # 每次写重新滑动，而非固定 from creation\n    pipe.execute()\n\n# 2)\
      \ 权威断点持久化到 DB（异步打点）\ndef checkpoint(db, sid, cursor):\n    db.execute(\n   \
      \     \"INSERT INTO sess_state(sid, cursor, model_version, updated_at) \"\n\
      \        \"VALUES(%s,%s,%s,now()) \"\n        \"ON CONFLICT(sid) DO UPDATE SET\
      \ cursor=%s, model_version=%s, updated_at=now()\",\n        (sid, cursor, ver,\
      \ cursor, ver),\n    )\n\n# 3) 续接：Redis 优先，DB 兜底（带版本一致性头）\ndef resume(conn,\
      \ db, sid):\n    ver = conn.hget(f\"sess:{sid}\", \"model_version\")\n    if\
      \ ver is not None:\n        return cursor_from(conn)                 # hot path\n\
      \    return db.fetchone(\n        \"SELECT cursor FROM sess_state WHERE sid=%s\
      \ AND ...\", (sid,)\n    )  # cold path: 从 DB 恢复断点，绝不中断\n```\n\n`model_version`\
      \ 同时作为 `ETag`：续接请求带 `If-None-Match`，Redis 与 DB 版本不一致 → 丢弃 Redis，回 DB，避免串会话。\n\
      \n---\n\n## 7. 验证方式\n\n- **单测**：缩短 TTL（如 1s），写后 sleep 2s 再 resume → 断言仍从 DB\
      \ 恢复断点、进入同一光标位置。\n- **集成**：模拟慢步骤跑过修改后 TTL → 断言不中断。\n- **并发**：两个进程同时续约/恢复 → 断言\
      \ version 冲突被正确回退，无串会话。\n- **纵深**：Redis `FLUSHALL` / 重启 Redis → 断言续接仍成功（走 DB）。\n\
      \n---\n\n### 记忆落库建议\n将本案例提炼为数据库工程/分布式状态类 pattern：\n- 反转键标签建议：`redis-ttl-expiry`\
      \ `session-continuity` `cursor-persistence` `idle-sliding-window`。\n- 成功策略：**运行时状态与持久状态分离\
      \ + 权威断点落库（DB）+ Redis 滑窗 TTL 只做加速**，与 [S-001]/[P-001] 的多层职责分工思路一致，但需按\"单域状态一致性\"\
      收敛团队规模（参考 [T-010] team-inflation-guard）。\n\n是否需要我进一步给出上述 PHP/Java/Go 某一种的具体\
      \ Diff 或在真实代码库中落地？"
