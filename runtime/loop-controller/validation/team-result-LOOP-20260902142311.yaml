    output:
      agent: code-reviewer
      status: completed
      summary: '# Code Review — Fixed-TTL Redis Session State Silent Expiry


        **Scope:** `InterviewStateStore.java`, `InterviewService.java` — interview
        session runtime state key `interview:session:{id}`, fixed `TTL_H'
      output: "# Code Review — Fixed-TTL Redis Session State Silent Expiry\n\n**Scope:**\
        \ `InterviewStateStore.java`, `InterviewService.java` — interview session\
        \ runtime state key `interview:session:{id}`, fixed `TTL_HOURS = 24`, DB row\
        \ `interview_session`.\n**Domain:** database / Redis cache-lifecycle vs. persistence\
        \ lifecycle.\n**Severity summary:** `[MEDIUM]` functional (largely masked\
        \ today by a DB fallback, but the \"single source of truth\" premise + lifecycle\
        \ mismatch makes it a latent break and an active correctness/observability\
        \ gap).\n\n---\n\n## 1. The defect (precise mechanism)\n\nIn `InterviewStateStore.java:25`\
        \ and `:51`:\n\n```java\nprivate static final long TTL_HOURS = 24;\n...\n\
        redissonClient.getBucket(key(sessionId)).set(json, TTL_HOURS, TimeUnit.HOURS);\n\
        ```\n\nEvery `write()` resets the TTL to **24h from now** — so the TTL is\
        \ effectively a *24-hour-powered write-gap window*, not a session lifetime.\
        \ The key silently dies once **no write occurs for ≥24h**, regardless of whether\
        \ the logical interview is still ongoing / resumable in the DB.\n\nThe DB\
        \ row (`interview_session`) is never time-limited — it persists (logic-delete\
        \ only) and is what `listByUser()`/`detail()`/`result()`/dashboard all serve\
        \ from. So for the same logical entity, Redis and DB have **two different\
        \ lifecycles**, and Redis — declared the \"单一权威来源 / single source of truth\"\
        \ in the class javadoc (`InterviewStateStore.java:15`) — is the *ephemeral*\
        \ one. That inversion is the root smell.\n\n---\n\n## 2. WHEN it silently\
        \ expires\n\n| # | Condition | Consequence |\n|---|-----------|-------------|\n\
        | A | Write-gap > 24h: user idles/mid-interview and resumes later; crashed-then-resumed\
        \ session; an intentionally long-running interview | Key gone, DB still `ASKING`\
        \ with valid `question_count`/`current_question_id` |\n| B | Redis restart\
        \ / flush (`FLUSHDB`) | All session-state keys gone at once; DB unaffected\
        \ |\n| C | **Memory-pressure eviction** (only if `maxmemory` + `allkeys-*`\
        \ policy is configured — not in current `docker-compose.yml`) | Key evicted\
        \ **before** TTL, silently and non-deterministically — least-coupled to any\
        \ time value at all |\n\n---\n\n## 3. WHY continuation breaks (honest severity\
        \ assessment)\n\nThe important nuance: today there is a **built-in DB fallback**\
        \ in `requireAsking()` that mostly masks a hard failure:\n\n```java\n// InterviewService.java:380-399\n\
        state = stateStore.read(sessionId);\nif (state == null) {                \
        \       // Redis miss = expired/evicted\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
        \    state = new SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId());\n\
        \    stateStore.write(sessionId, state);    // resurrect with fresh 24h TTL\n\
        }\n```\n\nBecause the Redis `SessionState(status, questionCount, currentQuestionId)`\
        \ mirrors the DB columns 1:1 (all three are set on every step), the reconstruction\
        \ is faithful **right now**, and it is serialized per-session by `interview:lock:{id}`,\
        \ so no lost update. Therefore the *actual* breaks and risks:\n\n### 3a. Correctness\
        \ / observability break — resurrection defeats \"silent expiry\" as a signal\n\
        The fallback **silently resurrects** an expired-but-ongoing session (rewrites\
        \ it) instead of distinguishing \"cache miss\" from \"session truly ended/idle-abandoned.\"\
        \ Consequences:\n- Any intended *idle/abandon* semantics for the 24h TTL are\
        \ **not enforced** — a stale session is revived, not rejected. The product\
        \ cannot tell the difference between \"user paused\" and \"user abandoned.\"\
        \n- There's no log/metric on `state==null` → expiry is genuinely silent; on-call\
        \ has no signal when sessions are being churned.\n\n### 3b. Query/RAG path\
        \ — `requireAsking` is the only reader with a fallback\nAny other code path\
        \ that reads the Redis state as *authoritative* and has **no** DB fallback\
        \ will hard-break on expiry. Today `answer()`/`answerStream()` both go through\
        \ `requireAsking` (covered), but `finishSession()` and dashboard rely on DB.\
        \ The moment a Redis-only field is introduced (e.g., SSE stream offset, per-question\
        \ LLM task id for resume/duplicate-guard), expiry **silently loses it** and\
        \ continuation fails in a way the fallback cannot repair. This is the forward-looking\
        \ criticality of the design.\n\n### 3c. Crash-between-DB-write-and-Redis-write\
        \ (adjacent, more realistic than TTL)\nIn `answer()` (`:183-189`) and `finishSession()`\
        \ (`:340-346`), order is `sessionMapper.updateById(...)` then `stateStore.write(...)`.\
        \ A crash between them leaves **DB newer than Redis**, and because the last\
        \ Redis write just got a fresh 24h TTL, expiry will *not* correct it — Redis\
        \ holds stale-but-fresh state that won't age out. This is the opposite failure\
        \ of the task's premise but the same *\"DB valid while Redis stale\"* family\
        \ and worth flagging.\n\n### 3d. Thundering-herd / authority flip\nOn same-interval\
        \ expiry (scenario B), the next burst of `answer` traffic all miss Redis,\
        \ all hit the DB, and all rewrite — avoided only by the per-session lock,\
        \ but it converts a cheap cache hit into a DB read + rewrite per continuation\
        \ and flips \"authority\" back and forth between Redis and DB. Performance/correctness\
        \ of \"single source of truth\" premise degrades.\n\n---\n\n## 4. Recommendations\n\
        \n**R1 (root, structural): make DB the single source of truth; demote Redis\
        \ to a true performance cache with an explicit *idle* window.**\n- TTL should\
        \ mean \"inactivity timeout,\" not \"entity lifetime.\" Since state fields\
        \ already mirror DB, there's no reason for Redis to be authoritative.\n- Any\
        \ field that must survive Redis restart/eviction **must** be a DB column;\
        \ Redis-only fields are disallowed without an explicit recovery path.\n\n\
        **R2 (fix the silent behavior — most important code change): make \"Redis\
        \ miss\" explicit, not silent.**\nIn `requireAsking()`, distinguish miss →\
        \ log + metric, and decide product intent deliberately:\n\n```java\nprivate\
        \ InterviewStateStore.SessionState requireAsking(Long sessionId) {\n    InterviewStateStore.SessionState\
        \ state = stateStore.read(sessionId);\n    if (state == null) {\n        //\
        \ RECOVERY: state key missing (expired/evicted/restart) while DB may still\
        \ be valid.\n        // Emit signal instead of silently resurrecting.\n  \
        \      stateMissCounter.increment();            // micrometer counter\n  \
        \      log.warn(\"session state missing, recovering from DB, sessionId={}\"\
        , sessionId);\n        InterviewSession s = sessionMapper.selectById(sessionId);\n\
        \        if (s == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
        \        state = new InterviewStateStore.SessionState(\n                s.getStatus(),\
        \ s.getQuestionCount(), s.getCurrentQuestionId());\n        stateStore.write(sessionId,\
        \ state);\n    }\n    if (InterviewStatus.FINISHED.name().equals(state.status()))\n\
        \        throw new BizException(ResultCode.INTERVIEW_FINISHED);\n    if (!InterviewStatus.ASKING.name().equals(state.status())\n\
        \            && !InterviewStatus.START.name().equals(state.status()))\n  \
        \      throw new BizException(ResultCode.INTERVIEW_STATE_ERROR, \"当前状态不允许提交答案\"\
        );\n    return state;\n}\n```\n\nIf the product genuinely wants a 24h *abandon*\
        \ cutoff, the miss path should return `INTERVIEW_STATE_ERROR` (or a dedicated\
        \ `SESSION_EXPIRED`) instead of resurrecting — decide which and encode it.\
        \ This directly resolves the ambiguity in the task.\n\n**R3 (config, not constant):\
        \ externalize + couple TTL to business meaning.**\nMove `TTL_HOURS` to `application.yml`\
        \ (`app.interview.state-ttl-hours`), keep default, and add a config guard\
        \ that it is **always > maximum allowed operation length** (SSE is 300s `:198`)\
        \ and > lock lease. 24h ≫ 300s, so today it's fine; document the bound.\n\n\
        **R4 (guard against eviction, scenario C):** if any `maxmemory-policy=allkeys-*`\
        \ is ever enabled on this Redis (currently none in `docker-compose.yml`),\
        \ configure it as `noeviction` or `volatile-*` so session-state keys are **never**\
        \ evicted early — eviction violating \"fixed TTL\" is the most direct route\
        \ to the silent expiry described.\n\n**R5 (SSE duplicate-guard note):** `answerStream()`\
        \ double-submits scoring on both finish branches (`:235`, `:250`) — not Redis-TTL\
        \ related, but adjacent to the state machine; worth folding into the follow-up\
        \ once state authority is settled.\n\n**R6 (verification):** add a test proving\
        \ the miss path — write with TTL of seconds in a config override, let it expire,\
        \ assert the DB fallback resurrects correct `status/count/questionId` and\
        \ that a `FINISHED` DB session yields `INTERVIEW_FINISHED`, not `INTERVIEW_STATE_ERROR`.\n\
        \n---\n\n## 5. Verdict for lead\n\n- **Blocking?** No — the current code hides\
        \ the failure behind `requireAsking()`'s DB fallback for the mirrored fields,\
        \ so there is no reproducible hard break in the shipped API today.\n- **Required\
        \ before merge:** R2 (make miss explicit + decide abandon-vs-recover), R3\
        \ (config), and a miss-path unit test. Introduce R1/R4 as a follow-up since\
        \ it touches state-authority design beyond this task's scope.\n- **Net finding:**\
        \ the risk has moved from \"silent data loss\" today to *structural*: two\
        \ lifecycles for one entity, with Redis (ephemeral) declared authoritative\
        \ — a latent break that becomes a real continuation failure the instant any\
        \ non-DB-mirrored field is added or an eviction policy is enabled."
