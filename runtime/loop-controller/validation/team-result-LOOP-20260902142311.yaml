      summary: '# Redis TTL Expiry vs. DB Validity — Continuation Break Analysis


        ## 1. The Core Problem


        You have two stores holding session/continuation state:


        - **Redis**: runtime session state with a **fixed TTL'
      output: "# Redis TTL Expiry vs. DB Validity — Continuation Break Analysis\n\n\
        ## 1. The Core Problem\n\nYou have two stores holding session/continuation\
        \ state:\n\n- **Redis**: runtime session state with a **fixed TTL** (e.g.\
        \ `EXPIRE session:123 3600`)\n- **DB**: authoritative, longer-lived records\
        \ (interview results, progress, candidate data)\n\nThe failure mode: **Redis\
        \ key silently expires on its own** (no error, just `GET` returns nil), while\
        \ the DB row is still valid and referenceable. Any code that assumes \"if\
        \ the DB record exists, the session continues\" will break — because the runtime\
        \ state that the continuation logic depended on is gone.\n\n## 2. When Continuation\
        \ Breaks\n\nContinuation breaks whenever the **resumption path reads Redis\
        \ first and treats a miss as authoritative**, rather than as \"needs rebuild\"\
        . Specific conditions:\n\n| Condition | Why it breaks |\n|---|---|\n| Fixed\
        \ TTL set at **start** (not sliding) | Long active sessions exceed the window\
        \ even though user is mid-flow |\n| Expiry in Redis is **authoritative for\
        \ \"session ended\"** | Code maps `nil` → \"must restart\", but DB says session\
        \ is valid → contradiction |\n| **Rehydrate-on-demand reads Redis key** expecting\
        \ it to exist | `GET` returns nil; downstream assumes valid object and throws/CREATES\
        \ a NEW session while the old DB entry lives on → two competing sessions,\
        \ orphaned continuation |\n| **No rebuild path / no tombstone awareness**\
        \ | Key gone with no marker → reuse counter, token, or lock state lost |\n\
        | **Async jobs / delayed continuation** (e.g. interviewer reviews hours later,\
        \ pauses > TTL) | The runtime state evaporates between steps |\n| **Clock/eviction\
        \ policy** (allkeys-lru, volatile-lru) | Memory pressure evicts even before\
        \ TTL — expiry isn't the only silent killer |\n\n## 3. Why Continuation Breaks\
        \ (Root Cause)\n\nContinuation is a **state machine** with the happy-path\
        \ assumption \"runtime state == durable state exists\". Redis TTL violates\
        \ this because:\n\n1. **Expiry is time-based, not state-based.** The DB represents\
        \ *logical* progress; the TTL represents *wall-clock* progress. They drift.\n\
        2. **Redis is cache-like by design** — it can drop data silently (expiry,\
        \ eviction, restart with AOF/RDB loss). It offers **no durability guarantee**\
        \ for TTL'd keys, so it must never be the *source of truth* for resumability.\n\
        3. **A miss in Redis is indistinguishable** between \"never existed\", \"\
        expired\", and \"evicted\". Callers cannot act on the miss without checking\
        \ the DB.\n4. **The sequence \"check Redis, then allow continuation\" inverts\
        \ the dependency** — continuation authority should be the DB, with Redis as\
        \ a fast cache that can be rebuilt.\n\n## 4. Fixes (in priority order)\n\n\
        ### 4.1 Make TTL sliding, not fixed\n```python\n# refresh on every access\n\
        redis.expire(SESSION_KEY, TTL)   # on each read/write during activity\n```\n\
        Better: use a **sliding** policy so active sessions never die mid-flow; only\
        \ truly idle ones expire.\n\n### 4.2 Rebuild from DB on miss (cache-aside,\
        \ DB-authoritative)\n```python\nstate = redis.get(SESSION_KEY)\nif state is\
        \ None:\n    row = db.load(SESSION_KEY)          # DB is source of truth\n\
        \    if row is None:\n        return restart_session()         # genuinely\
        \ new\n    state = rebuild_state_from(row)      # rehydrate\n    redis.setex(SESSION_KEY,\
        \ TTL, state) # refresh cache\nreturn state\n```\n\n### 4.3 Add an explicit\
        \ termination path instead of silent expiry\nWhen composing the answer, avoid\
        \ relying on TTL to mean \"ended\". Write a `status` field:\n```\nstatus:\
        \ ACTIVE | PAUSED | COMPLETED | EXPIRED\n```\nWarm the key / **refresh TTL**\
        \ whenever status is ACTIVE. Do **not** let the session be \"ended\" by implication\
        \ of TTL — every transition is explicit in DB too.\n\n### 4.4 Store a marker\
        \ with the DB record\nKeep a `session_version` / `last_runtime_rev` in the\
        \ DB row. On resume, if Redis is empty **but** the DB version is current,\
        \ the runtime is stale (expired/evicted), triggering a **rebuild** rather\
        \ than a brand-new session:\n\n```sql\n-- DB side: signal the runtime is disposable\n\
        SELECT id, status, session_rev FROM interview WHERE id = $1;\n-- if status='ACTIVE'\
        \ and Redis is empty -> rebuild runtime, do NOT abort\n```\n\n### 4.5 Prevent\
        \ eviction, not just expiry\n```bash\nCONFIG SET maxmemory-policy volatile-lru\n\
        # or pin hot active sessions with PERSIST / remove TTL while ACTIVE\n```\n\
        Don't put active continuation keys under `allkeys-lru`, or memory pressure\
        \ defeats the TTL you set.\n\n### 4.6 Authentication/retry guard\nIf continuation\
        \ uses **retry counters, tokens, or locks stored in Redis**, their loss can\
        \ cause authorization or duplicate-submission failures. Persist the *authoritative*\
        \ facts (e.g., last completed step, token) in DB; keep only ephemeral locks/counters\
        \ in Redis with a safe fallback default.\n\n## 5. Recommendation Summary\n\
        \n1. **Never treat Redis TTL as the source of truth for \"session ended\"\
        .**\n2. **DB decides continuity; Redis only accelerates it and must be rebuildable.**\n\
        3. Use **sliding TTL** + **explicit status transitions** written to the DB.\n\
        4. On Redis miss, **check DB before deciding** restart vs. rebuild.\n5. Consider\
        \ **eviction policy** in addition to TTL.\n\nThis applies the validated RAG-retrieval/state\
        \ pattern from memory (T-005/S-001): treat the runtime cache as a **disposable\
        \ enrichment layer** over a durable, authoritative store — the same discipline\
        \ the database-engineer and backend-architect domain guidance prescribes."
