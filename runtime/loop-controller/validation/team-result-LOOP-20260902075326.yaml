        \ lock/`updated_at` conflict detection (not just Redis lock) so continuation\
        \ is idempotent.\n\n---\n\n## 6. Summary for Lead Review\n\n- **Root cause:**\
        \ Redis holds authoritative liveness with a fixed TTL while the DB remains\
        \ valid; eviction is silent and the app's cache-first read logic treats a\
        \ miss as \"no session.\"\n- **Fix priority:** (1) make DB the source of truth\
        \ for continuation, (2) always hydrate from DB on Redis miss, (3) if Redis\
        \ must gate liveness, use a sliding TTL refreshed on activity, (4) make expiry\
