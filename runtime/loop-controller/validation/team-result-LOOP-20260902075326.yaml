      output: "# Interview Session Continuation & Redis TTL — Database Engineering\
        \ Analysis\n\n## 1. The Core Failure Mode\n\nThe runtime session state (`session:{id}`)\
        \ lives in Redis with a **fixed TTL**, but the authoritative business state\
        \ (candidate record, interview completion status) lives in the DB. Continuation\
        \ is a **two-source read**: fetch runtime state, verify against DB state.\
        \ When they desync, the verification step is exactly where continuation breaks.\n\
        \n```\nflow:   HTTP resume request\n          │\n          ▼\n   Redis  GET\
        \ session:{id}      ──► MISS (expired)  ❌\n          │\n          ▼      \
        \                  ▼\n     \"no active session\"   ← vs ── DB still says interview\
        \ in_progress ✅\n```\n\n**When it breaks:** Redis returns `nil`/null while\
        \ the DB row is still valid and the record is logically mid-session.\n\n##\
        \ 2. Why It Breaks (root causes)\n\n### 2.1 Fixed TTL assumes wall-clock lifetime,\
        \ not activity lifetime\nA fixed TTL (e.g. `EXPIRE 7200`) means the session\
        \ dies exactly 2h after **creation**, regardless of whether the candidate\
        \ was actively working 10 seconds ago. Any resume attempt after the hard deadline\
        \ fails on Redis even though the DB says the interview is ongoing.\n\n###\
        \ 2.2 No sliding refresh (no activity-based extension)\nWithout `EXPIRE` on\
        \ every read/write (sliding TTL), an active session that runs longer than\
        \ the TTL is evicted mid-interview. This is the most common silent break:\
        \ **session is hot, but still expires.**\n\n### 2.3 Redis eviction policy\n\
        Under memory pressure with `maxmemory-policy allkeys-lru`/`volatile-lru`,\
        \ Redis evicts keys **before** their TTL. A valid session gets dropped silently.\
        \ The DB never knows.\n\n### 2.4 Stats/config thresholds\n- `allkeys-*` evicts\
        \ keys even **without** TTL — so even a \"no-expiry\" session is not safe.\n\
        - Replica/failover: if the session key was written to a node that was restored\
        \ from snapshot (RDB/AOF lag), the key may be absent.\n\n### 2.5 Lead-time\
        \ race on the resume boundary\nA candidate resumes just as the TTL fires between\
        \ the read of the DB check and the Redis fetch → intermittent, non-reproducible\
        \ failures that look like heisenbugs.\n\n### 2.6 Clock/multi-node TTL skew\n\
        With multiple Redis nodes or cluster, TTL counting from write time on disparate\
        \ clusters gives inconsistent effective lifetimes.\n\n## 3. Why DB \"remains\
        \ valid\" makes it worse\n\nThe DB row is the durability layer and is **not**\
        \ expiry-bound. Once the write-behind has committed (interview started, answers\
        \ saved), it persists indefinitely. So the invariant is:\n\n```\nDB state\
        \   : in_progress  (durable, survives)\nRedis state: {answered_questions,\
        \ current_section, tokens}  (ephemeral, expires)\n```\n\nContinuation requires\
        \ **both** to agree. Redis dropping even the *cache-like* part orphans an\
        \ intact DB record → candidate stuck at a dead screen with no resume path.\n\
        \n---\n\n## 4. Recommended Fix (reconciliation, not just bigger TTL)\n\nDo\
        \ **not** rely on a big fixed TTL. Make Redis a refreshable cache and DB the\
        \ source of truth for continuation eligibility.\n\n### 4.1 Sliding TTL on\
        \ every touch\n```lua\n-- each read/write extends life of an ACTIVE session\
        \ only\nredis.call('EXPIRE', KEYS[1], ARGV[1])   -- e.g. 30m idle window\n\
        ```\n\n### 4.2 Redis = runtime only; DB = truth for \"should this session\
        \ exist?\"\n```python\ndef resume(session_id, user_id):\n    # 1. authorize/source-of-truth\
        \ check\n    if not db.is_interview_active(session_id, user_id):\n       \
        \ return 410  # gone — genuinely stale on BOTH sides\n\n    # 2. try cache\
        \ first\n    runtime = redis.get(f\"session:{session_id}\")\n\n    # 3. RECONCILE\
        \ on miss: rebuild from DB, don't kill the session\n    if runtime is None:\n\
        \        runtime = rebuild_runtime_state_from_db(session_id)   # raises if\
        \ DB incomplete\n        redis.setex(f\"session:{session_id}\", IDLE_TTL,\
        \ marshal(runtime))\n\n    return runtime\n```\n\n### 4.3 Store a version/sequence\
        \ so you can detect silent loss\nAttach a `DB row version` (or `updated_at`)\
        \ inside the Redis payload. On resume, compare against DB. If Redis is stale/missing,\
        \ DB wins — Redis is disposable.\n\n### 4.4 Optional resurrection delta\n\
        Persist the *minimal* continuation snapshot (section, question index, saved\
        \ answer blob) to the DB (or a secondary `session_continuation` table) so\
        \ that a Redis miss can rebuild rather than abort.\n\n### 4.5 Redis operations\
        \ guardrails\n```conf\nmaxmemory-policy volatile-ttl   # NEVER lru — preserve\
        \ earliest-to-expire correctly / or noeviction for the session keyspace\n\
        # Use a dedicated logical db or key prefix for sessions if you must evict.\n\
        ```\n\n- Prefer `volatile-lru` over `allkeys-lru` so only expiring keys are\
        \ candidates.\n- Set `maxmemory` generously for the session keyspace; otherwise\
        \ eviction is your silent killer.\n\n### 4.6 Alerting on the divergence signal\n\
        Track the metric **\"DB in_progress but Redis miss\"** — if it rises, that's\
        \ not just a UX bug, it's an eviction/TTL misconfig signal.\n\n---\n\n## 5.\
        \ When NOT to fix via Redis\n\n- If the runtime state **must** survive infrastructure\
        \ restarts → move it to DB entirely; never trust an L1 cache for durability.\n\
        - If continuation correctness (not just latency) depends on Redis content\
        \ → promote that content into DB and treat Redis as read-through cache only.\n\
        \n## 6. Summary Table\n\n| Symptom | Cause | Fix |\n|---|---|---|\n| Resume\
        \ fails long after start | Fixed TTL = hard deadline | Sliding TTL, refresh\
        \ on activity |\n| Active session dies mid-interview | No touch-based extension\
        \ | `EXPIRE` on every read/write |\n| Valid session evicted under load | `allkeys-lru`\
        \ policy | `volatile-ttl` / dedicated keyspace / noeviction |\n| Heisenbug\
        \ at resume boundary | Race between DB check & Redis TTL fire | DB is source\
        \ of truth; reconcile & rebuild |\n| DB says active, Redis empty | Desync\
        \ of two stores | Version field + rebuild-on-miss from DB |\n\n**Bottom line:**\
        \ continuation breaks whenever DB (durable, infinite) and Redis (ephemeral,\
        \ fixed/TTL-evictable) disagree, and the code trusts the Redis miss as authority.\
        \ Fix by making DB the continuation authority and Redis a self-healing, sliding-TTL\
        \ cache that rebuilds from DB on miss."
