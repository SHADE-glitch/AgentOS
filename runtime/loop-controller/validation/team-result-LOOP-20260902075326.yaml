        \ last explicit write**, regardless of continued activity in the DB. The DB\
        \ row stays valid, so any read path that consults **only** Redis gets a silent\
        \ miss — no error, no sentinel, just an empty/absent key.\n\n### When continuation\
        \ breaks\n1. **Fixed (write-once) TTL with no sliding refresh** — any session\
        \ longer than TTL, or paused between steps longer than TTL, expires mid-flow.\
        \ This is the classic and most common cause.\n2. **Cache-aside read with cache-first\
        \ persistence logic** — app reads `session:{id}` to decide \"does this interview\
        \ exist / what step was I on?\" On miss it treats the session as new/ended\
        \ and either errors (`SESSION_NOT_FOUND`) or **writes a fresh session**, silently\
        \ abandoning the DB record.\n3. **State only staged in Redis, flushed to DB\
        \ lazily** — if Redis holds the authoritative working copy (answers, current\
        \ step) and expiry fires before the lazy flush, the DB is stale *and* the\
        \ working copy is gone → unrecoverable continuation.\n4. **TTL refreshed on\
        \ the wrong event** — refreshed on *answer submit* but not on *view/heartbeat*,\
        \ so an idle-but-active user (reading the question, thinking) is evicted.\n\
        5. **Cluster/HA interplay** — key evicted on the owning node; failover or\
        \ resharding can compound TTL drift.\n\n### Why it's \"silent\"\nRedis `GET`/`EXISTS`\
        \ return a normal result for a missing key (nil / 0). No exception surfaces.\
        \ The bug hides at the application's **fallback logic**, not in Redis. If\
        \ the app distinguishes \"cache miss\" from \"not found in DB\", it's recoverable;\
        \ if not, continuation breaks with a confusing 404/validation error despite\
        \ the DB row being present.\n\n---\n\n## 2. What \"valid DB state\" actually\
        \ means (and the trap)\n\nThe trap is assuming **DB presence == session alive**.\
        \ The continuation contract should be derived from DB truth, not Redis. Define\
        \ the authoritative lifecycle in the DB:\n\n| Source | Authoritative for |\
        \ Not authoritative for |\n|---|---|---|\n| RDBMS | existence, step, status,\
        \ transcript, timestamps | in-memory latency, locks, per-request scratch |\n\
        | Redis | hot reads, locks, notifications, rate-limiting | longevity/enforcement\
        \ of arrival rules |\n\nRecommendation: **enforce TTL/expiry semantics in\
        \ the DB** (`expires_at`, `status='abandoned'`, job cleanup), and let Redis\
        \ be a **derived cache** that is always safe to recreate from DB.\n\n---\n\
        \n## 3. Recommended Fixes (ranked)\n\n**A. Sliding / refreshable TTL (preferred\
        \ if Redis stays authoritative for liveness)**\nRefresh on every meaningful\
        \ touch, not just writes:\n```\n# Lua: get-and-refresh atomically\nif redis.call('EXISTS',\
        \ KEYS[1]) == 1 then\n  return redis.call('EXPIRE', KEYS[1], ARGV[1])\nend\n\
        return 0\n```\nOr `SET key val EX <ttl>` + periodic `EXPIRE` on heartbeat.\
        \ Sliding TTL keeps live sessions alive while idle ones still expire — this\
        \ is the correct liveness semantic.\n\n**B. DB-authoritative with cache-aside\
        \ + graceful miss (recommended for correctness)**\nRedis becomes a pure accelerator.\
        \ On miss, **fall through to DB**; do not synthesize data.\n\n```\nfn loadSession(id):\n\
        \  s = redis.get(\"session:\" + id)\n  if s is not None:\n      return s\n\
        \  row = db.query(\"SELECT ... FROM interview WHERE id=$1\", id)\n  if not\
        \ row or row.status in ('completed','abandoned'):\n      raise SessionNotFound(id)\
        \          # genuine end\n  redis.setex(\"session:\"+id, TTL, row)   # safe\
        \ to repopulate: DB is source of truth\n  return row\n```\nKey rule: **a Redis\
        \ miss must be treated as \"reload from DB\", never as \"session does not\
        \ exist\".**\n\n**C. Write-through / commit-to-DB-before-Redis**\nPersist\
        \ every state transition to the DB *first*, then update Redis. Never keep\
        \ incremental in-progress state only in Redis. Redis TTL then only ever drops\
        \ a rebuildable cache.\n\n**D. If you must rely on hard expiry in Redis, make\
        \ it observable**\n- Emit a key-space expiry notification / sentinel (`DEL`)\
        \ on eviction and reconcile against DB.\n- Return an explicit marker on miss\
        \ so the app can distinguish `MISS_NEW` vs `MISS_EXPIRED` vs `FOUND` — eliminates\
        \ the silent failure.\n\n---\n\n## 4. Concrete Config / Operations Recommendations\n\
        \n- **Set a DB-side `expires_at`** column and enforce with `WHERE expires_at\
        \ > now()` in continuation queries; schedule a cleanup job (or trigger) to\
        \ move expired rows to `abandoned`. DB remains the single source of truth.\n\
        - **Choose Redis TTL:**\n  - `SETEX session:<id> 1800 <payload>` for hot state,\
