        ) normally does:\n```\nresume(sessionId):\n  state = getUserSession(sessionId)\
        \ from redis   # fast path\n  if state is nil:\n      return \"session not\
        \ found\" / create new   # <-- silently treats valid DB row as gone\n  restore(context:\
        \ questionIndex, timer, nonce, transcript buffer) from state\n```\n\n### 2.\
        \ When/why it silently breaks\n\nRedis is a *cache of runtime state*, but\
        \ the code treats it as an *authority*. The DB row is durable and still valid,\
        \ yet every resume path reads Redis first and gives up when it returns `nil`.\
        \ It breaks in these cases:\n\n1. **Fixed TTL shorter than the interview window.**\
        \ A 30–60 min TTL is a common default. An interview (or a paused/left-open\
        \ session) running past the TTL evicts the key while the DB still shows `in_progress`.\
        \ `GET session:<id>` → `(nil)` mid-session.\n2. **Long idle → LRU/`volatile-lru`\
        \ eviction.** Even before TTL, under memory pressure Redis evicts volatile\
        \ keys; the least-recently-used session dies first.\n3. **Restart / failover\
        \ of the Redis node.** Logged-out volatile data doesn't survive an empty-data\
        \ restart, an AOF-less flush, or moving to a fresh node. DB unaffected.\n\
        4. **Key expired but the client holds a stale copy.** The API process cached\
        \ the session object; the client believes it can continue, but a fresh key\
        \ (re-issued nonce, new counter) is gone — token revalidation against the\
        \ DB succeeds while all *runtime* context is lost.\n\nThe \"silent\" part\
        \ is the dangerous half: the downstream call succeeds against the DB (auth/attempt\
        \ record), so no error surfaces — it just **re-initializes state to a blank/default\
        \ and the user loses their place without any signal**, or it returns a fabricated\
        \ \"not found\" that is indistinguishable from the session never existing.\n\
        \n### 3. Detection (so it's not silent)\n\nStop relying on a bare `GET`. Install\
        \ the **keyspace notification** channel for the session namespace so expiry\
        \ is observable:\n\n```\n* Safer (intent narrow):\nconfig set notify-keyspace-events\
        \ KEgx\n\n# Or subscribe programmatically to __keyevent@0__:expired and __keyevent@0__:del\n\
        ```\n\nSmall probe to confirm current behavior:\n\n```python\nimport redis,\
        \ json\nr = redis.Redis(db=0)\nsession_id = \"ses_9f4c...\"\nkey = f\"session:{session_id}\"\
        \nr.set(key, json.dumps({\"q\": 3, \"timer\": 504, \"nonce\": \"abc\"}), ex=60)\n\
        print(r.get(key))          # -> state\ntime.sleep(61)\nprint(r.get(key)) \
        \         # -> None  (evicted; DB row still valid)\n```\n\nThat `None` is\
        \ the break. Now instrument the *expired* event so the DB still marks the\
        \ attempt, e.g.:\n\n```python\n# on __keyevent expired for 'session:*':\n\
        mark_interview_abandoned(session_id, reason=\"runtime_state_expired\")\ncan_rebuild\
        \ = has_durable_snapshot(session_id)   # DB has a last-checkpoint blob\n```\n\
        \n### 4. Remediation\n\n**Option A (recommended, low effort and robust):**\
        \ Don't free-form the TTL — derive it from the DB and make Redis rebuildable.\n\
        \n1. Sliding TTL per touch: `SESSION_TTL = max(interview_window, published_eta)\
        \ + idle_grace`.\n2. **Rebuild-on-miss from DB.** When `GET session:<id>`\
        \ is nil but the DB row is `in_progress`, reconstruct runtime state from the\
