      the DB Is Valid


      ## 1. The Architecture Mismatch


      Interview continuation depends on a split-brain between two stores:


      - **Databa'
    output: "# Interview Session Continuation: Why Fixed Redis TTL Breaks Even When\
      \ the DB Is Valid\n\n## 1. The Architecture Mismatch\n\nInterview continuation\
      \ depends on a split-brain between two stores:\n\n- **Database (system of record):**\
      \ authoritative, survives restarts. Holds the interview record, candidate profile,\
      \ submitted answers, status (`in_progress`, `completed`).\n- **Redis (runtime/fast\
      \ state):** ephemeral, fast. Holds *derived working state* — current question\
      \ index, an answer draft being typed, LLM conversation context, per-step timers,\
      \ idempotency keys, distributed locks, cursor/collation position.\n\nThe DB\
      \ row remains valid and says `status='in_progress'`. Redis, meanwhile, silently\
      \ dropped the runtime object when its TTL elapsed. **Continuation breaks exactly\
      \ when the authoritative truth (DB) and the ephemeral truth (Redis) disagree.**\n\
      \n## 2. When It Breaks\n\nContinuation breaks in these concrete situations:\n\
      \n| Trigger | Mechanism |\n|---|---|\n| **Fixed (non-sliding) TTL** | `EXPIRE\
      \ key 900` set once at creation; never refreshed on access. Any session alive\
      \ > 15 min times out. |\n| **TTL < realistic session length** | Long multi-stage\
      \ interviews or slow candidates legitimately exceed a short TTL. |\n| **Idle-but-open\
      \ sessions** | Session pre-provisioned (TTL starts at creation, not first activity);\
      \ candidate sits idle reading → TTL expires before any interaction. |\n| **Long\
      \ async gaps** | LLM inference, file upload/processing, or a pending question\
      \ between user turns exceeds the TTL. |\n| **Partial retirement between reads**\
      \ | Redis uses *lazy* + *active* expiry. A key is evicted on first access after\
      \ TTL, or by the background eviction cycle — with no callback to the DB and\
      \ no surfaced error. |\n| **Distributed lock expiry** | If TTL also guards a\
      \ lock (e.g., answer submission), the lock releases mid-operation → concurrent\
      \ writes/corruption, not just a cache miss. |\n\nThe critical property: **Redis\
      \ TTL expiry is silent and best-effort.** There is no transactional notification\
      \ to the DB; nothing flips the DB status. So the DB continues to assert \"this\
      \ interview exists and is in progress,\" while Redis returns `nil`.\n\n## 3.\
      \ Why Continuation Breaks (Root Cause)\n\nOn the next request the resume path\
      \ is typically:\n\n```\nGET /interview/continue?session=<id>\n  → SELECT * FROM\
      \ interview WHERE id=?      # row exists, status=in_progress   (OK)\n  → GET\
      \ session:<id> from Redis             # MISS / nil                       (SILENT)\n\
      ```\n\nBecause the DB lookup \"succeeded,\" the code proceeds to read the runtime\
      \ state and hits an empty/nil value. Three failure modes result:\n\n1. **Silent\
      \ reset** — code treats a `nil` as \"new session,\" rebuilds from scratch (question\
      \ 0), and the candidate's in-progress draft answer or position is lost without\
      \ any error.\n2. **Crash / exception** — code *requires* the Redis object (reads\
      \ `state[\"current_question\"]`, `[\"partial_answer\"]`) and throws a `KeyError`/`NullPointerException`\
      \ on the miss. The continuation HTTP call 500s.\n3. **Partial / index desync**\
      \ — if the runtime state was persisted asynchronously and evicted between write\
      \ and flush, Redis's index is *behind* the DB, and resuming jumps to the wrong\
      \ question.\n\nNone of these notify the user. The DB is valid; the *reason*\
      \ it's broken is invisible until the candidate clicks continue.\n\n## 4. Code\
      \ Illustration\n\n**Faulty fixed-TTL creation + non-refreshed access:**\n\n\
      ```python\n# creation\nredis.setex(f\"session:{sid}:runtime\", 900, json.dumps({\n\
      \    \"q_index\": 0, \"partial\": \"\", \"llm_ctx\": []\n}))\n\n# resume — reads\
      \ but never refreshes TTL\ndef resume(sid):\n    row = db.get_interview(sid)\
      \          # VALID, status=in_progress\n    raw = redis.get(f\"session:{sid}:runtime\"\
      )  # after 900s => None, NO error\n    if raw is None:\n        # silent reset:\
      \ continue from scratch, draft lost\n        return start_new_session(sid)\n\
      \    state = json.loads(raw)\n    return render_question(state[\"q_index\"])\n\
      ```\n\n**Robust sliding expiry (refresh on every touch):**\n\n```python\ndef\
      \ touch_runtime(sid, payload):\n    key = f\"session:{sid}:runtime\"\n    pipe\
      \ = redis.pipeline()\n    pipe.set(key, json.dumps(payload))\n    pipe.expire(key,\
      \ 900)                # sliding — renewed on each activity\n    pipe.execute()\n\
      ```\n\n## 5. Recommendations (Ordered by Correctness)\n\n**1. Make Redis a cache,\
      \ not the source of truth — rebuild on miss (cache-aside).**\nCatch the `None`\
      \ and *reconstruct* runtime state from the DB instead of blank-starting:\n\n\
      ```python\ndef resume(sid):\n    row = db.get_interview(sid)\n    raw = redis.get(f\"\
      session:{sid}:runtime\")\n    if raw is None:\n        state = rebuild_from_db(row)\
      \     # reuse persisted checkpoint\n        redis.setex(f\"session:{sid}:runtime\"\
      , 900, json.dumps(state))\n        return render_checkpoint(state)\n```\n\n\
      **2. Checkpoint partial state into the DB.** Persist the in-progress draft answer\
      \ / question index periodically (autosave). Redis loss then degrades to \"we\
      \ lost a few seconds of caching,\" never \"we lost the draft.\"\n\n**3. Use\
      \ sliding TTL everywhere runtime state is touched** — never set-once-only.\n\
      \n**4. Set TTL as a safety net, not the correctness boundary.** Size it generously\
      \ (`max(user idle limit, LLM timeout) + margin`) so eviction only cleans genuinely\
      \ abandoned sessions, not live ones.\n\n**5. Alert on silent expiry.** Enable\
      \ Redis **keyspace notifications** for evict/expire events and log a warning\
      \ with the session id so silent loses become visible:\n\n```bash\nredis-cli\
      \ CONFIG SET notify-keyspace-events Ex\n```\n\n**6. Guard locks with an identity\
      \ check (Redisson-style / compare-and-remove).** If the runtime TTL also protects\
      \ a distributed lock, verify the token before releasing to avoid breaking a\
      \ lock that already expired and was re-acquired by another actor.\n\n## 6. Summary\n\
      \nContinuation breaks **when a fixed (non-sliding) Redis TTL elapses during\
      \ a session that the authoritative DB still considers valid and in progress.**\
      \ The underlying reason is the mismatch of persistence semantics: Redis expiry\
      \ is silent, lazy, and non-transactional, so a cache miss on the *correct* DB\
      \ object is mistaken for a new session or thrown as an error. The fix is to\
      \ treat Redis as a rebuildable cache with sliding expiration, checkpoint the\
      \ critical draft state in the DB, and monitor expiry events so the failure is\
      \ no longer silent.\n\nThe remaining risk on any pure-Redis runtime is inherent;\
      \ eliminating it requires the DB to be the recoverable source of truth. If you'd\
      \ like, I can next draft the exact Lua/sliding-TTL scripts, the DB checkpoint\
      \ migration, or the keyspace-notification logger for your stack."
