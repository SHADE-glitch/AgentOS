      output: "## Interview Session Continuation vs Redis TTL Expiry — Root Cause\
        \ & Remediation\n\n### 1. Architecture & Where State Lives\n\nYou have two\
        \ nested storage layers:\n\n- **Database (source of truth / durable):** interview\
        \ attempt record, user, questions, and a transcript/progress snapshot. Survives\
