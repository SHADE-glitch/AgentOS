        def resume(session_id):\n    state = r.get(f\"session:{session_id}\")\n  \
        \  if state is None:\n        row = get_interview_attempt(session_id)    \
        \      # DB = source of truth\n        if row and row[\"status\"] == \"in_progress\"\
        :\n            state = rebuild_runtime(row, from_durable_checkpoint=row[\"\
        checkpoint\"])\n            r.set(f\"session:{session_id}\", json.dumps(state),\
        \ ex=TTL)\n            log.info(\"state rebuilt from DB after redis expiry\"\
        )\n            return state\n        return None                         \
        \             # genuinely absent\n    return state\n```\n\n3. **Error contract:**\
        \ if a *fresh* key returns nil and no durable snapshot exists, return `410\
        \ Gone`/explicit `SESSION_RUNTIME_EXPIRED`, not a generic 404, so the client\
        \ can offer \"restart or resume-from-checkpoint.\"\n\n**Option B:** Treat\
