        \ usually equals a TTL-vs-DB mismatch; alert on it rather than on raw cache\
        \ misses.\n- **Eviction policy:** use `allkeys-lru`/`volatile-ttl` awareness\
        \ — if nearing `maxmemory` the cache can evict *before* TTL, worsening the\
