      output: "# Interview Session Continuation Breakage: Redis TTL Expiry vs. Persistent\
        \ DB\n\n## 1. Problem Statement\n\nYou maintain **two distinct stores** with\
        \ mismatched lifecycle guarantees:\n\n- **Redis**: volatile interview *runtime\
        \ state* (current question index, answers in progress, timers, draft answers,\
        \ anti-cheat cursor, token budget). Pinned to a **fixed TTL**.\n- **Authoritative\
        \ DB**: interview session record (session ID, candidate, status, timestamps,\
        \ submitted answers) that lives indefinitely.\n\nBecause the runtime state\
        \ carries the progression cursor (not just cacheable de-duplication), its\
        \ expiry makes the interview **unresumable** even though the DB row says `status=in_progress`.\n\
        \n## 2. Failure Timeline (when continuation breaks)\n\n| t | Redis | DB |\
        \ User experience |\n|---|-------|----|-----------------|\n| 0 | session:state,\
        \ TTL=3600s | session created, status=in_progress | start |\n| 1200 | refreshed\
        \ (extends TTL) | updated | mid-interview, works |\n| 3600+ | **key evicted**,\
        \ no refresh | still `in_progress` | user returns, sees session but cannot\
        \ continue |\n| 3700 | **break** | still `in_progress` | `/continue` returns\
        \ 404 or empty state; retry/fresh-start ambiguity |\n\n**Why it breaks:**\
        \ continuation assumes `DB.valid` ⇔ `Redis.valid`. That invariant is false.\
        \ Three concrete schema/code paths break:\n\n1. **Stale `in_progress` orphan**\
        \ — DB says active, Redis state gone ⇒ user is stranded mid-interview with\
        \ no resume point and no explicit `aborted/expired` transition.\n2. **Desync\
        \ of \"last question answered\"** — the resume cursor is only in Redis; after\
        \ expiry the worst case is re-answering/duplicate submission against an already-advanced\
        \ DB record (or worse, overwriting submitted answers).\n3. **Partial answer\
        \ loss with no accounting** — draft/resume content in Redis evaporates; DB\
        \ only tracks committed answers, so the loss is invisible to audit.\n\n##\
        \ 3. Root Causes (security + DB lens)\n\n- **Fixed TTL is an absolute timer,\
        \ not an idle timer.** It expires a *wall-clock* duration after last *write*\
        \ upstream only if you reset TTL on every write. Most \"fixed TTL\" bugs are:\
        \ TTL set once at creation (`SETEX`) and never re-armed on refresh ⇒ expiry\
        \ is guaranteed at `created + TTL` regardless of activity (see §4).\n- **TTL\
        \ drift between calls.** A long-running question page produces no Redis writes\
        \ ⇒ valid active session dies mid-question.\n- **No tombstone/lifecycle coupling.**\
        \ Nothing drives a DB state transition (`in_progress → expired`) from the\
        \ Redis eviction event. Redis eviction is fire-and-forget; there is no hook.\n\
        - **ABA on session reuse / no generation token** ⇒ after expiry, a new session\
        \ or empty state can be mistaken for the valid one.\n\n## 4. Code Example:\
        \ TTL set once, never re-armed (the silent-expiry bug)\n\n```python\n# WRONG\
        \ – fixed TTL armed once at creation; silent expiry guaranteed\ndef create_session(state):\n\
        \    r.setex(f\"session:{state.id}\", 3600, serializer.dumps(state))\n   \
        \ # ⚠ nothing ever calls EXPIRE again\n\ndef touch(session_id):\n    state\
        \ = load(session_id)\n    state.last_heartbeat = now\n    r.set(session_id,\
        \ serializer.dumps(state))   # <-- re-write WITHOUT EXPIRE\n    # TTL is NOT\
        \ reset on write unless you re-arm it\n```\n\nIn Redis, `SET` on an existing\
        \ key with a TTL **preserves** the TTL only if you don't pass an expiry; actually\
        \ the nuance is: `SET` without TTL clears... no — behavior varies by command.\
        \ Be explicit:\n\n```python\n# CORRECT – re-arm TTL on every write (idle TTL\
        \ semantics)\nTTL = 3600  # idle timeout, not absolute lifetime\ndef touch(session_id):\n\
        \    state = load_and_advance(session_id)\n    r.set(session_id, serializer.dumps(state))\n\
        \    r.expire(session_id, TTL)   # always re-arm AFTER write\n```\n\nVerify\
        \ your driver: `SET key val` **removes** TTL; `GETSET`/`SETEX`/`EXPIRE` re-apply.\
        \ Many ORMs default `set` to clear TTL or keep it — **never rely on silent\
        \ behavior**.\n\n## 5. Recommended Fixes\n\n### 5.1 Make TTL an idle timeout,\
        \ and make DB the source of truth\n- Re-arm TTL on every meaningful write/heartbeat\
        \ (sliding window) so an **active** interview cannot die.\n- Drive continuation\
        \ reads from **DB-backed state**, using Redis purely as a fast cache of a\
        \ resume snapshot keyed by `session_id + generation`.\n\n### 5.2 Generation\
        \ / continuation token (closes ABA + replay)\n```python\nclass Session:\n\
        \    id: str\n    gen: int      # increments on every commit/advance\n   \
        \ status: str   # started | in_progress | completed | expired | aborted\n\n\
        # resume URL: /interview/{id}/continue?g=4\ndef resume(session_id, expected_gen):\n\
        \    db = tx.begin()\n    row = SELECT * FROM session WHERE id=%s FOR UPDATE\n\
        \    if row.status != 'in_progress':\n        deny(40x)                  \
        \                # no silent continue\n    state = cache.get(f\"state:{row.id}:{row.gen}\"\
        ) # gen-bound, not just id\n    if expected_gen != row.gen:\n        return\
        \ conflict(\"stale resume link\")       # prevent re-answer/replay\n```\n\n\
        ### 5.3 Rebuild-on-expiry + explicit lifecycle transition\nOn Redis key miss\
        \ (caught **without** erroring as a breach), rebuild from DB and bump `gen`,\
        \ **or** transition DB status explicitly rather than leaving a phantom `in_progress`:\n\
        \n```python\ndef on_cache_miss(session_id):\n    row = load_db(session_id)\n\
        \    if row.status == 'in_progress' and is_expired(row.last_active, TTL):\n\
        \        transition(session_id, 'in_progress', 'expired')   # audit trail\n\
        \        return None                                         # 410 Gone /\
        \ restart flow\n    restore_snapshot(session_id, row)                    \
        \    # resume normally\n```\n\n### 5.4 Idempotency for sub-answers (protect\
        \ DB integrity)\nBecause a stale resume link could lead to duplicate submission,\
        \ make answer commits **idempotent** on `(candidate, question_id, attempt_id)`\
        \ so a re-post cannot corrupt the row.\n\n### 5.5 Configuration / ops\n```yaml\n\
        cache:\n  mode: sliding-idle            # not absolute-fixed\n  default_ttl:\
        \ 3600\n  maxmemory_policy: allkeys-lru # ensure eviction is predictable &\
        \ testable\n  on_expire: transition_to_expired  # driven by app check, not\
        \ redis hook\n```\n- Monitor **eviction/expiry** counters and surface a metric:\
        \ `session_state_expired{result=\"orphan\"|\"expected\"}`.\n- Add a \"continue\"\
        \ smoke test: fast-TTL test env where `TTL=2s`, assert resume returns explicit\
        \ `expired` and never a silent partial state.\n\n## 6. Security-Specific Concerns\
        \ (my role focus)\n\n- **Silent re-entry as another actor**: If expiry drops\
        \ a user into a *fresh* session while a DB `in_progress` row lingers, a second\
        \ user/resumed-request could be attributed wrongly. Bind state to `session_id\
        \ + candidate_id + gen` and **validate ownership** on every resume.\n- **Replay\
        \ / duplicate-answer injection** from an old resume link — mitigate with `gen`\
        \ plus idempotent writes (§5.4).\n- **AuthN token in Redis**: ensure any auth\
        \ tokens co-located with session state are not being silently purged mid-interview\
        \ causing spurious 401s — same sliding-TTL rule applies; never store long-lived\
        \ credentials with an idle TTL you cannot refresh.\n- **Auditability**: every\
        \ `in_progress → expired` transition must be logged (who/what/when) so support\
        \ can distinguish \"expired session\" from \"actively tampered session.\"\n\
        \n## 7. Decision Summary\n\n| Choice | Verdict |\n|--------|---------|\n|\
        \ Fixed (absolute) TTL | ❌ guarantees silent expiry for long-running interviews\
        \ |\n| Sliding idle TTL + re-arm on write | ✅ required for live sessions |\n\
        | Redis-only resume cursor | ❌ single point of loss; DB must be authoritative\
        \ |\n| DB state + gen-bound cache + explicit `expired` transition | ✅ recommended\
        \ reference design |\n\n**Bottom line:** continuation breaks whenever the\
        \ TTL is fixed (absolute) rather than sliding, and whenever the resume cursor\
        \ lives *only* in Redis with no DB-authored `in_progress→expired` transition.\
        \ Read the DB as source of truth, treat a Redis miss as \"expired or rebuild,\"\
        \ bind resumability to a `generation` token, and re-arm TTL on every write\
        \ so an actively-used session is never evicted."
