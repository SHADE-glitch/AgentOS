      output: "# [SUPPORT] 面试会话 Redis 状态固定 TTL 静默过期 —— 续读(continuation)何时/为何中断\n\n\
        Role：security-engineer（支持 Database Engineer 主分析）\nTeam：team-18087af2\nFocus：Redis\
        \ 会话状态 + MySQL 双写一致性、过期语义、续读失败点\n\n## 1. 核心诊断（先给结论）\n\n`InterviewStateStore`\
        \ 用**固定 24h 绝对 TTL**（`backend/.../InterviewStateStore.java:25,51`）存储会话状态机，且代码注释把它标为「状态机的单一权威来源」（`InterviewStateStore.java:15`）。但这是架构上自相矛盾的：\n\
        \n- Redis 带固定 TTL = **可被时间驱逐的缓存**，不是持久事实；\n- MySQL（`interview_session`）才是真正持久、不被驱逐的事实，却被降级成「Redis\
        \ 缺失时的回退」。\n\n续读（continuation）是否中断，取决于两个问题的答案：\n1. 状态读取路径是否有 **DB 回退重建** 分支；\n\
        2. Redis 过期时刻是否落在 **DB/Redis 写序的中间窗口** 内。\n\n| 场景 | DB 为权威? | 续读是否会中断 |\n\
        |---|---|---|\n| 纯 TTL 过期，用户下次按 answer 提交 | requireAsking 有回退，会重建 | **不硬断**，但静默恢复\
        \ |\n| TTL 过期 + Redis 缓存策略提前逐出 / 重启丢键 | 同上回退 | **不硬断**，静默恢复 |\n| TTL 过期窗口内撞上「DB\
        \ 已写、Redis 未写」崩溃/异常 | DB 领先 | **状态可恢复，但 QA 配对被污染** |\n| 会话 >24h 无活动 | 回退覆盖\
        \ | **不硬断**，但承担风险 |\n\n> 关键结论：本仓库**恰好**因为 `requireAsking()` 有完整的 DB 重建回退（`InterviewService.java:380-399`），纯\
        \ TTL 过期目前「看起来」不中断续读——它是被隐藏的，不是被消除的。真正的、会破坏续读的缺口在**写序窗口 + TTL 命中该窗口**。\n\n\
        下面分「何时断 / 为何断 / 怎么修」。\n\n---\n\n## 2. 何时与为何中断（Root Cause）\n\n### 2.1 固定 TTL\
        \ 是「保留期」不是「空闲超时」（根本性错配）\n\n`InterviewStateStore.java:51`：\n```java\nredissonClient.getBucket(key).set(json,\
        \ TTL_HOURS, TimeUnit.HOURS);  // 固定 24h\n```\n这是**每次写都重置到固定 24h**（绝对续期式），不是「固定不过期\
        \ + 空闲滑动」的会话存活语态。它隐含的语义是：「这个 key 24 小时不看就不该存在」，而业务真实生命周期是「**会话仅在 FINISHED\
        \ 或主动废弃时才结束**」。二者是两套时钟，必然出现「会话仍 open（DB status=ASKING）却已无 Redis 状态」的中间态。\n\
        \n### 2.2 续读中断的真正触发点（写序窗口）\n\n所有状态推进都遵循「先写 DB、后写 Redis」：\n- `create()`：`sessionMapper.updateById`\
        \ → `stateStore.write`（`InterviewService.java:111-117`）\n- `answer()`：`sessionMapper.updateById(session)`\
        \ → `stateStore.write(...)`（`InterviewService.java:183-189`）\n\n`answerStream()`\
        \ 同样（`InterviewService.java:258-264`）。\n\n**中断时序**：\n1. 会话在 Redis 尚无 key（24h\
        \ 未活动，TTL 已消），但 DB 存着最新的 `ASKING/count=N/currentQuestionId=Q`。\n2. 用户提交答案\
        \ → `answer()` → `requireAsking()`（`InterviewService.java:204,381`）读到 Redis\
        \ 为 null → 回退 DB 重建（`InterviewService.java:387-389`）→ 续读成功。\n3. **但**重建依赖「DB\
        \ 一定领先于 Redis」。若在 DB/Redis 写窗口内 `stateStore.write()` 抛异常（`InterviewStateStore.java:53-55`\
        \ 会把异常包装为 `BizException` 抛到调用层，`answer()` 的 `finally` 只解锁不补偿），则：DB 已提交新 question/count，Redis\
        \ 仍旧——请求以「写入失败」结束。用户重试 → `saveUserMessage`（`InterviewService.java:132,207`）**重复插入回答**\
        \ → `extractQAPairs`（`InterviewService.java:325-338`）的「一问一答」配对被破坏 → 评分/是否结束判断错乱。**这才是\
        \ TTL 掩盖下的真·续读破坏。**\n\n### 2.3 静默过期：无失效信号，且被回退静默吞咽\n\n- Redis 到期即删，进程日志无 warning（`read`\
        \ 返回 null 后直接查 DB，`InterviewService.java:382-389` 无任何 `log.warn`）。运维无法观测「状态曾过期」。\n\
        - 若未来某次「优化」把 `requireAsking` 的 DB 回退删掉（声称 Redis 是 SSOT、少打 DB），则 >24h 非活动会话将\
        \ **硬性中断**，且仅表现为状态错误——这是我最担心的蔓延路径。\n\n### 2.4 TTL 之外的「更快的静默过期」来源（数据库工程视角必列）\n\
        \n固定 TTL 只是**时间维**的过期。实际中 key 还可能**提前**消失：\n- **maxmemory 驱逐**：Redis 若配 `allkeys-lru`/`volatile-lru`\
