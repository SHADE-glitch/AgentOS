        \ currentQuestionId`), so Redis is currently a redundant mirror, not a real\
        \ reducer. The comment \"单一权威来源\" (`InterviewStateStore.java:15`) is inaccurate\
        \ until Redis starts holding states the DB can't.\n\nSupporting-role relevance:\
        \ **Security** (secrets slide off gracefully here because the state is keyed\
        \ by integer `sessionId`; no hint leakage — but expiry-caused per-user visibility\
        \ needs a boundary note), **Reviewer** (two-store truth divergence is a classic\
        \ maintainability trap), **Backend Architect** (single-source-of-truth call,\
        \ below).\n\n## 4. Design options (Decision Framework)\n\n**Option A — Keep\
        \ Redis as authority, enlarge TTL + refresh on activity**\n- Strengths: minimal\
        \ change.\n- Weaknesses: never fixes the leak; unbounded TTL → stale sessions;\
        \ still non-observable.\n- Best for: a stopgap, not a fix.\n\n**Option B —\
        \ Make DB the single source of truth; Redis = L1 cache, always reconstructible**\n\
        - Strengths: expiry becomes harmless by construction; TTL can be short (repair\
        \ interval, not lifetime); observability via `lastActiveAt`; abandoned-session\
        \ GC possible.\n- Weaknesses: one extra DB read on cache miss (already effectively\
        \ reimbursed by the fallback).\n- Best for: this codebase, because the trio\
        \ already lives in DB columns — this is a small refactor.\n\n**Option C —\
        \ Two-tier state (horizontally replace current single key)**\n- Strengths:\
        \ separates hot turn guards (short TTL) from durable session cursor (DB).\n\
        - Weaknesses: more surface, more code.\n- Best for: only once turn-level reducer\
        \ state actually arrives.\n\n**Decision: Option B**, with the TTL made into\
        \ an explicit repair interval and a reconciliation job. It removes the \"\
        silently expire\" class of bug entirely rather than enlarging the window.\n\
        \n## 5. Recommended implementation\n\n**Step 1 — Give the session a DB-side\
        \ activity timestamp.**\n```sql\nALTER TABLE interview_session ADD COLUMN\
        \ last_active_at DATETIME NULL;\n```\n\n**Step 2 — Shift authority to DB;\
        \ make Redis pad a rebuildable cache.** Pad `InterviewStateStore`:\n```java\n\
        private static final long TTL_HOURS = 24; // repair window, not session lifetime\n\
        \npublic SessionState read(Long sessionId) {\n    String json = redissonClient.getBucket(key(sessionId)).get();\n\
        \    if (json == null) {\n        // genuine TTL miss -> observable, not silent\n\
        \        log.warn(\"session state absent in cache, will rebuild from DB: {}\"\
        , sessionId);\n        return null; // caller already falls back to DB via\
        \ requireAsking()\n    }\n    // parse + return (unchanged)\n}\n```\nKeep\
        \ the fallback but make it the **only** write-through owner, and always touch\
        \ `last_active_at` in the same DB transaction.\n\n**Step 3 — Add reconciliation\
        \ + observability.** A `@Scheduled` job:\n- finds `status IN (START, ASKING)`\
        \ rows with `last_active_at < now()-threshold` → marks them expired (or archives),\
        \ instead of relying on Redis TTL.\n- compares Redis presence vs DB expectation\
        \ and logs drift.\n- emits a metric `interview.session.rebuilt_from_db` on\
        \ each miss.\n\n**Step 4 — Ban divergence.** Either persist any of the reserved\
        \ statuses to DB when introduced, or do not let them be the sole record of\
        \ a turn guard.\n\n## 6. Verification\n\n- **TTL expiry test:** set `TTL_HOURS`\
        \ small, idle 25 h, resume → assert the fallback rebuilds and logs a warning;\
        \ assert no `INTERVIEW_STATE_ERROR`.\n- **Reconciliation test:** insert an\
        \ abandoned `ASKING` row with old `last_active_at` → asserted moved to expired;\
        \ assert Redis key cleared.\n- **Drift test:** wipe only the Redis key → job\
        \ logs drift and rebuilds; assert no message loss.\n- **Concurrency test:**\
        \ two `answer()` calls under the distributed lock → assert still serialized,\
        \ single `question_count` increment.\n\n## 7. Residual risks / recommendations\
        \ to backend\n\n- Make TTL a **config value**, not a constant (`interview.state-ttl-hours`).\n\
        - Because the miss-fallback will exist, **ship the warning log/metric in the\
        \ same change** as the rebuild, otherwise the \"silent\" behavior persists.\n\
        - When Redis-first-only transient states are introduced, they must carry an\
        \ **idempotency key** so a rebuild never re-applies a half-finished turn.\n\
        \nNet: the correct fix is not \"bigger TTL\" — it is **making DB the durable\
        \ truth and Redis an observable, rebuildable cache**, which turns a nasty\
        \ silent-cliff bug into a logged, self-healing path."
