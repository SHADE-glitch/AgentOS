      output: "# Database Engineer Review: Redis TTL vs Persistent DB Continuation\n\
        \n## 1. Problem Statement\n\nInterview session state lives in two places:\n\
        - **Redis** — runtime/hot state with fixed TTL (default TTL expiry)\n- **Persistent\
        \ DB** — durable session record (still valid)\n\nWhen Redis silently evicts\
        \ a key via TTL, the session is *still valid in the DB*, but the runtime state\
        \ is gone → **continuation breaks** (the assistant cannot resume a session\
        \ that was never marked \"finished\").\n\n## 2. Why Continuation Breaks\n\n\
        Root cause is a **layering mismatch between ephemeral time-to-live and durable\
        \ validity**. Three failure modes:\n\n### A. Fixed TTL ≠ Business Lifetime\n\
        A single hardcoded TTL (\"expire in 30 min\") ignores *when* the session becomes\
        \ invalid. TTL measures **wall-clock age**, not **activity** or **business\
        \ completion**. If a user sits idle >TTL in the middle of a long/valid session,\
        \ Redis drops the state while the DB row is healthy.\n\n### B. Silent Eviction\
        \ (no tombstone)\n`EXPIRE` removes the key with zero trace. No event, no tombstone\
        \ written. The orchestrator has no way to distinguish \"evicted by TTL\" from\
        \ \"session never existed\" unless it explicitly checks `exists`. The DB claims\
        \ the session is live → **divergent truth**: two source-of-truth stores disagree.\n\
        \n### C. TTL refresh not wired to read/write path (idle eviction absent)\n\
        Without a **read hit update** (`EXPIRE` on every access), the TTL becomes\
        \ a hard deadline rather than an idle timeout. Reads after expiry fail although\
        \ the user is actively continuing.\n\n## 3. Failure Sequence\n\n```\nt0  \
        \ session created, DB row + Redis key (TTL = +30min)\nt25  idle gap starts\n\
        t30  TTL fires silently → key evicted\nt31  client resumes → RESUME sessionID=…\n\
        t31  orchestrator loads Redis → cache MISS (null)\nt31  orchestrator treats\
        \ MISS as expired terminal state\nt31  returns \"session expired\" / resets\
        \ → continuation BROKEN  ← BUG\nt31  DB still has active row → next continuation\
        \ also sees stale\n```\n\nThe bug is deterministic when **DB validity outlives\
        \ Redis TTL**.\n\n## 4. Concrete Fixes (with config)\n\n### Fix 1 — Decouple\
        \ lifecycles: expire in DB too\nMake DB validity TTL-aware (compose session\
        \ TTL into the row or a TTL-aware expiry column), so grace/laziness in DB\
        \ equals Redis.\n\n```sql\nALTER TABLE session\n  ADD COLUMN expires_at TIMESTAMPTZ;\
        \            -- business expiry\n-- backfill\nUPDATE session SET expires_at\
        \ = created_at + INTERVAL '30 minutes'\n  WHERE expires_at IS NULL;\n```\n\
        \nOn each continue, validate against **one** clock (`expires_at`) and refresh\
        \ it + Redis TTL atomically.\n\n### Fix 2 — Idle (sliding) TTL instead of\
        \ fixed TTL\nRefresh on every read/write so Redis TTL approximates \"idle\
        \ timeout\", mirrored by DB.\n\n```python\ndef touch(session_id: str) -> bool:\n\
        \    # sliding window: any access resets the clock in BOTH stores\n    ok\
        \ = redis.execute_command(\n        \"EVAL\", SCRIPT_TOUCH, 1, SESSION_KEY(session_id),\n\
        \        str(IDLE_TTL_S))\n    if ok:\n        db.execute(\n            \"\
        UPDATE session SET expires_at = now() + make_interval(secs => %s) \"\n   \
        \         \"WHERE id = %s AND expires_at > now()\",\n            (IDLE_TTL_S,\
        \ session_id))\n        assert(db.rowcount == 1)  # DB row gone → treat as\
        \ expired\n    return ok\n```\n\n### Fix 3 — Handle MISS as *recoverable*,\
        \ not terminal (defense in depth)\nRedis is the **cache**, DB is the **source\
        \ of truth**. On a Redis MISS, resolve from DB; only if `expires_at` is past\
        \ do you terminate.\n\n```python\ndef load(session_id: str) -> Session:\n\
        \    raw = redis.get(SESSION_KEY(session_id))\n    if raw:\n        # cache\
        \ warm path\n        redis.expire(SESSION_KEY(session_id), IDLE_TTL_S)  #\
        \ sliding\n        return deserialize(raw)\n\n    # CACHE MISS → warm from\
        \ DB; do NOT treat as expired\n    row = db.get(session_id, check_expiry=True)\n\
        \    if row is None or row.expires_at <= now():\n        raise SessionExpired(session_id)\n\
        \    redis.setex(SESSION_KEY(session_id), IDLE_TTL_S, serialize(row))\n  \
        \  return Session.from_row(row)\n```\n\n### Fix 4 — Optional: write a tombstone/expiry\
        \ hint to Redis to make eviction observable\nInstead of relying on silent\
        \ TTL, an explicit lazy-delete also flags state for the DB:\n\n```python\n\
        # background sweeper once/min — single source of truth = DB expires_at\ndb.query(\
        \  # returns sessions DB believes are dead but Redis may still hold\n   \"\
        SELECT id FROM session WHERE expires_at <= now()\"\n).each(lambda id:\n  \
        \ redis.script_run(DEL_IF_EXPIRED, KEY(id), now_ts)\n   and db.update(\"session\"\
        , {\"status\": \"EXPIRED\"}, id))\n```\n\nThis makes the Redis eviction **consistent**\
        \ with the DB state instead of racing it.\n\n## 5. Consistency Options (pick\
        \ per SLO)\n\n| Approach | Consistency | Winner | Notes |\n|---|---|---|---|\n\
        | Redis write-through + DB TTL | Strong | single shared `expires_at` clock\
        \ | highest safety |\n| Redis cache, DB source-of-truth + sliding TTL | Read-repair\
        \ on miss | Redis just perf | recommended for AI session |\n| Fixed TTL in\
        \ Redis only | Weak / BUGGY | — | current behavior, breaks |\n\n## 6. Recommendation\n\
        \nAdopt **Fix 2 + Fix 3** together: sliding (activity-refreshed) TTL in Redis,\
        \ and treat any Redis MISS as a DB read-repair path. Make the DB's `expires_at`\
        \ the single authoritative clock; Redis TTL becomes a performance hint, never\
        \ the arbiter of continuation. This removes the silent-eviction divergence\
        \ and keeps long-running interview sessions continuable even across idle gaps\
        \ that exceed the old fixed TTL.\n\nKey DB-only deliverables to the lead:\n\
        - Add `expires_at TIMESTAMPTZ` + index to `session` table.\n- All session\
        \ reads gate on `expires_at <= now()`, not Redis key existence.\n- All writes\
        \ (`touch`) update `expires_at` alongside the Redis `EXPIRE` to keep clocks\
        \ in sync."
