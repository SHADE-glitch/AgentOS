      output: "# Database Engineer / Backend Architect — Analysis: Redis TTL expiry\
        \ breaks interview continuation\n\n## 1. Architecture at a glance (grounded\
        \ in code)\n\n- `InterviewStateStore.java:51` — every state write sets a **fixed,\
        \ absolute 24h TTL** (`TTL_HOURS = 24`), refreshed only on write, **never\
        \ on read** (`bucket.get()` at `InterviewStateStore.java:36` does not extend\
        \ it).\n- The state machine treats Redis as \"单一权威来源\" (`InterviewStateStore.java:15`),\
        \ holding `SessionState(status, questionCount, currentQuestionId)`.\n- The\
        \ DB `interview_session` row mirrors the same three fields (`status`, `questionCount`,\
        \ `currentQuestionId`) and is written *together* with Redis under the same\
        \ Redisson lock, **DB first, then Redis** (`InterviewService.java:183-189`).\n\
        - `requireAsking()` (`InterviewService.java:380-399`) has a **rebuild-from-DB\
        \ fallback**: if Redis read returns `null`, it reconstructs from the session\
        \ row and re-writes.\n\nSo the answer to \"does continuation break?\" is nuanced:\
        \ **plain idle expiry mostly *self-heals* only because of this fallback —\
        \ but the design is accidentally correct, and continuation genuinely breaks\
        \ in specific, concrete cases.**\n\n## 2. When continuation breaks — and why\n\
        \n### Break 1 — Redis unavailable (the main, real break) — `InterviewService.java:381`\n\
        ```java\nInterviewStateStore.SessionState state = stateStore.read(sessionId);\
        \  // line 381\n```\n`read()` catches only the JSON parse error (`InterviewStateStore.java:43`).\
        \ If the Redis **service is unreachable** (network partition, failover, maxmemory\
        \ eviction storm, server restart), `bucket.get()` throws a `RedissonException`.\
        \ That exception is **not** caught and propagates up — the DB fallback at\
        \ `InterviewService.java:383` is never reached because fallback is only reachable\
        \ when the return is `null`, not when the call throws.\n\nResult: **every\
        \ `answer` / `answerStream` fails**. Continuation breaks hard, even though\
        \ the DB is 100% valid — because the DB is consulted *after* a blocking Redis\
        \ call that never returns `null`.\n\n### Break 2 — TTL is absolute, not sliding\
        \ → lifetime bounds by wall-clock, not activity\n`TTL_HOURS = 24` starts at\
        \ the *last write*, and `read` never slides it. An idle-but-intact session\
        \ (user composes an answer, pauses, or returns within 24–48h) passes the 24h\
        \ mark → key gone while DB remains valid. It survives only if the fallback\
        \ fires. The break surfaces when the state record is not fully mirrored in\
        \ DB (see Break 3) or when the fallback itself is bypassed.\n\n### Break 3\
        \ — Lossy reconstruction once `SessionState` grows — `InterviewStateStore.java:27`\n\
        Today `SessionState` == 3 fields that the DB happens to mirror 1:1, so reconstruction\
        \ is *total*. The DB is a complete at-rest projection. But the moment the\
        \ runtime record gains fields that are **not** persisted to `interview_session`\
        \ — e.g. `askedQuestionIds`, an in-progress multi-step AI/RAG stage index,\
        \ current node/tool-calling position — the rebuild from DB is **lossy**. The\
        \ user resumes but the state machine can't answer \"where exactly was I,\"\
        \ and continuation breaks (silently resumes at a stale/earlier step repartitioned\
        \ by `questionCount` in `InterviewService.java:179`).\n\n### Break 4 — False\
        \ rejection via DB-first ordering skew — `InterviewService.java:340-346, 391`\n\
        Because DB is written before Redis in each transition, when the key expires\
        \ the fallback reconstructs from DB using `s.getStatus()` — including a **newly-FINISHED**\
        \ value. If a concurrent in-flight `answer` (whose old, previously-valid Redis\
        \ state said `ASKING`) hits a `requireAsking` whose read returned `null` and\
        \ whose DB row is already `FINISHED`, the user gets `INTERVIEW_FINISHED` (`InterviewService.java:391-392`).\
        \ A transient Redis expiry causes the state machine to **\"skip forward\"\
        \ to FINISHED** and reject the legitimate last answer.\n\n### Break 5 — TTL\
        \ shorter than a single transition\nIf the TTL (or any future shrink) is shorter\
