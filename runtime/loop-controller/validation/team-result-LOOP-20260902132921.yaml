        # Code Review — Redis fixed-TTL session state vs. persistent DB validity\n\
        \n**Role:** Database Engineer (code-reviewer) · **Scope:** interview state\
        \ machine in `InterviewService` + `InterviewStateStore` + `InterviewSession`\n\
        \n## TL;DR\n\n`InterviewStateStore` keys use a **fixed absolute TTL of 24h\
        \ measured from the last *write*** (`InterviewStateStore.java:25,51`), while\
        \ the owning `interview_session` DB row has **no expiry** (`InterviewSession.java`).\
        \ Redis and DB therefore have *different lifecycle clocks* for the same logical\
        \ session. Because the DB is the only store without eviction, an idle-but-valid\
        \ session **silently loses its Redis snapshot while the DB still reports it\
        \ as ongoing (`ASKING`/`START`)**.\n\nTwo qualifiers that make this code dangerous\
        \ in a subtle (not obvious) way:\n\n1. The **answer path already self-heals**:\
        \ `requireAsking()` treats Redis `null` as \"rebuild from DB\" and re-writes\
        \ a fresh 24h key (`InterviewService.java:381-389`). So a plain resume **does\
        \ not** hard-crash today — *only because* every state read funnels through\
        \ that one fallback.\n2. That fallback is precisely what makes the design\
        \ fragile and **silently wrong** in several cases — detailed below.\n\n##\
        \ Root cause: TTL semantics + split authority\n\n- TTL is **fixed, not sliding**:\
        \ `set(json, TTL_HOURS, TimeUnit.HOURS)` resets the clock only on *write*.\
        \ Reads do **not** extend it. So a session is kept alive only if a turn happens\
        \ every ≤24h *in sequence*.\n- The class comment claims Redis is the **\"\
        单一权威来源 / single authoritative source\"** for the state machine (`InterviewStateStore.java:15`),\
        \ yet `requireAsking` falls back to the DB — the DB is *de facto* the real\
        \ source of truth, Redis a cache. **The invariant is self-contradictory**,\
        \ and the caller's correctness depends on DB==Redis always holding at expiry.\n\
        - The DB writes and Redis writes are **not transactional**. `InterviewService`\
        \ has **no `@Transactional`** (verified — only RAG/Auth services do). Each\
        \ turn does `sessionMapper.updateById(...)` then `stateStore.write(...)` as\
        \ two independent, non-atomic operations.\n\n## When and why continuation\
        \ breaks\n\n**Case A — Paused > 24h, then resume (`START`/`ASKING` in DB,\
        \ key expired).**\n`read()` returns `null` (`:37`). `requireAsking` rebuilds\
        \ from DB and re-writes the state, so it does *not* error — *but* the rebuilt\
        \ `questionCount`/`currentQuestionId` are whatever the DB persisted at last\
        \ update. If the DB was momentarily behind the last Redis snapshot when the\
        \ key expirered (see Case C), the interview **silently rolls back** to an\
        \ earlier step: stale question re-presented, `currentQuestionId` trans; count\
        \ may drift. This is the \"silently expire while DB remains valid → continuation\
        \ wrong\" case.\n\n**Case B — Expiry + empty-answer / non-progressing session.**\n\
        `read()` also returns `null` on **JSON parse failure** (`:40-44`), conflated\
        \ with \"missing.\" Any schema/type drift in `SessionState` then triggers\
        \ an unlogged DB rebuild, masking a real deserialization bug as \"expiry.\"\
        \n\n**Case C — Non-transactional partial writes (the true silent break).**\n\
        Because `updateById` and `write` are separate, a crash/commit-split between\
        \ them converges on the DB. If Redis is *ahead* and then expires, the rebuild\
        \ trusts a DB that never saw the last transition → **progression lost**. Conversely\
        \ if Redis is *behind* (write delayed), the pre-expiry `requireAsking` reads\
        \ a **non-null stale** Redis state and **does not rebuild** — `questionCount+1`\
        \ advances from an old number. Neither is detected; both look like normal\
        \ operation.\n\n**Case D — Any future reader that touches Redis directly.**\n\
        Every conclusion above assumes readers go through `requireAsking`. The moment\
        \ reasoning/dashboard/health/metrics code calls `stateStore.read()` without\
        \ the DB fallback, `null` is interpreted as \"no session,\" and continuation\
        \ hard-breaks (404/INTERVIEW_NOT_FOUND) even though the DB row is still valid.\
        \ This is the latency bomb.\n\n**Case E — Eviction masquerades as expiry.**\n\
        Redis `maxmemory` eviction, restart, or `FLUSHDB` produce the identical `null`\
        \ signal and trigger the same DB rebuild — with the same Cases A/C hazards,\
        \ but *uncontrolled* and unpollows/monitored.\n\n**Case F — Ghost keys / leak.**\
        \ `delete()` (`InterviewStateStore.java:58`) is **never called** anywhere.\
        \ FINISHED sessions retain a Redis key for the full 24h and a permanent DB\
        \ row — storage cost and an authoritative-source divergence window.\n\n##\
        \ Recommendations\n\n1. **Make TTL sliding (idle, not absolute).** Reset `EXPIRE`\
        \ on *byte read* as well as write — e.g. capture → `RBucket` then re-`expire(key,\
        \ idleTimeout, HOURS)` on every `read()`. Add a separate **absolute hard cap**\
        \ + explicit `delete(sessionId)` on `finishSession` (`:340-349`) so abandoned-but-finished\
        \ sessions still get evicted, and no ghost keys remain.\n2. **Decide authority\
        \ and make it true.** Declare **DB = source of truth, Redis = read-through\
        \ cache**. Have the *only* legal read be the reconciling `requireAsking` (granted),\
        \ and never write Redis without DB. \n3. **Close the non-transactional gap.**\
        \ Mark the turn methods `@Transactional`, then write Redis only **after DB\
        \ commit** (e.g., `@TransactionalEventListener`/outbox). Then expiry-rebuild\
        \ is *always* correct because Redis can never lead the DB (`write` after commit).\
        \ Ordering today is `updateById` → `write` (`:186→188`, `:344→345`), which\
        \ is the safe direction, but only trust-enforcing transactionality makes it\
        \ a guarantee.\n4. **Idempotency on resume.** Key the turn on the last question\
        \ `message.id`, so a rebuild/re-answer can never double-advance `questionCount`\
        \ or re-issue a question. `askedQuestionIds` already derives dedup from messages\
        \ (`:141-144`) — keep that, don't trust `state.questionCount` as an authority.\n\
        5. **Emit a metric/alert on the expiry signal.** In `requireAsking`, when\
        \ `read()==null && DB.status in (START,ASKING)` → `log.warn(\"session state\
        \ expired/absent, reconciling from DB, sessionId=…\")`. Today this path is\
        \ **silent** (`:382`); it is the exact \"silent expiry\" event, now observable.\n\
        6. **Harden parse-vs-missing.** In `read()`, distinguish `null` (missing/expired\
        \ → reconcile) from parse failure (→ throw `BizException`/log ERROR, do **not**\
        \ reconcile) so schema drift is loud, not silent (`:37-45`).\n7. **Externalize\
        \ TTL** to configuration (`application.yml`, e.g. `interview.session-state-ttl`)\
        \ and set `maxmemory-policy` so state keys aren't evicted opportunistically;\
        \ monitor `evicted_keys` alongside. Current 24h is hard-coded and env-invariant.\n\
        \n## Risk priority\n- **High:** Case C/C/E silent divergence and Case D (future\
        \ direct readers) — data/UX corruption with no signal.\n- **Medium:** Case\
        \ A rollback on long pause; Case B conflating corruption with expiry.\n- **Low:**\
        \ Case F ghost keys / storage.\n\nThe single highest-leverage fix is **#1\
        \ (sliding TTL) + #2/#3 (single author, write-after-commit)**, which eliminates\
        \ the \"Redis expires but DB stays valid\" mismatch at its source."
