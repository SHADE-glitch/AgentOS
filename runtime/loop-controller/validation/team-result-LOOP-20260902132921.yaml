        \ is arguably worse because the code masks it.\n\n1. **Hard break (only when\
        \ Redis holds state the DB never sees).** Enumerated *reserved* statuses (`WAITING_ANSWER`,\
        \ `EVALUATING`, `FOLLOW_UP`, `SELECT_TOPIC`) exist in `InterviewStatus.java`\
        \ but are **never persisted** to `interview_session`. Current code only writes\
        \ `ASKING / START / FINISHED` to both stores, so today the divergence is latent\
        \ — but any future turn-state (reducer cursor, mid-AI-call marker) written\
        \ *only* to Redis will be lost on expiry with no DB fallback.\n2. **Self-healing\
        \ break that you can't observe.** `requireAsking()` (`InterviewService.java:380`)\
        \ already rebuilds a missing key from DB and re-writes it. So on the happy\
        \ path an expiry is absorbed silently — which is exactly the problem: **there\
        \ is zero logging/alerting, so you cannot detect that N sessions were rebuilt,\
        \ nor that each rebuild silently re-arms another 24 h window.**\n3. **Silent\
        \ resource leak / false cleanup (DB side — my domain).** Because the miss-fallback\
        \ rewrites the key, Redis present ≠ session live. The Redis TTL gives a *false\
        \ sense of expiry/GC* while abandoned `START/ASKING` session rows accumulate\
        \ in MySQL forever with no `lastActiveAt` signal. TTL here is a durability\
        \ cliff, not a cleanup mechanism.\n\n## 2. When and why it breaks (general\
        \ — for the review)\n\n| # | Trigger condition | Why it breaks | Breaks here?\
        \ |\n|---|---|---|---|\n| 1 | Gap between user actions > TTL (24 h) | Fixed/absolute\
        \ TTL set once at session start, or re-armed per write, expires regardless\
        \ of DB validity | Absorbed by fallback |\n| 2 | Async worker holds only `sessionId`,\
        \ reads state after expiry | Worker has no DB fallback path, silently no-ops\
        \ | Latent |\n| 3 | In-flight turn marker kept only in Redis (reducer / `WAITING_ANSWER`)\
        \ | On expiry the turn guard is lost → duplicate prompt, dropped answer, or\
        \ \"current question\" pointer resets to a stale checkpoint | Latent today\
        \ |\n| 4 | Crash window between DB update and Redis write (or reverse) | Two-store\
        \ write is non-atomic; whichever is written second wins on rebuild, so on\
        \ expiry the *older* store restores | Marginal (DB write precedes Redis write\
        \ at `:183-186`→`:188`, so DB is ahead — favorable) |\n\nFix key semantics:\
        \ a **fixed/absolute TTL** (`EXPIRE 86400` set once) guarantees expiry regardless\
        \ of activity; a **sliding TTL** (re-armed on each write) only expires after\
        \ `TTL` of *inactivity*. **This code re-arms the full 24 h on every `write()`\
        \ (`:51`)**, so it is effectively *sliding* — the real vulnerability is the\
        \ 24 h inactivity window, not a fixed deadline.\n\n## 3. Grounding in this\
        \ repo\n\n- `InterviewStateStore.java:25` `TTL_HOURS = 24` — fixed duration.\n\
        - `:51` `set(json, TTL_HOURS, TimeUnit.HOURS)` — reset on every write → sliding\
