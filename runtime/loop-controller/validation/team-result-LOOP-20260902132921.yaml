    summary: '# Interview Session Continuation Break — Root Cause Analysis


      **Lead: Database Engineer** · Support: Security Engineer, Code Reviewer, Backend
      Architect


      ## TL;DR


      `InterviewStateStore` declares Redis'
    output: "# Interview Session Continuation Break — Root Cause Analysis\n\n**Lead:\
      \ Database Engineer** · Support: Security Engineer, Code Reviewer, Backend Architect\n\
      \n## TL;DR\n\n`InterviewStateStore` declares Redis to be the \"单一权威来源\" (single\
      \ authoritative source) of the state machine, but keys it with a **fixed 24\
      \ h TTL** while the DB session row never expires. Because the TTL is the only\
      \ lifecycle mechanism — and `delete()` has **no callers** — the runtime state\
      \ can be silently evicted while an unfinished DB session is still valid. Continuation\
      \ \"breaks\" in the sense that the app is forced to **reconstruct** the session\
      \ via `requireAsking()`'s DB fallback, which (a) does not run until a request\
      \ arrives, (b) only rebuilds the last-committed fields, (c) silently re-caches\
      \ and **resets the 24 h timer**, and (d) cannot detect drift. In any deployment\
      \ where Redis is treated as authoritative, this is exactly when the session\
      \ stops resuming from the true position.\n\n---\n\n## 1. What the code actually\
      \ does (grounding)\n\n`InterviewStateStore.java:25` — a fixed TTL:\n```java\n\
      private static final long TTL_HOURS = 24;\n```\n\n`write()` — **resets** TTL\
      \ to a full 24 h on every write (`InterviewStateStore.java:51`):\n```java\n\
      redissonClient.getBucket(key(sessionId)).set(json, TTL_HOURS, TimeUnit.HOURS);\n\
      ```\n\nKey nuance: this is effectively a **sliding 24 h of silence**, not 24\
      \ h from creation. The key expires 24 h after the *last* `write()`, and `write()`\
      \ runs on every state transition (`InterviewService.java:91,116,188,263,345`).\n\
      \n`requireAsking()` — the recovery path (`InterviewService.java:380-399`):\n\
      ```java\nInterviewStateStore.SessionState state = stateStore.read(sessionId);\n\
      if (state == null) {\n    InterviewSession s = sessionMapper.selectById(sessionId);\
      \   // DB fallback\n    ...\n    state = new SessionState(s.getStatus(), s.getQuestionCount(),\
      \ s.getCurrentQuestionId());\n    stateStore.write(sessionId, state);      \
      \                    // blind rehydrate, resets 24h\n}\n```\n\n`anslyzed` only\
      \ after `read()` returns `null` (`InterviewStateStore.java:37`).\n\nConfirmed\
      \ structural fact: **`stateStore.delete()` has zero callers.** Even after `finishSession()`,\
      \ the FINISHED state is *written* back to Redis with a fresh 24 h TTL (`InterviewService.java:345`)\
      \ rather than being cleaned up. Nothing ever expires the Redis key explicitly\
      \ except Redis own TTL.\n\n---\n\n## 2. When continuation breaks (the precise\
      \ triggers)\n\nContinuation breaks when all of these hold:\n\n1. **No `write()`\
      \ for > 24 h** → Redis evicts `interview:session:{id}`. In a normal single sitting\
      \ this never happens, so the bug is invisible during active work. It bites for:\
      \ an unfinished interview abandoned mid-way, a user who sleeps/leaves > 24 h\
      \ and returns, a session created but never engaged, a long pause between two\
      \ Q–A turns.\n\n2. **The DB row is still valid and mid-flight** → `interview_session.status\
      \ = 'ASKING'` (or `START`), no FINISHED, no result. The DB has no TTL, so it\
      \ survives forever. Redis and DB are now **silently divergent by eviction**\
      \ rather than by a written mutation.\n\n3. **A new request arrives** → the first\
      \ `answer()`/`answerStream()` hits the `null` branch and rebuilds state. From\
      \ the user's perspective the session \"restarts\" or \"jumps\": the runtime\
      \ *could not* tell them where they actually were, because the authoritative\
      \ state was gone before anyone asked.\n\nThe break is delayed until the **next\
      \ interaction** — that is what makes \"*silently* expire\" so dangerous: there\
      \ is no alarm, no rejection, no explicit error; the next request just gets a\
      \ reconstructed session.\n\n---\n\n## 3. Why it breaks (root causes / gold issues)\n\
      \n- **G1 — Fixed TTL on authoritative runtime state.** Redis is declared the\
      \ single source of truth but is ephemeral with a wall-clock ceiling. The DB\
      \ (durable, no TTL) and Redis (ephemeral, 24 h) have **different lifetimes**\
      \ by design; nothing reconciles them except the fallback below.\n- **G2 — No\
      \ freshness validation before use.** `read()` returning a value is trusted as\
      \ current; `null` is trusted as \"does not exist.\" Neither branch checks a\
      \ version/freshness stamp against the DB before continuing.\n- **G3 — DB fallback\
      \ masks drift instead of detecting it.** `requireAsking()` does a *blind rehydrate*:\
      \ it doesn't validate status-transition legality, `questionCount` monotonicity,\
      \ or `currentQuestionId` parity. It happily resurrects whatever the DB last\
      \ committed and **writes it back, resetting the 24 h timer** — so the divergence\
      \ is extended rather than surfaced.\n- **G4 — Continuation depends on state\
      \ that can disappear.** `answer()`/`answerStream()` read `state.questionCount()`\
      \ (`InterviewService.java:179`) to advance; if that count was reconstructed\
      \ from a lagging DB (e.g. one of the paths writes the DB asynchronously), the\
      \ next question number is wrong → skipped/duplicated question, or premature\
      \ finish via `shouldFinish(qaPairs, MAX_QUESTIONS)`.\n- **G5 — Redis/DB dual-write\
      \ is non-transactional.** Every transition touches Redis *and* DB with no single\
      \ logical commit. Even during normal operation they can diverge (Redis written,\
      \ DB update fails, etc.); TTL expiry is just the most visible divergence. The\
      \ \"silence = alive\" model is the wrong life-cycle predicate; DB validity is\
      \ the correct one.\n\n---\n\n## 4. The two \"flavors\" of the break\n\n**Flavor\
      \ A — harmful (strict/authoritative design).** If Redis is the sole authority\
      \ (as the class comment intends) and a read path misses the DB fallback, an\
      \ evicted key = a hard \"session not found / not resumable\" even though the\
      \ DB holds a complete, valid interview. That is a clean continuation failure.\n\
      \n**Flavor B — hidden (current code with fallback).** The fallback *appears*\
      \ to recover, but it only returns the last DB-committed snapshot and silently\
      \ reboots the 24 h TTL. The session continues from a stale/guessed position,\
      \ drift is never reported, and the same eviction simply reschedules itself.\
      \ This is arguably worse: users see a \"working\" session that has lost hedhvolition.\n\
      \n---\n\n## 5. Recommendations\n\n**Priority: treat the DB as the source of\
      \ truth; make Redis a cache of the state machine, and validate on every transition.**\n\
      \n1. **Right lifecycle predicate** — do not key sessions on wall-clock TTL.\
      \ If Redis is a cache, keep the TTL but always validate the cached state against\
      \ the DB (status + `questionCount` + `currentQuestionId`) whenever a session\
      \ is loaded; do not blind-rehydrate. If you must keep Redis authoritative, promote\
      \ it with a version field and make the DB a durable outbox.\n\n2. **Explicit\
      \ cleanup** — call `stateStore.delete(session.getId())` on `FINISHED` instead\
      \ of writing an immortal FINISHED marker back with a fresh TTL (`InterviewService.java:345`).\
      \ This prevents dead sessions from hanging around and makes expiry an explicit,\
      \ audited event rather than silent.\n\n3. **Strict rehydration** — replace the\
      \ mute fallback with validation (`InterviewService.java:380-399`): after reading\
      \ DB state, verify it passes the current status-transition matrix and counter\
      \ consistency, and log/metric when a rehydrate occurs (`state_drift` counter).\
      \ Prefer to fail loudly with a resumable-error code than to continue on an inferred\
      \ state.\n\n4. **No dual-write** — use one write path per transition (DB first,\
      \ then Redis idempotently), or a single atomic source. Redis-only runtime payloads\
      \ that have no DB column (LLM context, token budget, partial stream) must be\
      \ treated as **rebuildable**, and a token-bucket-style sliding TTL should refresh\
      \ on *any* activity signal, not only on question transitions.\n\n5. **Strategic\
      \ option** — if real resumes > 24 h are a requirement, either (a) raise TTL\
      \ to a bound tied to business policy (session \"deadline\"), or (b) drop Redis\
      \ as session authority and read the state machine from the DB table with Redis\
      \ only as a short-lived lock/rate cache (`interview:lock` is fine).\n\n**Checklist\
      \ to close the issue** (mirrors the benchmark's validation criteria): verify\
      \ TTL semantics (silence-based, not age-based) · add freshness/parity validation\
      \ on every `requireAsking` load · confirm the DB actually reflects each committed\
      \ transition · confirm `delete()` is called on finish · add a drift metric before\
      \ accepting a fix."
