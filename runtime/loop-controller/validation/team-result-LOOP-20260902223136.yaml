      output: "## Database Engineer Contribution — Redis Session State TTL Expiry\
        \ vs. Valid DB\n\n### 1. Executive summary\n\n`InterviewStateStore` (InterviewStateStore.java:25,51)\
        \ writes an interview's runtime state with a **fixed 24h TTL**, and the state\
        \ machine treats Redis as the \"single authoritative source\" (line 15). The\
        \ DB row, however, is **permanent**. Because the DB and Redis copies are written\
        \ with **non-atomic, separate calls** and the TTL is a **fixed wall-clock\
        \ 24h** (not activity-based, not refreshed on read), the two sources diverge\
        \ over time. When Redis silently evicts the key while the DB row remains perfectly\
        \ valid, continuation is *mostly* recovered by the lazy rebuild already present\
        \ in `requireAsking()`, but **only partially and silently** — with a real\
        \ durability/duplication window. The headline risk is not usually a loud crash;\
        \ it is a **silent semantic rollback + an operational persistence gap** that\
        \ outlives the TTL semantics.\n\n### 2. State-flow topology (as currently\
        \ implemented)\n\n```\npersistent  draw_Messages (DB) ── used for: finish()\
        \ decision, \"已问问题\" dedup, QA pairs\npermanent   InterviewSession (DB) ──\
        \ status, questionCount, currentQuestionId\nvolatile    Redis key  \"interview:session:{id}\"\
        \  ← SessionState{status, questionCount, currentQuestionId}\n```\n\nTransitions\
        \ write **DB first, then Redis** on every path:\n- `create()`: DB `updateById`\
        \ (InterviewService.java:111-114) → `stateStore.write` (116-117)\n- `answer()`:\
        \ DB (183-186) → Redis (188-189)\n- `answerStream()`: DB (258-261) → Redis\
        \ (263-264)\n- `finishSession()`: DB (341-344) → Redis (345-346)\n\nReads\
        \ occur at a **single call site**: `requireAsking()` (InterviewService.java:380-399),\
        \ which already has a DB-rebuild fallback on null.\n\n### 3. When silent expiry\
        \ occurs (while the DB stays valid)\n\n1. **Idle > 24h in a live state.**\
        \ `write()` only fires on create/answer/finish. Any session created or advanced\
        \ and then left idle for 24h mid-interview loses its Redis key, its DB row\
        \ intact.\n2. **Redis restart + weak persistence (the big one).** docker-compose\
        \ runs `redis:7-alpine` with a `/data` volume (docker-compose.yml:27-28) but\
        \ **no `appendonly` / AOF and default RDB `save` rules** (`appendonly` defaults\
        \ to `no`). A container restart can drop recent session keys that were never\
        \ snapshotted — **independently of the TTL**. This is exactly the \"silent\
        \ expiry, DB still valid\" scenario, and it is a durability issue, not a TTL\
        \ issue.\n3. **`maxmemory-policy` eviction (only if operator changes it).**\
        \ The compose file sets no `maxmemory`. Redis 7's default policy is `noeviction`,\
        \ so keys are **not** LRU-evicted before TTL; under pressure *writes fail*\
        \ instead. Only if someone configures `allkeys-lru`/`allkeys-lfu` will keys\
        \ vanish early.\n4. **TTL not refreshed on read.** A read-only resume (e.g.,\
        \ `detail()`) does not extend TTL, so an active-looking (from the user's view)\
        \ long interview can still expire.\n\n### 4. Why / how continuation breaks\
        \ (failure modes, with evidence)\n\n**Failure Mode A — state counter rollback\
        \ / duplicate question (hardest to see).** The next-question count is derived\
        \ **only from the Redis snapshot**: `int newCount = state.questionCount()\
        \ + 1` (`answer()` InterviewService.java:179, `answerStream()` :254). The\
        \ DB fallback instead uses `s.getQuestionCount()` (:387). Because DB→Redis\
        \ is a two-step, non-atomic write, the moment a process is interrupted **between**\
        \ `sessionMapper.updateById` (:186) and `stateStore.write` (:188), the DB\
        \ is **one step ahead** of Redis. Redis is now stale. When it later silently\
        \ expires, the rebuild reads the *older-but-still-valid* DB row only if DB\
        \ is ahead; but the reverse window (Redis ahead) does not exist here. The\
        \ real hazard: the **finish decision is driven by DB messages** (`evaluationService.shouldFinish(qaPairs,…)`,\
        \ :148,222 using `extractQAPairs` from DB), while **the surviving-question\
        \ counter is driven by Redis**. Any drift between the two at the instant of\
        \ eviction produces a session that continues from a reconstructed, possibly-out-of-sync\
        \ count — the user can be re-asked a question, or the natural end is skipped/mis-triggered.\n\
        \n**Failure Mode B — silent gate change on state that DB misrepresents.**\
        \ `requireAsking()` (:391-397) permits continuation only if rebuilt status\
        \ is `ASKING`/`START`, and hard-rejects `FINISHED` with `INTERVIEW_FINISHED`.\
        \ This works while DB row and Redis agree. But the rebound path promotes the\
        \ **DB row to authority at access time without the operator knowing**, so\
        \ the \"single source of truth\" silently swaps implementation underneath\
        \ a running interview: what Redis would have resumed is not necessarily what\
        \ the DB row resumes.\n\n**Failure Mode C — durability window on restart.**\
        \ A Redis container restart mid-interview drops the session key (unflushable\
        \ RDB snapshot). On next resume, `requireAsking()` silently rebuilds from\
        \ DB — masking the loss so it is never reported — but **only for the ASKING/START\
        \ case**, and only because that one call site happens to reconstruct. Any\
        \ app code that reads the state outside `requireAsking()` in future will get\
        \ null and fail on a session whose DB row is perfectly valid.\n\n**Failure\
        \ Mode D — the \"silent\" aspect itself.** The rebuild in `requireAsking()`\
        \ does **not** log a miss marker (only JSON parse failures are logged, InterviewStateStore.java:43).\
        \ So a TTL/miss event is indistinguishable from a never-written key; there\
        \ is no metric for eviction rate, no alert, no visibility that the DB cache-of-truth\
        \ is evaporating. From an operations standpoint the continuation can \"work\"\
        \ yet the system is running on unobserved rebuilds.\n\n> Honest caveat for\
        \ the lead: with the *current* single-call-site reader, the most common case\
        \ (user resumes an ASKING session after expiry, DB row faithful) **self-heals**.\
        \ The delivery should not claim a universal hard break; it should claim: **the\
        \ self-heal is implicit, only at one call site, backed by a non-atomic eventually-consistent\
        \ row, invisible to monitoring, and slightly lossy (counter drift)** — plus\
        \ a hard durability failure mode on restart/snapshot loss.\n\n### 5. Recommended\
        \ hardening (DB/Redis engineering)\n\n1. **Demote Redis from source-of-truth\
        \ to read-through cache; commit the state machine in DB.** Make each transition\
        \ a **single atomic, guarded DB update**, e.g. using an optimistic condition\
        \ so the DB itself enforces ordering:\n   ```sql\n   UPDATE interview_session\n\
        \      SET status = 'ASKING', question_count = question_count + 1,\n     \
        \     current_question_id = #{newMsgId}\n    WHERE id = #{sessionId}\n   \
        \   AND status IN ('START','ASKING')          -- optimistic state guard\n\
        \   ```\n   If 0 rows → someone already advanced/ended → return the terminal\
        \ state. Redis becomes a **rebuild-on-miss** acceleration layer (already the\
        \ pattern in `requireAsking`), but the DB is the decision source. This eliminates\
        \ counter drift and the rollback of Failure Mode A.\n\n2. **Make TTL a sliding\
        \ expiration aligned to activity**, not a fixed 24h-from-last-write:\n   -\
