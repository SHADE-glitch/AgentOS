      summary: '# Contribution: Interview Session Cache TTL vs. DB — Continuation
        Breakage Analysis


        *Role: Database Engineer (support output for lead review)*


        ## 1. Problem Framing


        The system persists interview se'
      output: "# Contribution: Interview Session Cache TTL vs. DB — Continuation Breakage\
        \ Analysis\n\n*Role: Database Engineer (support output for lead review)*\n\
        \n## 1. Problem Framing\n\nThe system persists interview sessions **authoritatively\
        \ in the database**, while **hot runtime state** (e.g., current question index,\
        \ live answer buffer, user's transient inputs, navigation cursor, lock flags)\
        \ lives in **Redis with a fixed TTL**. The two stores have **independent lifecycles**,\
        \ so the DB and the cache naturally drift out of phase.\n\nThe core flaw is\
        \ a **single, fixed, globally-applied TTL** applied to *all* session keys,\
        \ regardless of whether that session is active or how complex it is.\n\n##\
        \ 2. When Continuation Breaks (Triggers)\n\nContinuation breaks whenever **a\
        \ request arrives that needs cache state that has already been evicted/expired**,\
        \ while the DB still holds a \"valid\" session row. Concretely, this happens\
        \ when:\n\n- **Idle gap ≥ TTL inside a single session.** User pauses mid-session\
        \ (opens another tab, answers a timeout, takes a long call). Total elapsed\
        \ time since the session key was last written exceeds TTL → the runtime state\
        \ is gone even though the session is legitimate and its DB row is intact.\n\
        - **Long multi-step session.** A heavy interview has many questions/steps.\
        \ Even with frequent writes, if a *single* step (or a batch of DB-side work)\
        \ takes longer than TTL without a cache refresh, the key dies mid-session.\
        \ This is the classic \"fixed TTL\" failure: TTL is measured from **last write**,\
        \ so long-compute or long-human-think steps outlive the TTL.\n- **TTL refreshed\
        \ only on certain events** (e.g., only on \"next\" navigation), but the user\
        \ does something cheaper like pausing or reviewing → no refresh → expiry.\n\
        - **Long-running background/async continuation.** A \"continue later\" flow\
        \ where the user returns after the TTL but the DB session is still open →\
        \ the entry point DB lookup succeeds, but the follow-up cache reads all miss.\n\
        - **Reconnect/refresh-token flows.** Client keeps a valid token/DB session,\
        \ silently recreates a *new* key → orphaned state, lost progress.\n\nIf TTL\
        \ is applied at **`SET key val EX 1800`** (an absolute TTL from creation,\
        \ not a sliding one), any session lasting > 30 minutes breaks even if the\
        \ user is actively using it — this is the worst variant.\n\n## 3. Why It Breaks\
        \ (Root Cause)\n\n1. **Different durability contracts.** DB = long-lived authority\
        \ (survives minutes/hours/days of inactivity). Redis = ephemeral by design\
        \ with bounded memory. Equal validity ≠ equal lifetime.\n2. **Fixed (absolute)\
        \ TTL ignores activity.** A non-sliding TTL is a hard wall regardless of `.SETEX`\
        \ again. Even a sliding TTL (`EXPIRE` refreshed per write) still breaks when\
        \ activity genuinely stalls beyond the window.\n3. **No rehydration path.**\
        \ The system assumes Redis is always present. There is no on-miss fallback\
        \ to rebuild the runtime state from the DB snapshot. So a cache miss becomes\
        \ a hard failure rather than a recoverable one.\n4. **Single TTL for heterogeneous\
        \ keys.** Session cursor, live answer buffer, and lock flag shouldn't share\
        \ one TTL. The answer buffer may legitimately live long (user typing), the\
        \ lock should expire very fast.\n5. **The DB is only checked at \"entry.\"\
        ** Because the DB validates the session at start, engineers assume the DB\
        \ validity implies full continuity. But the runtime state is a *separate*\
        \ object; DB validity is a necessary but **not sufficient** condition for\
        \ continuation.\n\n## 4. Design Options\n\n```text\nOption A — Sliding TTL\
        \ + short per-key TTLs\n- Strengths: simple, keeps Redis small, safe for active\
        \ users.\n- Weaknesses: still breaks on genuine idle > window.\n- Best for:\
        \ mostly-synchronous, short interviews.\n\nOption B — Persist authoritative\
        \ snapshot, Redis = disposable cache\n- Strengths: resume always works; Redis\
        \ becomes pure LRU cache you can\n  regenerate on miss (rehydration from DB).\
        \ Honors the DB as source of truth.\n- Weaknesses: need a serialization +\
        \ rebuild path; a bit more design/IO.\n- Best for: long, real interviews where\
        \ continuity is critical. RECOMMENDED.\n\nOption C — Tiered TTL by key type\
        \ (locks: 60s, live buffer: sliding 15m,\ncursor: sliding 1h or none)\n- Strengths:\
        \ matches each key's real lifetime; minimizes stale-lock risk\n  and premature\
        \ eviction.\n- Weaknesses: must classify every key; still not a full answer\
        \ alone.\n- Best for: combined with B to bound memory while guaranteeing resume.\n\
        ```\n\n## 5. Recommended Solution\n\n**Adopt Option B as the backbone, Option\
        \ C for sizing.** The rule:\n\n> **Redis is a cache; the DB is the source\
        \ of truth. A cache miss must trigger a rebuild, not a failure.**\n\nConcrete\
        \ pattern:\n\n- Write a checkpoint to the DB at every meaningful boundary\
        \ (question answered, step completed, or at least every N seconds of active\
        \ work).\n- Keep a **savepoint pointer / cursor** (last safe checkpoint) in\
        \ the session row. Cache keys are tagged with the checkpoint version.\n- On\
        \ any cache miss (or a \"continue\" after idle), **rebuild** the runtime state\
        \ from the DB checkpoint instead of 404/erroring.\n- Use a **sliding TTL**\
        \ (measured from last write) so active users never get cut off:\n  ```lua\
        \ / bash\n  # refresh TTL on activity instead of absolute expiry\n  EXPIRE\
        \ <session:runtime> 1800   # sliding 30m\n  ```\n  Or on write: `SETEX session:runtime\
        \ 1800 <payload>`.\n- Give one-shot/lock keys drastically shorter, non-critical\
        \ TTLs so a missing lock can't block resume.\n\n## 6. Implementation Sketch\n\
        \n```python\n# On request: runtime state = get_from_cache() OR rebuild_from_db()\n\
        def get_runtime_state(session_id):\n    key = f\"session:runtime:{session_id}\"\
        \n    state = redis.get(key)\n    if state is None:\n        state = rebuild_runtime_state(session_id)\
        \   # rehydrate from DB checkpoint\n        if state is None:\n          \
        \  raise SessionExpired(session_id)        # genuinely gone (DB also absent)\n\
        \        redis.setex(key, SLIDING_TTL, serialize(state))  # 1800s sliding\n\
        \    else:\n        redis.expire(key, SLIDING_TTL)   # touch = sliding window\n\
        \    return state\n\n# On every authored boundary in the DB:\nsave_checkpoint(session_id,\
        \ current_step, answers_snapshot)\n# invalidate child keys so a rebuilt state\
        \ matches the DB version\nredis.delete(f\"session:runtime:{session_id}\")\n\
        ```\n\nCheckpoint write triggers, to keep DB writes bounded:\n- after each\
        \ step/question acknowledged;\n- on idle-safety autosave (e.g., heartbeat\
        \ every 30–60s during an active answer buffer).\n\n## 7. Key Risks / Boundary\
        \ Conditions\n\n- **Genuine abandonment vs. temporary idle:** DB row can legitimately\
        \ be closed on timeout. Rebuild should be allowed *only* while the DB session\
        \ is still `active`/`open`. Add an explicit `expires_at`/`closed_at` on the\
        \ DB session so a rebuild can't resurrect a terminated session.\n- **Hot-key\
        \ / stampede on rebuild:** many clients missing simultaneously could all rebuild\
        \ at once. Use a short per-session lock (with TTL) around the rebuild, or\
        \ serve a cached \"rebuilding\" sentinel.\n- **Cache poisoning after rebuild:**\
        \ invalidate runtime child keys when the checkpoint version changes so you\
        \ never mix stale live buffers with a newer cursor.\n- **TTL sizing:** sliding\
        \ TTL must exceed the longest allowed single-step wall time; otherwise one\
        \ long step still breaks Option B's cache path (mitigated by the DB checkpoint\
        \ anyway).\n- **Key exhaustion / memory:** unrelated to correctness but keep\
        \ individual TTLs sensible so Redis reclaims properly.\n\n## 8. Validation\
        \ Plan\n\n- **Idle-gap test:** start a session, wait `TTL + 1s`, then \"continue\"\
        \ → assert resume succeeds via DB rebuild (not failure).\n- **Long-step test:**\
        \ a single step taking `> TTL` → assert no breakage.\n- **Active-user test:**\
        \ continuous activity for `> N*TTL` → assert never evicted (sliding works).\n\
        - **Abandoned-session test:** DB `closed_at` set → assert rebuild correctly\
        \ returns Gone/Expired.\n- **Stampede test:** 50 concurrent resumes after\
        \ mass expiry → assert one rebuild wins, others served cached.\n\n## 9. Summary\n\
        \nContinuation breaks because the system conflates **DB validity (durable,\
        \ persistent)** with **cache availability (ephemeral, TTL-bounded)**, and\
        \ because a **fixed TTL**[^1] ignores real session length and idle behavior.\
        \ The fix is to stop treating Redis as authoritative: persist checkpoints,\
        \ rehydrate on cache miss, and use sliding/per-key TTLs so TTL never silently\
        \ severs a still-valid session.\n\n[^1]: Fixed here means a non-activity-aware\
        \ (absolute or non-refreshed) TTL; both absolute-on-create and set-once cases\
        \ are broken for any session longer than the window or with a stall ≥ the\
        \ window.\n\n*Output prepared for lead review — happy to fold in RAG/session-vector\
        \ index implications (e.g., evicting/expiring retrieval context alongside\
        \ runtime state) if the lead wants the RAG-specific angle expanded.*"
