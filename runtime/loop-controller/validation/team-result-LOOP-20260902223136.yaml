    summary: '## Lead Database Engineer — Final Findings


      Analyzed the actual code in this repo (Phase 5 "面试状态机"): `InterviewStateStore.java`,
      `InterviewService.java`, `RedissonConfig.java`. The problem is real and'
    output: "## Lead Database Engineer — Final Findings\n\nAnalyzed the actual code\
      \ in this repo (Phase 5 \"面试状态机\"): `InterviewStateStore.java`, `InterviewService.java`,\
      \ `RedissonConfig.java`. The problem is real and present here. Below is the\
      \ authority diagnosis, the exact break conditions, and hardening.\n\n---\n\n\
      ### 1. The mechanism (where the TTL is set)\n\n`backend/src/main/java/com/aiview/interview/service/InterviewStateStore.java:51`\n\
      \n```java\nprivate static final long TTL_HOURS = 24;\n...\nreleaseBucket = redissonClient.getBucket(key(sessionId));\n\
      releaseBucket.set(json, TTL_HOURS, TimeUnit.HOURS);   // fixed absolute TTL,\
      \ re-set on EVERY write\n```\n\nRelevant details:\n- TTL is **fixed (24h)**\
      \ and only (re)applied on **write**. The `read()` path (lines 34–46) is a plain\
      \ `RBucket.get()` with **no TTL touch, no refresh, no on-miss rehydration**.\n\
      - So the TTL is *de facto* \"24h after the last successful turn,\" not a sliding-per-access\
      \ TTL — a user who pauses >24h loses the key even though the interview is legitimately\
      \ still in progress.\n- The class is documented as the state machine's **single\
      \ source of truth** (`单一权威来源`), which is precisely the wrong ownership model\
      \ given a non-durable, TTL'd store.\n\n---\n\n### 2. When a silent expiry can\
      \ strike while the DB stays valid\n\nAny in-progress session whose key crosses\
      \ the TTL boundary:\n\n| Scenario | Redis | DB (session + messages + results)\
      \ | Outcome |\n|---|---|---|---|\n| User pauses mid-ASKING > 24h, then returns\
      \ | key gone | row `status=ASKING`, all questions/answers intact | **state lost,\
      \ data intact** |\n| Long-running interview (6Q × slow answers) spanning >24h\
      \ wall clock between turns | key gone | everything valid | **state lost** |\n\
      | Redis restart / RDB-only persistence without AOF writes back recently-set\
      \ keys | key gone | untouched | **state lost** |\n| `maxmemory` eviction (`allkeys-*`\
      \ / `volatile-random`) under memory pressure | key evicted | untouched | **state\
      \ lost** |\n| Failover to a replica that never received the key (no active replication\
      \ for the last write, or a stale read replica) | key absent | untouched | **state\
      \ lost** |\n| Clock skew / `SETEX` vs wall-clock drift on the Redis node | key\
      \ gone early | untouched | **state lost** |\n\nIn every row the DB remains fully\
      \ valid — so the UI still shows a half-finished interview with a real current\
      \ question and real answers, but the runtime state machine is gone.\n\n---\n\
      \n### 3. Why continuation breaks (and where it self-heals, and where it truly\
      \ breaks)\n\n**The gate** is in `InterviewService.requireAsking()` (`InterviewService.java:380`):\n\
      \n```java\nSessionState state = stateStore.read(sessionId);\nif (state == null)\
      \ {\n    InterviewSession s = sessionMapper.selectById(sessionId);\n    if (s\
      \ == null) throw INTERVIEW_NOT_FOUND;\n    state = new SessionState(s.getStatus(),\
      \ s.getQuestionCount(), s.getCurrentQuestionId());\n    stateStore.write(sessionId,\
      \ state);          // re-hydrate fallback\n}\nif (FINISHED.equals(state.status()))\
      \ throw INTERVIEW_FINISHED;\nif (!ASKING && !START) throw INTERVIEW_STATE_ERROR(\"\
      当前状态不允许提交答案\");\n```\n\nSo there *is* a DB fallback — **this is why a plain\
      \ \"user paused 24h\" is mostly masked.** The honest answer distinguishes two\
      \ tiers of breakage:\n\n**(a) Breaks immediately (hard break) — reads that bypass\
      \ `requireAsking`.**\nOnly `answer()`/`answerStream()` gate through `requireAsking`.\
      \ But the model is declared as the global authority. Any consumer that reads\
      \ `stateStore.read()` directly and acts on `null` will treat a *valid, in-flight*\
      \ interview as a fresh/absent session:\n- Resume/`detail`-style flows that check\
      \ redis-first.\n- Any future async consumer (the RabbitMQ scoring path in `finishSession`)\
      \ reading runtime state.\nFor these, `null` → wrong branch → user told \"session\
      \ not found / not in answering state\" while the DB says otherwise. This is\
      \ the \"silently expire → continuation breaks\" case in its pure form.\n\n**(b)\
      \ Breaks subtly (correctness) — the fallback itself, on state drift.**\nThe\
      \ fallback re-hydrates from the DB row's `status/questionCount/currentQuestionId`.\
      \ There is a **crash window** because writes are DB-first then Redis-second\
      \ (`InterviewService.java:258–264` and `183–189`):\n- If the process dies **after**\
      \ `sessionMapper.updateById(session)` (DB: `ASKING, count=N`) but **before**\
      \ `stateStore.write(...)` (Redis: old `count=N-1`), then Redis is *not* expired\
      \ yet and wins.\n- Next `answer()` reads the stale Redis `count=N-1`, computes\
      \ `newCount=N`, appends a **new** question into a DB that already has N questions,\
      \ and writes `question_count=N+1` while the real message count is N+1 — the\
      \ counter silently desyncs and `questionCount` stops tracking the truth.\n-\
      \ Conversely, if Redis expires and the fallback reads a DB captured mid-flight,\
      \ it can resurrect a **stale `currentQuestionId`** or re-ask a question already\
      \ answered. Continuation \"succeeds\" but produces a duplicate/incorrect turn.\n\
      \n**(c) The fundamental why:** authority is split on **durability**. Redis is\
      \ AP/memory with a fixed lifetime; MySQL is the surviving truth. The code treats\
      \ the ephemeral key as authoritative while the durable row is demoted to a fallback,\
      \ so any expiry turns a *data-consistency* question into a *liveness* question\
      \ — and liveness breaks first.\n\n---\n\n### 4. Recommendations (in priority\
      \ order)\n\n**1. Demote Redis from \"single source of truth\" to a disposable\
      \ cache (best fix).**\n`SessionState` fields (`status`, `questionCount`, `currentQuestionId`)\
      \ are already fully mirrored as columns on `interview_session`. Make MySQL authoritative\
      \ and design Redis as read-through/write-through so a miss is a *cold-miss rebuild*,\
      \ never a failure:\n- Keep DB-first writes (already the case) and always commit\
      \ DB before touching Redis.\n- Treat the fallback in `requireAsking` as the\
      \ *intended* behavior, not an accident — and, critically, gate it with the distributed\
      \ lock (already true: `lockFor` precedes `requireAsking`). Document that `read()==null`\
      \ is a normal cold path.\n\n**2. Sliding TTL per access instead of fixed-on-write\
      \ (minimal change).**\nRefactor `read()` to touch TTL, and optionally derive\
      \ TTL from expected duration + grace:\n\n```java\npublic SessionState read(Long\
      \ sessionId) {\n    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
      \    String json = bucket.get();\n    if (json == null) return null;\n    bucket.expire(TTL_HOURS,\
      \ TimeUnit.HOURS);   // refresh on read -> genuinely sliding\n    // ... parse\n\
      }\n```\n\n**3. Rebuild state from immutable log, drop the counter bug.**\nDerive\
      \ `questionCount` from `messageMapper` count/last question instead of trusting\
      \ either Redis or the mirrored column, making continuation idempotent and replayable.\
      \ Then \"expired\" loses nothing — `requireAsking` recomputes from the append-only\
      \ message log and the desync window in §3(b) cannot occur.\n\n**4. Choose TTL\
      \ to match the domain, not a wall clock.**\nBind TTL to worst-case interview\
      \ duration: `MAX_QUESTIONS (6) × per-question timeout + grace`, e.g. `2h`. A\
      \ fixed 24h is simultaneously too long (stale data lingers) and too short (drops\
      \ a legit slow interview). Store `updatedAt/expireAt` **inside** the value if\
      \ in-app decisions must distinguish \"expired\" from \"never existed.\"\n\n\
      **5. Operability / observability.**\n- Redis: enable keyspace notifications\
      \ and monitor expiry: `CONFIG SET notify-keyspace-events Ex`, subscribe to `__keyevent@0__:expired`\
      \ on `interview:session:*`; alert on eviction under `maxmemory`.\n- Ensure AOF\
      \ (`appendonly yes`) or RDB with enough schedule so a restart doesn't silently\
      \ drop freshly written keys.\n- Keep `session`-scoped state and `interview:lock:*`\
      \ in a single instance/topology with consistent failover (avoid serving reads\
      \ from a stale replica).\n- Add a periodic reaper that diffs active DB sessions\
      \ (`status=ASKING` and `finished_at IS NULL`) against Redis and re-hydrates\
      \ missing keys.\n\n---\n\n### 5. TL;DR for the decision record\n\n- **When it\
      \ breaks:** any in-progress session sits idle/partitioned past the fixed 24h\
      \ `SETEX`, or Redis evicts/forgets the key, while MySQL still holds `status=ASKING`\
      \ + questions + answers.\n- **Why it breaks:** runtime state is read through\
      \ `stateStore.read()`; a `null` is indistinguishable from \"no session.\" Where\
      \ that read bypasses the DB fallback → hard failure; where it uses the fallback\
      \ → counter/`currentQuestionId` drift can produce duplicate or incorrect continuation.\n\
      - **Fix:** make MySQL authoritative, treat Redis as disposable read/write-through\
      \ cache, add per-access sliding TTL, derive `questionCount` from the message\
      \ log, scope TTL to interview duration, and monitor expiry/eviction."
