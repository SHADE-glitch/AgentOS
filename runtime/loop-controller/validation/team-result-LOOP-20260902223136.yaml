      output: "# 数据库工程师分析纪要 — Redis TTL 导致面试续答中断\n\n> 交付对象：lead review （角色：数据库工程师，领域：Redis\
        \ 状态存储）\n> 依据代码：`InterviewStateStore.java`（TTL 逻辑）、`InterviewService.java`（状态机/续答路径）、`docker-compose.yml`、`RedissonConfig.java`。\n\
        \n---\n\n## 1. 结论先行\n\n本设计是典型的 **「Redis 运行态 + MySQL 持久态双写」** 状态机。TTL（24h，`InterviewStateStore.java:25,51`）本身不必然导致失败——`requireAsking()`\
        \ 已内置 DB 自愈（`InterviewService.java:380-399`）。**真正的续答中断来自两类缺口**：\n\n1. **非\
        \ answer 入口的状态读取不经过自愈** —— 只有 `answer()`/`answerStream()` 走 `requireAsking()`，其余读路径/下游（Dashboard、评分消费）直接消费\
        \ Redis 或对 DB 做最终判定，TTL 过期后语义不一致。\n2. **自愈本身在状态机收尾段是\"危险的复活\"** —— 当 DB 已\
        \ FINISHED 而 Redis 残留过期/隔离的 ASKING 状态时，自愈会基于 DB 重建；但当重建来源与 Redis 残留**时序相反**时，会把\"\
        已结束会话\"重新置回可作答状态，造成重复作答/重复评分。\n\n一句话：**TTL 过期时\"续答偶尔能用，但可分叉；而数据一致性窗口是随机的\"\
        **。\n\n---\n\n## 2. 触发条件（\"什么时候\"）\n\n触发 TTL 过期 / Redis 丢失的运行态键 `interview:session:{id}`\
        \ 的场景：\n\n| # | 场景 | 概率 | 说明 |\n|---|------|------|------|\n| 1 | 用户答题间隔 >\
        \ 24h | 低-中 | TTL 是**每次 write 重置**（`InterviewStateStore.java:51`），但**读不续期**。面试中途长时间停顿即过期\
        \ |\n| 2 | Redis 实例重启 / FLUSHALL | 中 | 单实例（`docker-compose.yml:24`）无持久化显式配置，`redis-data:/data`\
        \ 默认 RDB，重启或清除即丢全部运行态 |\n| 3 | maxmemory 达到 + 启用淘汰策略 | 低（当前未启用） | `docker-compose.yml`\
        \ 未设置 maxmemory/eviction，默认 `noeviction`，内存满时是**写失败**而非淘汰——会影响第 4 点 |\n| 4\
        \ | 内存写满 `noeviction` → `stateStore.write` 抛异常 | 中 | 见 §4 的写失败窗 |\n\n---\n\
        \n## 3. 根本原因（\"为什么\"）\n\n核心是 **命令时序 + 单点权威假设**：\n\n```\nanswer() / answerStream()\
        \ / finishSession() 内部：\n  ① DB 更新（updateById/insert）        ← 先写 DB（权威持久层）\n\
        \  ② stateStore.write(SessionState)      ← 后写 Redis（Ttl=24h）\n```\n\n- **写序固定为「DB\
        \ 先、Redis 后」**（`InterviewService.java:114→116`、`186→188`、`341→345`）。因此存在一个窗口：DB\
        \ 已是新状态、Redis 仍是旧状态或已被清理。\n- 注释声称 Redis 是「单一权威来源」（`InterviewStateStore.java:14`），但实际持久真相在\
        \ DB；设计上存在**自相矛盾的双权威**。TTL 只是把这个矛盾从\"偶发\"放大为\"必然窗口\"。\n- 由于**读操作不续 TTL**，过期只取决于最后一次写与下次读的时间差，与面试节奏强耦合，结果不可预测。\n\
        \n**续答在绝大多数正常路径下能恢复**（DB 重建），真正断裂的是下面两个具体场景。\n\n---\n\n## 4. 续答具体断裂场景（\"为什么断\"\
        ）\n\n### 场景 A — Redis 写失败 / 过期与 DB 更新交错 → 重复数据\n`answer()` 第 ① 步已 insert 新问题并把\
        \ `questionCount/currentQuestionId` 更新到 DB，第 ② 步 `stateStore.write` 抛异常（`InterviewStateStore.java:53-54`）。此时\
        \ DB 可继续作答（自愈能重建 ASKING），但：\n- 客户端收到 `INTERNAL_ERROR` 后**重试** → 同一问题/答案被重复\
        \ `saveUserMessage` → `extractQAPairs` 重复计 → 单轮被算两次、评分失真。\n- Redis 中 `questionCount`\
        \ 若残留旧值，`newCount = state.questionCount()+1`（`InterviewService.java:179,254`）会与\
        \ DB 的 count 分叉。\n\n### 场景 B — 已结束会话被\"复活\"（自愈的反向副作用）\n`requireAsking()` 仅在\
        \ Redis 为 `null` 时重建（`InterviewService.java:382`）。分两种分叉：\n\n- **B1（DB 已收尾、Redis\
        \ 残留 ASKING）**：`finishSession` 时 DB 先写 FINISHED，Redis 后写 FINISHED。若 Redis\
        \ 写失败/过期在窗口内，Redis 残留 ASKING → `requireAsking` 读到**过期 ASKING**直接放行（不会重建，因为非\
        \ null）→ 对**已结束会话**再存答案、再触发评分。`detail()/result()` 反而读 DB 显示已结束，前后端不一致。\n-\
        \ **B2（Redis 过期、DB 仍 ASKING）**：自愈重建 ASKING 成功，续答正常——**这是唯一被覆盖的场景**。\n\n> 结论：自愈只解决了「DB\
        \ 在新状态、Redis 没了」的最终态重建；**解决不了「Redis 残留旧状态」和「Redis 丢了但 DB 已 FINISHED」** 两种分叉。\n\
        \n### 场景 C — 锁元数据也在 Redis\n`RedissonConfig` 单实例；分布式锁 `interview:lock:{id}`（`InterviewService.java:362`）与状态同存于\
        \ Redis。**Redis 重启后锁 lease 全部丢失** → 两个并发 `answerStream` 同时取得锁 → 重复抽题/重复写 →\
        \ 状态机错乱。TTL 过期虽不直接归因于此，但它和运行态在**同一个失效域**，放大了 A/B 的破坏面。\n\n---\n\n## 5. 方案与取舍（DB\
        \ 视角，按推荐度）\n\n```text\n方案 1：以 DB 为唯一权威，Redis 仅作缓存/加速，写入改为「先 Redis 后 DB + 补偿」\
        \  ★推荐\n- 强: 消除双权威；DB 永远可回放 state；自愈变为天然正确\n- 弱: 每次操作至少要一次 DB 读，吞吐略降（本场景单个用户低频，可忽略）\n\
        - 实现: requireAsking 始终以 DB 行为准比对，Redis 命中时仅读不疑难；写失败不抛 BizException，而是降级为 DB-only\n\
        \n方案 2：推进式窗口续期（SLIDING TTL）\n- 强: 保持 Redis 权威、最小改动；读路径也 EXPIRE 续期，配合 active-window\
        \ 阈值判定会话死亡\n- 弱: 未根治双权威；写失败/分叉仍存在；需引入「最后活动时间」字段\n\n方案 3：状态写序反转（Redis 先、DB\
        \ 后）+ 事件补偿\n- 强: 丢 Redis 时 DB 永远旧于 Redis，重建不会\"复活\"已收尾会话\n- 弱: 需补偿/幂等；改动面大，收益被方案\
        \ 1 覆盖\n\nDecision\n- 推荐: 方案 1（DB 为 truth）为主，辅以「activity_at」时间戳做 24h 未活跃的显式过期/告警\n\
        - 理由: 面试会话低频低并发，DB 权威成本最低、语义最稳、天然消除 B2\n- 风险与缓解: 自愈被移除后，需加 DB 会话状态的乐观锁（version/status\
        \ CAS）防并发误写\n```\n\n---\n\n## 6. 落地的关键改动（配置 + 代码要点）\n\n**A. Redis 侧（运维）**：`docker-compose.yml`\
        \ 显式给出，避免默认 `noeviction` 下的隐蔽写失败：\n```yaml\ncommand: redis-server --maxmemory\
        \ 256mb --maxmemory-policy allkeys-lru --save 60 1000 --appendonly yes\n```\n\
        （持久化 `appendonly yes` 降低重启丢态；`allkeys-lru` 让过期的 session 键在压满时被优先淘汰而非写失败。）\n\
        \n**B. 状态写入改为「DB 优先且可降级」**：`InterviewStateStore.write` 的异常不再阻断业务（`InterviewService.java:53-54`\
        \ 目前 `throw BizException`），改为打日志降级，保证 DB 权威不被 Redis 故障劫持：\n```java\npublic\
        \ void write(Long id, SessionState s) {\n    try { bucket.set(json, TTL_HOURS,\
        \ HOURS); }\n    catch (Exception e) { log.warn(\"state write degraded, rely\
        \ on DB, sessionId={}\", id); }\n}\n```\n\n**C. `requireAsking` 终态保护（修 B1）**：命中\
        \ Redis 状态后仍以 DB 终态为准，杜绝\"复活已收尾会话\"：\n```java\nif (InterviewStatus.FINISHED.name().equals(state.status()))\
        \ throw BizException(FINISHED);\n// 反查 DB，若 DB 已 FINISHED 则拒绝并同步清理 Redis\n\
        InterviewSession s = sessionMapper.selectById(sessionId);\nif (s != null &&\
        \ \"FINISHED\".equals(s.getStatus())) { stateStore.delete(sessionId); throw\
        \ BizException(FINISHED); }\n```\n\n**D. 读路径续期为可选项**：若保留 Redis 权威，给 `read()`\
        \ 加 `bucket.expire(TTL_HOURS, HOURS)`；但推荐改为「Redis 只读缓存 + DB 回放」，从而无需续期。\n\n\
        ---\n\n## 7. 验证方式\n\n- 单测：构造「DB ASKING + Redis null」→ 续答成功（回归现状）；「DB FINISHED\
        \ + Redis ASKING」→ 必须抛 FINISHED（新覆盖）；「Redis 写失败」→ 不抛错、DB 仍可续答。\n- 集成：docker\
        \ 内 `redis-cli FLUSHALL` 后对未收尾会话发起续答，断言不产生重复 question/answer、评分不重算。\n- 压测：并发\
        \ 2 个 `answerStream` 于锁丢失场景，断言 `questionCount` 单调、无重复抽题。\n\n---\n\n## 附：与安全/审查接口\n\
        - 该双写 + 写失败降级涉及**副作用事务边界**（DB 已提交、Redis 回滚语义），需与 Backend Architect 对齐补偿/幂等；Redis\
        \ 哨兵化与锁 lease 失效需 Security/Redis 高可用评审。\n\n请 lead 评审确认方向后，我可输出 `requireAsking`/`InterviewStateStore`\
        \ 的具体补丁。"
