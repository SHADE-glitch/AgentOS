      output: "# Security Review — Redis Session State Silent Expiry vs. DB as Valid\
        \ Source\n\n**Scope:** `InterviewStateStore.java` (fixed 24h TTL), `InterviewService.requireAsking()`\
        \ fallback (rehydrate from DB), and the JWT/session TTL policy in `application.yml`.\n\
        \n## 1. The core security problem: Redis TTL is falsable, DB is the real gatekeeper\n\
        \nThe Redis key `interview:session:{id}` carries a **fixed** 24h TTL (`InterviewStateStore.java:25`,\
        \ set at `:51`). But it is not the source of truth:\n\n- `InterviewStateStore.read()`\
        \ returns `null` on expiry (`:37-39`) — indistinguishable from \"never existed.\"\
        \n- `InterviewService.requireAsking()` (`:380-399`) treats `null` as recoverable:\
        \ it **silently rehydrates** from the DB row (`:383-389`) and re-writes the\
        \ key with a fresh 24h TTL (`:389`).\n\nThis means the TTL never actually\
        \ enforces termination of an interview — it only churns the key. An abandoned\
        \ session whose DB row sits in `ASKING` forever is **unbounded**: every resume\
        \ pokes the DB row, rehydrates, and lives another 24h. The operator's mental\
        \ model (\"Redis expires it after 24h\") is incorrect: **silent expiry passes\
        \ the security/expiry responsibility to a DB that has no expiry at all.**\
        \ This is an availability + lifecycle-policy defect (also an abuse/replay\
        \ vector), not just a bug.\n\n## 2. When continuation actually breaks\n\n\
        Continuation breaks cleanly whenever the DB snapshot is **not sufficient to\
        \ reconstruct runtime state** — i.e., whenever Redis held something the DB\
        \ does not:\n\n| Scenario | Result |\n|---|---|\n| `SessionState` only mirrors\
        \ DB columns (`status, questionCount, currentQuestionId`) | Miss is recoverable\
        \ → continuation *works*, but at the wrong abstraction (see §3). |\n| **AI\
        \ / tool-calling mode** (`app.interview.mode=ai`) | The stateless snapshot\
        \ lacks the LLM's conversation context, tool call history, and reasoning state.\
        \ After expiry, rehydration feeds a reduced state back to the LLM → lost follow-up\
        \ context, duplicated/re-asked questions, or a broken `tool calling` decision\
        \ loop. **Continuation breaks here.** |\n| Redis is also the **distributed\
        \ lock** (`interview:lock:{id}`, `:362`) | On key eviction (maxmemory) or\
        \ Redis restart, both state and lock vanish → concurrent `answer()` calls\
        \ both pass `requireAsking` → **double submission / duplicate scoring tasks**\
        \ (`:352-358`). |\n| Non-atomic DB→Redis write | `answer()`/`create()` write\
        \ DB then Redis (`:186-189`, `:114-117`). If Redis write fails silently after\
        \ the DB commit, the rehydrated `questionCount` is stale → the next `state.questionCount()\
        \ + 1` (`:179`) produces drift/duplicate numbering. |\n\n## 3. Silent expiry\
        \ is undetectable — and that is the real finding\n\nThere is no event, log,\
        \ or audit marker on expiry. `requireAsking` distinguishes \"expired key\"\
        \ from \"new session\" only by round-tripping the DB (`:383-385`), and it\
        \ never compares the DB `updated_at/started_at` age against a bound. Consequences:\n\
        \n- No way to distinguish an abandoned 30-day-old `ASKING` session from an\
        \ active one.\n- No server-side \"session too old → force finish\" check,\
        \ so the DB row never transitions to `FINISHED`; the interview state machine\
        \ leaks.\n- The `null` (expired) and \"legitimate\" paths are handled identically,\
        \ so you cannot attach security policy (e.g., forced re-login, re-enrollment)\
        \ to the divergence event.\n\n## 4. Residual / secondary risks\n\n- **TTL\
        \ misalignment across layers** (`application.yml`): JWT access = 2h (`:34`),\
        \ refresh = 7d (`:35`), Redis state = 24h. The refresh token outlives both\
        \ the access token and the Redis state by an order of magnitude, so a holder\
        \ of a valid (≤7d) refresh token can revive an interview whose Redis state\
        \ expired, as long as the DB row still says `ASKING`. Continuation gates on\
        \ DB only — the \"too old\" signal never surfaces.\n- **Redis eviction policy**:\
        \ With a server-wide maxmemory or restart, keys can be evicted *before* 24h\
        \ under pressure, amplifying all of the above and the lock-loss race in §2.\n\
        \n## 5. Recommendations\n\n1. **Fix the reconciliation gap (high):** in `requireAsking`,\
        \ after rehydration, enforce an absolute bound from DB time and transition\
        \ stale sessions to `FINISHED`:\n```java\n// apply, do not refresh-ad-absentum;\
        \ log the expiry for audit\nif (state == null) {\n    InterviewSession s =\
        \ sessionMapper.selectById(sessionId);\n    if (s == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
        \    if (s.getStartedAt().isBefore(LocalDateTime.now().minusHours(SESSION_MAX_HOURS))\n\
        \            && !FINISHED.equals(s.getStatus())) {\n        log.warn(\"resuming\
        \ expired session {} state, forcing finish\", sessionId);\n        finishForExpiry(s);\
