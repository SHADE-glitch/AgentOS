      output: "## Code Review — Redis Session-State TTL vs DB Validity: Silent Expiry\
        \ & Continuation Break\n\n**Scope reviewed:** `backend/.../interview/service/InterviewStateStore.java`,\
        \ `InterviewService.java`, `InterviewStatus.java` (state machine runtime).\n\
        \n---\n\n### 1. What the code actually does (evidence)\n\n**Fixed TTL, not\
        \ sliding.**\n- `InterviewStateStore.java:25` → `private static final long\
        \ TTL_HOURS = 24;`\n- Every write re-arms a full 24h window via `set(json,\
        \ TTL_HOURS, TimeUnit.HOURS)` at `InterviewStateStore.java:51`.\n- **`read()`\
        \ never refreshes the TTL** (`InterviewStateStore.java:34-46`). A read is\
        \ `bucket.get()` only — it does not extend lifetime.\n\n**Redis is nominally\
        \ the \"single authoritative source.\"**\n- `InterviewStateStore.java:15`\
        \ comment: *\"面试会话运行时状态，存于 Redis，作为状态机的单一权威来源\"* (stored in Redis, the Single\
        \ Source of Truth for the state machine).\n- All transitions gate on `requireAsking()`\
        \ reading Redis first (`InterviewService.java:380-399`), then `stateStore.write(...)`\
        \ (lines 91, 116, 188, 263, 345).\n\n**DB is really the source of truth (fallback\
        \ proves it).**\n- On a Redis miss, `requireAsking` reconstructs from `interview_session`\
        \ and rewrites Redis (`InterviewService.java:382-389`).\n- Write ordering\
        \ is always **DB-first → Redis-second** (`create` 87→91, `answer` 186→188,\
        \ finish 344→345). So at steady state DB ≥ Redis freshness.\n\nThat fallback\
        \ is the *only* continuity net, and it is narrow (see below).\n\n---\n\n###\
        \ 2. When the silent expiry happens\n\nThe key expires for **any session that\
        \ idles >24h without a state write**, because TTL is fixed-inactivity-based\
        \ and reads don't touch/re-arm it:\n\n1. Session created, `START` → `ASKING`\
        \ (reset to 24h).\n2. Candidate pauses (or SseEmitter/network stalls) **>\
        \ 24h**.\n3. Redis evicts `interview:session:<id>` — both **passive** (lazy,\
        \ on access) and **active** (background `activeExpireCycle` sampling), **silently**\
        \ — no event surfaced to the app.\n4. `interview_session` row still holds\
        \ `status=ASKING`, `question_count`, `current_question_id` → DB remains perfectly\
        \ valid.\n\nFactoring a fixed 24h window into a real \"time available to resume\"\
        \ adds failure surface: if a question needs a long answer, or the candidate\
        \ resumes next day, the Redis state is gone even though the interview is legitimately\
        \ resumable.\n\n---\n\n### 3. Why continuation breaks (root causes)\n\n**Mode\
        \ A — the \"safe\" path silently degrades (recovery depends on entry point).**\n\
        `requireAsking()` absorbs the miss and rebuilds from DB (`InterviewService.java:382-389`),\
        \ so the *`answer`/`answerStream`* happy path usually recovers. But continuity\
        \ is NOT guaranteed everywhere:\n\n- **Any consumer that treats a Redis miss\
        \ as \"session invalid/lost\" instead of reconstructing breaks.** Today only\
        \ `requireAsking` reconstructs. Future/other readers of the runtime state\
        \ (SSE resume/reconnect, a \"continue interview\" endpoint, progress polling,\
        \ usage dashboards) that read RediS directly will report the session as dead\
        \ while the DB says it's live.\n- The recovery is **unconditional and unbounded**:\
        \ regardless of DB state, it rebuilds from DB and proceeds. There is **no\
        \ alert/metric/log on the reconstruction**, so the silent-expiry event is\
        \ invisible to operations (only parse failures are logged at `InterviewStateStore.java:43`;\
        \ the null-miss in `InterviewService.java:382` logs nothing).\n\n**Mode B\
        \ — the real correctness break: non-atomic dual write makes Redis staler than\
        \ DB before expiry.**\nBecause DB and Redis are written as two separate steps\
        \ (no local/outbox transaction), a failure/crash between them diverges sources:\n\
        \n1. Lock acquired, Redis read `ASKING, questionCount=1`.\n2. DB commit at\
        \ `InterviewService.java:186` → `questionCount=2`, new question saved at 180.\n\
        3. `stateStore.write(qCount=2)` at 188 **throws / Redis down / publish fails**.\n\
        \nResult: DB=2, Redis=1 (still alive, TTL re-armed). The next answer reads\
        \ the **stale Redis** value 1, computes `newCount = 2`, and saves another\
        \ question/answer — **duplicate question, desync, or a phantom question the\
        \ candidate already answered**. The silent expiry then just *makes the staleness\
        \ invisible* instead of causing it.\n\n**Mode C — two sources of truth, no\
        \ equalization.**\n`interview_session.status` (MySQL) and `SessionState` (Redis)\
        \ can diverge on any partial write or crash. The fixed TTL turns Redis into\
        \ a *demoting* cache of the DB, but the design still names Redis authoritative\
        \ (`InterviewStateStore.java:15`) and relies on it for gating — a contradiction.\
        \ Any state that is written to Redis but lost, and any DB crash between DB-and-Redis\
        \ commits, is silently \"fixed\" later only if a fallback path happens to\
        \ run.\n\n**Mode D — FINISHED/result timing edge.**\n`finishSession` writes\
        \ `FINISHED` to both DB and Redis then publishes the scoring job (`InterviewService.java:340-359`).\
        \ If the Redis write of `FINISHED` succeeds and later expires while the scoring\
        \ MQ job is still pending, a concurrent `answer` hitting the fallback rebuilds\
        \ an **ASKING/START** state from DB (the DB `FINISHED` may not yet be visible/persisted),\
        \ re-opening a finished interview.\n\n---\n\n### 4. Severity ranking\n\n|\
        \ # | Issue | Severity |\n|---|---|---|\n| A | Silent expiry with invisible,\
        \ entry-point-dependent recovery | **High** (intermittent UX \"lost session\"\
        ); recoverable only via `requireAsking` |\n| B | Non-atomic DB+Redis write\
        \ → stale Redis drives duplicate/desync answers | **High** (data/state corruption\
        \ in the FSM) |\n| C | Contradictory source-of-truth design (Redis \"authoritative\"\
        \ but DB fallback) | **Medium** (architectural) |\n| D | FINISHED Redis write\
        \ can expire before scoring completes → re-opened session | **Medium/Low**\
        \ |\n\n---\n\n### 5. Concrete fixes (my recommendations)\n\n**1. Make the\
        \ DB the source of truth; treat Redis as read-cache with write-through, not\
        \ the gate.**\n`requireAsking()`'s fallback (`InterviewService.java:382-389`)\
        \ already proves DB reconstructs correctly — promote it to the canonical path:\n\
        \n- Gate on `interview_session.status`, not on the Redis value.\n- Use Redis\
        \ only as a cache of the current question; on miss, always read DB before\
        \ any \"session dead\" decision.\n- Never return a non-resumable error purely\
        \ from a Redis miss.\n\n**2. Fix the runtime TTL semantics.**\nPrefer an **idle-timeout\
        \ that matches real \"resume\" intent + explicit lifecycle reaper**, not a\
        \ fixed 24h batch:\n\n- Sliding TTL on active traffic: touch the key on `read()`\
        \ when the session is still live (or use Redisson's `RBucket.set` with a re-armed\
        \ TTL on each transition, plus a `touch` on read).\n- Set TTL ≥ the maximum\
        \ legitimate idle window; if you truly need a hard expiry, make that a **deliberate\
        \ domain decision** (\"interview expired after N hours\"), not an implementation\
        \ constant, and surface a matching error code.\n\n**3. Close the non-atomic\
        \ write gap (Mode B/D).** Options in increasing sophistication:\n- **DB-first,\
        \ Redis-best-effort (current)** + make consumers tolerant: on Redis read,\
        \ if state captures `currentQuestionId`/`questionCount` that disagree with\
        \ the DB (DB ahead), take the DB and rewrite Redis. This self-heals the divergence.\n\
        - Add **idempotency**: key the stored answer/message on `(sessionId, currentQuestionId)`\
        \ so a retry after a Redis-miss doesn't duplicate.\n- For correctness-critical\
        \ commits, use an **outbox pattern** or a single transaction that writes `interview_session`\
        \ and triggers Redis refresh, so Redis can never be persisted-beyond-DB.\n\
        \n**4. Make silent expiry visible.**\nWrap the Redis-miss / rebuild in `requireAsking`\
        \ with a `log.warn` + counter/metrics (e.g., `session.state.cacheMiss`, `session.state.rebuilt`),\
        \ so a spike in expiry is observable and you can confirm it's infrequent rather\
        \ than systemic. Optionally subscribe to Redis keyspace `expired` events to\
        \ reconcile/reaper rather than drop silently.\n\n**5. (One-line config note)**\
