        \ subsequent `requireAsking` heals. |\n| S3 | Torn write exposed by expiry:\
        \ crash/out-of-band worker advanced DB but the last `stateStore.write` was\
        \ lost or old; then TTL expires. | `requireAsking` fallback (`:387-389`) |\
