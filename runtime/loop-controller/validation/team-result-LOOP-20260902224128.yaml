        | S4 | Only some runtime state is mirrored. `questionCount`/`currentQuestionId`/`status`\
        \ are mirrored; **the asked-question set is not a column** — it lives only\
        \ in `interview_message` rows (recomputed each turn at `InterviewService.java:140-144`).\
        \ | on TTL expiry this is recomputed, not null | Correct but O(history) recompute\
        \ again on resume — the \"cache\" for the state machine is doing no caching.\
