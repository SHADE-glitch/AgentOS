        \ indefinitely until explicitly closed.\n- **Redis key** = ephemeral runtime\
        \ state (progress, transcript buffer, lock, retry count, heartbeat), auto-deleted\
        \ by a **fixed TTL** regardless of whether the session is live.\n\nThey diverge\
        \ because one is *content* (survives) and the other is *liveness/cache* (expires).\
        \ The fixed TTL cannot distinguish \"user idle\" from \"session still valid\
        \ in DB.\" This is a **design smell: TTL used as a lifecycle-control mechanism,\
        \ not as a cache-invalidation mechanism.** When Redis evicts the key, every\
        \ downstream read for that session misses → operations that assume the in-memory\
        \ state exists begin to fail or, worse, restart silently at step 0.\n\n**When\
        \ continuation breaks:**\n1. **Long-running sessions outliving the TTL** —\
        \ any session whose duration > `TTL` (or with a period > TTL between interactions)\
        \ loses state even though the DB row is valid. Classic: TTL of 15–30 min,\
        \ session of 1–2 hours.\n2. **Idle-but-valid sessions** — candidate pauses\
        \ 40 minutes; overhead/TTL (if used) doesn't fire, but the data key does.\
        \ User resumes → \"Session expired\" or blank progress.\n3. **Multi-key splits\
        \ with non-coupled TTLs** — transcript buffer, lock key, and progress key\
        \ each with own TTL; they expire at different times → **partial-state restoration**\
        \ (worse than none: half a transcript).\n4. **Cache-aside cold start** — the\
        \ only writer to the DB writes through Redis; if Redis is flushed/Evicted\
        \ (memory pressure, `allkeys-lru`, restart), state is unrecoverable because\
        \ it never hit the authoritative store. DB \"valid\" but runtime state gone.\n\
        5. **Restart/reconnect** — same Redis server or different instance; any state\
        \ held only in Redis is lost; DB says \"in progress\" but there's nothing\
        \ to continue from.\n\nContinuation breaks at the point where the resume code\
        \ path **reads Redis, gets a miss, and either throws or fabricates a fresh/empty\
        \ session** instead of degrading to the DB copy. The DB being valid on the\
        \ same query **masks** the Redis miss — so the bug is silent until write-time.\n\
        \n## 方案设计 (Design Options)\n\n**Option A — Sliding TTL (refresh on access)**\n\
        ```python\n# refresh TTL on every read/write touching the session runtime\
        \ state\npipe = r.pipeline()\npipe.get(KEY_TX)\npipe.expire(KEY_TX, TTL_SLIDING)\
        \  # continuous activity keeps it alive\ntm, _ = pipe.execute()\n```\n- Strengths:\
        \ simple, self-healing for active sessions; idle genuinely expires.\n- Weaknesses:\
        \ **does not fix the core bug** — a session that's long or that exceeds TTL\
        \ ends up in the same Silent State; only adds \"activity\" semantics. Still\
        \ single point of truth if DB is the only durable store.\n\n**Option B — Lazy\
        \ rebuild from DB on miss (cache-aside with reconciliation)** ✅ recommended\n\
        - Strengths: DB is source of truth; Redis is a pure cache; miss is a non-error\
        \ → rebuild from authoritative row. No silent divergence possible; decouples\
        \ TTL from correctness.\n- Weaknesses: need a rebuild path; if DB is stale,\
        \ rebuild of a valid-but-empty state is still \"start over\" — must validate\
        \ that DB itself carries the resume cursor.\n\n**Option C — Single source\
        \ of truth in the DB (drop fastest-moving state from Redis)**\n- Strengths:\
        \ eliminates the class of bug entirely; simplest correctness model.\n- Weaknesses:\
        \ loses low-latency read/write for hot state; may be too slow for streaming/transcript\
        \ ingestion.\n\n**Option A+ — Everything or Nothing: DB cursor + Redis as\
        \ write-through cache**\n- Strengthens B with WAL-of-resume in the DB (see\
        \ below). Most robust.\n\n## 实施方案 (Implementation)\n\nCore contract: **Redis\
        \ expiry must never be the arbiter of resume validity; the DB record is.**\
        \ Thread a `resume_token`/`state_version` through the DB row.\n\n```sql\n\
        ALTER TABLE interview_session\n  ADD COLUMN state_version INT NOT NULL DEFAULT\
        \ 0,\n  ADD COLUMN resume_cursor JSONB NULL;          -- durable resume point\n\
        ```\n\n```python\ndef ensure_runtime(tenant_id, session_id):\n    \"\"\"Atomic\
        \ read-through; rebuild runtime state from DB when Redis misses.\"\"\"\n \
        \   key = f\"iv:{tenant_id}:{session_id}\"\n    tx = redis.get(key)\n    if\
        \ tx is not None:\n        return tx\n\n    # rebuild (optionally with a distributed\
        \ lock to avoid stampede rebuild)\n    row = db.query_interview_session(session_id)\n\
        \    if row is None or row.status == 'CLOSED':\n        raise NotFound  #\
        \ genuinely gone — DB agrees\n\n    runtime = build_from_row(row)        \
