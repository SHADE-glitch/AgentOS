      \n---\n\n## 目标\n- **业务目标**: 面试会话进行中，无论 Redis 端状态如何，只要数据库中的会话仍然有效，用户都应能无感续接（continue）。\n\
      - **当前约束**: `InterviewStateStore.java:25` 固定 `TTL_HOURS = 24`；每次 `write()` 都以\
      \ `bucket.set(json, 24h)` 重设 TTL（`InterviewStateStore.java:51`）。DB 侧 `interview_session`\
      \ 无 TTL，永久有效。Redis 与 DB 双写非原子。\n- **成功标准**: 明确「何时」「为何」续接会断；给出让 DB 成为权威源、Redis\
      \ 退化为可重建缓存的最小改法。\n\n## 问题判断\n\n**机制确认**（依据代码）：\n- `InterviewStateStore.write`（`:51`）每次把\
      \ Redis key `interview:session:<id>` 的 TTL 重置为 24 小时 → 这实际上是**基于「最后一次写入」的空闲超时**，不是绝对的会话有效期。\n\
      - `InterviewStateStore.read`（`:37`）key 过期后 `bucket.get()` 返回 `null`，与「从未写入」「JSON\
      \ 解析失败」（`:42-44`）坍缩成同一个 `null`，**无法区分原因**。\n- DB 行没有任何 TTL，`interview_session.status/questionCount/currentQuestionId`\
      \ 会一直保留为会话最后提交的快照。\n\n**何时断**（触发条件）：\n1. **空闲门限**：会话处于 `ASKING`/`START`，用户停顿\
      \ ≥ 24 小时后再续答 → Redis key 被静默逐出，DB 仍为有效 `ASKING`。这是最典型的场景。\n2. **Redis 层线**：实例重启且未开\
      \ AOF/RDB 持久化、`maxmemory` 触发 `volatile-lru` 驱逐、`FLUSHALL`——都会让 key 比 TTL 更早消失。\n\
      3. **晚于逻辑完工**：`finishSession`（`:340`）先写 Redis 再投 RabbitMQ 评分；任何 CRASH 窗口使 DB\
      \ 提交与 Redis 状态短暂不一致，随后 TTL 冻结该不一致。\n\n**为何断**（根因）：\n`InterviewStateStore.java:15`\
      \ 的注释把 Redis 声明为「状态机的单一权威来源」，而 DB 只是无 TTL 的镜像。TTL 到期后，这个「唯一权威」被悄悄删除，续接逻辑被迫从**非权威、且可能与权威已漂移**的\
      \ DB 快照重建。两点是把续接真正打断/搞错的要害：\n\n- **双写非原子**：`answer()` 中 DB 更新（`:186`）与 Redis\
      \ 写（`:188`）不在同一个 DB 事务里。若进程在两者之间崩溃、或多实例竞争，两个源在任意瞬时都可能不一致。TTL 会把这种「瞬时漂移」在下次续接时固化为「按错误快照恢复」——续接从错误的\
      \ `questionCount`/`currentQuestionId` 继续，导致漏题、重题、甚至对已结束会话重复作答。\n- **重建只恢复薄镜象**：`requireAsking`（`:380-399`）的\
      \ fallback 只用 `interview_session` 三列重建，且 **无任何日志/指标**（`:388-389`），静默掩盖过期，线上无法观测。真正可续接的上下文（已答题历史）其实在\
      \ `interview_message` 表里是持久且完整的（见 `:140-144` 从消息重建 `askedQuestionIds`），但重建代码没有利用它。\n\
      \n**风险点与处理**：当前 `requireAsking` fallback 在单实例、无漂移的幸运路径下确实能「自愈」，所以不要误以为它已足够——它把「静默过期」转成了「静默错误恢复」，这是隐患，不是方案。\n\
      \n## 方案设计\n\n| 方案 | 要点 | 优缺点 |\n|---|---|---|\n| A（现状，固定 TTL） | Redis 权威 + 24h\
      \ TTL + DB fallback | 优：简单<br>弱：双权威、双写非原子、过期被静默掩盖、续接可能错题，**不推荐** |\n| B（DB 权威，Redis\
      \ 缓存） | DB 是唯一权威，Redis 仅缓存，过期即从 DB/消息历史重建 | 优：TTL 过期退化为 cache miss，永不破坏续接；消除漂移<br>弱：每次\
      \ miss 多一次 DB 读（可接受） |\n| C（Redis 仅做空闲 GC 提示） | 续答时 `EXPIRE` 续期，过期只触发运行时状态清理，语义仍以\
      \ DB 为准 | 优：显式表达「空闲超时」<br>弱：仍需与方案 B 一并落地才防漂移 |\n\n**建议**：B + C 组合。核心原则——**续接上下文必须能从\
      \ DB 重建，Redis TTL 不再作为会话有效性的判据**。\n\n## 实施方案\n\n**1. 让 DB 成为权威，Redis 可重建缓存。**\
      \ 修改 `requireAsking`：过期/为空时强制从 DB + 消息历史重建并在日志记录一次 WARN（观测点）：\n\n```java\nprivate\
      \ boolean keyExists(Long sessionId) {\n    return redissonClient.getBucket(key(sessionId)).isExists();\n\
      }\n\nprivate InterviewStateStore.SessionState requireAsking(Long sessionId)\
      \ {\n    // 区分「过期/缺失」与「正常读取」，不做静默重建\n    InterviewStateStore.SessionState state\
      \ = stateStore.read(sessionId);\n    if (state == null) {\n        InterviewSession\
      \ s = sessionMapper.selectById(sessionId);\n        if (s == null) throw new\
      \ BizException(ResultCode.INTERVIEW_NOT_FOUND);\n        long q = messageMapper.selectCount(new\
      \ LambdaQueryWrapper<InterviewMessage>()\n                .eq(InterviewMessage::getSessionId,\
      \ sessionId)\n                .eq(InterviewMessage::getKind, \"question\"));\n\
      \        // 提升可观测性：静默过期在此暴露\n        log.warn(\"session state rehydrated from\
      \ DB: id={} status={} q={} (was redis-miss)\",\n                sessionId, s.getStatus(),\
      \ q);\n        state = new InterviewStateStore.SessionState(\n             \
      \   s.getStatus(), Math.max(s.getQuestionCount(), (int) q), s.getCurrentQuestionId());\n\
      \        stateStore.write(sessionId, state);\n    }\n    if (InterviewStatus.FINISHED.name().equals(state.status()))\n\
      \        throw new BizException(ResultCode.INTERVIEW_FINISHED);\n    if (!InterviewStatus.ASKING.name().equals(state.status())\n\
      \            && !InterviewStatus.START.name().equals(state.status()))\n    \
      \    throw new BizException(ResultCode.INTERVIEW_STATE_ERROR, \"当前状态不允许提交答案\"\
      );\n    return state;\n}\n```\n\n**2. 使 DB + Redis 双写原子**（消除漂移根因）。用 DB 事务包裹状态写入，Redis\
      \ 写紧随其后；或在重试窗口内以 DB 为主键做幂等重建：\n- 为 `answer()`/`finishSession()` 的 DB 更新加 `@Transactional`，保证\
      \ `interview_session`/`interview_message` 一起提交；\n- Redis 写失败时**只告警不回滚**（它已退化为缓存），下次续接由\
      \ `requireAsking` 重建。\n\n**3. 配置建议**（`docker-compose.yml` / Redis）：\n```yaml\n\
      redis:\n  command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru\
      \ --appendonly yes --save 60 1000\n```\n- `appendonly yes` 防重启丢 key；`maxmemory`\
      \ + `volatile-lru` 防止内存压力下无差别的全量驱逐波及会话 key；\n- 避免 `maxmemory-policy allkeys-*`（会连无\
      \ TTL 之外的键一起逐出）。\n- 将 `TTL_HOURS` 移到 `@Value(\"${app.interview.state-ttl-hours:24}\"\
      )`，便于按业务（而非固定值）调整。\n\n**安全/审查补充**：\n- `read()` 的 `null` 三义（未写/过期/解析失败）当前无法区分，属可观测性缺口，建议在\
      \ `InterviewStateStore` 增加 `isExists()` 显式区分，避免把「崩溃恢复」误判为「会话不存在」。\n- 静默重建是安全隐含面：攻击者无法伪造会话（仍受\
      \ `requireOwnedSession` 鉴权保护），但应避免把「重建成功」当作「会话合法」的旁路——状态判断仍以 DB `status` 为准。\n\
      \n## 验证方式\n- **单元**：构造「Redis 无 key + DB 有效」场景，断言 `requireAsking` 能重建且打印 WARN；构造\
      \ DB `FINISHED` 场景，断言抛 `INTERVIEW_FINISHED` 而非被重建吞掉。\n- **集成**：`redis-cli DEL\
      \ interview:session:<id>` 后发起 `/api/interview/{id}/answer`，验证续接成功且 `questionCount`\
      \ 不跳变。\n- **并发**：两个请求并发续答，验证分布式锁 + 幂等重建下无重题/漏题。\n- **预期结果**：任意时刻续接都不再依赖 Redis\
      \ 键活；过期仅在日志出现 WARN，业务不受影响。\n\n## 复盘建议\n- 明确「权限源 = DB，Cache 源 = Redis」的职责边界，删除\
      \ `InterviewStateStore.java:15` 权威性注释，避免后人误当单一事实来源。\n- 为静默过期/重建增加计数器指标，接告警，防止下次演变成无人知晓的状态错乱。\n\
      - 后续可把续接上下文（已问问题、草稿答案）也从 `interview_message` 持久态重建，彻底摆脱对 Redis 副本的依赖。\n\n根因一句话：**Redis\
      \ 把「基于最后写入的空闲 TTL」误当成了「会话有效性」，加上 DB/Redis 双写非原子，导致 DB 仍有效、Redis 却已静默消失，续接只能按已漂移的薄镜象重建，从而在特定空闲/崩溃场景下续错或拒续。**\
      \ 解法是让 DB 成为唯一权威并原子更新，Redis 只做可重建缓存。"
