        \ silently — a **perf/consistency** regression (full recompute) rather than\
        \ a durability loss. Keep the cache TTL policy (B) and the reconciliation\
        \ (D) uniform for any Redis-backed session-derived data, including retrieval\
        \ enrichments.\n\n---\n\n### Priority order\n1. **(C)** Make DB authoritative\
        \ + ordered commit → removes the real divergence (S3/S5).\n2. **(B)** Read-renew\
        \ + delete-on-finish → removes the wall-clock coupling (S1/S2).\n3. **(E)**\
        \ Keyspace-notification alerts + rebuild logs → makes it observable immediately.\n\
        4. **(D)** Explicit resume endpoint + reconcile job → durable long-session\
        \ support.\n\nThe one-line root cause for the lead report: **you made an evictable\
        \ cache the authority for a durable state machine; a fixed 24h TTL is a business\
        \ anti-pattern that turns graceful DB-fallback into a correctness hazard the\
        \ moment the DB mirror lags, and it hides all of it behind a self-healing\
        \ path that only half the code paths use.**"
