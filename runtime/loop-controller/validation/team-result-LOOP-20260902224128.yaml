        \ s.getCurrentQuestionId());\n    stateStore.write(sessionId, state);    \
        \                            //    re-hydrate + refresh TTL\n}\n```\n\nThree\
        \ facts that determine *when/why* this goes wrong:\n\n1. **Redis TTL is de-coupled\
        \ from business lifecycle.** A session may be perfectly valid (`ASKING`, FK-intact,\
        \ message history intact) yet have its state line evicted purely because 24h\
        \ passed with no write. DB has no expiry; Redis has a hard wall-clock bound.\n\
