        - **成功标准**: 明确\"何时断、为何断\"，并给出消除断裂的配置与代码方案（可续期、可重建、可降级）。\n\n## 问题判断\n\n###\
        \ 根因\n这是典型的「**双账本 / 双源真相**」不一致：Redis 持有可变、易失的短生命周期状态，DB 持有持久、权威的记录。二者的生命周期策略不同（Redis\
        \ 用固定 TTL，DB 无 TTL），一旦 Redis 的 key 被静默淘汰而 DB 行仍有效，就产生了「外存有效、缓存失真」的中间态。代码若把\
        \ Redis 当作会话是否还\"活着\"的唯一判定，续期就会在用户看来没有道理地失败。\n\n### 关键假设（需向团队确认）\n1. TTL 是**写一次固定值**（`SET\
        \ key val EX 3600` 只在创建时设），还是**每次读写都刷新**？→ 决定是不是\"活跃也过期\"。\n2. 该 key 被淘汰后的恢复路径：代码是否会回查\
        \ DB、从 DB 重建 state，还是直接抛 `400/401 Session not found`？\n3. Redis 实例的 `maxmemory-policy`\
        \ 是什么？默认 `noeviction` 与 `allkeys-lru` 行为完全不同。\n4. \"续期\"的对端：是用户主动续期（如点击\"\
        继续面试\"），还是服务端被动等待（页面仍挂着）？\n\n## 断裂发生的四种场景\n\n我把\"何时断\"归纳为 4 类，覆盖同一条结论：**只要\
        \ Redis key 消失早于 DB 语义上的会话结束，而恢复路径又不完整，续期/继续就会断。**\n\n| 场景 | 触发 | 断裂表现 |\n\
        |---|---|---|\n| A. 固定 TTL 小于总时长 | 面试 > TTL | 长面试在无人过期审计时被 Redis 清掉 |\n| B.\
        \ 活跃但不续期 | 固定 TTL + 不随写入刷新 | 用户仍在作答，但 key 已到时被删 |\n| C. 内存淘汰 | `maxmemory-policy`\
        \ 为 `allkeys-*`| key 在 TTL **之前**被 LRU/LFU 提前逐出 |\n| D. 恢复路径缺失 | 未回查 DB 重建\
        \ | 即便 DB 行还在，代码仍报\"会话无效\" |\n\n场景 C 尤其隐蔽——它不是\"到时过期\"而是\"提前淘汰\"，只出现在高内存压力下，难以复现，属于典型的静默故障。\n\
        \n## 为何续期会断（一致性分析）\n\n设 Redis 状态 `R`（进度、答案草稿、token、游标），DB 记录 `D`（会话元数据）。\n\
        \n1. **判定逻辑以 `R` 为准**：例如网关先 `EXISTS session:{id}`，不存在即拒绝。`R` 被删 → 判定失效，即使\
        \ `D` 完全有效。\n2. **`R` 含不可重建数据**：如果 `D` 只存了启动元数据，而草稿/游标只存在于 `R`，那 Redis 一旦淘汰，**无法从\
        \ DB 重放** → 在途中（in-flight）续期必然断，只能从头开始。\n3. **TTL 语义与业务生命周期不对齐**：固定 TTL 属于\"\
        内存翻用过久的防御\"，它不感知\"面试是否仍在进行\"。把缓存层防御当成业务有效期，是正确的反模式。\n4. **无续期信号**：人还在、连接还在，但没有\
        \ API 触达 Redis，TTL 不会因\"还活着\"而顺延。\n\n## 方案设计\n\n### 方案 A：续期（sliding TTL）——最长会话期间断\n\
        每次用户有真实活动时刷新 TTL，配合一个**短于总时长、长于单次交互间隔**的窗口。\n\n- **优点**：活跃会话永不断；符合面试交互节奏（人若真的离开，自动回收）。\n\
        - **缺点**：纯被动，需要流量触发；与 DB 仍可能不一致。\n\n### 方案 B：DB 为准 + Redis 仅缓存（可重建）\nRedis\
        \ 只是 DB 的可丢弃投影；写入 state 时同步落 DB（或至少落必要元数据），Redis key 可随时删。\n\n- **优点**：消除\"\
        缓存失效=业务失败\"；扩展性最好。\n- **缺点**：需要把 state 序列化落库，开发量增加。\n\n### 方案 C：重建降级（两端修复）\n\
        Redis 丢失时，回查 DB 并透明重建状态，不报错。\n\n- **优点**：兼容现有固定 TTL，改动最小，可单独上线。\n- **缺点**：若\
        \ `R` 里有 DB 没有的数据，重建后状态是\"部分恢复\"，需处理语义回退。\n\n### 最终建议（组合）\n**主：B（DB 为准，Redis\
        \ 纯缓存）；辅：A（sliding TTL，短空闲窗口）；兜底：C（回查重建）。** 并叠加方案 D 的淘汰策略治理。三步对应\"能续、能删、能重建\"\
        ，三脚链路都能续期。\n\n## 实施方案\n\n### 1. Redis 配置——杜绝\"提前淘汰\"\n```conf\n# 只淘汰设置了 TTL\
        \ 的键，而非全部键，避免活跃 key 被 LRU 误伤\nmaxmemory-policy volatile-ttl   # 或 volatile-lru\n\
        # 设定一个足够大的上限，防止近期活跃会话被压掉\nmaxmemory 4gb\n```\n> 安全要点（对本任务归口）：`volatile-*`\
        \ 仍可能淘汰仍有价值的会话；若敏感会话被提前逐出，等于让用户\"没到期就被吊销令牌\"，应记录淘汰事件。启用 `notify-keyspace-events\
        \ Ex` 订阅 `expired/evicted` 做审计。\n\n### 2. Sliding TTL——活跃即续\n```python\n#\
        \ 仅在有实际用户活动时刷新（不是只读心跳）\ndef touch_session(r: redis.Redis, sid: str) -> None:\n\
        \    # 若 key 已不存在，交给上层\"重建\"路径，不要用不存在的 key 硬续\n    if r.exists(f\"session:{sid}\"\
        ):\n        r.expire(f\"session:{sid}\", SLIDING_TTL_SECONDS)\n```\nTTL 建议：`SLIDING_TTL\
        \ = 2× 正常交互间隔上限`，例如正常 5 分钟一题，设 15–30 分钟；保证活跃不断、离开即收。\n\n### 3. 以 DB 为准的重建（消除\
        \ D 场景）\n```python\ndef load_session(cursor, r: redis.Redis, sid: str):\n\
        \    rkey = f\"session:{sid}\"\n    state = r.get(rkey)\n    if state is not\
        \ None:\n        r.expire(rkey, SLIDING_TTL_SECONDS)          # sliding refresh\n\
        \        return state\n    # Redis 静默过期 → 回查 DB\n    row = cursor.execute(\n\
        \        \"SELECT state_json, updated_at FROM interview_session WHERE id=%s\"\
        , (sid,)\n    ).fetchone()\n    if row is None:\n        raise SessionNotFound(sid)\
        \                    # DB 也没有 → 真失效\n    # DB 有效 → 透明重建\n    r.set(rkey, row.state_json,\
        \ ex=SLIDING_TTL_SECONDS)\n    return row.state_json\n```\n\n### 4. 关键风险点：**in-flight\
        \ 状态落库时机**\n即使做了 B，若草稿/答题进度**只在** Redis，重建后就是\"丢进度\"。务必保证重建所需的字段**至少幂等可幂续**：建议把\
        \ `answers[last_saved]`、`cursor` 增量同步 DB（`updated_at` 作为续接点）。否则 C 方案的\"续期成功\"\
        会是假成功。\n\n## 验证方式\n\n| 检查项 | 方法 | 预期结果 |\n|---|---|---|\n| 活跃不断 | 模拟长面试 +\
        \ 周期活动，观察 TTL | 全程 Session 有效 |\n| 离开即收 | 空闲 > 阈值 | 自动过期，DB 行仍存在（符合预期） |\n\
        | 提前淘汰 | 压内存触发 eviction | `volatile-ttl` 下近期活跃会话仍存活 |\n| 重建正确 | 手动 `DEL session:{id}`\
        \ 后请求 | 回查 DB 重建，不报 401 |\n\n### 预期结果\n- 长/活跃会话可续期；Redis 淘汰不再等于业务失败。\n- DB\
        \ 仍为唯一权威，Redis key 语义降级为\"缓存 + 滑动窗口\"。\n- 淘汰/过期触发审计可观测。\n\n### 复盘建议\n1. **明确单一权威**：把\"\
        Redis=缓存，DB=真相\"写进设计文档，禁止用 `EXISTS redis_key` 当业务存在性判断。\n2. **TTL 语义对齐**：固定\
