        \ the RabbitMQ scorer mutating `interview_result`/status) where DB and Redis\
        \ disagree. When the TTL later expires, the \"recovery\" copies whichever\
        \ side is stale onto the other — it can **cement a lost state-machine update**,\
        \ not heal it.\n\n---\n\n## 3. Exact break scenarios\n\n| # | Scenario | Where\
        \ it silences up | Continuation result |\n|---|----------|----------------------|---------------------|\n\
        | S1 | Active Q&A, then user pauses **>24h** between questions; DB stays `ASKING`\
        \ and valid. Redis line evicted. | `InterviewStateStore.read` → `null` (`:34-46`);\
        \ fallback in `requireAsking` (`:383-389`) | **Recovers** (rebuilds from DB,\
