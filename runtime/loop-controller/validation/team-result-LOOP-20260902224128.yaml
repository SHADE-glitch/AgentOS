        \ fix**; it only moves S1/S2/S3 later.\n\n---\n\n## 5. Notes relevant to the\
        \ RAG/answer path (team context)\n\nWhen Redis state expired and is rebuilt,\
        \ the subsequent-turn retrieval re-derives the asked-question set + QA context\
        \ from `interview_message` (`InterviewService.java:135-144,210-219`). That\
