        \ is DB-FINISHED → Redis-FINISHED (`:340-346`). If Redis expires between the\
        \ scorer and the next dashboard query, aggregation reads DB (consistent),\
        \ but any in-flight path still holding old Redis `ASKING` can issue another\
        \ turn. | state-store two-phase | Violates the state machine: two writers\
        \ racing with divergent source of truth. |\n\n**Bottom line for \"when\":**\
        \ it breaks when **idle wall-clock exceeds the TTL** *and* the surviving path\
        \ is a non-healing path, or when **latent Redis↔DB divergence is exposed by\
        \ expiry**. It does **not** break for a simple idle-ASKING-session-then-answer,\
        \ because the fallback covers that — which is exactly why it's so easy to\
        \ ship this and never notice.\n\n**Why it breaks:** because a hard TTL encodes\
        \ \"forget this session\" by wall-clock, while the DB encodes \"remember this\
        \ session\" by business state. You have made Redis authoritative for *decisions*\
        \ but evictable for *lifetime*.\n\n---\n\n## 4. Recommended fixes (concrete)\n\
        \n### A. Decide the authority, then make the other store a pure projection\n\
        Pick **DB = durable source of truth**, **Redis = evictable acceleration layer\
        \ that must never decide correctness**. Then:\n- Keep `requireAsking` fallback,\
        \ but make DB the first-class check and Redis a read-through cache.\n- Ensure\
        \ **every** state transition is a single ordered pipeline, and add a reconciliation\
        \ on session start.\n\n### B. Change TTL semantics from \"absolute cap\" to\
        \ \"inactivity\"\n- Keep renewing TTL on a real state write (current behavior\
        \ is correct).\n- **Also renew on read** so read-only resume keeps the line\
        \ warm (fixes S2). With Redisson, use the async renewer or issue a light `expire`\
        \ on read/full read.\n- Prefer a **business-driven eviction** over wall-clock:\
        \ evict when the session reaches `FINISHED`, not when 24h passes. There is\
        \ already a `delete()` (`InterviewStateStore.java:58`) — call it in `finishSession`.\n\
        \n### C. Make the double-write atomic (fixes S3)\nWrap the DB + Redis transition\
        \ in **one business transaction AND the Redisson lock, with DB committed as\
        \ authority**, then write Redis. Since the advisory lock already serializes\
        \ per session (`InterviewService.java:361-372`), the only remaining fix is\
        \ ordering + a lost-update guard:\n\n```java\n// suggested order-of-commit\
        \ inside the existing lock:\ntry (TransactionStatus ts = txTemplate.getTransaction())\
        \ {\n    sessionMapper.updateById(session);          // 1) DB commits the\
        \ new state\n    txTemplate.commit(ts);\n    stateStore.write(id, state);\
        \                // 2) Redis as cache, always behind/projectable\n} catch\
        \ (Exception e) {\n    stateStore.delete(id);                      // keep\
        \ cache consistent on DB failure\n    throw e;\n}\n```\n\nThen a Redis read-miss\
        \ is *always* safely rebuildable from DB, because DB is never \"behind\" the\
        \ authoritative transition. This also lets you add a **version/updated_at**\
        \ to session and compare in `requireAsking` before trusting a Redis value\
        \ (stale-cache, not just miss):\n\n```java\nif (state != null && stateDataVersion\
        \ < session.getVersion()) { // DB is newer\n    state = rebuildFrom(session);\
        \                 // prefer DB, refresh cache\n}\n```\n\n### D. Add an explicit\
        \ resume/heartbeat contract\n- Expose a `POST /interview/{id}/resume` that\
        \ runs the same rebuild logic deliberately (idempotent, returns a `state`\
        \ event) instead of relying on the implicit fallback buried in `answer`.\n\
        - For truly long-lived sessions, run a background reconcile job that scans\
        \ `interview_session` and **re-writes Redis for active sessions**, preventing\
        \ drift from accumulating.\n\n### E. Observability so \"silent\" becomes loud\n\
        - Enable **Redis keyspace notifications** keyspace@0:__keyevent@0__:expired\
        \ and alert on `interview:session:*` expirations (this is your early-warning\
        \ for S1/S2 volume).\n- Log every fallback rebuild (`requireAsking` line ~388)\
        \ with `sessionId` and reason, so silent re-hydration is visible in metrics,\
        \ not invisible.\n- Temporary fix today, no code change: bump `TTL_HOURS`\
