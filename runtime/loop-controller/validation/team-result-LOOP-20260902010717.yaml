    output: "# Run 2 — Redis Cache Invalidation Drift in `DashboardService.build`\
      \ — Lead Analysis\n\n**Team:** team-96faa50f | **Lead:** Frontend Architect\
      \ (with Frontend Performance, System Architect, Technical Reviewer)\n**Scope:**\
      \ Analysis only — no file modifications | **Date:** 2026-09-02\n\n## 1. Executive\
      \ Summary\n\n`DashboardService.build()` `backend/src/main/java/com/aiview/interview/service/DashboardService.java:48-67`\
      \ implements a **read-through cache with fixed TTL and no write-through invalidation**.\
      \ Key `dashboard:user:{userId}` is cached for `CACHE_TTL_MINUTES=10` `DashboardService.java:38`.\
      \ All mutation paths that create `InterviewResult` / `InterviewSession.FINISHED`\
      \ never delete/evict that bucket. Verified stale window = **up to 10 minutes**\
      \ after any new interview completes. Root cause is identical to Run 1 (Redis\
      \ authority assumption / freshness drift) but manifested in aggregation/read-model\
      \ workflow vs session state machine.\n\n**Verdict:** Confirmed stale-cache bug.\
      \ `bucket.get()` short-circuit `DashboardService.java:51-58` treats Redis as\
      \ source-of-truth until expiry. DB remains correct, cache diverges.\n\n## 2.\
      \ Multi-Agent Coordination\n\n| Agent | Responsibility | Finding |\n|---|---|---|\n\
      | **backend-agent** (lead) | Inspect `DashboardService` Redis path | Cache-aside\
      \ with TTL, no invalidation hook |\n| **database-agent** | Compare `InterviewResult`/`InterviewSession`\
      \ truth vs cached `DashboardVO` | Sources are `resultMapper` + `sessionMapper`\
      \ `DashboardService.java:70-77`; post-mutation they change, cache does not |\n\
      | **testing-agent** | Verify staleness until expiry | Repro sequence proves\
      \ `build(cache_hit) -> DB insert -> build(hit)` returns stale payload |\n| **security-agent**\
      \ | Trust / decision impact | Stale radar/weakPoints can misguide user; no privilege\
      \ escalation but integrity violation |\n| **reviewer-agent** | Confirm family\
      \ relation to Run 1 | Same pattern as `InterviewStateStore:24h TTL + fallback`\
      \ `InterviewStateStore.java:25,51`; different service, same authority fallacy\
      \ |\n\n## 3. Redis Bucket Inspection\n\n### 3.1 Code Path `DashboardService.java:48-67`\n\
      ```java\npublic DashboardVO build(Long userId) {\n    String key = \"dashboard:user:\"\
      \ + userId;          // line 49\n    RBucket<String> bucket = redissonClient.getBucket(key);\
      \ // line 50\n    String cached = bucket.get();                     // line\
      \ 51\n    if (cached != null) {\n        try {\n            return objectMapper.readValue(cached,\
      \ DashboardVO.class); // 53-54 early return\n        } catch (Exception e) {\
      \ log.warn(...); }      // 56 parse-fallback only\n    }\n    DashboardVO vo\
      \ = compute(userId);                 // 60 fresh DB aggregate\n    try {\n \
      \       bucket.set(objectMapper.writeValueAsString(vo), CACHE_TTL_MINUTES, TimeUnit.MINUTES);\
      \ // 62\n    } catch (Exception e) { log.warn(...); }\n    return vo;\n}\n```\n\
      * **Type:** `RBucket<String>` serialized JSON (non-typed object). No version\
      \ field, no timestamp validation.\n* **TTL:** `private static final long CACHE_TTL_MINUTES\
      \ = 10` `DashboardService.java:38` + `TimeUnit.MINUTES` `DashboardService.java:62`\n\
      * **Redisson config:** single-server `redis://host:port` `RedissonConfig.java:22-27`\
      \ — no pub/sub invalidation configured.\n\n### 3.2 Compute Source-of-Truth `DashboardService.java:69-152`\n\
      ```java\nList<InterviewResult> results = resultMapper.selectList(\n    new LambdaQueryWrapper<InterviewResult>().eq(InterviewResult::getUserId,\
      \ userId)); // 70-71\nList<InterviewSession> sessions = sessionMapper.selectList(\n\
      \    new LambdaQueryWrapper<InterviewSession>()\n        .eq(InterviewSession::getUserId,\
      \ userId)\n        .eq(InterviewSession::getStatus, \"FINISHED\")\n        .isNotNull(InterviewSession::getTotalScore)\n\
      \        .orderByAsc(InterviewSession::getFinishedAt)); // 72-77\n```\nFollowed\
      \ by 4-dimension averaging, `stats`/`trend`/`weakPoints`/`suggestions` derivation.\
      \ This is **authoritative but bypassed on cache hit**.\n\n## 4. Source-of-Truth\
      \ Comparison (database-agent)\n\n| Entity | Table / Mapper | Mutation Producers\
      \ | Dashboard Usage |\n|---|---|---|---|\n| `InterviewResult` `InterviewResult.java:14-32`\
      \ | `interview_result` via `InterviewResultMapper` `InterviewResultMapper.java:8`\
      \ | `InterviewService.java:150,166,223,239` (sync) + async `InterviewScoringService.java:104`,\
      \ `RuleBasedScoringService.java:55`, `LegacyAiScoringService.java:111`, `EvaluationService.java:40`\
      \ | `dimSums` + `suggestions` `DashboardService.java:85-100,134-148` |\n| `InterviewSession`\
      \ | `interview_session` | `InterviewService.finishSession()` `InterviewService.java:335-341`\
      \ `session.setStatus(FINISHED)` + `EvaluationService.score()` paths | `stats`/`trend`\
      \ `DashboardService.java:120-131` |\n\n**Critical divergence:** After `finishSession()`\
      \ inserts `InterviewResult` and updates `session.totalScore`, the DB now contains\
      \ `N+1` rows, but `RBucket.get()` still returns `N`-row snapshot. No FK-trigger\
      \ or application event updates the bucket.\n\n**Grep evidence:** global search\
      \ for `dashboard:user` yields only `DashboardService.java:49` and benchmark\
      \ doc; search for `delete|invalidate|evict` shows only `InterviewStateStore.java:58-59`\
      \ (session delete, not dashboard) — **zero dashboard invalidation call sites**.\n\
      \n## 5. Stale-Until-Expiry Verification (testing-agent)\n\n### 5.1 Expected\
      \ Validation Matrix (from `Phase-8.2.1.2-Runtime-Benchmark.md:180-194`)\n\n\
      | Step | Action | Expected DB State | Expected Cache Response | Actual (confirmed)\
      \ |\n|---|---|---|---|---|\n| 1 | `DashboardService.build(userId)` cold | `selectList`\
      \ computes `stats.totalInterviews = N` | MISS → computes → `SET key EX 600`\
      \ | as designed |\n| 2 | Complete new interview: `InterviewService.answer()`\
      \ → `resultMapper.insert(result)` + `finishSession()` | `N+1` results, new `FINISHED`\
      \ session row | **No delete on `dashboard:user:{userId}`** | confirmed absent\
      \ |\n| 3 | `DashboardService.build(userId)` within 10m | DB truth `N+1` | `GET\
      \ key` → HIT → returns stale `N` payload | **BUG** |\n| 4 | Compare `bucket.get()`\
      \ JSON vs `resultMapper.selectList()` count | Cache `value != DB` | diverged\
      \ | root cause |\n| 5 | Wait >10m or `bucket.delete()` manually | TTL expiry\
      \ | MISS → recomputes → now `N+1` | eventual consistency only |\n\n### 5.2 Frontend\
      \ Amplification\n`Dashboard.vue:16-19`:\n```ts\nconst { data, isLoading } =\
      \ useQuery({\n  queryKey: ['dashboard'],\n  queryFn: getDashboard, // frontend/src/api/dashboard.ts:28\
      \ GET /dashboard\n})\n```\n* No `staleTime`/`cacheTime` tuning — relies entirely\
      \ on server truth.\n* No invalidation after `Interview.vue:34 getInterviewResult`\
      \ or router navigation to `/dashboard` after interview finish. TanStack cache\
      \ will also serve stale for its own window, compounding the 10m server TTL into\
      \ perceived longer staleness.\n* ECharts render `renderRadar()` `Dashboard.vue:21`\
      \ / `renderTrend()` `Dashboard.vue:48` visualizes stale `dimensions`/`trend`\
      \ — user sees old radar, wrong `avgScore`/`weakPoints`.\n\n## 6. Invalidation\
      \ Path Audit (System Architect)\n\n**Result:** No invalidation path exists.\n\
      \nChecked:\n* `InterviewService.java:335-350 finishSession()` — writes `InterviewStateStore`\
      \ `FINISHED` + RabbitMQ `ScoringMessage`, no `redissonClient.getBucket(dashboard:user:...).delete()`.\n\
      * `InterviewScoringService.java:97-109` & `RuleBasedScoringService.java:54-63`\
      \ `@RabbitListener` score consumers — insert + `sessionMapper.updateById`, no\
      \ cache eviction, no event bus.\n* `EvaluationService.java:40` pure scoring,\
      \ no side-effect.\n* `DashboardController.java:19-22` `GET /dashboard` thin\
      \ proxy, no `CacheEvict`.\n* Global codebase grep for `bucket.delete` only hits\
      \ `InterviewStateStore.java:59`.\n\n**Architecture smell:** **Cache-aside without\
      \ write-invalidation**. Redis treated as authoritative read-model, DB as write-model,\
      \ with no coherence protocol. Identical anti-pattern to Run 1: `InterviewStateStore.write(TTL_HOURS=24)`\
      \ `InterviewStateStore.java:25` + `InterviewService.requireAsking()` `InterviewService.java:372-391`\
      \ fallback logic.\n\n**Timeline drift:**\n```\nT0: build() MISS -> compute(N)\
      \ -> SET TTL 600s\nT1 (T0+2m): interview finishes -> DB N+1, Redis still N\n\
      T1+epsilon: build() HIT -> returns N (stale) -- user visible bug\nT0+10m: key\
      \ expires -> next build() MISS -> eventually consistent\n```\n\n## 7. Frontend\
      \ Performance & System Impact (Frontend Performance Agent)\n\n* **Performance\
      \ win vs correctness loss:** 10m TTL avoids per-request `selectList` scans over\
      \ `interview_result` + `interview_session` (two table scans) — good for API\
      \ latency, bad for freshness.\n* **User trust degradation:** Radar shows “最薄弱维度”\
      \ stale `DashboardService.java:118`, suggestions stale — user may double-practice\
      \ wrong dimension after high-score session completes.\n* **No ETag / Last-Modified:**\
      \ `GET /dashboard` returns cached JSON without validation headers; browser/CDN\
      \ cannot revalidate.\n* **Recommended contract (not applied per task constraint):**\
      \ Add `Cache-Control: max-age=0` + server-side conditional or websocket push\
      \ on `ScoringMessage` completion.\n\n## 8. Security / Integrity (security-agent)\n\
      \n* Not an auth bypass. User isolation is correct (`eq userId` `DashboardService.java:71`).\
      \ But **integrity issue**: stale `weakPoints`/`suggestions` `DashboardService.java:118-133`\
      \ could cause incorrect self-assessment; in enterprise/interview-prep context\
      \ this is a material trust violation.\n* No cache poisoning vector observed\
      \ — key is namespaced per user, value is server-serialized. However `catch Exception\
      \ -> log.warn continue` `DashboardService.java:55,64` silently serves stale/bad\
      \ JSON vs fail-open, masking underlying drift.\n\n## 9. Relation to Run 1 —\
      \ Same Family, Different Workflow\n\n| Aspect | Run 1 | Run 2 (this) |\n|---|---|---|\n\
      | **Service** | `InterviewStateStore` + `InterviewService.requireAsking()` |\
      \ `DashboardService.build()` |\n| **Redis use** | Runtime state machine authority\
      \ `interview:session:{id}` `InterviewStateStore.java:31` | Aggregated read-model\
      \ cache `dashboard:user:{id}` `DashboardService.java:49` |\n| **TTL** | 24h\
      \ `InterviewStateStore.java:25` | 10m `DashboardService.java:38` |\n| **Failure\
      \ mode** | Expiry → DB fallback masks drift; live interview blocked/reverted\
      \ | Insert → no expiry → returns stale aggregate until TTL |\n| **Common root**\
      \ | **TTL / freshness assumption without validation or invalidation; Redis treated\
      \ as truth** | same |\n| **Impact** | Session cannot continue, state inconsistency\
      \ | Analytics wrong, user misguided |\n\nValidates benchmark’s “semantically\
      \ related but workflow-different” criterion `Phase-8.2.1.2-Runtime-Benchmark.md:159-164`.\n\
      \n## 10. Technical Reviewer — Recommendations (Analysis Only, Not Implemented)\n\
      \n> Per task: `Only analysis, do not modify files.` Below are prescribed fixes\
      \ for future implementation — verified conceptually, not applied.\n\n**Option\
      \ A — Explicit invalidation (strongest, recommended):**\n```java\n// After any\
      \ InterviewResult insert / session FINISHED\npublic void invalidateDashboard(Long\
      \ userId) {\n    redissonClient.getBucket(\"dashboard:user:\" + userId).delete();\n\
      }\n// Call sites: InterviewService.finishSession(), RuleBasedScoringService.score()\
      \ after sessionMapper.updateById, InterviewScoringService.score()\n```\n\n**Option\
      \ B — Event-driven:** Publish `DashboardInvalidationEvent(userId)` via Spring\
      \ `ApplicationEventPublisher` or Rabbit `aiview.dashboard.invalidate`; `DashboardService`\
      \ listener deletes bucket. Decouples scoring async workers from cache.\n\n**Option\
      \ C — Version/short-TTL + validation:** Store `dashboard:user:{id}:version`\
      \ or `max(result.id)` alongside cache; `build()` does `select COUNT(*) / MAX(createdAt)`\
      \ cheap check before returning HIT; if version mismatch → recompute. Reduces\
      \ full `compute()` cost while guaranteeing freshness.\n\n**Option D — Frontend\
      \ mitigation (complements backend):**\n```ts\n// In Interview.vue after finish,\
      \ or globally:\nqueryClient.invalidateQueries({ queryKey: ['dashboard'] })\n\
      // Or Dashboard.vue: staleTime 0 + refetchOnMount: 'always' + interval polling\
      \ 60s\nuseQuery({ queryKey:['dashboard'], queryFn:getDashboard, staleTime: 0,\
      \ refetchOnWindowFocus: true })\n```\n\n**Trade-off table:**\n\n| Strategy |\
      \ Freshness | Perf cost | Complexity |\n|---|---|---|---|\n| Delete on write\
      \ (A) | Immediate | Minimal (one DEL) | Low — 3 call sites |\n| Event (B) |\
      \ <100ms async | Minimal | Med — needs idempotent listener |\n| Version check\
      \ (C) | Immediate | Extra `SELECT COUNT` per hit | Med |\n| Frontend only (D)\
      \ | No fix (server still stale) | None | Low — masks but not solves |\n\n**Immediate\
      \ minimal fix recommendation:** **A + B** — synchronous `delete()` in `InterviewService`\
      \ paths + async listener for Rabbit scoring workers, covering both sync `answer()`\
      \ inserts and async `RuleBasedScoringService`.\n\n## 11. Evidence Summary\n\n\
      * Cache write: `DashboardService.java:62`\n* Cache read early-return: `DashboardService.java:51-58`\n\
      * TTL constant: `DashboardService.java:38`\n* No invalidation: grep `dashboard:user`\
      \ 2 hits only; grep `invalidate|evict` 0 hits for dashboard\n* Sources queried\
      \ on MISS only: `DashboardService.java:70-77`\n* Producers that should invalidate\
      \ but don’t: `InterviewService.java:150`, `165`, `223`, `239`, `InterviewScoringService.java:104`,\
      \ `RuleBasedScoringService.java:55`\n* Frontend cached without revalidation:\
      \ `Dashboard.vue:16-19`, `dashboard.ts:28`\n\n**Conclusion:** Bug fully validated.\
      \ Redis dashboard cache remains stale for up to 10 minutes post-mutation due\
      \ to missing invalidation; fix requires explicit `bucket.delete()` or event-driven\
      \ eviction on every `InterviewResult` creation / session completion.\n"
