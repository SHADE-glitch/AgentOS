        \ 回退是异常路径，性能代价可接受\n3. 校验逻辑清晰，只在 `requireAsking()` 一个入口\n\n---\n\n### answer()\
        \ 幂等性方案\n\n**推荐**：Redis + 幂等键去重（TC-005 的思路）\n\n```\n请求 → 提取 Idempotency-Key\
        \ (header 或 body 字段)\n  → Redis GET \"idemp:{key}\"\n    → HIT → 返回缓存的响应，跳过业务逻辑\n\
        \    → MISS → 执行业务逻辑 → Redis SET \"idemp:{key}\" (TTL 5min) → 返回响应\n```\n\n\
        **实施要点**：\n1. `InterviewController` 层接受 `Idempotency-Key` header\n2. `InterviewService.answer()`\
