        \    }\n    // ... 后续校验不变\n}\n```\n\n**优势**：改动最小，只影响 DB 回退路径，不改变正常 Redis 命中路径的行为。\n\
        \n**风险**：每次 DB 回退多一次 DB 查询。可接受，因为 Redis 命中是常态，DB 回退是异常路径。\n\n---\n\n#### 方案\
