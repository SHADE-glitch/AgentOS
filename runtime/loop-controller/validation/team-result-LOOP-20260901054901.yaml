        \ `answer()` call twice with the same idempotency key → second call should\
        \ return same result, no duplicate rows\n4. **Race test:** Two `answer()`\
        \ calls with different payloads on same session → lock ensures serial execution,\
        \ no state corruption\n\n---\n\n### 7. Summary\n\nThe session state drift\
        \ stems from two independent but compounding design gaps:\n\n1. **BUG-001**\
        \ is an architectural correctness issue — the DB fallback path treats denormalized\
        \ fields as authoritative without cross-validation. Fix: validate `currentQuestionId`\
        \ against message history during rehydration.\n\n2. **BUG-002** is a missing\
        \ idempotency contract — the API lacks deduplication, allowing retries to\
        \ corrupt state. Fix: introduce idempotency key at the API layer.\n\nBoth\
        \ fixes are independently deployable and low-risk. The TTL refresh (Fix C)\
        \ is a defensive improvement but not sufficient alone — the DB validation\
        \ (Fix A) is the authoritative safety net."
