      \ `interview_message` 记录的一致性。可能的漂移场景：\n\n| 场景 | DB 状态 | 实际消息 | 后果 |\n|------|---------|----------|------|\n\
      | Redis 过期 + DB 写入延迟 | `questionCount=3, currentQuestionId=10` | 实际只有 2 个问答对\
      \ | 状态与消息不匹配 |\n| 进程崩溃在 DB update 和 Redis write 之间 | `questionCount=N` (新) |\
