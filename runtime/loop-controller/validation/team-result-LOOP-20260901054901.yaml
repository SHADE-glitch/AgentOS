        \ the service accepts a stale question ID, potentially:\n- Exposing a question\
        \ the user already answered\n- Skipping a question in the sequence\n- Allowing\
        \ answer submission against a stale question context\n\n**Severity analysis:**\
        \ This is a **HIGH** severity issue because it affects data correctness under\
        \ a realistic failure mode (Redis restart, eviction, or TTL expiry during\
        \ a long interview). The 24h TTL is generous but not immune — interview sessions\
        \ could theoretically span hours with user inactivity.\n\n---\n\n### 2. Bug-002:\
        \ Non-Idempotent `answer()` Method\n\n**Location:** `InterviewService.java:128-196`\n\
        \n**The Problem:**\n\nThe `answer()` method has **no idempotency mechanism**.\
        \ Each invocation unconditionally:\n1. Inserts a new `InterviewMessage` row\
        \ (line 135: `saveUserMessage`)\n2. Increments `questionCount` (line 180:\
        \ `state.questionCount() + 1`)\n3. Picks a new question from the bank (line\
        \ 164)\n\nThere is no request-level deduplication key. A client retry after\
        \ network timeout will create:\n- Duplicate `answer` message rows with identical\
        \ content\n- An incorrect `questionCount` (inflated by 1)\n- A modified `askedQuestionIds`\
        \ set (line 144-147), which feeds into `QuestionBank.pickQuestion()` — potentially\
        \ altering which question is selected next\n\n**Impact chain:**\n```\nClient\
        \ retry → duplicate answer row → inflated questionCount\n  → wrong exclusion\
        \ set in askedQuestionIds\n  → different question picked (or premature shouldFinish)\n\
        \  → state divergence between DB and Redis\n```\n\n**Severity:** HIGH. Network\
        \ retries are common, and the distributed lock (`lockFor`) only prevents **concurrent**\
        \ access — it does not prevent **sequential retries** of the same logical\
        \ operation.\n\n---\n\n### 3. Architectural Root Causes\n\n| Root Cause |\
        \ Component | Design Gap |\n|---|---|---|\n| Denormalized state as source\
        \ of truth | `InterviewSession.currentQuestionId` | Single-field snapshot\
        \ without validation against message history |\n| Cache-only TTL, no refresh-on-access\
        \ | `InterviewStateStore.write()` | TTL is set once, never refreshed on read.\
        \ A slow interview loses its cache. |\n| No request-level idempotency | `InterviewService.answer()`\
        \ | Missing idempotency key in API contract and persistence layer |\n| DB\
        \ fallback is a blind copy | `InterviewService.requireAsking()` | No cross-validation\
        \ between DB fields and actual message state |\n\n---\n\n### 4. Recommended\
        \ Fixes (Analysis Only)\n\n#### Fix A: Validate `currentQuestionId` during\
        \ DB rehydration\n\nIn `requireAsking()`, after reconstructing state from\
        \ DB, cross-validate against the message history:\n\n```java\nprivate InterviewStateStore.SessionState\
        \ requireAsking(Long sessionId) {\n    InterviewStateStore.SessionState state\
        \ = stateStore.read(sessionId);\n    if (state == null) {\n        InterviewSession\
        \ s = sessionMapper.selectById(sessionId);\n        if (s == null) {\n   \
        \         throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n      \
        \  }\n        state = new InterviewStateStore.SessionState(\n            s.getStatus(),\
        \ s.getQuestionCount(), s.getCurrentQuestionId());\n\n        // Cross-validate:\
        \ find the last question in message history\n        List<InterviewMessage>\
        \ lastQuestion = messageMapper.selectList(\n            new LambdaQueryWrapper<InterviewMessage>()\n\
        \                .eq(InterviewMessage::getSessionId, sessionId)\n        \
        \        .eq(InterviewMessage::getKind, \"question\")\n                .eq(InterviewMessage::getRole,\
        \ \"AI\")\n                .orderByDesc(InterviewMessage::getId)\n       \
        \         .last(\"LIMIT 1\"));\n\n        if (!lastQuestion.isEmpty()) {\n\
        \            Long actualLastQuestionId = lastQuestion.get(0).getId();\n  \
        \          if (!actualLastQuestionId.equals(state.currentQuestionId())) {\n\
        \                log.warn(\"Session {} state drift: DB currentQuestionId={}\
        \ but actual last question={}\",\n                    sessionId, state.currentQuestionId(),\
        \ actualLastQuestionId);\n                // Rebuild state from authoritative\
        \ source (messages)\n                List<InterviewMessage> allMessages =\
        \ messageMapper.selectList(\n                    new LambdaQueryWrapper<InterviewMessage>()\n\
        \                        .eq(InterviewMessage::getSessionId, sessionId)\n\
        \                        .orderByAsc(InterviewMessage::getId));\n        \
        \        List<Long> askedIds = allMessages.stream()\n                    .filter(m\
        \ -> \"question\".equals(m.getKind()) && m.getKnowledgePointId() != null)\n\
        \                    .map(InterviewMessage::getKnowledgePointId)\n       \
        \             .toList();\n                state = new InterviewStateStore.SessionState(\n\
        \                    s.getStatus(), askedIds.size(), actualLastQuestionId);\n\
        \            }\n        }\n        stateStore.write(sessionId, state);\n \
        \   }\n    // ... rest unchanged\n}\n```\n\n#### Fix B: Add idempotency key\
        \ to `answer()`\n\nTwo options:\n\n**Option B1 — API-level idempotency key\
        \ (recommended):**\n- Add `idempotencyKey` field to `answer()` method signature\n\
        - On entry, check if a message with this key already exists for the session\n\
        - If yes, return the existing result; if no, proceed and save the key\n\n\
        **Option B2 — Composite dedup (simpler):**\n- Before inserting, check if the\
        \ session already has an unanswered question followed by an answer with identical\
        \ content within a short time window (e.g., 5 seconds)\n- This is heuristic\
        \ and less robust\n\n#### Fix C: TTL refresh on read\n\nIn `InterviewStateStore.read()`,\
        \ after a successful read, optionally refresh the TTL to prevent expiry during\
        \ active sessions:\n\n```java\npublic SessionState read(Long sessionId) {\n\
        \    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \    String json = bucket.get();\n    if (json == null) return null;\n   \
        \ try {\n        // Refresh TTL on active access\n        bucket.expire(TTL_HOURS,\
        \ TimeUnit.HOURS);\n        return objectMapper.readValue(json, SessionState.class);\n\
        \    } catch (Exception e) {\n        log.warn(\"parse session state failed,\
        \ sessionId={}: {}\", sessionId, e.getMessage());\n        return null;\n\
        \    }\n}\n```\n\n---\n\n### 5. Risk Assessment\n\n| Risk | Likelihood | Impact\
        \ | Mitigation |\n|---|---|---|---|\n| Redis expires during active interview\
        \ | Low (24h TTL) | High (state corruption) | TTL refresh on read + DB validation\
        \ |\n| Client retry causes duplicate answers | Medium | High (incorrect scoring)\
        \ | Idempotency key in API |\n| DB fallback picks wrong question | Medium\
        \ | Medium (user sees stale question) | Cross-validate `currentQuestionId`\
        \ against messages |\n| Concurrent requests on same session | Low (distributed\
        \ lock) | High | Already mitigated by Redisson lock |\n\n---\n\n### 6. Verification\
        \ Plan\n\nTo validate these fixes, I recommend:\n\n1. **Unit test:** `requireAsking()`\
        \ with a session where DB `currentQuestionId` != last message question ID\
        \ → should rebuild state from messages\n2. **Integration test:** Simulate\
        \ Redis `DEL` on session key mid-interview → subsequent `answer()` should\
