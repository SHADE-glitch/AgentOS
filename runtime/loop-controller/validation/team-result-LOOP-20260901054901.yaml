      \        if (state.currentQuestionId() != null) {\n            boolean alreadyAnswered\
      \ = messageMapper.selectCount(\n                new LambdaQueryWrapper<InterviewMessage>()\n\
      \                    .eq(InterviewMessage::getSessionId, sessionId)\n      \
      \              .eq(InterviewMessage::getKind, \"answer\")\n                \
      \    .eq(InterviewMessage::getRole, \"USER\")\n                    // 检查是否有回答在最新问题之后插入\n\
      \                    .gt(InterviewMessage::getId, state.currentQuestionId())\n\
      \            ) > 0;\n            \n            if (alreadyAnswered) {\n    \
      \            // 返回已有答案对应的下一题，而非重复处理\n                // ... 读取已有状态并返回\n    \
      \        }\n        }\n        \n        saveUserMessage(sessionId, \"answer\"\
      , answer);\n        // ...\n    }\n}\n```\n\n或者更简单的方式：**用请求级幂等键**（客户端生成唯一 request\
      \ ID，服务端去重）。\n\n---\n\n#### 修复 BUG-003: 答案关联校验\n\n在 `answer()` 方法签名中增加 `currentQuestionId`\
