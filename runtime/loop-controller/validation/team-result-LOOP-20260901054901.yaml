      \ status\n    InterviewStateStore.SessionState state = requireAsking(sessionId);\n\
      \    \n    // line 135: 直接保存答案，不检查是否对应 currentQuestionId\n    saveUserMessage(sessionId,\
      \ \"answer\", answer);\n```\n\n如果前端提交的答案顺序错乱（例如回答了上一道题），系统无法识别。\n\n---\n\n####\
      \ BUG-004: `answerStream()` 虚拟线程中的锁竞争风险 (MEDIUM)\n\n**位置**: `InterviewService.java:198-280`\n\
      \n```java\npublic SseEmitter answerStream(Long userId, Long sessionId, String\
      \ answer) {\n    SseEmitter emitter = new SseEmitter(300_000L);\n    Thread.ofVirtual().start(()\
      \ -> {\n        RLock lock = null;\n        try {\n            lock = lockFor(sessionId);\
      \  // 5s 超时\n            // ... 长耗时操作\n        }\n    });\n}\n```\n\n在虚拟线程内获取\
      \ Redisson 分布式锁，如果 `answer()` 正在执行，虚拟线程会等待最多 5 秒。但如果 `answer()` 内部操作耗时（评分 +\
      \ RabbitMQ 投递），可能接近 SSE 超时边界。\n\n---\n\n### 架构建议\n\n#### 修复 BUG-001: DB 回退一致性校验\n\
      \n**方案 A: 以消息记录为准重建状态**\n- 从 `interview_message` 表查询实际的问答对数量和最新问题 ID\n- 用实际数据重建\
