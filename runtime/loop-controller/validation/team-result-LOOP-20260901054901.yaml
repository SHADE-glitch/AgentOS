      - DB 回退时对比 checksum，不一致则以消息记录为准\n- **优点**: 轻量\n- **缺点**: 增加复杂度\n\n**推荐**: 方案\
      \ A，简单直接。\n\n```java\n// requireAsking() 中的回退逻辑应改为：\nif (state == null) {\n\
      \    InterviewSession s = sessionMapper.selectById(sessionId);\n    if (s ==\
      \ null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n    \n    //\
      \ 以消息记录为准重建状态\n    List<InterviewMessage> msgs = messageMapper.selectList(\n\
      \        new LambdaQueryWrapper<InterviewMessage>()\n            .eq(InterviewMessage::getSessionId,\
      \ sessionId)\n            .orderByAsc(InterviewMessage::getId));\n    \n   \
      \ long questionCount = msgs.stream()\n        .filter(m -> \"question\".equals(m.getKind())\
      \ && \"AI\".equals(m.getRole()))\n        .count();\n    \n    Long lastQuestionId\
      \ = msgs.stream()\n        .filter(m -> \"question\".equals(m.getKind()))\n\
      \        .reduce((a, b) -> b)  // 最后一条\n        .map(InterviewMessage::getId)\n\
      \        .orElse(null);\n    \n    state = new InterviewStateStore.SessionState(\n\
      \        s.getStatus(), (int) questionCount, lastQuestionId);\n    stateStore.write(sessionId,\
      \ state);\n}\n```\n\n---\n\n#### 修复 BUG-002: `answer()` 幂等性保护\n\n**方案**: 在 `answer()`\
      \ 中增加去重检查\n\n```java\npublic MessageVO answer(Long userId, Long sessionId, String\
      \ answer) {\n    RLock lock = lockFor(sessionId);\n    try {\n        InterviewSession\
      \ session = requireOwnedSession(userId, sessionId);\n        InterviewStateStore.SessionState\
