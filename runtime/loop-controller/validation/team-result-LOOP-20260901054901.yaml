      **位置**: `InterviewService.java:128-196`\n\n**问题**: `answer()` 没有任何幂等性检查：\n\n\
      ```java\npublic MessageVO answer(Long userId, Long sessionId, String answer)\
      \ {\n    RLock lock = lockFor(sessionId);\n    try {\n        InterviewSession\
      \ session = requireOwnedSession(userId, sessionId);\n        InterviewStateStore.SessionState\
      \ state = requireAsking(sessionId);\n\n        // 无条件保存用户回答 —— 没有检查是否已存在\n \
      \       saveUserMessage(sessionId, \"answer\", answer);  // line 135\n     \
      \   \n        // ... 后续逻辑\n    }\n}\n```\n\n**重复提交场景**:\n1. 用户点击\"提交答案\" → 网络超时\
      \ → 用户重试\n2. 第一次请求：保存答案 → 抽取下一题 → 返回新问题\n3. 第二次请求（在锁释放后）：`requireAsking()` 读取到\
      \ ASKING 状态 → **再次保存重复答案** → 抽取下一题\n4. 结果：同一问题收到两份答案，`questionCount` 被多算一次\n\
