      output: "# Review: Redis Session State Expiry — Continuation Failure Analysis\n\
        \n**Role:** Database Engineer (supporting Backend Architect / Code Reviewer)\
        \  \n**Scope:** Interview session runtime state in Redis with fixed TTL silently\
        \ expiring while the DB stays valid.\n\n---\n\n## 1. The core architectural\
        \ flaw\n\nTwo stores hold the *same logical session* but differ in their lifecycles:\n\
        \n| Store | What it owns | Lifetime |\n|---|---|---|\n| **DB (source of truth)**\
        \ | Session record, participants, question set, answers, persisted progress\
        \ | Reliable, durable, no TTL |\n| **Redis (cache/ephemeral)** | Hot runtime\
        \ state: current question index, token bucket, timer cursor, live queue, in-flight\
        \ writes | Fixed TTL, evictable |\n\nA **fixed TTL** is a single scalar (e.g.\
        \ `SET session:{id} state 600`) that encodes **no access feedback**. It expires\
        \ based on wall-clock age since write, *not* on whether the session is actually\
        \ in progress. This is the deterministic trigger of continuation failure:\n\
        \n> **Continuation breaks on ANY access path that requires Redis to still\
        \ hold the state, is not DB-bounded, and has no warm/cold path fallback.**\n\
        \n---\n\n## 2. When and why continuation breaks\n\nContinuation fails in these\
        \ concrete situations:\n\n- **Long-running interview > TTL.** An answer takes\
        \ longer than the TTL to compose. Initial write TTL = `N`; user resume at\
        \ `> N`. Redis silently `DEL`s. The `GET session:{id}` returns nil, yet the\
        \ DB row still has `status='active'`. The client sees \"resume should work,\"\
        \ the backend sees \"no runtime state.\"\n- **Idle-then-resume.** TTL is effectively\
        \ an *idle* TTL (renewed per operation) but the resume check does not renew/refresh\
        \ before validating. A short pause between two related steps (upload → validate)\
        \ crosses the boundary.\n- **Session resumed on new node / after restart.**\
        \ Redis was flushed (deploy, `FLUSHDB`, memory pressure eviction under `allkeys-*`\
        \ policy). The DB is intact; all Redis-derived cursors are gone.\n- **Session\
        \ is multi-step but TTL is global.** One TTL applied to the *entire* state\
        \ object. A long-lived sub-operation (LLM generation, file processing) bumps\
        \ **one** registration timestamp, but other fields were staged earlier; partial\
        \ staleness plus eventual total expiry.\n- **Write-heavy bursts with DB sync\
        \ lag.** Runtime state is written to Redis optimistically then flushed to\
        \ DB asynchronously. If Redis expires *before* the async flush commits, you\
        \ get **silent state loss that the DB never records** — the DB is valid but\
        \ *insufficient* (it lacks the lost delta). This is the worst case: DB valid\
        \ ≠ DB complete.\n\n**Mechanism (why \"silent\"):**\nFixed TTL = expiration\
        \ with **no alive-checkback**. Correct designs use a TTL-based *lease* refreshed\
        \ by a heartbeat, not a fixed lifetime. A fixed TTL gives you neither:\n-\
        \ **No \"active\" signal** → Redis can't distinguish `expired-but-active`\
        \ from `expired-inactive`.\n- **Return of nil is ambiguous** → code can't\
        \ tell \"never existed\" from \"expired,\" so it can't decide between *init-new*\
        \ vs *restore-from-DB* vs *error*.\n\n---\n\n## 3. Recommendation: make Redis\
        \ a **lease over a DB-truthful state**, not a parallel truth\n\n### 3.1 Ownership\
        \ boundary (the rewrite rule)\n- **DB owns the durable, resumable truth**\
        \ — progress, answers, next-question index.\n- **Redis owns only *labile*\
        \ runtime state** that is *reconstructible* from DB + config: rate limit counter,\
        \ current timer epoch, ephemeral queue cursor, dedupe key.\n- **Any state\
        \ that cannot be rebuilt from the DB MUST be persisted to DB synchronously**\
        \ — never live only in Redis. If you cannot afford losing a field, it has\
        \ no valid Redis lease.\n\n### 3.2 TTL as a rollback/lease, with heartbeat\
        \ renewal\n\nRedis should expire only when the session is genuinely inactive,\
        \ via expiration sliding:\n\n```python\ndef touch_session(r, sess_id: str,\
        \ idle_ttl: int = 300):\n    if r.expire(f\"session:{sess_id}\", idle_ttl)\
        \ == 0:\n        # key already gone -> cold restore from DB\n        return\
        \ restore_from_db(sess_id)   # see 3.3\n    return r.ping()\n```\n\nMake TTL\
        \ a **sliding idle timeout** (renewed on every access/heartbeat), *not* a\
        \ fixed lifetime. Renew on read, not only on write:\n\n```python\ndef get_lease(r,\
        \ sess_id: str, idle_ttl: int = 300):\n    pipe = r.pipeline()\n    pipe.get(f\"\
        session:{sess_id}\")\n    pipe.expire(f\"session:{sess_id}\", idle_ttl)  \
        \ # renew on read\n    val, _ = pipe.execute()\n    return val\n```\n\n###\
        \ 3.3 Cold/warm restore path (the fix for \"DB valid but Redis gone\")\n\n\
        Never `return nil → error`. Always route through a restore ladder:\n\n```python\n\
        state = cache.get(key)\nif state is None:\n    db_state = db.load(sess_id)\
        \          # DB is valid & complete\n    if db_state is None or not active:\n\
        \        return Abort(\"session not found\") # genuinely gone\n    cache.set(key,\
        \ build_runtime(db_state))   # rehydrate, refresh TTL\n    return db_state\n\
        ```\n\n**Trade-off to surface to lead:** choosing DB as restore source trades\
        \ Redis latency for a DB read on every cold resume. Mitigate with a **state\
        \ version/timeline** in the DB so restore is incremental, and write a `last_heartbeat`\
        \ column so you can distinguish `active-but-evicted` (restore) from `abandoned`\
        \ (close).\n\n### 3.4 Fix the async-flush ordering (the \"silent loss\" bug)\n\
        Never let DB lag a Redis eviction window:\n- Flip the write order: **write\
        \ to DB first (or same transaction), then seed Redis** as a re-readable cache.\n\
        - If Redis-first is unavoidable, add a **write-ahead marker** in DB before\
        \ mutating Redis and reconcile on eviction (outbox/SAGA pattern). Validate\
        \ that the async flush lands **within a fraction of the shortest TTL**; otherwise\
        \ a fast resume sees a Redis value *older* than the DB, or missing entirely.\n\
        \n### 3.5 Config guardrails\n- Redis `maxmemory-policy`: for session state\
        \ use `volatile-ttl`/`volatile-lru` (only evict keyed-by-expiry) **never**\
        \ `allkeys-*` (evicts even non-expiring keys).\n- Give session keys a **bounded\
        \ TTL with an upper cap** equal to the max legitimate session length, renewed\
        \ by heartbeat — so abandoned sessions still reap, live sessions never die\
        \ mid-flight.\n- **Add a heartbeat worker** (every `TTL/3`) rewewing active\
        \ sessions so an actively-used session (even between steps > TTL) survives.\n\
        - Monitor: alert of `expired key while DB active` skew via a counter field\
        \ in DB (`redis_regenerated_count`); alert if regeneration rate is non-zero\
        \ — it means TTL < max step time.\n\n---\n\n## 4. Decision summary for lead\
        \ review\n\n- **Fix required:** any Redis-only state must be DB-reconstructible;\
        \ any non-reconstructible state must be DB-persisted synchronously.\n- **Change\
        \ fixed TTL → sliding idle TTL, renewed on read + heartbeat.**\n- **On `GET`\
        \ return nil ≠ error:** implement DB-restore rehydration ladder.\n- **Fix\
        \ async flush ordering** to guarantee DB is never behind an eviction window.\n\
        - **Rejected alternatives:** extending TTL drastically (leaks abandoned sessions,\
        \ amplifies stale-Redis risk), ignoring expiry (silent divergence between\
        \ stores).\n\n**Risk to flag highed:** the async flush + Redis-first ordering\
        \ is a genuine data-loss window (DB valid but incomplete); this should block\
        \ sign-off on continuation reliability until reordered.\n\n---\n\nWould you\
        \ like me to draft the restore-ladder implementation against your actual database\
        \ driver and Redis client, or a schema change for the `last_heartbeat`/`redis_regenerated_count`\
        \ columns?"
