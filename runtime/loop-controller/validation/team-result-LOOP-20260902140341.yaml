      output: "# Contribution — Database Engineer\n\nSubject: **Redis runtime-state\
        \ TTL expiry vs. persistent DB validity — when/why continuation breaks**\n\
        \n## 目标\n- 业务目标: 面试会话续接必须可靠——DB 是权威真相源（source of truth），Redis 仅是运行时状态缓存。\n\
        - 当前约束: 固定 TTL（fixed TTL），Redis 与 DB 各自维护同一会话的两份生命周期。\n- 成功标准: 用户在任何时刻续接会话，行为与\"\
        数据库仍有效\"这一事实一致；不再出现\"DB 有数据但接口说会话已结束\"的静默断裂。\n\n## 问题判断\n\n**根因**: 单一固定 TTL\
        \ 被当成\"会话有效期的唯一真值\"，但 TTL 实际描述的只是 *Redis 中运行时缓存寿命*，与 DB 中会话的有效状态是两个独立的生命周期。当\
        \ TTL 到点，Redis 会**默默 `del`**，而 DB 行仍旧有效 → 系统既无异常也无告警，续接却在无机会恢复的状态下断裂。这是典型的\
        \ **cache-expiry-as-truth** 反模式。\n\n**何时断裂（具体触发时点）**:\n\n1. **固定 TTL 短于会话实际时长**。面试超过\
        \ TTL（如 TTL=30min，面试 1h），Redis 在 30min 时清空状态。之后任何续接要求，Redis 返回 miss。\n2. **会话有静默窗口（idle\
        \ gap）**。TTL 按一固定起点计算，期间无写入活动（如等待 candidate/helper）。TTL 到点后 Redis 清空，下次恢复进行时状态已丢。文本类面试工具的\"\
        恢复或续接\"功能最典型。\n3. **写路径不存在**（纯前端续接，直接读 Redis）。若续接只依赖 Redis 值，miss 即\"会话不存在\"\
        ，即使 DB 根本没有任何过期逻辑。\n\n**为什么续接会断裂（机制链）**:\n- Redis 绕过 LRU 的部分场景（`allkeys-lru`/volatile），TTL\
        \ 到期即 `DEL`，**不回写、不通知、不对比 DB**。\n- 续接逻辑读到 `NIL` → 误判\"会话已结束/无效\" → 走错误分支（创建新会话、拒绝、或\
        \ 404）。\n- 若续接时**先查 Redis 再回源 DB**，且未区分\"cache miss\"与\"会话真不存在\"，则即便 DB 有效也无法自救，因为代码把\
        \ miss 当成了否定答案（negative caching 缺失）。\n\n## 方案设计\n\nOption A — **TTL 只保鲜态，过期语义由\
        \ DB 决定（推荐）**\n- 放宽/去掉固定 TTL；或 TTL 显著大于会话上限，使 Redis 寿命不成为断裂源。\n- DB 记录 `expires_at`/`session_status`，续接接口以\
        \ **DB 为准**。\n- 关键: 续接逻辑**先回源 DB**；Redis 仅作读缓存，miss 时回源填充，绝不把 miss 当否定。\n\n\
        Option B — **DB 同样施加 TTL（统一生命周期）**\n- DB 会话行加 `expires_at`，定时任务清理。Redis TTL\
        \ 从 `expires_at - now` 计算，保证两者**同时失效**。\n- 缺点: 需要后台清理任务/job + DB 里额外的状态迁移，系统复杂度上升。\n\
        \nOption C — **续接时用拟过期（soft expiration）**\n- DB 记录最后活动时间；Redis 值失效后仍可在逻辑层判定\"\
        会话是否还有效\"，只在 DB 过期时才真正拒绝。\n\n### Decision\n- **推荐: Option A（主体）+ Option C（键缺失的自救）**。改动小、行为与\"\
        DB 有效\"这一事实一致，是最符合本约束的经济方案。\n- 理由: 不改 DB 权威角色、不回撒状态迁移复杂度；仅修正续接时\"cache miss\
        \ 即失败\"的错误语义。\n- 风险与缓解:\n  - 风险: Redis 长期持有冷数据占内存。缓解: volatile-lru 逐出策略 +\
        \ `maxmemory` 限制，冷会话可被淘汰但 DB 不受影响。\n  - 风险: 回源风暴（key 同时过期）。缓解: cache-aside\
        \ + 读穿(stampede protection)、random jitter 化到期。\n\n## 实施方案（核心要点）\n\n1. **DB\
        \ 为唯一真值源（续接必须触碰它）**\n   续接接口签名的判定改为:\n   ```\n   status, expiresAt = query_db(session_id)\
        \        # 权威\n   if 已过期/已结束 -> 明确返回 ended（带原因头）\n   runtime = redis.get(session_id)\n\
        \   if runtime 无 -> 从 DB/JOS 重建运行时状态（不视为失败）\n   ```\n   关键: 区分\"**cache miss（可重建）**\"\
        与\"**会话不存在（错误/404）**\"两种结果，绝不能混为一谈。\n\n2. **固定 TTL 语义修正**\n   ```python\n\
        \   # 之前（断裂源）: 固定 TTL 当作会话寿命\n   redis.set(sid, payload, ex=FIXED_TTL)\n\n\
        \   # 之后（建议）: TTL >= 会话上限，或按 DB.expires_at 动态计算\n   ttl = db_expires_at -\
        \ now   # ttl > 0 才写；package TTL 为该值\n   redis.set(sid, payload, ex=ttl)\n\
        \   # 加 volatile-lru 兜底冷数据淘汰\n   ```\n\n3. **续接班\"miss 即重建\"，不 miss 即死**\n\
        \   伪代码:\n   ```python\n   state = redis.get(sid)\n   if state is not None:\n\
        \       return deserialize(state)\n   db = load_db_session(sid)      # 权威\n\
        \   if not db or db.expired():\n       raise SessionEnded(reason=db.reason)\
        \  # 这是唯一真正失败点\n   state = rebuild_runtime(db)     # 重建，不报错\n   redis.set(sid,\
        \ state, ex=ttl_for(db))  # 回填\n   return state\n   ```\n\n4. **负缓存（可选增强）**——DB\
        \ 明确已结束时写短暂 NIL 留痕，避免对同一失效键反复回源压力。\n\n5. **可观测性**: 对 `cache_miss_rebuilt`\
        \ 与 `session_expired` 打 metric/日志；二者比例骤增即为续接断裂的预警信号，解决\"静默消失\"。\n\n## 验证方式\n\
        - 测试 A（TTL 到点但 DB 有效）: 设短 TTL，令会话跨 TTL 再续接 → 期望成功续接（从 DB 重建）。\n- 测试 B（TTL+DB\
        \ 双过期）: 两者失效 → 期望返回明确的 ended，且带原因。\n- 测试 C（冷数据逐出）: 撑满 maxmemory/模拟逐出 → 续接仍应从\
        \ DB 重建，不 404。\n- 基准回放: 对历史会话数据重放，比较新旧逻辑的续接成功率。\n- 期待结果: Redis miss ≠ 会话失效；续接成功率与\
        \ DB 有效性严格一致。\n\n## 复盘建议\n- 将此\"cache miss 不能作为否定答案\"规则沉淀为团队缓存规范。\n- 后续可用\
        \ DB `uniqueindex/session_id + expires_at` 或 Redis 记录带 DB 版本号(如 `updated_at`)做乐观并发校验，防止\
        \ Redis 与 DB 时序不一致。\n- 若面试状态量较大，可考虑把会话运行时落到 DB，Redis 仅缓存热点子集，从根上消除双生命周期问题。"
