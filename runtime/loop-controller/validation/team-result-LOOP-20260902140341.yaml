        ## Security-Engineer Review: Redis Fixed-TTL vs DB — When & Why Continuation
        Breaks


        **Scope:** `backend/.../interview/` runtime state path. The "runtime truth"
        lives in Redis; the "durable truth" lives in MySQL. The two can silently diverge
        when the Redis key expires.


        ### Root mechanism (the code)


        - Every non-read write sets an absolute fixed TTL: `InterviewStateStore.java:51`
        → `bucket.set(json, TTL_HOURS, TimeUnit.HOURS)` with `TTL_HOURS = 24`.

        - The TTL is (re)set on **every write** and only counted down by the clock
        — **reads do not refresh it** (`get()` at line 36 does not touch TTL).

        - The DB row has **no expiry** — `interview_session.status` stays `ASKING`
        indefinitely (`InterviewService.java:183-186`), even after Redis drops the
        runtime copy.

        - `requireAsking` (`InterviewService.java:380-399`) contains a **silent self-heal**:
        if the Redis key is `null`, it re-hydrates from the DB row and *writes it
        back to Redis* with a fresh 24h TTL.


        ### When it actually breaks (the dangerous cases)


        **1. Idle gap > 24h, then resume → silent policy bypass (security-relevant).**

        If a user is inactive for 24h, the key expires. On the next `answer`, the
        self-heal reconstructs `ASKING` state from the DB and *resumes the interview
        as if nothing happened*. The TTL was presumably the intent of a "session timeout,"
        but the fallback defeats it completely — an interview that should be enforced-expired
        is silently **re-enabled**. Expiry provides no security boundary.


        **2. In-progress session killed mid-flight, not just stale-resume.**

        Because `write()` overwrites TTL, an *actively used* session is fine. But
        a session where the user pauses at a question for >24h (e.g., they prepared
        an answer) drops its runtime copy. If both Redis and DB current-question pointers
        disagree at that moment, re-hydration uses the **DB** pointer, which can silently
        pair the user''s answer against the wrong question or advance the count inconsistently
        with what the client already rendered.


        **3. Dual-write ordering race → duplicated answer / double scoring.**

        Write order in `answer`/`answerStream`/`finishSession` is **DB first, Redis
        second** (`sessionMapper.updateById(...)` then `stateStore.write(...)`). If
        Redis write fails (`stateStore.write` throws `INTERNAL_ERROR`, `InterviewStateStore.java:52-55`),
        the DB is already advanced but the client gets an error, so the user retries
        — which appends **another `answer` message** and `extractQAPairs` double-counts
        it (`InterviewService.java:141-158`), inflating scores and possibly forcing
        an early finish. This is the clearest "continuation breaks with corruption."


        **4. Non-TTL eviction is invisible.**

        Redis `maxmemory` LRU/allkeys eviction deletes the key the same way TTL does;
        the DB stays valid. The self-heal silently resurrects an evicted session —
        masking an outage that signals (a) memory pressure and (b) the runtime/durable
        split.


        **5. Crash between Redis write and any downstream use** — bounded by the fact
        DB was written first, so this is the *least severe*, but it still leaves Redis
        possibly ahead in the tiny window where the key has data the DB is about to
        get. On expiry that window is moot.


        ### Why it breaks (root causes)


        - **Split-brain, non-transactional dual source of truth**: Redis holds the
        state-machine authority (`InterviewStateStore.java:14-16`) but only MySQL
        persists. TTL applies to the runtime store; durability lives in a DB that
        never expires — so the two time-bases diverge.

        - **The self-heal masks the very divergence it should surface**: `stateStore.read()==null`
        is collapsed into "resume from DB," so an *expired* session and a *never-written*
        session are indistinguishable, and no explicit "expired" error is ever returned.

        - **Fixed TTL is an absolute timeout anchored to the last write**, not an
        inactivity lease — so a legitimate long-gap resume is treated identically
        to a hard-session-expiry, with no way to distinguish.

        - **No CAS/lease on rehydration write-back** — the write-back in `requireAsking`
        (line 389) races conceptually with concurrent `answer` writers; protected
        by the session lock today, but it re-anchors TTL invisibly on every expired
        resume.


        ### Recommended hardening


        1. **Treat Redis as a cache, MySQL as authority.** On key-miss, do NOT blindly
        write TTL back. Return an explicit **expired** result: `NoSuchSessionState("expired")`
        with a user-visible "会话已过期，请重新开始" message. Make expiry a first-class, fail-closed
        outcome.

        2. **Move TTL to an inactivity lease keyed off `updated_at`.** Either (a)
        touch TTL on **read** too (`bucket.setAndKeepTTL` old / `bucket.expire` on
        hit), or (b) validate against DB `updated_at`: resume only if `now - updated_at
        < timeout`, else reject.

        3. **Fix write ordering** to Redis-first-then-DB (so DB never advances past
        a Redis failure) **or** make the whole step idempotent: accept a client-supplied
        idempotency key / use the message insert as the natural guard to prevent duplicate
        `answer` rows on retry.

        4. **Converge next-question advancement**: derive `newCount` and `currentQuestionId`
        from the DB `message` table (source of truth) rather than the recoverable
        Redis `questionCount`, and store current question within the session row (already
