      fixed TTL** but **not written to the DB at the s'
    output: "# Interview Session Continuation: Redis TTL vs. DB State Mismatch\n\n\
      ## TL;DR\nContinuation breaks when runtime session state is **written to Redis\
      \ with a fixed TTL** but **not written to the DB at the same time**, and the\
      \ session lifecycle is driven by DB validity rather than Redis key presence.\
      \ The failure window is the gap after Redis expiry but before DB invalidation\
      \ — during that window, the DB says \"valid\" while the runtime layer has nothing\
      \ to resume from.\n\n---\n\n## 1. When continuation breaks (the trigger conditions)\n\
      \nContinuation breaks when **all** of these hold simultaneously:\n\n| # | Condition\
      \ | Detail |\n|---|-----------|--------|\n| 1 | Fixed TTL ≠ DB-driven lifecycle\
      \ | Redis key has a constant TTL (e.g. `EXPIRE key 900`) independent of the\
      \ interview's actual validity as stored in DB |\n| 2 | Redis is the source of\
      \ **operational** truth | Resume flow reads runtime state (vector of answers,\
      \ current question index, timer, token budget) from Redis only, not from DB\
      \ |\n| 3 | DB is the source of **authoritative** truth | The `status`/`expires_at`/`last_active_at`\
      \ columns still show the session as resumable |\n| 4 | No reconciliation | No\
      \ write-through/sidecar/heartbeat refreshes or extends the TTL in lock-step\
      \ with DB activity |\n| 5 | Timeout > 0 exists between the two | There is a\
      \ real interval where Redis is gone but DB is still warm |\n\nConcretely, this\
      \ is the failure sequence on a \"resume\" request:\n\n```\nT0   session created\
      \            -> DB row insert + Redis SET k v  EXPIRE k 900\nT+600  candidate\
      \ answers        -> Redis state mutated, DB only bumps last_active_at (no redis\
      \ refresh)\nT+900  Redis key evicted        -> GET k returns nil  ◆ DB still\
      \ status='active'\nT+902  candidate resumes        -> app checks DB: OK -> tries\
      \ to load runtime state from Redis -> MISS\n                               \
      \                    continuation FAILS\nT+... Redis miss eventually forces\
      \ a degraded restart or errors out\n```\n\n---\n\n## 2. Why it breaks (core\
      \ reasons)\n\n### 2.1 Two sources of truth with mismatched expiry clocks\n-\
      \ **DB truth**: rows live until explicitly `UPDATE ... SET status='expired'`\
      \ or a lazy check of `expires_at`.\n- **Redis truth**: keys live until TTL hits\
      \ **zero**, then are **silently evicted** (no event, no error).\n\nThese two\
      \ clocks tick independently. When the TTL is a fixed constant, the expiry is\
      \ **not coupled** to the DB's notion of validity, so the eviction can arrive\
      \ while the DB is still honest.\n\n### 2.2 Delete-by-expiry is silent and async\n\
      Redis expiration is *lazy + on-scan* (and, if volatile-lru/lfu/ttl eviction\
      \ policy, can happen even *earlier* under memory pressure). There is **no callback**\
      \ telling your app \"this session-state key just died.\" So the app's own checks\
      \ (`EXISTS`, `GET`) simply return `nil`, and unless the code distinguishes \"\
      never existed\" from \"expired but the interview is still active,\" it will\
      \ mis-handle it.\n\n### 2.3 Atomicity gap between state and truth\nThe broken\
      \ design mutates Redis (runtime state) and relies on it persisting *independently*\
      \ of DB mutations. There is no single transaction covering both. Even a write-through\
      \ on state change fails to refresh the TTL, so the guaranteed-eviction-at-TTL\
      \ remains.\n\n### 2.4 TTL refreshes are opportunistic / not guaranteed\nStandard\
      \ refresher approaches (`expire` on each request, sliding window) still have\
      \ a **race**: between the last refresh and the next request, the TTL can elapse\
      \ if the interval between requests is longer than the refresh horizon — precisely\
      \ the \"idle candidate walked away for 15 min\" case.\n\n---\n\n## 3. The root-cause\
      \ hierarchy\n\n```\nDB says VALID  +  Redis says GONE\n          \\        \
      \              /\n           \\                    /\n            \\   CONTINUATION:\
      \ app cannot rebuild operational state\n             \\          |\n       \
      \       -> restart from DB baseline is impossible because\n                \
      \ runtime state was never (fully) persisted in DB\n```\n\nCrux: **the operative\
      \ state was only ever in Redis.** The DB has enough to say \"you may continue\"\
      \ but not enough to say *where* the candidate is. Restart-from-DB is impossible\
      \ → hard break.\n\n---\n\n## 4. Detection checklist (how to confirm it's this\
      \ bug)\n\nRedis side:\n```redis\n# after the failure, is the key really gone?\n\
      EXISTS session:{id}\nTTL  session:{id}        # returns -2 if key absent, -1\
      \ if no ttl, >0 remaining\n```\n- `-2` → evicted by TTL (or never written).\
      \ Check with `ttl` right before/after the miss.\n\nApp side:\n```\nattempt_resume(session_id):\n\
      \    s  = DB.get_active(session_id)      # returns row, status='active'\n  \
      \  if s is None: return EXPIRED        # DB already flipped\n    state = redis.get(session:{id})\
      \     # <- None here == the bug\n    if state is None:\n        # AMBIGUITY:\
      \ expired-vs-never-written-vs-evicted-under-pressure\n        # fallback cannot\
      \ reconstruct -> breaks\n```\n\nLog snapshot test — capture at miss time:\n\
      ```json\n{\n  \"db_status\": \"active\",\n  \"db_expires_at\": \"2026-09-02T18:00:00Z\"\
      ,   // still in future\n  \"redis_ttl\": -2,                            // key\
      \ gone\n  \"created_at_ttl\": 900,                      // fixed ttl never refreshed\n\
      \  \"last_state_write_ms_ago\": 912              // > ttl -> the smoking gun\n\
      }\n```\n\n---\n\n## 5. Fixes (in order of correctness/effort)\n\n### Option\
      \ A — Single source of truth: persist everything, use Redis as cache only *(recommended)*\n\
      Serialize the **full runtime state** to the DB (or an object store), and treat\
      \ Redis as an optional cache with a TTL longer than any acceptable resume window.\n\
      \n```python\ndef attempt_resume(session_id):\n    row = db.get_session(session_id)\
      \          # authoritative\n    if not row or row.status != \"active\":\n  \
      \      return EXPIRED\n    if _within_grace(row.expires_at):          # DB says\
      \ still valid\n        state = redis.get(f\"session:{session_id}\")\n      \
      \  if state is None:                      # cache miss -> rebuild from DB\n\
      \            state = json.loads(row.runtime_state)  # always reconstructable\n\
      \            redis.setex(f\"session:{session_id}\", CACHE_TTL, json.dumps(state))\n\
      \        return DESERIALIZE(state)\n    db.flip_to_expired(session_id)     \
      \        # reconcile\n    return EXPIRED\n```\n\nResult: Redis expiry is only\
      \ a **performance cold-start**, never a correctness break.\n\n### Option B —\
      \ Bind TTL to DB validity (sliding, DB-driven)\nRefresh TTL on every DB `last_active_at`\
      \ bump, inside the same request, and cap TTL ≤ DB grace:\n\n```python\ndef on_activity(session_id):\n\
      \    db.update_last_active(session_id, now())          # authoritative clock\n\
      \    redis.expire(f\"session:{session_id}\", RESUME_WINDOW)  # rgive-til'edyn\n\
      \    # invariant: RESUME_WINDOW <= DB remaining grace\n```\n\nStill add a DB\
      \ fallback for the residual race (Option A logic) to be safe.\n\n### Option\
      \ C — Redis persist mode (fallback not pref)\nEnable AOF (`appendonly yes`)\
      \ with write-your-own-expiry semantics if the state is *pure operational and\
      \ you accept* a restore after restart; but this **does not** fix the TTL-eviction-while-DB-valid\
      \ case — TTL in RDB/AOF is still honored. So C alone is insufficient.\n\n---\n\
      \n## 6. Configuration recommendation (Redis side)\n```conf\n# Redis\nmaxmemory-policy\
      \ noeviction      # don't evict warm sessions early under pressure\nappendonly\
      \ yes                   # survive restarts (still honors TTL on load)\n```\n\
      \nAt the app side, enforce the invariant:\n```\nRedis TTL  <=  DB remaining_validity\n\
      DB validity is the ONLY thing that authorizes \"resumable\"\nRedis MISS  → \
      \ always has a DB-backed reconstruction path\n```\n\n---\n\n## 7. Definition\
      \ of Done / Verification\n1. Write a test: create session, set TTL short, force\
      \ Redis expiry while DB stays `active`, attempt resume → must succeed via DB\
      \ rebuild (Option A) **or** DB must flip status and refuse.\n2. Assert no code\
      \ path returns a \"resume broken\" error while `db.status == 'active'`.\n3.\
      \ Pump memory pressure test with `volatile-*` policies to ensure no early eviction\
      \ of active sessions.\n\n---\n\n**Bottom line:** Continuation breaks because\
      \ Redis and DB carry *different clocks* and *different truth*, and the runtime\
      \ state exists **only** in the TTL-bound Redis key. The fix is to make the DB\
      \ the authoritative source (always reconstructable) and treat the TTL as pure\
      \ caching, or strictly couple the TTL refresh to DB validity — never a fixed\
      \ TTL independent of DB lifecycle."
