        ## 1. How state is stored today


        `InterviewStateStore` (`InterviewStateStore.java:25-51`) puts the interview''s
        runtime '
      output: "# Interview Session Continuation & Redis TTL — Debug Analysis (for\
        \ Lead Review)\n\n## 1. How state is stored today\n\n`InterviewStateStore`\
        \ (`InterviewStateStore.java:25-51`) puts the interview's runtime state in\
        \ a Redis key `interview:session:{id}` with a **fixed 24-hour TTL**, reset\
        \ to 24h on every `write()`:\n\n```java\nprivate static final long TTL_HOURS\
        \ = 24;\n... redissonClient.getBucket(key(sessionId)).set(json, TTL_HOURS,\
        \ TimeUnit.HOURS);\n```\n\nThe same fields (`status`, `questionCount`, `currentQuestionId`)\
        \ are **also** persisted in the `interview_session` DB row (MySQL, `InterviewService.java:111-114,\
        \ 183-186, 340-346`). So there are two copies of the same state machine in\
        \ two stores, and only the Redis copy carries a TTL.\n\nThe class Javadoc\
        \ declares Redis the **\"单一权威来源 / single source of truth\"** for the state\
        \ machine, even though the DB legitimately holds the identical fields. That\
        \ contradiction is the root of the problem.\n\n## 2. When continuation breaks\n\
        \n### 2.1 Hard break — Redis authoritative, key silently gone (the declared\
        \ design)\nUnder the stated design (Redis = source of truth), a silently expired\
        \ key means `read()` returns `null` and the flow that trusts Redis has **nothing\
        \ to reconstruct the state from**:\n- `InterviewStateStore.read` returns `null`\n\
        - `requireAsking()`/`detail()`/the state check then has no place to read `status/questionCount/currentQuestionId`\n\
        - Continuation throws (here: `INTERVIEW_STATE_ERROR` / fails), even though\
        \ the DB row is still `ASKING` and perfectly valid.\n\nThe DB being valid\
        \ is exactly the trap: the durable truth exists, but the entry point to resume\
        \ the session was tied to a volatile key with a short, fixed lifetime.\n\n\
        ### 2.2 Stale-but-not-null — the subtle continuation corruption (present in\
        \ current code)\n`requireAsking` (`InterviewService.java:380-399`) added a\
        \ null-fallback that hides most expirations: if Redis returns `null`, it rebuilds\
        \ from the DB row and re-writes Redis. **This closes the \"expired\" hole\
        \ almost fully.** That is good — but it introduces a *worse* window. Look\
        \ at `answer()`:\n\n```java\nint newCount = state.questionCount() + 1;   \
        \       // trusts Redis count\n...\nsession.setQuestionCount(newCount);  \
        \                // overwrites DB\nsessionMapper.updateById(session);\nstateStore.write(sessionId,\
        \ ...);                    // DB-commit then Redis-write\n```\n\nThe DB and\
        \ Redis copies are updated **non-atomically**: DB writes happen first, then\
        \ `stateStore.write`. There is no transaction spanning both (no XA), so a\
        \ crash/pod-kill/idle between those two lines leaves:\n\n- **DB**: `questionCount=4`,\
        \ `currentQuestionId=Q4` (ahead)\n- **Redis**: `questionCount=3`, `currentQuestionId=Q3`\
        \ (stale, and **not null**)\n\nNow the next `answer()`:\n- `requireAsking`\
        \ reads Redis → **non-null** → the DB rehydrate branch is *skipped* (that\
        \ branch fires only on `null`)\n- `newCount = 3 + 1 = 4` computed from **stale**\
        \ Redis\n- A new question is inserted, DB `question_count` is clobbered back\
        \ to `4` (but there are now 5 questions / the message log says otherwise)\n\
        \nResult: the counter silently diverges from the actual message log. This\
        \ is **silent**, does not throw, and is worse than a clean \"expired\" failure\
        \ because operators/users see a plausible-but-wrong `questionCount`. The null-check\
        \ masks the divergence instead of detecting it.\n\n### 2.3 TTL approaches\
        \ may not survive active sessions\n- Here TTL is a **sliding** 24h (re-set\
        \ on each `write`), so an *actively* used session resets 24h each turn and\
        \ is fine. Continuation only hinges on TTL when a session is idle for >24h\
        \ — at which point §2.1's fallback usually recovers.\n- But a **fixed/absolute**\
        \ TTL (set only at create, e.g. `create()`) would kill an *active* long interview\
        \ regardless of traffic. If any consumer configures TTL as set-on-create,\
        \ that is a live break.\n- Any TTL is compounded by eviction: `docker-compose.yml`\
        \ runs `redis:7-alpine` with **no `maxmemory`/eviction policy** (default `noeviction`),\
        \ so under memory pressure, or with AOF/RDB flushes/persistence gaps on restart,\
        \ keys can be dropped **before TTL** while the DB remains valid. The TTL is\
        \ not the only way the key vanishes.\n\n### 2.4 Where it breaks vs. where\
        \ it is safe (computed from this code)\n| Scenario | Redis | Outcome |\n|---|---|---|\n\
        | Idle >24h, then `answer()` | expired (`null`) | **Recovered** by DB rehydrate\
        \ in `requireAsking` |\n| Crash between DB-commit and Redis-write | stale\
        \ non-null | **Silent corruption** of `questionCount` (§2.2) |\n| Redis restart\
        \ w/o persisted keys | missing (`null`) | **Recovered** by rehydrate |\n|\
        \ Redis evicted before TTL | missing (`null`) | **Recovered** by rehydrate\
        \ |\n| TTL configured as fixed-from-create | expired mid-session | **Hard\
        \ break** if that flavor is used |\n\nNet: current code is *mostly* protected\
        \ by the `requireAsking` fallback; the genuinely dangerous remaining defect\
        \ is the **stale-non-null divergence** (§2.2), plus the architectural fragility\
        \ of declaring a volatile cache the source of truth (§2.1), which any future\
        \ refactor can reintroduce.\n\n## 3. Root cause\n\n1. **Two sources of truth**\
        \ with the same fields; Redis labelled authoritative but only it carries a\
        \ TTL.\n2. **Non-atomic write ordering** (DB commit then Redis write) with\
        \ no reconciliation.\n3. **Null-only fallback** — reconciliation keys off\
        \ `null`, so it cannot detect *stale* (non-null) divergence, only *missing*.\n\
        4. **Fixed/short TTL treated as data lifecycle** instead of a cache invalidation\
        \ hint; eviction and restart semantics ignored.\n\n## 4. Recommendations (backed\
        \ by code)\n\n### 4.1 Make MySQL the single source of truth; Redis a refreshable\
        \ cache\nRedis already duplicates the DB row — stop pretending it is authoritative.\
        \ The DB `interview_session` row is the durable truth. Redis should be a fast\
        \ read path only, with **DB row always used to reconcile**.\n\nImplementation\
        \ — reconcile on *every* read, not just on `null`:\n\n```java\npublic SessionState\
        \ read(Long sessionId) {\n    String json = redissonClient.getBucket(key(sessionId)).get();\n\
        \    SessionState cached = tryParse(json);\n    InterviewSession row = sessionMapper.selectById(sessionId);\n\
        \    if (row == null) return cached;\n    SessionState db = new SessionState(row.getStatus(),\
        \ row.getQuestionCount(), row.getCurrentQuestionId());\n    if (cached ==\
        \ null || !db.equals(cached)) {\n        write(sessionId, db);   // repair\
        \ stale/missing cache from DB truth\n        return db;\n    }\n    return\
        \ cached;\n}\n```\n\nThis kills both §2.1 and §2.2: stale-non-null now heals\
        \ back to DB truth instead of feeding wrong counts downstream.\n\n### 4.2\
        \ Make the transition write atomic-in-logic\nCompute `newCount` from **DB/message\
        \ truth**, not from the Redis cache. The message `id`/log is the true count\
        \ source:\n\n```java\n// answer(): derive authoritative count from the persisted\
        \ message log\nlong authoritativeCount = messageMapper.selectCount(\n    new\
        \ LambdaQueryWrapper<InterviewMessage>()\n        .eq(InterviewMessage::getSessionId,\
        \ sessionId)\n        .eq(InterviewMessage::getKind, \"question\"));\nint\
        \ newCount = (int) authoritativeCount + 1;   // NOT state.questionCount()\
        \ + 1\n```\n\nNow a stale cache cannot corrupt the count.\n\n### 4.3 Fix the\
        \ write-permutation failure\nPerform the DB update as the commit point, then\
        \ write Redis, and add a lightweight **reconciliation job** that periodically\
        \ pushes DB → Redis for sessions in `ASKING`/`START`, so any lost Redis write\
        \ self-heals:\n\n```java\n@Scheduled(fixedDelay = 30_000)\npublic void reconcile()\
        \ {\n    sessionMapper.selectList(\n        new LambdaQueryWrapper<InterviewSession>()\n\
        \            .in(InterviewSession::getStatus, InterviewStatus.START.name(),\
        \ InterviewStatus.ASKING.name()))\n        .forEach(s -> stateStore.write(s.getId(),\n\
        \            new SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId())));\n\
        }\n```\n\n### 4.4 Change TTL semantics (config)\n- Keep a **sliding** TTL,\
        \ but refresh on read as well as write (`touch`/`expire`), so long-but-active\
        \ sessions are never at risk.\n- Make the TTL a generous upper bound (e.g.\
        \ 24–48h) and treat it as a *cache* bound, never as business lifecycle. Session\
        \ lifecycle should come only from the DB `status`.\n- If key expiry must also\
        \ invalidate anything else, use Redis **keyspace notifications (`notify-keyspace-events\
        \ Ex`)** or the reconciliation job — do not bake cross-store logic into a\
        \ bare TTL.\n\nRedis/Docker hygiene (`docker-compose.yml`): pin `maxmemory`\
        \ + `maxmemory-policy volatile-ttl` so eviction prefers the short-TTL session\
        \ cache and does not drop other data unexpectedly; enable AOF (`appendonly\
        \ yes`) so a restart does not wipe the cache and force a thundering rehydrate.\n\
        \n### 4.5 Test the exact scenarios\nAdd tests/verification for: (a) `DEL interview:session:{id}`\
        \ while DB is `ASKING` → `answer()` must rehydrate and not corrupt `questionCount`;\
        \ (b) simulate stale cache (Redis `questionCount` one behind DB) → next `answer()`\
        \ must yield DB-true count; (c) Redis restart mid-session → continuation works;\
        \ (d) idling past TTL → resume works.\n\n## 5. Summary for the lead\n- The\
        \ visible, documented break (Redis authoritative + silent TTL expiry) is **latent**,\
        \ not active, because `requireAsking` rehydrates from MySQL on `null`.\n-\
        \ The **real active defect is the stale-non-null window**: non-atomic DB-then-Redis\
        \ writes can leave Redis one step behind while non-null, silently corrupting\
        \ `questionCount`. Fix by (1) reconciling on every read against the DB row,\
        \ (2) deriving counts from the message log, and (3) adding a reconciliation\
        \ scheduled task.\n- Treat Redis as a cache, MySQL as source of truth; make\
        \ TTL a generous sliding cache bound plus proper Redis eviction/AOF config."
