      output: "# Contribution: Redis Session Runtime State & Fixed TTL — When & Why\
        \ Continuation Breaks\n\n## 1. The Core Problem (Divergence of Two State Layers)\n\
        \nYou're maintaining **two state stores with opposite lifecycles**:\n\n| Layer\
        \ | Lifecycle | Invalidation trigger |\n|-------|-----------|---------------------|\n\
        | **DB (persistent)** | Permanent until explicitly archived | No time-based\
        \ expiry |\n| **Redis (runtime)** | Bounded by `TTL` | Silent background eviction\
        \ |\n\nThe failure mode is a **state staleness skew**: Redis forgets the session\
        \ while the DB still considers it valid. `continuation` (resume/restore of\
        \ an in-progress interview) then fails at the \"restore runtime context\"\
        \ step, not the \"authorize user\" step — because authorization reads the\
        \ DB (valid), but the orchestration context reads Redis (absent).\n\n## 2.\
        \ When It Breaks (Exact Timings)\n\nGiven fixed TTL = `T`, set at session\
        \ creation `t0`, the critical window opens at **`t0 + T`**.\n\nContinuation\
        \ breaks **whenever both hold simultaneously**:\n\n1. `now - t0 > T` — the\
        \ fixed TTL has fully elapsed with **zero re-extension**.\n2. The resume attempt\
        \ requires Redis-resident runtime state (mid-question progress, token stream\
        \ position, partial answers, per-step audit markers) that was **not** flushed\
        \ to the DB.\n\nIt does **not** break when:\n- The user resumes before `t0\
        \ + T` (Redis hit → fast path works).\n- The design **persists all progress\
        \ to DB** and treats Redis purely as a cache (Redis miss → reconstruct from\
        \ DB → correct, just slower).\n\n## 3. Why It Breaks Silently\n\n### 3.1 Fixed\
        \ TTL ≠ Sliding TTL\nA **fixed** TTL is stamped once at write. Even if the\
        \ user is *actively engaged* at `t0 + T - 1`, the key vanishes one second\
        \ later. There is **no activity-based renewal**. Redis does not re-`EXPIRE`\
        \ on `GET` — only on `SET`/write. This is the single largest design trap:\
        \ a \"session timeout\" is implemented with a fixed `EXPIRE`, when the user's\
        \ mental model expects sliding (idle) semantics.\n\n### 3.2 Read-scoped vs\
        \ Write-scoped renewal bug\nCommon bug:\n```\n// BUG: read does not extend;\
        \ DB still valid, Redis gone\nctx = GET interview:{id}:ctx            # no\
        \ EXPIRE callback\nif ctx is None: raise ContinuationError # DB row still\
        \ says \"in progress\"\n```\nCorrect pattern — renew on every access (slide\
        \ the TTL):\n```\nctx = GET interview:{id}:ctx\nif ctx is not None:\n    SETEX\
        \ interview:{id}:ctx TTL ctx    # or EXPIRE key TTL — re-arms the clock\n\
        ```\n\n### 3.3 Eviction policy & memory pressure\nEven before TTL elapses,\
        \ under `volatile-lru`/`volatile-ttl` `maxmemory-policy`, Redis can evict\
        \ **any** volatile key early — including yours — because an *outlier long-lived*\
        \ item with a large TTL is a prime eviction victim. Check `CONFIG GET maxmemory-policy`.\
        \ If it is `allkeys-*`, **even non-expiring keys** (those you intended to\
        \ persist) can be dropped → partial state loss with no expiry at all.\n\n\
        ### 3.4 Node failover / restart\nTTLs are **not persisted across RDB/AOF restore\
        \ consistently with the DB's timeline**. After a restart the runtime keys\
        \ may be gone (no AOF) while DB records survive → identical \"DB valid, session\
        \ gone\" skew.\n\n### 3.5 Clock/serialization assumptions\nIf the stored value\
        \ embeds an absolute deadline (`expires_at`) with DB-computed time but you\
        \ compare against Redis TTL, a restart or clock drift can make the two disagree.\n\
        \n## 4. Concrete Continuation-Break Scenarios\n\n| Scenario | DB state | Redis\
        \ state | Result |\n|----------|----------|-------------|--------|\n| User\
        \ idles 45 min on a 30-min fixed TTL | in_progress | expired | Continue raises\
        \ \"session expired\" |\n| Active user at `T-1s`, fixed TTL ticks | in_progress\
        \ | expired | Mid-question answer lost |\n| Redis restarted (no AOF) | in_progress\
        \ | empty | Continue cannot restore position |\n| `maxmemory=allkeys-lru`\
        \ pressure | in_progress | evicted early | Resume fails even below TTL |\n\
        \n## 5. Recommendations\n\n**A. Choose the right expiry semantics per data\
        \ class**\n- Idle-timeout role tokens / OTPs → **sliding TTL**, renewed on\
        \ every read/write (see §3.2).\n- Long interviews → **re-think Redis as cache,\
        \ DB as source of truth**.\n\n**B. Make Redis disposable; DB authoritative\
        \ (recommended default)**\nPersist a compact *resume checkpoint* in the DB\
        \ on every meaningful step (question answered, position advanced), and treat\
        \ Redis as an acceleration cache reconstructible from DB:\n```\nheader = DB.get_resume_header(id)\
        \          # DB authoritative, no TTL\nif Redis.exists(key):\n    ctx = Redis.get(key)\
        \                    # fast path\nelse:\n    ctx = rebuild_from_db(header)\
        \           # slow path — always correct\n    Redis.setex(key, TTL, ctx) \
        \             # rehydrate\n```\nThis **turns a hard failure into a soft performance\
        \ fallback**. Continuation never breaks; it only occasionally re-warms.\n\n\
        **C. If you must keep Redis authoritative, slide the TTL**\nGuarantee every\
        \ read/write path calls `EXPIRE key TTL`, transforming the \"fixed\" TTL into\
        \ an idle window. Wrap in a single helper so no caller forgets:\n```\ndef\
        \ touch(key, ttl):\n    client.expire(key, ttl)\n```\n\n**D. Use a robust\
        \ DB-side \"last_active\" + Redis sleep wakeup, not TTL as the deadline**\n\
        - Store `last_active_at` in DB, updated transactionally with each update.\n\
        - Decide liveness from **DB** (`now - last_active_at > IDLE_LIMIT`), not from\
        \ the presence of the Redis key.\n- Let Redis keys be short-lived cache; never\
        \ gate continuation purely on their existence.\n\n**E. Harden against silent\
        \ loss**\n- `maxmemory-policy volatile-lfu` (least-frequently-used eviction)\
        \ instead of `allkeys-*`.\n- Enable AOF (`appendonly yes`, `appendfsync everysec`)\
        \ so runtime keys survive restarts.\n- Add a background reconciliation job:\
        \ DB rows marked `in_progress` whose checkpoint is missing in Redis → **rehydrate\
        \ from DB**, don't fail the user.\n- On continuation, distinguish two errors\
        \ to the client: `CONTINUE_REBUILT` vs `CONTINUE_LOST` (genuinely unrecoverable,\
        \ e.g. checkpoint never flushed).\n\n**F. Never trust TTL > DB for \"validity\"\
        \ checks**\nMake the canonical \"is this session alive\" check read the DB\
        \ (idempotent, monotonic, survives eviction). TTL only governs ephemeral/security\
        \ data.\n\n## 6. Verification checklist for the lead\n- [ ] Confirm Redis\
        \ `maxmemory-policy` (must not be `allkeys-*`).\n- [ ] Confirm whether TTL\
        \ is fixed-at-write or re-armed on access.\n- [ ] Confirm continuation reads\
        \ source of truth from DB, not Redis.\n- [ ] Confirm every progress step flushes\
        \ a DB checkpoint (so rebuild is possible).\n- [ ] Confirm AOF enabled for\
        \ runtime state persistence.\n- [ ] Log-based reconciliation test: expire\
        \ key manually, resume — expect rebuild, not error.\n\n**Summary:** Continuation\
        \ breaks at *exact* fixed-TTL expiry or earlier under eviction/restart, whenever\
        \ Redis holds runtime state that was never flushed to the DB. The durable\
        \ fix is to invert the dependency — **DB owns truth, Redis is a rebuildable\
        \ cache with sliding-TTL acceleration** — which converts the silent hard failure\
        \ into an idempotent soft fallback."
