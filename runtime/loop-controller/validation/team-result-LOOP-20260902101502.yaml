    output: "# Redis TTL Expiry vs Valid DB — Continuation Break Analysis\n\n**Role:**\
      \ Database Engineer (Lead, team-18087af2) · **Domain:** database / ai · **Task:**\
      \ debug\n\n---\n\n## 1. Architecture Model (the root of the mismatch)\n\nAn\
      \ interview session uses **two tiers of state**:\n\n| Tier | Store | Lifetime\
      \ | What it holds |\n|------|-------|----------|---------------|\n| Ephemeral\
      \ **runtime** state | Redis (key with fixed TTL) | Short (e.g. 30 min), **self-expiring**\
      \ | In-progress LLM context, partial transcript, token budget, UI cursor, distributed\
      \ lock, idempotency key |\n| Durable **source-of-truth** state | Relational/NoSQL\
      \ DB | Persistent, **no expiry** | Session record, submitted answers, \"verified\
      \ valid\" status |\n\nContinuation = \"user returns after a gap and the system\
      \ resumes at the exact in-progress point.\" It depends on the **ephemeral**\
      \ tier. The DB says *\"this session exists and is valid,\"* so the app route\
      \ is reachable — but the Redis key that actually holds the resumable work is\
      \ gone. That duality is the seed of the bug.\n\n```\nresume(session_id):\n \
      \   DB row exists & status='in_progress'  →  OK, continuation allowed\n    Redis\
      \ key session:{id} MISS            →  runtime state lost\n    ──> cannot actually\
      \ resume → BROKEN\n```\n\n---\n\n## 2. When Continuation Breaks (concrete triggers)\n\
      \nContinuation fails in any scenario where **the DB remains valid but the Redis\
      \ TTL expires (or the key disappears)** while the session is still meant to\
      \ be alive.\n\n1. **Long-running async pipeline outlives the TTL** (most important\
      \ in an AI context).\n   An async job (LLM generation, summarization, transcription)\
      \ holds the only thread that refreshes the session TTL. If generation runs longer\
      \ than the TTL and the refresh happens **after** completion, the key expires\
      \ mid-job. DB record is untouched/valid; Redis runtime state is gone. Continuation/user-visible\
      \ status is lost.\n\n2. **Fixed (non-sliding) TTL vs. variable user activity\
      \ gaps.**\n   TTL is set once (or refreshed on a coarse cadence). A \"drafted\
      \ answers\" activity updates the DB (durable tier) but never touches Redis.\
      \ The quiet gap between two actions exceeds the fixed TTL → key dies even though\
      \ the user was actively engaged in the DB.\n\n3. **DB write succeeds, Redis\
      \ refresh fails (partial failure across two systems).**\n   The workflow is:\
      \ `persist(DB)` then `extend_ttl(Redis)`. If Redis is briefly unreachable, or\
      \ a Redis **failover / restart / eviction** occurs after the DB commit but before/without\
      \ the TTL refresh, the durable tier is ahead of the ephemeral tier. DB valid,\
      \ Redis empty. This is an atomicity gap between two stores.\n\n4. **Redis eviction\
      \ under memory pressure.**\n   With an eviction policy like `allkeys-lru`/`volatile-lru`,\
      \ Redis may evict the session key **before its TTL** fires, while the DB (unbounded\
      \ by memory) still holds the valid record.\n\n5. **Redis persistence loss /\
      \ restart.**\n   Key was written but:\n   - no `save`/`appendonly` configured,\
      \ or\n   - AOF/RDB lag > session lifetime, or\n   - `maxmemory-policy` noeviction\
      \ flipped / crash between snapshot intervals.\n   After restart the key is absent;\
      \ the DB was never affected. DB says valid, Redis says nothing.\n\n6. **Distributed\
      \ lock expiry (concurrency blow-up).**\n   If the session **lock** is itself\
      \ a Redis key with a fixed TTL shorter than the task, the lock expires while\
      \ the task still runs (`redlock`-style renewal failure). A second worker acquires\
      \ the lock and starts a **duplicate** concurrent write — logically corrupting\
      \ the durable record, or triggering double LLM charging and double-append. The\
      \ DB may end up valid-looking but internally duplicate.\n\n---\n\n## 3. Why\
      \ It Breaks (root causes)\n\n1. **Two independent time models with no shared\
      \ freshness contract.** The DB's validity signal (a column/timestamp) and Redis's\
      \ validity signal (TTL) drift independently. Nothing enforces *\"DB in_progress\
      \ ⟺ Redis key alive.\"*\n\n2. **Non-atomic dual-write.** Updating durable +\
      \ ephemeral state is done in two operations with no transaction, no outbox,\
      \ no reconciliation → they converge to inconsistent states on any partial failure.\n\
      \n3. **TTL is a liveness proxy, not a state machine.** A fixed/absolute expiry\
      \ is a *crude* proxy for \"session should still exist.\" It cannot distinguish\
      \ \"user walked away (ok to expire)\" from \"task in flight (must not expire).\"\
      \ Anything that maps a real workload onto a single constant is a heuristic that\
      \ will misfire.\n\n4. **Reconstruction is not lossless.** On a Redis miss, the\
      \ typical fallback is \"rebuild state from DB.\" But the DB intentionally stores\
      \ only durable/authoritative data — it does **not** contain the ephemeral in-progress\
      \ bits (partial LLM context, cursor position, unlocked scratch state). So the\
      \ rebuild produces a *different, degraded* session → continuation is \"technically\
      \ possible but not actually equivalent.\"\n\n5. **Guard/lock TTLs smaller than\
      \ the jobs they guard.** Fixed short TTLs are chosen to avoid leaks, but they\
      \ can be shorter than the actual dispatch+processing time.\n\n---\n\n## 4. Mitigations\
      \ & Recommendations\n\n### A. Sliding TTL refresh (refresh on *every* touch,\
      \ not a fixed clock) — Python/Redis\n```python\nimport redis, time\nr = redis.Redis(...)\n\
      \ndef touch_session(sid: str, ttl_seconds: int = 1800):\n    # Sliding expiry:\
      \ every interaction resets the clock.\n    # Use a pipeline so DB-valid + refresh\
      \ is best-effort atomic on read path.\n    r.expire(f\"session:{sid}\", ttl_seconds)\n\
      \n# Refresh BEFORE starting, DURING (heartbeat), and AFTER long LLM work:\n\
      def resume(sid: str, ttl_seconds=1800):\n    if not r.exists(f\"session:{sid}\"\
      ):\n        return rebuild_from_db(sid)      # graceful degradation, see E\n\
      \    touch_session(sid, ttl_seconds)\n\nasync def run_llm_step(sid, ttl_seconds=1800):\n\
      \    async def heartbeat():\n        while not done:\n            r.expire(f\"\
      session:{sid}\", ttl_seconds)\n            await asyncio.sleep(ttl_seconds //\
      \ 2)\n    # heartbeat guarantees expiry is refreshed during >TTL generations\n\
      ```\n\n**Why slide:** a *sliding* TTL that is refreshed on every read/write\
      \ + a background heartbeat during long async steps only expires when the session\
      \ is *actually* idle for the full window — far fewer false expiries than a fixed\
      \ TTL.\n\n### B. Renew the lock during the guarded task (not fixed TTL)\n```python\n\
      import threading, time, redis\nr = redis.Redis(...)\nLOCK_KEY = f\"session:{sid}:lock\"\
      \nLOCK_TTL = 60\n\nok = r.set(LOCK_KEY, worker_id, nx=True, ex=LOCK_TTL)\nif\
      \ not ok:\n    raise AlreadyProcessing()\n\nstop = threading.Event()\ndef renew():\n\
      \    while not stop.is_set():\n        if r.ttl(LOCK_KEY) < LOCK_TTL * 0.6:\
      \      # proactive renewal\n            r.expire(LOCK_KEY, LOCK_TTL)\n     \
      \   time.sleep(LOCK_TTL * 0.2)\n\nt = threading.Thread(target=renew, daemon=True);\
      \ t.start()\ntry:\n    do_long_llm_work(sid)\nfinally:\n    stop.set()\n   \
      \ if int(r.get(LOCK_KEY) or 0) == worker_id:\n        r.delete(LOCK_KEY)   \
      \                       # release only if still ours\n```\n\n### C. Reconciliation\
      \ / fail-close on resume\nMake the resume route decide based on BOTH tiers,\
      \ and treat \"Redis miss while DB valid\" as a **detectable anomaly**, not a\
      \ silent empty session:\n\n```python\ndef resume(sid: str):\n    db_row = db.get_session(sid)\n\
      \    if not db_row:\n        return 404\n\n    state = r.get(f\"session:{sid}\"\
      )\n    if state is None:\n        # DB valid but hot state is gone → this is\
      \ exactly the bug.\n        # Options: (1) rebuild + log; (2) mark session as\
      \ interrupted and\n        #          prompt user to continue/re-do; (3) fail-closed.\n\
      \        log.warning(\"session %s DB-valid but Redis state expired\", sid)\n\
      \        restored = rebuild_from_db(db_row)   # lossy, see E\n        if restored.is_equilivant():\n\
      \            r.set(f\"session:{sid}\", restored, ex=TTL)\n            return\
      \ resume(sid)\n        return abort_or_prompt(sid)\n    return hydrate(state)\n\
      ```\n\n### D. Redis durability / eviction config (protects against 4 & 5)\n\
      ```conf\n# redis.conf\nsave 900 1          # avoid data-loss window on restart\n\
      appendonly yes      # AOF so recent key writes survive restart\nappendfsync\
      \ everysec\n\nmaxmemory 1gb\nmaxmemory-policy volatile-ttl   # prefer evicting\
      \ short-lived TTL keys,\n                                # but ALWAYS log when\
      \ session keys get evicted\n```\nAdd a notification/listener on `evicted` or\
      \ key-expiry events (`keyspace notifications`) to detect the exact failure mode\
      \ and trigger a rebuild:\n```conf\nnotify-keyspace-events ExK     # expire +\
      \ evict events\n```\n```python\nps = r.pubsub()\nps.psubscribe(\"__keyevent@0__:expired\"\
      , \"__keyevent@0__:evicted\")\nfor msg in ps.listen():\n    if msg[\"data\"\
      ].startswith(\"session:\"):\n        sid = msg[\"data\"]\n        if db.get_session(sid):\
      \   # DB still valid → schedule async rebuild\n            enqueue_rebuild(sid)\n\
      ```\n\n### E. Make rebuild lossless (design constraint, not just code)\nTo let\
      \ continuation actually survive a Redis loss, the persistent tier **must** hold\
      \ enough to reconstruct *equivalent* runtime state — but that defeats the reason\
      \ for a cheap ephemeral tier. Recommended split:\n- Persist **checkpoint** snapshots\
      \ of the interview state (LLM context *at resumable points*, submitted answer\
      \ ids, cursor) in the DB **periodically and at the end of each atomic step**.\n\
      - Keep only truly transient data (in-flight token stream, ephemeral locks) in\
      \ Redis.\nThen a Redis miss rebuilds to the **last checkpoint**, which is the\
      \ last *equivalent* continuation point — never further back than the last committed\
      \ answer.\n\n### F. If two stores can't be kept consistent, collapse the source\
      \ of truth\nFor correctness-critical paths, treat the **DB as the only source\
      \ of truth** for resumability (write the status there transactionally) and treat\
      \ Redis as a disposable cache whose TTL only controls efficiency, never correctness.\
      \ Continuation is then DB-driven; Redis loss just means a rebuild (E), never\
      \ a broken session.\n\n---\n\n## 5. Summary\n\n**When it breaks:** fixed TTL\
      \ expiry (or eviction / persistence loss / lock expiry) of the Redis runtime\
      \ key while the durable DB session stays valid — most sharply under (1) long\
      \ async LLM jobs > TTL, (2) activity gaps with non-sliding TTL, (3) non-atomic\
      \ DB-write + Redis-refresh, and (4) Redis memory-pressure/restart.\n\n**Why:**\
      \ the Redis TTL is a fragile stand-in for session liveness, disconnected from\
      \ the DB's independent \"valid\" signal; the dual write is non-transactional;\
      \ rebuilding from the DB is lossy because in-progress state lives only in Redis.\n\
      \n**Fix:** sliding TTL + heartbeats during long steps, lock renewal, per-step\
      \ DB checkpoints for lossless rebuild, keyspace-expi/evict event listeners that\
      \ trigger rebuild-on-DB-valid, and — where possible — making the DB the sole\
      \ arbiter of resumability with Redis as a disposable cache.\n\nThis was produced\
      \ as the lead output for team-18087af2 (no support-agent findings were waiting\
      \ to be folded in beyond the role's own analysis)."
