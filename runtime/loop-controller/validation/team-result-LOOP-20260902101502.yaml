    output:
      agent: prompt-engineer
      status: completed
      summary: '# Interview Session Continuation vs. Fixed Redis TTL — Root Cause
        & Design


        ## 1. The core inconsistency


        Redis holds the **hot runtime state** (fast, authoritative-*during* a session),
        the DB holds t'
      output: "# Interview Session Continuation vs. Fixed Redis TTL — Root Cause &\
        \ Design\n\n## 1. The core inconsistency\n\nRedis holds the **hot runtime\
        \ state** (fast, authoritative-*during* a session), the DB holds the **durable\
        \ source of truth** (slow, authoritative-*forever*). A **fixed absolute TTL**\
        \ cuts the Redis record at a wall-clock deadline that ignores actual activity.\
        \ The danger is not the expiry itself — it is that the **client treats a Redis\
        \ cache-miss as a lost session**, and can silently do so while the DB row\
        \ is perfectly valid.\n\n| Dimension | Redis (runtime) | DB (source of truth)\
        \ |\n|---|---|---|\n| Freshness | milliseconds | seconds–minutes behind (flush\
        \ cadence) |\n| Lifetime | fixed TTL → dies at deadline | lives until archived\
        \ |\n| Guarantee | LAPSE = `(nil)` | durable row + `updated_at` |\n| Cost\
        \ of miss | indistinguishable from \"never existed\" | can be re-queried |\n\
        \n## 2. When continuation breaks (exact conditions)\n\nContinuation fails\
        \ when **wall-clock time spent without a touch ≥ remaining TTL**, regardless\
        \ of whether the session is logically alive:\n\n1. **Idle-while-thinking**\
        \ — fixed TTL set at creation (`SETEX key 3600`). A candidate spending >TTL\
        \ composing a long answer / stuck on a shared codepad / blocked in a tool\
        \ → mid-thought expiry. DB row is fresh; Redis is gone.\n2. **Read gap after\
        \ last write** — TTL is absolute-from-last-set, not from-now. If the server\
        \ never refreshes on access, the key dies at creation+TTL even during active\
        \ polling.\n3. **Node-local stale replica** — each BFF/worker keeps an in-memory\
        \ cache. Central Redis key expires; a node that still holds a local snapshot\
        \ now serves a **ghost** — reads appear fine but any `PEXPIRE`/compare against\
        \ Redis diverges.\n4. **Version/sequence break on the next DB write** — runtime\
        \ state (e.g. an `RPUSH` answer list) is truncated by the kill. The DB has\
        \ the canonical row, but optimistic-lock `version` no longer matches the truncated\
        \ runtime state → next flush fails.\n5. **Memory-pressure eviction before\
        \ TTL** — `maxmemory-policy allkeys-lru/lfu` silently drops session keys *earlier*\
        \ than TTL under pressure. Silent = no log, no error.\n\n## 3. Why it is *silent*\
        \ (the real trap)\n\nA missing Redis key returns `(nil)` — identical to a\
        \ key that never existed. If the code does:\n```python\nseries = redis.get(key(session))\n\
        if not series:  # conflates \"expired\" and \"never existed\"\n    start_new_session()\n\
        ```\nyou silently **create a duplicate/new session**, discarding in-progress\
        \ answers the moment the cache lapses. Without `DB.updated_at` vs `Redis.expires_at`\
        \ asymmetry logging, there is no signal that a session was legitimate and\
        \ dropped.\n\n## 4. Fixes\n\n### 4.1 Sliding TTL (primary) — renew on every\
        \ touch, not at creation\n```python\nTTL_MS = 30 * 60 * 1000\n\ndef get_session(sid):\n\
        \    raw = redis.get(key(sid))\n    if raw:\n        redis.pexpire(key(sid),\
        \ TTL_MS)   # sliding renewal on ACCESS\n        return deserialize(raw)\n\
        \    return None   # caller falls through to DB\n\ndef append_fact(sid, msg):\n\
        \    redis.rpush(key(sid), serialize(msg))\n    redis.pexpire(key(sid), TTL_MS)\
        \       # renew on WRITE too\n    db.flush_async(sid, msg)              #\
        \ durability → reaches DB\n```\nOn Alibaba/QQRedis use the native `RENEW`\
        \ to bump TTL without a get/set round-trip.\n\n### 4.2 Graceful demotion on\
        \ cache miss — treat miss as \"reload\", never as \"new\"\n```python\ndef\
        \ load_session(sid):\n    r = get_session(sid)\n    if r: return r\n    row\
        \ = db.load_session(sid)            # row may still be valid\n    if row:\n\
        \        redis.setex(key(sid), TTL_S, serialize(row))  # re-seed w/ fresh\
        \ TTL\n        return row\n    raise SessionExpired()                # only\
        \ true when DB also gone\n```\nThis inverts the failure: Redis expiry becomes\
        \ a **warm-up, not a wipe**, as long as the DB flush cadence is tighter than\
        \ the TTL window.\n\n### 4.3 Make the DB flush cadence < TTL (provable bound)\n\
        Continuation is only safe if: `flush_interval(sid) < TTL`. Persist per-question\
        \ / per-answer, not per-session-end, so a cache lapse loses at most the in-flight\
        \ delta and that delta is recoverable/re-promptable.\n\n### 4.4 Redis configuration\n\
        ```conf\nmaxmemory-policy volatile-lru   # or noeviction + rely on TTL only\n\
        appendonly yes\nappendfsync everysec\nnotify-keyspace-events Ex       # emit/alert\
        \ on key expiry\nactivedefrag yes                 # avoid memory pressure\
        \ evicting sessions\n```\n`noeviction` guarantees TTL is the *only* expiry\
        \ path (predictable), at the cost of capacity risk — pair it with `activedefrag`\
        \ + alerting instead of LRU which silently shortens lifetimes.\n\n### 4.5\
        \ Detection / observability (kills the \"silent\" part)\n- Log asymmetry:\
        \ alert when `DB.updated_at > Redis.last_touch + TTL` → session died client-side\
        \ while DB valid = SLA breach.\n- Monitor keyspace misses/hits; graph ratio\
        \ of Redis misses vs `SELECT WHERE updated_at > now()-window` DB hits.\n-\
        \ On expiry (`notify-keyspace-events Ex`), enqueue a reconciliation job that\
        \ re-materializes from DB rather than dropping state.\n\n## 5. When it is\
