      output: "## Code Review — Interview Session Redis TTL Explicit Expiry\n\n**Scope\
        \ reviewed:** `InterviewStateStore.java`, `InterviewService.java`, `InterviewStatus.java`,\
        \ `ResultCode.java`, `application.yml`\n**Role focus:** state durability /\
        \ correctness of the \"single source of truth\" claim + DB/Redis divergence\
        \ under TTL.\n\n---\n\n### 1) Root cause of the silent expiry\n\n- `InterviewStateStore.TTL_HOURS\
        \ = 24` (InterviewStateStore.java:25), applied on every `write()` via `set(key,\
        \ json, 24h)` (InterviewStateStore.java:51).\n- The key is a **fixed-TTL,\
        \ activity-renewed** key: each action bumps it back to exactly 24h. It is\
        \ **not** a session deadline — it silently vanishes after 24h of *inactivity*.\n\
        - The class contract claims Redis represents \"状态机的单一权威来源\" (single authoritative\
        \ source) (line 15). **That claim is false by construction** — the authoritative\
        \ source is volatile. When the key expires, the system has no in-Redis signal\
        \ at all; there is no tombstone, no `expiredAt` event, and nothing distinguishes\
        \ \"never started\" from \"expired mid-flight.\"\n\n### 2) When continuation\
        \ actually breaks\n\nThe *direct* call paths (`answer` / `answerStream`) look\
        \ like they self-heal via the fallback in `requireAsking` (InterviewService.java:380-399):\
        \ `read()` returns `null` → rebuild from DB → re-write. So the happy resume\
        \ path is partially protected. The breaks are the **edges that fallback does\
        \ not and cannot cover:**\n\n**A. Idle mid-session > 24h (the headline case).**\n\
        User answers Q4, gets Q5, walks away for 24h+, then resumes:\n- TTL fires,\
        \ `interview:session:{id}` is gone while the DB row stays `ASKING` (valid).\n\
        - Resume *silently rebuilds* from DB at line 387-389. This only \"works\"\
        \ because DB happens to mirror the last committed count/currentQuestionId.\
        \ The loss is **unlogged** (no `warn`), so ops has zero visibility that authoritative\
        \ state evaporated. The continuation is not robust — it is *best-effort guessing*\
        \ from a DB that was never the authority.\n\n**B. Non-idempotent state mutation\
        \ after rebuild.** The critical hazard: `answer()` consumes `state.questionCount()`\
        \ (line 179) to compute the next count. If the Redis key is evicted mid-flight\
        \ between two answers, the rebuild uses the **DB** `questionCount`, which\
        \ lags the number of `question` rows actually written (line 180 inserts the\
        \ message, then 186 updates the session). If `updateById` (186) or `stateStore.write`\
        \ (188) fails after the message insert, Q6 exists in `interview_message` but\
        \ DB/Redis still say 5. On the rebuild, count 5→6 re-rolls into the same dedupe\
        \ set, and the divergence is invisible.\n\n**C. Bulk eviction — the realistic\
        \ \"silently expire while DB valid\" case.**\nThese are not daily TTL boredom;\
        \ they are the operational ones that break *every* in-progress interview at\
        \ once:\n- Redis **restart** / **FLUSHDB**\n- **`maxmemory-policy` eviction**\
        \ (e.g. `allkeys-lru` — a platform/demo Redis is often configured this way).\
        \ All `interview:session:*` keys vanish, DB stays truthfully `ASKING`. With\
        \ no logging around the fallback, the whole fleet's in-progress interviews\
        \ silently reset their authoritative counter.\n- **Key pattern collision with\
        \ other interviews** — not here (key is namespaced per session), but worth\
        \ stating that nothing protects the namespace from a broad `FLUSHALL`.\n\n\
        The *reason* continuation breaks is structural, not just the number 24: **the\
        \ system designates the ephemeral store as authoritative but provides no durable\
        \ backstop, no expiry signal, and no verification step.** Expiry is therefore\
        \ \"silent\" by design, and any path that does not reproduce the exact DB↔Redis\
        \ invariant risks continuing from a stale counter.\n\n### 3) Specific defects\
        \ to fix\n\n| # | Location | Severity | Issue |\n|---|----------|----------|-------|\n\
        | D1 | InterviewStateStore.java:51 | High | Fixed 24h TTL makes an active-but-idle\
        \ interview forfeit authoritative state; DB says valid, Redis says nothing.\
        \ |\n| D2 | InterviewService.java:382-389 | High | Fallback rebuild is silent\
        \ (no `log.warn`) → expiry is undetectable in prod. Detection and data-loss\
        \ signal are absent. |\n| D3 | InterviewService.java:387-389 | Medium | Rebuild\
        \ trusts DB `questionCount`/`currentQuestionId`, which are stale-by-design\
        \ secondary copies, not the authority they claim to restore. |\n| D4 | InterviewStateStore.java:51\
        \ | Medium | TTL applies even to `FINISHED` sessions (finishSession writes\
        \ FINISHED + 24h). Wasted keys; and no clean distinction between \"never started\"\
        \ and \"expired.\" |\n| D5 | InterviewStateStore.java:48-56 | Low/Medium |\
        \ `write()` hard-fails the whole request on any Redis error (throws `INTERNAL_ERROR`).\
        \ Redis is treated as *required*, yet its durability is *guaranteed nothing*\
        \ — the worst of both worlds as SSoT. |\n\n### 4) Recommendations (config\
        \ + code)\n\n**R1 — Stop abusing an ephemeral store as SSoT; make DB authoritative.**\
        \ Treat Redis as a *L2 cache of DB state*, not the source of truth. Read state\
        \ via DB and cache on the way (write-behind), so an expiry costs a DB read,\
        \ not a semantic reset.\n- Removes D1/D3 entirely: `question_count`/`current_question_id`\
        \ are already columns (InterviewService.java:112-114); make them authoritative\
        \ and derive Redis from them.\n\n**R2 — Log and detect expiry (fix D2).**\
        \ Distinguish \"key missing\" from \"session absent,\" and warn loudly:\n\
        ```java\npublic SessionState read(Long sessionId) {\n    String json = bucket.get();\n\
        \    if (json == null) {\n        log.warn(\"interview state absent (likely\
        \ TTL-expired or evicted), sessionId={}\", sessionId);\n        return null;\n\
        \    }\n    ...\n}\n```\nAnd gate the rebuild so callers *know* they reconstructed:\n\
        ```java\nprivate InterviewStateStore.SessionState requireAsking(Long sessionId)\
        \ {\n    SessionState state = stateStore.read(sessionId);\n    if (state ==\
        \ null) {\n        log.warn(\"rebuilding interview state from DB, sessionId={}\"\
        , sessionId); // visibility\n        ...\n    }\n    ...\n}\n```\n\n**R3 —\
        \ Make TTL intent explicit instead of a magic 24h constant.** Either slide\
        \ by activity (current behavior) *and* document that >24h idle = graceful\
        \ handoff, or tie TTL to a real business timeout and handle it:\n```yaml\n\
        app:\n  interview:\n    state-ttl: ${INTERVIEW_STATE_TTL_HOURS:24}\n```\n\
        Pass it into `InterviewStateStore` via `@Value` instead of the hardcoded constant.\n\
        \n**R4 — Protect against bulk eviction (fix D4/D5).**\n- Configure Redis deliberately,\
        \ don't inherit platform eviction: prefer `noeviction` (or `volatile-lru`\
        \ with reaper) for the interview namespace; set meaningful `maxmemory` with\
        \ `ALLOW busy writes off`.\n- Use a tiny namespace prefix that survives `FLUSHDB`\
        \ by victimizing nothing else; consider a Redis Cluster DB index dedicated\
        \ to session state so `FLUSHDB` on the shared DB doesn't nuke sessions (`-c\
        \ 1`-style separation).\n- Keep the 24h `FINISHED` write but **verify on resume**:\
        \ re-read DB status on the fallback and reconcile (already partially done\
        \ at line 391-396 — extend log to say *what* was reconciled). If `FINISHED`\
        \ in DB, delete the stale Redis key rather than rewrite it.\n\n**R5 — Harden\
        \ ordering (fix D3) so a fallback can never rebuild from a stale counter.**\
        \ Update DB + Redis in a single critical section with intent: persist the\
        \ *incremented* count to state, and if the Redis write fails, don't throw\
        \ and kill the request — fall back to DB-valid-only mode and log degradation,\
        \ so an eviction degrades gracefully instead of hard-failing (D5).\n\n**R6\
        \ — (Optional) explicit expiry handling instead of silent rebuild.** If a\
        \ >24h idle session must not silently continue, compare timestamps: use Redis\
        \ `getExpire`/recent-activity, or store a durable `last_activity_at` column,\
        \ and surface a \"session expired, resume?\" prompt rather than quietly continuing\
        \ from a guessed counter. This turns \"silent break\" into a deliberate, observable\
        \ user decision.\n\n### 5) Bottom line for lead review\nThe exact failure\
        \ mode \"Redis silently expires while DB stays valid\" is real and guaranteed\
        \ by the fixed 24h TTL. In **this** codebase the direct resume path frequently\
        \ masks it via the silent DB-rebuild in `requireAsking` — which is precisely\
        \ the problem: expiry is swallowed, unlogged, and trusted to a stale-by-design\
        \ counter. Priority fix is R1/R2 (make DB authoritative + instrument the rebuild);\
        \ R3-R5 eliminate the structural reliance on an ephemeral single source of\
        \ truth."
