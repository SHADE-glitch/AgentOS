      output: "# Continuation Breakage: Redis Runtime State with Fixed TTL vs Persistent\
        \ DB\n\n## 1. Problem framing\n\nAn interview session has **two planes of\
        \ state** with different lifetimes:\n\n| Plane | Store | Lifetime | Content\
        \ |\n|-------|-------|----------|---------|\n| **Runtime / ephemeral** | Redis\
        \ | Fixed TTL (`EXPIRE`, `SET ... EX`) | current question, draft/partial answer,\
        \ live timer, cooldowns, transient generated variants, conversation buffer,\
        \ lock handle |\n| **Persistent / durable** | DB | Indefinite | session meta,\
        \ committed answers, status (`open`/`closed`), audit log |\n\nThe trap: **the\
        \ DB row stays valid long after the Redis runtime state has been silently\
        \ dropped.** The system therefore *appears* to support continuation (DB says\
        \ `status = active`), but the actual conversational position is gone. This\
        \ is a silent divergence between the two planes.\n\n## 2. Root cause\n\nA\
        \ **fixed (absolute) TTL** is *time-based, not activity-based*. Redis records\
        \ a single epoch at the moment the TTL is set and never refreshes it on access.\
        \ `EXPIRE key 1800` or `SET key val EX 1800` schedules expiry at `now + 1800s`\
        \ *once*. Reads do not touch it.\n\nThis is fundamentally different from a\
        \ **sliding TTL**, where every access re-issues the expiry.\n\n## 3. When\
        \ continuation breaks\n\n- **Long-running session exceeding the TTL.** Any\
        \ interview whose wall-clock duration exceeds the fixed TTL will lose its\
        \ runtime state *mid-flight*, even the active, non-idle ones. Fixed TTL can't\
        \ distinguish \"idle\" from \"just slow.\"\n- **Anomalous long sessions.**\
        \ A TTL tuned to the 99th-percentile session still fails the long tail (candidates\
        \ who pause, multi-part take-home tasks, connectivity drops).\n- **Idle pauses\
        \ near the TTL boundary.** A session idle for ~TTL then resumed appears expired.\n\
        - **Memory-pressure eviction.** Even *before* TTL, Redis evicts keys under\
        \ `maxmemory` pressure (volatile-LRU/LFU/allkeys policies) — an even more\
        \ silent loss, and one that a TTL may not protect against.\n- **Composite\
        \ state fragmentation.** If runtime state is spread across many keys each\
        \ with its own TTL, they expire *independently* → partial expiry (timers gone,\
        \ buffer intact), which produces worse corruption than whole-state loss.\n\
        \nThe DB is never the trigger — it stays valid throughout, which is precisely\
        \ what masks the failure.\n\n## 4. Why continuation breaks (semantic analysis)\n\
        \nContinuation needs the **runtime position**, not just the durable snapshot.\
        \ Decompose the flow:\n\n```\nclient -> draft (Redis runtime) -> submit ->\
        \ checkpoint to DB (durable)\n```\n\nAt the point of expiry, three classes\
        \ of data vanish from Redis:\n\n1. **Un-checkpointed in-flight work** — the\
        \ draft the candidate is typing right now. It was never written to the DB,\
        \ so it is irrecoverable. Continuation resumes *behind* actual progress.\n\
        2. **Reconstructable-but-known-better state** — e.g. the exact question variant,\
        \ remaining timer value, per-question cooldown. DB has an older snapshot;\
        \ reconstructing from DB yields a stale position.\n3. **Transient control\
        \ state** — live locks/heartbeats for the session lock. If this is the lock\
        \ handle, another process may acquire the lock against a *stale* session →\
        \ double-submission or conflicting writes.\n\nThe DB still says `open`, so\
        \ a naive `resumeSession()` that reads only the DB succeeds — but returns\
        \ an empty/old conversation. The user sees the interview \"reset,\" duplicates\
        \ a question, or gets a prompt for an already-answered item. **The break is\
        \ invisible at the persistence layer** because nothing at that layer ever\
        \ failed.\n\n## 5. Reconciliation strategy\n\nThe fix is to (a) stop conflating\
        \ idle-timeout with absolute-lifetime, and (b) make expiry *detectable and\
        \ recoverable* rather than silently destructive.\n\n**Design principles:**\n\
        1. Separate **idle timeout** (sliding, refreshed on activity) from **absolute\
        \ lifetime cap** (one-shot, for hard-kill/cleanup).\n2. Use a **single runtime\
        \ key per session** to avoid partial expiry.\n3. **Checkpoint to DB regularly**\
        \ (every answered question, plus every N seconds of in-progress draft) so\
        \ the durable plane is always close to the runtime plane.\n4. **Never auto-delete\
        \ the DB row on Redis expiry.** Instead mark it `interrupted` and expose a\
        \ `resume-from-checkpoint` path that regenerates runtime state from the DB.\n\
        5. On any access, verify state with an atomic **get-and-refresh-and-compare-generation**\
        \ so a stale runtime key can't be mistaken for current.\n\n## 6. Redis configuration\
        \ & commands\n\nSingle-key, slide-on-access, generation-checked (Lua):\n\n\
        ```lua\n-- slide_and_get.lua\nlocal key   = KEYS[1]\nlocal gen   = tonumber(ARGV[1])\n\
        local ttl   = tonumber(ARGV[2])   -- sliding idle timeout (s)\nlocal cap \
        \  = tonumber(ARGV[3])   -- absolute lifetime cap (s)\n\nlocal cur   = redis.call('GET',\
        \ key)\nif not cur then return {0, 'EXPIRED'} end\n\nlocal stored = cjson.decode(cur)\n\
        -- detect stale runtime we can no longer reconcile\nif stored.gen and gen\
        \ and stored.gen ~= gen then\n    return {-1, 'STALE_GENERATION'}\nend\n\n\
        -- re-check absolute cap so we never extend life forever\nlocal pttl = redis.call('PTTL',\
        \ key)\nif pttl > 0 and cap and pttl > (cap - ttl) * 1000 then\n    -- would\
        \ exceed absolute cap -> keep fixed, force reconcile\n    return {2, 'CAP_HIT',\
        \ stored}\nend\n\n-- sliding refresh: extend only by the idle window, bounded\
        \ by cap\nredis.call('PEXPIRE', key, ttl * 1000)\nreturn {1, 'OK', stored}\n\
        ```\n\nClient usage — refresh on every heartbeat/read:\n\n```bash\n# set once\
        \ at session start with hard cap\nSET session:1807 <json> EX 7200        #\
        \ absolute lifetime: 2h max\n\n# subsequent accesses slide by idle window\
        \ only (via Lua above)\n# heartbeat key <gen> <idle_ttl=1800> <cap=7200>\n\
        ```\n\nIf the Lua returns `EXPIRED`: do **not** delete the DB row; mark it\
        \ and reconstruct:\n\n```\n1. DB: UPDATE session SET status='interrupted',\
        \ checkpoint_ts=NOW() WHERE id=?\n2. Rebuild runtime state from the most recent\
        \ durable checkpoint.\n3. Reinitialize Redis key with a fresh generation.\n\
        4. Surface \"resume from checkpoint\" to the client (not a blank session).\n\
        ```\n\n`maxmemory` policy to avoid silent eviction of session keys:\n\n```bash\n\
        maxmemory 8gb              # sized so volatile keys never force-evict runtime\
        \ state\nmaxmemory-policy noeviction  # or volatile-ttl with care; never allkeys\
        \ on this DB\n```\n\n## 7. Monitoring to catch the \"silence\"\n\n- Log every\
        \ `GET` that returns `nil` where the DB says `status = active` → keyspace-miss\
        \ correlation.\n- `INFO stats` → watch `evicted_keys` growth.\n- Expiry watch:\
        \ on each unavailable runtime key, record the DB `updated_at` vs `now` — amplifies\
        \ gaps exceeding checkpoint cadence.\n- Alert when `runtime-missing-rates`\
        \ (missing / returns `EXPIRED`) exceeds a threshold over the session.\n\n\
        ## 8. Recommended configuration summary\n\n| Concern | Setting |\n|---------|---------|\n\
