    output:
      agent: rag-engineer
      status: completed
      summary: '# Database Engineering Review — Redis TTL Silently Expiring While
        DB Stays Valid


        Scope: `interview:session:{id}` (Redis) vs `interview_session` (MySQL). Case
        in point — `InterviewStateStore.java:25` '
      output: "# Database Engineering Review — Redis TTL Silently Expiring While DB\
        \ Stays Valid\n\nScope: `interview:session:{id}` (Redis) vs `interview_session`\
        \ (MySQL). Case in point — `InterviewStateStore.java:25` hardcodes `TTL_HOURS\
        \ = 24`, and `InterviewStateStore.java:51` resets that TTL on every write.\n\
        \n## 1. When expiration actually happens (the trigger)\n\nThe TTL is **sliding\
        \ during active use but fixed across idle gaps**:\n\n- Every call to `InterviewService.create()`\
        \ (line 91) and `.answer()`/`.answerStream()` (lines 188, 263) calls `stateStore.write(...)`,\
        \ which re-applies a fresh 24h TTL.\n- Redis is therefore kept alive **only\
        \ while the user is actively answering**.\n- The DB, by contrast, is written\
        \ once (`interview_session`, lines 114/186/262) and never expires.\n\nSo the\
        \ expiry window is precisely:\n\n> **An un-finished interview where the user\
        \ pauses > 24h between two consecutive `answer` calls.** The `interview_session.status`\
        \ row stays `ASKING`/`START` forever in MySQL, but Redis `interview:session:{id}`\
        \ dics appears and the key evaporates silently (no log, no signal, no eviction).\n\
        \nThis is realistic for this product: interviews are long-running restartable\
        \ workflows; a candidate can legitimately resume days later.\n\n## 2. Why\
        \ continuation nominally \"recovers\" — and the subtle trap\n\n`InterviewService.requireAsking()`\
        \ (line 380) already has a **Redis-miss fallback**:\n\n```java\nInterviewStateStore.SessionState\
        \ state = stateStore.read(sessionId); // NULL after expiry\nif (state == null)\
        \ {\n    state = new SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId());\n\
        \    stateStore.write(sessionId, state); // re-hydrate + re-arm 24h TTL\n\
        }\n```\n\nSo a *pure* expiry does **not** hard-fail the `answer()` path today,\
        \ because it silently reconstructs state from MySQL. That is the trap: it\
        \ *looks* recoverable, but the recovery rests entirely on the DB row being\
        \ a faithful, up-to-date duplicate of the Redis state. That assumption is\
        \ what breaks, for three reasons:\n\n### 2a. Redis and DB are written non-atomically\
        \ → they can diverge\nIn `answer()`, the DB update (line 186) and the Redis\
        \ write (line 188) are two separate calls in sequence. A crash, timeout, or\
        \ exception between them leaves:\n\n| Crash point | DB `question_count` |\
        \ Redis `question_count` | Effect after Redis expiry + rebuild |\n|---|---|---|---|\n\
        | after DB write #186, before Redis write #188 | correct (N) | stale (N-1)\
        \ | Rebuild reads N → OK by luck |\n| Redis *didn't* expire (normal path)\
        \ | N | stale N-1 | `newCount = state.questionCount()+1` = **N**, collides\
        \ with real N |\n\nThe second row is the real lose: Redis state drives `newCount`\
        \ (line 179) and the \"single authority\" comment (state store is described\
        \ as *\"单一权威来源\"*, the sole authoritative source, `InterviewStateStore.java:15`),\
        \ so a stale Redis value silently under-counts `question_count` while DB already\
        \ advanced. When the key later expires and is rebuilt from DB, you get a *different*\
        \ state than the one the previous turn produced — i.e. continuation \"snaps\"\
        \ to a different point mid-interview.\n\n### 2b. Redis `question_count` and\
        \ the DB-derived `askedQuestionIds` can disagree\n`askedQuestionIds` for minus\
        \ dedup (line 141) is derived from the **actual message history** (DB truth),\
        \ but `questionCount` used to compute the next question (line 179) comes from\
        \ **Redis state**. These two counters are not guaranteed equal:\n\n- `askedQuestionIds.size()`\
        \ = number of `kind=\"question\"` rows in MySQL.\n- `state.questionCount()`\
        \ = counter carried in Redis.\n\nUnder expiry + rebuild, `questionCount` is\
        \ loaded from the `interview_session.question_count` column, while `askedQuestionIds`\
        \ is loaded from the join-keyed message rows. If they drift (crash window\
        \ above, or a manual DB edit, or a leftover from the non-atomic write), continuation\
        \ picks the **wrong next question** (repeats already-asked ones, or skips)\
        \ even though the `status` transition succeeds. The flow \"works\" at the\
        \ state-machine level but is silently corrupted at the *content* level.\n\n\
        ### 2c. No version / turn sequence → irreducible drift and no resumed-awareness\n\
        Redis stores a bare 3-field `SessionState` with no monotonic `version` or\
        \ turn sequence. Therefore:\n- The fallback cannot distinguish \"expired,\
        \ DB is fresher\" from \"expired, Redis was fresher.\"\n- There is no audit\
        \ trail that a resume actually happened, and no guard against a duplicated\
        \ or lost turn.\n\n## 3. When continuation *hard* breaks (worst case)\n\n\
        `requireAsking()` rehydrates from `interview_session`. If that single row\
        \ is itself inconsistent (crash between DB write #186 and the `finishSession`\
        \ DB update #341, or a left-over `START` after `answer`s were actually answered),\
        \ the rebuild produces a wrong state that then:\n- **re-asks already-answered\
        \ questions** (wrong `questionCount` + divergent `askedQuestionIds`), or\n\
        - **allows an answer on a session that already finished** — because the `FINISHED`\
        \ guard (line 391) only evécutes if the *rebuilt* state says `FINISHED`; if\
        \ finish didn't commit to the specific DB column read, the guard never fires.\n\
        \n## 4. Recommendations (DB-first)\n\n**P1 — Promote MySQL to the single source\
        \ of truth; demote Redis to a cache.** The dual-write is the root cause. Best\
        \ fix is the inverse of the current design comment (`InterviewStateStore.java:15`):\
        \ keep the state machine on MySQL (already fully persisted: status/count/currentQuestionId),\
        \ and let Redis be a short-TTL fast layer (e.g. 5 minutes) that is always\
        \ rebuilt from MySQL. Then Redis expiry becomes harmless by construction —\
        \ the DB naturally owns continuation.\n\n**P2 — If Redis must stay authoritative,\
        \ add an explicit version and reconcile, don't just overwrite.** Upsert a\
        \ `version` on both sides and reconcile on miss:\n\n```java\n// InterviewStateStore\n\
        public record SessionState(String status, int questionCount, Long currentQuestionId,\
        \ long version) {}\n// write() -> lua: v = EXISTS? INCR : 1 ; set k v  (atomic,\
        \ no read-modify-write gap)\n```\nOn Redis miss, do **not** blindly `set`\
        \ the DB copy; `SET ... NX` with the DB `version` so a stale rehydration can't\
        \ clobber a fresher concurrent write (protects the 2a crash window).\n\n**P3\
        \ — Persist a turn sequence on `interview_session`** (e.g. `last_answered_turn`),\
        \ and in `answer()` use **one** counter for both `newCount` and dedup: compute\
        \ from the same source (`MAX(turn)` over message history, or the DB column),\
        \ never from Redis state. Eliminates 2b.\n\n**P4 — Make writes atomic across\
        \ mediums.** Write to MySQL and enqueue/apply to Redis inside the same transaction\
        \ boundary (outbox pattern for the Redis side). This removes the 2a crash\
        \ window entirely; if Redis is later just a cache (P1) this becomes moot.\n\
        \n**P5 — Make silent expiry loud.** Log a warning + metric on every Redis-miss→rehydration\
        \ in `requireAsking()` (sessionId, recovered status/count, source). \"Silent\"\
        \ is the bug — expiry should be an observable, auditable event (`InterviewService.java:382`).\n\
        \n**P6 — TTL semantics.** Since `write()` already re-arms 24h, keep it sliding\
        \ for active sessions, but do not rely on it for resumability past idle gaps.\
        \ If the product promises cross-day resume, Redis TTL must be ≥ the promised\
        \ resume window, or (better) removed as an authority via P1.\n\nNet: the expiry\
        \ is not fatal *only* because `requireAsking()` happens to rebuild from MySQL\
        \ — and that hidden dependency is exactly why it breaks when DB/Redis drift.\
        \ The design's \"Redis is the sole authority\" contract conflicts with a durable\
        \ resume contract; resolve the contradiction by making MySQL authoritative\
        \ (P1) or by adding reconcile + versioning (P2/P3/P4).\n\nI can hand the AI/RAG\
        \ continuation-feedback portions (e.g., re-prompting the model with recovered\
        \ context) to the RAG engineer on the team; this response is scoped to the\
        \ storage-consistency layer."
