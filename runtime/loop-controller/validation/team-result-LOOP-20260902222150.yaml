      output: "I've reviewed the state handling end-to-end. Here is my code-review\
        \ finding.\n\n---\n\n## Review: Redis fixed-TTL session state silently expiring\
        \ while DB stays valid\n\n**Files reviewed**\n- `InterviewStateStore.java:25,48-56`\
        \ — Redisson bucket write with fixed 24h TTL\n- `InterviewService.java:380-399`\
        \ (`requireAsking`), `create`, `answer`, `answerStream`\n- `db/schema.sql:46-60`\
        \ — `interview_session` (no activity/last-seen column)\n- `RedissonConfig.java`\
        \ — no `maxmemory`/eviction-policy alignment\n\n### 1. Mechanism at the store\
        \ level\n\n`InterviewStateStore.write()` (`:51`) uses `bucket.set(json, TTL_HOURS,\
        \ TimeUnit.HOURS)`. This sets an **absolute TTL of 24h anchored to the moment\
        \ of that write**, and — critically — `read()`/`get()` (`:34-46`) does **not**\
        \ renew it. So the TTL is *sliding only while writes happen*; a session that\
        \ is only read (idle conversation gap, user resumed from a bookmarked tab,\
        \ mobile app backgrounded, page reload) gets **no** extension, and the key\
        \ evaporates 24h after the *last state change*, regardless of DB truth.\n\n\
        The DB row `interview_session` has no `updated_at`/`last_active` column (only\
        \ `started_at`/`finished_at`, `schema.sql:57-58`). The DB therefore cannot\
        \ answer \"how long since this user was actually active,\" so the fixed 24h\
        \ Redis TTL becomes the *de-facto* activity time-box — but it is **not** backed\
        \ by any DB-side timestamp that would let you distinguish \"session truly\
        \ abandoned\" from \"session merely idle.\"\n\n### 2. The deeper defect: dual\
        \ source of truth\n\nThe comment at `InterviewStateStore.java:15` declares\
        \ Redis the authoritative state-machine source (“单一权威来源”), but `InterviewService.requireAsking()`\
        \ (`:380-399`) silently rebuilds state from the DB on a Redis miss. So you\
        \ have **two overlapping authorities** whose rows are byte-identical in shape\
        \ (`status`, `question_count`, `current_question_id` ↔ `interview_session(status,\
        \ question_count, current_question_id)`) and which are written by two **non-atomic**\
        \ statements:\n\n- `InterviewService.create():111-114` → `sessionMapper.updateById`\
        \ then `stateStore.write`\n- `InterviewService.answer():183-189` → `updateById`\
        \ then `stateStore.write`\n\nNeither pair is in a transaction that spans both\
        \ Redis and MySQL, and there is no reconciliation/ordering guarantee — it\
        \ is plain last-writer-wins.\n\n### 3. When does continuation actually break?\n\
        \n**Happy path is masked, not fixed.** Because every continuation path funnels\
        \ through `requireAsking()`’s DB fallback, a *pure* idle-expiry (>24h, no\
        \ divergence) is silently rehydrated: Redis miss → `selectById` → rebuild\
        \ → **rewrite to Redis (`:389`), which resets the 24h TTL**. So in the trivial\
        \ case, continuation *appears* to work. That is the illusion the bug hides.\n\
        \nContinuation genuinely breaks in these concrete cases:\n\n- **(A) Divergence\
        \ + then expiry.** If the sequence ever interleaves so Redis and DB disagree\
        \ (Redis write OK / DB `updateById` throws, or vice versa — or a partial failure\
        \ inside the non-transactional pair), the *surviving* authority is chosen\
        \ by **wall-clock expiry**, not by correctness. Before TTL, Redis wins; after\
        \ TTL, the DB snapshot rolls the interview back to a prior `question_count`/`current_question_id`.\
        \ The exact same conversation thus behaves one way before expiry and another\
        \ way after — a silent, non-deterministic continuation break.\n- **(B) Pre-TTL\
        \ eviction (worse than plain TTL).** With a default/`allkeys-*` Redis eviction\
        \ policy under memory pressure, keys are evicted *before* their 24h TTL. This\
        \ looks identical to expiry but is unpredictable; the DB row stays `ASKING`\
        \ and valid, yet the runtime state is gone. Because `create()` already committed\
        \ DB `ASKING`, reconstruction yields `question_count=1` and the *first* question\
        \ id — the UI/SSE is mid-conversation on question N but `requireAsking` rebuilds\
        \ count/position from the create-time snapshot → out-of-sync continuation.\n\
        - **(C) Starting from `detail()`.** `detail()` (`:291-299`) reads only the\
        \ DB (never touches Redis), so a client can legitimately be shown `status=ASKING`,\
        \ `current_question_id=Q3` from DB, then call `answer()` on an expired/evicted\
        \ key. Reconstruction restores from DB so it *usually* matches — but any Redis-ahead-of-DB\
        \ divergence (case A) makes the resumed answer advance the wrong counter or\
        \ block with `INTERVIEW_STATE_ERROR` if reconstructed status disagrees.\n\
