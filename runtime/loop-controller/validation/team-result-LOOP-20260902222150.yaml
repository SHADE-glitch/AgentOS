        ---


        # DB Engineering Review: Redis Session-State TTL vs. Durable DB Continuity


        ## Executive Diagnosis


        `InterviewStateStore.write()` (`backend/.../interview/service/InterviewStateStore.java:48-56`)
        writes the entire machine state with `bucket.set(json, TTL_HOURS, TimeUnit.HOURS)`
        — a **fixed 24h TTL reset to full on every write**. The class doc (`:14`)
        declares Redis "单一权威来源" (single authority) for the state machine. But every
        field in `SessionState` (`status`, `questionCount`, `currentQuestionId`) is
        **also persisted** in the `interview_session` table (`InterviewSession.java:26-34`).
        So the TTL boundary creates a hidden layering contradiction: Redis is authoritative
        *by design* but merely a cache *by data*, and the only thing that saves continuation
        is an ad-hoc DB fallback inside `requireAsking()`.


        **Bottom line:** Continuation does *not* break because of Redis expiry alone
        — it survives only because `requireAsking()` (`InterviewService.java:380-399`)
        re-synthesizes state from the DB row when `read()` returns null. It breaks
        in the specific cases below, which are real.


        ---


        ## When & Why Continuation Breaks


        ### 1. Any read path that trusts Redis without the DB fallback (the primary
        risk of the pattern)

        `SessionState` is read at `InterviewService.java:129` and `:204`, both funneled
        through `requireAsking()` which carries the `null → rebuild-from-DB` branch
        (`:382-390`). That fallback is the **only** thing that makes resume-after-expiry
        work. The moment any future consumer of run state (e.g., the tool-calling
        decision context referenced in the Phase 5 commit, a `detail`/`resume` endpoint,
        dashboard aggregation) reads Redis directly as truth, it breaks exactly at
        the TTL boundary — silently, because the DB still reports `ASKING`.


        ### 2. State that lives *only* in Redis is irrecoverable

        `SessionState` today is fully DB-mirrored, which is why the fallback heals
        it. If the tool-calling layer ever stashes decision context (sub-prompts,
        chosen tool, pending follow-up) in Redis **without** a DB mirror, TTL expiry
        permanently destroys continuity — the rebuild path has nothing to synthesize
        from. This is the real "why it breaks": Redis-with-TTL is only safe for data
        that is a pure replica of durable truth.


        ### 3. Non-atomic DB-write / Redis-write → stale-but-present Redis defeats
        the fallback

        In `answer()`/`answerStream()` the order is: DB `updateById` (`:186`, `:261`)
        **then** `stateStore.write` (`:188`, `:263`). These are not atomic. If the
        process crashes or the write throws between the two steps:

        - DB advanced to the new question; Redis still holds the **old** `questionCount`/`currentQuestionId`.

        - `requireAsking()` sees **non-null** Redis → the `null`-row fallback at `:382`
        is **bypassed** → next continuation operates on stale `state.questionCount()+1`
        (`:179`, `:254`) → **skipped or repeated question numbering**, and the divergence
        persists until Redis later expires.


        Note also: `saveUserMessage` (`:132`) happens *before* the Redis write that
        can throw (`InterviewStateStore.write:54`), so a Redis-transient failure can
        also inject a duplicate answer message. (Separate idempotency bug, but same
        non-atomic surface.)


        ### 4. TTL semantics are "24h of write-activity", not "24h from start"

        `set(value, 24h)` resets to the full 24h on **every write** but not on `read()`
        (`bucket.get()` does not refresh). So the expiry is really an **idle timeout
        keyed to the last state transition**. Two consequences:

        - An actively-answered interview that spans >24h wall-clock is fine (each
        answer rewrites).

        - A user who pauses >24h loses the Redis state. The rebuild restores the last
        DB-committed snapshot, so mid-interview position *is* recovered — but any
        Redis-only context is lost.


        ---


        ## 目标 / Problem Frame (skill template)


        - **Constraint:** UTF-8 Chinese UX, existing Redisson, state already duplicated
        in DB.

        - **Success criterion:** Continuation must be deterministic regardless of
        Redis TTL, and never silently diverge.


        ## Recommended Design (Decision per skill framework)


        **Option A — DB as single source of truth; Redis as disposable read-ahead.**

        - Reverse the stated authority: read state from DB; use Redis only as a lock
        holder + optional hot read layer. Make the DB-rebuild in `requireAsking()`
        the *primary* path, Redis a pure accelerator.

        - Strengths: removes the TTL-hazard entirely; simplest correct mental model.

        - Weaknesses: loses true "runtime fast-state" that a dedicated in-Redis machine
        would give.


        **Option B — Keep Redis authoritative but make writes atomic w/ DB + sliding
        refresh.**

        - Wrap the `sessionMapper.updateById` + `stateStore.write` pair in the already-held
        distributed lock, and refresh TTL on read (`bucket.expire(TTL)` after `get()`)
        so an *active* session can''t expire.

        - Strengths: preserves the fast runtime store; fixes case #3 (atomicity) and
        idle-expiry-during-activity.

        - Weaknesses: still requires every new runtime-only field to be durably recoverable
        or TTL-bound to a deadline.


        **Decision: Option A**, with Option B''s atomicity fix applied in the interim.
        It matches the codebase reality — the data is already in DB and always recoverable
        — and eliminates class #1/#3 bugs. Keep Redis for the distributed lock and
        dashboard cache only.


        ## Concrete changes to recommend

        1. `requireAsking()`: make DB the authoritative source; read DB unconditionally
        (it''s one indexed `selectById`), use Redis as an advisory read that is validated
        against the DB row on any mismatch (`status` / `questionCount` / `currentQuestionId`).
        Don''t trust non-null Redis implicitly (fixes bug #3).

        2. In `answer()`/`answerStream()`/`create()`/`finishSession()`: either remove
        the duplicate Redis `SessionState` write that duplicates DB, or make `updateById`
        + `write` a single logical transaction guarded by the lock (fixes #3 windows
        and duplicate answer message on throw).

        3. If any tool-calling / runtime context must live only in Redis: bound its
        TTL to a real deadline, and **store it in DB or reconstruct from DB** — never
        trust un-mirrored Redis across the TTL boundary (fixes #2).

        4. Add observability: when `requireAsking` performs a rebuild (i.e., `read()==null`
        but DB row exists), log it as a "Redis state expired / reconstructed" metric
        and optionally notify the client "会话已暂停多时，将从中断处继续" (fixes the "silently" part).

        5. Optionally make TTL sliding-on-read for any genuinely runtime-only key,
        so active work can''t expire mid-session.


        ## Validation

        - Integration test: start `ASKING` session, manually expire the key via Redis
        CLI, assert the next `answer()` still advances correctly and count/currentQuestionId
        match DB.

        - Fault test: crash-simulate between `updateById` and `stateStore.write`;
        assert no stale non-null Redis state is trusted afterward.

        - System test: verify graceful message to user on idle-resume.


        Supporting refs: `InterviewStateStore.java:48-56,61`, `InterviewService.java:179,186-189,254,261-264,380-399`.'
