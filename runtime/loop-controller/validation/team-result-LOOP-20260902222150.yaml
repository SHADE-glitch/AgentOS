        \ and rewrites (`:388-389`) with **no log line**. The expiry/eviction is invisible\
        \ to ops: you can’t even tell a rehydration happened.\n\n### 4. Why the DB\
        \ can’t help you here\n\nThe DB remains valid and durable, but it stores only\
        \ the *latest committed snapshot*, not the runtime position the client is\
        \ currently mid-interaction on, and it carries **no activity clock**. So the\
        \ DB cannot be the arbiter of “is this session still live, and at what exact\
        \ position” — the component that *could* separate “idle” from “abandoned”\
        \ (a `last_active`) simply does not exist. That absence is the root enabler\
        \ of the silent TTL/DB mismatch.\n\n### 5. Severity/consequence\n\n| # | Scenario\
        \ | Effect | Severity |\n|---|----------|--------|----------|\n| 1 | TTL expiry\
        \ + DB/Redis divergence | non-deterministic rollback of progress | High |\n\
        | 2 | pre-TTL eviction | silent mid-conversation reset | High |\n| 3 | pure\
        \ idle expiry | masked by reconstruction (no break, no signal) | Medium (observability)\
        \ |\n| 4 | SSE 300s stream / long idle read | key not renewed (read-only)\
        \ → boundary expiry | Medium |\n\n### 6. Recommendations\n\n**R1 (required)\
        \ — Make TTL *sliding*, refreshed on activity, not on a fixed write-only quantum.**\
        \ Every read OR mutation that proves the user is live must renew. Minimal,\
        \ cheap: do the read with auto-extend semantics by using Redisson’s lease/reset,\
        \ or simply refresh TTL on successful read inside `read()` when the key exists:\n\
        \n```java\npublic SessionState read(Long sessionId) {\n    String key = key(sessionId);\n\
        \    RBucket<String> bucket = redissonClient.getBucket(key);\n    String json\
        \ = bucket.get();\n    if (json == null) return null;\n    // sliding: any\
        \ successful read keeps the session alive for 24h\n    bucket.expire(TTL_HOURS,\
        \ TimeUnit.HOURS);\n    return objectMapper.readValue(json, SessionState.class);\n\
        }\n```\n> Note: ALTER to refresh TTL on *read* — but tie this to actual user-activity\
        \ signals (answer submission, SSE heartbeat), not blind refresh from background\
        \ polls, or you’ll keep abandoned sessions warm. Add a heartbeat/keep-alive\
        \ event in the SSE stream.\n\n**R2 (required) — Log and count rehydration.**\
        \ The silent reconstruction is the core bug’s cover. Emit a `warn` whenever\
        \ `requireAsking` falls back to DB, so “session had to be rebuilt from DB”\
        \ becomes observable and alertable:\n\n```java\nprivate SessionState requireAsking(Long\
        \ sessionId) {\n    SessionState state = stateStore.read(sessionId);\n   \
        \ if (state == null) {\n        InterviewSession s = sessionMapper.selectById(sessionId);\n\
        \        if (s == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
        \        log.warn(\"Redis interview state MISSING for session={}, reconstructed\
        \ from DB (status={}, count={})\",\n                 sessionId, s.getStatus(),\
        \ s.getQuestionCount());   // add\n        state = new SessionState(s.getStatus(),\
        \ s.getQuestionCount(), s.getCurrentQuestionId());\n        stateStore.write(sessionId,\
        \ state);\n        // metrics.increment(\"interview.state.rehydrated\")  \
        \ // add\n    }\n    ...\n}\n```\n\n**R3 (required) — Align Redis eviction\
        \ policy so expiry is the *only* removal mechanism.** In `poolinfo`/`redis`\
        \ config (and docker-compose) set:\n```\nmaxmemory-policy noeviction     \
        \ # or volatile-lru for cache-only keys, never allkeys-*\n```\nWith `noeviction`/`volatile-*`,\
        \ keys with TTL are governed by TTL, so the DB-vs-Redis mismatch is at least\
        \ *predictable* rather than eviction-driven. Never use `allkeys-lru` while\
        \ a state machine’s runtime would be evicted silently.\n\n**R4 (required)\
        \ — Add a durable activity timestamp to the DB so the two stores can be reconciled.**\
        \ Without this, nothing distinguishes “idle” from “abandoned.” Add `last_active_at\
        \ DATETIME` to `interview_session`, update it on each `answer()`, and in `requireAsking`\
        \ treat a session with `last_active_at + 24h < now()` as truly abandoned (explicit\
        \ state, e.g. `EXPIRED/TIMEOUT`), *not* as a silent restart:\n\n```sql\nALTER\
        \ TABLE interview_session ADD COLUMN last_active_at DATETIME NOT NULL DEFAULT\
        \ CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP;\n...\n-- on each answer/mutation:\n\
        session.setLastActiveAt(LocalDateTime.now());\nsessionMapper.updateById(session);\n\
        ```\n\n**R5 (recommended) — Remove the false “single source of truth” claim\
        \ and make direction explicit.** Either (a) DB is source of truth and Redis\
        \ is only a cache → reconcile on miss (current behavior), *document it as\
        \ such*, or (b) Redis is authoritative → then it must tolerate a DDL-driven\
        \ recovery path and you must treat DB drop/recreate. The current code silently\
        \ does (a) while claiming (b); pick one and enforce consistent writes (write\
        \ DB under the same Redisson lock you already take at `:362`, then Redis —\
        \ or use an outbox where a Redis write failure prevents DB commit).\n\n**R6\
        \ (recommended) — Make the two writes atomic-ish.** Wrap the `sessionMapper.updateById`\
        \ + `stateStore.write` pair so a Redis write failure surfaces instead of leaving\
        \ divergent state. At minimum, move `stateStore.write` *before* `updateById`\
