      output: "# Database Engineer — Technical Analysis: Redis TTL Expiry vs DB Validity\n\
        \n## 1. Problem Restatement (DB-centric framing)\n\nThe system has **two stores\
        \ with different lifecycle contracts**:\n\n- **DB (source of truth):** durable,\
        \ governed by business retention. A session row remains valid until explicitly\
        \ closed.\n- **Redis (runtime cache):** holds the in-progress interview \"\
        runtime state\" (current question index, submitted-but-uncommitted answers,\
        \ partial transcript buffer, config snapshot). It carries a **fixed TTL**\
        \ set at creation time.\n\nContinuation breaks because the app conflates **\"\
        cache hit\"** with **\"session exists\"**. When Redis drops the key, the app\
        \ treats the session as absent even though the DB row is valid.\n\n---\n\n\
        ## 2. When it breaks — the specific conditions\n\n### a) Fixed TTL ≠ sliding\
        \ expiry (the core bug class)\nOn session start, typically `SETEX interview:session:{id}\
        \ <TTL> <state>`. This sets a **one-shot absolute TTL** anchored at *creation\
        \ time*.\n\n- Conversation/thinking runs longer than TTL → key dies mid-session,\
        \ even though the user is actively engaged.\n- **No refresh** of the TTL on\
        \ access. If the code never re-issues `EXPIRE`/`GETEX`/`TOUCH` on each request,\
        \ every session has a hard lifetime = TTL, regardless of activity. This is\
        \ the classic fixed-vs-sliding confusion.\n\n### b) Divergence window between\
        \ Redis and DB\nRedis TTL is a **purging policy**, not a business rule. DB\
        \ rows are not cleaned by the same timer.\n- Redis key expires + is `DEL`eted/auto-removed\
        \ → **Redis says \"no session\"**.\n- DB says \"session valid\" → **authoritative.**\n\
        \n### c) Independent eviction (not TTL, but masked as one)\nUnder `maxmemory`\
        \ with `allkeys-lru`/`allkeys-lfu`, Redis evicts keys **before** TTL — a *different*\
        \ mechanism that produces the identical symptom (state gone, DB valid). If\
        \ operators only tune TTL, eviction still breaks continuation.\n\n### d) Redis\
        \ persistence limits (replica/failover)\nRedis is **memory-optimized**, not\
        \ crash-durable:\n- RDB snapshots can lose recent writes; AOF-only mode without\
        \ `everysec`-sync loses seconds of state.\n- On replica promotion, unsynced\
        \ runtime state may vanish while the DB (fully committed) survives.\n\n###\
        \ e) Clock / expiry anchoring\nIf TTL is computed from timestamps rather than\
        \ `EXPIREAT` with a shared monotonic base on multiple app instances, **clock\
        \ skew** yields key lifetime variance — some requests see the session, others\
        \ see it expired.\n\n---\n\n## 3. Why continuation specifically breaks\n\n\
        1. **Look-aside (cache-aside) read path:**\n   ```\n   state = redis.get(Vojta\
        \ org)          # miss => None\n   if state is None:\n       # branch A: hard-fail\
        \ \"session expired / not found\"\n       # branch B: silently create a NEW\
        \ session => user loses context\n   ```\n   Both branches lose the interview\
        \ position unless the DB row can reconstruct it.\n\n2. **Reconstructability\
        \ gap:** if the *runtime* state (partial answer, current question, buffer)\
        \ is **only** in Redis and never snapshotted to the DB, then even with a valid\
        \ DB row, continuation cannot rebuild it — the resume point is gone. The DB\
        \ has the session *record* but not the *cursor*.\n\n3. **Cross-instance consistency:**\
        \ with a funnel/multi-agent or multi-pod setup, one request may hit a node\
        \ whose local state path depends on Redis presence. A TTL-expired key means\
        \ different nodes disagree on whether the session is live → intermittent continuation\
        \ failures (flaky, hard to debug).\n\n4. **Session correlation loss:** if\
        \ the client's session-token maps to a Redis key via a default/non-deterministic\
        \ key, an expired key may be regenerated with the same ID but different metadata,\
        \ breaking answer-to-question alignment.\n\n---\n\n## 4. Root-cause summary\n\
        \n| Symptom | Root cause |\n|---|---|\n| Key gone while DB valid | Fixed (one-shot)\
        \ TTL not refreshed on access |\n| Same symptom, unrelated to TTL | `maxmemory`\
        \ allkeys eviction drops key early |\n| State gone after failover/restart\
        \ | Redis persistence limits (RDB/AOF tradeoff) |\n| Continuation impossible\
        \ | Runtime cursor never snapshotted to DB |\n| Intermittent failures | Clock\
        \ skew in `EXPIREAT`, or multi-node disagreement |\n\n---\n\n## 5. Recommendations\n\
        \n### R1 — Prefer DB as the resume point (strongest fix)\nPersist a lightweight\
        \ **checkpoint/snapshot** to the DB when state crosses an actionable boundary\
        \ (question progressed, answer submitted, heartbeat interval). Redis then\
        \ holds only the **hot** copy.\n\n- On Redis hit → serve fast.\n- On Redis\
        \ miss → **rebuild** from DB snapshot, DON'T treat as new session.\n\nThis\
        \ converts a hard failure into a graceful rebuild. TTL becomes pure performance/cleanup,\
        \ not correctness.\n\n### R2 — Sliding TTL via keepalive (if Redis must stay\
        \ authoritative)\nRefresh the TTL on *every* access so active sessions never\
        \ die:\n\n**Atomic refresh with read** (redis ≥6.2), `GETEX ... EX` keeps\
        \ read + expiry in one call:\n```\nGETEX interview:session:{id} EX <TTL> \
        \  # read AND reset sliding TTL atomically\n```\nLegacy-safe Lua equivalent:\n\
        ```lua\nlocal v = redis.call('GET', KEYS[1])\nredis.call('PEXPIRE', KEYS[1],\
        \ ARGV[1])\nreturn v\n```\n- Only refresh for real user activity (evict heartbeats/idle\
        \ timeouts separately if needed).\n- Idle sessions can still be reclaimed\
        \ via a **longer** idle TTL than the in-use TTL.\n\n### R3 — Handle the miss\
        \ path explicitly\nTreat \"Redis miss\" as one of three, and make the code\
        \ branch injection-safe:\n1. Session genuinely ended → look up DB `status`;\
        \ if DB says active, go to rebuild (R1).\n2. Eviction/TTL → rebuild.\n3. Redis\
        \ unreachable → **fail-open** to DB (degrade gracefully), log, alert.\n\n\
        ### R4 — Separate TTL from eviction policy\nSet an explicit `maxmemory-policy`\
        \ (e.g. `noeviction` for correctness-sensitive keys, or `volatile-lru` to\
        \ at least scope eviction to TTL'd keys) and document it. Do not rely on TTL\
        \ to protect against memory pressure.\n\n### R5 — Durability tuning that matches\
        \ the contract\nIf Redis state is considered semi-durable, raise persistence:\n\
        ```\nappendonly yes\nappendfsync everysec      # or always for critical runtime\
        \ state\nsave 900 1                # reasonable RDB baseline\n```\nAnd align\
        \ `expire-old` semantics on failover with client reconnect logic.\n\n### R6\
        \ — Observability\nEnable keyspace notifications to catch silent expiry:\n\
        ```\nconfig set notify-keyspace-events Kx\n```\nSubscribe to `__keyevent@0__:expired`\
        \ → alert when an *active* session's key dies. Emit a custom metric for count\
        \ of `SESSION_REBUILT_FROM_DB` vs `SESSION_LOST`.\n\n---\n\n## 6. Decision\
        \ for lead review\n\n**Recommended primary fix:** R1 (DB checkpoint as resume\
        \ point) + R2 (sliding TTL) + R3 (explicit miss branching). TTL alone should\
        \ never define user-visible session lifetime; it is a cache lifespan, not\
        \ a business timestamp. Any fix must make **DB validity the source of truth**\
        \ and **Redis miss a recoverable cache event**, not a session-terminating\
        \ failure."
