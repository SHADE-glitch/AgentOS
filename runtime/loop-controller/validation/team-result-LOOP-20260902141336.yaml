      output: "# LLM Engineer Contribution: Interview Session Continuation Breakdown\
        \ (Redis TTL Silent Expiry)\n\n## 1. Problem Framing\n\nWe have a **dual-store\
        \ session model**:\n\n| Store | Role | Lifecycle |\n|-------|------|-----------|\n\
        | **Redis** | Runtime state (context window, current question index, state\
        \ machine progress, accumulated tokens, user+assistant turns) | **Volatile**,\
        \ bounded by a *fixed* TTL |\n| **DB** | Durable source of truth (interview\
        \ record, answers, `status=IN_PROGRESS`) | **Persistent**, valid until terminal\
        \ transition |\n\nThe break happens because **two independent stores are allowed\
        \ to disagree**, and continuation logic trusts one (DB says \"valid\") while\
        \ operations require the other (Redis is gone) — **with no detection and no\
        \ replay**.\n\n## 2. When Continuation Breaks (exact triggers)\n\nThe failure\
        \ is a *temporal coin flip*, not deterministic. It breaches under these conditions:\n\
        \n1. **Long-running interview > fixed TTL.** A fixed TTL is a wall-clock deadline.\
        \ Any session that stays active (user typing, model generating, retry loops)\
        \ beyond it expires *even while being actively used*. This is the classic\
        \ \"fixed vs sliding TTL\" bug.\n2. **Idle gaps** — user walks away, token\
        \ refreshes, tab backgrounded; on return, state is gone but the DB row still\
        \ says `IN_PROGRESS`.\n3. **Redis eviction under memory pressure.** Keys with\
        \ TTL are candidates for `allkeys-lru`/`allkeys-random`; they vanish *before*\
        \ their TTL, silently.\n4. **Redis restart without (or with incomplete) persistence.**\
        \ RDB snapshot + AOF not properly configured → state lost despite TTL being\
        \ \"valid\".\n5. **Write/refresh skew.** App refreshes the TTL on some paths\
        \ but not others (e.g., state written to Redis during turn N, but the TTL\
        \ was last set at turn N-1 and a slow model call delays the refresh past expiry).\n\
        6. **Session resume across deployment/scale.** Continuation hits a different\
        \ node/instance that had no in-process cache and the Redis key is already\
        \ gone.\n\n## 3. Why Continuation Breaks (root cause mechanics)\n\nThe core\
        \ reason is a **treat-as-okay cache miss** — a silent, non-erroring fallback.\
        \ Consider the typical resume path:\n\n```\nload_interview(session_id):\n\
        \    state = redis.get(session_key)          # 1. cache hit? \n    if state\
        \ is None:                       # 2. silent miss\n        return fresh_empty_state()\
        \          # 3. NO error, NO fallback rebuild\n    else:\n        resume_model_onto(state)\
        \            # 4. continue conversation\n```\n\nBecause `GET` on an expired\
        \ key returns `None` — it does **not** throw — the code path executes step\
        \ 3 as a *success*. Consequences:\n\n- **Context loss without crash.** The\
        \ LLM starts with an empty context window, losing prior user goals, constraints,\
        \ and the state machine position.\n- **State machine desynchronization.**\
        \ DB says `status=IN_PROGRESS`, answered questions exist, but Redis has lost\
        \ `current_index`, so the model re-asks *already-answered* questions or duplicates\
        \ updates.\n- **Token/truncation policy violation.** The application-level\
        \ MAX_TURNS or context budget (held only in Redis) resets to defaults, unbounded\
        \ growth, unexpected cost.\n- **Conflicting writes.** Multiple requests detect\
        \ \"missing\" Redis state concurrently and each initializes a fresh state\
        \ against the same DB row → **lost updates / corrupted record**.\n- **No observability.**\
        \ Nothing logs the miss, so the failure looks like the model \"just stopped\
        \ working\" — hard to debug and impossible to alert on.\n\nThe **\"why\"**\
        \ in one line: *the volatile and durable stores are updated together but their\
        \ invalidation policies are not synchronized, and the read path treats voluntary\
        \ eviction as first-run.*\n\n## 4. Recommended Fixes (ordered by leverage)\n\
        \n### 4.1 Sliding TTL (primary fix)\nReset the TTL on every *successful continued\
        \ access*, not on creation only. Fixed TTL → rolling expiry tied to actual\
        \ activity.\n\n```python\n# On every state load while actively engaged:\n\
        redis.setex(session_key, ttl=SLIDING_REFRESH, value=state)   # e.g. 30 min\n\
        ```\n\nWith a Sliding Window this should be driven by a **configured inactivity\
        \ window**:\n\n```python\nINACTIVITY_TTL_SECONDS = 60 * 30   # state dies\
        \ only after 30 min of no touch\nredis.expire(session_key, INACTIVITY_TTL_SECONDS)\n\
        ```\n\n### 4.2 DB becomes source of truth; Redis only a rehydratable cache\n\
        Never treat a Redis miss as \"start over.\" This is the single most important\
        \ change:\n\n```python\ndef load_interview(session_id):\n    state = redis.get(session_key)\n\
        \    if state is not None:\n        redis.expire(session_key, INACTIVITY_TTL_SECONDS)\
        \   # sliding refresh\n        return state\n\n    # Rehydrate from durable\
        \ DB — NOT an error, NOT a fresh start\n    record = db.load_interview(record_id,\
        \ status_must_be=\"IN_PROGRESS\")\n    if record is None:\n        raise NotFound(\"\
        no interview\")                        # genuine terminal case\n    state\
        \ = rebuild_state_from_record(record)                 # reconstruct from checkpoints\n\
        \    redis.setex(session_key, INACTIVITY_TTL_SECONDS, state)   # repopulate\
        \ cache\n    return state\n```\n\n### 4.3 Persist checkpoints to the DB so\
        \ rehydration is lossless\nThe Redis state must be *reconstructible*. Persist\
        \ a lightweight snapshot (question index, context digest, last activity timestamp)\
        \ on each turn commit:\n\n```sql\nUPDATE interview\n   SET status        =\
        \ 'IN_PROGRESS'\n     , last_activity_at = NOW()\n     , context_digest  \
        \ = :digest      -- e.g. last N turns or full turns\n     , current_index\
        \    = :index\n     , state_version    = :version     -- optimistic concurrency\
        \ token\n WHERE id = :session_id\n   AND state_version = :expected       --\
        \ prevents lost updates\n```\n\n### 4.4 Store `last_activity_at` in DB and\
        \ let expiry be *derived*, not duplicated\nCompare wall-clock activity to\
        \ decide validity rather than trusting Redis's presence:\n\n```\nvalid  =\
        \ record.last_activity_at + INACTIVITY_TTL > now()\n# Redis miss + valid record\
        \ → rehydrate\n# Redis miss + stale record   → genuinely expired session →\
        \ prompt user (not silent)\n```\n\nThis also gives you a **clean resume prompt**:\
