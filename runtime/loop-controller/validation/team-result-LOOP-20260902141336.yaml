    output: "# Root Cause: Redis Fixed-TTL vs DB-Validity Mismatch in Interview Sessions\n\
      \n## Executive Summary\n\nThe break happens because **two different authorities\
      \ have two different lifetimes**:\n\n- **DB** = source of truth for the *persisted*\
      \ interview record (candidate, questions, transcript, status). Valid for the\
      \ whole interview lifecycle.\n- **Redis** = cache/hot store for *runtime/ephemeral*\
      \ state (current question index, phase, countdown timer, in-flight submissions,\
      \ RAG context buffer). Valid only for a fixed TTL window.\n\nA **fixed (not\
      \ sliding) TTL** creates a silent split: Redis keystates become invalid at an\
      \ absolute wall-clock deadline, while the DB record stays \"open and valid.\"\
      \ Continuation breaks the moment a read falls outside the TTL *and* the app\
      \ treats the cache miss as \"session lost\" instead of \"reconstitute from DB.\"\
      \n\n---\n\n## Part 1 — When It Breaks (trigger conditions)\n\n1. **Long-running,\
      \ static-TTL sessions.** Fixed TTL is set once at creation/modification. An\
      \ interview with an *allowed duration longer than the TTL* will expire mid-interview\
      \ even if the candidate is actively answering, as long as no write-refresh happens:\n\
      \   ```\n   Redis TTL  = 30 min (set at session start)\n   Interview  = 60 min\
      \ allowed; user finishes Q7 at t=40min\n   → key expired at t=30min, Q7 submission\
      \ hits a dead session\n   ```\n2. **Slow side-effect operations.** AI streaming\
      \ / RAG retrieval can take longer than the *remaining* TTL. A 5-minute vector\
      \ search + LLM stream starting 2s before expiry kills the session while the\
      \ user still sees a spinner.\n3. **No heartbeat / sliding-window renewal.**\
      \ If you only refresh on *write* and reads don't touch TTL (`EXPIRE` on `GET`),\
      \ a user who is *reading* (idle between prompts, reviewing answers) lets the\
      \ key decay.\n4. **Multiple Redis keys with inconsistent TTLs.** `session:{id}`\
      \ may get 30min while `session:{id}:timer` gets 10min; one expires and the app's\
      \ partial load throws.\n5. **Eviction before TTL.** With `maxmemory-policy`\
      \ = `allkeys-lru`/`volatile-lru`, Redis can evict active session keys under\
      \ memory pressure *before* their TTL — the numeric TTL is wrong even when set\
      \ \"correctly.\"\n6. **Node failover / restart without persistence.** On a vola\
      \ README Redis restart, all keys vanish regardless of TTL; DB stays intact.\n\
      \n---\n\n## Part 2 — Why Continuation Specifically Breaks\n\nThe failure is\
      \ a **design failure to separate \"cache miss\" from \"session absent\"** and\
      \ a **failure to persist enough runtime state in the DB to recompute it**.\n\
      \n| Assumption (buggy) | Reality |\n|---|---|\n| \"No Redis key ⟹ session does\
      \ not exist\" | DB says the interview *is* open and valid |\n| \"Runtime state\
      \ lives only in Redis\" | After Redis expiry there is **no** way to know `current_question=7`,\
      \ `phase=\"timer_running\"`, or the partial answer buffer → cannot resume mid-interview\
      \ |\n| \"TTL alignment with interview validity\" | The two are never synchronized\
      \ |\n\nConsequences of the silent expiry:\n- User retries → cache miss → app\
      \ either (a) returns \"session expired / restart,\" discarding the *valid* DB\
      \ record, or (b) attempts continuation but cannot reconstruct runtime state,\
      \ restarting at Q1 while DB still says \"in progress.\"\n- Data is not lost\
      \ in the database, but **continuation semantics are lost** because the runtime\
      \ breadcrumb was ephemeral-only.\n\n---\n\n## Part 3 — Correct Architecture\n\
      \n### 3.1 Sliding TTL on every touch (heartbeat)\n```python\n# reading must\
      \ also refresh\ndef get_session(r, key):\n    pipeline = r.pipeline()\n    pipeline.get(key)\n\
      \    pipeline.expire(key, SESSION_TTL)      # sliding window\n    val, _ = pipeline.execute()\n\
      \    return val\n\n# origin serve: write once, slide on access\ndef start_or_continue(r,\
      \ interview_id):\n    state = r.get(f\"session:{interview_id}\")\n    if state\
      \ is None:\n        state = rebuild_from_db(interview_id)   # DB fallback, not\
      \ failure\n    r.setex(f\"session:{interview_id}\", SLIDING_TTL, state)\n  \
      \  return state\n```\n\n### 3.2 Distinguish \"miss\" from \"expired\" — DB is\
      \ the fallback, not the error branch\n```python\ndef load_session(r, db, interview_id):\n\
      \    cache = r.get(f\"session:{interview_id}\")\n    if cache is not None:\n\
      \        return json.loads(cache), \"cache\"\n    row = db.fetch_interview(interview_id)\
      \        # DB still valid\n    if row is None or row.status == \"closed\":\n\
      \        return None, \"not_exists\"                 # genuinely gone → error\n\
      \    state = hydrate(interview_id, db)             # rebuild: current Q, phase,\
      \ buffer\n    # persisted runtime snapshot in DB makes hydration exact\n   \
      \ r.setex(f\"session:{interview_id}\", SLIDING_TTL, json.dumps(state))\n   \
      \ return state, \"rehydrated\"\n```\n\n### 3.3 Persist the *minimum* runtime\
      \ routing state in the DB\nRedis should hold *hot* state; the DB should hold\
      \ enough to *reconstitute* it:\n```sql\nALTER TABLE interview_session\n  ADD\
      \ COLUMN current_question BINARY(16) NULL,\n  ADD COLUMN phase          ENUM('intro','question','timer_running','submitted','review')\
      \ NOT NULL DEFAULT 'intro',\n  ADD COLUMN state_json     JSON NULL,      --\
      \ partial answer buffer, RAG context ids\n  ADD COLUMN last_touch_at  TIMESTAMP(6)\
      \ DEFAULT CURRENT_TIMESTAMP(6);\n```\nRedis becomes a performance accelerator\
      \ for `state_json`; the DB is the recovery authority.\n\n### 3.4 Pick safe TTL\
      \ + refresh policy\n```\nSESSION_TTL = round(interview_max_duration * 1.5) \
      \  # never undercut allowed duration\n# or, simplest and safest:\n#   redis.conf\n\
      maxmemory-policy volatile-ttl        # keep soonest-to-expire? no—keep longest-lived:\n\
      maxmemory-policy noeviction          # prefer explicit error over silent eviction\
      \ (dev)\n# use RedisJSON/pipeline + SlidingExpiration per read/write\n```\n\n\
      ### 3.5 Persistence so restart ≠ loss\n```\nappendonly yes\nappendfsync everysec\n\
      ```\n\n### 3.6 Monitor the silent expiry\n```bash\n# keymiss counters detect\
      \ N cache-misses-that-silently-became-sessions\nredis-cli CONFIG RESETSTAT\n\
      redis-cli INFO stats | grep -i -E \"keyspace_hits|keyspace_misses|evicted_keys|expired_keys\"\
      \n# alert when expired_keys/keymisses spike during \"active\" hours\n```\nEmit\
      \ a metric whenever `load_session` returns `\"rehydrated\"` — a high rate means\
      \ TTL tuning is wrong.\n\n---\n\n## Part 4 — Decision-Guided Notes\n\nPer the\
      \ recalled patterns (vector/RAG session retrieval reuse, backend/distributed,\
      \ MySQL slow-query), the theme is consistent: **ephemeral store speed must never\
      \ make the persistent truth unrecoverable.** The RAG-context buffer (retrieved\
      \ chunks feed the next LLM prompt) is exactly the runtime state that is expensive\
      \ to recompute — persist it (`state_json`) rather than only caching it, so a\
      \ TTL expiry degrades to a re-cache, not to an aborted interview.\n\n---\n\n\
      ## Summary Checklist\n- ✅ Use **sliding** TTL refreshed on both read and write.\n\
      - ✅ Treat **DB as source of truth and fallback**; cache miss ⇒ rehydrate, never\
      \ \"end session.\"\n- ✅ Persist runtime routing state (`current_question`, `phase`,\
      \ `state_json`, `last_touch_at`) in the DB.\n- ✅ Size TTL > maximum possible\
      \ interview duration; handle long AI subtasks.\n- ✅ Use `appendonly yes` and\
      \ eviction policy that prefers explicit errors over silent key loss.\n- ✅ Instrument\
      \ `keyspace_misses` / `evicted_keys` / \"rehydrated\" counters to catch drift.\n\
      \nThe single highest-leverage fix is the one-line distinction in **Part 3.2**:\
      \ *\"cache miss → rebuild from DB, don't kill the session.\"*"
