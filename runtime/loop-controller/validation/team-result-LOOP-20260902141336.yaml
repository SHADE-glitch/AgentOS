      output: "# Contribution: Redis Fixed-TTL Session Expiry vs. Persistent DB Validity\n\
        \n**Role context:** Database Engineer — focusing on state-layer semantics,\
        \ consistency, and recovery design for the interview session runtime.\n\n\
        ## 1. The Core Problem Statement\n\nThere are **two distinct state stores**\
        \ in play:\n\n| Store | Nature | Validity driver |\n|-------|--------|-----------------|\n\
        | **DB** (persistent) | The source of truth — interview record, answers, user\
        \ profile | Permanent; outlives the request lifecycle |\n| **Redis (runtime/temporary)**\
        \ | Fast, ephemeral working set — reconstruction cache | TTL-bound; silently\
        \ deleted |\n\nThe DB \"remaining valid\" is **misleading**: it makes operators\
        \ believe the session is intact, when the *live session context* that rides\
        \ on Redis has already evaporated. Continuation breaks not because the interview\
        \ is lost, but because the **derived runtime cache** is gone.\n\n---\n\n##\
        \ 2. Why Continuation Breaks Even Though the DB Is Valid\n\nContinuation usually\
        \ means: *resume the interview from a checkpoint and reconstruct the in-flight\
        \ UI/interview state.*\n\nIt breaks for one (or more) of these reasons:\n\n\
        ### 2.1 The Redis state is **not reconstructible** from the DB\nThe DB may\
        \ persist `interview_id`, `question_id`, `user_id`, timestamps — but *not*\
        \ the ephemeral intent array, the queued next questions, the LLM conversation\
        \ context window, debounce counters, or partial \"draft\" answers. If the\
        \ reconstruct function only reads from the DB, it cannot rebuild Redis.\n\n\
        ```python\n# BROKEN: DB has the record, Redis is empty\ndef resume(interview_id):\n\
        \    row = db.fetch_interview(interview_id)          # still valid\n    live\
        \ = redis.hgetall(runtime_key(interview_id)) # {} -> expired\n    if not live:\n\
        \        raise ResumeError(\"runtime context lost\")    # continuation breaks\n\
        ```\n\n### 2.2 The resume path only reads Redis and never falls back\nA common\
        \ failure: the API checks Redis, finds nothing, and **returns an error / 401\
        \ / \"session expired\"** instead of triggering a DB→Redis rebuild. The state\
        \ machine has no \"cold-start / rebuild\" transition.\n\n### 2.3 TTL < expected\
        \ pause duration (the silent-kill case)\nFixed TTL (`EXPIRE hours 1`) ignores\
        \ user behavior:\n- Interview started → user leaves for 90 minutes → returns\
        \ → Redis expired → resume fails.\n- The **DB happily reports the interview\
        \ is \"in progress\"** → contradiction between two layers.\n\n### 2.4 Time-based\
        \ vs. **activity-based** expiry mismatch\nA *fixed* TTL is wrong for an interactive\
        \ session. The correct model is **sliding / activity-based TTL** — refresh\
        \ on every heartbeat, keypress, or PING. Fixed TTL is deterministic in the\
        \ DB but arbitrary for human-paced workloads.\n\n### 2.5 Idempotency / double-commit\
        \ divergence\nIf TTL tricks cause an eviction *mid-write*, the DB may hold\
        \ a partial commit while Redis held the \"about to persist\" buffer. Continuation\
        \ then reads DB as valid but the data is logically incomplete.\n\n---\n\n\
        ## 3. Design Recommendations (as Database Engineer)\n\n### 3.1 Separate \"\
        reconstructible\" from \"non-reconstructible\" state\nBucket Redis data by\
        \ whether it can be rebuilt from the DB:\n\n- **Rebuildable (safe to expire):**\
        \ recomputable from DB — discard freely.\n- **Non-rebuildable (must survive):**\
        \ LLM context window, user-facing in-flight draft — must have DB shadow or\
        \ longer/job-based TTL.\n\n### 3.2 Use **sliding TTL**, not fixed (whenever\
        \ interaction-paced)\n```bash\n# Redis: sliding expiry — refreshed on activity\n\
        redis-cli GETEX ___SESSION_KEY EX 1800   # or RENEW\n```\nStore an `update_ttl\
        \ = true` heartbeat. Replacement of plain `EXPIRE` with per-access sliding\
        \ resets the window each time the user is active.\n\n### 3.3 Make TTL a **parameterized,\
        \ safety-conscious value**\n- Never arbitrarily small. Tie minimum TTL to\
        \ the *maximum* plausible pause (default: hours, not minutes).\n- Add jittered\
        \ longer \"grace\" TTL on the DB commit record so a foreground extension is\
        \ possible while Redis evicts.\n\n```python\nTTL = config(\"SESSION_TTL\"\
        , default=2*3600)  # 2h hard floor\nSliding window on top.\n```\n\n### 3.4\
        \ Implement a **rebuild-on-miss** cold path (the actual fix for continuation)\n\
        The resume endpoint must not fail on Redis miss — it must reconstruct:\n\n\
        ```python\ndef resume(interview_id):\n    row = db.fetch_interview(interview_id)\n\
        \    live = redis.hgetall(runtime_key(interview_id))\n    if not live:\n \
        \       live = rebuild_runtime_from_db(row)   # reconstruct Redis\n      \
        \  redis.hset(runtime_key(interview_id), mapping=live)\n        redis.expire(runtime_key(interview_id),\
        \ TTL)\n    return live\n```\n\n### 3.5 Embed a **versioned watermark** so\
        \ staleness is detectable\nStore `db_version` (e.g. `updated_at`/row version)\
        \ alongside Redis state. On resume, if `redis.version < db.version`, treat\
        \ Redis as stale and force rebuild — this reconciles \"DB valid + Redis valid-but-stale\"\
        .\n\n### 3.6 Add observability for silent expiry\n- Expose a `delete`/`eviction`\
        \ counter (Redis `evicted_keys`) and a separate metric for \"resume-with-Redis-miss\"\
        .\n- Alert when the DB says `active` but Redis has no matching key — this\
        \ is the exact silent-divergence you want caught.\n\n### 3.7 Backstop: TTL\
        \ is a *hint*, not a consistency guarantee\nTreat Redis as a **cache** with\
        \ configurable loss tolerance; make the **DB the single source of truth**\
        \ for anything that *must* survive. Any behavior depending on Redis surviving\
        \ is a bug by construction.\n\n---\n\n## 4. Concrete Config Cheat-Sheet\n\n\
        ```conf\n# redis.conf / persistence\nmaxmemory-policy volatile-lfu      #\
        \ only evict TTL'd keys, never DB-backed blobs\nmaxmemory-sample 10\n\n# application\n\
        SESSION_RUNTIME_TTL     = 2h        # hard floor\nSLIDING_TTL            \
        \ = true      # refresh on heartbeat (enabled by default)\nREBUILD_ON_MISS\
        \          = true     # resume rebuilds from DB, never errors\nVERSIONED_STATE\
        \          = true     # store db row version in the Redis hash\nEVICTION_ALERT_PATTERN\
        \   = \"db_active_but_redis_empty\"\n```\n\n---\n\n## 5. Summary Answer\n\n\
        Continuation breaks **not because the interview is lost, but because the layer\
        \ that carries live runtime context (Redis) silently outlived its TTL while\
        \ the durable layer (DB) stayed intact**. The root causes are: (1) runtime\
        \ state that is *not* DB-reconstructible, (2) a resume path that hard-fails\
        \ on Redis miss instead of rebuilding, (3) fixed (non-sliding) TTL that does\
        \ not track real user activity, and (4) no version check to detect stale-but-present\
        \ Redis state. **Fix = sliding TTL + DB-as-source-of-truth + rebuild-on-miss\
        \ + version watermark + eviction telemetry.**\n\n---\n\n*Supporting skills\
        \ referenced:* **Security Engineer** (ensure eviction/token rotation doesn't\
        \ leak in-flight data), **Code Reviewer** (validate the rebuild path and idempotency),\
        \ **Backend Architect** (layer consistency contract between Redis and DB)."
