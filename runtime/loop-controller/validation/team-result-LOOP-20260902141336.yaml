      output: "I've grounded my analysis in the actual code. Here is my security-engineer\
        \ contribution for lead review.\n\n---\n\n## Security Review: Fixed-TTL Redis\
        \ Session State vs. Persistent DB\n\n**Files examined**\n- `backend/src/main/java/com/aiview/interview/service/InterviewStateStore.java:25,51`\
        \ — `TTL_HOURS = 24`, sliding `set(json, 24h)` on every write.\n- `backend/src/main/java/com/aiview/interview/service/InterviewService.java:380-399`\
        \ — `requireAsking(...)` DB fallback when Redis key is `null`.\n- `backend/src/main/java/com/aiview/interview/service/InterviewService.java:125-195`\
        \ — `answer`/`answerStream` continuation path (DB update, then Redis write,\
        \ inside Redisson lock).\n\n### 1. What the TTL actually is\nIt is a **sliding**\
        \ TTL, not fixed-duration-per-session: `InterviewStateStore.write` calls `set(json,\
        \ TTL, HOURS)`, which **resets the 24h clock on every answer**. So expiry\
        \ only fires on **≥24h of inactivity**, not 24h from creation. That detail\
        \ matters for the failure analysis below.\n\n### 2. When continuation breaks\
        \ — and the subtle \"why\"\nThe exit check in `requireAsking` is: Redis key\
        \ missing → rebuild from DB → **re-write Redis with a fresh 24h TTL**. So\
        \ in the *common* case Redis-null is self-healing and the break is masked.\
        \ The genuine break is **not** a loud 500 — it is a **silent state regression**:\n\
        \n**A. Runtime transition held only in Redis, DB is stale-valid (THE silent\
        \ break).**\nTransitions follow \"write DB → write Redis\" under a lock, but\
        \ they are **not atomic**. If Redis holds the *latest* transition and is then\
        \ evicted (idle 24h, or Redis flush, or `write` failing *after* the DB write\
        \ on a busy TTL boundary), the fallback reconstructs state purely from DB\
        \ columns. A \"valid\" DB row can be **older** than what Redis last held:\n\
        - `questionCount` rewinds → a question that was already asked is re-issued\
        \ to the user (re-ask).\n- `currentQuestionId` reverts → the live question\
        \ resets.\n- It now writes this stale snapshot back as the authoritative state,\
        \ so the interview **silently continues from an earlier point** rather than\
        \ resuming. Continuation \"succeeds\" but the interview is corrupted. Redis\
        \ gives no `onDelete` hook, so nothing detects or logs the regression.\n\n\
        **B. Idle-in-ASKING expiry, no heartbeat.**\nAn `ASKING` session idle ≥24h\
        \ loses the key. Recovery depends entirely on DB `status/questionCount/currentQuestionId`\
        \ being current at that instant — true only if the last answer's DB write\
        \ committed. It usually does, but this couples continuation correctness to\
        \ the Redis-write-after-DB-write window with no reconciliation sweep.\n\n\
        **C. Finished-session continuation UX.**\nIf DB is FINISHED but the key expired,\
        \ a stale retry hits `INTERVIEW_FINISHED` at `requireAsking` (`InterviewService.java:391-393`).\
        \ Correct-but-harsh: the user resumes to a wall with no resume/result context,\
        \ because the feedback/result linkage lived in Redis which is gone.\n\n###\
        \ 3. Security implications (why this is a security matter)\n- **State-integrity\
        \ / session-confusion surface.** The Redis state is the state-machine authority\
        \ (`InterviewService.java:15`), but DB is the authorization authority (session\
        \ ownership, `requireOwnedSession`). A fixed TTL creates a **divergence window**\
        \ where authorization says \"valid, owned\" while unused persistent state\
        \ says nothing. Divergence = confused-deputy risk: a held/known `sessionId`\
        \ can be re-entered into a freshly-rehydrated, silently-rewound state.\n-\
        \ **TOCTOU on the fallback.** `requireAsking` decides \"rebuild vs. throw\"\
        \ based on `read()==null`, then re-writes. That read-check-then-rebuild is\
        \ a textbook TOCTOU, made worse by the non-atomic DB/Redis write.\n- **Re-ask\
        \ / replay.** Silent rewinds let previously-captured answers be answered again,\
        \ which pollutes scoring (`evaluationService`), not just UX.\n- **No auditability.**\
        \ Cache-eviction eviction is invisible: no expiring-event, no `purpose`/why\
        \ on deletion, so an operator can't distinguish \"legit finish\" from \"silently\
        \ forgotten session.\"\n\n### 4. Recommendations\n1. **Make DB the single\
        \ truth; demote Redis to cache.** Keep the DB FINISHED transition as the terminal,\
        \ clearing the key deterministically. On every `answer`, write DB first, *then*\
        \ Redis; add a periodic reconcile sweep that reads DB rows and re-syncs/expires\
        \ stale keys so Redis never holds ahead-of-DB state long enough to regress.\n\
        2. **Replace the fixed number with an explicit policy:** sliding idle TTL\
        \ (refresh on op) + a business-defined absolute lifetime enforced in the **DB**\
        \ (`started_at`,`finished_at`/policy), not only in cache — so continuation\
        \ semantics are deterministic and auditable, not dependent on eviction.\n\
        3. **Add eviction detection + audit:** subscribe to Redis **keyspace `expired`/`del`\
        \ notifications** (or Redisson `RBucket` `expire` watcher + scheduled reconcile)\
        \ and log/alert on `interview:session:*` expiry. This converts silent expiry\
        \ into an observable event.\n4. **Idempotency/re-ask guard on fallback:**\
        \ on rehydration, verify `currentQuestionId` isn't already consumed in `interview_message`\
        \ before re-issuing, so a regressed snapshot cannot re-ask a question already\
        \ answered.\n5. **Drop Redis presence as any authz gate** (it already is not,\
        \ which is good — make it explicit in a comment/contract so future changes\
        \ don't regress it).\n\n### 5. Illustrative fix sketch\n```java\n// Slide\
        \ TTL on activity, but never let a finished/terminal state regress.\npublic\
        \ void write(Long sessionId, SessionState state) {\n    String json = objectMapper.writeValueAsString(state);\n\
        \    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \    if (InterviewStatus.FINISHED.name().equals(state.status())) {\n     \
        \   bucket.set(json, ABSOLUTE_FINISH_TTL_MINUTES, TimeUnit.MINUTES); // short,\
        \ non-sliding\n    } else {\n        bucket.set(json, IDLE_TTL_HOURS, TimeUnit.HOURS);\
        \                // sliding, refreshed per op\n    }\n}\n\n// Reconciliation\
        \ sweep (scheduled): fix silent eviction + partial-write divergence.\n// DB\
        \ is truth; prune keys whose DB row is FINISHED/nonexistent; rehydrate ASKING\
        \ orphans.\n```\n**Net:** the only safe behavior when \"DB is valid but Redis\
        \ is gone\" is controlled rehydration from a DB that is confirmed committed-truth\
        \ — under the existing lock — plus eviction observability. Do **not** gate\
        \ continuation on Redis presence.\n\nReady for lead review."
