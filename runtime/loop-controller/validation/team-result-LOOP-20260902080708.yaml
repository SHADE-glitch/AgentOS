        atomically (`version = version + 1`) to prevent lost-update races.

        - **F3:** `AFTER_COMMIT` narrows but does *not* close the strand window (crash
        between commit and listener). Prefer a compensation delete; use outbox only
        if exactly-once is truly required. Don''t oversell AFTER_COMMIT as an atomicity
        fix.

