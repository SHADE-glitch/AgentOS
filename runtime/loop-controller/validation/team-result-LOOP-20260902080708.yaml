        \n### C. Fix Redis eviction policy\nPrevent the cache layer from silently\
        \ deleting live sessions under memory pressure. Give runtime-state keys a\
        \ dedicated Redis DB or name prefix, and avoid `allkeys-*` policies for that\
        \ logical database:\n\n```\nmaxmemory-policy volatile-lru    # only evict\
        \ keys with TTL, prefer long-idle\n```\n\nOr keep TTL keys on `volatile-lru`\
        \ and pin the \"current session pointer\" with no expiry on a separate DB.\
        \ Never use `allkeys-random`/`allkeys-lru` for session data.\n\n### D. Detect\
        \ now, so it degrades predictably\nWire in observability before it breaks\
        \ your SLOs:\n\n```\nRedisMissRate.bucket(profile=\"interview_session\")\n\
        RedisExpired{type=\"runtime_state\"}      -- expect ~0 if sliding TTL works\n\
        RedisEvicted{type=\"runtime_state\"}      -- should be 0; >0 flags eviction\
        \ bug\nAlert if (misses where db_packet_exists > 0) → silent data-lookalike\
        \ bug\n```\n\n## 6. Recommended Configuration Summary\n\n| Concern | Setting\
        \ |\n|---------|---------|\n| TTL type | **Sliding** (reset on read), not\
        \ fixed |\n| Max idle | 30–60 min, tuned to real max inactivity distribution\
        \ |\n| DB persistence | Checkpoint every question **and** every N answer edits\
        \ |\n| Eviction policy | `volatile-lru`, isolate session keys from `allkeys-*`\
        \ |\n| Cache miss behavior | Rehydrate from DB packet; fail only if no durable\
        \ packet |\n| Metrics | Miss/expiry/eviction rate per session-id namespace\
        \ |\n\n## 7. Bottom Line for Lead Review\n\n**When:** continuation breaks\
        \ on *any* gap between the fixed TTL and actual session activity — idle pages,\
        \ long answers, paused timers, service restarts, or memory-driven eviction.\n\
        \n**Why:** Redis is the sole holder of progress-critical runtime state, yet\
        \ is configured with a blanket fixed TTL that doesn't reflect activity, has\
        \ no durable checkpoint to rebuild from, and has a silent-fail read path.\
        \ A fixed TTL models \"absolute maximum age,\" but session continuity needs\
        \ **\"max idle time\"** plus **an authoritative recovery source (DB checkpoint)\
