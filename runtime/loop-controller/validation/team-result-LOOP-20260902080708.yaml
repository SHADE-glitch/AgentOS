        \ Continuation\n\n## 1. Architecture Context\n\nInterview sessions have two\
        \ distinct data concerns:\n\n| Layer | Storage | Contents | Lifespan |\n|-------|---------|----------|----------|\n\
        | **Runtime state** | Redis | conversation history, current question index,\
        \ partial/scored answers, per-question timers, retry counts, token/attempt\
        \ budget | Short-lived (session) |\n| **Durable state** | DB | candidate profile,\
        \ session record, final answers, scores, audit log, resume token | Long-lived\
        \ |\n\nThe bug is that the system **reads/writes Redis as if it were the source\
        \ of truth for runtime state**, but gives the runtime state a **fixed short\
        \ TTL** that is **not refreshed on activity**. When the key expires, Redis\
        \ has no runtime state; the DB remains valid but describes a session that\
        \ can no longer be *continued* — only *restarted or failed*.\n\n## 2. When\
        \ Continuation Breaks\n\n1. **Mid-session inactivity that exceeds the fixed\
        \ TTL.** A candidate is answering a long-form question, or the page is left\
        \ open > TTL. A single unanswered request window lets the key die. On the\
        \ next request (`GET session:{id}:state`) → cache **miss**. \n2. **Long-running\
        \ actions spanning > TTL.** Multi-part upload, proctoring heartbeat intervals,\
        \ or a paused timer that takes longer than the TTL to resume.\n3. **Every\
        \ restart of the service's runtime layer** if TTL is coupled to something\
        \ non-session-lifetime (e.g., TTL set equal to an auth token expiry, not to\
        \ session activity).\n4. **Redis eviction under `maxmemory`.** Even *before*\
        \ TTL, an `allkeys-lru`/`allkeys-random` policy can evict active session keys\
        \ under memory pressure — silent and sooner than expected.\n\nCritical detail:\
        \ because the TTL is **fixed** and not reset on access, even an *actively\
        \ used* session expires if the policy (Redis default is no expiry, but this\
        \ app sets a hard TTL) isn't sliding.\n\n## 3. Why It Breaks (Root Causes)\n\
        \n1. **Cache treated as source of truth for ephemeral-progress data.** Runtime\
        \ state exists *only* in Redis. There is no authoritative durable copy of\
        \ \"in-flight progress,\" so a miss cannot be reconstructed — only the last\
        \ *committed/milestone* state exists in the DB.\n2. **Fixed (non-sliding)\
        \ TTL.** Each key is stamped once at creation. Redis has `EXPIRE`, not a native\
        \ \"reset on read.\" The app must call `PEXPIRE` on every read/write; if it\
        \ doesn't, TTL counts down regardless of activity.\n3. **No checkpoint/milestone\
        \ persistence.** The DB row is written only at the end (submit) or at coarse\
        \ milestones. The fine-grained runtime state (which question, accumulated\
        \ answers, timer budget) is never flushed to a resumable form.\n4. **No write-behind\
        \ cadence decoupled from the primary key TTL.** Commit cadence and runtime-TTL\
        \ are tangled — one denominator, two unrelated lifetimes.\n5. **Silent failure\
        \ handling.** A miss is mapped to a hard fault (`throw`, 500, \"session expired,\
        \ start over\") instead of a recovery path (rehydrate from DB + resume token).\n\
        \n## 4. Diagnostic: How to Prove It\n\n```bash\n# 1. Confirm the key and its\
        \ fixed TTL\nredis-cli TTL interview:session:12345:state\n\n# 2. See creation\
        \ vs. last access — if TTL never resets on access, expiry on activity is confirmed\n\
        redis-cli DEBUG OBJECT interview:session:12345:state\n\n# 3. Check eviction\
        \ policy (drives early eviction)\nredis-cli CONFIG GET maxmemory-policy\n\n\
        # 4. Observe expiry volume in server stats\nredis-cli INFO stats      # keyspace_hits\
        \ / keyspace_misses / evicted_keys / expired_keys\n```\n\nGrep the app for\
        \ where TTL is set:\n- `EXPIRE set` once at creation → fixed TTL, no sliding.\n\
        - No `PEXPIRE` on the read path → active sessions expire.\n- Read path does\
        \ `GET` → miss → `throw` without a DB rehydration branch.\n\n## 5. Fixes (in\
        \ priority order)\n\n### A. Sliding/Rolling TTL — refresh on every access\
        \ (minimum ask)\nReset the TTL on each read/write so active sessions never\
        \ die.\n\n```redis\nMULTI\nINCR interview:session:{id}:access_count\nEXPIRE\
        \ interview:session:{id}:state 1800   -- reset to 30min sliding\nEXEC\n```\n\
        \nApp layer:\n\n```python\nclass SessionStore:\n    RUNTIME_TTL = 1800  #\
        \ seconds, sliding\n\n    def get(self, sid: str) -> dict | None:\n      \
        \  key = f\"interview:session:{sid}:state\"\n        state = self.redis.get(key)\n\
        \        if state is not None:\n            # sliding TTL: refresh on every\
        \ successful access\n            self.redis.expire(key, self.RUNTIME_TTL)\n\
        \        return json.loads(state) if state else None\n\n    def set(self,\
        \ sid: str, state: dict) -> None:\n        key = f\"interview:session:{sid}:state\"\
        \n        self.redis.set(key, json.dumps(state), ex=self.RUNTIME_TTL)\n```\n\
        \nNow TTL is a *max-idle* timeout, not an absolute lifetime.\n\n### B. Checkpoint\
        \ milestones to DB + resume-on-miss (correct fix)\nWrite a durable \"packet\"\
        \ at every milestone (question boundary, answer keystroke debounced, timer\
        \ tick) so a miss can be rebuilt:\n\n```sql\n-- session_packets (append-only,\
        \ resumable)\nINSERT INTO session_packets (session_id, seq, state_json, created_at)\n\
        VALUES (:sid, :seq, :state, now())\nON CONFLICT (session_id, seq) DO NOTHING;\n\
        ```\n\nOn cache miss, rehydrate instead of failing:\n\n```python\ndef get(sid):\n\
        \    state = cache.get(sid)\n    if state is not None:\n        cache.expire(sid,\
        \ SLIDING)\n        return state\n    # cache miss -> reconstruct from durable\
        \ checkpoint\n    last = db.last_packet(sid)\n    if last is None:\n     \
        \   raise SessionNotFound(sid)          # genuinely new/never started\n  \
        \  state = last.state\n    cache.set(sid, json.dumps(state), ex=SLIDING) \
        \ # warm back up\n    return state\n```\n\nThis changes continuation from\
