    summary: '# Redis Session TTL vs. Persistent DB: When Continuation Breaks


      ## 1. The core asymmetry


      Two stores with fundamentally different durability semantics:


      - **DB (durable)** — the interview session, it'
    output: "# Redis Session TTL vs. Persistent DB: When Continuation Breaks\n\n##\
      \ 1. The core asymmetry\n\nTwo stores with fundamentally different durability\
      \ semantics:\n\n- **DB (durable)** — the interview session, its questions, answers,\
      \ and state transitions persist with *no TTL* (or a very long one). Authoritative\
      \ source of truth.\n- **Redis (volatile runtime cache)** — holds \"current step\"\
      , transcript buffer, live clock, interactive state. Written with a **fixed**\
      \ `EXPIRE key seconds`, where `seconds` is absolute and does not slide on activity\
      \ unless you explicitly re-EXPIRE.\n\nThe failure is a **TTL model mismatch**:\
      \ the DB is keyed by validity of the record, Redis by the wall-clock age of\
      \ the write. Fixing nothing but the time window causes them to diverge.\n\n\
      ## 2. Exact scenarios where it silently expires\n\n### 2.1 Fixed (absolute)\
      \ TTL counted from creation — the prototypical case\nThe TTL is set once when\
      \ the session is created and **never refreshed** on subsequent activity.\n\n\
      | elapsed | Redis key | DB row |\n|---|---|---|\n| 0s   | write `EX 3600` (expiry\
      \ 15:00) | created, valid |\n| 1h   | expired → `nil` | still valid |\n| user\
      \ hit \"Continue\" | **MISS** | present |\n\nA long-but-legitimate interview\
      \ takes longer than the fixed window. Each answer updates the data in Redis\
      \ but **not the TTL**, so the clock keeps counting from the *first* write.\n\
      \n```python\n# Broken: fixed TTL, no refresh\nredis.setex(f\"session:{sid}:runtime\"\
      , 3600, encode(state))   # expiry fixed at creation\n# ... later steps just\
      \ overwrite value, never touch TTL\nredis.set(f\"session:{sid}:runtime\", encode(state))\
      \           # no EXPIRE!\n```\n\n`SET key value` (without `EX`) leaves the existing\
      \ TTL intact — the deadline is still the original 1h from creation. The session\
      \ dies mid-interview.\n\n### 2.2 Writes without re-`EXPIRE`\nEven if each answer\
      \ calls `SETEX` at step N, if step N writes at minute 50 with the *same* fixed\
      \ 3600, the clock resets — that *would* work. The silent bug is the mixed pattern:\
      \ creation uses `SETEX`, follow-ups use plain `SET` (or `HSET`). Redis never\
      \ removes TTL on `SET`, so partial refresh is subtle.\n\n```python\n# Initialize\
      \ once\nredis.hset(f\"session:{sid}\", \"step\", \"q3\")\nredis.expire(f\"session:{sid}\"\
      , 1800)\n\n# Bad: updates the hash but does NOT reset the deadline\nredis.hset(f\"\
      session:{sid}\", \"answers\", json.dumps(answers))   # TTL still 1800 from init\n\
      ```\n\n### 2.3 Idle-while-valid (no sliding window)\nUser opens the interview,\
      \ reads a long question, types for 20 min between asks. The runtime state is\
      \ *live and correct*, but it was never refreshed, so the fixed TTL fires. There\
      \ is **no activity to refresh, but also no expiry of *intent*** — fail only\
      \ because of the model. The DB never penalizes inactivity the same way.\n\n\
      ### 2.4 Redis eviction (maxmemory policy) removes it early\nIf `maxmemory-policy`\
      \ is `allkeys-lru`, `allkeys-random`, `volatile-lru`, or `volatile-ttl`, Redis\
      \ can evict a still-fresh session key **before** its natural TTL to make room.\
      \ DB is unaffected (it's not in Redis).\n\n```\nmaxmemory-policy allkeys-lru\
      \   # a burst of other keys evicts the session state unexpectedly\n```\n\n###\
      \ 2.5 Key/namespace drift across versions\nState written under `session:v2:{sid}`\
      \ while continuation code (old build still reading clients, or a config change)\
      \ reads `session:v1:{sid}`. Old key expires normally; new writes go elsewhere.\
      \ DB is keyed only by `sid` and stays valid, amplifying the mismatch.\n\n###\
      \ 2.6 Clock skew across replicated app servers\nCompute \"remaining TTL\" on\
      \ server A as `creation + fixed - now_A`, but writer server B's clock is offset.\
      \ Server B refreshes with `PEXPIREAT creation+3600` computed from a different\
      \ clock, so refresh is either too short or too long — eventual expiry looks\
      \ random.\n\n### 2.7 Lazy expiration / read-side masking right at the boundary\n\
      `EXPIRE` can be lazy: Redis expires a key at read/access time. At the boundary\
      \ you get `nil` for the TTL and the data simultaneously — a race where \"looks\
      \ valid a millisecond ago\" but \"gone now,\" and **no error is thrown**, so\
      \ callers treat it as \"session not found\" rather than \"recoverable.\"\n\n\
      ## 3. Why expiration is *silent* and why continuation breaks\n\n- `MGET`/`GET`\
      \ on a missing key returns **`nil`/`None`, not an exception**. Code written\
      \ as \"if state is None → `HTTP 404 / GONE`\" interprets a transient infra expiry\
      \ as a *permanent* missing session.\n- No active callbacks fire on expiry; Redis\
      \ just drops the data. Nothing tells the DB layer \"re-hydrate from DB.\"\n\
      - The resume path reads only Redis first; with no grace path back to the DB,\
      \ the row in the DB is never consulted, so the valid DB record is never used\
      \ to rebuild the runtime state.\n\n```python\ndef resume(sid):\n    raw = redis.get(f\"\
      session:{sid}:runtime\")\n    if raw is None:\n        # The DB row EXISTS and\
      \ is valid, but we never look.\n        return abort(404, \"Session not found\"\
      )   # silently broken continuation\n    return json.loads(raw)\n```\n\n## 4.\
      \ Fixes & concrete recommendations\n\n### 4.1 Sliding expiration per active\
      \ step\nRefresh the TTL on *every* meaningful interaction; expire only on sustained\
      \ inactivity:\n\n```python\ndef touch(sid, ttl=3600):\n    key = f\"session:{sid}:runtime\"\
      \n    redis.hset(key, \"step\", current_step)   # write\n    redis.expire(key,\
      \ ttl)                  # slide the window\n    return key\n```\n\nNow expiry\
      \ means \"abandoned for 1h,\" matching user intent instead of wall clock since\
      \ start.\n\n### 4.2 Store an expiry *deadline* in the DB too, and check it there\n\
      Persist `expires_at` in the DB at session creation. Continuation logic uses\
      \ the **DB deadline**, not the Redis TTL, as the authority:\n\n```python\n#\
      \ on resume\nsession = db.get_session(sid)              # authoritative\nif\
      \ time.time() > session.expires_at:\n    return abort(410, \"expired\")\nif\
      \ (remaining := session.expires_at - time.time()) > 0:\n    redis.setex(f\"\
      session:{sid}:runtime\", min(int(remaining), 3600), encode(state))\n```\n\n\
      ### 4.3 Rebuild (lazy re-hydration) instead of 404\nOn Redis `MISS`, check DB;\
      \ if DB is valid and unexpired, reconstruct runtime state and re-warm Redis\
      \ transparently — continuation resumes seamlessly:\n\n```python\ndef resume(sid):\n\
      \    state = redis.get(f\"session:{sid}:runtime\")\n    if state is None:\n\
      \        return rebuild_from_db(sid)   # valid DB? rebuild cache, 200\n    return\
      \ state\n```\n\n### 4.4 Config guardrails\n- Set `maxmemory-policy noeviction`\
      \ (or `volatile-ttl`) so session keys aren't evicted early; use `volatile-ttl`\
      \ sparingly since it *does* evict soon-to-expire keys (which are exactly your\
      \ boundary sessions).\n- Run a background **refresher**: a cron/worker re-`EXPIRE`s\
      \ all live sessions below a threshold (e.g. remaining < 10 min → reset to 1h)\
      \ as long as the DB `expires_at` hasn't passed.\n- Compare clocks (NTP) on all\
      \ app nodes before using `PEXPIREAT`.\n\n### 4.5 Unified key scheme + versioning\n\
      Use `session:{sid}:runtime` with a single source that both writer and reader\
      \ derive, so a version bump doesn't strand state under an old namespace and\
      \ cause false expiries.\n\n## 5. Decision summary\n\nContinuation breaks **because\
      \ the DB's validity model (row exists, persisted) and Redis's model (wall-clock\
      \ age of the write, or eviction) diverge**, and the resume path trusts only\
      \ the Redis lookup. The single highest-leverage fix is **sliding TTL on activity\
      \ + DB-Authoritative deadline + lazy re-hydration from the DB on miss**, which\
      \ converts silent expiry into either a graceful `410` or a transparent cache\
      \ rebuild.\n\nDomain note (AI troubleshooting): when diagnosing \"user says\
      \ the interview vanished,\" always check **whether Redis evicted the key** (`INFO\
      \ stats` `evicted_keys` delta, `MAXMEMORY` logs) versus **natural TTL expiry**\
      \ — they have different root causes and different fixes (capacity vs. TTL model)."
