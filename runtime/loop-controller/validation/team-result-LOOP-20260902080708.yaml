      output: 'Support contribution written to `contribution-database-engineer-support.md`
        for lead review.


        ## Summary for lead review


        **When continuation breaks (primary case A + adjacent):** the Redis key `bucket.set(key,
        json, TTL=24h, HOURS)` is a **fixed write-TTL**, i.e. `SET ex 86400` reset
        on every write — not "24h from creation." So an `ASKING` session idle >24h
        silently drops its Redis key while the MySQL `interview_session` row (no TTL,
        `updated_at`) stays valid. Resuming then keys entirely off whether the `requireAsking()`
        null-fallback exists and is lossless.


        **Why (DB view):** `requireAsking()` treats Redis as the declared single authority
        and falls back to the DB *only on exact null*. That''s a contract violation
        — Redis is simultaneously declared authoritative and permitted to silently
        drop data. And the fallback keys on **presence, not freshness**, so present-but-stale
        Redis (case D: Redis write fails after DB commit) slips through undetected;
        any runtime-only state not mirrored to the DB is lost on expiry.


        **Durable fix:** DB = single source of truth, Redis = rebuildable read-through
        cache. (1) correct the `:15` "Redis authoritative" contract; (2) add `version`/`updated_at`
        and stall-aware fallback (`redis.version < db.version → rehydrate`), closing
        case D; (3) compensation outbox/`AFTER_COMMIT` for the dual-write gap; (4)
        DB-side idle sweep instead of silent Redis expiry; (5) explicit `maxmemory-policy`
        + alerting on `expired_keys`/`evicted_keys` and reconstruction-storm throttling.
        Sliding TTL on read is only a band-aid (fixes A, not B/C/D).


        Key calls highlighted for the lead: it''s a dual-write consistency problem,
        and the DB migration + stale-aware fallback (`ALTER TABLE` + `fallback_to_db`
        predicate) plus config (`volatile-lru`, noeviction guardrails) are the concrete
        deliverables my scope owns.'
