        ## 1. Problem Statement


        Two-state storage for a session''s lifecycle:

        - **Runtime state (Redis)** – in-progress data: current quest'
      output: "# Interview Session Runtime State: Redis TTL Expiry vs. DB Validity\n\
        \n## 1. Problem Statement\n\nTwo-state storage for a session's lifecycle:\n\
        - **Runtime state (Redis)** – in-progress data: current question index, answering\
        \ timestamp, active timer, transient flags, counter/lock tokens. Written fast,\
        \ read hot-path.\n- **Canonical state (DB)** – durable truth: the session\
        \ record, its `status` (e.g. `active`), progress snapshot, answer history.\n\
        \nA fixed TTL on the Redis key means the *runtime* layer can vanish while\
        \ the *authoritative* layer (the DB) still says the session \"exists and is\
        \ valid.\" This is an intentional-but-dangerous design: TTL is being used\
        \ as an **eviction/cleanup mechanism** (a bug) instead of purely as an **ephemeral\
        \ cache** (a legitimate use).\n\n## 2. When Continuation Breaks\n\nContinuation\
        \ means: a user resumes an interview and the system must rebuild trustworthy\
        \ in-progress context. It breaks in these concrete cases:\n\n| # | Failure\
        \ mode | Root cause |\n|---|--------------|-----------|\n| 1 | **Silent expiry\
        \ mid-session** | TTL exceeded while user is idle (thinking, composing). On\
        \ resume, Redis key is gone; the resumable snapshot was *only* in Redis. |\n\
        | 2 | **Cashier / refresh restore** | Post-resume, the app reads Redis → miss\
        \ → falls through to DB → DB says `status=active`, but the sub-state (question\
        \ X, elapsed time, partial answers) is not in DB → session cannot be reconstructed.\
        \ State is **irrecoverable**. |\n| 3 | **Partial/self-healing rebuild** |\
        \ App re-initializes a fresh session from DB defaults, silently resetting\
        \ progress — user loses work, or worse, duplicates progress/answers that were\
        \ already persisted. |\n| 4 | **Split-brain / zombies** | TTL expires only\
        \ on one replica of the key (if `RANDOM_LRU` or sharded), while a concurrent\
        \ request on another node still holds the old context → two writers, divergent\
        \ writes. |\n| 5 | **Under-estimated TTL throttles long tasks** | \"Time to\
        \ answer\" can legitimately exceed the chosen TTL (e.g., TTL 15 min, user\
        \ takes 20 min). System interprets absence as \"session abandoned.\" |\n|\
        \ 6 | **Timer drift** | The TTL is used to emulate a deadline/lease. Expiry\
        \ is later than the DB-level deadline (or vice versa), so the DB gate passes\
        \ while the runtime gate has silently closed — inconsistency between the two\
        \ authority layers. |\n\n## 3. Why Ordering Makes It Worse\n\nThe failure\
        \ is amplified by **when Redis is written relative to the DB write**:\n\n\
        - **Redis written first, DB second:** a crash/error between the two leaves\
        \ Redis with data the DB never confirmed → expiry then discards state that\
        \ was never durable. Continuation relies on the process that died.\n- **DB\
        \ written first, Redis second:** the DB is canonical, so Redis is only a projection\
        \ — this is the *safer* order. Redis should be **derivable from the DB** so\
        \ an expiry is a mere cache miss, not a data-loss event.\n\nAssertion for\
        \ the review:\n> **A Redis key may expire only when losing its contents is\
        \ safe.** If the DB must be able to restore it, the key is a **cache with\
        \ TTL** (fine). If DB *cannot* restore it, the TTL is misused as GC — this\
        \ is the bug.\n\n## 4. Design Principles (Database-Engineer View)\n\n1. **Define\
        \ the Redis layer as purely a derivative cache.** Every field under a session\
        \ key must be reproducible from the DB (or from a dedicated sequence/event\
        \ log). Then expiry = reload, never data loss.\n2. **Never encode authority\
        \ in TTL.** Deletion/cleanup (\"did the user abandon?\") must be a DB-level,\
        \ explicit transition (`status = abandoned` + timestamp). Redis expiry must\
        \ not *imply* semantic state.\n3. **Make the effective validity = min(Redis\
        \ alive, DB valid).** Continuation must fetch *both* gates, and path through\
        \ DB authority on Redis miss.\n4. **Use DB as source of truth for resumable\
        \ snapshot:** persist per-progress checkpoint (question_id, started_at, elapsed,\
        \ last_answer_draft) to DB at milestones — not only at \"submit.\"\n5. **Sliding\
        \ vs fixed TTL.** If Redis must keep context during idle-but-ongoing sessions,\
        \ prefer a **sliding** refresh that is refreshed on any heartbeat from a live\
        \ tab/worker, rather than a fixed TTL counted from creation.\n\n## 5. Recommended\
        \ Fixes (concrete)\n\n### A. Sliding TTL + heartbeat (Redis)\n```python\n\
        # Every live session heartbeat (e.g. 60s from client/worker poll)\ndef on_heartbeat(session_id,\
        \ ttl=30*60):\n    r.expire(f\"session:{session_id}\", ttl)   # refresh, not\
        \ set-on-create\n```\nKeep a fixed TTL only for *definitively-failed/abandoned*\
        \ sessions, and only as a hint for GC, never for validity semantics.\n\n###\
        \ B. Dual-gate continuation check\n```python\ndef resume(session_id, user_id):\n\
        \    # 1) authority check (DB) — decides existence/validity\n    session =\
        \ db.get_session(session_id, user_id)\n    if not session or session.status\
        \ not in (\"active\", \"paused\"):\n        return SessionExpired()\n\n  \
        \  # 2) cache check (Redis) — decides whether runtime context needs rebuild\n\
