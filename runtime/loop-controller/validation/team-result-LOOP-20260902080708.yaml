      output: "# Interview Session Continuation: Redis TTL Expiry vs. Persistent DB\
        \ Validity\n\n## Diagnosis Overview\n\nThe root cause of \"continuation breaks\"\
        \ is a **dual-source-of-truth mismatch**. The system uses two stores with\
        \ different lifetime semantics:\n\n- **Database** = the durable, authoritative\
        \ record. The interview *logically exists* and its stored answers are valid\
        \ for a long time (often indefinite, tied to the candidate record).\n- **Redis**\
        \ = the ephemeral *runtime state*. Holds the \"current position\" — active\
        \ question, in-progress/unsaved answer, conversation context, token budget,\
        \ lock, transient UI state.\n\nBoth are keyed by the same `session_id`, and\
        \ the orchestration assumes they are **mutually valid**. They are not. The\
        \ DB proves the session *should* exist; Redis silently forgets where it left\
        \ off.\n\nContinuation breaks **not because the session is gone, but because\
        \ the runtime cursor is gone while the session claims to be alive.** The check\
        \ on the DB passes, so no error is raised — the state is simply absent when\
