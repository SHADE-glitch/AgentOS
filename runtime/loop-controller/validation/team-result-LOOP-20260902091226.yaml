      summary: '# Contribution — Redis fixed-TTL session state vs. valid DB: when
        & why continuation breaks


        ## TL;DR


        Redis key `interview:session:{id}` has a **fixed 24h TTL that is only re-armed
        on a state write**'
      output: "# Contribution — Redis fixed-TTL session state vs. valid DB: when &\
        \ why continuation breaks\n\n## TL;DR\n\nRedis key `interview:session:{id}`\
        \ has a **fixed 24h TTL that is only re-armed on a state write** (`InterviewStateStore.java:51`\
        \ — `bucket.set(..., TTL_HOURS, HOURS)`). The DB row `interview_session` has\
        \ **no corresponding expiry**. Any 24h+ stretch with no state write drops\
        \ the key while the DB still says the session is live.\n\n**Important, evidence-based\
        \ caveat:** this codebase does *not* hard-crash on expiry — `requireAsking()`\
        \ (`InterviewService.java:380-399`) has a DB rehydration fallback (`state==null\
        \ → rebuild from sessionMapper.selectById → write back`). Because the Redis\
        \ `SessionState(status, questionCount, currentQuestionId)` is a **lossless\
        \ mirror** of the DB columns `(status, question_count, current_question_id)`,\
        \ a single idle expiry currently self-heals on the next `answer()`. So continuation\
        \ \"breaks\" in specific ways explained below, not every time.\n\n---\n\n\
        ## 1. Architecture facts (from the code)\n\n- **Dual source of truth, non-transactional.**\
        \ Both `interview_session` (MySQL/MyBatis-Plus) and `interview:session:{id}`\
        \ (Redis via Redisson) are written per transition; there is no distributed\
        \ transaction tying them (e.g. `InterviewService.java:183-189`).\n- **Write\
        \ order: DB first, then Redis**, always under one per-session Redisson lock\
        \ (`lockFor`, `InterviewService.java:361`). This ordering is important: it\
        \ means the Redis key is a **cache of the DB snapshot**, not an independent\
        \ authority — the comment at `InterviewStateStore.java:15` (\"单一权威来源\") is\
        \ already inaccurate.\n- **TTL is fixed 24h, reset on every write.** No idle/heartbeat\
        \ path refreshes it. No sweep relies on it.\n\n---\n\n## 2. When the key silently\
        \ expires while DB stays valid\n\n1. **Idle/paused session > 24h.** The trigger\
        \ for `answer()` hasn't fired in 24h (candidate reading a question, walked\
        \ away mid-interview). TTL is only re-armed on write → Redis forgets the runtime\
        \ state; `interview_session.status` remains `ASKING`.\n2. **Redis restart\
        \ with persistence disabled.** `RedissonConfig` (`RedissonConfig.java:22-29`)\
        \ configures single-server only — no AOF/RDB, no persistence concern visible.\
        \ On restart all runtime keys vanish while DB is intact.\n3. **Memory eviction.**\
        \ Default single-server `maxmemory-policy` is `noeviction`, so keys are *not*\
        \ evicted by default — but the moment an operator sets `allkeys-lru`/`allkeys-random`/`volatile-*`,\
        \ the session key is subject to eviction under pressure.\n4. **Admin actions\
        \ / cache drift:** `FLUSHDB`, key-flush jobs, another service deleting by\
        \ the same prefix.\n\n---\n\n## 3. Why/where continuation actually breaks\n\
        \nBecause the fallback masks only the *mirrored* fields, expiry is harmful\
        \ on these paths:\n\n### A. The fallback is only reachable inside a mutate\
        \ op\n`stateStore.read()` is consumed **only** in `requireAsking()` (`InterviewService.java:381`),\
        \ which runs inside write paths. The moment any read-only continuation path\
        \ (resume/reconnect, stream re-subscribe, a `WAITING_ANSWER`/`EVALUATING`\
        \ poll, question re-display) reads the key directly, a missing key yields\
        \ `null` with no recovery → hard failure. Currently no such path exists, but\
        \ the design offers no protection for them.\n\n### B. State is silently *reset*\
        \ to a DB mirror on resume — a real correctness hazard\nOn expiry, the first\
        \ `answer()` rehydrates from DB and **re-arms one more 24h** at `InterviewService.java:389`.\
        \ Consequences:\n- **Abandonment semantics break.** If ops ever rely on TTL\
        \ to mean \"auto-expire/cleanup abandoned interview,\" this self-heal defeats\
        \ it — an abandoned session can keep resurrecting itself from the DB forever.\
        \ There is no way to tell \"key expired → session over\" from \"key expired\
        \ → session live but idle.\"\n- **Lost fields once mirroring drifts.** The\
        \ snapshot only carries `(status, questionCount, currentQuestionId)`. As soon\
        \ as runtime state grows fields *not* in `interview_session` (in-flight stream\
        \ cursor, partially recorded answer draft, evaluation job id, question-ordering\
        \ watermark), expiry silently drops those and the DB snapshot cannot restore\
        \ them → **continuation genuinely breaks** (e.g., resumes at the wrong question,\
        \ re-saves a duplicate answer, streams can't resume mid-way).\n\n### C. Crash\
        \ between the two writes leaves stale state undetected\nDB is written at `InterviewService.java:186`,\
        \ Redis at `:188`. If the process dies (or the Redis write throws after the\
        \ DB commit) between them, Redis holds the previous snapshot. On expiry +\
        \ rehydration the DB wins (correct here, thanks to DB-first ordering), but\
        \ this ordering is a **silent invariant being relied on** — it is never checked\
        \ or logged, and it is one refactor-from-DB-first-away from turning every\
        \ expiry into data corruption.\n\n### D. Scaling assumption: single-server\
        \ Redisson is not shared-state safe for recovery\nThe self-heal depends on\
        \ rehydration being idempotent; with the reserved-but-unused states `WAITING_ANSWER`,\
        \ `EVALUATING`, `FOLLOW_UP` (`InterviewStatus.java:14-20`) that will eventually\
        \ hold per-request state, rehydrating from a shared DB across multiple app\
        \ instances while one holds the lock can resurrect a stale snapshot and reset\
        \ in-flight work.\n\n---\n\n## 4. Decision / recommendation\n\n| Option |\
        \ Strengths | Weaknesses | Best for |\n|---|---|---|---|\n| **A. DB = source\
        \ of truth, Redis = cache with sliding TTL** | Survives expiry + restart;\
        \ single authority; simple | Must re-verify all keys on read | Correctness-first,\
        \ current mirrored shape |\n| **B. Horizontal TTL keyed to DB `updated_at`,\
        \ active session = no expiry** | No data loss while session live | Needs background\
        \ sweep + abandoned-session policy | Long real interviews |\n| **C. Status\
        \ quo (fixed 24h + silent rehydrate)** | Zero change today | Breaks on B/D,\
        \ masks abandonment, risks corruption | Not recommended |\n\n**Recommended:\
        \ option A + safeguards:**\n1. **Make TTL sliding** and derived from DB activity,\
        \ not a blanket 24h. On every mutate, reset TTL; on resume, validate against\
        \ `interview_session.status` first.\n2. **Stop silently self-healing.** Change\
        \ `requireAsking` rehydration to log/report (`log.warn(\"session state expired,\
        \ rehydrated from DB, sessionId={}\", sessionId)`) so expiry is observable,\
        \ not silent.\n3. **Add Redis persistence** (AOF `appendfsync everysec`) and\
        \ an explicit `maxmemory` policy so \"evicted\" and \"expired\" are distinguishable.\n\
        4. **Keep DB-first write ordering** and note it as a contract in `InterviewStateStore.java:15`;\
        \ freeze runtime state to the 3 mirrored fields until an intentional migration.\n\
        5. **Add a lightweight abandoned-session sweep** on DB `finished_at`/`updated_at`\
        \ so idle interviews are closed by policy, not by unknowable Redis TTL.\n\n\
        ### Concrete change — sliding refresh + visibility (minimal)\n\n```java\n\
        public void write(Long sessionId, SessionState state) {\n    String json =\
        \ objectMapper.writeValueAsString(state);\n    // sliding: re-arm on every\
        \ state transition (already the case);\n    // the fix is to NOT rely on this\
        \ alone — add an idle detector below.\n    redissonClient.getBucket(key(sessionId)).set(json,\
        \ TTL_HOURS, TimeUnit.HOURS);\n}\n```\n\n`requireAsking` — make the recovery\
        \ explicit instead of silent:\n\n```java\nif (state == null) {\n    InterviewSession\
        \ s = sessionMapper.selectById(sessionId);\n    if (s == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
        \    // observable, not silent\n    log.warn(\"session {} runtime state expired;\
        \ rehydrated from DB status={}, count={}\",\n            sessionId, s.getStatus(),\
        \ s.getQuestionCount());\n    state = new InterviewStateStore.SessionState(\n\
        \            s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId());\n\
        \    stateStore.write(sessionId, state); // re-arms 24h\n}\n```\n\n---\n\n\
        ## 5. Verification\n\n- Unit test: write state, simulate Redis flush, call\
        \ `answer()` → assert seamless continuation **and** a `WARN` log (proves not\
        \ silent).\n- Test abandonment: no write for >24h (shorten TTL in test), assert\
        \ `requireAsking` rehydrates, then a policy test that a long-idle `ASKING`\
        \ row eventually gets closed by the sweep, not by barring continuation.\n\
        - Chaos: Redis restart with persistence off → verify DB-only recovery path\
        \ and that no `INTERVIEW_STATE_ERROR` reference counts / IDs drift.\n- Add\
        \ a contract test that `SessionState` fields ⊆ `interview_session` columns,\
        \ so any future runtime-field addition is forced to be mirrored before it\
        \ can be silently lost.\n\n**Bottom line:** today a single idle TTL expiry\
        \ self-heals via DB rehydration, so the visible break is subtle — it surfaces\
        \ as *silent state reset*, *broken abandonment semantics*, and *data loss\
