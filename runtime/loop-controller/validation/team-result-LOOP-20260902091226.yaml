        \ 1) 的非原子；需要调度任务（RabbitMQ/定时）。\n```\n\n**最终建议（组合 B+C）**\n- B：改写 `requireAsking`——`read()`\
        \ 非空时也按 DB 的 `updatedAt`/版本比对校验，陈旧即以 DB 为准重写；或更彻底地**始终以 DB 为守卫、Redis 仅做读缓存**（即方案\
        \ A 的守卫路径）。\n- C：`interview_session` 增加 `last_activity_at`（每次 `answer` 更新），Redis\
        \ 改用滑动 TTL（读时刷新）或与 DB 双通道判定；加定时/消息任务将超时未 `FINISHED` 的 `ASKING` 批量置为 `ABANDONED`，堵住孤儿累积与\"\
        无限续命\"。\n\n## 实施方案\n- 修改位置：\n  - `InterviewStateStore.java` 增加 `lastActivityAt`/版本字段；`read`\
        \ 后返回剩余 TTL；`write` 改为滑动刷新语义或集成版本号。\n  - `InterviewService.requireAsking`（380-390）非空状态也做\
        \ DB 一致性校验。\n  - `create/answer/finishSession`：明确写序（DB first），Redis 写失败时补偿或降级（读缓存），避免\"\
        DB 新、Redis 旧\"长期存活。\n  - `InterviewSession` + mapper：加 `lastActivityAt`，`answer`/`create`\
        \ 时更新。\n- 核心逻辑示例（`requireAsking` 加固）：\n\n```java\nprivate InterviewStateStore.SessionState\
        \ requireAsking(Long sessionId) {\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
        \    if (s == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
        \    InterviewStateStore.SessionState state = stateStore.read(sessionId);\n\
        \    if (state == null || !consistent(state, s)) {      // 键过期 或 陈健\n    \
        \    state = new InterviewStateStore.SessionState(\n                s.getStatus(),\
        \ s.getQuestionCount(), s.getCurrentQuestionId());\n        stateStore.write(sessionId,\
        \ state);            // 重吹 TTL\n    }\n    if (page... )\n```\n\n- 风险点与处理：若改方案\
        \ A（守卫走 DB），需结合 `Phase-8.2.1.4-Benchmark` 的结果确认 Redis 去守卫化的吞吐可接受；双检锁 `lockFor`\
        \ 仍保留以保证状态转换的串行性。\n\n## 验证方式\n- 测试场景四则：\n  1. `write` 后手动 `DEL interview:session:{id}`，再调\
        \ `answer` → 应经兜底重建并正确续接（验证现状自愈成立）。\n  2. 模拟 Redis 写失败（`stateStore.write`\
        \ 抛异常）→ `answer` 必须读 DB 而非陈旧 Redis 状态（覆盖风险 1）。\n  3. `ASKING` 会话闲置 >TTL，再\
        \ `answer` → 断言 DB `lastActivityAt`/清理任务生效，会话不无限续命（覆盖风险 3）。\n  4. 改字段漂移：往\
        \ `SessionState` 加字段未落 DB → 重建后断言不丢（覆盖风险 4）。\n- 预期：续接始终由单一权威决定，无陈旧真相；遗弃会话可被回收。\n\
