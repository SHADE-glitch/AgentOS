    output: "## Diagnosis\n\nRoot cause is **authority inversion plus a non-transactional\
      \ dual write**, not the TTL itself.\n\n`InterviewStateStore.java:15` declares\
      \ Redis the *\"单一权威来源\"* (single authoritative source), but it is actually a\
      \ **TTL cache**. The durable truth is `interview_session`. `InterviewService.requireAsking()`\
      \ (`InterviewService.java:380-398`) accepts the Redis snapshot unconditionally\
      \ when present, and when it's missing it **blindly rehydrates** from the DB\
      \ and re-writes Redis without any freshness/transition/counter validation. Because\
      \ continuation derives state from whichever snapshot that method returns, the\
      \ expiry path is only safe in the one, trivial case where DB and Redis haven't\
      \ diverged.\n\n## When continuation breaks\n\nThe TTL in `write()` (`InterviewStateStore.java:51`)\
      \ is `TTL_HOURS = 24` **refreshed on every write**, so the semantics are \"\
      24 hours of silence since the last successful write.\" The key goes away, and\
      \ the DB fallback is invoked, in these situations:\n\n| # | Trigger | Effect\
      \ on continuation |\n|---|---------|------------------------|\n| 1 | **Interaction\
      \ gap > 24 h** — user pauses mid-`ASKING` and returns later. | Redis `null`\
      \ → DB rehydrate → *usually recovers* (only safe case). |\n| 2 | **Redis eviction\
      \ before TTL** — eviction policy (`allkeys-lru` in `RedissonConfig`) or memory\
      \ pressure, restart, manual `delete()`. Key silently `null` while the DB session\
      \ is valid. | Same fallback, but can happen mid-day, not just after 24 h. |\n\
      | 3 | **DB write succeeded, Redis write failed** (lines 186 → 188) — non-transactional\
      \ dual write. | Redis is **behind** DB; expiry reveals stale counts. |\n| 4\
      \ | **Redis write succeeded, DB write failed/rolled back** (lines 186-188, 344-345).\
      \ | Redis is **ahead** of DB; fallback rehydrates the *old* count → replays\
      \ an already-asked question. |\n| 5 | **Redis `FINISHED`, DB still `ASKING`**\
      \ (in `finishSession`, lines 344-345) then expiry. | `requireAsking()` throws\
      \ `INTERVIEW_FINISHED`; user cannot continue or restart. |\n\nThe expiry window\
      \ that's dangerous is exactly when the DB fallback reconstructs a state that\
      \ **does not equal the runtime snapshot Redis would have produced**. If the\
      \ dual-write is momentarily diverged (crash, partial DB rollback, transient\
      \ Redis failure), TTL expiry converts that transient delta into a **silent,\
      \ permanent divergence**.\n\n## Why continuation breaks mechanically\n\n1. **Derived\
      \ counter.** `newCount = state.questionCount() + 1` (`InterviewService.java:179`\
      \ and `:254`) is computed from whatever `requireAsking()` returned. After expiry\
      \ + rehydrate, DB `questionCount` may be stale (scenario 4), so the same question\
      \ is re-asked and `interview_message` gains a duplicate row while `detail()`/`toVO`\
      \ (`InterviewService.java:291,430`) surfaces the wrong count.\n\n2. **No freshness\
      \ validation.** `requireAsking()` returns the Redis value immediately (`:381`)\
      \ with zero check against DB `interview_session` or against the authoritative\
      \ `interview_message` rows, so drift is never detected and the rehydrate (`:383-389`)\
      \ writes the stale snapshot back, **resetting the 24 h clock on bad data**.\n\
      \n3. **Finish logic vs. runtime state disagree.** `shouldFinish` reads QA pairs\
      \ from `interview_message` (`:147,222`) — the messages are authoritative — while\
      \ the count stored in `session.question_count` is derived from runtime state.\
      \ After expiry the two can diverge, so a session can loop, or skip finishing,\
      \ indefinitely.\n\n4. **Endpoints disagree.** `answer`/`answerStream` trust\
      \ Redis-or-rehydrated state, while `detail` returns DB columns; a user can see\
      \ one question count and be served another.\n\n## Options\n\n**Option A — Make\
      \ the DB the single source of truth; degrade Redis to a write-through cache.**\n\
      - Strengths: removes authority inversion, few lines, matches existing `requireAsking`\
      \ fallback intent.\n- Weaknesses: still a dual write; Redis can be stale within\
      \ the window; needs cache invalidation discipline.\n- Best for: a quick, correct\
      \ fix.\n\n**Option B — Authoritative DB reads with a versioning/monotonic guard\
      \ on the cache.**\n- Strengths: rejects stale snapshots; self-healing.\n- Weaknesses:\
      \ more state (`version`), migration of `interview_session`.\n\n**Option C —\
      \ Rebuild runtime state from `interview_message` (derived, no Redis authority\
      \ at all).**\n- Strengths: no divergence possible, `questionCount` always true.\n\
      - Weaknesses: bigger refactor; Redis keeps only *optional* hot-path optimization.\n\
      \n**Decision:** **Option A + a cheap guard** (reject obviously-stale cache,\
      \ always validate before use). It fits the constraint that Redis is currently\
      \ load-bearing for hot paths, removes the silent-expiry footgun, and is the\
      \ smallest correct change. Risks: transient divergence window remains → mitigated\
      \ by the guard and by moving `stateStore.write` *off* the critical success path\
      \ or making it best-effort.\n\n## Implementation\n\n1. Validate before trusting\
      \ Redis (`InterviewService.java:380-398`):\n\n```java\nprivate InterviewStateStore.SessionState\
      \ requireAsking(Long sessionId) {\n    InterviewStateStore.SessionState state\
      \ = stateStore.read(sessionId);\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
      \    if (s == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
      \n    // DB is truth. Reject any runtime snapshot that cannot correspond to\
      \ it.\n    if (state != null && !s.getStatus().equals(state.status())) {\n \
      \       log.warn(\"runtime state diverges from DB, session={}\", sessionId);\n\
      \        state = null; // force rehydrate\n    }\n    if (state == null) {\n\
      \        state = new InterviewStateStore.SessionState(\n                s.getStatus(),\
      \ s.getQuestionCount(), s.getCurrentQuestionId());\n        stateStore.write(sessionId,\
      \ state);\n    }\n    if (InterviewStatus.FINISHED.name().equals(state.status()))\n\
      \        throw new BizException(ResultCode.INTERVIEW_FINISHED);\n    if (!InterviewStatus.ASKING.name().equals(state.status())\n\
      \            && !InterviewStatus.START.name().equals(state.status()))\n    \
      \    throw new BizException(ResultCode.INTERVIEW_STATE_ERROR, \"当前状态不允许提交答案\"\
      );\n    return state;\n}\n```\n\n2. Derive the real counter from messages instead\
      \ of trusting `state/questionCount` at `:179` / `:254`:\n\n```java\nlong asked\
      \ = messages.stream()\n        .filter(m -> \"question\".equals(m.getKind()))\n\
      \        .count();\nint newCount = (int) asked + 1;\n```\n\n3. Make the Redis\
      \ write on success paths best-effort/async so a Redis outage can never abort\
      \ a committed answer, and make `finishSession` write *after* the DB commit (already\
      \ ordered correctly) but treat failure as non-fatal.\n\n4. Optionally reduce\
      \ divergence by using a separate, shorter TTL (`e.g.` 2 h) and rely on rehydrate-on-miss,\
      \ since TTL is no longer semantic.\n\n## Verification\n\n- **Unit/integration\
      \ matrix:** (a) expire key → answer → assert rehydrate + status guard; (b) DB\
      \ `questionCount` stale vs messages → assert derived count (no duplicate question,\
      \ `detail` matches); (c) Redis written, DB rolled back → assert `requireAsking`\
      \ rejects on next call; (d) Redis `FINISHED` vs DB `ASKING` → assert `INTERVIEW_FINISHED`\
      \ not thrown on stale data; (e) concurrent `answer` (lock held) → assert no\
      \ divergent count.\n- **Load/drift check:** after N turns, assert `messageMapper`\
      \ question count == DB `session.question_count`; this invariants the fix.\n\
      - **Sec/review review points:** the `requireAsking` guard is the authorization/state-transition\
      \ gate — the security engineer should confirm the status whitelist still prevents\
      \ unowned/illegitimate transitions after rehydration; the reviewer should confirm\
      \ Redis writes are now non-authoritative so no call-site relies on `read()`\
      \ alone.\n\n## Bottom line\n\nContinuation breaks specifically when the **Redis\
      \ snapshot has gone (`null`) and the DB fallback cannot reproduce the true runtime\
      \ state** — which happens under non-transactional dual-write divergence (crash/rollback/partial\
      \ failure) or Redis eviction, not merely from the 24 h TTL. Fix = demote Redis\
      \ to a cache, validate status before use, and derive `questionCount` from `interview_message`\
      \ so the fallback is always consistent with the durable truth."
