        **定位（代码实证）**

        - `InterviewStateStore.java:25` `TTL_HOURS = 24`，`:51` 每次 `write` 都以 `set(key,
        json, 24h)` 固定续 24 小时。

        - 类注释 `:16` 明确「Redis 作为状态机的单一权威来源」，而 `Intervi'
      output: "## 诊断：面试会话 Redis 固定 TTL 静默过期，为何/何时续接中断\n\n**定位（代码实证）**\n- `InterviewStateStore.java:25`\
        \ `TTL_HOURS = 24`，`:51` 每次 `write` 都以 `set(key, json, 24h)` 固定续 24 小时。\n\
        - 类注释 `:16` 明确「Redis 作为状态机的单一权威来源」，而 `InterviewSession`（`status/questionCount/currentQuestionId`）持续写\
        \ MySQL —— 双写，两端都自认为权威。\n- `InterviewService.requireAsking`（`:380-399`）已有一层「读不到\
        \ Redis → 回退 DB 重建」的兜底。\n\n### 根因\nTTL 到期是**静默删除**：Redis 不广播墓碑、不回调、不负责任何「会话仍在进行」的判断。它只是删\
        \ key。而权威状态机落在 Redis，持久性却落在 MySQL；两者的生命周期靠「每次写操作刷新 TTL」而不是「会话真实活跃度」来对齐。任何让「Redis\
        \ 先消失、DB 仍有效」产生时间窗的情况，都会造成续接中断或恢复不一致。\n\n### 何时续接中断\n\n**1) 静止过期（最典型）**\n\
        用户完成一次 `answer` 后 24h 内无任何写入 → TTL 触发，`read()` 返回 `null`。若 DB 侧 `status` 仍是\
        \ `ASKING/START`，`requireAsking` 会重建并写回（可续）；**但若 DB 侧已是 `FINISHED`**，恢复后抛\
        \ `INTERVIEW_FINISHED`，用户看到的把「还在进行」的面试判为已结束 —— 中断发生且无任何提示。\n\n**2) 配置/时钟漂移与\
        \ Redis 淘汰绕过 TTL**\nRedis 默认 `maxmemory` 策略下（未配置），内存压力下会**提前 LRU 淘汰**未到期的会话\
        \ key。TTL 24h 只保证「不被主动删除」，不保证「在内存紧张时不被淘汰」。活跃会话也可能 `read()==null`。\n\n**3)\
        \ 恢复掩盖真实故障（最危险的中断）**\n`read()`（`:37` null 校验）把三件事**混为一谈**：key 已过期、key 从未存在、Redis\
        \ 连接/解析故障。`requireAsking:382` 只判 `null` 就回 DB 重建并 `write` 回写。后果：\n- Redis\
        \ 短暂抖动 → 全部会话被判定「过期」→ 全量回 DB 重建并回写，制造误恢复、可能以陈旧快照覆盖较新状态。\n- 真正的中断(DB 也异常)被静默掩盖，`INTERVIEW_NOT_FOUND`\
        \ 与「会话过期」对用户不可区分。\n\n**4) 非幂等流程在过期窗口内重入**\n`answerStream`（`:222-268`）评分/结束路径较长。过期后若两个请求（如超时重试）依次进入，`requireAsking`\
        \ 各自重建；虽受 `interview:lock:` 串行约束，但恢复路径**重建即覆写**，等于把「DB 快照」强加为新的 Redis 权威，可能回退一个已推进的\
        \ `questionCount`。\n\n### 续接中断的内在机理（一句话）\n存在两条事实通道（Redis 状态机 vs MySQL 行），仅靠「写入时刷新\
        \ TTL」对齐。TTL 删除与用户续接之间没有「保活/心跳/显式终止」任何一方做协调；删 key 不通知应用，于是要么恢复逻辑兜底（但代价是 DB\
        \ 快照取代状态机、引入上述 2/3/4 类偏差），要么直接中断（DB 已是终态时）。\n\n### 建议（按优先级）\n\n**1. 滑动过期，读取即续期（治本）**\n\
        ```\npublic SessionState readWithRefresh(Long sessionId) {\n    RBucket<String>\
        \ b = bucket(sessionId);\n    String json = b.getAndExpire(Duration.ofHours(24));\
        \ // get 并原子续期\n    ...\n}\n```\n或 `getBucket(key).get()` 后在 `requireAsking`\
        \ 内统一 `write` 刷新；活跃会话永不静止过期。\n\n**2. 显式分离 MISS 与 ERROR（堵住类故障恢复）**\nRedis 连接异常应直接抛\
        \ `INTERVIEW_STATE_ERROR`，**禁止**走 DB 重建；只有「确定 key 不存在」才允许回退。\n```\nif (json\
        \ == null) return MISS;        // 仅此走 DB 重建\n// IOException/解码失败 -> 抛错，不写回\n\
        ```\n\n**3. 过期处理策略明确化**（选项权衡）\n- DB `status` 仍 `ASKING`：判断「会话活性」——`finishedAt==null\
