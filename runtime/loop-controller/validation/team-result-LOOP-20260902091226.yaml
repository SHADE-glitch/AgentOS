        \ → 守卫用**过期真相**判断状态，`questionCount`/`currentQuestionId` 与 DB 分叉，且该旧值会一直续延到\
        \ Redis 的 24h TTL 才可能被纠正。**这才是\"DB 有效但续接用的状态错误\"的实质形态。**\n\n**2) 固定 TTL（写时刷新）而非滑动\
        \ TTL（读时刷新）→ 隐式的\"24h 无写入即失效\"契约**\n- `InterviewStateStore.java:25,51`：每次\
        \ `write` 才重置为 24h，读不刷新。\n- 候选人**合法但闲置 >24h**（跨天、思考过长）时键静默消失。续接虽能通过兜底恢复，但该恢复是隐式的、未文档化的语义：**实际生效的规则是\"\
        从未次写入起 24h 空闲\"**，而非意图中的绝对有效期。\n\n**3) 兜底重建反向“救活”了本该死掉的会话 → 与 TTL 目的相悖，且产生孤儿数据（DB\
        \ 侧影响）**\n- 因为兜底随时用 DB 复刻重建 Redis，**Redis TTL 作为\"遗弃会话清理机制\"被彻底架空**：只要 DB\
        \ 行停在 `ASKING` 且从未 `FINISHED`，被 TTL 淘汰的会话会在下一次 `answer` 时被复活重建。\n- 后果（DB 工程师视角）：`interview_session`\
        \ 中**被遗弃的 `ASKING` 行永不终止**，逐步累积为孤儿；`MyBatis-Plus @TableLogic` 软删也不会清理。TTL\
        \ 本意是自动终结，结果反向成为“续命缓存”。\n\n**4) `SessionState` ↔ `interview_session` 列强耦合\
        \ → 未来字段漂移即静默丢数据**\n- `SessionState(status, questionCount, currentQuestionId)`（`InterviewStateStore.java:27`）与\
        \ `InterviewSession` 中同名三列需始终一致，否则重建丢字段。任何新增到 `SessionState` 但未落 DB 的字段，在\
        \ TTL 重建后即为空——这是\"Redis 权威来源\"与\"DB 兜底\"同一性契约被撕裂的隐患。\n\n## 方案设计\n\n```\n方案\
        \ A：DB 为唯一真相，Redis 降级为可容忍逐出的读缓存\n- 优点：消除双源；TTL 过期无害（读穿透 DB）；状态机完全一致。\n- 缺点：每次守卫都查库，吞吐下降；需压测确认(见\
