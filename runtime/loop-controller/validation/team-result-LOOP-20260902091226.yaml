      output: "# Redis TTL vs DB Lifespan Mismatch: Root Cause Analysis\n\n## 1. The\
        \ Core Problem\n\nA session is a distributed composite entity that spans **two\
        \ stores** with **independent lifecycles**:\n\n| Store | Holds | Lifespan\
        \ determined by |\n|-------|-------|------------------------|\n| **Redis**\
        \ | Runtime/transient state (auth token, Redis-backed session row, locks,\
        \ TTL keys) | Fixed TTL (`EXPIRE`/`--no-ttl` policies) |\n| **DB** | Persisted\
        \ session row + the entity/survey/interview it belongs to | Explicit lifecycle\
        \ (status field, timestamps) |\n\nWhere these two T0s/lifetimes **drift apart**,\
        \ continuation silently breaks. \"Continuation\" here = a user who was mid-interview\
        \ can resume where they left off.\n\n## 2. When Continuation Breaks (the trigger\
        \ conditions)\n\n- **TTL < max session duration.** Interview sessions routinely\
        \ outlive 30/60-minute fixed TTLs.\n- **TTL is fixed, not sliding.** A fixed\
        \ TTL starts counting at creation and ignores activity. All activity resets\
        \ nothing.\n- **Redis eviction under memory pressure.** Even with valid TTL,\
        \ `maxmemory-policy allkeys-lru` can evict keys early.\n- **Redis restart\
        \ / cluster failover / flushdb** — all keys gone, DB intact.\n- **Continuation\
        \ check queries Redis, then trusts it as source of truth.** Code paths that\
        \ do `GET sessionToken -> redirect` fail hard on a missing key, even when\
        \ the DB session row says `in_progress`.\n\n## 3. Why It Breaks (the mechanism)\n\
        \n**Silently** is the key word — no exception surfaces. Typical failure chain:\n\
        \n```\nUser paused for > TTL  →  Redis key auto-deleted\n        ↓\nUser returns,\
        \ sends resume request with sessionId\n        ↓\nRedis GET / EXISTS → null\n\
        \        ↓\nCode treats missing key as \"no session\" → throws SessionNotFound\
        \ / InvalidateCache / full restart\n        ↓\nDB still has the interview\
        \ in 'in_progress' → data is recoverable but no path reaches it\n```\n\nTwo\
        \ distinct failure classes:\n\n**a) Hard expiration** — TTL elapsed since\
        \ creation, because TTL is fixed (absolute age), not rolling (age since last\
        \ access). No activity refreshes it, so a 30-min TTL ends a 2-hour interview.\n\
        \n**b) Eviction/restart** — key lost for reasons unrelated to TTL; DB outlives\
        \ it structurally.\n\nThe mismatch is **fundamentally architectural**: you\
        \ chose different durability guarantees for two pieces of the same logical\
        \ state. Redis = memory, volatile. DB = disk, durable. They *cannot* be assumed\
        \ to stay in sync without an explicit reconciliation layer.\n\n## 4. Why Redis\
        \ Was Chosen (and what it's legitimately for)\n\nRedis is correct for **hot,\
        \ short-lived, shardable state**:\n- Rate-limit counters, JWT/cache token\
        \ material, ephemeral locks, pub/sub.\n- Fast reads when sub-millisecond access\
        \ matters.\n\nIt is **wrong** for the *authoritative* resume state of a multi-step\
        \ workflow. That duty belongs to the DB. Redis should be a **cache/lookup\
        \ accelerator**, not a **source of truth**.\n\n## 5. Concrete Fixes\n\n###\
        \ Option A — Source of truth = DB (recommended)\nPersist the resume state\
