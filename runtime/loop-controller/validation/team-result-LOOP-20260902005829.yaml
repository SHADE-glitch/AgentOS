    output: "# Run 1 Analysis: Redis Session TTL Runtime State Drift\n\n**Team:**\
      \ team-576c9378 — lead Frontend Architect coordinating backend-agent, database-agent,\
      \ security-agent, testing-agent, reviewer\n**Files Inspected:** `backend/src/main/java/com/aiview/interview/service/InterviewStateStore.java:25,34,48`,\
      \ `backend/src/main/java/com/aiview/interview/service/InterviewService.java:372,124,194`,\
      \ `backend/src/main/resources/db/schema.sql:46`, `backend/src/main/java/com/aiview/interview/entity/InterviewSession.java:15`,\
      \ `backend/src/main/java/com/aiview/interview/service/InterviewStatus.java:7`,\
      \ `frontend/src/pages/Interview.vue:86`\n\n## 1. Executive Summary\n\nValid\
      \ `interview_session` row persists in MySQL while Redis runtime key `interview:session:{id}`\
      \ expires after fixed `TTL_HOURS=24` (`InterviewStateStore.java:25,51`). `InterviewStateStore.read()`\
      \ returns `null` on miss/parse failure (`InterviewStateStore.java:37-44`) which\
      \ `InterviewService.requireAsking()` treats as cache miss and rehydrates from\
      \ DB without freshness validation (`InterviewService.java:373-381`), then re-arms\
      \ TTL for 24h. Conversely when Redis **hits**, DB is never consulted (`InterviewService.java:373`).\
      \ Dual `answer()` (`InterviewService.java:124`) and `answerStream()` (`InterviewService.java:194`)\
      \ both derive `newCount=state.questionCount()+1` (`InterviewService.java:176,249`)\
      \ from Redis. This bidirectional lack of parity creates state drift in both\
      \ directions: resurrection of `FINISHED` and blocking of valid `ASKING`, plus\
      \ monotonic `questionCount`/`currentQuestionId` divergence vs ground truth `interview_message`.\n\
      \n## 2. Evidence Map\n\n| Component | Location | Evidence |\n|-----------|----------|----------|\n\
      | Write with TTL | `InterviewStateStore.java:48-51` | `redissonClient.getBucket(key).set(json,\
      \ TTL_HOURS, TimeUnit.HOURS)` where `TTL_HOURS=24` (`InterviewStateStore.java:25`).\
      \ No sliding refresh. |\n| State shape | `InterviewStateStore.java:27` | `record\
      \ SessionState(String status,int questionCount,Long currentQuestionId)` — no\
      \ `version/updatedAt/userId`. |\n| Read null masking | `InterviewStateStore.java:34-46`\
      \ | `bucket.get()==null → return null` and `catch(Exception) → log.warn → return\
      \ null` indistinguishable. |\n| Fallback without validation | `InterviewService.java:372-391`\
      \ | `if(state==null){ s=selectById; state=new SessionState(s.getStatus(),...);\
      \ stateStore.write(sessionId,state);}` No status/count/curId verification. |\n\
      | Gate before answer | `InterviewService.java:128,201` | `requireAsking(sessionId)`\
      \ called inside `lockFor(sessionId)` (`InterviewService.java:125,198`) but gating\
      \ uses Redis-first oracle. |\n| Dual-write | `InterviewService.java:90,115,185,258,340`\
      \ | `sessionMapper.updateById` + `stateStore.write` non-transactional; no `@Transactional`\
      \ across DB/Redis/RabbitMQ (`InterviewService.java:335-351`). |\n| DB truth\
      \ | `db/schema.sql:46-60` | `interview_session` status `VARCHAR(20) DEFAULT\
      \ 'START'`, `question_count INT DEFAULT 0`, `current_question_id BIGINT`, no\
      \ `CHECK` or FK on `current_questionId`. |\n| Comment contradiction | `InterviewStateStore.java:15`\
      \ | Claim \"存于Redis，作为状态机的单一权威来源\" contradicts DB being actual source-of-truth\
      \ for billing/scoring. |\n\n## 3. Root Cause\n\n**Fixed TTL + cache-as-authority\
      \ + open-loop rehydration:**\n\n1. Every `write()` resets TTL to 24h from write\
      \ moment. `read()` never touches TTL. Active session idle >24h expires even\
      \ if next answer is legitimate.\n2. On hit, DB parity is skipped → stale `ASKING`\
      \ in Redis can override `FINISHED` in DB for up to 24h.\n3. On miss, DB values\
      \ are blindly promoted to Redis for another 24h without checking `questionCount\
      \ == COUNT(*) FROM interview_message WHERE kind='question'` nor `currentQuestionId`\
      \ existence nor `finishedAt` recency. Parse failures launder corruption the\
      \ same way.\n\n`questionCount` is not derived from messages. `InterviewService.java:140-143,176`\
      \ collects `askedQuestionIds` and `extractQAPairs` for finish logic uses message\
      \ count, but `newCount` uses Redis field, causing divergence between termination\
      \ decision (`evaluationService.shouldFinish(qaPairs,6)` `InterviewService.java:147,220`\
      \ with `MAX_QUESTIONS=6` `InterviewService.java:64`) and persisted counter displayed\
      \ via `InterviewSessionVO:17` → `InterviewService.detail:286-294` → `frontend/src/pages/Interview.vue:86`\
      \ `已提问 {{session?.questionCount}} 题`.\n\n## 4. Detailed Flow & Stale Transitions\n\
      \n### 4.1 `create()` `InterviewService.java:79-122`\n```\ninsert DB START,0\
      \ | write Redis START,0 | saveAiMessage question | update DB ASKING,1,msgId\
      \ | write Redis ASKING,1\n```\nCrash between `updateById:113` and `write:115`\
      \ leaves DB `ASKING` vs Redis `START` → next `answer` allows `START` (`InterviewService.java:386-387`)\
      \ and computes `newCount=1` duplicate.\n\n### 4.2 `requireAsking()` `InterviewService.java:372-391`\n\
      ```java\nSessionState state = stateStore.read(sessionId); //373\nif(state==null){\
      \ //374\n  InterviewSession s = sessionMapper.selectById(sessionId); //375\n\
      \  if(s==null) throw INTERVIEW_NOT_FOUND;\n  state = new SessionState(s.getStatus(),\
      \ s.getQuestionCount(), s.getCurrentQuestionId()); //379\n  stateStore.write(sessionId,\
      \ state); //381 re-arms 24h\n}\nif(FINISHED.equals(state.status())) throw INTERVIEW_FINISHED;\
      \ //383\nif(!ASKING.equals(status) && !START.equals(status)) throw INTERVIEW_STATE_ERROR;\
      \ //386\n```\nNo validation of: `s.finishedAt` vs now, `s.questionCount` vs\
      \ `SELECT COUNT(kind='question')`, `s.currentQuestionId` FK, `InterviewStatus.java:7`\
      \ phantom states `SELECT_TOPIC/WAITING_ANSWER/EVALUATING/FOLLOW_UP`.\n\n###\
      \ 4.3 Drift Matrix (verified via code path)\n\n| ID | Redis | DB | Trigger |\
      \ Result |\n|----|-------|----|---------|--------|\n| F1 | `null` (≥24h expiry)\
      \ | `ASKING q=2 cur=101` | Inactivity resumption | Rehydrates `ASKING,2` — appears\
      \ to recover but masks stale count |\n| F2 | `ASKING q=1` | `FINISHED cur=105`\
      \ (scoring/external UPDATE) | `finishSession` write lost (`InterviewService.java:339-341`)\
      \ | **Resurrection:** `answer` passes Redis check, overwrites DB `FINISHED→ASKING`\
      \ |\n| F3 | `ASKING q=3` | `ASKING q=2` | Sequential `answer` with stale read\
      \ | `newCount=4` skips 3 → frontend `questionCount` drift `2→4` |\n| F4 | `FINISHED`\
      \ | `ASKING` (DB rollback, no txn) | DB fail Redis success | Next answer blocked\
      \ `INTERVIEW_FINISHED` while DB valid — DoS |\n| F5 | parse-fail → `null` |\
      \ `ASKING` | Corrupt JSON `InterviewStore:43` | Silent fallback hides regression\
      \ |\n\n## 5. Database vs Redis Comparison\n\n| Dimension | DB `interview_session`\
      \ `schema.sql:46` | Redis `interview:session:{id}` `InterviewStateStore.java:31`\
      \ |\n|-----------|----------------------------------------|--------------------------------------------------------------|\n\
      | Durability | InnoDB persistent | `RBucket JSON` TTL ephemeral |\n| Fields\
      \ | full row: `status/questionCount/currentQuestionId/totalScore/startedAt/finishedAt/deleted`\
      \ (`InterviewSession.java:28-42`) | subset 3 fields only |\n| Ownership | `user_id`\
      \ checked via `requireOwnedSession:393` | no `userId` in key/value |\n| Ground\
      \ truth for `questionCount` | `COUNT(*) interview_message kind='question'` (`schema.sql:62`)\
      \ | `state.questionCount()+1` increment |\n| Deletion awareness | `@TableLogic\
      \ deleted` (`InterviewSession.java:42`) | `delete()` `InterviewStateStore.java:58`\
      \ never called on finish/delete |\n\nReconciliation query to detect drift without\
      \ code change:\n```sql\nSELECT s.id, s.status db_status, s.question_count db_cnt,\n\
      \ (SELECT COUNT(*) FROM interview_message m WHERE m.session_id=s.id AND m.kind='question')\
      \ real_cnt,\n s.current_question_id\nFROM interview_session s HAVING db_cnt\
      \ != real_cnt;\n-- + Redis scrape: redisson.getBucket('interview:session:'+id).get()\
      \ compare to db_status/db_cnt\n```\n\n## 6. Security / Trust Boundary (security-agent)\n\
      \n- **FINISHED bypass (P1):** When Redis HIT stale `ASKING` while DB `FINISHED`,\
      \ `requireAsking:373` never loads DB → `answer` succeeds → `saveUserMessage:131`\
      \ + `saveAiMessage:177` + `updateById:182` resurrects session, enabling duplicate\
      \ `InterviewResult` `schema.sql:76` UNIQUE violation and score inflation via\
      \ `RuleBasedScoringService.ScoringMessage:345`.\n- **Lock-before-auth DoS (P2):**\
      \ `lockFor:353` `tryLock(5s)` acquired before `requireOwnedSession:127` with\
      \ predictable `interview:lock:{id}` `InterviewService.java:31` (auto-increment).\
      \ Cross-user attacker can contend victim lock.\n- **Unbound key + no CAS (P2):**\
      \ `RBucket.set:51` overwrites unconditionally. Attacker with Redis access can\
      \ `SET interview:session:42 {\"status\":\"ASKING\"...}` to resurrect. `requireAsking(sessionId)`\
      \ `InterviewService.java:372` has no `userId` param, relying on caller order\
      \ — fragile.\n- `answerStream:196` holds lock in virtual thread with no `emitter.onTimeout`\
      \ — leaked lock on disconnect.\n\n## 7. Testing Reproduction (testing-agent)\n\
      \n**Canonical TTL reproduction (no file change, manual):**\n```bash\n# 1 create\
      \ → sid=100\ncurl -X POST /api/interviews -H \"Authorization: Bearer $TOKEN\"\
      \ -d '{\"topic\":\"Java\",\"level\":\"中级\"}'\nredis-cli GET interview:session:100\
      \ # {\"status\":\"ASKING\",\"questionCount\":1,\"currentQuestionId\":10}\nredis-cli\
      \ DEL interview:session:100 # simulates 24h TTL expiry\n# tamper DB to prove\
      \ staleness propagation\nmysql -e \"UPDATE interview_session SET question_count=99\
      \ WHERE id=100\"\ncurl -X POST /api/interviews/100/answer -d '{\"content\":\"\
      ans\"}'\nredis-cli GET interview:session:100 # bug oracle: questionCount 100\
      \ vs SELECT COUNT(*) FROM interview_message WHERE session_id=100 AND kind='question'\
      \ =2\nmysql -e \"SELECT question_count FROM interview_session WHERE id=100\"\
      \ # 100 diverged\n```\n**Mock variant:** `when(bucket.get()).thenReturn(null)`\
      \ → `requireAsking` fallback → verify `bucket.set(contains('ASKING'), eq(24L),\
      \ eq(HOURS))` called without validation.\n\n**Test matrix highlights (18 cases,\
      \ 9 bugs):** `T-TTL-2` (DB qCount 99 rehydrated), `T-INV-1` (DB FINISHED vs\
      \ Redis ASKING HIT → resurrection), `T-QC-1` (DB qCount 2 vs Redis 5 → regression\
      \ 10→2), `T-CC-1` (concurrent `answer` lost increment due to read-modify-write\
      \ not atomic), `T-RD-1` (DB batch 10 overwritten by Redis 1). Full matrix in\
      \ appended artifact.\n\n## 8. Frontend Impact\n\n`Interview.vue:86` and `api/interview.ts:17`\
      \ render `session.questionCount` from DB VO `InterviewService.toVO:422-424`.\
      \ Since backend writes `questionCount` from Redis increment, UI shows drifted\
      \ progress (`3/6` after 2 real questions) while termination uses message-derived\
      \ `qaPairs.size` — user sees `MAX_QUESTIONS` mismatch, indefinite loop or premature\
      \ finish. `detail()` `InterviewService.java:286` reads DB only, so UI and `requireAsking`\
      \ state temporarily diverge.\n\n## 9. Risk & Priority\n\n| Risk | Severity |\
      \ Condition |\n|------|----------|-----------|\n| Resurrection FINISHED→ASKING\
      \ | Critical | Confirmed via code path `373` without DB check |\n| QuestionCount\
      \ regression | High | Confirmed via `176,182` Redis-derived increment |\n| DoS\
      \ via stale FINISHED blocking valid ASKING | High | Confirmed F4 |\n| Lock starvation\
      \ cross-user | Medium | Confirmed `353-364` before auth |\n| Parse-failure masking\
      \ corruption | Medium | Confirmed `43-44` |\n\n## 10. Configuration / Verification\
      \ Recommendations (analysis only)\n\n- **Immediate read-only verification (no\
      \ code change):** Run drift queries §5 nightly; instrument `requireAsking` with\
      \ metric `state.redis_hit_vs_db_mismatch` by adding logging comparison (observability\
      \ only).\n- **Design fix candidates (deferred per task constraint):** Make DB\
      \ authoritative for `FINISHED` gate; add `SELECT COUNT(kind='question')` validation\
      \ in `requireAsking`; store `version/updatedAt/userId` in `SessionState` with\
      \ `compareAndSet`; refresh TTL on `read` via `expire`; move `lockFor` after\
      \ `requireOwnedSession`; add `@Transactional` or outbox for `finishSession`\
      \ dual-write; add `CHECK status IN ('START','ASKING','FINISHED')` `schema.sql:51`\
      \ and `stateStore.delete` on finish.\n"
