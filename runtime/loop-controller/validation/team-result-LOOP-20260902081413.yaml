    output:
      agent: llm-engineer
      status: completed
      summary: '# Interview Session Runtime State: TTL Expiry vs. Persistent DB —
        Continuation Break Analysis


        ## 1. Architecture Underlying the Problem


        Two systems of record hold different slices of the same interv'
      output: "# Interview Session Runtime State: TTL Expiry vs. Persistent DB — Continuation\
        \ Break Analysis\n\n## 1. Architecture Underlying the Problem\n\nTwo systems\
        \ of record hold different slices of the same interview session:\n\n| Store\
        \ | What it holds | Access pattern | Durability contract |\n|-------|---------------|----------------|---------------------|\n\
        | **Redis (cache / hot state)** | In-progress runtime state: current question\
        \ index, answer buffer, elapsed timer, streaming offsets, transient user inputs,\
        \ per-question drafts, lock tokens | Hot path reads/writes per interaction;\
        \ sub-ms latency required | **Volatile** — governed by the key's TTL |\n|\
        \ **Primary DB** | Session facts: interview definition, user/session identity,\
        \ submitted answers, timestamps, status (in_progress/completed) | Slower,\
        \ transactional, authoritative | **Durable** — row persists until explicitly\
        \ transitioned |\n\nThe **continuation contract** says: \"a user can resume\
        \ their interview.\" That contract is only valid while *both* slices agree\
        \ the session is resumable. The failure mode you describe is a **split-brain\
        \ between the DB view (\"session is valid, in_progress\") and the Redis view\
        \ (\"session is gone/missing\")**.\n\n---\n\n## 2. When and Why Continuation\
        \ Breaks\n\nContinuation breaks exactly at the boundary where the **DB says\
        \ \"in_progress\" but Redis no longer holds the runtime state**. This is not\
        \ a crash of data — it is a **silent expiry** because TTL elapses independently\
        \ of any DB state change.\n\n### 2.1 The TTL is a clock, not a state machine\n\
        A fixed TTL is a *wall-clock* deadline applied at insertion/refresh. It has\
        \ no knowledge of:\n\n- Whether the DB row was still `in_progress` at expiry\
        \ time\n- Whether the user never actually disconnected (e.g., idle-but-open\
        \ tab, long client-side authoring, streaming buffer)\n- Whether *any* activity\
        \ occurred after insert\n\n```py\n# Redis write at session start\nr.setex(f\"\
        session:{sid}:runtime\", ttl=600, value=snapshot)\n#   ^ 600s after this moment\
        \ the key vanishes — regardless of DB state\n```\n\nThe DB has `updated_at`\
        \ updated on real events; the Redis key updates **only when something explicitly\
        \ re-writes it**. If the update path is missing, only the authoring writes\
        \ refresh it.\n\n### 2.2 Concrete expiry scenarios\n\n**A. Idle gap on the\
        \ critical path (most common)**\nUser sits on one question writing a long\
        \ answer for > TTL. No write to the `session:{sid}:runtime` key occurs during\
        \ that gap (buffer lives in client or a separate key). TTL expires mid-answer.\
        \ Every *read* now misses:\n\n```py\nsnapshot = r.get(f\"session:{sid}:runtime\"\
        )   # None after expiry\nif snapshot is None:\n    raise SessionExpiredRedirect\
        \   # continuation breaks here\n```\nEven though `session` row in DB still\
        \ reads `status='in_progress'`.\n\n**B. Asymmetric refresh policy**\nThe TTL\
        \ is refreshed on *answer submit* events but not on *read* or *drafting* events.\
        \ A user who reads a lot but submits rarely crosses the silent boundary.\n\
        \n**C. TTL shorter than the slowest legitimate step**\nServer-side operations\
        \ (e.g., LLM streaming, media upload) can legitimately take longer than TTL.\
        \ The runtime key for the *session* is not touched during a long single tool\
        \ call ⇒ expires.\n\n**D. Restart / deployment churn**\nRedis is flushed or\
        \ restarted (eviction, `FLUSH`, cluster failover). The key evaporates even\
        \ though TTL had not expired — continuation breaks because runtime state is\
        \ *absent*, again despite a valid DB row.\n\n**E. Sliding vs. fixed TTL mismatch**\n\
        Even with a sliding TTL, if the refresh is applied only on a narrow set of\
        \ events, other equally valid activity leaves the TTL uncounted.\n\n### 2.3\
        \ Why the DB *remains* valid\nThe DB row's lifecycle is driven by **explicit\
        \ transitions** (`in_progress → completed → submitted`). `in_progress` is\
        \ never a passive clock — it stays true until someone flips it. So at the\
        \ moment of Redis expiry:\n\n```\nDB:    session(id) status='in_progress'\
        \      ✅ still resumable by contract\nRedis: session:{id}:runtime  key=<absent>\
        \    ❌ runtime state unrecoverable\n```\n\nDepending on how resilient the\
        \ resume logic is, you now get one of:\n\n| Handling | User-visible result\
        \ |\n|----------|---------------------|\n| Hard fail (raise, redirect) | Login\
        \ prompt / \"session expired\" — full break |\n| Soft rehydrate from DB skeleton\
        \ | Resume with lost progress; partial answers missing; state resets to question\
        \ 0 or last *submitted* checkpoint |\n| Silent fallback | Perceived data loss\
        \ — worst trust outcome |\n\n---\n\n## 3. Root-Cause Summary\n> A fixed TTL\
        \ is an **implicit, wall-clock commit to drop state** that is decoupled from\
        \ the **explicit, event-driven lifecycle** in the DB. Continuation breaks\
        \ the moment the DB's authoritative \"in_progress\" outlives the Redis key's\
        \ clock — because the contract reads from two sources of truth that are not\
        \ transactionally synchronized.\n\n---\n\n## 4. Recommended Fixes (in priority\
        \ order)\n\n### 4a. Sliding TTL driven by a single \"activity\" event\nRefresh\
        \ on *any* authoritative activity (read heartbeat + write), not just submits:\n\
        \n```py\ndef touch(sid):\n    r.expire(f\"session:{sid}:runtime\", ttl)  \
        \   # O(1), no data rewrite\n```\nInstrument server middleware to call `touch`\
        \ on every authenticated session-read/write so the TTL tracks real engagement\
        \ and short idle gaps stop killing sessions.\n\n### 4b. Make the DB the source\
        \ of truth for expiry; Redis a value-add cache\nOnly treat a session as expired\
        \ when the **DB** says so:\n\n```py\ndef get_runtime(sid):\n    snap = r.get(f\"\
        session:{sid}:runtime\")\n    if snap is not None:\n        return snap  \
        \                                # hot path\n    row = db.fetchone(\"SELECT\
        \ status FROM session WHERE id=%s\", (sid,))\n    if row is None or row.status\
        \ != \"in_progress\":\n        return None                               \
        \   # truly finished\n    # DB still valid → session survives transient Redis\
        \ miss:\n    return rehydrate_and_repopulate_redis(row, sid)  # rebuild runtime,\
        \ reset sliding TTL\n```\nThis converts a hard break into a graceful rehydration\
        \ and re-arms the Redis key.\n\n### 4c. Add near-expiry grace / sentinel\n\
        - Set TTL to `threshold` (e.g., 60s) longer than the *logical* session and\
        \ store the logical expiry separately.\n- Optionally push an expiry notification\
        \ (container-based `EXPIRE` w/ `keyspace notifications`, or `XADD` to a stream)\
        \ to let a worker preemptively persist runtime state *before* the key drops.\n\
        \n### 4d. Periodic incremental checkpointing to DB\nPersist a lightweight\
        \ checkpoint (`last_question_id`, `answers_snapshot_hash`, `updated_at`) to\
        \ the DB on each submit and periodically on drafts. Then Redis holds only\
        \ *ephemeral hot data*; anything reconstructable from DB + checkpoint has\
        \ zero-loss recovery:\n\n```sql\nALTER TABLE session ADD COLUMN checkpoint\
        \ jsonb,\n                    ADD COLUMN last_question_id bigint;\n```\nSkeleton\
        \ update: `UPDATE session SET checkpoint=..., updated_at=now() WHERE id=%s`.\n\
        \n### 4e. Cache-aside consistency guard (correctness)\nPrevent serving stale\
        \ runtime that contradicts the DB and vice-versa. Store a version/epoch in\
        \ both the DB row and the Redis key; reject a resume whose DB epoch ≠ Redis\
        \ epoch.\n\n### 4f. Explicit, idempotent termination (fail *loud*, not silent)\n\
        When a session legitimately ends, **actively delete** the Redis key and set\
        \ DB to `completed` transactionally (or within the same request/txn after\
        \ commit), so the user gets a coherent \"completed\" state rather than an\
        \ unexplained mid-interview drop.\n\n---\n\n## 5. Decision Matrix for the\
        \ Lead Review\n\n| Approach | Continuation guarantee | Complexity | Latency\
        \ impact |\n|-----------|------------------------|------------|----------------|\n\
        | Sliding TTL on all activity (4a) | Strong for idle gaps | Low | ~0 (O(1)\
        \ expire) |\n| DB-authoritative recovery (4b) | Strong for any single-slice\
        \ loss | Medium | Only on miss (cold path) |\n| Checkpointing to DB (4d) |\
        \ Strongest (durable resume) | Medium-High | Writes on draft cadence |\n|\
        \ Fixed TTL, hard fail (status quo) | Weak — breaks | None | None |\n| Grace/sentinel\
        \ on expiry (4c) | Medium | Medium | Negligible |\n\n**Recommendation:** Implement\
        \ **4b (DB-authoritative recovery) + 4a (sliding TTL on activity)** together\
        \ — this makes continuation at least *always recoverable*, removing the silent\
        \ gap — and layer **4d checkpointing** on top if zero-progress-loss resume\
        \ is a hard requirement. That combination decouples the volatile clock from\
        \ the durable state machine and removes the breakage mode entirely.\n\nIf\
        \ you'd like, I can draft the exact Redis client middleware + SQL migration\
        \ and the `rehydrate_and_repopulate_redis` routine as runnable code against\
        \ your stack (stacks supported: Python/Node, Redis client, Postgres/MySQL)."
