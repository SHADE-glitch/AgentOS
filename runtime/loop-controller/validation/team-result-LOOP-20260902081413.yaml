      agent: security-engineer
      status: completed
      summary: '## Security Review: Redis Session State TTL vs DB Continuity


        ### Context

        Interview session **runtime state** (progress, partial answers, auth tokens,
        current step) lives in Redis with a **fixed TTL**'
      output: "## Security Review: Redis Session State TTL vs DB Continuity\n\n###\
        \ Context\nInterview session **runtime state** (progress, partial answers,\
        \ auth tokens, current step) lives in Redis with a **fixed TTL**. The authoritative\
        \ session record lives in the DB. When Redis TTL expires, the DB record is\
        \ still valid — but continuation breaks because the app trusts the Redis copy.\n\
        \nFrom a security standpoint this is not merely a reliability bug; it is an\
        \ **authorization/state-confusion flaw**. Understanding it as a session-management\
        \ weakness lets us scope the risk and fix it without weakening security controls.\n\
        \n---\n\n### 1. Why / When Continuation Breaks (Security Angle)\n\nFixed TTL\
        \ (`EXPIRE key 3600`, 1h) creates three failure windows:\n\n**A. TTL shorter\
        \ than user idle time (most common)**\n- User idles > 1h mid-interview → runtime\
        \ key disappears → next request sees \"no session\" → forced restart, loss\
        \ of partial answers, potential duplicate token issuance.\n\n**B. TTL engraved\
        \ from creation, not activity (sliding expiry absent)**\n- Even an *active*\
        \ user hits the wall exactly at hour mark if TTL is not renewed on each access.\
        \ An attacker who grabs an old token could theoretically use it in DB terms,\
        \ but Redis says expired — masked invalidation.\n\n**C. Write-time race during\
        \ refresh**\n- If you do `GET` then re-`SETEX` non-atomically, a concurrent\
        \ request can read a popped or re-expiring key, producing **inconsistent authorization\
        \ decisions**.\n\nSecurity consequence: **the runtime state and DB drift out\
        \ of sync**. Redis says \"expired\" while DB says \"valid\". Any code path\
        \ that treats Redis expiry as authoritative will (wrongly) invalidate a legitimate\
        \ user — or, worse, a recreated runtime key may be granted elevated privileges\
        \ because the DB record is trusted for authorization.\n\n---\n\n### 2. Key\
        \ Security Risks\n\n| # | Risk | Severity | Rationale |\n|---|------|----------|-----------|\n\
        | R1 | **Silent session invalidation → auth bypass / denial** | High | Legit\
        \ users denied; an attacker may trigger a fresh-session path that skips re-verification\
        \ |\n| R2 | **Recreated-key privilege confusion** | High | New `session:{id}`\
        \ granted perms based on stale DB \"valid\" flag without re-auth |\n| R3 |\
        \ **Long-lived DB + ephemeral Redis = hash/credential staleness** | Medium\
        \ | DB copy carries old authn/AuthN-bound data; Redis may reference deleted\
        \ user |\n| R4 | **Non-atomic check-then-set races** | Medium | `GET`→`SETEX`\
        \ window allows interleaving → inconsistent decisions |\n| R5 | **No user-visible\
        \ expiry signal** | Low | Instead of graceful \"session expired, resume here\"\
        \ you get silent break; poor sec-ops visibility |\n\n---\n\n### 3. Root Cause\
        \ — Von-Neumann-of-Session-Truth\nTwo overlapping authoritative states. The\
        \ DB says the session is legitimately in progress; Redis says it's dead. **TTL\
        \ should not be the source of truth for whether a session is valid — it should\
        \ only bound the *runtime* cache of that truth.**\n\n---\n\n### 4. Recommended\
        \ Fixes (Security-First)\n\n**Option A — DB as source of truth, Redis as cache\
        \ (recommended):**\n- Store the session's authoritative state (status, expiration,\
        \ last_update) in DB.\n- Store only the *hot* runtime payload in Redis with\
        \ a **sliding TTL**, refreshed on every access.\n- On Redis miss, **re-hydrate\
        \ from DB and re-validate** before granting access; never grant on DB alone\
        \ without re-check.\n\n```python\n# atomic refresh with sliding TTL\nscript\
        \ = \"\"\"\nlocal ttl = redis.call('PTTL', KEYS[1])\nif ttl > 0 then\n   \
        \ redis.call('PEXPIRE', KEYS[1], ARGV[1])\n    return 1\nend\nreturn 0\n\"\
        \"\"\n# on each request: PEXPIRE (sliding); if 0 → re-hydrate from DB\n```\n\
        \n**Option B — Graceful continuation instead of hard fail:**\n- Distinguish\
        \ `expired` from `missing`. On expiry, return a structured error `{session_expired:\
        \ true, resume_point}`, letting the client resume from DB — not start over.\n\
        \n**Option C — Align TTL with the DB lifetime:**\n- Set Redis TTL to the DB\
        \ session TTL. Renew on access (sliding) so Redis can never outlive DB. This\
        \ prevents the \"DB valid, Redis dead\" inversion.\n\n---\n\n### 5. Security\
        \ Hardening Checklist\n- [ ] **Refresh sliding TTL atomically** (`PEXPIRE`/Lua)\
        \ on every access — prevents R4.\n- [ ] **Re-validate auth on re-hydration**:\
        \ when Redis misses, do NOT recreate the key from DB without reconfirming\
        \ user identity/authorization — prevents R1, R2, R3.\n- [ ] Idempotent resume:\
        \ re-hydration must be transaction-guarded (a `SELECT ... FOR UPDATE` or unique\
        \ `resume` key) so concurrent misses don't double-create — prevents duplication.\n\
        - [ ] Never trust Redis expiry as a hard security boundary; treat it as cache\
        \ lifecycle only.\n- [ ] Log expiry events at WARN with user_id/session_id\
        \ for sec-ops visibility (R5).\n- [ ] Redact runtime payload (don't cache\
        \ raw credentials/tokens in Redis); store opaque references and resolve server-side.\n\
        \n---\n\n### 6. Suggested Lead/Action Items\n1. Adopt **DB as source of truth**\
        \ for authorization; Redis holds only hot cache with sliding TTL.\n2. Implement\
        \ atomic re-hydration on Redis miss with **re-auth**.\n3. Return explicit\
        \ `session_expired` semantics on expiry (graceful + observable).\n4. Add expiry\
        \ telemetry/logging and a test case for \"DB valid, Redis expired\" to lock\
        \ the fix.\n\n**Bottom line:** the bug is trust-inversion between the two\
        \ stores. Fix it not by lengthening the TTL but by making Redis a strictly\
        \ disposable cache and the DB the authority — while requiring re-validation\
        \ on every re-hydration to close the R2 privilege-confusion hole."
