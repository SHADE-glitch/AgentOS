      output: "# Interview Session Continuation Breaks: Redis TTL Versus Durable DB\n\
        \n## TL;DR\n\nThe failure is a **cache/state-store trust mismatch**: the DB\
        \ is authoritative and says \"session is valid,\" but Redis — which holds\
        \ the *transient runtime* state needed to actually continue — evaporates that\
        \ state on a fixed TTL. When the runtime state is gone but the DB record survives,\
        \ the resume path's precondition (DB check) passes while its runtime dependency\
        \ (Redis state) misses. The result is a broken, inconsistent, or silently-restarted\
        \ interview — i.e. **continuation breaks even though the session \"exists.\"\
        **\n\n---\n\n## 1. What each layer is actually holding\n\n| Store | Kind |\
        \ Typical payload | Semantics |\n|---|---|---|---|\n| **Database** | Durable,\
        \ authoritative | Submission, candidate id, stage/verdict record, timestamps\
        \ | **\"Session existed and was completed/committed\"** |\n| **Redis** | In-memory,\
        \ short-lived runtime | Per-turn cursor (question index), partial answer buffer,\
        \ streaming/LLM context window, token/usage accumulator, rate-limit or idle-lock\
        \ bucket, current stage, last-activity, retry/backoff state | **\"Session\
        \ is actively continuable / in-flight\"** |\n\nThe DB row is *committed truth*.\
        \ The Redis key is *transient work-in-progress*. They have **different lifecycles**,\
        \ and a fixed TTL couples them badly.\n\n---\n\n## 2. Root cause: fixed (absolute)\
        \ TTL vs. continued activity\n\nA fixed TTL set once — `SET session:<id> <state>\
        \ EX 3600` — means **the key dies 1 hour after it was created**, regardless\
        \ of whether the user is still actively engaged. That is an *absolute* deadline.\
        \ Continuity should be driven either by *activity* (sliding TTL) or by a *durable\
        \ lifecycle*, not by a static timer.\n\nBreakage windows arise whenever **the\
        \ DB is kept warm but Redis is not**:\n\n- **Long or paused sessions** — interview\
        \ exceeds the fixed window; or the candidate pauses / thinks / writes a long\
        \ answer, producing no traffic for >TTL.\n- **DB kept alive by writes Redis\
        \ never sees** — write-through commits on each turn (schema/data rows) refresh\
        \ only the DB; the Redis `EXPIRE` timer keeps counting down untouched. The\
        \ two stores drift until Redis crosses zero.\n- **Redis eviction pressure**\
        \ — under `volatile-lru`/`volatile-ttl`/`allkeys-lru`, Redis drops *volatile*\
        \ keys (even before TTL) under `maxmemory` pressure. A busy shared Redis silently\
        \ evicts the session key.\n- **Long LLM/streaming turn** — generation itself\
        \ can be >TTL; the \"active\" turn never sends a heartbeat to Redis.\n- **App\
        \ restart / failover / deploy** — in-memory Redis is by definition not durable;\
        \ a flush (`FLUSHALL`), failover to an empty replica, or memory-restricted\
        \ pod evicts everything regardless of TTL.\n\n---\n\n## 3. Why \"DB says valid\"\
        \ but continuation still breaks\n\nThe resume flow typically has two gates\
        \ that fail independently:\n\n```\nResume(session_id):\n  1. thesis     =\
        \ DB.lookup(session)          # PASS  -> row still exists, still \"valid\"\
        \n  2. runtime    = Redis.get(\"session:\"+id)     # MISS  -> TTL expired\
        \ / evicted\n  3. continue(runtime)                          # ???  -> undefined\
        \ path\n```\n\nThe **DB check validates existence, not continuability.** Depending\
        \ on implementation, the miss then manifests one of:\n\n- **Silent restart\
        \ / wrong stage** — code assumes the key exists and falls back to a \"fresh\"\
        \ state, restaging the interview from question 0 even though the candidate\
        \ already submitted.\n- **Duplicate / reprocessed submission** — the commit\
        \ boundary lived only in Redis; the resume path re-applies an already-committed\
        \ answer's effects.\n- **Lost partial context** — key or token context, accumulated\
        \ usage, current streaming buffer are dropped mid-turn.\n- **500 / alignment\
        \ error** — `None` unwrapping, `KeyError`, guard-retry mismatch; hard failure\
        \ on resume.\n- **Locking/idempotency holes** — an idle-lock or double-submit\
        \ guard stored only in vRedis vanishes, enabling concurrent duplicate completions.\n\
        \nNet effect: **the system reports \"valid session\" at the API entry, then\
        \ cannot actually reconstruct the in-flight state to continue — the classic\
        \ silent TTL trap.**\n\n---\n\n## 4. Decision: is Redis a *cache* or a *runtime\
        \ source of truth*?\n\nThe right fix depends entirely on this. Two coherent\
        \ models:\n\n**A. Redis is a pure cache of DB truth (reconstructible)**\n\
        → Any miss must trigger a lazy rebuild from the DB. A TTL miss is then a harmless\
        \ reload, not a break.\nRequires: all runtime state to be derivable from the\
        \ DB row (+ enough durable fields).\n\n**B. Redis is the runtime source of\
        \ truth for in-flight state (non-reconstructible)**\n→ Then a TTL miss is\
        \ **data loss**, not a cache miss. TTL must be managed as a business lifecycle:\
        \ sliding on activity, keepalive, and durable checkpointing of anything non-derivable.\n\
        \nThe current bug is a **hybrid bug**: state is treated like (A) (short fixed\
        \ TTL, \"the DB is the system\") but implemented like (B) (resume hard-depends\
        \ on the Redis key). Pick one and make it honest.\n\n---\n\n## 5. Recommended\
        \ fixes (combine for defense-in-depth)\n\n### 5.1 Sliding TTL scoped to the\
        \ fixed max (primary)\nRefresh the expiry on every activity heartbeat instead\
        \ of at creation.\n\n```\n# Python / redis-py — extend on every touch\ndef\
        \ touch_runtime(session_id, ttl=1800, max_ttl=86400):\n    key = f\"session:{session_id}\"\
        \n    pipe = redis.pipeline()\n    pipe.get(key)\n    if pipe.execute()[0]\
        \ is None:\n        return MISS  # already gone -> route to rebuild\n    pipe.incr_meta...\
        \   # (see example in 6)\n    pipe.expire(key, ttl)          # allow expiry\
        \ to extend\n    pipe.something_that_recovers(max_ttl)  # prevent indefinite\
        \ pinning\n    pipe.execute()\n```\n\nCap the sliding TTL at a **constant\
        \ maximum** so abandoned sessions don't leak memory forever: effective TTL\
        \ for an idle session = `min(sliding_ttl + elapsed_idle, max_session)`. Every\
        \ active turn calls `touch`, so *active* sessions never die mid-turn.\n\n\
        ### 5.2 Heartbeat from the DB-write path (closes the drift)\nEnsure the writer\
        \ that keeps the DB warm also refreshes Redis. If each committed turn updates\
        \ the DB, have that same transaction touch the runtime key — otherwise DB\
        \ stays warm while Redis times out.\n\n### 5.3 Rebuild path — make the miss\
        \ safe (the real \"continuation\" guarantee)\nNever let a Redis miss be a\
        \ hard failure. Add a reconciliation/hydration routine that checks the DB\
        \ and *rebuilds* minimal runtime state from the committed row:\n\n```\ndef\
        \ resume(session_id):\n    runtime = redis.get(f\"session:{session_id}\")\n\
        \    if runtime is None:\n        row = db.lookup(session_id)\n        if\
        \ row is None or row.abandoned:\n            return 404, \"session expired\"\
        \n        # reconstruct the *derivable* runtime from durable truth\n     \
        \   runtime = reconstruct_from_row(row)     # question cursor, stage, totals\n\
        \        rebuild(runtime, session_id)            # write back, then proceed\n\
        \    return continue_from(runtime)\n```\n\n### 5.4 Pin only the genuinely-indeterminate\
        \ state\nDistinguish **reconstructible** fields (cursor, stage, committed\
        \ totals — derivable from DB) from **ephemeral/indeterminate** fields (in-flight\
        \ streaming buffer, uncommitted partial answer, token accumulator mid-generation).\
        \ Only the ephemeral part truly *must* be pinned with a sliding TTL + keepalive;\
        \ the rest can safely be dropped and rebuilt. This shrinks the blast radius\
        \ of any TTL/eviction to irrecoverable-in-flight data only.\n\n### 5.5 Persist\
        \ a lifecycle checkpoint (optional but strongest)\nFor the truly-indeterminate\
        \ partial state (survive eviction, restart, failover), checkpoint to the DB\
        \ at coarse intervals — e.g. after each committed turn, or debounced during\
        \ long streaming — so rebuild never loses more than one checkpoint's worth.\n\
        \n### 5.6 Redis durability/policy hygiene\n- Use `volatile-ttl`/`volatile-lru`\
        \ carefully; never store these keys under `allkeys-lru` on a shared instance.\n\
        - `maxmemory-policy allkeys-lru` will evict session keys under pressure —\
        \ prefer a policy that protects your sessions (or size a dedicated Redis/namespace).\n\
        - Don't rely on Redis persistence (`AOF/RDB`/snapshots) as the session guarantee;\
        \ treat eviction as the norm.\n\n---\n\n## 6. Concrete example: sliding TTL\
        \ + rebuild handoff\n\n```python\nimport redis, time\nr = redis.Redis(decode_responses=True)\n\
        \nMAX_PIN   = 24 * 3600   # absolute ceiling: never let a session pin forever\n\
        AUTO_EXPIRE = 1800      # idle timeout that keeps sliding\n\nACTIVE_EVENTS\
        \ = (\"answer_committed\", \"heartbeat\", \"llm_progress\")\n\ndef touch(session_id,\
        \ reported_delta=0):\n    key = f\"session:{session_id}\"\n    now = int(time.time())\n\
        \    with r.pipeline() as p:\n        p.get(key)\n        p.expire(key, AUTO_EXPIRE)\
        \          # slide on any activity\n        p.hset(key, \"last_touch\", now)\n\
        \        p.execute()\n        # absolute guard: hard-expire at MAX_PIN via\
        \ client clamp\n    r.expire(key, min(AUTO_EXPIRE, max(1, MAX_PIN - now +\
        \ int(r.hget(key, \"created_at\")))))\n```\n\n**The load-bearing principle:**\
        \ every event that would commit to the DB *also* refreshes the sliding TTL\
        \ (5.2) so the DB and Redis die at the same logical boundary. And regardless\
        \ of TTL, `resume()` **never treats a miss as fatal** (5.3), so continuation\
        \ degrades to a safe rebuild instead of a break.\n\n---\n\n## 7. Anti-patterns\
        \ to reject in review\n\n- Fixed TTL with no activity extension (**the root\
        \ cause**).\n- Using DB existence as the only authorization for resume while\
        \ runtime deps live only in Redis.\n- Letting the DB writer path bypass Redis\
        \ refresh (drift).\n- Treating an in-memory, evictable, short-lived key as\
        \ a durable contract with no rebuild fallback.\n- Unbounded sliding TTL (memory\
        \ leak) or unbounded hard pinning (abandoned sessions linger forever).\n\n\
        ---\n\n## 8. Recommended backfill for the AI-interview use case\n\nFor a long-form\
        \ AI interview specifically, the highest-risk seams are the **in-progress\
        \ LLM turn** and **multi-hour sessions with idle pauses**. Minimum set to\
        \ land:\n\n1. **Sliding TTL on every activity event** (5.1) + **absolute ceiling**.\n\
        2. **Redis touch coupled to the DB write-through** (5.2) — eliminate drift.\n\
        3. **Graceful rebuild-from-DB on any miss** (5.3) with `reconstruct_from_row`.\n\
        4. **Checkpoint any in-flight partial / token-accumulator state to the DB**\
        \ at coarse intervals (5.5) so eviction/restart loses at most one checkpoint.\n\
        \nThese four close the \"DB valid, Redis dead, resume broken\" gap at every\
        \ layer: prevention (sliding + heartbeat), tolerance (rebuild on miss), and\
        \ durability (checkpointed indeterminate state).\n\n---\n\n*Note: I'm operating\
