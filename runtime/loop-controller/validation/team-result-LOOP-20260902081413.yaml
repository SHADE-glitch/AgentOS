      output: "# Supporting Analysis — Interview Session Runtime State & Redis TTL\
        \ Expiry\n\n**Contributor role:** Database Engineer (support into lead review)\n\
        **Problem:** Session *runtime* state kept in Redis under a **fixed TTL** silently\
        \ evicts while the authoritative row in the DB remains valid; later requests\
        \ fail to continue the interview.\n\n---\n\n## 1. Architectural framing (why\
        \ two stores exist)\n\n| Store | Kind of state | Failure model |\n|---|---|---|\n\
        | **DB** | Authorship/durable facts: interview `id`, `status=active`, recorded\
        \ answers, candidate id, timestamps | Durable, survives restarts |\n| **Redis**\
        \ | *Volatile runtime context*: current step cursor, last in-flight action,\
        \ email/token rate-limit buckets, transient pointers (message ids, file offsets),\
        \ optimistic-lock guards | In-memory, evictable |\n\nThe DB is *authoritative\
        \ and slow*, Redis is *fast and ephemeral*. Continuation logic typically does:\n\
        \n1. Read session row from DB → found & `status=active` → assume everything\
        \ is fine.\n2. Load runtime state from Redis → **cache miss / `nil`**.\n3.\
        \ Code path that assumed Redis non-null now throws (`NoneType` / `KeyError`)\
        \ or silently aborts the pending step.\n\nThat step 2/3 mismatch is exactly\
        \ the \"breaks\" your report describes.\n\n---\n\n## 2. When the fixed-TTL\
        \ expiry silently breaks continuation\n\nA **fixed TTL** (`SET key val EX\
        \ 7200`, or `SETEX`) counts down from the *last write*, not from the *last\
        \ user activity*. Continuation breaks in these concrete cases:\n\n1. **Session\
        \ outlives a single fixed window.** Long-form live interviews (code walk,\
        \ file review, multi-part followups) commonly exceed 30–120 min. The runtime\
        \ key is written once at session creation; the candidate stays active; at\
        \ the 60-min mark TTL hits 0. Redis lazy-deletes the key at next access →\
        \ miss mid-interview even though the user is *actively* engaged.\n\n2. **Renew-on-write\
        \ bug:** only the *first* write uses `SET key ... EX N`. Subsequent updates\
        \ (step advances, appended context) use `SET key val` **without** `EX`, so\
        \ they neither extend the TTL nor, worse, if using raw `SET` the TTL is **cleared**\
        \ (Redis: any `SET` without `EX/PX/EXAT` drops the previous TTL), changing\
        \ backlog semantics silently.\n\n3. **Renew-on-read missing.** Even if the\
        \ value is read continuously, a fixed TTL set at creation is never extended\
        \ → idle-looking reads still expire.\n\n4. **Step-boundary assumption.** Runtime\
        \ state stores an in-flight *pointer* (e.g. \"you are mid-answer #3, continuation\
        \ token `X`\"). When it expires, the **DB shows status=active and 3 recorded\
        \ answers**, so the app doesn't re-create state, but it cannot resume the\
        \ *in-flight* 3→4 transition → a hard break or a corrupted resume.\n\n5. **Skew\
        \ tolerances / long-submit flows.** If rate-limit or anti-double-submit tokens\
        \ live in Redis with a short TTL, a legitimate long submit (large upload)\
        \ may cross the token TTL → false \"expired token / duplicate submit\" rejection\
        \ even though the DB session is valid.\n\n6. **Clock skew.** `SETEX`/`EXAT`\
        \ use wall-clock from the Redis *server*. If app and Redis clocks drift, the\
        \ \"remaining TTL\" the app believes and the actual window diverge → premature\
        \ or deferred expiry.\n\nCareful: **idle-timeout** is sometimes the *intended*\
        \ behavior (abandoned session reaped). Fixed-TTL is dangerous because it cannot\
        \ distinguish \"idle\" from \"active-but-long\" — the silent part is that\
        \ it evicts active sessions, then the DB says active, so no one is told.\n\
        \n---\n\n## 3. Why DB-validity alone is not enough\n\nThe DB row is only a\
        \ *latch*: `active` means \"interview has started and not been finalized.\"\
        \ It holds **committed** answers. The *current* answer being composed, the\
        \ cursor, and transient guards live in Redis. Resuming requires **both**.\
        \ \"DB valid\" therefore does **not** imply \"continuable\" — it only implies\
        \ \"authoritative fact store intact.\" The design flaw is coupling: **a DB\
        \ read is used as a canary for Redis state.** That coupling must be broken.\n\
        \n---\n\n## 4. Recommended fixes (layered)\n\n**A. Make the TTL sliding (activity-based),\
        \ not fixed.**\n```redis\n# On every read/access that touches runtime state:\n\
        EXPIRE key 7200        # or: EXPIRE key 7200 NX if you only renew under threshold\n\
        MULTI\n  GET key\n  EXPIRE key 7200\nEXEC\n```\nBetter: renew only when residual\
        \ TTL < threshold to avoid a road of writes:\n```python\nttl = r.ttl(key)\n\
        if ttl != -1 and ttl < 1800:      # ignore persistent keys, avoid hot writes\n\
        \    r.expire(key, 7200)\n```\n\n**B. Decouple: make Redis a cache-aside,\
        \ DB stays authoritative (rehydrate on miss).**\n```python\ndef resume(session_id):\n\
        \    st = r.get(f\"iv:{session_id}:ctx\")\n    if st is None:\n        # DB\
        \ is source of truth for committed facts; rebuild volatile context\n     \
        \   row = db.get_session(session_id)\n        if row is None or row.status\
        \ != \"active\":\n            return session_gone()\n        st = build_runtime_state_from_db(row)\
        \     # cursor = last committed answer\n        r.set(f\"iv:{session_id}:ctx\"\
        , st, ex=SLIDING_TTL)\n        mark_rehydration(session_id)              #\
        \ observability signal\n    return apply(st)\n```\nWith this, a Redis miss\
        \ degrades gracefully (re-create from DB) instead of throwing.\n\n**C. Persist\
        \ a durable continuation point.** Store the *last committed step/token* in\
        \ the DB (or a Redis-backed journal you can rebuild). On miss, resume from\
        \ the last *committed* position, never from \"nothing.\"\n\n**D. Constants/lifecycle\
        \ hygiene.**\n- `TTL >= max_expected_session_length + margin`, and add an\
        \ explicit idle (Last-Activity) timeline in the DB so reaping is *intentional*,\
        \ not accidental.\n- Never clear TTL on partial update — always re-apply `EX`\
        \ on every write, or use `GETDEL`/`SET ... KEEPTTL` deliberately.\n- Centralize\
        \ TTL in a config map; set the same constant in both DB session-keepalive\
        \ job and Redis expiration so they never drift.\n\n**E. Observability to kill\
        \ the \"silent\" part.**\n- Metric: `redis_runtime_miss_total` by session\
