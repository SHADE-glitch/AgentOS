        \ expire intentionally per DB last-activity policy.\n5. Load/clock test: confirm\
        \ no hot-write amplification from per-access renewals with the threshold guard.\n\
        \n**Bottom line:** the break is a *fixed vs. sliding TTL* coupling bug where\
        \ the DB `active` latch masks Redis eviction. Slide the TTL on activity and\
        \ rehydrate volatile state from the authoritative DB on miss — then a DB-valid\
