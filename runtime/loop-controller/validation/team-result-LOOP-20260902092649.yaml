      output: '# Database Engineer — Contribution

        Task: F1 — Redis fixed-TTL session runtime state silently expires while DB
        stays valid; explain **when** and **why** continuation breaks.


        I read the live code: `InterviewStateStore.java`, `InterviewService.java`
        (`requireAsking`, `answer`, `answerStream`, lock path), and the schema. Findings
        below are grounded in those files.


        ---


        ## 1. The system as-is (authority model)


        - Redis is declared the **single authoritative source** for the state machine
        (`InterviewStateStore.java:15`).

        - Every write uses an **absolute, fixed TTL**: `bucket.set(json, TTL_HOURS,
        TimeUnit.HOURS)` — `TTL_HOURS = 24` (`InterviewStateStore.java:25, 51`).

        - Critical sub-point: TTL is refreshed on **every write**. `write()` is called
        on each turn (`InterviewService.java:116, 188, 264, 346`). So the TTL is really
        **"24h of silence since the last write"**, not "24h since session start."

        - Fallback exists in `requireAsking` (`InterviewService.java:380-399`): if
        `stateStore.read()` returns `null` (expired/missing), it re-hydrates a `SessionState`
        from the DB row (`status`, `questionCount`, `currentQuestionId`) and **re-writes
        it into Redis** with a fresh 24h TTL.

        - `answer()` / `answerStream()` each call `requireAsking(sessionId)` first
        (`:129, :204`) and then trust the returned `state` for progress (`state.questionCount()
        + 1` at `:179, :254`).


        ---


        ## 2. When continuation breaks


        Continuation breaks (or silently corrupts) when **the Redis key disappears
        before the DB row becomes the correct, current truth**, in these concrete
        windows:


        | # | Trigger | Mechanism | Effect |

        |---|---------|-----------|--------|

        | W1 | **Idle > 24h** since last write | Absolute TTL fires; `read()` → `null`
        | Fallback engaged |

        | W2 | **Memory eviction before TTL** | `maxmemory-policy` = `volatile-*`
        or `allkeys-*`; volatile keys can be evicted while a shorter-TTL or other
        key holds memory | Key gone despite TTL not elapsed → **TTL is an upper bound
        on presence, not a guarantee** |

        | W3 | **Redis restart** with `no` AOF / truncated RDB | Flush or partial
        persistence loses the volatile bucket | Key gone |

        | W4 | **Dual-write skew exposed by expiry** | `sessionMapper.updateById()`
        and `stateStore.write()` are two non-transactional writes (`:186` & `:188`);
        if one lags or fails, one side is ahead | When Redis (the side that was holding
        the new value) is removed, the DB''s older value becomes the re-hydration
        source → **drift is unmasked, then re-promoted** |


        W1 is the textbook case; W2 is the one most teams miss and is squarely a database-engineering
        concern: **Redis uses lazy/volatile expiration, so `SET EX` guarantees deletion
        at-or-before the TTL, never presence up-to-the-TTL.**


        The re-write in `requireAsking` (`:389`) is the amplifier: it **freezes whatever
        the DB denormalized columns hold back into Redis for another 24h**, before
        validating them against the actual message log.


        ---


        ## 3. Why continuation breaks (root causes → gold issues G1–G5)


        - **G1 — Fixed TTL on authoritative runtime state.** The state machine treats
        a volatile, evictable cache as the source of truth, so its existence has no
        durability guarantee. Fixing this by *raising* the TTL only delays W1 and
        does nothing for W2/W3.

        - **G2 — No freshness validation before use.** `requireAsking` does a plain
        `state == null → rebuild from DB`, with zero check on TTL, no version/stamp,
        no parity check between Redis fields and the DB row (or the `interview_message`
        log). It cannot tell "expired but DB current" from "expired and DB stale."

        - **G3 — Fallback masks drift instead of detecting it.** The null-case silently
        re-hydrates and re-writes, i.e. it *converts* an anomaly into a "successful"
        continuation. There is no log, no surfaced state mismatch, so the divergence
        persists invisibly.

        - **G4 — Continuation depends on missing state.** `answer`/`answerStream`
        throw `INTERVIEW_STATE_ERROR "当前状态不允许提交答案" :396` if the reconstructed DB status
        is not `ASKING`/`START`. So a *valid* in-progress session can become un-answerable
        purely because the runtime value expired and the DB status/order differs from
        what the flow expects.

        - **G5 — Non-transactional dual-write.** No ordering or atomicity between
        DB update and Redis write; a crash between `:186` and `:188` (or a swallowed
        write failure, note `write()` logs and rethrows at `:52-55`) permanently desynchronizes
        the counter, and expiry exposes it.


        **The silently-corrupt case (worst):** DB `questionCount` is a *denormalized
        counter* that can drift from the real progress (the actual `interview_message`
        "question" rows). After expiry, the fallback promotes that stale counter back
        into Redis (`:189`). Subsequent `state.questionCount() + 1` then either re-serves
        an already-asked question (counter under-approx → duplicate question to the
        user) or trips `shouldFinish`/`MAX_QUESTIONS` early (counter over-approx →
        premature finish, remaining questions dropped). The report/counters diverge
        from the true history — and nobody stops it, because the fallback returned
        success.


        ---


        ## 4. Recommendations (DBE priority order, not "raise the TTL")


        1. **Make the DB row the source of truth for continuation; treat Redis as
        a *projection/cache* with a freshness marker, not authority.** Invert the
        trust: `requireAsking` should always read the DB row, and use Redis only as
        a fast path guarded by a stored `freshness`/`version`/`updatedAt`.

        2. **Detect, don''t mask, the fallback.** On Redis miss, compare the DB row
        against the `interview_message` log (recompute `questionCount` from the count
        of kind=''question'' rows) and log/flag any mismatch instead of blindly writing
        it back. At minimum, don''t re-write a reconstructed value without a parity
        check.

        3. **Derive `questionCount` from the log, not the denormalized column.** Eliminates
        G2/G3/G4 for the counter and stops the re-promotion of stale counts.

        4. **Make the dual-write safe or idempotent.** Compute progress once and persist
        atomically (wrap DB update + result insert in a transaction; make Redis refresh
        a side effect of a successful DB commit via outbox or at least a consistent
        ordering). Optionally include a monotonically increasing version in both DB
        and Redis and refuse to overwrite with an older one.

        5. **Fix the TTL mental model / eviction risk.** Use `volatile-ttl` aware
        eviction, keep persistence (AOF) on so a restart does not drop live sessions,
        and choose a TTL that represents *acceptable actor-idle window*, not a session
        ceiling.

        6. **Surface a dedicated error when continuation cannot be safely reconstructed**
        (e.g. DB has no ASKING/START status) rather than the generic "当前状态不允许提交答案",
        and let a `SELECT ... FOR UPDATE`/`getAndSet` under the existing per-session
        lock re-seed Redis deterministically.


        ---


        This confirms the benchmark''s lesson vector: **prioritize freshness validation
        + drift detection over TTL extension; verify DB parity before accepting fallback.**
        No memory retrieval was needed; the analysis is grounded directly in `InterviewStateStore.java:25,34-60`
        and `InterviewService.java:380-399,125-195`.'
