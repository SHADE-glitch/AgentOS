      output: "# Database Engineer — Contribution: Redis Fixed-TTL Runtime State Expiry\
        \ vs Durable DB\n\n## 1. Summary\n\nThe interview state machine exposes a\
        \ **single-authority runtime cache that is not the durable truth**, contradicting\
