        \ = new SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId());\n\
        \    stateStore.write(sessionId, state);   // re-hydrates, re-arms 24h\n}\n\
        ```\nSo a single idle-expiry on the `answer`/`answerStream` path self-repairs.\
        \ **Continuation breaks in these concrete cases:**\n\n- **(A) Non-`answer*`\
