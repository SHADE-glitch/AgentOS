        The Redis `SessionState` (`interview:session:{id}`, fixed `TTL_HOURS = 24`
        at `InterviewStateStore.java:25`) is documented as the state machine''s "single
        authoritative source," but it is only a **thin 3-field snapshot** (`status`,
        `questionCount`, `currentQuestionId`) that is fully **duplicated** in the
        DB `interview_session` row. DB writes always commit **before** the Redis write
        (create/answer/finishSession), and the read path has a DB-fallback in `requireAsking(...)`
        (`InterviewService.java:380-399`). So a **clean, single** TTL expiry is *mostly
        survivable*.


        Continuation **genuinely breaks** only under the specific conditions enumerated
        below — the dangerous ones are silent-expiry **during** an active state transition,
        stale-Redis-value precedence over DB, and any transient runtime field that
        is *not* persisted to DB being added to `SessionState`.


        ---


        ## 1. Evidence from source


        | Concern | Where | Fact |

        |---|---|---|

        | Fixed TTL | `InterviewStateStore.java:25,51` | `.set(json, 24, HOURS)` —
        **resets** to 24h on every write. Pure time-based expiry only fires after
        ~24h of a given session getting no writes. |

        | Redis is "authoritative" | class javadoc `:14-15` | "存于 Redis，作为状态机的单一权威来源"
        |

        | DB duplication | `InterviewSession` entity (status/questionCount/currentQuestionId)
        + full transcript in `InterviewMessage` | The transcript — the real input
        to QA extraction & dedup — lives **only** in DB, never in Redis. |

        | Write ordering | `InterviewService.java:186/188`, `114/116`, `344/345` |
        DB `updateById` runs **before** `stateStore.write` every time. |

        | Expiry fallback | `requireAsking` `InterviewService.java:382-398` | `read()==null`
        → rebuild from DB → re-write to Redis. Held under the per-session lock. |

        | Read trusts Redis blindly | `requireAsking` checks only `FINISHED`/`ASKING`;
        no DB reconciliation when value is present | A stale/divergent Redis snapshot
        is used **as-is**. |


        ---


        ## 2. When & why continuation breaks


        Breakage is a function of (A) **the TTL actually firing**, and (B) **the lossy
        nature of the snapshot + recovery**.


        ### Why a fixed TTL silently expires while DB stays valid

        - Fixed TTL means the **clock is reset only on write**, not on access (`getBudget()`
        in Redisson reads do NOT extend TTL). A user who idles >24h between two answers
        lets the key lapse.

        - **Eviction is an additional silent path beyond TTL.** This deployment''s
        Redis (`docker-compose.yml:24`, `RedissonConfig.java`) is a **single server
        with no `maxmemory` / `maxmemory-policy` set** → defaults to `noeviction`.
        So in this stack, pure-Redis-config eviction won''t silently drop TTL''d keys.
        But any prod variant setting `allkeys-lru`/`volatile-lru` will evict **mid-session
        regardless of last-write**, making expiry impossible to predict and independent
        of activity.


        ### Break condition 1 — Loss of fields NOT mirrored in the DB

        The current 3 fields are safe (DB-duplicated). **The moment `SessionState`
        grows a field that lives only in Redis** (e.g., in-flight SSE token, partial
        streaming buffer, reserved lock/rate-limit slot, mid-scoring progress), an
        expiry loses it irreversibly. The DB fallback then **reconstructs a valid-but-wrong
        snapshot**, and the interviewer unblocks on a question but the missing runtime
        context corrupts the transition. This is the primary "continuation breaks"
        scenario this task is guarding against.


        ### Break condition 2 — Expiry during an active state transition (race)

        `answerStream` runs in a virtual thread with a **300s SSE window** (`InterviewService.java:198`).
        The transition is a multi-step DB+Redis sequence. A 24h TTL can''t normally
        fire *during* a 300s window, but an **LRU eviction under memory pressure can**.
        Once evicted:

        - the in-flight thread later `write`s a fresh 24h TTL with **post-transition**
        values while readers already fell back to the DB''s **pre-transition** values
        → DB and Redis now hold different states.

        - Follow-on `answer()` reads the reconstructed/pre-transition state (or the
        just-reWritten one) — **the state machine silently jumps or repeats**, since
        nothing detects which copy is newer. No version/timestamp exists to disambiguate.


        ### Break condition 3 — Stale Redis wins over newer DB (no reconciliation
        on hit)

        Because `requireAsking` returns on non-null cached value without comparing
        to DB, any **partial-failure divergence** (Redis write succeeded but DB `updateById`
        failed, or the reverse) is masked while Redis is fresh, then turned into **stale
        continuation** after the next TTL expiry flips the source back to DB — or
        vice-versa.


        ### Break condition 4 — (Non-break to confirm) single clean expiry is OK

        If exactly one expiry happens with **no** in-flight transition, recovery works:
        `requireAsking` rebuilds `{status, questionCount, currentQuestionId}` from
        `interview_session`, and the transcript/dedup recompute from `interview_message`
        (`InterviewService.java:134-144`). A single resumed answer is correct and
        TTL is re-established. This is the *healthy* path and worth stating so the
        lead knows the floor of correctness.


        ---


        ## 3. When it breaks — decision table


        | Scenario | TTL fires? | Continuation | Root cause |

        |---|---|---|---|

        | User idle >24h between answers; no in-flight op | Yes | ✅ OK | DB fallback
        reconstructs the same 3 fields |

        | Session `FINISHED` in DB, Redis gone | Yes | ✅ correctly rejected | `INTERVIEW_FINISHED`
        |

        | LRU/volatile eviction **mid-active** session | Independent of TTL | ❌ **can
        silently jump/repeat** | no versioning; DB≠Redis snapshot race |

        | Non-DB-persisted runtime field added to `SessionState` | Yes | ❌ **broken**
        | lossy snapshot, no recovery source |

        | Partial DB↔Redis write failure, then expiry | Yes | ❌ **stale continuation**
        | cached value trusted without reconcile |


        ---


        ## 4. Recommendations (DB-engineer view)


        1. **Make the state machine DB-owner, Redis a cache, not authority.** Keep
        `interview_session` as the single writable source; treat the Redis snapshot
        as read-through cache. Remove the javadoc''s "single authoritative source"
        claim — it is already false given fallback exists.

        2. **No fixed TTL for a live-session key — use sliding TTL + heartbeat, or
        DB-driven liveness.** Set an idle/sliding expiry (e.g., reset on every `answer`,
        plus a `PING`/lease heartbeat from the SSE thread) instead of a hard 24h.
        Prefer Redis-driving expiry only for *definitely-abandoned* sessions.

        3. **Add a monotonic `version`/`stateSeq` to `SessionState` and compare with
        DB before applying.** On read, if cached version < DB version, ignore/refresh
        cache; only trust cache when versions match. This kills Break 2 & 3.

        4. **Never store non-recoverable transient context only in Redis.** Stream/buffer/lease
        context must be derivable from DB transcript or be short-lived and rebuilt
        on resume.

        5. **Set Redis eviction policy deliberately.** Pin `maxmemory-policy` (prefer
        `volatile-ttl`/`allkeys-lru` explicit) and add `maxmemory` so silent eviction
        is a *decision*, plus an alert on `expired_keys`/`evicted_keys` metrics.

        6. **Make DB↔Redis update atomic-feeling:** since DB write precedes Redis
        and both are best-effort, tolerate Redis failure (cache-miss → DB fallback)
        but **never** continue on a Redis hit without DB validation when the state
        machine could have advanced.


        ## 5. Open items for the lead

        - Confirm whether prod Redis sets `maxmemory*` (determines how real Break
        2 is).

        - Confirm the intended "session continuation" UX scope: mid-interview resume
        only, or also "resume yesterday''s finished session" (the latter requires
        re-architecting Redis authority → DB, which is the safer end state).


        ---


        Verification note: I validated against the actual `InterviewStateStore.java`,
        `InterviewService.java`, `RedissonConfig.java`, and `docker-compose.yml` in
        this repo; no state-related Redis consumers beyond `InterviewService` exist,
        so the analysis is complete for the current surface.'
