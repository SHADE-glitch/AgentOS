    output: "# Interview Session Continuation: Fixed-TTL Redis Runtime State vs. Durable\
      \ DB\n\n## 1. 目标 / Scope\n\n- **业务目标**: 面试会话允许用户暂停后恢复 (resume/continuation)。恢复必须基于最近且一致的状态，不能让用户看到倒退、重复提问，或\"\
      回到已完成会话\"。\n- **当前约束**: 运行时状态存 Redis（Redisson），持久状态存 MySQL。同一逻辑状态在两处各有一份，且不是原子写入。\n\
      - **成功标准**: 会话可随时恢复；Redis 过期不应造成静默的、错误的续接；DB 与 Redis 永不发生\"状态回退\"。\n\n## 2.\
      \ 问题判断 — 根因与触发条件\n\n仓库实测（已核对代码）：\n\n- 运行时状态 `SessionState{status, questionCount,\
      \ currentQuestionId}` 存于 `interview:session:{id}`，**固定 24h TTL**（`InterviewStateStore.java:25,51`）。\n\
      - TTL 只在**写**时重置（`set(key, json, 24h)` 覆盖），**读路径不续期**。前端恢复走 `getInterview →\
      \ interviewService.detail → 纯 DB`（`Interview.vue:15-18`，`InterviewService.java:291-299`），**完全不\
      \ touch Redis**。\n- 每次状态迁移是 **DB + Redis 双写且在锁内**（`create/answer/answerStream/finishSession`），但\
      \ `sessionMapper.updateById` 与 `stateStore.write` **非事务，无版本号**。\n- 续接守卫 `requireAsking`（`InterviewService.java:380-399`）：Redis\
      \ miss → **从 DB 盲重建并重写 Redis（重置 24h）**，不校验状态转移合法性、计数器一致性、新旧程度。\n- `stateStore.delete`\
      \ 无任何调用者（`InterviewStateStore.java:58-60`），finish 后 Redis 不显式清理。\n\n**根因一句话**：Redis\
      \ 的 TTL 是\"距最后一次写入的时间\"决定的固定窗，与 DB 中会话的逻辑生命周期解耦；且双写不具备原子性和版本控制。因此当二者生命周期/内容分叉时，\"\
      静默过期 + 无版本盲重建\"会把**过时或超前**的状态当作真相，续接在用户无感中出错。\n\n### \"何时断\"的精确回答（区分硬断与软断）\n\
      \n关键事实：本实现**有 DB 回退重建**，所以单纯的\"闲置 > 24h\"并不会硬失败（会被重水合掩蔽）。因此它不像教科书上的固定 TTL 那样直接\
      \ 404/401，而是产生**四类更隐蔽的续接故障**：\n\n| # | 触发场景 | 是否硬中断 | 实际表现 |\n|---|---|---|---|\n\
      | S1 | 闲置 24h、且无回退路径（DB 也不存在或回退逻辑被收紧/加锁） | 硬断 | `INTERVIEW_STATE_ERROR` / `NOT_FOUND`，用户续接失败\
      \ |\n| S2 | **Redis 比 DB 超前**（DB 更新失败但 Redis 写成功）后过期 → 重建 | 软断 | 状态**回退一个问题**（questionCount-1），下一题重复\
      \ |\n| S3 | **DB 比 Redis 超前**（Redis 写失败）且 Redis 残留旧值不过期 | 软断 | 读到陈旧问题，直到 TTL\
      \ 或下次双写覆盖 |\n| S4 | **finish/scoring 半路失败**：DB 停留 `ASKING`，Redis 已过期 | 软断 |\
      \ 重建后**续接一个逻辑上已结束的会话**，可重复作答、重复上报 |\n| S5 | 活跃浏览但不作答 >24h（读不续期） | 软断 | 每次恢复都触发一次\
      \ Redis 冷重建 + 锁竞争 |\n\n## 3. 为什么（机制链）\n\n1. **固定而非滑动的 TTL**：写时重置、读时不重置 → 一个\"\
      多数时间只看不答\"的用户，其 Redis 会在 24h 静默消失（S5）。\n2. **TTL 与业务生命周期完全脱钩**：24h 是硬编码（`InterviewStateStore.java:25`，无配置项），不随会话实际时长/状态调整。\n\
      3. **双写非原子、无版本**：`updateById` 与 `write` 之间无事务、无比较依据。若只成功一半，Redis 与 DB 就是两份不一致的可信拷贝（S2/S3\
      \ 的种子）。\n4. **回退重建是\"盲\"的**：`requireAsking` 用 DB 列直接覆盖 Redis，**不校验** status\
      \ 合法性、questionCount 单调性、是否应已完成 → 把过期错误固化成\"真相\"，并计时器重置（S4）。\n5. **无清理路径**：`delete`\
      \ 无调用 → FINISHED/废弃 key 残留，阶段性占据容量、更易被读到陈旧值。\n\n## 4. 方案设计\n\n**Option A — 双层滑动\
      \ TTL（最小改动）**\n- 优：改动小；读/写路径都 `expire()` 续期，闲置才到期。\n- 劣：仍无版本，仍依赖 DB 回退的正确性；只缓解\
      \ S5。\n- 适用：先止血。\n\n**Option B — Redis 降级为派生缓存，DB 为唯一权威 + 单调版本**\n- 优：解决 S2/S3/S4；重建基于\"\
      最新版本\"，不会回退/复活已结束会话。\n- 劣：续接守卫需新增版本字段与状态校验逻辑；改动中等。\n- 适用：作为根治方案（推荐）。\n\n**Option\
      \ C — 到期不重建，显式 `SESSION_EXPIRED` 让前端提示重开**\n- 优：语义最清晰，绝不静默续接。\n- 劣：用户需重开，体验折扣；需前后端配合。\n\
      - 适用：当会话老到确实该重开时兜底。\n\n**Decision — 推荐 B，辅以 A 与 C 的关键点**：DB 唯一权威 + 版本化重建 + 双层滑动\
      \ TTL + 显式可重试的过期语义。\n\n## 5. 实施方案\n\n### 5.1 滑动 TTL — 读与写都续期（A）\n\n```java\n\
      // InterviewStateStore.java — 新增显式续期，读/写共用\nprivate static final long TTL_HOURS\
      \ = 24;\n\npublic SessionState read(Long sessionId) {\n    RBucket<SessionState>\
      \ b = redissonClient.getBucket(key(sessionId));\n    SessionState s = b.get();\
      \               // null => 过期/缺失, 不透明\n    if (s != null) {\n        b.expire(Duration.ofHours(TTL_HOURS));\
      \  // 读也续期 => 真正滑动\n    }\n    return s;\n}\n```\n\n### 5.2 版本化状态 — 防回退 / 防复活（B\
      \ 核心）\n\n给 `SessionState` 与 DB 行都加 `version`（或复用 `updatedAt` 时间戳比较）：\n\n```java\n\
      public record SessionState(\n    InterviewStatus status, int questionCount,\n\
      \    Long currentQuestionId, long version) {}\n```\n\n双写处原子升级（锁内已保证同一会话串行）：\n\
      \n```java\nvoid saveState(sessionId, SessionState next) {\n    SessionState\
      \ nextV = next.withVersion(next.version() + 1);\n    sessionMapper.updateVersioned(sessionId,\
      \ next.status,   // UPDATE ... WHERE version = ?\n                         \
      \        next.questionCount, next.currentQuestionId, nextV.version());\n   \
      \ stateStore.write(sessionId, nextV);                     // Redisson set, 滑动\
      \ TTL\n}\n```\n\n`requireAsking` 重建改为**有条件重建**（禁止用旧 DB 覆盖更新的 Redis，禁止复活逻辑上结束的会话）：\n\
      \n```java\nSessionState s = stateStore.read(id);\nif (s == null) {\n    Session\
      \ row = sessionMapper.selectById(id);              // DB\n    if (row == null)\
      \ throw INTERVIEW_NOT_FOUND;\n    // 关键：绝不重启逻辑上已完成、仅因 Redis 过期而消失的会话\n    if\
      \ (row.status == FINISHED) throw INTERVIEW_FINISHED;\n    if (row.status !=\
      \ ASKING && row.status != START) throw INTERVIEW_STATE_ERROR;\n\n    s = fromRow(row);\
      \                                        // 携带 DB 版本\n    stateStore.write(id,\
      \ s);                                 // 滑动续期\n}\n```\n\n若新增 `version`，重建条件应为\
      \ `db.version >= redis.version` 才写，否则保留更新的一方。\n\n### 5.3 显式过期语义（防护，前台可提示重开）\n\
      \n给 `requireAsking`/`answer*` 抛 `SessionExpiredException`（区分于普通状态错误），前端 `Interview.vue:74`\
      \ 的 refetch/续接处捕获并提示\"会话超时，是否重开\"，而非静默重建。\n\n### 5.4 清理路径\n\n在 `finishSession`（`InterviewService.java:340-359`）成功后显式\
      \ `stateStore.delete(sessionId)`，避免 FINISHED key 残留 / 被合入下一轮去重启（顺带修复 `delete`\
      \ 无调用者的问题）。\n\n### 5.5 可配置\n\n将 TTL 移入配置：`application.yml` 增加 `app.interview.session-ttl`，默认\
      \ 24h，生产建议按业务 SLA 设值。\n\n### 风险点与处理\n- 加版本字段需同步 DB 迁移（`ALTER TABLE interview_session\
      \ ADD COLUMN version BIGINT DEFAULT 0`）；重建必须在校验后写，防止 S4 复活。\n- 滑动的\"读续期\"会降低\"\
      该休止会话到期\"的语义 —— 用**绝对上限 + 闲置上限**双窗，避免活浏览也永不过期。\n\n## 6. 验证方式\n\n- **单元**: `InterviewStateStoreConfigTest`\
      \ — 写入后 `expire` 重置、读取后 TTL 被续期、过期后 `read` 返回 null。\n- **集成/回归**: 构造 S2/S3（分别模拟\
      \ DB 更新失败、Redis 写失败，用 Redisson Mock 或故障注入），断言 continuation 不回退、不重复。\n- **基准**:\
      \ `Phase-8.2.1.2-Runtime-Benchmark.md` 已标记该风险（`:39-40,62-133`）——补充\"闲置 24h 后恢复\"\
      与\"并发双写故障\"两条用例。\n- 指标：监控 `interview:session:*` 的 rehydrate 频次（回退重建率异常升高即 TTL/一致性配置告警信号）。\n\
      \n## 7. 复盘建议\n\n- **短期**（止血）: 启用 5.1 滑动续期 + 5.3 显式过期异常即可显著降低软断。\n- **根治**（推荐做）:\
      \ 落地 5.2 版本化重建，确立\"DB 为唯一权威、Redis 为版本可校验的派生镜像\"的最终数据流，从架构上消除\"S2 回退 / S4 复活\"\
      这类静默错误；届时固定 TTL 不再是正确性风险，只是容量与性能策略。\n- **长期**: 若要对跨微服务一致性做更强的保证，可评估事务性 Outbox（DB\
      \ 变更 → 事件 → 重建 Redis），但以当前单体与双写范围，版本化重建已是成本/收益最优解。\n\n> 一句话结论：固定 24h TTL 不与\
      \ DB 生命周期对齐，叠加\"无版本、盲重建\"的回退路径，使续接在闲置过期后被**静默重建为错误状态**——不是\"回退式断连\"而是\"不报错地接着错下去\"\
      ；根治之道是把 DB 定为唯一权威并给状态加单调版本。"
