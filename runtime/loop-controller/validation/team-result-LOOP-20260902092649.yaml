        \ and returns `null` (`InterviewStateStore.java:42-44`). A corrupt/truncated\
        \ value is indistinguishable from an expired key.\n\n## 4. Why / when continuation\
        \ actually breaks\n\n**The happy path is accidentally healed** — `requireAsking()`\
        \ (`InterviewService.java:380-399`):\n```java\nSessionState state = stateStore.read(sessionId);\n\
        if (state == null) {\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
