        \ any interview paused longer than the TTL silently loses its in-memory state\
        \ while the DB row stays valid. Continuation does not *always* break on resume\
        \ — a fallback in `requireAsking` (`InterviewService.java:380-399`) re-hydrates\
        \ from DB — but the design has real bug windows. The primary bug is not \"\
        resume always fails\"; it is that **the system silently depends on an unstated,\
        \ partial DB-fallback recovery that only exists on the `answer*` path**, while\
        \ Redis is still declared the authoritative store. That contradiction is the\
        \ root cause of every continuation failure below.\n\n## 2. Root cause\n\n\
        - **Fixed, activity-independent TTL.** `write()` re-arms `EXPIRE 24h` on every\
        \ interaction, but there is **no keepalive/heartbeat and no lifecycle-to-TTL\
        \ mapping**. A user starting an interview and returning after >24h idle hits\
        \ a justified-but-silent expiry.\n- **Two sources of truth with no invariant.**\
        \ Default `maxmemory-policy` in `docker-compose.yml` Redis (`redis:7-alpine`)\
        \ is `noeviction`, with no persistence config shown and no AOF guaranteed\
        \ on a restart. Under `noeviction` writes start failing once memory is exhausted;\
        \ under a misconfigured `allkeys-lru` policy the expiring key competes with\
        \ non-expiring keys.\n- **Divergence window without expiry at all.** In `answer()`/`answerStream()`,\
        \ `sessionMapper.updateById()` (DB) executes *before* `stateStore.write()`\
        \ (Redis). A crash between them leaves DB-newer/Redis-older, and `read()`\
        \ does **not** validate Redis against DB — stale state is used.\n\n## 3. When\
        \ it silently expires (Redis gone, DB valid)\n\n1. **Idle > TTL (canonical):**\
        \ session created, user answers a few questions, walks away; 24h later the\
        \ key is gone. DB `interview_session` + accumulated `interview_message` rows\
        \ remain fully valid.\n2. **Redis restart / flush / failover without persistence:**\
