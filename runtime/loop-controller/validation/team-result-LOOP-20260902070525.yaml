      output: "## [Support Review] Redis fixed-TTL runtime state vs. persistent DB\
        \ validity — continuation failure analysis\n\n**Reviewer domain:** Database\
        \ / data-lifecycle correctness  \n**Verdict summary:** Silent expiry is expected\
        \ Redis behavior, but the *fix represented as* \"Redis expires but DB stays\
        \ valid\" surfaces a **consistency/authority split** that the review must\
        \ close.\n\n---\n\n### 1. Root cause (why it breaks at all)\n\nThe invariant\
        \ that must hold is: **the runtime session is the source of *continuation*\
        \ truth, the DB row is the source of *recorded* truth.** They have different\
        \ lifecycles. When they diverge:\n\n- **Redis** holds ephemeral continuation\
        \ state (current question index, partial transcript buffer, drafting/LLM in-flight\
        \ payloads, sandbox file handles, per-step timers, anti-replay nonces).\n\
        - **DB** holds durable rows (interview record — usually marked `in_progress`).\n\
        - Redis's `EXPIRE` fires on a **fixed wall-clock deadline set at creation**,\
        \ not tied to DB status, not refreshed by activity. The key vanishes; the\
        \ DB row is untouched and still `in_progress`.\n\nContinuation breaks precisely\
        \ because the DB said \"this interview is valid and incomplete,\" but the\
        \ only place that knew *exactly where* it was incomplete is gone.\n\n---\n\
        \n### 2. When continuation breaks — concrete scenarios\n\n| Scenario | Mechanism\
        \ | Why continuation breaks |\n|---|---|---|\n| **Long-but-active session**\
        \ | User works > fixed TTL while actively answering. Fixed TTL ≠ sliding TTL,\
        \ so activity does not extend it. | Next step reads miss → session \"forgotten\"\
        \ mid-flow even though the user never went idle. |\n| **Idle pause / think\
        \ time** | Thinking, reading, tab switch, slow typing stalls requests between\
        \ writes. | The gap exceeds TTL; no heartbeat exists to keep it alive. |\n\
        | **TTL mismatch with DB status** | Redis TTL (short) vs. expected interview\
        \ duration (long) calibrated wrongly. | DB still `in_progress`, Redis already\
        \ gone. |\n| **Eviction before TTL** | `maxmemory-policy` = `allkeys-lru`\
        \ / `volatile-lru` (or per-key volatility) can evict sooner under memory pressure.\
        \ | Same miss, plus **non-deterministic** — harder to predict than expiry.\
        \ |\n| **Rewrite not re-keyed** | Code calls `EXPIRE` or `SET … EX` only on\
        \ *creation*, or refreshes only on *writes of the canonical key* while ephemeral\
        \ sub-keys (e.g. `session:123:step:5`) each get their own shorter TTL. | One\
        \ hot sub-key dies; rehydration yields partial/corrupt state. |\n| **Renewal\
        \ race** | Window where TTL lapsed between the last renewal and the next request;\
        \ `DEL` happened but request already in-flight. | Classic TOCTOU strip on\
        \ continuation. |\n\n---\n\n### 3. Why the DB does not save you (the authority\
        \ split)\n\nEven though the DB is \"valid,\" you usually **cannot reconstruct**\
        \ from it:\n\n1. **Schema captures the record, not the trace** — columns/model\
        \ store the interview result, not the byte-by-byte intermediate buffers (drafting,\
        \ LLM context, partial answer, sandbox workspace). This is by design: DB is\
        \ the durable ledger, not a scratchpad.\n2. **Rehydration would need new DB\
        \ schema** (session snapshots/checkpoints → effectively turning Redis into\
        \ a cache of a DB copy). That is the fork in the road:\n\n```\nOption A —\
        \ Redis is a live cache / scratchpad (recommended default)\n   Authority \
        \ = Redis continuation state; DB = durable record\n   Failure    = silent\
        \ miss on restart → session cannot continue\n   Fix        = make TTL sliding\
        \ + refresh on every touch + reconstruct-on-miss\n\nOption B — Redis is a\
        \ write-through cache of DB serialized state\n   Authority  = DB (serialized\
        \ checkpoint written each step)\n   Redis miss = fetch + deserialize from\
        \ DB → continuation always recoverable\n   Cost       = DB writes per step,\
        \ serialization schema, cache-only partition querying\n```\n\nThe **decision\
        \ point for the lead** is: is losing mid-step ephemera acceptable, or must\
        \ every step be recoverable? That determines everything below.\n\n---\n\n\
        ### 4. Concrete remedies\n\n#### 4.1 Sliding TTL (minimum bar)\nRefresh the\
        \ TTL on **every touch**, not just creation. Nuance: use raw `EXPIRE` on every\
        \ read/write of the overarching session key, not only on write.\n\n```python\n\
        TTL_MS = 15 * 60 * 1000          # idle timeout, NOT session deadline\n\n\
        def touch(redis, session_id):\n    pipe = redis.pipeline()\n    pipe.expire(f\"\
        interview:{session_id}\", TTL_SECONDS)  # resets clock on activity\n    pipe.execute()\n\
        ```\n\n#### 4.2 Heartbeat on every request (cheap, safe)\nExtend TTL at each\
        \ HTTP step boundary so the timeout is *idle-based*, not total-duration-based:\n\
        \n```python\ndef handle_step(session_id):\n    with redis.pipeline() as p:\n\
        \        p.expire(session_id, TTL)\n        p.lpush(f\"interview:{session_id}:events\"\
        , step_payload)\n        p.expire(f\"interview:{session_id}:events\", TTL)\n\
        \        p.execute()\n```\n\n#### 4.3 Refactor to write-through checkpoint\
        \ for recoverable steps\nOnly if reconstruction is required. Dual-write the\
        \ *recoverable* checkpoint to DB; keep volatile detail in Redis.\n\n```python\n\
        # step boundary: persist a compact checkpoint to the DB row\nUPDATE interview\n\
        \   SET current_step=?, transcript_json=?, updated_at=utf_now()\n WHERE session_id=?;\n\
        \n# Redis is then merely a fast cache of that snapshot\n```\n\nTrade-off to\
        \ note in review: write amplification and per-step DB writes vs. recoverability.\
        \ For AI interview systems this is usually the right spend because interrupt/resume\
        \ is a headline UX.\n\n#### 4.4 Reconstruct-on-miss (hybrid, lowest latency\
        \ risk)\nOn any Redis miss, try to recover from DB `in_progress` row; if found\
        \ → **rebuild** Redis keys and continue; if not → normal fresh-session path.\n\
        \n```python\nstate = redis.get(key)\nif state is None:\n    row = db.fetch(WHERE\
        \ session_id=? AND status='in_progress')\n    if row:\n        state = deserialize(row[\"\
        transcript_json\"])     # or start over with a notice\n        redis.setex(key,\
        \ TTL, serialize(state))\n    else:\n        state = new_session()\n```\n\n\
        #### 4.5 Monitoring (covers the \"silent\" half)\n- `redis.info('stats')`\
        \ / `SCAN 0, type(expired_keys)` — alert on **expired_keys** deltas.\n- Track\
        \ evictions vs. expirations separately (`evicted_keys`); they are different\
        \ failure modes.\n- Log session misses distinctly (`session resumed`, `session\
        \ rebuild`, `session restart`) to detect the silent-expiry rate by workload\
        \ (long sessions vs. idle gaps).\n- Set `maxmemory-policy` deliberately: `volatile-ttl`\
        \ prioritizes least-remaining-TTL keys (still subject to pressure); `volatile-random`/`allkeys-*`\
        \ must be avoided for these keys if you care about predictability.\n\n---\n\
        \n### 5. Config recommendations (Redis)\n\n```toml\nmaxmemory-policy volatile-ttl\
        \      # if you must allow eviction; never allkeys-lru here\nmaxmemory 512mb\n\
        # optionally enable `notify-keyspace-events Ex` to stream expiry events for\
        \ cleanup hooks\n```\n\n---\n\n### 6. Open questions for the lead / backend\
        \ architect\n1. Is losing in-flight ephemera (partial answers, LLM draft)\
        \ an **acceptable** outcome? If yes → sliding TTL + reconstruct-on-fresh-miss\
        \ suffices. If no → requires write-through checkpoint and Redis-as-cache,\
        \ which changes the DB model.\n2. Are sub-keys `step:N` each independently\
        \ expiring? If so, unify their TTL with the parent session key to avoid partial-corruption\
        \ misses.\n3. What is the actual **idle gap** seen in long pause vs. the current\
        \ fixed TTL? Calibrate from `expired_keys`/miss logs, not guesswork.\n\n---\n\
        \n### 7. Recommended next actions (priority order)\n1. Convert fixed TTL →\
        \ **sliding TTL** refreshed on every step/heartbeat (no schema change, immediate\
        \ fix).\n2. Add **reconstruct-on-miss** from `in_progress` DB rows with explicit\
        \ logging of which path ran.\n3. Add **expired_keys / evicted_keys monitoring**\
        \ to size the real-world gap.\n4. Decide write-through checkpoint only if\
        \ user-visible recoverability is a hard requirement.\n\nI recommend the lead\
        \ approve #1–#3 for the current milestone and treat #4 (write-through + Redis-as-cache)\
        \ as a separate design decision driven by product requirements."
