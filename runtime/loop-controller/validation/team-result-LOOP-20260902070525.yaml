    output: "I've reviewed the actual implementation. Here is my analysis as the lead\
      \ engineer for this interview-session problem.\n\n## 1. How the code actually\
      \ behaves today\n\nThe relevant pieces (in this repo, cross-cutting Redis +\
      \ DB + state machine):\n\n- `InterviewStateStore.java:25` — `TTL_HOURS = 24`\
      \ (hard-coded).\n- `write()` at `InterviewStateStore.java:48` does `bucket.set(json,\
      \ 24, HOURS)` — **every write resets TTL to 24h**.\n- `read()` at `InterviewStateStore.java:34`\
      \ — gets the bucket, **never touches TTL**. A pure read does not extend lifetime.\n\
      - The only consumer of the store is `requireAsking()` at `InterviewService.java:380`,\
      \ reached from `answer()` (`:129`) and `answerStream()` (`:204`).\n\nThe class\
      \ is documented as “会话运行时状态 … 作为状态机的单一权威来源” (Redis is the single source of truth\
      \ for the state machine). That claim is the root of the hazard — but note an\
      \ important nuance specific to this code: **`requireAsking()` already has a\
      \ DB-reconstruction fallback** (`InterviewService.java:382-389`). On a Redis\
      \ miss it reads the DB row, rebuilds the `SessionState`, and re-writes it. So\
      \ the *answer* path is currently defended; Silent expiry is real but its impact\
      \ is largely masked. That is exactly the trap worth explaining precisely.\n\n\
      ## 2. When silent expiry happens\n\nTTL semantics here are: *liveness == \"\
      last `write()` was ≤ 24h ago.\"* Expiry is therefore reached in three circumstances:\n\
      \n1. **Human-paced idle exceeding the fixed TTL.** Write happens only on *answer*\
      \ (a state transition). Reading `detail()`, the SSE connection sitting open,\
      \ or the user thinking for >24h do nothing. Any gap between two answers/transitions\
      \ that exceeds 24h kills the key. Interviews are user-paced, so a \"legitimately\
      \ active but quiet\" session is indistinguishable from an abandoned one.\n2.\
      \ **Redis evicts before TTL.** Under `maxmemory-policy = volatile-lru` / `allkeys-lru`\
      \ / `allkeys-random` (the common defaults on shared instances), Redis can drop\
      \ the key long before 24h under pressure. TTL expiry is only one of two independent\
      \ death paths.\n3. **Operator tuning TTL down** (\"let's clean up stale sessions\"\
      ) ripples into destroying active-but-idle sessions regardless of intent.\n\n\
      In every case the DB row keeps its `status`/`question_count`/`current_question_id`\
      \ and remains perfectly valid — you see \"session exists\" in the admin/history\
      \ UI while the runtime key is gone.\n\n## 3. When and why continuation actually\
      \ breaks\n\nThis is the part that must be stated precisely, because the answer\
      \ differs depending on the read path.\n\n**Root cause:** every continuation\
      \ decision is a guard on `SessionState` (`requireAsking` → reject `FINISHED`\
      \ / accept `ASKING`/`START`). Whether a Redis miss is fatal depends *entirely\
      \ on which code path* consumes it and whether it can rebuild state. Two stores\
      \ can now disagree (Redis expired, DB valid), so behavior is **nondeterministic**:\
      \ some paths recover, some error — and which one you hit can change from request\
      \ to request.\n\nBreakage cases:\n\n- **Case A — non-`requireAsking` readers\
      \ (the silent breaker).** Any flow that consults the store to *decide liveness*\
      \ — a future \"resume/continue\" endpoint, an SSE heartbeat (\"is this session\
      \ still `ASKING`?\"), a concurrency probe, a \"re-send current question\" —\
      \ that calls `stateStore.read()` directly and treats `null` as \"session ended\
      \ / not found\" **errors out while the DB is valid**. Today all readers happen\
      \ to go through the guarded `requireAsking`, so this is dormant — but it is\
      \ the classic footgun this design invites.\n- **Case B — runtime-only fields\
      \ not mirrored to DB.** The reconstruction fallback only works if the DB can\
      \ rebuild a *faithful* state. Here DB carries `status`, `question_count`, `current_question_id`\
      \ and is kept in sync (`InterviewService.java:111-117`, `183-189`, `340-346`),\
      \ so it recovers. But the instant anyone keeps a runtime-only field in Redis\
      \ (asked-question-id set, tool-call intermediate state, SSE event offset, ephemeral\
      \ guard flags) that is **not** mirrored, a Redis miss cannot rebuild it → wrong\
      \ continuation: skipped/repeated question, re-ask, or a corrupt state machine.\n\
      - **Case C — the masking is fragile to reordering.** The reconstruction reads\
      \ *newer* DB state, which is fine for the answer path because DB is written\
      \ before Redis (`saveUserMessage` → DB update → `stateStore.write`). Reverse\
      \ that ordering (or add a path that writes Redis first) and an expired key +\
      \ reconstruction produces **stale** state → it silently carries on from the\
      \ wrong question/phase.\n- **Case D — the guard can be falsely bypassed.** If\
      \ only Redis held a transient \"this transition is in flight\" guard and it\
      \ expires, a duplicate answer (client retry after the key is gone) re-enters\
      \ the transition. Currently DB holds the FINISHED marker so re-running is caught\
      \ — but only *because* DB mirrors it.\n\n## 4. Decision (per the design framework)\n\
      \n```\nOption A — Sliding TTL on read (touch/expire on any successful read)\n\
      \  Strengths: a truly continuing session never dies while the user interacts\
      \ even if they're slow.\n  Weaknesses: pure \"viewing/history\" also prolongs\
      \ lifespan; abandoned sessions linger; needs DB idle field anyway.\n  Best for:\
      \ sessions where interaction is the liveness signal.\n\nOption B — Keep fixed\
      \ TTL but make DB the single source of truth; treat Redis as a rebuildable cache\n\
      \  Strengths: no phantom \"session lost\" at all; matches how this code already\
      \ recovers; simplest mental model.\n  Weaknesses: every Redis miss pays a DB\
      \ reconstcation; must guarantee all runtime fields are mirrored/recomputable.\n\
      \  Best for: correctness-first, small state, DB already keeps the fields (this\
      \ system).\n\nOption C — Explicit last_active_at in DB + scheduled sweeper;\
      \ cometely decouple TTL\n  Strengths: single, auditable authoritative liveness;\
      \ TTL becomes purely an eviction knob, not a contract.\n  Weaknesses: introduces\
      \ a periodic job + schema change; more moving parts.\n  Best for: production\
      \ where abandoned sessions must be reclaimed predictably.\n```\n\n**Recommended:\
      \ A + C combined (sliding TTL driven by DB activity, TTL as pure eviction).**\
      \ Address the true bug — *fixed wall-clock TTL is modeled as a session-validity\
      \ signal*.\n\n### Concrete changes\n\n**1. Stop treating Redis as the authority\
      \ — flip the comment and make DB authoritative.** First, when reconstructing\
      \ on a miss, mirror all runtime fields to DB so reconstruction is always faithful\
      \ (already true here; keep every state field persisted on `write()`):\n\n```java\n\
      public SessionState readOrRebuild(Long sessionId) {\n    String json = redissonClient.getBucket(key(sessionId)).get();\n\
      \    if (json != null) {\n        // successful read = proof of interaction\
      \ -> slide the TTL (Option A)\n        redissonClient.getBucket(key(sessionId)).expire(TTL_HOURS,\
      \ TimeUnit.HOURS);\n        return parse(json);\n    }\n    return null; //\
      \ caller rebuilds from DB; DB is the source of truth\n}\n```\n\n**2. Track true\
      \ liveness in the DB, not the TTL.** Add a column and refresh it on every transition:\n\
      \n```sql\nALTER TABLE interview_session ADD COLUMN last_active_at DATETIME NULL\
      \ DEFAULT CURRENT_TIMESTAMP;\n```\n\n```java\nsession.setLastActiveAt(LocalDateTime.now());\n\
      sessionMapper.updateById(session);\n```\n\n**3. Replace the \"cleanup abandoned\
      \ sessions\" job (which today is mis-written as a TTL) with an explicit sweeper**\
      \ so you reclaim only *truly* abandoned sessions, and a surviving-but-idle one\
      \ never dies mid-interview:\n\n```sql\n-- mark sessions that say \"in-progress\"\
      \ but had no interaction for > N hours\nUPDATE interview_session\n   SET status\
      \ = 'EXPIRED', finished_at = NOW()\n WHERE status IN ('START','ASKING')\n  \
      \ AND last_active_at < DATE_SUB(NOW(), INTERVAL 24 HOUR);\n```\n\n**4. Make\
      \ every consumer go through the guarded rebuild path** (`requireAsking`) rather\
      \ than raw `read()`, and add the resume/heartbeat endpoint through the same\
      \ funnel so Case A cannot slip in:\n\n```java\npublic InterviewSessionVO resume(Long\
      \ userId, Long sessionId) {\n    InterviewSession s = requireOwnedSession(userId,\
      \ sessionId);\n    InterviewStateStore.SessionState st = requireAsking(sessionId);\
      \ // rebuild-on-miss\n    return toVO(s, ...);\n}\n```\n\n### Why this fixes\
      \ it\n- The TTL is demoted from \"session contract\" to \"cache eviction knob\"\
      \ — a Redis miss is no longer user-visible, it just costs one DB read (`InterviewService.java:382`\
      \ already amortizes this).\n- Liveness is decided by auditable DB state (`last_active_at`)\
      \ instead of a side-effect-free read that doesn't refresh anything.\n- Every\
      \ guard (FINISHED/ASKING) still works because the authoritative copy now never\
      \ silently decays.\n\n### Residual risks / mitigations\n- **Risk:** `touch`-on-read\
      \ keeps eviction-prone instances warm for purely-viewed sessions → mitigated\
      \ by using `last_active_at` (a *write* signal) for the sweeper, not reads.\n\
      - **Risk:** reconstruction still depends on DB mirroring all runtime fields\
      \ → enforce with a test asserting `SessionState == DB row` after every transition,\
      \ and a comment forbidding non-DB-mirrored fields in the store.\n- **Risk:**\
      \ write ordering (DB-before-Redis) is load-bearing → add a code comment at `InterviewService.java:183-189`\
      \ documenting the invariant.\n\n**Test hint:** I found no test coverage for\
      \ this path in the repo. Add one that (1) writes a session, (2) `DEL interview:session:<id>`\
      \ to simulate silent expiry, (3) asserts `answer()` recovers from DB and continues\
      \ at the correct `questionCount`/`currentQuestionId`, and (4) asserts a non-`requireAsking`\
      \ reader does *not* error — to lock in the invariant that Redis-miss is never\
      \ user-visible."
