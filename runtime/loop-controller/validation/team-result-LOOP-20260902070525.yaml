      output: "# Analysis: Redis Interview-State TTL Expiry vs. Persistent DB — Continuation\
        \ Break Risks\n\n## 1. System as it stands\n\nTwo authoritative stores coexist,\
        \ with a contradiction that is the root of the problem:\n\n- **Redis** — `InterviewStateStore.java:15`\
        \ is explicitly documented as *\"状态机的单一权威来源\"* (the single authoritative source\
        \ of the state machine). Fixed `TTL_HOURS = 24` set on *every* write (`InterviewStateStore:25,51`).\n\
        - **DB** — `interview_session` row (`session.status`, `currentQuestionId`,\
        \ `questionCount`) plus the full `interview_message` history. This is the\
        \ durable truth and survives Redis loss.\n\nCritically, the write ordering\
        \ is **always DB-first, Redis-second**:\n- `create()`: `sessionMapper.insert`\
        \ → `stateStore.write` (`InterviewService:87,91`)\n- `answer()`/`answerStream()`:\
        \ `sessionMapper.updateById` → `stateStore.write` (`:186-189`, `:261-264`)\n\
        - `finishSession()`: `sessionMapper.updateById` → `stateStore.write` → async\
        \ scoring (`:340-359`)\n\nAnd `requireAsking()` (`InterviewService:380-399`)\
        \ has a **rehydration fallback**: if Redis returns `null` (missing/expired/parse-fail),\
        \ it rebuilds state from the DB row and *re-writes* Redis.\n\n## 2. When continuation\
        \ actually breaks\n\nBecause of the DB-first ordering, the DB row is **always\
        \ at-or-ahead of Redis**. So in the happy path, expiry is self-healing: an\
        \ expired key triggers the fallback, which reconstructs the exact ASKING state\
        \ from the DB, and the interview resumes correctly. Continuation does **not**\
        \ break in the common \"user pauses >24h and returns\" case.\n\nThe break\
        \ happens only in these narrower (but real) conditions:\n\n### 2a. Redis holds\
        \ state that the DB schema cannot represent → expiry = irreversible loss\n\
        The rehydration fallback can only reconstruct what `interview_session` stores:\
        \ coarse `status`, `questionCount`, `currentQuestionId`. Today that happens\
        \ to be everything the state machine needs. But the moment you add ephemeral\
        \ runtime-only fields to Redis (planned `WAITING_ANSWER`, `EVALUATING`, `FOLLOW_UP`\
        \ states from `InterviewStatus.java`, an SSE/streaming cursor, partial answer\
        \ text, LLM turn context, retry/evaluation budgets, chunked evaluation progress),\
        \ those die silently with the TTL and **cannot** be rebuilt from the DB at\
        \ all. This is the primary \"why continuity breaks\": Redis is advertised\
        \ as SSOT, yet has a fixed TTL and no recovery path for fields not mirrored\
        \ to DB.\n\n### 2b. Redis ahead of DB (write-ordering violated) → expiry resurrects\
        \ stale DB state\nThe rehydration path trusts the DB unconditionally. If a\
        \ transition ever writes Redis successfully but the DB write silently fails\
        \ (`updateById` returning 0 rows, lost-update/MyBatis not affecting rows),\
        \ Redis becomes *ahead* of DB. On expiry, the fallback reconstructs the *older*\
        \ DB state and **rolls the interview backwards** (e.g., resurrecting an ASKING\
        \ session that had actually moved to EVALUATING, or re-showing a question\
        \ already answered). Today `updateById`'s return value is never checked (`InterviewService:114,186,344`),\
        \ so this is a live latent risk.\n\n### 2c. Fixed TTL on write, no refresh\
        \ on read\n`getBucket().set(json, 24h)` sets a fixed TTL each write; `read()`\
        \ does **not** touch TTL. Any session where reads outpace writes for >24h\
        \ (long-kept SSE emitter, an idle-but-open tab that only polls `detail()`\
        \ which reads DB not Redis, a paused virtual-thread turn) will expire mid-flow\
        \ even though neither side is \"dead\". In this app `answerStream` holds a\
        \ 300 s SSE and the Redis read happens at entry, so a 24h halt is required\
        \ — unlikely but possible for a genuinely stalled turn.\n\n### 2d. Error masking\
        \ in `read()`\n`InterviewStateStore.read()` returns `null` for three distinct\
        \ conditions: never-created, expired, **or JSON parse failure** (`:37,42-45`).\
        \ All three route to the same DB reconstruction, so a transient corruption/version-skew\
        \ of the Redis JSON is indistinguishable from expiry, and the (possibly newer)\
        \ Redis state is silently discarded instead of surfaced.\n\n## 3. Why this\
        \ failed silently\nThe design comment declares Redis the SSOT, but the implementation\
        \ quietly relies on the DB fallback to keep working. There is no metric, log,\
        \ or alert on `requireAsking` taking the fallback branch — so when a key expires,\
        \ no one observes it, and the system \"works\" only because DB happens to\
        \ be reconstructible. The moment that assumption fails (2a/2b), the bug is\
        \ both silent and fatal.\n\n## 4. Recommendations\n\n### Priority 1 — Define\
        \ single source of truth explicitly\nRemove the false \"SSOT\" claim. Either:\n\
        - **DB is the SSOT, Redis is a pure cache + lock.** Then an expiry is benign\
        \ by construction. Make `read()` log-and-rehydrate on `null` as an observable\
        \ event.\n- Or if Redis must hold ephemeral runtime state, give those keys\
        \ **sliding TTL** instead of fixed TTL (below).\n\n### Priority 2 — Make TTL\
        \ sliding for genuine session state\n```java\n// InterviewStateStore.write\n\
        public void write(Long sessionId, SessionState state, long ttl, TimeUnit unit)\
        \ {\n    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \    if (bucket.isExists()) {\n        bucket.expire(ttl, unit);      // refresh\
        \ on any activity\n        bucket.set(json);\n    } else {\n        bucket.set(json,\
        \ ttl, unit);\n    }\n}\n```\nBetter: use `RExpirable`/`RBucket.expire` on\
        \ every `read()` that is itself activity, so a session that is merely *open*\
        \ stays alive until actually abandoned, decoupled from a hard 24h wall clock.\n\
        \n### Priority 3 — Make the fallback visible and correct\n```java\n// InterviewService.requireAsking\n\
        InterviewStateStore.SessionState state = stateStore.read(sessionId);\nif (state\
        \ == null) {\n    log.warn(\"redis session state missing/expired, rehydrating\
        \ from DB sessionId={}\", sessionId);\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
        \    if (s == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
        \    state = new InterviewStateStore.SessionState(s.getStatus(), s.getQuestionCount(),\
        \ s.getCurrentQuestionId());\n    stateStore.write(sessionId, state);\n}\n\
        ```\nAdd an alert/step on `readQueryCount` so silent expiry becomes a scheduled/observed\
        \ event, not a surprise.\n\n### Priority 4 — Verify DB writes before trusting\
        \ Redis\n```java\nif (sessionMapper.updateById(session) != 1) {\n    throw\
        \ new BizException(ResultCode.INTERVIEW_STATE_ERROR, \"会话状态落库失败，已中止以避免状态回退\"\
        );\n}\n```\nNever let a transition commit to Redis without the DB durable\
        \ write succeeding, and never check the Redis write with `try/catch` swallowing\
        \ into an INTERNAL_ERROR that already happened (`InterviewStateStore:52-55`).\n\
        \n### Priority 5 — Dashboard cache is fine; keep it separate\n`DashboardService.CACHE_TTL_MINUTES\
        \ = 10` (`DashboardService.java:38`) is a genuine evictable cache with explicit\
        \ invalidation — it is *not* a SSOT and needs no change. It also proves the\
        \ correct pattern for read-model caching; apply the same \"cache, not SSOT\"\
        \ mental model to interview state.\n\n## 5. Bottom line\nToday the current\
        \ code survives expiry because DB ordering + the `requireAsking` fallback\
        \ happen to make it self-healing for the fields the DB models. Continuation\
        \ breaks when (a) runtime-only state is added to Redis, (b) a DB write fails\
        \ after Redis succeeds, or (c) reads outlive the fixed 24h TTL — all currently\
        \ undetected because the fallback and errors are silent. Fix = one SSOT, sliding\
        \ TTL for real session state, verified DB writes, and observable rehydration.\n\
        \n**For lead review — severity:** Medium latent / high blast-radius if (a)\
        \ or (b) is ever introduced; Low observed risk today given `state` always\
        \ lives in `interview_session`. Recommend hardening before the planned richer\
        \ state machine (Phase 5 statuses) ships, since that is when fixed-TTL Redis-on-fields-not-in-DB\
        \ will truly break continuation."
