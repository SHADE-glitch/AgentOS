      output: "## Database Engineer — Supporting Analysis: Redis Session State Silent\
        \ Expiry\n\nI inspected the actual implementation (`InterviewStateStore.java`,\
        \ `InterviewService.java`, `InterviewSession`/`InterviewResult` entities).\
        \ Findings are grounded in the real code, not hypotheticals.\n\n---\n\n###\
        \ 1. What the code actually does\n\n- `InterviewStateStore.java:25` — fixed\
        \ `TTL_HOURS = 24`.\n- `write()` (`:48–56`) — `bucket.set(key, json, TTL_HOURS,\
        \ HOURS)` — **every** write *resets* the TTL to 24h from that instant.\n-\
        \ `read()` (`:34–46`) — only the JSON parse is wrapped (`:43`); the `bucket.get()`\
        \ at `:35–39` is **not** exception-wrapped.\n- Persistence order (single `RLock`\
        \ around each flow): **DB first, Redis second** in all three paths:\n  - `create`\
        \ — DB `:111–114`, then Redis `:116–117`\n  - `answer` — DB `:183–186`, then\
        \ Redis `:188–189`\n  - `finishSession` — DB `:340–344`, then Redis `:345–346`\n\
        - Recovery path: `requireAsking()` `:380–399` returns a lazy fallback—if `read()`\
        \ yields `null` it rebuilds from `sessionMapper.selectById` and re-writes\
        \ Redis.\n\nThe stated design intent (`InterviewStateStore.java:15`): *“单一权威来源”*\
        \ — Redis is the authoritative runtime state. That intent is undermined by\
        \ the DB being durably consistent **and** recoverable.\n\n---\n\n### 2. When\
        \ silent expiry actually happens\n\nBecause TTL is reset on every write, **expiry\
        \ is not wall-clock-since-creation, it is 24h of *no writes*** (no answer/continue\
        \ activity on that session). Concretely:\n\n- **User starts an interview,\
        \ submits Q1 (Q1 write at T0), walks away > 24h.** Redis key for that `interview:session:<id>`\
        \ expires. The `interview_session` DB row is untouched and still `ASKING`\
        \ at `:111–114`. DB is perfectly valid; runtime state in Redis is gone.\n\
        - A **Redis restart / `FLUSHALL` / `maxmemory` eviction** (with a volatile\
        \ policy) also silently removes keys while DB rows remain valid — same logical\
        \ expiry, more abrupt.\n- A qualifying lost-update window: DB committed at\
        \ `:186`, Redis write at `:188` fails or the process dies between them. Redis\
        \ is now *stale/absent* but DB is newer. (Here DB-first ordering actually\
        \ limits the harm.)\n- A `finishSession` Redis entry eventually expires too\
        \ — harmless only because DB also says `FINISHED` and the fallback re-derives\
        \ it.\n\n---\n\n### 3. Why continuation breaks — the failure modes\n\nThere\
        \ are two very different failure classes; both leave the DB valid:\n\n**A.\
        \ Hard break — Redis availability ≠ TTL (the genuine “DB valid, continuation\
        \ breaks”).**\n`read()` does not guard `bucket.get()`. When Redis is down,\
        \ Redisson throws (connection failure), the exception propagates out of `read()`\
        \ through `requireAsking()` (`:380`) with **no catch**, surfacing as an internal\
        \ error on every `answer`/`answerStream`. Result: **continuation aborts even\
        \ though the DB holds complete, current state.** This is the sharpest incarnation\
        \ of the reported bug: the DB is fully valid and could serve the resume, but\
        \ the code has made Redis a hard dependency for runtime control flow.\n\n\
        **B. Silent expiry — masked by a recovery path that *looks* safe but isn’t\
        \ lossless.**\nWhen TTL simply lapses:\n- `answer()` → `requireAsking()` →\
