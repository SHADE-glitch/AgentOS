      output: "# Datastore Engineer Review — Redis Fixed-TTL session state vs. durable\
        \ DB\n\n## 目标\n- **业务目标**: 面试会话的\"运行时状态\"(进度、答案草稿、计时器、当前题序号)由 Redis 承担,持久层(DB)只存最终提交结果。\n\
        - **当前约束**: Redis key 使用固定 TTL,DB 记录无 TTL 或 TTL 远超 Redis;两者 TTL 语义不同源。\n-\
        \ **成功标准**: 厘清 \"Redis 静默过期而 DB 仍有效\" 的具体时机,以及这如何导致 continuation(续面)中断,并给出消除该不一致的方案。\n\
        \n## 问题判断(核心结论先行)\n**根因**: Redis 和 DB 对 \"会话生命周期\" 有两个独立、不同步的时钟;固定 TTL 从 **创建写入时刻**\
        \ 起计,而运行时间会被值守在侧的两次活动所拉长。任何一次会话静默超过 `TTL` 却没被活动刷新,Redis 就会驱逐该 key——**不报错、不回写\
        \ DB、不通知应用**。之后续面读取时,DB 仍有用户 `session_id`,于是判定\"会话有效\",实际却 `GET` 不到运行态 → continuation\
        \ 中断(空状态、崩栈、重复初始化)。\n\n### 何时出现(触发条件,按概率排序)\n1. **会话时长超过固定 TTL**:TTL 从写入时刻起算,会话没那么快结束——长时间思考、等待、就站一次,运行时长\
        \ > TTL。\n2. **误用绝对 TTL 而非滑动 TTL**:固定 TTL = 写后 N 秒强制过期;若业务意图是\"闲置 N 秒过期\"\
        ,两者在逻辑上不等价。\n3. **续期未实现或只续命一个 key**:只给了主 key 续 `EXPIRE`,但按会话组织的子 key(进度/答案/步骤)有各自的\
        \ TTL,且互不刷新。\n4. **TTL 与 DB 的有效性判定脱节**:DB 有 `expires_at` 或根本无过期概念,DB 判定 valid\
        \ 的窗口远大于 Redis。\n5. **重启/故障后恢复续面**:Redis 是易失缓存,Node/容器重启清空 Redis,DB 恒存 → DB\
        \ 认为可续,Redis 已无数据。\n6. **时钟/版本边界**:带 `sessions` 前缀的旧 key 没有跟随新 TTL 策略被迁移。\n\
        \n### 为什么 \"silently\" (静默性)\nRedis 过期语义 `volatile-ttl/allkeys-lru/`.  默认:惰性(访问时发现已过期才删)+周期采样主动删。二者都是**后台静默删除**:\n\
        - 不作为异常(FORGET 没有回执语义),\n- 不广播到 DB,\n- 应用在 `GET` 时得到 `null/nil`,常被当作\"无数据\"\
        而**不是** \"已过期\"。\n\n这是三个不同的语义,很多 bug 就来自把三者混为一谈:\n| 现象 | GET 返回值 | 正确认知 |\n\
        |------|-----------|---------|\n| key 存在 | 纯数据 | valid |\n| key 不存在(从未写) |\
        \ `nil` | 无会话 |\n| key 不存在(已被 TTL 删除)| `nil` 同上 | **有会话但丢失** ← 无法从返回值区分 |\n\
        \n**DB 侧完全无感知**:DB 的 `interview_sessions.expires_at` 由你自己的代码/事务控制(MySQL `TIMESTAMP`、Postgres\
        \ `interval`、或干脆无),与 Redis TTL 是两条独立时间线。\n\n---\n\n## 方案设计\n\n### 方案 A:滑动过期\
        \ + 续期(Sliding Expiry) — 推荐\n把固定 TTL 改为**滑动 TTL**,每次访问(续面请求、进度推送、心跳)都对运行态\
        \ key 重新 `SET ... EX` 或 `EXPIRE`。\n```\n# Go (goredis)\nSETEX interview:%s\
        \ runtime% d  # 每次活动都在同一写出中刷新\n# 或\nEXPIRE interview:%s 1800        # 每次续面/推进度时统一续命\n\
        ```\n- on-db:`expires_at = NOW() + interval '30 minutes'`,**与 Redis 同源、同时刷新**。\n\
        - 强度:贴合\"闲置过期\"真实意图;续面天然不中断。\n- 弱点:要求**每个能延长会话的动作都调续期**,漏一处即回归;需要覆盖所有写路径。\n\
        \n### 方案 B:DB 作为豁免事实源 + 恢复回源(Source of Truth Fallback) — 配套必须\n不消灭 TTL,但让续面**可容忍\
        \ Redis 丢 key**:\n1. DB 记录 `last_heartbeat_at` 与 `expires_at`(会话结束写成 DB)。\n\
        2. 续面入口逻辑:\n```\nif redis GET interview:<id> exists:\n    续命 + 正常续面\nelse:\n\
        \    if db expiry NOT passed:         # DB 仍有效\n        从 DB 的持久化检查点重建运行态\
        \ → 写回 Redis → 续面\n    else:\n        return 410 Gone(会话已超时)\n```\n- 强度:续面永不因\
        \ Redis 首个 TTL 而中断;DB valid → 能续,DB invalid → 合理拒绝。\n- 弱点:需要\"检查点重建\"能力,运行态必须存在\
        \ DB 的持久化快照(与 TTL 是弱一致)。\n\n### 方案 C:Tombstone/显式结束(明确回收)— 守护正确性\n不同时用 `EXPIRE`\
        \ 了结状态。会话结束(超时/提交/放弃)显式:\n```\nMULTI\n  DEL interview:<id>   runtime\n  UPDATE\
        \ interview_sessions SET status='expired' WHERE id=? AND status='active'\n\
        EXEC\n```\n- 强度:从机制上消灭 \"Redis 没了但 DB 还是 active\" 双写漂移。\n- 弱点:需要所有结束路径都走这个事务,漏一条(NAT\
        \ 断开、进程 kill)仍会漂。\n\n### 最终建议(组合)\n**A(滑动) + B(DB 回源) 为主,C(显式结束) 兜底**。\n-\
        \ 为什么:A 使 Redis 在正常活动下不早于预期过期;B 使 Redis 丢 key 不再致命,DB valid 即能重建;C 保证状态最终收敛。\n\
        - 接受权衡:引入轻微弱一致(DB 与 Redis 的检查点)和重建逻辑的复杂度。\n- 剩余风险与缓解:见下表。\n\n| 风险 | 缓解 |\n\
        |------|------|\n| 漏一处续期 → 回归 | 把续期封装成统一 `touchSession()` 并在所有写路径复用;加并发安全(用\
        \ Lua 保证 `OPT EXISTS`/`SET` 原子)|\n| 重建不一致 | 检查点只存\"事实\"('DB-recorded' 进度/已提交问答),运行态派生部分允许重建\
        \ |\n| 时钟偏差 | 单机忽略;若跨时区/多实例用单调时钟记录 `last_heartbeat_at`|\n\n---\n\n## 实施方案(关键代码,Go\
        \ + goredis + SQL)\n\n**续面统一入口(方案 A + B):**\n```go\nfunc Continue(ctx context.Context,\
        \ store *redis.Client, db *sql.DB, sid string) (Runtime, error) {\n    key\
        \ := \"interview:\" + sid\n\n    val, err := store.Get(ctx, key).Bytes()\n\
        \    if err == nil && len(val) > 0 {\n        _ = store.Expire(ctx, key, TTL).Err()\
        \          // 滑动续期\n        return unmarshal(val), nil\n    }\n    // 方案 B:Redis\
        \ 丢失 / 未命中\n    if err != nil && err != redis.Nil {\n        return Runtime{},\
        \ err\n    }\n    rt, valid, err := loadCheckpoint(ctx, db, sid)      // 查\
        \ DB 的 expires_at\n    if err != nil { return Runtime{}, err }\n    if !valid\
        \ { return Runtime{}, ErrSessionExpired }  // DB 已超时 → 410\n    if err :=\
        \ store.Set(ctx, key, marshal(rt), TTL).Err(); err != nil {\n        return\
        \ Runtime{}, err\n    }\n    return rt, nil\n}\n\nfunc touch(store *redis.Client,\
        \ sid string) { // 每个写活动统一续命\n    _ = store.Expire(ctx, \"interview:\"+sid,\
        \ TTL).Err()\n    _ = store.Expire(ctx, \"interview:\"+sid+\":progress\",\
        \ TTL).Err()\n    _ = store.Expire(ctx, \"interview:\"+sid+\":answers\", TTL).Err()\n\
        }\n```\n\n**DB(方案 B 依赖):**\n```sql\nALTER TABLE interview_sessions\n  ADD\
        \ COLUMN expires_at TIMESTAMPTZ NOT NULL DEFAULT now() + interval '30 minutes',\n\
        \  ADD COLUMN status  VARCHAR(16) NOT NULL DEFAULT 'active',   -- active|expired|completed\n\
        \  ADD COLUMN checkpoint JSONB;                                 -- 可重建的运行态快照\n\
        ```\n服务端每写一次运行态,`touch` DB:`UPDATE ... SET expires_at = now()+interval '30\
        \ minutes', checkpoint = $1 WHERE id=$2`(与 Redis 续期同一处、同一事务,保证\"同源刷新\")。\n\
        \n**显式结束(方案 C):**\n```go\n// Lua 保证两步原子,防双写漂移\nscript := redis.NewScript(`\n\
        \  if redis.call(\"exists\", KEYS[1]) == 1 then redis.call(\"del\", KEYS[1])\
        \ end\n  return redis.call(\"set\", KEYS[2], ARGV[1])   -- 写 DB 的动作由应用事务接力\n\
        `)\n```\n实际建议用一个 DB 事务封 DEL(Redis)+ UPDATE(DB):`sql.Tx` 里 `UPDATE ... SET\
        \ status='expired' WHERE id=? AND status='active'` 如果 `RowsAffected==0` 说明已结束,可安全放弃。\n\
        \n---\n\n## 验证方式\n1. **TTL 场景集成测试**:写入 key → `ttl` 设短(如 2s)→ 空等 3s → `GET`\
        \ 为 `redis.Nil`,DB `status='active'` → 调 `Continue` 应通过 DB 回源成功续面(证明 A+B 生效)。\n\
        2. **慢会话测试**:不活动超 TTL → 续面触发 DB 重建;活动中(有心跳续命)→ 永不触发 410。\n3. **语义核对**:断言 `redis.Nil`(过期/无\
        \ 会话)在日志被记为 `session_lost_recovered` 而非普通 `no_session`,监控其计数上升。\n4. **监控**:`GETMISS`\
        \ 派生错误率 + `expired_*` 驱逐计数器 + 重建类日志告警(重建频繁 = TTL 过短)。\n- 预期:续面中断率趋零;仅当 DB\
        \ `expires_at` 真正超时才返回 410。\n- 复盘:若重建率仍高,进一步把运行态检查点做成增量而非全量,降低重建成本。\n\n---\n\
        \n## 面向 lead 的结论摘要\nRedis 固定 TTL 的失效是**定义性**(绝对过期)、**静默性**(无回执)与 **DB 有效性判定脱节**三者叠加的必然结果。续面在\"\
        运行时长 > TTL\"或\"进程重启\"时必然中断,且 DB 无感知。根治靠**滑动续期 + DB 作为豁免事实源回源重建**组合,尾端用显式事务化结束保证状态收敛。仅靠调大\
        \ TTL 是治标不治本——它只是把问题推迟。\n\n如需我进一步给出 Lua 原子续命脚本或 DB 迁移的具体事务代码,我可以补上。"
