      output: "# Interview Session Runtime State: Redis TTL vs DB Continuation Breakage\n\
        \n## 1. Executive Summary\n\nThe symptom — Redis session key silently expires\
        \ while the DB record still shows a valid/active session — is an **architectural\
        \ contract violation** between two storage layers that disagree about the\
        \ session lifecycle. Continuation (resuming an interview) breaks because the\
        \ application treats Redis as the *authority for liveness* while the DB is\
        \ the *authority for validity* (or vice versa), and those two stay out of\
        \ sync. This is a design flaw, not a races bug. It's fixable with a sliding-TTL\
        \ + graceful-degradation strategy.\n\n## 2. The Storage Contract Problem\n\
        \nThe tension comes from two distinct responsibilities being collapsed into\
        \ one key:\n\n| Layer | Stores | Authority for |\n|---|---|---|\n| Redis (runtime)\
        \ | mutable in-flight state: current question index, answers in-progress,\
        \ timer, LLM context window | **liveness** (is the user actively in the session\
        \ right now) |\n| DB (durable) | session row: `candidate_id`, `status`, `questions[]`,\
        \ `created_at`, `expires_at` | **validity** (does this session legitimately\
        \ exist and is it restorable) |\n\nA fixed TTL on the Redis key models **\"\
        session lifetime since creation\"** — an absolute timespan. The DB is frequently\
        \ modeled as **\"valid until a separately-stored expiry\"** or even *indefinitely\
        \ valid pending explicit termination*. The mismatch surface is exactly where\
        \ continuation breaks.\n\n## 3. When Continuation Breaks (Concrete Scenarios)\n\
        \n**(a) Long-running / resumed sessions outlive the absolute TTL**\nFixed\
        \ TTL set at creation via `SETEX resumeKey 3600 payload`. A session created\
        \ at `09:00`, repeated used and continued over hours, hits the `10:00` expiry\
        \ even though the DB row is still `status=active`.\n\n**(b) TTL refreshed\
        \ on write, not on read**\nSessions that are *read* frequently but *written*\
        \ rarely (intermittent \"paused\" interview, waiting on async grader) expire\
        \ because TTL is only touched on mutation.\n\n**(c) Redis-checked-first, DB\
        \ never consulted on miss**\nOn continuation, `GET sessionKey` returns nil\
        \ → app throws `SESSION_EXPIRED / 404` and **never queries the DB**, so the\
        \ valid DB row is invisible. This is the most user-visible failure.\n\n**(d)\
        \ Restart / multi-node / multi-region pod**\nRequester pod loses Redis connection\
        \ or talks to a different shard that lacks the key → treated as expired. DB\
        \ is unaffected, so the session looks \"lost\" inconsistently.\n\n**(e) Redis\
        \ eviction, not TTL**\nRedis has bounded memory. Under `maxmemory-policy=allkeys-lru`/`volatile-lru`,\
        \ a live key can be evicted before its TTL. The DB row remains. Same \"silent\
        \ expiry\" symptom but *not* TTL-driven.\n\n**(f) No expiry accounting for\
        \ `expires_at` drift**\nDB `expires_at` and the Redis TTL are set from different\
        \ clocks or different rules (e.g., DB expiry = `created_at + 24h`, Redis =\
        \ `created_at + 1h`). They were never meant to be equal, but the code assumes\
        \ they are.\n\n## 4. Why It Breaks (Root-Cause Analysis)\n\nThe core defect\
        \ is **fixed-TTL models liveness but is used to answer validity questions**:\n\
        \n1. **Absolute vs sliding semantics.** `SETEX` creates an absolute deadline.\
        \ Nothing about \"the user did something recently\" extends it. The system\
        \ conflates \"the session should be dead\" with \"the user has been idle.\"\
        \n2. **Missing TTL refresh on the hot path.** Correct lazy reaping requires\
        \ calling `EXPIRE key 3600` (sliding/TTL-roll) on *every* access, not just\
        \ creation.\n3. **No miss-recovery path.** The read path does not implement\
        \ the logical OR: `Redis hit → use it; Redis miss → fall back to DB, verify\
        \ validity, rebuild/relink runtime state, and re-populate Redis with a fresh\
        \ sliding TTL.`\n4. **No canonical liveness signal.** There's no single \"\
        is this continuation allowed\" check — two layers each guess independently,\
        \ and they diverge.\n\n## 5. Recommended Fixes\n\n### 5.1 Distinguish validity\
        \ from liveness\n- **Validity** lives only in the DB: `status` + `valid_until`\
        \ (nullable →  means valid until explicit close/cancel).\n- **Liveness** lives\
        \ only in the TTL.\n\n### 5.2 Use sliding TTL on every continuation\n\nPlace\
        \ an interceptor on the read path that rolls the TTL whenever the session\
        \ is accessed:\n\n```\n00: (context)\n01: keys = Redis.GET(\"interview:{sessionId}\"\
        )           # fast path\n02:\n03: if keys == NIL:\n04:     row = DB.SELECT\
        \ session WHERE id = ?           # slow path (fallback)\n05:     if row ==\
        \ NIL or row.status != \"active\":\n06:         return 410 Gone          \
        \                  # genuinely dead\n07:     if row.valid_until != NULL and\
        \ now > row.valid_until:\n08:         return 410 Gone                    \
        \        # DB says expired\n09:\n10:     step = row.reconstructed_runtime_state\
        \          # last persisted checkpoint\n11:     Redis.SETEX(\"interview:{sessionId}\"\
        , SLIDING_TTL, Json(step))\n12:\n13: # liveness roll on the fast path too\n\
        14: Redis.EXPIRE(\"interview:{sessionId}\", SLIDING_TTL)\n15: return keys\
        \ ?? row\n```\n\nKey points:\n- `EXPIRE` (line 14) executes on **both** hit\
        \ and restored-miss, so any access pushes the deadline forward — this is the\
        \ sliding-TTL behavior that prevents scenario (a)/(b).\n- Line 03–11 is the\
        \ **graceful degradation**: a Redis miss never immediately fails; it consults\
        \ the source of truth (DB), and only returns `410 Gone` if the DB itself adjudicates\
        \ the session dead. Scenario (c) is eliminated.\n\n### 5.3 Separate idleness\
        \ cutoff (optional stricter policy)\n\nIf you *want* idle sessions to die,\
        \ that belongs in the DB, not the cache:\n```\nWHERE id = ? AND status = 'active'\n\
        \  AND (valid_until IS NULL OR now < valid_until)\n  AND (last_activity_at\
        \ IS NULL OR now < last_activity_at + IDLE_TIMEOUT)\n```\nOnly after this\
        \ DB check returns nil should you return 410.\n\n### 5.4 Tune Redis eviction\n\
        Set a policy that never silently drops session keys you depend on as a cache,\
        \ and treat eviction like a miss (the fallback handles it):\n```\nmaxmemory\
        \ 2gb\nmaxmemory-policy noeviction        # or allkeys-lru, but never rely\
        \ on it for correctness\n```\nBecause the read path always recovers from the\
        \ DB, even an eviction-safe-but-aggressive policy is tolerable — the cache\
        \ is now an optimization, not the source of truth.\n\n### 5.5 Persist a minimal\
        \ checkpoint so rebuild is cheap\nRedis holds the full hot context, but periodically\
        \ `WAL` a small `{question_index, questions_json, score_so_far, last_activity_at}`\
        \ to the DB. This makes the restored-cache rebuild (line 10) lossless rather\
        \ than a best-effort reconstruction.\n\n## 6. Observable Failure Metrics (what\
        \ the lead should look for)\n\n- **Error rate spikes at `~= start_time + FIXED_TTL`,\
        \ not around idle gaps** → classic absolute-TTL symptom (a).\n- **`SESSION_EXPIRED`\
        \ on sessions that the user (and DB) consider active** → missing DB fallback\
        \ (c), highest-priority bug.\n- **Redis cache hit ratio dropping with no corresponding\
        \ DB change** → eviction or restart-based misses (d/e).\n\n## 7. Rejected\
        \ Alternatives (for the review discussion)\n\n- **Raise the Redis TTL near-infinity.**\
        \ Defeats the purpose (memory + stale state) and still breaks on eviction/restart.\
        \ No.\n- **Validate only in DB, always.** Correct but sacrifices the low-latency\
        \ hot path the runtime cache exists for. Acceptable only if the performance\
        \ requirement is absent.\n- **CRON job to sync Redis onto DB.** Fixes DB→Redis\
        \ on a schedule but introduces a correctness window and extra infra; the synchronous\
        \ fallback in §5.2 is strictly better.\n\n## 8. Conclusion\n\nContinuation\
        \ breaks because **a fixed-absolute TTL was (mis)used as the liveness signal\
        \ while the DB remains the authority on validity, and the read path had no\
        \ recovery when those diverged**. Fix = two-layer contract: DB owns validity,\
        \ Redis owns liveness via **sliding TTL rolled on every access**, and the\
        \ continuation read path falls back to the DB on any cache miss, returning\
        \ `410` only when the DB itself declares the session dead. This converts an\
        \ unrecoverable \"silent expiry\" into a recoverable, self-healing cache miss.\n\
        \n*Output prepared for lead review — team-18087af2 (rag-engineer/database\
        \ focus).*"
