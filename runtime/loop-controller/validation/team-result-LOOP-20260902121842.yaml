      summary: '# Interview Session Continuation: Redis TTL Expiry vs. DB Validity


        ## 1. Topology Overview


        A typical interview platform keeps **two sources of truth** per session:


        - **DB (Postgres/MySQL)** — *cano'
      output: "# Interview Session Continuation: Redis TTL Expiry vs. DB Validity\n\
        \n## 1. Topology Overview\n\nA typical interview platform keeps **two sources\
        \ of truth** per session:\n\n- **DB (Postgres/MySQL)** — *canonical*: `session`\
        \ row, candidate profile, question bank, submitted answers, score snapshots.\
        \ Survives restarts; durable.\n- **Redis** — *runtime/ephemeral*: active conversation\
        \ tokens, LLM context window, current question index, per-step timers, mid-answer\
        \ state, locks, queue position. Favors low-latency reads/writes; **lossy**.\n\
        \nThe failure is not \"Redis lost data\" — it's that the **read path trusts\
        \ Redis as authoritative** for the *active* portion of a session, and that\
        \ portion vanishes while the DB still holds the session as valid/open.\n\n\
        ---\n\n## 2. When Continuation Breaks\n\nContinuation breaks when an active\
        \ request requires state that is **only in Redis, is missing, and cannot be\
        \ rebuilt (`rehydrated`) from the DB**.\n\nConcretely, the break occurs for\
        \ reads of these Redis-only keys once expired:\n\n| State | Where it lives\
        \ | If Redis expires, can DB rebuild it? |\n|---|---|---|\n| In-flight LLM\
        \ conversation window/messages | Redis | ❌ Usually not (not persisted anywhere)\
        \ |\n| Current question index / position | Redis (mirrors DB field) | ✅ DB\
        \ `progress` column |\n| Step timer / remaining time | Redis | ❌ Lost; clock\
        \ resets silently |\n| Mid-answer drafts | Redis | ❌ Lost |\n| Lock / \"question\
        \ in-flight\" flag | Redis | ❌ Lost → may allow duplicate submission |\n|\
        \ Penalty/difficulty-adjustment trajectory | Redis | ❌ Often lost |\n\n**The\
        \ preconditions for a hard break (all three must hold):**\n1. The session\
        \ is still **active in the DB** (not expired, status=`IN_PROGRESS`, `expires_at`\
        \ still in future)\n2. The critical state (Q#2 above) lives **only** in Redis\n\
        3. The **read path is fail-closed**: on cache miss it raises an error or resets\
        \ to step 0 rather than refetching/reconstructing from DB\n\nWhen those hold,\
        \ the user's next request lands on a session the DB says is valid, but Redis\
        \ returns a miss/empty context → crash, or worse, a **silent rewind** to question\
        \ 1 with no conversation memory.\n\n---\n\n## 3. Why It Happens (root causes)\n\
        \n### 3.1 Fixed TTL shorter than the real session\nA fixed `SET key EX 1800`\
        \ (30 min) is set once. Real interview sessions routinely run 45–90+ min.\
        \ The TTL does not extend on activity → expiry during an active session.\n\
        \n### 3.2 No sliding renewal\nWith a **fixed** (absolute) TTL it never extends\
        \ on use. A **sliding** TTL (refresh on every successful step — equivalent\
        \ to `EX` re-set on each progress, or `ALTER SET` semantics) is what aligns\
        \ cache lifetime with \"still being used.\"\n\n### 3.3 Eviction before TTL\n\
        Redis `maxmemory-*` policies (**`allkeys-lru`, `allkeys-lfu`, `allkeys-random`,\
        \ `fallsback volatile-lru`**) evict **even non-expired keys** when memory\
        \ pressure hits. A session key with a 10-min TTL can be evicted in 2 min under\
        \ load.\n\n### 3.4 App/Redis restart\n- Redis restarts flush all data unless\
        \ **persistence** (`AOF` / `RDB` snapshots) is on AND the keys are covered\
        \ by that persistence. `AOF` on `evil policies`... in practice ephemeral `TTL`\
        \ runtime keys often carry `noeviction`/exclude or are in volatile datasets.\n\
        - App node restarts lose any **in-process** references (e.g., the SQLAlchemy-side\
        \ or .NET `IMemoryCache`)-like local overlay) so the \"cache-aside\" layer\
        \ has nothing to rebuild from.\n\n### 3.5 Read-path behavior (the deciding\
        \ factor)\nThree possible designs and their outcomes on a Redis miss:\n\n\
        | Design | Behavior on Redis miss | Breaks? |\n|---|---|---|\n| **Fail-closed**\
        \ (default with `cacheMode=strict`) | throw `SessionStateExpired` / `401`\
        \ | ❌ Hard break |\n| **Silent reset** | treat as brand-new → rewind to step\
        \ 0, empty context | ❌ Silent break (worst UX) |\n| **Fail-open / cache-aside\
        \ rebuild** | fetch session from DB, rebuild runtime keys, rewrite TTL | ✅\
        \ Continues (with caveats below) |\n\nSilent reset is the most common malformed\
        \ path: it looks \"available\" (`200 OK`) but is semantically wrong — the\
        \ DB says `IN_PROGRESS` at question 7, the UI shows question 1 with empty\
        \ history.\n\n---\n\n## 4. The DB-vs-Redis Consistency Gap\n\nEven when you\
        \ **can** rebuild, the rebuild yields a *thinner* session:\n\n```\nDB:   \
        \ {session_id, status=IN_PROGRESS, current_question=7, expires_at}\nRedis:\
        \ {context_window, step_timer, drafts}   ← NOT in DB, lost forever\n```\n\n\
        So the DB is valid but **insufficient** for seamless continuation. This is\
        \ the core reason \"the DB remains valid\" is misleading — DB validity ≠ continuity.\
        \ The DB proves the session *may* continue; only Redis (or a durable copy\
        \ of it) proves it *can* continue at the same point with full context.\n\n\
        ---\n\n## 5. Recommendations\n\n### 5.1 Adopt sliding TTL (mandatory)\nRefresh\
        \ the runtime key's TTL on **every successful state transition**, not once.\n\
        \n```python\n# on each answered step / progress event\nttl = session.settings.runtime_ttl\
        \  # e.g. 30 min sliding\nredis.set(\n    key=f\"interview:{session_id}:runtime\"\
        ,\n    value=serialize(state),\n    ex=ttl,          # initial\n    # PLUS\
        \ resave on activity:\n)\n# On every successful step: redis.expire(key, ttl)\
        \ re-applies\n```\n\n### 5.2 Make the read path fail-open with documented\
        \ loss\nNever hard-fail purely on a Redis miss. Implement cache-aside rebuild:\n\
        \n```python\ndef load_runtime(session_id: str) -> InterviewRuntime:\n    cached\
        \ = redis.get(f\"interview:{session_id}:runtime\")\n    if cached:\n     \
        \   return hydrate(cached)\n    # --- MISS: reconstruct from DB, accept degraded\
        \ context ---\n    session = db.session.get(session_id)\n    if not session\
        \ or session.status != IN_PROGRESS:\n        raise SessionNotContinuable()\n\
        \    runtime = reconstruct_from_db(session)     # position only; no conversation\n\
        \    redis.set(f\"interview:{session_id}:runtime\", serialize(runtime), ex=TTL)\n\
        \    audit.log(RECONSTRUCTED, session_id, depth=\"degraded\")   # notify observability\n\
        \    return runtime\n```\n\n### 5.3 Keep conversational context server-authoritative\
        \ (or snapshot)\nThe LLM context window is the one truly irrecoverable piece.\
        \ Options:\n- Persist each completed turn's exchange to the **DB** (append-only\
        \ `session_messages`), so the window can be replayed/token-truncated for rebuild.\n\
        - Or take periodic **checkpoint snapshots** of the runtime into DB (e.g.,\
        \ every N steps, or on every question transition). Tradeoff = write load vs.\
        \ loss window.\n\n### 5.4 Guard against eviction, not just TTL\n- Use `volatile-ttl`\
        \ and set generous TTL on runtime keys so eviction prefers true hot data;\
        \ or\n- Protect critical keys with allowed memory headroom and monitor `evicted_keys`,\
        \ `expired_keys`, `used_memory_peak`.\n- Enable **AOF** (`appendfsync everysec`)\
        \ and periodic RDB for the runtime namespace if Restart-continuity matters;\
        \ or explicitly accept restart = forced fresh session.\n\n### 5.5 Alignment\
