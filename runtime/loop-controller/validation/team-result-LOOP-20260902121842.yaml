    output: "# Interview Session Continuation Failure: Redis TTL vs. Persistent DB\n\
      \n## The core problem\n\nYour interview session lives in two stores with **different\
      \ lifecycle guarantees**:\n\n- **Redis** holds *ephemeral runtime state* with\
      \ a **fixed TTL** — it will be deleted at a wall-clock deadline regardless of\
      \ whether the session is active.\n- **DB** holds the *authoritative session\
      \ record* with **no expiry** — it remains valid indefinitely.\n\nContinuation\
      \ breaks the moment code treats the two as interchangeable, or when the resumable\
      \ state *only* exists in Redis. The Redis key silently vanishes; the DB still\
      \ says \"session exists\" → every resume path now disagrees about reality, and\
      \ the user is asked to start over (or gets a 401/redirect) even though nothing\
      \ is structurally wrong.\n\n---\n\n## When it breaks (trigger conditions)\n\n\
      | # | Condition | Result |\n|---|-----------|--------|\n| 1 | **Fixed (non-sliding)\
      \ TTL** set only at session creation | Key expires at T₀+TTL even if the user\
      \ is mid-interview the whole time |\n| 2 | **Session duration > TTL** (long\
      \ interview) | Continuation always fails for every session that outlives the\
      \ TTL window |\n| 3 | **No TTL refresh on activity** (no heartbeat/sliding window)\
      \ | Even *active* sessions die at the fixed deadline |\n| 4 | **Redis eviction**\
      \ `maxmemory` policy (e.g. `allkeys-lru`) evicts the key before its TTL | Silent\
      \ loss with no expiration event at all |\n| 5 | **Read path fails closed** on\
      \ cache miss (treats miss == \"no session\") | Resume request rejected without\
      \ attempting DB rehydration |\n| 6 | **Node restart / failover** without persistence\
      \ (AOF/RDB disabled or too few snapshots) | Keys (and their in-flight answers)\
      \ disappear while DB is pristine |\n| 7 | **Clock skew** between app and Redis\
      \ when computing a \"remaining TTL\" | Effective TTL shorter than intended →\
      \ early expiry |\n\nThe two *silent* ones to focus on are **#1/#3 (fixed TTL,\
      \ no refresh)** and **#5 (fail-closed read path)** — those don't require a crash,\
      \ eviction, or restart. They are deterministic and will eventually hit *every*\
      \ session.\n\n---\n\n## Why it breaks (design mechanism)\n\n1. **Redis is treated\
      \ as the source of truth for resumable state.** The in-progress answers, current\
      \ question index, elapsed time, and partially-entered data live only in Redis.\
      \ The DB stores a thin \"session\" row but not the resumable payload. When the\
      \ key expires, the payload is gone; the DB row is not enough to continue.\n\n\
      2. **No rehydration path on cache miss.** The app never says \"Redis miss →\
      \ load from DB → rebuild state → reset TTL.\" A miss simply propagates as a\
      \ non-existent session. If the code had a write-through + lazy-rebuild (cache-aside)\
      \ path, the DB would happily resupply the record.\n\n3. **TTL = absolute, not\
      \ sliding.** `SET key val EX 1800` computed once at creation is an absolute\
      \ expiry. Contrast with a *sliding* model where each read calls `EXPIRE key\
      \ 1800`, keeping hot sessions alive. Many teams assume Redis automatically extends\
      \ on access — it does not.\n\n4. **Silence is the killer.** Redis gives you\
      \ **no callback when a key expires by default**. Nothing in the DB layer knows,\
      \ nothing triggers a rebuild or cleanup, and no alert fires. The failure surfaces\
      \ only later as a jarring UX break with no backend error.\n\n---\n\n## Concrete\
      \ example (the failing pattern)\n\n```python\n# WRONG: fixed TTL, cache-as-primary,\
      \ fail-closed on miss\ndef start_session(session_id, interview, db):\n    db.insert_session(session_id,\
      \ interview.id, status=\"ACTIVE\")\n    state = build_initial_state(interview)\n\
      \    r.setex(f\"interview:{session_id}\", ttl=1800, value=serialize(state))\
      \  # absolute 30min\n\ndef resume(session_id, db):\n    raw = r.get(f\"interview:{session_id}\"\
      )\n    if raw is None:\n        # Notice: status in DB is still 'ACTIVE', but\
      \ we read 'miss' as dead.\n        raise SessionExpired(f\"No state for {session_id}\"\
      )   # FAIL-CLOSED  ← bug\n        # user must restart, despite DB record being\
      \ fully valid\n    return deserialize(raw)\n```\n\n## The fix — layered, fail-open,\
      \ sliding TTL + rehydration\n\n**1. Make TTL sliding and refresh on every access.**\n\
      \n```python\ndef resume(session_id, db):\n    raw = r.get(f\"interview:{session_id}\"\
      )\n    if raw is not None:\n        r.expire(f\"interview:{session_id}\", ttl=1800)\
      \   # SLIDING window\n        return deserialize(raw)\n    return rehydrate(session_id,\
      \ db)                    # lazily rebuild\n\ndef rehydrate(session_id, db):\n\
      \    row = db.get_session(session_id)\n    if row is None or row.status != \"\
      ACTIVE\":\n        raise SessionExpired(session_id)\n    # State can be recomputed\
      \ deterministically from DB row (answers/step persisted).\n    state = recompute_from_db(row)\n\
      \    r.setex(f\"interview:{session_id}\", ttl=1800, value=serialize(state))\n\
      \    return state\n```\n\n**2. Keep DB as source of truth; Redis only a read\
      \ cache.** Persist answers/step on every meaningful action (write-through),\
      \ so Redis can always be discarded and rebuilt. Then expiry is *self-healing*.\n\
      \n**3. Choose the right eviction + persistence policy:**\n\n```ini\n# redis.conf\n\
      maxmemory-policy   noeviction     # never silently evict session keys\nappendonly\
      \         yes            # survive restarts\nappendfsync        everysec\n```\n\
      \n(Use `allkeys-lru` only for truly disposable caches — never for authoritative\
      \ runtime state.)\n\n**4. Optional proactive signal via keyspace notifications**\
      \ (for cleanup/alerting, not for correctness):\n\n```ini\nnotify-keyspace-events\
      \ Ex\n```\n\n```python\npub = r.pubsub()\npub.psubscribe(\"__keyevent@0__:expired\"\
      )\nfor msg in pub.listen():\n    key = msg[\"data\"]\n    if isinstance(key,\
      \ str) and key.startswith(\"interview:\"):\n        mark_session_stale_in_db(key)\
      \      # align DB status = 'EXPIRED', resume then fails gracefully\n```\n\n\
      **5. Health/monitoring** — track `expired_keys`, cache hit ratio, and a canary:\
      \ alert when a *valid-DB* session resumes but has no Redis state (detects the\
      \ silent-miss rate).\n\n---\n\n## When it does NOT break (for contrast)\n\n\
      - Sliding TTL + refresh-on-read → active sessions never expire.\n- Write-through\
      \ to DB + lazy rehydrate → expiry only costs a rebuild, not a session.\n- DB\
      \ status transitions explicitly (`ACTIVE`→`EXPIRED`) via an expiry notification\
      \ → continuation fails *loudly and consistently* rather than silently.\n\n##\
      \ Bottom line\n\nContinuation breaks because **liveness is tracked in a store\
      \ with a fixed deadline and no callback, while validity lives in a store with\
      \ no deadline and no awareness.** The remedy is to give Redis a *sliding* TTL,\
      \ make it a replacable read cache over the durable DB, fail-open to DB rehydration\
      \ on miss, and pick eviction/persistence policies that never treat session state\
      \ as disposable.\n\nIf you share the actual stack (Redis client, ORM, session\
      \ schema) I can turn the skeleton above into your exact sync-points and a DB-backfill\
      \ migration for dropping the old fixed-TTL sessions."
