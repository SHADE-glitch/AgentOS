      output: "# Database Engineer Response — Redis Fixed-TTL Session Expiry vs. Durable\
        \ DB State\n\n## 1. Problem Architecture (Two Sources of Truth)\n\nInterview\
        \ sessions typically split state across two stores:\n\n| Layer | Store | Content\
        \ | Lifespan |\n|-------|-------|---------|----------|\n| Runtime state |\
        \ Redis | In-progress current answer, token/step position, transient flags,\
        \ per-question context, draft submission | Ephemeral (TTL) |\n| Durable truth\
        \ | DB (Postgres/MySQL) | Full Q&A history, final answers, session metadata,\
        \ scoring | Persistent |\n\nThe failure mode you describe arises because **the\
        \ two layers are decoupled and expire on independent timelines.** Fixed TTL\
        \ is applied to Redis but the DB row for the same session stays alive forever.\
        \ When the Redis key dies, the app can no longer reconstruct the \"currently\
        \ in progress\" context even though the DB still says the session is valid/open.\n\
        \n## 2. When Continuation Breaks (Trigger Conditions)\n\nContinuation breaks\
        \ when **any of the following occur after the fixed TTL fires:**\n\n1. **User\
        \ returns on an old key** — Bookmark/re-open the session after the TTL elapsed.\
        \ `GET session:<id>` → nil.\n2. **Fixed TTL is globally the same** — A 15-minute\
        \ TTL kicks out any session where the user paused in thought >15 min, regardless\
        \ of DB status.\n3. **No refresh on activity** — If TTL is **not reset** on\
        \ each user action (e.g., only set once at creation), even an actively-used\
        \ session expires mid-answer.\n4. **Hard-coded constant vs. actual work**\
        \ — Steps expected to take longer than TTL (long LLM calls, file uploads,\
        \ pipelined RAG) time out server-side before finishing.\n5. **App restart\
        \ / cache flush** — `FLUSHALL`, deploys, or OOM eviction remove keys earlier\
        \ than the TTL, independent of DB state.\n6. **Write buffering** — A partial\
        \ answer was staged in Redis only, never flushed to DB; expiry destroys unsaved\
        \ work while the DB still shows the session as \"in progress\" (garbage the\
        \ user can't resume).\n\n## 3. Why Continuation Breaks (Mechanism / Under\
        \ the Hood)\n\n**A. The continuation lookup is Redis-first, DB-agnostic.**\n\
        ```\nGET session:ctx:<interviewId>\n```\nIf `GET` returns nil, the controller's\
        \ typical behavior is to **treat it as a fresh/expired session** and either\
        \ (a) 401/403, (b) redirect to a resume-or-restart splash, or (c) silently\
        \ start a new session. None of these consult the DB row that still says `status='in_progress'`.\n\
        \n**B. Redis uses approximate/deadline TTL.**\nFixed `EXPIRE` gives one absolute\
        \ deadline from **key creation**. There is no notion that the DB is still\
        \ alive. Lazy vs. active expiry means the key may vanish at any time past\
        \ the deadline; the app cannot predict it.\n\n**C. The DB is read only at\
        \ checkpoints, not on the hot path.**\nThe durable state is synced on discrete\
        \ events (answer submitted, question advanced). Between checkpoints, **the\
        \ authoritative in-flight context lives solely in Redis**. Once Redis dies,\
        \ that context is unrecoverable and the DB checkpoint represents a *previous*\
        \ consistent state — so \"continuation\" can only resume from the last checkpoint,\
        \ not from where the user actually was. The divergence is the root cause:\
        \ **DB says \"valid, in progress\"; Redis (the basis for reconstruction) is\
        \ gone.**\n\n**D. Key naming/timebase mismatch.**\nIf TTL is applied to the\
        \ key holding *transient* data but the *lookup key* is separate, expiry of\
        \ one can orphan the other, producing a session that is half-alive — lookups\
        \ fail even though some Redis state remains.\n\n## 4. Fix Strategies (ranked\
        \ by robustness)\n\n### Recommended: Dual-source reconciliation\n\nRead-through\
        \ with DB fallback:\n```go\nfunc LoadContext(ctx, interviewID string) (*RuntimeCtx,\
        \ error) {\n    // 1. Fast path: Redis\n    if raw, err := rdb.Get(ctx, keyFor(interviewID)).Bytes();\
        \ err == nil {\n        _ = rdb.Expire(ctx, keyFor(interviewID), ttl)    \
        \    // slide on access\n        return unmarshal(raw)\n    }\n    // 2. Slow\
        \ path: rebuild from durable DB truth\n    sess, err := db.FindInterview(ctx,\
        \ interviewID)          // still valid?\n    if errors.Is(err, db.ErrNotFound)\
        \ {\n        return nil, ErrSessionEndedOrMissing\n    }\n    if sess.Status\
        \ != InProgress {\n        return nil, ErrSessionClosed\n    }\n    rc :=\
        \ rebuildRuntimeFromDB(sess)                          // reconstruct step/context\n\
        \    _ = rdb.Set(ctx, keyFor(interviewID), marshal(rc), ttlTime) // re-inject\
        \ with fresh TTL\n    return rc, nil\n}\n```\nThis turns Redis from **source\
        \ of truth into a cache** — the DB becomes authoritative, Redis is a write-through/write-back\
        \ cache. Fixed TTL then only affects latency, not correctness.\n\n### Sliding\
        \ TTL (minimum viable change)\n```bash\n# only reset on activity instead of\
        \ fixed-from-create\nSET session:ctx:<id> <value> PX 900000\n# on every user\
        \ interaction:\nEXPIRE session:ctx:<id> 900000\n```\nUse `Expire` per request\
        \ so active sessions never die; idle ones still recycle. Pair with a **lower-bound\
        \ warning TTL** to trigger auto-persist before deletion:\n```bash\n# PERSIST\
        \ before it disappears; the safest is to persist silently at checkpoints.\n\
        ```\n\n### Heartbeat + checkpoint persistence\n- Client sends heartbeat every\
        \ N seconds; server slides TTL. \n- On any write to Redis, also mark DB `last_seen`\
        \ / flush the staged answer so nothing critical exists only in the ephemeral\
        \ store.\n\n### Match TTL length to task length\n- TTL must exceed the max\
        \ expected uninterrupted step duration (LLM batch, RAG query, upload) — otherwise\
        \ a legitimately long operation kills its own session. Refactor: TTL ≥ `max_step_duration\
        \ × safety_buffer`.\n\n### Fail-closed with recovery UI\nWhen `GET` misses\
        \ but DB is `in_progress`, route to a **resume** handler (rebuild from DB)\
        \ instead of a **restart** handler (fresh session). Distinguish *\"really\
        \ ended\"* (DB `finished`/`abandoned`) from *\"ephemeral state lost\"* (DB\
        \ still `in_progress`).\n\n## 5. Key Validation Recommendations\n\n1. **Test\
        \ the exact window** — create session, wait `TTL + ε`, verify continuation\
        \ fails while DB row remains `status='in_progress'`. Automate as an integration\
        \ test.\n2. **Assert the rejection path** — after expiry, the API must return\
        \ a *recoverable* signal (`SESSION_EXPIRED` with resume option), not a hard\
        \ failure.\n3. **Verify redis-only state is truly disposable** — any value\
        \ that must survive a Redis loss must either be in the DB or reproducible\
        \ from the DB.\n4. **Set a monitoring alert** on Redis key-delta vs. active\
        \ DB `in_progress` rows: a widening gap indicates silent upstream expiry.\n\
        \n## 6. Bottom Line\n\n- **When it breaks:** any session whose idle/processing\
        \ time exceeds the fixed TTL while the DB session remains `in_progress` —\
        \ or after app restart/cache eviction.\n- **Why:** runtime context is Redis-authoritative\
        \ between checkpoints, and expiry is time-based (not DB-aware), so a nil `GET`\
        \ is misread as \"expired\" rather than \"rebuildable,\" losing the in-flight\
        \ position despite durable truth surviving.\n- **Fix:** make Redis a cache\
        \ of DB truth, use **read-through rebuild + sliding TTL + checkpoint persistence\
        \ + fail-closed resume routing**. Fixed-from-creation TTL is an anti-pattern\
        \ for resumable workflow state.\n\n*Reference pattern [T-005] / [S-001] (RAG/interview\
        \ session continuation): apply the same read-through-and-reconstruct-from-durable-store\
        \ approach used for retrieval context reconstruction here.*"
