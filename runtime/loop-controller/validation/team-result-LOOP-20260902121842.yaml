        ## 1. Problem Statement


        '
      output: "# Redis TTL Expiry vs. DB-Resident Interview Session — Continuation\
        \ Failure Analysis\n\n**Role:** Backend Architect | **Domain:** Distributed\
        \ runtime state / session lifecycle\n\n## 1. Problem Statement\n\nSession\
        \ state split across two stores with divergent lifetimes:\n\n| Store | Content\
        \ | Lifecycle |\n|-------|---------|-----------|\n| **Redis** | Runtime/interview\
        \ state (current step cursor, transient answers, timer, submit tokens) | Fixed\
        \ `EXPIRE <key> <ttl>` |\n| **DB** | Base session record (`sessions` row +\
        \ persisted answers) | Durable, no auto-expiry |\n\nBecause the DB row outlives\
        \ the Redis key, the system presents as an \"active/session exists\" state\
        \ while the runtime state needed to actually continue has silently vanished.\n\
        \n## 2. When Continuation Breaks (Failure Conditions)\n\nContinuation fails\
        \ at the **first interaction after the TTL window closes** even though the\
        \ user was mid-interview and the DB says the session is open. Concrete trigger\
        \ matrix:\n\n- **Fixed TTL < expected human completion time.** One TTL value\
        \ for all sessions (the classic bug) — a 30-min interview gets TTL=15min →\
        \ guaranteed mid-session expiry regardless of activity. This is the dominant\
        \ cause.\n- **Sliding window not implemented.** TTL measured from *creation*,\
        \ not from *last activity*. A user in a long, slow step (> TTL) expires while\
        \ actively engaged.\n- **API pagination/forms are multi-request.** Single-request\
        \ perf tests pass; the failure only appears across N requests spanning > TTL.\n\
        - **Idle-then-resume.** User pauses > TTL mid-interview, returns, hits the\
        \ continue endpoint.\n- **No read-probe / touch on access.** Every Redis hit\
        \ should refresh expiration; if the app reads without `TOUCH`/refresh, any\
        \ single gap > TTL kills it.\n\n## 3. Why It Breaks (Root Mechanism)\n\n1.\
        \ **No atomic cross-store lifecycle.** Nothing ties `expire()` on Redis to\
        \ state in the DB. The two stores are updated in separate, non-transactional\
        \ operations.\n2. **Silent eviction.** Redis must evict within its memory\
        \ policy (`allkeys-lru`, `volatile-lru`) or via `EXPIRE` — no callback, no\
        \ tombstone, no error surfaced to the caller. Key simply returns `nil`.\n\
        3. **Localization of the failure.** The failure is latent: it only manifests\
        \ at a `GET` on an expired key. Code paths that never look up the key (relying\
        \ on the DB row) report the session as healthy, so the divergence is invisible\
        \ until an authenticated continue request does `MGET/HGETALL` → empty → handler\
        \ throws or returns \"session not found\".\n4. **Ambiguity between \"not started\"\
        \ and \"expired\".** Because the DB row has no `expires_at`, the resume path\
        \ cannot distinguish *no-session* from *expired-session*, so a clean user-facing\
        \ recovery (re-init) is impossible.\n\n## 4. Architectural Fixes (Recommendation\
        \ Ladder)\n\n### A. Sliding TTL (minimum viable fix)\nRefresh expiry on every\
        \ state access/write. Redis supports this at the command layer\n\n```\n# in-place\
        \ refresh of hash fields + TTL\nMULTI\n  HSET session:{id} cursor \"q7\"\n\
        \  EXPIRE session:{id} 3600\nEXEC\n```\n\nOr set `session.ttl = \"versioned\"\
        ` in Spring Session / `EXPIRE` on get:\n\n```go\n// refresh on read (lua to\
        \ be atomic)\nlua := `\n\tlocal k = KEYS[1]\n\tlocal ttl = ARGV[1]\n\tredis.call(\"\
        TOUCH\", k)\n\tredis.call(\"EXPIRE\", k, ttl)\n\treturn 1\n`\n```\n\n### B.\
        \ Store `expires_at` in the DB (single source of truth)\nPersist the session\
        \ deadline alongside the row:\n- Columns: `sessions.expires_at TIMESTAMP NOT\
        \ NULL`.\n- Every successful interaction `UPDATE sessions SET next_expiry\
        \ = NOW() + interval`.\n- Resume path checks DB deadline: expired → return\
        \ explicit `SESSION_EXPIRED` with re-init token; valid → rebuild/rehydrate\
        \ Redis lazily.\n\nThis removes reliance on Redis TTL eviction as the *only*\
        \ expiry detector.\n\n### C. Keep nothing runtime-critical only in Redis\n\
        Rules:\n- **Cursor/current step** → DB (authoritative). Redis is a cache,\
        \ not the owner.\n- **Reproducible data** (fully answered steps) → DB.\n-\
        \ **Non-reproducible transient data** (CSRF/submit tokens, one-time nonce,\
        \ short-lived locks, timers) → Redis is fine with sliding TTL.\n\n### D. Lazy\
        \ rehydration + idempotent resume\nOn continue: probe Redis → if missing,\
        \ rebuild from DB (transactional), then proceed. Make every resume endpoint\
        \ idempotent so a mid-expiry retry reconstructs, never corrupts.\n\n### E.\
        \ Unified TTL policy\nMove from a single constant to a policy: `ttl = max(base_ttl,\
        \ expected_remaining)` or configure per-interview-config, with a config-driven\
        \ floor so short interviews never exceed TTL.\n\n## 5. Handling the \"silent\"\
        \ part explicitly\n- Add a distributed **lock** (e.g., Redlock or DB row lock)\
        \ around rehydration to prevent two resume requests from double-initializing.\n\
        - Emit an event/metric on rehydration (`session_rehydrated{reason=\"ttl_expired\"\
        }`) so the silent eviction becomes observable in logs/dashboards instead of\
        \ surfacing only as user-facing failures.\n- Add a TTL-aware health probe:\
        \ background job scans `expires_at < NOW()` in DB where Redis is already absent\
        \ → reconcile/cleanup canonical state.\n\n## 6. Code Example — Resilient Continue\
        \ Endpoint\n\n```go\nfunc Continue(ctx context.Context, sessID string) error\
        \ {\n    // 1. DB is authoritative for existence + deadline\n    row := db.GetSession(ctx,\
        \ sessID)\n    if row == nil {\n        return ErrNoSession\n    }\n    if\
        \ time.Now().After(row.ExpiresAt) {\n        return &SessionExpired{ReinitToken:\
        \ issueReinit(row.UserID)}\n    }\n    // 2. Try runtime state, rehydrate\
        \ on miss\n    if !redis.Exists(ctx, \"session:\"+sessID) {\n        lock\
        \ := redlock.New(\"rehydrate:\"+sessID, 5*time.Second)\n        if lock.Acquire()\
        \ {\n            defer lock.Release()\n            if err := hydrateFromDB(ctx,\
        \ row); err != nil {\n                return err\n            }\n        \
        \    metrics.Rehydrate(\"ttl_expired\")\n        }\n    }\n    // 3. Refresh\
        \ sliding window + read state\n    redis.Touch(ctx, \"session:\"+sessID)\n\
        \    state := redis.HGetAll(ctx, \"session:\"+sessID)\n    return resumeFrom(state,\
        \ row)\n}\n```\n\n## 7. Anti-patterns to avoid\n- `EXPIRE` set once at creation\
        \ with a constant everywhere.\n- Relying on Redis TTL handler/library (e.g.,\
        \ Spring `@SessionAttributes`-style) without DB-backed `last_activity`.\n\
        - Background TTL-scanner that *deletes* DB rows on Redis absence (destroys\
        \ canonical data).\n\n## 8. Verification / test matrix\n1. **Fixed-TTL blow-through:**\
        \ create session, wait > TTL with no activity, resume → expect `SESSION_EXPIRED`\
        \ + re-init, not a 5xx or silent `nil`.\n2. **Sliding window:** interact at\
        \ intervals < TTL across total time > original TTL → must still resume.\n\
        3. **Rehydration idempotency:** expire Redis, fire two concurrent continues\
        \ → single init, no duplicate/corruption.\n4. **Long single step:** one active\
        \ step exceeding TTL → must not expire while active.\n5. **DB/Redis divergence\
        \ audit:** assert `expires_at` and Redis TTL stay in sync after every mutation.\n\
        \n---\n\n**Summary:** Root cause is divergent, non-atomic lifecycles + fixed-from-creation\
        \ TTL + silent eviction + no DB-side expiry. Standard fix = sliding TTL +\
        \ DB `expires_at` as source of truth + lazy idempotent rehydration with locking\
        \ + observability. This aligns with the validated patterns in memory (retrieval/state-resumption\
        \ under multi-store correctness guards). Ready for lead review."
