        ---


        ## Security Review: Redis TTL Expiry vs. Valid DB — Session Continuation Breakage


        **Files analyzed:**'
      output: "I have a complete picture. Here is my domain analysis as security-engineer\
        \ for lead review.\n\n---\n\n## Security Review: Redis TTL Expiry vs. Valid\
        \ DB — Session Continuation Breakage\n\n**Files analyzed:** `InterviewStateStore.java`\
        \ (TTL/logic), `InterviewService.java` (state machine, `requireAsking` fallback),\
        \ `RedissonConfig.java`, `InterviewSession.java`, `InterviewStatus.java`\n\
        \n### 1. Root cause — dual source-of-truth with misaligned lifetime policies\n\
        \n`InterviewStateStore.java:51` writes the runtime state with an **absolute\
        \ 24h TTL** refreshed on every write:\n```java\nredissonClient.getBucket(key(sessionId)).set(json,\
        \ TTL_HOURS, TimeUnit.HOURS);\n```\n`InterviewStateStore.java:15` explicitly\
        \ declares Redis the **single authoritative source** (\"存于 Redis，作为状态机的单一权威来源\"\
        ). Meanwhile `InterviewSession` in MySQL uses `@TableLogic` soft-delete only\
        \ — **the DB row never expires**. So the two sources of truth have incompatible\
        \ lifecycles:\n\n- Redis state: dies at exactly `lastWrite + 24h` (or earlier,\
        \ see §3).\n- DB session: persists until soft-deleted, **indefinitely**, and\
        \ can remain `ASKING` forever (no DB-side session timeout anywhere).\n\nThe\
        \ only thing bridging the gap is the **self-heal fallback** in `InterviewService.requireAsking()`\
        \ (lines 381–390): when `stateStore.read()` returns `null`, it rebuilds `SessionState`\
        \ from the DB row and rewrites Redis. This quietly masks almost every expiry\
        \ today — which is itself a **fail-open security/observability problem** (§4).\n\
        \n### 2. When and why continuation actually breaks\n\nThe current 3-field\
        \ `SessionState(status, questionCount, currentQuestionId)` is a *subset* of\
        \ `InterviewSession`, so the fallback can reconstruct it. Continuation breaks\
        \ in these cases:\n\n- **(a) Redis-only state loss (structural risk, will\
        \ break with the next field).** The moment any runtime field is added to `SessionState`\
        \ that is *not* persisted to `interview_session` (e.g. per-question pacing\
        \ budget, timing, transient answer buffer, remaining follow-up streak), expiry\
        \ silently destroys it. DB looks valid; `requireAsking` rebuilds the shell\
        \ — **continuation semantics are lost with no error, no alert.** This is the\
        \ primary \"silently breaks while DB is valid\" scenario.\n\n- **(b) Idle-but-live\
        \ sessions killed by absolute clock.** TTL is refreshed on writes only. Read-only\
        \ operations do **not** refresh it: `detail()` (`InterviewService:291`), `listByUser()`,\
        \ and the long-lived SSE stream in `answerStream()` (its `SseEmitter` holds\
        \ 300s, but the state write happens only at stream completion). A user who\
        \ reads history or whose writes are >24h apart has the authority evicted between\
        \ steps.\n\n- **(c) Divergence via write ordering / write failure.** In `answer()`\
        \ (lines 186–189) and `answerStream()` (258–264) the **DB is mutated first**,\
        \ then `stateStore.write()` runs. If the Redis write throws, `InterviewStateStore.write()`\
        \ throws `BizException` (line 54) *after* the DB row already advanced. Result:\
        \ DB ≥ Redis in advancement order. If the Redis key is then evicted/expired,\
        \ the fallback rebuilds from the **ahead** DB state → the *already-consumed*\
        \ answer can be re-issued/duplicated, or `questionCount` regresses relative\
        \ to what Redis briefly held. Fail-open resurrection of stale progression.\n\
        \n- **(d) Eviction before TTL.** `RedissonConfig` sets no `maxmemory-policy`.\
        \ If Redis runs `allkeys-lru`/`volatile-lru` under pressure, the authority\
        \ key can be evicted arbitrarily early — the \"24h guarantee\" is not a guarantee.\n\
        \n- **(e) FINISHED keys leak + unnecessary retention.** `finishSession()`\
        \ writes a `FINISHED` state but **never calls `stateStore.delete()`** (`InterviewStateStore:58`\
        \ is dead code). Terminal keys sit in Redis for the full 24h each — a small\
        \ memory-exhaustion vector under many sessions.\n\n### 3. Why \"silently\"\
        \ — the security concern\n\nEvery null/miss collapses to the same path with\
        \ **no distinction and no signal**:\n- `read()` returns `null` for both *expired*\
        \ and *parse-failure* (`InterviewStateStore:43` logs warn only on JSON failure;\
        \ a missing key logs nothing).\n- `requireAsking()` rebuilds and rewrites\
        \ without logging a warning or emitting a metric.\n\nResult: an operator cannot\
        \ distinguish \"normal empty session\" from \"state was silently evicted.\"\
        \ Fail-open recovery means **the availability break is invisible until a user\
        \ reports a corrupted/reset interview** — no alarms, no audit trail.\n\n###\
        \ 4. Recommended remediation (concrete)\n\n**A. Make the DB the authority;\
        \ Redis a pure, disposable cache.** Reverse the design contract in `InterviewStateStore.java:15`.\
        \ Redis should never be relied on as the *only* truth. Continuation must always\
        \ be reconstructible from MySQL; Redis is a fast-path + optimistic-concurrency\
        \ aid. This removes the entire class of fail-open divergence.\n\n**B. Differentiate\
        \ TTL by lifecycle and stop expired-key resurrection:**\n- Active (`START`/`ASKING`)\
        \ sessions: **no absolute wall-clock kill** — use a long **sliding** TTL (renew\
        \ on read too), OR no TTL.\n- Terminal (`FINISHED`): short TTL (e.g. 1h) and\
        \ call `delete()` after the report is generated.\n```java\n// sliding TTL:\
        \ renew on read so idle-but-live sessions survive\npublic SessionState read(Long\
        \ sessionId) {\n    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \    String json = bucket.get();\n    if (json == null) return null;\n   \
        \ bucket.expire(Duration.ofHours(TTL_HOURS)); // slide window (only if session\
        \ active)\n    ...\n}\n```\n\n**C. Add a DB-side session timeout so both stores\
        \ agree on life span.** A session stuck in `ASKING` for >N days is itself\
        \ a correctness/abandonment issue; add a scheduled sweep and an `expires_at`/`last_active`\
        \ column so the DB no longer claims an indefinitely valid interview.\n\n**D.\
        \ Harden dual-write ordering (availability/integrity):**\n```java\n// in answer():\
        \ DB is already advanced (line 186). Make Redis write best-effort and NON-blocking:\n\
        try {\n    stateStore.write(sessionId, newState);\n} catch (Exception e) {\n\
        \    // DB is already the truth; do not fail the user request or leave DB\
        \ ahead of authority\n    log.error(\"redis state write failed, will reconcile\
        \ on next read: \" + e.getMessage());\n    redisMissReconciliations.increment();\
        \  // alert on these\n}\n```\nThen `read()`/`requireAsking` formalizes: **on\
        \ miss, always trust DB**, and log a structured warning with `sessionId` each\
        \ time it reconciles (so an expiry spike is detectable).\n\n**E. Eviction\
        \ / infra guard.** Add to Redis config: `maxmemory-policy` conscious choice\
        \ (`allkeys-lru` for cache tier, `volatile-lru` otherwise) — never silently\
        \ treat state keys as LRU-evictable. Add a sharded/per-session heartbeat or\
        \ keyspace-notification check so ops can detect early eviction.\n\n**F. Security\
        \ observability.** Add counters + WARN logs on the rebuild path, and alert\
        \ on: RedisMissRebuild spike, `parse failure` events, and dropped `stateStore.write`.\
        \ Include metrics for keyspace saturation (memory / `info memory`).\n\n**G.\
        \ Regression test proving expiration does not break continuation:**\n```java\n\
        @Test\nvoid sessionContinuationSurvivesRedisExpiry() {\n    Long sid = svc.create(userId,\
        \ req).sessionId();\n    svc.answer(userId, sid, \"a1\");\n    stateStore.delete(sid);\
        \                      // simulate silent eviction/expiry at 24h\n    MessageVO\
        \ next = svc.answer(userId, sid, \"a2\"); // must resume from DB, not error/reset\n\
        \    assertEquals(\"question\", next.kind());\n    assertEquals(2, stateStore.readExpectNotNull(sid).questionCount());\n\
        }\n```\n\n### 5. Bottom line for lead\n\n- The **why**: Redis (authority)\
        \ has an absolute 24h TTL; MySQL (authority) never expires. Two sources of\
        \ truth with incompatible lifetimes, plus fail-open self-heal, produce silent\
        \ divergence.\n- The **when**: (a) any firmware-only state field added to\
        \ `SessionState`, (b) idle-but-live sessions >TLL, (c) Redis write-failure\
        \ leaving DB ahead, (d) memory-pressure eviction before 24h, (e) no DB session\
        \ timeout.\n- **Priority fixes:** make MySQL authoritative & Redis a disposable\
