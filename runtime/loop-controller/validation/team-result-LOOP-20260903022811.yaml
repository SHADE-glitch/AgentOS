        \ WHERE id='{test_id}'\" # status=active\n\n# 2. Check TTL strategy\ngrep\
        \ -rn \"setex\\|SET.*EX\\|expire\" src/ --include=\"*.ts\" --include=\"*.py\"\
        \n# FAIL if only found at creation, not in getSession/updateSession\n\n# 3.\
        \ Reproduce deterministically\npython3 -c \"\nimport redis, time, json\nr=redis.Redis()\n\
        sid='test-123'\nr.setex(f'interview:session:{sid}', 5, json.dumps({'q_idx':2}))\n\
        time.sleep(6)\nprint('redis:', r.get(f'interview:session:{sid}')) # None\n\
        print('db still valid -> bug reproduced if app throws 404')\n\"\n\n# 4. Check\
        \ eviction vs expiry\nredis-cli INFO memory | grep evicted\nredis-cli CONFIG\
        \ GET maxmemory-policy # should be noeviction for session store\n\n# 5. Enable\
        \ keyspace notifications to observe silent expiry\nredis-cli CONFIG SET notify-keyspace-events\
        \ Ex\nredis-cli --csv PSUBSCRIBE '__keyevent@*:expired'\n```\n\nAdd observability:\
        \ log cache miss with `session_id`, `redis_ttl=-2`, `db_status`.\n\n```python\n\
        # src/middleware/sessionMiddleware.ts:78\nstate = await redis.get(key)\nif\
        \ not state:\n    db_session = await db.get_session(session_id)\n    logger.warn(\"\
