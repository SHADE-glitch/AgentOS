        \ `database` + `ai`\n**Task:** `F1 — interview session runtime state stored\
        \ in Redis with fixed TTL can silently expire while DB remains valid; explain\
        \ when and why continuation breaks`\n\n#### 1. Executive Summary\n\nAuthoritative\
        \ interview session state is held in Redis (`InterviewStateStore.java:25,48-51`)\
