    output: "# Interview Session Runtime State: Redis TTL vs DB — When and Why Continuation\
      \ Breaks\n\n**Lead: Database Engineer** | Support: Security Engineer, Code Reviewer,\
      \ Backend Architect | Domain: `database, ai` | Team `team-18087af2`\n\n## 1.\
      \ Executive Summary\n\n`interview:session:{id}` in Redis is declared the *single\
      \ authoritative source* (`InterviewStateStore.java:15` comment `单一权威来源`) but\
      \ is written with a **fixed `TTL_HOURS=24`** (`InterviewStateStore.java:25`)\
      \ while MySQL `interview_session` has **no TTL** (`schema.sql:46-60`). After\
      \ 24h of *silence* (no `write()`), `read()` returns `null` (`InterviewStateStore.java:34-44`)\
      \ and `InterviewService.requireAsking()` (`InterviewService.java:380-399`) blindly\
      \ rehydrates from DB and re-caches 24h, masking drift. `answer()`/`answerStream()`\
      \ then continue on stale `questionCount/currentQuestionId`.\n\n> Seed lesson:\
      \ *Redis-backed runtime state is not authoritative after TTL expiry; validate\
      \ freshness against DB truth before continuing.*\n\n## 2. Grounding — Verified\
      \ Dual-Write Architecture\n\n| Layer | Key / Table | Write Path | TTL / Durability\
      \ |\n|---|---|---|---|\n| **Redis (Redisson `RBucket`)** | `interview:session:{sessionId}`\
      \ `InterviewStateStore.java:31` JSON `SessionState(status, questionCount, currentQuestionId)`\
      \ `InterviewStateStore.java:27` | `InterviewStateStore.write(): bucket.set(json,\
      \ 24, HOURS)` `InterviewStateStore.java:51` on every `create()` `InterviewService.java:91,116`,\
      \ `answer()` `InterviewService.java:188`, `finishSession()` `InterviewService.java:345`\
      \ | 24h since *last write*, ephemeral, silent expiry (`get()==null`) |\n| **MySQL**\
      \ | `interview_session` `schema.sql:46` `status, questionCount, currentQuestionId,\
      \ started_at, finished_at` — **no `updated_at`** | `sessionMapper.insert/updateById`\
      \ `InterviewService.java:87,114,186,344` | Durable, never expires. `finished_at`\
      \ only on `FINISHED`. |\n\nRead path: `requireAsking()` `InterviewService.java:381`\
      \ → `stateStore.read()` → if `null` → `sessionMapper.selectById()` → `new SessionState(s.getStatus(),\
      \ s.getQuestionCount(), s.getCurrentQuestionId())` → `stateStore.write()` `InterviewService.java:383-389`.\
      \ No version/timestamp/message-max-id check.\n\nContinuation depends on that\
      \ state: `int newCount = state.questionCount()+1` `InterviewService.java:179,254`\
      \ then `session.setQuestionCount(newCount)` + `saveAiMessage()`.\n\n## 3. When\
      \ It Breaks — Timeline\n\n```\nT0 create(): DB status=ASKING count=1, Redis\
      \ TTL=24h\nT0+XX answer() loop: each answer resets TTL to 24h (write on every\
      \ question)\nT_lastAnswer + 24h + 1ms → Redis key expires (or Redis flush/eviction/corrupt\
      \ JSON → read()==null InterviewStateStore.java:43)\nT_break user calls POST\
      \ /interview/{id}/answer :\n  requireAsking() sees null → DB fallback → blind\
      \ rehydrate → continuation proceeds with potentially stale count\n```\n\n**Critical\
      \ nuance (fixing naive model):** TTL is **24h since last `write`**, not since\
      \ creation. A highly active session never expires; an abandoned `ASKING` session\
      \ expires after exactly 24h idle. Both are failure modes.\n\nOther triggers\
      \ for same `null`: `InterviewStateStore.delete()` never called on `FINISHED`\
      \ (leaks), Redis crash/failover, `maxmemory` eviction, JSON parse failure swallowed\
      \ as `null` `InterviewStateStore.java:42-44`.\n\n## 4. Why — 5 Gold Root Causes\
      \ (G1–G5)\n\n**G1 — Fixed TTL on authoritative state.** `TTL_HOURS=24` is hardcoded\
      \ `InterviewStateStore.java:25`, not configurable, with no refresh on read.\
      \ Expiry is silent — no event, no tombstone.\n\n**G2 — No freshness validation.**\
      \ No `updated_at` in `interview_session` (`schema.sql` lacks it), no monotonic\
      \ version, no `SELECT MAX(id) FROM interview_message WHERE session_id=?` check\
      \ before accepting fallback. Rehydrate cannot detect staleness.\n\n**G3 — Fallback\
      \ masks drift.** `requireAsking()` `InterviewService.java:382-389` treats `null`\
      \ as recoverable, not anomalous. It logs nothing, increments no metric, and\
      \ resets TTL for another 24h, hiding that drift occurred. The DB `questionCount`\
      \ may lag `interview_message` rows if a previous DB update failed but Redis\
      \ succeeded (or vice versa).\n\n**G4 — Continuation depends on stale state.**\
      \ `answer()` and `answerStream()` `InterviewService.java:129,204` gate on `requireAsking()`\
      \ then derive `newCount` from `state`. If `state.questionCount` is 1 behind\
      \ (e.g., concurrent `answer()` partially failed after `messageMapper.insert`\
      \ but before `sessionMapper.updateById`), next `newCount` duplicates or skips,\
      \ and `currentQuestionId` may point to a superseded `interview_message.id`.\n\
      \n**G5 — Non-transactional dual-write.** `sessionMapper.updateById(session)`\
      \ then `stateStore.write()` `InterviewService.java:186-189` are not atomic.\
      \ Crash between them → Redis/DB diverge. No outbox, no reconciliation job.\n\
      \n### Drift Scenarios\n\n| Scenario | DB truth | Redis after expiry + rehydrate\
      \ | Impact |\n|---|---|---|---|\n| 24h idle `ASKING` session, DB `FINISHED`\
      \ via async scorer | `FINISHED` count=6 | Rehydrated `FINISHED` → throws `INTERVIEW_FINISHED`\
      \ (correct *but* after 24h false `ASKING` window if scorer raced) | User resubmits\
      \ answer to finished interview |\n| DB `ASKING` count=3, but 4 `interview_message(kind=question)`\
      \ rows (count update lost) | count 3 vs 4 messages | Rehydrated count=3 → `newCount=4`\
      \ duplicates existing message id sequence | `questionCount` never converges\
      \ |\n| Concurrent `answer()` with `RLock interview:lock:{id}` `InterviewService.java:362`\
      \ timeout 5s `InterviewService.java:64` → second caller waits, first expires\
      \ Redis mid-lock | count N | Second caller reads `null` → rehydrates N-1 | Lost\
      \ update |\n\n## 5. Cross-Functional Review\n\n**Security Engineer:** Stale\
      \ `state.status()` bypasses state-machine (`START/ASKING→FINISHED` `InterviewStatus.java:7-22`).\
      \ An expired `FINISHED` rehydrated during a race could be observed as `ASKING`,\
      \ allowing extra `answer()` calls beyond `MAX_QUESTIONS=6` `InterviewService.java:65`.\
      \ Also `requireOwnedSession()` `InterviewService.java:401` checks ownership\
      \ *before* `requireAsking()` — rehydrate uses `sessionId` without re-validating\
      \ `userId` in the fallback object (uses session's `userId` anyway, but logs\
      \ no audit).\n\n**Code Reviewer:** Three smells: (1) `read()` swallows parse\
      \ errors as `null` `InterviewStateStore.java:42-44` — corrupt JSON looks like\
      \ expiry; (2) `write()` throws `BizException` `InterviewStateStore.java:54`\
      \ but callers in `finishSession()` don't handle it — DB committed, Redis failed\
      \ = divergence; (3) `InterviewStatus` has unused `SELECT_TOPIC/WAITING_ANSWER/EVALUATING/FOLLOW_UP`\
      \ `InterviewStatus.java:11-16` — no validation ever rejects them, so rehydrated\
      \ bogus status passes `requireAsking()` check `InterviewService.java:394`.\n\
      \n**Backend Architect:** Redis is used as *state* not *cache*. Correct pattern\
      \ is DB-as-source-of-truth + Redis as write-through cache with `SET NX` + version.\
      \ Current `RBucket.set()` is unconditional overwrite. No `delete()` on `FINISHED`\
      \ beyond `finishSession()` re-write — finished sessions live 24h pointlessly.\
      \ `RedissonConfig.java:22` uses single-node Redis — single point of failure\
      \ for authoritative state.\n\n## 6. Reproduction Steps (Testing Engineer Matrix)\n\
      \n```java\n// Minimal reproduction — no external Redis needed: mock RedissonClient\n\
      @Test void ttlExpiry_drift() {\n  Long sid = createSession(status=ASKING, count=3);\
      \ // DB insert\n  stateStore.write(sid, new SessionState(\"ASKING\",3, 101L));\
      \ // T0\n  // Simulate 24h+1ms: mock bucket.get() -> null (expiry) OR bucket.delete()\n\
      \  redisson.getBucket(\"interview:session:\"+sid).delete();\n  InterviewStateStore.SessionState\
      \ s = interviewService.requireAsking(sid);\n  // BEFORE fix: s = rehydrated\
      \ count=3 without validation, re-cached 24h\n  assertNull(stateStore.read(sid)\
      \ /* before rehydrate */);\n  // AFTER fix: should throw DRIFT_DETECTED or reconcile\
      \ count vs messages\n}\n```\n\nMatrix: `TTL expiry` × `DB fallback clean vs\
      \ drifted count` × `corrupt JSON` × `concurrent answer()` × `FINISHED vs ASKING\
      \ DB status`.\n\n## 7. Fix Recommendations — Prioritize Drift Detection over\
      \ TTL Raising\n\n### Immediate (0–2 days)\n\n1. **Make DB source-of-truth, Redis\
      \ cache.** Add `updated_at DATETIME ON UPDATE CURRENT_TIMESTAMP` to `interview_session`\
      \ `schema.sql:46` (migration) and version check.\n\n```java\n// InterviewService.java:380\
      \ — replace blind rehydrate\nprivate SessionState requireAsking(Long sessionId){\n\
      \  SessionState cache = stateStore.read(sessionId);\n  InterviewSession db =\
      \ sessionMapper.selectById(sessionId);\n  if(db==null) throw new BizException(INTERVIEW_NOT_FOUND);\n\
      \  if(FINISHED.name().equals(db.getStatus())) throw new BizException(INTERVIEW_FINISHED);\n\
      \  if(cache==null){\n    // freshness: compare count vs actual messages\n  \
      \  long msgQuestionCount = messageMapper.selectCount(\n      new LambdaQueryWrapper<InterviewMessage>()\n\
      \        .eq(InterviewMessage::getSessionId, sessionId)\n        .eq(InterviewMessage::getKind,\"\
      question\"));\n    if(db.getQuestionCount()!= msgQuestionCount){\n      log.warn(\"\
      drift detected session={} dbCount={} msgCount={}\", sessionId, db.getQuestionCount(),\
      \ msgQuestionCount);\n      db.setQuestionCount((int)msgQuestionCount); // reconcile\n\
      \      sessionMapper.updateById(db);\n    }\n    cache = new SessionState(db.getStatus(),\
      \ db.getQuestionCount(), db.getCurrentQuestionId());\n    stateStore.write(sessionId,\
      \ cache);\n    // metric: drift_rehydrates.increment()\n  } else {\n    // parity\
      \ check even when cache hit\n    if(!cache.status().equals(db.getStatus()) ||\
      \ cache.questionCount()!=db.getQuestionCount()){\n      log.warn(\"cache/db\
      \ parity mismatch session={} cache={} db={}\", sessionId, cache, db);\n    \
      \  // choose DB truth, evict cache\n      cache = new SessionState(db.getStatus(),\
      \ db.getQuestionCount(), db.getCurrentQuestionId());\n      stateStore.write(sessionId,\
      \ cache);\n    }\n  }\n  // ... existing status checks\n  return cache;\n}\n\
      ```\n\n2. **Distinguish expiry from corruption.** `InterviewStateStore.java:40-44`\
      \ should throw on parse failure, not return `null`.\n\n3. **Transactional dual-write:**\
      \ Wrap `sessionMapper.updateById` + `stateStore.write` in `try/catch`; on Redis\
      \ failure, delete key (force DB read next time) rather than leaving stale cache.\n\
      \n### Tactical (1–2 weeks)\n\n- **Separation:** Rename Redis key to `interview:cache:*`\
      \ and update comment `InterviewStateStore.java:15` to `cache, not authority`.\n\
      - **Configurable TTL + refresh on read:** `app.interview.state-ttl-hours=24`\
      \ (`AiProperties.java`) with `bucket.remainTimeToLive()` extend on successful\
      \ `requireAsking()`.\n- **Versioned state:** Add `version BIGINT` to `interview_session`,\
      \ `SessionState(version)` and `UPDATE ... WHERE version=?` optimistic lock in\
      \ `InterviewService.answer()`.\n- **Reaper job:** Delete Redis keys where DB\
      \ `status=FINISHED` and `finished_at < NOW()-1h`.\n- **Metrics:** `redis_state_expiry_fallback_total`,\
      \ `redis_db_drift_total`.\n\n### Strategic\n\n- Redis persistence `appendonly\
      \ yes` + `save` in `RedissonConfig.java:22` or migrate runtime state entirely\
      \ to DB with `SELECT ... FOR UPDATE` (the `RLock` `InterviewService.java:362`\
      \ already implies DB lock tolerance).\n- Outbox pattern for `interview_result`\
      \ + `session` updates in `InterviewScoringService.java:105-110`.\n\n### Config\
      \ Changes\n\n```yaml\n# application.yml\napp:\n  interview:\n    state-ttl-hours:\
      \ 24  # was hardcoded TTL_HOURS InterviewStateStore.java:25\n    cache-refresh-on-read:\
      \ true\n  redis:\n    state-key-prefix: \"interview:cache:session:\" # was interview:session:\n\
      ```\n\n```properties\n# RedissonConfig.java:22 — add\nconfig.setCodec(new JsonJacksonCodec());\
      \ # avoid String JSON double-encoding\n```\n\n## 8. Verification Checklist (must\
      \ pass before closing)\n\n- [ ] `read()==null` no longer blind — logs + metric\
      \ + parity check against `interview_message` count\n- [ ] `schema.sql` has `updated_at`\
      \ and `version`, cited correctly (no hallucinated `updated_at` before migration)\n\
      - [ ] `InterviewService.java:51` `set(json, TTL, HOURS)` now uses configurable\
      \ TTL\n- [ ] All 3 `answer` paths (`answer()`, `answerStream()`, `create()->ASKING`)\
      \ covered by `requireAsking` parity check\n- [ ] `DashboardService.build()`\
      \ lesson *not* conflated here — keep drift scope to `InterviewStateStore`\n\n\
      ---\n*Grounded in pinned revision `56788e5` working tree: `InterviewStateStore.java:25,34,48`,\
      \ `InterviewService.java:91,116,129,179,204,362,380`, `schema.sql:46`, `InterviewStatus.java:7`,\
      \ `RedissonConfig.java:22`.*\n"
