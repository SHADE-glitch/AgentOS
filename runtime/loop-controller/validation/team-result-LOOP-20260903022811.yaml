        \   \"redis_miss\": True,\n        \"db_status\": db_session.status,\n   \
        \     \"ttl\": await redis.ttl(key) # -2 = expired, -1 = no expire\n    })\n\
        \    metrics.incr(\"interview.session.redis_miss\")\n```\n\nIf `redis_miss`\
        \ rate spikes after deploy or correlates with `interview_duration_p95 > TTL`,\
        \ root cause confirmed.\n\n#### 6. Fixes - Recommended Priority\n\n**P0 -\
        \ Immediate (no data loss fix): Graceful Fallback + Sliding TTL**\n\nDo not\
        \ treat cache miss as fatal. Rehydrate from DB.\n\n```python\n# src/store/interviewStore.py:112\
        \ - Corrected pattern\nSESSION_TTL = 1800 # 30m sliding\nSESSION_KEY = \"\
        interview:session:{id}\"\n\nasync def get_session_state(session_id: str) ->\
        \ dict:\n    key = SESSION_KEY.format(id=session_id)\n    state_json = await\
        \ redis.get(key)\n    if state_json:\n        # CRITICAL: slide TTL on every\
        \ successful continuation\n        await redis.expire(key, SESSION_TTL) #\
        \ or use GETEX\n        return json.loads(state_json)\n    \n    # Fallback:\
        \ reconstruct from DB (source of truth)\n    db_session = await db.fetch_one(\"\
        SELECT * FROM sessions WHERE id=$1\", session_id)\n    if not db_session or\
        \ db_session.status != 'active':\n        raise SessionNotFound()\n    \n\
        \    turns = await db.fetch_all(\"SELECT * FROM interview_turns WHERE session_id=$1\
        \ ORDER BY q_idx\", session_id)\n    reconstructed = {\n        \"session_id\"\
        : session_id,\n        \"q_idx\": len(turns),\n        \"transcript\": turns,\
        \ # rebuild llm_history from durable turns\n        \"rubric_state\": db_session.rubric_snapshot,\n\
        \        \"reconstructed\": True # flag for prompt layer to inject recovery\
        \ prompt\n    }\n    # repopulate cache\n    await redis.setex(key, SESSION_TTL,\
        \ json.dumps(reconstructed))\n    return reconstructed\n\nasync def update_session_state(session_id:\
        \ str, new_state: dict):\n    key = SESSION_KEY.format(id=session_id)\n  \
        \  # atomic SET with TTL to avoid race\n    await redis.set(key, json.dumps(new_state),\
        \ ex=SESSION_TTL)\n    # optional: async write-through to DB for critical\
        \ fields\n    await db.execute(\"UPDATE sessions SET last_activity=now(),\
        \ q_idx=$2 WHERE id=$1\", session_id, new_state['q_idx'])\n```\n\nAtomically\
        \ use `GETEX` (Redis 6.2+): `redis.getex(key, ex=SESSION_TTL)` to get+refresh\
        \ in one RTT.\n\n**P1 - Configuration**\n\n```conf\n# redis.conf for session\
        \ store - isolate from cache\nmaxmemory-policy noeviction  # never evict sessions;\
        \ return OOM error instead\n# OR use dedicated Redis DB/instance for sessions\
        \ vs general cache\n\n# Application config: config/interview.yaml\ninterview:\n\
        \  session_ttl_seconds: 1800  # sliding window, not fixed\n  hard_ttl_seconds:\
        \ 14400    # absolute 4h cap, matches DB expires_at\n  refresh_on: [\"get\"\
        , \"update\", \"heartbeat\"]\n  heartbeat_interval: 300    # frontend pings\
        \ every 5m to slide TTL if idle\n```\n\nFrontend heartbeat prevents Scenario\
        \ A:\n```javascript\n// src/hooks/useInterviewHeartbeat.ts:15\nsetInterval(()\
        \ => fetch(`/api/sessions/${id}/heartbeat`, {method: 'POST'}), 5*60*1000);\n\
        // backend: await redis.expire(key, SESSION_TTL)\n```\n\n**P2 - Durable Design\
        \ (Long-term)**\n\n1.  **Redis as cache only, DB as truth:** Make `interview_turns`\
        \ write-through on every answer, not batch at end. Redis holds only ephemeral\
        \ `llm_history` window for performance.\n2.  **Soft + Hard TTL:** `soft TTL`\
        \ (1800s sliding) for active session, `hard TTL` (DB `expires_at`) for garbage\
        \ collection job that closes `status='expired'` sessions. Never rely on Redis\
        \ expiry to close DB session.\n3.  **Notify on expire for observability:**\
        \ `CONFIG SET notify-keyspace-events Ex` + consumer logs expiry, but do not\
        \ use as business logic trigger.\n\nSchema fix:\n```sql\nALTER TABLE sessions\
        \ ADD COLUMN expires_at TIMESTAMPTZ NOT NULL DEFAULT now() + interval '4 hours';\n\
        ALTER TABLE sessions ADD COLUMN last_activity TIMESTAMPTZ NOT NULL DEFAULT\
        \ now();\nCREATE INDEX ON sessions (expires_at) WHERE status='active';\n--\
        \ Job: UPDATE sessions SET status='expired' WHERE status='active' AND expires_at\
        \ < now()\n```\n\n#### 7. Checklist for Lead Review\n\n- [ ] `grep` confirms\
        \ no `setex` only at creation; all `get`/`set` paths refresh TTL\n- [ ] `maxmemory-policy`\
