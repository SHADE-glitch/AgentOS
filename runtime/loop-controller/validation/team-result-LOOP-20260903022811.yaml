        \ Debug Analysis\n\n**Team:** team-18087af2 | **Role:** Database Engineer\
        \ (prompt-engineer focus) | **Type:** DEBUG\n\n#### 1. Summary\n\nInterview\
        \ session continuity breaks because `Redis` is used as **source of truth for\
        \ runtime state** with a **fixed TTL**, while `Postgres/DB` holds the durable\
        \ session record with no expiry. When Redis key expires, `GET` returns `null`\
        \ silently. Application treats this as invalid/expired session despite `DB.sessions.status\
        \ = 'active'`. Result: continuation fails, history/prompt context lost.\n\n\
        This is not a Redis failure - it is a **lifecycle mismatch** between ephemeral\
        \ cache and durable store.\n\n#### 2. Assumed Architecture\n\n```\nClient\
        \ -> API -> [1. Check Redis interview:session:{id}] -> [2. Fallback DB?]\n\
        \                      | holds: current_question_idx, stack, transcript_buffer,\n\
        \                      | llm_history, timers, rubric_state, temp_scores\n\
        \                      | TTL = fixed 1800s (30m) set once at CREATE\n    \
        \                  v\n                  DB.sessions {id, user_id, status='active',\
        \ created_at, started_at}\n                  DB.interview_turns {session_id,\
        \ q_idx, question, answer} // durable\n```\n\nCritical flaw: `src/services/interviewSession.ts:45`\
        \ or `src/redis/sessionStore.ts:22` typically does:\n```python\n# create only\n\
        redis.setex(f\"interview:session:{session_id}\", 1800, json.dumps(state))\n\
        # later\nstate = redis.get(key) # returns None after 1800s -> no refresh\n\
        if not state: raise SessionExpiredError # even though DB row valid\n```\n\n\
        #### 3. When Continuation Breaks\n\n| Scenario | Timeline | Why Fixed TTL\
        \ Fails |\n|---|---|---|\n| **A. User pause > TTL** | T0: create (TTL 30m)\
        \ -> T30m: expiry -> T35m: user answers Q3 | Most common. No activity = no\
        \ TTL reset. User went idle, thinking, or network drop. |\n| **B. Long interview\
        \ > TTL** | 60min interview with TTL 30m, no sliding | Even with active Q&A,\
        \ if TTL is `SETEX` only at creation and never refreshed on `GET`/`SET`, it\
        \ expires mid-interview. |\n| **C. LLM generation + human review** | Q with\
        \ long LLM reasoning (2-3m) + candidate typing (5m) cumulatively drifts past\
        \ expiry | Fixed window does not account for variable latency. |\n| **D. Background\
        \ eviction** | `maxmemory-policy volatile-lru/allkeys-lru` evicts key before\
        \ TTL due to memory pressure | Silent loss indistinguishable from TTL expiry.\
        \ |\n| **E. Multi-instance race** | API pod A extends TTL, pod B overwrites\
        \ with old TTL | Non-atomic read-modify-write loses refresh. |\n\n**Silent:**\
        \ Redis `DEL` on expiry is lazy + active. No exception. App only sees cache\
        \ miss. Unless subscribed to `__keyevent@0__:expired`, no log is emitted.\
        \ DB query `SELECT * FROM sessions WHERE id=?` still returns valid row, creating\
        \ inconsistency.\n\n#### 4. Why DB Remains Valid\n\n1.  **Different expiry\
        \ semantics:** DB row has no `expires_at` or has `expires_at = now() + 24h`,\
        \ while Redis `EXPIRE` is independent. No FK/cascade or sync job.\n2.  **Cache-as-primary\
        \ anti-pattern:** Runtime state extrinsic to DB (not materialized to `interview_turns`\
        \ until session end). Redis loss = unrecoverable working memory.\n3.  **No\
        \ write-through:** Updates to `state.current_question_idx` only `SET` in Redis,\
        \ not flushed to DB. DB cannot reconstruct.\n4.  **Fixed vs Sliding:** `EXPIRE\
        \ 1800` set once. Correct behavior for interactive session is **sliding window**\
        \ (`EXPIRE` on every read/write).\n\nFrom prompt-engineer view: LLM prompt\
        \ chain `history = state.llm_history[-10:]` is lost. On reconstruction app\
        \ either (a) returns empty history -> LLM repeats Q1 / hallucinates context,\
        \ or (b) aborts -> \"Session expired, please restart\" despite DB showing\
        \ active.\n\n#### 5. Debug / Reproduction Steps\n\nExecute in staging:\n\n\
        ```bash\n# 1. Verify divergence\nredis-cli TTL \"interview:session:{test_id}\"\
