      summary: 'I have the concrete implementation. Here''s my security-engineer contribution
        to the lead review.


        ---


        # Security Analysis: Interview Session State Redis TTL Silently Expires While
        DB Remains Valid


        *'
      output: "I have the concrete implementation. Here's my security-engineer contribution\
        \ to the lead review.\n\n---\n\n# Security Analysis: Interview Session State\
        \ Redis TTL Silently Expires While DB Remains Valid\n\n**Files examined**\n\
        - `backend/.../interview/service/InterviewStateStore.java` (state store +\
        \ TTL)\n- `backend/.../interview/service/InterviewService.java:380-399` (`requireAsking`\
        \ fallback / rehydration)\n- Docker compose / Redis config (eviction & persistence\
        \ posture)\n\n---\n\n## 1. Root cause — when and why continuation breaks\n\
        \nThe system keeps **two sources of truth with divergent lifetimes**:\n\n\
        | Store | Semantics | Lifetime |\n|-------|-----------|----------|\n| Redis\
        \ (`interview:session:{id}`) | Runtime state machine — the \"single authoritative\
        \ source\" per class comment (`InterviewStateStore.java:16`) | **TTL = fixed\
        \ 24h on every `set`** (`InterviewStateStore.java:25,51`) |\n| MySQL `interview_session`\
        \ | Durable row | Permanent (until deleted) |\n\nMechanism:\n\n```\nwrite():\
        \ redisson bucket.set(key, json, 24h, HOURS)   // fixed, reset on each write\n\
        read() : null if expired / evicted / Redis restart lost it\n```\n\n**Continuation\
        \ breaks when** Redis key is missing but the DB row is still `ASKING`:\n\n\
        1. **Idle expiry (most likely).** The 24h TTL is *fixed*, not sliding. Any\
        \ session idle >24h since its last `write` loses its live state. For a long/take-home\
        \ interview legitimately spanning more than 24h, the runtime state vanishes\
        \ mid-flow even though the interview is valid in MySQL.\n2. **Eviction before\
        \ TTL.** If Redis runs under memory pressure with a volatile policy (`allkeys-lru`,\
        \ `allkeys-random`, etc.), keys can be dropped *well before* 24h while still\
        \ \"valid\". This is silent and non-deterministic.\n3. **Redis restart / failover\
        \ without persistence** (RDB snapshots lost / AOF off). All live runtime state\
        \ is gone; DB rows survive.\n4. **Crashed write.** `write()` catches exceptions\
        \ and throws `BizException` (`InterviewStateStore.java:52-55`), so a Redis\
        \ outage during a transition leaves **no state written while DB may have advanced**\
        \ — inverse mismatch.\n\n**What happens next (`InterviewService.requireAsking`,\
        \ :380-389):** it detects `state == null`, falls back to `sessionMapper.selectById`,\
        \ and **rehydrates Redis from the DB row**. So the *happy* path is partly\
        \ self-healing — but see §2 and §3: that fallback is precisely where the security\
        \ problems live.\n\n---\n\n## 2. Security impact assessment\n\nThe combination\
        \ of **silent loss + optimistic DB rehydration** turns a correctness bug into\
        \ security-relevant states.\n\n### Finding SEC-1 (High): State rollback /\
        \ TOCTOU on rehydration → broken state-machine controls\nRedis is documented\
        \ as authoritative *during* the session, but DB is persisted asynchronously/lazily.\
        \ When the key expires and `requireAsking` rebuilds state from MySQL:\n\n\
        - DB `status` may lag Redis => a **rolled-back/older** `questionCount` / `currentQuestionId`\
        \ is rehydrated.\n- This can **regress the interview lifecycle**: re-issue\
        \ an answered question, reset `questionCount` — the prerequisite checks at\
        \ `:391-397` (e.g. block `FINISHED`, block non-`ASKING`) are then evaluated\
        \ against **stale** state.\n- TOCTOU window between `read()` (null) → `selectById`\
        \ → `write()` during which a concurrent request (another tab of the same candidate)\
        \ can also \"rehydrate\" and **double-advance or diverge**, racing with the\
        \ distributed lock held elsewhere.\n\n### Finding SEC-2 (High): No audit trail\
        \ for the break → un-detectable abnormal continuation\nExpiry is fully silent\
        \ (`read()` returns `null`, `requireAsking` treats rehydration as routine).\
        \ There is **no log, metric, or alert** on:\n- how often keys hit TTL/eviction,\n\
        - how often DB-rehydration actually occurred,\n- whether rehydrated state\
        \ **disagreed** with what Redis expected.\n\nA security monitor therefore\
        \ cannot distinguish \"legit long interview\" from \"attacker resetting session\
        \ to farm extra questions / respin state\" or from \"state-corruption incident\"\
        . This is an observability/forensics gap.\n\n### Finding SEC-3 (Medium): Stale-key\
        \ exposure window extends confidential data lifetime\nFixed 24h TTL means\
        \ a finished interview's runtime blob (which can embed `currentQuestionId`,\
        \ internal counters, and other session context) persists in Redis **up to\
        \ 24h after completion** and can persist indefinitely under eviction-resistant\
        \ configs if any write refreshed it. AI-interview content is sensitive; this\
        \ widens the exposure/compromise surface for the shared cache and any Dump/`KEYS`\
        \ incident.\n\n### Finding SEC-4 (Medium): Fallback can mask a Redis compromise\n\
        Because `read()==null` is treated as benign and transparently rehydrated from\
        \ DB, a **malicious or failed flush of the session namespace** (e.g. `FLUSHALL`,\
        \ key overwrite) is transparently \"healed\" — meaning operators get no signal,\
        \ and the DB become the de-facto trusted source with no integrity check that\
        \ Redis was actually consistent with DB before expiry.\n\n---\n\n## 3. Concrete\
        \ recommendations\n\n### R-1 (Critical): Make TTL sliding, not fixed\nRefresh\
        \ TTL on every access/activity, so active sessions never expire while idle-but-valid\
        \ ones are bounded:\n\n```java\n// InterviewStateStore.java\npublic void touch(Long\
        \ sessionId) {\n    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \    bucket.expire(Duration.ofHours(24));           // sliding refresh\n \
        \   log.debug(\"touched session state ttl, sessionId={}\", sessionId);\n}\n\
        ```\nCall `touch()` in `requireAsking`/read paths, and use `expireAfterWrite`\
        \ semantics per transition. Bounded config:\n```\ntimeout // max idle e.g.\
        \ 6h -> sliding doesn't keep abandoned sessions forever\n```\nUse a **sliding\
        \ inactivity cap** (e.g. 6h idle) so abandoned sessions gc quickly while active\
        \ long interviews survive.\n\n### R-2 (High): Consistent, verified rehydration\
        \ instead of blind fallback\nThe rehydration in `requireAsking(:380-389)`\
        \ must not trust either store blindly:\n- **Compare-and-log divergence** before\
        \ re-writing: capture DB row values and emit a structured audit event whenever\
        \ `read()==null` triggers rehydration.\n- **Add a monotonic guard** (`version`/`updated_at`)\
        \ so DB can't roll Redis back; reject rehydration when DB `updated_at` < last-known\
        \ write.\n- Consider **marking the session `SUSPENDED`/requiring explicit\
        \ resume** when the gap is detected, instead of auto-continuing — forces a\
        \ deterministic, logged transition rather than silent auto-recovery.\n\n###\
        \ R-3 (High): Add expiry/eviction observability\nEmit a metric + structured\
        \ log on every silent-loss branch:\n```java\nif (json == null) {\n    statsRecorder.increment(\"\
        interview.session.redismiss\");\n    log.warn(\"session state missing in redis;\
        \ falling back to DB, sessionId={}\", sessionId);\n    return null;\n}\n```\n\
        Alert on aggregate `redismiss` rate exceeding baseline -> flags eviction storms,\
        \ persistence loss, or reset attacks.\n\n### R-4 (Medium): Hard synchronization\
        \ with Redis eviction & persistence\n- Use `volatile-lru`/`volatile-ttl` (not\
        \ `allkeys-*`) so only expirable keys are evicted; prefer **persistence on**\
        \ (AOF) for the state store.\n- Confirm eviction `maxmemory` is set high enough\
        \ that live interview keys are never pressure-evicted; stress-test under `memtier`/`redis-benchmark`.\n\
        \n### R-5 (Medium): Bound confidential-data lifetime on termination\nOn `FINISHED`/`DELETE`,\
        \ explicitly remove the key (`delete()` exists) and cancel lingering TTL:\
        \ the stale-key exposure window (§SEC-3) is closed by design, not by waiting\
        \ for the 24h TTL.\n\n---\n\n## 4. Risk summary for lead\n\n| ID | Severity\
        \ | Issue | Mitigation |\n|----|----------|-------|------------|\n| SEC-1\
        \ | High | State rollback/TOCTOU on silent expiry + DB rehydration | R-2 (version\
        \ guard), R-1 |\n| SEC-2 | High | No audit/alert on the break | R-3 |\n| SEC-3\
        \ | Medium | Stale confidential runtime data lingers up to 24h | R-5 |\n|\
        \ SEC-4 | Medium | Fallback masks Redis flush/compromise | R-2, R-3 |\n\n\
        **Bottom line:** continuation breaks not because the DB is wrong, but because\
        \ the runtime authority (Redis) is treated as optionally persistent while\
        \ being silently volatile on a *fixed* 24h TTL, and the recovery path (DB\
        \ rehydration) re-adopts stale state without verification or logging. Prioritize\
        \ sliding TTL + verified/logged rehydration (R-1, R-2, R-3) — they close both\
        \ the correctness and the security/audit gaps in one change set."
