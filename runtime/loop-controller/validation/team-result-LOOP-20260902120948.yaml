      output: "# Interview Session Continuation Failure due to Redis Fixed-TTL Expiry\n\
        \n## 1. Architecture Context\n\nThe interview system uses a two-layer state\
        \ model:\n\n- **Redis** = *runtime/session* state (transient): the \"you're\
        \ mid-session\" context — current question index, user identity→session mapping,\
        \ answer-in-progress, RAG `last_k` retrieved context, reranking fuse outputs,\
        \ token budgets, active stage navigator.\n- **Database (DB)** = *durable*\
        \ state: the \"truth\" — interview session record, questions answered, transcripts,\
        \ timestamps, the final interview result.\n\nThe TTL is **fixed** (e.g. `SETEX\
        \ session:{id} 900 ...` or `EXPIRE` applied once at creation), not **sliding**\
        \ (`EXPIRE` on every access).\n\n---\n\n## 2. When Continuation Breaks\n\n\
        Expiry is a **time-based** event, not a \"session done\" event. So it breaks\
        \ regardless of logical validity:\n\n| Condition | Outcome |\n|---|---|\n\
        | User idles > TTL (walked away, on another tab, call dropped) | Key evicted\
        \ while DB row still `in_progress` |\n| Interview is legitimately long (multi-section,\
        \ > TTL total) | Eventually expires even with continuous use — *fixed* TTL\
        \ does not refresh on activity |\n| TTL sized wrong (set for breadth, e.g.\
        \ token/health-check lifetime, not session lifetime) | Premature eviction\
        \ |\n| Restart/deploy of Redis nodes or eviction pressure (`maxmemory-policy=allkeys-lru/allkeys-lfu`)\
        \ | State dropped while DB survives |\n| Timezone/clock skew between app servers\
        \ and Redis | Early/late eviction relative to deceptive intent |\n\n**Key\
        \ point:** the DB remains valid because *its* lifetime is logical, not TTL-bound.\
        \ The two stores diverge the moment Redis alone rotates a key.\n\nHow a resume\
        \ query behaves on the miss:\n\n```\nGET session:{id}  →  (nil)   # Redis\
        \ miss\n```\n\n- If code does `if (!state) return { new: true }` → the user\
        \ is silently **dropped back to start** (worst case: duplicate/confused experience).\n\
        - If code treats missing state as a hard condition → **error** even though\
        \ all data is still present in the DB.\n- If code has **no reconciliation\
        \ path** → the resume simply fails; that's the \"silent\" break.\n\nThe reason\
        \ continuation breaks is **invariant mismatch**: you stored the only copy\
        \ of runtime continuation data in a store whose retention is a wall-clock\
        \ countdown, and you never wired Redis-miss → DB-rebuild.\n\n---\n\n## 3.\
        \ Why It Happens (Root Causes)\n\n1. **Fixed TTL misuse** – `SETEX`/`EXPIRE`\
        \ at write time measures lifetime since *creation*, not since *last access*.\
        \ A sliding TTL (`EXPIRE` on every touch) is often the intended semantics\
        \ for \"resume\" sessions.\n2. **Designing session == cache** – modelers treat\
        \ Redis as the session store with the DB as a backup, but runtime state (stage\
        \ pointer, in-flight composite answer, RAG context) is **not persisted** anywhere\
        \ except Redis.\n3. **No write-through of continuation-critical checkpoint**\
        \ – small, cheap state (e.g. `currentQuestionIndex`, `stage`) is not flushed\
        \ to DB each step, so there's nothing to rebuild from.\n4. **Miss-handling\
        \ is undefined** – there is no defined ``read sequence (Redis → miss → rebuild\
        \ → write-back→ resume)``.\n5. **TTL not derived from domain needs** – set\
        \ arbitrarily instead of `session_timeout_window` (conversation idle threshold).\n\
        \n---\n\n## 4. Fixes / Implementation Recommendations\n\n### A. Sliding TTL\
        \ (primary)\nRefresh TTL on every material access — this alone fixes most\
        \ idle-expiry cases.\n\n```python\ndef touch_session(r, session_id, ttl_sliding_secs=3600):\n\
        \    r.expire(f\"session:{session_id}\", ttl_sliding_secs)\n```\n\nSet a **renewal\
        \ gate** (e.g. `EXPIRE` only if > 30% elapsed) to avoid a write on every keystroke.\n\
        \n### B. Persist a minimal continuation checkpoint in the DB (write-through)\n\
        Flush only the cheap, rebuild-critical fields on each **stage transition**\
        \ (not per event):\n\n```sql\nUPDATE interview_session\n   SET stage = :stage,\
        \           -- enum: INTRO | QUESTION | RAG | RERANK | ANSWER | DONE\n   \
        \    current_question_idx = :idx,\n       updated_at = NOW()\n WHERE id =\
        \ :session_id AND updated_at < NOW() - INTERVAL 5 SECOND;  -- throttle\n```\n\
        \nNow the DB can reconstruct the RuntimeState.\n\n### C. Layered read-back\
        \ (the \"reconciliation\" path)\nThis is the critical change that turns a\
        \ failure into a resume.\n\n```python\ndef load_session(r, db, session_id,\
        \ user_id):\n    st = r.hgetall(f\"session:{session_id}\")\n    if st:   \
        \                                  # hot path\n        r.expire(f\"session:{session_id}\"\
        , SLIDING_TTL)\n        return st\n\n    row = db.fetch(\"SELECT * FROM interview_session\
        \ WHERE id=%s AND user_id=%s\", ...)\n    if not row or row[\"stage\"] ==\
        \ \"DONE\":\n        return None                            # genuinely gone\n\
        \    if row[\"user_id\"] != user_id:\n        raise Forbidden            \
        \            # not a resume of this user\n\n    st = rebuild_runtime_state(row)\
        \            # RAG ctx, idx, stage from DB + recompute\n    r.hset(f\"session:{session_id}\"\
        , mapping=st)\n    r.expire(f\"session:{session_id}\", SLIDING_TTL)\n    return\
        \ st                                  # seamless continuation\n```\n\n###\
        \ D. Idempotent resume guard\nBecause the DB row may still be `in_progress`,\
        \ protect against double-advance on replay:\n\n```python\nUPDATE interview_session\n\
        \   SET stage=:next, transitioned_at=NOW()\n WHERE id=:id AND stage=:expected_stage\
        \         # optimistic concurrency\n```\n\n### E. Operational guard\n- Redis\
        \ `maxmemory-policy`: use `noeviction` (fail loudly) rather than `allkeys-lfu`\
        \ which can silently drop session keys under pressure.\n- Monitor **session\
        \ expiry vs. completion** as an SLO/alert: `resumed_after_redis_expire` counter;\
        \ alert if reconciliation yield rate drops.\n\n### F. TTL sizing (if fixed\
        \ TTL is retained)\nSet TTL ≥ **maximum conceivable user pause** and derive\
        \ from idle-timeout config, not an arbitrary constant:\n\n```yaml\nsession:\n\
        \  idle_timeout: 45m      # sliding if possible\n  absolute_max: 24h     \
        \ # hard cap fallback\n```\n\n---\n\n## 5. Wrap-up\n\nContinuation breaks\
        \ **when a time-based eviction occurs between two requests** and **your read\
        \ path has no Redis-miss→DB-rebuild fallback**, because runtime continuation\
        \ data exists only in Redis while the DB row stays logically valid (`in_progress`).\
        \ It silently breaks when `if (miss) → treat as new/error` without a reconciliation\
        \ read.\n\nFix incorporates three layers:\n1. **Sliding TTL** so activity\
        \ keeps the session alive,\n2. **DB checkpoint** of stage/idx per transition\
        \ so a rebuild is possible,\n3. **Read-through reconciliation** (miss → rebuild\
