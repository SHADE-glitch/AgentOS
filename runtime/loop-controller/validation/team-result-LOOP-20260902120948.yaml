    output: "## Interview Session Continuation: Redis TTL vs DB Truth\n\nGrounded\
      \ in the actual implementation — `InterviewStateStore.java` (fixed `TTL_HOURS\
      \ = 24`, `InterviewStateStore.java:25,:51`) and `InterviewService.java` (the\
      \ `requireAsking` reconciliation, `InterviewService.java:380-399`).\n\n### The\
      \ core design tension\n\nThe runtime state machine is declared authoritative\
      \ **in Redis** (`InterviewStateStore.java:15`), while the **DB** holds durable\
      \ truth (session row + full message history) and only *mirrors* a subset (`status`,\
      \ `question_count`, `current_question_id`). Redis keys carry a **fixed 24h TTL**\
      \ refreshed on every write. That split is exactly why continuation can break:\
      \ the Redis copy silently evaporates, but the DB \"still looks fine.\"\n\n###\
      \ When it expires silently (triggers)\n\n- **Idle > TTL.** TTL is refreshed\
      \ only on `write()`. Critically, **an incoming answer does not write Redis**\
      \ — writes happen only at *question-advance* (`InterviewService.java:116`, `:188`,\
      \ `:263`) and *finish* (`:345`). So a session that posed Q1, then the user deliberates/returns\
      \ after 24h and submits their answer: the `interview:session:<id>` key has sat\
      \ untouched since Q1 was asked and has expired, even though the DB row is still\
      \ `ASKING` and all Q1/A1 messages are intact.\n- **Eviction / flush.** `maxmemory-policy`\
      \ LRU/allkeys eviction, `FLUSHDB`, or Redis restart *with AOF/RDB persistence\
      \ disabled* drops the key independent of any app decision.\n- **Failed write.**\
      \ `write()` rethrows (`InterviewStateStore.java:53-54`), but a transient Redis\
      \ blip mid-transaction means Redis never got the latest state while the DB did.\n\
      - Note: there is no `delete()` call from the service on finish (finish just\
      \ rewrites `FINISHED`), so finished keys linger until TTL — harmless but noisy.\n\
      \n### Why continuation breaks (failure modes)\n\nThe kill shot is subtle: `requireAsking()`\
      \ (`InterviewService.java:380`) has a **lazy reconstruction fallback** — when\
      \ `read()` returns null it rebuilds state from the DB row and re-writes it with\
      \ a fresh 24h TTL. That fallback masks the expiry *partially*, but it produces\
      \ three concrete breakdowns:\n\n1. **Approximate, stale reconstruction.** DB's\
      \ `status`/`question_count` are updated *only at question-advance* (`InterviewService.java:111-114`,\
      \ `:183-186`), never on answer receipt. After an expiry, the reconstruction\
      \ is therefore an *approximation* of the real conversational state, not the\
      \ state machine's actual state. It can reconstruct `ASKING` and hand the resumed\
      \ answer to a question the machine had already conceptually advanced past, or\
      \ rebuild a `currentQuestionId` that is null/stale (`InterviewService.java:387-388`)\
      \ and drive logic off it.\n\n2. **Counter drift / question skips on resume.**\
      \ The next-question count is computed from the *reconstructed counter*: `state.questionCount()\
      \ + 1` (`InterviewService.java:179`, `:254`) — not from the authoritative message\
      \ log. Since `askedQuestionIds` *is* derived from messages (`:141-144`) but\
      \ the count is not, a post-expiry reconstruction can produce a **question count\
      \ that no longer matches the question actually posed**, causing duplicate or\
      \ skipped questions in a resumed session.\n\n3. **Silent divergence between\
      \ \"view\" and \"act\".** The front-end continuation flow builds on `detail()`\
      \ (`InterviewService.java:291-299`), which reads **only the DB** and previews\
      \ `currentQuestionId` from the DB. Before expiry the state-store's authoritative\
      \ `currentQuestionId` may already differ from the DB's mirror (they're written\
      \ together but the DB is the lagging copy). On resume, the UI can show one question\
      \ while the state machine's reconstruction targets another — the user sees a\
      \ coherent transcript but the interaction is inconsistent.\n\n4. **The silence\
      \ itself is a failure.** `read()` returns a bland `null` (`:37-39`); nothing\
      \ logs \"session expired\" or surfaces it. The auto-reconstruction refreshes\
      \ a new 24h TTL **without ever telling the client or operator that the runtime\
      \ state was regenerated**, so the breakage is undetectable and unreproducible\
      \ — the worst kind for a debug.\n\n### Fixes / recommendations\n\n- **DB becomes\
      \ the sole durable authority; Redis = cache + lock.** Drop the \"Redis is the\
      \ single source\" claim. Reconstruct the state machine **always** from DB (idempotently)\
      \ and treat Redis purely as an acceleration layer; then TTL expiry can never\
      \ change behavior.\n- **Derive state from the message log, not mutable counters.**\
      \ Recompute `questionCount` and `currentQuestionId` from the last `kind=question,\
      \ role=AI` message (`InterviewService.java:326-338` already walks this list).\
      \ That makes reconstruction *exact*, eliminating drift (#1, #2) regardless of\
      \ expiry.\n- **Prefer a sliding TTL or per-state TTL over a fixed one:**\n \
      \ - Sliding: refresh 24h on every `read()` too (not just `write`), so only genuinely\
      \ idle sessions expire.\n  - Or only set TTL on *transient in-progress* keys\
      \ with a generous bound (e.g. 7d) and explicitly `delete()` on finish, removing\
      \ the arbitrary 24h cliff.\n- **Make expiry observable.** When `read()` returns\
      \ null for an active session, log + flag `\"resumed-after-expiry\"` on the session\
      \ instead of silently reconstructing (keeps the fallback for resilience but\
      \ makes it auditable).\n- **Keyspace notifications (`expired` events)** → a\
      \ reconciler that marks the session and reconciles from DB, so session lifecycle\
      \ doesn't depend on a lazy, race-prone path.\n- **Guard the resume under CAS/version.**\
      \ The reconstruction runs inside the Redisson lock (`InterviewService.java:126`),\
      \ but add a monotonic version/`updatedAt` and use compare-and-set on resume\
      \ so two overlapping resuming requests can't both double-advance the reconstructed\
      \ state.\n\n**Bottom line:** continuation breaks when a session crosses the\
      \ fixed TTL with no intervening write — the defining one being \"user thinks/pauses\
      \ >24h then answers,\" since answers don't refresh the key. It breaks because\
      \ the authoritative state machine lives only in volatile Redis while the DB\
      \ is a lagging mirror, and the current lazy fallback reconstructs an *approximation*\
      \ (stale status, drifting question counter, mismatched `currentQuestionId`)\
      \ silently, instead of treating the DB as the exact and authoritative source.\
      \ The durable fix is to make DB-derived state the authority and relegate Redis\
      \ to cache/locking with a sliding or per-state TTL."
