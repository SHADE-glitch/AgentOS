      output: "# Redis TTL vs. Database Validity for Interview Session Continuation\n\
        \n## Executive Summary\n\nSession \"continuation breaks\" because the system\
        \ has **two independent sources of truth** with **inconsistent expiry semantics**:\n\
        \n| Store | Lifecycle | Authority on \"is the session valid?\" |\n|-------|-----------|-------------------------------------|\n\
        | Redis | Ephemeral, TTL evicts on a fixed clock | *runtime* (current in-progress\
        \ state) |\n| DB | Persistent | *everlasting* (canonical record) |\n\nThe\
        \ DB says \"the interview exists and is in state `in_progress`.\" Redis says\
        \ \"I delete the transient runtime data after `N` seconds.\" When the app\
        \ trusts **DB state for authorization/continuation** but needs **Redis state\
        \ for the actual conversation** (accumulated context, current question, answer\
        \ buffer), the two diverge and continuation fails at read-back.\n\n---\n\n\
        ## 1. When Continuation Breaks\n\nContinuation breaks whenever a request path\
        \ reads the *ephemeral* state after Redis has evicted it but while the DB\
        \ still marks the record **active**. Concrete triggers:\n\n1. **Idle timeout\
        \ vs. fixed TTL drift** — User pauses > `TTL` seconds (lunch break, tab open,\
        \ network blip) and the fixed TTL elapses. The row in DB is still `status='in_progress'`,\
        \ but Redis keys are gone.\n2. **TTL not refreshed on activity** — If the\
        \ TTL is a fixed value set once at session start (no sliding expiry on each\
        \ request), every session has a hard stuffing at `start + TTL`, regardless\
        \ of active use. An actively-used long interview dies mid-question.\n3. **TTL\
        \ shorter than a long-form answer** — A question with rich context is generated\
        \ right at the expiry boundary; the prompt returns after eviction.\n4. **Multiple\
        \ replicas / sharded state** — One node refreshes TTL, the read goes to a\
        \ replica that already evicted its copy.\n5. **DB write succeeds, Redis write/refresh\
        \ fails silently** — The DB moved status to `completed`/`in_progress` but\
        \ the Redis `EXPIRE`/`SET` with TTL was never set or already torn down. DB\
        \ and Redis now disagree permanently.\n\n---\n\n## 2. Why Continuation Breaks\
        \ (Root Causes)\n\n### a) The fetch path is not idempotent to eviction\n```\n\
        GET /interview/:id/next   → Read Redis ctx_hash = {q: 5, context: [...], buf:\
        \ \"...\"}\n   Redis MISS\n   → fallback to DB row → status 'in_progress'\
        \ → try to continue\n   → but the accumulated flattened context / current\
        \ question is ONLY in Redis\n   → cannot rebuild mid-conversation state →\
        \ breaks\n```\nThe DB holds **identity + progression metadata** but not necessarily\
        \ the **full runtime conversational context** (token-heavy, so it's cached\
        \ in Redis, not persisted). Continuation requires the thing that got evicted.\n\
        \n### b) Fixed TTL ≠ domain-appropriate expiry\nA fixed `TTL` encodes a *batch-expiry\
        \ assumption* (\"anyone who stops for N sec loses the session\"). But most\
        \ interview UIs are **stateful interactive sessions**, not cache lines. Fixed\
        \ TTL is the wrong eviction policy for interactive state.\n\n### c) Redis\
        \ as source of truth when it should be the DB (or vice-versa)\nThe system\
        \ conflates:\n- **Redis** = *performance cache* (re-buildable, lossy OK)\n\
        - **DB** = *system of record* (durable, loss unacceptable)\n\nTreating Redis\
        \ as the source of truth for continuation is the architectural error. If the\
        \ DB is authoritative, the pipeline *must* be able to rebuild runtime state\
        \ from the DB (else Redis is not a cache, it's a co-primary — and two primaries\
        \ with different TTLs will always diverge).\n\n### d) Read-after-write within\
        \ the expiry window races\nA brief race: reactivation/reconnection writes\
        \ a new Redis entry with a **fresh TTL**, while DB still `in_progress`, but\
        \ the *continuation token* the client holds references the old key namespace.\
        \ Eviction of the old + creation of new isn't atomic → inconsistent pointer.\n\
        \n---\n\n## 3. Design Fixes (by responsibility)\n\n### Option A — Sliding\
        \ TTL + heartbeat (right fix for interactive sessions)\nRefresh on every activity\
        \ instead of fixed:\n```python\n# write\nr.setex(f\"interview:{id}:ctx\",\
        \ ttl=1800, value=serialize(ctx))  # 30 min idle\n# each request\nr.expire(f\"\
        interview:{id}:ctx\", 1800)  # slide on activity\n```\nIdle-based, so an actively\
        \ used session never dies; only true idle sessions expire. This is the correct\
        \ policy for interactive state — keep the fixed deadline tight but sliding.\n\
        \n### Option B — Make the DB authoritative and rebuild runtime state from\
        \ it\nPersist *checkpointed* conversation state in the DB so Redis is genuinely\
        \ a cache:\n```sql\nCREATE TABLE interview_state (\n  interview_id BIGINT\
        \ PRIMARY KEY,\n  status       VARCHAR(16) NOT NULL,          -- 'in_progress','completed','expired'\n\
        \  current_q    INT,\n  checkpoint   JSONB,                          -- flattened\
        \ context snapshot\n  updated_at   TIMESTAMPTZ\n);\n```\nOn Redis MISS, rebuild\
        \ context from `checkpoint` and resume. Eviction then only degrades performance,\
        \ never correctness. Combined with A.\n\n### Option C — Reconcile on MISS\
        \ with an atomic resume flow\nIf you must keep Redis as co-primary, make the\
        \ MISS path explicit and the DB write atomic with it:\n```typescript\n// Resume\
        \ flow when Redis MISS but DB says in_progress\nconst found = await redis.get(`interview:${id}:ctx`);\n\
        if (!found) {\n  const status = await db.getStatus(id);\n  if (status ===\
        \ 'in_progress') {\n    // deterministic: DB owns 'current_q', rebuild context\
        \ from checkpoint\n    const base = await db.getCheckpoint(id);\n    await\
        \ redis.setex(`interview:${id}:ctx`, TTL, serialize(base));\n    return base;\
        \ // continuation resumes deterministically\n  }\n  // else honor DB terminal\
        \ state\n  await redis.del(`interview:${id}:ctx`); // avoid stale resurrection\n\
        }\n```\nGuarantee: the DB **always decides validity**; Redis merely speeds\
        \ access. Never return \"expired\" from a Redis MISS alone — that is how a\
        \ valid, DB-`in_progress` session silently dies.\n\n### Option D — One fixed\
        \ TTL per state *class* (if rebuild is impossible)\nIf context is truly irreproducible\
        \ in Redis, don't fake continuation:\n- Set `DB.status='expired'` **transactionally**\
        \ when Redis is about to be evicted (via a lagging cleanup job) so the two\
        \ stores stay aligned.\n- Or push expiry check to the DB TTL (e.g., `expires_at`\
        \ column) and treat `now() > expires_at` as expired in both layers.\n\n---\n\
        \n## 4. Recommended Configuration (concrete)\n\n- **Policy:** sliding TTL\
        \ `expire` refresh on each authenticated/activity request (Option A) + DB\
        \ checkpoint column (Option B).\n- **MISS reconciliation:** read DB status\
        \ first; only honor eviction if DB also says terminal (Option C).\n- **Monitor:**\
        \ track `redis_no_ctx_db_inprogress` metric (the divergence event) to alert\
        \ when evictions originate while DB is active.\n- **DB:** never let Redis\
        \ TTL be the *only* expiry signal. If correctness demands a hard deadline,\
        \ store `expires_at` in DB and enforce in both stores.\n\n---\n\n## 5. Bottom\
        \ Line\n\n**When:** continuation breaks at `interaction_gap > fixed_TTL` while\
        \ the DB row is still `in_progress` — triggered by idle pauses, non-sliding\
        \ fixed TTLs, multi-node eviction skew, or failed/absent Redis refresh.\n\n\
        **Why:** Redis is a lossy, TTL-bounded cache that diverges from a persistent\
        \ DB that still considers the session alive; the continuation pipeline (correctly)\
        \ consults DB status but (incorrectly) needs evicted Redis context to proceed\
        \ — and a Redis MISS alone is treated as a definitive \"session invalid.\"\
        \n\n**Fix hierarchy:** make the **DB the sole authority on validity**, rebuild\
        \ runtime context from a DB checkpoint on MISS, and use **sliding** (not fixed)\
        \ TTL for interactive state.\n\n---\n\n*Note: I answered the architecture/database\
