      output: "# Code Review — Redis Fixed-TTL State vs. DB Continuation (interview\
        \ session)\n\n## Verdict\n**Medium severity / latent.** The read-path is *largely*\
        \ self-healing because `requireAsking()` falls back to MySQL, but the design's\
        \ implicit contract (\"Redis is the single authoritative source\") contradicts\
        \ reality, and there is one class of case where continuation genuinely breaks:\
        \ **state divergence without a reconciler, plus the complete absence of lifecycle/abandonment\
        \ semantics masked by the 24h TTL.** The TTL gives a false sense of \"the\
        \ session expires\" while the DB rows it is mirrored from live forever.\n\n\
        References: `InterviewStateStore.java:25,48-56` (fixed TTL, no read-refresh),\
        \ `InterviewService.requireAsking():380-399` (DB fallback), `InterviewService.answer():125-195`.\n\
        \n---\n\n## 1. How state actually flows\n\n- **Write path** — `InterviewStateStore.write()`\
        \ (line 48) does `bucket().set(json, 24, HOURS)` on every state transition.\
