      output: "## Analysis: Fixed-TTL Redis Interview State — When & Why Continuation\
        \ Breaks\n\n**Role:** Database Engineer (supporting security focus) · **Deliverable\
        \ for lead review**\n\nI grounded this against the live code (`InterviewStateStore.java`,\
        \ `InterviewService.java`, plus `interview_session` schema referenced in the\
        \ gold-set derivation).\n\n---\n\n### 1. Mechanics of the failure (grounded\
        \ in code)\n\n- `InterviewStateStore.write()` sets `interview:session:{id}`\
        \ with a **fixed 24h TTL** (`TTL_HOURS=24`, reset on every write — line 51).\
        \ So the TTL is actually a *sliding \"silence\" window*, not a session lifecycle\
        \ bound.\n- `read()` returns `null` on missing **or** corrupt JSON (lines\
        \ 37-45). Expiry/eviction is **silent** — nothing logs it.\n- `requireAsking()`\
        \ (`InterviewService.java:380-399`): on `read()==null` → DB fallback → `new\
        \ SessionState(...)` → **blind rehydrate + reset 24h TTL** (line 389). No\
        \ freshness, version, or parity check.\n- The session module comment declares\
        \ Redis the \"**单一权威来源**\" (single authoritative source) — an authority inversion\
        \ vs the durable DB.\n- `answer()`/`answerStream()` derive `newCount = state.questionCount()\
        \ + 1` from runtime state (lines 179, 254), and `requireAsking()` gates the\
        \ status transition (lines 391-397).\n- `schema.sql` `interview_session` has\
        \ **no `updated_at`** — the DB cannot convey staleness (only `started_at`/`finished_at`).\n\
        - Dual-write is **non-transactional** (DB `updateById` then Redis `set`, non-atomic,\
        \ no CAS) — G5 divergence window.\n\n---\n\n### 2. WHEN continuation breaks\n\
        \nA single \"two-precondition\" trigger; both must be true:\n\n1. **The Redis\
        \ key is silently gone** while the DB row still exists and is not `FINISHED`:\n\
        \   - ≥24h of inactivity mid-interview (interview spread across days), and/or\n\
        \   - Redis memory-eviction (`maxmemory-policy allkeys-*`), `FLUSHALL`/key\
        \ cleanup, or a standalone instance with persistence disabled that restarts\
        \ and loses the key.\n2. **DB state has diverged from what Redis had**, so\
        \ the rehydrated snapshot is stale. Because the write is `DB → Redis` sequentially\
        \ with no transaction (G5), and Redis is the live authority, the DB can lag\
        \ behind Redis's last increments (e.g., a crash between `updateById` and `stateStore.write`,\
        \ or a partial-degradation path). With no `updated_at` and no version, this\
        \ staleness is **undetectable** at fallback time.\n\nWhen both hold, `requireAsking()`\
        \ executes the blind rehydrate and continuation proceeds from a snapshot whose\
        \ age/parity is unknown.\n\n---\n\n### 3. WHY continuation breaks (mechanisms)\n\
        \n- **Silent authority swap → wrong counter.** The fallback rebuilds `SessionState(DB.status,\
        \ DB.questionCount, DB.currentQuestionId)`. If the DB counter lagged behind\
        \ Redis (the dual-write window), then `newCount = state.questionCount() +\
        \ 1` **regresses** below the true number of asked questions → the counter\
        \ and the durable `interview_message` log disagree; subsequent state transitions\
        \ are written on a wrong base.\n- **No freshness/status validation (G2).**\
        \ The code cannot distinguish the safe case (\"Redis missing, DB current and\
        \ authoritative → recoverable\") from the dangerous case (\"Redis expired,\
        \ DB stale → must reconcile, not continue\"). Since it can't tell, it accepts\
        \ an `answer` in a state it can't verify — including possibly a stale `FINISHED`/`START`\
        \ status, producing confusing `INTERVIEW_FINISHED` or `INTERVIEW_STATE_ERROR`\
        \ at the wrong time, or conversely continuing a session that should have ended\
        \ (integrity/security concern).\n- **Masked drift (G3).** The blind rehydrate\
        \ **re-caches for another 24h**, permanently hiding the anomaly. The next\
        \ expiry reproduces the same fragile path — the system never builds a correct\
        \ base.\n- **Dedup illusion.** `askedQuestionIds` and `shouldFinish` derive\
        \ from `interview_message` (DB truth), so question *dedup* still works — which\
        \ *masks* the drift in the counter. The symptom surfaces later as inconsistent\
        \ state transitions / wrong question count, not as an obvious exception.\n\
        \nNet: **TTL expiry per se is benign; it's the combination of expiry + DB/Redis\
        \ divergence + no parity validation that breaks continuation.**\n\n---\n\n\
        ### 4. Recommendation (chosen direction)\n\nPer the seed lesson vector: favor\
        \ **freshness validation + drift detection** over *extending the TTL* (extending\
        \ only postpones the failure and widens the stale window).\n\n**Decision framework**\n\
        \n- **Option A — Extend TTL / no validation.** Trivial, but only pushes the\
        \ hazard out; keeps silent drift. *Rejected.*\n- **Option B — Freshness/parity\
        \ validation on fallback + rebuild-from-truth.** Add a freshness signal (timestamp/version\
        \ + `updated_at` column), and on `read()==null`, **rebuild state from `interview_message`**\
        \ (count of `kind='question'` is DB truth, immune to counter drift) rather\
        \ than trusting a stored `questionCount`. Keep DB as source of truth; Redis\
        \ becomes a fast cache. *Recommended.*\n\n**Concrete implementation**\n\n\
        - Schema (add staleness signal to the authoritative row):\n```sql\nALTER TABLE\
        \ interview_session\n  ADD COLUMN updated_at DATETIME NULL DEFAULT NULL, \
        \  -- set on every state transition\n  ADD COLUMN state_version INT NOT NULL\
        \ DEFAULT 0;    -- optimistic concurrency / parity\n```\n- Store a timestamp\
        \ + version inside the Redis value by extending `SessionState`:\n```java\n\
