        \ SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId());\n\
        \        stateStore.write(sessionId, state); // now safe to reset TTL\n  \
        \  }\n    ...\n}\n```\n\n3. **Return-by-value checks** — treat Redis as **cache**,\
        \ not authority: on every read, confirm `state.questionCount() >=` count of\
        \ saved `question` messages for the session (message `selectList` already\
        \ available at lines 135/210) and that `current_question_id` still matches,\
        \ before trusting `requireAsking`.\n\n4. **Distinguish the three `null` causes.**\
        \ Never collapse \"expired\" and \"corrupt\" into `null`. Option A: `read()`\
        \ returns an enum/`Optional` distinguishing `MISSING` vs `CORRUPT`. Minimum\
        \ viable change: log + count each path so expiry vs corruption is observable.\n\
        \n5. **Sliding TTL is optional, but not the fix.** Extending/refreshing TTL\
        \ (e.g. per-request `expire` touch) only delays authoritativeness loss — it\
        \ does not fix divergence. Use it only as latency optimization **under** a\
        \ DB-backed truth check, never in place of it.\n\n### Validation matrix\n\n\
        | Scenario | Expected | Currently |\n|---|---|---|\n| Cache expires, DB `ASKING`,\
        \ parity intact | continue normally, log expiry | continues (silently) |\n\
        | Cache expires, DB `FINISHED` | reject `INTERVIEW_FINISHED`, do **not** rehydrate\
        \ | rehydrates FINISHED then throws at 391 (equivalent outcome, but without\
        \ explicit early guard) |\n| Cache corrupt JSON | fail observable, rebuild\
        \ from DB | `null` → blind rehydrate (masked) |\n| DB advanced past Redis\
        \ (divergence) | detect via `updated_at`/parity, refuse/repair | silent rehydrate\
        \ + TTL reset (masked) |\n| Crash between DB-write and Redis-write | next\
        \ read detects mismatch | divergence persists until expiry |\n\n### Risks\
        \ of my recommendation\n- False-reject risk: strict parity may reject sessions\
        \ that are *provably* fine but counter-derive differently. Mitigate: parity\
        \ on `status` + `current_question_id` first; treat `questionCount` mismatch\
        \ as a warning to repair (recompute from messages) rather than hard-fail.\n\
        - Adds a message-count query on every answer — already free (the query exists\
        \ at lines 135/210); no new cost.\n\nFor the lead: the core ask is to **stop\
        \ trusting Redis as authority and start validating Redis against DB before\
        \ every continuation**. The DB is the only correct source of truth; Redis\
        \ should be rebuilt from it and treated as an accelerator, with the TTL reduced\
        \ to a memory-guard rather than a session-life boundary."
