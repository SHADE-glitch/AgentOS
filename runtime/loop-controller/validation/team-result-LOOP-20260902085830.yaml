        \ = state.questionCount() + 1` (line 179) re-derived from DB `questionCount`\
        \ that may be lower than the number of actually-saved `question` messages\
        \ → count skew, and `evaluationService.shouldFinish` counts QAs from *messages*,\
        \ not from `questionCount` (line 148), so the two mechanisms diverge.\n- **Re-answering\
        \ a finished or wrong-stage session.** If Redis expired while the DB was already\
        \ `FINISHED` (e.g. `finishSession` wrote DB but its Redis write at line 345\
        \ raced/got evicted, or a RabbitMQ/Crash left DB finished), the fallback rehydrates\
        \ `FINISHED` — that case is caught at 391. But a partial write where only\
        \ DB advanced past `ASKING` to a transitional stage yields a re-hydrated `ASKING`\
        \ that silently allows an answer to be appended to an already-completing session\
        \ → **double-scoring / double-finish** risk.\n- **Non-transactional dual-write\
        \ divergence (G5).** DB `updateById` then Redis `set` are not atomic. A crash\
        \ between them leaves Redis older than DB. TTL expiry simply makes this latent\
        \ divergence *visible*.\n\n### Ranked gold issues (for lead consolidation)\n\
        \n- **G1 — Authority inversion:** a TTL'd, evictable, non-transactionally-written\
        \ cache is the runtime authority; DB (the true durable source) is only a fallback.\n\
        - **G2 — No freshness validation before use:** after expiry/fallback, no check\
        \ ties the rehydrated state to DB truth (status, counters, message parity,\
        \ `updated_at`).\n- **G3 — Fallback masks drift:** blind rehydrate + TTL reset\
