      output: "I've reviewed the actual implementation to ground the analysis. The\
        \ bug lives in `InterviewStateStore.java` and how `InterviewService` treats\
        \ it as the authoritative state source. Here's my structured contribution\
        \ for lead review.\n\n---\n\n# Database Engineer Contribution — Redis Session\
        \ TTL vs. Durable DB Continuation Break\n\n## 1. Root cause located in code\n\
        \n**`InterviewStateStore.java:25,51`** — fixed absolute TTL:\n```java\nprivate\
        \ static final long TTL_HOURS = 24;\n...\nredissonClient.getBucket(key(sessionId)).set(json,\
        \ TTL_HOURS, TimeUnit.HOURS);\n```\n\nThe class doc (`InterviewStateStore.java:14-16`)\
        \ declares Redis the *single authoritative source* (\"单一权威来源\") for the state\
        \ machine, yet that source is given a 24h lifetime that resets **only on write**.\
        \ The DB (`interview_session`, `interview_message`) is durable.\n\n**`InterviewService.java:380-399`\
        \ (`requireAsking`)** — the only recovery path:\n```java\nInterviewStateStore.SessionState\
        \ state = stateStore.read(sessionId);\nif (state == null) {              \
        \      // expired / evicted / flushed\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
        \    ...\n    state = new SessionState(s.getStatus(), s.getQuestionCount(),\
        \ s.getCurrentQuestionId());\n    stateStore.write(sessionId, state); // resurrect\
        \ with a fresh 24h TTL\n}\n```\n\nThis tells us two things plainly:\n- The\
        \ design has **two sources of truth** (volatile Redis mirror + durable DB\
        \ aggregate), with Redis standing in front.\n- There *is* a self-heal branch\
        \ — so continuation does **not** break 100% of the time. It breaks under specific,\
        \ identifiable conditions. That is exactly the \"when and why\" the lead needs.\n\
        \n---\n\n## 2. When continuation breaks\n\n### 2a. Redis eviction / restart\
        \ / flush (not just the TTL)\nThe key silently disappears if: Redis restarts,\
        \ `FLUSHDB`/`FLUSHALL` is run, **`maxmemory` LRU/LFU eviction picks this key**,\
        \ or the 24h TTL lapses. None of these produce an alert in the app — the DB\
        \ row still says `ASKING` with `questionCount=3`. This is the \"silent expiry\
        \ while the DB remains valid\" headline case.\n\n### 2b. Recovery is path-dependent\
        \ → read-only paths are unguarded\nThe self-heal in `requireAsking` runs **only**\
        \ on `answer()`/`answerStream()`. Any other consumer of session state, or\
        \ a user interaction that reaches only a read path, sees an authoritative\
        \ store that is now empty. The fallback is not centralized, so it is inconsistent\
        \ by construction.\n\n### 2c. Breakage when TTL < logical session lifetime\n\
        Each `write()` re-arms a fresh 24h, so the window is *sliding per write*,\
        \ not *from creation*. But any **natural pause > 24h between two writes**\
        \ (a long interview break, an async/offline step, an SSE client reconnecting\
        \ after hours) still drops the state. A *true* sliding TTL would also refresh\
        \ on read/activity; this one does not.\n\n### 2d. Divergence / crash-window\
        \ — the *worst* break, masked by the fallback\nOrder of writes is DB-first\
        \ then Redis (`updateById` at `:186`, `stateStore.write` at `:188`). Two separate\
        \ stores, no transaction. Crash or error between the two commits the pair.\
        \ On restart the `requireAsking` fallback **resurrects the stale DB aggregate\
        \ and re-promotes it to authority** with a new 24h TTL. If the Redis write\
        \ was the one that succeeded and the DB update rolled back, the resurrected\
        \ state is **older than the real progress** (e.g. `questionCount` rolled back\
        \ to 2 when the user was on Q3) → `state.questionCount()+1` (`:179`) emits\
        \ a duplicate question and corrupts the Q&A pairing in `extractQAPairs` (`:325`).\n\
        \n### 2e. Stale DB terminal-state resurrection\nIf Redis expired and the DB\
        \ `status` is `FINISHED`, the fallback at `:391-393` correctly throws. But\
        \ if the DB aggregate is momentarily stale, or a `write()` of `FINISHED` to\
        \ Redis never landed while the DB did, rehydration can restart an already-completed\
        \ interview after a router/restart.\n\n---\n\n## 3. Why it breaks (root-cause\
        \ framing for the review)\n\n1. **Authority vs. durability contradiction.**\
        \ You cannot label Redis \"single source of truth\" and give it a bounded\
        \ lifetime. When the store is empty, the system *falsely believes* there is\
        \ no session, while every durable artifact (session row, messages) says otherwise.\n\
        2. **Fixed-TTL semantics.** TTL is re-armed per write, not per activity; no\
        \ read-based refresh (`EXPIRE` on `GET`), no coordinated expiry with the DB\
        \ transaction. The expiry clock is thus decoupled from actual user activity.\n\
        3. **Recovery is incidental, not designed.** The `requireAsking` fallback\
        \ conflates \"no state\" (genuinely new) with \"state expired\" (in-progress),\
        \ and resurrects a **coarse aggregate** (`status`, `questionCount`, `currentQuestionId`)\
        \ from a table that does not hold the full conversational progress — the message\
        \ table does.\n4. **Non-atomic dual write.** Redis and DB updates are not\
        \ atomic, so either store can hold a newer truth; whichever is used for rehydration\
        \ wins incorrectly.\n\n---\n\n## 4. Fix recommendations (with code/config)\n\
        \n### R1. disting thirds: make DB the single durable truth, demote Redis to\
        \ accelerator\nDeclare DB authoritative. Redis becomes a fast-path cache with\
        \ an explicit, documented rehydration contract. This removes the core contradiction.\n\
        \n### R2. Centralize recovery (fix the path-dependence now)\nReplace the inline\
        \ fallback in `requireAsking` with a single rebuild method used by every read:\n\
        \n```java\npublic SessionState readOrRebuild(Long sessionId) {\n    SessionState\
        \ cached = read(sessionId);\n    if (cached != null) return cached;\n    InterviewSession\
        \ s = sessionMapper.selectById(sessionId);\n    if (s == null) throw new BizException(ResultCode.INTERVIEW_NOT_FOUND);\n\
        \    // build from message rows, not the coarse aggregate, for fidelity\n\
        \    Long curId = messageMapper.selectLastQuestionId(sessionId);\n    int\
        \ count = messageMapper.countQuestions(sessionId);\n    SessionState rebuilt\
        \ = new SessionState(s.getStatus(), count, curId);\n    write(sessionId, rebuilt);\n\
        \    return rebuilt;\n}\n```\n\n### R3. True activity-sliding TTL (refreshed\
        \ on read), aligned with natural break length\n```java\n// InterviewStateStore\n\
        public SessionState read(Long sessionId) {\n    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\n\
        \    String json = bucket.getAndExpire(Duration.ofHours(24)); // refresh on\
        \ every read\n    ...\n}\n```\nPrefer `getAndExpire`/`EXPIRE` so ongoing activity\
        \ keeps the key alive even when the user reads without writing. Tune `TTL_HOURS`\
        \ to the *maximum unattended gap* you want to honor, not a policy constant.\n\
        \n### R4. Make the dual write atomic (publish vertex → commit DB → write Redis)\n\
        Commit the DB row first, then write Redis, and make the Redis write an **append-only\
        \ log / event** (`XADD interview:events`) rather than an overwrite, so crash-window\
        \ divergence can be reconciled from the log instead of resurrecting the stale\
        \ aggregate.\n\n### R5. Close eviction's silent hole\n- Set `maxmemory-policy\
        \ noeviction` for the state keyspace (or a dedicated `noeviction` DB / logical\
        \ partition for `interview:*`).\n- Add `keyspace notifications` on `expired`/`evicted`\
        \ on `interview:session:*` → a **rehydration consumer** that rebuilds the\
        \ key from DB on expiry, so the authoritative store self-heals in the background\
        \ rather than on the next request.\n- Alert on `miss`-rate spikes for `interview:session:*`\
        \ (rehydration counter is a canary for eviction pressure).\n\n### R6. Guard\
        \ rehydration when DB is stale\nIn the rebuild path, treat `count`/`status`\
        \ from DB as *candidate* state and verify continuity against `interview_message`\
        \ (last question, unanswered count). Never resurrect `FINISHED` unless `interview_result`\
        \ exists (`:150` path) and the message log confirms termination.\n\n---\n\n\
        ## 5. Minimal-risk threshold for this codebase\n\nIf the team wants the smallest\
        \ safe fix for this sprint rather than a redesign:\n\n1. Switch to **read-refreshed\
        \ sliding TTL** (R3) — removes the >24h-pause failure.\n2. Centralize rebuild\
        \ (R2) so *all* consumers, including `detail`/dashboard reads, go through\
        \ one guarded recovery.\n3. Move **Redis write after the DB commit** and treat\
        \ Redis as non-authoritative (R1 semantics) — this removes the \"rollback\
        \ resurrects stale state\" corruption.\n\nSteps for the test plan (links to\
        \ the existing benchmark specs): assert a session with `questionCount=N`,\
        \ expire the key manually, then verify a) `answer` rebuilds and continues\
        \ with question `N+1` (no duplicate), b) rehydration is idempotent and read-only\
        \ consumers see the same `currentQuestionId`, c) `FINISHED` never re-enters\
        \ `ASKING` after a flush.\n\n---\n\nWant me to also write a focused regression\
        \ test bench that simulates the `questionCount`/duplicate-question corruption\
        \ from 2d, or draft the Redis config (`maxmemory-policy`, keyspace notifications)\
        \ blocks for `docker-compose.yml`?"
