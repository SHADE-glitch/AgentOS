        \ `null` and triggers the same blind-DB-fallback, so it is indistinguishable\
        \ from expiry — the code cannot distinguish \"never existed\" from \"expired\"\
        \ from \"corrupt\", all of which need different handling.\n\n### Why continuation\
        \ breaks (the mechanism)\n\nThe `requireAsking()` fallback (line 380) is **not\
