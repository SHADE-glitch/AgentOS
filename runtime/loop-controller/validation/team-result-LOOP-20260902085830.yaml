        \ `requireAsking` 一个读口且有重建兜底，所以以「惰性重建」掩盖了问题。\n\n## 3. 续接为什么「看似正常实则脆弱」（真正的设计缺陷）\n\
        \n`InterviewService.requireAsking()` (`InterviewService.java:380-389`) 是对过期键的**自我修复**：\n\
        \n```java\nInterviewStateStore.SessionState state = stateStore.read(sessionId);\n\
        if (state == null) {          // ← 空 = 从未写入 + 过期 + 逐出，三种情况被混为一谈\n    InterviewSession\
        \ s = sessionMapper.selectById(sessionId);\n    state = new SessionState(s.getStatus(),\
        \ s.getQuestionCount(), s.getCurrentQuestionId());\n    stateStore.write(sessionId,\
        \ state);   // 惰性重灌\n}\n```\n\n由此暴露以下 DB 工程问题：\n\n1. **权威来源被倒置**：`InterviewStateStore.java:15`\
        \ 注释声称 Redis 是「单一权威来源」，但代码实际靠 DB 重建。若团队按注释行事（新增 `GET /session/{id}/state`、会话列表「可继续」标记、通知、SSE\
        \ 断线恢复等任何直接读 Redis 判断的路径），就会把「键不存在」误判为「会话不可续」而真断裂。**注释与实现矛盾 = 定时炸弹。**\n2.\
        \ **固定 TTL ≠ 会话有效性**：DB 是永久真源，Redis 是易失快照。用 Redis 生命周期代表业务生命周期（\"24h 内未答就作废\"\
        这类需求）会与 DB 永久保留的行互相矛盾——被悬置状态永远躺着，无 GC 清理。\n3. **重建依赖 DB 恰好一致**：若某次写过程中 DB\
        \ 与 Redis 只成功了一半（当前顺序为 `updateById` 先、`stateStore.write` 后，Redis 失败会被 `write()`\
        \ 捕获并抛 `INTERNAL_ERROR`），重建时以 DB 为准，反而掩盖了数据漂移，长期积累不一致且无人察觉。\n\n## 4. 配置与代码建议\n\
        \n优先采用（DB 为唯一真源，Redis 仅作缓存/锁）：\n\n1. **权威状态放 DB**：已有 `InterviewSession(status,\
        \ questionCount, currentQuestionId)`，把「可续接/已结束」判断完全落在 DB 状态上（`FINISHED` 显式标记），不要用\
        \ Redis 键存在性做判定。\n2. **滑动续期或免删**：若 Redis 必须保留，改用读时刷新（`EXPIRE`/`Redisson RBucket.expire()`\
        \ 于每次 read 后），或用 Redisson 的 `RLiveObject` 语义；不要固定 24h 写时续期。\n3. **补充 DB 活动时间戳**：加\
        \ `last_activity_at`，续接窗口由 DB 时间戳决定，而非依赖易失 TTL。\n4. **消除歧义**：`read()` 返回 `null`\
        \ 时区分「缓存未命中」与「业务上已结束」——业务结束时 DB 置 `FINISHED`，从不在 Redis 侧删除作为结束信号。\n5. **后台清理**：用\
        \ DB `last_activity_at < now()-window AND status='ASKING'` 的 Job 标记「已弃用」，替代依赖\
        \ TTL 自动过期，避免无限堆积。\n\n---\n**结论**：当前实码因 `requireAsking` 的 DB 惰性重建而「碰巧」在 answer\
        \ 路径自愈，真正的断裂点是【把 Redis 键存在性当续接闸门】且【注释承诺 Redis 为单一权威】这两处设计倒置；只要新增任一信任 Redis\
        \ 存在的读路径或改注释为误，固定 24h 静默过期就会把仍在 DB 中有效的进行中会话判为不可续。修复方向是把状态真源移交 DB，Redis 降级为可随意重建的缓存。"
