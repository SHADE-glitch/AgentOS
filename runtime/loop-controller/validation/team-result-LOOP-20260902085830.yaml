        \ over G1/G5 — per lesson vector L: *prioritize freshness validation + drift\
        \ detection over TTL extension; verify DB parity before accepting fallback.*\n\
        \n### Recommended fixes (DB engineer view)\n\n1. **Add `updated_at` to `interview_session`**\
        \ (`schema.sql:46`):\n```sql\nALTER TABLE interview_session ADD COLUMN updated_at\
        \ DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP;\n\
