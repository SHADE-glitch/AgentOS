        \ durable. Two authorities with different lifetimes.\n- **Success criterion:**\
        \ State clearly when continuation actually breaks, why the current code mostly\
        \ survives by accident, and what to change so the fix is not fragile.\n\n\
        ## 问题判断 / Diagnosis\n\n### 1. Root cause: dual-authority with different lifetimes\n\
        Both Redis and DB persist the same triple `(status, questionCount, currentQuestionId)`.\n\
        - Redis: written on every transition, expires 24h from the **last write**.\n\
        - DB: written on every transition, **never expires**.\n\nThe TTL is a *lease/cache*\
        \ expiry, not a *data* expiry. The DB is the de-facto source of truth; Redis\
        \ is a write-through mirror. The class comment calling Redis \"单一权威来源\" is\
        \ therefore wrong and is the seed of the bug: **any future code that reads\
        \ Redis without a DB-fallback will silently treat a resumable session as gone.**\n\
        \n### 2. Continuation is protected — but only by one path\n`InterviewService.requireAsking()`\
        \ (`InterviewService.java:380-399`) self-heals on a Redis miss:\n```java\n\
        state = stateStore.read(sessionId);\nif (state == null) {\n    InterviewSession\
        \ s = sessionMapper.selectById(sessionId);\n    state = new SessionState(s.getStatus(),\
        \ s.getQuestionCount(), s.getCurrentQuestionId());\n    stateStore.write(sessionId,\
        \ state);   // re-seed\n}\n```\nBecause `answer()`/`answerStream()` gate through\
        \ `requireAsking()`, a pure TTL expiry on an **idle** session does **not**\
        \ hard-break continuation — it silently rehydrates from the DB. So the headline\
        \ \"expiry breaks continuation\" is only true **where the fallback does not\
        \ exist or fails**.\n\n### 3. When continuation genuinely breaks / silently\
        \ diverges\n\n**Break case A — Redis is evicted/reset, not just TTL-and-then-they-come-back.**\
        \ TTL is only one eviction trigger. A deploy restart, `FLUSHDB`, `maxmemory`\
        \ eviction (`allkeys-*` policy), or cluster failover removes *all* state at\
        \ once. Every ASKING session now depends on the DB-fallback to resume. It\
        \ survives only because `requireAsking` knows the fallback. Without it (any\
        \ read that calls `stateStore.read()` directly, e.g. a future \"resume badge\"\
        \ / SSE resume / stats endpoint), continuation of that session reports \"\
        not found.\"\n\n**Break case B — stale Redis ≠ expired Redis (the truly silent\
        \ one).** The dangerous state is not \"key gone\" (that self-heals) but **\"\
        key present but staler than the DB.\"** Ordering in `answer()` is DB-first,\
        \ Redis-second (`InterviewService.java:186` DB update, `:188` Redis write).\
        \ If the Redis write fails or the process dies in between, the DB is advanced\
        \ (e.g. `questionCount=3`, ASKING) while Redis still holds `questionCount=2`.\
        \ TTL keeps ticking and the key is *valid*, so `requireAsking` sees it as\
        \ truth and never fell-back:\n- `newCount = state.questionCount() + 1` computes\
        \ `3`, but DB is already `3` → next transition over-writes correct DB count\
        \ with the same value, desyncing counts vs `askedQuestionIds`.\n- Because\
        \ `shouldFinish()` is derived from `messageMapper` rows (the durable message\
        \ log), the finish decision stays correct, but `questionCount` becomes a **second,\
        \ divergent authority** for the same fact.\n\n**Break case C — guaranteed\
        \ cache-miss on every resume after >24h idle.** This is survivable but it\
        \ means: a session paused at Q3, resumed >24h later, always pays a full DB\
        \ round-trip + re-seed, and *silently* serves whatever the DB currently holds\
        \ — which may not match what the last Redis writer intended (ties to case\
        \ B). Not a hard fail, but the \"24h\" number is misleading: it buys nothing\
        \ more than an idle window, and users with real pauses cross it consistently.\n\
        \n**Break case D — Redis written before the DB in `create()`** (`InterviewService.java:91`\
        \ seeds START/0 before the DB row reaches ASKING/1 at `:114`): if the process\
        \ crashes between the Redis seed and the DB update, Redis holds START q=0\
        \ while DB is pristine ASKING. On resume within 24h, `requireAsking` trusts\
        \ Redis and the candidate worker thinks the session is at Q0.\n\n## 方案设计 /\
        \ Options\n\n## Option A — DB is the single source of truth; Redis is a rebuild-on-miss\
        \ cache only\n- Remove the \"authoritative\" claim; treat every Redis value\
        \ as optional denormalization.\n- Centralize the existing `requireAsking`\
        \ fallback into a single `readState()` used by **every** path (answer, streaming,\
        \ resume, badges). No code may call `stateStore.read()` naked.\n- On every\
        \ resume, reconcile from DB `updated_at`: if DB newer than Redis, discard\
        \ Redis.\n- Strengths: minimal diff, eliminates silent stale-reads (B/D),\
        \ survives restarts/eviction by design.\n- Weaknesses: every cold path (or\
        \ after eviction) is a DB read — acceptable for steady-state interview traffic;\
        \ still need to standardize the fallback so it can't be forgotten.\n- Best\
        \ for: correctness-first, moderate-contention interview service.\n\n## Option\
        \ B — Sliding/adaptive TTL (touch-on-read) tied to DB lifetime\n- Keep Redis\
        \ as fast-path but make TTL *mean* \"idle timeout,\" not an opaque 24h constant:\n\
        \  - Refresh TTL on **every hit** of an active session (`expire` on read),\
        \ so a live session never expires mid-flight; only genuinely idle sessions\
        \ evict.\n  - Size TTL from the DB's business validity (max pause allowed)\
        \ rather than a magic constant; add `phaseValue`/`expires` computed from DB\
        \ so a stale short TTL can't kill a long-running session.\n- Strengths: prevents\
        \ break-case A/C on hot sessions, aligns TTL with intent.\n- Weaknesses: touch-on-read\
        \ adds a `EXPIRE` call per read (minor); read-heavy bursts can pin otherwise-dead\
        \ sessions; does not fix B/D alone.\n\n## Option C (discarded) — busy-write\
        \ only, keep fixed TTL\n- Keep current logic. Rejected: leaves the silent\
        \ stale-read window (B/D) and the false authoritative claim unresolved.\n\n\
        ## Decision\n- **Recommended:** **Option A** as the primary fix, with **Option\
        \ B's touch-and-reconcile** layered on as a tightening.\n- **Why:** the fastest,\
        \ correct change is to stop pretending Redis is authoritative. Continuation\
        \ correctness then never depends on TTL/eviction timing. The existing `requireAsking()`\
        \ logic is already 90% of Option A — extract and route everything through\
        \ it, and add the `updated_at` reconciliation guard.\n- **Risks/mitigations:**\n\
        \  - *Forgotten naked reads* → ban via a single `readState()` facade + code\
        \ review/CI grep for `stateStore.read(`.\n  - *Redis-as-authority elsewhere*\
        \ (dashboard evict already reads DB — good) → audit all `InterviewStateStore`\
        \ call sites.\n  - *Reconciliation clock skew* → compare against DB `updated_at`\
        \ timestamps from the same app clock; add a small skew margin (default compare\
        \ `updated_at >= redisLastWrite`, or simply always prefer DB since it's the\
        \ authority).\n\n## 实施方案 / Implementation Guidance\n\n### 1. Single authoritative\
        \ reader (Option A core)\nReplace direct `stateStore.read()` usage with a\
        \ facade that treats Redis as cache and DB as truth, prefer DB on staleness/absence:\n\
        ```java\npublic SessionState readState(Long sessionId) {\n    var redis =\
        \ stateStore.read(sessionId);\n    InterviewSession s = sessionMapper.selectById(sessionId);\n\
        \    if (s == null) return null;                       // truly absent\n \
        \   var db = new SessionState(s.getStatus(), s.getQuestionCount(), s.getCurrentQuestionId());\n\
        \    if (redis == null || db.updatedAfter(redis)) {    // miss, or DB is newer\n\
        \        stateStore.write(sessionId, db);              // re-seed + reset\
        \ TTL\n        return db;\n    }\n    return redis;\n}\n```\n`requireAsking()`\
        \ then calls this and keeps its status gating.\n\n### 2. Harden the write\
        \ path (fix B/D: DB-first & atomic-ish)\n- Make the Redis mirror a **best-effort\
        \ write after the DB commit** (`answer`/`create`/`finishSession`), and on\
        \ Redis failure **do not** treat it as fatal — log and continue, because the\
        \ next `readState` reconciles from DB anyway. This removes the \"DB committed,\
        \ Redis stale & unbroken\" wedge.\n- In `create()`, order writes so the seeded\
        \ Redis value matches the final DB state (currently Redis is seeded before\
        \ the DB reaches ASKING — reorder or just drop the early seed).\n\n### 3.\
        \ Redis configuration for TTL intent (Option B tightening)\n```yaml\n# touch-on-read\
        \ so an active session never slips between TTL and use\n# (do in code: readSession(...);\
        \ if active then bucket.expire(configuredTtl) )\nspring.data.redis.maxmemory-policy:\
        \ allkeys-lru   # choose lru vs lfu deliberately\n```\n- Prefer **LRU/LFU**\
        \ so eviction prefers idle sessions; never rely on TTL alone as the fleet-wide\
        \ eviction mechanism (break case A).\n- Keep the distributed lock on the separate\
        \ `interview:lock:{id}` key with its own watchdog TTL, independent of the\
        \ state TTL, so lock/state lifetimes never couple.\n\n## 验证方式 / Validation\n\
        - **Unit:** stub `stateStore.read()` = null → assert `readState()` returns\
        \ DB state and re-seeds; stub DB `updated_at` newer than Redis → assert DB\
        \ wins (B); Redis present & equal → assert no DB read on hot path.\n- **Integration\
        \ (Redis up):** create session → advance to Q3 → `flushdb` → resume → assert\
        \ continuation intact (A), assert only DB read occurs (A/C).\n- **TTL test:**\
        \ set TTL_HOURS=0/1 (test override), advance to Q3, wait past TTL, resume\
        \ → assert self-heal from DB, assert no FINISHED/error (C).\n- **Failure-injection:**\
        \ make `stateStore.write` throw in `answer()` after DB update → assert DB\
        \ stays correct, next `answer` reconciles, no duplicate question (B).\n- **Expected:**\
        \ all continuation scenarios survive TTL/eviction; only genuinely absent sessions\
        \ (no DB row) or FINISHED sessions reject; a monitoring counter on \"redis\
        \ miss → DB fallback\" should be **non-zero but bounded** and not grow unboundedly\
        \ across active sessions.\n- **复盘 / Follow-up:** consider a lightweight active-session\
        \ heartbeat if resume-after-idle latency at Redis scale matters; audit all\
        \ `stateStore.read(` call sites to ensure the facade is the only entry point;\
        \ revisit `TTL_HOURS` as a config, not a constant, once TTL means \"idle budget\"\
        \ rather than \"lease.\"\n\n## Bottom line\nThe ironic truth: **today continuation\
        \ mostly works by accident** because `requireAsking()` resurrects state from\
        \ the DB. The expiry becomes a hard break only when confidence in Redis outlives\
        \ its content (stale-unexpired state, non-fallback readers, or Redis reset).\
        \ Make **DB the sole authority, Redis the best-effort rebuild-on-miss cache**\
        \ via one `readState()` facade + `updated_at` reconciliation, and the fixed\
        \ TTL stops being a correctness hazard and becomes the intended \"idle budget\"\
        \ it was meant to be."
