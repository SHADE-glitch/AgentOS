      output: "## Code Review: Interview session runtime state in Redis with fixed\
        \ TTL\n\n### Executive diagnosis\n\nThe interview continuation flow is a **reads-from-one-store,\
        \ writes-to-two-stores** design where the two stores are only weakly consistent.\
        \ Redis (`InterviewStateStore`) is annotated as the \"单一权威来源\" (single authoritative\
        \ source) but holds the *runtime* state of a state machine, while MySQL holds\
        \ the durable projection. A fixed 24h TTL is applied to a key that **expires\
        \ purely based on wall-clock silence**, not on business validity. The result:\
        \ the Redis projection silently disappears while the MySQL row is still `ASKING`,\
        \ and the fallback path re-hydrates stale DB state without any freshness check.\
        \ Continuation *appears* to work, but is logically wrong — and worse, it **masks**\
        \ rather than detects the drift.\n\n### Grounding (evidence from code)\n\n\
        - `InterviewStateStore.java:25` — `TTL_HOURS = 24`, fixed.\n- `InterviewStateStore.java:51`\
        \ — TTL reset to 24h on **every** `write()`. So expiry ≠ \"no activity in\
        \ 24h\" at creation; it means \"no state write for 24h\".\n- `InterviewStateStore.java:37-45`\
        \ — `read()` returns `null` on missing key **and** on JSON parse failure (swallowed\
        \ at 43-44). Two distinct failure modes collapse into the same `null`.\n-\
        \ `InterviewService.java:380-399` — `requireAsking()`: `read()` → on `null`\
        \ → `selectById` (DB) → rebuild `SessionState` → **blind** `write()` (resets\
        \ TTL). No check on DB's `status`, no `finished_at`, no parity/counter validation.\n\
        - `InterviewService.java:179, 254` — `newCount = state.questionCount() + 1`,\
        \ derived from the (possibly drifted) runtime state.\n- `schema.sql:46-57`\
        \ — `interview_session` has `started_at`/`finished_at` but **no `updated_at`**;\
        \ the DB carries no staleness signal, so a fallback cannot even tell \"recent\
        \ ASKING\" from \"stale ASKING\".\n\n### When continuation breaks (trigger\
        \ conditions)\n\n1. **Authoritative loss while DB is vvalid.** Any gap of\
        \ ≥24h between `stateStore.write()` calls removes the Redis key (LRU/eviction\
        \ or `maxmemory` pressure can remove it *earlier* than TTL). The session remains\
        \ `ASKING` in MySQL.\n\n2. **Freshness gap between the last Redis write and\
        \ expiry.** The 24h clock starts at the last write, but the DB may have advanced\
        \ afterward (e.g. a prior `finishSession` partitioned its double-write mid-way\
