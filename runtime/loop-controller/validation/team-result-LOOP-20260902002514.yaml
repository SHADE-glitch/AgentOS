      \ json=\"{corrupt\"` 验证 `warn` 后仍 `null` 且未 `delete`。\n\n**并发用例** 双线程同 `sessionId`\
      \ 调 `answer()`，`insert` 2 次即证非幂等。\n\n---\n\n## 5. 修复建议 (配置/代码层，待评审后实施)\n\n**Redis/状态一致性:**\n\
      * `InterviewStateStore.java:34` 拆 `Optional/Miss vs Corrupt vs Unavailable`，损坏时\
      \ `delete()` + 指标 `interview.state.parse_fail`；`read()` 成功时 `bucket.expire(TTL)`\
      \ 滑动续期；`TTL_HOURS` 移至 `application.yml: app.interview.state-ttl-hours` + jitter\
      \ `TTL*(0.9+0.2*random)`。\n* 双写原子化：`@Transactional` + `@Version` 于 `InterviewSession.java:31`，或\
      \ `UPDATE ... WHERE status=ASKING AND version=?` + `RBucket.compareAndSet`；`write`\
      \ 失败补偿重试/删除陈旧 Redis。\n* 声明单一真相源：若 Redis 权威则 DB 回退应 `fail-fast RETRY` 而非静默重建；若\
      \ DB 权威则 Redis 仅为缓存。\n\n**幂等/事务:**\n* `InterviewController.java:60` 改为 `record\
