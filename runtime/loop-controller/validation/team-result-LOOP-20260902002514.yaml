      \ 加 `@Transactional`，`questionCount` 改 `SET question_count=question_count+1`\
      \ 原子累加或基于 `COUNT(question)` 计算。\n* 评分选单路径：移除同步 `resultMapper.insert:149` 或异步，二选一，否则加\
      \ `UNIQUE(session_id)` 幂等 `INSERT ... ON CONFLICT DO NOTHING` 并先 `selectOne`\
      \ 判存。\n* 修正 `askedQuestionIds` 为 `Question.id`，`InterviewMessage` 新增 `questionId`\
      \ 字段或独立 `asked_questions` 集合。\n* `answerStream` 抽取 `handleAnswer(): MessageVO`\
      \ 事务方法，虚拟线程改 `ExecutorService` 有界池，`emitter.onCompletion/onTimeout` 释放锁，`UserContext`\
      \ 快照传递。\n\n```yaml\n# 推荐配置 backend/src/main/resources/application.yml\napp:\n\
      \  interview:\n    state-ttl-hours: 24\n    state-jitter-ratio: 0.2\n    lock-wait-seconds:\
      \ 5\n    lock-lease-seconds: 30\n    max-questions: 6\n    idempotency-ttl-hours:\
      \ 24\n```\n\n---\n\n## 6. 风险矩阵\n\n| 风险 | 影响 | 概率 | 对策优先级 |\n|---|---|---|---|\n\
