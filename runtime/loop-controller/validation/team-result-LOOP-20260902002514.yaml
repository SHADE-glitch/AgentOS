      \ 高** | Redis 为宣称的单一权威来源 `InterviewStateStore.java:15`，实际存在无 CAS 的 DB 回退写回 +\
      \ 非原子双写 | 100%（TTL=24h 过期或 `write` 失败即触发） |\n| **answer 幂等缺失** `InterviewService.java:124,131`\
      \ | **P0 致命** | 无 `Idempotency-Key`，无 `UNIQUE` 约束，`questionCount` 基于 Redis 快照\
      \ `+1`，无 `@Transactional` | 客户端重试/双击/网关重试必现重复行 |\n| **二重评分** `InterviewService.java:149,340,345`\
      \ | **P0** | 同步 `evaluationService.score` + 异步 `RabbitConfig:SCORING_EXCHANGE`\
      \ 双路径 `insert` | `FINISHED` 漂移后二次 `answer` 触发重复 `interview_result` |\n\n---\n\
      \n## 2. InterviewStateStore.java:34 Redis 过期后 DB 回退逻辑\n\n### 2.1 现状代码\n\n```java\n\
      // InterviewStateStore.java:34-46\npublic SessionState read(Long sessionId)\
      \ {\n    RBucket<String> bucket = redissonClient.getBucket(key(sessionId));\
      \ // key: interview:session:{id} :30\n    String json = bucket.get(); // TTL_HOURS=24\
      \ :25,51\n    if (json == null) return null; // 情况A: 过期/从未写入\n    try { return\
      \ objectMapper.readValue(json, SessionState.class); }\n    catch (Exception\
      \ e) { log.warn(...); return null; } // 情况B: 损坏JSON -> 同样返回null :43\n}\n```\n\
      \n```java\n// InterviewService.java:372-391\nprivate SessionState requireAsking(Long\
      \ sessionId) {\n    SessionState state = stateStore.read(sessionId); // :373\n\
      \    if (state == null) { // 回退\n        InterviewSession s = sessionMapper.selectById(sessionId);\
      \ // :375\n        state = new SessionState(s.getStatus(), s.getQuestionCount(),\
      \ s.getCurrentQuestionId()); // :379\n        stateStore.write(sessionId, state);\
      \ // 无条件回写 TTL=24h :381\n    }\n    if (FINISHED.name().equals(state.status()))\
      \ throw INTERVIEW_FINISHED; // :383\n    if (!ASKING && !START) throw INTERVIEW_STATE_ERROR;\
      \ // :386\n    return state;\n}\n```\n\n### 2.2 漂移模式 A: 陈旧 Redis 掩盖 DB 已结束 (最危险)\n\
      \n时序：`InterviewService.java:335` `finishSession` 中 `sessionMapper.updateById(session)`\
      \ 成功 (DB=`FINISHED`)，随后 `stateStore.write(...FINISHED...) :340` 抛异常 `BizException:54`（Redis\
      \ 超时/网络分区）。\n\n结果：`DB=FINISHED, Redis=ASKING` 持续至 TTL 结束（最长 24h）。下次 `answer()`\
      \ 调用 `stateStore.read :373` 命中旧 `ASKING`，**不走 `state==null` 分支**，直接通过 `requireAsking:386`\
      \ 校验，允许对已结束会话继续 `saveUserMessage:131`、`saveAiMessage:177`、`updateById:183`，产生孤儿消息，`questionCount`\
      \ 偏大，`resultMapper.insert:150` 重复插入。\n\n> 验证：`read()` 未区分 `Redis=ASKING` 与 `DB=FINISHED`\
      \ 的权威性，注释称 Redis 单一权威来源与回退逻辑自相矛盾。\n\n### 2.3 漂移模式 B: 静默重建掩盖数据丢失/TTL\n\n* `read:36`\
      \ 与 `read:43` 均返回 `null`，调用方无法区分 `TTL过期` vs `JSON损坏` vs `Redis不可用`。损坏场景仅 `log.warn`，未\
      \ `delete()` 坏 key，下次仍解析失败循环。\n* `requireAsking:381` 无 CAS：`read==null` -> `selectById`\
      \ -> `write` 重置 TTL 24h。若 `questionCount` 曾因 `write` 失败漂移，重建将把 DB 的漂移值写回 Redis，丢失\
      \ `currentQuestionId` 正确性。\n* `TTL_HOURS` 硬编码 `24` `InterviewStateStore.java:25`，无外部配置、无滑动过期、无\
      \ jitter。活跃会话 `read()` 不续期，24h 后必过期；批量创建会话同时过期有惊群风险。`InterviewService.java:51`\
      \ `bucket.set(json, TTL_HOURS, HOURS)` 未用 `keepTTL`/`expire`。\n\n### 2.4 双写非原子\n\
      \n所有状态变更均为 `sessionMapper.updateById` + `stateStore.write` 双写，无 `@Transactional`。`answer:183-186`,\
      \ `create:113-116`, `finishSession:339-341` 均存在 DB 成功/Redis 失败 或反之的窗口。`InterviewSession.java:31`\
      \ 无 `@Version` 乐观锁，无 `WHERE status=ASKING` 条件更新，二次 `FINISHED` 可覆盖 `finishedAt`。\n\
      \n**竞态：** `requireAsking` 回退虽在 `answer()` 持有 `RLock:353` 内受保护，但未来无锁调用方可并发 `read==null`\
      \ -> 双 `write` last-writer-wins，TTL 被意外延长。\n\n---\n\n## 3. InterviewService.java:372\
      \ / 124 answer 幂等性\n\n### 3.1 无幂等键，全链路可重复\n\n```java\n// InterviewService.java:124-131\n\
      public MessageVO answer(Long userId, Long sessionId, String answer) {\n    RLock\
      \ lock = lockFor(sessionId); // tryLock 5s :353, 无 lease 依赖 watchdog 30s\n \
      \   try {\n        requireOwnedSession(userId, sessionId); // :127\n       \
      \ SessionState state = requireAsking(sessionId); // :128\n        saveUserMessage(sessionId,\
      \ \"answer\", answer); // 无条件 insert :131,412\n        // ...\n        int newCount\
      \ = state.questionCount() + 1; // 基于 Redis 快照 :176\n        InterviewMessage\
      \ msg = saveAiMessage(...); // :177\n        session.setQuestionCount(newCount);\
      \ sessionMapper.updateById(session); // :183\n        stateStore.write(sessionId,\
      \ new SessionState(ASKING, newCount, msg.getId())); // :185\n    } finally {\
      \ unlockQuietly(lock); } // :366\n}\n```\n\n* `InterviewController.java:59`\
      \ `POST /{id}/answer` 入参 `Map<String,String> body` 无 `Idempotency-Key` 头提取，无\
      \ `@Valid` 限长。\n* `saveUserMessage:412` / `saveAiMessage:401` 均为 `new InterviewMessage();\
      \ messageMapper.insert()`，`InterviewMessage.java:14` `@TableId(AUTO)` 无 `UNIQUE(sessionId,\
      \ requestId)`。\n* `RLock` 仅串行化并发，不防重放：`unlockQuietly` 后重试立即再次 `tryLock` 成功，第二次插入重复\
      \ `USER answer` + `AI question`。\n* `questionCount` 推导 `state.questionCount()+1`\
      \ 非 `UPDATE SET question_count=question_count+1`，重试一次逻辑答案导致 `1->2->3` 漂移，`EvaluationService.java:102`\
      \ `shouldFinish` 基于 `extractQAPairs:320` 的 `COUNT` 与 `state` 分歧。\n\n### 3.2\
      \ 事务缺失放大幂等问题\n\n`answer()` 无 `@Transactional`，序列 `insert userMsg -> select messages:134\
      \ -> insert result:150 -> insert feedback:153 -> update session -> write redis\
      \ -> publish rabbit:345` 非原子。客户端超时在 `insert userMsg` 后重试 -> 留下无状态迁移的孤儿回答，重试再叠加一次问题。\n\
      \n`answerStream:194` 同缺陷且更重：`Thread.ofVirtual().start` 无界，锁持有长达 `SseEmitter\
      \ 300_000L :195`，`UserContext` ThreadLocal 在虚拟线程中丢失风险，双写+双评分逻辑与 `answer()` 复制\
      \ 50 行未抽取。\n\n### 3.3 二重评分\n\n同步路径 `answer:149` `resultMapper.insert(evaluationService.score(...))`\
      \ 与异步路径 `finishSession:345` `rabbitTemplate.convertAndSend(ScoringMessage)`\
      \ 的消费者 `RuleBasedScoringService:54` 各自 `insert`，`interview_result` 表 `schema.sql:76`\
      \ `session_id UNIQUE` 约束存在但 `InterviewResult.java` 实体未声明唯一键，重复 `FINISHED` 将触发两行或约束冲突取决于层级。当前无\
      \ `selectOne` 存在性检查。\n\n### 3.4 额外 Code Review 发现 (P1)\n\n* `askedQuestionIds:140`\
      \ 收集 `InterviewMessage.getKnowledgePointId()`，但 `QuestionBank.java:60` `notIn(Question::getId,\
      \ excludeIds)` 域错配，永不排除，已问问题可重复抽取。\n* `EvaluationService.java:82-83` `weakPoints.toString()`\
      \ 非 JSON，`result:310` `readTree` 解析失败，与 `buildDefaultResult:263` JSON 格式不一致。\n\
      \n---\n\n## 4. Testing Engineer 视角: 可重现用例 (不改源码)\n\n> 仓库 `backend/src/test`\
      \ 当前为空，需新增 `src/test/java/com/aiview/interview/InterviewServiceDefectTest.java`。\n\
      \n**用例1 P0 重试重复插入**\nMock `RedissonClient.getLock -> true`, `stateStore.read->ASKING:1`，首次\
      \ `answer()` 后模拟超时重试第二次同 `content` 调用，断言 `verify(messageMapper, times(2)).insert(USER)`\
      \ 即复现，期望 `times(1)`。\n\n**用例2 P0 questionCount 漂移**\n捕获 `sessionMapper.updateById`\
      \ 的 `questionCount`，断言重试后 `2->3` 非预期。\n\n**用例3 P1 陈旧 Redis=ASKING 而 DB=FINISHED**\n\
      `when(stateStore.read).thenReturn(ASKING:5)` + `when(sessionMapper.selectById).thenReturn(FINISHED:6)`，调用\
      \ `answer()` 应抛 `INTERVIEW_FINISHED:2003`，现不抛。\n\n**用例4 P1 TTL/损坏回退**\n`real\
