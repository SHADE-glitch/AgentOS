task_id: BENCH8-2-1-2-RUN2
task_text: 'Title: Run 2 — Related but Different: Redis cache invalidation drift in
  dashboard aggregation. Objective: Solve a second engineering problem that is semantically
  related to the Run 1 issue but is not a copy of it. Problem: The dashboard aggregates
  interview results and caches the result in Redis for 10 minutes (DashboardService.build()).
  The cache is populated without invalidation on result creation or update. This creates
  stale dashboard data after new interview results are written, which is a different
  service-level manifestation of the same underlying class of issue: cache freshness
  and authority assumptions in Redis-backed application state. Evidence: DashboardService.build()
  fetches a Redis bucket key dashboard:user:{userId} and returns cached data if present;
  DashboardService.build() sets a TTL of 10 minutes with bucket.set(..., CACHE_TTL_MINUTES,
  TimeUnit.MINUTES); there is no invalidation path visible after new interview results
  or session completion; the cached dashboard is treated as a valid source of truth
  until expiry. This is semantically related to the Run 1 issue but affects a different
  workflow: dashboard aggregation rather than active interview session state. The
  issue is grounded in backend/src/main/java/com/aiview/interview/service/DashboardService.java
  and related result-writing code, and it checks whether the prior memory affects
  decisions.'
