task_id: BENCH8-2-1-2-RUN1
task_text: 'Title: Run 1 — First Unknown Problem: Redis session TTL causes runtime
  state drift. Objective: Determine why a valid interview session may become impossible
  to continue or appears to revert to a wrong state after a period of inactivity,
  despite the database still recording the session. Problem: A user starts an interview
  and the runtime state is stored in Redis by InterviewStateStore.write(). The key
  uses a 24-hour TTL, and the code in InterviewService.requireAsking() assumes the
  Redis state is current. If Redis expires, the code falls back to DB state, but there
  is no stronger validation step. Under real conditions, this can produce state drift
  or inconsistent session continuation. Evidence: InterviewStateStore.write() sets
  redissonClient.getBucket(key(sessionId)).set(json, TTL_HOURS, TimeUnit.HOURS); InterviewStateStore.read()
  returns null if the bucket is missing; InterviewService.requireAsking() reconstructs
  from DB when Redis is missing; answer() and answerStream() both rely on the runtime
  state before accepting user answers. The issue is grounded in backend/src/main/java/com/aiview/interview/service/InterviewStateStore.java
  and InterviewService.java and is not a repeat of a previous benchmark.'
