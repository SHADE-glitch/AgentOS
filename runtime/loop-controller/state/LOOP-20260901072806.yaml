task_text: 'Investigate session-state drift and auth/interview consistency in the
  real backend at /home/shade/Public/test. The platform is an AI interview application
  where user sessions span authentication, interview lifecycle, result persistence,
  and AI evaluation. Some interview resumes or results appear inconsistent after retries,
  timeout handling, or repeated session actions. The backend merges identity, auth
  state, interview state, and AI evaluation context across multiple modules: auth,
  interview, agent, rag, config, common. Identify why auth/session state can diverge
  from interview state, why stale or duplicated interview context can persist, and
  where the design is vulnerable to retry-driven inconsistency or duplicate state
  transitions. Analyze the real code paths in /home/shade/Public/test/backend/src/main/java/com/aiview/
  for auth/security, interview, agent, rag, and config modules.'
