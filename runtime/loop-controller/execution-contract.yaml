# Loop Controller Execution Contract
# Phase 5.8.2.2 — Closed-Loop Runtime Controller
# This contract defines the Loop Execution lifecycle.

version: "1.0"
phase: "5.8.2.2"

loop_execution:
  loop_id: ""
  task_id: ""
  task_text: ""
  memory_mode: "enabled"    # enabled | fallback | disabled
  model: "opencode/ling-3.0-flash-fin-free"
  started_at: ""
  completed_at: ""
  current_stage: "pending"  # pending | running | completed | failed | fallback

  retrieval:
    status: "pending"
    retrieved_count: 0
    memory_ids: []
    hypotheses: []
    error: ""
    started_at: ""
    completed_at: ""

  decision:
    status: "pending"
    influence: "none"       # none | confirm | modify | override
    error: ""
    started_at: ""
    completed_at: ""

  runtime:
    status: "pending"
    execution_id: ""
    trace_id: ""
    session_id: ""
    provider: ""
    model: ""
    latency_ms: 0
    token_usage: {}
    output_hash: ""
    status_code: ""         # success | error | timeout
    error: ""
    started_at: ""
    completed_at: ""

  trace:
    status: "pending"
    trace_file: ""
    error: ""
    started_at: ""
    completed_at: ""

  feedback:
    status: "pending"
    candidate_ids: []
    error: ""
    started_at: ""
    completed_at: ""

  validation:
    status: "pending"
    validated_ids: []
    rejected_ids: []
    error: ""
    started_at: ""
    completed_at: ""

  promotion:
    status: "pending"
    promoted_ids: []
    rejected_ids: []
    error: ""
    started_at: ""
    completed_at: ""

  reconciliation:
    status: "pending"
    result: ""              # CONSISTENT | INCONSISTENT | REPAIRED
    error: ""
    started_at: ""
    completed_at: ""

  final_status: "pending"   # completed | failed | fallback
  errors: []

# Loop state transitions
states:
  - pending
  - running
  - completed
  - failed
  - fallback

# Stage order
pipeline:
  - retrieval
  - decision
  - runtime
  - trace
  - feedback
  - validation
  - promotion
  - reconciliation