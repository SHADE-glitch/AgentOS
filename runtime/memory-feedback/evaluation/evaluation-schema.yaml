# Memory Effectiveness Evaluation Schema
# Phase 5.7.3 — Evaluates whether promoted memories improve agent performance
# 
# Key constraint: No memory OFF baseline traces exist.
# Strategy: Compare traces that used a memory vs traces that did not use it.

version: "1.0"
phase: "5.7.3"
status: "active"

# =============================================================================
# 1. Evaluation Method
# =============================================================================
#
# Since all 7 traces have memory_mode=on (no memory OFF baseline),
# we use cross-group comparison:
#
#   Group A: traces that USED the target memory
#   Group B: traces that did NOT use the target memory
#
# This is NOT a true A/B test (same task, memory on/off).
# It is a correlational analysis of memory usage patterns.
# =============================================================================

evaluation_method:
  type: "cross_group_comparison"
  description: "Compare traces that used memory vs traces that did not"
  limitation: "No memory OFF baseline. Task difficulty differs between groups."
  requires: ["runtime/traces/*.yaml", "memory/retrieval-index.yaml"]

# =============================================================================
# 2. Evaluation Record Structure
# =============================================================================

evaluation_record:
  fields:
    evaluation_id:
      type: string
      format: "EVAL-{memory_id}-{timestamp}"
      example: "EVAL-P-001-20260830"
      required: true

    memory_id:
      type: string
      description: "The memory being evaluated"
      example: "P-001"

    memory_type:
      type: enum
      values: ["pattern", "success", "failure", "anti_pattern", "task", "effectiveness", "hypothesis"]
      required: true

    memory_evidence_level:
      type: string
      required: true

    # --- Group A: traces that USED this memory ---
    group_a:
      type: object
      fields:
        execution_ids:
          type: list[string]
        count:
          type: int
        avg_quality:
          type: float
        avg_tokens:
          type: float
        avg_latency_ms:
          type: float
        avg_output_tokens:
          type: float
        all_statuses:
          type: list[string]
        influence_types:
          type: list[string]

    # --- Group B: traces that did NOT use this memory ---
    group_b:
      type: object
      fields:
        execution_ids:
          type: list[string]
        count:
          type: int
        avg_quality:
          type: float
        avg_tokens:
          type: float
        avg_latency_ms:
          type: float
        avg_output_tokens:
          type: float
        all_statuses:
          type: list[string]

    # --- Deltas (A - B) ---
    deltas:
      type: object
      fields:
        quality_delta:
          type: float
          description: "Positive = memory improved quality"
        token_delta:
          type: float
          description: "Negative = memory saved tokens"
        token_delta_pct:
          type: float
          description: "Percentage change in tokens"
        latency_delta_ms:
          type: float
          description: "Negative = memory reduced latency"
        output_delta:
          type: float
          description: "Change in output length"

    # --- Effectiveness Score ---
    effectiveness_score:
      type: float
      range: [0.0, 1.0]
      description: "Weighted composite of quality, success rate, efficiency, latency"

    effectiveness_score_breakdown:
      type: object
      fields:
        quality_component:
          type: float
          weight: 0.40
        success_rate_component:
          type: float
          weight: 0.30
        token_efficiency_component:
          type: float
          weight: 0.20
        latency_component:
          type: float
          weight: 0.10

    decision:
      type: enum
      values: ["effective", "neutral", "ineffective"]
      description: "Final effectiveness classification"

    evaluated_at:
      type: string
      format: "ISO 8601"

# =============================================================================
# 3. Effectiveness Score Calculation
# =============================================================================

scoring:
  formula: |
    score = quality_component * 0.40
          + success_rate_component * 0.30
          + token_efficiency_component * 0.20
          + latency_component * 0.10

  components:
    quality_component:
      description: "How much quality changed when memory was used"
      formula: "clamp((avg_quality_a - avg_quality_b) / 2.5 + 0.5, 0, 1)"
      note: "Quality delta of +2.5 would give 1.0. Delta of 0 gives 0.5."
      scale: "0.0 (much worse) → 0.5 (same) → 1.0 (much better)"

    success_rate_component:
      description: "Success rate difference between groups"
      formula: "success_rate_a (all groups have 100% success)"
      fallback: "Use 0.5 when all traces succeed (no discrimination)"
      scale: "0.0 (all fail) → 0.5 (same) → 1.0 (all succeed)"

    token_efficiency_component:
      description: "Token savings when memory was used"
      formula: "clamp(1.0 - (avg_tokens_a / avg_tokens_b), 0, 1)"
      note: "If memory saves 20% tokens, score = 0.2. If 0% savings, score = 0."
      scale: "0.0 (no savings) → 1.0 (100% savings)"

    latency_component:
      description: "Latency reduction when memory was used"
      formula: "clamp(1.0 - (avg_latency_a / avg_latency_b), 0, 1)"
      note: "If memory reduces latency 30%, score = 0.3. If no reduction, score = 0."
      scale: "0.0 (no reduction) → 1.0 (100% reduction)"

  thresholds:
    effective: ">= 0.7"
    neutral: "0.4 - 0.7"
    ineffective: "< 0.4"

# =============================================================================
# 4. Caveats
# =============================================================================

caveats:
  - caveat: "no_memory_off_baseline"
    description: "All traces have memory_mode=on. Cannot isolate memory effect from other factors."
    mitigation: "Report as correlational, not causal."

  - caveat: "task_confound"
    description: "Group A and Group B have different tasks. Quality differences may be task-related."
    mitigation: "Note task difficulty in results."

  - caveat: "small_sample"
    description: "Only 7 traces. Group A (used) = 2 traces, Group B (not used) = 5 traces."
    mitigation: "Report raw data alongside scores."

  - caveat: "shared_memories"
    description: "P-001 and S-002 are always used together. Cannot attribute to a single memory."
    mitigation: "Evaluate P-001 and S-002 as a pair."