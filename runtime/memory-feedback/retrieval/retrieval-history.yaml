      \    | D1–D5             | Phase 10.5 vs Phase 11 记忆回归比较。       |\n\n- **公平**：A/B\
      \ 同任务文本、同 scaffold、同隐藏测试、同 dirty 前置、同 seed；唯一差异是 Agent OS 层。\n- **A/B 可比口径**见\
      \ §6（A 无 memory/recovery 维，不能直接用带这两维的总分与 B 比大小——剔除不可得维后归一化再比）。\n\n## 1. 测试目录结构\n\
      \n```\nbenchmark/\n└── round2/\n    ├── Benchmark-Round2-Plan.md           \
      \ ← 本文件\n    ├── baseline/            A1..A10 任务规格 (tasks/*.yaml + 注入)\n   \
