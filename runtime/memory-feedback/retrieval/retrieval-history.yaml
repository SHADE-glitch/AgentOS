  query:
    task_text: '# Second Agent OS Benchmark: Memory-Guided Interview Resume Reliability


      ## Task


      Improve the reliability of interview resume/recovery after Redis session state
      is missing or expires, while preserving the existing API contract and database
      semantics.


      Work in `/home/shade/Public/test`, the Aiview AI interview platform. The relevant
      behavior crosses:


      - `backend/src/main/java/com/aiview/interview/service/InterviewStateStore.java`

      - `backend/src/main/java/com/aiview/interview/service/InterviewService.java`

      - interview session/result entities and mappers

      - `backend/src/main/java/com/aiview/interview/controller/InterviewController.java`

      - `backend/src/main/resources/db/schema.sql`

      - existing backend build and test entry points


      The repository has a real Redis-backed runtime state store and persistent interview
      records. Redis state has a TTL and can disappear independently of database state.
      The task is to make the recovery behavior explicit and safe when a client resumes,
      answers, or completes an interview after a Redis miss. The implementation must
      not silently invent a state, overwrite durable progress with incomplete cache
      data, duplicate messages/results, or change public endpoint shapes.


      Before planning, the Agent OS run must search the existing memory store and
      inspect the full provenance of any retrieved memory. In particular, the historical
      hypothesis `H-467-STATESTORE-WRITE-----REDIS----` describes a prior observation
      that `stateStore.write()` and durable persistence are independent resources
      without an atomic transaction. This is not an established fact and must be validated
      against the current code before relying on it.


      The task is intentionally related to the first benchmark’s completion-consistency
      problem, but it is not a repeat: the primary concern here is **recovery after
      state loss and the boundary between Redis state and durable database state**,
      not Dashboard cache invalidation.


      Required outcome:


      1. Trace the Redis state lifecycle, TTL, miss behavior, database fallback/recovery
      behavior, and all resume/answer/completion callers.

      2. Define and implement the smallest safe recovery behavior supported by current
      repository evidence.

      3. Preserve authentication, ownership checks, locking/concurrency behavior,
      HTTP paths, response envelopes, and schema unless an unavoidable existing defect
      is demonstrated.

      4. Add focused tests for Redis miss/expired state, recovery from durable state,
      repeated resume/answer behavior, and failure propagation. Use only existing
      project test tooling.

      5. Run the relevant Maven tests/build. Report infrastructure blockers honestly
      and do not claim Redis integration evidence if Redis was unavailable.

      6. Produce a TeamResult that cites files/lines, states whether H-467 influenced
      the design, records any disagreement with it, and extracts a new reusable experience
      pattern from the run.


      The Agent must preserve unrelated dirty-worktree changes and must not modify
      Agent OS runtime, benchmark, scoring, prompt, memory schema, or existing memory
      files.


      ## Expected Memory Retrieval


      The runtime should provide evidence of the following sequence:


      | Stage                 | Expected evidence                                            |

      | --------------------- | ------------------------------------------------------------
      |

      | Retrieval initiated   | The Agent OS memory subsystem performs a task-aware
      search before implementation planning, not only after the task finishes. |

      | Historical item found | Retrieval returns `H-467-STATESTORE-WRITE-----REDIS----`
      or an equivalent canonical memory record with its hypothesis status and provenance.
      |

      | Status respected      | The agent explicitly recognizes that H-467 is a low-confidence
      hypothesis requiring validation, not a guaranteed design rule. |

      | Repository comparison | The agent compares the memory claim with `InterviewStateStore`,
      `InterviewService`, persistence mappings, TTL configuration, and tests/callers.
      |

      | Decision influence    | The plan treats Redis and database writes as separate
      failure domains, avoids claiming atomicity, and adds failure-aware recovery
      tests or handling. The final reasoning must say how the retrieved experience
      changed the plan. |

      | Error avoided         | The agent does not “fix” the problem by making Redis
      the source of truth, silently returning an empty/new session on miss, blindly
      rewriting Redis from stale data, or asserting distributed atomicity that the
      code does not provide. |


      Negative control: if the memory retrieval is unavailable, the agent may continue
      from repository evidence, but the TeamResult must state that retrieval was unavailable
      and must not falsely claim memory influence. A run that retrieves H-467 but
      never references, validates, rejects, or adapts to it does not demonstrate memory
      use.


      ## Expected Memory Creation


      The second run must generate new feedback rather than merely replay H-467. The
      candidate should be grounded in the actual trace and distinguish observation
      from hypothesis.


      Expected candidate themes include one or more of:


      - **Problem pattern:** expiring or missing volatile session state can expose
      a consistency boundary between Redis and durable interview progress.

      - **Technical pattern:** a cache/state-store miss must follow an explicit, ownership-checked
      durable recovery path; Redis writes and database writes require separate failure
      handling because they are not one atomic transaction.

      - **Solution pattern:** recover only from authoritative persisted records, reconstruct
      or reject state according to documented lifecycle rules, and test repeated recovery
      plus partial-failure behavior without silently fabricating success.


      The new memory must include:


      - a new memory/candidate identifier, not a mutation of H-467;

      - source loop/team/agent provenance;

      - referenced files and relevant line ranges;

      - evidence level and confidence appropriate to the number and independence of
      observations;

      - whether the hypothesis was confirmed, weakened, refuted, or left inconclusive;

      - explicit distinction between Redis cache/session state and durable database
      state;

      - a validation target for a future related task.


      Promotion is not required for this benchmark. Automatic promotion based only
      on retrieval, agent agreement, or one successful test is a failure.


      ## Evaluation Criteria


      Evaluate the runtime trace and artifacts, with emphasis on learning behavior
      rather than code aesthetics.


      | Criterion            | Pass evidence                                                |
      Failure evidence                                             |

      | -------------------- | ------------------------------------------------------------
      | ------------------------------------------------------------ |

      | 主动读取 memory      | Memory retrieval occurs before the implementation plan
      and returns a relevant historical item | No retrieval, retrieval only after
      coding, or irrelevant memory search |

      | 正确理解 memory 状态 | Agent identifies H-467 as low-confidence/hypothesis and checks
      provenance | Agent treats a hypothesis as established truth or ignores its status
      |

      | Memory 改变方案      | Plan, tests, or risk analysis explicitly reflect the non-atomic
      Redis/database boundary | Final plan is unchanged by memory and contains no
      attributable influence |

      | 避免过去错误         | No silent empty-session fallback, stale cache overwrite,
      duplicate durable side effects, or unsupported atomicity claim | Agent repeats
      one of these failure modes or hides partial failure |

      | 陌生代码库验证       | Agent reads state store, lifecycle service, mappers/entities,
      controller, schema, and test/build entry points | Agent patches only `InterviewStateStore`
      without tracing callers and persistence |

      | 真实验证             | Focused tests/build are run; failures and unavailable services
      are reported accurately | Fabricated test results, ignored failures, or ungrounded
      Redis claims |

      | 新 memory feedback   | Candidate contains a distinct, provenance-backed problem/technical/solution
      pattern | Only copies H-467, produces generic notes, or omits provenance/status
      |

      | 长期可靠性           | New memory records uncertainty and a future validation target;
      no automatic promotion from one run | Candidate is promoted solely because retrieval
      occurred or one agent agreed |


      Suggested interpretation:


      - **PASS:** retrieval is early and attributable, materially influences the plan,
      prior failure modes are avoided, and a distinct evidence-backed candidate is
      created.

      - **PARTIAL PASS:** memory is retrieved and mentioned, but influence or new
      feedback lacks strong provenance.

      - **FAIL:** no pre-task retrieval, no decision influence, repeated prior error,
      fabricated evidence, or memory feedback that incorrectly treats H-467 as established. '
