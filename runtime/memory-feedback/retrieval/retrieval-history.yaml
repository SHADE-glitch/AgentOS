    task_text: "# Benchmark Round 2 — Phase 11 Recovery 验证\n\n> 目标：**实证** Phase 11（Recovery\
      \ Execution Bridge / RecoveryTask / OpenCode 委托重试 / Evidence 验证 / Retry budget=2）\n\
      > 是否真正提升 Recovery 能力。1\n> 原则（承继 Round 1）：不测内部实现；任务真实工程场景、可本地运行、可经测试/命令验证、客观机械计分；\n\
      > **必须验证完整 Agent OS pipeline**（Agent → Evidence Collector → Recovery Detector\
      \ → RecoveryTask → Execution Bridge → 委托重试 → 新 Evidence → Validator）。\n\n##\
      \ 0. 范围与对照设计\n\n| 组                        |    AOS_MEMORY    | AOS_RECOVERY\
      \ | AOS_PIPELINE | 任务              | 说明                                    \
      \    |\n| ------------------------- | :--------------: | :----------: | :----------:\
      \ | ----------------- | ------------------------------------------- |\n| **A.\
      \ Baseline**           |        ✗         |      ✗       |      ✗       | A1–A10\
      \            | 对照组。裸 OpenCode，无记忆/恢复/证据链路。 |\n| **B. Agent OS + Phase11** |\
