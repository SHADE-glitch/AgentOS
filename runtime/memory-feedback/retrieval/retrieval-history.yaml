      \ facts used by the benchmark:\n\n- `InterviewStateStore` writes session status\
      \ to Redis with a 24-hour TTL.\n- `InterviewService.requireAsking()` falls back\
      \ to DB state if Redis state is missing, but this recovery path can mask stale\
      \ or expired runtime state.\n- `DashboardService.build()` caches a user dashboard\
      \ in Redis with a 10-minute TTL and does not invalidate it after new results\
      \ are written.\n\nThis is a valid real-world benchmark because it reflects a\
      \ materially harmful class of issues:\n\n- state drift caused by TTL expiry\n\
      - stale cache after data mutation\n- false sense of correctness when backing\
      \ store and cache diverge\n\nMulti-agent execution required:\n\n- backend-agent\n\
      - database-agent\n- security-agent\n- testing-agent\n- reviewer-agent\n\nAll\
      \ agents must participate in the same runtime analysis, not a static documentation-only\
      \ review.\n\n## 3. Run1 Task\n\nTitle:\nRun 1 — First Unknown Problem: Redis\
      \ session TTL causes runtime state drift\n\nObjective:\nDetermine why a valid\
      \ interview session may become impossible to continue or appears to revert to\
      \ a wrong state after a period of inactivity, despite the database still recording\
      \ the session.\n\nProblem statement:\nA user starts an interview and the runtime\
      \ state is stored in Redis by `InterviewStateStore.write()`. The key uses a\
      \ 24-hour TTL, and the code in `InterviewService.requireAsking()` assumes the\
      \ Redis state is current. If Redis expires, the code falls back to DB state,\
      \ but there is no stronger validation step. Under real conditions, this can\
      \ produce state drift or inconsistent session continuation.\n\nReal repository\
      \ evidence:\n\n- `InterviewStateStore.write()` sets `redissonClient.getBucket(key(sessionId)).set(json,\
      \ TTL_HOURS, TimeUnit.HOURS);`\n- `InterviewStateStore.read()` returns `null`\
      \ if the bucket is missing.\n- `InterviewService.requireAsking()` reconstructs\
      \ from DB when Redis is missing.\n- `InterviewService.answer()` and `answerStream()`\
      \ both rely on the runtime state before accepting user answers.\n\nRun 1 expected\
      \ investigation path:\n\n1. backend-agent inspects the runtime state flow across\
      \ `InterviewService` and `InterviewStateStore`.\n2. database-agent compares\
      \ `interview_session` DB state with the Redis runtime value to confirm divergence\
      \ risk.\n3. security-agent checks whether stale runtime state could produce\
      \ unauthorized or inconsistent session transitions.\n4. testing-agent reproduces\
      \ the expiry scenario and defines a test matrix that includes TTL expiry, DB\
      \ fallback, and invalid state transitions.\n5. reviewer-agent confirms the root\
      \ cause and writes the final team result.\n\nExpected artifact outputs:\n\n\
      1. team-result.yaml\n2. memory-candidates.yaml\n3. hypothesis file named with\
