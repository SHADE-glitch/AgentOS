    task_text: "# Agent OS Fair Benchmark Specification (A/B 对照)\n\n> 目的：公平比较 **A\
      \ = 裸 OpenCode** 与 **B = OpenCode + Agent OS** 的**最终工程能力**。\n> 原则：不测 Agent OS\
      \ 内部实现（retrieval 打分、memory schema、prompt 内部机制一律不测）；\n> 只测最终结果能否通过测试、是否引入回归、是否产出可信证据、能否在失败中恢复、能否真正利用记忆。\n\
      > 约束：任务真实工程场景、项目无关、可在本地仓库执行、可经测试验证、禁止纯文字评价、必须客观可机械打分的分数。\n\n---\n\n## 0. 总览\n\
      \n| 类别                            | 说明                                     \
      \  | 任务数            | 是否 A/B 都跑                    |\n| -------------------------------\
      \ | ------------------------------------------ | ----------------- | --------------------------------\
      \ |\n| **A. Coding baseline**          | 裸编码能力：纯工程修复，不给记忆           | 10（基础池）\
      \      | ✓ 两组都跑                       |\n| **B. Agent OS enhanced coding** |\
      \ 同批 10 个任务 + 记忆/检索，测增强效应     | 10（同池）        | ✓（与 A 同任务，唯差异是记忆层） |\n| **C.\
      \ Failure recovery**         | 预置故障 + 失败模式记忆，测恢复与避免复发  | 5（injection 池） | ✓\
      \                                |\n| **D. Memory influence**         | 记忆为主载体的任务，测记忆是否真实改变行为\
      \ | 5（retrieval 池） | ✓（B 组核心，A 组作对照）        |\n\n每次任务在 **≥3 个 seed** 上重复运行（seed\
      \ 决定任务顺序 / 随机化 / 边界数据分布），报告 **mean ± CI**，并用**效应量**（B−A）而非\"谁赢\"下结论。**8 个防作弊护栏**见\
      \ §9。\n\n---\n\n## 1. 评分框架（通用，机械可算）\n\n任何得分必须锚定到**可 grep / 可执行 / 可重放**的 artifact，不允许人工文字评分。\n\
      \n### 1.1 证据信封 `evidence.json`（agent 必须产出）\n\nSchema 由裁判 harness 校验（`judge.py\
      \ --schema`）：\n\n```jsonc\n{\n  \"task\": \"B3\",                       // 任务\
      \ id\n  \"root_cause\": { \"claim\": \"…\", \"file\": \"src/x.java\", \"line\"\
      : 47, \"git_blob\": \"…\" },\n  \"changes\": [\n    { \"file\": \"src/x.java\"\
      , \"kind\": \"edit|new|delete\", \"must_stay_green_tests\": [\"Regre_A\"] }\n\
      \  ],\n  \"commands\": [ { \"cmd\": \"mvn test\", \"exit\": 0, \"stdout_sha256\"\
      : \"…\", \"summary\": \"26/26\" } ],\n  \"limitations\": [ \"未测真实 broker 往返\"\
      \ ],   // 诚实声明\n  \"memory_used\": [ \"mem_id…\" ],             // D 类必填\n \
      \ \"memory_written\": []                        // 空 = 未写入\n}\n```\n\n### 1.2\
      \ 六维得分（每维 0–10，整数，规则表）\n\n| 维度                             | 分数判定（机械规则）    \
      \                                     |\n| --------------------------------\
      \ | ------------------------------------------------------------ |\n| **correctness**\
      \                  | 隐式隐藏测试全过 + 根因修复=10；隐藏过但仅补丁症状=5±；隐藏失败或无法编译=0–3。隐藏测试集是裁判单独撰写的权威集，**不展示给\
      \ agent**。 |\n| **test pass rate**               | agent 自行测试 ≥N 且 **100% 绿**\
      \ + 断言非空（**变异测试**证明断言真在守属性）=10；含空断言或\"仅不崩\"=扣；未提供测试/未记录运行=0。 |\n| **regression\
      \ risk**              | 起步 10。每改动一个**无关文件** −1；每触碰一次**禁止表面**（schema / 公共 endpoint\
      \ / 队列 wiring 且无证据）−2；任一**必须保持绿**的回归测试变红 −3；下限 0。 |\n| **evidence quality**\
      \             | evidence.json schema 过=+4；引用的 file:line **解析到当前 HEAD 的非平凡行**\
      \ 比例≥80%=+3；命令输出的 stdout hash 可被运行日志重放匹配=+2；诚实 limitation 且**无伪造 broker/服务结果**=+1。检测到伪造输出\
      \ **整体 −5**；整段块行号错误每处 −2。 |\n| **recovery ability**（仅 C 类）  | 从注入故障回到绿 的最小数步骤\
      \ + 最终 diff 最小且可逆 + 根因被证据引用（非乱试）。按量化表给分。 |\n| **memory usefulness**（仅 D 类） |\
      \ 行为因记忆而改变（diff 由套用记忆产生）=+5；新写 memory 有 provenance=+2；**未重蹈已记录失败**=+3；M5 负控制：**盲信植入的假记忆\
      \ −5**，用代码证据证伪该假记忆 +5。 |\n\n### 1.3 总分\n\n```\nTotal(0–100) = 0.25·correctness\
      \ + 0.15·test_pass + 0.15·regression\n             + 0.15·evidence + 0.15·recovery\
      \ + 0.15·memory\n```\n\n（A 组无记忆层，memory 维度按\"需记忆但未给\"计 0，公平扣除其不可得项说明见 §9.3。）\n\
      \n### 1.4 难度分级\n\n- **P0**：单点、症状明显、修复路径唯一。\n- **P1**：两分支决策，需选一 canonical；有 1\
      \ 个隐藏陷阱。\n- **P2**：根因 ≠ 症状；≥2 个陷阱；需跨 2+ 模块协调。\n- **P3**：无歧义地多解、需证据支撑 canonical\
      \ 决策、跨 TZ/环境差异、必渗透禁止表面。\n\n---\n\n## 2. 参考脚手架 `S`（项目无关但可运行）\n\n任务不绑定任何真实项目；由\
      \ harness 生成一个**统一最小仓库**，各类任务在其上注入缺陷。组件命名通用，任何本地机器可跑（Java 缺时可换 Node/Go 等价物，但**一组任务内保持同语言**以保证对照公平）：\n\
      \n```\nS/\n├── config/         config.yaml  + env 覆盖（含一个 mode 开关 + env 默认值）\n\
      ├── worker/         一个异步队列 worker（in-RDBMS 或文件队列，禁止依赖 broker 前提）\n├── api/ \
      \           REST 端点（public surface，禁止表面 #1）\n├── db/             schema.sql\
      \ + 迁移（禁止表面 #2）\n├── report/         报告/导出模块（可能含用户可控字段）\n├── lock/         \
      \  分布式锁 / 令牌（并发模块）\n├── tests/\n│   ├── public/     展示给 agent 的测试\n│   ├── hidden/\
      \     隐藏权威测试（裁判唯一持有，判断 correctness）\n│   └── regression/ 必须保持绿的回归测试（判断 regression\
      \ risk）\n└── CI/             CI 环境差异模拟器（locale/TZ/并行，测 C 类环境方差）\n```\n\n**隐藏测试的唯一性**：`hidden/`\
      \ 由裁判在**任务下发前**撰写并哈希锁定（`tests.lock`），不进任务描述，agent 无法读取。\n\n---\n\n## 3. Category\
      \ A/B — Coding baseline / Agent OS enhanced coding\n\n**同 10 个基础任务，两组都跑。** A\
      \ 组空记忆、无检索；B 组全记忆+检索。B−A 在每维的效应量即\"Agent OS 增强\"。\n\nA 与 B 唯一的制度性差异是记忆层；任务文本、脚手架、隐藏测试、评分完全一致。10\
      \ 个任务见 §10（含每任务的五要素 + 陷阱）。\n\n核心判定点（承接上一轮真实审计的发现）：\n\n- 是否**真实触发框架条件求值** 还是**手写代理测试**假装验证（裁判用真条件评估器验证，抓空断言/代理断言）。\n\
      - 是否**实证证据** 支撑 canonical 决策，而非选 A/B 靠猜。\n- 是否**越界侵入禁止表面**，即便测试全绿（回归分扣）。\n-\
      \ 是否**保留 dirty worktree / 无关文件**（每个任务前置一个无关脏改动 + 未跟踪文件，agent 必须保留）。\n\n---\n\
      \n## 4. Category C — Failure recovery\n\n**5 个 injection 任务**（见 §11）。流程：\n\n\
      1. Harness 把仓库置于**预失败基线**（一个真实故障：编译坏 / 配置损坏 / 半迁移 / 环境方差 / 死依赖）。\n2. 给 B 组**一条已记录的失败模式\
      \ memory**（描述\"上次某类故障的根因与正确修法\"）。\n3. 记录 agent 的恢复脚本、最终 diff、根因证据。\n\n**埋设双测点**：\n\
      \n- **恢复能力**（客观）：回到绿的时间/步骤、diff 最小性、根因引用。\n- **复发避免**（记忆层）：agent 是否**查记忆避免重蹈**，还是又一次重写同样的错。\n\
      \n---\n\n## 5. Category D — Memory influence\n\n**5 个 retrieval 任务**（见 §12）。记忆是**承载物**（load-bearing），任务的成败取决于是否套用正确记忆，并用**行为\
      \ diff**而非\"检索命中率\"衡量。含一个**负控制陷阱**（M5）直接测 Agent OS 的判别力（不盲信错误记忆），这正是上一轮审计中该系统的亮点，值得作为基准维度。\n\
      \n---\n\n## 6–8. 见任务池详表（§10–§12）\n\n---\n\n## 9. 防作弊与公平护栏（8 条）\n\n1. **任务文本双组逐字一致**；记忆层是\
      \ A/B 唯一差异，且对 B 是透明可审计的（记忆读取过程不留存在证据信封之外）。\n2. **隐藏测试仅裁判持有**，哈希锁定，禁止进任务描述；防\"\
      agent 专为看得到的测试打补丁\"。\n3. **同批任务内语言一致**；≥3 seed 重复；报告效应量 + 置信区间，不报告\"B 赢\"这类单点结论。\n\
      4. **时间盒**：每任务给定最大时钟预算，超时 = recovery/timeout 惩罚，防无限乱试刷分。\n5. **禁止表面清单**随任务下发（哪些文件/接口不得动），回归分机械裁决。\n\
      6. **变异测试**审计 agent 自己的断言，防止\"写了测试但断言为空/从不失败\"。\n7. **输出重放检查**：evidence.json\
      \ 中命令 stdout 的 sha 必须能在运行日志中复现；不能复现 = 伪造。\n8. **对照组同一 seed 与 dirty 前置状态**：每个任务先在\
      \ A 组和 B 组各产生一份**相同的不变基线快照**，再分别注入缺陷，保证对照一致。\n\n---\n\n## 10. 基础任务池（10，Category\
      \ A/B 共用）\n\n> 难度 / 修改 / 陷阱 / 评估 / 证据，每个任务都标注。`S` 指 §2 脚手架。\n\n### B1 — 双实现非确定性\n\
      \n- **Task**：`worker/` 有两个实现监听同一任务队列，其中一个在 `config.mode=default` 下应被禁用却常驻，导致同一任务被不确定地由\
      \ A 或 B 处理；且默认 mode 被暗中调用付费/慢路径。目标：每 mode 恰好一个活跃消费者。\n- **Difficulty**：P2\n\
      - **Expected changes**：为常驻实现补上模式条件门控；删除或禁用冗余实现；保持队列 wiring / schema / 公共 surface\
      \ 不变。\n- **Hidden traps**：① 环境变量设为**空串** `MODE=\"\"` 时所有条件都不命中 → 零消费者静默堆积（agent\
      \ 常漏此边界）；② agent 用**手写反射代理逻辑**冒充真实条件求值 → 隐藏测试用真实条件评估器（如 `ApplicationContextRunner`）验证，代理测试全绿但真实求值不符。\n\
      - **Evaluation**：correctness=隐藏测试验证\"每 mode 恰好一个活跃消费者、空串/缺失/未知 mode 行为确定\"；regression=不得动\
      \ queue/schema。\n- **Evidence**：`evidence.json` 必须引用 3 个 worker 的条件注解行 + config\
      \ mode 行；limitations 若未起 broker 必须如实声明并**给出 broker-free 验证方法**，不得编造 broker 结果。\n\
      \n### B2 — 配置投影 vs 症状补丁\n\n- **Task**：一次调用的配置值被 env 默认值覆盖返回错误值，症状在 api 层。目标：找到真根因。\n\
      - **Difficulty**：P2\n- **Expected changes**：修正 config 绑定 / env 优先级；api 层零改动或最小改动。\n\
      - **Hidden traps**：① agent 在 api 抛异常处打补丁（改症状），隐藏 \"@/api 在正确配置下应返回基准值\"测试失败；②\
      \ config 值含空格/注释导致严格解析失败，需正确 source。\n- **Evaluation**：correctness=根因修复（改 config\
      \ 而非 api）；test_pass=隐藏 config-parsing 测试。\n- **Evidence**：root_cause.claim 必须落到\
      \ config 行 + env 覆盖说明；改 api 但未改 config 的情形成证据扣分项。\n\n### B3 — 空断言测试\n\n- **Task**：给某模块补一个\"\
      测试\"，但现有测试方法断言为空（`assertTrue(true)` 之类或从不进入分支）。要求：让新功能真正可验证。\n- **Difficulty**：P1\n\
      - **Expected changes**：新增或改写断言，覆盖正常 + 异常 + 边界。\n- **Hidden traps**：agent 直接沿用空断言测试当成\
      \ \"green = 完成\" → 变异测试发现断言从不失败，correctness/test_pass 扣。\n- **Evaluation**：test_pass\
      \ 用变异测试判定断言强度；correctness 由隐藏属性测试判定功能真对。\n- **Evidence**：commands 含变异/覆盖运行；若断言被证明守护真实属性则证据高分。\n\
      \n### B4 — 幂等缺失（重试造成重复行）\n\n- **Task**：异步任务的 at-least-once 重试导致结果表重复写入。目标：幂等。\n\
      - **Difficulty**：P2\n- **Expected changes**：唯一约束 + upsert/预检；不得破坏已有行的语义。\n-\
      \ **Hidden traps**：① 只加唯一约束但漏改写入逻辑 → 重试抛异常堆积；② 为\"修幂等\"重写行清空历史 → 回归风险。③ agent\
      \ 把幂等放错层（在调用方而非被调方）。\n- **Evaluation**：correctness=隐藏重试 N 次仅 1 行、且不抛错；regression=已有\
      \ schema 列未随意改动。\n- **Evidence**：引用唯一约束 + 写入方法行；命令重放证明重复插入被幂等处理。\n\n### B5 —\
      \ 时区边界\n\n- **Task**：按\"日\"聚合的统计在某时区差一天。目标：跨时区正确。\n- **Difficulty**：P2\n- **Expected\
      \ changes**：日期截断/比较显式化带时区；聚合语义固定。\n- **Hidden traps**：本地（UTC+8 机器）跑全绿，隐藏测试用\
      \ `TZ=America/Los_Angeles` 跑边界跨日失败；agent 乱 `setDefault(TimeZone)` 影响全进程（隐藏测试检测\
      \ locale/TZ 泄漏）。\n- **Evaluation**：correctness=隐藏跨 TZ 测试；regression=不得全局副作用污染其他测试。\n\
      - **Evidence**：evidence 须引用时区断言；CI 环境差异模拟器输出作为证据。\n\n### B6 — JSON 拼接注入\n\n\
      - **Task**：报告导出用字符串拼接内嵌用户可控字段，特殊字符产生畸形 JSON。目标：结构安全。\n- **Difficulty**：P1\n\
      - **Expected changes**：用序列化器（ObjectMapper 之类）构建嵌套结构；**所有字段**与嵌套对象都转义。\n- **Hidden\
      \ traps**：① 只转义顶层 1 个字段，隐藏测试遍历全部字段 + 嵌套数组；② 修复后改变响应结构（public envelope 变化 → 回归扣）——\
      \ 只改序列化方式，不改 schema。\n- **Evaluation**：correctness=隐藏测试对所有字段读回校验；regression=envelope\
      \ 未变。\n- **Evidence**：引用序列化写法 + 暴露所有字段的测试；若字段来自未加白名单的用户输入，注明。\n\n### B7 — 死代码双维护\n\
      \n- **Task**：同一逻辑存在 canonical 与 legacy 两份近似实现，其中 legacy 永不加载。要求：决策哪个是 canonical，并让系统行为确定。\n\
      - **Difficulty**：P1\n- **Expected changes**：选 canonical 并据证据修复；legacy 被禁用/删除；决策写入证据。\n\
      - **Hidden traps**：① 只修 canonical 而 legacy 仍注册 → 隐藏测试探测第二 listener 存在即失败；② 无证据就删\
      \ canonical 版 → 隐藏测试依赖 canonical 行为；③ agent 保留 legacy 但注释矛盾。\n- **Evaluation**：correctness=隐藏测试验证仅\
      \ canonical 活跃且行为正确；regression=不引入新的双写。\n- **Evidence**：canonical 决策必须有包位置/幂等性/活跃度差分证据；无证据的决策扣分。\n\
      \n### B8 — 资源未释放\n\n- **Task**：持锁/连接的处理在异常路径不释放，导致后续任务死锁/超时。目标：异常安全。\n- **Difficulty**：P2\n\
      - **Expected changes**：try/finally（或等价）确保释放；超时/回滚语义正确。\n- **Hidden traps**：快乐路径测试全绿，隐藏的**异常路径压力测试**（注入抛错）验证锁确实释放；agent\
      \ 只在快乐路径测。\n- **Evaluation**：correctness=隐藏异常注入测试 + 锁释放断言；test_pass=agent 测试是否覆盖异常路径。\n\
      - **Evidence**：引用 catch/finally 行；注入脚本输出作为证据。\n\n### B9 — schema / 公共表面漂移\n\n\
      - **Task**：某重构顺带改了字段/Endpoint 公共形状。目标：**遵守禁止表面**或在证据中显式 justify。\n- **Difficulty**：P1\n\
      - **Expected changes**：不触碰禁止表面（schema/endpoint/queue）；若必须动，则单列证据 justify 且不静默。\n\
      - **Hidden traps**：① agent 把字段改名当\"内部优化\"却破坏公共字段契约 → 隐藏 schema/契约测试失败；② \"do\
      \ not touch\" 清单内文件被改但没在 evidence 声明。\n- **Evaluation**：regression=对禁止表面变更的机械扣分；correctness=契约测试。\n\
      - **Evidence**：禁止表面清单 + 逐条声明；任何触碰必须引证据 justify。\n\n### B10 — 不稳定排序/去重\n\n- **Task**：聚合对近重复键按不稳定的排序去重，隐藏输入含平局产生非确定性结果。目标：稳定确定性。\n\
      - **Difficulty**：P1\n- **Expected changes**：加稳定 tie-break / 确定性选择；不改公共形状。\n\
      - **Hidden traps**：确定性输入全绿，隐藏的随机化/平局输入暴露非确定；agent 用随机 seed 掩盖而非确定性。\n- **Evaluation**：correctness=隐藏平局集合在多次运行一致；regression=envelope\
      \ 不变。\n- **Evidence**：引用 tie-break 逻辑行；多次运行输出 hash 一致作为证据。\n\n---\n\n## 11.\
      \ Recovery Injection 任务池（5，Category C）\n\n> 前置：仓库处于预失败基线 + B 组有一份记录该失败模式的 memory。\n\
      \n### R1 — 构建损坏恢复\n\n- **Task**：基线编译失败（一个真实语法/依赖错误），且工作区有**未提交、与任务无关**的改动必须保留。恢复至可编译。\n\
      - **Difficulty**：P1\n- **Expected changes**：修复编译错误；不 `reset/checkout` 丢弃无关改动。\n\
      - **Hidden traps**：① agent `git checkout -- .` 清空一切（**必须保留的 dirty worktree**\
      \ 丢失 → 恢复分重扣）；② 修复引入第二处回归。\n- **Evaluation**：recovery=回到绿最小步骤 + 无关改动保留数（diff\
      \ 对比）；regression=回归测试绿。\n- **Evidence**：恢复命令序列 + 关键文件 forensic（哪些被合法改变）。\n\n\
      ### R2 — 死依赖恢复\n\n- **Task**：某一外部依赖（broker/DB）不可用，但系统应以降级路径或明确失败工作，而非启动就崩。目标：优雅降级或明确错误。\n\
      - **Difficulty**：P2\n- **Expected changes**：容忍依赖缺失/懒初始化/降级开关；不允许伪造\"依赖已恢复\"\
      。\n- **Hidden traps**：① agent 把\"依赖不可用\"伪装成\"测试对马脚\"绕过检查（伪造 broker）；② 降级逻辑把主流程也降级了。\n\
      - **Evaluation**：recovery=在依赖缺席时可验证（隐藏测试在无依赖下运行降级/明确失败）；evidence=**禁止伪造依赖可用声明**。\n\
      - **Evidence**：无依赖下的测试输出 + limitations 如实声明不可能项。\n\n### R3 — 复发避免（关键记忆测点）\n\n\
      - **Task**：基线含一个**与已记录失败模式相同**的 bug（memory 描述过根因与正确修法）。观察 agent 是否 consult 记忆、避免重蹈。\n\
      - **Difficulty**：P2\n- **Expected changes**：按记忆中的正确修法落地（或合理地独立得出相同结论），并引用证据。\n\
      - **Hidden traps**：① 不看记忆、又按上次错误修法重做；② 看了记忆却**盲信**不核对当前代码 → 记忆已过时则错（测试记忆-代码一致性）。\n\
      - **Evaluation**：recovery 完成 + memory_usefulness=避免复发（行为一致于正确修法）。\n- **Evidence**：memory_used\
      \ 字段 + reasoning 中引用；若未用记忆也能正确则给 memory usefulness 较低、correctness 高分（测的是\"需要用记忆\"\
      的场景）。\n\n### R4 — 半迁移恢复\n\n- **Task**：schema 与代码不一致（迁移只做了一半）。目标：协调恢复，不丢数据语义。\n\
      - **Difficulty**：P2\n- **Expected changes**：补齐迁移 + 同步代码读写两端；禁止一张表删另一处引用不清。\n\
      - **Hidden traps**：① 只修代码不修 schema（或反之）→ 一半路径崩；② 迁移破坏历史数据的约束。\n- **Evaluation**：correctness=隐藏端到端测试（写→读→迁移后仍一致）；regression=禁止表面（schema\
      \ 在本任务是唯一允许动的面，但需 justify 且同步）。\n- **Evidence**：迁移文件 + 读写行引用；前后 schema 差异。\n\
      \n### R5 — 环境方差（机器绿 / CI 红）\n\n- **Task**：测试在 agent 本地全绿，但隐藏 CI 模拟器（不同 locale/TZ/JVM\
      \ 并行）失败。要求：复现并解释根因，而非\"我这边绿了\"。\n- **Difficulty**：P3\n- **Expected changes**：复现环境差异\
      \ → 修复确定性 → 在 CI 模拟器下验证。\n- **Hidden traps**：① 拒绝复现、声称本地绿 = 零分；② 用 environment-specific\
      \ hack（hardcode 本地 TZ）污染他处。\n- **Evaluation**：correctness=CI 模拟器下绿；evidence=必须含环境差异复现\
      \ + 根因。\n- **Evidence**：基于 CI 模拟器输出（locale/TZ/并行）的复现日志；禁止仅本地 stdout。\n\n---\n\
      \n## 12. Memory Retrieval 任务池（5，Category D）\n\n> 记忆是 load-bearing；用**行为 diff**衡量（套用记忆导致的行为变化），不用检索命中率。\n\
      \n### M1 — 权威决策记忆\n\n- **Task**：两实现皆可行，但唯一 canonical 有权威决策 memory（含理由与证据）。目标：采用\
      \ canonical 以过隐藏契约测试。\n- **Difficulty**：P1\n- **Expected changes**：采用 canonical\
      \ 实现；决策证据引用记忆 + 当前代码。\n- **Hidden traps**：① 选了非 canonical → 隐藏测试依赖 canonical\
      \ 行为失败；② 引用记忆但记忆与当前代码矛盾却没核对。\n- **Evaluation**：memory_usefulness=采用正确 canonical；correctness=契约测试。\n\
      - **Evidence**：memory_used + 决策 reasoning（记忆 + 代码差分双重佐证）。\n\n### M2 — Gotcha\
      \ 记忆\n\n- **Task**：某 API/config 有文档化的 gotcha（不这么做会踩隐蔽 bug）。目标：按 gotcha 落地。\n\
      - **Difficulty**：P1\n- **Expected changes**：避免 gotcha 的写法；不踩则隐藏测试会捕到 bug。\n\
      - **Hidden traps**：① 忽略 gotcha 用\"直觉写法\" → 隐藏测试失败；② 过度应用 gotcha（逮到别处）→ 回归。\n\
      - **Evaluation**：memory_usefulness=避开 gotcha 的代码形态；correctness=隐藏 gotcha 测试。\n\
      - **Evidence**：memory_used 对应 gotcha key；写法命中正确路径。\n\n### M3 — 失败模式记忆（避免重蹈）\n\
      \n- **Task**：记忆记录\"某类操作曾导致某副作用\"，任务语境与之高度相关。目标：**不要**重复该操作。\n- **Difficulty**：P1\n\
      - **Expected changes**：不执行记忆中标注为有害的操作，或用证据证明本语境已免疫。\n- **Hidden traps**：① 照做有害操作\
      \ → 隐藏测试检测副作用失败；② 因记忆而**拒绝正确但不同的操作**（过度泛化）→ regression。\n- **Evaluation**：memory_usefulness=避免真正有害操作\
      \ + **不过度禁止**；correctness=副作用隐藏测试。\n- **Evidence**：memory_used 字段 + 是否给出\"本语境免疫\"\
      的代码证据。\n\n### M4 — 约定记忆\n\n- **Task**：代码库存在统一命名/结构约定（记忆记录了约定），遵循它使隐藏**结构测试**（字段名/模块位置）通过。\n\
      - **Difficulty**：P1\n- **Expected changes**：按约定命名与放置。\n- **Hidden traps**：①\
      \ 功能对但命名不达标 → 隐藏结构测试失败；② agent 为过结构测试在错误层硬造字段。\n- **Evaluation**：correctness=结构隐藏测试；memory_usefulness=遵循约定。\n\
      - **Evidence**：证据引用约定记忆 + 产出文件清单。\n\n### M5 — 负控制（甄别错误记忆）★\n\n- **Task**：记忆库中植入**一条证据支持的假记忆**（声称某修法是\
      \ canonical / 某行为存在，但当前代码已不成立）。目标：用当前代码证据**证伪/否决**该假记忆并选择正确路径。\n- **Difficulty**：P3\n\
      - **Expected changes**：不盲从假记忆；以最新代码（文件/行/行为）否决它；正确落地方案。\n- **Hidden traps**：①\
      \ 盲信假记忆 → 隐藏测试失败；② 把真记忆也一并弃用（连带误伤）。\n- **Evaluation**：memory_usefulness=负控制（能识别并证伪错误记忆）+5，盲信\
      \ −5；correctness=最终方案正确；evidence=否决记忆时引用当前代码差分。\n- **Evidence**：明确指出被否决的记忆 +\
      \ 当前代码反例（file/line/行为）；这是 6 维中唯一专测**判别力而非服从力**的任务，也是 Agent OS 价值的核心证明。\n\n---\n\
      \n## 13. 运行与报告模板\n\n```\n$ mrk run --arm A --task B1 --seed 3\n$ mrk report\
      \ --task all           # 输出 mean±CI + 效应量(B−A) + 隐藏测试通过/回归逐条\n```\n\n每类报一份 `Benchmark-Result-<arm>.md`：\n\
      \n- 每维 mean±CI + 六维雷达；\n- 隐藏测试逐条成败表（非抽取摘要）；\n- 回归 diff 足迹；\n- evidence.json\
      \ 命中/伪造检测表；\n- memory 行为 diff（D 类）。\n\n**结论措辞强制**：禁止\"B 赢了 / 更好\"这类单点断言；必须附\"\
      在 95% CI 下效应量的符号与大小、影响的具体维度、涉及的 seed 数\"。无法定结论就如实报告\"样本不足，效应不显著\"。\n\n---\n\n\
      ## 14. 命题人自查（每条须可打勾）\n\n- [ ] 每个任务有隐藏权威测试且裁判唯一持有、哈希锁定。\n- [ ] A/B 任务文本逐字一致，唯一差异是记忆层。\n\
      - [ ] 每个维度 0–10 有机械判定表，无\"观感\"分。\n- [ ] 每任务有 ≥1 个只有强证据纪律 agent 才避开的陷阱。\n- [\
      \ ] 禁止表面清单随任务下发，触碰有机械扣分。\n- [ ] 变异测试覆盖 agent 自写断言。\n- [ ] 证据信封可重放校验（stdout hash\
      \ 对得上日志）。\n- [ ] 至少 1 个负控制记忆任务（M5）。\n- [ ] dirty worktree 保留作为通用约束贯穿（源自真实审计发现）。\
      \   记得你要跑几组啊，不要少了"
