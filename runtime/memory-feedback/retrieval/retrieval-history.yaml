    task_text: "# Phase 13.5 Architecture Audit — Candidate Ranking Router 的 F3/F5\
      \ 残留\n\n> 角色：首席架构审计师。**不提供代码 patch、不改 runtime、不降 benchmark 标准。** 纯架构分析。\n> 分析输入：Phase13\
