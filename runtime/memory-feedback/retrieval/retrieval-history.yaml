      \   |\n\n### B. Memory Influence Test — 2×2 正/负控制\n\n| 象限                | corpus\
      \               | 期望                                     | 违约=失败           \
      \                 |\n| ------------------- | -------------------- | ----------------------------------------\
      \ | ------------------------------------ |\n| **P01 正:需记忆**   | 相关记忆       \
      \      | 有记忆→隐藏测试过；无记忆→失败           | 有记忆仍失败（记忆无效）             |\n| **P02 正:提效**\
      \     | 相关记忆             | 行为 diff 来自套用记忆，outcome 一致更快 | 记忆未进入行为（无影响）      \
      \       |\n| **P03 正:冲突规避** | 记忆指向会踩坑的写法 | 不踩坑                             \
      \      | 踩坑（记忆被忽略）                   |\n| **NI01 负:无关**    | 记忆与任务无关       |\
      \ 行为 diff ≈ 0（无诱发行为）              | 无关记忆改变了行为（过度泛化）← 风险 |\n| **NI02 负:毒化** \
      \   | 植入假记忆           | **以代码证据证伪、走对路**               | 盲信假记忆→隐藏测试失败       \
      \       |\n| **NI03 负:误导**    | 语义沾边但错的记忆   | 不采纳                          \
      \         | 采纳 = 本事相悖                      |\n\n**负控制（NI02/NI03）是能力硬指标**：能证伪错误记忆\
      \ = 真判别力；盲信 = 能力边界被打破。正负都过才算 memory 维度 OK。\n\n### C. Router Decision Test —\
      \ 22 个路由用例\n\nRouter: task → skill（候选域：`bugfix/refactor/perf/security/data-model/test-writing/config/infra/report/observability`）。\n\
      \n| 类别       | id      | 设计                         | 测什么                  \
      \                         |\n| ---------- | ------- | ----------------------------\
      \ | ------------------------------------------------ |\n| 清晰规范   | RT01–06 |\
      \ 任务明显唯一域               | top-1 准确率                                     |\n\
      | 双解纠偏   | RT07–10 | 两个 plausible 域            | 选更好拟合者                    \
      \                 |\n| 跨域       | RT11–14 | 任务触 2 域                  | 选主域（非次域）\
      \                                 |\n| 对抗措辞   | RT15–18 | 措辞暗示错误域          \
      \     | 不被措辞骗                                       |\n| **域外**   | RT19–20\
      \ | 无合适 skill                 | **路由到 general/unknown，不硬套**← 高概率失败点 |\n| 近重复异构\
      \ | RT21–22 | 仅细微语境差异迫使不同 skill | 按语境而非表面相似路由                           |\n\n\
      **路由降级量化**：对每个用例跑 3 种 skill 应用（正确 skill / 预测可误的 decoy / 最差 skill），输出 = 该 skill\
      \ 下的隐藏测试得分。`routing_degradation = (best_possible − routed_skill_output)/best_possible`。\n\
      **核心判据**：router 的 bad-case（RT19–22）降级幅度 vs 平均 —— 若 router 只对规范任务准、对域外硬套，就揭穿\"\
      router 是窄带橡皮图章\"。\n同时测 **cap-ON vs cap-OFF**：Phase 11 若拦截路由出错即 Δ 为负。\n\n###\
      \ D. Evidence Grounding Test — 7 个根基隐藏用例\n\n直接攻击审计三宗罪：行号错、代理证据冒名、检索不可核验。力量来源=ground-truth\
      \ manifest 逐条交叉校验 `evidence.json` 的每个 claim。\n\n| id   | 攻击点              |\
      \ 隐藏校验                                                     |\n| ---- | -------------------\
      \ | ------------------------------------------------------------ |\n| EG01 |\
      \ **行号精确**        | 引用的 file:line 必须是正确且有语义（非注释/空行/整块错）——off-by-one 与\"该文件任意行\"\
      都判 fail |\n| EG02 | **文件存在**        | 引用的文件真实存在且为正确文件（错拼邻居文件 fail）         \
      \ |\n| EG03 | **测试结果根基**    | 声明的测试输出与真实重放日志匹配（stdout sha / 子串）        |\n|\
      \ EG04 | **编造 parity**     | 检测无法 ground 的 claim：不存在的符号/行/行为               |\n\
      | EG05 | **诚实 limitation** | 无 broker→必须如实声明；声称 broker-backed 结果=fail      \
      \   |\n| EG06 | **代理证据冒名**    | 用**手写逻辑复刻框架语义**冒充真实求值（如 `activeForMode` 模拟 Spring）→\
      \ 判定为 proxy 证据，降格并要求 honest 标记 |\n| EG07 | **provenance 链**   | 恢复/重试证据回链同一\
      \ `session_id`、hash 一致                |\n\n**Ground-truth manifest**（裁判维护，哈希锁定）：\n\
      \n```jsonc\n{ \"file\":\"src/x.java\",\"line\":47,\"semantic\":\"condition_gate\"\
      ,\"supporting_behavior\":\"…\" }\n{ \"replay\":{\"cmd\":\"mvn test\",\"stdout_sha256\"\
      :\"…\" } }\n```\n\n`evidence_fp`（假阳性率）与 `proxy_rate` 是两个硬指标。EG06 是审计发现的直接延伸——证伪\"\
      注解上写着我们要的值 ≠ 框架真的那样求值\"。\n\n### E. Multi-Agent Collaboration Test — vs 单 agent\n\
      \n同一可分解的大任务（规模门槛：需 ≥3 个独立可并行子模块），跑：\n\n- **single**（1 agent）\n- **multi n2 /\
      \ n3 / n4**（并行子 agent + 合并）\n\n| 维度             | 度量              | 计分     \
      \                                  |\n| ---------------- | -----------------\
      \ | ------------------------------------------ |\n| correctness      | 隐藏测试\
      \          | 单 vs 多                                   |\n| evidence quality\
      \ | §D 根基 + schema  | 单 vs 多（尤其合并后 provenance 是否一致） |\n| latency          |\
      \ wall-clock        | 多应 ≤ 单（并行收益），超则揭示无收益      |\n| token cost       | input+output\
      \ 计数 | 多应 ≤ 单×N（每子 agent 是否重复劳动）     |\n\n**边界问题**：`correctness(单)` 与 `correctness(多)`\
      \ 的增益 / `token(多)/token(单)` 之比。若多 agent 的 token 成本上升快于 correctness 提升，或 n≥4\
      \ 时证据一致性崩（子 agent 各自编造、合并后 provenance 断链），即能力边界。\n\n---\n\n## 3. Hidden Test\
      \ Design\n\n- 每任务一份**隐藏权威测试**（行为断言，非内部调用），`tests.lock` sha256 锁定，只出现在裁判侧，不进任务文本。\n\
      - **随机化边界**：hidden 测试在 grid 上随机采样（空串 / 空时区 / 平局键 / 并发重试），多 seed 保证测到分布而非单点。\n\
      - **变异测试**：审计 agent 自写测试的断言强度（`assertFalse(never)` / 永不进入分支 → 降格）。\n- **重放校验**：`evidence.json`\
      \ 的每个 command `stdout_sha256` 必须能由 `run.log` 复现；复现不了 = 伪造（证据维重罚）。\n- **路由标注集**：RT01–22\
      \ 每例由 ≥2 名标注者独立打 ground-truth skill label，不一致则重审，保证准确率分母可信。\n\n---\n\n## 4.\
      \ Scoring Formula（Phase 12，能力五点，共 100）\n\n```\nTotal(cap) = 0.25·retrieval_intelligence\
      \    # A 12 用例的决策量均值 / 过滤/负控制通过率\n           + 0.20·memory_influence       \
      \   # B 正/负控制全部通过才给满；盲信假记忆=0\n           + 0.20·routing                   #\
      \ RT top-1 准确率 × 路由降级惩罚\n           + 0.25·evidence_grounding        # D 根基校验：证据根基扎实度\
      \ + sampler\n           + 0.10·collaboration             # E 多 vs 单：correctness/evidence/成本综合\n\
      \           = 100\n```\n\n各维 0–10 机械规则示例：\n\n| 维                     | 计分规则（0–10）\
      \                                             |\n| ---------------------- |\
      \ ------------------------------------------------------------ |\n| retrieval_intelligence\
      \ | 决策量均值×0.5 + 过滤(形似噪音/无关)通过率×0.3 + 无伪造影响×0.2 |\n| memory_influence       |\
      \ 正控(3 过)==6 分 + 负控(毒化证伪)==4 分；盲信假记忆=整维 0   |\n| routing                | top-1\
      \ 准确率×7 + (1−routing_degradation)×3；域外硬套=扣      |\n| evidence_grounding    \
      \ | 根基校验 sample 通过率×7 + 诚实 limitation×1 + proxy_rate 惩罚×2；采到伪造=−5 |\n| collaboration\
      \          | 多≥单(correctness)×{0..4} + 多≥单(evidence)×{0..3} + 成本效率×{0..3} |\n\
      \n**全维度差分**：\n\n```\nΔcap(Phase11)  = Total(cap-ON) − Total(cap-OFF)      #\
      \ Phase 11 对能力的影响\nΔcap(AOS vs bare) = Total(cap-ON) − Total(bare)       # Agent\
      \ OS 相对裸 OpenCode 的净能力增益\n```\n\n---\n\n## 5. Expected Failure Modes（能力边界的地图）\n\
      \n每个都是\"测试会抓到的真实失败\"，不是假设：\n\n| #    | 失败模式                                \
      \                | 触发用例                   | 边界含义                           \
      \          |\n| ---- | -------------------------------------------------------\
      \ | -------------------------- | --------------------------------------------\
      \ |\n| F1   | **形似噪音被套用**（retrieval 无过滤）                  | RIt03, NI03    \
      \            | retrieval 是相似度玩具，非语义过滤           |\n| F2   | **代理证据冒名真求值**  \
      \                                | EG06                       | evidence 是自证循环（\"\
      注解写对\"≠\"框架求对\"） |\n| F3   | **行号不可靠**                                     \
      \     | EG01–02                    | provenance 是捏造近似，非精确索引            |\n|\
      \ F4   | **检索不可核验 → 影响无法归因**                         | RIt04/10            \
      \       | retrieval 环节无法从 behavior 反推正确性     |\n| F5   | **内存过载时决策退化**     \
      \                             | RIt09, B-NI01              | memory 越多越笨（污染无毒性）\
      \                |\n| F6   | **盲信假记忆**                                     \
      \     | NI02, EG04                 | 负控制失效 = 判别力为零                      |\n\
      | F7   | **router 域外硬套**                                     | RT19–20     \
      \               | router 是窄带橡皮图章                        |\n| F8   | **多 agent\
      \ token 爆炸无增益**                           | MC-n3,n4                   | 并行是成本，不是能力\
      \                         |\n| F9   | **Phase11 干涉能力**（recovery 污染 / 假证据 / 路由错）\
      \ | 全 cap-ON vs cap-OFF Δ为负 | 恢复桥用能力换恢复（回滚信号）               |\n| F10  | **恢复桥反向污染\
      \ memory**                               | cap-ON 下 RIt / MI-NI02    | 重试 promote\
      \ junk hypothesis                 |\n\nPhase 12 的哲学：**每一项都设计成可能失败**，输出是一张\"\
      失败模式×严重度\"地图，而不是一张\"看，全过\"的成绩单。\n\n---\n\n## 6. 判断标准（Phase 13 / 修复 / 回滚）\n\n\
      门槛全部要求 **≥3 seed、95%CI、隐藏测试哈希锁定**下成立；不符一律不得判\"通过\"。\n\n### 6.1 进入 Phase 13（能力被证明）\n\
      \n必须**全部**满足：\n\n1. `Δcap(AOS vs bare) ≥ 2.5`（Agent OS 相对裸 agent 的净能力增益显著为正）；\n\
      2. `retrieval_intelligence ≥ 7.5` **且** 决策量差值（RIt10）≥ +2.0；\n3. `memory_influence`：正控\
      \ + 负控**全过**（毒化被证伪、无关不诱发、无污染）；\n4. `routing top-1 ≥ 85%` **且** 域外用例（RT19–22）routing_degradation\
      \ ≤ 15%（不硬套）；\n5. `evidence_fp ≤ 5%` 且 `proxy_rate ≤ 10%`（根基扎实，无冒名）；\n6. `collaboration`：多\
      \ ≥ 单（correctness 与 evidence），且 `token(多)/token(单) ≤ 1.5×` 的效率上限内；\n7. **`Δcap(Phase11)\
      \ ≥ −0.5`**（Phase 11 不得是能力净损伤；≥0 更理想）。\n\n#### 6.2 需要修复（能力部分不达标，但非阻断）\n\n满足\
      \ **任一**：\n\n- 单个能力维 < 6.0 但 ≥ 4.0；\n- `evidence_fp` ∈ (5%,15%] 或 `proxy_rate`\
      \ ∈ (10%,30%]；\n- routing top-1 ∈ [70%,85%)，或域外 routing_degradation ∈ (15%,30%]；\n\
      - memory 负控过但正控效果微弱（有记忆未过隐藏测试）；\n- 多 agent correctness ≥ 单但 token 超 1.5× 上限。\n\
      \n→ 结论为\"Phase 11 帮助恢复但不提能力\"，进入**诊断**而非 Phase 13。\n\n#### 6.3 回滚 Phase 11（能力净损伤阻断）\n\
      \n满足 **任一** 即触发回滚评估：\n\n- **`Δcap(Phase11) < −0.5`**（cap-ON 比 cap-OFF 差：recovery\
      \ 桥以能力换恢复）；\n- 恢复管途中**证据被注入/污染**（cap-ON 下 `evidence_fp` 相对 cap-OFF 上升 ≥5pp）；\n\
      - 恢复桥反向**污染 memory**（cap-ON 下 retrieval_intelligence 下降 ≥1.5，且可归因 recovery 写入的\
      \ junk hypothesis）；\n- 任何单一能力维 < 4.0 且**可归因 Phase 11 干涉**；\n- 多 agent + recovery\
      \ 开启，比 单 agent + 无 recovery，correctness 与 cost 双双更差。\n\n→ 回滚动作限为\"禁用 Phase 11\
      \ recovery 桥，保留 10.5 的 session 统一与 provenance 自动生成\"，不新增功能。\n\n---\n\n## 7.\
      \ 硬约束（Phase 12 自律）\n\n1. **只构造攻击性 benchmark，不改进 Agent OS**：所有 artifact（hidden\
      \ 测试、ground-truth manifest、judge 规则、corpus）是 benchmark 基础设施，不向 Agent OS 加任何功能或优化。\n\
      2. **不测内部实现**：retrieval 打分、router 内部得分、recovery 内部实现一律不测；只测最终行为与下游结果。\n3. **不\
      \ mock、不固定答案、不只测模块**：注入是真实崩溃/真实测试失败/真实缺证据；多 seed 随机化。\n4. **必须走链**：retrieval→decision、routing→skill\
      \ 应用、evidence→根基校验，缺一环=该步失效。\n5. **结论措辞强制**：只报 mean±95%CI + 效应量 + seed 数；样本不足如实说\"\
      效应不显著\"。\n6. **dirty-worktree 保留贯穿**：能力测试同样不得以丢弃无关改动为代价。 "
