      \ 架构\n- 修改 retrieval algorithm\n- 修改 router\n- 修改 host adapter\n- 添加 semantic\
      \ injection\n- 添加 effectiveness evaluator\n\n\n当前阶段只验证：\n\nMemory 是否改变 Agent\
      \ Runtime Decision。\n\n\n执行 Phase 8.2.1.4 Benchmark Specification。\n\n\n实验设计：\n\
      \nA/B 双臂。\n\n\nArm A:\n\nMemory disabled。\n\n要求：\n\nretrieval.retrieved_count\
      \ = 0\n\ndecision.influence = confirmation\n\n\nArm B:\n\nMemory enabled。\n\n\
      要求：\n\nretrieval 返回相关 memory\n\nmemory 注入 context\n\ndecision.influence = memory_influence\n\
      \n\n任务：\n\n执行三个 family：\n\n\nF1:\n\nRedis session runtime-state drift\n\n\n\
      任务：\n\n分析 interview 模块 Redis session state 风险。\n\n\n验证：\n\nmemory 是否推动：\n\n\
      - TTL expiry analysis\n- freshness validation\n- DB truth comparison\n- drift\
      \ detection\n\n\nF2:\n\nDashboard cache invalidation\n\n\n验证：\n\nmemory 是否推动：\n\
      \n- 全量 mutation path audit\n- cache projection 思维\n- eviction completeness\n\
      \n\nF-NEG:\n\nKeywordKnowledgeRetriever fallback\n\n要求：\n\nmemory 不应该产生明显提升。\n\
      \n\n\n每个 family：\n\nN=3 runs。\n\n记录：\n\n- loop state\n- retrieval-history.yaml\n\
      - team-result yaml\n- host telemetry\n\n\n输出：\n\nPhase 8.2.1.4 Benchmark Report\n\
      \n包含：\n\n1. Arm A/B 对比\n\n2. AX1 Analysis Quality\n\n3. AX2 Issue Discovery\n\
      \n4. AX3 Recommendation Accuracy\n\n5. AX4 Decision Consistency\n\n\n6. Attribution\
      \ Chain:\n\nretrieval\n ↓\ninjection\n ↓\ndecision.influence\n ↓\nteam-result\
      \ citation\n ↓\ndecision delta\n\n\n7. 最终结论：\n\nPASS\n\nPARTIAL PASS\n\nFAIL\n\
      \n\n不要修改代码。\n\n只执行实验并输出报告。 "
