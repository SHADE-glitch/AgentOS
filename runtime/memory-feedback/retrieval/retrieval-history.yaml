      \ +0.559 / Cohen d 1.42 / 无回归 / Failure Map 25/70 F3+F5）。\n> 注：本人即 Phase 13.2\
      \ 攻击任务与 Phase13.1 回归任务的作者，对 25/70 的失败样本有一手构造上下文，据此做归因而非只看汇总数字。\n\n---\n\n##\
      \ 1. Failure Taxonomy（25/70）\n\n| 失败簇                                      \
      \                 | 命中示例（我的任务集）                                       | 表象 \
      \                               | 深层                                       \
      \                  |\n| ------------------------------------------------------------\
      \ | ------------------------------------------------------------ | -----------------------------------\
      \ | ------------------------------------------------------------ |\n| **F3 generic-lure**\
      \                                          | B1「AI model wrapper，其实 backend\
      \ handler 坏了」；B2「database fine，其实 architecture 决策错」；B7「perf-tune cache，其实 auth\
      \ leaking」；B8「ai tokens，其实 column mapping」；B16「manage-and-support 叙事，真 backup\
      \ cron」 | 词表里有，语义上没有                | router 在**表层 token 空间**匹配到诱饵域，缺\"哪个 token\
      \ 是语义中心 / 哪个是诱饵\"的判别 |\n| **F5 volume / keyword-bias**                     \
      \            | B4「error×vol + config yaml」；B13「test…fixture，真 cache slowness」；B10「fix\
      \ 先行，真 migration」；A16/A17「index keyword 但 want organized」；A18 长上下文污染 | 高词次 /\
      \ 高 IDF 罕见词 / 首词域主导 | 打分把**出现次数/罕见度/顺序**当显著性，而这些都不是语义显著性 |\n| 其余（A1–A15 新域/模糊/无关键词、C/D\
      \ validator/recovery、E 守卫） | 未在 25 之列 → 已由 upgrade 修复或为能力边界                \
      \ | —                                   | —                                \
      \                            |\n\n**关键数字解读**（这是诊断的核心证据）：\n\n- `routing 0.573\
      \ → 0.647`（Δ+0.074，**gain 很小**）但 `cap-ON vs cap-OFF +0.559, Cohen d 1.42`（效应**极大**），且无回归。两者合读的签名是：**升级把\"\
      决策机制\"从一票总览升级为 rank-and-select，Agent OS 上下文（cap-ON）带来巨大增益——但\"routing 本身的词汇性能接近\
      \ 0.647 的平台\"**。这意味着改善已转移到决策层，而**剩余 25/70 F3/F5 卡在特征层，非决策层**。平台即证据：再在 keyword\
      \ 上做决策调优，收益在趋零。\n\n---\n\n## 2. Root Cause 与问题分类\n\n### 2.1 为什么 ranking 仍解不了\
      \ F3/F5\n\n**根因是表征（representation）而非策略（policy）。**\ncandidate-ranking 升级改的是\"\
      如何选\"（从首个正则命中 → 对上一组候选打分的取最佳），**没改\"拿什么特征打分\"。** 打分仍在 token/keyword/IDF 的**词形空间**上进行。而\
      \ F3/F5 之所以会错，恰恰是因为解决它们所需的信号**根本不在这个词形特征里**：\n\n- **F3（generic-lure）**：要对\"\
      `ai model` 是诱饵、`backend handler broken` 是意图\"做判断，需要知道这两个短语在**本句中的语义显著性**之差。IDF\
      \ 只能给\"model 常见所以降权\"，却无法知道\"本句中 AI 词是叙述性外皮，backend 词才是承载意图的内核\"。这个是**语义 gap，不是权重缺陷**——再调\
      \ IDF/keyword 重也表达不了。\n- **F5（volume / keyword-bias）**：把\"出现次数 / 罕见度 / 出现顺序\"\
      当作显著性，本质是把**统计表面**误当**语义重**。次数多≠重要（B13 里 test 出现 7 次也不如 1 次 cache slowness）；罕见≠相关（prometheus\
      \ 词频低却无关）；先出现≠意图中心（B10 fix 先行而 bulk 是 migration）。\n\n一句话：**ranking 在同一词形特征空间上重排，无法修复\"\
      特征空间压根不含语义信息\"这个问题。** 平台 0.647 就是这个词形空间的天花板。\n\n### 2.2 分类结论（A–E）\n\n| 层   \
      \                        | 判定                 | 依据                         \
      \                                |\n| ---------------------------- | --------------------\
      \ | ------------------------------------------------------------ |\n| **A router\
      \ scoring**         | **表观层（症状）**   | volume/IDF 误算、置信失真都发生在 score 层；但它只是**下游承载点**，不是根因。修\
      \ A（加 caps、反惩罚、重校准）能缓解 F5 边角，**解不了 F3**——因为 F3 需要的语义显著性在评分输入里就缺失 |\n| **B skill\
      \ registry**         | **次要贡献者**       | 扁平 keyword 词表缺意图/支撑/域层次与互斥结构。部分 F3\
      \ 可由 registry 设计缓解（给 \"ai/learning/training/test\" 标\"歧义域\"），但 registry 无法裁决\"\
      哪个提及是意图\" |\n| **C missing semantic layer** | **★根因**            | F3 与 F5 都是\"\
      **词形特征空间不承载语义**\"的表现。两个症状同源：**表征 gap**。要突破 0.647 平台，必须引入**非词形的语义表示**（candidate\
      \ 与 task 的语义距离），或**一个能读句子的 reader**。这一层缺失是根因 |\n| **D missing planner**    \
      \    | **C 的运载层，触动** | 单意图 task 不需要 whole-planner；但\"Lure vs Intent\"判别 + multi/hybrid\
      \ intent 消解天然落在 planner。D 是 C 的宿主/表现形态，不是独立根因 |\n| **E benchmark**         \
      \     | **次要混淆，非根因** | 我承认：部分 A/B 任务编码了\"特权解读\"（凭什么 AI 是诱饵 while backend 是意图）。存在一定标注任意性。**但**：F3\
      \ 任务大多含\"actually / the real ask is / what they need is\"这类明确的**消歧标记**——LLM\
      \ reader/planner 能吸收这些标记，keyword router 的结构性吃不到。因此任务是公平的，E 只是轻飘飘的混淆项，不是根因 |\n\
      \n**最终分类：Primary = C（缺语义层）；症状承载 = A；贡献/运载 = B、D；轻混淆 = E。** 结论弹簧是：单靠 A（增强 keyword/IDF）无法根治，因为问题在特征空间入口而非打分策略。\n\
      \n---\n\n## 3. 下一代 Routing Architecture 方案比较\n\n四种开放架构选项，按五轴评估。**评审原则**：证据与下游（loop_controller\
      \ / skill_loader / evidence / recovery）兼容是硬约束；低延迟/成本为软约束。\n\n### 方案 A：继续增强 keyword/IDF（原位调参）\n\
      \n- **成本**：低（无新依赖/无新 infra）。\n- **延迟**：≈0 增量。\n- **稳定性**：**低**——手工 IDF/权重对 seed\
      \ 与任务集敏感，同义替换（seed2）flip 依旧。F3 不解、永远打地鼠。\n- **可解释性**：高（每个 token→权重可见），但属**事后合理化**，非真解释。\n\
      - **evidence 兼容**：高（routing artifact 字段不变，消费方零改动）。\n- **对 F3/F5**：缓解 F5 边角（volume\
      \ cap / 罕见词惩罚），**不动 F3 根**。\n- **判定**：这是 0.647 平台所在的轴；已证明收益趋零。**不作为主方向。**\n\n\
      ### 方案 B：embedding semantic router（on-prem 小模型）\n\n- **成本**：中——需 embedding 推理\
      \ + skill 原型索引（由 skill desc + exemplar 嵌入），registry 变更需重嵌。\n- **延迟**：中——每 task\
      \ 约 10–50 ms embedding + 10–30 skill 余弦；可缓存。\n- **稳定性**：中。对 lure 明显更好（task 与\
      \ skill 描述/原型中心的语义距离），但：原型构造质量敏感、对抗措辞可能骗过 embedding、需保证 embedding 确定性才能 seed\
      \ 稳定。\n- **可解释性**：低——余弦相似度不透明，需\"距离最近原型\"做近似解释。\n- **evidence 兼容**：好——仍出 scores/confidence；但\
      \ provenance 从\"token 权重\"变为\"原型距离\"，**需新增证据字段**，消费方须接受非词形证据。\n- **对 F3/F5**：**直解\
      \ F3**（捕获语义中心）；F5 基本免疫（embedding 空间无 volume 概念），但对原型污染敏感。\n- **判定**：**无 LLM\
      \ 的可选方案**，ROI 高，但可解释性与证据字段变更需配套。\n\n### 方案 C：LLM planner router\n\n- **成本**：**高**——每次\
      \ task 一次 LLM 推理，token 成本线性；需模型访问、prompting、异步/缓存 infra。\n- **延迟**：**高**——0.5–3s+/task，高吞吐场景不可接受；需\
      \ batching。\n- **稳定性**：中——LLM 非确定；需 temp=0 + 受约束解码（JSON schema / function-call）才能逼近\
      \ seed 稳定。\n- **可解释性**：**高（唯一能自述理由）**——\"我选 bugfix，因为 backend handler broken\
      \ 是操作性子句，而 ai model 是叙述外皮，非诉求\"。\n- **evidence 兼容**：中——可经受约束 JSON 输出 routing\
      \ artifact（schema 兼容），但 scores 不再是校准概率需显式置信门；且 LLM 的 salience 理由**必须 root 到真实\
      \ token**，validator 须校验\"引用的词确实在 task 里\"，否则幻觉。**增强了对 grounding 的负担。**\n- **对\
      \ F3/F5**：**全解**（读 intent、识别 lure、免疫 volume），但引入 LLM 自身偏差/成本/非确定。\n- **判定**：能力最全，但全量每任务走\
      \ LLM 在成本/延迟/稳定性上不可持续。\n\n### 方案 D：Hybrid Router + Confidence Gate + Planner（快慢双通道）\n\
      \n- **成本**：**低-中**——**只在置信门放行到 planner 的比率上付 LLM**（F3/F5 恰落在低置信/歧义群体，占比有限），中位数成本低，拓扑复用。\n\
      - **延迟**：**低中位数**（快通道 keyword/embedding）+ 高尾（escalate）——可接受，因为硬任务本就该花更多。\n-\
      \ **稳定性**：**最优**——快通道确定性；escalate 段 temp=0 + 约束解码；seed 稳定性由\"确定性任务永远走确定性通道\"\
      保证。\n- **可解释性**：混合——快通道分数 + 被升级任务的 LLM salience 理由；两者都可作证据。\n- **evidence 兼容**：**最优**——routing\
      \ artifact 保留，**新增可选字段** `route_mode`(lexical|embedding|planner) + `escalation_reason`；既有字段不变，消费方向后兼容；`escalation_reason`\
      \ 复用 fallback_reason 枚举（`domain_unrecognized/partial_known/ambiguous/low_separation/low_confidence`）以免\
      \ recovery 解析断裂。Provenance：快=token 分数，escalate=grounded 到真实 token 的 salience\
      \ 理由。\n- **对 F3/F5**：F5 被置信门化解（volume/IDF 失真产生**真实低置信**→escalate→planner 消歧）；F3\
      \ 在 escalate 段被解；便宜任务留在便宜段。\n- **判定**：**综合最优。** 把 router 自己的弱点（低置信）变成路由决策的**组织原语**——这同时翻修了\
      \ Phase12.5 F2\"low-confidence 无降级\"。\n\n### 五轴总表\n\n|               | A keyword\
      \ 调参 | B embedding    | C LLM planner    | **D hybrid+gate+planner** |\n| -------------\
      \ | -------------- | -------------- | ---------------- | -------------------------\
      \ |\n| 成本          | 低             | 中             | 高               | **低-中（escale\
      \ 段付）**  |\n| 延迟          | ≈0             | 10–50ms        | 0.5–3s       \
      \    | **低中位 + 高尾**         |\n| 稳定性        | 低             | 中            \
      \ | 中(需 temp=0)    | **最优**                  |\n| 可解释性      | 高(事后)       |\
      \ 低             | 高(可自述)       | **快：分数+升：理由**     |\n| evidence 兼容 | 高    \
      \         | 中(新证据字段) | 中(需 grounding) | **高(向后兼容+可选字段)** |\n| F3           \
      \ | ✗              | ✓              | ✓✓               | **✓(escalate 段)** \
      \       |\n| F5            | △边角          | ✓              | ✓✓            \
      \   | **✓**                     |\n\n### 推荐\n\n**Phase 14 主方案 = D**：保留 Phase13\
      \ keyword fast-path（其 0.647 已到平台，作为便宜基线即可），**把低置信/歧义/多意图群体的尾部，用一个语义 reader（B\
      \ 的 embedding 或 C 的轻量 planner）做 escalate。** 架构原语是**置信门**：路由器不再\"永远自己一锤定音\"，而是\"\
      高置信自己定，否则交给更强的 reader\"。这既突破特征平台，又不上 LLM 全量成本。\n\n- 若组织不允许 LLM：尸 **D-variant（B\
      \ 作 fast path 语义过滤 + 置信门 + 无 planner）**，同样能在不上 LLM 的前提下补 F3 大部分。\n- 若允许轻量 LLM：尸\
      \ **D 原版**，planner 只用于 escalate 尾部，成本可控。\n\n---\n\n## 4. Phase 14 决策\n\n**结论：建议进入\
      \ Phase 14，范围限定为\"Hybrid Router + Confidence Gate + Planner / 语义 Reader\"（方案\
      \ D 或其 B-gate 变体），不做方案 A（keyword 继续调参）。**\n\n**理由（证据链）**：\n\n1. **0.647 平台 +\
      \ d=1.42 + 25/70 F3/F5** 三合一证明：升级在决策层已充分（d 极大、无回归），余量在特征层；再在 keyword 上调 = 浪费，且解不了\
      \ F3 根。\n2. **F3/F5 恰是低置信/歧义群体**——置信门的退化目标是错的，升级目标是对的：把 router 的弱置信尾部交给更强的 reader。\n\
      3. **进入标准 = 目标退化可测**：\n   - Phase 14 门：routing 突破 0.647 平台（目标 ≥0.80）且 **E 守卫（E1–E10）零回归**（回归\
      \ → 停止并回滚）。\n   - 证据：escalate 段新增 `route_mode`/`escalation_reason` 证据字段；planner\
      \ 的 salience 理由**必须 grounded 到 task 真实 token**，validator 校验，防止 LLM 幻觉证据。\n \
      \  - cap-ON vs cap-OFF 在 escalate 段的 Δ 必须为正（不带 Agent OS 的 escalate 不得更好）——否则\
      \ escalate 是花销不是能力。\n4. **Phase 14 附带验证**：翻修 Phase12.5 F2（low-confidence 无降级）——置信门让\
      \ low-conf 从\"降级/放弃\"变成\"escalate\"，是把原有缺陷转成能力，需单独测 D3/D4/C10/C11 守卫。\n\n**不加分项（明确不作为\
      \ Phase 14 输入）**：方案 A 不做主方向；方案 C 不全量。禁止项重申：不改 runtime、不提供 patch、不降 benchmark\
      \ 标准；任何 Phase 14 落地都必须以本 audit 的对象（最终工程能力 + 回归守卫）为验收，而非以\"routing 数字好看\"为验收。\n\
      \n---\n\n*审计完。本文件为分析、决策与基准门，不含任何源代码 patch。*   agent os文件夹:~/.agents"
