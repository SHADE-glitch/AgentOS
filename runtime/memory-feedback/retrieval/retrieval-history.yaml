- timestamp: '2026-09-05T01:47:08.163244+00:00'
  query:
    task_text: '# OpenCode Execution Prompts — batch-2026-09-05


      Purpose: the batch operator feeds the prompts below to OpenCode one task at
      a time (Agent OS is frozen and treated as infrastructure).

      How to run: start OpenCode in the task''s worktree directory (`/home/shade/Public/aiview-runs/batch-2026-09-05/TASK-PO-xx`),
      paste the

      [General Prefix] followed by the [Task Content] for that task, and nothing else.
      Do not give OpenCode any file paths, root causes,

      judging criteria, or Agent OS information beyond this prompt.


      ---


      ## General Prefix (prepend to every task)


      You are a senior engineer working on this repository. The repository is an AI
      interview coaching and feedback platform

      (backend: Spring Boot 3.3.5 / Java 21 / MyBatis-Plus / Redis / RabbitMQ / MySQL;
      frontend: Vue3 + TypeScript). Below is a

      real production issue reported by users. Please handle it like an engineering
      task.


      Requirements:


      1. Reproduce and locate the root cause first — by reading code, inspecting data,
      and running tests — and form/validate your engineering hypothesis;

      2. Apply the minimal fix; do not expand the scope of changes;

      3. Add or run reasonable regression tests and make sure the existing test suite
      stays green;

      4. When done, report: your root-cause analysis, the files changed and what changed,
      the tests you ran and their results, and how you verified the fix.


      Environment notes:


      - Backend build requires JDK 21 (the machine default is JDK 17): `export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64`;
      the backend lives in `backend/`.

      - For full-stack verification you can start dependencies with `docker compose
      up -d mysql redis rabbitmq` from the repo root (the ollama service has been
      removed from the repo; ignore it).

      - The frontend is in `frontend/` (Vue3 + TS), with the dev server proxying to
      `http://localhost:8080`.

      - Existing tests: `cd backend && mvn -q test` (must remain green after your
      fix).


      [Task Content]


      ---


      ## PO-11: Deleting chunks from a knowledge base no longer decreases its reported
      chunk count


      User report: after adding a long piece of content to a knowledge base (it gets
      split into multiple chunks) and then deleting some of those chunks, the knowledge
      base list still shows the chunk count from before the deletion — it never decreases.
      After several add/delete cycles the number keeps growing and no longer matches
      the real chunk count.


      Goal: make the reported chunk count stay consistent with the actual number of
      chunks after deletions.


      Verification criteria:


      - After deleting a chunk, the chunk count returned by the knowledge base list
      decreases by exactly one per deletion (never negative).

      - The chunk counting behavior for adding content must not regress.


      ---


      ## PO-12: Answering briefly once ends the interview immediately


      User report: during an interview, if an answer is very short (e.g., just "I
      don''t know" or a few characters), the interview immediately shows as finished
      and moves to the summary before the next question appears. Expected: one occasional
      short answer should not end the interview; early termination should only happen
      after several consecutive short/frivolous answers.


      Goal: fix the termination behavior so a normal interview reaches at least the
      configured number of questions.


      Verification criteria:


      - After a single short answer, the interview continues and the next question
      appears.

      - Reaching the configured question count, or several consecutive short answers,
      still ends the interview normally.


      ---


      ## PO-13: Submitting an answer always fails with "answer must not be empty"


      User report: typing an answer on the interview page and hitting send always
      returns an "answer must not be empty" error; the answer can never be submitted.
      Refreshing and retrying does not help.


      Goal: allow a normal non-empty answer to be submitted and to advance the interview.


      Verification criteria:


      - A normal non-empty answer submits successfully and advances the interview
      flow.

      - A genuinely empty submission still returns a clear parameter error.


      ---


      ## PO-14: The exact same question appears twice in one interview


      User report: during a single interview, the same question (identical text) can
      appear again, and may repeat even more times. Expected: each question appears
      at most once per interview.


      Goal: fix per-interview question deduplication.


      Verification criteria:


      - Within one interview, no question is drawn twice.

      - Topic/difficulty filtering and question-count semantics must not regress.


      ---


      ## PO-15: A user can delete chunks from a knowledge base they do not own


      User report (security test): user A can delete a chunk from user B''s knowledge
      base just by knowing (or guessing) the chunk ID, and B''s statistics are affected
      as well. Expected: a user may only operate on chunks of their own knowledge
      bases; unauthorized operations must be rejected.


      Goal: fix the unauthorized deletion issue.


      Verification criteria:


      - User A deleting a chunk of user B must be rejected, and B''s data must remain
      unchanged.

      - The owner deleting their own chunks still works normally.


      ---


      ## PO-16: Users get forcibly logged out after a while; refreshing the login
      also reports "invalid token"


      User report: after using the app for a while (once the access token expires),
      the automatic token refresh fails, the page kicks the user back to the login
      page, and manually calling the refresh endpoint also returns "invalid token"
      — even when using a just-issued, valid refresh token.


      Goal: make valid refresh tokens renew properly.


      Verification criteria:


      - Calling the refresh endpoint with a valid refresh token returns new tokens.

      - Forged/expired/wrong-type tokens are still rejected.


      ---


      ## PO-17: Selecting junior/senior difficulty still draws only medium-difficulty
      questions


      User report: when creating an interview, no matter whether "Junior" or "Senior"
      is selected, the questions drawn are all medium difficulty (e.g., a junior beginner
      gets HashMap internals and generics-erasure questions). The page shows the selected
      level correctly, but the actual question difficulty does not match the selection.


      Goal: make the drawn question difficulty match the selected level.


      Verification criteria:


      - Selecting junior/medium/senior draws questions with difficulty 1/2/3 respectively.

      - The level recorded on the session matches the user''s selection.


      ---


      ## PO-18: Validation failures return 500 instead of a clear 400 parameter error


      User report (integration testing): when required parameters are missing (e.g.,
      creating an interview without a topic), the backend returns 500 Internal Server
      Error instead of the expected 400 validation failure, so the client cannot show
      a friendly "parameter missing" message.


      Goal: make validation-failed requests return a clear 4xx parameter-error response.


      Verification criteria:


      - Missing required parameters return 400 with a clear parameter-error message.

      - Other error semantics (business errors, 500s, etc.) must not regress.


      ---


      ## PO-19: Under default deployment, an interview never produces a score result


      User report: on a fresh machine, starting the whole stack the default way (no
      extra environment variables), the Q&A flow works perfectly, but after the interview
      ends and the page shows "AI is scoring…", it stays there forever — refreshing
      repeatedly never shows a score report or result.


      Goal: make the default deployment produce score results after an interview finishes.


      Verification criteria:


      - Under the default configuration, a finished interview produces a score result
      (score/dimensions/report).

      - The existing semantics of explicitly enabling AI scoring mode must not regress.


      ---


      ## PO-20: Register/login endpoints all return 500; logs mention a missing database
      table


      User report: after a recent deployment, register and login both return 500,
      and the backend logs show a clear SQL error about a table that does not exist,
      while other features (e.g., viewing the topic list) work fine.


      Goal: restore register/login to normal operation.


      Verification criteria:


      - Register, login, and fetching the current user all work again.

      - Database schema and code mappings are consistent, with no similar omissions.


      ---


      ## Operator notes (for you — do not paste to OpenCode)


      - Run each task in its own worktree; do not copy code across worktrees.

      - The task IDs (PO-xx) are for observation records only; do not explain them
      to OpenCode.

      - Do not give OpenCode: affected files, root causes, fix approaches, judging
      criteria, or anything about Agent OS.

      - After a run, save: the worktree''s final diff, test output, session/loop identity,
      then judge per judge-only/validation.json. '
