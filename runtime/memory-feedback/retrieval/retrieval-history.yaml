  query:
    task_text: "你是 Agent OS Runtime Host。\n\n目标：\n验证当前 ~/.agents 是否已经具备真实多 Agent Runtime\
      \ 能力。\n\n测试任务：\n\n# Task Card\n\n## Background\nThe project at /home/shade/Public/test\
      \ is a real full-stack AI interview platform with a Java Spring Boot backend\
      \ and a Vue frontend. It includes:\n- auth/security\n- interview state and scoring\n\
      - AI client integration\n- RAG/knowledge retrieval\n- Redis, RabbitMQ, MySQL\
      \ usage\n- multi-module backend structure under /home/shade/Public/test/backend\n\
      \nThis is not a toy app. It is a realistic application where failures emerge\
      \ from the interaction between authentication, interview state, AI evaluation,\
      \ and persistence rather than from isolated code generation.\n\nThe pressure\
      \ test is designed to expose whether an Agent OS can truly orchestrate a multi-agent\
      \ runtime investigation across real code, rather than simply producing a textual\
      \ recommendation.\n\n## Initial State\n- The application has a real backend\
      \ under /home/shade/Public/test/backend with Java modules such as auth, interview,\
      \ rag, and agent.\n- Frontend exists under /home/shade/Public/test/frontend\
      \ and interacts with the backend APIs.\n- There are multiple crossing concerns:\n\
      \  - session continuity\n  - JWT auth flow\n  - state handoff between interview\
      \ lifecycle and result persistence\n  - AI tool calls / LLM client integration\n\
      \  - backend caching and message queueing\n- Symptoms observed in production-like\
      \ staging:\n  - interview sessions occasionally resume with stale state\n  -\
      \ duplicate or inconsistent result records occasionally appear\n  - auth state\
      \ and interview state sometimes diverge after retries/timeouts\n  - AI evaluation\
      \ may generate results that do not match the current session context\n- No single\
      \ root-cause hypothesis is trusted yet. The issue spans multiple modules and\
      \ execution boundaries.\n\n## Expected Agent OS Behavior\nThe Agent OS must\
      \ behave as a real runtime system, not as a single LLM “advisor.”\n\nRequired\
      \ behavior:\n- Router identifies the issue as a cross-module backend/runtime\
      \ investigation, not a generic feature task.\n- Orchestrator breaks the issue\
      \ into parallel tracks:\n  - auth/session integrity\n  - interview state transitions\n\
      \  - AI evaluation and tool invocation path\n  - persistence and eventual consistency\n\
      \  - frontend/backend contract boundary\n- Scheduler assigns work across multiple\
      \ specialized agents with time-bound execution windows.\n- Collaboration Runtime\
      \ allows multiple agents to work in parallel with synchronized observations.\n\
      - Agent Execution runs against the real repository, reading actual code and\
      \ validating hypotheses against code paths.\n- Aggregator consolidates agent\
      \ outputs into a single diagnostic narrative and evidence set.\n- Memory Lifecycle\
      \ records what was learned in one phase and reuses it when hypotheses change.\n\
      \nThis task should force the system to:\n- reason across modules\n- revisit\
      \ dead ends without losing context\n- coordinate team work effectively\n- maintain\
      \ traceable findings through multiple rounds of analysis\n\n## Required Skills\n\
      - Router\n- Orchestrator\n- Scheduler\n- Collaboration Runtime\n- Agent Execution\n\
      - Aggregator\n- Memory Lifecycle\n- Java backend analysis\n- Spring Security/JWT\
      \ analysis\n- MyBatis/MySQL persistence reasoning\n- Redis/RabbitMQ integration\
      \ reasoning\n- AI client / tool-call tracing\n- frontend-backend contract validation\n\
      - real codebase investigation and evidence gathering\n\n## Expected Team\nA\
      \ realistic team for this task should include:\n- Trae: system architect and\
      \ auditor\n- OpenCode: runtime host and live executor\n- Backend Debugger: sequence\
      \ and service flow analysis\n- Security/Auth Specialist: JWT/session integrity\
      \ and authorization issues\n- Persistence Specialist: MyBatis, transaction,\
      \ state persistence, duplicate writes\n- AI/Agent Specialist: LLM client, tool\
      \ call, session context correctness\n- Frontend/Integration Specialist: API\
      \ contracts and user-visible state\n- Auditor: verifies evidence, constraints,\
      \ and final findings\n\nThe important point is not team names alone, but that\
      \ the system must form a meaningful multi-agent team based on real failure domains.\n\
      \n## Validation Criteria\nThe task passes only if the Agent OS demonstrates\
      \ all of the following:\n- It routes the problem correctly as a real runtime\
      \ debugging task\n- It forms a team with relevant specialized agents\n- It executes\
      \ code analysis on the actual project structure\n- It produces real runtime\
      \ evidence from the project, not pure conceptual discussion\n- It uses memory\
      \ to refine hypotheses across phases\n- It coordinates work across multiple\
      \ subsystems instead of a single monolithic analysis\n- It identifies likely\
      \ root-cause candidates with evidence from code and architecture\n- It produces\
      \ a final result that is traceable to code paths, system behavior, and runtime\
      \ observations\n- It differentiates between symptoms, hypotheses, and confirmed\
      \ findings\n\n## Failure Signals\nThe Agent OS fails this test if:\n- Router\
      \ is bypassed or the task is treated as a generic coding request\n- Orchestrator\
      \ does not split the investigation into parallel workstreams\n- Team formation\
      \ is superficial or irrelevant to the actual problem\n- Agents act in isolation\
      \ without shared context or memory\n- The system cannot explain cross-module\
      \ interactions\n- It proposes fixes without evidence\n- It does not revisit\
      \ prior findings after new evidence appears\n- It remains at the level of abstraction\
      \ and never inspects the real code\n- It cannot produce structured runtime outputs\
      \ or audit trails\n- It treats the problem as “conversation quality” rather\
      \ than execution quality\n\nThis task is intentionally designed to validate\
      \ whether the Agent OS truly works as a runtime, collaborative engineering system\
      \ rather than a single-agent chat wrapper.\n\n目标项目：\n\n/home/shade/Public/test\n\
      \n\n执行要求：\n\n1. 必须从 Agent OS 主入口启动。\n\n禁止：\n- 手动调用 Router\n- 手动调用 Orchestrator\n\
      - 绕过 loop_controller\n\n\n必须记录完整链路：\n\nRouter\nDecisionContext\nMemory Retrieval\n\
      Skill Routing\nOrchestrator\nTeamPlan\nTaskDecomposer\nScheduler\nAgent Execution\n\
      Aggregator\nMemory Lifecycle\n\n\n验证：\n\n1. 是否真实形成多 Agent Team\n2. 是否真实执行 TaskCard\n\
      3. 是否读取真实项目代码\n4. 是否产生代码证据\n5. 是否生成 Execution Trace\n6. 是否生成 TeamResult\n7.\
      \ 是否产生 Memory 更新\n\n\n输出：\n\nRuntime Validation Report:\n\n包括：\n\n- execution-trace\n\
      - team-plan\n- task-cards\n- scheduler result\n- team-result\n- memory changes\n\
      - failures\n- gaps\n\n\n禁止修改：\n\n~/.agents\n/home/shade/Public/test\n\n只验证。 "
