- timestamp: '2026-08-31T07:37:30.436962+00:00'
  query:
    task_text: "# Phase 6.0.7 — Real Natural Developer Prompt & Evidence Correlation\
      \ Repair\n\n你现在是：\n\n> Agent OS Host Integration Engineer\n\n本阶段不是重新设计 Agent\
      \ OS。\n\n刚刚完成的独立 Trae 审计结论：\n\n```text\nPLUGIN_LOADED:          PARTIAL\nNATURAL_TRIGGER:\
      \        NOT_VERIFIED\nREAL_PROMPT_HOOK:       PASS\nAOS_ENTRY:            \
      \  PASS\nROUTER:                 PARTIAL\nMEMORY:                 PARTIAL\n\
      ORCHESTRATOR:           PARTIAL\nCONTEXT_INJECTION:      PARTIAL\nSESSION_CORRELATION:\
      \    PARTIAL\nTASK_CORRELATION:       PARTIAL\nCURRENT_SESSION_REUSED: YES\n\
      SECOND_OPENCODE:        PASS\nRECURSION:              PASS\nFAIL_OPEN:     \
      \         PARTIAL\nMODEL_NEUTRAL:          PASS\nAGENT_NEUTRAL:          PASS\n\
      PROVIDER_NEUTRAL:       PASS\nPROJECT_SAFETY:         PASS\nPLUGIN_SOURCE_CONSISTENCY:\
      \ FAIL\nEVIDENCE_LEVEL:         L2+\nSCORE:                  55/100\nFINAL:\
      \                  NOT_VERIFIED\n```\n\n当前真正需要解决的问题只有：\n\n```text\n1. 真正的自然开发者\
      \ Prompt\n2. Host Session / Task / Context Injection 的证据关联\n3. Plugin source/runtime\
      \ consistency\n```\n\n不要扩展其他 Agent OS 能力。\n\n---\n\n# 一、最重要的目标\n\n本阶段必须证明：\n\
      \n```text\n真实 OpenCode\n    ↓\n真实 Plugin\n    ↓\n真实普通开发者 Prompt\n    ↓\nchat.message\n\
      \    ↓\nAOS Host Adapter\n    ↓\nRouter\n    ↓\nMemory\n    ↓\nOrchestrator\n\
      \    ↓\nContext Injection\n    ↓\n当前 OpenCode Session\n```\n\n其中：\n\n> **Prompt\
      \ 必须是一个独立的真实开发任务。**\n\n不能再使用：\n\n```text\n继续\n```\n\n作为 Natural Trigger。\n\n\
      ---\n\n# 二、自然 Prompt\n\n启动一个新的真实 OpenCode Session。\n\n然后由用户在该 Session 中输入：\n\
      \n```text\n只读取当前项目的 pom.xml，告诉我 Java 版本。禁止修改任何文件。\n```\n\n不要在 Prompt 中出现：\n\n\
      ```text\nAOS\nAgent OS\nPlugin\nRouter\nMemory\nOrchestrator\nHost Adapter\n\
      ```\n\n不要执行：\n\n```text\naos run\npython3 aos_host_adapter.py\npython3 host-trace.py\n\
      node -e ...\n```\n\n来产生测试事件。\n\n---\n\n# 三、不要自己代替用户输入 Prompt\n\n必须明确区分：\n\n\
      ```text\n用户真实输入\n```\n\n和：\n\n```text\nAgent 内部继续执行\n```\n\n此次测试 Prompt 必须真正出现在\
      \ OpenCode Session 的用户消息中。\n\n不能通过：\n\n```text\nCLI 参数\n脚本参数\n测试函数\n模拟 Hook\n\
      ```\n\n代替真实用户消息。\n\n---\n\n# 四、Plugin Load\n\n在新 OpenCode Session 启动前：\n\n确认：\n\
      \n```text\n/home/shade/.config/opencode/opencode.jsonc\n```\n\n已经注册：\n\n```text\n\
      /home/shade/.agents/runtime/hosts/opencode/plugin\n```\n\n然后：\n\n```text\nOpenCode\
      \ 启动\n↓\nPlugin Load\n↓\n新 Session\n```\n\n配置不得在 Session 启动以后再修改。\n\n---\n\n\
      # 五、修复 Plugin Source Consistency\n\n当前 Trae 发现：\n\n```text\nindex.ts\nindex.js\n\
      package.json\n```\n\n版本 / 内容不一致。\n\n必须先解决。\n\n当前实际运行入口：\n\n```text\npackage.json\n\
      main = ./index.js\n```\n\n因此必须建立明确关系：\n\n```text\nindex.ts\n    ↓\n构建 / 同步\n\
      \    ↓\nindex.js\n    ↓\nOpenCode Runtime\n```\n\n要求：\n\n```text\nindex.ts ==\
      \ 实际 Source of Truth\nindex.js == 对应 Runtime Build\npackage.json version ==\
      \ 实际插件版本\n```\n\n不能继续出现：\n\n```text\nindex.ts = 0.2.0\nindex.js = 0.1.0\npackage.json\
      \ = 0.2.0\n```\n\n这种不一致。\n\n如果当前没有构建系统：\n\n使用项目中最小、可维护的方式解决。\n\n不要引入大型工具链。\n\
      \n完成后验证：\n\n```text\npackage.json\nindex.ts\nindex.js\n```\n\n三者关系。\n\n---\n\
      \n# 六、修复 Task Correlation\n\n当前问题：\n\n```text\nhost_adapter_called\ntask_id\
      \ = HOST-PADO9FBM\n```\n\n但是：\n\n```text\nhost_context_injected\ntask_id = HOST-188670\n\
      ```\n\n这是不允许的。\n\n同一次真实 Prompt 的生命周期应该具有稳定的：\n\n```text\ntask_id\n```\n\n推荐：\n\
      \n```text\nsession_id\n      ↓\ntask_id\n      ↓\ncontext injection\n```\n\n\
      同一次任务始终使用同一个 task_id。\n\n禁止：\n\n```text\nPlugin 生成 task_id A\nAdapter 自己生成 task_id\
      \ B\nContext Injection 使用 B\n```\n\n造成证据断裂。\n\n---\n\n# 七、Task ID 的唯一来源\n\n\
      选择一个合理的 Source of Truth。\n\n推荐：\n\n```text\nPlugin\n    ↓\n生成 task_id\n    ↓\n\
      传给 AOS Adapter\n    ↓\nAdapter 使用该 task_id\n    ↓\n返回 context\n    ↓\nContext\
      \ Injection 使用同一个 task_id\n```\n\n或者使用已有合理机制。\n\n关键不是必须采用这个设计。\n\n关键是：\n\n>\
      \ **同一次任务不能出现两个不同 task_id。**\n\n---\n\n# 八、Session ID 必须贯穿整个 Host Pipeline\n\
      \n当前：\n\n```text\nhost_prompt_received\n```\n\n有：\n\n```text\nsession_id\n```\n\
      \n而：\n\n```text\nhost_context_injected\n```\n\n没有：\n\n```text\nsession_id\n\
      ```\n\n这会导致：\n\n```text\nPrompt\n→ Adapter\n→ Context Injection\n```\n\n无法形成完整\
      \ Session 证据链。\n\n因此修改 Host telemetry，使：\n\n```yaml\nhost_context_injected:\n\
      \  session_id:\n  task_id:\n  event_id:\n  timestamp:\n```\n\n至少包含：\n\n```text\n\
      session_id\ntask_id\nevent_id\ntimestamp\n```\n\n---\n\n# 九、建立统一 Host Correlation\
      \ Model\n\n对于一次真实 Prompt，至少必须得到：\n\n```text\nsession_id\n    ↓\ntask_id\n  \
      \  ↓\nevent_id(s)\n```\n\n并保持：\n\n```text\nsession_id = same\ntask_id = same\n\
      ```\n\nEvent ID 可以不同：\n\n```text\nEVT-A\nEVT-B\nEVT-C\n```\n\n但应该能够明确证明：\n\n\
      ```text\nEVT-A\nEVT-B\nEVT-C\n```\n\n属于：\n\n```text\n同一个 session_id\n同一个 task_id\n\
      ```\n\n---\n\n# 十、AOS Decision Layer\n\n真实自然 Prompt 必须产生实际：\n\n```text\nclassification\n\
      memory\norchestration\n```\n\n不要因为 Prompt 太短导致：\n\n```text\ngeneral\n```\n\n\
      然后把 fallback 当成 Router 成功。\n\n使用真实 Prompt：\n\n```text\n只读取当前项目的 pom.xml，告诉我\
      \ Java 版本。禁止修改任何文件。\n```\n\n确认至少获得：\n\n```text\ntask_id\nclassification\ncategory\n\
      domains\nroles\nmemory retrieval\norchestration decision\n```\n\n---\n\n# 十一、Memory\
      \ 不能只用 count=5 证明\n\n必须让证据能够回答：\n\n```text\n本次 task_id：\nHOST-XXXXXX\n\n本次 memory\
      \ retrieval：\nN 条\n\n这些 retrieval 是这次 Prompt 实际产生的。\n```\n\n至少记录：\n\n```text\n\
      task_id\nmemory mode\nretrieved count\n```\n\n必要时记录 memory IDs。\n\n不要只写：\n\n\
      ```text\nmemory_count: 5\n```\n\n然后声称 Memory PASS。\n\n---\n\n# 十二、Router 不能只靠\
      \ lead_agent\n\n当前审计发现：\n\n```text\nlead_agent = general\n```\n\n很可能只是 fallback。\n\
      \n因此真实 Prompt 后，Telemetry 应至少能说明：\n\n```text\nclassification:\ncategory:\ndomains:\n\
      roles:\nrouting reason:\n```\n\n然后才能判断：\n\n```text\nROUTER = PASS\n```\n\n---\n\
      \n# 十三、Context Injection 必须与当前任务绑定\n\n真实 Prompt：\n\n```text\n只读取当前项目的 pom.xml...\n\
      ```\n\n经过：\n\n```text\nchat.message\n```\n\n之后：\n\n```text\nAOS Adapter\n```\n\
      \n返回：\n\n```text\ntask_id = HOST-XXXX\n```\n\n随后：\n\n```text\nexperimental.chat.system.transform\n\
      ```\n\n必须产生：\n\n```text\nhost_context_injected\ntask_id = HOST-XXXX\nsession_id\
      \ = 当前真实 Session\n```\n\n因此最终链路必须类似：\n\n```text\nsession_id = ses_xxx\n\ntask_id\
      \ = HOST-123456\n\nprompt_received:\n  session_id = ses_xxx\n  task_id = HOST-123456\n\
      \nadapter_called:\n  session_id = ses_xxx\n  task_id = HOST-123456\n\nadapter_completed:\n\
      \  session_id = ses_xxx\n  task_id = HOST-123456\n\ncontext_injected:\n  session_id\
      \ = ses_xxx\n  task_id = HOST-123456\n```\n\n---\n\n# 十四、不要要求 Host Path 进入 Loop\
      \ Controller\n\n继续保持：\n\n```text\nHOST PATH:\nOpenCode\n → Plugin\n → Host Adapter\n\
      \ → Router / Memory / Orchestrator\n → Context Injection\n → Current Session\n\
      ```\n\nStandalone CLI：\n\n```text\naos run\n → Loop Controller\n → Runtime Adapter\n\
      \ → opencode run\n```\n\n两者分开。\n\n禁止：\n\n```text\nHost Plugin\n → loop_controller\n\
      \ → runtime_adapter\n → opencode run\n```\n\n这样会重新产生第二 OpenCode 问题。\n\n---\n\
      \n# 十五、Second OpenCode\n\n测试期间：\n\n```bash\npgrep -af opencode\n```\n\n以及：\n\
      \n```bash\nps -ef --forest | grep -i opencode\n```\n\n必须确认：\n\n```text\n只有当前\
      \ OpenCode Host\n```\n\n没有：\n\n```text\nPlugin\n → AOS\n → opencode run\n```\n\
