      \     ← 含 recovery_manifest.json\n```\n\n复用 Round 1 harness（`benchmark/harness/`）：\n\
      `S_scaffold/` 脚手架、`hidden/` 隐藏权威测试（哈希锁定）、`memories/*.json` 记忆 corpus、\n`tasks/regist.py+inject.py`\
      \ 任务注入、`judge.py` 打分器（Round 2 改权重）、`mrk.py` 运行器、`report.py`。\n\n每个任务规格（YAML）统一骨架：\n\
      \n```yaml\ntask_id: R3\ninitial_condition:      # 初始状态（失败态）\nexpected_failure:\
