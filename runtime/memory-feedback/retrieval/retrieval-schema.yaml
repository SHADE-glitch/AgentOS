# Adaptive Memory Retrieval Scoring Schema
# Phase 5.8 — Extends retrieval-protocol.md with adaptive scoring
#
# Design principle:
#   static_relevance_score (from retrieval-protocol.md)
#   + performance_feedback (from runtime traces)
#   + confidence_tracking (from promotion)
#   + usage_patterns (from retrieval history)
#   + decay_factor (from time/unused)
#   = adaptive_score
#
# This schema is ADDITIVE. It does not replace retrieval-protocol.md.
# It adds a second scoring layer that incorporates runtime feedback.

version: "1.0"
phase: "5.8"
status: "active"
extends: ["retrieval-protocol.md", "retrieval-index.yaml", "decision-support-protocol.md"]

# =============================================================================
# 1. Adaptive Scoring Formula
# =============================================================================

adaptive_scoring:
  description: >
    Composite score that combines static relevance with runtime performance
    feedback. The static relevance_score comes from retrieval-protocol.md.
    The adaptive layer adds performance, usage, and decay modifiers.

  formula: |
    memory_score = relevance_score  * 0.35
                 + success_rate     * 0.25
                 + confidence_score * 0.20
                 + performance_gain * 0.20

  components:
    relevance_score:
      weight: 0.35
      source: "retrieval-protocol.md Section 4"
      description: "How well this memory matches the task query"
      range: [0.0, 1.0]
      note: "Computed from category_match, domain_match, role_match, keyword_match, etc."

    success_rate:
      weight: 0.25
      source: "runtime trace outcomes"
      description: "Historical success rate when this memory was used"
      formula: |
        if usage_count == 0:
          success_rate = 0.5  # neutral baseline for untested memories
        else:
          success_rate = successful_executions / total_usage_count
      range: [0.0, 1.0]
      note: "All current traces are 'success'. Future failures will differentiate."

    confidence_score:
      weight: 0.20
      source: "promotion results (observation_count)"
      description: "Confidence in the memory based on independent observations"
      formula: |
        confidence_score = min(observation_count / 5, 1.0)
      range: [0.0, 1.0]
      note: "5+ observations = 1.0. < 5 = proportional."

    performance_gain:
      weight: 0.20
      source: "evaluation results (quality_delta, token_delta, latency_delta)"
      description: "Net performance improvement when this memory was used"
      formula: |
        if usage_count == 0:
          performance_gain = 0.0
        else:
          quality_norm = clamp((quality_delta / 2.5) + 0.5, 0, 1)
          token_norm = clamp(1.0 - (avg_tokens_with / avg_tokens_without), 0, 1)
          latency_norm = clamp(1.0 - (avg_latency_with / avg_latency_without), 0, 1)
          performance_gain = (quality_norm * 0.4 + token_norm * 0.3 + latency_norm * 0.3)
      range: [0.0, 1.0]
      note: "0.5 = neutral. > 0.5 = positive. < 0.5 = negative."

# =============================================================================
# 2. Memory Score Fields (per-memory metadata)
# =============================================================================

memory_score_fields:
  description: >
    Each memory in the retrieval index gets these additional fields
    for adaptive scoring. These are added to retrieval-index.yaml.

  fields:
    usage_count:
      type: integer
      default: 0
      description: "Number of times this memory was retrieved and used"

    last_retrieved:
      type: string
      format: "ISO 8601 datetime"
      default: null
      description: "Last time this memory appeared in retrieval results"

    last_used:
      type: string
      format: "ISO 8601 datetime"
      default: null
      description: "Last time this memory was actually applied in a task"

    successful_uses:
      type: integer
      default: 0
      description: "Number of times this memory was used and the task succeeded"

    success_rate:
      type: float
      default: 0.5
      range: [0.0, 1.0]
      description: "successful_uses / usage_count (or 0.5 if unused)"

    confidence_score:
      type: float
      default: 0.0
      range: [0.0, 1.0]
      description: "min(observation_count / 5, 1.0)"

    performance_gain:
      type: float
      default: 0.0
      range: [0.0, 1.0]
      description: "Composite performance improvement from evaluation data"

    quality_delta:
      type: float
      default: 0.0
      description: "Average quality difference when memory was used"

    token_delta_pct:
      type: float
      default: 0.0
      description: "Average token savings percentage"

    latency_delta_ms:
      type: float
      default: 0.0
      description: "Average latency reduction in ms"

    static_relevance:
      type: float
      default: 0.0
      range: [0.0, 1.0]
      description: "Cached relevance score from last retrieval"

    adaptive_score:
      type: float
      default: 0.0
      range: [0.0, 1.0]
      description: "Final adaptive score = relevance*0.35 + success*0.25 + confidence*0.20 + perf*0.20"

    decay_factor:
      type: float
      default: 1.0
      range: [0.0, 1.0]
      description: "Multiplier applied by decay system. 1.0 = no decay."

    final_score:
      type: float
      default: 0.0
      range: [0.0, 1.0]
      description: "adaptive_score * decay_factor. Used for ranking."

# =============================================================================
# 3. Retrieval Query Extended
# =============================================================================

retrieval_query_extended:
  description: >
    Extended query format that includes task context for better scoring.
    Extends the query contract from retrieval-protocol.md Section 2.

  fields:
    task_text:
      type: string
      required: true
    category:
      type: string
      required: true
    domains:
      type: list[string]
      required: true
    roles:
      type: list[string]
      required: true
    keywords:
      type: list[string]
      required: true
    # --- Extended fields ---
    difficulty:
      type: string
      required: false
    max_retries:
      type: integer
      default: 0
      description: "If > 0, this is a retry — boost failure memories"
    exclude_memories:
      type: list[string]
      default: []
      description: "Memories to exclude (e.g., failed in previous attempts)"

# =============================================================================
# 4. Retrieval Result Extended
# =============================================================================

retrieval_result_extended:
  description: >
    Extended result format with adaptive scoring breakdown.
    Extends the output contract from retrieval-protocol.md Section 2.2.

  fields:
    memory_id:
      type: string
    static_relevance:
      type: float
      description: "Original relevance score from retrieval-protocol.md"
    success_rate:
      type: float
    confidence_score:
      type: float
    performance_gain:
      type: float
    adaptive_score:
      type: float
    decay_factor:
      type: float
    final_score:
      type: float
    score_breakdown:
      type: object
      description: "Component scores for debugging"
    evidence_level:
      type: string
    confidence:
      type: string
    match_reasons:
      type: list[string]
    warning:
      type: string
      description: "Only for hypothesis memories"

# =============================================================================
# 5. Score Thresholds
# =============================================================================

thresholds:
  high_priority:
    min: 0.30
    description: "Memories above this can influence routing decisions"
  usable:
    min: 0.15
    description: "Memories above this are included in retrieval results"
  ignore:
    max: 0.15
    description: "Memories below this are excluded from results"
  top_k: 5
    description: "Maximum number of memories to return"

# =============================================================================
# 6. Bootstrapping (Cold Start)
# =============================================================================

bootstrapping:
  description: >
    When a memory has no usage data (usage_count=0), default values are used.
    This ensures the system works from day 1 without requiring execution data.

  defaults:
    success_rate: 0.5
    confidence_score: 0.0
    performance_gain: 0.0
    decay_factor: 1.0

  note: >
    Defaults make the adaptive score equal to relevance_score * 0.35 + 0.125.
    This is intentionally lower than the static score to ensure that
    PROVEN memories (with usage data) naturally outrank unproven ones.