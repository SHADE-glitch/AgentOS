# Memory Decay Policy
# Phase 5.8 — Adaptive Memory Retrieval
#
# Purpose: Gradually reduce the retrieval weight of memories that are
# unused or underperforming. This prevents stale memories from
# cluttering retrieval results.
#
# CRITICAL RULE: Never delete memories. Only degrade status.
#   active → degraded → archived_candidate

version: "1.0"
phase: "5.8"
status: "active"

# =============================================================================
# 1. Decay States
# =============================================================================

decay_states:
  active:
    description: "Memory is actively used and performing well"
    decay_factor: 1.0
    trigger: "default state for all new/observed/validated memories"

  degraded:
    description: "Memory is unused or showing low performance"
    decay_factor_range: [0.5, 0.9]
    trigger: "One or more degradation conditions met"
    recovery: "Becomes active again after 2+ successful uses"

  archived_candidate:
    description: "Memory has been degraded for 3+ decay cycles"
    decay_factor_range: [0.1, 0.5]
    trigger: "3+ consecutive cycles in degraded state"
    recovery: "Requires explicit re-validation (human review recommended)"
    note: "NOT deleted. Still exists in memory/. Can be restored."

# =============================================================================
# 2. Decay Triggers
# =============================================================================

decay_triggers:
  # Trigger 1: Unused for too long
  unused:
    description: "Memory has not been retrieved or used for a threshold period"
    thresholds:
      warning: 14  # days — flag but no decay
      mild: 30     # days — decay_factor = 0.9
      moderate: 60 # days — decay_factor = 0.7
      severe: 90   # days — decay_factor = 0.5
    base_factor: "last_used"

  # Trigger 2: Low success rate
  low_success_rate:
    description: "When used, memory is associated with low-quality outcomes"
    thresholds:
      warning: 0.8  # success_rate < 0.8 → flag
      mild: 0.6     # success_rate < 0.6 → decay_factor = 0.9
      moderate: 0.4 # success_rate < 0.4 → decay_factor = 0.7
      severe: 0.2   # success_rate < 0.2 → decay_factor = 0.5
    base_factor: "success_rate"
    min_uses: 3  # Must have at least 3 uses before success rate decay applies

  # Trigger 3: Low confidence
  low_confidence:
    description: "Memory has low observation_count (fewer than 2 observations)"
    thresholds:
      observations_0: 0.85  # 0 observations → decay_factor = 0.85
      observations_1: 0.90  # 1 observation → decay_factor = 0.90
      observations_2_plus: 1.0  # 2+ observations → no decay

  # Trigger 4: Hypothesis protection
  hypothesis:
    description: "Hypothesis memories are always decayed unless recently created"
    decay_factor: 0.7
    exception: "Created within 7 days → no decay (still being tested)"

  # Trigger 5: Low performance gain
  low_performance:
    description: "Memory shows negative performance gain (worse quality/tokens/latency)"
    thresholds:
      negative: 0.85  # performance_gain < 0 → decay_factor = 0.85
      very_negative: 0.7  # performance_gain < -0.3 → decay_factor = 0.7
    min_uses: 2  # Must have at least 2 uses before performance decay applies

# =============================================================================
# 3. Decay Formula
# =============================================================================

decay_formula:
  description: >
    decay_factor = min of all trigger decay factors.
    The most restrictive trigger determines the decay.

  formula: "decay_factor = min(trigger1_factor, trigger2_factor, ..., triggerN_factor)"

  example: |
    Memory P-001:
      - unused: 45 days → mild decay = 0.9
      - success_rate: 0.5 → moderate decay = 0.7
      - confidence: 2 observations → no decay = 1.0
      - performance: 0.3 → no decay = 1.0
      → final decay_factor = min(0.9, 0.7, 1.0, 1.0) = 0.7

# =============================================================================
# 4. Recovery Rules
# =============================================================================

recovery:
  description: "How a memory can recover from decay"

  auto_recovery:
    condition: "2+ successful uses in degraded state"
    action: "Reset decay_factor to 1.0, return to active state"

  manual_recovery:
    condition: "Memory in archived_candidate state"
    action: "Requires explicit re-validation (human review recommended)"
    note: "Restore by setting decay_factor manually to 1.0"

  new_evidence:
    condition: "New trace data shows improved performance"
    action: "Recalculate decay_factor with updated data"

# =============================================================================
# 5. Prohibited Actions
# =============================================================================

prohibited:
  - "NEVER delete a memory file"
  - "NEVER modify memory content"
  - "NEVER change memory_id"
  - "NEVER change memory type"
  - "NEVER change the source block"
  - "Decay only affects decay_factor — a retrieval multiplier"
  - "Decay is reversible — it can always be increased back to 1.0"

# =============================================================================
# 6. Decay Cycle
# =============================================================================

decay_cycle:
  frequency: "On every retrieval_optimizer run"
  scope: "All memories in retrieval-index.yaml"
  output: "Updated decay_factors written to retrieval/decay-state.yaml"

# =============================================================================
# 7. Integration with Retrieval
# =============================================================================

integration:
  description: >
    The decay_factor is applied as a multiplier to the adaptive_score
    in retrieval_optimizer.py:

    final_score = adaptive_score * decay_factor

    This means decay directly reduces retrieval ranking.
    Decayed memories can still appear in results, just at lower rank.