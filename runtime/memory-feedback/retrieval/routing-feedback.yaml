integration:
  retrieval_optimizer:
    description: 'The performance_gain component of retrieval_optimizer.py uses the
      execution_quality data from routing_feedback to compute per-memory performance
      deltas.

      '
    data_flow: "routing_feedback.yaml\n  → execution_quality (quality_score, tokens,\
      \ latency)\n  → performance_gain component in adaptive_score\n  → future retrieval\
      \ rankings\n"
  decay_system:
    description: 'The decay system uses routing feedback to identify low-performing
      memories for degradation.

      '
    data_flow: "routing_feedback.yaml\n  → low success_rate memory\n  → decay_factor\
      \ reduction\n  → lower retrieval ranking\n"
  decision_support:
    description: 'routing_feedback complements decision-support-protocol.md by adding
      the "what happened after" dimension.

      '
    data_flow: 'decision-support-protocol.md → memory_influence (before execution)

      routing_feedback.yaml → execution_quality (after execution)

      Combined → adaptive_score adjustment

      '
observability:
- Every routing_feedback entry links to a specific execution_id
- All weight adjustments are traceable
- No automatic weight modification — all adjustments are recommendations
- Full audit trail in retrieval/decay-log.yaml
