version: '1.0'
phase: '5.8'
status: active
routing_feedback_schema:
  description: 'Schema for recording how memory influenced routing decisions and how
    execution quality should affect future retrieval weights.

    '
  fields:
    feedback_id:
      type: string
      format: RF-{task_id}-{timestamp}
      required: true
    execution_id:
      type: string
      description: Reference to runtime/traces/ execution
      required: true
    task:
      type: object
      fields:
        task_id: string
        task_text: string
        category: string
        domains: list[string]
        difficulty: string
    selected_memories:
      type: list[object]
      description: Memories that were retrieved and applied
      fields:
        memory_id: string
        relevance_score: float
        final_score: float
        influence_type: string
        was_applied: boolean
    selected_agent:
      type: object
      description: The agent(s) selected by the Router
      fields:
        lead_agent: string
        support_agents: list[string]
        team_size: int
        memory_influenced: boolean
    execution_quality:
      type: object
      description: Outcome of the execution
      fields:
        status: string
        quality_score: float
        tokens_total: int
        latency_ms: int
        model_used: string
        fallback_used: boolean
    future_weight_change:
      type: object
      description: Recommended weight adjustments for future retrievals
      fields:
        memory_id: string
        direction: string
        magnitude: float
        reason: string
        confidence: string
weight_adjustment_rules:
  description: 'How execution quality translates to retrieval weight adjustments.
    These are RECOMMENDATIONS, not automatic modifications.

    '
  rules:
    boost_success:
      condition: status == success AND quality_score >= 3.0
      direction: up
      magnitude: 0.1
      max_adjustment: 0.3
      reason: Memory contributed to high-quality outcome
      confidence: medium
    boost_medium:
      condition: status == success AND quality_score >= 2.0 AND quality_score < 3.0
      direction: up
      magnitude: 0.05
      max_adjustment: 0.15
      reason: Memory contributed to acceptable outcome
      confidence: low
    reduce_failure:
      condition: status == failure OR quality_score < 1.0
      direction: down
      magnitude: 0.1
      max_adjustment: 0.3
      reason: Memory was present but outcome was poor
      confidence: low
      caveat: Cannot determine if memory caused the failure or was unrelated
    decision_changed:
      condition: memory_influence != 'confirmation' AND memory_influence != 'none'
      direction: hold
      magnitude: 0.0
      reason: Memory changed routing decision — track for analysis
      confidence: low
      note: Decision changes are recorded but not auto-adjusted
    no_memory_used:
      condition: memories_used is empty
      direction: hold
      magnitude: 0.0
      reason: No memory was applied — no feedback to record
