# Promotion Schema
# Phase 5.7.2 — Memory Promotion Engine
# Defines the data structures and state machine for candidate → memory promotion

version: "1.0"
phase: "5.7.2"
status: "active"

# =============================================================================
# 1. State Machine
# =============================================================================
#
#  candidate
#      │
#      ▼
#  validated ◄── validator.py
#      │
#      ├── reject  ──► rejected (with reason)
#      │
#      ▼
#  promoted   ◄── promoter.py
#      │
#      ▼
#  applied    ──► memory/*.md updated
#
# =============================================================================

state_machine:
  states:
    candidate:
      description: "Generated by collector from runtime trace"
      source: "memory-candidates.yaml"
      transitions_to: ["validated", "rejected"]
      required_fields:
        - candidate_id
        - source_execution
        - target_memory
        - candidate_type
        - quality_score
        - evidence.session_id
        - evidence.output_hash
        - evidence.tokens

    validated:
      description: "Passed all validation gates"
      source: "validator.py output"
      transitions_to: ["promoted", "rejected"]
      required_fields:
        - candidate_id
        - memory_id
        - validation_runs
        - quality_score
        - confidence
        - gate_results
        - promotion_decision

    promoted:
      description: "Approved for memory write-back"
      source: "promoter.py output"
      transitions_to: ["applied"]
      required_fields:
        - candidate_id
        - memory_id
        - promotion_reason
        - evidence_updates
        - confidence_updates

    applied:
      description: "Memory file updated with new evidence"
      source: "promoter.py write-back"
      terminal: true
      required_fields:
        - memory_id
        - new_observation_count
        - new_evidence_level
        - new_confidence
        - last_promoted_at

    rejected:
      description: "Failed validation or promotion gates"
      source: "validator.py or promoter.py"
      terminal: true
      required_fields:
        - candidate_id
        - memory_id
        - rejection_reason
        - rejected_at

# =============================================================================
# 2. Candidate Structure (from collector)
# =============================================================================

candidate:
  fields:
    candidate_id:
      type: string
      format: "CAND-{execution_id}-{memory_id}"
      example: "CAND-EXEC-1788090990-AP-001"
      required: true

    source_execution:
      type: string
      format: "EXEC-{timestamp}"
      example: "EXEC-1788090990"
      required: true

    target_memory:
      type: string
      format: "{type_prefix}-{number}"
      example: "AP-001"
      required: true

    candidate_type:
      type: enum
      values: ["reinforce", "weaken", "create_hypothesis"]
      required: true

    quality_score:
      type: float
      range: [0.0, 5.0]
      required: true

    quality_breakdown:
      type: object
      fields:
        completeness: {type: int, range: [1, 5]}
        accuracy: {type: int, range: [1, 5]}
        structure: {type: int, range: [1, 5]}
        actionability: {type: int, range: [1, 5]}
        novelty: {type: int, range: [1, 5]}

    reasoning:
      type: string
      required: true

    evidence:
      type: object
      fields:
        session_id: {type: string, required: true}
        model: {type: string, required: true}
        tokens: {type: object, required: true}
        output_hash: {type: string, required: true}
        latency_ms: {type: int, required: true}
        is_real_execution: {type: bool, required: true}

    outcome:
      type: enum
      values: ["promoted", "hold", "rejected"]
      default: "hold"

# =============================================================================
# 3. Validation Result Structure
# =============================================================================

validation_result:
  fields:
    candidate_id:
      type: string

    memory_id:
      type: string

    status:
      type: enum
      values: ["validated", "rejected"]
      description: "Final validation decision"

    validation_runs:
      type: int
      description: "Number of independent runtime executions that confirm this memory"
      min: 0

    quality_score:
      type: float

    confidence:
      type: float
      range: [0.0, 1.0]
      description: "Calculated from observations and quality"

    gate_results:
      type: object
      fields:
        M1_provenance: {type: enum, values: ["pass", "fail", "skip"]}
        M2_evidence_level: {type: enum, values: ["pass", "fail", "skip"]}
        M3_duplicate: {type: enum, values: ["pass", "fail", "skip"]}
        M4_confidence: {type: enum, values: ["pass", "fail", "skip"]}
        M5_relevance: {type: enum, values: ["pass", "fail", "skip"]}
        M6_staleness: {type: enum, values: ["pass", "fail", "skip"]}

    evidence_sources:
      type: list[string]
      description: "List of execution IDs that support this candidate"

    checks:
      type: object
      fields:
        is_real_execution: {type: bool}
        has_execution_evidence: {type: bool}
        has_independent_verification: {type: bool}
        quality_above_threshold: {type: bool}
        not_hypothesis: {type: bool}

    rejection_reason:
      type: string
      required_if: "status == rejected"

    validated_at:
      type: string
      format: "ISO 8601"

# =============================================================================
# 4. Promotion Result Structure
# =============================================================================

promotion_result:
  fields:
    memory_id:
      type: string

    candidate_id:
      type: string

    status:
      type: enum
      values: ["promoted", "applied", "rejected"]

    evidence_updates:
      type: object
      fields:
        old_observation_count: {type: int}
        new_observation_count: {type: int}
        old_evidence_level: {type: string}
        new_evidence_level: {type: string}
        added_executions: {type: list[string]}
        added_candidates: {type: list[string]}

    confidence_updates:
      type: object
      fields:
        old_confidence: {type: string}
        new_confidence: {type: string}
        old_confidence_value: {type: float}
        new_confidence_value: {type: float}

    promotion_reason:
      type: string

    applied_changes:
      type: list[string]
      description: "List of fields changed in the memory file"

    memory_file:
      type: string
      description: "Path to the modified memory file"

    promoted_at:
      type: string
      format: "ISO 8601"

# =============================================================================
# 5. Validation Rules (from policy)
# =============================================================================

validation_rules:
  # Rule 1: Real execution check
  real_execution:
    check: "evidence.session_id exists AND is not empty"
    fail: "REJECT — cannot verify as real execution"
    hard: true

  # Rule 2: Execution evidence check
  execution_evidence:
    check: "evidence.output_hash exists AND evidence.tokens.total > 0"
    fail: "REJECT — insufficient execution evidence"
    hard: true

  # Rule 3: Independent verification
  independent_verification:
    check: "2+ unique execution_ids for the same memory_id"
    fail: "HOLD — need more evidence"
    hard: false
    note: "Soft gate. Single-observation candidates are held, not rejected."

  # Rule 4: Quality threshold
  quality_threshold:
    check: "quality_score >= 3.0"
    threshold: 3.0
    fail: "REJECT — quality below threshold"
    hard: true

  # Rule 5: Hypothesis protection
  hypothesis_protection:
    check: "candidate_type != 'create_hypothesis'"
    fail: "HOLD — hypotheses require human review, never auto-promoted"
    hard: true

  # Rule 6: Weaken processing
  weaken_processing:
    check: "candidate_type == 'weaken'"
    action: "HOLD — weaken candidates require human review"
    hard: true
    note: "Weaken is not auto-promoted. It flags for review."

# =============================================================================
# 6. Promotion Rules
# =============================================================================

promotion_rules:
  # Rule P1: Promote if validated and reinforce
  P1_reinforce:
    condition: "status == validated AND candidate_type == reinforce"
    action: "promoted"
    apply: true

  # Rule P2: Evidence level upgrade
  P2_evidence_upgrade:
    condition: "validation_runs >= 2"
    action: "upgrade evidence_level to runtime_validated"

  # Rule P3: Confidence recalc
  P3_confidence:
    condition: "observation_count >= 2"
    action: "upgrade confidence to medium"
    condition_high: "observation_count >= 5"
    action_high: "upgrade confidence to high"

  # Rule P4: Write-back
  P4_write_back:
    condition: "status == promoted"
    action: "update memory file: observation_count, evidence_level, confidence, last_validated_at"

  # Rule P5: Never delete
  P5_no_delete:
    condition: "always"
    action: "NEVER delete memory content. Only update metadata."

  # Rule P6: Never auto-promote hypothesis
  P6_hypothesis:
    condition: "target_memory starts with 'H-'"
    action: "HOLD, never promote"
    hard: true