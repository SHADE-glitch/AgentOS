# Promotion Policy
# Phase 5.7 — Defines rules for promoting memory entries
# Based on Memory Gates (M1-M6) and runtime evidence

version: "1.0"
phase: "5.7"
status: "active"

# =============================================================================
# 1. Promotion Criteria
# =============================================================================

promotion:
  # --- Quality Threshold ---
  # Minimum quality score for promotion consideration
  quality_threshold: 4.0

  # --- Evidence Requirements ---
  evidence:
    # All promoted memories must have runtime evidence
    require_runtime: true
    # Minimum evidence level for promotion
    min_evidence_level: "runtime_validated"
    # Required fields in runtime evidence
    required_fields:
      - session_id
      - model
      - tokens
      - latency_ms
      - output_hash

  # --- Gate Requirements ---
  gates:
    M1_provenance: hard  # Must have source
    M2_evidence_level: hard  # Must have valid evidence_level
    M3_duplicate: hard  # Must not be duplicate
    M4_confidence: soft  # Warning only, does not block promotion
    M5_relevance: hard  # Must be relevant to category
    M6_staleness: hard  # Must not be stale

  # --- Observation Count → Confidence ---
  confidence_calibration:
    low: "0-1 runtime observations"
    medium: "2-4 runtime observations"
    high: "5+ runtime observations"

# =============================================================================
# 2. Promotion Actions
# =============================================================================

promotion_actions:
  # When a memory is promoted
  on_promotion:
    - action: "increment_observation_count"
      description: "Count this execution as one observation"
    - action: "update_evidence_level"
      description: "Upgrade to runtime_validated if not already"
    - action: "update_last_validated_at"
      description: "Set timestamp to current date"
    - action: "recalculate_confidence"
      description: "Apply M4: check if observation_count crosses threshold"
    - action: "record_in_feedback_log"
      description: "Append to memory-candidates.yaml"

  # When confidence crosses threshold
  on_confidence_upgrade:
    low_to_medium:
      condition: "observation_count >= 2"
      action: "Update confidence to medium"
    medium_to_high:
      condition: "observation_count >= 5"
      action: "Update confidence to high"

  # When evidence level crosses threshold
  on_evidence_upgrade:
    to_runtime_validated:
      condition: "First runtime execution with real session_id"
      action: "Set evidence_level = runtime_validated"
    to_independent_validated:
      condition: "2+ independent runtime executions with consistent results"
      action: "Set evidence_level = independent_validated"
    to_trusted:
      condition: "5+ independent runtime executions, no regressions, no deprecations"
      action: "Set evidence_level = trusted"

# =============================================================================
# 3. Promotion Limits
# =============================================================================

limits:
  # Maximum promotions per feedback cycle
  max_per_cycle: 5
  
  # Minimum time between promotions for same memory
  min_interval_same_memory: "1 feedback cycle"
  
  # Maximum concurrent promotions across all memories
  max_concurrent: 10

# =============================================================================
# 4. Status Lifecycle
# =============================================================================

status_lifecycle:
  new:
    description: "Freshly created, not yet observed in any execution"
    promotion_target: "observed"
    requirement: "1 observation (benchmark or runtime)"
  
  observed:
    description: "Observed in at least one execution"
    promotion_target: "validated"
    requirement: "1+ runtime observation with quality_score >= 4.0"
  
  validated:
    description: "Confirmed by runtime evidence"
    promotion_target: "trusted"
    requirement: "5+ runtime observations, evidence_level >= independent_validated"
  
  trusted:
    description: "Highly reliable, confirmed by many observations"
    promotion_target: "N/A (terminal state)"
    requirement: "Sustained positive evidence, no regressions"
  
  deprecated:
    description: "No longer valid, superseded by new evidence"
    promotion_target: "N/A (can only be removed or re-validated)"
    requirement: "Contradicted by 2+ independent runtime executions"