# Rejection Policy
# Phase 5.7 — Defines rules for rejecting memory candidates
# Mirror of promotion-policy.yaml, for the negative path

version: "1.0"
phase: "5.7"
status: "active"

# =============================================================================
# 1. Rejection Criteria
# =============================================================================

rejection:
  # --- Quality Threshold ---
  # Quality score below this → auto-reject
  quality_threshold: 3.0

  # --- Gate Failures ---
  # Any hard gate failure → rejection
  hard_gate_failures:
    M1_provenance:
      failure: "Memory has no source or source is untraceable"
      action: "Reject. Require provenance before resubmission."
    M2_evidence_level:
      failure: "Missing or invalid evidence_level"
      action: "Reject. Must declare evidence_level."
    M3_duplicate:
      failure: "Duplicate of existing memory (same type + category + content)"
      action: "Reject. Merge with existing or discard."
    M5_relevance:
      failure: "Memory is not relevant to its declared category"
      action: "Reject. Reclassify or discard."
    M6_staleness:
      failure: "Memory is stale (>90 days) without re-validation"
      action: "Reject. Mark for review or deprecation."

  # --- Evidence Quality ---
  evidence_quality:
    # Reject if output_hash matches an existing execution
    duplicate_output_hash:
      condition: "output_hash already exists in another trace"
      action: "Reject. Indicates duplicated or templated response."
    # Reject if session_id is not unique
    duplicate_session_id:
      condition: "session_id matches another execution"
      action: "Reject. Indicates reused execution."
    # Reject if no real runtime artifacts
    no_runtime_artifacts:
      condition: "Missing session_id, tokens, or output_hash"
      action: "Reject. Cannot verify as real execution."

# =============================================================================
# 2. Rejection Actions
# =============================================================================

rejection_actions:
  on_rejection:
    - action: "record_rejection"
      description: "Log the rejection in memory-candidates.yaml"
    - action: "include_reason"
      description: "Always include specific rejection_reason"
    - action: "no_memory_change"
      description: "Do not modify the target memory"
    - action: "notify"
      description: "Flag for human review if quality_score >= 3.0"

# =============================================================================
# 3. Special Cases
# =============================================================================

special_cases:
  # Hypotheses are never auto-promoted
  hypothesis:
    rule: "hypothesis type memories are ALWAYS held, never auto-promoted"
    reason: "Hypotheses are speculative and require human validation"
    action: "hold → human review"
    exception: "None. Even with quality_score >= 4.0, hypotheses are held."

  # Regression events
  regression:
    rule: "If new execution contradicts existing promoted memory, do NOT auto-deprecate"
    reason: "Single contradiction may be an outlier. Deprecation requires 2+ independent contradictions."
    action: "hold → flag for review"
    threshold: 2

  # Anti-patterns
  anti_pattern:
    rule: "Anti-patterns can be promoted but with extra scrutiny"
    reason: "Anti-patterns are cautionary. Over-promotion could lead to over-caution."
    action: "Promote only if the execution CAUSED a team inflation that was prevented"

  # Failures
  failure:
    rule: "Failures can be promoted if the execution confirmed the failure pattern"
    reason: "Failures are valuable learning signals"
    action: "Promote if memory was used and outcome was positive (failure was avoided)"

  # Effectiveness
  effectiveness:
    rule: "Effectiveness memories are per-agent, promote conservatively"
    reason: "Agent effectiveness changes with model, task type, and context"
    action: "Promote only if the agent's output quality is consistent with effectiveness rating"

# =============================================================================
# 4. Contamination Prevention
# =============================================================================

contamination:
  # Memory OFF executions
  memory_off:
    rule: "Executions with memory_mode=off are NOT used for promotion"
    reason: "Memory OFF is baseline. Cannot attribute success to memory."
    action: "Skip. Record as baseline observation only."

  # Same session reuse
  session_reuse:
    rule: "Executions sharing the same session_id are treated as 1 observation"
    reason: "Same session may produce correlated results"
    action: "Deduplicate. Count as 1."

  # Hypothesis contamination
  hypothesis_contamination:
    rule: "If a memory was influenced by a hypothesis, flag it"
    reason: "Hypotheses are unvalidated. Their influence may be noise."
    action: "Flag in memory-candidates.yaml with warning."

# =============================================================================
# 5. Hold / Pending State
# =============================================================================

hold:
  description: "Candidate is neither promoted nor rejected — requires additional evidence or human review"
  conditions:
    - "quality_score between 3.0 and 4.0"
    - "hypothesis type"
    - "insufficient observations for confidence upgrade"
    - "regression detected (single occurrence)"
  actions:
    - "Record in memory-candidates.yaml with outcome: hold"
    - "Include specific reason for hold"
    - "Set review_deadline: current_date + 90 days"
  resolution:
    - "Additional runtime evidence pushes quality above 4.0 → promote"
    - "Human review confirms → promote or reject"
    - "90 days without resolution → reject (staleness)"