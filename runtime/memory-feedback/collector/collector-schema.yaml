# Collector Schema
# Phase 5.7.1 — Runtime Feedback Collector
# Defines the input/output contract and candidate generation rules

version: "1.0"
phase: "5.7.1"
status: "active"

# =============================================================================
# 1. Collector Contract
# =============================================================================
#
# Collector reads Runtime traces and produces Memory candidates.
# It does NOT modify Memory directly — it only produces candidates.
#
#   INPUT:  runtime/traces/*.yaml
#   OUTPUT: runtime/memory-feedback/memory-candidates.yaml
#
# =============================================================================

collector:
  name: "Runtime Feedback Collector"
  version: "1.0"
  purpose: "Bridge Runtime traces to Memory Feedback pipeline"

  # --- Input ---
  input:
    source: "runtime/traces/"
    file_pattern: "EXEC-*.yaml"
    required_fields:
      - execution_id
      - task_id
      - task_text
      - domain
      - difficulty
      - memory_mode
      - status
      - model
      - backend
      - memory_retrieval.memories_used
      - memory_retrieval.memory_influence
      - agent_invocation.session_id
      - agent_invocation.tokens
      - agent_invocation.latency_ms
      - agent_response
    optional_fields:
      - memory_retrieval.memories_considered
      - orchestrator.team_formed
      - router.lead_agent
      - evidence.level

  # --- Output ---
  output:
    target: "runtime/memory-feedback/memory-candidates.yaml"
    format: "YAML (append to existing candidates list)"
    fields_per_candidate:
      - candidate_id
      - source_execution
      - target_memory
      - candidate_type
      - quality_score
      - reasoning
      - evidence
      - outcome

# =============================================================================
# 2. Candidate Types
# =============================================================================

candidate_types:
  reinforce:
    description: "Execution confirms existing memory — increase evidence"
    trigger:
      - "memory_retrieval.memories_used is not empty"
      - "status == success"
      - "memory_influence is not 'none'"
    action: "Propose incrementing observation_count and upgrading evidence_level"
    outcome: "promoted"

  weaken:
    description: "Execution contradicts or fails to support existing memory"
    trigger:
      - "memory_retrieval.memories_used is not empty"
      - "status == timeout OR status == failure"
      - "OR memory_influence == 'none' when memory was used"
    action: "Propose review or downgrade"
    outcome: "hold"

  create_hypothesis:
    description: "New insight or high-quality pattern not covered by existing memories"
    trigger:
      - "status == success"
      - "agent_response is non-trivial"
      - "quality_score >= 4.0"
      - "No existing memory covers the same domain × pattern"
    action: "Propose new hypothesis memory"
    outcome: "hold"

# =============================================================================
# 3. Quality Evaluation Rules
# =============================================================================

quality_evaluation:
  # Auto-evaluation based on structure heuristics (not AI judgment)
  method: "heuristic"
  
  heuristics:
    # Completeness: checks if response has structured sections
    completeness:
      weight: 0.25
      rules:
        - "Has headers (##) → +1"
        - "Has bullet points or numbered lists → +1"
        - "Has code examples → +1"
        - "Covers 3+ distinct aspects → +1"
        - "Length > 200 chars → +1"
      range: 0-5

    # Accuracy proxy: not verifiable without human, so use structural proxies
    accuracy:
      weight: 0.30
      rules:
        - "Has technical terminology → +1"
        - "Has specific tools/technologies named → +1"
        - "Has implementation details → +1"
        - "Has rationale/explanation → +1"
        - "No generic filler text → +1"
      range: 0-5

    # Structure: how well-organized is the response
    structure:
      weight: 0.15
      rules:
        - "Has numbered sections → +1"
        - "Has consistent formatting → +1"
        - "Has clear hierarchy (h2 > h3 > bullet) → +1"
        - "No walls of text → +1"
        - "Readable at a glance → +1"
      range: 0-5

    # Actionability: can the output be used directly
    actionability:
      weight: 0.20
      rules:
        - "Has actionable steps → +1"
        - "Has specific recommendations → +1"
        - "Has concrete examples → +1"
        - "Has configuration/parameters → +1"
        - "Can be copy-pasted into implementation → +1"
      range: 0-5

    # Novelty: does it go beyond generic advice
    novelty:
      weight: 0.10
      rules:
        - "Has domain-specific insight → +1"
        - "Has non-obvious recommendation → +1"
        - "Has trade-off analysis → +1"
        - "Has edge cases → +1"
        - "Has optimization suggestions → +1"
      range: 0-5

  # Weighted score calculation
  score_formula: "(completeness * 0.25) + (accuracy * 0.30) + (structure * 0.15) + (actionability * 0.20) + (novelty * 0.10)"

# =============================================================================
# 4. Candidate Generation Rules
# =============================================================================

generation_rules:
  # Rule: Reinforce
  - rule_id: "R1"
    name: "memory_used_and_success"
    description: "If memory was used and execution succeeded, reinforce the memory"
    condition:
      field: "memory_retrieval.memories_used"
      operator: "not_empty"
      and:
        field: "status"
        operator: "equals"
        value: "success"
    candidate_type: "reinforce"
    outcome: "promoted"

  # Rule: Reinforce (anti-pattern confirmed)
  - rule_id: "R2"
    name: "anti_pattern_alert_confirmed"
    description: "If anti-pattern alert was triggered and execution was successful, reinforce the anti-pattern"
    condition:
      field: "orchestrator.anti_pattern_alert"
      operator: "equals"
      value: true
      and:
        field: "status"
        operator: "equals"
        value: "success"
    candidate_type: "reinforce"
    target: "AP-001"
    outcome: "promoted"

  # Rule: Weaken
  - rule_id: "R3"
    name: "memory_used_but_failed"
    description: "If memory was used but execution failed, weaken the memory"
    condition:
      field: "memory_retrieval.memories_used"
      operator: "not_empty"
      and:
        field: "status"
        operator: "not_equals"
        value: "success"
    candidate_type: "weaken"
    outcome: "hold"

  # Rule: Weaken (no influence)
  - rule_id: "R4"
    name: "memory_used_no_influence"
    description: "If memory was used but had no influence on the decision, weaken"
    condition:
      field: "memory_retrieval.memories_used"
      operator: "not_empty"
      and:
        field: "memory_retrieval.memory_influence"
        operator: "equals"
        value: "none"
    candidate_type: "weaken"
    outcome: "hold"

  # Rule: Create Hypothesis
  - rule_id: "R5"
    name: "high_quality_no_memory"
    description: "If execution was high quality but no relevant memory was used, create hypothesis"
    condition:
      field: "status"
      operator: "equals"
      value: "success"
      and:
        field: "quality_score"
        operator: "gte"
        value: 4.0
      and:
        field: "memory_retrieval.memories_used"
        operator: "empty_or_none"
    candidate_type: "create_hypothesis"
    outcome: "hold"

  # Rule: Reinforce (risk_changed)
  - rule_id: "R6"
    name: "risk_changed_confirmed"
    description: "If memory influence was risk_changed and execution succeeded, reinforce"
    condition:
      field: "memory_retrieval.memory_influence"
      operator: "equals"
      value: "risk_changed"
      and:
        field: "status"
        operator: "equals"
        value: "success"
    candidate_type: "reinforce"
    outcome: "promoted"

# =============================================================================
# 5. Safety Rules
# =============================================================================

safety:
  # Never produce candidates for Memory OFF executions
  skip_memory_off: true
  memory_off_rule: "If memory_mode == 'off', skip this execution entirely"

  # Never modify memory directly
  no_direct_memory_modification: true
  rule: "Collector only produces candidates. Promotion/rejection is handled by the Feedback Pipeline."

  # Never create candidates without real evidence
  require_real_evidence: true
  required_evidence:
    - session_id
    - output_hash
    - tokens

  # Never auto-promote hypotheses
  hypothesis_always_hold: true
  rule: "Hypothesis candidates are always held, never auto-promoted."

  # Never create candidates for the same execution twice
  deduplication: true
  rule: "If a candidate already exists for (execution_id + target_memory), skip."