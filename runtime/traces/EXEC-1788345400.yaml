agent_response: "## 目标\n\n- **业务目标**：`KeywordKnowledgeRetriever.retrieveContext` 在无关键词命中时回退为输出主题下全部子知识点，需评估其对\
  \ Prompt 上下文的稀释影响。\n- **当前约束**：rule 模式走基于规则的评分（`RuleBasedScoringService` 等），该检索器理论上服务\
  \ AI 提示词上下文；系统为 Java/Spring Boot，检索为纯子串关键词匹配、无向量。\n- **成功标准**：给出量化影响、判定\"零命中→全量下灌\"\
  是否为设计缺陷，并给出可落地的上下文构造/降级方案。\n\n## 问题判断（先给结论）\n\n**关键事实 1：当前该方法在代码库中是\"死代码\"，今日生产影响为\
  \ 0。**\n\n全库 `grep retrieveContext` 仅 5 处命中：2 处在 benchmark 文档，1 处是 `RagService`（不同签名，`Long\
  \ userId`），1 处是 `LegacyAiRagService`（也不同签名），另 1 处就是本方法定义——**没有任何调用方**。重构版 `InterviewService`\
  \ 虽然注入了 `knowledgeRetriever`（`InterviewService.java:61`），但从未调用它；真实抽题走 `QuestionBank.pickQuestion(...)`，与检索上下文无关。因此：\n\
  \n> 该 fallback 的稀释风险是**潜在缺陷**而非线上 bug，它是 benchmark 的\"负对照组任务\"（F-NEG）的 grounding，只有在该方法被重新接入\
  \ Prompt 组装路径时才会实际影响用户。\n\n**关键事实 2：一旦被接入，该 fallback 的缺陷是真实且可放大的。**\n\n`KeywordKnowledgeRetriever.java:62-70`：\n\
  \n```java\n// 如果没有匹配，返回所有知识点概述\nif (matchCount == 0) {\n    sb.append(\"当前主题知识点：\"\
  );\n    for (KnowledgePoint point : points) {\n        if (point.getParentId() !=\
  \ null) { // 只显示子知识点\n            sb.append(point.getName()).append(\"、\");\n  \
  \      }\n    }\n}\n```\n\n按 `data.sql` 实际数据量化（子节点数）：Java=5、Redis=5、MySQL=5、JVM=4、并发=6。该分支**无任何数量/长度上限**（对比命中分支在\
  \ `matchCount >= 5` 处有 `break`），知识树增长即上下文线性膨胀。\n\n### 稀释的具体维度\n\n1. **相关性稀释**：命中分支返回的是\"\
  与查询匹配\"的 ≤5 条（含 description，信息密度高）；回退分支返回的是\"全部子节点\"且**只含 name、丢弃 description**。零命中的问题（如\"\
  JUC 工具类\"）却给\"线程基础、synchronized 与锁、volatile、AQS…\"整树名字，平均相关性远低于随机命中，且无排序、无置信度标注。\n\
  \n2. **信息密度/Token 效率**：回退分支是\"每 token 信息量最低\"的形态——只有名称无描述，同时把所有可能离题的名称注入同一条\"当前主题知识点\"\
  拼接串，挤占真正高价值上下文容量。\n\n3. **无界增长风险**：无 `MIN(topK, size)` 也无字符上限。当前 6 个子节点尚小；一旦知识展开到每主题\
  \ 20–50 节点，每次会话 prompt 都会加上全部名称，质量下降且成本随主题规模线性上升、不可控。\n\n4. **Grounding 语义错误**：把\"\
  检索未命中\"（recall miss）伪装成\"全量提供\"，下游模型拿不到任何\"当前无从检索\"的信号，缺失会被静默掩盖——这与 `LegacyAiRagService.retrieveContext`\
  \ 的契约（`无命中时返回空字符串`，`LegacyAiRagService.java:158`）直接冲突，标准不统一。\n\n### 综合评级\n\n| 维度\
  \ | 评估 |\n|---|---|\n| 当前生产影响 | **极低（死代码）** |\n| 潜在影响（一旦接入） | 中——稀释明显、无界、掩盖 miss\
  \ |\n| 修复优先度 | **低（先于接入前置修复 / 随 benchmark 一并处理）** |\n\n## 方案设计\n\n```text\nOption\
  \ A — 无命中返回空串（对齐 Legacy 契约）\n- 优点：最简单、零稀释、诚实暴露 recall miss、与 query.isBlank() 早退一致；合约唯一\n\
  - 缺点：模型在 miss 时得不到任何主题提示（面试场景可接受）\n- 最佳适配：当前现状（死代码、量级小）下的最优默认\n\nOption B — 无命中返回“有界\
  \ + 明确标注不确定”的主题概览（按 difficulty 排序、截断 topK）\n- 优点：保留概览意图，界限固定，公开标注低置信\n- 缺点：仍注入离题\
  \ token；无相关性排序信号\n- 最佳适配：产品明确需要“无命中也给缓颊提示”\n\nOption C — 用关键词/子串重合度打分，始终返回 top-k（消除“miss↔全量”跳变）\n\
  - 优点：优雅降级、无跳变、天然有界；中文可叠加字/词重叠启发式\n- 缺点：较复杂，无向量时中文匹配启发式仍偏弱；偏离最小改动原则\n- 最佳适配：模式回归纯关键词但希望更智能\n\
  ```\n\n**最终建议**：**A 为主，且 A/C/B 都强制加硬上限**。理由：本方法当前无调用方、量级小，A 是最小风险改动且统一了 `LegacyAiRagService`\
  \ 已有的\"miss → 空串\"契约；同时补一个 miss 计数日志，让产品能观测\"为何零命中\"（真实根因是关键词相关性不足，而非该 dump 树兜底）。\n\
  \n## 实施方案\n\n修改位置：`KeywordKnowledgeRetriever.java:62-70`，将整个 `matchCount == 0` 分支替换为显式\
  \ miss 短回：\n\n```java\n// 无关键词命中：按“缺省即弱化”原则返回空串，避免全量下灌稀释上下文。\n// 与 LegacyAiRagService.retrieveContext\
  \ 的“无命中=>空”契约为同一语义。\nif (matchCount == 0) {\n    log.info(\"keyword retriever miss:\
  \ query={}, topic={}, total={}\",\n            queryLower, topic, points.size());\n\
  \    return \"\";\n}\n```\n\n如需保留\"主题概览\"（Option B，有界版）：\n\n```java\nif (matchCount\
  \ == 0) {\n    List<KnowledgePoint> children = points.stream()\n            .filter(p\
  \ -> p.getParentId() != null)\n            .sorted(Comparator.comparing(p -> p.getDifficulty()\
  \ == null ? 0 : p.getDifficulty()))\n            .toList();\n    int topK = Math.min(children.size(),\
  \ 3);          // 硬上限，控制上下文膨胀\n    long total = children.size();               \
  \       // 显式标注截断与不确定性\n    sb.append(\"(未命中，仅作参考) 主题包含 \").append(total)\n    \
  \  .append(\" 个知识点，难度排序前 \").append(topK).append(\"：\");\n    for (KnowledgePoint\
  \ p : children.subList(0, topK)) {\n        sb.append(p.getName()).append(\"、\"\
  );\n    }\n    return sb.toString();\n}\n```\n\n配置/一致性建议：\n- 无论选哪种，都对命中分支补 `MIN(limit,\
  \ points.size())` 与总字符上限，杜绝任何无界拼接。\n- 与 `LegacyAiRagService`（`mode=ai`）契约对齐，避免 rule/ai\
  \ 两套行为不一致。\n- 若未来接入 AI 提示词，把检索结果与用户问题放同一 system/user 消息边界内，并用 `---` / 置信标注分隔，让模型知道哪些片段是高置信命中的。\n\
  \n## 验证方式\n\n1. **单元测试**：\n   - 零命中：`query=\"不存在的词\"` → 期望 `/^\\s*$/`（空串），并断言不发\
  \ \"当前主题知识点\" 前缀。\n   - 命中：`query=\"集合框架\"` → 仅含匹配节点 ≤5 条。\n   - 有界：构造 20+ 子节点主题，断言输出长度/条数被截断。\n\
  \   - 空查询：`query=null/blank` → 返回 `\"\"`（现有 `KeywordKnowledgeRetriever.java:33`\
  \ 已覆盖，回归确认）。\n2. **回归**：全仓库无调用方，改动不改变现有接口签名、不触发编译/测试回归；`mvn test` 通过即可。\n3. **行为观测**：接入后留意\
  \ `keyword retriever miss` 日志频度——高 miss 率应反推到关键词/知识树质量，而非靠 dump 兜底。\n\n## 复盘建议\n\
  \n- 该任务同时是 benchmark F-NEG 负对照的 grounding（`Phase-8.2.1.4-Benchmark-Specification.md:84-87`），其结论必须与\"\
  内存无关、两臂均无提升\"一致——不要把它当成修复或增强内存系统的抓手。\n- 长期来看建议对 rule-mode 也保留可选的弱向量/子串重合度打分（Option\
  \ C），替换掉二元的\"命中/全量\"跳变；但在当前无调用方现状下属过度设计，YAGNI。"
