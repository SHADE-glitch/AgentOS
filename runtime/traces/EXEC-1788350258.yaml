  代码层面\"与\"运行时层面\"两类影响。\n\n## 问题判断\n\n**核心结论:影响是\"代码缺陷级\"而非\"prompt 稀释级\"——因为该路径在运行时根本不会被调用。**\n\
  \n### 根因（三层）\n\n1. **`retrieveContext()` 是死代码。** 全仓库 grep `retrieveContext` 仅命中原方法定义（`KeywordKnowledgeRetriever.java:32`）以及两个与它签名无关的\
  \ `RagService`/`LegacyAiRagService` 同名方法。`InterviewService.java:61` 注入了 `knowledgeRetriever`\
  \ bean，但**从未调用** `retrieveContext(query, topic)`。因此 \"diluting prompt context\"\
  \ 的命题在运行期不成立——没有 prompt 包含这段上下文。\n\n2. **即便被调用，fallback 也有三个缺陷**（`KeywordKnowledgeRetriever.java:62-70`）:\n\
  \   - **误导性前缀:** 先追加 `\"以下是与查询相关的知识点（供参考）：\"`（48 行），fallback 时却输出 `\"当前主题知识点：\"\
  `（64 行）拼接所有子知识点——前缀宣称\"与查询相关\"，实际内容与查询**无关**，误导模型以为这是检索命中结果。\n   - **无界稀释:** `matchCount==0`\
  \ 分支遍历 `points` 全量拼接 `name`（`parentId != null`，66-69 行），**没有条数上限**，违背了命中分支的 `matchCount\
  \ >= 5 break` 边界。主题越大，注入越低质、越长。\n   - **静默降级:** 无关键词命时不返回空串，而是返回\"全部\"，把\"检索不到\"\
  伪装成\"命中全部\"，削弱模型对不确定性的感知。\n\n   三者叠加才构成完整影响：`死代码 + 误导前缀 + 无界拼接`。\n\n3. **grep 仅匹配限定范围。**\
  \ 需确认无其他调用路径（如反射、SpEL、AOP）后才下\"死代码\"结论。我用的是直接符号调用 grep，未覆盖反射；但 Java 中该私有逻辑被反射调用的可能性极低。\n\
  \n### 关键假设\n- 基准的 F-NEG 设计（Arm A 无 priming / Arm B 有 priming，别受上述即改代码影响只读）正确隔离了\"\
  模型先验知识\"混杂。\n- 若未来某提交真正接线 `knowledgeRetriever.retrieveContext()`（如改为 rule 模式注入反馈\
  \ prompt），则缺陷会从\"潜在\"转为\"实发\"，影响随主题子知识点数量线性放大。\n\n## 方案设计\n\n| 维度 | 命中路径（现状） | 无命中\
  \ fallback（现状） | 推荐 |\n|---|---|---|---|\n| 行为 | `matchCount>=5` 截断 | 全量拼接、无界 |\
  \ **返回空串**，加 WARN 日志 |\n| 边界 | 有上限 | 无上限 | 保守起见不超 N 条 |\n| 语义 | 前缀真实 | 前缀误导 | 保持真实或整体移除\
  \ |\n\n- **方案 A（最小、正确、首选）:** 无命中时返回 `\"\"`，不注入\"全部知识点\"。缺失上下文字段不会让下游崩溃（调用方按空串处理），且避免误导。\n\
  - **方案 B（保守边界）:** 若业务确需\"给模型兜底提示\"，仅返回该主题**已抽中问题对应**的知识点名（有界、有因），而非全部子知识点；并显式标注\"\
