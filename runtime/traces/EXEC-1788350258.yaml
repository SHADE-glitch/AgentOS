  - **风险与缓解:** 若贸然\"接线\"（错误方向），会真引入无界稀释——所以建议是\"移除/返回空串\"，而非\"启用\"。\n\n## 实施方案\n\n\
  ```java\n// KeywordKnowledgeRetriever.java —— 方案 A\npublic String retrieveContext(String\
  \ query, String topic) {\n    if (query == null || query.isBlank()) {\n        return\
  \ \"\";\n    }\n    List<KnowledgePoint> points = knowledgePointMapper.selectList(\n\
  \            new LambdaQueryWrapper<KnowledgePoint>()\n                    .eq(KnowledgePoint::getTopic,\
  \ topic));\n    if (points.isEmpty()) {\n        return \"\";\n    }\n\n    StringBuilder\
  \ sb = new StringBuilder();\n    sb.append(\"以下是与查询相关的知识点（供参考）：\\n\");\n\n    String\
  \ queryLower = query.toLowerCase();\n    int matchCount = 0;\n    for (KnowledgePoint\
  \ point : points) {\n        if (point.getName().toLowerCase().contains(queryLower)\n\
  \                || (point.getDescription() != null\n                    && point.getDescription().toLowerCase().contains(queryLower)))\
  \ {\n            sb.append(\"- \").append(point.getName()).append(\"：\")\n     \
  \         .append(point.getDescription()).append(\"\\n\");\n            matchCount++;\n\
  \            if (matchCount >= 5) break;\n        }\n    }\n\n    if (matchCount\
