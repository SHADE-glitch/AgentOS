agent_response: "## 目标\n\n- **业务目标:** 判断 `KeywordKnowledgeRetriever` 的无匹配 fallback\
  \ 是否因\"返回该主题全部子知识点\"而**稀释 prompt 上下文**，从而影响回答质量/评分。\n- **当前约束:** 该检索器仅用于 `app.interview.mode=rule`（或未配置，`matchIfMissing=true`）的路由场景；这是\
