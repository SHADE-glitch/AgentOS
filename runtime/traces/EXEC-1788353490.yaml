agent_response: "The working directory is a benchmark harness (A/B arms, loop logs);\
  \ there is no application source to inspect here, so this is a self-contained design-assessment\
  \ task. Below is my structured Database Engineer response to the Redis-cached dashboard-aggregate\
  \ question.\n\n---\n\n# Redis-Cached Dashboard Aggregates — Staleness & Mutation-Safety\
  \ Assessment\n\n## 1. Conclusion first\n\nA TTL on a dashboard aggregate only guarantees\
  \ the cache **won't be trusted beyond age N**. It does **not** guarantee the cached\
  \ value reflects the source database. The two failure classes you must separate:\n\
  \n1. **Time staleness** — inherently bounded, but it can exceed the stated TTL whenever\
  \ the aggregate is *time-computed* (it goes stale even with zero writes).\n2. **Logical\
  \ staleness** — a mutation to source rows occurred after materialization but before\
  \ expiry, so the cache serves a value the DB no longer supports. This is the correctness\
  \ risk.\n\nWhether a mutation path is \"safe\" is a function of **which layers that\
  \ path bypasses** and **whether the aggregate is composable**. Roughly:\n\n- **Controlled\
  \ app write paths that touch additive aggregates → safe** (apply deltas atomically\
  \ in Redis).\n- **Controlled app write paths for non-additive aggregates → safe\
  \ only with explicit invalidate-after-commit.**\n- **Uncontrolled paths (direct\
  \ SQL, ETL, bulk loads, cross-table transactions) → NOT safe** under pure TTL; they\
  \ silently go stale until the TTL fires.\n\n---\n\n## 2. When the cached view is\
  \ stale\n\nDefine *stale* precisely: the key is present and within TTL, yet `value\
  \ ≠ aggregate(DB)`. Staleness emerges from the following sources:\n\n| Source |\
  \ Mechanism | Bound by TTL? |\n|---|---|---|\n| **Post-write silent staleness**\
  \ | A mutation lands in the DB and does *not* invalidate the key; servers still\
  \ serve the old value for the rest of the TTL window. | Yes — bounded by remaining\
  \ TTL (worst-case ~full TTL). |\n| **Time-computed aggregates** | \"Revenue today\"\
  , \"active users (last 24h)\", \"7-day avg\". Value changes with wall clock even\
  \ with **zero writes**; TTL only controls *recompute cadence*, so freshness is `now\
  \ − computed_at`, not 0. | Only cadence-bound; value is stale the instant it's written.\
  \ |\n| **Clock skew / scheduling drift** | Distributed app servers set/expire TTLs\
  \ from their own clocks; staggered refresh produces mixed-generation values across\
  \ shards/queries. | Indirect. |\n| **Multi-table (joined) aggregates** | The aggregate\
  \ spans several tables. If invalidation is per-table and fires at different times\
  \ (or fails on one), readers can observe a `JOIN` snapshot that never existed atomically\
  \ → logically inconsistent, not merely old. | Not by TTL. |\n| **Eviction before\
  \ TTL** | `allkeys-lru` / `volatile-*` eviction under memory pressure drops the\
  \ key early; cache-aside rebuild reseeds it — but if rebuild is skipped (\"absent\
  \ ⇒ assume something\"), you read cold/poisoned results. | No — non-deterministic.\
  \ |\n| **Empty-result poisoning** | Caching an *absent* aggregate can read as \"\
  0\" or \"no data\" that is then not recomputed; a silent bug distinct from normal\
  \ staleness. | Only if negative-cached with its own TTL. |\n| **Write-side side-channel**\
  \ | Mutations via replica readers, ETL jobs, or manual SQL never touch the app layer,\
  \ so no invalidation hook fires at all. | Only by TTL expiry. |\n\n**Practical stale\
  \ window formula:** `worst_visible_staleness ≈ lastWriteTime − min(computedAt, nextExpiry)`\
  \ for time-computed metrics, and up to an **entire TTL** for post-write logical\
  \ staleness on uncontrolled paths.\n\n---\n\n## 3. Which mutation paths are safe\n\
  \nSafety here = *after this path runs, the cache is guaranteed (or deterministically\
  \ bounded) to converge to the correct aggregate without serving an inconsistent\
  \ view.*\n\n### 3.1 Decision framework\n\n```text\nPath type:\n  Controlled (routes\
  \ through app service, can run post-commit hooks)?\n    Yes → aggregate composable?\n\
  \      Additive / counter (count, sum, monotonic)  → SAFE: atomic delta (no full\
  \ recompute).\n      Non-additive (avg, median, top-N, distinct, percentiles, ratios)\n\
  \                                                → SAFE ONLY IF invalidate-after-commit.\n\
  \      Cross-table JOIN                            → SAFE ONLY IF invalidated AFTER\
  \ the whole\n                                                   transaction commits\
  \ atomically.\n    No  → TTL alone is insufficient → MUST add DB-driven change signal\
  \ (below).\n  Uncontrolled (raw SQL, ETL, bulk loader, replicate-write)?\n    Not\
  \ safe under pure TTL → route through service, or drive invalidation from the DB.\n\
  ```\n\n### 3.2 Safe paths (recommended)\n\n**① Additive aggregates — atomic delta\
  \ (write-behind).**\nFor anything monotonic/additive (order count, revenue sum,\
  \ user count), don't recompute; fold the delta into Redis atomically in the same\
  \ write path.\n\n```python\ndef on_order_completed(tenant, amount):\n    with db.transaction()\
  \ as tx:                 # commit the source row\n        tx.execute(\"INSERT INTO\
  \ orders (...) VALUES (...)\", ...)\n        tx.commit()\n    # then fold delta\
  \ into the cached aggregate (post-commit)\n    redis.pipeline() \\\n        .hincrby(f\"\
  dash:{tenant}:order\", \"revenue_cents\", amount) \\\n        .hincrby(f\"dash:{tenant}:order\"\
  , \"count\", 1) \\\n        .expire(f\"dash:{tenant}:order\", TTL) \\\n        .execute()\n\
  ```\nSafe because the delta is derived **from the committed change** and applied\
  \ atomically. Add an idempotency key (`order_id` seen-set with its own short TTL)\
  \ so retried deliveries don't double-count.\n\n**② Non-additive aggregates — invalidate-after-commit\
  \ (versioned keys).**\nNo delta is possible; instead, on commit, delete or **bump\
  \ the version** so the next read recomputes exactly once (with single-flight protection).\n\
  \n```python\ndef on_rating_submitted(tenant, product_id):\n    db.update_rating(...)\
  \                                  # commit\n    key = f\"dash:{tenant}:rating:avg:{product_id}\"\
  \n    current = redis.get(f\"dash:version:{key}\")             # versioned key\n\
  \    if current is not None:\n        redis.set(f\"dash:version:{key}\", current\
  \ + 1)      # bump, readers rebuild\n    redis.delete(key)                     \
  \                  # or DEL directly\n```\n\n**③ Cross-table transactions — invalidate\
  \ only after atomic commit.** Compute the affected aggregate keys, and remove them\
  \ **only after** `commit()`, never inside/prior to the transaction and never per-table.\
  \ If you must invalidate mid-transaction, gate rebuilds on the new `updated_at`\
  \ watermark so a reader can't pick up a half-committed state.\n\n### 3.3 Unsafe\
  \ paths and the required countermeasures\n\n**④ Direct SQL / ETL / bulk loads.**\
  \ No hook fires. Pure TTL means `stale up to TTL`. Countermeasures (pick by controllable\
  \ staleness SLA):\n\n- **Option A — version/max-timestamp watermark read from DB,\
  \ not TTL.** The refresher recomputes when `db.max(updated_at) > cached_watermark`,\
  \ independent of wall-clock TTL. TTL becomes a *safety floor only*.\n\n```python\n\
  def is_stale(cache_key, cached_row):\n    # DB-derived watermark (reliable even\
  \ for uncontrolled writes)\n    db_watermark = db.scalar(\n        \"SELECT max(updated_at)\
  \ FROM orders WHERE tenant_id=%s\", tenant)\n    return db_watermark.timestamp()\
  \ > cached_row[\"computed_at\"]\n```\n\n- **Option B — CDC / logical-replication\
  \ → pub/sub invalidation.** Stream committed changes to an invalidation consumer\
  \ that reconstructs affected aggregate keys. This is the only way to make *uncontrolled*\
  \ writes safe, because awareness comes from the DB itself.\n\n- **Option C — TTL\
  \ ≤ acceptable-staleness SLA.** If you cannot instrument the write path, lower the\
  \ TTL to the business-acceptable staleness bound (`TTL ≤ SLA`). Safe only in the\
  \ *bounded-staleness* sense, never in the *always-exact* sense. Not recommended\
  \ as the primary mechanism.\n\n---\n\n## 4. Concrete hardening (make both staleness\
  \ and mutation-safety tractable)\n\n**A. Single-flight / stampede control.** Recompute\
  \ of heavy aggregates behind a per-key lock so expiry of a hot key doesn't collapse\
  \ the source DB.\n\n```lua\n-- RECOMPUTE_IF_ABSENT.lua : compute once under lock,\
  \ others wait/short-TTL\nif redis.call('EXISTS', KEYS[1]) == 1 then return redis.call('GET',\
  \ KEYS[1]) end\nif redis.call('SET', KEYS[2], '1', 'NX', 'EX', ARGV[1]) == false\
  \ then\n    return redis.call('GET', KEYS[1])   -- another worker computing; serve\
  \ stale/empty briefly\nend\nreturn redis.call('SET', KEYS[1], ARGV[2], 'EX', ARGV[3])\n\
  ```\n\n**B. Stamp the payload with freshness metadata** so consumers never *assume*\
  \ freshness they didn't validate:\n\n```json\n{ \"computed_at\": 1730505600, \"\
  aggregate\": { \"revenue\": 12345, \"count\": 340 } }\n```\n\nClient renders \"\
  as of 09:00\" and can decide acceptability per metric instead of trusting `key exists`.\n\
  \n**C. Config for non-additive aggregates (safe defaults).**\n\n```yaml\ncache:\n\
  \  additive:      { delta: true,              ttl: 300, idempotency_key_ttl: 3600\
  \ }\n  analytical:    { delta: false, invalidate: true, ttl: 60,  single_flight:\
  \ true,\n                   negative_ttl: 15, eviction_policy: allkeys-lru }\n \
  \ joined:        { invalidate_after_commit: true, ttl: 60, watermark: updated_at\
  \ }\n```\n\n**D. Reconciliation job.** Even \"safe\" delta paths drift (Redis restart/eviction,\
  \ missed increments). Run a periodic recompute vs. the delta-accumulated value;\
  \ if diff exceeds a threshold, resync. This turns \"safe\" into \"safe *and* self-healing.\"\
  \n\n---\n\n## 5. Validation\n\n- **Mutation-matrix tests:** for each path type,\
  \ assert cache value equals recompute(DB) after: (a) controlled write, (b) uncontrolled\
  \ bulk write, (c) cross-table commit, (d) retried/delivered idempotent write, (e)\
  \ Redis restart.\n- **Staleness-bound tests:** set TTL, fire a write, assert the\
  \ observed organization is `≤ TTL` for controlled paths, and never exceeds the acceptable-SLA\
  \ bound on uncontrolled paths.\n- **Stampede test:** expire a hot key under ~50\
  \ concurrent readers; assert DB sees ~1 compute (single-flight), no fold.\n- **Clock/time-metric\
  \ test:** assert a wall-clock metric (`today_revenue`) refreshes on schedule even\
  \ in the absence of writes.\n\n---\n\n## 6. Summary\n\n- **Stale when:** (1) a write\
  \ occurred post-materialization within the TTL window (logical staleness), (2) the\
  \ metric is time-computed so it self-expires regardless of writes, or (3) an uncontrolled\
  \ path (raw SQL/ETL/bulk) mutated without any invalidation hook — worst case, stale\
  \ for a full TTL.\n- **Safe mutation paths:** controlled app write paths that (a)\
  \ apply atomic deltas for additive aggregates, or (b) invalidate-after-commit (versioned)\
  \ for non-additive, or (c) invalidate after an atomic cross-table commit.\n- **Unsafe\
  \ without extra work:** uncontrolled DB writes and per-table invalidation of joined\
  \ aggregates. Fix via DB-derived watermarks, CDC-driven invalidation, or `TTL ≤\
  \ SLA`, plus single-flight stampede protection, freshness-`computed_at` metadata,\
  \ negative caching, and a reconciliation job.\n\nThe one-sentence rule: **TTL controls\
  \ how old a value may be; only a commit-aware write path (or a DB-driven change\
  \ signal) controls whether a value is wrong.**"
