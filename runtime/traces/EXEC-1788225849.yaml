agent_response: "## 项目分析报告：AiView - AI 面试陪练与智能反馈平台\n\n---\n\n### 1. 项目概述\n\n这是一个 **AI\
  \ 面试陪练平台**，用户可以选择技术主题（Java/Redis/MySQL/JVM/并发）和难度级别进行模拟面试，系统自动提问、收集回答，并给出四维评分（知识掌握、表达清晰、实践来源、问题分析）和改进建议。\n\
  \n---\n\n### 2. 技术栈\n\n| 层级 | 技术 | 版本 |\n|------|------|------|\n| **后端框架** | Spring\
  \ Boot | 3.3.5 |\n| **语言** | Java | 21 (虚拟线程已启用) |\n| **ORM** | MyBatis-Plus | 3.5.9\
  \ |\n| **数据库** | MySQL | 8 |\n| **缓存** | Redis (Redisson) | 7-alpine / Redisson\
  \ 3.35.0 |\n| **消息队列** | RabbitMQ | 3-management |\n| **认证** | JWT (jjwt) | 0.12.6\
  \ |\n| **安全** | Spring Security | (随 Spring Boot) |\n| **AI 客户端** | OpenAI Compatible\
  \ REST | RestClient |\n| **前端框架** | Vue 3 + TypeScript | 3.5.13 |\n| **前端状态** |\
  \ Pinia | 2.3.0 |\n| **前端路由** | Vue Router | 4.5.0 |\n| **前端样式** | Tailwind CSS\
  \ | 4.0.0 |\n| **前端构建** | Vite | 6.0.0 |\n| **容器化** | Docker Compose | 6 服务 |\n\n\
  ---\n\n### 3. 目录结构\n\n```\ntest/\n├── docker-compose.yml          # 6 服务编排：mysql,\
  \ redis, rabbitmq, ollama, backend, frontend\n├── .env / .env.example         #\
  \ 环境变量：AI 供应商配置、基础设施端口、JWT 密钥\n├── backend/\n│   ├── pom.xml                 # Maven\
  \ 构建，Java 21\n│   └── src/main/java/com/aiview/\n│       ├── AiviewApplication.java\n\
  │       ├── common/             # 通用组件：Result, BizException, GlobalExceptionHandler,\
  \ UserContext\n│       ├── config/             # 配置类：SecurityConfig, AiProperties,\
  \ RabbitConfig, RedissonConfig, MybatisPlusConfig\n│       ├── auth/           \
  \    # 认证模块：controller/service/mapper/entity/dto/security\n│       ├── interview/\
  \          # 核心面试模块：controller/service/mapper/entity/dto\n│       ├── rag/     \
  \           # RAG 知识检索模块：controller/service/mapper/entity/dto\n│       ├── agent/ai/\
  \           # AI 客户端抽象层：ChatClient, EmbeddingClient, OpenAi Compatible 实现\n│   \
  \    └── legacy/ai/          # 遗留 AI 模式（mode=ai 时启用）\n├── frontend/\n│   ├── src/\n\
  │   │   ├── api/                # API 调用层：auth, client, dashboard, interview, knowledge\n\
  │   │   ├── pages/              # 页面：Home, Interview, KnowledgeMap, Dashboard, Login,\
  \ Register\n│   │   ├── stores/             # Pinia 状态：auth\n│   │   ├── router/\
  \             # Vue Router 路由定义\n│   │   └── types.ts            # 前端类型定义\n│   └──\
  \ vite.config.ts\n└── ollama/                     # Ollama 本地模型 Dockerfile\n```\n\
  \n---\n\n### 4. 后端包职责\n\n| 包 | 职责 | 关键类 |\n|---|------|--------|\n| `common` | 统一响应\
  \ `Result<T>`、业务异常 `BizException`、全局异常处理、用户上下文 `UserContext` | `Result`, `ResultCode`,\
  \ `BizException`, `GlobalExceptionHandler` |\n| `config` | 框架配置：安全链、RabbitMQ、Redisson、MyBatis-Plus、AI\
  \ 多供应商属性 | `SecurityConfig`, `RabbitConfig`, `AiProperties` |\n| `auth` | 用户注册/登录/JWT\
  \ 认证、用户实体与 Profile | `AuthController`, `AuthService`, `JwtUtil`, `JwtAuthenticationFilter`\
  \ |\n| `interview` | **核心业务**：面试会话管理、题库抽题、规则评分、报告生成、Dashboard 聚合 | `InterviewService`,\
  \ `QuestionBank`, `EvaluationService`, `ReportService`, `DashboardService` |\n|\
  \ `rag` | 用户知识库 CRUD、文本分块、向量 Embedding、余弦相似度检索 | `RagService` |\n| `agent/ai` |\
  \ AI 客户端抽象（Chat + Embedding）、OpenAI 兼容实现（支持流式 + Tool Calling） | `ChatClient`, `EmbeddingClient`,\
  \ `OpenAiCompatibleChatClient` |\n| `legacy/ai` | 遗留 AI 模式：AI 评分（`LegacyAiScoringService`）、AI\
  \ RAG 检索（`LegacyAiRagService`），通过 `@ConditionalOnProperty` 按 mode 切换 | `LegacyAiScoringService`,\
  \ `LegacyAiRagService` |\n\n---\n\n### 5. 数据模型（8 张表）\n\n| 表名 | 用途 | 关键字段 |\n|------|------|----------|\n\
  | `app_user` | 用户账号 | username, password_hash, nickname |\n| `user_profile` | 用户画像\
  \ | skill_profile(JSON), weak_topics(JSON), interview_count, avg_score |\n| `knowledge_point`\
  \ | 知识点树 | topic, name, difficulty(1/2/3), parent_id |\n| `question` | 题库 | knowledge_point_id,\
  \ content, difficulty, source(SYSTEM/AI) |\n| `interview_session` | 面试会话 | user_id,\
  \ topic, level, status, question_count, total_score, report(JSON) |\n| `interview_message`\
  \ | 问答消息 | session_id, role(AI/USER), kind(question/answer/feedback), content, knowledge_point_id\
  \ |\n| `interview_result` | 评分结果 | session_id, dimensions(JSON), total_score, weak_points(JSON),\
  \ suggestions(JSON) |\n| `knowledge_base` / `knowledge_chunk` | 用户知识库 + 分块 | embedding(JSON\
  \ 向量) |\n\n---\n\n### 6. 核心业务流程\n\n```\n用户选题 → 创建 Session → QuestionBank 抽题 → 用户回答\n\
  \    ↓\nInterviewService.answer() → Redisson 分布式锁保护\n    ↓\n判断是否结束（达到 6 题或连续差回答）\n\
  \    ├─ 未结束 → QuestionBank 抽下一题\n    └─ 结束 → EvaluationService 评分 → 投递 RabbitMQ\
  \ → RuleBasedScoringService 异步处理\n                                ↓\n          \
  \              更新 Session + 生成 Report\n```\n\n---\n\n### 7. 双模式架构（关键设计决策）\n\n通过\
  \ `app.interview.mode` 配置项切换：\n\n| 模式 | 评分 | 知识检索 | 条件注解 |\n|------|------|----------|----------|\n\
  | `rule`（默认） | `EvaluationService` 规则评分 | `KeywordKnowledgeRetriever` 关键词匹配 | `@ConditionalOnProperty(havingValue=\"\
  rule\")` |\n| `ai` | `LegacyAiScoringService` AI 评分 | `LegacyAiRagService` 向量检索\
  \ | `@ConditionalOnProperty(havingValue=\"ai\")` |\n\n`InterviewService` 已重构为不直接依赖\
  \ `ChatClient`/`AiProperties`/`RagService`，通过 `QuestionBank` + `EvaluationService`\
  \ + `ReportService` 实现规则模式。\n\n---\n\n### 8. 基础设施交互\n\n```\n┌─────────────┐    \
  \ ┌─────────────┐     ┌─────────────┐\n│   Backend   │────▶│   MySQL 8   │     │\
  \   Redis 7   │\n│  :8080      │     │   :3306     │     │   :6379     │\n└──────┬──────┘\
  \     └─────────────┘     └──────┬──────┘\n       │                            \
  \            │\n       ├───────────────────────────────────────▶│ (Redisson 分布式锁\
  \ + 状态缓存)\n       │                                        │\n       ├──────────────▶\
  \ RabbitMQ 3 ◀────────────│ (异步评分任务)\n       │               :5672/15672       \
  \       │\n       │                                        │\n       ├──────────────▶\
  \ Ollama ◀────────────────│ (本地 LLM/Embedding)\n       │               :11434  \
  \                 │\n       │                                        │\n       └──────────────▶\
  \ DeepSeek/OpenAI API     │ (外部 AI 服务)\n```\n\n---\n\n### 9. 架构质量评估\n\n**优点：**\n\
  - 双模式（rule/ai）通过 `@ConditionalOnProperty` 实现优雅切换，无需修改代码\n- Redisson 分布式锁防止面试并发问题\n\
  - `InterviewStateStore` 用 Redis 作为状态机单一权威来源（TTL 24h）\n- 虚拟线程（`spring.threads.virtual.enabled=true`）提升\
  \ I/O 并发\n- AI 客户端抽象（`ChatClient` 接口）支持多供应商\n\n**关注点：**\n- `RagService` 中向量检索是内存全量加载\
  \ + 余弦计算，数据量大时性能瓶颈\n- `InterviewService.answer()` 和 `answerStream()` 有大量重复逻辑（~100\
  \ 行重复代码）\n- `LegacyAiRagService` 与 `RagService` 代码高度重复（~80% 相同）\n- `ReportService`\
  \ 中 `generateReport()` 手动拼接 JSON 字符串，应使用 `ObjectMapper`\n- 缺少测试（无 `src/test` 目录）\n\
  - JWT Secret 硬编码在 `.env.example` 中，生产环境需确保替换"
