  \ = scores.get(doc.id, 0) + 1 / (k + rank)\n    return sorted(scores.items(), key=lambda\
  \ x: x[1], reverse=True)\n```\n\n### 4. Reranking（重排序）\n\n```python\nfrom sentence_transformers\
