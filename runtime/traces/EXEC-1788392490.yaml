agent_response: "# Assessment: Redis-cached Dashboard Aggregates — Staleness & Mutation-Path\
  \ Safety\n\nBased on the actual code, the cache lives in `DashboardService` (key\
  \ `dashboard:user:{id}`, TTL **10 min**), `compute()` aggregates from two stores\
  \ with **asymmetric filters**, and all current mutation paths do call `evict()`.\
  \ The unvalidated hypotheses (`Bucket.get` when Redis is down, etc.) are partly\
  \ addressed by the code's try/catch, but the real risks are subtler. Findings below.\n\
  \n## 1. Cache lifecycle (verified)\n\n`DashboardService.java:52-71` — cache-aside\
  \ read, miss → `compute()` → write with TTL:\n- `build()`: `RBucket.get()` → hit:\
  \ deserialize; miss/parse-fail → recompute + `bucket.set(json, 10, MINUTES)`, TTL\
  \ restarts on every miss-write (10 min sliding from last recompute, not a fixed\
  \ window).\n- `evict()` (`DashboardService.java:81-91`): blind `bucket.delete()`,\
  \ swallows errors/logs only.\n\n`compute()` reads two independent tables:\n- **`InterviewResult`**\
  \ (all rows for user, **no status filter**): drives radar `dimensions`, `weakPoints`,\
  \ `suggestions`.\n- **`InterviewSession`** where `status = FINISHED AND totalScore\
  \ IS NOT NULL, ORDER BY finishedAt` (`:96-101`): drives `stats` (sessionCount, avgScore,\
  \ maxScore, totalQuestions) and `trend`.\n\n## 2. When the cached view is stale\n\
  \n**(a) TOCTOU / last-writer-wins — the main correctness gap.**\n`build()` does\
  \ `compute()` (DB read) then `bucket.set()`. If a concurrent mutation commits its\
  \ DB change and calls `evict()` in the window between `compute()`'s read and `set()`,\
  \ the stale pre-mutation value is written *after* the eviction → stales until TTL\
  \ expiry (up to 10 min). Evict-after-mutation cannot close this window because the\
  \ cache write is not atomic with the DB read.\n\n**(b) Async-scoring consistency\
  \ window — real staleness right now.**\nIn `InterviewService.answer`/`answerStream`,\
  \ the finish path inserts the `InterviewResult` and calls `evict()`, then `finishSession()`\
  \ sets `FINISHED`/`finishedAt` (itself `totalScore` still null) and `evict()`s again.\
  \ Final `totalScore`/`report` are only applied later by the async RabbitMQ consumer\
  \ (`RuleBasedScoringService` / `InterviewScoringService`), which evicts a second/third\
  \ time (`:57`, `:66`). Net effect:\n- Radar/weakPoints/suggestions (from `InterviewResult`)\
  \ are **correct immediately**, but\n- `stats.sessionCount`, `avgScore`, `maxScore`,\
  \ `trend` are **stale (pre-finish) until the consumer updates `session.totalScore`\
  \ + evicts**. Window ≈ consumer queue latency; if the consumer retries, it extends.\n\
  \n**(c) Result/session asymmetry.** `compute()` counts **every** `InterviewResult`\
  \ regardless of session status, while tour trend/stats require `FINISHED` + non-null\
  \ `totalScore`. A result persisted for a session that never reaches FINISHED (failure\
  \ after insert) is permanently counted in the radar but excluded from stats — not\
  \ from caching, but can surprise.\n\n**(d) TTL as the only safety net.** Every reachable\
  \ mutation already evicts, so staleness is normally sub-second — *bounded* stales\
  \ only occur in (a), (b), or if Redis is briefly unavailable. But the design depends\
  \ on every future writer remembering to call `evict()`; the `DashboardService` javadoc\
  \ (`:74-80`) documents this as a manual contract, which is drift-prone.\n\n## 3.\
  \ Mutation-path safety matrix (all current paths verified)\n\n| Path | Mutations\
  \ | Evict coverage | Safe? |\n|---|---|---|---|\n| `InterviewService.start` | `sessionMapper.insert(START)`\
  \ | none needed (not FINISHED, no totalScore) | Safe / no-op |\n| `answer` / `answerStream`\
  \ mid-loop | `sessionMapper.updateById(ASKING, questionCount)` | none | Safe (not\
  \ aggregated) |\n| `answer` / `answerStream` finish | `resultMapper.insert` + `evict`\
  \ (`:152,169,227,244`); `finishSession` `updateById(FINISHED)` + `evict` (`:349`)\
  \ | Yes | Safe (but see async window 2b) |\n| `finishSession` (shared) | `updateById(FINISHED,\
  \ finishedAt)` + `evict` | Yes | Safe |\n| `RuleBasedScoringService` (async) | insert\
  \ result + `evict` (`:57`); update totalScore/report + `evict` (`:66`) | Yes (double)\
  \ | Safe |\n| `InterviewScoringService` (AI async) | insert + `evict` (`:106`);\
  \ update + `evict` (`:111`) | Yes (double) | Safe |\n| `LegacyAiScoringService`\
  \ | insert + `evict` (`:113`); update + `evict` (`:118`) | Yes (double) | Safe |\n\
  | `QuestionBank` update | question rows only | n/a – not dashboard input | Safe\
  \ |\n\nAll current writers are covered. **No un-evicted dashboard-affecting mutation\
  \ exists today.**\n\n## 4. Recommendations\n\n1. **Close the TOCTOU window (highest\
  \ priority).** Options, cheapest first:\n   - After `compute()`, before `set()`,\
  \ re-check whether an eviction landed: `if (bucket.isExists()) return vo;` — still\
  \ racy but sharply reduces the stale-write-after-evict case.\n   - Topological fix:\
  \ don't blind-set. Publish the rebuild through the mutation flow (single-writer\
  \ model where the finisher/consumer holds the compute) instead of letting `build()`\
  \ race mutations.\n2. **Fix the async staleness window.** Either (a) have the async\
  \ consumer set `totalScore` before the dashboard is served (needs a \"pending score\"\
  \ state), or (b) treat `FINISHED AND totalScore IS NULL` as a hit and background-refresh,\
  \ so `build()` never serves the pre-finish stats. At minimum keep the double-evict\
  \ already present.\n3. **Centralize the eviction contract.** Introduce a small event/`@TransactionalEventListener`\
  \ on session-finish and result-write, or a `DashboardCache` facade, so future mutation\
  \ paths can't forget `evict()`.\n4. **Resilience for the `get()`-when-Redis-down\
  \ hypothesis.** `build()` already falls through to `compute()` on read error (`:56-62`)\
  \ and swallows write errors (`:66-69`), so Redis outage degrades to \"no cache\"\
  \ rather than failing the request — that behavior is confirmed safe. Add a circuit-breaker\
  \ so a dead Redis doesn't add a full DB recompute on every request under load.\n\
  5. **Cache stampede.** The 10-min TTL with recompute-on-miss can stampede under\
  \ concurrent dashboard loads. Add singleflight (e.g., an `RLock(\"dashboard:compute:{userId}\"\
  )`) around `compute()`.\n6. Redisson default `StringCodec` on `RBucket<String>`\
  \ is fine for the app's own `ObjectMapper` round-trip; keep using string buckets\
  \ with the app `ObjectMapper` for consistent `Asia/Shanghai` / `non_null` handling\
  \ rather than switching to Kryo/Jackson codecs.\n\n## 5. Bottom line\nAll current\
  \ mutation paths are **safe** (eviction covered), and the TTL is a correct fallback,\
  \ not the primary coherency mechanism. Two genuine staleness sources remain: the\
  \ **compute/evict race (2a)** and the **async-scoring stats lag (2b)** — neither\
  \ is fixed by the TTL or by adding more evict calls. Address those and the cache\
  \ is read-consistent for this workload."
