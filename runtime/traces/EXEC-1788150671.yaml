agent_response: "# AIView 项目 RAG 结构分析\n\n## 项目概述\n\n**AIView** 是一个 AI 面试陪练与智能反馈平台，采用\
  \ Java Spring Boot 3.3.5 + Vue 3 + TypeScript 架构。\n\n---\n\n## 1. 架构总览\n\n```\n\
  ┌─────────────────────────────────────────────────────────┐\n│                 \
  \   Frontend (Vue 3)                     │\n│  ┌──────────┐ ┌──────────┐ ┌────────────┐\
  \ ┌──────────┐ │\n│  │  Home    │ │Interview │ │KnowledgeMap│ │Dashboard │ │\n│\
  \  └──────────┘ └──────────┘ └────────────┘ └──────────┘ │\n└───────────────────────┬─────────────────────────────────┘\n\
  \                        │ REST API\n┌───────────────────────▼─────────────────────────────────┐\n\
  │                 Backend (Spring Boot)                   │\n│  ┌─────────────┐\
  \ ┌──────────────┐ ┌──────────────────┐ │\n│  │InterviewSvc │ │KnowledgeMap  │ │InterviewScoring\
  \  │ │\n│  │             │ │Service       │ │Service (RabbitMQ)│ │\n│  └─────────────┘\
  \ └──────────────┘ └──────────────────┘ │\n└───────┬───────────────┬───────────────┬─────────────────┘\n\
  \        │               │               │\n┌───────▼───────┐ ┌─────▼─────┐ ┌───────▼───────┐\n\
  │    MySQL 8    │ │  Redis 7  │ │  RabbitMQ 3   │\n│ (Knowledge +  │ │ (Session\
  \  │ │ (Scoring      │\n│  Questions)   │ │  State)   │ │  Async Task)  │\n└───────────────┘\
  \ └───────────┘ └───────────────┘\n```\n\n---\n\n## 2. \"RAG\" 结构分析（非传统 RAG）\n\n\
  > **重要说明**: 本项目**不是传统 RAG 系统**（无向量数据库、无 embedding、无语义检索）。它是一个**结构化知识库 + 规则评分**系统。\n\
  \n### 2.1 知识层（Knowledge Layer）\n\n| 组件 | 文件 | 说明 |\n|------|------|------|\n| 知识点实体\
  \ | `KnowledgePoint.java` | 两层树结构：Topic → KnowledgePoint |\n| 知识点表 | `knowledge_point`\
  \ | 5 个主题 × 5-6 个子知识点 |\n| 题库表 | `question` | 75+ 道面试题，关联知识点 |\n\n**知识点层次结构**:\n\
  ```\nJava (Topic)\n├── 集合框架 (difficulty: 2)\n├── 泛型与反射 (difficulty: 2)\n├── 异常体系\
  \ (difficulty: 1)\n├── IO 与 NIO (difficulty: 3)\n└── Java 新特性 (difficulty: 2)\n\n\
  Redis / MySQL / JVM / 并发 (同结构)\n```\n\n### 2.2 检索层（Retrieval Layer）\n\n**问题检索逻辑**\
  \ (`QuestionMapper.java:15-30`):\n```sql\n-- 按主题+难度随机抽题\nSELECT q.* FROM question\
  \ q \nJOIN knowledge_point kp ON q.knowledge_point_id = kp.id \nWHERE kp.topic =\
  \ #{topic} AND q.difficulty = #{difficulty} \nORDER BY RAND() LIMIT 1\n\n-- 回退：按主题随机\n\
  SELECT q.* FROM question q \nJOIN knowledge_point kp ON q.knowledge_point_id = kp.id\
  \ \nWHERE kp.topic = #{topic} ORDER BY RAND() LIMIT 1\n```\n\n**检索策略**: 随机抽取（非语义检索），按难度匹配后\
  \ `RAND()` 选取。\n\n### 2.3 生成层（Generation Layer）\n\n**面试流程** (`InterviewService.java`):\n\
  1. 用户选择主题 + 难度 → 创建 Session\n2. 随机抽取第一道题 → 返回给前端\n3. 用户回答 → 保存消息 → 继续抽题（最多 6 题）\n\
  4. 面试结束 → 发送 RabbitMQ 消息 → 异步评分\n\n**评分逻辑** (`InterviewScoringService.java:124-212`):\n\
  - **知识掌握**: 关键词命中率（Java/Redis/MySQL/JVM/并发各有专属关键词库）\n- **表达清晰**: 答案长度 + 结构化程度（是否有分点）\n\
  - **实践来源**: 项目经验指标词（\"项目\"、\"线上\"、\"踩过\"等）\n- **问题分析**: 深度思考词（\"因为\"、\"本质上\"、\"\
  对比\"等）\n\n### 2.4 知识图谱层（Knowledge Graph）\n\n**构建逻辑** (`KnowledgeMapService.java:25-78`):\n\
  ```java\n// 1. 查询所有知识点（树结构）\n// 2. 聚合用户已完成面试的平均分\n// 3. 计算每个 Topic 的掌握度\n// 4. 构建节点+边的图结构（前端用\
  \ ECharts 渲染）\n```\n\n**掌握度计算**: `avg_score / 40 * 100`（总分 40 分制）\n\n---\n\n## 3.\
  \ 数据流\n\n```\n用户选题 → InterviewService.create()\n    ↓\nQuestionMapper.findRandomByTopicAndDifficulty()\
  \ [MySQL]\n    ↓\n返回题目 → 用户回答 → InterviewService.answer()\n    ↓\n保存消息 → 检查是否达到\
  \ 6 题\n    ↓ (否)\n继续抽题\n    ↓ (是)\nInterviewService.finishSession()\n    ↓\nRabbitMQ\
  \ → InterviewScoringService.score()\n    ↓\n四维评分 → 保存 InterviewResult → 更新 Session.report\n\
  \    ↓\nKnowledgeMapService.buildMap() [聚合评分 → 知识图谱]\n    ↓\nDashboardService.build()\
  \ [聚合评分 → 雷达图 + 趋势]\n```\n\n---\n\n## 4. 关键技术栈\n\n| 层级 | 技术 | 用途 |\n|------|------|------|\n\
  | 数据库 | MySQL 8 | 知识点、题库、会话、评分 |\n| 缓存 | Redis 7 (Redisson) | 会话状态（TTL 24h）、Dashboard\
  \ 缓存（10min） |\n| 消息队列 | RabbitMQ 3 | 异步评分任务 |\n| 前端可视化 | ECharts | 知识图谱力导向图 |\n\
  | 状态管理 | Redisson 分布式锁 | 防止并发答题 |\n\n---\n\n## 5. 当前局限与改进建议\n\n### 5.1 不是真正的 RAG\n\
  - ❌ 无向量数据库（如 Milvus、Pinecone）\n- ❌ 无 embedding 模型\n- ❌ 无语义检索（仅 `RAND()` 随机）\n\n\
  ### 5.2 评分纯规则化\n- ❌ 无 LLM 参与评分\n- ❌ 关键词匹配过于简单\n- ❌ 无法理解语义相似性\n\n### 5.3 改进建议\n\n\
  **如需升级为真正 RAG**:\n1. 引入向量数据库存储知识点 embedding\n2. 用 LLM 生成题目（替代静态题库）\n3. 用 LLM 做语义评分（替代关键词匹配）\n\
  4. 添加 RAG pipeline：用户问题 → 检索相关知识点 → LLM 生成追问\n\n**当前架构适合**: 结构化面试练习、基础知识考核\n**不适合**:\
  \ 开放式对话、需要语义理解的场景"
