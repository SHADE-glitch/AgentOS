agent_response: "## 目标\n- 业务目标: 系统化诊断并优化 MySQL 慢查询，降低数据库响应延迟，提升吞吐量\n- 当前约束: 需覆盖从发现到修复的完整闭环，包含可落地的配置与代码示例\n\
  - 成功标准: 慢查询占比显著下降，EXPLAIN 执行计划趋于高效，关键接口 P99 延迟达标\n\n## 问题判断\n- 根因或关键问题: 慢查询通常由索引缺失/失效、SQL\
  \ 语句编写不当、配置参数不合理、数据量增长导致执行计划退化四类根因引起\n- 关键假设: 已开启 slow_query_log 且有可分析的日志样本；数据库存在可优化的查询模式\n\
  - 已知限制: 需避免在生产高峰时段执行大范围 ALTER TABLE 或 ANALYZE TABLE\n\n---\n\n## 一、慢查询发现与定位\n\n\
  ### 1.1 确认慢查询日志已开启\n\n```ini\n# my.cnf / my.ini\n[mysqld]\nslow_query_log = ON\n\
  slow_query_log_file = /var/log/mysql/mysql-slow.log\nlong_query_time = 1       \
  \   # 超过 1 秒的查询记入日志（生产建议 0.5 或更低）\nlog_queries_not_using_indexes = ON   # 未使用索引的查询也记录\n\
  min_examined_row_limit = 100       # 扫描行数少于此值的查询不记录\n```\n\n```sql\n-- 动态开启（无需重启）\n\
  SET GLOBAL slow_query_log = 'ON';\nSET GLOBAL long_query_time = 0.5;\nSET GLOBAL\
  \ log_queries_not_using_indexes = 'ON';\n```\n\n### 1.2 使用 pt-query-digest 分析日志\n\
  \n```bash\n# 安装 Percona Toolkit\napt-get install percona-toolkit   # Debian/Ubuntu\n\
  # 或\nyum install percona-toolkit       # RHEL/CentOS\n\n# 分析慢查询日志\npt-query-digest\
  \ /var/log/mysql/mysql-slow.log > slow_query_report.txt\n\n# 按特定时间窗口分析\npt-query-digest\
  \ --since '2026-08-30 00:00:00' --until '2026-08-31 00:00:00' /var/log/mysql/mysql-slow.log\n\
  ```\n\n**输出解读关键字段：**\n\n| 字段 | 含义 | 关注点 |\n|------|------|--------|\n| `Count` |\
  \ 该类查询出现次数 | 高频 + 慢 = 优先优化 |\n| `Exec time` | 总/平均/95%分位耗时 | P99 超过 1s 需立即处理 |\n\
  | `Rows examined` | 平均扫描行数 | 远大于 `Rows sent` 说明索引失效 |\n| `Rows sent` | 平均返回行数 |\
  \ |\n| `Query size` | 查询语句大小 | |\n\n### 1.3 实时查看当前慢查询\n\n```sql\n-- 查看当前正在执行的慢查询\n\
  SHOW PROCESSLIST;\n\n-- 查看最近执行的慢查询（性能_schema）\nSELECT * FROM performance_schema.events_statements_history_long\n\
  WHERE TIMER_WAIT > 1000000000000  -- 超过 1 秒（单位：皮秒）\nORDER BY TIMER_START DESC\n\
  LIMIT 20;\n\n-- 按总等待时间排序的 Top SQL\nSELECT DIGEST_TEXT AS query,\n       COUNT_STAR\
  \ AS exec_count,\n       ROUND(SUM_TIMER_WAIT / 1000000000000, 2) AS total_sec,\n\
  \       ROUND(AVG_TIMER_WAIT / 1000000000000, 3) AS avg_sec,\n       ROUND(MAX_TIMER_WAIT\
  \ / 1000000000000, 3) AS max_sec,\n       SUM_ROWS_EXAMINED AS rows_examined,\n\
  \       SUM_ROWS_SENT AS rows_sent\nFROM performance_schema.events_statements_summary_by_digest\n\
  WHERE SCHEMA_NAME = 'your_database'\n  AND SUM_TIMER_WAIT > 1000000000000\nGROUP\
  \ BY DIGEST_TEXT\nORDER BY SUM_TIMER_WAIT DESC\nLIMIT 20;\n```\n\n---\n\n## 二、查询分析与优化（核心步骤）\n\
  \n### 2.1 使用 EXPLAIN 分析执行计划\n\n```sql\nEXPLAIN FORMAT=JSON SELECT * FROM orders\
  \ WHERE user_id = 100 AND status = 'pending' ORDER BY created_at DESC LIMIT 20;\n\
  ```\n\n**关键检查项：**\n\n```sql\n-- 使用 EXPLAIN ANALYZE 获取实际执行统计（MySQL 8.0+）\nEXPLAIN\
  \ ANALYZE SELECT * FROM orders WHERE user_id = 100 AND status = 'pending' ORDER\
  \ BY created_at DESC LIMIT 20;\n```\n\n重点关注：\n- `type`：避免 `ALL`（全表扫描），至少达到 `ref`\
  \ 或 `range`\n- `key`：确认使用了预期的索引，NULL 表示未使用索引\n- `rows`：估算扫描行数，越少越好\n- `Extra`：避免\
  \ `Using filesort`、`Using temporary`\n\n### 2.2 索引优化\n\n**场景 1：添加复合索引**\n\n```sql\n\
  -- 原则：最左前缀，将选择性高的列放前面\n-- 查询: WHERE user_id = ? AND status = ? ORDER BY created_at\
  \ DESC\nALTER TABLE orders ADD INDEX idx_user_status_created (user_id, status, created_at);\n\
  ```\n\n**场景 2：覆盖索引（避免回表）**\n\n```sql\n-- 如果 SELECT 的列都在索引中，无需回表查主键\n-- 查询: SELECT\
  \ id, user_id, status FROM orders WHERE user_id = ?\nALTER TABLE orders ADD INDEX\
  \ idx_user_status_covering (user_id, status, id);\n```\n\n**场景 3：删除冗余索引**\n\n```sql\n\
  -- 查找冗余索引\nSELECT * FROM sys.schema_redundant_indexes;\n\n-- 查找未使用的索引\nSELECT *\
  \ FROM sys.schema_unused_indexes;\n```\n\n### 2.3 SQL 语句重写\n\n**反模式 1：SELECT ***\n\
  \n```sql\n-- ❌ 反模式\nSELECT * FROM orders WHERE user_id = 100;\n\n-- ✅ 优化：只查询需要的列\n\
  SELECT id, user_id, status, created_at FROM orders WHERE user_id = 100;\n```\n\n\
  **反模式 2：隐式类型转换导致索引失效**\n\n```sql\n-- ❌ 反模式：card_number 是 VARCHAR 类型\nSELECT * FROM\
  \ cards WHERE card_number = 123456789;\n\n-- ✅ 优化：加引号\nSELECT * FROM cards WHERE\
  \ card_number = '123456789';\n```\n\n**反模式 3：函数操作导致索引失效**\n\n```sql\n-- ❌ 反模式\n\
  SELECT * FROM orders WHERE DATE(created_at) = '2026-08-30';\nSELECT * FROM orders\
  \ WHERE YEAR(created_at) = 2026;\nSELECT * FROM orders WHERE LEFT(phone, 3) = '138';\n\
  \n-- ✅ 优化\nSELECT * FROM orders WHERE created_at >= '2026-08-30 00:00:00' AND created_at\
  \ < '2026-08-31 00:00:00';\nSELECT * FROM orders WHERE created_at >= '2026-01-01'\
  \ AND created_at < '2027-01-01';\nSELECT * FROM orders WHERE phone LIKE '138%';\n\
  ```\n\n**反模式 4：OR 导致索引失效**\n\n```sql\n-- ❌ 反模式\nSELECT * FROM orders WHERE user_id\
  \ = 100 OR status = 'pending';\n\n-- ✅ 优化：使用 UNION ALL\nSELECT * FROM orders WHERE\
  \ user_id = 100\nUNION ALL\nSELECT * FROM orders WHERE user_id != 100 AND status\
  \ = 'pending';\n\n-- 或确保有复合索引\nALTER TABLE orders ADD INDEX idx_user_or_status (user_id,\
  \ status);\n```\n\n**反模式 5：LIMIT 分页深度翻页**\n\n```sql\n-- ❌ 反模式：偏移量过大时极慢\nSELECT *\
  \ FROM orders ORDER BY id DESC LIMIT 100000, 20;\n\n-- ✅ 优化：延迟关联（子查询先定位主键）\nSELECT\
  \ o.* FROM orders o\nINNER JOIN (SELECT id FROM orders ORDER BY id DESC LIMIT 100000,\
  \ 20) AS tmp\n  ON o.id = tmp.id;\n\n-- ✅ 或基于游标分页\nSELECT * FROM orders WHERE id\
  \ < :last_seen_id ORDER BY id DESC LIMIT 20;\n```\n\n**反模式 6：JOIN 过多或子查询**\n\n```sql\n\
  -- ❌ 反模式：相关子查询\nSELECT *, (SELECT COUNT(*) FROM order_items WHERE order_id = orders.id)\
  \ AS item_count\nFROM orders;\n\n-- ✅ 优化：预计算或 LEFT JOIN\nSELECT o.*, COALESCE(oi.item_count,\
  \ 0) AS item_count\nFROM orders o\nLEFT JOIN (SELECT order_id, COUNT(*) AS item_count\
  \ FROM order_items GROUP BY order_id) oi\n  ON oi.order_id = o.id;\n```\n\n---\n\
  \n## 三、数据库配置调优\n\n### 3.1 InnoDB 缓冲池配置\n\n```ini\n# my.cnf\n[mysqld]\n# 缓冲池：设置为可用内存的\
  \ 60%-80%\ninnodb_buffer_pool_size = 16G\n\n# 缓冲池实例数（大内存多实例减少争用）\ninnodb_buffer_pool_instances\
  \ = 8\n\n# 脏页刷新比例\ninnodb_io_capacity = 2000\ninnodb_io_capacity_max = 4000\n\n\
  # 刷新方法\ninnodb_flush_method = O_DIRECT\n\n# 日志文件大小（建议为缓冲池的 25%-50%）\ninnodb_log_file_size\
  \ = 4G\ninnodb_log_buffer_size = 64M\n```\n\n### 3.2 连接与线程配置\n\n```ini\n[mysqld]\n\
  # 最大连接数\nmax_connections = 500\n\n# 连接空闲超时\nwait_timeout = 600\ninteractive_timeout\
  \ = 600\n\n# 线程缓存\nthread_cache_size = 100\n\n# 并发线程数\ninnodb_thread_concurrency\
  \ = 0    # 自动\n```\n\n### 3.3 查询缓存（MySQL 5.7 及以下）\n\n```ini\n# MySQL 8.0 已移除查询缓存，以下为\
  \ 5.7 配置\nquery_cache_type = 1\nquery_cache_size = 256M\nquery_cache_limit = 2M\n\
  ```\n\n### 3.4 临时表与排序缓冲区\n\n```ini\n[mysqld]\ntmp_table_size = 256M\nmax_heap_table_size\
  \ = 256M\nsort_buffer_size = 4M\njoin_buffer_size = 4M\nread_rnd_buffer_size = 4M\n\
  ```\n\n**⚠️ 这些是 per-connection 缓冲区，不要设置过大。**\n\n### 3.5 验证配置生效\n\n```sql\n-- 查看当前配置\n\
  SHOW VARIABLES LIKE 'innodb_buffer_pool_size';\nSHOW VARIABLES LIKE 'long_query_time';\n\
  SHOW VARIABLES LIKE 'slow_query_log';\n\n-- 查看缓冲池命中率（应 > 99%）\nSHOW GLOBAL STATUS\
  \ LIKE 'Innodb_buffer_pool_read%';\n-- Innodb_buffer_pool_read_requests / (read_requests\
  \ + reads) ≈ 命中率\n```\n\n---\n\n## 四、表结构与分区优化\n\n### 4.1 大表分区\n\n```sql\n-- 按时间范围分区（适合日志、订单等时序数据）\n\
  ALTER TABLE orders PARTITION BY RANGE COLUMNS(created_at) (\n    PARTITION p2026_01\
  \ VALUES LESS THAN ('2026-02-01'),\n    PARTITION p2026_02 VALUES LESS THAN ('2026-03-01'),\n\
  \    PARTITION p2026_03 VALUES LESS THAN ('2026-04-01'),\n    PARTITION p_future\
  \ VALUES LESS THAN (MAXVALUE)\n);\n\n-- 查询自动命中分区（分区裁剪）\nSELECT * FROM orders WHERE\
  \ created_at >= '2026-08-01' AND created_at < '2026-09-01';\n```\n\n### 4.2 历史数据归档\n\
  \n```sql\n-- 将历史数据迁移到归档表\nCREATE TABLE orders_archive LIKE orders;\nALTER TABLE\
  \ orders_archive ENGINE=InnoDB;\n\n-- 分批迁移（避免锁表）\nINSERT INTO orders_archive SELECT\
  \ * FROM orders WHERE created_at < '2025-01-01' LIMIT 10000;\nDELETE FROM orders\
  \ WHERE created_at < '2025-01-01' LIMIT 10000;\n-- 重复直到迁移完成\n\n-- 归档后删除分区或使用 pt-archiver\n\
  ```\n\n---\n\n## 五、监控与持续优化\n\n### 5.1 关键监控指标\n\n```sql\n-- 慢查询统计\nSHOW GLOBAL STATUS\
  \ LIKE 'Slow_queries';\nSHOW GLOBAL STATUS LIKE 'Slow_launch_threads';\n\n-- 未使用索引的查询次数\n\
  SHOW GLOBAL STATUS LIKE 'Select_full_join';\nSHOW GLOBAL STATUS LIKE 'Select_full_range_join';\n\
  SHOW GLOBAL STATUS LIKE 'Select_range';\nSHOW GLOBAL STATUS LIKE 'Select_scan';\n\
  SHOW GLOBAL STATUS LIKE 'Sort_merge_passes';\n\n-- InnoDB 行锁等待\nSHOW GLOBAL STATUS\
  \ LIKE 'Innodb_row_lock_waits';\nSHOW GLOBAL STATUS LIKE 'Innodb_row_lock_time_avg';\n\
  ```\n\n### 5.2 配置定时自动分析任务\n\n```sql\n-- 创建事件定时记录慢查询 Top 10\nCREATE EVENT IF NOT\
  \ EXISTS log_slow_queries_daily\nON SCHEDULE EVERY 1 DAY\nSTARTS '2026-09-01 00:00:00'\n\
  DO\nBEGIN\n    INSERT INTO daily_slow_query_log (query_digest, exec_count, avg_time,\
  \ max_time)\n    SELECT DIGEST_TEXT, COUNT_STAR, \n           ROUND(AVG_TIMER_WAIT\
  \ / 1000000000000, 3),\n           ROUND(MAX_TIMER_WAIT / 1000000000000, 3)\n  \
  \  FROM performance_schema.events_statements_summary_by_digest\n    WHERE SCHEMA_NAME\
  \ = 'production_db'\n      AND AVG_TIMER_WAIT > 500000000000  -- 平均超过 0.5 秒\n  \
  \  ORDER BY AVG_TIMER_WAIT DESC\n    LIMIT 10;\nEND;\n\n-- 启用事件调度器\nSET GLOBAL event_scheduler\
  \ = ON;\n```\n\n### 5.3 推荐的监控工具栈\n\n| 工具 | 用途 |\n|------|------|\n| **pt-query-digest**\
  \ | 慢查询日志分析 |\n| **sys schema** | 性能视图（`sys.statements_with_full_table_scans`） |\n\
  | **Performance Schema** | 细粒度性能监控 |\n| **Percona Monitoring and Management** |\
  \ 可视化监控面板 |\n| **Prometheus + Grafana** | 自定义指标告警 |\n| **pt-index-usage** | 索引使用率分析\
  \ |\n\n---\n\n## 六、优化优先级决策矩阵\n\n| 优先级 | 条件 | 预期收益 | 操作 |\n|--------|------|----------|------|\n\
