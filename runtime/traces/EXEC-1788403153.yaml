agent_response: "**Assessment: `DashboardService` Redis Cache Staleness — `dashboard:user:{userId}`**\n\
  \n### 1. Executive Summary\n`DashboardService.java:38` caches per-user dashboard\
  \ aggregates in Redis `RBucket` with `CACHE_TTL_MINUTES=10` (`52-71`). Cache is\
  \ a **projection** over `interview_result` + `interview_session` (`FINISHED` + `totalScore`/`finishedAt`).\
  \ **Stale window:** any read between a DB mutation and the next cache miss/eviction\
  \ returns stale aggregates. Post-fix `evict(userId)` exists `backend/src/main/java/com/aiview/interview/service/DashboardService.java:81-91`\
  \ and is called on all 4 write paths. Residual risks are non-atomic `commit→delete`\
  \ race and no freshness stamp/version.\n\n### 2. Grounding\n\n| Component | File:Line\
  \ | Evidence |\n|-----------|-----------|----------|\n| Cache read/write | `DashboardService.java:52-71`\
  \ | `bucket.get()!=null → return` else `compute() → bucket.set(json, 10, MINUTES)`\
  \ |\n| Key | `DashboardService.java:48-50` | `dashboard:user:{userId}` |\n| TTL\
  \ | `DashboardService.java:38` | `CACHE_TTL_MINUTES=10` |\n| Evict | `DashboardService.java:81-91`\
  \ | `delete()` with warn-on-failure, null guard |\n| Redis config | `RedissonConfig.java:22-28`\
  \ | single-server `redis://host:port`, pool 4/16, no TTL config there |\n\n`compute()`\
  \ `DashboardService.java:93-177` aggregates: 4 dimensions from `interview_result.dimensions`\
  \ JSON, trend from `interview_session` `FINISHED`, stats `avgScore/maxScore/totalQuestions`,\
  \ suggestions deduped to 5.\n\n### 3. When Cached View is Stale (G1/G4)\n\n```\n\
  T0: build(userId) miss → compute() from DB truth → set(dashboard:user:123, TTL 10m)\n\
  T1: mutation: InterviewResult INSERT or InterviewSession FINISHED (totalScore/finishedAt\
  \ set)\nT1+ε: if evict(123) succeeds → next build() miss→ recompute (safe, 1 read\
  \ stale)\n      if evict not called / fails → build() returns T0 payload until TTL\
  \ expiry (stale-until-expiry, up to 10m)\nT2: TTL expiry → miss → recompute (self-healing)\n\
  ```\n\n**Unsafe window = `mutation → evict/delete` + `evict → next miss`**. `build()`\
  \ `DashboardService.java:56` treats `bucket.get()!=null` as authoritative with no\
  \ `freshness stamp/version` or DB recency check (G4). Stale aggregates mislead `RadarDimVO`/`TrendPointVO`/`StatsVO`\
  \ (`DashboardVO.java:18-39`) driving user learning decisions (G3).\n\n**Verification\
  \ matrix:**\n\n1. `build()` warm → `INSERT interview_result` → `build()` again →\
  \ compare `cached.dimensions.avg` vs `SELECT avg from interview_result where userId`\
  \ → mismatched if no evict.\n2. `FINISHED` session with `totalScore=32` → `build()`\
  \ cached → `update totalScore=38` → `build()` still 32 until expiry/evict.\n\n###\
  \ 4. Differential Eviction-Coverage Audit (G2) — Which Paths Are Safe\n\nRun `grep\
  \ -rn dashboardService.evict backend/src/main/java` — result: **4 services, all\
  \ evict**.\n\n| Mutation Path | Location | Safe? | Notes |\n|---------------|----------|-------|-------|\n\
  | **InterviewService.finish (sync)** | `InterviewService.java:152,169` (inside `answer()`\
  \ `shouldFinish`/exhaust) | **YES** | `resultMapper.insert(result); evict();` before\
  \ `finishSession()` |\n| **InterviewService.finish (async stream)** | `InterviewService.java:227,244`\
  \ | **YES** | same pattern in `answerStream()` virtual thread |\n| **InterviewService.finishSession**\
  \ | `InterviewService.java:347-349` | **YES** | `updateById(session)` FINISHED +\
  \ `evict()` — covers trend/stats; comment explicitly fixes 10m stale-cache |\n|\
  \ **InterviewScoringService (AI async)** | `InterviewScoringService.java:106,111`\
  \ | **YES** | `insert(result); evict(); updateById(session); evict();` double evict\
  \ covers both tables |\n| **RuleBasedScoringService** | `RuleBasedScoringService.java:57,66`\
  \ | **YES** | identical double evict, active when `app.interview.mode=rule` (default)\
  \ |\n| **LegacyAiScoringService** | `legacy/ai/LegacyAiScoringService.java:113,118`\
  \ | **YES** | same, active when `mode=ai` — mutually exclusive with RuleBased via\
  \ `@ConditionalOnProperty` |\n| **Direct DB write (manual SQL/migration)** | — |\
  \ **UNSAFE** | No app-level hook — requires ops eviction |\n| **DELETE interview_result**\
  \ | — | **UNSAFE if added** | No caller audits delete path; would need new `evict()`\
  \ |\n\n**Conclusion pre-2026-09-02 fix:** `build()` had no `evict()` callers → `grep\
  \ evict` returned 0 → **all paths unsafe** (`no invalidation` stale-until-expiry).\
  \ Post-fix coverage is comprehensive; a claim of \"no invalidation\" is now **false**\
  \ (key discriminator, `benchmark-8.2.1.4/01-gold-set-derivation.md:54`).\n\n###\
  \ 5. Remaining Residual Risks (Despite Full Coverage)\n\n1.  **Non-atomic commit→evict\
  \ window** `InterviewScoringService.java:105-111`: `resultMapper.insert()` commits,\
  \ then `evict()` deletes outside TX. Concurrent `build()` between them can repopulate\
  \ stale. Same for `sessionMapper.updateById()` → `evict()` in `InterviewService.java:344-349`.\n\
  2.  **Double-write evict swallow** `DashboardService.java:85-90`: `try/catch log.warn`\
  \ on `delete()` failure → DB truth advances, cache remains stale until TTL. No retry/DLQ.\n\
  3.  **No version/freshness stamp**: `build()` never stores `updatedAt` or `SELECT\
  \ MAX(updated_at)`. Cannot detect `T0/T2` race where `compute()` reads before evict's\
  \ DB commit.\n4.  **Frontend second-level cache** `frontend/src/pages/Dashboard.vue:18-31`\
  \ / `Interview.vue:53-54`: `vue-query` `gcTime/staleTime` still serves pre-eviction\
  \ data after browser back navigation unless `invalidateQueries(['dashboard'])` on\
  \ result write.\n5.  **Duplicate scoring consumers** `RabbitConfig.SCORING_EXCHANGE`\
  \ consumed by both `RuleBasedScoringService.java:38` and `InterviewScoringService.java:46`\
  \ on same queue `aiview.interview.scoring` → depending on `mode`, one is disabled\
  \ but misconfig yields double `insert` + double `evict` (idempotency not guarded).\n\
  \n### 6. Recommendations\n\n**A. Keep TTL + evict (cache-aside), add hardening:**\n\
  ```java\n// DashboardService.java:66 - add jitter to avoid stampede, keep 10m default\n\
  bucket.set(json, CACHE_TTL_MINUTES + ThreadLocalRandom.current().nextInt(-2,3),\
  \ TimeUnit.MINUTES);\n\n// finalize safety: always evict, log metric on failure\n\
  public void evict(Long userId){\n    if(userId==null) return;\n    try{ redissonClient.getBucket(key(userId)).delete();\
  \ }\n    catch(Exception e){ log.warn(\"evict failed userId={}\", userId, e); meter.counter(\"\
  dashboard.evict.fail\").increment(); }\n}\n```\n\n**B. Make eviction transactional\
  \ / at-least-once:**\n- Option 1: TX + afterCommit evict: `TransactionSynchronizationManager.registerSynchronization(afterCommit\
  \ -> evict())` instead of immediate delete after `insert`.\n- Option 2: Outbox pattern:\
  \ write `dashboard_evict_outbox(userId)` in same DB TX as `result/session` update;\
  \ async relay deletes. Guarantees eventual freshness even if Redis down.\n- At minimum\
  \ retry: `try evict 3x with backoff` or enqueue to Rabbit `dashboard.evict`.\n\n\
  **C. Add freshness guard (G4 fix):**\n```java\n// store version\nrecord CachedDashboard(DashboardVO\
  \ vo, long maxResultId, long maxSessionUpdatedMs){}\nbucket.set(mapper.writeValueAsString(new\
  \ CachedDashboard(vo, maxId, now)), TTL, MINUTES);\n// on read, optionally compare\
  \ maxId vs DB SELECT MAX(id) if staleness-sensitive\n```\n\n**D. Config `RedissonConfig.java:24-27`:**\n\
  ```yaml\nspring.data.redis.host: ${REDIS_HOST:localhost}\nspring.data.redis.port:\
  \ 6379\n# add\nredisson:\n  dashboard-ttl-minutes: 10 # externalize CACHE_TTL_MINUTES\n\
  \  evict-retry: 3\n```\nSet `connectionPoolSize 16` ok for dashboard QPS; monitor\
  \ `used_memory` expiry volume.\n\n**E. Frontend** `Dashboard.vue:19`: `queryClient.invalidateQueries({queryKey:['dashboard']})`\
  \ on `InterviewService.finishSession` success + on `visibilitychange` / navigation\
  \ to `/dashboard`.\n\n### 7. How to Verify Now\n```bash\ngrep -rn \"dashboardService.evict\"\
  \ backend/src/main/java # must show 4 services, 9 call sites\ngrep -rn \"CACHE_TTL\"\
  \ backend/src/main/java/com/aiview/interview/service/DashboardService.java\n# Test\
  \ matrix: seed user, build→cached, insert result via InterviewService.answer()->finish,\
  \ assert build() != stale within 1s (not 10m)\n```\nAdd integration test: `DashboardServiceTest.evictOnAllPaths()`\
  \ mocking `RedissonClient` verifying `delete()` called after each `insert`.\n\n\
  **Invariant:** *Every path that mutates `interview_result` or `interview_session.FINISHED/totalScore/finishedAt`\
  \ must atomically `evict(dashboard:user:*)`; cache is never source of truth — `Lesson\
  \ vector L` from `Phase-8.2.1.4-Benchmark-Specification.md:74`.*\n"
