agent_response: "## Impact Assessment: `KeywordKnowledgeRetriever` fallback\n\n###\
  \ 1. Behavior under analysis\n\n`KeywordKnowledgeRetriever.java:62-70` — when no\
  \ keyword matches, the child-name fallback triggers:\n\n```java\n// 如果没有匹配，返回所有知识点概述\n\
  if (matchCount == 0) {\n    sb.append(\"当前主题知识点：\");\n    for (KnowledgePoint point\
  \ : points) {\n        if (point.getParentId() != null) { // 只显示子知识点\n         \
  \   sb.append(point.getName()).append(\"、\");\n        }\n    }\n}\n```\n\n**Key\
  \ facts established from the code:**\n- Unbounded — unlike the matched branch (capped\
  \ at `matchCount >= 5` at line 58), the fallback iterates *every* child node in\
  \ the topic with no `limit()`. Count scales linearly with topic size.\n- Names only\
  \ — it emits `name` with a `、` separator, dropping `description` entirely, so the\
  \ injected context is low-signal even though the description was available.\n- Reuses\
  \ a misleading header — line 48 prepends `\"以下是与查询相关的知识点（供参考）\"` *before* the fallback\
  \ branch, so the model receives a label that asserts topical relevance when the\
  \ content is actually the whole un-filtered topic.\n\n### 2. Mechanics of the dilution\n\
  \nThe return value is a single string intended to be embedded in the LLM prompt\
  \ as supporting context. The failure path injects noise under a relevance header:\n\
  \n| Dimension | Matched path (≤5) | Fallback path |\n|---|---|---|\n| Relevance\
  \ label | accurate (\"与查询相关\") | false (\"与查询相关\" on unrelated names) |\n| Token\
  \ count | bounded (5 × name+desc) | unbounded (N children × name) |\n| Signal density\
  \ | high (desc included) | low (names only, no desc) |\n| Selection | keyword-filtered\
  \ | whole-topic dump |\n\n### 3. Impact scoring\n\n**Context dilution — High.**\
  \ Every in-topic name unrelated to the query competes with genuinely relevant signal\
  \ for the LLM's attention window. In an interview scoring flow, the model may surface\
  \ or probe irrelevant child points, degrading question-targeting and scoring accuracy.\n\
  \n**Token/latency cost — Medium-to-High.** `DESC` exists on the child rows (`KnowledgePointMapper`\
  \ line 38 fetches full entities, including `description`), and although only `name`\
  \ is serialized, the query already pulls all rows for the topic. Cost of the returned\
  \ string is proportional to topic cardinality × avg name length; a large topic can\
  \ add hundreds of low-value tokens per call.\n\n**Correctness/trust — High.** The\
  \ `\"与查询相关\"` header on a topic-level dump is an outright label inconsistency. Models\
  \ calibrated against this convention will weight unrelated content as relevant,\
  \ which can induce confident-but-wrong follow-up questions (RAG-style hallucination\
  \ risk).\n\n**Blast radius — Currently Low (latent).** The bean is injected into\
  \ `InterviewService.java:61` as `knowledgeRetriever`, but **no caller invokes `retrieveContext`**\
  \ — repo-wide search shows the only references are the class definition and the\
  \ unused field. The rag path (`RagService.retrieveContext`, `LegacyAiRagService.java:160`)\
  \ correctly returns `\"\"` on no hits. So today this is dead code; **the defect\
  \ materializes the moment rule-mode wiring is reconnected**, at which point it silently\
  \ corrupts the conversation context. This is a latent, high-priority-fix-on-wiring\
  \ bug.\n\n### 4. Recommendations\n\n**R1 (preferred): return `\"\"` on no match**\
  \ — match the RAG contract and the existing doc'd intent (header only on real matches):\n\
  \n```java\nif (matchCount == 0) {\n    return \"\"; // 无关键词命中时返回空，避免稀释上下文\n}\n```\n\
  \n**R2 (if a fallback is genuinely desired for rule-mode): bounded, description-aware,\
  \ best-effort subset** — never a whole-topic dump; cap and preserve signal:\n\n\
  ```java\nif (matchCount == 0) {\n    List<KnowledgePoint> fallback = points.stream()\n\
  \            .filter(p -> p.getParentId() != null)\n            .limit(3)      \
  \                 // 有界回退\n            .toList();\n    sb.setLength(0);        \
  \                // 清除误导性\"与查询相关\"表头\n    sb.append(\"当前主题推荐知识点：\\n\");\n    for\
  \ (KnowledgePoint p : fallback) {\n        sb.append(\"- \").append(p.getName())\n\
  \          .append(p.getDescription() == null ? \"\" : \"：\" + p.getDescription())\n\
  \          .append(\"\\n\");\n    }\n    return sb.toString();\n}\n```\n(Include\
  \ descriptions or limit to 2–3; a names-only list is too low-signal to justify its\
  \ tokens.)\n\n**R3: add a debug/warn log** for the no-match case so the effective\
  \ retrieval rate is observable:\n```java\nlog.warn(\"keyword no-match query={} topic={}\
  \ childCount={}\", query, topic, childCount);\n```\nThis makes dilution events measurable\
  \ and consumable by the retrieval-quality benchmark you already track.\n\n**R4:\
  \ close the dead-wiring gap** — either invoke `retrieveContext` where the rule-mode\
  \ prompt is composed (and add a unit test asserting `\"\"` on no match), or remove\
  \ the unused `knowledgeRetriever` field from `InterviewService` to prevent silent\
  \ re-activation later.\n\n### 5. Open question for you\nShould rule-mode mirror\
  \ the AI-RAG contract (return `\"\"` on no match — my R1), or do you intend the\
  \ fallback to keep rule-mode self-contained even at lowered precision (R2 with a\
  \ hard cap)? The answer determines severity: R1 makes this effectively a no-op bug;\
  \ without it, every no-match turn in rule mode incurs unwarranted token + relevance\
  \ cost.\n\n**Note on roles/skills:** This is primarily a **RAG/retrieval-quality**\
  \ concern (retrieval precision, context budget) with a **Backend** typing/memory\
  \ angle (unbounded query already at `Mapper:38`) and an **LLM** prompt-conditioning\
  \ angle (relevance-label trust). Recommend aligning the fix with your existing retrieval-evaluation\
  \ benchmark (Phase-8.2.1.x) so the no-match rate and downstream score impact are\
  \ measured, not just reasoned about."
