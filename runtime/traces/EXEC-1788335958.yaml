agent_response: "This working directory contains prior loop/experiment artifacts (agent\
  \ logs, YAML snapshots), not a live dashboard application — so there's no codebase\
  \ to inspect. I'll answer this as a design assessment for a generic aggregate-caching\
  \ layer, as a Database Engineer would.\n\n# Dashboard Aggregate Caching in Redis\
  \ with TTL — Staleness & Mutation Safety Assessment\n\n## 1. Caching model assumed\n\
  \nTypical setup (Cache-Aside):\n\n```\nserve(dashboard):\n  key = \"dash:agg:{tenant}:{scope}:{version}\"\
  \n  v   = redis.get(key)\n  if v is null:\n      v   = compute_aggregate_from_OLTP(source)\
  \   # cost: e.g. SELECT SUM/COUNT over scope\n      redis.set(key, v, ex=AGG_TTL)\
  \               # atomic set-with-expiry\n  return v\n```\n\nTTL provides self-healing\
  \ staleness (guarantees every view is at most `AGG_TTL` old) but gives **no correctness\
  \ guarantee** — it bounds *age*, not *consistency*.\n\n## 2. When is the cached\
  \ view stale?\n\nTreat a cached aggregate as **stale whenever the underlying committed\
  \ source rows that determine it have changed** after the cache entry was written,\
  \ and the change is *still visible to new reads* on the source. Staleness is a function\
  \ of three things:\n\n| Source of staleness | Safe? | Notes |\n|---|---|---|\n|\
  \ Time elapsed ≥ TTL | Always | Expiry fires, next read recomputes. Bounded, predictable.\
  \ |\n| Insert into scoped table | **Not safe** | Count/SUM change immediately →\
  \ stale until TTL expiry. |\n| Update of a row that affects an aggregate | **Not\
  \ safe** | `SUM`, `AVG`, `MAX/MIN`, `COUNT(DISTINCT id)`, weighted buckets all change.\
  \ |\n| Delete of a row in scope | **Not safe** | Aggregates change immediately →\
  \ stale until TTL. |\n| Schema/definition change (metric formula, group-by, filter/WHERE,\
  \ scope/tenant mapping) | **Not safe** | Same cache key can produce wrong semantics\
  \ — a \"definition poisoned\" cache. |\n| Time-window rollover (e.g. \"today\" /\
  \ \"last 30 days\") | **Not safe** | Boundary-based aggregates are stale the instant\
  \ the window slides, even with no writes. |\n| Read-path source now serves different\
  \ data (replica lag / data backfill / ETL reprocess) | **Not safe** | Backfills\
  \ apply to many rows at once; TTL alone produces a long wrong window. |\n\n**Key\
  \ insight:** with a plain TTL you can only *assert* \"the view is at most `T` seconds\
  \ old,\" never \"the view reflects writes committed up to time `W`.\" So an aggregate\
  \ is stale from the moment any relevant mutation commits, and the staleness *window*\
  \ equals the remaining TTL.\n\n## 3. Which mutation paths are safe?\n\nSafety means:\
  \ after the mutation commits, subsequent dashboard reads must reflect it *within\
  \ an acceptable bound* (ideally immediately, or at least not for longer than the\
  \ allowed SLA).\n\n### Safe (can rely on TTL alone, no extra work)\n- **Append-only,\
  \ non-scoped writes** — writes to tables/partitions not included in any cache key's\
  \ scope.\n- **Writes to entities outside the cached dimension** (different tenant/segment/org)\
  \ when keys are dimension-scoped.\n- **True \"window\" the cache is designed for**\
  \ — if the product explicitly accepts up-to-`T`-old numbers (near-real-time reporting\
  \ with a documented SLA). Throttle/rollup counters that are analytically one-sided\
  \ (max-only) also degrade gracefully under staleness.\n\nThese are only *safe to\
  \ ignore* — they don't guarantee freshness, they guarantee no incorrectness *relevant\
  \ to the consumer*.\n\n### Unsafe (need invalidation, not just TTL) — must be intercepted\n\
  1. **Row INSERT / UPDATE / DELETE** where the statement's `WHERE` intersects a cache\
  \ scope.\n2. **Bulk DML**: `INSERT ... SELECT`, `MERGE`, `UPDATE` with wide predicates,\
  \ partition `DROP / TRUNCATE / EXCHANGE`.\n3. **Metric/definition changes**: new\
  \ formula, changed GROUP BY or WHERE, new tenant/scope key.\n4. **Time-window rollover**\
  \ jobs (daily/rolling windows).\n5. **Data backfill / ETL reprocessing** that rewrites\
  \ historical rows.\n\nThese paths **must mutate-specific cache keys** (invalidate\
  \ or regenerate) — otherwise the dashboard lies for the entire TTL.\n\n## 4. Recommended\
  \ architecture (hybrid TTL + invalidation)\n\nKeep the TTL as a **safety-net floor**\
  \ and add **explicit invalidation** so the common (hot) aggregates are consistent\
  \ on commit.\n\n### A. Explicit invalidation (invalidate-on-write)\n\n```python\n\
  def commit_and_invalidate(conn, mutations, agg_key_parts):\n    with conn.cursor()\
  \ as cur:\n        cur.execute(\"BEGIN\")\n        for sql, params in mutations:\n\
  \            cur.execute(sql, params)\n        cur.execute(\"COMMIT\")\n    for\
  \ parts in agg_key_parts:\n        key = dabkey(*parts)          # e.g. \"dash:agg:acme:orders:total\"\
  \n        redis_del(key)                # next read recomputes (lazy) — cheap\n\n\
  def dabkey(*parts) -> str:\n    return f\"dash:agg:{':'.join(str(p) for p in parts)}\"\
  \n```\n\n### B. Invalidation cache-key naming\n\nCompute the key **from parameters\
  \ that fully describe the scope + definition** so a definition change changes the\
  \ key (avoids definition-poisoned serving):\n\n```python\nDEF_VERSION = 13     \
  \                             # bump on any formula/filter change\ndef dabkey(tenant,\
  \ scope, metric, period, def_version=DEF_VERSION):\n    return f\"dash:agg:{tenant}:{scope}:{metric}:{period}:v{def_version}\"\
  \n```\n\n### C. Write-through / cache-aside with stampede protection\n\nAdd **recompute-on-write\
  \ (write-through)** for hot keys so first read isn't a slow recompute, and guard\
  \ against the **thundering herd** when a hot key expires (many readers all recompute):\n\
  \n```python\nimport redis, threading\n\nr = redis.Redis(...)\n_lock_map = defaultdict(threading.Lock)\
  \   # or use SET NX + EX for distributed lock\n\ndef get_agg(key, recompute):\n\
  \    v = r.get(key)\n    if v is not None:\n        return v\n    lock = _lock_map[key]\n\
  \    with lock:                                   # single-flight\n        v = r.get(key)\
  \                           # double-check under lock\n        if v is not None:\n\
  \            return v\n        v = recompute()\n        r.set(key, v, ex=AGG_TTL,\
  \ nx=True)       # don't overwrite a fresher writer\n        return v\n```\n\n###\
  \ D. Distributed single-flight (safer than in-process lock)\n\n```python\ndef get_agg(r,\
  \ key, recompute, ttl=300, lock_ttl=15):\n    v = r.get(key)\n    if v is not None:\n\
  \        return v\n    # acquire an expiry-guarded lock ('dash:lock' is the key\
  \ name, value is holder id)\n    if r.set(f\"dash:lock:{key}\", 1, nx=True, ex=lock_ttl):\n\
  \        try:\n            v = r.get(key)\n            if v is None:\n         \
  \       v = recompute()\n                r.set(key, v, ex=ttl)\n        finally:\n\
  \            r.delete(f\"dash:lock:{key}\")\n        return v\n    # wait and re-read\
  \ (requester already computing)\n    time.sleep(0.05)\n    return r.get(key)\n```\n\
  \n### E. Versioned/grayscale reads for long recompute (recommended for 10M+ row\
  \ aggregates)\n\nIf recompute is expensive, deleting the old key on write creates\
  \ a **cold gap**. Instead compute the new value, then atomically swap:\n\n```python\n\
  def refresh_agg(r, key, recompute, ttl=300):\n    new_key = f\"{key}:{uuid4().hex}\"\
  \     # build-independent\n    r.set(new_key, recompute(), ex=ttl)\n    leftover_key\
  \ = r.getset(key, new_key)   # old value is now a pointer to new_key\n    if leftover_key\
  \ and leftover_key != new_key:\n        r.delete(leftover_key)              # GC\
  \ old blob\n```\nReaders resolve `key -> (blob|pointer)`. This gives **eventually-consistent,\
  \ no-downtime** refresh — readers see the old blob until the swap, then the new\
  \ one, never a miss.\n\n## 5. Config recommendations\n\n- **Two-tier TTL**: short\
  \ TTL for time-sensitive windows (e.g. `today` = 60s), long TTL for stable historical\
  \ aggregates (e.g. `last_90_days` = 900s). Set per-pattern, not one global TTL.\n\
  - **Phase out boundaries, don't cache them**: for rolling windows, cache *hedged*\
  \ metrics (fixed `[N0..N0+90d)` grid) and bucket-map at read time, or force the\
  \ rollover job to invalidate.\n- **Enable `allkeys-lru` eviction** on the Redis\
  \ instance and size `maxmemory` so cache misses don't cascade to OLTP.\n- **AOF\
  \ + RDB**: if the cache is read-relied-on for recovery, enable AOF `everysec`; TTL\
  \ expiry works the same either way.\n- **Instrument**: log per-key staleness = `now\
  \ - set_time`, hit rate, and recompute cost; alert when invalidation count per key/hour\
  \ spikes (signals a hot/contended aggregate gating later interest).\n- **Put source\
  \ mutations through a single write service** so invalidation isn't scattered across\
  \ many call sites — scattered invalidation silently misses paths.\n\n## 6. Bottom\
  \ line\n\n- A **plain Redis TTL bounds *age*, not consistency**. The view is stale\
  \ from the instant a relevant committed mutation occurs until the key expires or\
  \ is invalidated.\n- **Safe-from-TTL-alone**: writes outside a key's scope, dimension-scoped\
  \ writes to other scopes, and windows where up-to-`T`-old numbers are an accepted\
  \ SLA.\n- **Must invalidate on commit**: INSERT/UPDATE/DELETE intersecting scope,\
  \ bulk DML, truncate/drop, metric-definition changes, window rollover, and backfills.\n\
  - **Best practice**: use TTL only as a safety net; add **invalidate-on-write** for\
  \ the common path, name cache keys including a definition version, and guard hot\
  \ recomputes with **single-flight + atomic swap** to avoid stampedes and cold gaps.\n\
  \nIf you point me at an actual dashboard/source-code layout (schema tables, write\
  \ entrypoints, current cache-key scheme), I'll ground this in the concrete paths\
  \ and produce the invalidation enumerations for your exact mutation surface."
