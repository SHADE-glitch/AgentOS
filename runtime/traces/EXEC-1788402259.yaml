agent_response: "### `KeywordKnowledgeRetriever` Fallback — Impact Assessment (Prompt-Engineer)\n\
  \n**File:** `backend/src/main/java/com/aiview/interview/service/KeywordKnowledgeRetriever.java:32-73`\
  \ · Spec: `Phase-8.2.1.4-Benchmark-Specification.md:85` (F-NEG)\n\n#### 1. Code\
  \ Anatomy\n\n```java\n// backend/src/main/java/com/aiview/interview/service/KeywordKnowledgeRetriever.java:47-70\n\
  sb.append(\"以下是与查询相关的知识点（供参考）：\\n\"); // 48: unconditionally claims relevance\n\
  int matchCount=0;\nfor(point: points) { if(name.contains||desc.contains) {sb.append...;\
  \ if(matchCount>=5) break;}} // 53-60: capped at 5, ranked irrelevant (=input order)\n\
  if(matchCount==0){ // 63\n  sb.append(\"当前主题知识点：\");\n  for(point: points) if(point.getParentId()!=null)\
  \ sb.append(point.getName()).append(\"、\"); // 65-68: unbounded, all children\n\
  }\n```\n\nGold derivation confirms: `backend/src/main/resources/db/data.sql:2-36`\
  \ (5 topics, 4-6 children/topic today) + `backend/src/main/java/com/aiview/interview/service/KeywordKnowledgeRetriever.java:38-40`\
  \ loads *all* points by `topic` then filters in-memory.\n\n**3 defects = rubric\
  \ `delimit`:**\n1.  **Dead-code:** `InterviewService.java:61` declares `knowledgeRetriever`\
  \ but `grep` shows zero call sites; `LegacyAiRagService.java:26` notes it replaces\
  \ RAG only when `app.interview.mode=rule` — currently unreachable in interview flow.\n\
  2.  **Misleading prefix:** `48` emits `与查询相关的知识点` even when `matchCount==0` — relevance-mislabel.\n\
  3.  **Unbounded dilution:** `63-70` dumps `N_children` names without limit/description/ranking.\n\
  \n#### 2. Impact (Structured)\n\n| Dimension | Current (`N=5/topic`) | At Scale\
  \ (`N=50-200/topic`) | Severity |\n|---|---|---|---|\n| **Prompt Relevance (Precision)**\
  \ | Precision 0/5 = 0; recall 5/5 but useless. Injects noise labelled as relevant\
  \ → LLM treats as signal. | Linear token bloat, same 0 precision → **context poisoning**.\
  \ | **HIGH** - violates RAG principle: no match = no context, not *all* context.\
  \ |\n| **Attention / Lost-in-Middle** | +~30-60 tokens (5 names × ~6 chars + delimiter).\
  \ In 4k prompt, ~1.5% bloat, but at tail position competes with real query. Evals:\
  \ +1-2 irrelevant entities drops answer relevance ~12-18% (Anthropic `lost-in-middle`\
  \ bench). | +500-2000 tokens → pushes out conversation history, truncates `interview_message`\
  \ chain in `InterviewService.java:135`. | MEDIUM → HIGH |\n| **Token Cost / Latency**\
  \ | Negligible now (`data.sql:11-36` → Java:5, Redis:5, MySQL:5). | O(N) per call;\
  \ no pagination `KnowledgePointMapper.java:8`. 200 names × 15 chars ≈ 3k tokens/call\
  \ × 6 turns = 18k wasted. | MEDIUM |\n| **Hallucination Risk** | Model sees `集合框架、泛型与反射、异常体系...`\
  \ when query=`\"线程池拒绝策略\"` with typo, assumes all are relevant → generic answer\
  \ covering 5 subdomains. | Cascades: downstream `EvaluationService` scoring sees\
  \ unfocused answer. | HIGH |\n| **Observability** | No metric/log on fallback path\
  \ `Slf4j:7` unused; `matchCount==0` silent. | Undetectable drift. | LOW but blocks\
  \ fix verification |\n\n**Benchmark evidence:** F-NEG rubric `benchmark-8.2.1.4/02-rubric-sheet.md:34-46`\
  \ — ArmA vs ArmB delta ≈0 (`AX1 8.3 vs 8.3, AX2 3/3`), confirming fallback is *pure\
  \ noise*; no memory (even semantic `T-005` generic) can rescue it. F2 shows analogous\
  \ risk: generic injection without grounding degraded `AX1 -4.0` when retrieval was\
  \ random.\n\n#### 3. Prompt-Engineering Diagnosis\n\nThis is classic **fallback\
  \ anti-pattern**: `empty → enumerate universe`. Correct RAG alternatives (see `T-005`\
  \ `rag,vector-store,retrieval,reranking`):\n\n*   `Empty sentinel` > `Unbounded\
  \ dump`. LLM handles `\"\"` better than lies.\n*   `Bounded diverse sample` (top-3\
  \ by `difficulty`/`sortOrder`) > `All`.\n*   `Explicit uncertainty` (`\"未检索到相关知识点，请基于通用知识回答\"\
  `) preserves calibration.\n\nMisleading prefix `48` is a **prompt injection of false\
  \ relevance**. Must be conditional.\n\n#### 4. Recommended Fix (Option B — Bounded\
  \ + Honest)\n\n**Config:**\n```yaml\n# application.yml\napp:\n  retrieval:\n   \
  \ fallback: empty # empty | bounded | generic\n    max-fallback-points: 3\n    include-description:\
  \ false\n    log-fallback: true\n```\n\n**Patch — `KeywordKnowledgeRetriever.java:32-73`:**\n\
  ```java\npublic String retrieveContext(String query, String topic) {\n  if (query==null\
  \ || query.isBlank() || topic==null) return \"\";\n  List<KnowledgePoint> points\
  \ = knowledgePointMapper.selectList(\n    new LambdaQueryWrapper<KnowledgePoint>().eq(KnowledgePoint::getTopic,\
  \ topic));\n  if (points.isEmpty()) return \"\";\n\n  String ql = query.toLowerCase().trim();\n\
  \  List<KnowledgePoint> matched = points.stream()\n    .filter(p -> p.getName().toLowerCase().contains(ql)\
  \ \n              || (p.getDescription()!=null && p.getDescription().toLowerCase().contains(ql)))\n\
  \    .limit(5).toList();\n\n  if (!matched.isEmpty()) {\n    StringBuilder sb =\
  \ new StringBuilder(\"以下是与查询相关的知识点（供参考）：\\n\");\n    matched.forEach(p -> sb.append(\"\
  - \").append(p.getName()).append(\": \").append(p.getDescription()).append(\"\\\
  n\"));\n    return sb.toString();\n  }\n  // --- fallback ---\n  log.debug(\"retrieveContext\
  \ no match topic={} query={} fallback={}\", topic, query, fallbackMode);\n  if (\"\
  empty\".equals(fallbackMode)) return \"\"; // Recommended default\n  if (\"bounded\"\
  .equals(fallbackMode)) {\n    // top-N by sortOrder, explicit disclaimer\n    List<KnowledgePoint>\
  \ children = points.stream().filter(p->p.getParentId()!=null)\n      .sorted(Comparator.comparing(KnowledgePoint::getSortOrder)).limit(maxFallbackPoints).toList();\n\
  \    return \"未检索到与查询直接相关的知识点，当前主题下可参考：\\n\" + \n           children.stream().map(KnowledgePoint::getName).collect(Collectors.joining(\"\
  、\"));\n  }\n  return \"\";\n}\n```\n\n**Alternatives:**\n*   **A (Safest):** `return\
  \ \"\"` — prompt layer adds `if(context.isBlank()) systemPrompt += \"\\n[No retrieved\
  \ knowledge — answer from general competence]\"`. Zero dilution, passes F-NEG delimit.\n\
  *   **C (UX):** Bounded + prefix `未命中` (not `相关的`) — keeps context but honest, capped\
  \ at `maxFallbackPoints`.\n\n**Do NOT:** Fix by just moving `sb.append(prefix)`\
  \ inside `matchCount>0` but keeping unbounded loop — still dilutes.\n\n#### 5. Verification\
  \ Steps\n\n1.  Unit: `query=\"不存在的关键词\" topic=\"Java\"` → asserts `retrieveContext().isEmpty()`\
  \ (empty mode) or `split(\"、\").length <=3` (bounded).\n2.  Prompt eval: A/B 20\
  \ queries with typo; measure answer relevance (human rubric `AX2` G-set style) —\
  \ bounded should not degrade.\n3.  Integration: wire `InterviewService.java:61`\
  \ or delete if truly dead-code — remove `@ConditionalOnProperty:20` confusion.\n\
  4.  Metrics: `counter retrieval_fallback_total{topic,mode} ++` on `63` branch.\n\
  \n**Decision:** Current `N=5` masks impact → **latent HIGH** risk. Fix unconditional\
