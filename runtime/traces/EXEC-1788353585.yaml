agent_response: "## Impact Assessment: `KeywordKnowledgeRetriever` Fallback Dilution\n\
  \n### 1. Executive verdict\n\nThe fallback **cannot currently degrade any runtime\
  \ prompt**, because `KeywordKnowledgeRetriever.retrieveContext()` is **unreachable\
  \ dead code** — zero call sites. However, the fallback branch carries real, latent\
  \ correctness defects that become live the instant anyone wires it up. \n\n**Verdict:\
  \ LOW runtime impact · HIGH latent risk.** The prompt-dilution the task describes\
  \ does not occur today, but it is a landmine wired to fire with a single line of\
  \ wiring.\n\n### 2. Grounded code tracing\n\n**Fallback implementation** (`KeywordKnowledgeRetriever.java:62-70`):\n\
  ```java\nif (matchCount == 0) {\n    sb.append(\"当前主题知识点：\");\n    for (KnowledgePoint\
  \ point : points) {\n        if (point.getParentId() != null) {   // all child points,\
  \ no cap\n            sb.append(point.getName()).append(\"、\");\n        }\n   \
  \ }\n}\n```\n\n**Call-site proof — the method is never invoked:**\n- `InterviewService.java:61`\
  \ injects the bean: `private final KeywordKnowledgeRetriever knowledgeRetriever;`\n\
  - Grep across `src/main/java` for `retrieveContext`/`knowledgeRetriever` yields\
  \ **only** the definition and this unused injection — the field is **never dereferenced**\
  \ (also verified: `rg \"\\.retrieveContext\\(\"` returns nothing).\n- The other\
  \ two `retrieveContext(...)` hits (`RagService.java:154`, `LegacyAiRagService.java:160`)\
  \ have a **different signature** `(Long userId, String query, int topK)` and are\
  \ also uncalled. They are unrelated to the keyword fallback.\n- `@ConditionalOnProperty(name=\"\
  app.interview.mode\", havingValue=\"rule\", matchIfMissing=true)` does instantiate\
  \ the class by default — but instantiation ≠ invocation.\n\nSo: dilution **cannot\
  \ enter any AI prompt in the running system**. `app.interview.mode=rule` only makes\
  \ the bean exist.\n\n### 3. Impact severity matrix\n\n| Dimension | Severity | Evidence\
  \ / detail |\n|---|---|---|\n| Runtime prompt dilution | **None today** | No reachable\
  \ call path; nothing is fed to an LLM. |\n| Token/cost blowup | **Latent High**\
  \ | Fallback iterates **all** `points`, no `limit` (line 65-69). Structurally unbounded.\
  \ |\n| Retrieval precision | **Latent High** | On no-match it returns the *broadest*\
  \ possible signal (whole topic outline) — the opposite of retrieval intent. |\n\
  | Semantic/correctness bug | **Live (if called)** | Misleading header: §\"与查询相关的知识点\"\
  (query-**relevant**) yet emits \"当前主题知识点\"(query-**agnostic** outline). Minor: `getDescription()`\
  \ on no-match is never shown — only names, jumbled. |\n| Logging/observability |\
  \ **Low–Med** | `matchCount==0` silently swaps semantics; no warning emitted (log\
  \ sink unused). Drift is undetectable in tests. |\n| String quality bug | **Low\
  \ (cosmetic)** | `sb.append(...).append(point.getName()).append(\"、\")` leaves a\
  \ dangling `、`; also the \"与查询相关\" header is always appended even on the no-match\
  \ path → mismatched double header. |\n\n### 4. Realistic scale (from seed data)\n\
  \n`data.sql` shows each topic holds **4–5 child points** (Java:5, Redis:5, MySQL:5,\
  \ JVM:4). So *measured* dilution is modest today (~a few names). But that is only\
  \ because the dataset is small — the code places **no upper bound**, so a topic\
  \ with 50+ children would flood the prompt outright. The defect is a contract violation,\
  \ not a tuned-but-small one.\n\n### 5. Recommendations\n\n**A. Immediate hygiene\
  \ (highest value) — resolve the dead wiring before anything else:**\nEither (1)\
  \ remove `knowledgeRetriever` from `InterviewService.java:61`, or (2) if a caller\
  \ is coming, gate it behind a feature check and add an assertion test that `retrieveContext`\
  \ output never reaches a prompt until the fallback is fixed.\n\n**B. Option 1 —\
  \ honest no-match (recommended default policy).** RAG contract: *no evidence → no\
  \ evidence*.\n```java\nif (matchCount == 0) {\n    log.warn(\"no keyword match for\
  \ query='{}' topic='{}'; returning empty context\", query, topic);\n    sb.setLength(0);\
  \ // drop the already-appended \"relevant points\" header\n    return \"\";\n}\n\
  ```\nPrevents dilution entirely and lets the caller degrade gracefully.\n\n**C.\
  \ Option 2 — bounded, honestly-labeled outline (only if priming is a product requirement):**\n\
  ```java\nprivate static final int MAX_FALLBACK_POINTS = 5;\n...\nif (matchCount\
  \ == 0) {\n    sb.setLength(0);                       // remove false \"relevant\"\
  \ header\n    sb.append(\"当前主题大纲（无关键词命中，仅供参考）：\\n\");\n    points.stream()\n   \
  \     .filter(p -> p.getParentId() != null)\n        .limit(MAX_FALLBACK_POINTS)\n\
  \        .forEach(p -> sb.append(\"- \").append(p.getName()).append(\"\\n\"));\n\
  }\n```\nKey changes: distinct header (no implied relevance), hard cap, per-line\
  \ format (fixes `、` and double-header).\n\n**D. Hardening when callers are added:**\n\
  - Cap/name-constant the *matched* branch (`>= 5` magic number at line 58 → `MAX_MATCH_POINTS`).\n\
  - Normalize matching (trim + token/lemma) so `queryLower` vs `name`/`description`\
  \ handling is consistent (lines 54-55).\n- Unit tests: matched path ≤ 5; no-match\
  \ path returns `\"\"` (or bounded outline); blank query returns `\"\"`; a 60-child\
  \ topic stays ≤ 5.\n\n### 6. Recommended configuration\n\nKeep `app.interview.mode=rule`\
  \ as default, but adopt **Option B (`\"\"` on no-match)** as the default fallback,\
  \ with Option C behind a config flag if topic-outline priming is desired. Rationale:\
  \ for interview scoring, a precise \"not covered\" answer out-scores a confidently-wrong\
  \ answer seeded with a whole topic tree.\n\n### 7. Careful note on the benchmark\
  \ expectation\n\nThe F-NEG negative-control hypothesis expects \"**no measurable\
  \ improvement** → confirms no priming effect.\" Your observed data supports that\
  \ — but the mechanism is **stronger than intended**: the fallback isn't merely weakly\
  \ primed, it is **never executed**. Any F-NEG \"no effect\" signal therefore confirms\
  \ *dead code*, not an *evaluation of fallback quality*. To make the negative control\
  \ meaningful, first wire the retriever (or remove it), then re-run the control against\
  \ the corrected fallback."
