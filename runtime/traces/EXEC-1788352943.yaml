agent_response: "## Prompt-Engineer Assessment: `KeywordKnowledgeRetriever` Fallback\
  \ Dilution\n\n### 1. Executive verdict\n\nThe fallback cannot currently degrade\
  \ runtime prompt context, because **the entire retriever is dead code** — but it\
  \ is a latent defect that must be fixed before it is wired up. Verdict: **LOW runtime\
  \ impact now (dead path), HIGH risk as a landmine** if activated. The real bug is\
  \ not (only) the unbounded fallback; it is that the method was built but never invoked,\
  \ while carrying three independent correctness defects.\n\n### 2. Code tracing (grounded\
  \ evidence)\n\n- `KeywordKnowledgeRetriever.java:32-73` — `retrieveContext(query,\
  \ topic)` implements the fallback. Active when `app.interview.mode=rule` (line 20).\n\
  - `InterviewService.java:61` — `knowledgeRetriever` is injected via constructor.\n\
  - Search across `src/main/java` for callers of `retrieveContext`/`knowledgeRetriever`:\
  \ the **only** hits are the definition (`KeywordKnowledgeRetriever.java:32`) and\
  \ the unused injection (`InterviewService.java:61`). The field is **never dereferenced**\
  \ — zero call sites.\n\n**Conclusion:** `retrieveContext` is unreachable. The fallback\
  \ branch (`matchCount == 0`, lines 63–70) is unreachable dead code. `app.interview.mode=rule`\
  \ is the default (`matchIfMissing=true`, line 20), so the class *is* instantiated\
  \ — but never called. The prompt-context dilution described in the task cannot occur\
  \ in the running system today.\n\n### 3. Impact assessment matrix\n\n| Dimension\
  \ | Severity | Detail |\n|---|---|---|\n| Runtime prompt dilution | **None today**\
  \ | No call path; nothing is injected into any AI prompt. |\n| Token/cost blowup\
  \ (latent) | **High** | Fallback loops over **all** topic children with no cap (line\
  \ 65–69). |\n| Retrieval precision (latent) | **High** | On no-match it returns\
  \ the *broadest* possible signal (whole topic outline), the opposite of retrieval\
  \ intent. Inject + examples pool may force LLM into an ungrounded \"know-it-all\"\
  \ answer. |\n| Correctness (live bug) | **Medium** | Prefix mismatch: header says\
  \ \"与查询相关的知识点\" (relevant points) but the fallback emits \"当前主题知识点\" (topic outline)\
  \ — token \"relevance\" ≠ actual relevance. |\n| Misleading logging/semantics |\
  \ **Low–Med** | `matchCount==0` logs nothing and silently swaps semantics; hard\
  \ to detect in tests. |\n\n### 4. Three concrete defects in the fallback branch\n\
  \n1. **Dead code** — no caller; the `knowledgeRetriever` injection in `InterviewService`\
  \ is vestigial. Risk: a future engineer \"just calls it\" before fixing it and ships\
  \ the dilution bug.\n2. **Misleading prefix** — §3 header promises *query-relevant*\
  \ knowledge; the fallback returns a topic outline. An LLM instructed to ground on\
  \ provided context will treat an outline as authoritative relevant evidence.\n3.\
  \ **Unbounded dilution** — the fallback runs the full `points` list with no `LIMIT`.\
  \ If a topic has N=50+ child points, the context grows `N` names plus header, inflating\
  \ the prompt and biasing the answer toward whatever is listed, with zero relevance\
  \ ranking.\n\n### 5. Recommendations\n\n**A. Immediate (hygiene):** Either wire\
  \ it up / remove dead field, or gate it. Do not leave an unreferenced injectable.\n\
  - Remove `knowledgeRetriever` from `InterviewService.java:61` until a real caller\
  \ exists, **or**\n- Add a compile-time guard / assertion test that `retrieveContext`\
  \ never leaks into prompts.\n\n**B. Fix the fallback semantics (option 1 — return\
  \ empty, honest no-match):** The correct RAG contract is: *no evidence → no evidence*.\n\
  \n```java\nif (matchCount == 0) {\n    log.warn(\"no keyword match for query='{}'\
  \ topic='{}'; returning empty context\", query, topic);\n    return \"\";\n}\n```\n\
  \nThis prevents dilution entirely and signals the caller to degrade gracefully (e.g.,\
  \ fall through to a generic system default) instead of fabricating relevance.\n\n\
  **C. Fix with a bounded, ranked fallback (option 2 — only if topic outlines are\
  \ truly useful):**\n\n```java\nif (matchCount == 0) {\n    sb.append(\"当前主题大纲（无关键词命中，仅供参考）：\\\
  n\");\n    points.stream()\n        .filter(p -> p.getParentId() != null)\n    \
  \    .limit(MAX_FALLBACK_POINTS)          // e.g. 5\n        .forEach(p -> sb.append(\"\
  - \").append(p.getName()).append(\"\\n\"));\n}\n```\n\nKey changes: distinct header\
  \ (no false relevance), hard cap (`MAX_FALLBACK_POINTS`), and each child on its\
  \ own line with proper punctuation (the current code joins with `、` and ends with\
  \ a dangling `、`).\n\n**D. Hardening (if callers are added):**\n- Cap the *matched*\
  \ branch too — it already stops at 5 (line 58), good, but make it a named constant.\n\
  - Normalize matching (trim, and match on a lucene-like token/lemma) so `queryLower`\
  \ vs `name`/`description` case handling is consistent (`toLowerCase().contains`,\
  \ lines 54–55).\n- Add a unit test asserting: matched path returns `≤5`; no-match\
  \ path returns empty (or bounded outline); blank query returns `\"\"`.\n\n### 6.\
  \ Preferred configuration recommendation\n\nIf the surrounding pipeline defaults\
  \ to `app.interview.mode=rule`, I recommend **Option B (return `\"\"` on no-match)**\
  \ as the default policy, with Option C behind a config flag if topic-outline priming\
  \ is a product requirement. Rationale: for interview scoring, a precise empty-context\
  \ answer that honestly says \"not covered\" scores better than a confidently-wrong\
  \ answer seeded with an entire topic tree. This also preserves the benchmark's negative-control\
  \ expectation (F-NEG: no measurable improvement → confirms no priming effect).\n\
  \n**Single highest-value action:** before any fix, delete or guard the dead `knowledgeRetriever`\
  \ field — because today the dilution bug is latent, but the moment someone wires\
  \ it up at `InterviewService.java:61` it becomes **live and unbounded**."
