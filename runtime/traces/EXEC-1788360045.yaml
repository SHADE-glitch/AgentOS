agent_response: "## Impact Assessment: `KeywordKnowledgeRetriever` fallback dilution\n\
  \n### Headline finding\n\nThe fallback's *runtime* prompt impact is currently **zero\
  \ — the code is dead**. `knowledgeRetriever` is injected into `InterviewService.java:61`\
  \ but `retrieveContext(query, topic)` is **never invoked anywhere** in the codebase\
  \ (verified: no caller of `knowledgeRetriever.retrieveContext(...)` exists). So\
  \ the \"dilution\" the task describes is **latent** — a defect that becomes live\
  \ the moment this retriever is wired into the prompt-build path (e.g., in rule/`app.interview.mode=rule`\
  \ mode).\n\nThis is why the benchmark correctly classifies it as a **negative control**\
  \ with no priming: `benchmark-8.2.1.4/02-rubric-sheet.md:38-45` shows Arm A and\
  \ Arm B both scored identically (AX1 8.3/8.3, AX2 3/3, AX3 8/8) — a filter confirming\
  \ the memory pool provides no improvement, exactly as designed.\n\n---\n\n### Defect\
  \ analysis (what breaks *if/when* wired up)\n\nThree compounding problems in `KeywordKnowledgeRetriever.java`:\n\
  \n**1. Unbounded dilution (no cap).** The keyword match path caps at 5 (`:58`),\
  \ but the fallback has **no cap** (`:65-69`). It appends *every* child knowledge\
  \ point (`parentId != null`) for the topic onto a single unwrapped line. For a topic\
  \ with N children, you inject N entries into the prompt regardless of relevance.\n\
  \n**2. Misleading relevance prefix (`:48`).** The header is written once *before*\
  \ the match loop:\n```java\nsb.append(\"以下是与查询相关的知识点（供参考）：\\n\");   // \"knowledge\
  \ points RELEVANT to the query\"\n```\nThis header is present even when the fallback\
  \ fires. So the full-topic dump is framed to the model as **query-relevant** — false-relevance\
  \ priming. The model is steered to treat every dumped child as applicable, actively\
  \ biasing — not just diluting — the answer.\n\n**3. No delimiters / single blob.**\
  \ Fallback concatenates names with `\"、\"` into one run-on line with no entries\
  \ (`- ` bullet, no per-point structure, no `\\n`). Contrast with the match branch\
  \ using `\"- name：description\\n\"`. As an LLM prompt, the blob is unstructured\
  \ and yields degraded grounding.\n\nConsequence chain when live: irrelevant tokens\
  \ consume context budget → attention dispersed → false-relevance header misdirects\
  \ → lower answer precision / hallucinated connections to unrelated child points.\n\
  \n---\n\n### Recommendation\n\nFix on two tiers:\n\n**Tier 1 — Repair the fallback\
  \ (correct minimal change).** If no keyword match, prefer **structured, bounded,\
  \ honestly-labeled** signal over an unbounded dump. Replace `:63-70`:\n\n```java\n\
  if (matchCount == 0) {\n    // bounded + honestly labeled fallback (cap, no false\
  \ \"relevance\" framing)\n    sb.append(\"当前主题下已知知识点（未做关键词过滤，仅供参考，可能不相关）：\\n\");\n\
  \    int shown = 0;\n    for (KnowledgePoint point : points) {\n        if (point.getParentId()\
  \ != null && shown < 5) {\n            sb.append(\"- \").append(point.getName())\n\
  \              .append(point.getDescription() != null ? \"：\" + point.getDescription()\
  \ : \"\")\n              .append(\"\\n\");\n            shown++;\n        }\n  \
  \  }\n    if (shown == 0) return \"\";\n}\n```\n\nKey changes: (a) separate honest\
  \ header when unfiltered, (b) cap at 5 like the match path, (c) structured per-point\
  \ lines, (d) drop the mislabeled header from the match path by only emitting it\
  \ when she falls through with real matches.\n\n**Tier 2 — Decide usage.** Since\
  \ the injection point is orphaned, either (a) wire `knowledgeRetriever.retrieveContext(query,\
  \ topic)` into the rule-mode prompt builder and honor the above, or (b) delete the\
  \ field from `InterviewService` and the fallback to avoid dead code. Do not ship\
  \ an unused retriever whose behavior is latent.\n\n**Config.** `@ConditionalOnProperty(name=\"\
  app.interview.mode\", havingValue=\"rule\", matchIfMissing=true)` (`:20`) means\
  \ rule mode is also the *default* when the property is unset — flag this, since\
  \ the retriever silently becomes active under default config if wired. Be explicit\
  \ in `application*.yml` about `app.interview.mode`.\n\n---\n\n### Decision-guidance\
  \ note\n\nRelevant memory patterns: [T-005]/[E-005] (validated retrieval-assessment\
  \ patterns) and [P-001] (specialist team formation) apply — but as this is a *negative-control*\
  \ defect (dead code), the established best practice here is a **bounded, honestly-labeled\
  \ fallback with a delimiter-rich format**, matching the gold-set lesson at `01-gold-set-derivation.md:74`\
  \ (no material impact expected). Verdict: **correct defensively now; zero user-facing\
  \ impact today.**"
