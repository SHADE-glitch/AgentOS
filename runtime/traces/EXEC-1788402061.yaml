agent_response: "## Dashboard Redis Cache Assessment — `DashboardService.java:38`\
  \ TTL=10m\n\n**Scope:** `dashboard:user:{userId}` `RBucket<String>` cache-aside\
  \ in `DashboardService.build():52-71`, eviction `evict():81-91`. Verified via codebase\
  \ grep — hypotheses `[H-039/H-041/H-044/H-087/H-100]` are unvalidated suggestions,\
  \ replaced below by direct evidence.\n\n### 1. Current Design (ground truth)\n\n\
  ```java\n// DashboardService.java:38,48-71\nCACHE_TTL_MINUTES = 10\nkey(userId)\
  \ = \"dashboard:user:\"+userId\n\nbuild(userId):\n  bucket = redissonClient.getBucket(k)\n\
  \  cached = bucket.get() // DashboardService.java:55\n  if cached != null return\
  \ deserialize // stale if pre-mutation\n  vo = compute(userId) // InterviewResult\
  \ + InterviewSession FINISHED aggregates :93-101\n  bucket.set(json, 10, TimeUnit.MINUTES)\
  \ // :66\n```\n\n`compute():93-177` is DB-truth: `InterviewResult.userId` dimensions\
  \ + `InterviewSession status=FINISHED, totalScore, finishedAt`. No freshness stamp/version\
  \ in cached payload, no `updated_at` parity check.\n\n`RedissonConfig.java:22-28`\
  \ single-server `redis://host:port`, pool 4/16, no global cache config — TTL set\
  \ per-bucket only.\n\n### 2. When Cached View Is Stale (G1/G4)\n\n| Window | Root\
  \ cause | Impact |\n|---|---|---|\n| **A. TTL window 0-10m after any mutation**\
  \ | `build()` serves `bucket.get()` until expiry/eviction. `cache = projection,\
  \ never source of truth` — treated as truth at `DashboardController.java:21` / `DashboardService.java:56`\
  \ | Stale radar `dimensions`, `trend`, `weakPoints`, `stats.avgScore/maxScore` drive\
  \ user decisions. |\n| **B. Commit → `evict()` non-atomic race (T0/T2)** | Pattern\
  \ in all writers: `resultMapper.insert()` → `dashboardService.evict()` (e.g. `InterviewService.java:151-152`).\
  \ If `build()` repopulates between DB commit and `delete()` , stale value re-cached\
  \ for 10m. Classic cache-aside race. | Next read after write still stale until next\
  \ evict/TTL. |\n| **C. Sync + async double-write** | `InterviewService.finishSession():340-349`\
  \ does `evict()` immediately, but also enqueues `RuleBasedScoringService.ScoringMessage`\
  \ via `RabbitConfig` `:352-353`. The async consumer later does `insert()` + `evict():57`\
  \ + `updateById(session totalScore)` + `evict():66`. If `build()` runs between sync\
  \ finish and async score commit, dashboard aggregates `FINISHED` session with `totalScore=null`\
  \ (excluded by `isNotNull` :100) — under-counted. | Temporary inconsistency even\
  \ *with* correct eviction. |\n| **D. Redis unavailable / evict swallowed** | `evict():88-89`\
  \ catches exception, logs `warn` only. No retry. DB mutation succeeds, cache remains.\
  \ | Stale for full 10m. |\n| **E. Redis `get()` fallback on deserialize fail** |\
  \ `build():59-61` logs warn but proceeds to `compute()` and resets TTL — actually\
  \ self-healing (safe). Only staleness is the old value before failure. |\n\n> No\
  \ staleness stamp to detect A-D: `DashboardVO.java:10` has no `cachedAt/version`.\
  \ Client cannot diff DB truth vs cache.\n\n**Reproduce in 3 steps:**\n\n```bash\n\
  # 1. Prime cache\ncurl -H \"Authorization: $TOKEN\" /api/dashboard # -> populates\
  \ TTL\nredis-cli TTL \"dashboard:user:1\"  # -> 600\nredis-cli GET \"dashboard:user:1\"\
  \n\n# 2. Mutate\ncurl -X POST /api/interviews/123/answer -d '{\"answer\":\"...\"\
  }' # triggers finish + scoring\n\n# 3. Prove stale\nredis-cli GET \"dashboard:user:1\"\
  \ # still present until evict propagates\n# DB truth: SELECT COUNT(*), AVG(totalScore)\
  \ FROM interview_result WHERE user_id=1;\n# Compare to cached JSON — diverges until\
  \ evict or TTL expiry\n```\n\n### 3. Differential Eviction-Coverage Audit — Which\
  \ Mutation Paths Are Safe?\n\n> Rule: **every path that mutates `InterviewResult`\
  \ or `InterviewSession.totalScore/finishedAt` must call `DashboardService.evict(userId)`\
  \ atomically with the write** — `DashboardService.java:73-80` doc.\n\n| Write path\
  \ | Location | Eviction | Verdict |\n|---|---|---|---|\n| `InterviewService.answer()`\
  \ sync finish (`shouldFinish` / `pickQuestion==null`) | `InterviewService.java:151-152,168-169`\
  \ | `evict()` after `resultMapper.insert()` | **SAFE** (but window B) |\n| `InterviewService.answerStream()`\
  \ sync finish branch | `InterviewService.java:227,244` | same | **SAFE** (same window)\
  \ |\n| `InterviewService.finishSession()` FINISHED transition | `InterviewService.java:347-349`\
  \ | `evict()` after `stateStore.write()` + comment referencing fix | **SAFE** —\
  \ explicitly fixes prior 10m-no-eviction bug |\n| `InterviewScoringService.score()`\
  \ (async AI, always registered listener) | `InterviewScoringService.java:105-106,110-111`\
  \ | double `evict()` post-insert + post-session-update | **SAFE** |\n| `RuleBasedScoringService.score()`\
  \ (active when `app.interview.mode=rule`, default) | `RuleBasedScoringService.java:57,66`\
  \ | double `evict()` | **SAFE** |\n| `LegacyAiScoringService.score()` (active when\
  \ `mode=ai`) | `LegacyAiScoringService.java:113,118` | double `evict()` | **SAFE**\
  \ |\n\n**Finding: coverage is comprehensive — all 4 result-write services evict.\
  \ A claim \"no invalidation exists\" is false for current `main`.**\n\n**Residual\
  \ UNSAFE / conditional gaps (not yet covered):**\n\n1.  Direct SQL / admin/migration\
  \ updates to `interview_result` or `interview_session` bypass services → no `evict()`.\n\
  2.  Future `delete()` path (e.g. GDPR delete of `InterviewResult`) — no grep hit\
  \ for `resultMapper.delete*` today, but if added must evict.\n3.  Case `D` above\
  \ (Redis down) — eviction lost.\n4.  `InterviewStateStore.java:58-60` `delete()`\
  \ unrelated.\n\n### 4. Recommendations (DB-engineer priority order)\n\n#### 4.1\
  \ Make eviction transactional (fixes B)\n\nNever `insert → evict` inside same transaction\
  \ window. Evict *after commit*:\n\n```java\n// In any @Service writing results —\
  \ e.g. RuleBasedScoringService.java:54-67\n@Transactional\npublic void score(ScoringMessage\
  \ m) {\n  resultMapper.insert(result);\n  sessionMapper.updateById(session);\n \
  \ TransactionSynchronizationManager.registerSynchronization(\n    new TransactionSynchronizationAdapter()\
  \ {\n      @Override public void afterCommit() {\n        dashboardService.evict(session.getUserId());\n\
  \      }\n    });\n}\n// Fallback for Rabbit listener (no ambient TX): use after-commit\
  \ hook or double-delete pattern\n```\n\nAlternative double-delete to close T0/T2\
  \ race:\n\n```java\ndashboardService.evict(userId);\nresultMapper.insert(result);\n\
  dashboardService.evict(userId); // delayed 500ms via ScheduledExecutor\n```\n\n\
  #### 4.2 Harden `evict()` (fixes D + observability)\n\n```java\n// DashboardService.java:81-91\
  \ improved\npublic void evict(Long userId) {\n  if (userId==null) return;\n  try\
  \ {\n    RBucket<String> b = redissonClient.getBucket(key(userId));\n    boolean\
  \ deleted = b.delete(); // or b.remainTimeToLive() check\n    meter.increment(\"\
  dashboard.cache.eviction\", deleted?1:0);\n  } catch (Exception e) {\n    log.warn(\"\
  evict failed userId={}\", userId, e);\n    // publish to retry topic or set short\
  \ TTL marker: bucket.expire(5, TimeUnit.SECONDS)\n    throw new CacheEvictionException(e);\
  \ // let Rabbit retry via DLQ if async\n  }\n}\n```\n\nAdd `spring.data.redis.timeout`,\
  \ Redisson retry in `RedissonConfig.java:24-27`, and Prometheus: `cache_hit_total`,\
  \ `eviction_failure_total`.\n\n#### 4.3 Freshness stamp / version (fixes A, enables\
  \ self-healing)\n\nStore `cachedAt` + `version` in `DashboardVO`, check on read:\n\
  \n```java\nbucket.set(mapper.writeValueAsString(new CachedVO(vo, System.currentTimeMillis(),\
  \ seq)), 10, MINUTES);\n// build() -> if (System.currentTimeMillis() - cached.cachedAt\
  \ > 60_000 && dbUpdatedAt > cached.cachedAt) recompute\n```\n\nLighter: keep 10m\
  \ TTL but add `Cache-Control: max-age=60` + `ETag` at `DashboardController.java:21`\
  \ so browser doesn't trust stale vue-query entry (already noted in `frontend/src/pages/Dashboard.vue:18`/`Interview.vue:53`).\n\
  \n#### 4.4 Idempotency / dedup (fixes C)\n\n`InterviewResult` has no unique constraint\
  \ on `sessionId` today. If sync finish + async scoring both insert, double-count\
  \ aggregates. Add:\n\n```sql\nALTER TABLE interview_result ADD CONSTRAINT uk_session\
  \ UNIQUE (session_id);\n```\n\nThen `INSERT ... ON DUPLICATE KEY UPDATE` or `selectOne`\
  \ guard before `insert` in all 3 scoring services.\n\n#### 4.5 Config tuning\n\n\
  *   Keep `CACHE_TTL_MINUTES=10` — appropriate for analytics, but only with correct\
  \ eviction. If strong consistency required, reduce to `2` or use write-through (no\
  \ TTL, evict-only) + `RTopic` invalidation for multi-instance.\n*   `RedissonConfig.java:26-27`\
  \ pool 16 is fine for dashboard; add `setRetryAttempts(3).setRetryInterval(1500)`\
  \ and `setTimeout(3000)`.\n\n### 5. Verification Checklist\n\n- [ ] `grep -rn \"\
  dashboardService.evict\" backend/src` shows 4 services (done — table above).\n-\
  \ [ ] `grep -rn \"resultMapper.insert\\|sessionMapper.updateById\" backend/src`\
  \ each followed by `afterCommit evict`.\n- [ ] Integration test: `DashboardCacheTest.buildThenMutateThenBuildStale()`\
  \ — asserts `GET dashboard:user:*` is null after mutation + subsequent `build()`\
  \ reflects DB truth.\n- [ ] Chaos: kill Redis during `evict()` → assert metric `eviction_failure_total`\
  \ increments, dashboard recovers after TTL.\n- [ ] Race test: concurrent `build()`\
  \ + `score()` 100 threads — assert no stale window >1s after commit (double-delete).\n\
  \n**Conclusion:** current `main` *is* safe on paper (eviction on every known mutation),\
  \ residual risk is timing/failure atomicity, not missing call sites. Fix atomically\
  \ after commit + add freshness/version + enforce `uk_session` dedup; then stale\
  \ window collapses from 10m to sub-second post-commit.\n"
