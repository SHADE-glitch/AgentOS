  ## 系统监控告警方案

  **1. 核心指标**
  - **CPU**：使用率 > 80%，负载均衡
  - **内存**：使用率 > 85%，Swap 使用情况
  - **磁盘**：使用率 > 90%，I/O 等待
  - **网络**：带宽使用率、丢包率、延迟
  - **应用**：QPS、响应时间、HTTP 5xx 错误率
  - **中间件**：数据库连接池、队列积压、缓存命中率

  **2. 告警策略**
  - **分级**：P0(紧急)、P1(严重)、P2(一般)、P3(低)
  - **阈值**：静态阈值 + 动态基线（如 5 分钟均值偏离）
  - **去重**：相同告警合并，避免风暴
  - **静默**：维护窗口期自动静默
  - **升级**：未确认告警按超时自动升级

  **3. 通知渠道**
  - **即时通讯**：钉钉/企业微信/飞书机器人
  - **电话/短信**：P0 级电话直呼
  - **邮件**：P1+ 级发送告警邮件
  - **值班系统**：集成 OnCall 平台（如 PagerDuty）
  - **大屏/看板**：实时展示告警状态

