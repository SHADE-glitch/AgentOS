agent_response: "I have a complete picture now. Here is the assessment.\n\n## Scenario:\
  \ `DashboardService` caching in Redis\n\n- **Cache**: per-user `dashboard:user:{userId}`,\
  \ JSON serialized via Jackson, stored as a Redis string with a **10-minute TTL**\
  \ (`CACHE_TTL_MINUTES = 10`, `DashboardService.java:38`).\n- **Strategy**: cache-aside\
  \ / lazy-populate. `build()` reads the bucket; on miss it computes aggregates from\
  \ DB and writes the bucket (`DashboardService.java:52-71`).\n- **Invalidation**:\
  \ `evict(userId)` deletes the key (`DashboardService.java:81-91`). The comment at\
  \ `:73-80` documents a prior \"Run2 drift\" fix: eviction was added after every\
  \ mutation.\n\n### The aggregate depends on exactly two data sets\n1. `InterviewResult`\
  \ rows (`resultMapper.selectList` by userId) → radar `dimensions` avg, `weakPoints`\
  \ (weakest dim), `suggestions`.\n2. `InterviewSession` rows filtered to `status=FINISHED`\
  \ **and** `totalScore IS NOT NULL` (`DashboardService.java:96-101`) → `totalInterviews`,\
  \ `avgScore`, `maxScore`, `totalQuestions`, and the `trend` series (keyed on `finishedAt`).\n\
  \nSo the cache is only invalidated by mutations that add/modify these two entities.\n\
  \n---\n\n## Mutation paths\n\nAll mutation sites and whether they evict:\n\n| Path\
  \ | Mutation | Evicts? |\n|---|---|---|\n| `InterviewService.answer()` finish (`:150-157`)\
  \ | insert `InterviewResult` → `finishSession` | yes (×2, redundant) |\n| `InterviewService.answer()`\
  \ bank-exhausted (`:167-174`) | insert `InterviewResult` → `finishSession` | yes\
  \ |\n| `InterviewService.answerStream()` (`:226-249`) | insert `InterviewResult`\
  \ → `finishSession` | yes |\n| `InterviewService.finishSession()` (`:340-349`) |\
  \ session→`FINISHED`, set `finishedAt`, then **publishes RabbitMQ scoring job**\
  \ | yes |\n| `InterviewScoringService.score()` (`:105-111`) | insert `InterviewResult`,\
  \ set session `totalScore` | yes (×2) |\n| `RuleBasedScoringService.score()` (`:56-66`)\
  \ | insert `InterviewResult`, set session `totalScore` | yes (×2) |\n| `LegacyAiScoringService`\
  \ (`:112-118`) | same | yes |\n| Non-affecting writes (START/ASKING status, `questionCount`,\
  \ session insert, messages, RAG/KB) | do not change the two aggregate inputs | correctly\
  \ **not** cached |\n\n**Conclusion on \"safe\" paths:** every existing mutation\
  \ that touches `InterviewResult` or a FINISHED session's `totalScore`/`finishedAt`\
  \ does call `evict`. The write paths that don't evict (session START/ASKING, `questionCount`,\
  \ message inserts) are genuinely safe because `compute()` ignores non-FINISHED sessions\
  \ and messages entirely. So today's code is internally consistent — but it's safe\
  \ **only by convention**, not by construction.\n\n> Note: this is also where the\
  \ supplied hypotheses are flagged `UNVALIDATED` — the \"safe mutation\" claim holds\
  \ in this snapshot but is not enforced by any runtime guard.\n\n---\n\n## When the\
  \ cached view is stale (root causes)\n\n### 1. Async-scoring window produces a \"\
  scoreless\" cache write (highest risk)\n`finishSession()` sets `status=FINISHED`\
  \ + `finishedAt`, evicts, then **asynchronously** publishes the RabbitMQ scoring\
  \ job. The worker inserts the result and sets `totalScore` only later.\n\n- A dashboard\
  \ read landing **between** `finishSession` and worker completion hits the evicted\
  \ cache, recomputes, and sees a `FINISHED` session with `totalScore == null` → **the\
  \ recompute excludes that interview entirely** from `stats`/`trend`/radar.\n- If\
  \ the worker's `evict()` runs *before* that recompute's `bucket.set()` (`DashboardService.java:64-69`),\
  \ the stale, scoreless snapshot is written back and survives the remaining TTL.\n\
  \n### 2. Read-populate race with a concurrent mutation (\"lost evict\" / stale-resurrect)\n\
  This is the fundamental cache-aside hazard:\n```\nT0 read:  cache miss → compute\
  \ starts (DB SELECT snapshot @REPEATABLE READ)\nT1 write: worker commits result\
  \ + totalScore → evict() deletes key\nT2 read:  compute returns OLD snapshot (doesn't\
  \ see T1's commit)\nT3 write: bucket.set(old snapshot, 10min)   ← no evict will\
  \ ever fire again\n```\nThe recompute write is **unguarded**: nothing stops it from\
  \ overwriting the cache *after* the mutation's eviction point has passed, freezing\
  \ a stale aggregate for up to 10 minutes. Any mutation (including the final scoring\
  \ evict) becomes the \"last evict before resurrection.\"\n\n### 3. Manual-eviction\
  \ fragility (slow, silent staleness)\nCorrectness depends on every current and future\
  \ mutation calling `evict`. Add a new update path (e.g. a future \"re-score\" or\
  \ admin edit that calls `resultMapper.updateById` / sets `totalScore`) without evicting\
  \ and the cache stays stale until TTL — no exception, no log. There is no enforcement\
  \ (AOP annotation, domain-event/inbox, or change-data-capture) tying eviction to\
  \ the writes.\n\n### 4. Redundant + non-idempotent duplicate evictions\nEach scored\
  \ interview evicts 3–5 times (`answer`/`answerStream` inserts result → `finishSession`\
  \ → worker insert → worker session update). Harmless for correctness (delete is\
  \ idempotent) but indicates the sync path **also** inserts an `InterviewResult`\
  \ (`evaluationService.score` at `:150/:226`) **and** the worker inserts a second\
  \ `InterviewResult` for the same session. That duplicates result rows. For radar\
  \ averages the ratio mostly cancels (identical scores), but it inflates result cardinality\
  \ and can skew counts if the two scorers ever diverge. It should be de-duplicated\
  \ (insert only in one path, or unique-key on `session_id`).\n\n### 5. Thundering\
  \ herd / multi-instance\nOn a cold cache (or after each eviction during an active\
  \ interview), concurrent dashboard requests all miss and recompute the same aggregates.\
  \ Across multiple instances this widens race #2 because there is no distributed\
  \ lock or CAS around populate.\n\n---\n\n## Safe vs unsafe summary\n\n- **Safe mutations**\
  \ (no evict needed today): session START/ASKING transitions, `questionCount`, message/answer\
  \ inserts, RAG/KB/User writes — none feed `compute()`.\n- **Must evict** (and do,\
  \ today): any `InterviewResult` insert, and any update setting a FINISHED session's\
  \ `totalScore`/`finishedAt`.\n- **Structural weakness**: eviction race (#2) and\
  \ the async window (#1) can cache stale/scoreless data for up to 10 min despite\
  \ correct eviction calls; correctness is convention-only (#3).\n\n---\n\n## Recommendations\
  \ (numbered against the causes above)\n\n### R1 — Guarded cache write to close the\
  \ resurrection race (#2)\nDon't let a recompute overwrite a cache that was invalidated\
  \ after the compute snapshot. Use a monotonic per-user eviction counter and an atomic\
  \ compare-and-set:\n\n```java\nprivate String verKey(Long userId) { return \"dashboard:user:\"\
  \ + userId + \":v\"; }\n\npublic DashboardVO build(Long userId) {\n    RBucket<String>\
  \ bucket = redissonClient.getBucket(key(userId));\n    long verAtRead = readVersion(userId);\n\
  \    String cached = bucket.get();\n    if (cached != null) {\n        try { return\
  \ objectMapper.readValue(cached, DashboardVO.class); }\n        catch (Exception\
  \ e) { log.warn(\"parse dashboard cache failed, userId={}\", userId); }\n    }\n\
  \    DashboardVO vo = compute(userId);\n    // write only if no eviction happened\
  \ while we were computing\n    if (readVersion(userId) == verAtRead) {\n       \
  \ bucket.set(objectMapper.writeValueAsString(vo), CACHE_TTL_MINUTES, TimeUnit.MINUTES);\n\
  \    }\n    return vo;\n}\n\npublic void evict(Long userId) {\n    if (userId ==\
  \ null) return;\n    redissonClient.getAtomicLong(verKey(userId)).incrementAndGet();\
  \ // always bump first\n    redissonClient.getBucket(key(userId)).delete();\n}\n\
  \nprivate long readVersion(Long userId) {\n    return redissonClient.getAtomicLong(verKey(userId)).get();\n\
  }\n```\nBecause `evict` bumps the version *before* deleting, any in-flight recompute\
  \ that started with an older version will see the bump and refuse to write its stale\
  \ snapshot. This collapses the `T2`/`T3` window.\n\nIf you prefer no extra key,\
  \ an equally correct option is to store a `computedAt`/data digest inside the cached\
  \ value and have the worker set a \"last-mutated-at\" Redis key; write only when\
  \ `computedAt >= lastMutatedAt`. The counter approach is simplest and also gives\
  \ you a staleness version to serialize in the VO.\n\n### R2 — Close the scoreless\
  \ async window (#1)\nOption A (smallest change): extend R1 with a **write-behind**\
  \ policy — while a scoring job for a user is in flight, don't let a cold recompute\
  \ cache a provisional value. A pragmatic cheap version: keep the counter guard from\
  \ R1, but also bump the counter (i.e., force a subsequent fresh rebuild) when a\
  \ worker registers; the worker already evicts after commit, which combined with\
  \ R1 means the *first read after commit* is correct regardless of a stale provisional\
  \ write.\n\nOption B (cleanest): decouple the dashboard from async scoring — have\
  \ `finishSession()` set `totalScore` synchronously (it can call `evaluationService.score()`\
  \ and persist it, then let the worker only build the report), so `compute()` never\
  \ sees a FINISHED session without a score. The worker's current duplicate insert\
  \ should also be removed (see R4).\n\n### R3 — Enforce eviction so it can't regress\
  \ (#3)\nMake staleness impossible by construction rather than by call-site discipline:\n\
  - Add an outbox / domain-event listener: `evict` should be triggered by the persistence\
  \ layer (e.g., an AOP `@AfterReturning` interceptor around `InterviewResultMapper.insert`\
  \ and `InterviewSessionMapper` updates that affect FINISHED/totalScore), or\n- At\
  \ minimum, centralize mutation + eviction inside the service so callers can't forget,\
  \ and add a test asserting \"every `insert`/`updateById` of a scoring entity is\
  \ paired with an evict.\"\n- Add a status/`updatedAt` (a DB `updated_at`) and always\
  \ `orderBy` + versioned rebuild via R1 so even a missed evict self-heals on the\
  \ next mutation.\n\n### R4 — Eliminate duplicate result inserts (#4) and tighten\
  \ TTL\nDefault mode is `rule` (`RuleBasedScoringService` is `matchIfMissing = true`,\
  \ `:25`), so the sync `answer()`/`answerStream()` insert and the worker insert both\
  \ fire. Choose one authority:\n- Make the **sync path** the scoring authority (insert\
  \ + `finishSession` sets `totalScore`), and have the worker only generate the report;\
  \ or\n- Make the **worker** the only authority and have the sync path persist a\
  \ provisional result guarded by a unique constraint on `session_id` (upsert, not\
  \ insert), plus `dashboardService.evict` on both.\n\nAlso consider:\n- Lower `CACHE_TTL_MINUTES`\
  \ (e.g., 2–5) to bound worst-case staleness for users actively interviewing; keep\
  \ a higher TTL once idle.\n- (config) Isolate per-user keys are already correct\
  \ (`key(userId)`), so CPU do not leak across tenants. Ensure Redis `maxmemory-policy`\
  \ is `noeviction` (or `volatile-lru`) so dashboard keys aren't dropped mid-flight\
  \ unless intended — with TTL set they're `volatile`, so `volatile-lru` won't evict\
  \ the *data* unexpired but can pre-warm cost; prefer `noeviction` for predictability.\n\
  \n### Verification\nIf you run a runtime check against the async window: trigger\
  \ a finish, immediately call `GET /api/dashboard` before the worker commits, assert\
  \ the response excludes the just-finished interview (exposing #1), then replay after\
  \ the worker evicts to confirm it self-heals — this is the concrete \"test this\
  \ hypothesis\" step the `UNVALIDATED` guidance calls for. After applying R1, the\
  \ same sequence must never cache the scoreless value past the worker's commit.\n\
  \n---\n\n**Bottom line:** today's eviction calls are correct on every mutation path,\
  \ but the cache is only stale-proven until the next evict because (a) an unguarded\
  \ read-populate can resurrect a stale snapshot after the last eviction, and (b)\
  \ the async scoring window can cache an interview as \"not-yet-scored\" for up to\
  \ the 10-min TTL. Add the version-guarded CAS write (R1), close/demote the async\
  \ scoreless window (R2), and make eviction AOP-driven (R3) to make the aggregate\
  \ \"safe\" by construction rather than by convention."
