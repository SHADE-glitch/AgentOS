  \        new LambdaQueryWrapper<KnowledgePoint>().eq(KnowledgePoint::getTopic, topic));\n\
  \    if (points.isEmpty()) return \"\";\n\n    String queryLower = query.toLowerCase();\n\
  \    List<KnowledgePoint> matched = new ArrayList<>();\n    for (KnowledgePoint\
  \ p : points) {\n        if (p.getName().toLowerCase().contains(queryLower)\n  \
  \          || (p.getDescription()!=null && p.getDescription().toLowerCase().contains(queryLower)))\
  \ {\n            matched.add(p);\n            if (matched.size() >= 5) break;\n\
  \        }\n    }\n    if (matched.isEmpty()) {\n        log.debug(\"retrieveContext\
  \ miss topic={} query={}\", topic, query);\n        return \"\"; // sentinel: no\
  \ relevant context — caller decides\n        // or: return \"未找到与查询相关的知识点（已跳过上下文注入）\"\
  ;\n    }\n    StringBuilder sb = new StringBuilder(\"以下是与查询相关的知识点（供参考）：\\n\");\n\
  \    for (KnowledgePoint p : matched) {\n        sb.append(\"- \").append(p.getName()).append(\"\
  ：\").append(p.getDescription()).append(\"\\n\");\n    }\n    return sb.toString();\n\
  }\n```\n\n**Option B (Bounded Fallback if product requires topic overview):**\n\
  If enumeration is required, cap and label relevance:\n\n```java\nif (matched.isEmpty())\
  \ {\n    sb.setLength(0); // clear misleading prefix at :48\n    sb.append(\"未找到精确匹配，下列为主题概览（低相关度，仅作背景）：\\\
  n\");\n    int cap = 3; // configurable\n    points.stream().filter(p -> p.getParentId()!=null).limit(cap)\n\
  \          .forEach(p -> sb.append(\"- \").append(p.getName()).append(\"\\n\"));\n\
  }\n```\n\n**Prompt-Level Hardening (LLM Engineer):**\n```xml\n<!-- Do NOT concat\
  \ raw retriever output blindly -->\n<system>你根据 <context> 回答，若 <context relevance=\"\
  none\"> 为空则不编造知识点</system>\n<context relevance=\"{{matched ? 'high' : 'none'}}\"\
  >{{retrieveContext}}</context>\n<!-- In template: {% if context is empty %} omit\
  \ block entirely {% endif %} -->\n```\nAdd explicit delimiter at call site:\n```java\n\
  String ctx = knowledgeRetriever.retrieveContext(query, topic);\nString prompt =\
  \ ctx.isEmpty() ? basePrompt : basePrompt + \"\\n\\n<knowledge>\\n\"+ctx+\"\\n</knowledge>\"\
  ;\n```\n\n**Backend / Config (Backend Architect):**\n1.  **Decide wiring:** Either\
  \ remove dead injection `InterviewService.java:61` or wire correctly with guard.\
  \ Do not leave `@ConditionalOnProperty(matchIfMissing=true)` latent.\n2.  **Externalize\
  \ caps:** `application.yml`\n    ```yaml\n    app:\n      interview:\n        mode:\
  \ rule\n        retriever:\n          max-matched: 5\n          fallback-enabled:\
  \ false # or bounded\n          fallback-cap: 3\n    ```\n    Inject via `@Value`\
  \ / `@ConfigurationProperties`.\n3.  **Observability:** `Counter.builder(\"retriever.fallback\"\
  ).tag(\"topic\",topic).register(registry).increment()` on `matched.isEmpty()`.\n\
  4.  **RAG upgrade path:** Keyword `contains` at `:54` is brittle (no tokenization,\
  \ case-only). For Chinese topics, add `jieba`/`ik` tokenization or migrate to vector\
  \ `RagService.java:154` with threshold-based abstention — same sentinel pattern\
  \ applies.\n\n#### 5. Verification Steps\n\n```java\n// Test harness\n@Test void\
  \ miss_returnsEmptyOrLabeledNotAll() {\n  String ctx = retriever.retrieveContext(\"\
  不存在的关键词XYZ\", \"Java\");\n  assertTrue(ctx.isEmpty() || ctx.contains(\"未找到精确匹配\"\
  ));\n  assertFalse(ctx.contains(\"以下是与查询相关的\")); // no misleading header on miss\n\
  }\n@Test void hit_cappedAt5() {\n  String ctx = retriever.retrieveContext(\"Java\"\
  , \"Java\"); // hits many\n  assertTrue(ctx.lines().filter(l->l.startsWith(\"-\"\
  )).count() <=5);\n}\n```\n\n1. `rg -n retrieveContext` → confirm call site added/removed;\
