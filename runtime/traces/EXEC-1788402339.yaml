agent_response: "### `KeywordKnowledgeRetriever` Fallback — Prompt Context Dilution\
  \ Assessment\n\n**Grounding:** `backend/src/main/java/com/aiview/interview/service/KeywordKnowledgeRetriever.java:32-73`\
  \ `retrieveContext(query, topic)` | `backend/src/main/resources/db/data.sql:1-36`\
  \ | `backend/src/main/java/com/aiview/interview/service/InterviewService.java:61`\n\
  \n#### 1. Verdict\n**Latent severity: Medium. Current blast radius: Zero (dead-code),\
  \ Future blast radius: High if re-wired.** The `matchCount==0` branch at `KeywordKnowledgeRetriever.java:63-70`\
  \ is **dead-code today** — `InterviewService.java:61` injects `KeywordKnowledgeRetriever`\
  \ but never calls `retrieveContext()` (verified via grep, 0 call sites). Refactored\
  \ `InterviewService.java:45` uses `QuestionBank`/`EvaluationService`/`ReportService`\
  \ with no LLM prompt. If re-enabled in `rule` mode (`@ConditionalOnProperty:20`\
  \ `matchIfMissing=true` → default active), every no-match query injects **all child\
  \ points + misleading relevance header** into prompt, degrading precision without\
  \ failure signal.\n\n#### 2. Defect Taxonomy (3 delimits)\n\n| # | Defect | Location\
  \ | Description |\n|---|---|---|---|\n| **D1** | **Misleading Prefix** | `KeywordKnowledgeRetriever.java:48`\
  \ + `63-70` | `sb.append(\"以下是与查询相关的知识点（供参考）：\\n\")` is appended **before** match\
  \ loop is evaluated. On `matchCount==0`, return is `relevant-header + unrelated\
  \ enumeration` → LLM instructed that context *is* relevant when it explicitly is\
  \ not. Violates prompt instruction fidelity. |\n| **D2** | **Unbounded Dilution**\
  \ | `KeywordKnowledgeRetriever.java:63-69` | `for (point : points) if(parentId!=null)\
  \ sb.append(name+\"、\")` enumerates **all** `parentId != null` children with no\
  \ `limit`, no truncation, no `description` filtering. Current topics small (Java\
  \ 5, Redis 5, MySQL 5, JVM 4, 并发 6) but scales linearly; 20-30 point topic = 500+\
  \ tokens of low-signal comma list. No `matchCount>=5` cap applied unlike matched\
  \ branch `:58`. |\n| **D3** | **No-op / Latent Dead Reference** | `KeywordKnowledgeRetriever.java:32`\
  \ vs `InterviewService.java:61,80-445` | Retriever is injected but never consumed.\
  \ No caller handles `\"\"` vs `fallback-list` sentinel differently. Dilution cannot\
  \ be observed/evaluated — silent tech debt that bypasses testing. |\n\n#### 3. Impact\
  \ Matrix (Prompt-Engineer Lens)\n\n| Axis | With Fallback (if wired) | Without Fallback\
  \ |\n|---|---|---|\n| **Relevance / Precision** | Precision → `0.0` (recall 1.0\
  \ via dump). Attention diluted: LLM sees 4-6 names with `\"/\"`-like equivalence,\
  \ forces hallucination or generic answer. RAG anti-pattern: keyword miss should\
  \ = abstain, not enumerate. | Precision preserved; LLM can answer from parametric\
  \ knowledge or explicit `无相关知识点`. |\n| **Token Cost** | `~60 chars` header + `30\
  \ chars × N` names. Current `N=4-6` → `~180-240 chars` (~90-120 tokens) wasted per\
  \ no-match turn. At 50% miss-rate × 6-turn interview → ~600 tokens/session wasted.\
  \ Grows unbounded with topic expansion. | `48` char sentinel `\"\"` or `\"未找到精确匹配...\"\
  ` → ~15 tokens. |\n| **Prompt Controllability** | No delimiter to signal low confidence.\
  \ Downstream prompt cannot `IF relevance==low THEN ignore`. Prefix lies → model\
  \ cannot calibrate. | Explicit `<context relevance=\"none\">` or empty allows system\
  \ instruction: `If context empty, do not invent knowledge points`. |\n| **User Experience**\
  \ | Generic enumeration yields vague, unfocused follow-up questions (topic dump\
  \ vs targeted probe). | Honest `无匹配` enables fallback to random `QuestionBank` pick\
  \ (existing behavior at `InterviewService.java:95-102`) which is already bounded.\
  \ |\n| **Observability** | `matchCount==0` silent — no log/metric at `:63`. Cannot\
  \ measure fallback rate or prompt quality degradation. | Loggable sentinel enables\
  \ `counter: retriever.fallback_total` + evaluation harness. |\n\n**Quantitative\
  \ Example:** `query=\"CAP定理\" topic=\"Java\"` → no `name/description` contains `cap`\
  \ (`:54-55`). Matched branch returns 0 items. Fallback returns:\n```\n以下是与查询相关的知识点（供参考）：\n\
  当前主题知识点：集合框架、泛型与反射、异常体系、IO与NIO、Java新特性、\n```\nLLM receives 5 Java children none\
  \ about CAP → context dilution `5/5 irrelevant = 100% noise`. Token hit ~130, attention\
  \ weight split 5 ways.\n\n#### 4. Recommended Remediation (Prompt + Backend + RAG)\n\
  \n**Immediate Fix — Option A (Strict, Recommended for ai/rule mode):**\nClear misleading\
  \ prefix, return typed sentinel. Let prompt template handle emptiness.\n\n```java\n\
  // backend/src/main/java/com/aiview/interview/service/KeywordKnowledgeRetriever.java:32\n\
  public String retrieveContext(String query, String topic) {\n    if (query == null\
