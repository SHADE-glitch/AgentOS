  \ `InterviewService`（`InterviewService.java:61`）却**从未被调用**（全仓只有声明，无调用点）。因此它今天的运行时影响是\
  \ **0（潜伏死码）**；它的风险发生在“按设计接入 rule 模式”之后——而 `LegacyAiRagService.java:26` 明确写明了这一意图（rule\
  \ 模式下用它替代 AI RAG），且默认 `app.interview.mode=rule`（`application.yml:37`）。所以这是一个“接上就会爆”的隐患，不是“现在就在爆”。\n\
  \n---\n\n### 一、证据 / 现状（代码走查）\n\n`KeywordKnowledgeRetriever.java:32-73` 的核心逻辑：\n\n\
  ```java\nList<KnowledgePoint> points = knowledgePointMapper.selectList(\n      \
  \  new LambdaQueryWrapper<KnowledgePoint>().eq(KnowledgePoint::getTopic, topic));\n\
  ...\nfor (KnowledgePoint point : points) {\n    if (name/description lowercase contains\
  \ queryLower) { append; matchCount++; if(>=5) break; }\n}\n// 无匹配 → 兜底\nif (matchCount\
  \ == 0) {\n    sb.append(\"当前主题知识点：\");\n    for (KnowledgePoint point : points)\
  \ {\n        if (point.getParentId() != null) {   // 只取子节点\n            sb.append(point.getName()).append(\"\
  、\");\n        }\n    }\n}\n```\n\n三个关键事实叠加：\n\n1. **兜底分支与 query 完全无关** —— 只要你命中不了关键词，输出就是“该主题全部子节点清单”，查询字符串对该分支的产出零影响。这不是“检索”，是一次静态倾泻。\n\
