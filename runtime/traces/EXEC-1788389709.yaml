  \ RAG 语义的逆逻辑。\n\n数据规模（`data.sql`）：每主题子节点 Java=5、Redis=5、MySQL=5、JVM=4、并发=6。兜底串 `并发`\
  \ 主题为 `当前主题知识点：线程基础、synchronized 与锁、volatile 与内存可见性、JUC 工具类、线程池、AQS、`（含**尾随顿号**的格式\
