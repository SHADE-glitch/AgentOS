  \n```java\n// KeywordKnowledgeRetriever.java:62-70 替换为\nif (matchCount == 0) {\n\
  \    log.warn(\"topic={} 无关键词命中 query={}，返回空上下文\", topic, query);\n    return \"\
  \";\n}\n```\n\n**方案 B：保留“题型脚手架”，但显式、有界、脱敏（需调用方真的需要主题概览时）**\n若下游确需主题框架，则明确标注为“全主题清单”而非“相关”，并截断到\
  \ top-K、去掉误导 header：\n\n```java\nfinal int max = 3;                       // 有界，避免全量\n\
  if (matchCount == 0) {\n    List<KnowledgePoint> children = points.stream()\n  \
  \          .filter(p -> p.getParentId() != null)\n            .limit(max).toList();\n\
  \    sb.setLength(0);                     // 清掉“相关”header，防止语义误标\n    sb.append(\"\
