  \n- **推荐：方案 A。** 理由：契约一致性（`RagService` 已定“无命中=空”）、满足 YAGNI、消除标签失真和逆向相关性三类高风险问题，且改动最小。\n\
  - **退化保留方案 B**：仅当存在明确需求“拿不到关键词也要给个主题锚点”（如冷启动/无库老师场景）时选用，并必须做到“有界 + 显式标注 + 可观测”。\n\
  - **共同补充项**：无论取哪案，都(a) 加 `log.warn` 暴露 fallback 分支；(b) 修 `KeywordKnowledgeRetriever.java:48`\
