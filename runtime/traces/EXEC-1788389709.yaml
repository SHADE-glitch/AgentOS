  \ | 影响 | 严重度 | 说明 |\n|---|------|--------|------|\n| 1 | **接入后的语义稀释 / 主题泄漏** | 高\
  \ | 若该上下文喂给 LLM 评分/追问 prompt，模型会收到“这里列出了所有概念”，诱导其同时对无关子节点展开校验，而非聚焦当前单题。相关点与无关点权重被拉平。\
