agent_response: "## 目标\n- 业务目标：判断 `DashboardService` 的 Redis 聚合缓存何时会返回陈旧数据，识别哪些后端写入路径能安全失效缓存。\n\
  - 当前约束：缓存 key `dashboard:user:{userId}`，TTL 10 分钟；失效方式是 `evict()`（DELETE）；无事务、无版本号、无单飞。\n\
  - 成功标准：给出“数据驱动→写入路径→是否安全失效”的完整映射，指出残留的陈旧窗口，并给出可落地的加固方案。\n\n## 问题判断\n\n`DashboardService.compute()`\
  \ 只依赖两张表（DB 即真相）：\n- `interview_result`（by userId）→ 雷达图四维平均、薄弱点、建议。\n- `interview_session`（status=FINISHED\
  \ **且 totalScore IS NOT NULL**）→ 平均/最高分、总题数、成绩趋势。\n\n因此**只有当上面数据的输入发生变化时缓存才可能变陈旧**。TTL\
  \ 只是兜底，不是新鲜度来源——真正的刷新只由 `evict()` 触发。鉴权读路径 `build()` 命中即返回，不校验与 DB 的一致性。\n\n###\
  \ 数据依赖与陈旧判定\n| 数据输入 | 被 compute() 消费的字段 | 会被哪些写入影响 |\n|---|---|---|\n| interview_result\
  \ | dimensions / suggestions / userId | result insert |\n| interview_session | status、totalScore、finishedAt、questionCount\
  \ | session update |\n\n---\n\n## 方案设计：写入路径 × 是否安全失效\n\n现有 `evict()` 调用点扩散在 3 个服务里。逐一评估：\n\
  \n### ✅ 已正确接线（安全）\n| 写入路径 | 写入 | evict | 顺序 |\n|---|---|---|---|\n| `InterviewService.answer`/`answerStream`\
  \ 结束分支（:151/168/226/243） | insert result → **finishSession** | 两次 evict（:152/169/227/244\
  \ + :349） | DB 先提交（无 `@Transactional`，单条 autocommit），再 DELETE，顺序正确 |\n| `InterviewService.create`\
  \ 题库为空 → `finishSession` | update status=FINISHED | :349 | 同上 |\n| `RuleBasedScoringService.score`\
  \ | insert result（:56）→ setTotalScore(updateById)（:65） | :57 / :66 | 同上，两次都落在各自\
  \ DB 写之后 |\n| `InterviewScoringService.score` | insert result（:105）→ setTotalScore(updateById)（:110）\
  \ | :106 / :111 | 同上 |\n| 缓存序列化/写失败 | — | build 内部 catch 后仅 warn，报错不会污染主链路 | 安全\
  \ |\n\n关键点：所有路径都是 **“DB 提交 → 删缓存”** 的 write-through-invalidate 正序，没有“先删后写”，因此只要\
  \ evict 触发，下一发 `build()` 就会重算。\n\n### ⚠️ 残留陈旧窗口（风险）\n1. **删缓存与重算之间的竞态（低频但真实）**：\n\
  \   - T2 提交新数据 → 删除 key；并发 T1 `build()` 在删除前已 miss、读的是旧的 DB 快照，在 T2 删除**之后**把它写回缓存\
  \ → 陈旧视图可达 10 分钟。无版本号/无单飞时无解。\n2. **异步评分的半完成快照（可用性上的保守陈旧）**：`finishSession` 先置 FINISHED\
  \ 并 evict，异步消费者稍后 setTotalScore 再 evict。中间窗口缓存的是“已结束但 totalScore 为空”的真实现状（DB 此刻确实如此），消费者完成后会自动刷新。属“延迟一致”，非错误陈旧——**除非消费者重构后异常**。\n\
  \n### \U0001F534 非陈旧、但会导致“数据库本身错误”的写入问题（必须一并修）\n1. **同一队列存在两个竞争消费者**：`InterviewScoringService`（无条件启用）与\
  \ `RuleBasedScoringService`（`matchIfMissing=true` 默认启用）**同时** `@RabbitListener(queues\
  \ = \"aiview.interview.scoring\")`，消息会被竞争分发，结果/报告逻辑不确定。同一消息被 retry 时还会重复处理 → **同一\
  \ session 产生多条 `interview_result`**，雷达均值、建议被重复计入。\n2. **同步路径与异步路径对同一 session 双写**：`InterviewService.answer`\
  \ 已 insert result（并发默认 `mode=rule` 下这次评分是多余的），异步消费者又 insert 一条 → 重复聚合。\n3. **同步路径从不写\
  \ `session.totalScore`**（`EvaluationService.score` 只写 result，见 :81）：即便 finishSession\
  \ 置 FINISHED，因查询要求 `totalScore IS NOT NULL`，这些 session 永远不进趋势/统计——evict 会照常触达，但重算结果恒为空，属数据正确性缺陷。\n\
  \n这些让“缓存与 DB 一致”成立了，但 DB 本身就不对——属于上游问题，会让本次失效分析产生误判，先指出。\n\n---\n\n## 实施方案\n\n###\
  \ 核心结论\n- **当前 evict 接线已覆盖所有实时写入入口**，方向正确，之前“无失效、靠 10 分钟 TTL 兜底”的漂移已被修复（见 DashboardService:78\
  \ 注释）。\n- 真正需要加固的是：① 竞态下的“陈旧重填”；② 消费者重复消费/竞争消费导致 DB 重复聚合。\n\n### 建议加固（按优先级）\n\n\
  **1. 为缓存引入版本/时间戳做双检（消除②竞态陈旧），核心片段：**\n\n```java\n// 用生成号做单飞 + 写后校验，避免删后重填陈旧快照\n\
  private static final String GEN_SUFFIX = \":gen\";\nprivate static final LazyInitialization...\
  \ // 省略\n\npublic DashboardVO build(Long userId) {\n    String k = key(userId);\n\
  \    RBucket<String> bucket = redissonClient.getBucket(k);\n    String cached =\
  \ bucket.get();\n    if (cached != null) {\n        return parse(cached); // 命中即返回\n\
  \    }\n    // 单飞：同一用户并发 miss 只有一个去查库\n    RLock lock = redissonClient.getLock(\"\
  dashboard-compute:\" + userId);\n    // tryLock 命中后：double-check 再 compute\n   \
  \ DashboardVO vo = compute(userId);          // 读 DB 快照\n    long gen = redissonClient.getAtomicLong(k\
  \ + GEN_SUFFIX).get();\n    // write-if-gen-unchanged：只有缓存仍是最新版本才写入\n    String\
  \ json = writeValue(vo);\n    if (redissonClient.getAtomicLong(k + GEN_SUFFIX).get()\
  \ == gen) {\n        bucket.set(json, CACHE_TTL_MINUTES, TimeUnit.MINUTES);\n  \
  \  }\n    return vo;\n}\n\npublic void evict(Long userId) {\n    redissonClient.getAtomicLong(key(userId)\
  \ + GEN_SUFFIX).incrementAndGet(); // 先抬版本\n    redissonClient.getBucket(key(userId)).delete();\
  \                            // 再删\n}\n```\n\n**2. 修复上游数据正确性（否则失效分析是治标不治本）：**\n\
  - 只保留一个评分消费者：给 `InterviewScoringService` 也加 `@ConditionalOnProperty(app.interview.mode\
  \ = ai)`，使 `mode=rule`（默认）时只有规则评分生效；或删掉同步 `answer`/`answerStream` 里的评分+insert 分支（:151/168/226/243\
  \ 改为仅收尾、依赖异步消费者）。\n- 为评分 handler 加 sessionId 幂等：入库前 `selectOne(sessionId)` 存在则更新而非再次\
  \ insert。\n\n**3. 事务提醒：** 目前无 `@Transactional`，DB 单条 autocommit 先于 evict，顺序安全。若将来给\
  \ service 加事务，必须保证 **DB commit 之后**才调 `evict()`，否则会出现“先删缓存、事务回滚→DB 未变而缓存被清”或“commit\
  \ 前 evict→陈旧残留”。建议用 `TransactionSynchronization.afterCommit(){}`。\n\n---\n\n## 验证方式\n\
  - 单元/集成：模拟“T1 读旧快照 + T2 提交并 evict”并发，断言双检后不会重填旧 VO；验证单飞下 miss 只查库一次。\n- 压测脚本向同一队列多发\
  \ `ScoringMessage`，断言每 session 仅一条 `interview_result`（修复重复消费后）。\n- 同步结束一条面试后立即 `GET\
  \ /api/dashboard`，断言 trend 出现该次成绩（验证 totalScore 写入是否残留）。\n- Redis 侧：观察 `dashboard:user:*`\
  \ 在每次 result insert / totalScore update / FINISHED 后立即消失。\n\n**复盘建议**：把 TTL 视作“最后兜底”而非新鲜度来源；新鲜度唯一契约是“每次影响聚合的写之后必须\
  \ evict”。当前实现已基本满足，剩余投入应优先放在消费者去重与竞态版本号上。\n\n需要我直接把上述修复（去重消费者 / 版本号双检）落成代码改动吗？"
