agent_response: "## 目标\n- **业务目标**: 评估 `KeywordKnowledgeRetriever` 在关键词不命中时兜底返回该主题全部子知识点的行为，对\
  \ prompt 上下文稀释的影响。\n- **当前约束**: 规则评分模式（`app.interview.mode=rule`），无向量检索，纯 MyBatis-Plus\
  \ 直接读表，返回 String 注入 LLM prompt。\n- **成功标准**: 明确该路径当前是否真的进入 prompt、稀释的实际成本（token\
  \ / 相关性丢失），并给出可落地的修复与绑定方案。\n\n## 问题判断\n\n**根因/关键发现（按重要性排序）：**\n\n1. **当前运行时影响为零\
  \ —— 这是\"死代码 + 失效注入\"。**\n   `InterviewService.java:61` 注入了 `knowledgeRetriever`，但\
  \ `retrieveContext()` 在整个激活代码库中**没有任何调用点**。重构（移除 `ChatClient` / `RagService` 依赖）后，这条本该喂进\
  \ prompt 的上下文管线已经不存在了；唯一的同名方法在 `LegacyAiRagService.java:160`，签名不同（`(Long userId,\
  \ String query, int topK)`），与 `KeywordKnowledgeRetriever` 无关。因此\"稀释 prompt\"在当前运行态**不会发生**——它没有被调用。\n\
  \n2. **误导性前缀（相关性 mislabel）。** 第 48 行 `sb.append(\"以下是与查询相关的知识点（供参考）：\\n\")` 在关键词循环**之前**无条件写入。而兜底分支（`matchCount==0`）塞入的却是\"\
  与查询无关\"的全部子知识点。若该分支恢复使用，LLM 会被前缀欺骗，把整库当作与用户回答相关的上下文——比单纯稀释更危险（确定性错误引导）。\n\n3. **无界稀释（与命中分支的\
  \ 5 条上限不对称）。** 命中分支在第 58 行 `if (matchCount >= 5) break` 封顶；兜底分支第 65-69 行对 `parentId\
  \ != null` 的全部子知识点**无上限**拼接。主题越大，prompt 上下文越长，检索精度归零——恰恰违背\"检索器\"的职责。\n\n4. **放大器：query\
  \ 用 `contains` 子串做\"关键词\"，导致兜底被高频触发。** 第 54-55 行用整段 `query.toLowerCase()` 对 `name`/`description`\
  \ 做 `contains`。参数叫 `query`，调用方若传的是完整用户回答/整句，几乎必然 `matchCount==0` → 高频落入无界兜底。\n\n\
  5. **父子不对称。** 命中分支匹配父、子两点；兜底分支只显示子点，输出形态不一致。\n\n**关键假设**: 若提供该上下文的本意是\"规则模式下给评分/报告注入知识点参考\"\
  ，那么这条管线在重构后被整体丢弃是设计收缩的产物，而非修补目标。\n\n## 方案设计\n\n- **方案 A: 删除 / 保留为死代码（推荐给当前状态）**\n\
  \  - Strengths: 消除无界兜底这个潜伏缺陷；零维护成本；与重构后的无 RAG 现状一致。\n  - Weaknesses: 若将来要复用知识上下文，需重写。\n\
  \  - Best for: 当前规则评分模式、无 LLM prompt 注入的现状。\n\n- **方案 B: 修复并重新绑定（推荐若知识上下文须重新进入 prompt）**\n\
  \  不改语义地修复兜底：未命中即返回 `\"\"`（不做误导性兜底）；保留命中分支上限。若确需兜底概览，则加 bounds + 中性标签 + 相关性门槛。见下。\n\
  \n```java\n// 在 topic 值上建立关键词边界匹配，避免整句 contains\nprivate boolean matches(KnowledgePoint\
  \ p, Set<String> keywords) {\n    if (p.getName() == null) return false;\n    String\
  \ text = (p.getName() + \" \" + nullable(p.getDescription())).toLowerCase();\n \
  \   return keywords.stream().anyMatch(k -> text.contains(k));\n}\n```\n\n**修正后的\
  \ `retrieveContext`（兜底改为有界、中立、去误导前缀）：**\n\n```java\npublic String retrieveContext(String\
  \ query, String topic) {\n    if (query == null || query.isBlank()) return \"\"\
  ;\n\n    List<KnowledgePoint> points = knowledgePointMapper.selectList(\n      \
  \      new LambdaQueryWrapper<KnowledgePoint>().eq(KnowledgePoint::getTopic, topic));\n\
  \    if (points.isEmpty()) return \"\";\n\n    List<String> hit = new ArrayList<>();\n\
  \    for (KnowledgePoint p : points) {\n        if (p.getName().toLowerCase().contains(query.toLowerCase())\n\
  \                || (p.getDescription() != null\n                    && p.getDescription().toLowerCase().contains(query.toLowerCase())))\
  \ {\n            hit.add(p.getName() + \"：\" + p.getDescription());\n          \
  \  if (hit.size() >= MAX_CONTEXT_POINTS) { // 复用 5 上限,定义一个常量\n                break;\n\
  \            }\n        }\n    }\n    if (hit.isEmpty()) {\n        // 关键修复点：无命中时返回空，不再回退到全部子知识点（无界稀释）\n\
  \        log.debug(\"no keyword match, skipping context injection topic={}\", topic);\n\
  \        return \"\";\n    }\n    return \"与查询相关的知识点：\\n\" + String.join(\"\\n\"\
  , hit);\n}\n```\n\n配套建议：\n- 若仍要提供\"主题概览\"，仅在中立标签下且设上限：\n  `if (hit.isEmpty()) {\
  \ List<KnowledgePoint> overview = ...; /* 取 sortOrder 前 N 个, N 由配置注入 */ return \"\
  主题知识点概览（可能无关）：\" + 有界拼接; }`\n  注意标签不得自称\"与查询相关\"。\n- 用配置 `app.interview.knowledge.max-context-points`\
  \ 控制兜底上限，避免硬编码。\n- 整理 `query`：先 `trim()`、去分隔符、按空白分词成 keyword set，再做 `contains`，降低整句高概率落兜底。\n\
  \n**修复后如何处理现有注入**：若本轮不重建 LLM prompt，直接删除 `InterviewService` 中的 `knowledgeRetriever`\
  \ 字段与 `KeywordKnowledgeRetriever` 的兜底分支（或整类），消除潜伏缺陷。若重建管线，采用方案 B。\n\n## 实施方案（当前仓库最小改动）\n\
  - **修改位置**: `backend/src/main/java/com/aiview/interview/service/KeywordKnowledgeRetriever.java:62-70`；`InterviewService.java:61`\n\
  - **核心逻辑**: 未命中分支由\"无界全量子知识点 + 误导前缀\"改为\"返回空 / 有界概览 + 中立标签\"。\n- **风险点与处理**: 删除后无其它调用方，无编译/回归风险（可先全局\
  \ `grep retrieveContext` 二次确认，仅剩定义与注入、无调用，见上文 grep 结果）；重构失败即 `\"\"`，LLM 拿到空串安全。\n\
  \n## 验证方式\n- **测试/检查**:\n  1. `grep -rn \"retrieveContext\" backend/src` 确认当前无调用点（现状即\
  \ proof）。若方案 A，删除后 `./gradlew compileJava`（或项目对应构建命令）通过即可。\n  2. 单测：构造 topic 下仅子知识点、关键词必不命中的\
  \ case，断言返回 `\"\"`（方案 B）而非整表拼接；断言命中分支仍在 5 条封顶。\n  3. 若重新接入，注入 mock 的 `KeywordKnowledgeRetriever`\
  \ 声明式断言 `knowledgeRetriever` 在 `create/answer` 中被调用，且返回串无\"与查询相关\"误标。\n- **预期结果**:\
  \ 兜底分支不再产生无界上下文；运行时无死注入残留；prompt（若重建）token 与相关性信号稳定。\n- **复盘建议**: 这是 F-NEG 型缺陷——真正风险是\"\
  潜伏\"而非\"活跃\"。评审时优先检查**注入的依赖是否有调用点**（IDE usage search），并在重构合并前删除失效 @Autowired/构造注入字段，避免留下一类\"\
