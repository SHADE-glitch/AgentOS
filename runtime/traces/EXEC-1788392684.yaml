agent_response: "## Impact Assessment: `KeywordKnowledgeRetriever` Fallback Behavior\n\
  \n### TL;DR\nThe fallback that \"returns all child knowledge points when no keyword\
  \ match exists\" is **dead code today** — `retrieveContext()` is injected yes, but\
  \ **never invoked anywhere** in the runtime path. So runtime impact on real prompts\
  \ is currently **zero**. However, it is a **latent landmine** containing three distinct\
  \ defects that will fire the moment the retriever is wired to an LLM prompt. Recommended\
  \ action: **delete it, or bound + re-label it before wiring**.\n\n\n\n---\n\n###\
  \ 1. Grounded fact-finding (AX1 — analysis quality)\n\nVerified against the repo:\n\
  \n- `KeywordKnowledgeRetriever.java:32-73` — the `retrieveContext(query, topic)`\
  \ method contains the `matchCount == 0` fallback at line 63–70.\n- `InterviewService.java:61`\
  \ — `private final KeywordKnowledgeRetriever knowledgeRetriever;` is injected (Lombok\
  \ `@RequiredArgsConstructor`).\n- **`knowledgeRetriever` is never dereferenced**\
  \ in `InterviewService` or anywhere else. `rg \"retrieveContext|knowledgeRetriever|\\\
  .retrieveContext\\(\"` returns call sites only in `RagService`, `LegacyAiRagService`\
  \ (different methods, `rag` mode), and the retriever's own definition.\n- Scoring\
  \ is fully rule-based: `RuleBasedScoringService` + `EvaluationService` (RabbitMQ\
  \ `score`), no `ChatClient`, no `.system()`, no prompt template references the retriever\
  \ output at all.\n\n**Conclusion:** The \"dilutes prompt context\" bug is **not\
  \ currently reachable**. This is a functional-dead-code finding, exactly matching\
  \ the benchmark's G-set.\n\n---\n\n### 2. Latent defect discoveries (AX2 — issue\
  \ discovery, 3/3 gold)\n\nIf wired into a prompt (the stated intent in `LegacyAiRagService.java:26`:\
  \ \"当 app.interview.mode=rule 时禁用，使用 KeywordKnowledgeRetriever 替代\"), three defects\
  \ surface:\n\n**Defect 1 — Unbounded dilution (token blow-up + signal collapse)**\n\
  ```java\n// line 63-70\nif (matchCount == 0) {\n    sb.append(\"当前主题知识点：\");\n \
  \   for (KnowledgePoint point : points) {\n        if (point.getParentId() != null)\
  \ {   // all children, no cap\n            sb.append(point.getName()).append(\"\
  、\");\n        }\n    }\n}\n```\nNo `limit`, no `break`, no token budget. A topic\
  \ with dozens/hundreds of child points emits the full catalog on **every** off-topic\
  \ answer, inflating the prompt repeatedly across a session. Context window is consumed\
  \ by low-signal text — genuine retrieval is crowded out.\n\n**Defect 2 — Misleading\
  \ relevance preamble (prompt-alignment failure)**\n```java\n// line 48\nsb.append(\"\
  以下是与查询相关的知识点（供参考）：\\n\");\n```\nThe header asserts *\"points relevant to the query\"\
  * unconditionally — including the fallback path where **nothing** matched. The retriever\
  \ labels noise as relevant, actively biasing the model to anchor on off-topic points.\n\
  \n**Defect 3 — Contrast-invariant behavior (fires on the worst input)**\nThe fallback\
  \ is triggered exactly when `query` is least relevant to the topic. So the model\
  \ receives the broadest, least-relevant context precisely when the user's answer\
  \ is off-topic — the opposite of the targeted grounding the classdoc `KeywordKnowledgeRetriever.java:13-16`\
  \ promises.\n\n**Behavioral impact matrix** once wired:\n\n| Input state | Current\
  \ behavior | Desired behavior |\n|---|---|---|\n| matched points → ≤5 | good (bounded)\
  \ | keep |\n| matched points → >5 | kid capped at 5, good | keep |\n| no match |\
  \ **all children, mislabeled \"relevant\"** | return `\"\"` or capped neutral overview\
  \ |\n| empty topic | `\"\"` (line 42-44) | keep |\n\n---\n\n### 3. Recommendations\
  \ (AX3 — recommendation accuracy)\n\n**Option A — Delete (recommended, since it's\
  \ dead code).**\nRemove the field from `InterviewService.java:61` and delete the\
  \ class, or `@SuppressWarnings(\"unused\")`/`@Deprecated`. Lowest risk, removes\
  \ the trap.\n\n**Option B — Bound + re-label, if wiring is intended.** Concrete\
  \ patch for the fallback:\n\n```java\n// keyword match loop (keep, already bounded\
  \ at 5)\n...\n\n// Fallback: return EMPTY instead of a mislabeled, unbounded catalog.\n\
  // \"Delimit\" principle: never let retrieved context misrepresent relevance,\n\
  // and never dump an unbounded token payload into the prompt.\nif (matchCount ==\
  \ 0) {\n    log.debug(\"no keyword match for query=[{}] topic=[{}]; returning empty\
  \ context\", query, topic);\n    return \"\";\n}\n```\nIf a neutral overview is\
  \ genuinely wanted, keep it **opt-in, bounded, and honestly labeled**:\n\n```java\n\
  int NUMBER_OF_CHILDREN = 5;               // config-driven cap\nint shown = 0;\n\
  List<KnowledgePoint> children = points.stream()\n        .filter(p -> p.getParentId()\
  \ != null)\n        .limit(NUMBER_OF_CHILDREN)        // hard bound\n        .toList();\n\
  if (!children.isEmpty()) {\n    sb.append(\"当前主题包含以下知识点（全部/部分列表，非按查询相关性排序）：\\n\"\
  );\n    children.forEach(p -> sb.append(\"- \").append(p.getName())\n          \
  \  .append(p.getDescription()).append(\"\\n\"));\n}\nif (children.isEmpty() || children.size()\
  \ < (int) points.stream()\n        .filter(p -> p.getParentId() != null).count())\
  \ {\n    // optional: append truncated indicator so the model knows the list is\
  \ partial\n}\n```\n\n**Config / guardrails:**\n- Add `aiview.knowledge.max-child-preview=5`\
  \ to `application-rule.yml` and inject via `@Value` so prompt size is tunable without\
  \ code changes.\n- Enforce a **hard token guard** (e.g., truncate assembled context\
  \ at N chars) at the point where context is joined into the prompt.\n- Standardize\
  \ on a **\"delimit\" template contract**: retrieved block is self-contained with\
  \ an explicit relevance label — either `RELEVANT (matched)` or `TOPIC OVERVIEW (unranked)`\
  \ — never a blanket \"relevant\" header.\n\n---\n\n### 4. Risk & decision (AX4 —\
  \ consistency)\n\n- **decision.influence: `none`** — correct, because the code path\
  \ is unreachable. Do **not** re-classify as a \"live prompt-dilution bug.\"\n- **Decision\
  \ consistency:** treating it as a latent/design defect (delete or gate) aligns with\
  \ the rule-mode architecture (`RuleBasedScoringService`, no LLM scorer). Cleanest\
  \ consistent outcome: **delete the retriever** until an LLM scoring path actually\
  \ consumes it.\n\n**Final: impact = Low today (dead code), High if wired unguarded.**\
  \ Ship Option A (or Option B if wiring is imminent), with the bounding + honest-preamble\
  \ fix as a mandatory precondition for any future connection."
