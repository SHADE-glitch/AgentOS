agent_response: "== `KeywordKnowledgeRetriever` Fallback Impact Assessment — returning\
  \ *all* child knowledge points on no-match ==\n\n**Role scope:** Prompt Engineer\
  \ (lead), with RAG/LM/Backend support. This assessment scopes the **prompt-context\
  \ / retrieval-quality and prompt-design** impact and hands off the vector-store\
  \ internals and performance work to the RAG Engineer and Backend Architect.\n\n\
  ---\n\n## 1. What the code path does today\n\n```\nretrieve(topic, query):\n   \
  \ hits = keyword_match(query, within=children_of(topic))\n    if hits:         \
  \            # assume scored + capped\n        return top_k(hits)\n    return all_children(topic)\
  \   # FALLBACK — no keyword hit\n```\n\n**Observed behavior:** On any query whose\
  \ tokens fail to match the topic's keyword index (misspellings, paraphrases, synonyms,\
  \ compound/multi-term intents, or queries outside the narrow keyword vocabulary),\
  \ the retriever dumps the *entire child knowledge-point set* for the topic into\
  \ the context — uncapped, unscored.\n\n---\n\n## 2. Impact analysis\n\n### 2.1 Context\
  \ dilution (the named risk) — real and measurable\n- **Signal-to-noise collapse.**\
  \ The injected window becomes dominated by irrelevant leaf nodes. A topic with `N`\
  \ child points returns `N` passages regardless of how many (if any) are actually\
  \ relevant. If the true relevant children = `2` and `N = 40`, relevance density\
  \ drops ~20×.\n- **Token economics.** Prompt budget is finite. Every irrelevant\
  \ child starves space for the *real* retrieved context, the system instruction,\
  \ few-shot exemplars, and the ongoing partial answer. Under long-context pressure\
  \ the model truncates — warranty: **it truncates from the middle (your retrieved\
  \ evidence), not the edges.** The exact passages you need get silently dropped.\n\
  - **Recency/attention distortion.** Dilution isn't linear. With many competing passages,\
  \ attention is spread and the model is more likely to surface *generic, memorized\
  \ boilerplate* about the topic than to synthesize the specific answer — results\
  \ get vaguer, not just slower.\n\n### 2.2 Behavioral regressions\n| Failure mode\
  \ | Manifestation |\n|---|---|\n| **Wrongness from irrelevant context** | Model\
  \ anchors on an inapplicable sibling knowledge point that happens to be present,\
  \ degrading answer precision (`hallucination-by-contamination`). |\n| **Non-determinism**\
  \ | Fallback output depends on child ordering/iteration, which is often unstable\
  \ — same query, different context, different answer across runs. |\n| **Graceful-degradation\
  \ masked as success** | Downstream evaluation sees \"answer produced\" and never\
  \ realizes retrieval failed; the retriever's failure is invisible to observability.\
  \ |\n| **Latency/cost inflation** | All-child dump bloats prompt → more output tokens,\
  \ sometimes more input tokens per turn; cost and per-request latency climb silently.\
  \ |\n\n### 2.3 Severity assessment\n- **Incidence:** high for real queries (typos,\
  \ synonyms, multi-token intents, cross-cutting questions) — i.e., exactly the hard\
  \ cases.\n- **Blast radius:** every downstream consumer of this retriever (QA, summarization,\
  \ extraction, agent tool-calls) is affected to some degree.\n- **Verdict:** this\
  \ is a **P1-quality/C3-correctness** issue, not merely a cosmetic inefficiency.\
  \ It both wastes budget and, worse, degrades answer quality while appearing to \"\
  work.\"\n\n---\n\n## 3. Recommendations (in order of effort → value)\n\n### 3.1\
  \ First-order: make the fallback honest (stop silently succeeding)\n- **Return an\
  \ explicit \"NO_RELEVANT_CONTEXT\"** instead of the all-children dump. Let the caller\
  \ decide (few-shot explanation, clarification, super-topic summary), rather than\
  \ forbidding an answer with noise.\n#### 3.2 Scope the fallback to depth-1 relevant\
  \ neighbors, not all descendants\n- Walk the topic's **immediate parent** and **highest-scoring\
  \ sibling** subtrees, cap at `top_k`, and *label* them as fallback:\n```python\n\
  def retrieve(topic, query, k=5):\n    hits = score(keyword_match(query, children(topic)))\n\
  \    if hits:\n        return Ranked(hits, source=\"exact\")\n    near = up_scope(topic,\
  \ hops=1, cap=k)      # parent + nearest siblings\n    return Ranked(score_lex(near,\
  \ query), source=\"fallback\")  # STILL scored+capped\n```\n- Any fallback **must\
  \ still be scored and capped.** The bug is specifically the *uncapped, unordered*\
  \ dump. The fix is: if you cannot do semantic rerank, at least do lexical rerank\
  \ over a small candidate neighborhood.\n\n### 3.2 (prompt-design layer — this role's\
  \ core fix) make the prompt self-aware\nEven if you keep a narrowed fallback, add\
  \ process/confidence markers so the LM treats fallback context differently:\n```\n\
  [Context]\n... children for topic \"Hyperlipidemia\" (matched exactly) ...\n...\
  \ PARENT/NEIGHBOR context (MATCH_LOW_CONFIDENCE — use with caution; may be tangential)\
  \ ...\n```\nThen add a grounding instruction tuned for the fallback path:\n```\n\
  If the context is LOW_CONFIDENCE or the evidence does not directly support the question,\n\
  prefer saying \"I need clarification\" or answering at the topic level — do NOT\
  \ invent specific facts.\n```\nThis converts an uncontrollable context-dump into\
  \ a *governed* fallback the model is told to distrust.\n\n### 3.3 Root-cause fixes\
  \ that belong to RAG/Backend (hand off)\n- **Keyword→vector hybrid.** Replace keyword-only\
  \ matching with embedding similarity (`multilingual` retriever) + keyword as a filter/signal.\
  \ This directly removes the \"no keyword match\" trigger for paraphrase/synonym\
  \ queries.\n- **Normalize the query** (lowercase, stem/lemmatize, subword n-gram\
  \ overlap, spelling-tolerant matching) so *lexical* misses drop.\n- **Add a real\
  \ reranker** (cross-encoder) over a larger candidate pool, then cap → keeps precision\
  \ without the raw-context dump.\n- **Cap + budget the retrieval slot** at the system\
  \ level so no path can exceed the prompt's evidence allowance (e.g., `max_context_chars`,\
  \ enforced centrally).\n\n### 3.4 Observability\n- Emit a telemetry event for every\
  \ fallback trigger (`source=fallback`, `fallback_k`, `child_count`). Your loop already\
  \ has collector/validator stages — these events should surface as retrieval-quality\
  \ metrics so the failure is *visible* instead of *silent*.\n\n---\n\n## 4. Concrete\
  \ prompt-design patch (smallest defensible change)\n\nKeep the retriever contract\
  \ minimal and make the consumer resilient:\n\n```python\nclass RetrievalResult:\n\
  \    passages: list[Passage]      # already scored, capped, deduped\n    source:\
  \ Literal[\"exact\", \"fallback\"]\n    fallback_ratio: float        # #fallback_passages\
  \ / k  -> for gating\n\ndef build_context(results: RetrievalResult) -> str:\n  \
  \  head  = \"SEGMENT: precise-match\" if results.source == \"exact\" \\\n      \
  \      else \"SEGMENT: low-confidence-fallback (evidence may be peripheral)\"\n\
  \    return head + \"\\n\" + \"\\n\".join(p.text for p in results.passages)\n```\n\
  \nAnd gate the *instruction* on the fallback signature so the model stays grounded:\n\
  \n```\nDecision rule for {source}:\n- exact:   answer directly from context; cite\
  \ the matching child.\n- fallback: if context does not directly support the answer,\n\
  \            respond with a topic-level summary + follow-up question.\n        \
  \    Never assert specific child-level facts not supported by context.\n```\n\n\
  **This turns the failure from \"silently bloated prompt produces a vague wrong answer\"\
  \ into \"explicit downgrade the prompt is instructed to handle safely.\"**\n\n---\n\
  \n## 5. Proposed acceptance criteria for the handoff\n\n1. No retrieval path returns\
  \ **uncapped or unscored** passages.\n2. Fallback triggers a `source=fallback` marker\
  \ + dedicated instruction in the prompt.\n3. Telemetry SOPS: fallback rate, % of\
  \ runtime answering directly from fallback, factual-consistency on fallback answers.\n\
  4. Semantic-hybrid retriever (RAG) + backend budget cap (Backend Architect) tracked\
  \ as follow-ups.\n\n---\n\n**Bottom line:** The fallback is a **silent correctness+budget\
  \ bug**, not a performance nit. The minimal responsible fix is *stop dumping* —\
  \ narrow to capped+scored neighbors and mark them low-confidence so the prompted\
  \ LM treats them skeptically. The durable fix (vector-hybrid + rerank) removes the\
  \ trigger itself and is the RAG Engineer's handoff target.\n\n*Note: I'm operating\
  \ as the prompt-engineer on this task, scoping the retrieval/prompt-context deliverable;\
  \ recommend routing §3.3 (vector index + reranker) to the RAG Engineer and §3.3\
  \ performance/budget enforcement to a Backend/Database context before merge.*"
