agent_response: "## 结论先行\n\n缓存方案本身是**正确的缓存旁路（cache-aside）+ TTL 兜底**组合：`DashboardService.evict()`\
  \ 已在所有聚合相关的写路径上被调用，`build()` 命中即返回、未命中重算 DB truth 并回填 10 分钟 TTL。因此**绝大多数聚合 mutation\
  \ 路径是安全的（fresh）**。\n\n但存在两类**真实可读出的风险**，其中一处会让聚合值「看起来新鲜却是错的」——这不是 TTL 过期问题，而是**同一会话被写入两条\
  \ `InterviewResult`（同步+异步重复评分）**，导致四维均值和薄弱点被重复计入。\n\n---\n\n## 1. 缓存命中的聚合数据源（stateness\
  \ 的判定基准）\n\n`DashboardService.compute()`（`DashboardService.java:93-177`）只依赖两张表的一个用户子集：\n\
  \n| 输入源 | 过滤条件 | 影响的展示字段 |\n|---|---|---|\n| `InterviewResult`（userId） | 全部 | 雷达四维均分、最薄弱点、建议列表\
  \ |\n| `InterviewSession`（userId） | `status=FINISHED` 且 `totalScore != null`，按 `finishedAt`\
  \ 升序 | 场次、平均分、最高分、累加题数、成绩趋势 |\n\n**“缓存何时 stale”** 严格等于：这两张表中该字段的定义域发生变化时刻，与缓存键写入时刻之间存在未被\
  \ `evict()` 覆盖的差值。理论上界 = TTL（10 分钟），因为任何键最终都会过期重建。\n\n---\n\n## 2. mutation 路径安全性清单（逐条评估）\n\
  \n| # | 变更路径 | 发生位置 | 是否调用 `evict()` | 安全 |\n|---|---|---|---|---|\n| P1 | 会话结束：同步评分\
  \ → `INSERT InterviewResult` | `InterviewService.java:152/169/227/244` | ✅ | **不安全**（见\
  \ §4，重复写入） |\n| P2 | 会话状态置为 `FINISHED`（`totalScore/finishedAt/status`） | `InterviewService.java:349`（`finishSession`）\
  \ | ✅ | 安全 |\n| P3 | 异步评分消费者：`INSERT InterviewResult` + 更新 `session.totalScore/report`\
  \ | `RuleBasedScoringService.java:57,66` | ✅ | 安全（自身写一致） |\n| P4 | AI 评分消费者（同上）\
  \ | `InterviewScoringService.java:106,111`；`LegacyAiScoringService.java:113,118`\
  \ | ✅ | 安全 |\n| P5 | 删除会话/结果 | — | — | **不存在此路径**（`grep delete/remove` 无命中）；若未来新增必须补\
  \ `evict()`，否则 stale 到 TTL 到期 |\n| P6 | 重评分/修改已提交的 `InterviewResult` | — | — | 代码中无此路径\
  \ |\n\n结论：**P1–P4 都做了即时失效**，故由这些写操作触发的缓存是「接近基线的」；唯一结构性 stale 窗口来自 TTL 到期与 `evict()`\
  \ 之间被并发覆盖（见 §3）。\n\n---\n\n## 3. 仍存在的 stale 窗口与原因分析\n\n1. **崩溃/异步裁剪（原子性缺口）**\n \
  \  `finishSession`/消费者先写 DB 再调 `evict()`，不在同一事务内。若 DB 提交成功、`evict()` 前的进程崩溃或 Redis\
  \ 短暂不可用（`delete()` 失败只 `log.warn`，`DashboardService.java:88-90`），缓存会 stale **至多\
  \ 10 分钟**。\n   - 缓解：`evict()` 失败时不计入“成功”，由 TTL 兜底；或用**事务型 outbox / afterCommit 回调**把失效动作与写事务绑定。\n\
  \n2. **TTL 本身是有界 stale 的兜底而非目标**\n   当前依赖“显式失效为主、TTL 为上限”，方向正确。若某条路径漏了 `evict()`，错误被\
  \ TTL 掩盖到 10 分钟才自愈；可把 TTL 调小（如 2–5 分钟）作为更紧的安全网，代价是冷路径计算更频繁。\n\n3. **读路径的 parse 容错**\n\
  \   `build()` 命中缓存但反序列化失败会 fallback 到 `compute()`（`DashboardService.java:56-62`），安全。\n\
  \n---\n\n## 4. ⚠️ 关键发现：同步 + 异步「重复评分」会污染聚合\n\n`finishSession()`（`InterviewService.java:340-359`）无论是否已经**同步**调用了\
