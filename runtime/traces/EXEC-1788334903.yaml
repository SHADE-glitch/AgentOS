  \ 200 且值正确 |\n\n上面改动中真正「非做不可」的是 §4 的重复评分修复；其余（条件激活、afterCommit 原子化、TTL 收紧）为稳健性加固。要我直接把重复评分与\
  \ `@ConditionalOnProperty` 两处修掉吗？"
