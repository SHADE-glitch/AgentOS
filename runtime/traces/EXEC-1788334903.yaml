  \ `insert(result)` + 覆写 `session.totalScore`。\n\n结果：**同一会话产生两条 `InterviewResult`**，`compute()`\
  \ 的雷达均分/薄弱点会把该会话重复加权（例如只答过 1 场却按 2 场除），且 `totalScore` 被再次覆盖。这**不是** TTL stale，而是「缓存新鲜但聚合口径错误」，比单纯\
  \ stale 更隐蔽，且 `evict()` 救不了它。\n\n**修复建议（二选一）：**\n- 只保留一条评分路径：结束边界仅投递异步任务（P3/P4 负责\
  \ `evaluationService.score`+insert+update+evict），删除同步分支的 `resultMapper.insert` 与重复\
  \ `score` 调用；或\n- 只在结束边界同步评分并 `INSERT`，`finishSession` 不再投递评分任务。\n\n另一处关联缺陷：`InterviewScoringService`\
  \ 无 `@ConditionalOnProperty`，而 `RuleBasedScoringService` 在默认 `mode=rule` 下激活，**两个消费者轮询同一队列形成竞争**——在\
  \ `rule` 模式下某条消息也可能被 AI 评分服务抢到（而它无条件依赖 `chatClient`），建议给 `InterviewScoringService`\
  \ 补 `@ConditionalOnProperty(name=\"app.interview.mode\", havingValue=\"ai\")`，与\
  \ `LegacyAiScoringService`、`RuleBasedScoringService` 对齐。\n\n---\n\n## 5. 实施方案（推荐改造点）\n\
  \n**目标**：把“新鲜性”从“靠每处手写 evict”升级为“写事务与失效原子化”，并消除重复评分。\n\n1. `finishSession` 去重（`InterviewService.java`）——移除结束分支里的同步\
  \ `insert`，统一由异步消费者落库并 `evict`；或反过来只同步落地、不再 PUSH。保留 `evict` 的幂等调用。\n2. 给 `InterviewScoringService`\
  \ 增加 `@ConditionalOnProperty(mode=\"ai\")`。\n3. 将 `evict()` 与写事务绑定（示例，凭 `@Transactional`\
  \ 无法含 Redis，给出 afterCommit 思路）：\n\n```java\n// 事务内写库，提交后失效缓存 —— 消除「已写库但未失效」的原子性缺口\n\
  @TransactionalEventListener(phase = TransactionPhase.AFTER_COMMIT)\npublic void\
  \ afterCommit(InterviewScoredEvent evt) {\n    dashboardService.evict(evt.userId());\n\
  }\n// 由 RuleBasedScoringService / InterviewScoringService 在写库后被 @Transactional\n\
  // 逻辑发布 InterviewScoredEvent，而不是直接调 evict()。\n```\n\n4. TTL 收紧为兜底安全网（如 `CACHE_TTL_MINUTES=5`），作为对任何遗漏\
  \ `evict()` 的最终护栏。\n\n---\n\n## 6. 验证方式\n\n| 检查 | 方法 | 预期 |\n|---|---|---|\n| 写后新鲜\
  \ | 评分结束 → 立即 `GET /api/dashboard` | 返回新分；Redis `dashboard:user:*` 键已删除/重写 |\n|\
  \ 未写不刷新 | 非 FINISHED 会话改动 → `GET /api/dashboard` | 命中缓存、值不变（正确语义） |\n| 重复评分回归 |\
