  \ fallback 质量。\n\n- 全文检索 `knowledgeRetriever` / `retrieveContext(`：`KeywordKnowledgeRetriever`\
  \ 仅被**注入字段**（`InterviewService.java:61`），**无任何调用点**（`InterviewService.java` 内的 `reportService.generateFeedback`/`evaluationService.score`\
  \ 是另一条链，见下文）。\n- 即便接入，rule 模式（`app.interview.mode=rule`，`matchIfMissing=true` 为默认）的评分是**确定性规则**路径（`RuleBasedScoringService`\
  \ + `ReportService.generateFeedback` 模板拼接，`ReportService.java:69`），不构造 LLM prompt；真正走\
  \ `ChatClient` 的是异步 AI 路径 `InterviewScoringService`（`InterviewScoringService.java:65`），它不引用该\
  \ retriever。\n\n### 机制拆解（`KeywordKnowledgeRetriever.java:32-73`）\n1. **L38-44**\
  \ 按 `topic` 取出**全部**知识点。\n2. **L50-60** 关键词匹配循环：命中数 `matchCount++`，命中分支**最多展示 5\
  \ 条**（`L58` 截断），带 description——这是好的部分。\n3. **L63-70 fallback**：`matchCount == 0`\
  \ 时，把该 topic 下**所有子知识点（`parentId != null`）的 name** 用 `、` 无上限拼接进 `sb`。\n\n### fallback\
  \ 的设计缺陷（若被使用）\n| 维度 | 问题 |\n|---|---|\n| **规模无上限** | 5 条上限只存在于命中分支；fallback 不设任何\
  \ `MAX`/截断，topic 子节点越多，prompt 越长。 |\n| **信号密度差** | 只拼 `name`，无 description/层级——占\
