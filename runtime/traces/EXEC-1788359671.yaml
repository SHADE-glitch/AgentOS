agent_response: "## Assessment: `dashboard:user:*` cache staleness & safe mutation\
  \ paths\n\n### 1. System under analysis\n\n- **Cache key:** `dashboard:user:{userId}`\
  \ — per-user, so invalidation is naturally scoped to one user (`DashboardService.java:48-50`).\n\
  - **Compute source of truth (DB):** `interview_result` (dimension sums → radar/weak\
  \ points/suggestions) and `interview_session` rows with `status='FINISHED'` and\
  \ `totalScore IS NOT NULL` (→ stats/trend) (`DashboardService.compute()` at `:93-177`).\n\
  - **Cache write:** on miss only — `bucket.set(json, CACHE_TTL_MINUTES=10, MINUTES)`\
  \ at `:66` (`DashboardService.java:38,66`).\n- **Cache read:** on hit, deserialize\
  \ and return without any freshness check (`:55-62`).\n- **Invalidation:** `evict(userId)`\
  \ = Redis `delete` (`:81-91`).\n\nThe prior defect (stale-until-expiry) has already\
  \ been patched: an `evict()` now exists and is wired into the write paths. `TTL=10min`\
  \ has therefore been demoted from *primary* invalidation mechanism to a **safety-net\
  \ fallback** for missed/ failed evictions.\n\n---\n\n### 2. When the cached view\
  \ becomes stale\n\nSince every current mutation path is followed by `evict(userId)`,\
  \ a hard 10-minute stale window (old behavior) no longer occurs on the hot paths.\
  \ Remaining staleness sources, ranked:\n\n**A. Eviction-failure window (real, bounded\
  \ by TTL).**\n`evict()` swallows exceptions and only logs (`:85-89`), and the Redis\
  \ `delete` is issued *after* the DB write with **no transaction** uniting them.\
  \ If Redis is momentarily unavailable (or `delete` errors) right after a commit,\
  \ the old dashboard stays live until TTL expiry → up to **10 min stale**. Self-healing,\
  \ but it markets directly on G1/G3 (stale aggregates drive user decisions).\n\n\
  **B. Crash between DB commit and `delete` (rare, bounded by TTL).**\nSame ordering\
  \ hole as (A) in the process-crash case — node dies after `insert`/`updateById`\
  \ commits but before `evict` runs. Again bounded to ≤10 min by TTL.\n\n**C. Synchronous\
  \ double-scoring corrupts the *recomputed* snapshot (correctness, not staleness).**\n\
  `finishSession()` (`InterviewService.java:340-359`) publishes an MQ scoring task\
  \ unconditionally, and `answer()`/`answerStream()` **also** call `evaluationService.score()`\
  \ + `resultMapper.insert()` inline first (`:150-152,167-169,225-227,242-244`). In\
  \ the default **rule** mode the consumer `RuleBasedScoringService.score()` then\
  \ inserts a *second* `interview_result` (`RuleBasedScoringService.java:55-57`).\
  \ Result: a fresh recompute becomes *wrong* (double-counted dimensions/totals),\
  \ which is worse than stale and invisible to any TTL/eviction fix. This is the only\
  \ path where the DB truth itself drifts, so `evict` cannot save it.\n\n**D. Transient\
  \ pre-score window (expected, correct, not a defect).**\n`finishSession` sets `status='FINISHED'`,\
  \ `finishedAt`, and evicts **before** the async consumer sets `totalScore`. In between,\
  \ a recompute *correctly excludes* the session because `compute()` filters `.isNotNull(totalScore)`\
  \ (`:99-101`). So the dashboard briefly shows the finished session without a score\
  \ — accurate (\"grading pending\"), then the async evict (e.g. `RuleBasedScoringService.java:66`)\
  \ triggers a correct recompute. Safe by design.\n\n**E. Expression — no freshness/version\
  \ stamp (G4).**\nThe cached payload carries no `computedAt`/`version` (`DashboardVO`),\
  \ so a reader cannot distinguish \"fresh\" from \"un-known.\" The `get()!=null`\
  \ hit at `:56` treats *presence* as truth with no ability to assert DB parity.\n\
  \n---\n\n### 3. Mutation-path safety matrix\n\nEvery mutating path was checked against\
  \ `DashboardService.evict()`. All current ones call it — **but on catch-all logging,\
  \ not transactionally.**\n\n| # | Mutation path | Method | Affects dashboard? |\
  \ `evict()` calls | Safe? |\n|---|---|---|---|---|---|\n| 1 | Sync finish (answer)\
  \ | `InterviewService:152` | yes (result+session) | ✔ | Safe (mod C) |\n| 2 | Sync\
  \ finish (stream) | `InterviewService:227` | yes | ✔ | Safe (mod C) |\n| 3 | Sync\
  \ finish (no-question) ×2 | `InterviewService:169,244` | yes | ✔ | Safe (mod C)\
  \ |\n| 4 | `finishSession` (status→FINISHED, finishedAt) | `InterviewService:349`\
  \ | yes | ✔ | Safe |\n| 5 | Async AI scoring (result insert) | `InterviewScoringService:106`\
  \ | yes | ✔ | Safe |\n| 6 | Async AI scoring (session totalScore) | `InterviewScoringService:111`\
  \ | yes | ✔ | Safe |\n| 7 | Async rule scoring (result insert) | `RuleBasedScoringService:57`\
  \ | yes | ✔ | Safe (mod C) |\n| 8 | Async rule scoring (session totalScore) | `RuleBasedScoringService:66`\
  \ | yes | ✔ | Safe |\n| 9 | Async legacy-AI scoring (result insert) | `LegacyAiScoringService:113`\
  \ | yes | ✔ | Safe |\n| 10 | Async legacy-AI scoring (session totalScore) | `LegacyAiScoringService:118`\
  \ | yes | ✔ | Safe |\n| 11 | `interview_session` status/currentQ/msgCount updates\
  \ (ASKING→…) | `InterviewService:114,186,261` | **no** (not FINISHED, no totalScore)\
  \ | n/a | Safe to skip |\n| 12 | KB chunk delete / kb delete | `RagService`,`LegacyAiRagService`\
  \ | no | n/a | Safe |\n| 13 | `interview_result` delete | *(none exists in codebase)*\
  \ | — | — | No such path |\n\n**What makes a path \"safe\" (invariant):** a write\
  \ that changes `interview_result`, or changes `interview_session.totalScore`/`finishedAt`/`status=FINISHED`,\
  \ must delete `dashboard:user:{userId}` **in the same logical step** as the DB write.\
  \ Paths 1-10 satisfy the invariant; 11-13 never touch dashboard inputs, so \"safe\
  \ to skip.\"\n\n**The real residual risk is not \"missing path\" today — it is the\
  \ pattern's fragility:** a future mutation added without `evict()` silently re-introduces\
  \ a 10-min stale window (this exact regression is the Run2 defect). Redundant double-evict\
  \ calls (each listener evicts twice, `:106+111`, `:57+66`, `:113+118`) mask but\
  \ do not eliminate that fragility.\n\n---\n\n### 4. Recommendations\n\n**R1 — Centralize\
  \ mutation+evict (defense against forgetting).**\nRoute every result/session write\
  \ through one service method that commits and evicts atomically, so the invariant\
  \ can't be broken by a new caller.\n\n```java\n@Transactional\npublic InterviewResult\
  \ persistResult(InterviewResult r, Long userId) {\n    resultMapper.insert(r);\n\
  \    dashboardService.evict(userId);   // always bundled with the write\n    return\
  \ r;\n}\n```\n\n**R2 — Make evict failure observable (close gap A/B).**\nAt minimum\
  \ emit a metric/log on evict failure and **let failures fail the DB commit via an\
  \ outbox** so the invalidate retries:\n\n```java\n@Transactional\npublic void finishSessionTx(InterviewSession\
  \ s, Long userId) {\n    sessionMapper.updateById(s);\n    evictionOutbox.enqueue(dashboardKey(userId));\
  \ // DB row, consumer retries delete\n}\n```\n\nIf full outbox is out of scope,\
  \ at least elevate the swallowed exception in `evict()` to an error log + counter\
  \ so gap A is detectable rather than silent (`DashboardService.java:88-89`).\n\n\
  **R3 — Add a freshness stamp (G4).** Embed a monotonic version in the cached payload;\
  \ reject hits whose version is behind the write-side version (or a `computedAt`\
  \ timestamp) so presence≠freshness.\n\n```java\nRecord dashboard.raw {\n   DashboardVO\
  \ payload;\n   long version;        // e.g. lastMod epoch or resultCount+maxUpdatedAt\n\
  \   Instant computedAt;\n}\n```\n\n**R4 — Add a version-based guard instead of blind\
  \ TTL.** Keep a companion write-side version key, e.g. `dashboard:user:{id}:ver`,\
  \ and in `build()` only reuse the cache while `ver` is stable; otherwise recompute\
  \ even within TTL.\n\n**R5 — Fix the double-scoring correctness bug (gap C) — highest\
  \ priority for DB truth.** The inline `evaluationService.score()+insert` in `answer`/`answerStream`\
  \ is redundant with the MQ consumer. Keep exactly one scorer per mode: if the MQ\
  \ listener scores, the sync path should only `finishSession` + enqueue, not insert\
  \ its own result. Otherwise `evict` can't prevent corrupted aggregates.\n\n**R6\
  \ — Reconfigure the safety net.** With eviction now on all paths, TTL can be reduced\
  \ (e.g. to `60s`) so any missed evict self-heals faster, without the cost of per-request\
  \ recompute on the normal path. Make it configurable rather than a `static final`.\n\
  \n```yaml\napp.dashboard.cache-ttl-minutes: 1     # safety net only; invalidation\
  \ drives freshness\n```\n\n---\n\n### 5. Verification plan\n\n1. **Path coverage:**\
  \ `grep -rn \"dashboardService.evict\"` and diff it against every `resultMapper.insert`,\
  \ and every `sessionMapper.updateById` that writes `totalScore`/`status`/`finishedAt`.\
  \ Confirm 1:1 (R1 makes this checkable).\n2. **Staleness probe:** write an `InterviewResult`,\
  \ immediately `GET` dashboard → must be recomputed, not the pre-write snapshot (already\
  \ true post-fix).\n3. **TTL fallback probe:** block `delete` (simulate Redis error)\
  \ → confirm metric fires and cache expires ≤ new TTL.\n4. **Ordering fault injection:**\
  \ kill the container between DB commit and evict → confirm version/outbox self-heals\
  \ on restart.\n5. **Double-score regression test:** run rule mode end-to-end; assert\
  \ exactly one `interview_result` per session and that `avgScore`/dimension sums\
  \ match a single result (guards C).\n\n**Bottom line:** staleness is now bounded\
  \ (≤10 min, TTL-scoped) only in the evict-failure/crash cases; the larger latent\
  \ blocker is (C) double-scoring corrupting the DB source of truth, and the pattern's\
  \ need to remember `evict()` on every future write. Prioritize R5, then R2/R3 to\
  \ make the cache a verifiable projection rather than an assumed-truth TTL bucket."
