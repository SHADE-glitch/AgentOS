agent_response: "# Impact Assessment: `KeywordKnowledgeRetriever` Dump-All Fallback\n\
  \n## 1. Behavior confirmation (root cause)\n\nThe fallback exists exactly as described\
  \ at `KeywordKnowledgeRetriever.java:62-70`. When the keyword matcher (lines 53–60)\
  \ yields `matchCount == 0`, it appends **every child knowledge point** for the topic,\
  \ joined by `、`, with no cap and no descriptions:\n\n```java\n// 如果没有匹配，返回所有知识点概述\
  \  (matchCount == 0)\nsb.append(\"当前主题知识点：\");\nfor (KnowledgePoint point : points)\
  \ {\n    if (point.getParentId() != null) {\n        sb.append(point.getName()).append(\"\
  、\");   // << unbounded O(n), no limit, names only\n    }\n}\n```\n\nNote the asymmetry:\
  \ the **matched** path returns targeted points and **caps at 5** (line 58) with\
  \ `name + description`; the **fallback** returns every child with *only bare names*\
  \ and **no cap**.\n\n**Critical contextual finding (changes the risk rating):**\
  \ `knowledgeRetriever` is injected at `InterviewService.java:61` but has **zero\
  \ call sites** across the codebase — the current scoring path is purely rule-based\
  \ (`EvaluationService.evaluateKnowledge`, keyword counting). So this dilution is\
  \ **latent/structural, not today's live behavior**. The class javadoc (\"替代 AI RAG\
  \ 检索\") makes clear it's *intended* to feed an LLM prompt. If/when wired in, the\
  \ impact below activates across every no-match turn.\n\n---\n\n## 2. Impact on the\
  \ LLM prompt\n\n### 2.1 Context dilution (signal-to-noise collapse)\n- Matched path\
  \ → **targeted** points with descriptions (high signal, ordered by relevance).\n\
  - Fallback → a **flat, equal-weight wall of bare topic names**, each treated as\
  \ equally important regardless of the actual question/answer. The model gets **zero\
  \ relevance signal** precisely when retrieval failed — so relevance degrades *by\
  \ design* on the turns where it was already most needed.\n\n### 2.2 Unbounded token/cost/latency\
  \ inflation\n- `points` query has **no LIMIT** (lines 38–40), so the fallback is\
  \ **O(n)** over all children; matched path caps at 5.\n- A topic with 30–50 children\
  \ × ~10 chars ≈ 300–500 chars ≈ **200–400 tokens**, dumped unconditionally on every\
  \ no-match answer. Multiplied across `MAX_QUESTIONS=6`, this compounds per answer\
  \ — inflating cost/latency on exactly the turns that produced nothing useful.\n\n\
  **Signal-to-noise ratio drops ~4×+ vs. the matched path and is *inversely correlated*\
  \ with usefulness: you spend the most context when you have the least to contribute.**\n\
  \n### 2.3 Correctness / instruction-following degradation\nA long, flat, unlabeled\
  \ list competes with the actual question/answer/instructions for attention. The\
  \ model is more likely to:\n- **Hallucinate relevance** — anchor the evaluation\
  \ or next question on a topic dragged from the overloaded list.\n- **Anchor on list\
  \ order** (DB `sort_order`) instead of the user's answer.\n- **Fail to flag uncertainty**\
  \ — the presence of \"knowledge\" suppresses \"insufficient info\" responses even\
  \ when there are no facts, only names.\n\n### 2.4 Masks retrieval failures\nConverting\
  \ \"no keyword match\" (meaningful: substring matching failed) into \"here is everything\"\
  \ hides the real matcher weaknesses (whole-string substring match, `toLowerCase()`\
  \ no-op on Chinese, no segmentation) from operators and the model alike.\n\n###\
  \ 2.5 Inconsistent context grammar\nMatched bullets (`- name：description`) vs. fallback\
  \ list (`name、name、name`) — two prompt-context grammars the model must learn to\
  \ interpret, increasing usage variance.\n\n---\n\n## 3. Severity & risk rating\n\
  \n| State | Severity |\n|---|---|\n| **Current** (dead code, no live LLM path) |\
  \ **Low** — but a trap: wiring it in \"to add RAG context\" activates lataged dilution\
  \ + unbounded growth |\n| **If wired into an LLM prompt** | **Medium–High** — answer-relevance\
  \ and token economics degrade across a whole session, worst on genuine no-match\
  \ turns |\n\n**Prompt-engineering principle: when retrieval fails, return an explicit,\
  \ low-trust marker rather than a high-volume, low-relevance substitute — never let\
  \ the fallback be more expensive and noisier than a successful retrieval.**\n\n\
  ---\n\n## 4. Recommended fixes\n\n### 4.1 Replace dump-all with an explicit, bounded\
  \ low-signal block\n```java\nif (matchCount == 0) {\n    long childCount = points.stream().filter(p\
  \ -> p.getParentId() != null).count();\n    if (childCount <= 3) {\n        sb.append(\"\
  当前主题子知识点：\");\n        points.stream().filter(p -> p.getParentId() != null).limit(3)\n\
  \             .forEach(p -> sb.append(p.getName()).append(\"、\"));\n        sb.setLength(sb.length()\
  \ - 1);\n    } else {\n        return \"[无关键词命中的知识点上下文]\";   // sentinel\n    }\n\
  }\n```\n\n### 4.2 Improve retrieval so the fallback fires less often\nTokenize and\
  \ match per-keyword against both name and description, then score/sort instead of\
  \ dumping:\n```java\nprivate int match(KnowledgePoint p, String[] keywords) {\n\
  \    String name = p.getName().toLowerCase();\n    String desc  = p.getDescription()\
  \ == null ? \"\" : p.getDescription().toLowerCase();\n    int hit = 0;\n    for\
  \ (String kw : keywords)\n        if (!kw.isBlank() && (name.contains(kw) || desc.contains(kw)))\
  \ hit++;\n    return hit;\n}\n// on no hit: fall back to \"top N by difficulty/sortOrder\"\
  , never \"all children\"\n```\n\n### 4.3 Align the prompt contract (the key prompt\
  \ change)\nTeach the model how to interpret each context tier:\n```text\n系统指令（追加）：\n\
  - 「知识点上下文」仅当明确标注“相关”时，作为可靠的追问/评分依据。\n- 若上下文为「无关键词命中的知识点上下文」，视为检索未命中：\n   不要据此虚构知识点，基于候选人实际回答和通用知识评价；\n\
  \   必要时在反馈中注明“该回答未命中主题知识点”。\n- 对未提供描述的纯知识点名称列表，仅用于提示话题范围，不得当作事实来源。\n```\n\n### 4.4\
  \ Enforce a hard cap regardless of branch\n```java\n/* shared guard before build\
  \ */\nlimitMatches(sb, TOP_CONTEXT_LIMIT);   // e.g. 8 entries 或 ~600 chars\n```\n\
  \n### 4.5 Structural cleanup — remove the dead-path risk\nSince `knowledgeRetriever`\
  \ is injected but never called, either **wire it deliberately** behind a feature\
  \ flag (`@ConditionalOnProperty(mode=rule)`) at the LLM-prompt call site, or **remove\
  \ the bean** until then. A live-looking unused retriever lets the latent dilution\
  \ reappear silently in future refactors.\n\n---\n\n## 5. Summary\n\n| Item | Finding\
  \ |\n|---|---|\n| Code path | `KeywordKnowledgeRetriever.java:62-70`, unbounded\
  \ O(n) dump of child names, no descriptions, no cap |\n| Current blast radius |\
  \ **Low** — injected at `InterviewService.java:61` but never invoked; active path\
  \ is rule-based |\n| If wired to an LLM prompt | **Medium–High** — context dilution,\
  \ token/cost/latency inflation, hallucination/relevance degradation, masks retrieval\
  \ failures |\n| Primary fix | bounded sentinel instead of dump-all + prompt-contract\
  \ tier; tokenized/segmented matching; hard cap |\n| Secondary | teach the untrusted-context\
  \ tier (4.3); wire or remove the dead bean (4.5) |\n\n**Recommendation: do not ship\
  \ the dump-all fallback.** It is strictly worse than a clean miss — more expensive,\
  \ noisier, and semantically indistinguishable from a successful retrieval. Deploy\
  \ 4.1 + 4.3 together; they are the minimum to make the fallback token-bounded and\
  \ model-behavior predictable."
