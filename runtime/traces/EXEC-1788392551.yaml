agent_response: "# Impact Assessment — `KeywordKnowledgeRetriever` fallback context\
  \ dilution\n\n## 目标 (Objective)\n- **业务目标:** 评估 `KeywordKnowledgeRetriever.retrieveContext()`\
  \ 在无关键词命中时回退输出全部子知识点、从而稀释 prompt 上下文的影响。\n- **当前约束:** 方法仅在 `app.interview.mode=rule`（或未配置）时启用；调用侧是\
  \ `InterviewService`（`backend/.../interview/service/InterviewService.java:61` 注入）。\n\
  - **成功标准:** 准确定位问题的影响范围、根因、严重度，并给出可落地的修复与验证方式。\n\n## 问题判断 (Diagnosis)\n\n**关键发现（需先澄清）：当前是死代码，运行时影响\
  \ ≈ 0，缺陷是\"潜伏的\"。**\n\n- `grep knowledgeRetriever\\.` → **无任何调用点**。`KeywordKnowledgeRetriever.retrieveContext(String,\
  \ String)`（`KeywordKnowledgeRetriever.java:32`）在代码库中**只被定义、从未被调用**。\n- `InterviewService`\
  \ 虽在 `:61` 注入了 `knowledgeRetriever` 字段，但随后没有任何 `.retrieveContext(...)` 调用。实测调用点是存量的\
  \ `RagService.java:154` 和 `LegacyAiRagService.java:160` —— 它们属不同类、不同签名 `retrieveContext(userId,\
  \ query, topK)`，与本方法无关。\n\n**推论：** 若以\"当前线上路径\"判影响，答案是**无直接影响**（类只在 rule 模式加载，且即便加载也不被调用）。真正的风险在\"\
  一旦被接入 prompt，缺陷将暴露\"。因此评估必须区分 **现状风险** 与 **潜伏缺陷**，否则会高估或误判。\n\n## 潜伏缺陷分析（若接入 prompt\
  \ 后的真实影响）\n\n方法本体（`KeywordKnowledgeRetriever.java:32-73`）存在三个独立缺陷，严重程度自上而下：Starring:\
  \ 34, Mis - \n\n**1. 误导性前缀 + 相关性错配（最高危 — prompt 层面的精神伤害）**\n- `:48` 无条件写入 `sb.append(\"\
  以下是与查询相关的知识点（供参考）：\\n\");`\n- 该前缀宣称\"是与查询**相关**的知识点\"，但无命中分支（`:63-70`）执行的是**与查询完全无关**的全量知识点名。两者语义直接矛盾。\n\
  - 对 LLM 而言，这是**检索相关性断言被伪造**：模型会把无关内容当作\"官方提供的相关证据\"采信——比单纯稀释更糟，可能诱发对错误知识点的幻觉采信与评分偏差。这是\
  \ prompt-injection/grounding 层面的失真，非 token 成本可比。\n\n**2. 无界稀释（token/延迟/注意力）**\n\
  - 命中分支（`:58`）有上限 `if (matchCount >= 5) break;`，最多 5 条。\n- 回退分支（`:63-70`）**无任何上限**，topic\
  \ 下有多少子知识点就全部拼接。\n- 后果随 topic 知识库规模线性恶化：token 数↑、首 token 延迟↑、每次回答成本↑，且无关 token 挤占模型注意力窗口，显著增大\"\
  答非所问/泛化\"概率。\n\n**3. 层级过滤失真（数据完整性）**\n- `:66` `if (point.getParentId() != null)`\
  \ 只显示**子**知识点；`parentId == null` 的根节点被静默丢弃。\n- 结果：\n  - 层级信息丢失——模型看到的不是完整主题结构；\n\
  \  - 回退输出的是\"结构不对等的子集\"，连\"全量\"都名不副实；\n  - 若数据中大部分为根节点（少见但可能），回退甚至可能输出空列表，同时前缀仍宣称\"\
  相关\"。\n\n## 方案设计 (Options)\n\n**Option A — 无命中时返回空串（最保守）**\n- 优点: 消除全部三类缺陷；零额外 token；不污染\
  \ prompt。\n- 缺点: 丢失\"兜底提示\"能力；需要调用方容忍空 context。\n- 适用: 评估阶段 / 最小改动。\n\n**Option\
  \ B — 有界兜底（回退最多 N 条 + 修正前缀）**\n- 优点: 保留部分上下文；token 有上界；相关性标签诚实。\n- 缺点: 仍是\"非相关且未排序\"\
  的素材，凭 difficulty/sortOrder 选 N 也只是局部启发式；需为 `parentId==null` 定义包含策略。\n- 适用: 需要弱兜底的场景。\n\
  \n**Option C — 不修方法，直接删除死代码（对接入现状最诚实）**\n- 优点: 消除死代码与维护负担；“稀释 prompt”问题从根本上不存在。\n\
  - 缺点: 若未来确需关键词检索能力，需重写（本轮无需求证明其必要性）。\n- 适用: 该方法当前无调用者时。\n\n### 决策\n- **推荐:** **Option\
  \ C（现在）→ 接入时采用 Option B**\n- **理由:** 当前 0 调用点，最符合约束的工程决策是删死代码（避免误导性维护与误用）；若业务确需接入，则用\
  \ Option B 的\"有界 + 诚实前缀\"最小实现，杜绝无界稀释。\n- **风险与缓解:** \n  - 删除前需确认无测试/脚本引用（已有 `grep`\
  \ 全文检索佐证）；\n  - 若后续接入，须在方法顶部重新声明\"回退不保证相关性\"，并将前缀文案从\"相关\"改为\"候选/列举\"。\n\n## 实施方案\
  \ (Implementation)\n\n修改位置: `KeywordKnowledgeRetriever.java`。若走 **Option C**，直接删除该类，并从\
  \ `InterviewService.java:61` 移除注入与 import。\n\n核心逻辑（**Option B** 的最小实现，供需要接入时参考）——修正前缀、加界、诚实标注:\n\
  \n```java\npublic String retrieveContext(String query, String topic) {\n    if (query\
  \ == null || query.isBlank()) return \"\";\n\n    List<KnowledgePoint> points =\
  \ knowledgePointMapper.selectList(\n            new LambdaQueryWrapper<KnowledgePoint>().eq(KnowledgePoint::getTopic,\
  \ topic));\n    if (points.isEmpty()) return \"\";\n\n    StringBuilder sb = new\
  \ StringBuilder();\n    String q = query.toLowerCase();\n    int matched = 0;\n\n\
  \    for (KnowledgePoint p : points) {\n        boolean hit = p.getName().toLowerCase().contains(q)\n\
  \                || (p.getDescription() != null && p.getDescription().toLowerCase().contains(q));\n\
  \        if (hit && matched++ < 5) {\n            sb.append(\"- \").append(p.getName()).append(\"\
  ：\").append(p.getDescription()).append(\"\\n\");\n        }\n    }\n\n    if (matched\
  \ == 0) {\n        sb.append(\"以下为候选知识点名称（与查询无匹配，仅作枚举，不作为相关性证据）：\\n\");\n      \
  \  points.stream()\n                .filter(p -> p.getParentId() != null)\n    \
  \            .limit(10)                        // 有界\n                .forEach(p\
  \ -> sb.append(\"- \").append(p.getName()).append(\"\\n\"));\n    }\n    return\
  \ sb.toString();\n}\n```\n\n**风险点与处理:**\n- 前缀文案仍含“候选/枚举”语义，避免把无关内容标为“相关”；\n- `limit(10)`\
  \ 与命中 `limit(5)` 分设，明确可控边界；\n- 保留 `parentId != null` 过滤，但在 doc 注释中显式声明“仅枚举子节点”。\n\
  \n## 验证方式 (Validation)\n\n- **检查方式:** 静态证据——`grep -r \"retrieveContext\\|knowledgeRetriever\\\
  .\" backend/src` 确认调用面；确认 `InterviewService` 无调用。\n- **预期结果:** \n  - 现状: 0 咨询调用点\
  \ → 现存运行时影响为无；(已通过 grep 验证)\n  - Option B 改动后: 无命中时 token 上界 = 10 行、前缀不再伪造相关性。\n\
  - **单据/回归:** 因当前为死代码，无既有测试可挂回归；接入前应新增单测：命中(≤5)、无命中(有界、前缀正确、根节点排除)、空 topic 返回空。\n\
  \n## 复盘建议 (Retrospective)\n\n- **根因:** 该回退分支是“设计期兜底直觉”未加约束的产物——先写前缀再写回退逻辑，未校验前缀与回退语义一致性，也未考虑规模上界。\n\
  - **教训向量:** 凡“回退/兜底”逻辑，一律三问——① 输出是否仍匹配调用处的语义标签？② 是否无界？③ 是否在缺失维度上被安静丢弃数据？\n- **后续:**\
  \ 若本案例证实“仅 key term 匹配，无向量”的检索路径根本不参与积分链（已证实此状），应清理死代码并在架构文档标注废弃，避免后续开发者误接线。"
