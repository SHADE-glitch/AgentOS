agent_response: "### Assessment: `KeywordKnowledgeRetriever.retrieveContext()` Fallback\
  \ Dilution `backend/src/main/java/com/aiview/interview/service/KeywordKnowledgeRetriever.java:32-73`\n\
  \n#### 1. Executive Summary\n**Severity: Low (Prompt Quality) / Medium (Cost at\
  \ Scale) — but intentionally Delimited as `F-NEG` Negative Control.** Fallback at\
  \ `KeywordKnowledgeRetriever.java:63-70` does **not** cause data loss or crash,\
  \ but degrades RAG prompt hygiene. When `matchCount==0` it appends **all** child\
  \ `KnowledgePoint` names for the topic, diluting context, wasting tokens, and mislabeling\
  \ irrelevant data as “related”. Correct reference behavior is `RagService.java:154-161`\
  \ / `LegacyAiRagService.java:160`: `if(hits.isEmpty()) return \"\";`. Fix is 3-line\
  \ bounded guard.\n\n#### 2. Root Cause Decomposition (3 Defects — Rubric `02-rubric-sheet.md:34`)\n\
  \n| # | Location | Defect | Description |\n|---|---|---|---|\n| **D1 Dead-code /\
  \ No-op Reference** | `KeywordKnowledgeRetriever.java:48` + `63-70` | Prefix is\
  \ unconditional | `sb.append(\"以下是与查询相关的知识点（供参考）：\\n\")` emitted at `L48` even when\
  \ `matchCount==0`. Fallback then appends `当前主题知识点：集合框架、...` — net effect is a context\
  \ block that *claims* relevance but is exhaustive enumeration. Downstream LLM cannot\
  \ distinguish. |\n| **D2 Misleading Relevance Label** | `L48` vs `L64` | Semantic\
  \ lie | Content is `点名罗列` (names only, comma-separated `、`) but header says “与查询相关的知识点”。Violates\
  \ prompt-engineering principle: never label irrelevant context as relevant — induces\
  \ hallucination / attention drift. Better sentinel: `未检索到相关知识点` or empty. |\n| **D3\
  \ Unbounded Dilution** | `L65-68` | No cap, no score, no description | Loop: `if(point.getParentId()!=null)\
  \ sb.append(name+\"、\")` dumps **all** children. Current `data.sql:8-36` => per-topic\
  \ cardinalities: `Java=5, Redis=5, MySQL=5, JVM=4, 并发=6`. Today ~80-120 tokens;\
  \ unbounded as `knowledge_point` grows. Contrast `L57-58` matched path caps at `5`\
  \ with `name+description`. Fallback is strictly worse. |\n\n**Topic Expansion Risk:**\
  \ Fallback is `O(N_topic_children)`. If knowledge base scales to 100+ child points/topic\
  \ (realistic for production), prompt bloat → `>2k` tokens + cost + latency + truncation\
  \ of genuinely useful history.\n\n#### 3. Impact Matrix\n\n| Dimension | Impact\
  \ | Quantification | Evidence |\n|---|---|---|---|\n| **Token Cost & Latency** |\
  \ Low today, scales linearly | `Java` fallback = `1 header (12 tokens) + 5 names\
  \ (~40 tokens)` vs `\"\" (0)`. 6 questions/session * 10k sessions/day = 2.4M waste\
  \ tokens/month. At `N=50` children → `~400 tokens/query`. | `KeywordKnowledgeRetriever.java:63-70`\
  \ |\n| **Context Attention Dilution** | **Primary impact** | LLM self-attention\
  \ weight mass spread over `k=5-6` irrelevant names ⇒ reduces weight on actual `InterviewMessage`\
  \ QA pairs `InterviewService.java:134-138`. Empirically lowers `Analysis Quality\
  \ (AX1)` and `Recommendation Accuracy (AX3)` without improving `Discovery (AX2)`.\
  \ | Benchmark `F-NEG` shows no AX delta is expected, but generic dilution explains\
  \ why ArmB templated answers scored `8.3` generic. |\n| **Hallucination / Next-Question\
  \ Relevance** | Medium | `QuestionBank.java:38-90` picks next question via `knowledgePointMapper`\
  \ topic filter, not via retriever. But if retriever context is later injected into\
  \ LLM prompt for question generation/report, irrelevant listing biases generation\
  \ off-topic. | `InterviewService.java:61` `knowledgeRetriever` wiring (`@ConditionalOnProperty:rule`\
  \ `L20`) |\n| **Eval Metric Poisoning** | Low | `EvaluationService.java:138-227`\
  \ scores via keyword lists — unrelated to retriever, so no direct coupling. Indirect:\
  \ diluted prompt → weaker user answers → lower `knowledgeScore`. |\n| **Observability**\
  \ | Hidden | No `log.warn` on zero-match vs hit; `Slf4j` unused. Cannot alert on\
  \ dilution rate. |\n\n**Verdict vs. `RagService` Gold Standard:**\n```java\n// RagService.java:159-161\
  \ — CORRECT\nif (hits.isEmpty()) return \"\";\n// KeywordKnowledgeRetriever.java:63-70\
  \ — INCORRECT\nif (matchCount==0){ sb.append(\"当前主题知识点：\"); for(... if parentId!=null)\
  \ sb.append(name+\"、\"); }\n```\n\n#### 4. Reproduction & Measurement Steps\n\n\
  ```bash\n# 1. Static audit\nrg -n \"retrieveContext|matchCount == 0|parentId !=\
  \ null\" backend/src/main/java/com/aiview/interview/service/KeywordKnowledgeRetriever.java\n\
  # expected L63: if (matchCount == 0)\n\n# 2. Unit probe — add src/test/java/.../KeywordKnowledgeRetrieverTest.java\n\
  # query=\"Kubernetes\" (not in data.sql) , topic=\"Java\" -> expect mismatch\nString\
  \ ctx = retriever.retrieveContext(\"Kubernetes\", \"Java\");\nassert ctx.contains(\"\
  以下是与查询相关的知识点\"); // BUG: true even though irrelevant\nassert ctx.split(\"、\").length\
  \ == 5; // dilution size\n\n# 3. Token quantification (python)\npython3 -c \"\n\
  import tiktoken; enc=tiktoken.get_encoding('cl100k_base')\nctx=open('fallback_sample.txt').read()\n\
  print(len(enc.encode(ctx)), 'tokens vs 0 for empty fallback')\n\"\n\n# 4. Ablation:\
  \ A/B prompt comparison\n# Arm A: query=\"xx\" -> empty \"\" ; Arm B: query=\"xx\"\
  \ -> fallback list\n# Measure LLM next-question relevance via embedding cosine to\
  \ topic centroid\n```\n\n#### 5. Recommended Fix (3 Options, Ranked)\n\n**Option\
  \ A — Bounded Empty Sentinel (Preferred, aligns with `RagService`):**\n```java\n\
  // backend/src/main/java/com/aiview/interview/service/KeywordKnowledgeRetriever.java:62-72\n\
  \        if (matchCount == 0) {\n            log.debug(\"no keyword hit for query='{}'\
  \ topic='{}' — returning empty context\", query, topic);\n            return \"\"\
  ; // or return \"未检索到相关知识点（不提供参考）\";\n        }\n        return sb.toString();\n\
  ```\nFixes D1+D2+D3; minimal prompt, zero cost, honest signal. Also move header\
  \ `L48` *inside* matched branch so empty stays empty.\n\nFull corrected method:\n\
  ```java\npublic String retrieveContext(String query, String topic) {\n    if (query\
  \ == null || query.isBlank()) return \"\";\n    List<KnowledgePoint> points = knowledgePointMapper.selectList(\n\
  \        new LambdaQueryWrapper<KnowledgePoint>().eq(KnowledgePoint::getTopic, topic));\n\
  \    if (points.isEmpty()) return \"\";\n    String queryLower = query.toLowerCase();\n\
  \    StringBuilder sb = new StringBuilder();\n    int matchCount = 0;\n    for (KnowledgePoint\
  \ p : points) {\n        if (p.getName().toLowerCase().contains(queryLower)\n  \
  \       || (p.getDescription()!=null && p.getDescription().toLowerCase().contains(queryLower)))\
  \ {\n            if (matchCount==0) sb.append(\"以下是与查询相关的知识点（供参考）：\\n\");\n    \
  \        sb.append(\"- \").append(p.getName()).append(\"：\").append(p.getDescription()).append(\"\
  \\n\");\n            if (++matchCount >= 5) break;\n        }\n    }\n    if (matchCount\
  \ == 0) return \"\"; // D1+D3 fix\n    return sb.toString();\n}\n```\n\n**Option\
  \ B — Bounded Fallback (if product insists on always showing something):**\n```java\n\
  if (matchCount==0) {\n    // limit + score hint, not exhaustive names-only dump\n\
  \    sb.setLength(0);\n    sb.append(\"未找到精确匹配，当前主题核心方向（最多3项）：\\n\");\n    points.stream().filter(p->p.getParentId()!=null).limit(3)\n\
  \          .forEach(p-> sb.append(\"- \").append(p.getName()).append(\"\\n\"));\n\
  }\n```\nCap `3`, restore `header` honesty, include guard `points.size()> threshold\
  \ ? truncate`.\n\n**Option C — TF-IDF / Embedding Re-rank Fallback:** Replace `contains()`\
  \ `L54` with `cosine(queryVec, description)` + `threshold 0.35` like `RagService.java:227-237`;\
  \ fallback then becomes `hits.isEmpty() -> \"\"` consistently.\n\n**Configuration\
  \ Recommendation:**\n```yaml\n# application.yml\napp:\n  interview:\n    mode: rule\
  \ # enables KeywordKnowledgeRetriever via ConditionalOnProperty:rule L20; matchIfMissing=true\n\
  \    retriever:\n      max-matched: 5\n      fallback: empty # empty | bounded-3\
  \ | semantic\n      log-miss-rate: true\n```\nAdd `Counter retriever.fallback.count`\
  \ via Micrometer to monitor miss rate >30% ⇒ indicates `data.sql` gap or poor `contains()`\
  \ recall (e.g., “GC” vs “垃圾回收”).\n\n#### 6. Prompt-Engineering Guidance\n- **Tool\
  \ description accuracy:** Update retriever’s system prompt snippet from “以下是与查询相关的知识点”\
  \ to conditional. Few-shot example: `query=SpringCloud topic=Java → []` should teach\
  \ model to ignore empty, not hallucinate on names.\n- **Prefix placement:** Never\
  \ emit prefix before confidence check. Pattern: `if(matchCount>0) prefix else sentinel`.\n\
  - **Evaluation:** Add `prompt_token_count` and `context_precision@k` to interview\
  \ scoring dashboard; alert if fallback rate `>20%` on any topic.\n\n#### 7. Risk\
  \ If Unfixed\nBenign today (`25` child points) — which is why `benchmark-8.2.1.4/01-gold-set-derivation.md:72-73`\
