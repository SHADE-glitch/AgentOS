agent_response: "This working directory contains agent-simulation artifacts, not an\
  \ application codebase with a dashboard caching layer — so there's no concrete implementation\
  \ to inspect. I'll treat this as a design/audit question and give you a structured\
  \ assessment grounded in database engineering practice.\n\n---\n\n# Redis-Cached\
  \ Dashboard Aggregates: Staleness Assessment\n\n## 1. What \"stale\" actually means\
  \ for your cache\n\nA cached aggregate is **acceptable** (fresh enough) if it reflects\
  \ every mutation that is contractually required to be visible within the read path's\
  \ SLA window. It is **stale** when a user can observe a state that diverges from\
  \ the source of truth beyond the allowed freshness bound.\n\nDefine staleness as\
  \ three tiers, not one:\n\n| Tier | Window | Source of truth | Acceptable? |\n|------|--------|-----------------|-------------|\n\
  | **Eventual** | `>= TTL` | DB recompute | Yes — this is the design contract |\n\
  | **Windowed** | `< TTL` but post-mutation | DB recompute | Depends on product SLA\
  \ |\n| **Bounded/Immediate** | never out of sync | Cache must equal DB | Requires\
  \ invalidation, TTL alone is NOT sufficient |\n\n**Key point: TTL alone only guarantees\
  \ eventual consistency bounded by the TTL. It never guarantees that a recently-written\
  \ record shows up before the TTL elapses.** If your dashboard displays \"total revenue,\"\
  \ \"active users,\" or \"order counts\" and a business decision depends on current\
  \ numbers, a TTL-only model will systematically return stale data for up to `TTL`\
  \ seconds after every write.\n\n## 2. When the cached view is stale (root causes)\n\
  \n1. **Mutation → read skew.** A write committed at `t0` but the cache key only\
  \ refreshes at `t0 + TTL`. For the entire window the view is stale. Worst when writes\
  \ are bursty or TTL is long.\n2. **Not all keys are cached.** If dashboards compute\
  \ per-tenant keys (e.g. `dash:{tenantId}:summary`) a TTL-based refresh recomputes\
  \ anything the moment *its* TTL expires — unrelated to when *that tenant's* data\
  \ changed. High-traffic tenants get stale numbers while idle tenants churn recompute\
  \ cost.\n3. **Multiple aggregate granularity from one base table.** A single INSERT/UPDATE/DELETE\
  \ affects `daily`, `weekly`, `monthly`, and per-segment views. If you invalidate\
  \ one key but not its rollups, the dashboard shows inconsistent hierarchy (e.g.\
  \ sum of daily ≠ monthly).\n4. **Partial cron recompute.** If you refresh via background\
  \ job on a fixed cadence, a restore/backfill or late-arriving transaction (submitted\
  \ batch, refund, chargeback settled after TTL) makes the cache wrong and there's\
  \ no event to fix it until the next cron tick.\n5. **Time-window edges.** Aggregates\
  \ spanning rolling windows (`last 24h`, `MTD`) recomputed once can be wrong the\
  \ instant a boundary passes *without* any mutation — TTL date-boundary handling\
  \ is required.\n6. **Mutations that bypass the caching layer.** Direct SQL, admin\
  \ backfills, ETL loads, mass updates — no invalidation event is emitted → cache\
  \ diverges silently.\n\n## 3. Which mutation paths are safe / unsafe\n\nThink of\
  \ safety as: **does the mutation get a corresponding invalidation/recompute signal\
  \ before the read path serves from cache?**\n\n### Safe (self-invalidating)\n\n\
  - Single-record mutations funneled through a **service layer** that, after a successful\
  \ DB commit **and** within the same transaction/handler, deletes the affected aggregate\
  \ key(s). Safe because the read can no longer serve the old value (Redis `DEL`/`UNLINK`).\n\
  - **Idempotent upserts** with deterministic cache keys, handled via cache-aside\
  \ (read-through + invalidate-on-write). Consistent as long as delete happens post-commit.\n\
  - **Append-only tables** (e.g. event logs, clickstream) where the aggregate source\
  \ is monotonic and you use a separate **incremental/counted cache** (e.g. Redis\
  \ counter/HLL) — no delete needed, keys stay correct.\n- Low-mutation, high-read\
  \ aggregates where a few seconds' skew is contractually fine and the TTL is chosen\
  \ < acceptable-skew budget.\n\n### Unsafe (will serve stale)\n\n- **Any write path\
  \ that touches the source table but never emits an invalidation** (raw SQL, ORM\
  \ bypass, ETL, scripts, admin consoles). Unsafe by construction.\n- **Batch/implicit\
  \ writers** (jdbc batch, bulk copy, KStream sink) that commit large sets without\
  \ key-aware invalidation or a version bump.\n- **Multi-table joins that feed one\
  \ aggregate key** — a write to table A invalidates nothing if the key depends on\
  \ A+B+C and you only emit deletion on B.\n- **Mutations inside a transaction that\
  \ is later rolled back but whose cache was already invalidated-and-recomputed**\
  \ — you must invalidate *after* commit, never before, or you race the rollback.\n\
  \n**Golden rule:** *\"Invalidate after commit, order invariants ensure the key you\
  \ delete is the key the next read recomputes from committed data.\"*\n\n## 4. Recommended\
  \ patterns (in order of robustness)\n\n### A. Write-through invalidation (cache-aside)\n\
  ```python\nasync def create_order(session, order, agg_keys):\n    await session.execute(insert(order))\
  \          # 1. write DB\n    await session.commit()                        # 2.\
  \ commit\n    await redis.unlink(*agg_keys)                 # 3. INVALIDATE AFTER\
  \ COMMIT\n    return order                                  # next read recomputes\n\
  \nasync def get_dashboard_summary(tenant_id):\n    key = f\"dash:{tenant_id}:summary\"\
  \n    data = await redis.get(key)\n    if data is not None:\n        return json.loads(data)\
  \                   # cache hit\n    # miss → compute from DB, guard against stampede\n\
  \    data = await compute_summary(tenant_id)\n    await redis.setex(key, TTL, json.dumps(data))\n\
  \    return data\n```\n\n### B. Transactional outbox / event-driven invalidation\
  \ (correct across services)\nWrite the aggregate key onto a table header with the\
  \ mutation; a consumer deletes the key post-commit.\n\n### C. Stampede + staleness\
  \ guards combine with TTL\n\n```python\n# recompute-on-miss with per-key lock to\
  \ prevent thundering herd\nasync def get_summary(tenant_id):\n    key = f\"dash:{tenant_id}:summary\"\
  \n    v = await redis.get(key)\n    if v is not None:\n        return json.loads(v)\n\
  \n    lock = f\"lock:{key}\"\n    if await redis.set(lock, \"1\", nx=True, ex=5):\n\
  \        try:\n            data = await compute_summary(tenant_id)\n           \
  \ await redis.set(key, json.dumps(data), ex=TTL)\n            return data\n    \
  \    finally:\n            await redis.unlink(lock)\n    else:\n        await asyncio.sleep(0.05)\
  \      # another worker recomputing\n        return await get_summary(tenant_id)\
  \   # recursion-bound retry\n```\n\n### D. Dual-clock freshness (recommended configuration)\n\
  Store both a **value** and a **timestamp/source_version** in the key:\n```python\n\
  payload = {\"data\": summary, \"at\": now, \"source_version\": max_lsn}\nawait redis.setex(key,\
  \ TTL, json.dumps(payload))\n```\nThen the read layer decides: if `source_version`\
  \ still equals the source table's high-water mark (from a cheap query/cache), serve;\
  \ otherwise recompute. This converts a blind TTL into an *actual* freshness check\
  \ and kills most skew without dropping caching benefits.\n\n### E. Incremental aggregates\
  \ for high-write dashboards\nUse Redis `INCR/INCRBY` or HyperLogLog for counters\
  \ so each write updates the aggregate atomically instead of invalidating-and-recomputing\
  \ huge sums:\n- `INCR d:daily:{tenant}:revenue` — exact, O(1), never stale.\n- `PFADD\
  \ d:active:{tenant}:{date}` — cardinality, no recompute.\nThis is safe because the\
  \ aggregate is maintained incrementally at write time, the strongest freshness guarantee\
  \ available.\n\n## 5. Configuration recommendations\n\n- **Choose TTL by data volatility,\
  \ not uniformly.** Hot operational dashboards: `TTL` 5–30s **+ write-through invalidation**\
  \ so the TTL is only a backstop, not the primary guarantee. Cold reporting dashboards:\
  \ identical TTL with background nightly recompute is fine.\n- **Set a per-key TTL**\
  \ — never a global no-expiry, or a silent leak of dead tenants' keys (memory bloat).\n\
  - **Use `UNLINK` (lazy) not `DEL`** in hot invalidation paths to avoid blocking\
  \ the single-threaded Redis loop.\n- **Cache key design must encode granularity\
  \ + tenant + version**: `dash:{tenant}:{granularity}:{date}:v{maj}` so rollups invalidate\
  \ together and deployments can atomically swap versions.\n- **Key retirement:**\
  \ add keyspace pattern expiry / monitoring so abandoned tenants can't pin memory.\n\
  - **Rollups:** invalidate the full key fan-out (daily/weekly/monthly) in one `MULTI`/`pipeline`,\
  \ and drive rollups from base-level invalidation, not independent cron.\n- **Watch\
  \ out for date-boundary drift**: include the aggregation window in the key (`:mtd`,\
  \ `:last24h`) and rebuild keys on boundary transitions, not only on writes.\n\n\
  ## 6. Verdict / action plan\n\n1. **Today (TTL only):** Safe for append-only/read-heavy\
  \ dashboards where the freshness contract is `>= TTL`. **Unsafe** for operational\
  \ dashboards driven by arbitrary mutations (orders, revenue, inventory) unless you\
  \ add invalidation.\n2. **Immediately add:** write-through `DEL`/`UNLINK` after\
  \ commit on every mutation path that can affect a cached key; log an ops alert if\
  \ a mutation bypasses the invalidation helper (e.g. raw-SQL path is guarded).\n\
  3. **Add the strong safety net:** `source_version`/timestamp inside the cached value\
  \ so reads self-check freshness.\n4. **For hot counters,** move to incremental `INCR/PFADD`\
  \ to make those paths never stale.\n5. **Baseline the current behavior** — instrument\
  \ cache-hit age vs. actual source change latency, then set TTL and invalidation\
  \ strategy against the product's measured staleness budget rather than a guess.\n\
  \n---\n\nIf you point me at the actual repository (the app service that writes the\
  \ base tables and serves the dashboard) I'll produce a concrete audit: enumerate\
  \ each mutation path, classify it safe/unsafe against your existing cache key schema,\
  \ and give you the specific Redis invalidation calls to add."
