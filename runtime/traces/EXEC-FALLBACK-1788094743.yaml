agent_response: |
  分布式一致性指在分布式系统中，多个节点对同一份数据的副本最终保持相同状态的性质。
  核心关注多节点并发读写时，各副本数据能否保持一致。

  主要类型：
  - 强一致性：写完后任何读都立即看到最新值（如 Raft、Paxos 多数派）
  - 弱一致性：不保证立即一致，最终会一致（如异步复制）
  - 最终一致性：无并发写时可趋同（如 Dynamo、DNS）
  - 线性一致性：所有操作按全局实时次序，像单机执行一样

  CAP 定理是核心限制：网络分区（P）时只能在一致性（C）和可用性（A）间二选一。
  工程常用 CP（一致优先，如 ZooKeeper）或 AP（可用优先，如 Cassandra）。

