agent_response: "Now I have the complete picture. Here is my assessment.\n\n---\n\n\
  # Dashboard Cache Staleness & Mutation-Path Audit\n\n## 1. How the cache works today\
  \ (facts from code)\n\nMode is **cache-aside with TTL**, per user:\n\n- Key: `dashboard:user:{userId}`\
  \ (RBucket string, `DashboardService.java:48-49`)\n- Value: serialized `DashboardVO`;\
  \ TTL **10 minutes** (`CACHE_TTL_MINUTES`), set on cache write (`DashboardService.java:66`)\n\
  - Read path: `GET /api/dashboard` → `build()` → bucket hit returns cached JSON;\
  \ miss → `compute()` from DB → write-through (`DashboardService.java:52-71`)\n-\
  \ Invalidation: `evict()` deletes the whole key (`DashboardService.java:81-91`)\n\
  \n**The two DB inputs the aggregate depends on** (`compute()`, lines 93-177):\n\n\
  | Input | Filter | Feeds |\n|---|---|---|\n| `interview_result` rows of user | all\
  \ | radar dimension averages, weak point, suggestions |\n| `interview_session` rows\
  \ of user | `status=FINISHED` **and** `totalScore IS NOT NULL`, ordered by `finishedAt`\
  \ | stats (count/avg/max/totalQuestions), score trend |\n\nSo the cache becomes\
  \ stale whenever the DB rows matching these two filters change without eviction.\n\
  \n## 2. When the cached view is stale\n\nThe view is stale iff **any** of these\
  \ mutations happened after the last cache write and before eviction:\n\n1. **INSERT**\
  \ `interview_result` (new scoring row)\n2. **UPDATE/DELETE** `interview_result`\
  \ — *no such code path exists today*, but the entity supports it; a future delete/edit\
  \ feature would silently go stale\n3. **Session transitions to FINISHED** (writes\
  \ `finishedAt`) → changes trend + `totalInterviews`\n4. **`totalScore` set/persisted**\
  \ on a finished session (async scoring) → changes avg/max/score trend\n5. **Session\
  \ deleted** or had `status`/`totalScore` changed off the filter set — *no such path\
  \ today*\n\nKey guarantee: eviction uses `delete()` (whole-key), and `compute()`\
  \ does not mutate the cache on partial reads, so a miss always reflects DB truth.\
  \ The residual staleness window when eviction *does* fire is ~0.\n\n## 3. Which\
  \ mutation paths are safe\n\n\"Safe\" = a path that **persists** one of the above\
  \ mutations **and** calls `dashboardService.evict(userId)` afterwards. Verified\
  \ call sites:\n\n| Path | Mutation | Evict after commit? |\n|---|---|---|\n| `InterviewService.create()`\
  \ (empty-bank → `finishSession`) | status→FINISHED | ✅ via `finishSession` |\n|\
  \ `InterviewService.answer()` / `answerStream()` | insert result; FINISHED | ✅ `:152,:169,:227,:244`,\
  \ plus `finishSession` `:349` |\n| `finishSession()` (shared) | status→FINISHED,\
  \ `finishedAt` | ✅ `:349` |\n| `RuleBasedScoringService.score()` (MQ) | insert result;\
  \ set totalScore | ✅ `:57`,`:66` |\n| `InterviewScoringService.score()` (MQ) | insert\
  \ result; set totalScore | ✅ `:106`,`:111` |\n| `LegacyAiScoringService` | insert\
  \ result; set totalScore | ✅ `:113`,`:118` |\n\n**Ordering is also correct**: every\
  \ site evicts *after* the DB write, and the async MQ consumer evicts a second time\
  \ *after* writing `totalScore`. So the transient window where a dashboard read happens\
  \ between the synchronous FINISHED-evict and the async totalScore-write returns\
  \ **partial-but-fresh, not stale** data, and the consumer's second evict forces\
  \ a fresh recompute on the next read. No path evicts before data is visible.\n\n\
  `GET /dashboard` itself is read-only on DB (only `selectList`), so it is never a\
  \ mutation path. The SSE `answerStream` only mutates session/message state on the\
  \ FINISHED path, which is covered above.\n\n## 4. Gaps, unsafe windows, and risks\n\
  \n**A. Uncovered mutation types (today \"safe only by absence\")**\nThere is no\
  \ delete/re-edit feature, so nothing is missing at runtime — but if you add one,\
  \ there is no enforcement. The safest mitigation is to centralize invalidation rather\
  \ than sprinkle `evict()` calls:\n\n- Resort bad mutation sites directly; better,\
  \ expose one seam. Example of a defensive guard in `DashboardService`:\n\n```java\n\
  public void evictIfAffects(Long userId, Class<?> mutatedEntity) {\n    if (userId\
  \ == null) return;\n    if (InterviewResult.class.equals(mutatedEntity)\n      \
  \      || InterviewSession.class.equals(mutatedEntity)) {\n        redissonClient.getBucket(key(userId)).delete();\n\
  \    }\n}\n```\n\n**B. No transaction boundary around \"DB write + evict\"**\nThere\
  \ is **no `@Transactional`** on the scoring/scoring-consumer methods — MyBatis–Plus\
  \ auto-commits per statement, and `evict()` runs right after. Today this is safe.\
  \ But the *first* future refactor that wraps mutations in a DB transaction and forgets\
  \ to move the evict *inside/after* the commit will reintroduce up-to-TTL staleness.\
  \ Rule: **evoke eviction only after the DB commit is durable**, or use a transactional-outbox/cleanup-on-expiry\
  \ fallback.\n\n**C. Thundering herd on miss**\nOn a cache miss, every concurrent\
  \ `/dashboard` request re-runs the aggregate queries. For large result sets that's\
  \ N redundant DB work. Mitigate with single-flight per user:\n\n```java\nprivate\
  \ DashboardVO resolve(Long userId) {\n    String k = key(userId);\n    String cached\
  \ = redissonClient.getBucket(k).get();\n    if (cached != null) return parse(cached);\n\
  \    RLock l = redissonClient.getLock(\"dashboard:lock:\" + userId);\n    if (l.tryLock())\
  \ {\n        try {\n            String again = redissonClient.getBucket(k).get();\
  \   // double-check\n            if (again != null) return parse(again);\n     \
  \       DashboardVO vo = compute(userId);\n            redissonClient.getBucket(k).set(write(vo),\
  \ CACHE_TTL_MINUTES, TimeUnit.MINUTES);\n            return vo;\n        } finally\
  \ { l.unlock(); }\n    }\n    return compute(userId);  // also consistent, just\
  \ uncached\n}\n```\n\n**D. Duplicate-result writes per finished session (affects\
  \ aggregate correctness — the biggest latent issue)**\nIn `InterviewService.answer()`\
  \ the `shouldFinish` branch does `evaluationService.score()` → `resultMapper.insert(result)`\
  \ **and then** `finishSession` publishes a Rabbit message; the MQ consumer (`RuleBasedScoringService`\
  \ / `InterviewScoringService`) then `score()`s the *same* session and **inserts\
  \ a second `interview_result` row**. Two rows per finished session. Consequences:\n\
  \n- `compute()` counts both rows → `acc[1]` (denominator) doubles. With identical\
  \ rule-scored rows the average is coincidentally stable, but:\n- In **AI mode**,\
  \ the sync row is a *rule* result while the async row is an *AI* result → differing\
  \ dimensions → averages/suggestions are polluted/mixed.\n- Fix: persist the result\
  \ in only **one** place — e.g. keep the sync insert in `answer()`, and make the\
  \ MQ consumer only update `totalScore` + `report` (no second result insert).\n\n\
  **E. Both scoring consumers listen on the same queue**\n`RuleBasedScoringService`\
  \ (`@ConditionalOnProperty(matchIfMissing=true)` → always on in default mode) and\
  \ `InterviewScoringService` (no condition → always on) both `@RabbitListener` on\
  \ `aiview.interview.scoring`. Rabbit round-robins each message to *one* of them,\
  \ so a given session is scored by whichever consumer picks it up — **nondeterministic\
  \ rule-vs-AI scoring per session**. The dashboard faithfully caches whatever that\
  \ inconsistent DB truth is. Confirm only the intended engine's listener is active\
  \ (filter by `app.interview.mode`).\n\n**F. TTL/eviction asymmetry on cache-write\
  \ failure**\nIf `set(...)` fails, `build()` logs and returns the freshly computed\
  \ VO (correct), but the 10-min TTL offers no protection if some unchecked future\
  \ path skips evict. Nothing to change now; just don't rely on TTL as the primary\
  \ consistency mechanism — treat it as a safety net, eviction as the contract.\n\n\
  ## 5. Recommendation summary\n\n1. **Keep current behavior** — all live mutation\
  \ paths already evict after commit; ordering is correct.\n2. **Centralize** invalidation\
  \ on the entity type so future insert/update/delete paths can't forget it (item\
  \ A).\n3. **Fix the duplicate result insert** (item D) and **the dual-consumer nondeterminism**\
  \ (item E) — these don't cause staleness, but they make \"the DB truth that the\
  \ cache mirrors\" wrong, which is worse than being stale.\n4. **Add single-flight**\
  \ on cache miss only if dashboard QPS warrants it (item C).\n5. **Document the contract**:\
  \ *any mutation to `interview_result` (any) or to `interview_session` that affects\
  \ `status`/`totalScore`/`finishedAt`/deletion must trigger `evict(userId)` after\
  \ commit — TTL is only a safety net.*\n\nNet assessment: for the currently reachable\
  \ mutation paths, the cache is safe (fresh-on-next-read after every write). The\
  \ remaining staleness risks are *future-code* and *DB-truth-correctness* risks,\
  \ both flagged above."
