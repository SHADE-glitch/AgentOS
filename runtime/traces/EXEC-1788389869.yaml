  - **当前约束**: `rule` 模式下的轻量知识检索（无向量 RAG），仅靠姓名/描述子串匹配。\n- **成功标准**: 给出证据化的影响判定（是否真的等价于“稀释”）、严重级别、以及可落地的修复选项。\n\
  \n## 问题判断（先说结论）\n\n**运行时影响 = 零；潜在影响 = 中高。**\n\n关键证据：`retrieveContext()` 在整仓只被定义（`KeywordKnowledgeRetriever.java:32`），**从未被任何调用方调用**。`InterviewService.java:61`\
  \ 注入了 `knowledgeRetriever` 字段，但全仓 `grep` 只有字段声明这一处，没有一次 `.retrieveContext(` 调用。因此：\n\
  \n1. 回退分支 `KeywordKnowledgeRetriever.java:62-70` 今天**不执行**，所谓的“稀释 prompt”并不发生。\n\
  2. 但它是一颗潜伏地雷——一旦把检索器接进评审/评分 prompt 构造流程，稀释立即生效。\n3. 同时该 bean 尚给 `InterviewService`\
  \ 造成了“注入但未使用”的死耦合。\n\n所以这是一次**只影响未来、不影响当前**的负向控制项。下面拆解“稀释”本身的严重性，因为风险评审的是这个设计，而非它今天是否跑。\n\
  \n### 现有 fallback 的三重问题（对照 rubric，02-rubric-sheet.md:34 已列为 delimit = dead-code\
  \ + misleading prefix + unbounded dilution）\n\n**A. 无界稀释（unbounded dilution）**\n\
  `knowledge_point` 表无行数上限，主题下子知识点可无限多。`for` 循环 `sb.append(point.getName()).append(\"\
  、\")` 会把**全部**子知识点拼进一句话，且不带 `limit`、不带 `break`——token 随库增长线性放大。\n\n**B. 误导性前缀（misleading\
  \ prefix）**\n`retrieveContext` 开头固定追加 `\"以下是与查询相关的知识点（供参考）：\\n\"`（:48）。匹配分支这种表达合理；但\
  \ fallback 分支错误地复用了这句话，而实际上这些知识点**与查询无关**。prompt 因此诱导模型把这些不相关内容当作“相关依据”采信——这是比 token\
  \ 浪费更隐蔽的信号污染。\n\n**C. 死代码 + 一次性往返即丢弃**\n若被接线，该调用发生在系统 prompt 拼接处，检索本身廉价，但为一条默认话题查询拉取整表、过滤、再弃用\
  \ 95%，属于写入时未尝试时的最高成本方案。\n\n## 方案设计\n\n### 方案 A：fallback 变空（保守，推荐起点）\n无匹配时不返回任何知识点，直接返回\
  \ `\"\"`，让 `matchCount == 0` 与上面 `points.isEmpty()` 行为统一。\n\n- 优点：最小改动，`\"\"` 在调用方通常是安全边界（参考现有空串处理），断绝稀释与误导。\n\
  - 缺点：放弃“为无字面匹配的话题仍提供上下文”的最后一根稻草，上下文完全依赖 query 质量。\n\n### 方案 B：结构化回退（保留意图，控制规模）\n\
  无匹配时：仅返回**顶级知识点名称列表**（固定在 `parentId == null`），并可加 `limit`（如 ≤10）与逐条 `truncate(description,\
