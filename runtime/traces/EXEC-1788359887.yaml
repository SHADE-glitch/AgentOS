  \n### 过期窗口 1：evict 与 build 的“删除-写入”竞态（真实风险，可脏至 TTL）\n\n`build()` 是 get→miss→`compute`→`set`（DashboardService.java:55-66），`evict()`\
  \ 是 delete。经典 lost-update：\n\n```\nt0 build  miss，开始 compute（查询 DB，结果尚未落库）\nt1 评分\
  \  insert(result)            # DB 已有新数据\nt2 评分  evict()                   # 缓存本来就没有，删除无物\n\
  t3 build  compute 结束（读到的是旧快照）\nt4 build  set(旧数据, {1min})       # ← 用旧值回填了缓存\n结果：脏数据驻留长达\
  \ TTL(10min)，因为 evict 发生在 set 之前\n```\n\n即使 evict 顺序正确（insert 后 evict），并发 build\
  \ 的 `set` 仍可能落在 evict 之后，导致“白 evict”。\n\n### 过期窗口 2：TTL 本身（兜底，尽力而为）\n任何被吞掉的 evict（`cache`\
  \ 删除失败只 `log.warn`，DashboardService.java:88-90/68）、或未来新增的写路径漏调 evict，都会脏至 10 分钟\
  \ TTL。这是该缓存唯一的时间兜底。\n\n### 过期窗口 3：异步评分导致的“暂时确实”（非脏，可接受）\n`finishSession` 先 evict，随后投递\
  \ RabbitMQ（InterviewService.java:349-357）。窗口内 build 会重算：`totalScore` 尚为 null，会话被\
  \ `.isNotNull` 过滤（DashboardService.java:100）——刚结束的面试**暂时缺失**而非显示旧值。评分完成时插入 result\
  \ + 更新 totalScore + 二次 evict，随后收敛。这是可接受的最终一致（相较快照），但要意识到这不是缺失 0 风险而是有临时“少一条”。\n\n\
  > 若评分失败（`throw new RuntimeException`，重试/DLQ）：该会话保持 FINISHED+totalScore=null，不进入聚合，不会导致脏，只是缺数据。\n\
