  \ + userId + \":ver\"; }\n\npublic void evict(Long userId) {\n    if (userId ==\
  \ null) return;\n    try {\n        // 1) 原子递增失效边界；2) 删除缓存本体（可选，加速命中）\n        redissonClient.getAtomicLongAsync(verKey(userId)).incrementAndGet()\n\
  \            .whenComplete((v, t) -> redissonClient.getBucket(key(userId)).deleteAsync());\n\
  \    } catch (Exception e) { /* 仍有 TTL 兜底 */ }\n}\n```\n\n```java\n// build() 改为先读版本、校验缓存版本\n\
  public DashboardVO build(Long userId) {\n    String k = key(userId);\n    long ver\
  \ = redissonClient.getAtomicLong(verKey(userId)).get();   // build 开始时读取\n    RBucket<String>\
  \ bucket = redissonClient.getBucket(k);\n    CachedPayload cached = readPayload(bucket);\
  \                      // {ver, json}\n    if (cached != null && cached.ver == ver)\
  \ return cached.vo();\n\n    DashboardVO vo = compute(userId);\n    // 存储的是 compute\
  \ 开始时读到的 ver；期间任何 evict 都会使 ver 增大，\n    // 下一次 build 读到 increment 后的 ver -> 版本不匹配\
  \ -> 强制重算，使“旧 set”失效\n    bucket.set(writePayload(ver, vo), CACHE_TTL_MINUTES, TimeUnit.MINUTES);\n\
  \    return vo;\n}\n```\n\n为什么能消除竞态：即使某个 `set` 落在一个 `evict` 之后，该 `set` 携带的仍是**旧\
  \ `ver`**，而 `evict` 已把 `ver` 递增。任何后续读取都发现 `payload.ver != 当前ver`，于是忽略该脏缓存并重算。这比\
  \ `delete` 原子性更强，因为失效信息放在“只增不减”的计数里。\n\n---\n\n## 备选方案对比\n\n```text\nOption A —\
  \ 代际令牌（推荐）\n  Strengths: 关闭删除-写入竞态；正常读仍 0 DB 查询；语义清晰\n  Weaknesses: 多一个 ver key；需要轻量\
  \ Lua/异步保证 ver 与 delete 顺序\n  Best for: 你当前“手册竖排 + evict 点全部在手”的情况，改动最小\n  Risks:\
  \ ver key 若被 Redis 淘汰会退化为每查必重算（可控）。可对其设较长 TTL 或与主 key 同生命周期管理\n\nOption B — 直接缩短/砍掉\
  \ TTL，每次读重算\n  Strengths: 无脏数据、代码最少\n  Weaknesses: 每次 dashboard 击穿全部聚合查询，失去缓存意义\n\
  \  Best for: 只有 TTL=0 才能满足严格一致性时\n\nOption C — 交给 DB 触发器/CDC 自动失效\n  Strengths:\
  \ 不易遗漏新写路径\n  Weaknesses: 组件复杂度高，与你现有“写端显式 evict”风格不符\n  Best for: 写路径很多、易漏、多服务共享数据的场景\n\
  ```\n\n**Decision：Option A**——符合你当前“写端全部可控、evict 覆盖完整”的现状，用最小改动把唯一的真实竞态（窗口 1）关掉；保留现有\
  \ 10min TTL 作为窗口 2 的兜底，并接受窗口 3 的暂时缺失（若要求去看刚结束的面试，可在 finishSession 里同步落 `totalScore`\
  \ 占位）。\n\n---\n\n## 验证方式\n- 并发测试：N 个 `build` 与 M 次 `evict`（含评分 insert）交错执行，断言最终缓存始终与\
