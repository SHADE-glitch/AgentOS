agent_response: "## Prompt-Engineering Impact Assessment — `KeywordKnowledgeRetriever`\
  \ fallback\n\n### 1. Executive summary\n\nThe fallback in `KeywordKnowledgeRetriever.retrieveContext()`\
  \ (`KeywordKnowledgeRetriever.java:63-70`) has **no current runtime impact** — the\
  \ method is **dead code** in the working tree (injected at `InterviewService.java:61`\
  \ but never invoked). Its latent impact, if wired into the prompt pipeline, is **three\
  \ defects**: a **misleading relevance header**, **unbounded context dilution**,\
  \ and a **malformed trailing delimiter**. Because nothing about this behavior is\
  \ freshness/cache-related, no retrieved memory can improve it (matches the F-NEG\
  \ control expectation).\n\n---\n\n### 2. Code walkthrough (`KeywordKnowledgeRetriever.java:32-73`)\n\
  \n| Line | Behavior | Defect |\n|------|----------|--------|\n| 38-40 | Loads **all**\
  \ points for `topic` (no limit) | Unbounded read |\n| 50-60 | Keyword `contains`\
  \ match loop, caps matches at `5` | Only matched branch bounded |\n| 63-70 | **Fallback:**\
  \ if `matchCount == 0`, appends **every child** name | Unbounded, irrelevant list\
  \ |\n| 48 / 64 | Header `「以下是与查询相关的知识点（供参考）」` printed **before** branching | Misleading\
  \ label in fallback |\n| 66-67 | Only `parentId != null` (drops topic-level description)\
  \ | Low-signal content |\n| 67 | `sb.append(name).append(\"、\")` | Trailing `、`,\
  \ no cap, no newline |\n\n---\n\n### 3. Impact assessment\n\n**Current (runtime):**\
  \ **None** — grave-to-nil, because `knowledgeRetriever` is declared at `InterviewService.java:61`\
  \ and `grep` across the backend confirms `retrieveContext(String,String)` has **zero\
  \ callers**. This is the primary finding: *dead code*.\n\n**Latent (if wired into\
  \ `InterviewService` prompt assembly):**\n\n| Severity | Effect | Why |\n|----------|--------|-----|\n\
  | **High — misleading prefix** | `「以下是与查询相关的知识点」` is emitted in the `matchCount\
  \ == 0` branch, labeling content the retriever itself proved is **not** query-relevant\
  \ as *relevant* | LLM trusts instruction metadata → weights irrelevant tokens; if\
  \ any child *name* resembles an instruction, it is echoed as \"relevant ground truth\"\
  \ (mild injection surface). |\n| **High — unbounded dilution** | Fallback appends\
  \ **all** child names every miss, no `break`, token count grows linearly with topic\
  \ cardinality | Seed data ≈5 children/topic is benign, but the path is uncapped\
  \ for real topics; surplus tokens squeeze the actual question/instructions and spread\
  \ attention. |\n| **Medium — malformed output** | Trailing `、` + comma-join, no\
  \ line breaks, names only (descriptions dropped) | Ugly, fragile for any downstream\
  \ parser; low signal-to-noise (no description context to ground the LLM). |\n| **Low\
  \ — duplicated read cost** | DB returns all rows before the need is known | Negligible\
  \ at seed scale, latent at scale. |\n\n**Bottom line:** latent severity **High**;\
  \ runtime severity **None**. The fix is cheap either way.\n\n---\n\n### 4. Remediation\
  \ (target `retrieveContext`)\n\nA **bounded, relevance-honest** fallback — never\
  \ label unmatched content as *matched*, cap output, trim separators:\n\n```java\n\
  public String retrieveContext(String query, String topic) {\n    if (query == null\
  \ || query.isBlank()) return \"\";\n\n    List<KnowledgePoint> points = knowledgePointMapper.selectList(\n\
  \        new LambdaQueryWrapper<KnowledgePoint>()\n            .eq(KnowledgePoint::getTopic,\
  \ topic));\n\n    if (points.isEmpty()) return \"\";\n\n    String queryLower =\
  \ query.toLowerCase();\n    StringBuilder sb = new StringBuilder();\n    List<KnowledgePoint>\
  \ hits = new ArrayList<>();\n\n    for (KnowledgePoint p : points) {\n        boolean\
  \ matched = p.getName().toLowerCase().contains(queryLower)\n            || (p.getDescription()\
  \ != null\n                && p.getDescription().toLowerCase().contains(queryLower));\n\
  \        if (matched) hits.add(p);\n    }\n\n    if (!hits.isEmpty()) {\n      \
  \  sb.append(\"以下是与查询\" #\"关键词\" #\"匹配的知识点（最多\" #MAX_CTX #\"条）：\\n\");\n       \
  \ hits.stream().limit(MAX_CTX).forEach(p ->\n            sb.append(\"- \").append(p.getName()).append(\"\
  ：\")\n              .append(p.getDescription() == null ? \"\" : p.getDescription()).append(\"\
  \\n\"));\n        return sb.toString();\n    }\n\n    // Honest fallback: low-signal\
  \ labels, bounded, no \"query-related\" claim.\n    sb.append(\"当前主题全部知识点（与查询无直接关键词匹配）：\\\
  n\");\n    points.stream()\n        .filter(p -> p.getParentId() == null || hits.isEmpty())\n\
  \        .forEach(p -> sb.append(\"- \").append(p.getName())\n                 \
  \       .append(p.getDescription() == null ? \"\" : \"：\" + p.getDescription())\n\
  \                        .append(\"\\n\"));\n    return sb.toString();\n}\n```\n\
  \nConstants/config (`application.yml` under `app.interview`):\n```yaml\napp:\n \
  \ interview:\n    knowledge-retrieval:\n      max-matched: 5          # cap on keyword-verified\
  \ context entries\n      max-fallback: 10        # hard cap on the no-match fallback\
  \ list\n      enabled: false          # feature flag; keep off until wired to a\
  \ caller\n```\n\nKey properties enforced by the fix:\n- **No `relevant` claim in\
  \ the fallback branch** → eliminates the misleading label.\n- **Hard `limit`/`max-fallback`**\
  \ → eliminates unbounded dilution.\n- **No trailing delimiter** → well-formed, newline-delimited\
  \ output.\n- **`enabled=false` default** → reflects that there is currently no caller,\
  \ preventing accidental wiring without review.\n\n---\n\n### 5. Verification\n\n\
  ```\n# Manual: call with a query that matches nothing\nretrieveContext(\"quantum\
  \ computing\", \"Java\")\n# old: 「以下是与查询相关的知识点」+ 5 child names + trailing 、   <-\
  \ WRONG label + unbounded\n# new: 「与查询无直接关键词匹配」+ <= max-fallback names/descriptions\
  \   <- honest + bounded\n\n# Regression: exact keyword hit still bounded at 5 and\
  \ labeled matched\nretrieveContext(\"HashMap\", \"Java\")  -> max 5 matched entries,\
  \ no fallback\n```\n\nUnit test suggestion: assert (a) fallback count ≤ `max-fallback`,\
  \ (b) fallback string does **not** contain `查询相关`, (c) matched branch has no trailing\
  \ `、`.\n\n---\n\n### 6. Bottom line\n\n- **Now:** dead code — impact nil, no behavioral\
  \ change today.\n- **Next step:** do **not** merely patch the fallback silently;\
  \ either (1) wire it to a real caller and ship the bounded+honest fix, or (2) remove/flag\
  \ it to avoid a latent relevance-mislabeling + dilution bug resurfacing later.\n\
  - The failure mode is **relevant to prompt quality**, not freshness/caches, so cache-family\
  \ memory retrieval is correctly irrelevant to this assessment (consistent with the\
  \ F-NEG designation)."
