  \ header asserts these nodes are *\"与查询相关\"* (query-related), the model is told\
  \ noisy-irrelevant points are authoritative context. This is worse than empty context:\n\
  - Empty context → model falls back to prior knowledge (benign).\n- **Mislabeled\
  \ irrelevant context → model manufactures false relevance**, hallucinating connections\
  \ between the asked question and unrelated subtopics. This actively degrades answer/scoring\
  \ quality rather than simply failing to improve it.\n\n**2.3 Decision inconsistency\
  \ (AX4 lens)**\nRanked-order stability and prompt determinism collapse: two near-identical\
