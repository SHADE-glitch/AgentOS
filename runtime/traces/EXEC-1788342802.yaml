  \ exactly the failure the benchmark names, with four distinct mechanisms:\n\n**2.1\
  \ Attention/salience dilution (token budget)**\nUnmatched queries dump the *entire*\
  \ knowledge graph subtree for the topic. Cost rows grow with graph size, not with\
  \ query intent:\n- Number of tokens injected = `O(|child points of topic|)`, unbounded.\n\
  - At ~250k input-token windows this can crowd out the system prompt, the actual\
  \ question, the candidate's answer, and the instruction to score. A short query\
