  \        }\n    }\n    if (!matched.isEmpty()) {\n        sb.append(\"以下是与查询相关、可能匹配的知识点（供参考）：\\\
  n\");\n        for (KnowledgePoint point : matched)\n            sb.append(\"- \"\
  ).append(point.getName()).append(\": \").append(point.getDescription()).append(\"\
  \\n\");\n    } else {\n        // 兜底：明确标注为“主题概览”，不再误导为“与查询相关”\n        sb.append(\"\
