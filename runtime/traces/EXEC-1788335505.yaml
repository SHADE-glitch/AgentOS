  \n**根因:** `matchCount == 0` 分支把该主题下的**全部子知识点**无上限地拼接进上下文，同时保留了误导性的前缀标语。\n\n**影响拆解（4\
  \ 个独立缺陷）：**\n\n1. **语义误导（最严重）** —— `KeywordKnowledgeRetriever.java:48` 的前缀 `\"以下是与查询相关的知识点（供参考）：\\\
  n\"` 在匹配流程和 fallback 流程中**共用**。fallback 命中的是 `\"当前主题知识点：\"` 也就是在 loop 结束后（`retrieveContext`\
  \ 已返回 `String`）你无法改前缀——因为前缀是**方法顶部就 append** 的，fallback 只是接着追加。最终 prompt 会出现：\n\
  \   ```\n   以下是与查询相关的知识点（供参考）：\n   当前主题知识点：A、B、C、D、E、F、…（几百个）\n   ```\n   模型被**明确告知**“这些都相关”，于是会把无关知识点当作证据去评分/追问\
  \ → 检索不但没用，反而主动投毒。\n\n2. **上下文无界膨胀** —— 匹配分支有 `if (matchCount >= 5) break;` 上限（`:58`），fallback\
  \ 分支**没有**任何上限（`:65-69`）。一个主题若有数百个子知识点，单次 `retrieveContext` 就能把上下文淹没，挤压问题/历史消息的\
  \ token 预算。\n\n3. **可能返回“有头无内容”** —— 若主题只含根节点（`parentId == null`）、没有子节点，fallback\
  \ 会返回 `\"以下是与查询相关的知识点（供参考）：\\n当前主题知识点：\"` 的空串尾巴，白白浪费 token 且无信息量。\n\n4. **格式瑕疵**\
  \ —— 列表以 `、` 结尾（`:67`），无 `trim`/`String.join`；耦合度高，后续难以维护。\n\n**关键假设/已知限制:**\n-\
  \ `KeywordKnowledgeRetriever` 目前**未接入任何 prompt 调用链**——字段已注入但从未调用。因此当前运行时**无实际影响**，但这是“潜伏的定时炸弹”：一旦接入即整体中毒。\n\
  - 这是 F-NEG 负向控制任务本身，其技术结论与记忆基准口径一致：检索退化（miss 全量兜底）是**检索质量**问题，不是记忆影响力证据。\n\n## 方案设计\n\
