  \ injects `knowledgeRetriever` (line 61) but **never calls `retrieveContext`** anywhere.\
  \ So today the fallback is dormant — the dilution is a *latent* risk that activates\
  \ the moment it gets wired into the `answerStream` prompt. That wiring intent is\
  \ clear (parallel `RagService.retrieveContext` at RagService.java:154 lives in the\
  \ AI-mode path as a direct, already-used counterpart).\n\n---\n\n# Impact Assessment:\
  \ KeywordKnowledgeRetriever Fallback\n\n## 1. What the fallback actually does\n\n\
  When no keyword match occurs (KeywordKnowledgeRetriever.java:62-70):\n\n```java\n\
  if (matchCount == 0) {\n    sb.append(\"当前主题知识点：\");\n    for (KnowledgePoint point\
  \ : points) {\n        if (point.getParentId() != null) { // 只显示子知识点\n         \
  \   sb.append(point.getName()).append(\"、\");\n        }\n    }\n}\n```\n\nOutput\
  \ injected into the prompt (if wired):\n\n```\n以下是与查询相关的知识点（供参考）：\n当前主题知识点：JVM内存模型、垃圾回收、类加载机制、GC调优、...\n\
  ```\n\nDumped into the prompt **with the header claiming relevance (\"供参考\")** even\
  \ though it is a full, unreleated dump.\n\n## 2. Severity — this is the *common\
  \ path*, not a rare edge case\n\nThe match branch (lines 53-60) tests whether the\
  \ **entire user answer string** appears as a substring of a knowledge‑point name/description:\n\
  \n```java\npoint.getName().toLowerCase().contains(queryLower)\n```\n\n`query` here\
  \ is the candidate's multi-sentence answer. A point name like `\"JVM内存模型\"` will\
  \ almost never be a substring of a long free-form prose answer. Result: `matchCount\
  \ == 0` is the **default outcome for the majority of real answers**, so the \"fallback\"\
  \ is effectively the normal behavior. The dilution is systemic, not exceptional.\n\
  \n## 3. Concrete impact on prompt quality\n\n| Dimension | Effect |\n|---|---|\n\
  | **Signal-to-noise collapse** | A list of *names only* (no descriptions, no ranking)\
  \ presented as \"retrieved context\" — the model cannot distinguish *empty retrieval*\
  \ from *comprehensive coverage*. |\n| **Unbounded token growth** | The match branch\
  \ caps at 5; the fallback is **uncapped**. A broad topic with 50-200 child knowledge\
  \ points yields a massive, mostly-irrelevant prefix that crowds the instruction/few-shot\
  \ budget in every turn. |\n| **Answer-chasing behavior** | The questioner LLM anchors\
  \ on the whole topic space instead of the user's actual last answer, producing off-topic\
  \ follow-up questions. |\n| **Evaluation drift** | In rule-mode, this context feeds\
  \ the same session used by `RuleBasedScoringService`; polluted context can change\
  \ what gets asked/compared, making scoring less stable. |\n| **False-confidence\
  \ framing** | The prefix \"以下是与查询相关的知识点\" asserts relevance that doesn't exist —\
  \ misleading the model about what is grounded vs. speculative. |\n\n## 4. Options\n\
  \n**Option A — Return `\"\"` on no-match (mirror RagService contract)**\n- Strengths:\
  \ honest \"no retrieval\", zero token cost, no dilution, consistent with RagService.java:159-160.\n\
  - Weaknesses: loses all topic scaffolding — the interviewer can't fall back to a\
  \ broad-topic steer.\n\n**Option B — Improve matching first, keep a *capped, labeled*\
