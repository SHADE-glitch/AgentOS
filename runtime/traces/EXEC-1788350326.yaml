  \ model is told how to weight it.\n- Weaknesses: still consumes tokens on every\
  \ miss.\n\n**Recommendation: B.** Fix the matching logic (root cause), then constrain\
  \ the fallback (mitigation). A is the safe fallback if you prefer minimal risk.\n\
  \n## 5. Recommended implementation\n\n```java\npublic String retrieveContext(String\
