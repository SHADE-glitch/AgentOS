agent_response: "## Assessment: `KeywordKnowledgeRetriever` fallback — impact of unbounded\
  \ child-point dilution\n\n### TL;DR / Severity\n**Current runtime impact: LOW (dead\
  \ code). Latent/architectural impact: HIGH.** The textbook \"dilution\" harm is\
  \ real, but it is currently **unreachable** — `retrieveContext()` has zero call\
  \ sites. The real defect is a **landmine**: a developer wiring RAG context into\
  \ the scoring prompt later (the obvious next step) would silently inherit three\
  \ compounding bugs: a **misleading relevance claim**, an **unbounded/un-capped dump**,\
  \ and an **ill-designed match predicate that makes the fallback the common path**.\n\
  \n---\n\n### 1. Problem diagnosis (grounded in the code)\n\n`backend/.../interview/service/KeywordKnowledgeRetriever.java:32-73`:\n\
  \n```java\npublic String retrieveContext(String query, String topic) {\n    ...\n\
  \    String queryLower = query.toLowerCase();\n    int matchCount = 0;\n    for\
  \ (KnowledgePoint point : points) {\n        if (name.contains(queryLower) || desc.contains(queryLower))\
  \ {  // crude substring, cap 5\n            ...\n            if (matchCount >= 5)\
  \ break;\n        }\n    }\n    if (matchCount == 0) {                       //\
  \ <-- fallback\n        sb.append(\"当前主题知识点：\");\n        for (KnowledgePoint point\
  \ : points) {    // <-- ALL children, NO cap\n            if (point.getParentId()\
  \ != null)\n                sb.append(point.getName()).append(\"、\");\n        }\n\
  \    }\n}\n```\n\nThree concrete defects:\n\n1. **Misleading prompt prefix (relevance-mislabel).**\
  \ Line 48 appends *unconditionally*: `\"以下是与查询相关的知识点（供参考）：\\n\"`. In the fallback\
  \ branch the returned points are by definition **not** query-related — they are\
  \ the entire topic's child set. The model is explicitly instructed these are \"\
  related\" when they are not. This is worse than neutral noise; it actively misleads\
  \ the model into treating irrelevant points as relevant evidence.\n\n2. **Unbounded\
  \ dilution (no cap, no token budget).** The query branch caps at `5` (line 58);\
  \ the fallback dumps *every* child point (lines 65-69) with no limit. A topic with\
  \ N children emits N names in a single line regardless of length — unbounded prompt-token\
  \ growth that drowns whatever real signal exists.\n\n3. **The fallback is the *common*\
  \ path, not an edge case.** Line 54-55 uses `point.name.toLowerCase().contains(queryLower)`\
  \ a **substring of the entire raw query**. Real interviews ask natural-language\
  \ questions (\"请解释一下线程池的拒绝策略\" ). A multi-word query with a space is essentially\
  \ never a substring of a short knowledge-point name → `matchCount==0` fires almost\
  \ always → the fallback dominates retrieval in practice. So the \"dilution\" it\
  \ describes is statistically the default behavior whenever wired up.\n\n**Dead-code\
  \ confirmation:**\n```\nbackend/src/main/java/com/aiview/interview/service/InterviewService.java:61\n\
  \    private final KeywordKnowledgeRetriever knowledgeRetriever;   // injected,\
  \ NEVER dereferenced\n```\n`grep -rn \"retrieveContext|knowledgeRetriever\\|\"`\
  \ → only the declaration and the definition; no call site anywhere. `retrieveContext()`\
  \ is truly unreachable today, so **today's production prompts are unaffected** —\
  \ the scoring path (`RuleBasedScoringService`/`InterviewScoringService`) never consumes\
  \ this output.\n\n### 2. Impact matrix\n\n| Dimension | Today (dead code) | If wired\
  \ into prompt |\n|---|---|---|\n| Prompt length | — | Grows O(topic child count);\
  \ token budget risk |\n| Signal/noise | — | Signal ≈ 0; unrelated points injected\
  \ as \"related\" |\n| Model correctness | — | Misled by false relevance claim; degraded\
  \ answer fidelity |\n| Latency/cost | — | Larger context → slower decode, higher\
  \ $/token |\n| Testability | — | Non-deterministic ordering, no dedupe |\n\n###\
  \ 3. Design decision\n\n```text\nOption A — Keep behavior, just cap the fallback\
  \ (e.g. limit 5, drop the prefix on no-match)\n- Strengths: minimal diff\n- Weaknesses:\
  \ still dumps wrong-points-as-context; doesn't fix relevance mislabel\n- Best for:\
  \ tiny patch, not a real fix\n\nOption B — Do not fall back to all children; return\
  \ explicit \"no match\" (or a bounded, distincted, relevance-ranked subset) and\
  \ fix the prefix\n- Strengths: honest context; bounded; testable; removes the landmine\n\
  - Weaknesses: more code; needs the match predicate fixed too\n- Best for: correct,\
  \ maintainable outcome (recommended)\n\nOption C — Delete the class entirely (since\
  \ it is dead today)\n- Strengths: removes dead weight + landmine in one move\n-\
  \ Weaknesses: loses the intended feature when someone does wire RAG back\n- Best\
  \ for: if feature is truly abandoned\n\nDecision → Option B, plus a connectivity\
  \ safeguard (below)\n- Why: fixes misleading prefix + unbounded dilution at the\
  \ source and is ready when the segment is re-enabled\n- Risks: dead path may resurface\
  \ with same bug → mitigated by making no-match path explicit and adding a guard\n\
  ```\n\n### 4. Concrete remediation\n\nRecommended replacement of the fallback +\
  \ match predicate:\n\n```java\nprivate static final int MAX_CONTEXT = 5;\n\npublic\
  \ String retrieveContext(String query, String topic) {\n    if (query == null ||\
  \ query.isBlank()) return \"\";\n    List<KnowledgePoint> points = knowledgePointMapper.selectList(\n\
  \            new LambdaQueryWrapper<KnowledgePoint>().eq(KnowledgePoint::getTopic,\
  \ topic));\n    if (points.isEmpty()) return \"\";\n\n    String[] tokens = query.toLowerCase().split(\"\
  \\\\s+\");           // tokenize, not whole-substring\n    List<KnowledgePoint>\
  \ matched = points.stream()\n            .filter(p -> Arrays.stream(tokens).anyMatch(t\
  \ ->\n                    p.getName().toLowerCase().contains(t)\n              \
  \      || (p.getDescription() != null && p.getDescription().toLowerCase().contains(t))))\n\
  \            .limit(MAX_CONTEXT)\n            .collect(Collectors.toList());\n\n\
  \    if (matched.isEmpty()) {\n        // No match: do NOT dump children and do\
  \ NOT claim relevance.\n        return \"未检索到与该问题相关的知识点。\";\n    }\n\n    StringBuilder\
  \ sb = new StringBuilder(\"以下是与查询相关的知识点（供参考）：\\n\");\n    for (KnowledgePoint p\
  \ : matched)\n        sb.append(\"- \").append(p.getName())\n          .append(p.getDescription()\
  \ != null ? \"：\" + p.getDescription() : \"\").append(\"\\n\");\n    return sb.toString();\n\
  }\n```\n\nConnectivity safeguard so it can't silently re-live as dead mislabeled\
  \ code:\n\n```java\n// nearest call site (InterviewService) — make wiring observable:\n\
  public MessageVO answer(...) {\n    ...\n    String ctx = knowledgeRetriever.retrieveContext(currentQ,\
  \ session.getTopic());\n    if (!ctx.isEmpty()) log.debug(\"rag-context[{}] bytes={}\"\
  , sessionId, ctx.length());\n    ...\n}\n```\nPlus a unit test asserting: (a) no-match\
  \ → no child names emitted, (b) output never exceeds a token budget, (c) prefix\
  \ only present when matches > 0.\n\n### 5. Validation\n- **Test:** golden knowledge\
  \ set; query guaranteed to hit the fallback → assert output contains NO topic child\
  \ names and the header claim is absent.\n- **Bound:** assert concatenated length\
  \ ≤ configurable budget (fail-fast on unbounded regression).\n- **Ground-truth check:**\
  \ `mvn -q compile` + targeted test; confirm `grep -rn \"retrieveContext\"` now shows\
  \ a real call site, proving it is no longer dead.\n\n### 6. Follow-ups worth doing\
  \ later\n- Replace substring matching with tokenized/weighted scoring and a relevance\
  \ cutoff so \"fallback\" stays a rare edge.\n- Implicit-cap by erroring (or returning\
  \ `\"\"`) instead of silently broadening when no match, keeping the attestation\
  \ \"matchCount==0 → no context\" semantics.\n\n**Bottom line:** today the fallback\
  \ cannot affect any live prompt (dead code → LOW risk), but it is a high-severity\
  \ latent defect (false-relevance claim + unbounded child dump + fallback-is-the-common-path).\
  \ Treat it as a **must-fix before re-enabling context injection**, fix via Option\
  \ B, and add a call-site guard + budget test so it can never reactivate silently."
