agent_response: "Analysis complete. Here is the structured Database Engineer assessment\
  \ grounded in the actual code.\n\n---\n\n# Redis-Cached Dashboard Aggregates: Staleness\
  \ & Mutation-Safety Assessment\n\n## 1. 目标 / 现状 (Goal / Current state)\n\n**Aggregate\
  \ source** — `DashboardService.compute()` (DashboardService.java:93) reads two DB\
  \ tables:\n- `interview_result` → `InterviewResult` rows (dimensions, suggestions,\
  \ weakPoints)\n- `interview_session` → rows where `status = FINISHED AND total_score\
  \ IS NOT NULL` (stats, trend)\n\n**Cache contract** — `DashboardService.build()`\
  \ (DashboardService.java:52-71): read `dashboard:user:{id}`; on hit return JSON;\
  \ on miss compute from DB and `set` with `CACHE_TTL_MINUTES = 10`.\n\n**Invalidation**\
  \ — `DashboardService.evict()` (DashboardService.java:81) deletes the key; callers\
  \ must invoke it after any aggregate-affecting mutation.\n\n**Key property to design\
  \ for:** the cached view is *correct only while* it equals a consistent snapshot\
  \ of both tables at some point after the last relevant write.\n\n---\n\n## 2. 问题判断\
  \ (Diagnosis)\n\n### When the cached view is stale — three distinct windows\n\n\
  | Id | Staleness source | Mechanism | Worst-case hold time |\n|----|------------------|-----------|----------------------|\n\
  | **S1** | Mutation with **no** eviction | TTL-only invalidation | up to 10 min\
  \ |\n| **S2** | **Lost-delete** TOCTOU race | A `build()` reads pre-mutation DB,\
  \ mutation commits + deletes key, then `build()`'s `set()` lands *after* the delete\
  \ → stale snapshot re-written | up to 10 min |\n| **S3** | **Intermediate-state\
  \ staging** | Eviction interleaved *mid-mutation* → a `build()` caches a **half\
  \ view** (e.g. new result but session `total_score` still NULL) that no later eviction\
  \ clears unless it happens to run after the reader | up to 10 min |\n\n**The critical,\
  \ non-obvious window is S3.** Consider `InterviewScoringService.score()` (InterviewScoringService.java:105-111):\n\
  \n```java\nresultMapper.insert(result);      // commit 1\ndashboardService.evict(userId);\
  \   // delete\nsession.setTotalScore(total);\nsessionMapper.updateById(session);\
  \ // commit 2\ndashboardService.evict(userId);   // delete again\n```\n\nIf a dashboard\
  \ request runs between the two evicts, `build()` sees the new `interview_result`\
  \ but `interview_session.total_score` still NULL. Because `compute()` filters `total_score\
  \ IS NOT NULL`, that read produces a *partially-updated* DashboardVO and `set()`s\
  \ it. If that `set()` lands after the second `delete` (S2 at the same time), the\
  \ half view persists **until TTL expiry** — the deletions cannot catch it. The double-evict\
  \ actually *guarantees* a non-empty race window exists.\n\n> Note: In this schema\
  \ the metrics are **averages/non-counting** (`avgScore`, per-dim avg), so S3 rarely\
  \ skews numbers badly — but `suggestions`/`weakPoints` and any future additive metric\
  \ are vulnerable, and the trend can briefly show a session missing a score.\n\n\
  ---\n\n## 3. 方案设计 — Mutation path safety inventory\n\nLegend: **Safe** = eviction\
  \ covers the effective commit point. **Unsafe** = a build() can cache an intermediate/lost\
  \ state.\n\n| # | Path | Writes | Evict(s) | Safety |\n|---|------|--------|----------|--------|\n\
  | P1 | `InterviewService.answer()` — sync finish (InterviewService.java:151,168)\
  \ | insert result | `evict` @152/169 + inside `finishSession` @349 | **Safe** —\
  \ synchronous, committed before evict; evict after both writes. Redundant but harmless.\
  \ |\n| P2 | `InterviewService.answerStream()` (InterviewService.java:226,243) |\
  \ insert result | `evict` @227/244 + @349 | **Safe** (same as P1) |\n| P3 | `finishSession()`\
  \ (InterviewService.java:349) | `status=FINISHED`, `finishedAt`, **total_score still\
  \ NULL** | `evict` @349 | **Safe** for the dashboard: while `total_score IS NULL`\
  \ the session is intentionally excluded by the aggregator; gating evict on total_score\
  \ keeps it consistent. true |\n| P4 | `InterviewScoringService` (AI async) @105-111\
  \ | insert result + update session total_score | evict ×2, interleaved | **Unsafe\
  \ — S3 pirates** |\n| P5 | `RuleBasedScoringService` async @56-66 | insert result\
  \ + update session total_score | evict ×2, interleaved | **Unsafe — S3** + **adjacent\
  \ double-consumer bug** (below) |\n| P6 | `LegacyAiScoringService` (mode=ai) @112-118\
  \ | insert result + update session total_score | evict ×2, interleaved | **Unsafe\
  \ — S3** |\n\nLegacy AI + new AI + rule all insert a single `interview_result` then\
  \ update `interview_session`. All three use the same **double-evict-interleaved**\
  \ pattern → all three are S3-unsafe.\n\n### Adjacent correctness bug (must flag,\
  \ not strictly cache)\n`RuleBasedScoringService` is `@ConditionalOnProperty(name=\"\
  app.interview.mode\", havingValue=\"rule\", matchIfMissing=true)` while `InterviewScoringService`\
  \ (the AI one) has **no such condition**. When `app.interview.mode=rule` both beans\
  \ register a `@RabbitListener` on the **same queue** `aiview.interview.scoring`\
  \ → each scoring message is consumed **twice** → two `interview_result` rows per\
  \ interview. Impact: duplicate rows feeding `dimensions`/`suggestions` and double\
  \ DB work; averages are mostly robust but `totalQuestions`/future counts and report\
  \ generation skew. Fix: add a mutually-exclusive guard (rename one condition, or\
  \ gate the AI consumer on `havingValue=\"ai\"`, or use `@ConditionalOnProperty`\
  \ with a distinct active profile) so exactly one consumer runs.\n\n---\n\n## 4.\
  \ 决策 (Decision)\n\n**Option A — Minimal patch (keep TTL): collapse to a single end-of-write\
  \ evict.**\n- **Strengths:** smallest diff; removes S3 entirely (no eviction interleaved\
  \ mid-transaction); preserves 10-min TTL as a bounded backstop.\n- **Weaknesses:**\
  \ S2 lost-delete race still possible (a slow concurrent `build()` can resurrect\
  \ a pre-mutation snapshot for up to TTL).\n- **Best for:** quick production hardening\
  \ while keeping the current contract.\n\n**Option B — Version gating (recommended,\
  \ closes S2 + S3).**\n- **Strengths:** eliminates both race classes deterministically;\
  \ no reliance on eviction ordering.\n- **Weaknesses:** needs a revision source (recompute\
  \ is non-trivial); slightly more code.\n- **Best for:** the durable fix for a dashboard\
  \ that reads hot (per-user, per-interview).\n\n**Decision:** Ship **Option A** immediately\
  \ (single evict at the end), then implement **Option B** for full correctness. Fix\
  \ the double-consumer bug in the same change since it corrupts the aggregate source\
  \ itself.\n\n---\n\n## 5. 实施方案\n\n### 5.1 Option A — single eviction point (P4/P5/P6)\n\
  \nMove both evictions to after the last write; do the DB writes then one `evict`:\n\
  \n```java\nresultMapper.insert(result);\nsession.setTotalScore(total);\nsession.setReport(root.toString());\n\
  sessionMapper.updateById(session);\ndashboardService.evict(session.getUserId());\
  \   // exactly once, after last commit\n```\n\nSame fix in `RuleBasedScoringService`\
  \ and `LegacyAiScoringService`. This removes the interleaved window *and* dedupes\
  \ redundant deletes.\n\n### 5.2 Option B — version/revision gating in `build()`\n\
  \nStore `updatedAt`-style revision; refuse to `set()` a stale snapshot.\n\n```java\n\
  public DashboardVO build(Long userId) {\n    String k = key(userId);\n    RBucket<String>\
  \ bucket = redissonClient.getBucket(k);\n\n    LocalDateTime rev = revision(userId);\
  \                 // e.g. max(session.finished_at, result.created_at)\n    String\
  \ cached = bucket.get();\n    if (cached != null) {\n        var cachedVo = read(cached);\n\
  \        if (cachedVo != null && cachedVo.getRevision().equals(rev)) {\n       \
  \     return cachedVo;                              // fresh\n        }\n    }\n\
  \    DashboardVO vo = compute(userId);\n    try {\n        bucket.set(objectMapper.writeValueAsString(withRevision(vo,\
  \ rev)),\n                   CACHE_TTL_MINUTES, TimeUnit.MINUTES);\n    } catch\
  \ (Exception e) { /* swallow */ }\n    return vo;\n}\n```\n\nBecause the reader\
  \ now compares the revision it computed against the one it stored, a snapshot that\
  \ lost the delete race to a mutation simply won't be served as fresh — the reader\
  \ re-pulls DB truth on the mismatch instead of baking in stale data. Optionally\
  \ keep the end-of-write `evict` for faster convergence.\n\n### 5.3 Double-consumer\
  \ fix\nAdd the missing guard so exactly one scoring consumer is wired to `aiview.interview.scoring`:\n\
  \n```java\n@ConditionalOnProperty(name = \"app.interview.mode\", havingValue = \"\
  rule\", matchIfMissing = true) // RuleBasedScoringService\n@ConditionalOnProperty(name\
  \ = \"app.interview.mode\", havingValue = \"ai\",   matchIfMissing = false) // InterviewScoringService\
  \ (or remove its @RabbitListener registration)\n```\n\n---\n\n## 6. 验证方式 (Validation)\n\
  \n1. **Unit — staleness matrix:** simulate a mutation → assert `evict` fires exactly\
  \ once, after both commits (instrument call order). Assert `build()` never returns\
  \ a cache entry whose revision mismatches current DB revision.\n2. **Integration\
  \ — S3 regression:** start `build()` concurrently with the async scoring consumer\
  \ (inject a delay between `insert` and `update`); assert the served DashboardVO\
  \ never shows result-without-session-score.\n3. **Consumer dedup:** post one `ScoringMessage`,\
  \ assert exactly one `interview_result` is created (catches the P5 double-consumer).\n\
  4. **TTL acceptance:** set `CACHE_TTL_MINUTES=10`; mutation → assert subsequent\
  \ `build()` immediately reflects DB (evict path), and that without any mutation\
  \ the cache serves for ≤10 min.\n5. **Ops check:** `redis-cli monitor`/`KEYS dashboard:*`\
  \ to confirm delete-on-mutation and re-creation-on-read, plus EVRAM usage under\
  \ per-user load.\n\n## 7. 复盘建议 (Follow-ups)\n- Push TTL down to 1–2 min as a bounded-staleness\
  \ safety net if Option B is deferred; 10 min is aggressive for a hot per-user dashboard\
  \ that is invalidated on every finish.\n- Consider event-driven invalidation via\
  \ the existing RabbitMQ exchange, making the eviction idempotent and decoupled from\
  \ every mutation site (one canonical place to evict).\n- Note in the code comment\
  \ (DashboardService.java:78) the S2/S3 race rationale so future writers don’t reintroduce\
  \ interleaved eviction."
