agent_response: "I've traced the full cache lifecycle, all mutation sites, and the\
  \ async scoring flow. Here is the assessment.\n\n## Overview of current design\n\
  \n`DashboardService.build(userId)` uses **cache-aside with write-through invalidation**:\n\
  - Key: `dashboard:user:<userId>`, TTL **10 min** (`DashboardService.java:38`).\n\
  - Read path: `bucket.get()` → hit returns cached `DashboardVO`; miss recomputes\
  \ from DB (`compute`) and calls `bucket.set(…, 10, TimeUnit.MINUTES)` (`DashboardService.java:54-70`).\n\
  - Invalidation: `evict(userId)` = `bucket.delete()`, wired into every mutation site\
  \ (`DashboardService.java:81-91`).\n\nThis is the correct basic architecture (never\
  \ stale-beyond-TTL *if* evictions fire). The introductory comment even documents\
  \ a prior Run2 bug where TTL expired without eviction (`DashboardService.java:78-80`),\
  \ which is now fixed.\n\n## When the cached view is stale\n\nStaleness has three\
  \ distinct causes, and only two are about Redis:\n\n**1. Staleness driven by the\
  \ source-of-truth lag (async scoring) — the dominant risk, not the TTL.**\nOn `finishSession`,\
  \ `InterviewService.answer()`/`answerStream()` insert a **provisional** rule-based\
  \ result and evict (`InterviewService.java:151-152, 168-169`) and `finishSession`\
  \ evicts again (`:349`). It then enqueues an async scoring job to `RabbitMQ`. Only\
  \ when the consumer runs (`RuleBasedScoringService.java:38-66` / `InterviewScoringService.java:46-112`)\
  \ does it insert the *real* result, set `session.totalScore`, and evict again (`:57/:66`,\
  \ `:106/:111`).\n\nDuring that window the dashboard reflects the provisional rule-based\
  \ value; if the consumer is down or the message redelivers/fails, `totalScore` stays\
  \ `null` for up to TTL and beyond. The Redis TTL is *not* what makes it stale here\
  \ — the DB itself is lagging.\n\n**2. Un-bounded staleness from a missed eviction\
  \ (crash window).**\nEach mutation commits to DB *then* calls `evict`. If the process\
  \ dies between commit and `bucket.delete()`, the cache holds the old aggregate for\
  \ up to **10 min**. With one eviction call, TTL is the only backstop.\n\n**3. The\
  \ classic cache-aside \"stale re-write\" race — present but unprotected.**\nThe\
  \ per‑session Redisson lock (`InterviewService.java:361-372`) guards the session\
  \ state machine, **not** `DashboardService`. A concurrent `build()` can do `compute()`\
  \ from DB (old rows), get preempted; meanwhile the mutation commits and `evict()`\
  \ deletes the key; then the preempted `build()` calls `bucket.set()` and resurrects\
  \ a stale value that now lives 10 min. The lock gives no protection here.\n\n##\
  \ Mutation-path coverage audit\n\nEvery mutation that influences the aggregate is\
  \ covered:\n\n| Mutation on aggregate inputs | Sites | Evicted? |\n|---|---|---|\n\
  | Insert `InterviewResult` (dims/suggestions) | `InterviewService` 151/168/226/243;\
  \ `RuleBasedScoringService:57`; `InterviewScoringService:106`; `LegacyAiScoringService:113`\
  \ | ✅ |\n| Set `session.totalScore` (make it count in stats/trend) | `RuleBasedScoringService:66`;\
  \ `InterviewScoringService:111`; `LegacyAiScoringService:118` | ✅ |\n| `FINISHED`\
  \ transition + `finishedAt` | `InterviewService.finishSession:349` (also covers\
  \ empty-question-bank path `:102`) | ✅ |\n| `CREATE`/`answer`/question inserts |\
  \ `InterviewService` — no-ops, *correctly* **not** evicted (dashboard only aggregates\
  \ FINISHED sessions + results) | n/a |\n\nSo the eviction coverage is complete.\
  \ The issues are **quality**, not missing call sites.\n\n## Concrete issues\n\n\
  **A. Double-counting of results (accuracy bug).** `answer()` inserts a provisional\
  \ result (`:151`), then the async consumer inserts a *second* result for the same\
  \ session (`:105`). `compute()` averages/counts **all** `InterviewResult` rows (`DashboardService.java:94,\
  \ 109-125`), so each finished interview contributes twice to the dimension averages.\
  \ Easy to prove by checking `resultMapper.selectList(userId)` size vs `sessionMapper`\
  \ FINISHED count after one interview.\n\n**B. Redundant evictions.** Result-insert\
  \ + finishSession + consumer insert + consumer update = up to 4 deletes per interview;\
  \ each is a Redis round-trip. Harmless but wasteful — collapse to a single evict\
  \ **at the end** of each mutation flow (after the last aggregate-affecting write\
  \ lands).\n\n**C. No concurrency control on cache-miss compute.** Multiple concurrent\
  \ `build()` for a cold key all run `compute()` (DB load) and one wins; with high\
  \ traffic this thunders toward the DB. Guard with a per-key `RLock` around the miss\
  \ path.\n\n**D. No stampede/arbiter default.** Consider whether a stale-but-fresh-serving\
  \ policy (serve cached data + async refresh) is better than blocking recompute under\
  \ load — optional given the small dataset.\n\n## Recommendations\n\n1. **Fix the\
  \ double-count** (highest priority): make the answer path *not* insert a provisional\
  \ result when async scoring is enabled, or give the consumer an upsert-by-`sessionId`\
  \ so there is exactly one `InterviewResult` per session (`resultMapper.selectOne(sessionId)\
  \ → update` instead of unconditional insert).\n\n2. **Collapse to one evict at the\
  \ end of each flow** (after last DB commit), keeping the `delete()` because correctness\
  \ demands it.\n\n3. **Collapse the read race** with a per-key compute lock (thundering-herd\
  \ + stale-re-write):\n\n```java\npublic DashboardVO build(Long userId) {\n    String\
  \ k = key(userId);\n    String cached = redissonClient.getBucket(k).get();\n   \
  \ if (cached != null) {\n        try { return objectMapper.readValue(cached, DashboardVO.class);\
  \ }\n        catch (Exception e) { log.warn(\"parse dashboard cache failed: {}\"\
  , e.getMessage()); }\n    }\n    RLock lock = redissonClient.getLock(\"dashboard:lock:\"\
  \ + userId);\n    try {\n        if (!lock.tryLock(3, TimeUnit.SECONDS)) { return\
  \ compute(userId); } // degrade\n        cached = redissonClient.getBucket(k).get();\
  \ // double-check after acquiring\n        if (cached != null) {\n            try\
  \ { return objectMapper.readValue(cached, DashboardVO.class); }\n            catch\
  \ (Exception ignore) { /* fall through */ }\n        }\n        DashboardVO vo =\
  \ compute(userId);\n        writeCache(k, vo);\n        return vo;\n    } finally\
  \ {\n        if (lock.isHeldByCurrentThread()) lock.unlock();\n    }\n}\n```\nThis\
  \ also removes the stale-re-write race in (D) because the winning post-eviction\
  \ writer is the one that recomputes after acquring the key lock.\n\n4. **Reduce\
  \ TTL** to 1–3 min as a safety net (eviction is now reliable, so the long TTL only\
  \ widens a missed-eviction/crash window), or keep 10 min if you add the key lock.\n\
  \n5. **For the async-scoring window**, decide explicitly: either (a) accept ~1 message-processing-lag\
  \ of staleness and document it, or (b) treat \"no final result yet\" as a first-class\
  \ state in the dashboard VO (e.g., `scoringPending: true`) rather than surfacing\
  \ provisional rule scores silently — the most honest fix for the dominant staleness\
  \ source.\n\n6. Optionally expose a `dashboard:user:<id>` debug endpoint / `evict`\
  \ admin call so stale keys can be purged operationally during incidents.\n\n## Bottom\
  \ line\n\n- **Eviction coverage is complete** — every aggregate-affecting mutation\
  \ path invalidates correctly (this was the prior bug and is now handled).\n- **Redis\
  \ TTL is not the primary staleness driver.** The real stale windows are (1) the\
  \ async-scoring producer lag, (2) the commit-then-crash-then-TTL window, and (3)\
  \ the cache-aside stale-re-write race.\n- **One genuine correctness bug**: the duplicate\
  \ provisional+async `InterviewResult` rows double-count into the dimension averages.\
  \ Fixing that should come first; the key-lock + TTL + single-evict changes harden\
  \ the rest."
