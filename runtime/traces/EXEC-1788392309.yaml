agent_response: "Analysis complete. Here is my Database Engineer assessment of the\
  \ dashboard Redis caching.\n\n## 1. Current architecture (as-built)\n\n**Cache-aside,\
  \ write-through eviction, per-user key**\n\n- `DashboardService.build()` (`DashboardService.java:52`):\
  \ get bucket `dashboard:user:{userId}` → hit returns deserialized `DashboardVO`;\
  \ miss → `compute()` runs 2 aggregate queries, then `set(..., 10, MINUTES)`.\n-\
  \ `CACHE_TTL_MINUTES = 10` (`DashboardService.java:38`).\n- `evict(userId)` deletes\
  \ the key (`DashboardService.java:81`).\n- Dashboard reads → `DashboardController.java:20`\
  \ → `build(currentUserId)`.\n\n**Data feeds of the aggregate** (both must stay consistent\
  \ to avoid partial staleness):\n1. `interview_result` rows → radar dims (avg), weakPoints,\
  \ suggestions (`compute` lines 103–142).\n2. `interview_session` rows with `status='FINISHED'`\
  \ **and** `total_score IS NOT NULL`, ordered by `finished_at` → stats + trend (`compute`\
  \ lines 144–155). Note: a FINISHED session with null `totalScore` is excluded from\
  \ trend/stats until scoring writes `totalScore`.\n\n## 2. Are the mutation paths\
  \ safe?\n\n**Write/evict coverage — complete at source level.** Every mutation touching\
  \ feed data is followed by `evict()`:\n\n| Mutation | File:line | Evict | Safe?\
  \ |\n|---|---|---|---|\n| result insert (sync finish) | `InterviewService.java:151,168,226,243`\
  \ | yes (152,169,227,244) | ✓ |\n| result insert (AI/rule consumer) | `InterviewScoringService.java:105`,\
  \ `RuleBasedScoringService.java:56` | yes (106, 57) | ✓ |\n| `totalScore` on session\
  \ | `InterviewScoringService.java:110`, `RuleBasedScoringService.java:65` | yes\
  \ (111, 66) | ✓ |\n| FINISHED + `finishedAt` | `InterviewService.java:341-349` (`finishSession`)\
  \ | yes (349) | ✓ |\n| empty-bank early finish | `create()` → `finishSession` |\
  \ via finishSession | ✓ |\n\nThe two-phase async flow is also internally consistent:\
  \ `finishSession` evicts right after writing `FINISHED` (line 349), and the MQ consumer\
  \ evicts again after writing `result` + `totalScore` (106/111, 57/66). Because `compute`\
  \ filters on `totalScore IS NOT NULL`, the transient window (FINISHED but totalScore\
  \ null) can't surface wrong trend/stats — the session is invisible until the consumer\
  \ evicts. **So ordering is correct.**\n\n## 3. When is the cached view stale?\n\n\
  Despite full eviction coverage, four concrete staleness windows exist:\n\n**(a)\
  \ The cache-aside set/delete race (primary risk).** `build()` does read→`compute`→`set`.\
  \ If a writer's `evict()` delete lands **between** `compute()` and `bucket.set()`\
  \ (lines 64→66), the set repopulates the key with pre-mutation data and nothing\
  \ evicts again. Stale until TTL (10 min). This is inherent to naive cache-aside\
  \ and is NOT covered by any lock/double-check. Any DB write racing a dashboard read\
  \ can produce up to 10 minutes of stale data.\n\n**(b) Non-atomic DB-write + Redis-evict.**\
  \ The SQL commit and the `delete` are separate operations. `evict()` swallows all\
  \ exceptions (`DashboardService.java:89`, `catch { log.warn }`). If Redis errors\
  \ at the moment of a write (connection drop, Redisson failure), the DB commits but\
  \ the cache survives → stale for the full 10-min TTL.\n\n**(c) The reverse of (b):**\
  \ `bucket.set()` in `build()` also swallows errors, so a failed `set` is harmless\
  \ (no cache). Low risk but part of the same lack of atomicity.\n\n**(d) Redis outage\
  \ is a hard failure, not a fallback.** `bucket.get()` at `DashboardService.java:55`\
  \ is **outside** any try/catch (only parse at 56–62 and set at 66–69 are guarded).\
  \ If Redisson can't connect, `get()` throws, `compute()` never runs, and the endpoint\
  \ returns an error — the cache-aside pattern does not degrade to \"DB direct.\"\
  \ This is the least \"stale\" but most availability-critical gap.\n\n## 4. Recommendations\n\
  \n**R1 — Make `build()` self-healing against (a) and (c).** After the `set`, re-read\
  \ or, better, use Redisson `RBatch`/a short re-check; the cleanest fix is a **double-checked\
  \ read with per-user write lock around compute+set** using Redisson's existing lock\
  \ infra (already used in `InterviewService.lockFor`):\n\n```java\npublic DashboardVO\
  \ build(Long userId) {\n    String k = key(userId);\n    RBucket<String> bucket\
  \ = redissonClient.getBucket(k);\n    String cached = bucket.get();\n    if (cached\
  \ != null) {\n        try { return objectMapper.readValue(cached, DashboardVO.class);\
  \ }\n        catch (Exception e) { log.warn(\"parse dashboard cache failed: {}\"\
  , e.getMessage()); }\n    }\n    RLock lock = redissonClient.getLock(\"dashboard:lock:\"\
  \ + userId);\n    boolean got = false;\n    try {\n        got = lock.tryLock(3,\
  \ TimeUnit.SECONDS);\n        if (got) {\n            cached = bucket.get();   \
  \                  // double-check under lock\n            if (cached != null) {\n\
  \                try { return objectMapper.readValue(cached, DashboardVO.class);\
  \ } catch (Exception ignored) {}\n            }\n            DashboardVO vo = compute(userId);\n\
  \            try { bucket.set(objectMapper.writeValueAsString(vo), CACHE_TTL_MINUTES,\
  \ TimeUnit.MINUTES); }\n            catch (Exception e) { log.warn(\"write dashboard\
  \ cache failed: {}\", e.getMessage()); }\n            return vo;\n        }\n  \
  \  } catch (InterruptedException e) { Thread.currentThread().interrupt(); }\n  \
  \  finally { if (got) lock.unlock(); }\n    return compute(userId);   // lock-uncontended\
  \ fallback: compute from DB truth\n}\n```\nWith the lock held through `set`, the\
  \ writer's `evict()` (R2 below) always deletes *after* the repopulating set, eliminating\
  \ window (a). Writers and this lock must acquire the same key for mutual exclusion.\n\
  \n**R2 — Evict inside the write critical section.** Ensure `evict()` runs while\
  \ the mutation lock/logical transaction is held and *after* commit. At minimum,\
  \ don't swallow errors silently in a way that hides staleness — consider logging\
  \ at `WARN` (already done) and adding a cache **version/monotonic counter** so `build()`\
  \ can detect an un-evicted write:\n\nInclude a generation (e.g., a `MAX(is_generated)`,\
  \ `finished_at`, or a `dashboard_version` on the user) in `DashboardVO` and reject\
  \ a cached value whose version is behind the DB — this converts TTL-bounded staleness\
  \ into immediate correctness. This is the robust fix for (b).\n\n**R3 — Make `get()`\
  \ Redis-resilient (fixes d).** Move `bucket.get()` into the try/catch and fall back\
  \ to `compute()` on connection error so availability degrades, not breaks:\n\n```java\n\
  String cached = null;\ntry { cached = bucket.get(); } catch (Exception e) { log.warn(\"\
  dashboard cache read failed: {}\", e.getMessage()); }\nif (cached != null) { /*\
  \ parse & return */ }\nreturn compute(userId);   // then best-effort write (optional)\n\
  ```\n\n**R4 — Consider shortening TTL if writes are frequent.** 10 min is a coarse\
  \ bound. With R1/R2 the correctness no longer depends on TTL, but tune `CACHE_TTL_MINUTES`\
  \ (make it configurable) to the acceptable staleness budget, and add a small random\
  \ jitter to avoid thundering-herd on mass expiry.\n\n**R5 — Verify invalidating\
  \ on all future writers via a central rule.** Freeze the invariant: *every path\
  \ that inserts/updates `interview_result` or sets `total_score`/`finished_at` on\
  \ `interview_session` MUST call `evict(userId)`.* Recommend guarding this with a\
  \ test (see R6) rather than discipline.\n\n**R6 — It is worth validating the hypotheses\
  \ in your context.** All referenced hypotheses (H-039/H-041/H-044/H-087/H-100) are\
  \ **UNVALIDATED (confidence=low, success_rate=0.5)** — I have not relied on them.\
  \ Notably, H-100 (\"bucket get when redis is...\") aligns with R3's Redis-outage\
  \ finding; I verified this against code rather than accepting the hypothesis. To\
  \ close the loop, add a runtime test: write→`build()`→mutate in a second thread→assert\
  \ no >TTL staleness, and a Redis-kill test asserting graceful fallback.\n\n**Priority:**\
  \ R1 (correctness race) and R3 (outage) first; R2 second; R4–R6 follow.\n\nThe one\
  \ correctness gap that can actually happen in normal operation is **(a)** — briefly:\
  \ a concurrent write between `compute()` and `set()` leaves a stale-backed cache\
  \ for up to 10 minutes. Everything else is degraded-mode or already handled."
