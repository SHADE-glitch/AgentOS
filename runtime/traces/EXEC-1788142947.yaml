  \n1. **参数校验** — 非空 query，topK 默认 3，范围 [1, 10]\n2. **检索用户所有知识块** — 通过子查询 `SELECT\
  \ id FROM knowledge_base WHERE user_id = ? AND deleted = 0` 获取该用户所有未删除的知识库 ID，然后一次性查出所有\
  \ `KnowledgeChunk`\n3. **Query 向量化** — 调用 `embeddingClient.embed(query)` 生成查询向量\n\
  4. **加载知识库元信息** — 查出用户所有知识库，构建 `kbId → name` 映射\n5. **逐块计算余弦相似度** — 遍历每个 chunk，解析存储的\
  \ JSON 向量，手动计算 `cosine(a, b)`\n6. **降序排列 + 截断** — 按 score 降序排序，取 topK 条返回\n\n###\
  \ 2. 面向面试的上下文封装 `retrieveContext()` (L154-169)\n\n- 内部直接调用 `search()`\n- 将命中片段拼接为带标题的格式化字符串，无命中返回空串\n\
  \n### 3. 文本分块策略 `chunkText()` (L179-203)\n\n- 先按空行（`\\n\\s*\\n`）分段\n- 单段 ≤ 500 字符直接作为一个\
  \ chunk\n- 超长段按 500 字符窗口滑动切分，相邻 chunk 有 50 字符重叠（overlap）\n\n### 4. 向量存储与解析\n\n-\
  \ **写入**：`toJson(float[])` → Jackson 序列化为 JSON 数组字符串\n- **读取**：`parseVector(String)`\
  \ → Jackson 反序列化回 `float[]`\n- 向量以 `float[]` 形式存储在 `knowledge_chunk.embedding` 字段（JSON\
  \ 格式）\n\n### 5. 关键特点与潜在问题\n\n| 方面 | 现状 | 风险 |\n|---|---|---|\n| 检索范围 | 用户全部知识库的所有\
  \ chunks | chunks 量大时全量加载+遍历效率低 |\n| 相似度计算 | 内存中逐条 cosine | 无向量索引，O(n) 线性扫描 |\n\
  | SQL 拼接 | `inSql` 内直接拼 userId | 存在 SQL 注入风险（虽然 userId 来自系统内部） |\n| 向量格式 | JSON\
  \ 字符串存储 | 无法利用数据库向量索引（如 pgvector） |\n| chunk 简单分块 | 滑动窗口固定 500/500 | 无语义分割，长文档语义可能被截断\
  \ |\n\n### 6. 整体数据流\n\n```\n用户 query\n  → embeddingClient.embed() → queryVec\n \
  \ → chunkMapper.selectList() → 用户所有 chunks\n  → 逐 chunk: parseVector() → cosine(queryVec,\
  \ vec) → score\n  → 降序排序 → 取 topK → SearchHitVO 列表\n  → retrieveContext() 格式化为文本\n\
  ```\n\n**总结**：这是一个基于纯 Java 内存计算的简易 RAG 检索实现，优点是逻辑清晰、零依赖（不需要向量数据库），缺点是 chunks 数量增长后性能会线性退化，且向量以\
