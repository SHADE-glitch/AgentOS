  \ query in topic {}; omitting context.\", topic);\n    return \"（未找到与查询“\" + query\
  \ + \"”直接相关的知识点。仅当题目明确要求时再使用主题知识，勿臆测。）\";\n}\n```\n- Honest signal to the LLM; zero\
