  \ Fallback behavior on the wire (if invoked)\nWith `query=\"多态\"`, `topic=\"Java\"\
  `, and no name/description containing `\"多态\"`, the predicate `matchCount==0` fires\
  \ and the method appends:\n```\n以下是与查询相关的知识点（供参考）：\n当前主题知识点：子类、重写、抽象类、接口、泛型、反射、注解、……\n\
  ```\nTrace: header `#48` → loop `#54-59` builds nothing → `#63-70` dumps every `parentId\
  \ != null` point into a single token-separated list. Concrete defects:\n\n| # |\
  \ Defect | Location | Consequence |\n|---|--------|----------|-------------|\n|\
  \ D1 | **Relevance mislabel** | `#48` vs `#64` | Header asserts the block is \"\
  related to the query\" but fallback body is a *full topic dump*. Downstream LLM\
  \ is primed to treat unrelevant points as authoritative evidence → relocation/hallucination\
  \ risk. |\n| D2 | **Unbounded dilution** | `#63-70` | Matched path caps at 5 (`#58`);\
  \ fallback has **no cap** → context grows linearly with DAG size, swamping useful\
  \ tokens, raising token cost + latency in rule-mode. |\n| D3 | **Amplitude inversion**\
  \ | `#58` vs `#66` | Negative hit ships a *larger* context than a positive hit —\
  \ worse UX/quality exactly when retrieval failed. |\n| D4 | **No negative signal**\
  \ | `#63` | A genuine coverage gap (\"knowledge doesn't contain the query\") is\
  \ masked by a broad dump instead of surfaced. In rule-mode scoring, absence of a\
  \ match is arguably a *negative* signal that should be explicit, not hidden. |\n\
  | D5 | **Formatting artifacts** | `#67` | Trailing `、`; no newline; label + list\
  \ on one line — malformed point appended to prompt. |\n| D6 | **Coverage asymmetry**\
  \ | `#66` vs `#54` | Matched path may include `parentId==null` (topic-level) points;\
  \ fallback *excludes* them (`parentId != null`). Surface inconsistency → nondeterministic\
  \ what the model sees. |\n| D7 | **Token duplication** | `#50,54` | One query can\
  \ match a parent name → shown under matched path *and* excluded from fallback, but\
  \ sibling matches under both expectations are inconsistent with D2/D3 caps. |\n\
  | D8 | **Unbounded no-op reference** | overall | Comment `判断没有匹配，返回所有知识点概述` says\
  \ \"outline\" but pastes full names — cheap, irrelevant filler. |\n\n### 3. Impact\
  \ weighting (assuming the method is wired)\n- **Prompt-context quality: HIGH**.\
  \ The misleading header (D1) converts a `no-match` into a `broad-match` at the prompt\
  \ layer, actively distorting retrieval honesty. Combined with D2/D3, the negative-retrieval\
  \ path is the *most expensive and least honest* path in the method.\n- **Cost/latency:\
  \ MEDIUM-HIGH**. O(#points) list in every no-match turn; unbounded vs the 5-cap\
  \ elsewhere.\n- **CORRECTNESS/live risk: LOW now** (dead code), **HIGH if wired**\
  \ into `evaluationService.score` / feedback generation. What should be a `coverage-gap`\
  \ edge becomes a top-heavy context.\n\n### 4. Recommendations\n**Option A (recommended\
  \ — restore honesty):** on `matchCount==0`, return an explicit absence marker, not\
