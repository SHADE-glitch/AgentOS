agent_response: "I've mapped the complete aggregation contract, all write paths, and\
  \ the cache lifecycle. Here's the structured assessment.\n\n## 1. What the cached\
  \ view depends on\n\n`DashboardService.compute()` (`DashboardService.java:93-177`)\
  \ aggregates exactly two source sets for a user:\n\n| Source | Filter | Feeds |\n\
  |---|---|---|\n| `interview_result` | `user_id = U` | `dimensions` (radar avgs +\
  \ weak point), `suggestions` |\n| `interview_session` | `user_id = U` **AND** `status='FINISHED'`\
  \ **AND** `total_score IS NOT NULL` | `stats.totalInterviews`, `avgScore`, `maxScore`,\
  \ `totalQuestions`, `trend` |\n\nKey contract: the dashboard reads `interview_session`\
  \ only through the `FINISHED ∧ total_score NOT NULL` predicate. Any row not yet\
  \ in that state is invisible to the dashboard regardless of what you write to it.\n\
  \n## 2. Cache design (current)\n\n- Per-user key `dashboard:user:{userId}` (good\
  \ isolation), TTL **10 min** (`DashboardService.java:38`).\n- Read-through: `build()`\
  \ hits cache, else `compute()` from DB and `SETEX 10min` (`DashboardService.java:52-71`).\n\
  - Write-through eviction: `evict()` deletes the key after mutations (`DashboardService.java:81-91`).\n\
  \nSo correctness is maintained **exclusively by eviction** — the TTL is only a backstop,\
  \ and any mutation to the two source tables that forgets `evict()` silently produces\
  \ up-to-10-minute staleness.\n\n## 3. When the cached view is STALE\n\n### 3A. Write-path\
  \ staleness (missing/incorrect evict)\n\nAudit of every mutating path to the two\
  \ source tables:\n\n| Mutation | Aggregate effect? | Evict present? | Verdict |\n\
  |---|---|---|---|\n| `InterviewService.create` insert (status=START, score=null)\
  \ (`:87`) | No — row fails the FINISHED/score filter | — (not needed) | **SAFE (no-op)**\
  \ |\n| `InterviewService.answer` insert `interview_result` (`:151/168`) | Yes |\
  \ `:152/169` ✓ | **SAFE** |\n| `InterviewService.answer` update `question_count`/status=ASKING\
  \ (`:186`) | No — not FINISHED | — (not needed) | **SAFE (no-op)** |\n| `finishSession`\
  \ → status=FINISHED + `finished_at` (`:340-349`) | Yes (enters filter, though score\
  \ still null) | `:349` ✓ | **SAFE** |\n| `InterviewScoringService.score` insert\
  \ result (`:105`), set `total_score` (`:110`) | Yes ×2 | `:106/111` ✓ | **SAFE**\
  \ |\n| `RuleBasedScoringService.score` insert result (`:56`), set `total_score`\
  \ (`:65`) | Yes ×2 | `:57/66` ✓ | **SAFE** |\n| `LegacyAiScoringService` insert\
  \ result (`:112`), set score (`:117`) | Yes ×2 | `:113/118` ✓ | **SAFE** |\n| `answerStream`\
  \ (SSE twin) | identical | ✓ | **SAFE** |\n| `interview_message` writes, `question.usage_count`,\
  \ `InterviewStateStore` redis | Not aggregate sources | — | **SAFE (no-op)** |\n\
  \n**Conclusion:** there are **no missing evictions** — every mutation that touches\
  \ a dashboard source row is followed by `evict()`, and every mutation that doesn't\
  \ is correctly left without one. This is already the fix recorded from the \"Run2\
  \ drift\" (stale-until-expiry aggregates) — it is in place.\n\n### 3B. Residual\
  \ staleness that persists even with correct eviction\n\n**(1) The recompute/evict\
  \ race (real, worth fixing).** Ordering is `DB write commit → evict()`. But `build()`'s\
  \ miss path is not atomic:\n\n```\nt0  Thread A: cache miss, compute() reads DB\
  \ (old aggregate)\nt1  Thread B: commits result, calls evict() → deletes (nothing\
  \ cached yet, no-op)\nt2  Thread A: bucket.set(old aggregate, 10min)   ← stale for\
  \ up to 10 min\n```\n\nA cache miss racing a concurrent write can repopulate the\
  \ stale aggregate despite correct eviction. This is the main remaining staleness\
  \ source.\n\n**(2) Transient inconsistency during async scoring.** `finishSession`\
  \ flips status→FINISHED but `total_score` is still NULL (scoring is async via RabbitMQ).\
  \ During the window, the inserted `interview_result` may be counted in `dimensions`/`weakPoints`/`suggestions`\
  \ **while** the finished session with null score is excluded from `stats`/`trend`\
  \ — a self-inconsistent dashboard (radar updated, stats not). It self-heals after\
  \ the scorer commits `total_score` + evict, but it is not \"truthful\" in that instancant\
  \ window.\n\n**(3) TTL cap for read-only traffic.** Absent any write, a dashboard\
  \ never fresher than 10 min. Acceptable for analytics, but it is the only staleness\
  \ bound the TTL provides.\n\n## 4. Which mutation paths are SAFE (summary)\n\n-\
  \ **Writes that change the aggregate** → all four insert-result sites and both total_score\
  \ setters are evict-covered → **safe**.\n- **Writes that don't change the aggregate**\
  \ (session create, question_count/status updates while not FINISHED, message/usage/state\
  \ writes) → correctly no evict → **safe**.\n- The two **unsafe-by-design** windows\
  \ are (3B-1) the recompute race and (3B-2) the async-scoring gap, both discussed\
  \ above.\n\n**Caveat for future changes:** the invariants holding this safe are\
  \ (a) `total_score` is written once (never incremented), (b) `interview_result`/`interview_session`\
  \ are insert-only here (no update/delete paths). Any future edit to a result row,\
  \ user hard/soft delete, or an admin retry/re-scoring that mutates an existing result\
  \ **must** add `evict(userId)` or staleness reappears.\n\n## 5. Recommended hardening\n\
  \n**A. Make the cache-miss path atomic (fix the main race)** — Redis already has\
  \ Redisson; wrap the compute+set in a per-user lock and double-check:\n\n```java\n\
  private static final long CACHE_TTL_MINUTES = 10;\n\npublic DashboardVO build(Long\
  \ userId) {\n    String k = key(userId);\n    RBucket<String> bucket = redissonClient.getBucket(k);\n\
  \n    String cached = bucket.get();\n    if (cached != null) {\n        try { return\
  \ objectMapper.readValue(cached, DashboardVO.class); }\n        catch (Exception\
  \ e) { log.warn(\"cache parse failed userId={}\", userId, e.getMessage()); }\n \
  \   }\n\n    // Single-flight: serialize simultaneous misses for the same user so\
  \ a\n    // concurrent writer's evict cannot be swallowed by a stale compute().\n\
  \    RLock lock = redissonClient.getLock(\"dashboard:lock:\" + userId);\n    try\
  \ {\n        lock.lock();\n        try { // re-check after acquiring the lock (a\
  \ writer may have evicted meanwhile)\n            cached = bucket.get();\n     \
  \       if (cached != null) {\n                return objectMapper.readValue(cached,\
  \ DashboardVO.class);\n            }\n        } catch (Exception e) { log.warn(\"\
  re-read cache failed userId={}\", userId, e.getMessage()); }\n\n        DashboardVO\
  \ vo = compute(userId);\n        try { bucket.set(objectMapper.writeValueAsString(vo),\
  \ CACHE_TTL_MINUTES, TimeUnit.MINUTES); }\n        catch (Exception e) { log.warn(\"\
  cache write failed userId={}\", userId, e.getMessage()); }\n        return vo;\n\
  \    } finally {\n        if (lock.isHeldByCurrentThread()) { lock.unlock(); }\n\
  \    }\n}\n```\n\n**B. Keep TTL as a backstop, document the contract.** Change the\
  \ comment on `CACHE_TTL_MINUTES` to state: *\"TTL bounds only the read-only staleness\
  \ window; freshness up to writes is guaranteed by evict() on every aggregate-affecting\
  \ mutation. Adding a mutation to interview_result or to a FINISHED interview_session\
  \ MUST call evict().\"*\n\n**C. Close the async-scoring self-inconsistency (optional).**\
  \ Make the dashboard self-consistent at FINISHED time by deriving `trend`/`stats`\
  \ from `interview_result` (which carries `total_score`) rather than from `interview_session.total_score`,\
  \ or update `session.total_score` synchronously in `finishSession` and let the async\
  \ scorer only enrich the report. This removes the radar-vs-stats skew window.\n\n\
  **D. Test the invariant.** Add a test asserting every service that inserts into\
  \ `interview_result` or transitions a session to `FINISHED` (or sets `total_score`)\
  \ invokes `dashboardService.evict(userId)`.\n\n**E. Key hygiene (optional).** Add\
  \ a version/generation suffix (e.g. `dashboard:user:{id}:{gen}`) bumped on eviction,\
  \ so an in-flight stale `SET` (sequence 3B-1, if it ever slips past the lock) writes\
  \ a dead key instead of a live one.\n\nBottom line: **all current mutation paths\
  \ are safe** — the earlier stale bug is fixed. The remaining, worth-fixing risk\
  \ is the cache-miss/evict recompute race (3B-1), plus the inherent async-scoring\
  \ skew (3B-2). TTL alone guarantees only ≤10 min freshness for unchanging data,\
  \ and every future result/session mutation must remember `evict()`."
