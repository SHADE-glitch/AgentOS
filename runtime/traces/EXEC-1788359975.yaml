agent_response: "## Assessment: `KeywordKnowledgeRetriever` fallback (unbounded child-dump)\n\
  \n### 1. Verdict (up front)\n\n**Sev today = Latent (dead code). Seve if wired into\
  \ a prompt = High.** In the current rule-mode path the injected `knowledgeRetriever`\
  \ is a field with **no call site** (`grep knowledgeRetriever\\.` → 0 hits; `InterviewService.java:61`\
  \ only injects it). So the fallback is not currently degrading real prompts. But\
  \ it is a live trap: the exact moment someone wires `retrieveContext()` into scoring/reporting\
  \ (the sibling classes `RagService`/`LegacyAiRagService` already feed such a string\
  \ into prompts), it becomes a correctness + cost bug, not just a style nit.\n\n\
  ### 2. The exact defect (`KeywordKnowledgeRetriever.java:32-73`)\n\nThree compounding\
  \ problems in the `matchCount == 0` branch:\n\n- **Contract violation** — `RagService.retrieveContext`\
  \ (the intended RAG contract, `RagService.java:152,159-160` and `LegacyAiRagService.java:157,165`)\
  \ is: \"无命中时返回空字符串\" (no hit ⇒ empty string). This retriever instead dumps the whole\
  \ topic. The two behaviors disagree, so the codebase has no single \"no-match\"\
  \ contract.\n- **Misleading prefix** — line 48 unconditionally writes `\"以下是与查询相关的知识点（供参考）：\"\
  ` (the following are *related* knowledge points). In the fallback branch that sentence\
  \ is false — the contents are unrelated (no keyword matched). The LLM is told noise\
  \ is relevant.\n- **Unbounded dilution** — lines 63-70 append *all* child points\
  \ (`parentId != null` only, so **roots are dropped but children are all emitted**)\
  \ with **no cap**, joined by `、`. Contrast the hit path, which stops at `matchCount\
  \ >= 5` (line 58). The fallback has no equivalent bound.\n\nAlso note: the fallback\
  \ emits *names only* (no `description`), i.e. the least informative field, for children\
  \ while silently suppressing parent topics — the token budget is spent on low-signal\
  \ identifiers.\n\n### 3. Impact as a Prompt Engineer (if the method is consumed)\n\
  \nTaking the motivating scenario literally — the fallback result is injected as\
  \ `system`/context into an LLM scoring or feedback prompt (compare `InterviewScoringService.buildScoringPrompt`,\
  \ `InterviewScoringService.java:126-138`, which weights `knowledge 知识掌握`):\n\n|\
  \ Impact | Mechanism | Severity |\n|---|---|---|\n| **Context dilution / SNR drop**\
  \ | Every injected point name is irrelevant; as child count `N` grows, relevant-signal\
  \ fraction → 0. LLM attends to recent/longer tokens slot. | Medium–High |\n| **Mislabeling\
  \ ⇒ trust override** | Prefix declares the dump \"related 相关\". A well-instructed\
  \ model treats injected context as ground truth, so it can (a) anchor scoring on\
  \ off-topic keywords and (b) read entity names as evidence the candidate *should*\
  \ have covered them. | High (correctness) |\n| **Token/cost/latency** | Unbounded:\
  \ `N` children ⇒ unbounded prompt size; reduces headroom for the answer, risks context\
  \ overflow on large topics, raises cost/latency per call linearly. | Medium |\n\
  | **Score validity (if used in scoring)** | Inflates/confuses the `knowledge` dimension\
  \ because the model has been primed with many named topics regardless of whether\
  \ the candidate mentioned them. | Medium |\n\n**The misleading prefix is worse than\
  \ the dilution.** Irrelevant-but-honest context is mere noise; irrelevant context\
  \ *labeled* \"related/reference\" is active misinformation that the model will treat\
  \ as authoritative. This is the axis that separated gold from generic in the phase\
  \ rubric (`02-rubric-sheet.md:34`: \"dead-code + misleading prefix + unbounded dilution\"\
  ).\n\n### 4. Blind spots most teams miss\n\n1. **It's dead code today** — shipping\
  \ the fix is cheap *now*; the cost multiplies once wired and real prompts are cached/tuned\
  \ against the bad behavior.\n2. **Parent vs child asymmetry** — dropping parents\
  \ while dumping all children is not \"all knowledge points\"; it produces a structurally\
  \ biased spread (no topic context, only leaves), which reads as a flat name soup\
  \ to the model.\n3. **No interaction with `shouldFinish`/Q&A history** — the retriever\
  \ ignores the current question and past answers, so even a matched branch can inject\
  \ a stale parent topic context.\n\n### 5. Recommended fixes (in priority order)\n\
  \n**Option A — Honest no-match (align to RAG contract):** return `\"\"` when `matchCount\
  \ == 0`. Matches `RagService`. Cheapest, removes the misleading injection entirely.\n\
  \n**Option B — Bounded, correctly-labeled top-K (keep some context):** cap the fallback\
  \ and fix the label.\n\n```java\nString queryLower = query.toLowerCase();\nList<String>\
  \ hits = new ArrayList<>();\nfor (KnowledgePoint p : points) {\n    if (p.getName().toLowerCase().contains(queryLower)\n\
  \            || (p.getDescription() != null\n                && p.getDescription().toLowerCase().contains(queryLower)))\
  \ {\n        hits.add(p.getName() + \"：\" + p.getDescription());\n        if (hits.size()\
  \ >= 5) break;\n    }\n}\nif (hits.isEmpty()) {\n    if (topic == null || topic.isBlank())\
  \ return \"\";\n    List<KnowledgePoint> children = points.stream()\n          \
  \  .filter(p -> p.getParentId() != null).limit(5).toList();\n    if (children.isEmpty())\
  \ return \"\";\n    StringBuilder sb = new StringBuilder();\n    sb.append(\"以下为当前主题[\"\
  ).append(topic).append(\"]的部分子知识点概述（未做精确匹配，仅供主题范围参考，非答案依据）：\\n\");\n    children.forEach(p\
  \ -> sb.append(\"- \").append(p.getName()).append(\"：\").append(p.getDescription()).append(\"\
  \\n\"));\n    return sb.toString();\n}\nreturn String.join(\"\\n\", hits);\n```\n\
  \nKey changes: (1) label states *partial/subject-scope, not match quality*; (2)\
  \ `.limit(5)` (mirror the hit branch ceiling, line 58); (3) **stop passing the parameter-empty\
  \ short-circuit** — currently line 33-35 silently returns `\"\"` when `query` is\
  \ blank but makes no attempt, which contradicts `reuse`; (4) include description\
  \ (or drop entirely) rather than names-only.\n\n**Option C — No fallback, defer\
  \ to question linkage:** since `Question.getKnowledgePointId()` is already attached\
  \ at `saveAiMessage` (`InterviewService.java:107-109`), the *correct* context source\
  \ in rule mode is the linked knowledge point of the current question, not a keyword\
  \ scan of the whole topic. Prefer fetching by `knowledgePointId` over scanning the\
  \ topic when wiring the prompt.\n\n**Priority:** A first (delete the dead risk),\
  \ B if you want graceful degradation, C if you want the *right* source.\n\n### 6.\
  \ Verification\n\n- Confirm the dead-call status: `grep -rn \"knowledgeRetriever\\\
  .\"` across `backend/` → expect 0 call sites today.\n- Once wired, add a guard:\
  \ unit-test `retrieveContext(\"github-diff-whale\", \"Java\")` asserting either\
  \ `\"\"` (Option A) or a ≤5-item, correctly-labeled block (Option B).\n- Enforce\
  \ bounds with the same `5` you already use at line 58, and add a token sanity assert.\n\
  - Re-run the F-NEG rubric (`benchmark-8.2.1.4/02-rubric-sheet.md`) — `AX2 3/3` currently\
  \ holds precisely because the finding named \"dead-code + misleading prefix + unbounded\"\
  \ — the fix must keep honoring that triple rather than resolving only one of the\
  \ three.\n\nWant me to apply Option A (or B) as the actual code change?"
