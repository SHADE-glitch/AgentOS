agent_response: "# Dashboard Aggregate Caching in Redis — Staleness & Mutation-Safety\
  \ Assessment\n\n## 1. How the cache works today\n\n`DashboardService.build()` (`DashboardService.java:52`)\
  \ is classic **cache-aside** over Redisson:\n\n- Key: `dashboard:user:{userId}`\n\
  - On hit → deserialize cached `DashboardVO`\n- On miss → `compute()` reads DB truth,\
  \ serializes, writes with **TTL = 10 min** (`CACHE_TTL_MINUTES`)\n- `evict(userId)`\
  \ deletes the key and is the only invalidation mechanism.\n\nThe aggregated inputs\
  \ (`compute()`, `DashboardService.java:93`) are:\n- **All `interview_result` rows**\
  \ for the user (drives 4-dimension averages, weak points, suggestions).\n- **`interview_session`\
  \ rows with `status='FINISHED'` and `total_score IS NOT NULL`** (drives stats +\
  \ trend).\n\n## 2. When the cached view is stale\n\nA cached view is **stale** when\
  \ it is served even though it no longer reflects the latest *committed* DB state\
  \ affecting these two inputs. Staleness = `served_at − max(last_mutation_commit,\
  \ cache_build_time)`, hardened against the DB.\n\nIt becomes stale under these conditions:\n\
  \n| # | Condition | Stale window |\n|---|-----------|--------------|\n| 1 | **A\
  \ mutation lands without an evict** | Indefinite (up to+including TTL) |\n| 2 |\
  \ **Async/secondary writer with delayed commit** (RabbitMQ scoring) | Until the\
  \ consumer commits *and* evicts |\n| 3 | **Out-of-band DB writes** (admin SQL, migration,\
  \ backfill, bulk fix, another service touching the table) | Until TTL expiry |\n\
  | 4 | **Lost-update race** during concurrent recompute vs. evict | A single partial\
  \ build lifetime |\n| 5 | **Multi-instance / wrong-Redis** writes evict on a different\
  \ connection | Until TTL expiry |\n\nThe TTL (10 min) is therefore the **safety\
  \ backstop**, not the correctness boundary. It bounds worst-case staleness when\
  \ eviction fails or is missed, but it does *not* make a missed evict \"acceptable\"\
  \ in real time — it just guarantees eventual convergence.\n\n## 3. Which mutation\
  \ paths are safe\n\nI traced every write to the two aggregated tables (`resultMapper`\
  \ / `sessionMapper`). Full inventory:\n\n### Safe — eviction-covered writes (mutation\
  \ then `evict`)\n\n| Path | File | Writes | Evict? |\n|------|------|--------|--------|\n\
  | InterviewScoringService.score (AI consumer) | `InterviewScoringService.java:105,110`\
  \ | result insert + session total_score update | ✅ ✅ |\n| LegacyAiScoringService.score\
  \ | `LegacyAiScoringService.java:112,117` | same | ✅ ✅ |\n| RuleBasedScoringService.score\
  \ | `RuleBasedScoringService.java:56,65` | same | ✅ ✅ |\n| InterviewService.answer\
  \ (sync scoring, finish branch) | `InterviewService.java:151` | result insert |\
  \ ✅ |\n| InterviewService.answer (bank-exhausted branch) | `InterviewService.java:168`\
  \ | result insert | ✅ |\n| InterviewService.answerStream (both finish branches)\
  \ | `InterviewService.java:226,243` | result insert | ✅ |\n| **finishSession()**\
  \ (status→FINISHED, finished_at) | `InterviewService.java:344,349` | session FINISHED\
  \ + finished_at | ✅ **always** |\n\nBecause `finishSession()` is the **single funnel**\
  \ for every `FINISHED` transition (including the empty-questionbank edge case in\
  \ `create()` at `InterviewService.java:102`), any termination sets `total_score.finished_at`\
  \ and evicts. This is the critical guarantee: **every terminal state change is eviction-covered.**\n\
  \n### Safe by construction — writes that do *not* affect the aggregate (no evict\
  \ needed, correct as-is)\n\n| Path | Impact |\n|------|--------|\n| `create()` insert\
  \ with `START/ASKING` | Excluded by the `FINISHED` filter |\n| Answer/asking `session.updateById`\
  \ (question_count, current_question) | Not aggregate inputs |\n| `interview_message`\
  \ inserts (question/answer/feedback) | Never aggregated |\n\nThese produce **zero\
  \ staleness** even though they never evict.\n\n### The genuine correctness gap:\
  \ async-scoring window\n\nEven though eviction is correct, the architecture inserts\
  \ a **read-your-own-write gap**:\n\n1. `finishSession()` evicts → cache gone.\n\
  2. The scoring task is queued (`RabbitConfig.SCORING_EXCHANGE`), consumed asynchronously.\n\
  3. Any `build()` in between recomputes from DB *before* the result exists → the\
  \ dashboard temporarily shows the user's most recent interview **absent**.\n4. The\
  \ consumer commits result + total_score, evicts twice (`InterviewScoringService.java:106,111`)\
  \ → next read is correct.\n\nSo the cache is never *wrong* here, but it is *lagging\
  \ and briefly incomplete*. This is the main source of perceived staleness for a\
  \ user who finishes an interview and immediately reloads the dashboard.\n\n## 4.\
  \ Concurrency / ordering hazards worth flagging\n\n- **Redundant double-evict is\
  \ actually load-bearing.** The first evict (right after result insert) and second\
  \ (after total_score update) ensure that if a concurrent `build()` recomputes in\
  \ the gap between the two writes, its partial cache is deleted by the *second* evict.\
  \ Removing either would introduce a real lost-update stall. Keep both.\n- **Evict\
  \ failures are swallowed** (`DashboardService.java:89` logs `warn` and returns).\
  \ If Redis is briefly down during an evict while writes succeed, you get stale-until-TTL.\
  \ Consider logging an error/alert, not just warn.\n- **Resilience:** `bucket.get()`\
  \ in `build()` is **not** wrapped in try/catch (only deserialization is). If Redis\
  \ is unreachable, `/api/dashboard` throws instead of falling back to `compute()`.\
  \ For a read checkpoint this is a 5xx on the whole dashboard due to cache-health.\n\
  \n## 5. Recommendations\n\n**A. Treat TTL as a backstop; size it to the freshness\
  \ SLA.** 10 min is generous for a near-real-time dashboard but fine as a backstop,\
  \ since eviction already covers all in-app mutations. If \"latest score appears\
  \ immediately\" is required, the async window (not TTL) is the blocker — lower TTL\
  \ won't fix it.\n\n**B. Fix the async \"missing latest result\" gap.** Options (pick\
  \ one):\n- Payload the finished session into the scoring message *and* freeze-then-return\
  \ placeholder… (heavy).\n- Simpler: accept eventual consistency but make it *explicit\
  \ and fast* — keep the two evicts, add a background refresh right after `finishSession`\
  \ returns so the post-interview dashboard is warm.\n- Document it as \"reads may\
  \ be up to N seconds behind the last completed interview.\"\n\n**C. Close the recompute-vs-evict\
  \ lost-update window (condition #4).** Tag the cache value with a generation/`builtAt`\
  \ and add a lightweight revalidation guard:\n\n```java\n// in build()\nDashboardVO\
  \ vo = readFromCache(k);\nif (vo != null && !isDirty(userId, vo.builtAt)) return\
  \ vo;   // cheap max(finished_at) check\nreturn recomputeAndCache(userId);\n```\n\
  Even simpler and often enough: since `interview_result.session_id` is UNIQUE and\
  \ only inserted, a **fast dirty-check** is `SELECT MAX(finished_at) FROM interview_session\
  \ WHERE user_id=? AND status='FINISHED' AND finished_at > :builtAt`. That converts\
  \ the 10-min staleness risk into \"stale only if we choose to skip the check,\"\
  \ and lets you *extend* the TTL safely.\n\n**D. Protect against conditions #1/#3\
  \ (future writes, backfills).**\n- If you ever add `update`/`delete` on `interview_result`\
  \ or a direct `status='FINISHED'`/`total_score` write outside `finishSession()`,\
  \ they must call `dashboardService.evict()` too — add a comment/enforcement since\
  \ there are currently no such paths.\n- For backfills/secondary writers, always\
  \ issue `DEL dashboard:user:<id>` (or re-run the dirty-check) as part of the script;\
  \ never rely on TTL.\n- Consider a schema-level invariant: `session_id UNIQUE` is\
  \ your friend (1 result/session → no update path to miss).\n\n**E. Configuration\
  \ recommendations.**\n- Add heartbeat/canary refresh to avoid thundering herd on\
  \ cold expiry under load (many users expiring at once): a `RBatch`/`setIfAbsent`\
  \ refresh with a 1/10th-TTL refresh margin.\n- Optionally capture the TTL/tuning\
  \ in `application-local.yml`:\n\n```yaml\napp:\n  dashboard:\n    cache:\n     \
  \ key-prefix: \"dashboard:user:\"\n      ttl-minutes: 10          # backstop; freshness\
  \ driven by evict + dirty-check\n      refresh-ahead-seconds: 120\n      allow-read-through-on-redis-down:\
  \ true   # build() falls back to compute()\n```\n\nIf you adopt C+E, set `ttl-minutes`\
  \ higher (e.g. 30–60) and rely on the dirty-check + evict for freshness — that gives\
  \ resilience (long default) *and* correctness.\n\n## Summary\n\n- **Staleness is\
  \ driven by the 10-min TTL only when eviction is missed or out-of-band writes occur;\
  \ every in-app mutation path to the two aggregated tables is currently eviction-covered.**\n\
  - **Safe mutation paths:** the three scoring consumers, the two sync answer-finish\
  \ branches, and `finishSession()` (the single funnel for all `FINISHED` transitions).\
  \ Non-terminal writes (create, asking, messages) need no evict.\n- **The real gaps\
  \ to address:** the async-scoring read window (latest interview briefly absent)\
  \ and Redis-down behavior in `build()` — not missing evicts. Recommend a cheap `MAX(finished_at)`\
  \ dirty-check + read-through on Redis failure, keeping the two evict calls as-is."
