agent_response: "All mutation sites audited. Here's my assessment as the Database\
  \ Engineer.\n\n## Overview\n\n`DashboardService` aggregates all of a user's `InterviewResult`\
  \ rows (radar dimensions, weak points, suggestions) and finished `InterviewSession`\
  \ rows (avg/max score, total questions, trend), serializes to `DashboardVO`, and\
  \ caches it as a JSON string in Redis:\n\n- **Key:** `dashboard:user:{userId}` —\
  \ per-user isolation, `DashboardVO.java:48`\n- **TTL:** 10 minutes (`CACHE_TTL_MINUTES`,\
  \ `DashboardService.java:38`)\n- **Pattern:** read-through. On miss it recomputes\
  \ from DB truth and writes; on hit it returns cached JSON (`DashboardService.java:52`–`70`).\
  \ Parse failure on read falls through to recompute (self-healing).\n\n## When is\
  \ the cached view stale?\n\nThe cache is *never intended* to self-expire into correctness\
  \ — TTL is a 10-minute backstop. The contract is **invalidate-on-write**. The view\
  \ is stale only if one of these holds:\n\n1. **A data-affecting mutation committed\
  \ without an accompanying `evict()`** (coverage gap).\n2. **`evict()` failed** (Redis\
  \ unreachable → exception swallowed by `catch` at `DashboardService.java:85`), leaving\
  \ the key to live out its TTL.\n3. **A read recomputed and re-cached data mid-mutation**\
  \ (race; bounded to the mutation window).\n4. **Async scoring consumer down** —\
  \ the session stays uncounted until scoring succeeds, independent of cache.\n\n\
  Key staleness-relevant detail: `compute()` only counts sessions where `status=FINISHED`\
  \ *and* `totalScore is not null` (`DashboardService.java:97`–`100`). Because scoring\
  \ is a **two-phase async write** (`InterviewResult` insert, then `session.totalScore`\
  \ update), the aggregate fluctuates across those two commits — both phases must\
  \ evict.\n\n## Mutation path audit — which are safe?\n\nEvery DB write that feeds\
  \ the aggregate, and its eviction:\n\n| Mutation | Site | Evict? |\n|---|---|---|\n\
  | Sync finish: `resultMapper.insert` | `InterviewService.java:151` | ✅ `152` |\n\
  | Question-pool-exhausted finish | `InterviewService.java:168` | ✅ `169` |\n| Streaming\
  \ finish | `InterviewService.java:226` | ✅ `227` |\n| Streaming pool-exhausted |\
  \ `InterviewService.java:243` | ✅ `244` |\n| Session → `FINISHED` | `InterviewService.java:344`\
  \ (`finishSession`) | ✅ `349` |\n| Rule scoring: result insert | `RuleBasedScoringService.java:56`\
  \ | ✅ `57` |\n| Rule scoring: `setTotalScore`+update | `RuleBasedScoringService.java:65`\
  \ | ✅ `66` |\n| AI scoring: result insert | `InterviewScoringService.java:105` |\
  \ ✅ `106` |\n| AI scoring: `setTotalScore`+update | `InterviewScoringService.java:110`\
  \ | ✅ `111` |\n| Legacy AI scoring: both phases | `LegacyAiScoringService.java:112,117`\
  \ | ✅ `113,118` |\n\nThe non-feeding writes are correctly **not** evicted: `sessionMapper.insert`\
  \ (`START`, new session) and the `ASKING`-state `updateById` calls don't touch anything\
  \ `compute()` reads. `EvaluationService.java:81,261` only mutate the in-memory `result`\
  \ object before the caller inserts + evicts.\n\n**Conclusion: coverage is complete\
  \ and correct.** The two-phase scoring is handled correctly by evicting *after each*\
  \ commit — the transiently-mixed snapshot any competing read caches between apply-1\
  \ and apply-2 is immediately corrected by the second evict (window is milliseconds).\
  \ Distributed-safe: invalidation goes through the shared Redisson client, so multi-instance\
  \ deployments stay consistent (unlike an in-memory local cache).\n\n## Residual\
  \ risks & recommendations\n\n**Risk A — cache stampede (thundering herd).** The\
  \ natural interaction is user finishes interview → multiple dashboard reloads burst\
  \ immediately after `evict()`, all miss and all recompute + unconditionally `set()`.\
  \ There's no single-flight. At small scale it's merely wasted MySQL queries; the\
  \ fix is cheap. Add a per-user build lock:\n\n```java\nprivate DashboardVO computeOnce(Long\
  \ userId) {\n    String k = key(userId);\n    RBucket<String> bucket = redissonClient.getBucket(k);\n\
  \n    RLock lock = redissonClient.getLock(\"dashboard:build:\" + userId);\n    if\
  \ (!lock.tryLock(2, TimeUnit.SECONDS)) {\n        return compute(userId); // fallback:\
  \ don't block the request\n    }\n    try {\n        String cached = bucket.get();\n\
  \        if (cached != null) {\n            return objectMapper.readValue(cached,\
  \ DashboardVO.class);\n        }\n        DashboardVO vo = compute(userId);\n  \
  \      bucket.set(objectMapper.writeValueAsString(vo), CACHE_TTL_MINUTES, TimeUnit.MINUTES);\n\
  \        return vo;\n    } finally {\n        if (lock.isHeldByCurrentThread())\
  \ lock.unlock();\n    }\n}\n```\n\n**Risk B — evict/write non-atomicity.** `evict()`\
  \ and the DB commit aren't transactional; a Redis hiccup between a committed write\
  \ and its `delete()` leaves stale data up to the full TTL. Acceptable here because\
  \ the TTL bounds it to 10 min. If you tighten freshness, route evictions through\
  \ an outbox or an async queue with failure retry; do **not** lower TTL aggressively\
  \ to mask it — low TTL amplifies Risk A. At current scale, keep the 10-min backstop.\n\
  \n**Risk C — schema drift.** A `DashboardVO` field change would deserialize into\
  \ a partially-populated object. Risk is already mitigated: the read path catches\
  \ `Exception` and recomputes (`DashboardService.java:59–60`). Suggest a `@JsonIgnoreProperties(ignoreUnknown=true)`\
  \ / version field if you want stricter control, but not required.\n\n**Risk D —\
  \ async scoring failure is not a cache problem.** `RabbitListener` rethrows `RuntimeException`,\
  \ so a permanently failing consumer requeues indefinitely and the session never\
  \ gets `totalScore` — the dashboard simply never shows it (correct, not stale).\
  \ Bound this with a retry/backoff policy and a dead-letter queue so users aren't\
  \ left with an incomplete report.\n\n## Configuration recommendation\n\nKeep TTL\
  \ as a backstop, keep eviction as the primary mechanism, and add single-flight (Risk\
  \ A). No tuning of the Redisson pool is warranted at this size (`connectionMinimumIdleSize=4`,\
  \ pool 16 is fine). Suggested incremental hardening order:\n\n1. Add the per-user\
  \ build lock (Risk A) — highest value, minimal code.\n2. Keep 10-min TTL as-is.\n\
  3. Optionally route `evict()` through an async retry channel only if you observe\
  \ Redis blips causing visible staleness.\n\nNet assessment: the current design is\
  \ **correct on all current mutation paths**; the only defect is the missing anti-stampede\
  \ guard on rebuild, not a correctness gap."
