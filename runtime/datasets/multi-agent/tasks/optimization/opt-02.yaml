task_id: opt-02
category: optimization
difficulty: easy
description: Optimize a slow MySQL query: analyze the execution plan, propose index and SQL changes, and verify the improvement.
expected_roles: [database-engineer]
evaluation_points:
  - execution plan analysis
  - index and SQL change proposal
  - verification method
baseline_expectation: a single database-engineer is the correct mode; this task is intentionally single-domain. If team formation proposes a team, that itself is a negative evidence point (team inflation, conflict with Phase 4.2 rule R1).
multi_agent_expectation: none — multi-agent is NOT justified for this task. The comparison expects winner: single.
