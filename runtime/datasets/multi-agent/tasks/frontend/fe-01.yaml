task_id: fe-01
category: frontend
difficulty: medium
description: Design the frontend architecture of an admin platform: module structure, routing and permission model, state management, and the API integration contract with the backend.
expected_roles: [frontend-architect, backend-architect, code-reviewer]
evaluation_points:
  - module boundaries and lazy loading
  - permission and routing model
  - state management strategy
  - API contract and error handling conventions
  - reviewability and testing approach
baseline_expectation: a single frontend-architect produces a workable SPA structure but the API contract is usually one-sided and review standards are absent.
multi_agent_expectation: backend-architect co-defines the API contract, code-reviewer defines review gates and standards, and frontend-architect owns the module and state architecture.
