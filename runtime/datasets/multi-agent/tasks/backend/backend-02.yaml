task_id: backend-02
category: backend
difficulty: medium
description: Design a payment system with idempotent payment submission, reconciliation against the channel ledger, and security requirements for sensitive payment data.
expected_roles: [backend-architect, database-engineer, distributed-system, security-engineer]
evaluation_points:
  - idempotency mechanism for payment submission
  - reconciliation flow with the channel
  - ledger data model
  - sensitive data handling and key management
  - failure and retry semantics
baseline_expectation: a single backend-architect covers the happy-path payment flow; idempotency and reconciliation edge cases are usually incomplete and security is treated as an afterthought.
multi_agent_expectation: database-engineer owns the ledger model, distributed-system owns idempotency and exactly-once semantics, security-engineer owns data protection and key management; backend-architect integrates the flows.
