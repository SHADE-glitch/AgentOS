task_id: backend-01
category: backend
difficulty: medium
description: Design an order system with inventory deduction, order state machine, and consistency guarantees between order creation and stock updates.
expected_roles: [backend-architect, database-engineer, distributed-system]
evaluation_points:
  - order state machine definition
  - inventory deduction strategy and consistency level
  - transaction boundary and compensation
  - API contract design
  - retry and idempotency handling
baseline_expectation: a single backend-architect produces a complete CRUD-level design but typically glosses over distributed consistency choices between order and inventory.
multi_agent_expectation: database-engineer specifies the transaction/isolation strategy, distributed-system specifies the consistency and compensation pattern, and backend-architect integrates the state machine and API contracts.
