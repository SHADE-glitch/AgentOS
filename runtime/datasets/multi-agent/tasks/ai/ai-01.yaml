task_id: ai-01
category: ai
difficulty: medium
description: Design a RAG knowledge-base Q&A system for enterprise documents: chunking strategy, embedding and vector-store selection, retrieval quality evaluation, and answer grounding.
expected_roles: [rag-engineer, llm-engineer, database-engineer]
evaluation_points:
  - chunking and indexing strategy
  - embedding model and vector store choice
  - retrieval quality and reranking
  - answer grounding and citation
  - evaluation and feedback loop
baseline_expectation: a single rag-engineer produces a standard RAG pipeline; storage trade-offs and evaluation methodology are usually shallow.
multi_agent_expectation: database-engineer owns the vector-store vs relational trade-off, llm-engineer owns generation and grounding, and rag-engineer owns retrieval strategy and evaluation; together the pipeline is measurably validated.
