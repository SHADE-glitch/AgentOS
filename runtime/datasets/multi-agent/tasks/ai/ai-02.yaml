task_id: ai-02
category: ai
difficulty: medium
description: Design an LLM chatbot with tool calling: tool selection policy, multi-step reasoning flow, prompt design, and an evaluation set for behavior regression.
expected_roles: [llm-engineer, prompt-engineer, agent-engineer]
evaluation_points:
  - tool calling flow and error handling
  - multi-step reasoning and loop control
  - prompt and system message design
  - evaluation set and regression testing
baseline_expectation: a single llm-engineer covers model integration but tool-calling edge cases and the evaluation set are often thin.
multi_agent_expectation: agent-engineer owns the tool-calling workflow and loop control, prompt-engineer owns prompt design and the evaluation set, llm-engineer owns model behavior; the result is a testable agent design.
