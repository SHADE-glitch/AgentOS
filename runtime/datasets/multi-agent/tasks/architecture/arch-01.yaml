task_id: arch-01
category: architecture
difficulty: hard
description: Design a multi-tenant AI SaaS platform with per-tenant data isolation, an AI recommendation feature, and a plugin architecture for third-party integrations.
expected_roles: [system-architect, backend-architect, database-engineer, rag-engineer]
evaluation_points:
  - multi-tenant isolation strategy
  - service boundary design
  - data model and storage layout
  - retrieval/recommendation pipeline design
  - plugin extension mechanism
  - scaling and failure model
baseline_expectation: a single system-architect produces a coherent but broad architecture; tenant isolation and the retrieval pipeline are usually covered at surface level without deep trade-off analysis.
multi_agent_expectation: the team adds a validated data model (database-engineer), a concrete retrieval design with embedding and vector-store choices (rag-engineer), and tenant-scoped service boundaries (backend-architect), integrated by the lead.
