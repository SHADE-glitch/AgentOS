5. **Risk Change**: RT-004 (F-002 payment security failure) — only task where memory changed risk perception without changing decision
6. **No Hypothesis Contamination**: No hypothesis-type memories in pilot set, contamination rate = 0
7. **No Memory-Induced Regression**: All 10 tasks preserved correct decisions. Regression rate = 0

