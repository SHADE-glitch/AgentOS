# Pipeline Validation Execution Schema

## Purpose

Template for recording each Pipeline Validation execution (Memory OFF and Memory ON).

## Schema

```yaml
execution_id: "<uuid>"
task_id: "<RT-XXX>"
mode: "memory_off | memory_on"
execution_order: "first | second"
contamination_risk: "low | medium | high"

task:
  user_request: "<description>"
  domain: "<domain>"
  difficulty: "<easy|medium|hard>"
  expected_skills: ["<role>"]

# --- Memory OFF ---
memory_off:
  router_decision:
    lead_agent: "<role>"
    support_agents: ["<role>"]
    confidence: "<high|ambiguous>"
    fallback_used: true | false
  orchestrator_decision:
    team_formed: true | false
    team_size: <int>
    lead_role: "<role>"
    support_roles: ["<role>"]
    pattern_used: "<pattern_name or null>"
  selected_roles: ["<role>"]
  decision_provenance:
    router_rules: ["<rule>"]
    reason: "<justification>"

# --- Memory ON ---
memory_on:
  retrieved_memories:
    - memory_id: "<id>"
      type: "<type>"
      relevance_score: <0.0-1.0>
      evidence_weight: <0.0-1.0>
      final_score: <0.0-1.0>
      used: true | false
      rejection_reason: "<if rejected>"
  memory_influence:
    type: "none | confirmation | role_added | role_removed | strategy_changed | risk_changed | priority_changed"
    reason: "<explanation>"
  router_decision:
    lead_agent: "<role>"
    support_agents: ["<role>"]
    confidence: "<high|ambiguous>"
    fallback_used: true | false
  orchestrator_decision:
    team_formed: true | false
    team_size: <int>
    lead_role: "<role>"
    support_roles: ["<role>"]
    pattern_used: "<pattern_name or null>"
    anti_pattern_alert: true | false
  selected_roles: ["<role>"]
  decision_provenance:
    memories_considered: <int>
    memories_used: <int>
    memories_rejected: <int>
    router_rules: ["<rule>"]
    reason: "<justification>"

# --- Comparison ---
comparison:
  decision_changed: true | false
  router_changed: true | false
  orchestrator_changed: true | false
  team_changed: true | false
  strategy_changed: true | false
  memory_influence: "<type>"
  regression: true | false
  fallback_required: true | false

# --- Outcome ---
outcome:
  pipeline_correct: true | false
  result: "pipeline_correct | decision_preserved | decision_changed | regression | fallback | error"
  human_feedback: "unknown"
  evidence_level: "benchmark_evaluated"
  notes: "<optional>"
```

## Validation Note

```yaml
_validation:
  type: "pipeline_validation"
  NOT: "real_project_evidence"
  evidence_level: "benchmark_evaluated"
  human_feedback: "unknown"
  caveat: "Pipeline validation exercise. Not real project evidence."
```