  - id: F-003
    finding: inSql userId 拼接存在 SQL 注入风险
    classification: FACT
    file: backend/src/main/java/com/aiview/rag/service/RagService.java
    class: RagService
    method: search
    line_range: 126-128
    evidence: |
      RagService.java:126-128:
        .inSql(KnowledgeChunk::getKbId,
            "SELECT id FROM knowledge_base WHERE user_id = " + userId
                    + " AND deleted = 0")

      userId is a Long parameter concatenated directly into SQL string.
      MyBatis-Plus inSql() does not parameterize the subquery.
      While userId comes from UserContext (internal), defensive coding
      should use parameterized queries.
    severity: MEDIUM
    confidence: HIGH
    mitigation_existing: |
      userId is Long from UserContext, not from user input directly.
      But Long concatenation is still a code smell.

