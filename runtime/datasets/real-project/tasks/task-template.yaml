# Real Project Task Template

# This is a template. Fill in real data only.
# Do NOT create fictional tasks.

task_id: ""                # Unique task identifier, e.g. "PROJ-001-T001"
project_id: ""             # References projects/<project-id>.yaml

task_description: ""       # What was actually done

domain: ""                 # e.g. "Backend", "AI", "Database"
complexity: ""             # easy | medium | hard

actual_context: ""         # Real project context at time of task execution

expected_result: ""        # What was expected before execution
actual_result: ""          # What actually happened

# ── Human Feedback (post-execution) ──
human_feedback: ""         # helpful | neutral | harmful | unknown
feedback_reason: ""        # Why
feedback_reviewer_role: "" # Who reviewed
feedback_timestamp: ""     # ISO8601

# ── Memory Usage ──
memory_used: []            # List of memory_ids used
memory_influence: ""       # none | confirmation | risk_detection | decision_change | strategy_change | role_change
memory_outcome: ""         # helpful | neutral | harmful | unknown

# ── Execution ──
execution_id: ""           # From loop_controller output
trace_id: ""               # From runtime/traces/