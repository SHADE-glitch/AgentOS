# ── Database Audit ──

database_audit:
  tables:
    - name: app_user
      purpose: User accounts
      ai_specific_columns: []
      core_columns: [id, username, password_hash, nickname, avatar, created_at, updated_at, deleted]
      indexes: [PRIMARY(id), UNIQUE(username)]
      action: KEEP

    - name: user_profile
      purpose: User statistics
      ai_specific_columns: []
      core_columns: [id, user_id, skill_profile, weak_topics, interview_count, avg_score, best_score]
      indexes: [PRIMARY(id), UNIQUE(user_id)]
      action: KEEP

    - name: knowledge_point
      purpose: Question bank (topic hierarchy)
      ai_specific_columns: []
      core_columns: [id, parent_id, topic, name, difficulty, description, sort_order]
      indexes: [PRIMARY(id), FK(parent_id)]
      action: KEEP

    - name: question
      purpose: Individual questions
      ai_specific_columns: [source]  # 'AI' values = AI-generated
      core_columns: [id, knowledge_point_id, content, difficulty, usage_count, created_at]
      indexes: [PRIMARY(id), FK(knowledge_point_id)]
      action: KEEP_REFACTOR (remove AI-generated rows, keep SYSTEM)

    - name: interview_session
      purpose: Interview lifecycle
      ai_specific_columns: []
      core_columns: [id, user_id, topic, level, status, current_question_id, question_count, total_score, report, started_at, finished_at, deleted]
      indexes: [PRIMARY(id), FK(user_id)]
      action: KEEP

    - name: interview_message
      purpose: Chat history
      ai_specific_columns: [role]  # 'AI' values
      core_columns: [id, session_id, role, kind, content, knowledge_point_id, scores, created_at]
      indexes: [PRIMARY(id), FK(session_id)]
      action: KEEP (role column preserved for message history)

    - name: interview_result
      purpose: Scored results
      ai_specific_columns: []  # Data is AI-generated but format is generic JSON
      core_columns: [id, session_id, user_id, dimensions, total_score, weak_points, suggestions, created_at]
      indexes: [PRIMARY(id), UNIQUE(session_id), FK(user_id)]
      action: KEEP

    - name: knowledge_base
      purpose: RAG knowledge bases
      ai_specific_columns: [all]  # Entire table is AI-only
      core_columns: []
      indexes: [PRIMARY(id), FK(user_id)]
      action: REMOVE

    - name: knowledge_chunk
      purpose: RAG text chunks with vectors
