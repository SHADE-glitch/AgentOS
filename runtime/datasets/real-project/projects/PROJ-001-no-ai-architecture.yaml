# ── Core Business Flows ──

core_business_flows:
  - flow: User Registration
    steps:
      - POST /api/auth/register
      - AuthService.register()
      - BCrypt password hash
      - JWT token generation
    ai_dependency: none
    status: KEEP

  - flow: User Login
    steps:
      - POST /api/auth/login
      - AuthService.login()
      - BCrypt password verify
      - JWT token generation
    ai_dependency: none
    status: KEEP

  - flow: Topic Listing
    steps:
      - GET /api/topics
      - InterviewService.listTopics()
      - Reads knowledge_point table
      - Groups by topic field
    ai_dependency: none
    status: KEEP

  - flow: Interview Creation
    steps:
      - POST /api/interviews
      - InterviewService.create()
      - Validates topic exists
      - Creates InterviewSession row
      - Initializes Redis state
      - Calls ChatClient for first question (AI)
    ai_dependency: required (question generation)
    status: REFACTOR (needs alternative question source)

  - flow: Answer Submission
    steps:
      - POST /api/interviews/{id}/answer
      - InterviewService.answer()
      - Saves user message
      - Calls retrieveRagContext (RAG)
      - Calls ChatClient for next question/feedback (AI)
      - Updates session state
    ai_dependency: required (question + RAG)
    status: REFACTOR (needs alternative question source)

  - flow: Streaming Answer
    steps:
      - POST /api/interviews/{id}/answer/stream
      - InterviewService.answerStream()
      - SSM streaming via virtual thread
      - Same AI logic as answer()
    ai_dependency: required (question + streaming)
    status: REFACTOR (needs alternative)

  - flow: Interview Scoring
    steps:
      - InterviewService.finishSession()
      - Sends ScoringMessage to RabbitMQ
      - InterviewScoringService.score() (RabbitListener)
      - Calls ChatClient for dimensions + totalScore (AI)
      - Saves InterviewResult
    ai_dependency: required (LLM scoring)
    status: REFACTOR (needs alternative scoring)

  - flow: Dashboard
    steps:
      - GET /api/dashboard
      - DashboardService.build()
      - Reads InterviewResult + InterviewSession
      - Aggregates dimensions, trend, weak points
      - Caches in Redis (10min TTL)
    ai_dependency: none
    status: KEEP (data is still valid without AI)

  - flow: Knowledge Map
    steps:
      - GET /api/knowledge/map
      - KnowledgeMapService.buildMap()
      - Reads knowledge_point + finished sessions
      - Calculates mastery per topic
      - Builds graph nodes + links
    ai_dependency: none
    status: KEEP

  - flow: RAG Knowledge Management
    steps:
      - CRUD on knowledge_bases + chunks
      - Embedding generation via EmbeddingClient
      - Vector search via cosine similarity
    ai_dependency: required (embedding, vector search)
    status: REMOVE

# ── Entity/Domain Model ──

domain_model:
  entities:
    - name: User (app_user)
      type: CORE_BUSINESS
      relationships:
        - has_many: InterviewSession
        - has_one: UserProfile
        - has_many: KnowledgeBase (AI)
      ai_related: false
      action: KEEP

    - name: UserProfile (user_profile)
      type: SUPPORTING
      relationships:
        - belongs_to: User
      ai_related: false
      action: KEEP (contains interview_count, avg_score, weak_topics)

    - name: KnowledgePoint (knowledge_point)
      type: CORE_BUSINESS
      relationships:
        - self_referential: parent_id → id
        - has_many: Question
      ai_related: false
      action: KEEP (question bank hierarchy)

    - name: Question (question)
      type: CORE_BUSINESS
      relationships:
        - belongs_to: KnowledgePoint
      ai_related: partially (source column: SYSTEM/AI)
      action: KEEP (keep SYSTEM questions, drop AI-generated ones)

    - name: InterviewSession (interview_session)
      type: CORE_BUSINESS
      relationships:
        - belongs_to: User
        - has_many: InterviewMessage
        - has_one: InterviewResult
      ai_related: partially (status transitions, RAG context)
      action: KEEP (REFACTOR question generation)

    - name: InterviewMessage (interview_message)
      type: CORE_BUSINESS
      relationships:
        - belongs_to: InterviewSession
      ai_related: partially (role: AI/USER, kind: question/answer/feedback)
      action: KEEP (message history is valuable)

    - name: InterviewResult (interview_result)
      type: CORE_BUSINESS
      relationships:
        - belongs_to: InterviewSession
        - belongs_to: User
      ai_related: partially (dimensions/scores originally AI-generated)
      action: KEEP (data remains valid for dashboard)

    - name: KnowledgeBase (knowledge_base)
      type: AI
      relationships:
        - belongs_to: User
        - has_many: KnowledgeChunk
      ai_related: true
      action: REMOVE

    - name: KnowledgeChunk (knowledge_chunk)
      type: AI
      relationships:
        - belongs_to: KnowledgeBase
      ai_related: true
      action: REMOVE

