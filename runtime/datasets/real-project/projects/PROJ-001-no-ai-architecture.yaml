# ── Rebuild Strategy ──

rebuild_strategies:
  option_a:
    name: Incremental Refactor
    description: "Remove AI modules one by one, refactor InterviewService in-place"
    cost: MEDIUM
    risk: LOW
    migration_difficulty: LOW
    code_reuse: HIGH
    data_migration: "Keep existing schema, drop AI tables"
    testing: "Add tests after each refactor step"
    timeline: "2-3 iterations"

  option_b:
    name: Module Rewrite
    description: "Rewrite interview module cleanly, keep auth/common as-is"
    cost: MEDIUM
    risk: MEDIUM
    migration_difficulty: MEDIUM
    code_reuse: MEDIUM
    data_migration: "Keep existing schema, migrate data if format changes"
    testing: "Write new tests for rewritten module"
    timeline: "3-4 iterations"

  option_c:
    name: Clean Rebuild
    description: "Start new project, migrate only data and proven patterns"
    cost: HIGH
    risk: HIGH
    migration_difficulty: HIGH
    code_reuse: LOW
    data_migration: "Full data migration plan needed"
    testing: "No existing tests, start from scratch"
    timeline: "5+ iterations"

  recommendation: Option A (Incremental Refactor)
  reason: |
    The AI dependency is well-isolated in agent/ai/ and rag/ modules.
    These can be cleanly removed. The InterviewService needs refactoring
    but the core session/message/result entities are reusable.
    auth/ and common/ are completely AI-free.
    Incremental refactor minimizes risk while maximizing code reuse.

# ── Rebuild Phases ──

rebuild_phases:
  - phase: 0
    name: Architecture Freeze
    actions:
      - Finalize this audit
      - Get human approval on KEEP/REMOVE/REWRITE decisions
      - Create git branch for rebuild
    status: CURRENT

  - phase: 1
    name: AI Removal
    actions:
      - Remove agent/ai/ module
      - Remove rag/ module
      - Remove AiProperties.java
      - Remove ollama/ Docker service
      - Remove app.ai section from application.yml
      - Remove knowledge_base + knowledge_chunk from schema.sql
      - Remove AI-related dependencies from pom.xml (if any standalone)
      - Remove RagController from SecurityConfig if needed
    risk: LOW
    dependencies: none

  - phase: 2
    name: Domain Simplification
    actions:
      - Refactor InterviewService to use question bank
      - Implement question selection logic
      - Replace AI scoring with self-evaluation or rule-based
      - Remove or refactor InterviewScoringService
      - Remove answerStream endpoint
      - Decide on RabbitMQ (keep or remove)
    risk: MEDIUM
    dependencies: Phase 1

  - phase: 3
    name: Backend Polish
    actions:
      - Clean up unused imports
      - Verify all remaining endpoints work
      - Add API versioning if desired
      - Update SecurityConfig if needed
    risk: LOW
    dependencies: Phase 2

  - phase: 4
    name: Frontend Refactor
    actions:
      - Remove AI branding from Home.vue
      - Refactor Interview.vue (remove SSE, add question bank display)
      - Add self-evaluation UI
      - Remove streamAnswer from interview.ts
      - Update types.ts if needed
    risk: MEDIUM
    dependencies: Phase 2

  - phase: 5
    name: Database Cleanup
    actions:
      - Drop knowledge_base table
      - Drop knowledge_chunk table
      - Remove AI-generated rows from question table
      - Update schema.sql and data.sql
      - Verify data integrity
    risk: LOW
    dependencies: Phase 1

  - phase: 6
    name: Testing
    actions:
      - Add unit tests for AuthService
      - Add unit tests for InterviewService (new logic)
      - Add integration tests for API endpoints
      - Add frontend component tests
      - Verify dashboard + knowledge map still work
    risk: LOW
    dependencies: Phase 2-5

  - phase: 7
    name: Docker / Deployment
    actions:
      - Remove ollama from docker-compose.yml
      - Remove ollama/ directory
      - Update .env.example (remove AI env vars)
      - Update Dockerfiles if needed
      - Verify docker-compose up works
      - Remove RabbitMQ from docker-compose if not needed
    risk: LOW
    dependencies: Phase 2

# ── Risks ──

highest_risks:
  - risk: "Question bank is insufficient"
    description: "Current question table may be empty (only knowledge_point has seed data). Need to populate questions."
    severity: HIGH
    mitigation: "Seed question table with questions for each knowledge point before Phase 2"

  - risk: "Scoring replacement is unclear"
    description: "Self-evaluation vs rule-based vs rubric-based scoring needs design decision."
    severity: HIGH
    mitigation: "Design scoring approach in Phase 0 before implementation"

  - risk: "Interview state machine may break"
    description: "InterviewStatus enum (START/ASKING/WAITING_ANSWER/EVALUATING/FINISHED) is designed for AI flow."
    severity: MEDIUM
    mitigation: "Simplify state machine for question bank flow"

  - risk: "Redis dependency remains"
    description: "InterviewStateStore uses Redis for state. If Redis is removed, state machine needs redesign."
    severity: MEDIUM
    mitigation: "Keep Redis (already in infrastructure)"

  - risk: "Frontend Interview.vue is complex"
    description: "Heavy SSE streaming logic, needs significant refactoring."
    severity: MEDIUM
    mitigation: "Redesign interview page for question bank flow"

