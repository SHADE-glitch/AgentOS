# ── No-AI Target Architecture ──

target_architecture:
  product_redefinition:
    current_name: "AI 面试陪练与智能反馈平台"
    proposed_name: "面试训练平台"
    target_user: "技术面试备考者"
    core_problem: "需要系统化、可追踪的面试练习，而非依赖 AI 实时对话"
    core_workflow: |
      1. User selects topic + level
      2. System presents questions from question bank
      3. User writes answers
      4. System provides structured self-evaluation or rule-based scoring
      5. Dashboard tracks progress over time
    core_features:
      - User authentication
      - Topic-based question bank browsing
      - Structured interview sessions (question → answer cycle)
      - Self-evaluation or rule-based scoring
      - Progress dashboard (radar, trend, weak points)
      - Knowledge map visualization
    non_ai_value: |
      The product provides structured interview practice
      with a curated question bank and progress tracking.
      Users can practice repeatedly, track their improvement,
      and identify weak areas — all without AI.
    removed_features:
      - AI-generated interview questions
      - AI-generated follow-up questions
      - AI scoring and feedback
      - RAG knowledge retrieval
      - Knowledge base management with embedding
      - Streaming AI responses

  target_components:
    frontend:
      type: Vue 3 SPA
      pages:
        - Login / Register
        - Home (topic selection, session start)
        - Interview (question display, answer input, result)
        - Dashboard (analytics)
        - KnowledgeMap (visualization)
      removed: AI streaming, SSE, AI branding text

    api:
      type: REST (Spring Boot)
      controllers:
        - AuthController (KEEP)
        - InterviewController (REFACTOR)
        - DashboardController (KEEP)
        - KnowledgeController (KEEP)
        - HealthController (KEEP)
      removed:
        - RagController (REMOVE)
        - agent/ai/* (REMOVE)
        - AiProperties (REMOVE)

    domain:
      type: Spring Boot Service Layer
      services:
        - AuthService (KEEP)
        - InterviewService (REFACTOR — remove AI, add question bank logic)
        - DashboardService (KEEP)
        - KnowledgeMapService (KEEP)
      removed:
        - RagService (REMOVE)
        - InterviewScoringService (REMOVE or REFACTOR to rule-based)
        - InterviewStateStore (REFACTOR if scoring changes)

    data:
      type: MySQL + MyBatis-Plus
      tables:
        KEEP:
          - app_user
          - user_profile
          - knowledge_point
          - question (remove AI rows)
          - interview_session
          - interview_message
          - interview_result
        REMOVE:
          - knowledge_base
          - knowledge_chunk

    infrastructure:
      services:
        - mysql (KEEP)
        - redis (KEEP — needed for interview state)
        - rabbitmq (CONDITIONAL — only if async scoring preserved)
        - backend (KEEP)
        - frontend (KEEP)
      removed:
        - ollama (REMOVE)

  redis_decision:
    keep: YES
    reason: "InterviewStateStore uses Redis for session state, DashboardService uses Redis for caching. Essential for interview state machine."

  rabbitmq_decision:
    keep: CONDITIONAL
    reason: "Only used for async scoring dispatch. If scoring becomes synchronous or rule-based, RabbitMQ is unnecessary. Remove if no async processing remains."

