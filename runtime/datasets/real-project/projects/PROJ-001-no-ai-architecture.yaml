# PROJ-001 No-AI Architecture Audit — Data File
# Phase 5.9.3 — READ ONLY
# Generated: 2026-08-31

project_id: PROJ-001
project_name: aiview
project_path: /home/shade/Public/test
audit_type: no_ai_rebuild

# ── Project Structure ──

project_structure:
  backend:
    framework: Spring Boot 3.3.5
    java: 21
    persistence: MyBatis-Plus 3.5.9
    auth: Spring Security + JWT (jjwt 0.12.6)
    messaging: RabbitMQ (AMQP)
    cache: Redis (Redisson 3.35.0)
    database: MySQL 8
    modules:
      - agent/ai          # AI client interfaces + implementations
      - auth              # Authentication
      - common            # Shared utilities
      - config            # Configuration
      - interview         # Core interview domain
      - rag               # RAG knowledge retrieval
  frontend:
    framework: Vue 3.5 + TypeScript
    build: Vite 6
    ui: TailwindCSS 4
    charts: ECharts 5.6
    state: Pinia 2.3
    routing: Vue Router 4.5
    data: "@tanstack/vue-query 5.62"
    markdown: marked 15
    pages:
      - Home
      - Interview
      - Dashboard
      - KnowledgeMap
      - Login
      - Register
  infrastructure:
    services:
      - mysql:8
      - redis:7-alpine
      - rabbitmq:3-management
      - ollama:  # Built from ./ollama/Dockerfile
        purpose: "Local LLM serving (qwen2.5:3b, nomic-embed-text)"
        ai_only: true
      - backend:  # Spring Boot app
      - frontend:  # Vite dev server

# ── Backend Module Map ──

backend_modules:
  - module: agent/ai
    responsibility: "AI provider abstraction (Chat, Embedding)"
    key_classes:
      - ChatClient.java
      - EmbeddingClient.java
      - OpenAiCompatibleChatClient.java
      - OpenAiCompatibleEmbeddingClient.java
      - ChatMessage.java
      - ChatRequest.java
      - ChatResponse.java
      - ChatTool.java
      - ToolCall.java
    dependencies:
      - config/AiProperties
      - Spring Web (RestClient)
    depends_on: []
    used_by:
      - interview/InterviewService
      - interview/InterviewScoringService
      - rag/RagService
    ai_related: true
    business_criticality: AI
    classification: AI

  - module: auth
    responsibility: "User registration, login, JWT authentication"
    key_classes:
      - AuthController.java
      - AuthService.java
      - User.java
      - UserProfile.java
      - AuthUser.java
      - JwtUtil.java
      - JwtAuthenticationFilter.java
    dependencies:
      - common/UserContext
      - Spring Security
    depends_on: []
    used_by: [all]
    ai_related: false
    business_criticality: CORE_BUSINESS

  - module: common
    responsibility: "Shared utilities, exception handling, health check"
    key_classes:
      - BizException.java
      - GlobalExceptionHandler.java
      - Result.java
      - ResultCode.java
      - UserContext.java
      - HealthController.java
    dependencies: []
    depends_on: []
    used_by: [all]
    ai_related: false
    business_criticality: INFRASTRUCTURE

  - module: config
    responsibility: "Application configuration, infrastructure wiring"
    key_classes:
      - AiProperties.java          # AI provider config
      - SecurityConfig.java        # Spring Security
      - RabbitConfig.java          # RabbitMQ queues
      - RedissonConfig.java        # Redis client
      - MybatisPlusConfig.java     # MyBatis
      - MybatisMetaHandler.java    # Auto-fill
    ai_related: partially (AiProperties)
    business_criticality: INFRASTRUCTURE

  - module: interview
    responsibility: "Interview session lifecycle, scoring, dashboard, knowledge map"
    key_classes:
      - InterviewService.java         # AI-dependent (question gen, RAG)
      - InterviewScoringService.java  # AI-dependent (LLM scoring)
      - DashboardService.java         # AI-free (DB aggregation)
      - KnowledgeMapService.java      # AI-free (DB reads + calculations)
      - InterviewStateStore.java      # Redis state
      - InterviewStatus.java          # State enum
      - InterviewSession.java         # Entity
      - InterviewMessage.java         # Entity
      - InterviewResult.java          # Entity
      - KnowledgePoint.java           # Entity (seed data)
    dependencies:
      - agent/ai (InterviewService, InterviewScoringService)
      - rag/RagService (InterviewService)
      - config/RabbitConfig (InterviewService → InterviewScoringService)
      - config/RedissonConfig (InterviewStateStore, DashboardService)
    depends_on: [agent/ai, rag, config]
    used_by: [frontend]
    ai_related: partially (InterviewService, InterviewScoringService)
    business_criticality: CORE_BUSINESS

  - module: rag
    responsibility: "RAG knowledge retrieval with vector embedding search"
    key_classes:
      - RagService.java
      - RagController.java
      - KnowledgeBase.java
      - KnowledgeChunk.java
      - RagDtos.java
      - KnowledgeBaseMapper.java
      - KnowledgeChunkMapper.java
    dependencies:
      - agent/ai/EmbeddingClient
    depends_on: [agent/ai]
    used_by:
      - interview/InterviewService (retrieveRagContext)
    ai_related: true
    business_criticality: AI

