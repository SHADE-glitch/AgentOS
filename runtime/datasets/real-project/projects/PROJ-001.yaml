# Real Project Profile — aiview
# Phase 5.9.1 — Real Project Onboarding
# Onboarded: 2026-08-31

project_id: PROJ-001
project_name: "aiview — AI 面试陪练与智能反馈平台"
description: |
  全栈 AI 面试练习系统。用户选择技术主题和难度级别后，
  由 AI 面试官进行实时问答，并通过四维评分模型生成能力报告。
  包含知识图谱、Dashboard 数据分析、RAG 知识库检索等模块。

repository_path: /home/shade/Public/test
repository_remote: origin/main
latest_commit: 56788e5 ("Web 应用")

# ── Technology Stack ──

technology_stack:
  language: Java 21
  framework: Spring Boot 3.3.5
  orm: MyBatis Plus 3.5.9
  database: MySQL 8
  cache: Redis 7 (Redisson 3.35.0)
  message_queue: RabbitMQ 3
  ai: |
    OpenAI Compatible ChatClient (DeepSeek / OpenAI / Ollama)
    Embedding (OpenAI / Ollama local)
    Tool calling / Function calling
  security: Spring Security + JWT (jjwt 0.12.6)
  frontend:
    framework: Vue 3.5 + TypeScript 5.7
    build: Vite 6
    state: Pinia 2.3
    router: Vue Router 4.5
    ui: Tailwind CSS 4
    charts: ECharts 5.6
    data: TanStack Vue Query 5.62
    markdown: marked 15
  deployment: Docker Compose

# ── Architecture ──

architecture: Monolith
modules:
  - name: agent/ai
    description: OpenAI Compatible ChatClient, EmbeddingClient, Tool calling
  - name: auth
    description: JWT 双 token 认证, Spring Security, 用户注册/登录
  - name: interview
    description: 面试会话管理, 状态机, AI 评分, Dashboard 数据分析
  - name: rag
    description: 知识库管理, 文本分块, 向量检索, 知识库问答
  - name: common
    description: 异常处理, 统一响应, 用户上下文

dependencies:
  internal: []
  external:
    - DeepSeek API (chat)
    - OpenAI API (chat + embedding)
    - Ollama (local chat + embedding)

# ── Infrastructure ──

infrastructure:
  services:
    - mysql:8 (aiview-mysql)
    - redis:7-alpine (aiview-redis)
    - rabbitmq:3-management (aiview-rabbitmq)
    - ollama (aiview-ollama, local models)
  ports:
    backend: 8080
    frontend: 5173 (dev)
    mysql: 3306
    redis: 6379
    rabbitmq: 5672/15672
    ollama: 11434

# ── Constraints ──

constraints:
  - JWT access token 2h, refresh token 7d
  - Redis 面试状态 TTL 24h
  - Dashboard 数据 Redis 缓存 TTL 5min
  - AI 评分通过 RabbitMQ 异步消费，避免阻塞面试流
  - RAG 分块大小 500 字符，重叠 50 字符

# ── Current Stage ──

current_stage: active_development
development_phases:
  - Phase 1: 项目初始化 (Docker Compose 骨架)
  - Phase 2: 登录/用户系统 (JWT + 前端认证)
  - Phase 3: AI 面试官基础版 (ChatClient + 问答循环)
  - Phase 4: AI 面试官流式输出 (SSE 打字机)
  - Phase 5: 面试状态机 (tool calling + Redis + 分布式锁)
  - Phase 6: AI 评分 (四维评分 + RabbitMQ 异步)
  - Phase 7: 知识图谱 (ECharts 力导向图)
  - Phase 8: 数据分析 Dashboard (雷达图/趋势/Redis 缓存)
  - Phase 9 (current): Web 应用整体优化

onboarded_at: "2026-08-31T00:00:00+08:00"