# Router Rules — Phase 7.1
# Single source of truth for Agent OS routing rules.
# Extracted from agent_router.py and retrieval_adapter.py,
# aligned with skills/meta/agent-router/SKILL.md.
#
# Schema version: 1.0
# Last updated: 2026-09-01

# ── Intent Classification ─────────────────────────────────────────
# Ordered by priority — first match wins.
# NOTE: review, research, learning MUST come before architecture
# because "方案", "评审", "设计" overlap with architecture's broad patterns.
intent_rules:
  - name: debug
    pattern: "debug|bug|修复|fix|异常|error|报错|crash|失败"
  - name: optimization
    pattern: "优化|slow|慢|性能|performance|调优|benchmark|profiling|加速"
  - name: security
    pattern: "安全|security|漏洞|攻击|加密|认证|鉴权|权限|PCI|OAuth|JWT|token"
  - name: testing
    pattern: "测试|test|用例|coverage|QA|单测|集成测试"
  - name: deployment
    pattern: "部署|deploy|发布|上线|release|CI/CD|容器化|dockerize"
  - name: review
    pattern: "review|审查|检查|评审|code review|\\bPR\\b|检查代码"
  - name: research
    pattern: "研究|调研|对比|选型|research|compare|分析"
  - name: learning
    pattern: "学习|解释|说明|什么是|如何|怎么|what is|how to|explain|教程|陪练|mentor|辅导|面试|项目指导|训练|上手|练习|提升|看懂|不懂|为什么|怎样|不会|想了解|不知道|面试准备|准备.*面试|面试.*准备"
  - name: data
    pattern: "数据库|database|SQL|query|查询|索引|index|schema|迁移|migration|ETL"
  - name: devops
    pattern: "Docker|容器|k8s|Kubernetes|运维|监控|logging|日志|CI/CD|pipeline"
  - name: architecture
    pattern: "架构|architect|系统设计|设计模式|DDD|重构|refactor|方案|设计"
  - name: coding
    pattern: "实现|开发|写|创建|添加|新增|implement|create|add|write|build|生成"

# ── Domain Classification ─────────────────────────────────────────
# Multi-match — all matching domains are returned.
domain_rules:
  - name: frontend
    pattern: "前端|frontend|Vite|React|Vue|TypeScript|CSS|UI|页面|组件|component"
  - name: backend
    pattern: "API|后端|backend|Spring|Java|REST|接口|Controller|Service|@Service|@Controller|微服务|JVM|订单"
  - name: database
    pattern: "MySQL|SQL|数据库|database|慢查询|索引|index|schema|DDL|连接池|PostgreSQL|Redis"
  - name: security
    pattern: "安全|security|PCI|DSS|TLS|AES|加密|encrypt|RBAC|认证|鉴权|OAuth|JWT|token|password"
  - name: distributed
    pattern: "分布式|distributed|高并发|concurrency|秒杀|微服务|microservice|Saga|多租户|multi.tenant|消息队列|RabbitMQ|Kafka|拆分"
  - name: ai
    pattern: "RAG|LLM|向量|vector|embedding|检索|retrieval|rerank|chunk|prompt|Agent|tool.calling|MCP|AI"
  - name: devops
    pattern: "Docker|部署|deploy|CI/CD|容器|container|k8s|Kubernetes|镜像|helm|terraform|构建"
  - name: architecture
    pattern: "架构|architect|系统设计|设计模式|pattern|领域驱动|DDD|事件驱动|EDA|扩容|熔断|缓存|日志系统|技术方案|服务拆分"
  - name: testing
    pattern: "测试|test|用例|coverage|QA|单测|集成测试|integration test|unit test"
  - name: data
    pattern: "数据|data|ETL|数据仓库|data warehouse|大数据|spark|hadoop"

# ── Skill Category Map ────────────────────────────────────────────
# Domain → candidate skills.
skill_category_map:
  backend:      ["backend-architect"]
  frontend:     ["frontend-architect", "frontend-performance"]
  database:     ["database-engineer"]
  security:     ["security-engineer"]
  distributed:  ["system-architect"]
  ai:           ["rag-engineer", "llm-engineer", "ai-engineer", "prompt-engineer", "agent-engineer"]
  devops:       ["devops-engineer"]
  architecture: ["system-architect", "technical-reviewer"]
  testing:      ["testing-engineer", "code-reviewer"]
  data:         ["database-engineer"]

# ── Intent → Skill Priority ───────────────────────────────────────
# For each intent, ordered list of preferred skills (first = lead).
intent_skill_priority:
  debug:         ["security-engineer", "code-reviewer", "backend-architect"]
  optimization:  ["database-engineer", "backend-architect", "frontend-performance"]
  coding:        ["backend-architect", "frontend-architect", "system-architect"]
  architecture:  ["system-architect", "technical-reviewer"]
  review:        ["system-architect", "prompt-engineer", "technical-reviewer", "code-reviewer"]
  security:      ["security-engineer", "code-reviewer"]
  data:          ["database-engineer"]
  devops:        ["devops-engineer"]
  testing:       ["testing-engineer", "code-reviewer"]
  research:      ["system-architect", "technical-reviewer"]
  learning:      ["learning-strategist", "project-mentor", "interview-coach"]
  deployment:    ["devops-engineer", "system-architect"]

# ── Skill Keyword Hints ───────────────────────────────────────────
# When multiple skills exist in a domain, use keyword hints to select
# the most specific lead skill for the task.
skill_keyword_hints:
  llm-engineer:         ["LLM", "大模型", "chatbot", "fine.tune"]
  rag-engineer:         ["RAG", "检索", "embedding", "vector", "语义", "知识库", "检索增强"]
  ai-engineer:          ["AI", "模型", "model", "推理", "inference"]
  prompt-engineer:      ["prompt", "Prompt", "提示词", "提示工程", "编码助手", "方案评审"]
  agent-engineer:       ["Agent", "agent", "MCP", "工作流", "workflow", "工具调用"]
  frontend-performance: ["性能", "排查", "优化", "加载", "首屏", "LCP", "FID", "lighthouse", "bundle", "渲染", "布局"]
  frontend-architect:   ["架构", "设计", "脚手架", "组件", "工程化", "封装", "边界", "错误"]
  code-reviewer:        ["review", "审查", "PR", "代码检查", "代码审查", "前端.*审查", "审查.*前端"]
  technical-reviewer:   ["评审", "技术方案", "技术评审", "方案评审", "架构设计评审"]
  interview-coach:      ["面试", "面试准备", "面试题", "面经"]
  project-mentor:       ["陪练", "不懂", "为什么", "怎样", "看懂", "实践", "理解"]
  system-architect:     ["系统设计", "架构设计", "日志系统", "扩容", "熔断", "缓存架构", "消息队列", "高并发", "服务拆分"]
  learning-strategist:  ["路线", "规划", "提升", "学习", "怎么做", "想了解", "想做", "练习"]

# ── Difficulty Classification ─────────────────────────────────────
difficulty_rules:
  - name: easy
    pattern: "简单|simple|easy|基础|basic|单个|single|简单查询|慢查询"
  - name: hard
    pattern: "复杂|complex|高并发|分布式|distributed|跨领域|cross.domain|多租户|multi.tenant|秒杀|seckill|系统设计|架构"

