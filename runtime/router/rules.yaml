  - name: api
    pattern: "API|接口"
  - name: spring
    pattern: "Spring|spring"
  - name: java
    pattern: "Java|java"
  - name: auth
    pattern: "认证|鉴权|OAuth|JWT|RBAC"
  - name: vite
    pattern: "Vite|vite"
  - name: react
    pattern: "React|react"
  - name: typescript
    pattern: "TypeScript|typescript"
  - name: distributed
    pattern: "分布式|distributed"
  - name: high-concurrency
    pattern: "高并发|concurrency|seckill|秒杀"
  - name: multi-tenant
    pattern: "多租户|multi.tenant"
  - name: rag
    pattern: "RAG|rag"
  - name: vector
    pattern: "向量|vector|embedding"
  - name: llm
