# ── Role Mapping (for retrieval adapter compatibility) ────────────
role_rules:
  - name: database-engineer
    pattern: "MySQL|SQL|数据库|database|慢查询|索引|index"
  - name: backend-architect
    pattern: "API|后端|backend|Spring|Java|REST|接口"
  - name: frontend-architect
    pattern: "前端|frontend|Vite|React|Vue|TypeScript|UI|页面"
  - name: security-engineer
    pattern: "安全|security|PCI|DSS|TLS|加密|encrypt|RBAC|OAuth"
  - name: system-architect
    pattern: "架构|architect|分布式|distributed|系统设计|高并发|seckill|秒杀|微服务"
  - name: rag-engineer
    pattern: "RAG|向量|vector|embedding|检索|retrieval|rerank"
  - name: llm-engineer
    pattern: "LLM|Agent|tool.calling|prompt|agent"
  - name: devops-engineer
    pattern: "Docker|部署|deploy|CI/CD|容器|container|k8s|Kubernetes"

# ── Fallback Configuration ────────────────────────────────────────
fallback:
  default_intent: "coding"
  default_domain: "backend"
  default_lead_skill: "backend-architect"
  default_confidence: "low"
  default_difficulty: "medium"

# ── Confidence Heuristics ─────────────────────────────────────────
confidence:
  high_conditions:
    - "Single domain match"
    - "Domain has direct skill mapping"
  medium_conditions:
    - "Two domains matched"
  low_conditions:
    - "Three or more domains matched"
    - "No domain matched (fallback)"