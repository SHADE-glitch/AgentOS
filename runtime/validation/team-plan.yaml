## Objective

Diagnose and fix runtime bugs in the AI Interview Platform causing:
1. Session resume restoring stale/duplicated state
2. Retries/timeout exposing wrong question set or inconsistent progress
3. Interview results recorded twice or with mismatched score metadata
4. User role/identity checks occasionally inconsistent

## Team Composition

| Role | Agent Type | Domain | Responsibility |
|------|-----------|--------|----------------|
| backend-architect | Lead | backend | Fix session state rehydration, answer idempotency, orchestrate cross-domain fixes |
| database-engineer | Support | database | Add unique constraint on interview_result, fix data model consistency |
| distributed-system | Support | distributed | Fix RabbitMQ double-consumer, add scoring idempotency check |
| security-engineer | Support | security | Add token revocation mechanism, fix auth-state consistency |
| code-reviewer | Review | engineering | Final review of all fixes for correctness and completeness |

