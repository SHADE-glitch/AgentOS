## Risk Assessment

| Risk | Mitigation |
|------|-----------|
| Redis state rehydration may require DB schema change | Validate currentQuestionId against message history without schema change |
| Unique constraint on interview_result may conflict with async scoring race | Use INSERT ... ON DUPLICATE KEY UPDATE or check-before-insert pattern |
| Token revocation adds Redis dependency to auth path | Keep revocation list TTL-aligned with refresh token expiry (7 days) |
| InterviewScoringService removal may break AI mode | Gate it with @ConditionalOnProperty instead of removing |

