# Task Cards — RV-2026-09-01-001
# Runtime Diagnosis of Interview Session Drift and Auth-State Corruption

task_cards:
  - task_id: TC-001
    owner: backend-architect
    role: Backend Architect
    objective: |
      Fix session state rehydration from DB after Redis expiry. When InterviewStateStore
      reads from Redis and the key has expired (24h TTL), the fallback rehydration from
      DB may produce stale currentQuestionId. Validate currentQuestionId against the
      actual message history before accepting the rehydrated state.
    input:
      - InterviewStateStore.java (Redis state read/write)
      - InterviewService.java (requireAsking method, answer flow)
      - InterviewSession entity (DB schema)
      - InterviewMessage entity (DB schema)
    expected_output: |
      Modified InterviewService.java with rehydration validation logic.
      Modified InterviewStateStore.java with optional consistency check.
    dependencies: []
    status: Created
    quality_criteria:
      - "currentQuestionId validated against message history on rehydration"
      - "No false INTERVIEW_STATE_ERROR on valid rehydration"
      - "Existing interview flow behavior preserved for non-expired Redis states"
    bug_id: BUG-001
    affected_files:
      - /home/shade/Public/test/backend/src/main/java/com/aiview/interview/service/InterviewService.java
      - /home/shade/Public/test/backend/src/main/java/com/aiview/interview/service/InterviewStateStore.java

  - task_id: TC-002
    owner: database-engineer
    role: Database Engineer
    objective: |
      Add a unique constraint on interview_result(session_id) to prevent duplicate
      scoring results. The current schema allows multiple InterviewResult rows for
      the same session, which causes mismatched score metadata.
    input:
      - InterviewResult entity (interview_result table)
      - InterviewResultMapper.java
      - RuleBasedScoringService.java (insert logic)
      - InterviewScoringService.java (insert logic)
    expected_output: |
      SQL migration or schema change adding UNIQUE constraint on session_id.
      Modified scoring services to handle constraint violations gracefully.
    dependencies: []
    status: Created
    quality_criteria:
      - "UNIQUE constraint on interview_result.session_id"
      - "Scoring services handle DuplicateKeyException gracefully"
      - "No data loss on existing duplicate rows (migration handles cleanup)"
    bug_id: BUG-003
    affected_files:
      - /home/shade/Public/test/backend/src/main/java/com/aiview/interview/entity/InterviewResult.java
      - /home/shade/Public/test/backend/src/main/java/com/aiview/interview/service/RuleBasedScoringService.java
      - /home/shade/Public/test/backend/src/main/java/com/aiview/interview/service/InterviewScoringService.java

  - task_id: TC-003
    owner: distributed-system
    role: Distributed System Engineer
    objective: |
      Fix the double-consumer issue on the aiview.interview.scoring queue. Add
      @ConditionalOnProperty to InterviewScoringService so it does not coexist with
      RuleBasedScoringService. Add idempotency check (SELECT before INSERT) in the
      scoring consumer to prevent duplicate InterviewResult rows on message redelivery.
    input:
      - InterviewScoringService.java (missing @ConditionalOnProperty)
      - RuleBasedScoringService.java (insert logic)
      - RabbitConfig.java (exchange/queue config)
      - ScoringMessage record definition
    expected_output: |
      Modified InterviewScoringService.java with @ConditionalOnProperty.
      Modified scoring consumer with check-before-insert idempotency.
    dependencies: []
    status: Created
    quality_criteria:
      - "InterviewScoringService has @ConditionalOnProperty(name='app.interview.mode', havingValue='ai')"
      - "Only one scoring consumer active at a time in any mode"
      - "Scoring consumer checks for existing result before insert"
      - "Duplicate message delivery does not create duplicate rows"
    bug_id: BUG-003+BUG-005
    affected_files:
      - /home/shade/Public/test/backend/src/main/java/com/aiview/interview/service/InterviewScoringService.java
      - /home/shade/Public/test/backend/src/main/java/com/aiview/interview/service/RuleBasedScoringService.java
      - /home/shade/Public/test/backend/src/main/java/com/aiview/config/RabbitConfig.java

  - task_id: TC-004
    owner: security-engineer
    role: Security Engineer
    objective: |
      Add refresh token revocation mechanism. When a refresh token is used to obtain
      a new token pair, the old refresh token should be invalidated. Store revoked
      token identifiers in Redis with TTL aligned to refresh token expiry (7 days).
      Add token family tracking to detect refresh token reuse attacks.
    input:
      - AuthService.java (refresh method)
      - JwtUtil.java (token creation/parsing)
      - JwtAuthenticationFilter.java (token validation)
      - RedissonConfig.java (Redis client)
      - SecurityConfig.java (filter chain)
    expected_output: |
      Modified AuthService.java with token revocation on refresh.
      Modified JwtUtil.java with token family claim.
      Modified JwtAuthenticationFilter.java to check revocation list.
    dependencies: []
    status: Created
    quality_criteria:
      - "Refresh token revocation on successful use"
      - "Revoked token check in JwtAuthenticationFilter"
      - "Token family tracking for reuse detection"
      - "Redis TTL aligned with refresh token expiry"
      - "No performance regression on auth filter (Redis lookup is O(1))"
    bug_id: BUG-004
    affected_files:
      - /home/shade/Public/test/backend/src/main/java/com/aiview/auth/service/AuthService.java
      - /home/shade/Public/test/backend/src/main/java/com/aiview/auth/security/JwtUtil.java
      - /home/shade/Public/test/backend/src/main/java/com/aiview/auth/security/JwtAuthenticationFilter.java

  - task_id: TC-005
    owner: backend-architect
    role: Backend Architect
    objective: |
      Add idempotency key support for answer submission. Accept an optional
      Idempotency-Key header or request field. Store the key in Redis with a short
      TTL (e.g., 5 minutes) to deduplicate retries. If a duplicate key is detected,
      return the previously saved response instead of creating a new InterviewMessage.
    input:
      - InterviewController.java (answer endpoint)
      - InterviewService.java (answer method)
      - InterviewStateStore.java (Redis patterns)
    expected_output: |
      Modified InterviewController.java accepting Idempotency-Key header.
      Modified InterviewService.java with deduplication logic.
    dependencies: [TC-001, TC-002, TC-003]
    status: Created
    quality_criteria:
      - "Idempotency-Key header accepted and validated"
      - "Duplicate key returns previous response without new DB write"
      - "TTL-based expiry for idempotency keys (5 min)"
      - "No impact on first-time submissions"
    bug_id: BUG-002
    affected_files:
      - /home/shade/Public/test/backend/src/main/java/com/aiview/interview/controller/InterviewController.java
      - /home/shade/Public/test/backend/src/main/java/com/aiview/interview/service/InterviewService.java

