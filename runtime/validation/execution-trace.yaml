  - phase: root_cause_analysis
    timestamp: "2026-09-01T00:01:00Z"
    bugs_identified:
      - id: BUG-001
        title: "Session state rehydration from DB after Redis expiry produces stale currentQuestionId"
        severity: high
        root_cause: |
          InterviewStateStore uses Redis with 24h TTL as the single source of truth.
          If Redis key expires but the session persists in DB, rehydration reads stale
          DB state. The DB stores questionCount and currentQuestionId but these may not
          reflect the actual last-asked question if state diverged. No validation of
          currentQuestionId against message history occurs during rehydration.
        affected_files:
          - InterviewStateStore.java
          - InterviewService.java (requireAsking method)

      - id: BUG-002
        title: "Answer submission is not idempotent — retries create duplicate InterviewMessage rows"
        severity: high
        root_cause: |
          No request-level idempotency key exists for answer submissions. If a user retries
          a request (e.g., network timeout), the same answer is saved as two separate
          InterviewMessage rows. This inflates questionCount and changes askedQuestionIds,
          potentially altering the next question selection.
        affected_files:
          - InterviewService.java (answer/answerStream methods)

      - id: BUG-003
        title: "RabbitMQ scoring message processed twice — duplicate InterviewResult rows"
        severity: high
        root_cause: |
          RuleBasedScoringService.score() calls resultMapper.insert(result) unconditionally
          without checking for an existing result. If the message is redelivered or if both
          InterviewScoringService (no @ConditionalOnProperty) and RuleBasedScoringService
          are active, duplicate InterviewResult rows are inserted. The
          InterviewScoringService has NO @ConditionalOnProperty, so it could be active
          alongside RuleBasedScoringService in rule mode.
        affected_files:
          - RuleBasedScoringService.java
          - InterviewScoringService.java

      - id: BUG-004
        title: "No token revocation — old refresh tokens remain valid for 7 days"
        severity: medium
        root_cause: |
          When a refresh token is used, a new pair is issued but the old one is not revoked.
          No token family or rotation tracking exists. No Redis-based revocation list.
          A compromised refresh token can be used repeatedly indefinitely within the 7-day
          window, each use generating another valid refresh token.
        affected_files:
          - AuthService.java (refresh method)
          - JwtAuthenticationFilter.java

      - id: BUG-005
        title: "InterviewScoringService lacks @ConditionalOnProperty — double consumer registration"
        severity: high
        root_cause: |
          InterviewScoringService listens on aiview.interview.scoring queue but has no
          @ConditionalOnProperty annotation. In rule mode (default), both
          InterviewScoringService and RuleBasedScoringService are active Spring beans
          consuming from the same queue. This causes every scoring message to be processed
          twice, inserting duplicate InterviewResult rows.
        affected_files:
          - InterviewScoringService.java

    root_cause_summary: |
      The reported bugs stem from 5 root causes: (1) Redis state expiry with stale DB
      rehydration, (2) non-idempotent answer submission, (3) non-idempotent scoring
      consumer with duplicate row insertion, (4) no token revocation mechanism, and
      (5) missing conditional property on InterviewScoringService causing double
      consumer registration. All 5 causes are independently fixable.

