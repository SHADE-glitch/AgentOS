name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Declared floor (pyproject `requires-python >=3.11`, README badge "3.11+") and the latest,
        # so the support range is covered at both ends (STANDARD.md §5).
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python3 -m pip install pytest

      - name: Run Python tests
        run: python3 -m pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run plugin tests
        run: node --test tests/js/plugin.test.mjs
