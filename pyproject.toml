[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aos"
version = "0.1.0"
description = "Agent OS — an external brain (routing, memory, learning, governance) for host coding agents"
readme = "README.md"
requires-python = ">=3.11"
# Engine is pure stdlib. No runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aos = "aos.cli.main:main"

[tool.setuptools.packages.find]
include = ["aos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
